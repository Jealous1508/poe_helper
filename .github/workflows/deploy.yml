# Builds the site and publishes it to GitHub Pages.
#
# Turn it on once: repository Settings -> Pages -> Source: "GitHub Actions".
# Nothing else to configure. Images are committed to the repo, so the build
# needs no network access beyond npm.
name: Deploy

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer push supersedes one already building, but never interrupts a
# deployment that has started.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `enablement` turns Pages on the first time this runs, so a fresh
      # clone of this repo deploys without anyone visiting Settings.
      - name: Work out the URL this will be served from
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # The same checks that run locally. A broken link or an unknown game
      # term fails here rather than reaching the site.
      - name: Check, test and build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run verify

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
