# Builds the site and publishes it to GitHub Pages.
#
# The live site is deployed by Cloudflare Pages instead, so this is kept as
# the alternative rather than the default. To use it, first turn Pages on:
# repository Settings -> Pages -> Source: "GitHub Actions". The workflow
# cannot do that for you — configure-pages can create a Pages site, but only
# with a token that has admin rights, and the token Actions hands a workflow
# does not. Asking it to try fails with "Resource not accessible by
# integration".
#
# Images are committed to the repo, so the build needs no network access
# beyond npm.
name: Deploy

# Manual only. The site is deployed by Cloudflare Pages, which builds on
# its own when master changes; leaving this on push would run the same
# build twice and fail every time unless Pages is enabled too. Run it from
# the Actions tab if you ever want GitHub Pages instead.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer push supersedes one already building, but never interrupts a
# deployment that has started.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Work out the URL this will be served from
        id: pages
        uses: actions/configure-pages@v6

      # The same checks that run locally. A broken link or an unknown game
      # term fails here rather than reaching the site.
      - name: Check, test and build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run verify

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
