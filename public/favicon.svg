<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="League guide">
  <!--
    A waypoint: a ring with a stone set in the middle. The site is a route
    through the campaign, and the waypoint is the thing a player actually
    looks for. Two shapes and one colour, because a favicon is read at
    16 pixels and anything finer turns to mud at that size.
  -->
  <rect width="64" height="64" rx="14" fill="#12131a" />
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#2a2c37" stroke-width="2" />
  <circle cx="32" cy="32" r="18" fill="none" stroke="#8372f5" stroke-width="5.5" />
  <!-- The stone is kept small on purpose: at 16 pixels a wider one closes
       the gap to the ring and the whole mark fills in as one blob. -->
  <rect x="32" y="22.8" width="13" height="13" rx="1.5" transform="rotate(45 32 22.8)" fill="#8372f5" />
</svg>
