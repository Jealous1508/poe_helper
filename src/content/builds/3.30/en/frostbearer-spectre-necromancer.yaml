name: Forged Frostbearer Spectre Necromancer
tagline: >-
  Fourteen spectres lob cold mortars at the same spot. The volleys fly
  parallel, so they land on top of each other and bosses fall over.
class: Witch
ascendancy: Necromancer
role: starter
budget: low
budgetNote: >-
  **Neither spectre guide publishes a starting budget. Treat the entry cost as
  untested.** The discrete crafting costs the guide does give are unlabelled
  and 3.29-era: 2 [[Divine Orb]] to lock prefixes on a wand, 2 Divine for the
  bench "up to three crafted modifiers", 200 Primal Crystallised Lifeforce
  plus 3 [[Crystallised Rancour]] for a guaranteed Raise Spectre modifier on
  boots, and 2 Divine to lock suffixes before a [[Veiled Chaos Orb]]. The
  author's own advice is that in a trade league, buying finished wands and
  shields is usually cheaper than crafting them. 3.30 reworked where currency
  drops, so Divine-denominated costs from the 3.29 revision are not reliable.
mainSkill: Raise Spectre
image: raise-spectre
hero: art-necromancer
tags: [Minion, Cold, Boss killer, Few buttons]
ratings: { clear: 3, bossing: 4, survivability: 4, ease: 3 }
verified: "2026-11-13"
confidence: mixed
confidenceNote: >-
  This is the **best-maintained guide** behind any build on this site: twenty
  or more changelog entries from October 2025 through 12 November 2026, with
  real content edits on 7 and 8 November that swapped actual items. It is
  genuinely 3.30, not a re-stamp. What is not settled: the guide **publishes
  no ratings at all** — our researcher confirmed that directly in the planner
  data, where the rating fields do not exist — so every number above is our
  researcher's estimate, rounded down from half points (clear 3.5, bossing
  4.5, survivability 4.5). Ease is the hardest to score: the endgame is close
  to one button and would be a 4, the campaign is a 2.5. There is also no
  3.30 ladder data for anyone, because the league started today.
modes:
  ssf: >-
    Poor to moderate, and worse than it looks. Forged Frostbearer cannot be
    shared solo, so you depend entirely on Verisium Ore Deposits.
    [[The Dark Monarch]] and [[Congregation Support]] — the two things that
    multiply your spectre count — **both drop from the same endgame boss**. The
    ritual corpse spectres are actually easier solo, since they cannot be
    traded anyway. A long project, not a league start.
  hardcore: >-
    The guide ships a dedicated hardcore Path of Building, and block plus
    physical reduction plus energy shield is a sound shell. The risk is the
    pivot: Chaos Inoculation comes late, and the hybrid stretch before it is
    the dangerous window. Single source.

idea: |
  You raise spectres and they do all the damage. The spectre you want is the **Forged Frostbearer**, which lobs a cold mortar.

  The trick is [[Greater Volley Support]]. It adds four projectiles fired from points to each side, and they travel **parallel** instead of fanning out. Because mortars are lobbed and land in an area, parallel volleys all come down on the same target. Fourteen spectres firing parallel volleys at one boss is an enormous amount of damage in a very small space.

  So the primary damage stat is **how many spectres you have**, which is why the gear list is what it is. You go from three early, to nine in the middle, to fourteen late.

  You survive on block, [[Bone Barrier]] and eventually pure energy shield. A wand that triggers [[Bone Offering]] for you is what makes the endgame close to a one-button build.

chain:
  - label: Raise
    text: "[[Raise Spectre]] in two separate links: a six-link of pure Frostbearers, and a smaller link of support spectres."
  - label: Volley
    text: "[[Greater Volley Support]] fires four extra projectiles in parallel, so the mortars converge instead of spreading."
  - label: Multiply
    text: "[[The Dark Monarch]] doubles your maximum spectres. [[Congregation Support]] adds 30–38% more on top."
  - label: Chill
    text: "[[Bonechill Support]] and Hypothermia turn the cold damage into a damage multiplier through chill."
  - label: Block
    text: "[[Mistress of Sacrifice]] applies [[Bone Offering]] to you as well, and a trigger wand casts it for you."

chainDetails:
  - title: Why the volleys shotgun
    body: |
      [[Greater Volley Support]] fires four additional projectiles from up to four points on each side, at 21–30% less projectile damage. The important part is that they travel **parallel**, not fanned.

      A mortar is lobbed and lands in an area. Five parallel mortars aimed at one enemy all land on or next to that enemy, so a single spectre's volley hits a boss several times. The Minion Offence mastery's 30% increased area of effect widens each landing zone, which increases the overlap.

      One practical warning the guide does not flag: **Greater Volley is a Dexterity gem.** It needs 63 Dexterity at gem level 1 and 111 at level 20. On a Witch that is real investment, and it catches people out.
  - title: Spectre count is the whole build
    body: |
      Every expensive item on the list exists to raise one number.

      - **[[The Dark Monarch]]**, the Raised Spectres variant, **doubles** your maximum spectres and forbids every other minion type.
      - **[[Congregation Support]]** gives 30–38% *more* maximum minions, scaling to 64% at gem level 15. Level 72, and it drops from Incarnation of Dread.
      - +1 spectre from an amulet modifier, +1 from [[Bitterbind Point]], +1 or +2 from elevated Elder Warlock boots.
      - The gem itself: one spectre at level 1, two at 13, three at 25.

      Three to five early, nine in the middle, fourteen late. The min-max tree runs twelve and trades count for quality.
  - title: Which spectres, and where they come from
    body: |
      - **Forged Frostbearer** — your damage. From **Verisium Ore Deposits and Outcrops in maps**, or shared in the Minion global chat, channel 666. It is a Crucible-league monster and does not spawn naturally.
      - **[[Carnage Chieftain]]** — frenzy charges. Act 2, The Old Fields, with [[Desecrate]]. Free.
      - **Perfect Forest Warrior** — Onslaught and culling. A ritual corpse item, not shareable.
      - **Perfect Guardian Turtle** — Determination and 5% flat physical reduction. Also a ritual corpse.
      - **Perfect Primal Thunderbird** for Grace, and **Primal Crushclaw** for increased cold damage taken. Both late.

      If you cannot find a Frostbearer, the levelling substitutes are Slave Drivers from Act 5's Control Blocks or Frost Auto-Scouts from Act 9, with [[Bitterdream]]. That is a genuinely weaker interim build and the guide says so.
  - title: The acquisition gate, stated plainly
    body: |
      **This is the biggest risk in the build.** Forged Frostbearer does not spawn naturally anywhere. You either get lucky on Verisium Ore Deposits in maps, or you ask for one in global 666 and someone summons it for you to desecrate.

      The guide lists "legion farming" — the grind for spectres and corpse items — as one of its three weaknesses. If you will not use trade chat, pick a different build.
  - title: The energy shield pivot
    body: |
      You start as a life and energy shield hybrid and end as pure energy shield. The switch is three keystones taken **together**: [[Chaos Inoculation]], [[Ghost Reaver]] and [[Zealot's Oath]].

      Together they convert [[Bone Barrier]]'s life leech into energy shield leech and your life regeneration into energy shield regeneration. Take one or two of the three and you have no recovery at all.

      One of your boots or gloves must be an energy shield and evasion hybrid base, so it can roll spell suppression.

mandatory:
  - term: Raise Spectre
    why: >-
      Run it in two separate links: a six-link holding only Frostbearers, and
      a four-link holding your support spectres.
    detail: >-
      It is an Act 3 quest reward from Sever the Right Hand, available to the
      Witch, and requires character level 28. The guide puts the Carnage
      Chieftain capture in its Act 2 section, which reads as though you have
      the gem earlier. You do not. Reach Act 3, take the gem, then **backtrack
      to The Old Fields in Act 2**.
  - term: Greater Volley Support
    why: >-
      Four extra parallel projectiles. This is what makes the mortars overlap,
      and it is the reason the build kills bosses.
    detail: >-
      A Dexterity gem: 63 Dexterity at level 1, 111 at level 20. Plan the
      attribute investment on a Witch.
  - term: The Dark Monarch
    why: >-
      Doubles your maximum spectres. The single most important item.
    detail: >-
      **Database trap:** the item has a variant per minion type, and the
      default page you will find shows the Animated Weapons version. **Buy the
      Raised Spectres variant.** Base Lich's Circlet, level 84, 224
      Intelligence, drops from Incarnation of Dread — so the core item arrives
      late.
  - term: Congregation Support
    why: >-
      30–38% more maximum minions, up to 64% at gem level 15. The second
      spectre-count multiplier.
    detail: >-
      Level 72, and it drops from Incarnation of Dread — the same boss as
      [[The Dark Monarch]]. Two multipliers behind one boss is the build's
      main gate.
  - term: Bitterbind Point
    why: >-
      +1 spectre, called mandatory by the guide. Your shield for the whole
      build, which is also why you can never use a staff.
  - term: Bone Offering
    why: >-
      Block chance for your minions, and for you through
      [[Mistress of Sacrifice]]. Cast by a trigger wand, not by hand.
    detail: >-
      The wand modifier is "Trigger a Socketed Spell on Using a Skill". It
      holds Bone Offering and a level 1 [[Desecrate]]. The craft is unlocked
      by finding the hidden drain in The Refinery in Act 9, which is easy to
      miss and worth a detour.
  - term: Mistress of Sacrifice
    why: >-
      Applies offerings to you as well as your minions. This is what turns the
      trigger wand into both your attack and your spell block.
  - term: Bone Barrier
    why: >-
      Life recovery as your minions deal damage, physical reduction, and
      minion survivability. After the keystone pivot it becomes your entire
      energy shield sustain.
  - term: Mindless Aggression
    why: >-
      Minion life and damage. This is the lab where your spectres stop dying.
  - term: Commander of Darkness
    why: >-
      Aura effect, which is the cheapest way to cap resistances during the
      campaign. Later replaced by the Catarina bloodline node Umbral Army.
    detail: >-
      The two spectre guides disagree about Umbral Army — one calls it a
      bloodline node, the other an ascendancy notable granting 140% increased
      global defences. We could not determine which is correct. Unverified.
  - term: Chaos Inoculation
    why: >-
      One of three keystones taken together for the late pure-energy-shield
      version. Alone it just sets your life to 1.
  - term: Ghost Reaver
    why: >-
      Converts leech to energy shield. Required by the pivot.
  - term: Zealot's Oath
    why: >-
      Converts life regeneration to energy shield regeneration. Required by
      the pivot.
  - term: Death Attunement
    level: recommended
    why: >-
      +1 spectre and more minion damage. The usual anoint target before you
      switch to [[Whispers of Doom]].
  - term: Fortress Covenant
    level: recommended
    why: >-
      A large minion damage multiplier in exchange for taking more damage.
      Mid-game, once your defences can pay for it.
  - term: Bitterdream
    level: recommended
    why: >-
      Levelling only. It grants Spell Echo to socketed gems, which is what
      makes the interim spectres usable before you find a Frostbearer.
  - term: Twilight Regalia
    level: recommended
    why: >-
      The endgame body armour. Needs 293 Intelligence and item level 86 for
      top-tier energy shield.
  - term: Darkness Enthroned
    level: recommended
    why: >-
      With a Leech modifier, called mandatory by the guide for the late game.
  - term: Animate Guardian
    level: recommended
    why: >-
      A carried minion holding Leer Cast, Zahndethus' Cassock, Dying Breath,
      Windscream and elemental weakness gloves.
    detail: >-
      Get its combined gem level to 15 or more before you take it into maps,
      or it will die and you will lose every item on it.
  - term: The Dark Seer
    level: recommended
    why: >-
      A +2 minion gem weapon for your swap. Switch to it out of combat so
      your spectres do not de-level and die when you change gear.

labs:
  - lab: Normal
    node: Commander of Darkness
    why: "Aura effect, which fixes your campaign resistances more cheaply than gear can."
  - lab: Cruel
    node: Mindless Aggression
    why: "Minion life and damage. Your spectres stop dying to map bosses."
  - lab: Merciless
    node: Mistress of Sacrifice
    why: "Bone Offering applies to you. Your block chance roughly arrives all at once."
  - lab: Uber
    node: Bone Barrier
    why: >-
      Recovery, physical reduction and minion survivability, and later the
      whole of your energy shield sustain. Note that both spectre guides give
      the sequence without naming the labs; since each notable costs two
      points and each lab grants two, the mapping is one-to-one, but it is
      our inference.

stages:
  - id: acts-1-3
    image: desecrate
    title: Acts 1–3
    levels: Level 1–31
    uses: >-
      [[Rolling Magma]] or [[Freezing Pulse]] to level 4, then
      [[Summon Raging Spirit]], then **[[Absolution]] after Merveil**.
      Absolution carries the entire campaign; you are not a spectre build
      yet.
    changes: >-
      Buy [[Holy Flame Totem]] and [[Flame Wall]] from Nessa in Act 1. Use
      [[Flesh Offering]] on corpses in Act 2. In Act 3, Lost in Love gives
      you [[Conductivity]] for rares and bosses.
    links:
      - name: Level 1–4
        gems: [Rolling Magma, Freezing Pulse]
      - name: Act 1
        gems: [Summon Raging Spirit, Holy Flame Totem, Flame Wall]
      - name: From Merveil
        gems: [Absolution, Elemental Army Support, Minion Damage Support]
      - name: Utility
        gems: [Flesh Offering, Desecrate, Frostblink, Shield Charge]
      - name: Act 3
        gems: [Conductivity, Convocation]
    moveOn: "you have Raise Spectre, a Carnage Chieftain, and Siosa's shop has been emptied."
    details:
      - title: The Raise Spectre timing, corrected
        body: |
          The guide places the Carnage Chieftain capture in its Act 2 section, with the words "once you have Raise Spectre, return to The Old Fields."

          Read linearly that is confusing, because you cannot have the gem in Act 2. [[Raise Spectre]] is an **Act 3** quest reward and needs character level 28.

          So: reach Act 3, take the gem, walk back to The Old Fields in Act 2, [[Desecrate]], and raise a [[Carnage Chieftain]] for the frenzy charges. It is worth the trip.
      - title: Things not to worry about
        body: |
          [[Raise Zombie]] minions die constantly before level 21. Do not keep resummoning them — just let the gem level.

          [[Holy Flame Totem]] drops out of the build mid-way through Act 2. A corruption altar in The Vaal Ruins can roll Vaal Absolution, which is a free upgrade if it hits.
      - title: Siosa unlocks most of your gem set
        body: |
          Do A Fixture of Fate in The Library and buy from Siosa around level 31. He sells gems regardless of class, which matters for a Witch.

          [[Convocation]] is on purchase page seven, which people miss because they stop scrolling.
  - id: acts-4-10
    image: purity-of-elements
    title: Acts 4–10
    levels: Level 31–68
    uses: >-
      Still [[Absolution]]. [[Summon Stone Golem]] from Act 4 for the life
      regeneration buff. Around level 46 the aura block turns on.
    changes: >-
      Once Sovereignty and the 12% reservation mastery are allocated, run
      [[Purity of Elements]], [[Herald of Purity]], [[Vitality]] and
      [[Clarity]]. **Keep Vitality and Clarity at a low gem level** — you need
      the mana for Absolution.
    links:
      - name: Main skill
        gems: [Absolution, Elemental Army Support, Minion Damage Support, Feeding Frenzy Support]
      - name: Auras from level 46
        gems: [Purity of Elements, Herald of Purity, Vitality, Clarity]
      - name: Minions and utility
        gems: [Summon Stone Golem, Convocation, Desecrate, Flesh Offering]
      - name: Movement and guard
        gems: [Shield Charge, Momentum Support, Steelskin, Arcane Surge Support]
    moveOn: "you have finished Act 10 and you have five spare Raise Spectre gems levelling in your weapon swap."
    details:
      - title: Campaign-to-maps preparation
        body: |
          Buy **five spare [[Raise Spectre]] gems and one [[Animate Guardian]]**, and level them in your weapon swap. Use a [[Vaal Orb]] on them at level 20 for a chance at 21.

          Gem levels to deliberately hold down: [[Desecrate]] at 1, [[Stormblast Mine]] at 1, [[Flame Dash]] at 10 to 13.

          This is the single most valuable half hour of preparation in the build. Spectres are expensive to re-level if you lose them.
      - title: Bandits and anoints
        body: |
          **Kill all three bandits** for the passive point.

          Anoints in order: Testudo while it is cheap, then [[Death Attunement]], then [[Whispers of Doom]] once you are on Chaos Inoculation.
  - id: early-maps
    image: raise-spectre
    title: Early maps
    levels: White and yellow maps
    uses: >-
      Your first Frostbearers, in a six-link if you have one. Until you find
      one, [[Bitterdream]] with Slave Drivers or Frost Auto-Scouts is the
      honest interim build.
    changes: >-
      Support spectres go in a separate four-link with
      [[Elemental Army Support]], [[Feeding Frenzy Support]] and
      [[Bonechill Support]]. The trigger wand goes on. Add
      [[Stormblast Mine]] at level 1 with [[Minefield Support]] for tanky
      rares.
    links:
      - name: Frostbearers (six-link)
        gems: [Raise Spectre, Greater Volley Support, Spell Echo Support, Hypothermia Support, Cold Penetration Support, Minion Damage Support]
      - name: Support spectres (four-link)
        gems: [Raise Spectre, Elemental Army Support, Feeding Frenzy Support, Bonechill Support]
      - name: Trigger wand
        gems: [Bone Offering, Desecrate]
      - name: Bosses only
        gems: [Stormblast Mine, Minefield Support]
      - name: Movement and guard
        gems: [Shield Charge, Momentum Support, Steelskin, Arcane Surge Support]
    moveOn: "you have Frostbearers in a six-link and a wand that casts Bone Offering for you."
    details:
      - title: Finding a Frostbearer
        body: |
          Two routes. **Verisium Ore Deposits and Outcrops in maps**, which is luck — 3.30 increased their base ore by 50%, which helps a little. Or **global chat 666**, where minion players summon spectres for each other to desecrate.

          Until then you are playing the interim build with [[Bitterdream]], which grants Spell Echo to socketed gems. It works. It is noticeably weaker, and the guide says so rather than pretending otherwise.
      - title: Keeping the spectres alive
        body: |
          [[Bone Barrier]], [[Mindless Aggression]], the Minion Defence mastery, [[Meat Shield Support]] early, and [[Elemental Army Support]] on the support link.

          And the habit that saves you the most grief: **swap to a +2 minion gem weapon out of combat**, [[The Dark Seer]] or Maata's Teaching, so your spectres do not de-level and die when you change gear.
      - title: Why the hideout is unbearable
        body: |
          The guide lists this as a weakness, and a second source agrees: fourteen mortar-casting spectres are **extremely noisy**.

          It sounds like a joke until you have spent an hour in your hideout. If you are sensitive to game audio, this is a real reason to pick something else.
  - id: red-maps
    image: convocation
    title: Red maps
    levels: Tier 11–16 maps
    uses: >-
      Nine or more spectres, [[Fortress Covenant]] on the tree, and a
      [[Watcher's Eye]] with the Determination physical reduction modifier.
    changes: >-
      [[Congregation Support]] replaces [[Meat Shield Support]].
      [[Greater Spell Echo Support]] replaces [[Spell Echo Support]]. For
      mapping, [[Annihilation Support]] goes in place of
      [[Cold Penetration Support]].
    links:
      - name: Frostbearers (six-link)
        gems: [Raise Spectre, Greater Volley Support, Greater Spell Echo Support, Hypothermia Support, Cold Penetration Support, Congregation Support]
      - name: Mapping variant
        gems: [Raise Spectre, Greater Volley Support, Greater Spell Echo Support, Hypothermia Support, Annihilation Support, Congregation Support]
      - name: Support spectres
        gems: [Raise Spectre, Elemental Army Support, Feeding Frenzy Support, Bonechill Support]
      - name: Trigger wand
        gems: [Bone Offering, Desecrate]
      - name: Auras
        gems: [Summon Skitterbots, Purity of Elements, Clarity]
    moveOn: "you have Chaos Inoculation, Ghost Reaver and Zealot's Oath, all three, and a Twilight Regalia."
    details:
      - title: Do the keystone pivot in one session
        body: |
          [[Chaos Inoculation]], [[Ghost Reaver]] and [[Zealot's Oath]] are a set. Respec into all three at once, with [[Twilight Regalia]] already in your inventory.

          Doing it piecemeal leaves you with no recovery mechanism for however long the gap lasts, which on a hybrid character in red maps is how you die.

          One of your boots or gloves needs to be an energy shield and evasion hybrid base so it can roll spell suppression. Buy that before the respec too.
      - title: Attribute requirements will bite you
        body: |
          [[The Dark Monarch]] needs 224 Intelligence. [[Twilight Regalia]] needs 293. [[Greater Volley Support]] needs 111 Dexterity at gem level 20.

          That is three separate attribute problems on a Witch, and they arrive at roughly the same time. Plan jewellery and tree nodes for it rather than being surprised.
      - title: Where the remaining damage comes from
        body: |
          [[Summon Skitterbots]] replaces Herald of Purity and Vitality. Cooldown Recovery goes on [[Steelskin]] and [[Convocation]]. [[Arcane Surge Support]] moves onto [[Flame Dash]] with [[Frostbite]].

          Then clusters, tattoos, and the swap from [[Commander of Darkness]] to Umbral Army.
  - id: endgame
    image: watchers-eye
    title: Endgame
    levels: Pinnacle bosses and juiced mapping
    uses: >-
      Fourteen Frostbearers plus Perfect Forest Warrior, [[Carnage Chieftain]],
      Perfect Guardian Turtle, Perfect Primal Thunderbird and Primal
      Crushclaw. A large minion damage cluster, [[Watcher's Eye]], and
      elevated Elder Warlock boots.
    changes: >-
      Nothing about the playstyle changes from red maps. You are buying
      spectre count and quality.
    moveOn: "there is no next stage. Mageblood is the only min-max purchase left."
    details:
      - title: Upgrade order
        body: |
          [[The Dark Monarch]] in the Raised Spectres variant, then [[Congregation Support]], then the +1 spectre amulet and [[Bitterbind Point]], then the keystone pivot with [[Twilight Regalia]], then elevated Elder Warlock boots, then clusters and [[Watcher's Eye]], then [[Mageblood]].

          The first two are the big ones, and both drop from the same boss.
      - title: What the build is not
        body: |
          Neither guide calls this beginner-friendly, and it never claims to be. The campaign juggles Absolution, offerings, desecrate targeting and a backtrack. Fourteen minions need re-aggroing and [[Convocation]] presses.

          It is not a zoom build and it is not strong in week one. What it is, from level 85 or so, is a very tanky near-one-button character that kills bosses.
      - title: "\"Spectre Bank\" is not a thing"
        body: |
          A different spectre guide refers to a "Spectre Bank" as a 3.30 feature. Our researcher searched the patch notes: there is **no Spectre Bank, no spectre persistence change and no Raise Spectre quality-of-life change** in 3.30.

          The closest real mechanic is from 3.17: your most recent spectre monster types are saved to the character and can be desecrated. Treat the term as unverified.

powerCurve: |
  Damage here is a product of three things: **how many Frostbearers you have**, how many mortars each one lands on the target, and how much extra a chilled target takes. [[Greater Volley Support]] settles the second from your first six-link, and [[Bonechill Support]] with Hypothermia settles the third cheaply. The first is the one that costs levels and currency, so the build gets stronger in steps, and each step is a spectre-count item.

  Early, you have none of it. The campaign is [[Absolution]], and the first Frostbearers only arrive in white and yellow maps, three to five of them. In red maps the article has nine or more, with [[Congregation Support]] in the six-link and [[Fortress Covenant]] on the tree. Fourteen is the end figure, and it needs [[The Dark Monarch]], which doubles the maximum but cannot be worn before level 84 — and both of those drop from one endgame boss. That is why the build is not strong in week one and then, from level 85 or so, feels finished.

  Defence arrives the same way, in lumps. Block comes nearly all at once with [[Mistress of Sacrifice]] in the Merciless lab, recovery and physical reduction with [[Bone Barrier]] in the Uber lab, and the last layer is the one-session swap to [[Chaos Inoculation]], [[Ghost Reaver]] and [[Zealot's Oath]]. The hybrid stretch just before that swap is where the character is weakest for the content it is in; the hardcore note above calls it the dangerous window.

upgrades:
  - step: >-
      Frostbearers in a six-link, and a wand that triggers [[Bone Offering]]
    why: >-
      Until both exist you are playing the interim build. The six-link holds
      [[Greater Volley Support]], which is what makes the mortars overlap, and
      the wand is your block. Everything below multiplies these two. This step
      is the article's early-maps goal, placed here by us; the guide's own
      upgrade list starts at the next one.
    cost: >-
      Crafting the wand: 2 [[Divine Orb]] to lock prefixes and 2 more for the
      three-modifier bench craft. The guide's figures, unlabelled and 3.29-era;
      its author says a finished wand is usually cheaper to buy.
  - step: >-
      [[The Dark Monarch]], Raised Spectres variant
    why: >-
      It doubles the maximum. Nothing else on the list is a doubling, which is
      why the guide's order starts here. It needs level 84 and 224
      Intelligence, so solve the attribute before you buy it, and check the
      variant twice.
  - step: >-
      [[Congregation Support]]
    why: >-
      30–38% more maximum minions, rising to 64% at gem level 15. The second
      multiplier, and smaller than a doubling, so it sits second. It takes the
      socket [[Meat Shield Support]] was holding.
  - step: >-
      The +1 spectre amulet modifier, and [[Bitterbind Point]]
    why: >-
      One spectre each. A flat +1 is worth less than either multiplier, which
      is our reading of why the guide lists these third. The guide also calls
      the shield mandatory for the whole build, so you may well be holding it
      long before this point.
  - step: >-
      The keystone pivot, with [[Twilight Regalia]]
    why: >-
      The first step that buys no damage. Our reading of its position: by now
      the spectres kill what you point them at, and the hybrid character is
      the weak part. Buy the chest (293 Intelligence) and the spell
      suppression boots or gloves first, then take [[Chaos Inoculation]],
      [[Ghost Reaver]] and [[Zealot's Oath]] in one respec.
  - step: >-
      Elevated Elder Warlock boots
    why: >-
      +1 or +2 spectres. The same kind of gain as the amulet, on a harder
      item, so it comes after the cheap +1s and after you can survive.
    cost: >-
      A guaranteed Raise Spectre modifier on boots: 200 Primal Crystallised
      Lifeforce plus 3 [[Crystallised Rancour]]. The guide's figure,
      unlabelled and 3.29-era.
  - step: >-
      A large minion damage cluster and [[Watcher's Eye]]
    why: >-
      Quality, not count. The article says the endgame is buying spectre count
      and quality; by this step the count is nearly spent, so what is left is
      making each spectre hit harder and you take less.
  - step: >-
      [[Mageblood]]
    why: >-
      The article calls it the only min-max purchase left. Nothing in the
      build depends on it.

play:
  mapping: |
    Move with [[Shield Charge]]. Using any skill fires the wand, which casts [[Desecrate]] and [[Bone Offering]] for you, so moving is also what keeps your block up. That is the whole of the "one button". That the offering lapses when you stop using skills is our reading of the trigger modifier, not a line from the guide.

    The spectres do the killing. Press [[Convocation]] when they are left behind or shooting at the wrong pack; the article is plain that fourteen minions need re-aggroing. [[Steelskin]] is the guard for when something gets through, and [[Flame Dash]] crosses gaps.

    Run the mapping link: [[Annihilation Support]] in the socket that holds [[Cold Penetration Support]] against bosses.
  bossing: |
    Before the fight, put [[Cold Penetration Support]] back in place of [[Annihilation Support]]. Do any weapon swap now, out of combat, never during.

    Open with [[Convocation]] so every spectre starts on the boss, then throw [[Stormblast Mine]] with [[Minefield Support]]. The guide keeps that gem at level 1 and lists the link for bosses and tanky rares only.

    After that your job is to stay alive and keep using a skill, so the wand keeps Bone Offering on you. The damage is at its best while the boss stands still, because that is when the parallel volleys all land on it. When it moves, pull the spectres back onto it with Convocation instead of waiting for them to find it — that habit is ours; the guide only says the minions need Convocation presses.

deaths:
  - situation: >-
      Red maps, part-way through the switch to energy shield
    cause: >-
      [[Chaos Inoculation]], [[Ghost Reaver]] and [[Zealot's Oath]] only work
      as a set. With one or two of the three, [[Bone Barrier]]'s leech and
      your regeneration are pointing at a pool you no longer use, and you have
      no recovery at all.
    fix: >-
      Do it in one session: [[Twilight Regalia]] and the spell suppression
      boots or gloves already bought, then all three keystones in one respec.
      Do not map in between.
  - situation: >-
      Right after taking [[Fortress Covenant]]
    cause: >-
      It is a large minion damage multiplier that makes you take more damage.
      The article places it mid-game, "once your defences can pay for it".
    fix: >-
      If the deaths started with the keystone, take it off until
      [[Mistress of Sacrifice]] and [[Bone Barrier]] are both allocated and
      your resistances are capped. Where exactly that line sits is our
      judgement; the guide gives no threshold.
  - situation: >-
      Standing still, pressing nothing, and getting hit
    cause: >-
      Your block is [[Bone Offering]] applied to you, and the wand only casts
      it when you use a skill. Our reading, from the trigger modifier: stop
      using skills for long enough and the offering runs out.
    fix: >-
      Keep [[Shield Charge]] or any other skill going, even when the spectres
      need no help. Check the wand actually holds Bone Offering and a level 1
      [[Desecrate]].
  - situation: >-
      After the pivot, with the spectres nowhere near a target
    cause: >-
      [[Bone Barrier]] recovers as your minions deal damage, and after the
      pivot the article calls it your entire energy shield sustain. It
      follows, though nobody states it, that spectres left a screen behind
      mean no leech.
    fix: >-
      [[Convocation]] before you engage, not after. Do not outrun fourteen
      minions.

troubleshooting:
  - symptom: >-
      Bosses take far longer than the maps suggested
    cause: >-
      You are probably still in the mapping link, with
      [[Annihilation Support]] where [[Cold Penetration Support]] belongs. Or
      the spectres are spread out and not all firing at the boss.
    fix: >-
      Swap the gem back before the fight, and press [[Convocation]] at the
      start of it.
  - symptom: >-
      The spectres die when I change weapons
    cause: >-
      Swapping away from a +2 minion gem weapon de-levels the gem, and the
      spectres die with it.
    fix: >-
      Swap only out of combat, to [[The Dark Seer]] or Maata's Teaching. Keep
      the five spare [[Raise Spectre]] gems levelling so a loss costs minutes,
      not an evening.
  - symptom: >-
      The helmet, the chest or the volley gem will not equip
    cause: >-
      Three attribute walls arrive together: 224 Intelligence for
      [[The Dark Monarch]], 293 for [[Twilight Regalia]], and 111 Dexterity
      for a level 20 [[Greater Volley Support]].
    fix: >-
      Plan jewellery and tree nodes for all three before you buy any of them.
      Greater Volley still works at a lower gem level, where it asks for less
      Dexterity.
  - symptom: >-
      The helmet is on and the spectre count has not changed
    cause: >-
      Wrong variant. [[The Dark Monarch]] has one per minion type, and the
      default database page shows the Animated Weapons one.
    fix: >-
      Buy the Raised Spectres variant. Read the item's own text before you
      pay.
  - symptom: >-
      Other minions vanish when the helmet goes on
    cause: >-
      The Raised Spectres variant forbids every other minion type. The
      article states that, and it also still lists [[Animate Guardian]] and
      [[Summon Skitterbots]] for the late game without reconciling the two.
      We could not reconcile them either.
    fix: >-
      Until someone shows otherwise, assume the helmet wins. Our advice, not
      the guide's: take anything valuable off the guardian before the helmet
      goes on.
  - symptom: >-
      I cannot find a Forged Frostbearer
    cause: >-
      It does not spawn naturally. It comes from Verisium Ore Deposits and
      Outcrops in maps, which is luck.
    fix: >-
      Ask in global chat 666, where minion players summon spectres for each
      other to [[Desecrate]]. Until then, play the [[Bitterdream]] interim
      setup and accept that it is weaker.

patch:
  - note: >-
      **The Necromancer ascendancy and [[Raise Spectre]] were not changed.**
      Nothing in the normal game's notes touches the core of this build.
  - entry: support-gem-changes
    note: >-
      **Does not apply here, despite how it looks.** Transfusion and Vaal
      Sacrifice were both reworked, and both are genuine nerfs to minion
      builds that used them. This build uses neither — our researcher checked
      the guide text and the planner's full skill list. If you read that
      "minion builds were nerfed", this is the change being referred to, and
      it misses this one.
  - entry: golem-buff-nerfs
    note: >-
      **A trivial levelling nerf, and the only change that touches the
      build.** [[Summon Stone Golem]] now grants 16% increased defences
      instead of 20%. You use it from Act 4 for the regeneration.
  - entry: femurs-of-the-saints
    note: >-
      **Real, but it does not help you.** The staff genuinely got a large
      minion buff, including increased minion damage per raised spectre. But
      **Femurs is a staff**, and this build runs a trigger wand with
      [[Bitterbind Point]]. You cannot use it. Bone Helmet's buff only helps
      as a budget placeholder before [[The Dark Monarch]]. When a tier list
      says this build was "buffed through minion items" and names no item,
      this is why to be careful.
  - entry: league-fates
    note: >-
      **Well aligned.** The league mechanic is boss-centred, and parallel
      volleys landing on a stationary target is this build's best case. A
      high-single-target minion build is unusually well placed for 3.30.
  - entry: loot-rarity-rework
    note: >-
      **Positive, and it changes your costs.** Currency now concentrates in
      rare and unique monsters, which suits a bossing build. It also means
      Divine-denominated crafting costs from the guide's 3.29 revision are
      not reliable.
  - entry: ritual-changes
    note: >-
      **Two small effects.** The Blood Shrine of Crows now gives much more
      chaos resistance, which is useful in the hybrid stretch before Chaos
      Inoculation. And two of your support spectres are ritual corpse items,
      so Ritual access matters: plan for four or eight Ritual Threads per
      map.

strengths:
  - "Very tanky: block, Bone Barrier, physical reduction, spell suppression and finally pure energy shield."
  - "Uber-boss viable, because parallel volleys overlap on a stationary target."
  - "Close to one button in the endgame, thanks to the trigger wand."
  - "A genuine all-rounder once it is finished."
  - "The best-maintained guide of any build on this site."
  - "Boss-centred 3.30 rewards exactly what this build is good at."
weaknesses:
  - "The Forged Frostbearer is not a natural spawn. Finding one is the real gate."
  - "Both spectre-count multipliers drop from the same endgame boss."
  - "Extremely noisy in the hideout. This is a listed weakness, not a joke."
  - "The core helmet needs level 84 and 224 Intelligence, so it arrives late."
  - "Greater Volley is a Dexterity gem on a Witch."
  - "The campaign is a different, busier build with several manual steps."
avoidIf: >-
  Do not pick this if you want to be strong in week one, or if you refuse to
  interact with trade chat — that is how most people get their first
  Frostbearer. Do not pick it if you dislike a loud client, or if you want a
  build that is finished at level 70. It is a project, and it is good at the
  end of the project.

