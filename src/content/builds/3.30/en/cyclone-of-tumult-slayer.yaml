name: Cyclone of Tumult Slayer
tagline: >-
  One-button spinning melee that blocks nearly nine hits in ten, and blocks
  them luckily. The best-sourced build on this site and the hardest to kill.
class: Duelist
ascendancy: Slayer
role: endgame
budget: high
budgetNote: >-
  **No 3.30 source prices this build at any tier, and we would rather say so
  than pad it.** There is no 50 Divine figure, no 300 Divine figure and no
  mirror figure anywhere. Two individual 3.30-dated prices do exist:
  [[Lethal Pride]] at 1–3 Divine, and [[The Light of Meaning]] at "a couple
  Divine". The structure of the expensive tier is known — [[Mageblood]], the
  [[Forbidden Flesh]] and [[Forbidden Flame]] pair, [[Watcher's Eye]],
  [[Stranglegasp]] — but nobody has put a number on it. Ignore the
  "over 100 Divine" figure circulating for this archetype: it is attached to a
  Static Strike Slayer, from a guide that admits it is from 3.22.
mainSkill: Cyclone of Tumult
image: cyclone-of-tumult
hero: art-slayer
tags: [Melee, Physical, Block, One button, Tank]
ratings: { clear: 4, bossing: 4, survivability: 5, ease: 4 }
verified: "2026-11-13"
confidence: mixed
confidenceNote: >-
  The mechanics are the best-attested of the four: four independent authors
  across three sites agree on the chassis, and two of them publish separate
  bossing variants. **But the four ratings above are still our reading, not a
  source's** — no author publishes clear, bossing, survivability and ease
  scores. The closest thing is one author's five different axes (Ease of
  Transitioning 3, New Player Friendliness 4, Playstyle 5, Ease of Gearing 3,
  Easily Executable 4), which are not these axes. Clear is a 4 rather than 5
  because every source says it maps well but slowly until Mageblood. Bossing
  is a 4 because its bossing is good through tankiness and sustain, not burst.
  Every number quoted below was computed on a 3.29 Path of Building.
modes:
  ssf: >-
    One author calls it solo-self-found viable, and the chassis supports it:
    the staff is crafted rather than bought, and the early block enabler is
    [[Rumi's Concoction]]. The expensive half — the Forbidden pair,
    [[Mageblood]], [[Stranglegasp]] — is trade-only in practice.
  hardcore: >-
    The same author calls it hardcore viable, and of the four builds here it
    is the only one with a case. 87.75% lucky block, permanent leech,
    ailment immunity and stun immunity is the right shape. No source has
    tested it in 3.30.

idea: |
  You hold down one button and spin. [[Cyclone of Tumult]] is a transfigured version of Cyclone with a much bigger area and a higher damage ceiling, paid for with a severe movement-speed penalty while you are at full stages.

  The reason to play it is the defence. You wield a warstaff — chosen for its 25% block implicit, not for its damage — and stack block from six or seven other places until your attack block is far past the cap. [[Versatile Combatant]] then converts everything you overcapped past 65% into **double** that much spell block. So you buy attack block and get spell block free.

  The last piece is [[More Than Skill]], a Gladiator notable a Slayer can steal with a [[Forbidden Flesh]] and [[Forbidden Flame]] pair. It makes your block **lucky**, meaning the game rolls twice and keeps the better result. The published figure is 87.75% to block both attacks and spells.

chain:
  - label: Spin
    text: "[[Cyclone of Tumult]] channels pure physical melee damage in a large circle around you. One button, 360 degrees."
  - label: Multiply
    text: "No single big lever. [[Pride]], [[Blood and Sand]] plus [[Flesh and Stone]], [[Herald of Purity]], [[Brutality Support]], [[Melee Physical Damage Support]], [[Pulverise Support]], [[Infused Channelling Support]] and [[Void Shockwave Support]], stacked."
  - label: Overcap block
    text: "Warstaff implicit 25%, [[Serpent Stance]] 5%, [[Enigmatic Defence]] 8%, body armour 9%, [[Whirling Barrier]] 8%, [[Steelwood Stance]] 10%, then tattoos to top it off."
  - label: Convert and luck it
    text: "[[Versatile Combatant]] turns attack block past 65% into double that much spell block. [[More Than Skill]] makes both lucky. Result: 87.75% each."
  - label: Leech through it
    text: "[[Brutal Fervour]] keeps leech running continuously while you spin, so chip damage never accumulates. Plus 30,000 armour, 6 endurance charges and permanent [[Fortification]]."

chainDetails:
  - title: Why the staff is a defensive item
    body: |
      This is the thing to understand before you craft anything. The warstaff is picked for its **25% block implicit**. Its damage is secondary. Crafted Ezomyte, Maelstrom or [[Judgement Staff]] bases all work, and both authors who detail it craft rather than buy.

      Everything else about the defence follows from having that implicit. Without it you are 25 percentage points short of a block total that only works because it is far past the cap.
  - title: How 87.75% lucky block is built
    body: |
      [[Versatile Combatant]] is the Slayer notable that does the conversion: attack block overcapped past 65% becomes **double** that amount of spell block. So the plan is to stack attack block absurdly high and let spell block arrive for free.

      The named sources: the warstaff implicit at 25%, [[Serpent Stance]] 5%, [[Enigmatic Defence]] 8%, 9% on the body armour, [[Whirling Barrier]] 8%, [[Steelwood Stance]] 10%, and Tattoos of the Valako Shieldbearer to finish.

      Then [[More Than Skill]] makes block lucky — two rolls, better result kept. One author puts the final figure at **87.75% attack and spell block**; another says "near 90%". Both agree on the mechanism. The author who publishes the number also says plainly that the Forbidden pair is **not strictly required**, just "really comfy", and names [[Master of Metal]] or [[Worthy Foe]] as the cheaper substitutes.
  - title: Zero mana cost is a requirement, not an optimisation
    body: |
      Channelling [[Cyclone of Tumult]] with any mana cost at all does not work. The fix is a **-20 mana cost modifier crafted on the chest** plus -3 on a ring.

      This is why the build has a whole minus-mana-cost infrastructure that looks strange from the outside, and it is a current-era requirement created by recent mana-cost changes rather than something inherited from older Cyclone guides. If your Cyclone stutters, this is the first thing to check. Only one of the four authors states it explicitly, but he is unambiguous.
  - title: General's Cry, Desecrate, and when to drop both
    body: |
      For boss fights the published setups run [[General's Cry]], which needs corpses to make mirage warriors from. An empty boss arena has none, so a **level 1 [[Desecrate]]** goes on your bar purely to make them.

      At the very top end one author **drops [[General's Cry]] entirely** and funnels everything into Cyclone. Both approaches are published by the same people; the difference is how much damage the staff and the tree are already producing.
  - title: The numbers, and why one of them is not what it looks like
    body: |
      The level 100 min-max variant reports **177 million damage per second** and a **713,000 effective health pool**, with 4,892 life, 30,159 armour, 87.75% block, resistances 76/75/75/75, 352% movement speed, and 6 endurance, 4 frenzy and 3 power charges.

      **Read the 177 million carefully.** The page labels it "Skill DPS *Estimation*" and the health pool "*Simulated* Effective Health Pool" — these are the site's own auto-derived figures from an imported Path of Building, not an author-stated configuration. **The page does not state a boss target**: no Uber Sirus, no Maven, no Uber Elder, no boss resistances, no shock, no Wither, no disclosure of whether flasks are up. The page also carries its own author's work-in-progress banner. Treat 177 million as an unconfigured display number.

      The same author's other variant, pinned at level 96, is the useful one for planning: 4,809 life, 22,254 armour, **57% block**, 130,000 effective hit points, maximum hits taken 22,000 physical and 51,000–57,000 elemental. His stats panel would not switch to the bossing variant, and his damage readout rendered against the wrong gem, so **there is no damage figure for the bossing variant.** Two of the four authors publish no damage or effective hit point figures at all.

      All of it is 3.29 Path of Building output. Path of Building has not been updated for 3.30.
  - title: One tier-list contradiction to ignore
    body: |
      A circulating tier list rates "Cyclone of Tumult" S tier with "smooth, easy bossing" and, on the same page, rates "Cyclone Shockwave" B tier with "not an amazing boss killer".

      These are substantially the same build. One of the four guides is literally titled Cyclone Shockwave Slayer and is a Cyclone of Tumult build. The split is a labelling artefact, not two different builds with different verdicts.

mandatory:
  - term: Cyclone of Tumult
    why: >-
      The transfigured gem, not plain Cyclone. Bigger area and a higher
      ceiling, bought with a severe movement-speed penalty at full stages.
    detail: >-
      That movement penalty is the single most-cited complaint about the
      build. It is fixed by [[The Stampede]] early and by [[Mageblood]] plus
      a Quicksilver flask later, which is why "slow until Mageblood" appears
      in every source's weakness list.
  - term: Judgement Staff
    why: >-
      Or an Ezomyte or Maelstrom base. You are buying the 25% block implicit.
      Lose the staff and the entire defensive plan collapses.
    detail: >-
      Both authors who detail the weapon craft it rather than buy it. The
      damage modifiers matter, but the implicit is what the build is designed
      around.
  - term: Versatile Combatant
    why: >-
      Converts attack block overcapped past 65% into double that much spell
      block. It is the reason stacking attack block is worth doing at all.
  - term: Brutal Fervour
    why: >-
      Keeps leech running continuously while you channel. It is the recovery,
      and it is why a No Leech map modifier is genuinely dangerous to this
      build rather than merely annoying.
  - term: Rumi's Concoction
    why: >-
      The block enabler until the crafted chest and the tattoos arrive. Cheap
      and load-bearing for the whole middle of the build.
  - term: Lethal Pride
    why: >-
      Seeded for Kaom and Strength of Blood. Every source calls this the
      largest cheap damage jump in the build. One 3.30-dated price exists:
      1–3 Divine.
  - term: Overlord
    why: >-
      Supplies permanent [[Fortification]], via a
      [[Large Cluster Jewel]]. Fortification is a flat reduction to hit
      damage and this is the only source of it in the build.
  - term: Pride
    why: >-
      Makes nearby enemies take more physical damage. It is the aura the
      whole damage stack is built on, and the [[Watcher's Eye]] modifiers you
      want are keyed to it.
  - term: Brutality Support
    why: >-
      More physical damage, at the cost of being unable to deal any
      elemental or chaos damage. The build is pure physical, so the drawback
      is free.
  - term: Infused Channelling Support
    why: >-
      More damage while channelling, plus damage reduction while the
      infusion is up. A damage gem that is also a defensive layer, which is
      the whole theme.
  - term: Void Shockwave Support
    why: >-
      Extra shockwave hits. One author calls it the upgrade over plain
      [[Shockwave Support]], "once you can afford it".
  - term: Desecrate
    why: >-
      At gem level 1, purely to create corpses so [[General's Cry]] can make
      mirage warriors in an empty boss arena. Skip it and your boss damage
      drops in exactly the fights where you need it.
  - term: Unwavering Stance
    why: >-
      Stun immunity. You cannot channel through stuns, and a channelled
      one-button build that gets interrupted is a dead one.
  - term: More Than Skill
    level: recommended
    why: >-
      Makes your block lucky, which is the step from very tanky to
      near-immortal. Taken as a [[Gladiator]] notable through a
      [[Forbidden Flesh]] and [[Forbidden Flame]] pair.
    detail: >-
      The author who publishes 87.75% says it is **not strictly required**,
      only that "the extra 17.75% chance to block is really comfy". He also
      warns to buy the pair early, because its price climbs through the
      league. Cheaper substitutes on the same slots: [[Master of Metal]] or
      [[Worthy Foe]], whichever is cheaper when you look.
  - term: Mageblood
    level: recommended
    why: >-
      Flask automation and the mobility fix that lets you take the
      [[The Stampede]] boots off. All four sources name the movement penalty
      as the build's main weakness and this as the answer.
    detail: >-
      After Mageblood you swap to rare boots with Onslaught, Elusive or
      Tailwind plus a Quicksilver flask, reaching 200–250% movement speed.
      One source's stated con for this build is literally "slow movement
      until you can afford Mageblood".
  - term: Watcher's Eye
    level: recommended
    why: >-
      Wants [[Pride]] and [[Purity of Elements]] modifiers. Two independent
      authors name the same one: impales you inflict last 2 additional hits
      while using Pride.
    detail: >-
      The published setup runs that impale modifier alongside chance to deal
      double damage and chaos resistance. Increased critical multiplier,
      increased physical damage and increased attack speed are named as
      equally good third modifiers.
  - term: Stranglegasp
    level: recommended
    why: >-
      Four anoints on one amulet: [[Whispers of Doom]],
      [[Enigmatic Defence]], [[Serpent Stance]] and [[Mark the Prey]]. One
      author calls it better than almost every alternative short of mirror
      tier.
  - term: The Stampede
    level: recommended
    why: >-
      The movement-penalty fix before [[Mageblood]]. Replica Stampede works
      the same way. You will take these off again later.
  - term: The Light of Meaning
    level: recommended
    why: >-
      The physical version. One of only two items in this build with a
      3.30-dated price: "typically a couple Divine".
  - term: Enlighten Support
    level: recommended
    why: >-
      Level 4, to fit the aura set. Bought around level 95 in the published
      progression, alongside the jewels.
  - term: Cogwork Ring
    level: recommended
    why: >-
      Two of them at the min-max end. Trades a prefix for an extra suffix,
      which is how the curse-on-hit and mana-cost modifiers all fit.

stages:
  - id: transition-in
    image: rumis-concoction
    title: Transition in
    levels: Level 33 onwards, cheap
    uses: >-
      A budget crafted warstaff and [[Rumi's Concoction]]. This unlocks the
      block engine, which is the only thing that has to work early.
    changes: >-
      Both published ladders level on other skills and swap to Cyclone around
      level 32 or 33, then take labs at roughly 58, 70 and 81. The build does
      not need any of its expensive items to clear the atlas.
    links:
      - name: Main skill
        gems: [Cyclone of Tumult, Brutality Support, Melee Physical Damage Support, Pulverise Support, Infused Channelling Support, Shockwave Support]
      - name: Auras
        gems: [Pride, Blood and Sand, Flesh and Stone, Herald of Purity]
      - name: Defence
        gems: [Molten Shell, Automation, Purity of Elements]
    moveOn: "Cyclone is your only button, the staff has its block implicit, and Rumi's is on your bar."
    details:
      - title: The published progression, in order
        body: |
          Act 1, then Act 2 on Static Strike, Cyclone swap at level 33, labs at 58, 70 and 81, the Fortify cluster at 90, the bossing variant at 90 and again at 95, [[Enlighten Support]] and jewels at 95, the [[Mageblood]] swap between 95 and 100, then the level 100 min-max.

          The second author's ladder is near-identical — Spectral Throw, then Static Strike, then Cyclone at 32 — with his **level 96** loadout stated as enough for full atlas progression, 4 Voidstones and Tier 16 and 16.5 currency farming.

          Two independent authors shipping the same variant ladder is the strongest evidence that this archetype genuinely transitions, rather than being a separate build wearing the same name.
      - title: Fix the mana cost before anything else
        body: |
          [[Cyclone of Tumult]] has to cost zero mana. A crafted -20 mana cost on the chest plus -3 on a ring is the published answer.

          Do this before you buy a single luxury item. Everything about how the build feels depends on the channel not breaking.
      - title: What this stage cannot do yet
        body: |
          Ubers. One author says directly: wait for a medium budget before attempting them.

          Map modifiers to reroll: **No Leech** above all, because [[Brutal Fervour]] is the defensive core. Then Reduced Recovery and less cooldown recovery rate. The same author says to avoid Valdo's maps entirely.
  - id: mid-budget
    image: lethal-pride
    title: Mid budget
    levels: Lethal Pride, Overlord, Void Shockwave
    uses: >-
      [[Lethal Pride]] seeded for Kaom and Strength of Blood, a
      [[Large Cluster Jewel]] with [[Overlord]], [[Void Shockwave Support]]
      over plain [[Shockwave Support]], and [[The Stampede]] for movement.
    changes: >-
      This is the best value in the build. Lethal Pride is the largest cheap
      damage jump at a 3.30-dated 1–3 Divine, and Overlord turns
      [[Fortification]] permanent.
    links:
      - name: Main skill
        gems: [Cyclone of Tumult, Brutality Support, Melee Physical Damage Support, Pulverise Support, Infused Channelling Support, Void Shockwave Support]
      - name: Boss damage
        gems: [General's Cry, Desecrate]
      - name: Auras
        gems: [Pride, Blood and Sand, Flesh and Stone, Herald of Purity]
      - name: Defence
        gems: [Molten Shell, Automation, Purity of Elements]
    moveOn: "Fortification is permanent, movement no longer feels broken, and Tier 16 maps are routine."
    details:
      - title: Buy order, synthesised from both authors
        body: |
          Neither author publishes a priced list, so this is the order their progressions agree on:

          1. Budget crafted warstaff plus [[Rumi's Concoction]] — unlocks the block engine
          2. [[Lethal Pride]] (Kaom) — 1–3 Divine, the biggest damage per Divine
          3. [[The Stampede]] or Replica Stampede — the movement fix before Mageblood
          4. [[Large Cluster Jewel]] with [[Overlord]], and [[Void Shockwave Support]]
          5. The [[Forbidden Flesh]] and [[Forbidden Flame]] pair — **buy early**
          6. [[Watcher's Eye]], [[Stranglegasp]], [[Enlighten Support]] level 4
          7. [[Mageblood]], then drop The Stampede for rare boots plus a Quicksilver
          8. Min-max crafting

          Only steps 2 and the [[The Light of Meaning]] later have published prices. The rest is sequence without cost.
      - title: Why to buy the Forbidden pair before you need it
        body: |
          The author who publishes the 87.75% figure warns that the pair's price climbs through the league. It is also the one item here that is not strictly required — "really comfy" is his phrasing — so it is easy to postpone and then find unaffordable.

          If you miss the window, [[Master of Metal]] or [[Worthy Foe]] are the named substitutes, whichever is cheaper. You keep the block; you lose the lucky.
  - id: high-budget
    image: mageblood
    title: High budget
    levels: Mageblood and the Forbidden pair
    uses: >-
      [[Mageblood]], the [[Forbidden Flesh]] and [[Forbidden Flame]] pair for
      [[More Than Skill]], [[Watcher's Eye]] with the [[Pride]] impale
      modifier, [[Stranglegasp]] with four anoints, and level 4
      [[Enlighten Support]].
    changes: >-
      Block goes lucky and the movement complaint disappears. This is where
      the build becomes what it is sold as. **No source prices this tier**;
      structurally it is these four items plus the jewels.
    links:
      - name: Main skill
        gems: [Cyclone of Tumult, Brutality Support, Melee Physical Damage Support, Pulverise Support, Infused Channelling Support, Void Shockwave Support]
      - name: Boss damage
        gems: [General's Cry, Desecrate]
      - name: Auras
        gems: [Pride, Blood and Sand, Flesh and Stone, Herald of Purity, Enlighten Support]
      - name: Defence
        gems: [Molten Shell, Automation, Purity of Elements]
    moveOn: "block is lucky and near 90%, movement is 200%+ without The Stampede, and ubers are farmable rather than attemptable."
    details:
      - title: What Mageblood actually fixes
        body: |
          Flask automation, and the mobility problem. Once it is in you take [[The Stampede]] off and wear rare boots with Onslaught, Elusive or Tailwind, plus a Quicksilver flask, reaching 200–250% movement speed.

          Before Mageblood the build maps *well* but not *fast*. That distinction is the one complaint every single source raises, and this is the item that answers it.
      - title: The anoints on Stranglegasp
        body: |
          [[Whispers of Doom]], [[Enigmatic Defence]], [[Serpent Stance]] and [[Mark the Prey]]. Two of those four — Enigmatic Defence at 8% and Serpent Stance at 5% — are block, so the amulet is partly a defensive item too.
      - title: Where the bossing variant diverges
        body: |
          Both Mobalytics authors ship an explicitly separate **bossing** loadout, taken at level 90 and revised at 95. That is a gear-and-tree switch, not a gem swap.

          It is worth knowing that this is a real two-configuration build before you commit: you will respec. One author's top variant also **drops [[General's Cry]] entirely** and funnels everything into Cyclone.
  - id: mirror-tier
    image: stranglegasp
    title: Mirror tier
    levels: Crafting, described but never priced
    uses: >-
      A corrupted [[Stranglegasp]] chased toward a quad-anointed rare, a
      quad-influenced body armour, two [[Cogwork Ring]], and a fractured
      essence-crafted helmet.
    changes: >-
      Nothing here changes how the build works. It is all margin. The author
      who publishes it says plainly that this variant is "too difficult for
      many to follow" and tells readers to use the Mageblood-swap variant
      instead unless they have deep crafting knowledge.
    links:
      - name: Main skill
        gems: [Cyclone of Tumult, Brutality Support, Melee Physical Damage Support, Pulverise Support, Infused Channelling Support, Void Shockwave Support]
      - name: Auras
        gems: [Pride, Blood and Sand, Flesh and Stone, Herald of Purity, Enlighten Support]
    moveOn: "there is no next stage, and no source prices this one."
    details:
      - title: What the min-max list contains
        body: |
          Corrupting a [[Stranglegasp]] hoping for a quad-anointed rare, then a Tainted Mythic Orb toward a quad-anointed [[Astramentis]], Carnage Heart or Hinekora's Sight — flagged by its own author as "VERY min-max, only if you have tons of currency to blow".

          Then a quad-influenced body armour with frenzy on hit, -20 mana cost, aura effect and physical taken as cold; two [[Cogwork Ring]]; a fractured and essence-crafted helmet with the Rogue Exile drop-only modifier that makes enemies take increased physical damage per two [[Fortification]]; and [[The Light of Meaning]] in physical.
      - title: Items this build does not use
        body: |
          [[Headhunter]] appears in only one of the four guides, and only as a generic endgame belt alternative. [[Atziri's Acuity]], [[Shavronne's Wrappings]] and [[Malachai's Loop]] are not used either, including after their 3.30 changes.

          **Awakened gems: none of the four guides mention any.** Treat that as a gap in the guides rather than evidence they are worthless.
      - title: Who this stage is not for
        body: |
          Its own author's words. The top variant is built around a self-crafted staff, a quad-influence chest, curse-on-hit Cogwork rings and fractured helmet modifiers, and he recommends the simpler Mageblood-swap variant to anyone who is not already a confident crafter.

patch:
  - note: >-
      **It is essentially unchanged, and that is the finding.** One author's
      changelog records updating the guide for 3.30 and says essentially
      nothing changed for the build. A tier list independently marks
      [[Cyclone of Tumult]] "unchanged in 3.30". He then added dedicated
      speed and bossing variants the following day, which is why the
      top-end bossing trees exist at all.
  - entry: ruthless-changes
    note: >-
      **This is the check that matters here.** [[Slayer]] ([[Impact]],
      [[Endless Hunger]]), Champion (Fortitude) and Ascendant's Gladiator
      block all sit under Ruthless-specific Changes and **do not apply to the
      normal game**. No Cyclone source we read claims a Slayer buff.
      [[Brutal Fervour]], which this build depends on, is untouched in the
      normal game. If you see a 3.30 article saying Slayer was buffed, it has
      misread the notes.
  - note: >-
      **One soft flag.** One of the four authors writes that the build has
      become really tanky with lots of damage after "recent changes", without
      naming them. Vague enough that we would not rely on it — but note he
      does **not** claim a Slayer ascendancy buff either.
  - entry: league-fates
    note: >-
      **League fit, as our inference rather than a sourced claim.** Covens of
      Umbra lets you add Fates to an area's boss, making it harder and
      richer. A build whose pitch is 87.75% lucky block, permanent leech and
      ailment immunity is well positioned for that. No source states whether
      the mechanic rewards tankiness or raw damage.
  - entry: meta-crafting-costs
    note: >-
      **Relevant to the top tier only.** The mirror-tier plan is a
      self-crafted staff, a quad-influence chest and fractured helmet
      modifiers. Meta-modifier recipes moved to Nightmare Maps and
      "cannot be changed" on weapons now costs 4 Divine plus 1 Sacred. No
      source has re-costed the crafts.

strengths:
  - "Agreed across four independent authors: tanky, easy bossing, 360-degree clear, one button."
  - "87.75% lucky block on both attacks and spells, with spell block bought for free by overcapping attack block."
  - "Permanent leech through [[Brutal Fervour]], so chip damage never accumulates."
  - "Immune to physical and elemental reflect, and to elemental ailments."
  - "Transitions from its own cheap league starter rather than needing a separate character."
  - "3.30 changed nothing about it, so every 3.29 guide still applies."
  - "The only one of the four builds with a published hardcore and solo self-found claim."
weaknesses:
  - "Slow until [[Mageblood]]. Every single source raises this. It maps well, not fast."
  - "No Leech is a genuinely dangerous map modifier, not an annoyance. Reduced Recovery and less cooldown recovery too."
  - "Very level-hungry, plus a gear-and-tree switch between level 90 and 100. A long runway."
  - "Weapon-reliant, and the weapon is crafted rather than bought."
  - "Bossing is good because it is tanky and sustained, not because it has a burst ceiling."
  - "The 177 million damage figure is an auto-derived display number with no boss target set, on a 3.29 engine."
  - "The top variant is, by its own author's admission, too difficult for many readers to follow."
avoidIf: >-
  Pick something else if you want screen-wide instant clear without buying a
  [[Mageblood]] first, or if you want a single-target specialist — this build
  kills bosses by outlasting them, not by bursting them. Skip it if you are on
  a short league clock: it is very level-hungry and has a level-95-to-100 gear
  switch. Skip the mirror tier entirely if you are not a confident crafter;
  its own author says so and points you at the simpler variant. And if you
  dislike channelled melee that pins you in place while a boss telegraphs, no
  amount of block will make that feel good.

