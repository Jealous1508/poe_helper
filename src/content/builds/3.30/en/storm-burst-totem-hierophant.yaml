name: Storm Burst of Repulsion Totem Hierophant
tagline: >-
  Place three totems that flood the screen with lightning orbs, then replace
  them to detonate every orb at once. It needs no gear to work.
class: Templar
ascendancy: Hierophant
role: starter
budget: starter
budgetNote: >-
  No author publishes a starting budget or an upgrade cost for this build. The
  guide's only currency figure anywhere is 2 Divine for one crafting-bench
  option, and that is a **3.29 price**. Treat it as a rough scale, not a cost.
  What is agreed is that entry costs nothing: the guide states that no gear is
  required for the build to function.
mainSkill: Storm Burst of Repulsion
image: asc-icon-hierophant
hero: art-hierophant
tags: [Totem, Lightning, Place and forget, Crit]
ratings: { clear: 4, bossing: 3, survivability: 3, ease: 4 }
verified: "2026-11-13"
confidence: mixed
confidenceNote: >-
  **The four ratings are our reading, not an author's.** No source publishes
  per-axis scores for this build: Maxroll has no rating block for it, and the
  star tables on the aggregator sites do not list it at all. One tier list
  places it in B. Where our scoring landed on a half point we rounded down, so
  bossing is really 3.5 and survivability swings from 2 before block to 4
  after. On sources: the planner behind the guide is genuinely 3.30, dated
  launch day, but the page's own crafting walkthroughs still describe 3.29
  league machinery that may no longer exist. No 3.30 ladder data exists for
  anything.
modes:
  ssf: >-
    Good. The guide lists solo self-found as an explicit strength, and the
    transfigured gem is self-farmable: [[Storm Burst]] has only one transfigured
    version, so the [[Divine Font]] cannot give you the wrong one.
  hardcore: >-
    Not recommended as written. The guide says nothing about hardcore and
    admits the build is not tanky until block is scaled. That window runs from
    level 31 to roughly level 80. Only consider it if you delay maps until
    block is capped.

idea: |
  You do not attack. You drop totems, and the totems do everything.

  Each totem channels [[Storm Burst of Repulsion]], which throws out small lightning orbs that jump outward across the ground. When a totem stops channelling, every orb it still owns explodes at once. The fastest way to make a totem stop channelling is to place a new one on top of it.

  So the loop is: place totems, let the orbs spread, place them again to set the orbs off. While mapping you barely think about it. On a boss you re-place constantly, which is where the damage comes from.

  [[Hierophant]] supplies the two things that make this work: extra totems, and totems that place twice as fast.

chain:
  - label: Place
    text: "Three totems (four with a crafted shield) each channel [[Storm Burst of Repulsion]] and spit out lightning orbs that jump away from you."
  - label: Spread
    text: "Orbs hit a small area every jump. Because this is the Repulsion version, they travel outward instead of piling onto one target. That is the clear."
  - label: Detonate
    text: "Stop a totem channelling and its surviving orbs explode for 75% of skill damage per 0.4 seconds of duration they had left. Replacing a totem is how you trigger it."
  - label: Survive
    text: "Capped attack and spell block, [[Mind Over Matter]], five endurance charges and [[Arcane Cloak]]. None of that exists yet at level 31."

chainDetails:
  - title: Why duration is a damage stat here
    body: |
      The detonation pays out 75% of skill damage for every 0.4 seconds of duration the orbs had left. Longer duration means a bigger explosion, not just a longer one.

      That gives the build a third scaling axis on top of gem level and crit. It is why [[Ashes of the Stars]] is a major upgrade: its quality-to-all-gems raises the skill's base duration directly.

      The guide claims a perfect Ashes roll is worth about 43% more skill duration. That number is the guide's own and we could not verify it, though the direction is right.
  - title: Repulsion versus the base gem, and why it matters this league
    body: |
      Base [[Storm Burst]] pulls its orbs **toward** the point you targeted. Orbs pile up, single-target damage rises the longer a totem lives, and the right play is to leave totems alone.

      [[Storm Burst of Repulsion]] pushes them **away**. Clear gets much better. Single-target damage falls the longer a totem channels, so the right play is the opposite: re-place constantly.

      Repulsion also hits harder per cast. It has 80% added-damage effectiveness against the base gem's 45%, and roughly 84% higher base damage at level 20, paid for with a shorter 0.8 second base duration.

      One practical consequence worth acting on: **keep a base Storm Burst in your stash.** Nothing in the gear or the support links changes between the two gems, so swapping for a boss fight is free. 3.30 is a boss-centred league and Repulsion is the clear-oriented half of the pair. The swap being free is the guide's statement; carrying both is our recommendation.
  - title: How you get the transfigured gem
    body: |
      Transfigured gems come from the [[Divine Font]] at the end of the Labyrinth. You feed it a gem and it offers a limited set of options.

      [[Storm Burst]] has exactly one transfigured version. So if the transfigure option appears at all, you get Repulsion. There is no roll to lose.

      The guide points you at Merciless Labyrinth, which offers the most options. Run it with a 20% quality Storm Burst and you start maps with a 20/20 Repulsion. If that is slow, skip it and buy the gem instead.

      One caveat: the published option counts per difficulty come from wiki pages written for an older patch and are not confirmed for 3.30.
  - title: Why you cannot play this before level 31
    body: |
      Three gates, and all three must be open:

      1. **Character level 31**, for the tree respec into [[Ancestral Bond]].
      2. **Normal Labyrinth cleared**, for [[Pursuit of Faith]].
      3. **The Library in Act 3 cleared**, so [[Siosa]] will sell you the gems.

      Until then you are a fire caster. The guide levels with [[Rolling Magma]] and swaps to [[Firestorm]] around level 28. One other author levels with Fireball instead. Either is fine; neither resembles the finished build.
  - title: What the totem count actually is
    body: |
      One base, plus one from [[Ancestral Bond]], plus one from [[Pursuit of Faith]]. That is **three** for the whole campaign and early maps.

      The fourth comes from a Shaper-influenced shield with "+1 to maximum number of Summoned Totems". That craft is the single item the guide tells you to make.

      Two more come later from [[Multiple Totems Support]] on [[Decoy Totem]], but those two are decoys, not damage.

      Note for 3.30 specifically: the Artillery Quiver's new implicit also grants +1 totem, but it is worded for **attack** skills. Storm Burst is a spell, and this build uses a wand and shield. It does nothing for you.

mandatory:
  - term: Storm Burst of Repulsion
    why: >-
      The skill. Base [[Storm Burst]] works as a stand-in until the
      [[Divine Font]] gives you the transfigured version.
  - term: Spell Totem Support
    why: >-
      Required, not optional. Storm Burst is a self-cast channelled spell. This
      gem is the only thing that makes it a totem skill.
  - term: Pursuit of Faith
    why: >-
      +1 totem, more totem duration, and 100% increased totem placement speed.
      The guide calls it mandatory before you can comfortably play the build.
    detail: >-
      The placement speed is the part people underrate. The whole playstyle is
      re-placing totems to detonate orbs, so how fast you can place them is how
      fast you deal damage.
  - term: Ancestral Bond
    why: >-
      +1 totem, and you can no longer deal damage yourself. The level 31
      campaign respec exists to reach it.
  - term: Mind Over Matter
    why: >-
      Part of your damage is taken from mana first. With a large mana pool and
      regeneration from your totems, this is a real layer.
  - term: Titanium Spirit Shield
    why: >-
      Shaper-influenced, with top-tier block and spell block, and the Shaper's
      Exalted Orb prefix "+1 maximum Summoned Totems". The one craft the guide
      insists on.
    detail: >-
      It is your fourth totem and your main source of attack block at the same
      time. Fill the suffixes first: on this base the Shaper's Exalted Orb has
      only one prefix outcome, so a full suffix block forces it. One other
      author uses an Archon Kite Shield instead, so the base is not settled.
      Be warned that the guide's walkthrough for this craft is written against
      3.29 tools.
  - term: Ashes of the Stars
    level: recommended
    why: >-
      Quality to all your gems, which raises skill duration, which is a direct
      damage multiplier for the detonation. The biggest single damage item after
      the shield.
  - term: Militant Faith
    level: recommended
    why: >-
      With the Dominus roll it converts a notable into [[Inner Conviction]],
      which lets you delete the mine setup you have been carrying since the
      campaign.
    detail: >-
      Check the seed in Path of Building before you buy. The jewel must not
      convert a notable you have already allocated inside its radius.
  - term: Anathema
    level: recommended
    why: >-
      Lets you apply five curses. Pairs with [[Arcanist Brand]] in the endgame
      setup.
  - term: Arcane Cloak
    level: recommended
    why: >-
      Spends mana to create a guard that absorbs a hit. Automate it with
      [[Automation]] so you never press it.
  - term: Decoy Totem
    level: recommended
    why: >-
      Taunts enemies away from you. With [[Multiple Totems Support]] you get two
      of them, which is a real defensive layer for a build with no movement
      defence.
  - term: Elemental Overload
    level: recommended
    why: >-
      Your campaign damage multiplier, with guaranteed uptime from
      [[Conviction of Power]]. You respec out of it in early maps when you
      switch to crit.
  - term: Archdemon Crown
    level: recommended
    why: >-
      Far-endgame helmet. With the right essence craft it turns the main link
      into an effective eight-link and frees your chest for curses.

labs:
  - lab: Normal
    node: Pursuit of Faith
    why: "Finish Normal Labyrinth before you make the totem swap at level 31. Nothing works without this node."
  - lab: Cruel
    node: Conviction of Power
    why: "+4 minimum and +1 maximum endurance and power charges. Tankiness, and guaranteed Elemental Overload uptime."
  - lab: Merciless
    node: Arcane Blessing
    why: "You and your totems grant Arcane Surge, and Arcane Surge gives 20% more spell damage. Free, automatic, always on."
  - lab: Eternal
    node: Ritual of Awakening
    why: "3% more damage per totem, plus life and mana regeneration per totem. Last, because the regeneration matters most once you are in maps."

stages:
  - id: acts-1-3
    image: arcane-blessing
    title: Acts 1–3
    levels: Level 1–31
    uses: >-
      Fire skills. [[Rolling Magma]] with [[Elemental Proliferation Support]]
      and [[Combustion Support]], plus [[Holy Flame Totem]] and a
      [[Flame Wall]] placed between you and the target. Swap to [[Firestorm]]
      after Gravicius.
    changes: >-
      None of this is the build. You are killing time until level 31. Rush the
      fire notables, buy a Goat's Horn wand at level 6, and add the "Adds Fire
      Damage to Spells" vendor recipe to it as soon as you clear Solaris Temple.
    links:
      - name: Level 1–27
        gems: [Rolling Magma, Elemental Proliferation Support, Combustion Support, Volley Support]
      - name: Totem
        gems: [Holy Flame Totem, Infused Channelling Support, Added Fire Damage Support, Elemental Focus Support]
      - name: Movement
        gems: [Shield Charge, Faster Attacks Support, Momentum Support]
      - name: Level 28–31
        gems: [Firestorm, Elemental Proliferation Support, Combustion Support, Faster Casting Support]
      - name: Heralds and utility
        gems: [Herald of Thunder, Herald of Ice, Frostblink, Arcane Surge Support]
    moveOn: "you are level 31, Normal Labyrinth is done, and you have cleared The Library in Act 3."
    details:
      - title: Make a Ranger mule before you start
        body: |
          Roll a Ranger, kill Hillock, and take [[Momentum Support]] as the reward. You also get an extra vendor roll on boots with movement speed.

          Two sources agree on this trick. One adds that finishing Mercy Mission on the mule gives you a [[Quicksilver Flask]] and [[Volley Support]] as well.
      - title: Where a Templar gets the gems
        body: |
          Base [[Storm Burst]] is listed as a quest reward for the Templar from The Siren's Cadence in Act 1, usable at character level 12.

          That reward slot is one choice among several, so the reliable route is the one the guide uses: clear The Library in Act 3 and buy what you need from [[Siosa]], who sells gems regardless of your class.

          The transfigured version is never a quest reward. [[Divine Font]] only.
      - title: Clearing with Rolling Magma
        body: |
          Rolling Magma travels in a line and bounces. Let a pack gather behind you, turn around, and hit the whole group on the way through.

          Place [[Flame Wall]] between yourself and whatever you are shooting at. Projectiles that pass through it gain added fire damage.
      - title: Bandits
        body: |
          The guide says kill all three and take the passive point from Eramir. One other author prefers Alira for the resistances and mana regeneration.

          Kill-all is the safer default here, because the finished build has plenty of mana and gets its resistances from gear.
  - id: acts-4-10
    image: pursuit-of-faith
    title: Acts 4–10
    levels: Level 31–68
    uses: >-
      The real build starts. [[Storm Burst]] in a four-link with
      [[Spell Totem Support]], and a mine setup for resistance shred and
      charges.
    changes: >-
      At level 31 you respec a chunk of the tree into [[Ancestral Bond]] and
      drop the fire notables. From here you take duration nodes,
      [[Mind Over Matter]] and mana nodes. At level 38 link
      [[Eternal Blessing Support]] to your aura.
    links:
      - name: Main skill
        gems: [Storm Burst, Spell Totem Support, Physical to Lightning Support, Lightning Penetration Support]
      - name: Mines
        gems: [Wave of Conviction, High Impact Mine Support, Charged Mines Support, Lifetap Support]
      - name: Mine automation
        gems: [Automation, Detonate Mines]
      - name: Aura and movement
        gems: [Haste, Eternal Blessing Support, Frostblink, Elemental Weakness]
      - name: End of campaign five-link
        gems: [Storm Burst, Spell Totem Support, Physical to Lightning Support, Lightning Penetration Support, More Duration Support]
    moveOn: "you have a five-link, three totems, and resistances back at 75% after Act 10."
    details:
      - title: The mine setup, and why you tolerate it
        body: |
          [[Wave of Conviction]] applies lightning exposure, which cuts enemy lightning resistance. [[Charged Mines Support]] generates frenzy and power charges quickly. [[Automation]] with a level 1 [[Detonate Mines]] sets them off for you.

          It is clunky. It is also the only thing supplying charges and exposure at this stage. You delete the whole package later, when [[Militant Faith]] gives you [[Inner Conviction]].
      - title: Haste or Wrath
        body: |
          The guide prefers [[Haste]] during the campaign. Your Dexterity caps [[Wrath]]'s level anyway, and movement speed shortens the campaign more than damage does.

          Swap to Wrath as you climb map tiers.
      - title: Eternal Blessing and the aura
        body: |
          At level 38, link [[Eternal Blessing Support]] to your aura. It makes the aura cost nothing to reserve, which matters because [[Mind Over Matter]] wants your mana pool free.

          While Mind Over Matter is not yet allocated, you also need [[Arrogance Support]] on the aura. Once Eternal Blessing is in, Arrogance is required on it.
      - title: Why you still feel weak
        body: |
          You have three totems, no crit, no block and no Arcane Cloak. This is the thin part of the build and it is honest to say so.

          Keep life and mana high on every piece of gear, keep resistances capped, and do not rush map tiers.
  - id: early-maps
    image: increased-critical-strikes-support
    title: Early maps
    levels: White and yellow maps
    uses: >-
      [[Storm Burst of Repulsion]] in a five- or six-link, now built around
      crit. [[Decoy Totem]] with [[Multiple Totems Support]] for taunt.
    changes: >-
      Three changes at once: respec out of [[Elemental Overload]], take the
      [[Lightning Mastery]] conversion so you can drop
      [[Physical to Lightning Support]], and swap [[Elemental Weakness]] for
      [[Assassin's Mark]]. Start climbing to capped block.
    links:
      - name: Main skill
        gems: [Storm Burst of Repulsion, Spell Totem Support, Increased Critical Damage Support, Lightning Penetration Support, Increased Critical Strikes Support]
      - name: Taunt
        gems: [Decoy Totem, Multiple Totems Support]
      - name: Guard
        gems: [Arcane Cloak, Automation, More Duration Support, Detonate Mines]
      - name: Auras
        gems: [Wrath, Eternal Blessing Support]
    moveOn: "you have the transfigured gem, the crit respec is done, and you are working on the Shaper shield."
    details:
      - title: Why you drop Elemental Overload
        body: |
          [[Elemental Overload]] gives a flat damage multiplier but forbids crit multiplier from doing anything useful. Once you can afford crit chance and crit multiplier on gear and tree, crit is the larger number.

          The swap is not optional and it is not gradual. Respec it in one go, then add [[Increased Critical Strikes Support]] and [[Increased Critical Damage Support]] together.
      - title: Gear priorities
        body: |
          Cap resistances first. Then life and mana on everything.

          Do not neglect chaos resistance. Amethyst bases and the crafting bench are the cheap route.

          Cast speed on rings comes from a Harvest reforge with a caster modifier.
      - title: This is where you are most fragile
        body: |
          You now have crit damage and no block. The guide is blunt that the build is not tanky until block is scaled, and this is that window.

          Do not push map tiers faster than your block. The Shaper shield is the fix and it is the next stage.
      - title: Map modifiers to avoid
        body: |
          Four, and they are hard stops rather than annoyances:

          - Cannot regenerate life, mana or energy shield.
          - Players have 20–40% reduced chance to block.
          - 60% less recovery rate.
          - Monsters' skills chain two additional times.
  - id: red-maps
    image: titanium-spirit-shield
    title: Red maps
    levels: Tier 11–16 maps
    uses: >-
      A six-link, the crafted [[Titanium Spirit Shield]] for your fourth totem
      and your block, and [[Militant Faith]] to delete the mines.
    changes: >-
      Block is the project. Craft the shield, add block on the chest at the
      bench, anoint As The Mountain, and craft +1 minimum endurance charge on a
      ring. Once [[Inner Conviction]] is in, the whole mine package comes out.
    links:
      - name: Main skill
        gems: [Storm Burst of Repulsion, Spell Totem Support, Increased Critical Damage Support, Increased Critical Strikes Support, Lightning Penetration Support, More Duration Support]
      - name: Guard, after the mines go
        gems: [Arcane Cloak, Automation, More Duration Support, Efficacy Support]
      - name: Taunt
        gems: [Decoy Totem, Multiple Totems Support]
      - name: Auras
        gems: [Wrath, Eternal Blessing Support]
    moveOn: "attack and spell block are capped and you no longer carry mines."
    details:
      - title: The shield craft, with a warning
        body: |
          You want a Shaper-influenced [[Titanium Spirit Shield]] with top-tier block, top-tier spell block, and the Shaper's Exalted Orb prefix "+1 maximum Summoned Totems".

          Fill the suffixes before you use the Shaper's Exalted Orb. On this base that prefix is the only prefix outcome, so a full suffix block forces the result.

          **The guide's step-by-step for this craft is written for 3.29.** It refers to league tools and vendors from older leagues that may not exist this patch. The target item is right; the route to it may not be. Expect to work out the current method yourself or buy the finished shield.
      - title: What Militant Faith removes
        body: |
          [[Inner Conviction]] replaces what the mines were doing. Once you have it, take out [[Wave of Conviction]], [[High Impact Mine Support]], [[Charged Mines Support]] and [[Detonate Mines]], and put [[Efficacy Support]] in the Arcane Cloak link for uptime.

          This is the single largest quality-of-life jump in the build.
      - title: Tree changes for the endgame
        body: |
          Drop Arcane Sanctuary and Primal Manifestation. Both make your totems tougher, and with the re-placement playstyle your totems are disposable.

          The points go into block, duration and cluster jewels instead.
  - id: endgame
    image: archdemon-crown
    title: Endgame
    levels: Tier 17, pinnacle bosses and beyond
    uses: >-
      [[Ashes of the Stars]], [[Anathema]], cluster jewels,
      [[Unnatural Instinct]] and [[The Light of Meaning]]. A corrupted 21/20
      gem with an imbued support.
    changes: >-
      Damage comes from gem quality, duration and curse stacking rather than
      from the tree. The last step moves the main link into an
      [[Archdemon Crown]] and puts five curses on [[Arcanist Brand]] in the
      freed chest.
    links:
      - name: Main skill in the helmet
        gems: [Storm Burst of Repulsion, Spell Totem Support, Increased Critical Damage Support, Increased Critical Strikes Support]
      - name: Curses on brand
        gems: [Arcanist Brand, Elemental Weakness, Conductivity, Assassin's Mark]
      - name: Reactive
        gems: [Cast when Damage Taken Support, Enfeeble, Punishment]
      - name: Taunt
        gems: [Decoy Totem, Multiple Totems Support, Empower Support]
    moveOn: "there is no next stage. [[Mageblood]], [[Progenesis]] and [[Stormshroud]] are what is left."
    details:
      - title: What numbers to expect
        body: |
          One independent author's endgame Path of Building shows 4,734 life, 3,944 mana, about 50,000 effective hit points, resistances at 75/75/75/53, and 19.1 million full damage per second against 4.8 million hit damage per second.

          **Those are 3.29 figures from a different author's file, not this guide's.** We quote them for scale only. No 3.30 numbers exist for this build from anyone.
      - title: The corrupted gem
        body: |
          A 21/20 [[Storm Burst of Repulsion]] with a level 1 Power Charge On Critical or [[Infused Channelling Support]] imbued into it through an Incursion soul core is worth roughly 20% more damage, according to the guide.

          That figure is the guide's own and nobody has checked it.
      - title: What this build still cannot do
        body: |
          Your totems do not move. On a boss that makes you reposition, every reposition ends the damage of the totems you left behind.

          For Repulsion that is partly self-cancelling, because ending the channel is exactly what detonates the orbs. The real cost is the gap afterwards: while you are still moving you have no totems down and no orbs out. [[Pursuit of Faith]]'s placement speed is what shrinks that gap.

          The practical upshot: your damage on a boss is a function of how much standing-still time the fight allows, not of your Path of Building number. Budget for that when you compare it to a ballista build.

powerCurve: |
  Four things multiply this build's damage: how many totems you have, how hard each orb hits (gem level, then crit), how much duration the orbs have left when they detonate, and how fast you can place totems to set them off. The defence is a separate stack that owes nothing to the damage: capped attack and spell block, [[Mind Over Matter]], five endurance charges and [[Arcane Cloak]].

  At level 31 the damage side switches on with no gear at all. Three totems, [[Pursuit of Faith]] doubling placement speed, and [[Elemental Overload]] as a flat multiplier; the later labs add [[Arcane Blessing]] at 20% more spell damage and Ritual of Awakening at 3% more per totem, all free. The defence side is almost empty, and the article says so: three totems, no crit, no block, no Arcane Cloak.

  Early maps widen that gap before anything closes it. The transfigured gem and the crit respec arrive together, so damage jumps while block is still missing — the guide's own admission is that the build is not tanky until block is scaled, and our survivability score swings from 2 before block to 4 after. One item then closes both sides at once: the Shaper [[Titanium Spirit Shield]] is your fourth totem and your main source of attack block.

  From there the damage comes from gem quality, duration and curses, not from the tree: [[Ashes of the Stars]], then [[Anathema]] and the move into an [[Archdemon Crown]]. One limit never lifts. Totems do not move, so on a boss your real damage is set by how much standing-still time the fight allows, not by the Path of Building number.

upgrades:
  - step: "A 20/20 [[Storm Burst of Repulsion]]: run Merciless Labyrinth with a 20% quality [[Storm Burst]], or buy the gem"
    why: >-
      No source publishes an upgrade order or a price for this build, so the
      order on this list is ours, read off the article's stages. This comes
      first because it can cost nothing: Storm Burst has only one transfigured
      version, so the [[Divine Font]] cannot give you the wrong one. Repulsion
      has 80% added-damage effectiveness against the base gem's 45% and
      roughly 84% higher base damage at level 20.
  - step: "Resistances capped, then life and mana on every piece, then chaos resistance"
    why: >-
      The guide's gear priority for early maps, in its order. None of it is
      damage; it is what keeps you alive in the window where you have crit
      and no block. Amethyst bases and the crafting bench are the cheap route
      to chaos resistance.
  - step: "A six-link for the main skill"
    why: >-
      The sixth socket in the article's red-map link is
      [[More Duration Support]], and duration is a damage stat here: the
      detonation pays 75% of skill damage for every 0.4 seconds the orbs had
      left. It sits below the gear above because, by the guide's own account,
      what this build lacks in maps is defence, not damage.
  - step: "A Shaper [[Titanium Spirit Shield]] with top-tier block, top-tier spell block and \"+1 maximum Summoned Totems\""
    why: >-
      The one craft the guide insists on, and the only purchase here that
      moves damage and defence together: a fourth totem on top of three, and
      your main source of attack block. Without it the build's defence never
      arrives. Fill the suffixes before the Shaper's Exalted Orb. The guide's
      route to it is written for 3.29 tools, so expect to work out the
      current method or buy the finished shield.
  - step: "The rest of the block: block crafted on the chest, the As The Mountain anoint, +1 minimum endurance charge on a ring"
    why: >-
      Small pieces that finish what the shield starts; the red-maps stage is
      not done until attack and spell block are capped. They come after the
      shield because the shield is the main source of block.
  - step: "[[Militant Faith]] with the Dominus roll, for [[Inner Conviction]]"
    why: >-
      It replaces what the mines were doing, so the whole mine package comes
      out — the article calls it the single largest quality-of-life jump in
      the build. It adds comfort rather than a new layer, which is why we put
      it after block. Check the seed in Path of Building first: it must not
      convert a notable you have already allocated.
  - step: "[[Ashes of the Stars]]"
    why: >-
      Quality to all gems raises the skill's base duration, and duration
      multiplies the detonation. The article calls it the biggest single
      damage item after the shield. The guide's figure of about 43% more
      skill duration on a perfect roll is its own and unverified.
  - step: "[[Anathema]], then the main link moved into an [[Archdemon Crown]], then a corrupted 21/20 gem"
    why: >-
      The far end. Anathema lets [[Arcanist Brand]] carry five curses; the
      crown, with the right essence craft, makes the main link an effective
      eight-link and frees the chest for those curses. The guide puts the
      corrupted gem at roughly 20% more damage, a figure nobody has checked.
      [[Mageblood]], [[Progenesis]] and [[Stormshroud]] are what is left
      after that.

play:
  mapping: |
    1. Read the map first. Four modifiers are hard stops: no regeneration, reduced chance to block, 60% less recovery rate, and monsters' skills chaining two additional times.
    2. Place your totems on the pack. The orbs jump outward on their own, and that is the clear.
    3. Walk to the next pack and place them again. The new totems replace the old ones, the old ones stop channelling, and every orb they still owned detonates behind you.
    4. Until [[Militant Faith]], the [[Wave of Conviction]] mines are part of the loop. You throw them, [[Automation]] sets them off, and they supply the lightning exposure and the charges. The article does not say how often; our habit is anything that survives the first placement.
    5. Put the [[Decoy Totem]]s down when something dangerous is coming at you. [[Arcane Cloak]] fires itself.

    Stop for rares instead of running past them: 3.30 put the value there.
  bossing: |
    Which way you play a boss depends on which gem is socketed, and the two are opposites.

    - With [[Storm Burst of Repulsion]], single-target damage falls the longer a totem channels. **Re-place constantly.** Each re-placement detonates the orbs, and that is where the damage comes from.
    - With base [[Storm Burst]], orbs pull toward the target and damage rises the longer a totem lives. **Leave the totems alone.** The guide says the swap costs nothing; carrying the base gem for bosses is our recommendation.

    Either way: decoys down first, mines on the boss until you have [[Inner Conviction]], then the damage totems. When the boss makes you move, the totems you leave behind are finished. Place new ones the moment you stop — [[Pursuit of Faith]]'s placement speed is what keeps that gap short.

deaths:
  - situation: "White and yellow maps, straight after the crit respec"
    cause: >-
      You have crit damage and no block. Capped block, the fourth totem and
      the automated [[Arcane Cloak]] are all still ahead of you, and the
      guide is blunt that the build is not tanky until block is scaled.
    fix: >-
      Do not push map tiers faster than your block. Life and mana on every
      piece, resistances capped, two [[Decoy Totem]]s for taunt. The Shaper
      shield is the real fix.
  - situation: "Red maps without the Shaper shield"
    cause: >-
      The crafted [[Titanium Spirit Shield]] is your main source of attack
      block. Without it you are stuck at three totems with no attack block,
      and the rest of the defence has nothing to stand on.
    fix: >-
      Craft it or buy it before you climb. Then block on the chest, the As
      The Mountain anoint and +1 minimum endurance charge on a ring, until
      attack and spell block are both capped.
  - situation: "You open a map and the build simply does not hold"
    cause: >-
      One of four modifiers. The guide lists them as hard stops and does not
      explain each one. Our reading: no regeneration and less recovery
      starve the mana that [[Mind Over Matter]] and Arcane Cloak spend, and
      reduced chance to block cuts the main layer directly. We have no
      explanation to offer for the chaining modifier.
    fix: "Reroll all four. They shut the build down rather than slow it."
  - situation: "A boss kills you while you stand placing totems"
    cause: >-
      Our inference, not a source's statement: the build has no movement
      defence, and its damage asks you to stand and re-place. The two pull
      against each other for the whole fight.
    fix: >-
      Decoys first, so the boss is taunted off you. When you have to move,
      move, and accept the gap in damage; placement speed gets you back
      quickly.

troubleshooting:
  - symptom: "Boss damage is far below the Path of Building number"
    cause: >-
      Two causes, both in the article. The number assumes totems that are
      standing and channelling, and every reposition ends them. And with
      Repulsion, a totem left alone deals less single-target damage the
      longer it channels.
    fix: >-
      With Repulsion, re-place constantly. Or swap in base [[Storm Burst]]
      for the fight and do the opposite. Neither changes how much standing
      time the fight gives you.
  - symptom: "You still have three totems"
    cause: >-
      The fourth comes only from the Shaper shield's "+1 maximum Summoned
      Totems". The new Artillery Quiver implicit is worded for attack skills
      and does nothing for a spell, and [[Multiple Totems Support]] on Decoy
      Totem adds decoys, not damage.
    fix: "The [[Titanium Spirit Shield]] craft. Nothing else adds a damage totem."
  - symptom: "The crit swap made the damage worse"
    cause: >-
      [[Elemental Overload]] is still allocated, or only one of the two crit
      supports went in. The swap is not gradual.
    fix: >-
      Respec out of Elemental Overload in one go, then add
      [[Increased Critical Strikes Support]] and
      [[Increased Critical Damage Support]] together.
  - symptom: "You took the mines out and lost your charges and exposure"
    cause: >-
      [[Inner Conviction]] is not actually in. The [[Militant Faith]] seed
      has to be the Dominus roll, and it must not have converted a notable
      you had already allocated inside its radius.
    fix: >-
      Check the seed in Path of Building before you buy, and keep the mine
      package socketed until Inner Conviction shows on your tree.
  - symptom: "The Divine Font did not offer you Repulsion"
    cause: >-
      Storm Burst has one transfigured version, so if the transfigure option
      appears at all you get Repulsion — but it does not always appear. The
      guide points at Merciless Labyrinth for the most options; the published
      option counts are from an older patch and unconfirmed for 3.30.
    fix: >-
      Run Merciless again, or skip it and buy the gem. Base Storm Burst
      works as a stand-in until then.
  - symptom: "Your totems keep dying"
    cause: >-
      They are meant to be disposable. You replace them constantly anyway,
      so their survivability never matters.
    fix: >-
      Nothing to buy. The article drops Arcane Sanctuary and Primal
      Manifestation for exactly this reason and spends the points on block,
      duration and cluster jewels.

patch:
  - note: >-
      **Nothing in this build changed.** [[Hierophant]] is not mentioned in the
      normal-game ascendancy section of the notes. Neither Storm Burst,
      [[Spell Totem Support]] nor [[Ancestral Bond]] appears anywhere in the
      balance changes.
  - entry: ruthless-changes
    note: >-
      **All three Hierophant lines in the notes are Ruthless-only.** The
      Ruthless section reduces [[Arcane Blessing]] to 8% more spell damage. In
      the normal game it is still 20%, which is the number the guide uses and
      the number the game data shows. If you read a launch article saying
      Hierophant was nerfed, it has applied the Ruthless section to the normal
      game.
  - entry: special-base-implicits
    note: >-
      **The new Artillery Quiver implicit does not help you.** It grants +1
      maximum totem to **attack** skills. Storm Burst is a spell, and this build
      wields a wand and shield. It is a real buff to bow ballista builds and
      nothing to you.
  - entry: mercenary-nerfs
    note: >-
      **Relative buff.** Mercenaries were cut hard and this build uses none —
      every loadout in the planner has an empty mercenary slot. Competitors that
      leaned on them got worse; you did not.
  - entry: winter-orb-nerf
    note: >-
      **Relative buff.** The most-played lazy-clear starter of last league was
      cut, which moves this build up the list of low-effort mappers by default.
  - entry: league-fates
    note: >-
      **The one real headwind.** The league is built around empowered area
      bosses, so single-target damage matters more than it did. Repulsion is the
      clear-oriented half of the Storm Burst pair, and the guide's own notes say
      the base gem is more convenient for bossing. Keep a base
      [[Storm Burst]] in your stash and swap it in for boss fights. The swap
      costs nothing.
  - entry: loot-rarity-rework
    note: >-
      **Mildly positive.** Value now concentrates in rare and unique monsters,
      which rewards actually killing things rather than running past them.

strengths:
  - "Place and forget while mapping. Very low effort for the clear you get."
  - "No gear is required for it to function. The entry cost is effectively nothing."
  - "Totem survivability never matters, because you replace them constantly anyway."
  - "Three separate scaling axes: gem level, crit, and skill duration."
  - "Capped attack and spell block, five endurance charges and Mind Over Matter once assembled."
  - "Solo self-found friendly. The transfigured gem has only one possible outcome."
weaknesses:
  - "Not tanky until block is scaled. That window is level 31 to about level 80."
  - "Totems are stationary, so clear is respectable rather than fast."
  - "No damage at all while you reposition on a boss."
  - "A clunky mine setup you carry from the campaign until Militant Faith arrives."
  - "Four map modifiers shut the build down rather than slow it."
  - "The endgame leans on heavy crafting, and the guide's crafting instructions are written for 3.29."
avoidIf: >-
  Pick something else if you want high-speed juiced mapping, if you dislike
  stationary damage, or if you would rather not re-place totems over and over
  during a boss fight. Skip it too if you will not do or buy the Shaper shield
  craft: without it you are stuck at three totems with no attack block, and the
  build's defence never arrives. It is also a poor hardcore choice as written,
  because the weakest window is the longest one.

