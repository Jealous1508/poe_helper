name: Absolution Guardian
tagline: >-
  You cast one lightning spell; the monsters it kills stand back up as three
  Sentinels that do the real damage. Free to start, and one body armour at
  level 96 changes what the whole character is.
class: Templar
ascendancy: Guardian
role: starter
budget: starter
budgetNote: >-
  The campaign and the first maps cost nothing: the gem is an Act 1 quest
  reward and the planner's early stages are rare items. **The published guide
  gives no currency figure for anything.** The only numbers we have are three
  tiers from a reader-supplied 3.29 codex with no named author: under 50
  Chaos to enter maps, 2–15 Divine for comfortable Tier 16 farming, and 40
  Divine or more for the [[Doryani's Prototype]] version. Those are
  **3.29 figures from an unverifiable source**, and the 3.30 economy does not
  exist yet. Read them as an order of size, nothing more.
mainSkill: Absolution
image: absolution
hero: art-guardian
tags: [Minion, Lightning, Spell, Block]
ratings: { clear: 4, bossing: 3, survivability: 4, ease: 3 }
verified: "2026-11-14"
confidence: mixed
confidenceNote: >-
  **Three layers, and they are not equally solid.** (1) The mechanics are
  checked line by line against PoEDB and the PoE Wiki: the [[Absolution]] gem,
  all four Guardian notables, every line of [[Doryani's Prototype]],
  [[Divine Flesh]], [[Dawnbreaker]] and the Elemental Relic auras. Those are
  not in doubt. (2) The build itself is one author's, Ronarray: a Mobalytics
  guide with a setup for every level bracket from 10 to 100. **It is titled
  3.29, its Path of Building files are labelled 3.28, and although the page
  was touched on 11 November 2026 it says nothing about 3.30.** An unrelated
  3.28 forum guide confirms the first three ascendancy picks and the core
  loop and nothing else. (3) The site owner's own source for this article is
  a long 3.29 "Master Codex" in Vietnamese with no named author, which says
  it was built from Ronarray's guide. We used it as a lead and checked it.
  **It was right about Doryani's Prototype and wrong or out of date on nine
  points**, listed under "What the codex gets wrong" below — including its
  headline addition, [[Triad Grip]], which the build does not need. Resting
  on the codex alone, and marked where they appear: the three budget tiers,
  the order of the third and fourth Labyrinth, the Animate Guardian gear
  list, the large-cluster notables and the safe order for the swap. The four
  ratings are ours. No ladder or price data exists for 3.30.
modes:
  ssf: >-
    Fine up to Tier 16 maps: nothing before the swap is a required unique,
    and one 3.30 test run of exactly this (P4RL3Y, solo self-found, level 53)
    is published. The level-96 version is a different matter.
    [[Doryani's Prototype]] can drop anywhere, but [[Dawnbreaker]] is a
    Searing Exarch drop, the [[Watcher's Eye]] needs one specific modifier,
    and the [[Glorious Vanity]] has to be the Xibaqua kind. **No source
    discusses the swap in solo self-found**; plan to stay on the pre-swap
    version for a long time.
  hardcore: >-
    No source recommends it. Before the swap the shape is reasonable: 75%
    block on attacks and spells, a minion that takes a fifth of every hit,
    and a full heal every four seconds. After the swap you stand within six
    metres of everything with about 4,800 life, no energy shield and a
    19,000 maximum physical hit in the author's own file. Our read: play the
    pre-swap version only.

idea: |
  [[Absolution]] is a spell that marks what it hits. If a normal, magic or rare monster dies while marked, its corpse is eaten and a **Sentinel of Absolution** stands up in its place. You can have three. Each lasts 15 seconds, and every further marked kill refreshes one of them.

  The Sentinels are the build. They cast their own lightning spells, and once you are past the first acts they do most of the killing. Your job is to keep casting so the pack stays marked and the three Sentinels never run out.

  [[Guardian]] adds three things no other ascendancy gives this cheaply: a permanent bodyguard minion that takes 20% of every hit aimed at you, free auras that buff you and the Sentinels at the same time, and a full heal every four seconds.

  Then, at about level 96, the build changes shape. [[Doryani's Prototype]] makes every enemy within six metres have the same lightning resistance as you — so you push your own lightning resistance down to −200% and everything near you takes triple lightning damage. The price is that your whole defence has to be rebuilt in one sitting, and from then on you have to stand close.

chain:
  - label: Cast
    text: "[[Absolution]] hits an area and leaves a debuff on every enemy for 3 seconds."
  - label: Kill while marked
    text: "A non-unique enemy that dies with the debuff becomes a Sentinel of Absolution. Three at most, 15 seconds each; extra kills refresh one."
  - label: Sentinels cast
    text: "Each Sentinel has two lightning spells of its own. Every support in your Absolution link that can apply to a minion spell applies to theirs as well."
  - label: Guardian feeds them
    text: "[[Unwavering Crusade]] summons Elemental Relics that carry Anger, Hatred and Wrath auras. Auras reach allies, so the Sentinels get them too."
  - label: Stay alive
    text: "75% block on attacks and spells, 20% of every hit sent to the Sentinel of Radiance, armour, and [[Time of Need]] healing you to full every 4 seconds."

chainDetails:
  - title: The loop has one hole, and it is the boss room
    body: |
      Everything above depends on something non-unique dying while marked. In a map that happens constantly: kills make Sentinels, Sentinels make kills. It is a loop that feeds itself, which is why the clear feels much stronger than the numbers suggest.

      A boss alone in a room breaks it. Nothing dies, so no corpse is eaten. The gem covers this with one line: **25% chance to summon a Sentinel on hitting a Rare or Unique enemy.** That is the only way to raise or refresh Sentinels on a lone boss, and it only rolls when *you* hit. So on bosses you never stop casting.

      The second tool is [[Vaal Absolution]]. It "ascends" one Sentinel you already have: 300% more damage, 70% less damage taken, 20 seconds, and it does not count towards the limit of three. It costs 40 souls and locks soul gain for 30 seconds afterwards.

      The third is disputed — see [[The Writhing Jar]] under Troubleshooting.
  - title: "Your supports support the Sentinels too"
    body: |
      This is the rule that decides the whole gem link, and the reader-supplied codex has it backwards.

      The PoE Wiki's wording: any support gem that can apply to both a spell and a minion skill applies to **both** your cast and the Sentinels' spells. Its own example is [[Spell Echo Support]], which makes the Sentinels repeat their casts as well as you.

      Two consequences:

      - [[Physical to Lightning Support]] converts the Sentinels' damage, not only yours. The gem already converts 50% of physical damage to lightning for "this Spell and Minions"; the support converts the rest. The Wiki says in so many words that this gives full conversion **without requiring [[Triad Grip]]**.
      - [[Minion Damage Support]] is the one support that helps only the Sentinels. Everything else in the published link — Spell Echo, [[Concentrated Effect Support]], [[Increased Critical Damage Support]] — works on both sides.

      The Sentinels have a base cast time of 1.33 seconds and 6% base critical strike chance. Their second spell, Empowered Lightning Blast, is on a 6-second cooldown and has two areas that can both hit the same target. That cooldown is why the gem's quality bonus and the Minion Offence Mastery both give minion cooldown recovery.
  - title: What Guardian actually gives, in numbers
    body: |
      Read off PoEDB and the PoE Wiki, not off a guide.

      - **[[Radiant Crusade]].** Grants a level 20 Sentinel of Radiance, and "20% of Damage from Hits is taken from your Sentinel of Radiance's Life before you". The Sentinel is permanent since 3.28, its level follows yours up to 85, it taunts, and it burns enemies within 4 metres for 20% of its own maximum life per second. Note "from Hits": it does nothing against damage over time.
      - **[[Unwavering Crusade]].** 25% chance to trigger a level 20 Elemental Relic when you or a nearby ally kill an enemy, or hit a Rare or Unique one. One relic per element, 5 seconds each, refreshed by the next trigger. At character level 85 the relics give: Anger, 182–259 added fire damage to attacks and spells; Hatred, 43% of physical damage as extra cold; Wrath, 26–415 added lightning to attacks and **23% more spell lightning damage**. That is roughly a level 27 aura each, for no reservation.
      - **[[Time of Need]].** Every 4 seconds: remove curses and ailments, and regenerate 100% of life over one second. Since 3.28 it removes all ailments, not only elemental ones.
      - **[[Bastion of Hope]].** +25% chance to block attacks if you have attacked recently, +25% to block spells if you have cast a spell recently, for you and nearby allies. "Recently" means the last four seconds.

      None of the four is a damage multiplier on its own. Guardian is infrastructure, and this build is what uses all of it.
  - title: "Doryani's Prototype, line by line"
    body: |
      A Saint's Hauberk, level 67. Its four special lines, verbatim from PoEDB, and what each one costs you:

      - **"Nearby Enemies have Lightning Resistance equal to yours."** Enemies within 6 metres take your character-sheet value. Resistance cannot go below −200%, so −200% is the target. Because the value is *set*, curses and exposure cannot push it lower; penetration still works, though the Wiki notes it is usually a weak choice at the cap.
      - **"Lightning Resistance does not affect Lightning Damage taken."** You take lightning damage as if you had 0% resistance — not −200%. That is still four times what a capped character takes.
      - **"Armour also applies to Lightning Damage taken from Hits."** The item's own answer to the line above. Hits only, not lightning damage over time.
      - **"Deal no Non-Lightning Damage."** A rule about *you*. Your Absolution must be fully converted, so [[Physical to Lightning Support]] is not optional.

      One trap from the Wiki that no guide mentions: **at exactly 0% lightning resistance the first line does nothing**, because of a bug. Putting the armour on before you have the negative-resistance rings does not give you "a smaller version" of the bonus. It can give you none.
  - title: How big the swap really is
    body: |
      The codex's headline figure is a five-fold damage increase: a map monster at 40% lightning resistance takes 0.6 of your damage, and at −200% it takes 3.0.

      That arithmetic is right and the comparison is not. Before the swap you are already cursing with [[Elemental Weakness]] and [[Conductivity]], so the monster is not at 40% when you start. **Our reading:** the real step is smaller than five-fold on ordinary monsters, which your curses already reach, and closer to it on bosses, which shrug off most of a curse's effect and cannot shrug off the armour.

      The author's own files are the only measured before-and-after, and they are 3.28: a level 94 day-one character at **2.42 million** damage per second and 108,685 effective hit points, and the level 97 Doryani character at **25.2 million** and 238,456. That gap is the swap *plus* three levels, a +3 amulet, cluster jewels and spectres. The planner counts 15% shock, "Nearby Allies' Damage with Hits is Lucky" and a spectre's Wrath with no reservation, and has no boss selected.
  - title: Why Eldritch Battery, and why hybrid armour
    body: |
      [[Eldritch Battery]] makes energy shield protect mana instead of life, and spends it before mana on skill costs. The guide's line is that you then "need only 1 mana to play", which is what lets you reserve almost everything for auras.

      After the swap it stops being a convenience. [[Divine Flesh]] reads "All Damage taken bypasses Energy Shield", so energy shield is worthless as a health pool and its only remaining use is as fuel. That is why every armour piece in the published sets is armour-and-energy-shield hybrid: the armour protects you, the energy shield pays for casting.
  - title: What the codex gets wrong
    body: |
      The site owner's source document is careful and openly lists five things an earlier draft of itself had wrong. Checking it against PoEDB, the PoE Wiki and the guide it says it is based on found more. **If you have read the codex, these are the corrections:**

      1. **Durations.** It gives the debuff as 1 second and Sentinels as 10 seconds. Those are the values from before 3.28. The debuff is 3 seconds and Sentinels last 15.
      2. **[[Triad Grip]].** It calls the gloves "the most important addition" and says half the Sentinels' damage stays physical without them. The Wiki says Physical to Lightning Support already gives full conversion, and the guide's level 96 setup wears rare Paladin Gloves. Triad Grip is not in any of the author's files.
      3. **Which supports reach the Sentinels.** It says Spell Echo, Concentrated Effect and added-damage supports "do not touch" them. They do.
      4. **Elemental Relics.** It reads [[Unwavering Crusade]] as a guaranteed relic on kill and 25% on hit. It is 25% for both.
      5. **Time of Need.** It says elemental ailments. Since 3.28, all ailments.
      6. **The base item.** It names Saintly Chainmail. Doryani's Prototype is a Saint's Hauberk.
      7. **"Without the rings you still get about 1.7 times."** At exactly 0% resistance the bug above means you may get nothing.
      8. **Lightning Penetration after the swap.** Mechanically it works; the Wiki calls it a typically weak choice at the cap, and the author does not use it.
      9. **"About 390,000 skill damage per second" at level 96.** We could not trace this. The author's planner shows 25.2 million in total.

      What it gets right, and most guides do not spell out: the four Doryani's Prototype lines and their consequences, the Divine Flesh and Eldritch Battery logic, that the resistance is set rather than reduced, the six-metre radius, and every 3.29 patch-note line it cites.

mandatory:
  - term: Absolution
    why: >-
      The skill. Templar quest reward for The Siren's Cadence in Act 1, usable
      from level 12. Gem level is the largest thing you control: the
      Sentinels' life and base damage scale with it.
    detail: >-
      Since 3.29 the cast time is 0.65 seconds, down from 0.75. Since 3.28
      the debuff lasts 3 seconds and Sentinels 15. Neither the gem nor its
      Vaal version is mentioned in the 3.30 notes.
  - term: Physical to Lightning Support
    why: >-
      Converts the other half of the damage to lightning, for you and for the
      Sentinels. In the link from level 22 in the author's planner, and
      compulsory once [[Doryani's Prototype]] stops you dealing anything
      that is not lightning.
  - term: Minion Damage Support
    why: >-
      More minion damage. The one support in the link that works only for
      the Sentinels, which is where the damage is.
  - term: Spell Echo Support
    why: >-
      Repeats your cast and the Sentinels' casts. In the published link from
      level 40 onward, and as [[Greater Spell Echo Support]] at the top tier.
    detail: >-
      It cannot support a Vaal skill, which worries people who see it linked
      to [[Vaal Absolution]]. A Vaal gem also grants the ordinary skill, and
      Spell Echo supports that and the Sentinels.
  - term: Radiant Crusade
    why: >-
      A permanent bodyguard that takes 20% of every hit before you do, and
      carries the campaign with its burning aura.
  - term: Unwavering Crusade
    why: >-
      Free Anger, Hatred and Wrath auras from Elemental Relics, for you and
      every minion. The Wrath relic alone is 23% more spell lightning damage.
  - term: Time of Need
    why: >-
      A full heal over one second, every four seconds, and it strips curses
      and ailments each time. This is the recovery; the build has no leech
      and no flask engine.
  - term: Bastion of Hope
    why: >-
      +25% attack block while you have attacked recently and +25% spell block
      while you have cast recently. The last piece of 75% and 75%.
    detail: >-
      It is why [[Shield Charge]] is in every setup from level 22: the
      author's planner note says to use it for the "attacked recently"
      condition. Stop moving and casting for four seconds and the block is
      gone.
  - term: Eldritch Battery
    why: >-
      Energy shield pays for your spells, so mana can be reserved for auras.
      Taken by level 70 in the planner. Mandatory once [[Divine Flesh]] makes
      energy shield useless for anything else.
  - term: Convocation
    why: >-
      Pulls every minion to you. Sentinels wander off to finish old fights;
      this is how you bring the damage to the next pack, and to the six
      metres around you after the swap.
  - term: Shield Charge
    why: >-
      Movement, and the attack that keeps the [[Bastion of Hope]] attack
      block switched on.
  - term: Vaal Absolution
    level: recommended
    why: >-
      Ascends one existing Sentinel: 300% more damage for 20 seconds, outside
      the limit of three. In the main link of every setup from level 70.
    detail: >-
      A corrupted gem, so its level and quality cannot be changed after you
      get it. 3.30 removed Vaal side areas from maps, which was the usual
      place Vaal gems dropped. Corrupting an Absolution gem with a
      [[Vaal Orb]] is the long-standing way to make one; we could not confirm
      what the common source is now.
  - term: Enduring Composure
    level: recommended
    why: >-
      A small cluster jewel notable that gives endurance charges when you are
      hit. The guide says to get it "ASAP", between level 70 and 90.
  - term: Elemental Weakness
    level: recommended
    why: >-
      With [[Conductivity]], the pre-swap double curse through the
      [[Whispers of Doom]] anoint. The planner note calls double curse "a
      strong DPS boost". Both are dropped at the swap.
  - term: Spirit Offering
    level: recommended
    why: >-
      Fired by a "Trigger a Socketed Spell when you Use a Skill" craft on the
      wand, with [[Desecrate]] to make the corpses. The author uses it at
      every stage from level 70.
  - term: Raise Spectre
    level: recommended
    why: >-
      Not for damage. Linked to [[Feeding Frenzy Support]] so the buff
      reaches all your minions. The guide says any defensive spectre works,
      and to use a [[Summon Stone Golem]] instead if spectres are new to you.
  - term: Doryani's Prototype
    level: recommended
    why: >-
      The level 96 version. Sets the lightning resistance of everything
      within six metres to yours. Not a first-week item and not a required
      one: the build reaches Tier 16 maps without it.
  - term: Divine Flesh
    level: recommended
    why: >-
      Half of all elemental damage taken as chaos, +5% maximum chaos
      resistance. From a Xibaqua [[Glorious Vanity]]. Required with the
      armour, useless without capped chaos resistance.
  - term: Dawnbreaker
    level: recommended
    why: >-
      10–20% of cold, lightning and physical damage taken as fire. The
      guide wants the lightning and cold rolls at 18–20%. Part of the swap.
    detail: >-
      PoEDB also lists a line the guide and the codex both skip: it loses 1%
      attack block for every 200 fire damage taken from hits in the past four
      seconds. A shield whose job is to turn damage into fire damage weakens
      its own block while it does so.

labs:
  - lab: Normal
    node: Radiant Crusade
    why: "Around level 33 in the author's planner. The Sentinel of Radiance arrives and does much of the killing for the next several acts. Confirmed by the author's file and by an unrelated 3.28 guide."
  - lab: Cruel
    node: Unwavering Crusade
    why: "Elemental Relics start appearing on kills: three aura effects for no reservation. Same two sources."
  - lab: Merciless
    node: Time of Need
    why: "The full heal every four seconds. The unrelated guide also lists it third. That it comes before Bastion of Hope in the author's own order rests on the codex."
  - lab: Eternal
    node: Bastion of Hope
    why: "Completes 75% block on both sides. The author's planner note about Shield Charge and \"attacked recently\" shows he takes it; the timing is the codex's."

stages:
  - id: acts-1-3
    phase: early
    image: rolling-magma
    title: Acts 1–3
    levels: Level 1–33
    uses: >-
      [[Rolling Magma]] to level 12–14, then [[Absolution]] for the rest of
      the game. [[Holy Flame Totem]] and [[Flame Wall]] stay on the bar as
      extra damage through Act 1.
    changes: >-
      At 12–14 you swap main skill. By the end of Act 2 the link is
      Absolution with [[Physical to Lightning Support]], and
      [[Shield Charge]] and [[Herald of Purity]] have joined. Normal
      Labyrinth, around level 33, gives you the Sentinel of Radiance.
    links:
      - name: Level 10, Brutus
        gems: [Rolling Magma, Added Lightning Damage Support, Combustion Support]
      - name: Level 14, Merveil
        gems: [Absolution, Added Lightning Damage Support, Added Fire Damage Support]
      - name: Level 22, end of Act 2
        gems: [Absolution, Physical to Lightning Support, Added Lightning Damage Support]
      - name: Level 33, four-link
        gems: [Absolution, Added Lightning Damage Support, Physical to Lightning Support, Added Fire Damage Support]
      - name: Extra damage in Act 1
        gems: [Holy Flame Totem, Flame Wall, Elemental Proliferation Support]
      - name: Utility
        gems: [Shield Charge, Frostblink, Herald of Purity, Vitality, Clarity]
    moveOn: "Absolution is in a four-link, you have Radiant Crusade, and Act 3 is done."
    details:
      - title: The first twelve levels
        body: |
          The guide's words: start with [[Rolling Magma]], with [[Elemental Proliferation Support]] first, and swap to [[Combustion Support]] and [[Added Lightning Damage Support]] "ASAP". Add [[Vitality]] and [[Clarity]] "to make leveling more comfortable".

          "Once you reach level 12-14 you can swap to Absolution. It will be your main skill from now on." Keep the totem and the wall for a while; they still add damage.

          At this point you are the one doing the killing. The Sentinels are weak and three of them is not yet a given. That is normal, and it is why this stretch does not show what the build is.
      - title: Passive points while leveling
        body: |
          The guide publishes a tree for each bracket but only its mastery choices come through as text. The first Minion Offence Mastery is "Minions have 25% chance to gain Unholy Might for 4 seconds on Kill" at level 14, swapped for "Minions have 30% increased Area of Effect" by level 22. A Life Mastery for +30 maximum life is taken by level 45.

          **One gap the guide's own readers point out:** there is no tree between level 45 and level 70. A commenter asks for one and has no answer. For the route itself, import the author's Path of Building, linked under Sources — it carries twelve trees.
      - title: Bandits
        body: |
          The guide: "Get rid of all, or Alira early and swap later." Alira's +15% to all resistances is the reason to take her while your gear is poor. The finished character has killed all three.
      - title: A vendor search string
        body: |
          The author publishes a search string for vendor windows that highlights linked sockets in useful colours and movement-speed boots. It is long, so copy it from his guide rather than from here.
  - id: acts-4-10
    phase: early
    image: zealotry
    title: Acts 4–10
    levels: Level 33–70
    uses: >-
      [[Absolution]] in a four-link with [[Spell Echo Support]] from level
      40. [[Zealotry]] is the first real aura, [[Elemental Weakness]] the
      first curse, and a [[Summon Stone Golem]] with
      [[Feeding Frenzy Support]] joins at 45.
    changes: >-
      Cruel Labyrinth gives the Elemental Relics. From here the Sentinels and
      the Sentinel of Radiance do most of the work and you follow them.
      Resistances drop by 30% after Act 5 and again after Act 10.
    links:
      - name: Level 40, Malachai
        gems: [Absolution, Spell Echo Support, Physical to Lightning Support, Added Lightning Damage Support]
      - name: Level 45, Kitava
        gems: [Absolution, Physical to Lightning Support, Spell Echo Support, Added Fire Damage Support]
      - name: Minion buff
        gems: [Summon Stone Golem, Feeding Frenzy Support]
      - name: Auras and curse
        gems: [Zealotry, Herald of Purity, Clarity, Elemental Weakness]
      - name: Movement
        gems: [Shield Charge, Frostblink]
    moveOn: "Act 10 is done, your elemental resistances are back at 75%, and you have Time of Need or are one Labyrinth away from it."
    details:
      - title: Why Zealotry and not a second damage aura
        body: |
          [[Zealotry]] gives more spell damage to you **and nearby allies**. The Sentinels cast spells, so they take it in full. The same logic is why the Elemental Relics matter so much here: an aura on a minion build is paid for once and received by everything you own.
      - title: Follow the minions, and call them
        body: |
          The Sentinel of Radiance taunts and burns; the Sentinels of Absolution cast from range. You cast into each pack to mark it and keep moving.

          Minions fall behind and get stuck finishing old fights. [[Convocation]] brings them to you. The author's planner note is simply that it "pulls minions to you for faster clearing". Put it on a key you will actually press.
      - title: Before the Act 10 boss
        body: |
          Cap resistances for the second 30% penalty before you go to maps, and start replacing pure-armour pieces with armour-and-energy-shield hybrids. You will take [[Eldritch Battery]] soon and it needs the energy shield.

          This is general campaign advice plus the guide's gear rule ("at least a few of those also should have hybrid ES"); the codex's level-70 checklist adds a 3,000 life minimum, which is its own figure.
  - id: early-maps
    phase: early
    image: eldritch-battery
    title: Early maps
    levels: White and yellow maps, level 70+
    uses: >-
      [[Vaal Absolution]] in a five-link, [[Eldritch Battery]], three auras
      in the helmet, a spectre group with [[Feeding Frenzy Support]], and the
      offering and curse fired by a wand craft.
    changes: >-
      The link turns towards crit with
      [[Increased Critical Damage Support]]. [[Determination]] and
      [[Flesh and Stone]] join [[Zealotry]]. Block starts to matter: the
      Shield and Block masteries are taken here.
    links:
      - name: Main skill (five-link)
        gems: [Vaal Absolution, Minion Damage Support, Physical to Lightning Support, Spell Echo Support, Increased Critical Damage Support]
      - name: Spectres and golem
        gems: [Raise Spectre, Feeding Frenzy Support, Minion Life Support, Summon Stone Golem]
      - name: Auras
        gems: [Determination, Zealotry, Flesh and Stone]
      - name: Wand, triggered
        gems: [Elemental Weakness, Desecrate, Spirit Offering]
      - name: Automatic
        gems: [Convocation, Molten Shell, Automation]
      - name: Movement
        gems: [Frostblink, Shield Charge, Vitality]
    moveOn: "three auras run without starving your casts, your block is close to 75% on both sides, and you clear yellow maps without dying to ordinary hits."
    details:
      - title: The one stat that matters on gear
        body: |
          Quoted, because the guide repeats it at three stages: "The stat that will give you the most damage is + Level to minion skills. Make sure to have it on Wand, Shield and Helmet."

          Until you can afford those, the guide suggests [[Leer Cast]] as "a cheap damage bonus for your minions" in the helmet slot, to be replaced by a rare with minion gem levels "as soon as you can afford it".

          On the wand, also look for +1 to all spell, lightning or physical skill gems, then minion damage, with crit and speed ranked highest. **Leave a suffix open** for the bench craft "Trigger a Socketed Spell when you Use a Skill".
      - title: The defence you are building
        body: |
          The guide names block as "a key defensive layer" and tells you to invest in the Sanctuary and Safeguard notables when you can. Two masteries do much of the rest: "+1% Chance to Block Attack Damage per 5% Chance to Block on Equipped Shield" and "+1% Chance to Block Spell Damage per 5% Chance to Block Attack Damage".

          [[Flesh and Stone]] is to stay in **Sand Stance**. The guide says "always".

          Endurance charges come from an [[Enduring Composure]] small cluster jewel, which it wants between level 70 and 90.
      - title: If mana runs out
        body: |
          From the guide: with [[Eldritch Battery]] "you will need only 1 mana to play". If you still run short, "dropping [[Tempest Shield]] or [[Flesh and Stone]] is a valid option".

          In practice the fix is more energy shield on gear, which is why the hybrid bases matter.
      - title: Earning currency in 3.30
        body: |
          The codex's farming advice is Abyss, for the jewels and the belt base this build wants. In 3.29 Abyss became the only source of Abyssal Jewels and Stygian Vises, and that is still true.

          What changed is access. In 3.30 Abyss no longer appears in maps by chance: it needs a Thread, and the free ones come from maps inside an Abyss Shaped Region. A [[Stygian Vise]] also now needs an Item Tier of 5 to drop at all.
  - id: red-maps
    phase: endgame
    image: determination
    title: Red maps, before the swap
    levels: Tier 11–16 maps, level 90+
    uses: >-
      The first complete version. [[Vaal Absolution]] in a six-link with two
      crit supports, four auras, a double curse of [[Elemental Weakness]] and
      [[Conductivity]], and rare gear with minion gem levels on wand, shield
      and helmet.
    changes: >-
      [[Increased Critical Strikes Support]] is the sixth gem.
      [[Tempest Shield]] becomes the fourth aura for block. The second curse
      comes from the [[Whispers of Doom]] anoint, and the Minion Offence
      Mastery "Minions Penetrate 8% of Cursed Enemies' Elemental Resistances"
      is taken to go with it. **This is the version to stay on until you can
      afford the whole swap.**
    links:
      - name: Main skill (six-link)
        gems: [Vaal Absolution, Minion Damage Support, Physical to Lightning Support, Spell Echo Support, Increased Critical Damage Support, Increased Critical Strikes Support]
      - name: Spectres and golem
        gems: [Raise Spectre, Feeding Frenzy Support, Minion Life Support, Summon Stone Golem]
      - name: Auras
        gems: [Determination, Zealotry, Flesh and Stone, Tempest Shield]
      - name: Wand, triggered
        gems: [Elemental Weakness, Desecrate, Spirit Offering]
      - name: Automatic
        gems: [Convocation, Molten Shell, Automation, Shield Charge]
      - name: Second curse and movement
        gems: [Conductivity, Frostblink]
    moveOn: "you farm Tier 16 maps without dying, and every piece of the swap is sitting in your stash."
    details:
      - title: What this version costs and what it does
        body: |
          The only measured file near this stage is the author's level 94 day-one character from 3.28: **2.42 million** damage per second with 15% shock assumed, 4,732 life, 28,382 armour, 108,685 effective hit points, resistances 79/80/79 and 39% chaos. All rare gear, a spirit shield, no Doryani's Prototype.

          The codex puts this stage at 2–15 Divine. **That is a 3.29 figure from a source we cannot check.** The author's words for the whole build are "not very expensive to setup".

          The author's own instruction on the endgame page is to "go for the 90+ T16 version before you can afford most stuff in this one".
      - title: Spectres and the Animate Guardian
        body: |
          The guide's position: the glove sockets hold "a supportive setup with additional minions. It can be Spectres, Golem or Animated Guardian if you have a budget for it." Which spectres, and what the guardian wears, are in a separate video that we did not watch. One line survives in text: "Always buy Tiger LAST because it is expensive."

          The codex fills this gap with a full [[Animate Guardian]] outfit — Kingmaker, Garb of the Ephemeral, Leer Cast, Southbound or Meginord's Vise, Victario's Flight — and the rule that matters with any of it: **when the guardian dies, everything it wears is gone.** That outfit is the codex's, not the author's, and we have not checked it against his video. The rule is simply how the gem works.

          Two things readers of the guide report, unanswered: the Stone Golem "is always dead" in heavily juiced maps, and spectres die there too. [[Minion Life Support]] is already in the link.
      - title: Cluster jewels
        body: |
          The published character carries two large cluster jewels, three [[Grand Spectrum]] jewels, a [[Thread of Hope]] and a [[Darkness Enthroned]] belt with abyss jewels in it. **Their notables are not visible on any page we could read.**

          The codex names Vicious Bite, Call to the Slaughter and Renewal for the large clusters, with Vicious Bite as the source of minion crit. Plausible, and unverified against the author's file.
  - id: doryani-swap
    phase: endgame
    image: glorious-vanity
    title: The swap
    levels: Level 96+
    uses: >-
      [[Doryani's Prototype]], a Xibaqua [[Glorious Vanity]] for
      [[Divine Flesh]], [[Dawnbreaker]], a [[Watcher's Eye]] with the
      [[Purity of Fire]] conversion modifier, two rings with negative
      lightning resistance, and chaos resistance at its cap.
    changes: >-
      Everything about defence. Lightning resistance stops protecting you, so
      lightning damage is diverted instead: half to chaos through Divine
      Flesh, more to fire through the shield and the jewel, and what remains
      meets your armour. The curses become [[Assassin's Mark]] and
      [[Punishment]]. [[Concentrated Effect Support]] replaces the second
      crit support, and [[Animate Guardian]] joins the minion group.
    links:
      - name: Main skill, in the body armour
        gems: [Vaal Absolution, Physical to Lightning Support, Spell Echo Support, Minion Damage Support, Concentrated Effect Support, Increased Critical Damage Support]
      - name: Minions
        gems: [Animate Guardian, Feeding Frenzy Support, Raise Spectre, Summon Stone Golem]
      - name: Auras
        gems: [Zealotry, Determination, Haste, Enlighten Support]
      - name: More auras and movement
        gems: [Purity of Fire, Tempest Shield, Shield Charge, Frostblink]
      - name: Wand, triggered
        gems: [Spirit Offering, Desecrate, Assassin's Mark]
      - name: Automatic
        gems: [Automation, Molten Shell, Convocation]
    moveOn: "there is no next stage you need. What follows is the expensive version."
    details:
      - title: The pieces, from the guide
        body: |
          The author's list, in his order:

          1. **[[Glorious Vanity]], the Xibaqua kind**, placed "in the top socket so it will replace [[Hex Master]]". The keystone in its radius becomes [[Divine Flesh]]. If the jewel also turns small passives into chaos resistance, "it will be even better". He links a video on how to search for one.
          2. **[[Dawnbreaker]]** "with at least 18-20% of Lightning as Fire and 18-20% of Cold as Fire".
          3. **A [[Watcher's Eye]]** with cold and lightning damage taken as fire while affected by [[Purity of Fire]] — and the aura itself, switched on.

          Then: "get rid of Lightning resistance from all items and get Rings with -Lightning resistance from trade", aiming for −200%. And cap chaos resistance: "roll chaos res on most of the items and use [[The Light of Meaning]]".

          His one concession: "If you have Glorious Vanity + Shield but don't have Watcher's you can still swap but try to get Watcher's ASAP."
      - title: Why it is all or nothing
        body: |
          Each piece covers a hole another piece opens.

          The armour removes your lightning resistance as a defence. [[Divine Flesh]] moves half of that lightning damage — and half of all fire and cold — onto chaos resistance, so chaos resistance has to be capped *first*, or the keystone makes you weaker. Divine Flesh also switches off energy shield as a health pool. [[Dawnbreaker]] and the [[Watcher's Eye]] move more lightning onto fire, so fire resistance has to be as high as you can get it; the published character sits at 87%. And the Watcher's Eye modifier only exists while [[Purity of Fire]] is on.

          Leave one out and the others do not degrade gracefully. This is the part of the codex that is best argued, and the mechanics check out line by line.
      - title: A safe order to do it in
        body: |
          **From the codex alone** — the guide gives the list above and no sequence. It is sensible, so here it is, marked for what it is:

          1. Collect every piece first. Wear nothing yet.
          2. Check chaos and fire resistance for the finished set in Path of Building before spending passive points.
          3. Respec the tree: drop the elemental resistance nodes, socket the [[Glorious Vanity]], confirm [[Divine Flesh]] is lit.
          4. Shield and jewel on, [[Purity of Fire]] on.
          5. Body armour on. Confirm [[Determination]] is running.
          6. Rings last. Remember the bug: at exactly 0% lightning resistance the armour's main line may do nothing.
          7. Swap the curses and try it in a low map before a Tier 16.

          Its other advice is to start hunting the timeless jewel around level 90, because finding one whose changed passives suit your tree takes longest.
      - title: What the finished character looks like
        body: |
          From the author's Path of Building, **labelled 3.28**, level 97: 4,761 life, 919 energy shield (which now protects nothing), 37,327 armour, 90% physical damage reduction, 75% block and 78% spell block. Resistances 87% fire, 76% cold, **−200% lightning**, 82% chaos.

          Maximum hit taken: 19,173 physical, 54,058 fire, 51,049 cold, 50,518 lightning, 47,187 chaos. Effective hit points 238,456. Total damage per second 25,214,806.

          Read the lightning figure twice. With resistance contributing nothing, the conversions and the armour bring a lightning hit back level with a cold one. That is the swap working.

          The assumptions behind the damage figure: 15% shock, "Nearby Allies' Damage with Hits is Lucky", minions gaining 20% of physical damage as extra lightning, a spectre supplying Wrath for no reservation, the Animate Guardian not counted, and no boss selected.
  - id: uber
    phase: endgame
    image: bone-helmet
    title: The expensive versions
    levels: Level 98–100
    uses: >-
      A helmet that carries the main skill with supports built into it, so
      the body armour's six sockets go to the minion group.
      [[Replica Dragonfangs' Flight]] with +3 to Absolution.
      [[Greater Spell Echo Support]] in place of Spell Echo.
    changes: >-
      The author's word for this tier is "expensive (mostly the helmet)". The
      level 100 file goes further still: a [[Bone Helmet]], [[Svalinn]] as
      the shield, [[Empower Support]] on the minion group and
      [[Arctic Armour]].
    links:
      - name: Main skill, in the helmet
        gems: [Vaal Absolution, Greater Spell Echo Support, Physical to Lightning Support, Increased Critical Damage Support]
      - name: Minions, in the body armour
        gems: [Raise Spectre, Feeding Frenzy Support, Minion Life Support, Animate Guardian, Congregation Support, Summon Stone Golem]
      - name: Reserved
        gems: [Determination, Purity of Fire, Summon Skitterbots, Enlighten Support]
      - name: Wand, triggered
        gems: [Spirit Offering, Desecrate, Assassin's Mark]
      - name: Automatic
        gems: [Automation, Molten Shell, Convocation]
      - name: Movement and stance
        gems: [Tempest Shield, Frostblink, Flesh and Stone, Shield Charge]
    moveOn: "there is nothing after this but a [[Mageblood]], which the author keeps as a separate level 99 file."
    details:
      - title: What we can and cannot tell you here
        body: |
          The gem layout above is read off the guide's level 98 page. What we could not read is the helmet itself: which supports are crafted on it, and how. The author has a separate "7-link helmet" crafting video. The codex describes a [[Bone Helmet]] with two "socketed gems are supported by" modifiers and says to check the crafting pool before spending anything. We would repeat that warning rather than the recipe.

          In this version [[Zealotry]], [[Wrath]] and [[Haste]] are listed as "Spectre Auras": they come from spectres, not from your own reservation.
      - title: Bloodlines, briefly
        body: |
          The guide mentions using "Corruption Embrace chaos ascendancy to have almost 100% uptime of additional Vaal Absolution minion", and the author's tree shows a Chaos Bloodline notable.

          PoEDB's entry for Corruption's Embrace says Vaal non-aura skills need 80% less souls, with further bonuses at four, six and eight corrupted items equipped; the bloodline is unlocked by defeating the Trialmaster. An unrelated 3.28 guide warns against going to six corrupted items. **The guide gives no instructions for this layer**, so we mention it and stop.
      - title: What the build still does badly
        body: |
          - A lone boss gives the loop nothing to eat. You depend on a 25% roll per hit and on Vaal Absolution.
          - After the swap you must stay within six metres of the thing you are killing.
          - The life pool is under 5,000 and energy shield no longer counts. Block and a four-second heal do not stop one large hit.
          - The unrelated 3.28 guide lists "not made for Uber bosses" among its weaknesses. The author says his version does them, at the expensive tier.

powerCurve: |
  Five things multiply this build's damage, and they do not arrive together. That is why it feels ordinary for a long time and then stops being ordinary twice.

  **How many Sentinels are up, and what gem level they are.** Both are there from level 12, both weakly. At level 30 you have a three-link, slow casts and Sentinels that expire between packs; you are doing most of the damage yourself and the build feels like a plain caster. **Free auras** are the first jump: the Sentinel of Radiance at about 33, then Elemental Relics at the second Labyrinth, which are worth roughly three level-27 auras by the time you are level 85 and cost nothing. That is the moment the minions take over, and it costs no currency — which is the whole case for this as a league starter.

  By level 70 the remaining early pieces are in: [[Eldritch Battery]] so auras can be reserved, [[Zealotry]], a five-link, [[Vaal Absolution]]. From 70 to the mid-90s the gains are **gem levels on gear, a sixth link, and crit** — real, but each one is a slice, and the difficulty of maps rises faster than your damage does. This stretch is where the codex says people give up on the build, and we think that is the right reading: you are building block, armour and mana here, not power.

  The fifth multiplier is **the enemy's lightning resistance**, and it does not move at all until the swap. Then it moves all the way, at once. The author's two files bracket it: 2.4 million at level 94 without the armour, 25.2 million at level 97 with it and with better everything else. *The split between "the armour" and "everything else" is our inference; nobody has published it.*

  Defence follows the opposite curve. It is strong early and for free — a fifth of every hit redirected from level 33, a full heal every four seconds from the third Labyrinth, 75% block from the fourth — and then the swap takes one layer away and makes you stand closer. On the author's two files the swapped character hits about ten times harder than the day-one one and is, in the ways that matter in a boss fight, more fragile.
upgrades:
  - step: "+1 to level of minion skill gems on wand, shield and helmet"
    why: >-
      The author's rule, repeated at three stages: this is "the stat that
      will give you the most damage". Sentinel life and base damage scale
      with gem level, so it multiplies everything else you will buy. It is
      first because it is on rare items, which are cheap, and because it
      needs nothing else to be in place.
    cost: "Inside the codex's first tier, under 50 Chaos for the whole character. 3.29, codex only, unverified."
  - step: A wand with an open suffix, then the trigger craft
    why: >-
      Automates [[Desecrate]], [[Spirit Offering]] and your curse. It is not
      a damage number; it is three buttons you no longer press, on a build
      whose weakness is having too many. It comes before links because it
      changes how the build plays for almost nothing.
  - step: Six-link, and a level 20 Vaal Absolution with quality
    why: >-
      The sixth gem is [[Increased Critical Strikes Support]], a direct
      multiplier for you and the Sentinels. Below the gem-level items
      because one more support is a smaller gain than several gem levels,
      and a six-link costs more.
  - step: Enduring Composure small cluster, and block to 75% on both sides
    why: >-
      The guide says "ASAP" for the cluster. This is the first defensive
      purchase because nothing later works if you cannot stand in a red map,
      and block is the layer that survives the swap unchanged.
  - step: Double curse through the Whispers of Doom anoint
    why: >-
      [[Elemental Weakness]] plus [[Conductivity]] is the cheapest way to
      move enemy resistance before the swap; the planner note calls it "a
      strong DPS boost". It sits this low because you throw it away at level
      96 — the armour sets resistance and curses cannot lower a set value —
      so do not overspend on it.
  - step: The whole swap, bought together
    why: >-
      [[Doryani's Prototype]], Xibaqua [[Glorious Vanity]], [[Dawnbreaker]],
      [[Watcher's Eye]], negative-resistance rings and capped chaos
      resistance. The largest single multiplier in the build, and placed
      sixth on purpose: it multiplies what the first five steps built, and
      any one piece alone is worth nothing or less than nothing.
    cost: "The codex's third tier: 40 Divine and up. 3.29, codex only, unverified. The guide gives no figure."
  - step: "Replica Dragonfangs' Flight with +3 to Absolution"
    why: >-
      Three more gem levels on the stat from step one. The guide calls it "a
      great choice if you have the budget". After the swap, because the swap
      is a larger multiplier per coin and this amulet was never cheap.
  - step: The seven-link helmet
    why: >-
      Moves the main skill into the helmet so the body armour's six sockets
      can carry the minion group. The author's own description of the
      level 98 version is "expensive (mostly the helmet)". Last because it is
      the most currency for the smallest remaining gain. 3.30 raised the
      [[Bone Helmet]] implicit to 20–30% increased minion damage, which
      helps the level 100 file a little.
play:
  mapping: |
    [[Shield Charge]] into the pack. That is your movement, and it counts as an attack, which keeps the attack half of [[Bastion of Hope]] switched on.

    Cast [[Absolution]] once or twice so the whole pack is marked. The debuff lasts 3 seconds, so you do not have to kill anything yourself: whatever dies in that window feeds the Sentinels. Then charge on. Each cast also fires the wand's trigger, which runs [[Desecrate]], [[Spirit Offering]] and your curse without you touching them, and [[Molten Shell]] comes up by itself through [[Automation]].

    Press [[Convocation]] when you move to a new screen, because the Sentinels will stay behind to finish what they started. Press [[Vaal Absolution]] when it is ready and there is something worth using it on; after each use it takes no souls for 30 seconds, so it is not a button to hold down.

    The built-in tension: **standing still switches your defence off.** Stop attacking and casting for four seconds and you lose 25% block on each side. After the swap there is a second one: the six-metre circle. Sentinels that fly ahead and fight outside it are hitting enemies at their normal resistance.
  bossing: |
    Decide before you enter whether the [[Animate Guardian]] is coming. If it dies, its gear is gone, and a boss room is where it dies.

    Open by casting, so the trigger puts your offering and curse up before the first hit lands.

    Then keep casting at the boss for the whole fight. Each hit has a 25% chance to raise or refresh a Sentinel, and that roll is the only thing holding three Sentinels in a room with no other monsters. With [[Spell Echo Support]] each cast is two hits. A Sentinel lasts 15 seconds, so a long dodge phase can cost you all three.

    Use [[Vaal Absolution]] when the boss is standing still for you: it needs an existing Sentinel to ascend. If the fight has small monsters, kill them marked.

    After the swap, stay inside six metres. Walking away to be safe removes the entire benefit of the armour. And dodge by hand: block is a chance and [[Time of Need]] is a timer, and neither answers a single large hit. The author's own file can take 19,173 physical damage in one hit and no more.
deaths:
  - situation: You stop to wait out a boss ability and die to the next ordinary hit
    cause: >-
      [[Bastion of Hope]] gives its block only while you have attacked and
      cast in the last four seconds. Standing still removes 25% from each
      side, on a character with under 5,000 life.
    fix: >-
      Keep acting while you move. [[Shield Charge]] sideways counts as an
      attack; a cast of [[Absolution]] at nothing counts as a cast.
  - situation: You put the armour on and die in the first map
    cause: >-
      [[Doryani's Prototype]] makes lightning resistance stop protecting you.
      Without the diversions — [[Divine Flesh]], [[Dawnbreaker]], the
      [[Watcher's Eye]] with [[Purity of Fire]] actually switched on — you
      take lightning hits at four times what a capped character takes.
    fix: >-
      Do not wear it until every piece is in your stash. Check that Purity of
      Fire is on: the jewel's modifier does nothing without it. Avoid maps
      with extra lightning damage until the set is complete.
  - situation: After the swap, chaos damage and degeneration kill you quickly
    cause: >-
      [[Divine Flesh]] turns half of all elemental damage you take into chaos
      damage. If chaos resistance is not capped, you have made every
      elemental hit worse, not better. The author's day-one file sits at 39%
      chaos resistance; his swap file is at 82%.
    fix: >-
      Cap chaos resistance before you socket the [[Glorious Vanity]]. Roll it
      on most items and use [[The Light of Meaning]], as the guide says.
  - situation: One large hit, with everything set up correctly
    cause: >-
      The pool is small by design, and after the swap energy shield no longer
      counts. Block is a chance and [[Time of Need]] is a four-second timer.
      Against many small hits those average out. Against one big hit they do
      not.
    fix: >-
      There is no gear fix at this budget. Keep [[Molten Shell]] on
      [[Automation]], keep endurance charges up through
      [[Enduring Composure]], and learn which boss attacks to walk out of.
  - situation: You suddenly take more damage in the middle of a fight
    cause: >-
      [[Radiant Crusade]] sends 20% of every hit to the Sentinel of
      Radiance's life. If it dies, that layer is gone until it is back. It
      also does nothing against damage over time.
    fix: >-
      Resummon it. It is a normal skill, 0.75 seconds to cast. The codex
      suggests a mastery for minion life regeneration for this reason; the
      author takes "Minions Leech 1% of Damage as Life" instead.
troubleshooting:
  - symptom: My damage on bosses is far lower than in maps
    cause: >-
      That is the build's shape. Sentinels are made from non-unique monsters
      dying while marked, and a boss room has none. What you have left is
      the 25% chance per hit on a Rare or Unique enemy.
    fix: >-
      Cast without pausing; do not let Sentinels expire during dodges; save
      [[Vaal Absolution]] for when the boss holds still. **About
      [[The Writhing Jar]]:** the codex says its worms die marked and feed
      the Sentinels, and the flask does sit in the flask slots of some of
      the author's planner stages. His text never explains it, and the item
      says the worms are "destroyed when Hit", so we could not confirm they
      leave a corpse the skill can eat. What is certain from the notable's
      text is that each worm you kill is a 25% roll for an Elemental Relic.
  - symptom: I never have three Sentinels in maps
    cause: >-
      Things are dying unmarked, or outside the area you hit. The debuff
      lasts 3 seconds and only non-unique deaths count.
    fix: >-
      Cast into the pack before the minions reach it, not after. Take the
      Minion Offence Mastery for 30% minion area, which the author has from
      level 22. If you are reading old advice that says the debuff lasts one
      second, it predates 3.28.
  - symptom: I run out of mana
    cause: >-
      Auras have reserved the pool and too little energy shield is feeding
      [[Eldritch Battery]].
    fix: >-
      More energy shield on gear: use armour-and-energy-shield bases. The
      guide's fallback is to drop [[Tempest Shield]] or
      [[Flesh and Stone]]. The author takes the Mana Mastery for 12%
      reservation efficiency.
  - symptom: I put on the armour and my damage barely moved
    cause: >-
      One of four things. Your lightning resistance is not negative yet. It
      is exactly 0%, which a bug treats as no effect. You or the Sentinels
      are fighting more than six metres apart. Or you are still running
      [[Conductivity]], which can no longer lower a resistance that the
      armour sets.
    fix: >-
      Strip lightning resistance from every item and buy the negative rings;
      aim for −200%. Use [[Convocation]] to keep the fight on top of you.
      Change the curses to [[Assassin's Mark]] and [[Punishment]].
  - symptom: It felt fine until red maps
    cause: >-
      From level 70 to the swap the build gains slices, not multiples, while
      maps get much harder. The things that are missing are usually
      defensive: block below 75%, no endurance charges, resistances thin
      after swapping gear.
    fix: >-
      Finish the block masteries and the Sanctuary and Safeguard notables,
      get the [[Enduring Composure]] cluster, and put minion gem levels on
      wand, shield and helmet before anything exotic. Do not reach for the
      armour early to fix this. It makes this problem worse.
  - symptom: The tooltip says Spell Echo does nothing for Vaal Absolution
    cause: >-
      Correct, and harmless. Spell Echo cannot support a Vaal skill. The
      Vaal gem also gives you ordinary [[Absolution]], which it does
      support, and the Sentinels' own casts, which it also supports.
    fix: >-
      Nothing. A reader of the guide abandoned a character over this; the
      link is right as published.

patch:
  - entry: ruthless-changes
    note: >-
      **The one Guardian line in the 3.30 notes is Ruthless-only.** Elemental
      Relics from [[Unwavering Crusade]] having a maximum level of 80 instead
      of 85 sits in the Ruthless-specific section. The PoE Wiki lists that
      same sentence under 3.23.0, also marked Ruthless, and PoEDB still shows
      a cap of 85 for the normal game. If you read that Guardian's auras were
      nerfed this league, that is the misreading.
  - note: >-
      **[[Absolution]] is not mentioned in the 3.30 notes.** Its last change
      was the cast time in 3.29.0. Nor are [[Vaal Absolution]],
      [[Doryani's Prototype]], [[Dawnbreaker]], [[Divine Flesh]] or
      [[Glorious Vanity]]. Read that as "not found in the notes", from
      keyword passes over a 128,000-character thread, not as a guarantee.
  - entry: doryani-and-doedre
    note: >-
      **Not this item.** 3.30 reworked [[Doryani's Invitation]], a belt.
      [[Doryani's Prototype]], the body armour this build wears, has no entry
      in its version history after 3.16.0, when the −200% resistance floor
      was introduced.
  - entry: no-random-league-mechanics
    note: >-
      **Abyss needs a Thread now.** Since 3.29 Abyss is the only source of
      Abyssal Jewels and Stygian Vises, and the published character wears a
      [[Darkness Enthroned]] full of them. 3.29 advice to "farm Abyss" still
      points at the right mechanic; it no longer appears in maps unprompted.
  - entry: item-tiers
    note: >-
      **Mixed.** Tiered rares on the ground make the early hunt for
      armour-and-energy-shield bases easier. But the official notes use this
      build's belt base as their example of a restricted one: a
      [[Stygian Vise]] needs an Item Tier of 5 to drop.
  - entry: incursion-atziri-rework
    note: >-
      **[[Vaal Absolution]] may be harder to find early.** Vaal side areas no
      longer appear in maps. The main link uses the Vaal gem from level 70
      in the author's planner. The ordinary gem works in the same link until
      you have one.
  - entry: special-base-implicits
    note: >-
      **Small buff at the very top.** [[Bone Helmet]] now has 20–30%
      increased minion damage, up from 15–20%. Only the author's level 100
      file wears one.
  - entry: meta-crafting-costs
    note: >-
      **The crafted wand and helmet may cost a different amount.** The
      author's two crafting videos are from 3.28 and 3.29. Protecting
      prefixes or suffixes on a weapon now costs 4 Divine plus a
      [[Sacred Orb]]; the new cheaper crafts protect a modifier chosen at
      random.
  - entry: golem-buff-nerfs
    note: >-
      **Trivial.** [[Summon Stone Golem]] gives 16% increased defences where
      it gave 20%.

strengths:
  - "Playable from level 12 on a quest-reward gem, with no required unique before level 96."
  - "Guardian's free auras buff you and every minion at once, for no reservation."
  - "Strong defence for no currency: 75% block on both sides, a fifth of every hit redirected, a full heal every four seconds."
  - "Ranged minions: you mark the pack and keep moving."
  - "Curses and ailments are stripped every four seconds, so few map modifiers need rerolling."
  - "A very high ceiling. The author's level 97 file shows 25.2 million damage per second (3.28, generous assumptions)."
weaknesses:
  - "One author. His guide is titled 3.29 and his planner files are labelled 3.28."
  - "Single-target damage depends on a 25% roll per hit once there is nothing else to kill."
  - "Many buttons before the wand trigger, and the author's own list of weaknesses says minions \"can feel strange\"."
  - "The swap is all or nothing and needs several specific items at once."
  - "After the swap you must fight within six metres, on under 5,000 life with no energy shield."
  - "A long flat stretch from level 70 to the mid-90s where maps outpace your damage."
  - "The guide prices nothing. Every budget figure here is from an anonymous 3.29 document."
avoidIf: >-
  Pick something else if you want to kill things yourself rather than through
  minions, or if you want one build that does not change. This is two
  characters: a tanky, cheap summoner up to Tier 16, and a close-range
  specialist after an expensive, fiddly swap. Skip it if your goal is bosses
  on a small budget — the loop that makes maps easy is exactly what a boss
  room takes away. And skip the level 96 version in hardcore.

