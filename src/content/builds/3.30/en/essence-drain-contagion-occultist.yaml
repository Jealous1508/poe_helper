name: Essence Drain Contagion Occultist
tagline: >-
  Two casts and the pack dies, then the next pack, then the one off screen.
  A chaos damage-over-time classic that levels through a wand trigger and
  ends as a power charge stacker. Its guide is a 3.29 guide with a 3.30
  label.
class: Witch
ascendancy: Occultist
role: starter
budget: starter
budgetNote: >-
  **The guide has no budget section, no rating block and no price for
  anything.** We call it a starter budget because nothing before maps needs
  a unique: you level on a rare wand with +1 to chaos gems. The first real
  purchase is [[Cane of Unravelling]], and the guide says not to switch to a
  staff without it. PoEDB tags that staff as a Betrayal item, and Betrayal
  no longer appears in maps without a Thread, so we cannot say what it will
  cost this league. The guide's final version wears [[Mageblood]] and
  [[Kalandra's Touch]] and is not a budget build by any measure.
mainSkill: Essence Drain
image: asc-icon-occultist
hero: art-occultist
tags: [Spell, Chaos damage over time, Energy shield, Power charges]
ratings: { clear: 5, bossing: 3, survivability: 3, ease: 3 }
verified: "2026-11-14"
confidence: mixed
confidenceNote: >-
  **Read the dates, not the banner.** The page is headed "Covens of Umbra
  3.30" and "Updated November 13, 2026". Its changelog has two entries:
  created on 23 July 2026 for 3.29, and one gem change on 3 August. There is
  no 3.30 entry. The planner behind it was last saved on 19 September 2026
  with every tree stamped 3.29. So this is a 3.29 build that has been
  relabelled, written by an experienced author for a patch three months
  old. What carries over: 3.30 does not change [[Essence Drain]],
  [[Contagion]], [[Blight]] or the Occultist in the normal game, which we
  checked in the notes and against GGG's tree data. What the guide cannot
  know: two items it leans on come from Betrayal, which works differently
  now. **The ratings are ours.** The guide publishes none, and no strengths
  or weaknesses list either. Its bandit and Pantheon sections are empty on
  the page; those choices here come from the planner.
modes:
  ssf: >-
    The guide gives no verdict. Our reading: the levelling and the wand
    version need nothing you cannot find, and the gems are quest rewards.
    The staff version needs [[Cane of Unravelling]], and the power charge
    endgame needs [[Badge of the Brotherhood]] and
    [[Ralakesh's Impatience]]. Plan to stay on the earlier version for a
    long time.
  hardcore: >-
    The guide gives no verdict for this build. Its author says he
    "generally" plays hardcore and makes builds for both, which is context
    and not a recommendation. The defence is energy shield, block and
    [[Chaos Inoculation]], all of which arrive late.

idea: |
  Two spells do the work.

  [[Contagion]] puts a weak chaos damage-over-time effect on a group of enemies. Its real job is its last line: when an enemy dies with Contagion on it, the effect **spreads** to the enemies nearby.

  [[Essence Drain]] is a projectile that puts a strong chaos damage-over-time effect on one enemy, and heals you for part of it. On an enemy that has Contagion, it becomes part of what spreads.

  So: Contagion on the pack, Essence Drain on one monster. That monster dies and passes both effects on, those die and pass them on again. The guide's description is "dead monsters multiple screens away".

  [[Occultist]] adds Wither on everything near you without a button, lower chaos resistance on nearby enemies, and a large energy shield pool that pays your mana costs.

chain:
  - label: Contagion
    text: "Cast [[Contagion]] on the pack first. Always first: it is what carries everything else."
  - label: Essence Drain
    text: "One [[Essence Drain]] on any monster in the pack. The debuff does the damage, and you are healed for a share of it."
  - label: Spread
    text: "When a monster dies with both on it, both jump to its neighbours. Then again. You are already walking."
  - label: Single target
    text: "Nothing dies to spread from, so you curse with [[Despair]], add Wither, cast Essence Drain and channel [[Blight]]."

chainDetails:
  - title: Why you level with a wand and an attack
    body: |
      Self-casting two spells per pack needs cast speed and area of effect, and a low-level character has neither. The guide: "Cast Speed & AoE are massive problems early on."

      [[Spellslinger]] sidesteps it. It reserves mana, and then every wand attack you make fires the linked spells instantly. One click of [[Frenzy]] casts Contagion, Essence Drain and two more spells at once.

      You can level by self-casting. The guide's answer: "be warned: it's much slower."
  - title: What the Occultist gives, as the game states it today
    body: |
      From GGG's current tree data:

      - [[Vile Bastion]]: regenerate 100 energy shield per second, cannot be stunned while you have energy shield, and maximum energy shield is increased by your chance to block spell damage.
      - [[Void Beacon]]: nearby enemies have -20% to chaos and cold resistance.
      - [[Withering Presence]]: +60% chaos resistance, 15% more chaos damage, and every second it inflicts Withered on enemies within 6 metres for 15 seconds.
      - [[Forbidden Power]]: +1 maximum power charge, a power charge after spending 200 mana, and 6% increased damage and area per power charge.

      The first is why the guide takes it first. With [[Eldritch Battery]], your skills are paid for from energy shield, and Vile Bastion refills energy shield. The guide calls it "basically your 'mana' sustain".
  - title: Power charges are the endgame
    body: |
      Every late upgrade in the guide feeds one number. Per power charge you get:

      - 6% increased damage and area, from [[Forbidden Power]].
      - 5% increased cast speed and 5 mana regenerated per second, from [[Cane of Unravelling]].
      - 8% increased damage, from [[Disciple of the Forbidden]].
      - 3% more spell damage, from [[Inner Conviction]], which the guide gets through [[Militant Faith]].

      Then [[Badge of the Brotherhood]] sets your maximum frenzy charges equal to your maximum power charges, and [[Ralakesh's Impatience]] makes you count as having them all.

      The guide's summary: "8+ Frenzy Charge and Power Charges".
  - title: The trap in changing staves
    body: |
      [[Forbidden Power]] and [[Cane of Unravelling]] both give a power charge after you **spend 200 mana**.

      The guide's final weapon is a rare [[Battery Staff]]. That base makes socketed skills spend energy shield before mana. So the moment you socket Essence Drain in it, you stop spending mana, and both of those charge sources go quiet.

      The guide warns about exactly this: "you need another way to generate Power Charges, since you no longer spend mana." Its fix is three pieces: [[Disciple of the Forbidden]], a Caster Mastery for a power charge while channelling, and [[Whirling Barrier]] for one on block.
  - title: Chaos Inoculation and how Essence Drain heals it
    body: |
      [[Chaos Inoculation]] sets your life to 1 and makes you immune to chaos damage. Your energy shield is your whole health bar.

      Essence Drain's recovery is life regeneration: 0.5% of the debuff's damage. With life at 1 that would be useless. [[Zealot's Oath]] moves life regeneration onto energy shield, so the skill heals the pool you actually have.

      The guide waits until "you have enough ES gear" before making this switch, and gives no number for "enough".
  - title: Blight of Contagion, and a gem the guide removed
    body: |
      For single targets the guide prefers [[Blight of Contagion]] over plain [[Blight]]: "It ramps much faster than the base Blight but has lower top-end, that being said it's almost always better in practice." Its debuff also spreads with Contagion. Use plain Blight until you have it.

      **One conflict to know about.** The guide's changelog says Bane of Condemnation was removed on 3 August 2026. Its mid-stage rotation text still starts with that gem. The final rotation starts with [[Despair]]. Follow the final one.

mandatory:
  - term: Essence Drain
    why: >-
      The damage. One cast per pack, and the main thing your gem levels and
      damage-over-time multiplier improve.
    detail: >-
      PoEDB: a Witch gets it as a reward for The Siren's Cadence in Act 1,
      at level 12.
  - term: Contagion
    why: >-
      The spread. Without it Essence Drain kills one monster and stops.
    detail: >-
      PoEDB: a Witch gets it as a reward for Breaking Some Eggs in Act 1,
      at level 4.
  - term: Spellslinger
    why: >-
      Fires both spells from one wand attack. The guide's levelling method
      from level 28.
    detail: >-
      It reserves mana for each linked spell. The guide takes
      [[Wandslinger]] and its reservation mastery to afford two setups.
  - term: Vile Bastion
    why: >-
      Energy shield regeneration that, with [[Eldritch Battery]], pays your
      costs. Also stun immunity. First Labyrinth.
  - term: Eldritch Battery
    why: >-
      Energy shield is spent before mana. The guide pairs it with
      [[Mind Over Matter]] during the campaign, "both for defensive
      purposes and also for sustaining the high costs" of two Spellslinger
      setups.
  - term: Withering Presence
    why: >-
      Wither on everything within 6 metres, every second, with no key
      press. And 60% chaos resistance, which the guide says "makes pre-CI
      gearing much easier".
  - term: Void Beacon
    why: >-
      Nearby enemies lose 20% chaos resistance. Second Labyrinth.
  - term: Despair
    why: >-
      The curse that opens every single-target rotation in the guide's
      final version.
  - term: Blight
    level: recommended
    why: >-
      The channelled single-target skill. It also hinders, and
      [[Withering Presence]] makes hindered enemies deal 15% less damage
      over time.
    detail: >-
      [[Allelopathy]] grants a level 25 Blight from level 41. The guide:
      "a massive level Blight very early into the game".
  - term: Cane of Unravelling
    level: recommended
    why: >-
      +2 to chaos spell gems, +1 maximum power charge, a power charge per
      200 mana spent, and cast speed and mana regeneration per power
      charge. The guide: "Do not swap to Staff without" it.
  - term: Forbidden Power
    level: recommended
    why: >-
      The last Labyrinth. 6% increased damage and area per power charge,
      and one more charge.
  - term: Chaos Inoculation
    level: recommended
    why: >-
      The guide's endgame defence, taken with [[Zealot's Oath]] once your
      energy shield gear is ready.
  - term: Mana-Infused Staff
    level: recommended
    why: >-
      20–24% more chance to block and 30% less mana cost of skills, for 30%
      of your mana reserved. The guide needs [[Sovereignty]] to fit it.
    detail: >-
      PoEDB lists it only as a Templar quest reward, in Act 2. A Witch
      buys it from Siosa in the Act 3 Library or from Lilly Roth in Act 6.
  - term: Pact of Ghorr
    level: recommended
    why: >-
      Your next three damage-over-time spells deal 40% more damage over
      time. In the guide's endgame links.
    detail: >-
      PoEDB's description says the pact also burdens you "with an
      Affliction". The guide does not mention a downside and we could not
      find what the affliction does. Read the gem before you rely on it.
  - term: Honourhome
    level: recommended
    why: >-
      A levelling helmet with +2 to socketed gems and reduced mana cost.
      The guide: good "until endgame".
  - term: Badge of the Brotherhood
    level: recommended
    why: >-
      Maximum frenzy charges equal to maximum power charges. The piece that
      turns a power charge stacker into a frenzy charge stacker too.
  - term: Ralakesh's Impatience
    level: recommended
    why: >-
      You count as having maximum frenzy charges without generating them.
      Changed in 3.30: see the patch section.

labs:
  - lab: Normal
    node: Vile Bastion
    why: "From the guide: \"basically your 'mana' sustain when combined with Eldritch Battery\", plus stun immunity."
  - lab: Cruel
    node: Void Beacon
    why: "\"Adds a lot of damage by reducing the enemies resistances.\""
  - lab: Merciless
    node: Withering Presence
    why: "\"A TON of Chaos Resistance\", and it automates Wither."
  - lab: Eternal
    node: Forbidden Power
    why: "\"Works really well especially once you start stacking Power Charges.\""

stages:
  - id: acts-1-3
    phase: early
    image: flame-wall
    title: Acts 1–3
    levels: Level 1–28
    uses: >-
      [[Kinetic Bolt]] to level 12, then two copies of
      [[Kinetic Fusillade]]. [[Holy Flame Totem]] and [[Flame Wall]] for
      bosses. **You do not cast Essence Drain yet.**
    changes: >-
      [[Herald of Ice]] and [[Herald of Thunder]] at level 16.
      [[Precision]] from the start: the guide calls it "very important",
      because you are attacking with a wand and a Witch has little
      accuracy.
    links:
      - name: Level 1–11
        gems: [Kinetic Bolt, Elemental Proliferation Support, Prismatic Burst Support]
      - name: Level 12–27, socketed twice
        gems: [Kinetic Fusillade, Volley Support, Added Lightning Damage Support]
      - name: Single target
        gems: [Holy Flame Totem, Flame Wall, Combustion Support]
      - name: Movement
        gems: [Shield Charge, Faster Attacks Support, Momentum Support]
      - name: Utility
        gems: [Frostblink, Arcane Surge Support, Precision]
    moveOn: "you are level 28 and have Essence Drain and Contagion levelled in spare sockets."
    details:
      - title: Two Kinetic Fusillades
        body: |
          The guide sockets the same link twice and alternates. Each one builds up its projectiles and fires them off by itself, so rotating between two means you are never waiting on one.

          A 3.30 footnote: the patch fixed [[Kinetic Fusillade]]'s experience curve, and the notes say existing gems "may have gained or lost a level". It changes nothing for a new character.
      - title: Gear for these levels
        body: |
          - A wand with high flat elemental damage. Your attacks are the build right now.
          - A [[Citrine Amulet]] for Strength and Dexterity, which a Witch lacks and which later gems and armour need.
          - [[Honourhome]] if you find or buy one. Socket your main skill in it.
          - Check vendors often. The guide notes useful wands show up more at low levels.
      - title: Pick up the real skills early
        body: |
          [[Contagion]] is a quest reward at level 4 and [[Essence Drain]] at level 12. Take both and leave them in spare sockets.

          That is our advice, not the guide's: it does not mention it, but the alternative is switching at 28 with level 1 gems.
      - title: Bandits and Pantheon
        body: |
          **The guide's section is empty.** From its planner: help Alira while levelling and in the staff stage, then kill all three for the final version.

          Pantheon in the planner: Soul of the Brine King with Soul of Garukhan, changing to Lunaris and Ralakesh at the end.
  - id: acts-4-10
    phase: early
    image: frenzy
    title: Acts 4–10
    levels: Level 28–68
    uses: >-
      Two [[Spellslinger]] setups fired by [[Frenzy]]. One click casts
      [[Essence Drain]], [[Contagion]], [[Soulrend]] and [[Cold Snap]].
    changes: >-
      Your elemental wand is replaced by one with +1 to chaos spell gems
      and chaos damage-over-time multiplier. [[Eldritch Battery]] and
      [[Mind Over Matter]] go in. Four Labyrinths over this stretch and the
      first maps.
    links:
      - name: Spellslinger one
        gems: [Spellslinger, Essence Drain, Soulrend, Efficacy Support, Controlled Destruction Support]
      - name: Spellslinger two
        gems: [Spellslinger, Contagion, Cold Snap, Controlled Destruction Support]
      - name: The wand attack
        gems: [Frenzy, Decay Support]
      - name: Curses for bosses
        gems: [Bane, Despair, Punishment]
      - name: Wither totems
        gems: [Wither, Spell Totem Support, Multiple Totems Support, Faster Casting Support]
      - name: Movement
        gems: [Shield Charge, Faster Attacks Support, Momentum Support, Flame Dash]
    moveOn: "the campaign is done, resistances are at 75%, and you have Vile Bastion, Void Beacon and Withering Presence."
    details:
      - title: The rotation, which is one button
        body: |
          The guide: "Use Frenzy to trigger both Spellslinger set-ups." On a boss, add [[Bane]] to apply your curses.

          From level 41, [[Allelopathy]] gives you a level 25 [[Blight]] to channel on single targets. The planner's campaign setup wears it.
      - title: A small conflict in the guide
        body: |
          The text says the first Spellslinger link holds Contagion and Essence Drain, and the second holds Cold Snap and Soulrend.

          The planner pairs them the other way: Essence Drain with Soulrend, Contagion with Cold Snap. We show the planner's version. Either works; all four fire on the same attack.
      - title: Why Eldritch Battery and Mind Over Matter
        body: |
          Two Spellslinger setups reserve a lot of mana, and every Frenzy still costs some.

          [[Eldritch Battery]] makes skills spend energy shield first, and [[Vile Bastion]] regenerates 100 energy shield per second. [[Mind Over Matter]] then lets 40% of damage taken come out of mana.

          Both are gone from the planner's staff-stage tree. [[Cane of Unravelling]] takes over the mana problem at that point.
      - title: Passive tree
        body: |
          The guide's notes for this stage:

          - Spell damage and elemental nodes at first. Spell damage scales the kinetic skills.
          - [[Wandslinger]] and its reservation mastery by level 28.
          - Generic damage-over-time notables: Harsh Lessons, Acrimony and Hasty Demise. The last is dropped later.

          The trees themselves are in the planner, stamped 3.29.
  - id: early-maps
    phase: early
    image: withering-presence
    title: Early maps
    levels: White and yellow maps
    uses: >-
      Either stay on [[Spellslinger]] with a better wand, or get
      [[Cane of Unravelling]] and start casting by hand. Rare armour with
      life, armour and energy shield.
    changes: >-
      With the staff, [[Mana-Infused Staff]] gives block and
      [[Zealot's Oath]] moves Essence Drain's healing to energy shield. The
      rotation becomes two casts per pack.
    links:
      - name: Essence Drain (six-link on the staff)
        gems: [Essence Drain, Controlled Destruction Support, Void Manipulation Support, Efficacy Support, Power Charge On Critical Support, Empower Support]
      - name: Contagion
        gems: [Contagion, Intensify Support, Increased Area of Effect Support]
      - name: Single target
        gems: [Blight, Controlled Destruction Support, Infused Channelling Support, Swift Affliction Support, Void Manipulation Support, Arcane Surge Support]
      - name: Automatic movement skills
        gems: [Automation, Withering Step, Phase Run]
      - name: Auras and curse
        gems: [Malevolence, Mana-Infused Staff, Flesh and Stone, Despair]
      - name: Burst
        gems: [Pact of Ghorr, Frostblink]
    moveOn: "you are on the staff, casting by hand, with block nodes taken and your first cluster jewel in."
    details:
      - title: Do not switch weapons early
        body: |
          The guide is firm: "Do not swap to Staff without having Cane of Unravelling, if you want to self-cast early maps, upgrade your wand to a similar higher level version."

          The reason is mana. The staff regenerates 5 mana per second per power charge and builds those charges as you spend. Without it, self-casting has nothing paying for it. A shield in place of a staff is "a very valid way to play", but then "you need to fix early mana problems" yourself.
      - title: Which gems the links above come from
        body: |
          They are the planner's "Cane of Unravelling" setup, which it labels Endgame and shows at gem level 20–21. The guide does not give a separate link list for the first maps.

          So treat the six-links as the target. Fill them as you find the sockets, in the order written.
      - title: Gear priorities from the guide
        body: |
          - Armour and energy shield on everything. Boots, gloves and helmet must each have **armour** as well as energy shield. That is the condition of the Armour and Energy Shield Mastery, which gives 100% increased armour and energy shield from the body armour.
          - Moonstone Rings for cast speed: "this build needs a lot of it to feel good."
          - An amulet with +1 to chaos or spell gems and damage-over-time multiplier.
          - Anoint Fangs of the Viper early and Infused later. Infused is +1 maximum power charge.
      - title: Block, which is also energy shield
        body: |
          The staff-stage tree takes [[Enigmatic Defence]], Enigmatic Reach and [[Whirling Barrier]].

          These do two things. They are block. And because [[Vile Bastion]] increases maximum energy shield by your chance to block spell damage, they are energy shield too.
      - title: What the guide leaves out here
        body: |
          No flask list. No map modifiers to avoid. No number for how much energy shield you should have before maps or before [[Chaos Inoculation]].

          We are not going to fill those in from general habit. The Cold DoT Occultist article on this site covers a similar defence, with sources that do answer those questions.
  - id: red-maps
    phase: endgame
    image: chaos-inoculation
    title: Red maps
    levels: Tier 11–16 maps
    uses: >-
      [[Chaos Inoculation]] with [[Zealot's Oath]], energy shield on every
      slot, [[Blight of Contagion]] in the six-link, and large cluster
      jewels with Wicked Pall.
    changes: >-
      Life stops mattering. Your health bar is energy shield, healed by
      [[Essence Drain]] and protected by block. Power charge nodes come
      into the tree.
    links:
      - name: Essence Drain
        gems: [Essence Drain, Controlled Destruction Support, Void Manipulation Support, Efficacy Support, Power Charge On Critical Support, Empower Support]
      - name: Contagion
        gems: [Contagion, Intensify Support, Increased Area of Effect Support]
      - name: Single target
        gems: [Blight of Contagion, Controlled Destruction Support, Infused Channelling Support, Swift Affliction Support, Void Manipulation Support, Arcane Surge Support]
      - name: Automatic movement skills
        gems: [Automation, Withering Step, Phase Run]
      - name: Auras and curse
        gems: [Malevolence, Mana-Infused Staff, Flesh and Stone, Despair]
      - name: Burst
        gems: [Pact of Ghorr, Frostblink]
    moveOn: "Chaos Inoculation is allocated, the cluster jewels are in, and Tier 16 maps are comfortable."
    details:
      - title: When to take Chaos Inoculation
        body: |
          The guide: "Once you have enough ES gear go for Chaos Inoculation and Zealot's Oath."

          It does not say how much is enough. [[Withering Presence]] gives 60% chaos resistance, which is what lets you delay the switch without dying to chaos damage in the meantime.

          After the switch: as much energy shield as possible, "especially on Body Armor", and still hybrid gloves, boots and helmet for the mastery.
      - title: Cluster jewels
        body: |
          "Clusters are quite big for this character's damage", the guide says, and the notable it wants most is Wicked Pall, "for the duration". In today's tree data that notable is 30% increased chaos damage and 5% increased skill effect duration.

          Its crafting tip is an Aberrant Fossil.

          Before the clusters, the guide suggests Heart of Darkness and Spiritual Aid as temporary damage, with the path changed to run through Lord of the Dead.
      - title: Two jewels the guide places for you
        body: |
          - The Red Nightmare in the Templar jewel socket, for block. It "works best with Fire Resistance Tattoos".
          - [[Militant Faith]] in the Witch socket near Minion Instability, for [[Inner Conviction]]: 3% more spell damage per power charge.
      - title: The rotation at this stage
        body: |
          Clear: [[Contagion]], then [[Essence Drain]]. Always in that order.

          Single target: [[Despair]], then Wither from [[Withering Step]], then Essence Drain, then channel [[Blight of Contagion]].

          [[Withering Step]] and [[Phase Run]] are both on [[Automation]], so the Wither burst and the speed happen as you move.
  - id: endgame
    phase: endgame
    image: ralakeshs-impatience
    title: Endgame
    levels: Tier 17, pinnacle bosses and beyond
    uses: >-
      A rare [[Battery Staff]], [[Badge of the Brotherhood]],
      [[Ralakesh's Impatience]], and every power charge the tree and gear
      can hold.
    changes: >-
      The build stops generating charges by spending mana and starts
      counting as having them. Frenzy charges arrive without any way of
      generating them.
    moveOn: "there is no next stage. The guide's own final character added [[Mageblood]] and [[Kalandra's Touch]]."
    details:
      - title: The staff
        body: |
          "Staves can roll +4 to Chaos Spell Gems and +2 to All Spell Gems, this combined with higher %Spell Damage and block rolls make them the highest DPS option."

          The planner's example has both gem modifiers, 199% spell damage, 64% chaos damage-over-time multiplier and spell block, with the +2 as a fractured modifier. No price, no craft steps.
      - title: Keeping power charges without spending mana
        body: |
          The Battery Staff makes Essence Drain cost energy shield. The guide's replacement sources:

          - [[Disciple of the Forbidden]]: +1 minimum power charge and a chance for one on kill.
          - A Caster Mastery that grants a power charge while channelling. Blight is channelled.
          - [[Whirling Barrier]]: 20% chance for a power charge when you block.

          Then [[Ralakesh's Impatience]] covers the frenzy side through [[Badge of the Brotherhood]].
      - title: Numbers, from the author's own 3.29 character
        body: |
          The author's final Path of Building for 3.29, as listed on poebuilds.cc: 10,397 energy shield, 739 energy shield regenerated per second, about 453,000 effective hit points, and 34.2 million total damage per second.

          That character wore [[Mageblood]] and [[Kalandra's Touch]]. It is the ceiling. The guide gives no figure for any earlier stage.
      - title: Essence Drain or Blight as the main skill
        body: |
          The guide's own FAQ allows the other way round: [[Blight of Contagion]] as the main skill is "a great ability for both single target and clear speed" and "does more damage".

          The cost: "It doesn't have recovery like Essence Drain."

powerCurve: |
  The damage has four parts, and they come from different places.

  1. **Gem level of Essence Drain.** The debuff's base damage is on the gem: 41 per second at level 1 and 2,729 at level 20. "+1 to chaos spell gems" on a wand, +2 on [[Cane of Unravelling]], +4 and +2 on a finished staff.
  2. **What the enemy takes.** Wither stacks, -20% chaos resistance from [[Void Beacon]], and [[Despair]].
  3. **Damage-over-time multiplier**, from wand, amulet, staff and tree.
  4. **Power charges**, which add damage, area and cast speed together.

  **At level 30** you have a level-appropriate gem, a +1 wand, and [[Spellslinger]] doing the casting. Numbers 2 and 4 are empty. It still feels strong, because the spread does not care how much damage you have: if the first monster dies, the pack dies. This build clears well long before it kills bosses well.

  **At level 70** number 2 has arrived almost for free. [[Void Beacon]] and [[Withering Presence]] are ascendancy points, not purchases. This is the cheapest large jump in the build. Then comes a dip: you stop using Spellslinger, start casting by hand, and feel every missing point of cast speed. The guide says rings with cast speed matter because "this build needs a lot of it to feel good".

  **At level 95** it is number 4 that has grown. Each power charge is damage, area and cast speed at once, and the guide's late items exist to raise the maximum and then to hold it without effort. That is why the guide says the build "ramps hard" late.

  The defence runs on a separate clock: thin through the campaign, held together by [[Eldritch Battery]] and [[Mind Over Matter]], then rebuilt once around energy shield, block and [[Chaos Inoculation]]. The reading of the curve in this section is ours. The guide gives the parts, and no timeline.

upgrades:
  - step: "A wand with +1 to chaos spell gems and chaos damage-over-time multiplier"
    why: >-
      The guide's first replacement, at the moment you start using
      [[Spellslinger]]. Gem level is the base everything else multiplies,
      and a rare wand is the cheapest place to get one. The ranking of this
      list is ours; the items and their sequence are the guide's.
  - step: "[[Allelopathy]]"
    why: >-
      A level 25 [[Blight]] from level 41. It fixes the weakest part of the
      early character, single targets, with one item, and you were not
      using the glove slot for damage anyway.
  - step: "[[Cane of Unravelling]]"
    why: >-
      +2 gem levels, a power charge, and the mana to cast by hand. It is
      the gate to the whole second half of the build, which is why the
      guide forbids the staff swap without it. Below Allelopathy only
      because you need level 60 to hold it.
  - step: "Energy shield and armour on every slot"
    why: >-
      Nothing here adds damage. It comes before the damage items below
      because [[Chaos Inoculation]] is a one-way door: switch with too
      little energy shield and you have no life to fall back on.
  - step: "Large cluster jewels with Wicked Pall"
    why: >-
      "Quite big for this character's damage" in the guide's words. After
      the defence, because they cost passive points you were spending on
      survival.
  - step: "[[Blight of Contagion]] in the six-link"
    why: >-
      Better single-target damage in practice, by the guide's account. A
      transfigured gem, so it depends on what the Divine Font or the market
      gives you. Plain Blight does the same job more slowly.
  - step: "A rare [[Battery Staff]] with gem levels"
    why: >-
      The highest damage weapon, and the first upgrade that breaks
      something: your mana-spending power charge sources stop. Buy it only
      with the replacement sources already in the tree.
  - step: "[[Badge of the Brotherhood]] with [[Ralakesh's Impatience]]"
    why: >-
      Frenzy charges equal to your power charges, always up. Last because
      each needs the other, and both need a high power charge maximum to
      be worth a slot.

play:
  mapping: |
    During the campaign, with [[Spellslinger]]:

    1. Attack with [[Frenzy]]. Everything else fires by itself.

    In maps, casting by hand:

    1. [[Contagion]] on the pack. The guide: use it "first to ensure it spreads Essence Drain".
    2. One [[Essence Drain]] at any monster inside it.
    3. Leave. The spread finishes the pack and often starts the next one.
    4. [[Withering Step]] and [[Phase Run]] fire through [[Automation]] as you go.

    The mistake is waiting. The damage is over time, and nothing you do after the second cast makes it faster. Cast, move, cast.

    The built-in tension: Wither from [[Withering Presence]] only reaches 6 metres, and [[Void Beacon]] only affects nearby enemies. Your strongest multipliers want you close, on a character whose damage does not need you to be.
  bossing: |
    The guide's final rotation, in order:

    1. [[Despair]] on the boss.
    2. [[Withering Step]], for a burst of Wither stacks. Later [[Automation]] does this.
    3. [[Essence Drain]].
    4. Channel [[Blight of Contagion]], or plain [[Blight]].

    [[Pact of Ghorr]] goes in before the damage casts: it makes your next three damage-over-time spells deal 40% more.

    Then repeat from step 3 as the debuffs run out. Essence Drain lasts 3.8 seconds at base, so this is a rhythm, not a single setup.

    Stay within 6 metres if you can. That is the range at which [[Withering Presence]] keeps adding Wither.

troubleshooting:
  - symptom: "Essence Drain kills one monster and the rest of the pack is untouched."
    cause: >-
      [[Contagion]] was not on the monster when it died. Essence Drain by
      itself does not spread; Contagion carries it.
    fix: >-
      Contagion first, every time. If packs are too spread out for one
      cast, the guide links Contagion to area supports for exactly this:
      it "increases the spread range by quite a bit".
  - symptom: "My damage on bosses is far lower than in maps."
    cause: >-
      In maps, monster deaths do the work: the spread multiplies one cast
      across a screen. A boss gives you nothing to spread from, so you see
      the real size of one debuff.
    fix: >-
      Use the full rotation: [[Despair]], Wither, Essence Drain, then
      channel [[Blight]]. Before level 60, [[Allelopathy]] is the cheap
      fix. Stay close enough for [[Withering Presence]].
  - symptom: "I run out of mana when I stop using Spellslinger."
    cause: >-
      Self-casting two spells per pack is expensive, and the guide's answer
      to that is one item.
    fix: >-
      [[Cane of Unravelling]], or stay on the wand. With a shield setup
      the guide says you must "fix early mana problems" another way and
      does not say how.
  - symptom: "My power charges disappeared after I changed staff."
    cause: >-
      A [[Battery Staff]] makes socketed skills spend energy shield, not
      mana. [[Forbidden Power]] counts mana spent. So does the Cane you
      just took off.
    fix: >-
      [[Disciple of the Forbidden]], the Caster Mastery for a power charge
      while channelling, and [[Whirling Barrier]].
  - symptom: "Casting feels slow and clumsy in early maps."
    cause: >-
      [[Spellslinger]] was hiding your cast speed. By hand, each pack is
      two full casts: 0.6 seconds for Contagion and 0.7 for Essence Drain
      at base.
    fix: >-
      Cast speed on Moonstone Rings, and the 5% per power charge from the
      Cane. If it is still unpleasant, go back to the wand for a few
      levels.

patch:
  - note: >-
      **3.30 changed none of the skills.** [[Essence Drain]],
      [[Contagion]], [[Blight]], [[Spellslinger]] and [[Pact of Ghorr]] are
      not in the skill or support gem sections of the notes. The pact that
      was changed is Pact of Beidat.
  - entry: ruthless-changes
    note: >-
      **The Occultist was not changed in the normal game.** The notes do
      list [[Void Beacon]], [[Withering Presence]] and [[Profane Bloom]],
      inside the Ruthless-only section. There, Void Beacon rises to -15%.
      In the normal game it is -20% and has not moved: GGG's current tree
      data confirms it. If you read that Occultist was buffed, that is
      Ruthless.
  - entry: betrayal-rewards
    note: >-
      **The guide's key uniques come from Betrayal, and Betrayal changed.**
      PoEDB tags both [[Cane of Unravelling]] and
      [[Badge of the Brotherhood]] with Catarina's Betrayal symbol. Her
      safehouse rewards were reworked in this patch. We could not confirm
      how often either item drops now.
  - entry: no-random-league-mechanics
    note: >-
      **And Betrayal no longer turns up by itself.** It appears only in a
      map with a Betrayal Thread. Early in the league that means fewer
      Canes on the market than a 3.29 guide would expect. This is our
      inference; there is no economy yet to check it against.
  - entry: ralakeshs-impatience
    note: >-
      **Buy the right boots.** New [[Ralakesh's Impatience]] roll -1 to
      maximum power, endurance or frenzy charges. This build stacks power
      charges and copies them to frenzy, so the pair you want is the one
      that takes an **endurance** charge. The other two cost you damage.
  - entry: special-base-implicits
    note: >-
      **Two free buffs.** [[Apothecary's Gloves]], the base in the
      planner's staff-stage gear, now give +14–18% damage-over-time
      *multiplier*, where they used to give increased damage over time.
      And a [[Crystal Belt]] now rolls up to 100 energy shield, from 80.
  - entry: fractured-items-rarer
    note: >-
      **The final staff is harder to make.** The planner's example has its
      +2 to spell gems as a fractured modifier, and fractured items come
      from far fewer sources now.
  - note: >-
      **The buff this build is built on is from 3.29.** That patch gave
      [[Cane of Unravelling]] +1 maximum power charge and raised its cast
      speed per charge from 2% to 5%. It is what the guide means by "after
      the patch, endgame scaling is much better with a Staff".

strengths:
  - "Clears whole screens from two casts, including what is off screen."
  - "Levels on a rare wand: no unique needed before maps."
  - "Three of its largest damage multipliers are ascendancy points, not items."
  - "Essence Drain heals you while it kills."
  - "Chaos damage over time ignores enemy energy shield."
  - "A very high ceiling through power charge stacking."
weaknesses:
  - "The guide is a 3.29 build under a 3.30 banner."
  - "Single-target damage needs a four-step rotation and a channelled skill."
  - "The switch from wand to staff waits on one unique from Betrayal."
  - "Casting by hand feels slow until cast speed is on your gear."
  - "The guide gives no flasks, no map modifiers, no budget and no ratings."
  - "Your best debuffs only reach enemies close to you."
avoidIf: >-
  Pick something else if you want to see big hit numbers, if two casts per
  pack sounds like one too many, or if you want a guide that tells you what
  to buy at each step and what it costs. This one does not. Skip it too if
  you need a strong boss killer early: the build clears long before it
  bosses. If you want an Occultist with a fuller guide behind it, the Cold
  DoT Occultist on this site is the closer-documented choice.

