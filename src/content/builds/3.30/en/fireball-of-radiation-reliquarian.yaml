    gem is not a trade item. Transfigured gems come from the Divine Font at
    the end of a Labyrinth run, and the two uniques in the plan are common
    drops. **No source discusses solo self-found, so this is our reading of
    the item list.**
  hardcore: >-
    No source discusses it, and we would not. The skill is untested in
