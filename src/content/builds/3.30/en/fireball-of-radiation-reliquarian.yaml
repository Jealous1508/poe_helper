image: fireball
hero: art-ascendant
tags: [Spell, Fire, New in 3.30, Degeneration]
ratings: { clear: 3, bossing: 3, survivability: 4, ease: 3 }
verified: "2026-11-13"
confidence: predicted
confidenceNote: >-
  **This is the least proven build on the site and the rating is honest
  rather than modest.** [[Fireball of Radiation]] was added in 3.30. There is
  no PoEDB page for it. Path of Building has no data for it — the planner
  Goratha published uses *base* [[Fireball]] as a stand-in, so even his own
  numbers are not numbers for this skill. The only thing we can quote with
  certainty is one line of the official patch notes. Two well-known creators
  are testing it: Goratha published a league-start plan on launch day with
  30,100 views, and Pohx — the Righteous Fire author — published "New Single
  Target for RF?" the day before with 47,600 views. Both are questions, not
  conclusions. The four ratings are guesses, and the whole page should be
  read as "here is what is and is not known", not as a guide.
modes:
  ssf: >-
    Better suited to solo self-found than most new-skill builds, because the
    gem is not a trade item. Transfigured gems come from the Divine Font at
    the end of a Labyrinth run, and the two uniques in the plan are common
    drops. **No source discusses solo self-found, so this is our reading of
    the item list.**
  hardcore: >-
    No source discusses it, and we would not. The skill's behaviour is
    unknown, the ascendancy's notables for this league have not been
    published in text, and the only planner is a level-69 character with
    11,061 effective hit points.

idea: |
  Covens of Umbra added exactly one new transfigured skill. The official line is the whole of what is known about it:

  > Unleashes a ball of fire ahead that inflicts a short but powerful fire damage over time debuff to each enemy in an area around it.

  So: a projectile you throw, which lands and burns everything near the impact for a short time. Not an ignite — a debuff written on the skill. That is the interesting part, because a damage-over-time debuff from a spell scales with fire damage over time multipliers and does not care about enemy armour or energy shield.

  Two creators had the same idea about where it belongs. A [[Righteous Fire]] character has enormous fire damage scaling, enormous life regeneration, and a long-standing hole: Righteous Fire burns everything around you and does almost nothing to a boss standing still in front of you. [[Fire Trap]] has been filling that hole for years. [[Fireball of Radiation]] might fill it better, because it is a spell that applies a burst of fire damage over time on command.

  The [[Reliquarian]] is the other half, and it is the part we cannot explain to you. It is the Scion ascendancy whose notables are reshuffled every league, and in 3.30 they were reshuffled again — the official notes publish this league's list as four pictures with no text.

chain:
  - label: Throw it
    text: "[[Fireball of Radiation]] is a cast spell. It travels, lands, and applies a fire damage-over-time debuff in an area around the impact."
  - label: Short and strong
    text: "The patch notes call the debuff \"short but powerful\". No duration, base damage or area is published anywhere, including PoEDB."
  - label: Righteous Fire does the clearing
    text: "[[Righteous Fire]] burns everything around you continuously. That is the mapping half of the build and it is unchanged from any other RF character."
  - label: Regeneration pays for it
    text: "[[Immortal Flesh]] and the tree supply flat life regeneration. The published level-69 character regenerates 307 life per second while burning."
  - label: Block and conversion absorb hits
    text: "[[Glancing Blows]] doubles both block chances for 65% damage from blocked hits. [[Cloak of Flame]] turns physical damage taken into fire damage, which your 81% fire resistance then eats."

chainDetails:
  - title: What is actually known about the new gem
    body: |
      One sentence from the official 3.30.0 notes, quoted above. That is it.

      Not known, after searching for all of it: base damage at any gem level, the debuff's duration, the area radius, cast time, mana cost, damage effectiveness, whether the debuff stacks or refreshes, whether it counts as an ignite for anything, which classes can buy it, or what the gem's colour and attribute requirements are. **PoEDB has no page for it.** It is a transfigured skill, so the normal route is a Divine Font at the end of a Labyrinth run, but we did not find that confirmed for this specific gem either.

      This matters more than it sounds. A fire damage-over-time debuff written on a gem scales very differently from an ignite: ignite scales with the size of your hit, a gem debuff scales with gem level and damage-over-time multipliers. Which of those two things this skill is will decide the entire tree. **Nobody knows yet.**
  - title: Why the published planner is not a planner for this skill
    body: |
      Goratha's file is hosted at maxroll.gg/poe/pob/i124sx00. Its skill list reads **Fireball**, not Fireball of Radiation, and the Fireball entry reports 35,400 damage per second at 1.31 casts per second with 5% critical strike chance and 150% critical multiplier.

      That is base Fireball, used as a placeholder, because Path of Building has no data for the new gem. The same is true across the site this league: no planner reflects any 3.30 change, and this one cannot reflect the skill it is named after.

      The rest of the file is still useful, because the *character* is real even if the skill is a stand-in:

      **Level 69.** Life 2,575, energy shield 39, mana 685, **11,061 effective hit points**. Resistances 81 fire, 81 cold, 81 lightning, 80 chaos. Armour 2,321, 29% physical damage reduction, 47% block, 4% spell block, [[Glancing Blows]] allocated. Maximum hit taken 3,400 physical and 13,500 of each element. Life regeneration 307 per second, movement speed +17%, 3 of 3 endurance charges, 238 Strength / 83 Dexterity / 193 Intelligence, bandits killed.

      Read it as what it is: the state of a character at the end of the campaign, published on launch day as a plan.
  - title: The Reliquarian problem
    body: |
      The [[Reliquarian]] is the Scion ascendancy whose notables rotate. The 3.30 notes say, in the normal-game Ascendancy Changes section:

      > The Notables for the Reliquarian Ascendancy have been shuffled, below are the Passives available for Covens of Umbra.

      And then **four images**: the armour, caster, jewellery and martial passives. The names are in the pictures and nowhere in the text. We could not read them, so this page does not have a Labyrinth table and does not tell you which notable to take first.

      Two consequences worth stating plainly. First, every Reliquarian guide from 3.29 is built on a different set of notables and is therefore void — this is not the usual "numbers may have shifted", it is a different ascendancy. Second, the author chose this ascendancy *because* of that reshuffle: his own 3.29 video on the subject argued the new Reliquarian nodes were much better than the previous league's, which is a pattern rather than a prediction about 3.30.

      Check the notable list in game, on the ascendancy screen, before you commit points.
  - title: Why pair a new skill with Righteous Fire at all
    body: |
      Because [[Righteous Fire]] has one weakness and it is always the same one.

      Righteous Fire deals continuous fire damage to everything around you, scaled by your maximum life and energy shield. It clears maps by walking. Against a single large target it is weak, because the damage does not increase for a bigger enemy and you cannot stack more of it.

      The standard answer has been [[Fire Trap]] plus [[Combustion Support]] and friends, and Goratha's planner still carries Fire Trap at gem level 21. If the new skill's debuff is strong, it replaces that — a spell you cast on a boss, rather than throwing a trap and waiting for it to arm.

      That is the question both creators are asking. Pohx's post is titled, word for word, "New Single Target for RF?" — with the question mark.

      If you want a Righteous Fire build that works today, this site's Righteous Fire Chieftain page is the one to read. This page is about an experiment.
  - title: Two uniques, and everything else is a rare base
    body: |
      Worth noticing in the gear list, because it is what makes this a genuine league starter rather than a shopping list:

      [[Cloak of Flame]] in the chest, which converts 40% of physical damage from hits into fire damage — fire being the one element this character has in huge surplus at 81%. [[Immortal Flesh]] on the belt, a level 50 unique with a large flat life regeneration roll.

      Everything else in the published file is an ordinary base: a Void Sceptre, a Spiny Round Shield, an [[Archdemon Crown]], Leviathan Gauntlets and Greaves, a Rhex Talisman, two Vermillion Rings and four Crimson Jewels. No chase unique, no cluster jewels, no Forbidden pair.
  - title: The gem list, and what we cannot tell you about it
    body: |
      Read off the page, ungrouped: [[Righteous Fire]] at 20/20, [[Fire Trap]] at 21/20, [[Flame Dash]], [[Flammability]], [[Summon Skitterbots]], [[Flesh and Stone]], [[Tempest Shield]], [[Storm Brand]], [[Shield Charge]] and [[Purity of Fire]].

      Supports present somewhere in the file: [[Elemental Focus Support]], [[Efficacy Support]], [[Lifetap Support]], [[Swift Affliction Support]], [[Increased Area of Effect Support]], [[Unbound Ailments Support]], [[Increased Critical Strikes Support]], [[Faster Attacks Support]], [[Momentum Support]] and [[Combustion Support]].

      **The page does not say which gems are linked to which.** So the link groups further down this page are our arrangement of his gem list by obvious function, not his. Where we guessed, we say so.

      One thing the list tells you for free: [[Unbound Ailments Support]] and [[Combustion Support]] are both in there, and both of those are ignite tools. That suggests the author is not sure yet whether the new skill's debuff behaves like an ignite either.

mandatory:
  - term: Fireball of Radiation
    why: >-
      The skill, and the reason this page exists. A transfigured Fireball
      added in 3.30 that applies a short, strong fire damage-over-time debuff
      around where it lands.
    detail: >-
      **No numbers exist for it.** No base damage, no duration, no radius, no
      PoEDB page. As a transfigured gem the normal route is a Divine Font at
      the end of a Labyrinth run. Check the gem's own tooltip in game, which
      is currently a better source than anything published.
  - term: Righteous Fire
    why: >-
      The clear. It burns everything near you continuously and scales with
      maximum life, and it is the reason the build has high regeneration and
      capped-plus fire resistance in the first place.
    detail: >-
      This is not a Righteous Fire guide. For the proven version of the
      Righteous Fire engine — the aura set, the regeneration maths, the
      Pantheon, the buy order — read the Righteous Fire Chieftain page on
      this site, which is built on years of the same author's work.
  - term: Reliquarian
    why: >-
      The Scion ascendancy, chosen because its notables were reshuffled for
      this league and the author expects the new set to be strong.
    detail: >-
      **We cannot list the notables.** The official notes publish this
      league's Reliquarian passives as four images with no accompanying text,
      and no site has transcribed them. Read the ascendancy screen in game
      before spending points, and treat every 3.29 Reliquarian guide as
      written for a different ascendancy.
  - term: Immortal Flesh
    why: >-
      Large flat life regeneration on a level 50 belt, which is what pays for
      burning yourself. In the published file the character regenerates 307
      life per second at level 69.
  - term: Cloak of Flame
    why: >-
      Converts 40% of physical damage from hits into fire damage, and fire is
      the resistance this build has most of. Usable from level 18 to the end
      of the game.
  - term: Glancing Blows
    why: >-
      Doubles your chance to block attack damage and spell damage, in
      exchange for taking 65% of the damage from blocked hits. It is the
      keystone the published planner allocates, and it is where the 47% block
      figure comes from.
  - term: Fire Trap
    level: recommended
    why: >-
      The incumbent single-target skill for Righteous Fire, at gem level 21
      in the published file. Keep it until the new skill proves it is better.
  - term: Flammability
    level: recommended
    why: >-
      Lowers fire resistance and increases ignite chance. Standard on any
      fire build, and the obvious curse whether or not the new debuff turns
      out to be an ignite.
  - term: Purity of Fire
    level: recommended
    why: >-
      Raises maximum fire resistance. The published character sits at 81%
      fire resistance, which is how a Righteous Fire build survives its own
      aura.
  - term: Combustion Support
    level: recommended
    why: >-
      Present in the file. It lowers enemy fire resistance on ignite, so it
      only pays if the new skill ignites — which is exactly what nobody
      knows.
  - term: Unbound Ailments Support
    level: recommended
    why: >-
      More ailment damage and duration. In the file for the same reason as
      Combustion, and with the same caveat.
  - term: Archdemon Crown
    level: recommended
    why: >-
      The helmet base in the published file, as a rare rather than a unique.
      Its level requirement happens to line up with the level-69 snapshot.

stages:
  - id: acts-1-10
    image: righteous-fire
    title: Acts 1–10
    levels: Level 1–69
    uses: >-
      Fire leveling skills, then [[Righteous Fire]] once your life and fire
      resistance can carry it. [[Fire Trap]] for bosses. [[Storm Brand]] and
      [[Shield Charge]] appear in the file, which suggests a brand-based
      early game before Righteous Fire comes online.
    changes: >-
      This is the only stage any source actually covers, because the
      published planner **is** the end of this stage. By level 69 the
      character has 2,575 life, 81% to every elemental resistance, 307 life
      regenerated per second and [[Glancing Blows]] allocated.
    links:
      - name: "Clear (our grouping of his gem list, not his)"
        gems: [Righteous Fire, Elemental Focus Support, Increased Area of Effect Support, Swift Affliction Support, Efficacy Support]
      - name: "Single target (our grouping)"
        gems: [Fire Trap, Combustion Support, Unbound Ailments Support, Swift Affliction Support]
      - name: "Auras and curse (our grouping)"
        gems: [Purity of Fire, Summon Skitterbots, Flesh and Stone, Flammability, Tempest Shield]
      - name: "Movement (our grouping)"
        gems: [Shield Charge, Faster Attacks Support, Momentum Support, Flame Dash]
    moveOn: >-
      you have finished Act 10, your elemental resistances are above 75%,
      [[Immortal Flesh]] and [[Cloak of Flame]] are equipped, and Righteous
      Fire is sustainable.
    details:
      - title: The order of operations for Righteous Fire, in short
        body: |
          The published file does not spell this out, so this is the general rule for the archetype rather than the author's advice.

          Righteous Fire deals fire damage to you every second based on your maximum life. You can only turn it on when your regeneration plus your fire resistance beat that. In practice that means: cap fire resistance first, get flat life regeneration second, turn the aura on third. [[Immortal Flesh]] at level 50 is usually the moment it becomes comfortable.

          Until then you are leveling with whatever fire spell you like. The file's [[Storm Brand]] is lightning, not fire, which is a common campaign choice because brands do their own damage while you walk.
      - title: What we cannot tell you about the campaign
        body: |
          Which bandit to help, which Pantheon powers to run, which Labyrinth to do when, or which Reliquarian notable to take first. The planner has bandits killed and nothing else recorded.

          The Reliquarian notable question is not laziness on our part — the names are not published in text anywhere, as described above.
      - title: Earning currency in 3.30
        body: |
          The same warning as on every starter page this league: Abyss, Bestiary, Betrayal, Blight, Breach, Expedition, Incursion, Legion, Ritual and Ultimatum no longer spawn in maps on their own. They arrive only where a Thread puts them, so the early plan is Threads from Shaped Regions and not skipping rare monsters or map bosses.
  - id: getting-the-gem
    image: fireball
    title: Getting the new gem
    levels: After the Labyrinth
    uses: >-
      [[Fireball of Radiation]] in place of, or alongside,
      [[Fire Trap]] as your single-target skill.
    changes: >-
      **This is the stage nobody has written.** The gem is new, the planner
      models base [[Fireball]] instead of it, and no support gem list for it
      exists. What follows is reasoning from the one official sentence, and
      it is labelled as such.
    moveOn: >-
      you have the gem and have decided for yourself whether it beats Fire
      Trap. There is no published answer.
    details:
      - title: How transfigured gems are obtained
        body: |
          Transfigured skills come from the Divine Font at the end of a Labyrinth run: you offer a normal gem and receive one of its transfigured variants. They are also tradable once they exist.

          **We did not find this confirmed for this specific gem**, only the general mechanic, so if the Font does not offer it, the answer will be on the gem's trade listing rather than here.
      - title: Which supports to try first, and why we are guessing
        body: |
          The skill applies a fire damage-over-time debuff. If that debuff is a skill effect rather than an ignite, the supports that matter are the generic damage-over-time ones — [[Efficacy Support]], [[Swift Affliction Support]], [[Elemental Focus Support]], [[Increased Area of Effect Support]] — and gem level, because a gem-based degeneration scales on gem level.

          If instead it behaves like an ignite, then [[Combustion Support]] and [[Unbound Ailments Support]] become the right answer and the whole tree changes towards ignite damage.

          **Both sets are in the author's own file**, which is the clearest sign available that he has not decided either. Test it on a boss, not on a pack: a short strong debuff is exactly the kind of thing that looks fine while clearing and disappoints on a target with real health.
      - title: What would make this build fail
        body: |
          Said in advance so you can check it yourself rather than finding out at Tier 14:

          - If the debuff's duration is very short and its cooldown or cast time is not, it will be worse than Fire Trap and the build has no single target.
          - If the debuff does not stack or refresh usefully, casting it repeatedly gains nothing.
          - If the new Reliquarian notables turn out not to support a fire caster, the ascendancy choice is wrong even if the skill is good.

          **None of these is a reported problem.** They are the three ways the plan can be wrong, listed because no source lists them.
  - id: beyond
    image: cloak-of-flame
    title: Maps and beyond
    levels: Not published
    uses: >-
      Unknown. The published plan stops at level 69 and there is no second
      file, no gear progression and no endgame list.
    changes: >-
      If the skill works, the sensible next steps are the ones any Righteous
      Fire character takes: more maximum life, more fire resistance above the
      cap, ignite or burning scaling on the helmet, and a six-link.
      **That is our inference from the archetype, not from any source for
      this build.**
    moveOn: "there is nothing to move on to. This article will need rewriting within a week."
    details:
      - title: Why we published this anyway
        body: |
          Because two creators with large audiences pointed at the same new skill on the same day, and because the alternative — waiting until someone publishes a finished build — leaves the one genuinely new thing in Covens of Umbra undocumented during the week people are choosing what to play.

          What this page gives you is the complete set of what is known: one official sentence, one level-69 planner that models a different gem, a gem list with both ignite and non-ignite supports in it, two cheap uniques, and an ascendancy whose notables have not been written down. If that is not enough to commit a character to, that is the correct conclusion to draw from it.
      - title: Where to look in a week
        body: |
          Goratha's and Pohx's pages, both linked below, are the two that will be updated first. PoEDB will have a page for the gem once the data is extracted, and that will settle the duration and base damage questions in one go. Path of Building adding the gem is what will make any planner for this build meaningful.

patch:
  - entry: new-skills
    note: >-
      **This build is the patch note.** [[Fireball of Radiation]] is one of
      two skills added in 3.30 and the only one a solo player can use — the
      other, [[Arcane Link]], needs an allied player. The official
      description is one sentence long and no source has added to it. Our own
      changelog entry says plainly that nobody had tested it; that is still
      true.
  - entry: reliquarian-luminary
    note: >-
      **The ascendancy was rebuilt and the new notables are published only
      as pictures.** The notes say the [[Reliquarian]] notables "have been
      shuffled" and show four images, so the names are not in the text and
      we could not transcribe them. Any 3.29 Reliquarian guide is written for
      a different ascendancy. The [[Luminary]] change in the same entry —
      [[Golden Glory]] passing only half its Light Radius to Mercenary Link
      buffs — does not touch this build.
  - entry: ruthless-changes
    note: >-
      **Nothing here is Ruthless-only, but check anything you read about the
      Scion.** The Ruthless section adjusts about twenty ascendancy notables
      including the Ascendant's, and launch articles have been reprinting
      those as general changes. The Reliquarian reshuffle, by contrast, is
      in the normal-game section and is real.
  - note: >-
      **[[Righteous Fire]] itself was not changed**, and neither were
      [[Cloak of Flame]], [[Immortal Flesh]] or [[Fire Trap]], as far as two
      passes over the official notes and the Maxroll summary show. Read that
      as "not mentioned in the sources we read" rather than proven unchanged.
  - entry: item-tiers
    note: >-
      **Useful for a build that wears rare bases.** The published plan has
      exactly two uniques; everything else is a rare. Being able to read a
      Rare's tier off the ground from Act 6 makes that easier to put
      together.
  - entry: no-random-league-mechanics
    note: >-
      **Changes your early currency plan**, as it does for every starter
      this league. Ten mechanics appear only through Threads now.

strengths:
  - "It is the only build on this site using a skill that is new this league, which also means nobody has a head start on you."
  - "The published plan needs two cheap uniques and no chase item."
  - "The gem is not a trade item: transfigured skills come out of the Labyrinth."
  - "The Righteous Fire half of the build is a decade-old, well-understood engine for clearing maps."
  - "Both creators pointing at it are credible: Pohx on Righteous Fire specifically, Goratha on Reliquarian specifically."
  - "The ascendancy reshuffle is a genuine reason to look at the Scion this league rather than a habit."
weaknesses:
  - "No numbers exist for the main skill. None. Not even a PoEDB page."
  - "Path of Building cannot model it, so the author's own planner uses base Fireball instead."
  - "The planner stops at level 69. There is no map or endgame plan at all."
  - "The Reliquarian notables for this league are published only as images, so we cannot tell you what to take."
  - "The gem list contains both ignite supports and non-ignite supports, which means the author has not settled the basic question of how the skill scales."
  - "Neither source is a guide. Both are launch-day plans, and one of them is titled with a question mark."
  - "If the debuff turns out to be weak, the build has no single target and becomes a worse Righteous Fire character."
avoidIf: >-
  Pick something else if this is your first league, if you have limited time
  and need the character to work, or if you want to follow a written guide —
  there is no guide here, for anyone, yet. Pick the Righteous Fire Chieftain
  page on this site if the Righteous Fire playstyle is what appealed to you;
  it is the same engine with years of documentation behind it. Come here only
  if you actively want to be one of the people who finds out what the new
  skill does, and you are comfortable respeccing or rerolling if the answer
  is "not much".

