name: Fireball of Radiation Reliquarian
tagline: >-
  The one new skill in Covens of Umbra, used as the single target a Righteous
  Fire character has always lacked. It is a plan, not a tested build.
class: Scion
ascendancy: Reliquarian
role: starter
budget: starter
budgetNote: >-
  **Nothing here costs money and no source names a figure.** The published
  plan is a level-69 character wearing rare bases plus two cheap uniques,
  [[Cloak of Flame]] and [[Immortal Flesh]], both of which this site's
  Righteous Fire Chieftain page describes as a few chaos items. The new gem
  comes out of a Labyrinth Divine Font, not a trade window. Beyond level 69
  there is no published gear list and therefore no budget.
