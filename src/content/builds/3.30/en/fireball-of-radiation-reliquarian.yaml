confidenceNote: >-
  **This is the least proven build on the site and the rating is honest
  rather than modest.** [[Fireball of Radiation]] was added in 3.30. Path of
  Building has no data for it — the planner Goratha published uses *base*
  [[Fireball]] as a stand-in, so even his own numbers are not numbers for
  this skill. The only things we can quote with certainty are one line of
  the official patch notes and the gem's own text at level 20, which PoEDB
  now carries. Nobody has published a test of it. Two well-known creators
  are testing it: Goratha published a league-start plan on launch day with
  30,100 views, and Pohx — the Righteous Fire author — published "New Single
