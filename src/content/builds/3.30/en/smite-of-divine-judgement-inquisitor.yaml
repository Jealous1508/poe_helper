name: Smite of Divine Judgement Inquisitor
tagline: >-
  A strike that also calls lightning down on everything nearby, on a character
  whose life regeneration refills its energy shield too. It starts as a cheap
  Strength build and ends by turning maximum life into weapon damage.
class: Templar
ascendancy: Inquisitor
role: starter
budget: low
budgetNote: >-
  **The guide prints no prices.** It says only that its uniques are "usually
  incredibly cheap", and lists "Some Uniques May Be Expensive" among its own
  weaknesses. Two things must be bought straight after the campaign:
  [[Brutus' Lead Sprinkler]], which the author expects to cost a few
  [[Chaos Orb]]s, and later the transfigured gem. He also publishes a fallback
  for the case where the sceptre is expensive on day one. The endgame package
  ([[Foulborn Ghostwrithe]], [[Rathpith Globe]], a Timeless Jewel) has no
  figure attached anywhere in the guide, for any league.
mainSkill: Smite of Divine Judgement
image: asc-icon-inquisitor
hero: art-inquisitor
tags: [Melee, Strike, Lightning, Crit, Life stacking]
ratings: { clear: 4, bossing: 4, survivability: 4, ease: 2 }
verified: "2026-11-14"
confidence: mixed
confidenceNote: >-
  **The four ratings are ours**; the guide has no rating block. On currency of
  the source this is one of the better guides we used: its planner was saved
  on 12 November 2026 with the season field set to 3.30, and its changelog has
  two November entries, one of them reacting to a 3.30 nerf. But it was
  written in July 2026 for 3.29, its Path of Building file still uses the 3.29
  passive tree, and it is one author's work with no second guide to compare.
  The author says he played the same defensive shell in hardcore solo
  self-found two leagues ago. Nobody had played it in 3.30 when we read it.
  Every damage and life figure below comes from a 3.29-engine Path of
  Building file.
modes:
  ssf: >-
    The author's answer is "Definitely", and he played it that way himself.
    But he is clear that the early Atlas is different and that his written
    progression does not cover it. You cannot buy
    [[Brutus' Lead Sprinkler]], so you stay on [[Static Strike]] with a
    crit warstaff, which he says is good enough for Tier 16 maps, and farm
    Breach for the [[Foulborn Ghostwrithe]]. [[Rathpith Globe]] is a
    rarer drop; until you find one he suggests a two-handed
    [[Energy Blade]] variant. Two solo loadouts are in his file.
  hardcore: >-
    Better evidence than most builds here: the author played this shell in
    hardcore solo self-found in the Mirage league and links the character.
    The finished file has about 8,400 life, 2,900 energy shield, 75% attack
    block and 78% spell block. The guide itself is written for softcore trade
    and gives no hardcore-specific tree.

idea: |
  [[Smite of Divine Judgement]] is a melee strike with a second part: when you attack, lightning also strikes up to three enemies within 5 metres and damages an area around each. So one swing hits the monster in front of you and several others across the screen.

  The base skill says each target can only be hit once. The guide's trick is that the strike and the lightning are separate parts, and with good positioning the same boss takes both. That roughly doubles your single-target damage.

  [[Inquisitor]] does two jobs. Standing still creates Consecrated Ground, which regenerates life, and [[Pious Path]] makes that regeneration fill your energy shield as well. And once you crit reliably, [[Inevitable Judgement]] makes your critical strikes ignore enemy elemental resistances completely.

  You do not start with any of this. The campaign and the first maps are played with [[Static Strike]], as a Strength character with a two-handed mace. The transfigured gem comes in red maps. The life-stacking endgame, where your life total becomes your weapon's damage, comes after that.

chain:
  - label: Strike
    text: "A melee hit that converts half its physical damage to lightning. It attacks at 85% of your weapon's speed, so attack speed on gear matters."
  - label: Lightning strikes
    text: "Lightning hits up to three enemies within 5 metres, with area damage around each. Extra strike targets on gear spread it across the screen."
  - label: Ignore resistances
    text: "[[Righteous Providence]] turns Strength and Intelligence into crit chance. [[Inevitable Judgement]] makes crits ignore elemental resistances."
  - label: Regenerate twice
    text: "[[Sanctuary]] gives you Consecrated Ground when you stand still. [[Pious Path]] makes its life regeneration recover energy shield too, and makes it linger."

chainDetails:
  - title: Three builds in one character
    body: |
      The guide has five loadouts. They fall into three different engines, and it helps to know which one you are in.

      1. **Campaign: Strength and exerted hits.** [[Static Strike]] on a two-handed mace with [[Resolute Technique]], boosted by warcries.
      2. **Early and red maps: Strength as fire damage, and crit.** [[Brutus' Lead Sprinkler]] adds fire damage for every 10 Strength. [[Crown of Eyes]] and [[Iron Will]] count your Strength a second time. You stop using Resolute Technique and start to crit.
      3. **Endgame: life as lightning damage.** [[Foulborn Ghostwrithe]] sets your energy shield to 35% of your life, and [[Energy Blade]] turns energy shield into your weapon's damage. Strength stops mattering and life is everything.

      Each change is a respec and a new shopping list. That is why we rate ease at 2 out of 5.
  - title: How the double hit works
    body: |
      The author's explanation, from his FAQ.

      A modifier such as "Non-Vaal Strike Skills target 1 additional nearby Enemy" makes an image of an ancestor appear and strike a second enemy. It is not a minion. It is an extension of your own attack.

      Despite the gem's wording, one enemy can be hit by two *different parts* of the skill. So you stand slightly outside melee range. Your own strike misses the boss, but its lightning lands on it. The ancestor's strike hits the boss directly. One enemy, two hits.

      He adds that it is "pretty clear when you are doing it correctly", because you deal about twice the damage.

      This is why the first Eldritch implicit he asks for is the strike-target line on gloves. The Attack Mastery with the same text is already in the campaign tree.
  - title: Strength, counted twice
    body: |
      The second engine works like this.

      - [[Brutus' Lead Sprinkler]]: "Adds 4 to 7 Fire Damage to Attacks with this Weapon per 10 Strength".
      - [[Righteous Providence]]: +50 Strength and Intelligence, and 1% increased critical strike chance per point of whichever is lower.
      - [[Iron Will]]: Strength's damage bonus also applies to spell damage.
      - [[Crown of Eyes]]: increases to spell damage also apply to attack damage, at 150% of their value.

      So Strength gives its normal attack bonus, then gives it again as spell damage that the helmet turns back into attack damage, and adds flat fire damage through the sceptre. The guide calls Strength "an all-star stat" at this stage, and takes the notable Utmost Might for it.
  - title: Life, counted three times
    body: |
      The endgame engine replaces all of that.

      - [[Foulborn Ghostwrithe]], with one specific Foulborn modifier: "Your Maximum Energy Shield is Equal to 35% of Your Maximum Life".
      - [[Energy Blade]]: your sword's lightning damage is based on your energy shield, up to 40% of it at the top of the range. Normally the buff also gives 50% less maximum energy shield.
      - [[Rathpith Globe]]: 3% increased spell damage per 100 maximum life in the published file, which [[Crown of Eyes]] turns into attack damage.

      The body armour's line overrides Energy Blade's penalty. So more life means more energy shield, which means a bigger weapon, and more life also means more increased damage through the shield. Life is your hit points as well. One stat is doing three jobs, which is what the guide means by scaling offence and defence at the same time.
  - title: Consecrated Ground, and why it is always there
    body: |
      [[Sanctuary]] gives you Consecrated Ground while you are stationary. The guide's figures for the ground: 5% of life regenerated per second and 50% reduced effect of curses on you. Enemies standing on it take increased damage.

      [[Pious Path]] makes the effects linger for 4 seconds after you leave, and makes life regeneration also recover energy shield.

      The author's point is that you stop for a moment after every [[Leap Slam]], so in practice the effect never drops.

      With the notables Devotion and Shining Justice the guide quotes 8.75% of life per second and 87.5% reduced curse effect "as early as White Maps". A jewel with reduced curse effect later takes that to full immunity. Shining Justice also gives 30% increased accuracy while you are on the ground, which matters once [[Resolute Technique]] is gone.
  - title: Static Strike and the four-second rule
    body: |
      You play [[Static Strike]] for the whole campaign and the first maps, so its one rule is worth learning.

      After a hit, static energy leaves your character for 4 seconds and strikes nearby enemies many times. The game treats all of that as one attack. So if you shout [[Intimidating Cry]] first, every beam for those 4 seconds is exerted and deals double damage. [[Rallying Cry]] adds to it.

      The rule: **do not hit again until the 4 seconds are over.** A new hit replaces the exerted static with ordinary static.

      One trap: [[Leap Slam]] is an attack and will use up the exert. From early maps the guide has you craft "Warcries cannot Exert Travel Skills" on a ring, and calls it very important.

mandatory:
  - term: Smite of Divine Judgement
    why: >-
      The main skill from red maps onward. Lightning strikes three targets
      instead of one, with more area damage, and it drops the aura the base
      gem has.
    detail: >-
      It is a transfigured gem. The guide says to farm the Merciless Labyrinth
      for it or buy it. The author does not treat it as build-defining: his
      FAQ says the same defensive shell works with any melee skill you prefer.
  - term: Static Strike
    why: >-
      What you actually play from level 12 until red maps. A quest reward from
      The Siren's Cadence.
  - term: Sanctuary
    why: >-
      Consecrated Ground while you stand still: regeneration, curse
      reduction, and enemies on it take 15% increased damage.
  - term: Pious Path
    why: >-
      Life regeneration also recovers energy shield, and the ground's effects
      linger for 4 seconds. This is the build's recovery, and it is why your
      golem and spectres survive with no minion passives.
  - term: Righteous Providence
    why: >-
      +50 Strength and Intelligence and a large amount of crit chance. The
      guide pairs it with the sceptre below.
  - term: Inevitable Judgement
    why: >-
      Critical strikes ignore enemy elemental resistances. The guide says crit
      chance is capped by red maps, so in practice every hit does.
  - term: Brutus' Lead Sprinkler
    why: >-
      The weapon for early and red maps. Fire damage for every 10 Strength.
      The guide's "immediate priority after finishing the Campaign".
    detail: >-
      It needs level 28 only. If it is expensive on the first day, the guide
      has you stay on [[Static Strike]] with a warstaff until you can afford
      it. If you must choose between the sceptre and the transfigured gem, buy
      the sceptre first.
  - term: Crown of Eyes
    why: >-
      Spell damage applies to attacks at 150%, plus life and mana leech. The
      guide's second purchase. Note the −30% fire resistance on it.
  - term: Iron Will
    why: >-
      Strength's damage bonus also applies to spell damage, which
      [[Crown of Eyes]] passes on to your attacks.
  - term: Foulborn Ghostwrithe
    why: >-
      Sets energy shield to 35% of maximum life. The guide calls it mandatory
      for the endgame setup.
    detail: >-
      It must have exactly one Foulborn modifier, and it must be that one. In
      solo self-found the author farms Breach for it.
  - term: Energy Blade
    why: >-
      Turns your one-handed sword into a lightning weapon scaled by energy
      shield. Only worth using together with the body armour above.
  - term: Rathpith Globe
    level: recommended
    why: >-
      Increased spell damage per 100 maximum life, 10% more life, and spell
      block. Joins in red maps, before the life-stacking setup.
  - term: Multistrike Support
    level: recommended
    why: >-
      Smite attacks at 85% of base speed. Multistrike and attack speed on
      gear are what make it feel good.
  - term: Raise Spectre
    level: recommended
    why: >-
      In the endgame, for one spectre the guide calls mandatory: the Perfect
      Spirit of Fortune, which makes your lightning damage lucky. The author
      values that at about 40% more damage.
  - term: Glorious Vanity
    level: recommended
    why: >-
      The Doryani version, for the keystone [[Corrupted Soul]]. It splits
      incoming damage between life and energy shield, which the author says
      effectively doubles your recovery.
  - term: Ralakesh's Impatience
    level: recommended
    why: >-
      Paired with [[Arn's Anguish]] in the first endgame setup. Nerfed in
      3.30; see What 3.30 changed.

labs:
  - lab: Normal
    node: Sanctuary
    why: "Consecrated Ground whenever you stand still: regeneration and curse reduction through the campaign, and enemies on it take more damage."
  - lab: Cruel
    node: Pious Path
    why: "The ground's effects linger, and regeneration fills energy shield. The guide notes it also keeps your Lightning Golem alive."
  - lab: Merciless
    node: Righteous Providence
    why: "+50 Strength and Intelligence and crit chance. Take it before you buy Brutus' Lead Sprinkler, which is the item it is paired with."
  - lab: Eternal
    node: Inevitable Judgement
    why: "Crits ignore elemental resistances. The guide tells you to swap Fire Penetration Support for Elemental Damage with Attacks Support the moment you have it."

stages:
  - id: acts-1-3
    phase: early
    image: ground-slam
    title: Acts 1–3
    levels: Level 1–33
    uses: >-
      [[Ground Slam]] through Act 1, then [[Static Strike]] from level 12 on a
      two-handed mace. [[Smite]] sits in a spare socket and is pressed once
      per boss.
    changes: >-
      In Act 2 [[Shockwave Support]] joins the link, and from then on your
      weapon must be a mace or a warstaff. [[Intimidating Cry]] arrives for
      exerted hits. Normal Labyrinth gives you [[Sanctuary]].
    links:
      - name: Early Act 1
        gems: [Ground Slam, Chance to Bleed Support, Ruthless Support]
      - name: Level 12
        gems: [Static Strike, Chance to Bleed Support, Ruthless Support]
      - name: Act 2
        gems: [Static Strike, Shockwave Support, Melee Physical Damage Support]
      - name: Movement
        gems: [Leap Slam, Faster Attacks Support, Frostblink]
      - name: Auras and heralds
        gems: [Precision, Clarity, Herald of Ash, Herald of Purity]
      - name: Extras
        gems: [Smite, Intimidating Cry, Holy Flame Totem, Summon Phantasm Support]
    moveOn: "Static Strike with Shockwave is in a three- or four-link, and you have Sanctuary."
    details:
      - title: The first hour
        body: |
          From the guide's notes: the Templar starts with Holy Strike. Use it to kill Hailrake, take [[Ground Slam]], and use that for the rest of Act 1 until the Cavern of Wrath.

          [[Static Strike]] needs level 12 and is a reward for The Siren's Cadence.

          [[Smite]] here is the base gem. Hitting an enemy with it grants an aura of added lightning damage for 4 seconds. The guide's advice is to use it once at the start of a boss fight for free damage.
      - title: What to look for on gear
        body: |
          - "Your primary concern in the Campaign is getting as much damage on your weapon as possible." Physical is ideal; elemental is fine early.
          - Hybrid armour and energy shield bases, to use both kinds of recovery.
          - From level 12, only maces or warstaves, because of [[Shockwave Support]].
          - After Piety in Act 3 the crafting bench can add lightning damage to attacks on gloves, amulet and rings. The guide calls that a big boost.
      - title: The tree, and one mastery you must not skip
        body: |
          [[Resolute Technique]] is in the campaign tree, so accuracy is not a concern yet.

          The guide's warning: the Attack Mastery "Non-Vaal Strike Skills target 1 additional nearby Enemy" is "crucial" for Static Strike. "Don't skip it!"

          Attributes are the usual friction on a Templar who needs all three. The guide says to solve them on gear, to take an attribute notable temporarily if you must, and to leave [[Blood Rage]] and [[Elemental Weakness]] at a lower level if you cannot meet their requirements.
      - title: Bandits and Pantheon
        body: |
          Help **Alira** during the campaign. Later, with good gear, change to killing all three.

          Pantheon: **Soul of Lunaris** and **Soul of Ralakesh**.
  - id: acts-4-10
    phase: early
    image: static-strike
    title: Acts 4–10
    levels: Level 33–68
    uses: >-
      [[Static Strike]] in a four-link, exerted with [[Intimidating Cry]] and
      [[Rallying Cry]]. [[Summon Lightning Golem]] for mana and attack speed.
    changes: >-
      Cruel Labyrinth gives [[Pious Path]]. Two masteries change your links:
      the Fortify Mastery lets [[Fortify Support]] leave, and the Fire Mastery
      lets [[Trinity Support]] in.
    links:
      - name: Act 5
        gems: [Static Strike, Shockwave Support, Fortify Support, Melee Physical Damage Support]
      - name: Act 10
        gems: [Static Strike, Shockwave Support, Melee Physical Damage Support, Trinity Support]
      - name: Movement and aura skill
        gems: [Leap Slam, Faster Attacks Support, Smite, Momentum Support]
      - name: Warcries
        gems: [Intimidating Cry, Rallying Cry, Urgent Orders Support, Blood Rage]
      - name: Heralds and auras
        gems: [Herald of Ash, Herald of Purity, Flesh and Stone, Arctic Armour]
      - name: Golem and curse
        gems: [Summon Lightning Golem, Elemental Army Support, Elemental Weakness, Frostblink]
    moveOn: "Kitava is dead and resistances are repaired. Run the Merciless Labyrinth for Righteous Providence before you buy the sceptre."
    details:
      - title: The order of the two masteries
        body: |
          1. Take the Fortify Mastery "Melee Hits Fortify". Now [[Fortify Support]] is redundant.
          2. For the short gap that follows, the guide puts [[Elemental Damage with Attacks Support]] in its place.
          3. Take the Fire Mastery "40% of Physical Damage Converted to Fire Damage". The guide says this is "necessary to enable [[Trinity Support]]". Swap Trinity in.

          If Trinity seems to do nothing, you skipped step 3.
      - title: Boss routine in the campaign
        body: |
          The guide's single-target rotation: [[Intimidating Cry]] and [[Rallying Cry]], then one [[Static Strike]] at once, then keep [[Elemental Weakness]] and the [[Smite]] aura up while the static does its 4 seconds of work.

          "Be sure to immediately use Static Strike after the Warcries." And remember that [[Leap Slam]] can eat the exert.
      - title: Small notes from the guide
        body: |
          - [[Summon Lightning Golem]] stays alive because of your Consecrated Ground, "fixing your mana sustain and providing some nice Attack Speed".
          - Be in Sand Stance for [[Flesh and Stone]].
          - Respec the starting nodes once you have the notables Spiritual Aid and Spiritual Command.
      - title: Gems to level in your weapon swap
        body: |
          After you have helped Lilly Roth in Act 6, the guide has you buy these and level them in the second weapon set, ready for maps: [[Fire Penetration Support]], [[Increased Critical Damage Support]], [[Multistrike Support]], [[Purity of Elements]], [[Tempest Shield]] and [[Assassin's Mark]].
  - id: early-maps
    phase: early
    image: crown-of-eyes
    title: Early maps
    levels: White and yellow maps
    uses: >-
      [[Brutus' Lead Sprinkler]] and a shield, then [[Crown of Eyes]]. Still
      [[Static Strike]], now as a crit build.
    changes: >-
      [[Resolute Technique]] comes off the tree and [[Iron Will]] goes on.
      The Eternal Labyrinth gives [[Inevitable Judgement]].
      [[Intimidating Cry]] moves onto [[Autoexertion]], so it shouts by
      itself.
    links:
      - name: Main skill
        gems: [Static Strike, Shockwave Support, Increased Critical Damage Support, Fire Penetration Support, Elemental Focus Support]
      - name: Auras
        gems: [Flesh and Stone, Purity of Elements, Tempest Shield, Blood Rage]
      - name: Precision on life
        gems: [Precision, Arrogance Support]
      - name: Movement and warcry
        gems: [Leap Slam, Faster Attacks Support, Autoexertion, Intimidating Cry]
      - name: Golem
        gems: [Summon Lightning Golem, Minion Life Support, Meat Shield Support]
      - name: Mark and blink
        gems: [Assassin's Mark, Mark On Hit Support, Frostblink]
      - name: Recall the golem
        gems: [Automation, Convocation]
    moveOn: "you have the sceptre, the helmet, attack speed on gloves and jewels, and the transfigured gem in hand."
    details:
      - title: Why you are still on Static Strike
        body: |
          The author changed this on purpose. His changelog entry: he moved early mapping "to stay on Static Strike, as swapping to Smite of Divine Judgement without sufficient Attack Speed can feel bad".

          So do not rush the gem into your links. Buy it when you can, and switch when the attack speed is there. The thresholds are in the next stage.
      - title: The guide's shopping order
        body: |
          1. [[Brutus' Lead Sprinkler]], "with any Chaos Orbs you have found". The campaign setup is strong enough for white maps if you have to wait.
          2. [[Crown of Eyes]].
          3. Strength and attack speed on every rare piece, with resistances capped.
          4. On one ring, craft "Warcries cannot Exert Travel Skills". "It is very important."
          5. A Prismatic Tincture with elemental damage, for tanky rares and bosses.

          [[Carnage Heart]], [[Alberon's Warpath]] and a Foulborn Meginord's Girdle appear in the example gear. The guide says they "are not necessary to swap to this setup": use rares with Strength, life and resistances until you can afford them.
      - title: Three small rules
        body: |
          - **No life on the body armour.** The tree takes the Life Mastery "15% increased maximum Life if there are no Life Modifiers on Equipped Body Armour".
          - **[[Arrogance Support]] goes on [[Precision]] only.** "Do NOT link Arrogance Support to any Auras besides Precision."
          - **Anoint Smashing Strikes** on the amulet for endurance charges. The guide offers Weapon Artistry instead if you are short of attack speed. One caution from us: the live tree text for Smashing Strikes gives its endurance charge on melee crits generally, but its damage lines are for staves. That fits his warstaff fallback better than a sceptre.
      - title: Jewels
        body: |
          "Your main priority on jewels is Attack Speed, followed by Strength."

          Increased attack speed with maces is the best line; attack speed while holding a shield is also good. If such jewels are cheap, the guide says to take the jewel sockets earlier than its tree shows.
      - title: If the sceptre is expensive on day one
        body: |
          This is the guide's own first FAQ. You keep playing [[Static Strike]], but swap from maces to warstaves straight after the Merciless Labyrinth. A separate file shows that setup at yellow maps and at Tier 16.

          **That fallback file was saved in July 2026**, so it is plain 3.29.
  - id: red-maps
    phase: endgame
    image: rathpith-globe
    title: Red maps
    levels: Tier 11–16 maps
    uses: >-
      [[Smite of Divine Judgement]] in a six-link, [[Rathpith Globe]] in the
      off hand, gloves with an extra strike target, and
      [[The Magnate]].
    changes: >-
      The main skill finally changes. [[Vaal Smite]] with
      [[More Duration Support]] takes over the aura job.
      [[Summon Ice Golem]] replaces the Lightning Golem for accuracy.
      [[Damage on Full Life Support]] joins, with a mastery that makes it work.
    links:
      - name: Main skill
        gems: [Smite of Divine Judgement, Multistrike Support, Increased Critical Damage Support, Elemental Damage with Attacks Support, Elemental Focus Support, Damage on Full Life Support]
      - name: Auras
        gems: [Flesh and Stone, Purity of Elements, Tempest Shield, Blood Rage]
      - name: Precision on life
        gems: [Precision, Arrogance Support]
      - name: Movement and aura skill
        gems: [Leap Slam, Faster Attacks Support, Vaal Smite, More Duration Support]
      - name: Golem
        gems: [Summon Ice Golem, Minion Life Support, Meat Shield Support]
      - name: Mark and blink
        gems: [Assassin's Mark, Mark On Hit Support, Frostblink]
      - name: Recall the golem
        gems: [Automation, Convocation]
    moveOn: "Tier 16 maps are comfortable and you own a Foulborn Ghostwrithe with the right modifier."
    details:
      - title: Attack speed before the gem
        body: |
          The guide's wording is strong: it is "heavily recommended" that you have increased attack speed on these before you swap:

          - 12% or more on your gloves.
          - 6% or more on every jewel.

          And again in the skills notes: Smite of Divine Judgement "requires sufficient Attack Speed on your Gear/Passive Tree to feel good, do not neglect this!"

          PoEDB gives the reason. The gem attacks at 85% of your weapon's base speed.
      - title: What changes on gear
        body: |
          - **Gloves:** the Eldritch implicit "Non-Vaal Strike Skills target 1 additional nearby Enemy" is "your first priority" among implicits.
          - **Off hand:** [[Rathpith Globe]]. The guide says its increased spell damage has "great synergy" with [[Crown of Eyes]].
          - **Belt:** [[The Magnate]]. You easily meet its Strength requirement by now; "grab it if it isn't too expensive".
          - **Body armour:** the example adds "+1% to all maximum Resistances" and "1% less Damage Taken per 230 Strength" as implicits.
      - title: Two masteries for this stage
        body: |
          - The Life Mastery "You count as on Full Life while at 90% of maximum Life or above". Without it [[Damage on Full Life Support]] switches off at the first scratch.
          - The notable Aggressive Bastion, which the guide uses as "a consistent source of Endurance Charges while mapping".

          Also get "Reduced Effect of Curses on You" on one jewel. With your Consecrated Ground that makes you effectively immune to curses, and the guide then drops the Protection Mastery.
      - title: The golem swap is optional
        body: |
          [[Summon Ice Golem]] is there because accuracy is harder to find at this stage. "If your gear has sufficient Accuracy without it, keep using Summon Lightning Golem."
  - id: life-stacking
    phase: endgame
    image: energy-blade
    title: The Foulborn Ghostwrithe setup
    levels: Tier 16–17 maps and pinnacle bosses
    uses: >-
      [[Foulborn Ghostwrithe]], [[Energy Blade]] on a one-handed sword with an
      Abyssal socket, [[Rathpith Globe]], [[Ralakesh's Impatience]] with
      [[Arn's Anguish]], and two spectres.
    changes: >-
      Strength gear goes; life goes on everything. [[Eternal Youth]] joins
      [[Iron Will]] on the tree. [[Volatility Support]] replaces
      [[Elemental Focus Support]]. A Timeless Jewel adds
      [[Corrupted Soul]].
    links:
      - name: Main skill
        gems: [Smite of Divine Judgement, Volatility Support, Multistrike Support, Elemental Damage with Attacks Support, Increased Critical Damage Support, Damage on Full Life Support]
      - name: Weapon buff
        gems: [Energy Blade, Enhance Support, Blood Rage]
      - name: Auras
        gems: [Purity of Elements, Flesh and Stone, Tempest Shield]
      - name: Precision on life
        gems: [Precision, Arrogance Support]
      - name: Spectres
        gems: [Raise Spectre, Minion Life Support, Meat Shield Support]
      - name: Mark and movement
        gems: [Assassin's Mark, Mark On Hit Support, Leap Slam, Faster Attacks Support]
      - name: Recall the spectres
        gems: [Automation, Convocation]
    moveOn: "there is one more step, and it is the expensive one."
    details:
      - title: What the published character looks like
        body: |
          The Path of Building file was saved with this loadout active, so these are its numbers:

          - 8,357 life and 2,925 energy shield. The second is exactly 35% of the first.
          - 75% attack block and 78% spell block.
          - Resistances 79/78/79, chaos 75%.
          - About 1,280 life and 1,280 energy shield regenerated per second.
          - Largest hit survived: 23,725 physical, between 92,000 and 96,000 of each element, 50,584 chaos.
          - 28.3 million damage per second, counting the strike, the area hit and culling together.

          **This file uses the 3.29 passive tree and the author's own enemy settings.** The damage figure also assumes you land the double hit every time. The guide's introduction promises a combined pool "of over 12,000"; the file shows about 11,300.
      - title: The pieces, and the two warnings attached
        body: |
          - [[Foulborn Ghostwrithe]] with **only** the modifier "Your Maximum Energy Shield is Equal to 35% of your Maximum Life".
          - Any one-handed sword with an Abyssal socket. The socket survives when [[Energy Blade]] transforms the weapon.
          - "As much Life as possible on all of your gear, this scales your defense AND offense."
          - [[Ralakesh's Impatience]], the endurance charge version, and [[Arn's Anguish]]. "You can use Ralakesh without Arn's, DO NOT use Arn's without Ralakesh."
          - Elemental resistances overcapped by 25%, to absorb exposure. Chaos resistance does not need overcapping.
          - Increased life regeneration rate, which the guide calls "a very powerful stat for this build".
          - [[Enhance Support]] on Energy Blade: "an enormous amount of attack speed, even a Level 3 is worth using".
      - title: Spectres
        body: |
          They survive without minion passives because of your Consecrated Ground.

          - **Perfect Spirit of Fortune: mandatory.** It gives the Wrath aura and "Your Lightning Damage is Lucky", which the author puts at about 40% more damage. He notes it suits Energy Blade's wide damage range and [[Volatility Support]].
          - **Second spectre, your choice.** Perfect Forest Warrior: Onslaught and Culling Strike, very cheap. Perfect Guardian Turtle: Determination and extra physical damage reduction. Perfect Forest Tiger: Haste and frenzy charges, but fragile.
      - title: Jewels and the Timeless Jewel
        body: |
          - [[Glorious Vanity]] must read "in the name of Doryani", for [[Corrupted Soul]]. Look for a seed with the notable Blood-Quenched Bulwark, or with life or spell block notables.
          - [[Watcher's Eye]]: the modifier that matters is increased attack speed while affected by Precision.
          - A Foulborn [[The Red Dream]] for life and fire resistance.
          - Rare jewels: increased maximum life, and attack speed with swords or while holding a shield. One of them needs reduced curse effect.
          - A small cluster with Enduring Composure "solves your Endurance Charge generation".
      - title: Corrupted Soul shows no energy shield, and that is fine
        body: |
          From the FAQ. The body armour overrides most other modifiers to maximum energy shield, so the keystone's bonus does not appear.

          It is still worth taking. Normally only your energy shield takes damage, so your life regeneration has nothing to refill and is wasted. Corrupted Soul sends part of each hit to life, and both regenerations work at once.
  - id: endgame
    phase: endgame
    image: mageblood
    title: Aspirational
    levels: Uber bosses and beyond
    uses: >-
      [[Mageblood]], [[Zana's Ingenuity]], [[Progenesis]],
      [[Melding of the Flesh]], large cluster jewels, and
      [[Greater Multistrike Support]].
    changes: >-
      Maximum resistances go to 90%. [[Ralakesh's Impatience]] leaves the
      build, because of the 3.30 nerf. Imbued support effects free passive
      points. This is a wish list more than a milestone.
    links:
      - name: Main skill
        gems: [Smite of Divine Judgement, Volatility Support, Elemental Damage with Attacks Support, Increased Critical Damage Support, Damage on Full Life Support, Greater Multistrike Support]
      - name: Weapon buff
        gems: [Energy Blade, Enhance Support, Blood Rage]
      - name: Auras
        gems: [Purity of Elements, Flesh and Stone, Tempest Shield, Enlighten Support]
      - name: Spectres
        gems: [Raise Spectre, Minion Life Support, Meat Shield Support]
    moveOn: "there is no next stage."
    details:
      - title: What each item is for
        body: |
          - [[Mageblood]] "heavily frees up Suffix pressure and allows you to reach 90% Maximum Elemental Resistances". It also gives a better form of Onslaught, so the second spectre becomes the Perfect Guardian Turtle.
          - [[Zana's Ingenuity]]: the modifier that matters most is "Elemental Resistance Cannot Be Penetrated". It should also carry life and attack speed.
          - [[Melding of the Flesh]] caps all three resistances at 90% without three resistance flasks, which lets you run a [[Silver Flask]] and a [[Diamond Flask]] instead.
          - [[Progenesis]]: "incredible for any Life-based build".
          - A [[Megalomaniac]] with Enduring Composure, for endurance charges now that Ralakesh's is gone.
          - Large cluster jewels for attack speed and resistances.
          - Mirrored Heist jewellery for raw power.
      - title: Imbued gems
        body: |
          - On the main skill: a Fortify effect is "the best Imbue", and saves 5 passive points. Alternatives if it is too expensive: Endurance Charge on Melee Stun, Cruelty, or Increased Critical Strikes.
          - On [[Tempest Shield]]: Culling Strike, which the guide admits "may be inconsistent at times".
          - On [[Assassin's Mark]]: Mark On Hit, which frees a socket for [[Enlighten Support]] and lets you drop a whole reservation wheel.
      - title: Corrupting the two core items
        body: |
          The guide's last step is to corrupt [[Rathpith Globe]] and [[Foulborn Ghostwrithe]] with a Volatile Vaal Orb to raise their roll ranges, using a Tailoring Orb on the body armour first for increased effect of its defence modifiers.

          It does not say what a failed corruption costs you. Do not do this to your only copy.

powerCurve: |
  This build's power does not grow along one line. It changes source twice.

  **At level 30** your damage is a big two-handed mace, [[Static Strike]]'s static energy, and a warcry that doubles it. Defence is life, armour and standing on your own Consecrated Ground. It is a sturdy, ordinary melee character, and none of the items that define the build exist yet.

  **At level 70** you swap engines in an afternoon. [[Righteous Providence]] and [[Inevitable Judgement]] come from the last two labs, which the guide's trees take after the campaign, and [[Brutus' Lead Sprinkler]] and [[Crown of Eyes]] are bought. Now three things multiply each other: Strength (as fire damage, and twice as increased damage), critical strikes, and ignoring resistances. This is the first sudden jump, and it is cheap. It is the reason the build works as a starter.

  **Around level 85–90** you change the skill, not the engine: [[Smite of Divine Judgement]] and a strike-target implicit. Clear and single target both rise, but only if attack speed is already there.

  **At level 95** you swap engines again. Life replaces Strength. [[Foulborn Ghostwrithe]] and [[Energy Blade]] turn life into weapon damage, [[Rathpith Globe]] turns it into increased damage, and the spectre's lucky lightning damage multiplies the result. Defence grows with the same purchases, because the stat you are stacking is your health.

  **Our reading, not the author's:** the curve is two steps and two plateaus. It feels slow in the acts, sudden at the first maps, flat through yellow maps while you collect attack speed, and sudden again at the end. A player who dislikes the flat parts should know they are where the next jump is being paid for.

upgrades:
  - step: "[[Brutus' Lead Sprinkler]], and a shield"
    why: >-
      First because everything in the second engine multiplies it. It needs
      only [[Righteous Providence]] and the Strength you already have. The
      guide: buy it "with any Chaos Orbs you have found".
    cost: "No figure given. The author says only that an expensive one is \"very unlikely\", which is a 3.29 expectation."
  - step: "[[Crown of Eyes]]"
    why: >-
      The guide's next purchase. With [[Iron Will]] it counts your
      Strength bonus a second time at 150%, and it adds life and mana leech.
      It comes after the sceptre because without flat fire damage there is
      little for it to multiply.
  - step: "Strength and attack speed on rares, and the ring craft for warcries"
    why: >-
      Strength is damage and crit at this stage, and attack speed is the
      entry ticket for the next step. The ring craft stops [[Leap Slam]]
      eating your exerted hit. Cheap, and it removes a constant small loss.
  - step: "[[Smite of Divine Judgement]], with the strike-target implicit on gloves"
    why: >-
      Only now, once gloves have 12% attack speed and each jewel has 6%.
      Bought earlier it makes the character feel worse; the author moved it
      later in his own guide for that reason.
  - step: "[[Rathpith Globe]] and [[The Magnate]]"
    why: >-
      More increased damage through the helmet, 10% life, spell block. Below
      the gem because the gem changes how many enemies each swing hits, and
      these only make each hit bigger.
  - step: "[[Foulborn Ghostwrithe]], [[Energy Blade]] and an Abyssal one-handed sword, together"
    why: >-
      The second engine swap. It is one purchase in three parts: without the
      body armour, Energy Blade halves your energy shield and you gain
      little. It is this late because your gear has to be re-bought for life
      at the same time.
  - step: "[[Ralakesh's Impatience]] with [[Arn's Anguish]], then the Doryani [[Glorious Vanity]]"
    why: >-
      Charges without generating them, a large life belt, and
      [[Corrupted Soul]] to put your life regeneration to work. They refine
      the engine; they do not start it.
  - step: "[[Mageblood]], [[Zana's Ingenuity]], imbued gems"
    why: >-
      Last because each costs more than everything above combined and adds
      less. The guide names this loadout Aspirational.

play:
  mapping: |
    [[Leap Slam]] to the next pack. You land, and for that moment you are stationary, so your Consecrated Ground appears and its effects linger behind you.

    One or two swings of [[Smite of Divine Judgement]]. Do not chase individual monsters: the lightning picks up to three targets within 5 metres of each strike, and each extra strike target does the same again.

    Keep [[Blood Rage]] running. That is the whole rotation in the guide: the skill, and "maintain" beside Blood Rage.

    [[Automation]] with [[Convocation]] pulls your golem or spectres back to you without a key press. The mark is applied by your hits.

    **Before red maps** the loop is different: one [[Static Strike]], then move while the static energy clears for 4 seconds. [[Intimidating Cry]] shouts by itself through [[Autoexertion]].
  bossing: |
    Position first. Stand slightly outside your own melee range, so your strike's lightning and your ancestor's strike both land on the boss. If your damage halves, you have drifted too close or too far.

    Switch the tincture on. The guide keeps it for "tanky Rares and Bosses". Use [[Vaal Smite]] for its aura when it is charged.

    Then stay put as much as the fight allows. Your regeneration, your curse protection and the 15% increased damage enemies take all come from ground that only appears while you are stationary, and lingers for 4 seconds after.

    **The tension in the build** is exactly that. It wants you to stand still, at one precise distance, in melee, against bosses designed to make you move. The 4-second linger and the block are what make it workable. That framing is ours; the guide describes the pieces, not the conflict.

    In the campaign and early maps the boss routine is the exert: both warcries, one hit, and hands off for 4 seconds.

deaths:
  - situation: "A map where players cannot regenerate life, mana or energy shield, or have less recovery rate."
    cause: >-
      Regeneration is your recovery for both pools. The leech from
      [[Crown of Eyes]] is a small supplement and [[Eternal Youth]] halves it.
    fix: >-
      Both modifiers are on the guide's avoid list. Reroll the map.
  - situation: "A map with elemental reflect."
    cause: >-
      Your crits ignore resistances and Energy Blade's hits are very large.
      Reflected, they come back at you.
    fix: >-
      First on the guide's avoid list. Never run it.
  - situation: "Fire damage, shortly after you put on Crown of Eyes."
    cause: >-
      The helmet has −30% fire resistance. This is our warning from the item
      text; the guide says only to keep resistances capped.
    fix: >-
      Check your fire resistance in town after equipping it. The example gear
      fixes it with a crafted ring and, later, the Foulborn
      [[The Red Dream]].
  - situation: "Reduced chance to block, or reduced effect of non-curse auras."
    cause: >-
      Block is a main layer (75% and 78% in the finished file), and
      [[Purity of Elements]], [[Tempest Shield]] and [[Precision]] are auras.
    fix: >-
      Both are on the guide's avoid list, along with less accuracy rating.
  - situation: "The Energy Blade setup, put on in pieces."
    cause: >-
      [[Energy Blade]] alone gives 50% less maximum energy shield. Without
      the body armour's override you lose defence and gain a weak weapon.
    fix: >-
      Own all of it before you swap. The guide calls
      [[Foulborn Ghostwrithe]] "mandatory to swap to this setup".

troubleshooting:
  - symptom: "It is day one and Brutus' Lead Sprinkler is expensive."
    cause: >-
      Everyone following the guide wants the same sceptre in the same hour.
    fix: >-
      The guide's own answer: stay on [[Static Strike]], move to a warstaff
      after the Merciless Labyrinth, and follow the fallback file. If you can
      afford only one of the sceptre and the gem, buy the sceptre.
  - symptom: "I switched to Smite and it feels worse than Static Strike."
    cause: >-
      Attack speed. The gem swings at 85% of base speed.
    fix: >-
      Go back to Static Strike until gloves have 12% attack speed and every
      jewel has 6%. That is the guide's stated threshold.
  - symptom: "My boss damage is about half of what the guide shows."
    cause: >-
      You are landing one part of the skill instead of two. The published
      damage counts the strike and the area hit together.
    fix: >-
      Stand slightly outside melee range. The author says you will see the
      difference immediately when it works.
  - symptom: "My exerted Static Strike is not hitting hard."
    cause: >-
      Either [[Leap Slam]] used the exert, or you attacked again inside the
      4 seconds and replaced the exerted static.
    fix: >-
      Craft "Warcries cannot Exert Travel Skills" on a ring, and hit once per
      shout.
  - symptom: "Damage on Full Life Support does nothing."
    cause: >-
      You are almost never at exactly full life in a fight.
    fix: >-
      The Life Mastery "You count as on Full Life while at 90% of maximum Life
      or above". The guide flags it for this support by name.
  - symptom: "I miss more since I dropped Resolute Technique."
    cause: >-
      From early maps accuracy is your problem again.
    fix: >-
      The notable Shining Justice (30% increased accuracy on your ground),
      [[Precision]], accuracy on gloves, and the guide's swap to
      [[Summon Ice Golem]].

patch:
  - note: >-
      **The skills and the ascendancy were not touched.** Smite, Static
      Strike, Energy Blade and Inquisitor do not appear in the 3.30 notes, in
      any section. The author's own changelog confirms he checked: both of his
      November entries are about items.
  - entry: ralakeshs-impatience
    note: >-
      **A real nerf to one endgame item, and the author has already
      answered it.** New [[Ralakesh's Impatience]] boots take away one
      maximum charge of one type. His 12 November entry: the nerf "makes it a
      bit rough to use now without Arn's", so he removed the boots from the
      Aspirational loadout and kept them in the cheaper endgame setup, paired
      with [[Arn's Anguish]], as still "inexpensive and efficient".
  - entry: no-random-league-mechanics
    note: >-
      **The body armour the endgame depends on comes from Breach**, and Breach
      no longer appears in maps by itself. You need Breach Threads, or a
      seller. Expect [[Foulborn Ghostwrithe]] supply to work differently from
      last league; nobody has a price yet.
  - entry: golem-buff-nerfs
    note: >-
      **Small.** [[Summon Lightning Golem]] gives 8% attack and cast speed,
      down from 10%. You use it from Act 5 until red maps, on a build that
      wants attack speed.
  - entry: special-base-implicits
    note: >-
      **Small.** The example rings up to red maps are Amethyst Rings, whose
      implicit drops to +13–19% chaos resistance from +17–23%.
  - entry: royal-visage-soul-cores
    note: >-
      **The imbued gems in the last loadout carry a new risk.** The items
      that add a support effect to a gem are now Soul Cores and can roll a
      bad effect. The guide's list of good outcomes was written before that.
  - entry: league-fates
    note: >-
      **Probably a good fit, with a catch.** A harder area boss suits a build
      with this much recovery and a strong single-target trick. The catch is
      that added hazards mean more moving, and this build is best standing
      still. That is our reading, and it is untested.

strengths:
  - "Recovery with no conditions: regeneration fills life and energy shield together, and curses barely affect you."
  - "Crits ignore elemental resistances, so resistant monsters and map modifiers do not slow it."
  - "One swing hits the target and several other enemies around the screen."
  - "Block, fortify, blind and a large pool, layered."
  - "The first jump in power is cheap: one sceptre and one helmet."
  - "Offence and defence scale from the same stat at the end."
  - "A guide whose author is still editing it for 3.30."
weaknesses:
  - "Three different engines and two real respecs between level 68 and 95."
  - "The main skill is a transfigured gem you do not use until red maps."
  - "The double hit needs exact positioning, in melee."
  - "Feels bad without attack speed; the author says so more than once."
  - "The endgame depends on one body armour with one exact modifier, from a mechanic that 3.30 made harder to reach."
  - "No prices anywhere in the guide, and no second source."
avoidIf: >-
  Pick something else if you want one build from level 1 to the end. This is
  three, and each change means selling gear and refunding passives. Skip it if
  you do not want to learn a positioning trick to get your full damage, or if
  you dislike standing still. And if you want the endgame version without the
  journey, check first that you can actually get a
  [[Foulborn Ghostwrithe]] with the right modifier.

