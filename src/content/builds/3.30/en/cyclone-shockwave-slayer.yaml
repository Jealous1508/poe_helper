name: Cyclone Shockwave Slayer
tagline: >-
  You hold one button and spin. Every few hits a shockwave bursts out of the
  enemy you are touching, and the leech never stops.
class: Duelist
ascendancy: Slayer
role: starter
budget: starter
budgetNote: >-
  **No source gives a credible 3.30 currency figure for this build, and that
  is the biggest evidence gap in it.** Maxroll prints no prices at all;
  poe-vault uses only low, medium and high tiers. What is safe to say: the
  start is near free, because no unique item is required and your weapon comes
  from a vendor recipe. The cost curve runs six-link body armour → a good rare
  or recombinated staff → [[The Stampede]] if you go Tumult →
  [[Stranglegasp]] → [[Void Shockwave Support]] → [[Mageblood]] or
  [[Progenesis]]. Ignore two numbers you may see: a "100 Divine endgame
  bosser" figure belongs to a Cold damage-over-time Occultist, not this build,
  and the ~49 and ~433 Divine figures circulating for endgame Cyclone Slayers
  are finished 3.29 characters.
mainSkill: Cyclone
image: asc-icon-slayer
hero: art-slayer
tags: [Melee, Physical, One button, No uniques needed]
ratings: { clear: 4, bossing: 3, survivability: 4, ease: 3 }
verified: "2026-11-13"
confidence: mixed
confidenceNote: >-
  The guide is **genuinely 3.30** (updated 12 November 2026), and Cyclone,
  Shockwave, General's Cry and Slayer were all untouched by the patch. Three
  things are weak. **The guide's own Path of Building link did not resolve to
  this build** when our researcher fetched it — it returned a page titled
  "Level 98 Volley Support Slayer" with no gear — so open it in a browser
  before trusting it; the numbers here come from a separate community export.
  **No 3.30 source gives a lab-by-lab ascendancy order**, and three sources
  conflict, so the order below is our recommendation and is labelled as such.
  And no budget exists. Ratings are our researcher's day-zero judgement,
  rounded down from half points: clear 4.5, bossing 3.5 as a starter rising to
  about 4.5 geared, ease 3.5.
modes:
  ssf: >-
    The starter half is excellent solo material: no uniques, a vendor-recipe
    weapon, and a quest-reward gem. The endgame is not —
    [[Void Shockwave Support]] drops only from Uber Elder, and
    [[The Stampede]], [[Stranglegasp]] and [[Mageblood]] are trade targets.
    Viable to about Voidstones, then a grind. No source addresses it.
  hardcore: >-
    No source addresses it. Our judgement: permanent leech, 90% physical
    damage reduction and 57% block is a legitimate shell, but 4,800 life on a
    melee character standing in every boss telegraph, with "cannot be leeched
    from" as a hard counter, makes it mid-tier at best. Untested.

idea: |
  [[Cyclone]] is a channelled attack. You hold the button, you move while spinning, and you hit everything you pass through.

  The damage is not really the spin. It is [[Shockwave Support]], which triggers a separate area blast on melee hit — 336% of your attack damage at gem 20, in a 2.7 metre radius, up to four times a second. Cyclone's job is to supply hits and movement; the shockwaves are what delete packs. That is why the build is named after the support gem.

  You survive on [[Brutal Fervour]]. Because Cyclone hits constantly, your leech never stops, and Slayer's leech does not switch off at full life. You are permanently recovering and permanently taking 10% less damage.

  The one hard rule: **Shockwave only works with maces, sceptres and staves.** No swords, no axes.

chain:
  - label: Spin
    text: "[[Cyclone]] attacks at 300% of base speed for 2–3 mana and moves while it attacks."
  - label: Pulse
    text: "[[Shockwave Support]] converts up to four of those hits per second into separate area blasts centred on the enemy."
  - label: Never miss
    text: "[[Precise Technique]] gives 40% more attack damage while your accuracy is higher than your maximum life, and forbids crits."
  - label: Leech forever
    text: "[[Brutal Fervour]] keeps leech running at full life and cuts damage taken by 10% while it runs."
  - label: Add clones
    text: "[[General's Cry]] summons up to five mirage warriors from corpses, each swinging your Cyclone once."

chainDetails:
  - title: Base Cyclone or Cyclone of Tumult? Both answers are right
    body: |
      There is a genuine split in the sources, and it is about *when*, not *which*.

      **Maxroll keeps base [[Cyclone]]** for the whole guide, for mobility and less ramp time, and offers [[Cyclone of Tumult]] only once you own [[The Stampede]] or [[Replica Stampede]]. **poe-vault's 3.30 guide and the main community export both use Tumult** with The Stampede.

      The mechanical reason: Tumult builds five stages at one per 0.4 seconds, each giving 25% more attack speed, a little more radius, and **10% less movement speed**. At five stages that is roughly 125% more attack speed and 50% less movement speed. The Stampede *sets* your movement speed to a fixed value, which overrides the penalty — which is why it is the enabler rather than a nice-to-have.

      **Start on base Cyclone. Swap to Tumult when you own Stampede.** That reconciles every source, and Stampede will not be cheap on day one.
  - title: Shockwave, then Void Shockwave
    body: |
      [[Shockwave Support]] deals 231% of attack damage at gem level 1 and 336% at 20, in a 2.4 to 2.7 metre radius, on a one-second cooldown that allows one use at level 1 and **four uses per cooldown at level 20**.

      [[Void Shockwave Support]] is the upgrade and the single biggest gem jump in the build: half the cooldown, 440% rising to 528% attack damage, and it hits up to ten enemies instead of up to two. It needs level 72 and it **drops from Uber Elder**. Its weapon restriction widens to include axes.

      One correction worth knowing: one tier list lists "Void Shockwave" as a separate skill in a lower tier. It is not a skill. It is this support gem, and that entry is the same build counted twice at two gear levels.
  - title: The accuracy threshold you have to manage
    body: |
      [[Precise Technique]] reads: 40% more attack damage if your accuracy rating is higher than your maximum life, and you never deal critical strikes.

      That is a moving target. **Every point of maximum life you add raises the bar you have to clear.** This is why [[Precision]] runs as an aura from level 12, why [[Impact]]'s 50% increased accuracy matters beyond the strike range, and why maxroll warns that the build requires continuous accuracy management.

      Around level 85 to 90 you drop Precise Technique entirely, buy a staff with crit chance, add a [[Diamond Flask]] and [[Assassin's Mark]], and the problem goes away. Maxroll gives both 85 and 90 in different places; either is fine.
  - title: Why your chest must not roll flat life
    body: |
      The Barbarism Life Mastery that this build takes is conditional: it stops working if your body armour has flat life or life regeneration modifiers on it.

      So when you buy a six-link chest you are shopping for **high armour and no life rolls**, which is the opposite of normal advice and very easy to get wrong.
  - title: Mana, which is a real constraint
    body: |
      Channelling Cyclone costs mana continuously. Maxroll tells you to keep *both* mana-cost wheels on the tree until you own a double-influenced body armour with −20 to mana cost.

      poe-vault's mid-budget rings are specifically "reduced cost for channelling skills", chasing −3 in total to reach **zero mana cost**. Two independent sources agree this matters. Plan for it rather than discovering it.

mandatory:
  - term: Shockwave Support
    why: >-
      This is the build. Up to four area blasts a second at 336% of your
      attack damage, triggered by Cyclone's hits.
    detail: >-
      Available from level 18, so it will be sitting in your bag waiting when
      Cyclone unlocks at 28. The weapon restriction is absolute: maces,
      sceptres or staves only.
  - term: Cyclone
    why: >-
      The hit engine and the movement. Level 28, and the Duelist gets it as an
      Act 3 quest reward from Sever the Right Hand.
    detail: >-
      Clarissa also sells it to Duelist, Marauder, Ranger, Scion and Templar,
      so it is easy to replace. Link it with Shockwave the moment you have it.
  - term: Brutal Fervour
    why: >-
      Leech keeps running at full life, maximum recovery per leech is doubled,
      and you take 10% less damage while leeching. Remove it and you are a
      4,800-life melee character with no sustain.
  - term: Precise Technique
    why: >-
      40% more attack damage for the whole pre-crit phase, as long as your
      accuracy stays above your maximum life.
  - term: Impact
    why: >-
      +0.4 metres strike range and 50% increased accuracy. Both feed other
      parts of the build: Cyclone converts strike range into area, and
      accuracy feeds Precise Technique.
  - term: Bane of Legends
    why: >-
      20% more damage against unique enemies, and you cannot take reflected
      physical damage. The reflect immunity removes a map modifier that would
      otherwise kill you instantly.
  - term: Headsman
    level: recommended
    why: >-
      Kills enemies at 20% life or below, plus attack and movement speed on
      kill. Maxroll estimates about 25% more damage, which is a guide
      estimate and not a measurement.
  - term: Precision
    why: >-
      Runs as an aura from level 12 and stays there. It is the cheapest
      accuracy in the build and Precise Technique depends on it.
  - term: Unwavering Stance
    level: recommended
    why: >-
      You cannot be stunned. On a channelled melee skill that is a defensive
      layer, not a convenience.
  - term: General's Cry
    level: recommended
    why: >-
      Up to five mirage warriors, each using your Cyclone once. Corpses are
      not consumed. Your main extra single-target layer.
    detail: >-
      Cast [[Desecrate]] once before an instanced boss fight so General's Cry
      has corpses to work with. Link it with [[Autoexertion]] and it fires
      itself, at the cost of 20% mana reservation and no warcry buffs for you.
  - term: Autoexertion
    level: recommended
    why: >-
      Triggers your warcries automatically. This is what makes the build one
      button rather than three.
  - term: The Stampede
    level: recommended
    why: >-
      Sets your movement speed to a fixed value, overriding modifiers. The
      only reason [[Cyclone of Tumult]] is playable. [[Replica Stampede]]
      works too.
  - term: Rumi's Concoction
    level: recommended
    why: >-
      Block and armour in a flask. poe-vault lists it at every budget tier,
      which is unusual.
  - term: Stranglegasp
    level: recommended
    why: >-
      For the [[Enigmatic Defence]] anoint. Maxroll flags this as the build's
      main source of heavy gearing pressure.
  - term: Void Shockwave Support
    level: recommended
    why: >-
      The biggest single gem upgrade in the build, at level 72. Drops from
      Uber Elder.
  - term: Mageblood
    level: recommended
    why: >-
      The endgame belt, and also insanebuild's stated fix for this build's
      movement speed problem. [[Headhunter]] is the alternative.

labs:
  - lab: Normal
    node: Brutal Fervour
    why: >-
      **Our recommendation, not a source's.** It is the survival node, it is
      a two-point node available immediately, and poe-vault puts normal lab
      at level 38 or later — exactly when you most need sustain.
  - lab: Cruel
    node: Impact
    why: "Strike range and accuracy, which are damage and Precise Technique uptime at once. Run it around level 59 with about 2,000 life."
  - lab: Merciless
    node: Bane of Legends
    why: >-
      Reflect immunity before you enter maps. Run it **before killing
      Kitava**, so you fight Izaro without the resistance penalty. Delay it
      if you are under 3,000 life.
  - lab: Uber
    node: Headsman
    why: >-
      The last of the four. Note the tree geometry: Brutal Fervour leads to
      Endless Hunger, not the reverse, so with eight points you take four
      two-point notables and skip [[Endless Hunger]] entirely.

stages:
  - id: acts-1-3
    image: asc-icon-slayer
    title: Acts 1–3
    levels: Level 1–28
    uses: >-
      [[Spectral Throw]] for both packs and bosses to level 12, then
      [[Sunder]] as the bridge. Life and resistances on everything that is
      not a weapon; your weapon is the slot that matters.
    changes: >-
      Auras come online at level 12: [[Precision]], [[Blood and Sand]] in
      blood stance, and [[Herald of Ash]]. Equip a [[Sapphire Ring]] before
      Merveil. Two-Stone Rings from level 20.
    links:
      - name: Level 1–12
        gems: [Spectral Throw, Volley Support, Faster Attacks Support]
      - name: From level 12
        gems: [Sunder, Melee Physical Damage Support, Ruthless Support]
      - name: Auras
        gems: [Precision, Blood and Sand, Herald of Ash]
      - name: Movement
        gems: [Leap Slam, Faster Attacks Support]
    moveOn: "you are level 28 with a decent mace or staff and a Shockwave Support gem in your bag."
    details:
      - title: The weapon recipe
        body: |
          Sell a good mace or staff base, a Blacksmith's Whetstone and a Rustic Sash together. A **rare** Rustic Sash gives a better result than a magic one.

          Repeat it whenever your damage sags. Your weapon is the single most important item in the build at every stage, and no unique replaces it.
      - title: Tree notes for the first 28 levels
        body: |
          Take Mana Flows for the +20 Intelligence, which is what lets you use [[Frostblink]]. Take the Burning Brutality Fire Mastery and the Barbarism Life Mastery.

          Remember the Barbarism condition when you later buy a chest: no flat life, no life regeneration on the body armour.
      - title: Easily missed, genuinely useful
        body: |
          If you find a strong axe or sword before you have a good mace or staff, maxroll says you may temporarily drop [[Shockwave Support]] and just use the better weapon.

          The shockwaves are the long-term engine, but a much better weapon beats a support gem in the campaign.
  - id: acts-4-10
    image: precision
    title: Acts 4–10
    levels: Level 28–68
    uses: >-
      [[Cyclone]] with [[Shockwave Support]] from the moment you get the gem
      at level 28. [[Sunder]] goes in the stash.
    changes: >-
      Keep upgrading the mace or staff and keep resistances capped. Add a
      Decoy Totem or [[Steelskin]] for tanky rares. Run Merciless lab before
      Kitava.
    links:
      - name: Main skill
        gems: [Cyclone, Shockwave Support, Melee Physical Damage Support, Brutality Support]
      - name: Auras
        gems: [Precision, Blood and Sand, Herald of Ash]
      - name: Movement
        gems: [Frostblink, Lifetap Support, Leap Slam, Faster Attacks Support]
      - name: Warcries
        gems: [Autoexertion, General's Cry, Desecrate]
    moveOn: "resistances are capped after Act 10 and Cyclone is in at least a four-link."
    details:
      - title: Bandits and Pantheon, both contested
        body: |
          **Bandits:** poe-vault says Alira on a low budget, for the 15% all elemental resistance, switching to the passive point once your attributes are solved and you are comfortably overcapped. The main community export kills all three. The honest answer is Alira while poor, kill all when geared.

          **Pantheon:** the sources do not agree at all. poe-vault's 3.30 page says Ryslatha and Lunaris on a low budget, Ralakesh and Lunaris later, and Lunaris into Solaris for Uber bosses. Its 3.29 page said Brine King and Abberath. The community export uses Arakaali and Shakari. **There is no consensus — pick for the content you are running.**
      - title: Where the ascendancy order came from
        body: |
          Maxroll lists four notables in sequence — Impact, Bane of Legends, Brutal Fervour, Headsman — without saying which lab each belongs to. One community Path of Building says the second should be Brutal Fervour or Bane of Legends. A 3.19 guide gives almost the reverse order.

          The order in the Labyrinth table above is **ours**, built on poe-vault's lab *timing* guidance plus the observation that Brutal Fervour is the survival node and is available immediately. If you prefer maxroll's literal sequence, the only cost is slightly weaker early sustain. Untested either way.
  - id: early-maps
    image: shockwave-support
    title: Early maps
    levels: White and yellow maps
    uses: >-
      A six-link body armour with high armour and **no life modifiers**,
      holding Cyclone and Shockwave. [[Rumi's Concoction]] on the flask bar.
    changes: >-
      Cap resistances and attributes. Roll flasks for armour, critical strike
      chance and movement speed, and put corrupted-blood immunity on the life
      flask. Both mana-cost wheels stay on the tree.
    links:
      - name: Main skill (six-link)
        gems: [Cyclone, Shockwave Support, Melee Physical Damage Support, Pulverise Support, Brutality Support, Infused Channelling Support]
      - name: Curse on hit
        gems: [Lifetap Support, Assassin's Mark, Mark On Hit Support, Blood Rage]
      - name: Auras
        gems: [Blood and Sand, Flesh and Stone, Pride, Herald of Purity, Purity of Elements, Enlighten Support]
      - name: Mobility
        gems: [Frostblink, Lifetap Support, Leap Slam, Faster Attacks Support]
      - name: Guard
        gems: [Automation, Molten Shell]
      - name: Single target
        gems: [General's Cry, Autoexertion, Desecrate]
    moveOn: "you clear yellow maps comfortably and your mana does not run dry while channelling."
    details:
      - title: Two versions of the main link
        body: |
          For base Cyclone: *Cyclone, Shockwave, Melee Physical Damage, Pulverise, Brutality, Infused Channelling.* This is synthesised from a community Path of Building plus maxroll's prose — **single source**, though it matches poe-vault's version closely.

          poe-vault's page-verified Tumult link is: *Cyclone of Tumult, Shockwave, Melee Physical Damage, Brutality, Volatility, Infused Channelling*, with [[Void Shockwave Support]] replacing Shockwave later.

          [[Brutality Support]] forbids all non-physical damage, so there is no elemental conversion anywhere in this build. Impale is the second damage layer; one export shows 4.9 million hit plus 3.3 million impale.
      - title: Herald of Ash or Herald of Purity
        body: |
          Maxroll runs [[Herald of Ash]]; poe-vault runs [[Herald of Purity]]. Both work. Pick whichever fits your reservation.

          This is the kind of disagreement that looks important and is not. Spend the attention on your weapon instead.
      - title: Map modifiers that break it
        body: |
          - **Cannot be leeched from.** This removes [[Brutal Fervour]], which is your whole defence.
          - **Reduced recovery rate.**
          - **−9% to −12% maximum resistances.**
          - **Reduced cooldown recovery**, which slows the shockwaves.

          poe-vault also marks Valdos maps as not supported.
  - id: red-maps
    image: diamond-flask
    title: Red maps and the crit swap
    levels: Tier 11–16 maps, level 85–90
    uses: >-
      The same setup until the crit swap, then a high physical-damage staff
      with critical strike chance, a [[Diamond Flask]] with a crit suffix,
      and [[Assassin's Mark]] applied on hit.
    changes: >-
      You drop [[Precise Technique]] and the accuracy-versus-life threshold
      goes away. This is a mid-league respec, not a gear upgrade, and the
      build is level-hungry: poe-vault's word is "incredibly".
    links:
      - name: Main skill, post-crit
        gems: [Cyclone, Shockwave Support, Melee Physical Damage Support, Pulverise Support, Brutality Support, Increased Critical Damage Support]
      - name: With Stampede
        gems: [Cyclone of Tumult, Void Shockwave Support, Melee Physical Damage Support, Brutality Support, Volatility Support, Infused Channelling Support]
      - name: Curse on hit
        gems: [Lifetap Support, Assassin's Mark, Mark On Hit Support, Blood Rage]
      - name: Auras
        gems: [Blood and Sand, Flesh and Stone, Pride, Herald of Purity, Purity of Elements, Enlighten Support]
    moveOn: "you have a crit staff, Void Shockwave, and Tier 16 bosses die before they get a second phase."
    details:
      - title: What the crit swap needs
        body: |
          A staff with high physical damage per second and critical strike chance. A [[Diamond Flask]] with a "critical strike chance during flask effect" suffix. [[Assassin's Mark]] with [[Mark On Hit Support]] and [[Lifetap Support]]. Abyssus is optional and is a real risk on a melee character.

          Do not start the swap until you have the staff in hand. Dropping Precise Technique without a crit weapon loses 40% more damage and replaces it with nothing.
      - title: Endgame crafting
        body: |
          poe-vault's route is a recombinated Ezomyte Staff at item level 84, with roughly a one-in-six chance at the three-prefix outcome. The high-budget chest is a Royal Plate at item level 86, beast-locked, needing at least 60 Memory Strands.

          None of that is priced for 3.30, and 3.30 changed crafting costs. Treat it as the shape of the plan.
      - title: Cluster jewels
        body: |
          Maxroll notes that three Physical Damage large clusters are *slightly* weaker than the Staff cluster, and that [[Overlord]] lets you drop the Fortify wheel from the tree.

          This is a late optimisation. It does not belong in your first 90 levels.
  - id: endgame
    image: void-shockwave-support
    title: Endgame
    levels: Pinnacle bosses and juiced mapping
    uses: >-
      [[Void Shockwave Support]], a Shaper staff, [[Stranglegasp]] for the
      [[Enigmatic Defence]] anoint, [[Mageblood]], [[Lethal Pride]] and a
      [[Watcher's Eye]].
    changes: >-
      Nothing about the playstyle changes. You are buying movement speed,
      shockwave frequency and effective hit points.
    moveOn: "there is no next stage."
    details:
      - title: What the finished character looks like
        body: |
          From the main community export, at level 96: 18.4 million full damage per second, 8.3 million on the main skill, 4,809 life, 962 life leeched per second, 22,254 armour, 90% physical damage reduction, 57% block and 48% spell block, 129,972 effective hit points.

          Read the life number carefully. This build is tanky through leech, block and mitigation, not through a large pool.
      - title: One genuine unknown for week one
        body: |
          poe-vault states outright that the [[Wickerman]] mechanic's interaction with Cyclone is still unknown.

          That is a channelled melee skill meeting a brand-new encounter type. Worth watching, and worth not assuming.

patch:
  - note: >-
      **Nothing in this build changed.** Cyclone, [[Cyclone of Tumult]],
      [[Shockwave Support]], [[Void Shockwave Support]],
      [[General's Cry]] and [[Autoexertion]] are all untouched in the normal
      game.
  - entry: ruthless-changes
    note: >-
      **Slayer was not buffed. Check anyone who says it was.** The Impact and
      [[Endless Hunger]] lines that appear to improve Slayer are in the
      **Ruthless-only** section. One game-data site renders them with no
      Ruthless label, which makes the error easy to make honestly. Impact is
      still up to 50% area of effect and Endless Hunger still has no attack
      speed in the normal game.
  - entry: mercenary-nerfs
    note: >-
      **A modest relative buff.** This build uses no mercenary, so every
      mercenary-carried competitor got worse relative to it.
  - entry: loot-rarity-rework
    note: >-
      **Favourable.** A build that clears packs fast and has 20% more damage
      against unique enemies plus an execute is well placed for currency that
      now comes mostly from rare and unique monsters. Note the wording: "a
      much greater percentage", not "most".
  - entry: league-fates
    note: >-
      **Cuts both ways.** Single target matters more in 3.30 than in 3.29,
      and that is this archetype's weaker axis.
      [[Bane of Legends]] and [[General's Cry]] soften it, but you are
      playing a clear-first build in a league that asks for bossing.
  - entry: wickerman-viscera
    note: >-
      **Unknown, flagged rather than guessed.** poe-vault says the
      [[Wickerman]] mechanic's interaction with Cyclone has not been worked
      out. Nobody has played it yet.

strengths:
  - "Strong screen-wide clear: up to four shockwave pulses a second over 2.7 metres."
  - "Zero mandatory unique items, so the start is almost free."
  - "Slayer leech is genuinely tanky, and it never switches off."
  - "One button. Every source praises the playstyle."
  - "Cyclone attacks while moving, which helps against boss telegraphs."
  - "General's Cry clones add damage with no extra input."
weaknesses:
  - "Precise Technique needs constant accuracy management: every life roll raises the bar."
  - "You are in melee range of everything, standing in every ground effect."
  - "Slow movement until Mageblood, and much slower on Tumult without Stampede."
  - "Level-hungry: the real payoff is the crit respec at 85 to 90."
  - "A bad weapon is a bad build, and no unique fixes it."
  - "Gearing pressure, especially Stranglegasp, and four map modifiers that break it."
avoidIf: >-
  Do not pick this if you dislike being in melee range of everything, or if
  you play on high latency — a channelled skill punishes both. Do not pick it
  if you want to be finished gearing at level 80, or if you are not willing to
  manage an accuracy threshold, two mana-cost wheels and a mid-league crit
  respec. It is not a cheap pinnacle bosser out of the gate.

