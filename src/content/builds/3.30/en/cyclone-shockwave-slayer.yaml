name: Cyclone Shockwave Slayer
tagline: >-
  You hold one button and spin. Every few hits a shockwave bursts out of the
  enemy you are touching, and the leech never stops.
class: Duelist
ascendancy: Slayer
role: starter
budget: starter
budgetNote: >-
  **No source gives a credible 3.30 currency figure for this build, and that
  is the biggest evidence gap in it.** Maxroll prints no prices at all;
  poe-vault uses only low, medium and high tiers. What is safe to say: the
  start is near free, because no unique item is required and your weapon comes
  from a vendor recipe. The cost curve runs six-link body armour → a good rare
  or recombinated staff → [[The Stampede]] if you go Tumult →
  [[Stranglegasp]] → [[Void Shockwave Support]] → [[Mageblood]] or
  [[Progenesis]]. Ignore two numbers you may see: a "100 Divine endgame
  bosser" figure belongs to a Cold damage-over-time Occultist, not this build,
  and the ~49 and ~433 Divine figures circulating for endgame Cyclone Slayers
  are finished 3.29 characters.
mainSkill: Cyclone
image: asc-icon-slayer
hero: art-slayer
tags: [Melee, Physical, One button, No uniques needed]
ratings: { clear: 4, bossing: 3, survivability: 4, ease: 3 }
verified: "2026-11-13"
confidence: mixed
confidenceNote: >-
  The guide is **genuinely 3.30** (updated 12 November 2026), and Cyclone,
  Shockwave, General's Cry and Slayer were all untouched by the patch. Three
  things are weak. **The guide's own Path of Building link did not resolve to
  this build** when our researcher fetched it — it returned a page titled
  "Level 98 Volley Support Slayer" with no gear — so open it in a browser
  before trusting it; the numbers here come from a separate community export,
  and that file is tagged 3.29 in its own title and is a crit Cyclone of Tumult
  character, so they are not 3.30 numbers and not the base-Cyclone starter's.
  **No 3.30 source gives a lab-by-lab ascendancy order**, and three sources
  conflict, so the order below is our recommendation and is labelled as such.
  And no budget exists. Ratings are our researcher's day-zero judgement,
  rounded down from half points: clear 4.5, bossing 3.5 as a starter rising to
  about 4.5 geared, ease 3.5.
modes:
  ssf: >-
    The starter half is excellent solo material: no uniques, a vendor-recipe
    weapon, and a quest-reward gem. The endgame is not —
    [[Void Shockwave Support]] drops only from Uber Elder, and
    [[The Stampede]], [[Stranglegasp]] and [[Mageblood]] are trade targets.
    Viable to about Voidstones, then a grind. No source addresses it.
  hardcore: >-
    No source addresses it. Our judgement: permanent leech, plus the 90%
    physical damage reduction and 57% block of the 3.29-tagged export, is a
    legitimate shell, but that export's 4,800 life on a melee character standing in every boss telegraph, with "cannot be leeched
    from" as a hard counter, makes it mid-tier at best. Untested.

idea: |
  [[Cyclone]] is a channelled attack. You hold the button, you move while spinning, and you hit everything you pass through.

  The damage is not really the spin. It is [[Shockwave Support]], which triggers a separate area blast on melee hit — 336% of your attack damage at gem 20, in a 2.7 metre radius, from up to four uses stored on a one-second cooldown. Cyclone's job is to supply hits and movement; the shockwaves are what delete packs. That is why the build is named after the support gem.

  You survive on [[Brutal Fervour]]. Because Cyclone hits constantly, your leech never stops, and Slayer's leech does not switch off at full life. You are permanently recovering and permanently taking 10% less damage.

  The one hard rule: **Shockwave only works with maces, sceptres and staves.** No swords, no axes.

chain:
  - label: Spin
    text: "[[Cyclone]] attacks at 300% of base speed for 2–3 mana and moves while it attacks."
  - label: Pulse
    text: "[[Shockwave Support]] turns those hits into separate area blasts centred on the enemy, from up to four uses stored on a one-second cooldown."
  - label: Never miss
    text: "[[Precise Technique]] gives 40% more attack damage while your accuracy is higher than your maximum life, and forbids crits."
  - label: Leech forever
    text: "[[Brutal Fervour]] keeps leech running at full life and cuts damage taken by 10% while it runs."
  - label: Add clones
    text: "[[General's Cry]] summons up to five mirage warriors from corpses, each swinging your Cyclone once."

chainDetails:
  - title: Base Cyclone or Cyclone of Tumult? Both answers are right
    body: |
      There is a genuine split in the sources, and it is about *when*, not *which*.

      **Maxroll keeps base [[Cyclone]]** for the whole guide, for mobility and less ramp time, and offers [[Cyclone of Tumult]] only once you own [[The Stampede]] or [[Replica Stampede]]. **poe-vault's 3.30 guide and the main community export both use Tumult** with The Stampede.

      The mechanical reason: Tumult builds five stages at one per 0.4 seconds, each giving 25% more attack speed, a little more radius, and **10% less movement speed**. At five stages that is roughly 125% more attack speed and 50% less movement speed. The Stampede *sets* your movement speed to a fixed value, which overrides the penalty — which is why it is the enabler rather than a nice-to-have.

      **Start on base Cyclone. Swap to Tumult when you own Stampede.** That reconciles every source, and Stampede will not be cheap on day one.
  - title: Shockwave, then Void Shockwave
    body: |
      [[Shockwave Support]] deals 231% of attack damage at gem level 1 and 336% at 20, in a 2.4 to 2.7 metre radius, on a one-second cooldown that stores one use at level 1 and **four uses at level 20**, with up to 38% increased cooldown recovery rate on the gem itself by then. The gem text sets no limit on how many enemies a blast hits. The only statement of the rule we could open is the community wiki note on PoEDB's Cooldown page, which says stored uses come back one after another, not all at once. It is a general rule, not a line about Shockwave, and the two other wikis we tried would not load. On that one page's word, four is the size of a burst and the steady rate is lower. Maxroll says only that Shockwave charges up to four stacks which are used up as you hit. No guide gives a blasts-per-second figure, and we do not either.

      [[Void Shockwave Support]] is the upgrade and the single biggest gem jump in the build: a 0.5 second cooldown with no stored uses listed, 440% of attack damage at gem level 1 and 455% at level 3, and each wave repeats from up to two enemies in its area at level 1 and four at level 3, the repeats dealing 50% less damage. Its base radius is smaller: 1.8 to 2 metres. PoEDB's level table runs on to a level 15 row with 528% and ten enemies, but it lists the gem itself at levels 1 to 3, so those are the figures we quote. It needs level 72 and it **drops from Uber Elder**. Its weapon restriction widens to include axes.

      One correction worth knowing: one tier list lists "Void Shockwave" as a separate skill in a lower tier. It is not a skill. It is this support gem, and that entry is the same build counted twice at two gear levels.
  - title: The accuracy threshold you have to manage
    body: |
      [[Precise Technique]] reads: 40% more attack damage if your accuracy rating is higher than your maximum life, and you never deal critical strikes.

      That is a moving target. **Every point of maximum life you add raises the bar you have to clear.** This is why [[Precision]] runs as an aura from level 12, why [[Impact]]'s 50% increased accuracy matters beyond the strike range, and why maxroll warns that the build requires continuous accuracy management.

      Around level 85 to 90 you drop Precise Technique entirely, buy a staff with crit chance, add a [[Diamond Flask]] and [[Assassin's Mark]], and the problem goes away. Maxroll gives both 85 and 90 in different places; either is fine.
  - title: Why your chest must not roll flat life
    body: |
      The Barbarism Life Mastery that this build takes is conditional: it stops working if your body armour has flat life or life regeneration modifiers on it.

      So when you buy a six-link chest you are shopping for **high armour and no life rolls**, which is the opposite of normal advice and very easy to get wrong.
  - title: Mana, which is a real constraint
    body: |
      Channelling Cyclone costs mana continuously. Maxroll tells you to keep *both* mana-cost wheels on the tree until you own a double-influenced body armour with −20 to mana cost.

      poe-vault's mid-budget rings are specifically "reduced cost for channelling skills", chasing −3 in total to reach **zero mana cost**. Two independent sources agree this matters. Plan for it rather than discovering it.

mandatory:
  - term: Shockwave Support
    why: >-
      This is the build. Area blasts at 336% of your attack damage, triggered
      by Cyclone's hits, from up to four uses stored on a one-second cooldown.
    detail: >-
      Available from level 18, so it will be sitting in your bag waiting when
      Cyclone unlocks at 28. The weapon restriction is absolute: maces,
      sceptres or staves only.
  - term: Cyclone
    why: >-
      The hit engine and the movement. Level 28, and the Duelist gets it as an
      Act 3 quest reward from Sever the Right Hand.
    detail: >-
      Clarissa also sells it to Duelist, Marauder, Ranger, Scion and Templar,
      so it is easy to replace. Link it with Shockwave the moment you have it.
  - term: Brutal Fervour
    why: >-
      Leech keeps running at full life, maximum recovery per leech is doubled,
      and you take 10% less damage while leeching. Remove it and you are a
      melee character with no sustain, on the roughly 4,800 life of the
      3.29-tagged export.
  - term: Precise Technique
    why: >-
      40% more attack damage for the whole pre-crit phase, as long as your
      accuracy stays above your maximum life.
  - term: Impact
    why: >-
      +0.4 metres strike range and 50% increased accuracy. Both feed other
      parts of the build: Cyclone converts strike range into area, and
      accuracy feeds Precise Technique.
  - term: Bane of Legends
    why: >-
      20% more damage against unique enemies, and you cannot take reflected
      physical damage. The reflect immunity removes a map modifier that would
      otherwise kill you instantly.
  - term: Headsman
    level: recommended
    why: >-
      Kills enemies at 20% life or below, plus attack and movement speed on
      kill. Maxroll estimates about 25% more damage, which is a guide
      estimate and not a measurement.
  - term: Precision
    why: >-
      Runs as an aura from level 12 for as long as you are on Precise
      Technique, which depends on it. It is the cheapest accuracy in the
      build. After the crit swap the sources part: poe-vault's aura link and
      the level 96 export run no Precision, while maxroll's Watcher's Eye
      advice still counts on it.
  - term: Unwavering Stance
    level: recommended
    why: >-
      You cannot be stunned. On a channelled melee skill that is a defensive
      layer, not a convenience.
  - term: General's Cry
    level: recommended
    why: >-
      Up to five mirage warriors, each using your Cyclone once. Corpses are
      not consumed. Your main extra single-target layer.
    detail: >-
      Cast [[Desecrate]] once before an instanced boss fight so General's Cry
      has corpses to work with. Link it with [[Autoexertion]] and it fires
      itself, at the cost of 20% mana reservation and no warcry buffs for you.
  - term: Autoexertion
    level: recommended
    why: >-
      Triggers your warcries automatically. This is what makes the build one
      button rather than three.
  - term: The Stampede
    level: recommended
    why: >-
      Sets your movement speed to a fixed value, overriding modifiers. The
      only reason [[Cyclone of Tumult]] is playable. [[Replica Stampede]]
      works too.
  - term: Rumi's Concoction
    level: recommended
    why: >-
      Block and armour in a flask. poe-vault lists it at every budget tier,
      which is unusual.
  - term: Stranglegasp
    level: recommended
    why: >-
      For the [[Enigmatic Defence]] anoint. Maxroll flags this as the build's
      main source of heavy gearing pressure.
  - term: Void Shockwave Support
    level: recommended
    why: >-
      The biggest single gem upgrade in the build, at level 72. Drops from
      Uber Elder.
  - term: Mageblood
    level: recommended
    why: >-
      The endgame belt, and also insanebuild's stated fix for this build's
      movement speed problem. [[Headhunter]] is the alternative.

labs:
  - lab: Normal
    node: Brutal Fervour
    why: >-
      **Our recommendation, not a source's.** It is the survival node, it is
      a two-point node available immediately, and poe-vault puts normal lab
      at level 38 or later — exactly when you most need sustain.
  - lab: Cruel
    node: Impact
    why: "Strike range and accuracy, which are damage and Precise Technique uptime at once. Run it around level 59 with about 2,000 life."
  - lab: Merciless
    node: Bane of Legends
    why: >-
      Reflect immunity before you enter maps. Run it **before killing
      Kitava**, so you fight Izaro without the resistance penalty. Delay it
      if you are under 3,000 life.
  - lab: Uber
    node: Headsman
    why: >-
      The last of the four. Note the tree geometry: Brutal Fervour leads to
      Endless Hunger, not the reverse, so with eight points you take four
      two-point notables and skip [[Endless Hunger]] entirely.

stages:
  - id: acts-1-3
    image: asc-icon-slayer
    title: Acts 1–3
    levels: Level 1–28
    uses: >-
      [[Spectral Throw]] for both packs and bosses to level 12, then
      [[Sunder]] as the bridge. Life and resistances on everything that is
      not a weapon; your weapon is the slot that matters.
    changes: >-
      Auras come online at level 12: [[Precision]], [[Blood and Sand]] in
      blood stance, and [[Herald of Ash]]. Equip a [[Sapphire Ring]] before
      Merveil. Two-Stone Rings from level 20.
    links:
      - name: Level 1–12
        gems: [Spectral Throw, Volley Support, Faster Attacks Support]
      - name: From level 12
        gems: [Sunder, Melee Physical Damage Support, Ruthless Support]
      - name: Auras
        gems: [Precision, Blood and Sand, Herald of Ash]
      - name: Movement
        gems: [Leap Slam, Faster Attacks Support]
    moveOn: "you are level 28 with a decent mace or staff and a Shockwave Support gem in your bag."
    details:
      - title: The weapon recipe
        body: |
          Sell a good mace or staff base, a Blacksmith's Whetstone and a Rustic Sash together. A **rare** Rustic Sash gives a better result than a magic one.

          Repeat it whenever your damage sags. Your weapon is the single most important item in the build at every stage, and no unique replaces it.
      - title: Tree notes for the first 28 levels
        body: |
          Take Mana Flows for the +20 Intelligence, which is what lets you use [[Frostblink]]. Take the Burning Brutality Fire Mastery and the Barbarism Life Mastery.

          Remember the Barbarism condition when you later buy a chest: no flat life, no life regeneration on the body armour.
      - title: Easily missed, genuinely useful
        body: |
          If you find a strong axe or sword before you have a good mace or staff, maxroll says you may temporarily drop [[Shockwave Support]] and just use the better weapon.

          The shockwaves are the long-term engine, but a much better weapon beats a support gem in the campaign.
  - id: acts-4-10
    image: precision
    title: Acts 4–10
    levels: Level 28–68
    uses: >-
      [[Cyclone]] with [[Shockwave Support]] from the moment you get the gem
      at level 28. [[Sunder]] goes in the stash.
    changes: >-
      Keep upgrading the mace or staff and keep resistances capped. Add a
      Decoy Totem or [[Steelskin]] for tanky rares. Run Merciless lab before
      Kitava.
    links:
      - name: Main skill
        gems: [Cyclone, Shockwave Support, Melee Physical Damage Support, Brutality Support]
      - name: Auras
        gems: [Precision, Blood and Sand, Herald of Ash]
      - name: Movement
        gems: [Frostblink, Lifetap Support, Leap Slam, Faster Attacks Support]
      - name: Warcries
        gems: [Autoexertion, General's Cry, Desecrate]
    moveOn: "resistances are capped after Act 10 and Cyclone is in at least a four-link."
    details:
      - title: Bandits and Pantheon, both contested
        body: |
          **Bandits:** poe-vault says Alira on a low budget, for the 15% all elemental resistance, switching to the passive point once your attributes are solved and you are comfortably overcapped. The main community export kills all three. The honest answer is Alira while poor, kill all when geared.

          **Pantheon:** the sources do not agree at all. poe-vault's 3.30 page says Ryslatha and Lunaris on a low budget, Ralakesh and Lunaris later, and Lunaris into Solaris for Uber bosses. Its 3.29 page said Brine King and Abberath. The community export uses Arakaali and Shakari. **There is no consensus — pick for the content you are running.**
      - title: Where the ascendancy order came from
        body: |
          Maxroll lists four notables in sequence — Impact, Bane of Legends, Brutal Fervour, Headsman — without saying which lab each belongs to. One community Path of Building says the second should be Brutal Fervour or Bane of Legends. A 3.19 guide gives almost the reverse order.

          The order in the Labyrinth table above is **ours**, built on poe-vault's lab *timing* guidance plus the observation that Brutal Fervour is the survival node and is available immediately. If you prefer maxroll's literal sequence, the only cost is slightly weaker early sustain. Untested either way.
      - title: "Herald of Ash beside Brutality: a tension we could not resolve"
        body: |
          Maxroll gives [[Herald of Ash]] two jobs: cleanup, and fire damage to ignite with. Its tree notes say the Burning Brutality Fire Mastery pays only against ignited enemies, that only fire damage can ignite, and that without the herald's extra fire damage those points are cosmetic.

          [[Brutality Support]], in the main link above, needs level 38, and its gem text says supported skills deal no elemental damage. So from the level you link it, Cyclone and its shockwaves deal no fire damage and have nothing to ignite with. That follows from the gem text. No guide says it.

          What we could read: maxroll's text names Brutality Support once, in its endgame gear notes, as the gem to swap out if you wear Headhunter. What we could not read: its gem links for each stage, which are not in the page's text, and its Path of Building link, which did not open this build. So we do not know at what level maxroll links Brutality, or whether it keeps Herald of Ash and the Fire Mastery once it has. poe-vault's link runs Herald of Purity, so the question does not come up there. Until a source settles it, treat the herald and the mastery as open once Brutality is linked.
  - id: early-maps
    image: shockwave-support
    title: Early maps
    levels: White and yellow maps
    uses: >-
      A six-link body armour with high armour and **no life modifiers**,
      holding Cyclone and Shockwave. [[Rumi's Concoction]] on the flask bar.
    changes: >-
      Cap resistances and attributes. Roll flasks for armour and movement
      speed, and put corrupted-blood immunity on the life flask. Maxroll's
      flask list also has critical strike chance, but the list sits in its
      crit-swap gear block and that roll does nothing while Precise Technique
      forbids crits, so it waits for the next stage. Starting on the other
      three this early is our call. Both mana-cost wheels stay on the tree.
    links:
      - name: Main skill (six-link)
        gems: [Cyclone, Shockwave Support, Melee Physical Damage Support, Pulverise Support, Brutality Support, Infused Channelling Support]
      - name: Auras (maxroll's set)
        gems: [Precision, Blood and Sand, Herald of Ash]
      - name: Mobility
        gems: [Frostblink, Lifetap Support, Leap Slam, Faster Attacks Support]
      - name: Guard
        gems: [Automation, Molten Shell]
      - name: Single target
        gems: [General's Cry, Autoexertion, Desecrate]
    moveOn: "you clear yellow maps comfortably and your mana does not run dry while channelling."
    details:
      - title: Two versions of the main link
        body: |
          For base Cyclone: *Cyclone, Shockwave, Melee Physical Damage, Pulverise, Brutality, Infused Channelling.* This is synthesised from a community Path of Building plus maxroll's prose — **single source**, though it matches poe-vault's version closely.

          poe-vault's page-verified Tumult link is: *Cyclone of Tumult, Shockwave, Melee Physical Damage, Brutality, Volatility, Infused Channelling*, with [[Void Shockwave Support]] replacing Shockwave later.

          [[Brutality Support]] forbids all non-physical damage, so there is no elemental conversion anywhere in this build. Impale is the second damage layer; one export shows 4.9 million hit plus 3.3 million impale.
      - title: "Auras: the two guides run different sets"
        body: |
          The aura link above is maxroll's: [[Precision]], Blood and Sand and [[Herald of Ash]], reserved from level 12 together with Autoexertion. It is the only aura set maxroll's text names, and its campaign notes give Herald of Ash a job: cleanup, and enabling ignites for the Fire Mastery. That job sits oddly beside Brutality Support in the main link; the note on Herald of Ash in the previous stage says what we could and could not read. Its endgame Watcher's Eye advice counts on Pride as well as Precision, but the guide's text never says when Pride goes in.

          poe-vault's link is Blood and Sand, Flesh and Stone, Pride, [[Herald of Purity]], Purity of Elements and Enlighten. It has no Precision, and poe-vault's pages mention neither Precision nor [[Precise Technique]]. The level 96 export runs no Precision either, and no herald. That link is shown in the next stage.

          We show maxroll's set here because this stage is still on Precise Technique, and the accuracy from Precision is what keeps it switched on. That choice is ours. No source shows Precision added to poe-vault's five auras, so we cannot tell you whether both fit your reservation. The herald is the kind of disagreement that looks important and is not: Herald of Ash is maxroll's, Herald of Purity is poe-vault's. Spend the attention on your weapon instead. The Mobility and Guard links above are poe-vault's medium-budget ones.
      - title: Map modifiers that break it
        body: |
          - **Cannot be leeched from.** This removes [[Brutal Fervour]], which is your whole defence.
          - **Reduced recovery rate.**
          - **−9% to −12% maximum resistances.**
          - **Reduced cooldown recovery.** poe-vault lists it for the speed it costs you on a high budget, where you move by Frostblink. That it also slows the shockwaves, which run on a cooldown, is our reading.

          poe-vault also marks Valdos maps as not supported.
  - id: red-maps
    image: diamond-flask
    title: Red maps and the crit swap
    levels: Tier 11–16 maps, level 85–90
    uses: >-
      The same setup until the crit swap, then a high physical-damage staff
      with critical strike chance, a [[Diamond Flask]] plus a crit-chance
      suffix on any of your flasks, and [[Assassin's Mark]] applied on hit.
    changes: >-
      You drop [[Precise Technique]] and the accuracy-versus-life threshold
      goes away. This is a mid-league respec, not a gear upgrade, and the
      build is level-hungry: poe-vault's word is "incredibly".
    links:
      - name: Main skill, post-crit
        gems: [Cyclone, Shockwave Support, Melee Physical Damage Support, Pulverise Support, Brutality Support, Increased Critical Damage Support]
      - name: With Stampede
        gems: [Cyclone of Tumult, Void Shockwave Support, Melee Physical Damage Support, Brutality Support, Volatility Support, Infused Channelling Support]
      - name: Curse on hit (poe-vault's link)
        gems: [Lifetap Support, Assassin's Mark, Mark On Hit Support, Blood Rage]
      - name: Auras (poe-vault's set)
        gems: [Blood and Sand, Flesh and Stone, Pride, Herald of Purity, Purity of Elements, Enlighten Support]
    moveOn: "you have a crit staff, Void Shockwave, and Tier 16 bosses die before they get a second phase."
    details:
      - title: What the crit swap needs
        body: |
          A staff with high physical damage per second and critical strike chance. A [[Diamond Flask]], and the suffix "increased Critical Strike Chance during Effect" on any of your flasks. [[Assassin's Mark]] with [[Mark On Hit Support]] and [[Lifetap Support]]. Abyssus is optional and is a real risk on a melee character.

          Do not start the swap until you have the staff in hand. Dropping Precise Technique without a crit weapon loses 40% more damage and replaces it with nothing.

          That checklist is maxroll's, and its list of basic flask affixes sits in the same gear block: armour, critical strike chance, movement speed, and corrupted-blood immunity on the life flask.

          poe-vault describes no swap at all. Its pages do not mention Precise Technique or Precision, they ask for a Diamond Flask and the crit flask suffix at every budget, and the two links above marked as poe-vault's — the mark link with Blood Rage, the aura link without Precision — are given with no budget split. The level 96 export runs no Precision either, while maxroll's Watcher's Eye advice still counts on it. So the sources disagree on when the crit pieces go on, and on whether Precision stays afterwards. This page follows maxroll's timing. That choice is ours.
      - title: Endgame crafting
        body: |
          poe-vault's route is a recombinated Ezomyte Staff at item level 84, with roughly a one-in-six chance at the three-prefix outcome. The high-budget chest is a Royal Plate at item level 86, beast-locked, needing at least 60 Memory Strands.

          None of that is priced for 3.30, and 3.30 changed crafting costs. Treat it as the shape of the plan.
      - title: Cluster jewels
        body: |
          Maxroll notes that three Physical Damage large clusters are *slightly* weaker than the Staff cluster, and that [[Overlord]] lets you drop the Fortify wheel from the tree.

          This is a late optimisation. It does not belong in your first 90 levels.
  - id: endgame
    image: void-shockwave-support
    title: Endgame
    levels: Pinnacle bosses and juiced mapping
    uses: >-
      [[Void Shockwave Support]], a Shaper staff, [[Stranglegasp]] for the
      [[Enigmatic Defence]] anoint, [[Mageblood]], [[Lethal Pride]] and a
      [[Watcher's Eye]].
    changes: >-
      Nothing about the playstyle changes. You are buying movement speed,
      shockwave frequency and effective hit points.
    moveOn: "there is no next stage."
    details:
      - title: What the finished character looks like
        body: |
          From the main community export, at level 96. Its own title reads "Level 96 Crit Cyclone of Tumult Slayer [3.29]", so this is a 3.29-tagged file for a crit Cyclone of Tumult character with Void Shockwave. It is not a 3.30 file and not the base-Cyclone starter. Its numbers: 18.4 million full damage per second, 8.3 million on the main skill, 4,809 life, 962 life leeched per second, 22,254 armour, 90% physical damage reduction, 57% block and 48% spell block, 129,972 effective hit points.

          Read the life number carefully. This build is tanky through leech, block and mitigation, not through a large pool.
      - title: One genuine unknown for week one
        body: |
          poe-vault states outright that the [[Wickerman]] mechanic's interaction with Cyclone is still unknown.

          That is a channelled melee skill meeting a brand-new encounter type. Worth watching, and worth not assuming.

powerCurve: |
  Every shockwave is a percentage of your attack damage, so three things multiply to make this build's damage, and they arrive at different times. Splitting it this way is our own framing; each part is stated by the guides or the gem data. **The weapon** is the base every blast is a percentage of. **The pulse rate** is how often [[Shockwave Support]] fires: its one-second cooldown stores one use on a level 1 gem and four at level 20, the gem's own cooldown recovery rate rises with its level, and [[Void Shockwave Support]] halves the cooldown. **The multipliers on top** are [[Precise Technique]]'s 40% more, then critical strikes in its place, with [[Bane of Legends]] against unique enemies, [[Headsman]]'s execute and impale as a second layer.

  Early, you have only the weapon, and before level 28 not even the skill: [[Spectral Throw]] and [[Sunder]] carry the first three acts. From 28 the build is itself, but the pulse rate is still climbing with the gem's level, so campaign damage is whatever mace or staff the vendor recipe last gave you. The defence arrives one lab at a time. [[Brutal Fervour]] comes first in our lab order, which poe-vault's timing puts at level 38 or later, and until then the leech that the whole build leans on is not there.

  The middle is steady, not steep. A six-link adds supports, and armour, [[Rumi's Concoction]] and [[Molten Shell]] start the shell that the 3.29-tagged level 96 export shows as 90% physical damage reduction and 57% block. What holds this stretch back is a rule, not a price. While you are on Precise Technique every point of life raises the accuracy you need, so life and damage pull against each other. Mana is a second limit, because the skill is channelled.

  The two real steps come late. The crit swap at level 85 to 90 removes that rule, and it is the payoff the build levels towards. Void Shockwave is the single biggest gem jump: half the cooldown, 440% to 455% of attack damage where Shockwave ends at 336%, and waves that repeat from up to two to four of the enemies in their area at 50% less damage, which Shockwave does not do. After those two you are buying movement speed, shockwave frequency and effective hit points. So expect a character that clears well from level 28, feels unfinished against bosses until the swap, and waits on levels as much as on currency: poe-vault's word for how level-hungry it is was "incredibly". The ratings say the same thing: bossing 3.5 as a starter, about 4.5 geared.

upgrades:
  - step: "A better mace or staff, every time your damage sags"
    why: >-
      First at every stage, because every shockwave is a percentage of your
      attack damage and no unique replaces the weapon. In the campaign it is
      close to free: a mace or staff base, a Blacksmith's Whetstone and a rare
      Rustic Sash sold together to a vendor. In maps it is a rare with high
      physical damage. Nothing lower on this list is worth much while the
      weapon is behind.
  - step: "A six-link body armour with high armour and no life modifiers"
    why: >-
      The first item on the cost curve. It takes [[Cyclone]] and
      [[Shockwave Support]] from a four-link to a six-link. The catch is the
      Barbarism Life Mastery, which stops working if the chest has flat life
      or life regeneration on it, so you shop for armour and pass over the
      life roll everyone else wants. It sits below the weapon because the
      vendor recipe costs almost nothing and six links do not. No source
      prices it for 3.30.
  - step: "The mana cost of Cyclone brought down to zero"
    why: >-
      A channel that stops for mana deals no damage, so we put this ahead of
      more damage. That placement is our call. Two sources agree on the
      problem. Maxroll keeps both mana-cost wheels on the tree until you own
      a double-influenced body armour with −20 to mana cost. poe-vault's
      mid-budget rings carry "reduced cost for channelling skills", chasing
      −3 in total. The rings are the mid-budget answer, so start there.
      Maxroll says to keep the wheels until the chest and stops there; our
      reading is that their points come back once gear has solved the cost.
  - step: "The crit swap, bought as one package at level 85 to 90"
    why: >-
      A staff with high physical damage and critical strike chance, a
      [[Diamond Flask]] plus a crit-chance suffix on any of your flasks, and
      [[Assassin's Mark]] applied on hit. Then you drop [[Precise Technique]]. This is the payoff the
      build levels towards, and it ends the accuracy threshold, so adding
      life no longer costs you damage. Have the staff in hand before you
      respec: without a crit weapon you give up 40% more damage and get
      nothing back. Abyssus is optional and a real risk in melee. poe-vault's
      route to the staff is a recombinated Ezomyte Staff, and nothing about
      it is priced for 3.30.
  - step: "[[The Stampede]] or [[Replica Stampede]], then [[Cyclone of Tumult]]"
    why: >-
      The boots add no damage by themselves. They set your movement speed to
      a fixed value, which cancels Tumult's 10% less movement speed per
      stage, and Tumult's five stages are roughly 125% more attack speed and
      a little more radius. Boots first, gem second. No source ranks this
      against the crit swap. We put it after because the swap is what the
      build's whole levelling is aimed at, while maxroll stays on base
      Cyclone for mobility and less ramp time and treats Tumult as optional.
      That ordering is ours.
  - step: "[[Void Shockwave Support]]"
    why: >-
      The single biggest gem jump in the build: half the cooldown, 440% of
      attack damage at gem level 1 and 455% at level 3 where Shockwave ends at
      336%, and waves that repeat from up to two enemies in their area at
      level 1 and four at level 3, at 50% less damage. Its base radius is
      smaller than Shockwave's, 1.8 to 2 metres against 2.7. It also lets you
      use an axe. It
      needs level 72 and drops only from Uber Elder, so you buy it or you
      kill for it, and that is the only reason it sits this far down. No
      step above is needed for it to work. If one comes within reach sooner,
      take it sooner; that advice is ours.
  - step: "[[Stranglegasp]], for the [[Enigmatic Defence]] anoint"
    why: >-
      Maxroll flags this amulet as the build's main source of heavy gearing
      pressure. The cost curve reaches it before the gem above. We swapped
      the two because the gem's numbers are published, and no source we read
      measures what the anoint is worth to this build. That ordering is ours.
  - step: "[[Mageblood]], then the rest of the endgame list"
    why: >-
      Last because it is the top of the cost curve, and because nothing
      about the playstyle changes here: you are buying movement speed,
      shockwave frequency and effective hit points. Mageblood is also
      insanebuild's stated fix for the build's slow movement, with
      [[Headhunter]] as the alternative. Around it sit [[Progenesis]], a
      Shaper staff, [[Lethal Pride]], a [[Watcher's Eye]] and cluster jewels,
      where maxroll notes that [[Overlord]] lets you drop the Fortify wheel.
      No source ranks these against each other or prices them for 3.30, so
      we do not either.

play:
  mapping: |
    Written for early maps onward, where [[Autoexertion]] and [[Automation]] have made the build one button.

    1. **Read the map before you open it.** Reroll "cannot be leeched from", reduced recovery rate, −9% to −12% maximum resistances and reduced cooldown recovery. poe-vault's reason for the last one is your speed on a high budget; that it also slows the shockwaves is our reading. Reflected physical damage is safe once you have [[Bane of Legends]]. poe-vault marks Valdos maps as not supported.
    2. **Hold [[Cyclone]] and walk into the pack.** You attack while you move, so there is no reason to stop. [[Shockwave Support]] bursts out of the enemies you hit, in a radius of up to 2.7 metres, so go through the middle of a pack and not around its edge. That last part is our advice from the radius, not a guide's.
    3. **Stay in contact while anything dangerous is alive.** The leech from [[Brutal Fervour]], and the 10% less damage taken that comes with it, last only as long as your hits keep the leech going.
    4. **Let the automatic parts work.** [[General's Cry]] fires through Autoexertion and raises up to five mirage warriors from the corpses around you. [[Molten Shell]] casts through Automation. After the crit swap, [[Assassin's Mark]] goes on with your hits as well.
    5. **Press what is left.** [[Leap Slam]] or [[Frostblink]] to cross a gap, [[Rumi's Concoction]] before a Rare monster or a boss, and the life flask when corrupted blood builds up, because the immunity is rolled on that flask.

    On [[Cyclone of Tumult]], expect a ramp. Stages build one per 0.4 seconds up to five, so a fresh channel takes two seconds to reach full speed, and maxroll gives less ramp time as a reason to stay on base Cyclone. No guide says what happens to the stages when you let go of the button, so we give no advice about that.
  bossing: |
    Single target is this build's weaker side, so a boss fight is about having every layer of damage on at once and not letting go.

    1. **Cast [[Desecrate]] once before an instanced boss.** General's Cry needs corpses, and an empty arena has none. It does not consume them, so once is enough.
    2. **Flasks up.** Rumi's Concoction for block and armour. After the crit swap the [[Diamond Flask]] and the flask carrying the crit-chance suffix are part of your damage, so keep them running.
    3. **Spin on the boss and stay on it.** Shockwave fires only on hits, from up to four uses stored on a one-second cooldown. After the crit swap the mark applies itself, and Bane of Legends adds 20% more damage against unique enemies.
    4. **Walk out of a telegraph without letting go of the button.** Cyclone keeps attacking while you move; both guides say that much. That this is what helps against boss telegraphs is our reading, and neither guide says it.
    5. **The last fifth is free.** [[Headsman]] kills an enemy at 20% life or below.

    What does not change is the size of the pool. The level 96 export, a 3.29-tagged Cyclone of Tumult character, has 4,809 life behind 90% physical damage reduction and 57% block. Leech heals you after a hit and block is a chance, so the big telegraphed attacks are dodged by hand. A phase where you cannot hit the boss is also a phase without leech. No source says this; it follows from how Brutal Fervour works.

    Keep your expectations where the ratings are: bossing 3.5 as a starter and about 4.5 geared. This is not a cheap pinnacle bosser out of the gate, and nobody yet knows how the [[Wickerman]] mechanic treats Cyclone.

deaths:
  - situation: "A map with \"cannot be leeched from\", or with reduced recovery rate"
    cause: >-
      [[Brutal Fervour]] is the whole defence: leech that keeps running at
      full life, double the maximum recovery per leech, and 10% less damage
      taken while it runs. The first modifier removes all of it and the
      second shrinks what the leech gives back.
    fix: >-
      Reroll these maps. No source offers a gear answer; treat the first
      modifier as a hard counter.
  - situation: "One very large hit, usually a boss attack you stood in"
    cause: >-
      The 3.29-tagged level 96 export has 4,809 life. The build is tanky
      through leech,
      block and mitigation, not through a large pool: leech heals after the
      hit, and 57% block is a chance.
    fix: >-
      Walk out of the telegraph still spinning. Keep [[Molten Shell]] on
      [[Automation]] and [[Rumi's Concoction]] running, and leave Abyssus off
      if this is how you die. Before the crit swap, more life also raises the
      accuracy [[Precise Technique]] needs, so the cheaper answer then is
      armour and block. That last trade-off is our reading.
  - situation: "Caught in a ground effect on [[Cyclone of Tumult]] without [[The Stampede]]"
    cause: >-
      Each Tumult stage is 10% less movement speed, about half your speed at
      five stages. You are in melee range of everything and standing in every
      ground effect, and now you leave them at half pace.
    fix: >-
      Stay on base [[Cyclone]] until you own the boots or
      [[Replica Stampede]]. Base Cyclone is still slow until [[Mageblood]];
      flasks rolled for movement speed are the stopgap.
  - situation: "A map with −9% to −12% maximum resistances"
    cause: >-
      The list of modifiers to avoid gives no reason for this one. Our
      reading: armour does nothing against elemental hits, so against them
      you have block, resistances and a small life pool, and −12% from a 75%
      cap lets about half again as much damage through.
    fix: >-
      Reroll it, as that list says.

troubleshooting:
  - symptom: "Cyclone spins but no shockwaves come out"
    cause: >-
      The weapon. [[Shockwave Support]] works only with maces, sceptres and
      staves. With a sword or an axe in hand it does nothing.
      [[Void Shockwave Support]] adds axes and nothing else.
    fix: >-
      Equip a mace, sceptre or staff. In the campaign, if the sword or axe is
      much the better weapon, maxroll says you may keep it and take Shockwave
      out of the link until a decent mace or staff turns up.
  - symptom: "Damage fell by more than a quarter after a gear change, before the crit swap"
    cause: >-
      Your accuracy is no longer higher than your maximum life, so
      [[Precise Technique]]'s 40% more attack damage has switched off. Every
      point of life raises the bar, so the usual culprit is a new item with
      life on it, or one that took the place of an item with accuracy. The
      quarter is our arithmetic: losing 40% more is about 29% less.
    fix: >-
      Compare accuracy rating and maximum life on the character sheet after
      every gear change. Then raise accuracy: [[Precision]] is the cheapest
      source, [[Impact]] gives 50% increased accuracy, and the rest is rolls
      on gear. The crit swap at level 85 to 90 ends the problem for good.
  - symptom: "Cyclone cuts out because you have no mana"
    cause: >-
      Channelling costs mana the whole time you hold the button. The aura
      link reserves mana as well, three auras in maxroll's set and five in
      poe-vault's, and [[Autoexertion]] reserves another 20%, so our reading
      is that not much mana is left to pay with.
    fix: >-
      Keep both mana-cost wheels on the tree, as maxroll says. Then follow
      poe-vault: rings with "reduced cost for channelling skills", −3 in
      total, for zero mana cost. A double-influenced body armour with −20 to
      mana cost is maxroll's later answer.
  - symptom: "You bought the usual chest: six links, armour and a big life roll"
    cause: >-
      The Barbarism Life Mastery stops working if your body armour has flat
      life or life regeneration on it.
    fix: >-
      Buy the chest for high armour and no life modifiers, the opposite of
      the usual advice. Check for both kinds of modifier before you pay for a
      six-link.
  - symptom: "Bosses take far too long to die"
    cause: >-
      Part of this is the build: single target is its weaker side, most of
      all on starter gear. The parts you can fix are (a) a weapon that has
      fallen behind, (b) an instanced boss room with no corpses, so
      [[General's Cry]] summons nothing, and (c) a map with reduced cooldown
      recovery. poe-vault lists that modifier for the movement speed it
      costs on a high budget; that it also slows the shockwaves, which run on
      a cooldown, is our reading.
    fix: >-
      (a) Run the vendor recipe again or buy a better staff. (b) Cast
      [[Desecrate]] once before the fight. (c) Reroll the map. After those,
      the two steps that change boss damage are the crit swap and
      [[Void Shockwave Support]].
  - symptom: "Damage fell after you dropped Precise Technique"
    cause: >-
      The swap was made before its pieces were in place. Without a crit
      weapon you lose 40% more damage and replace it with nothing.
    fix: >-
      Go back to Precise Technique until you hold a staff with high physical
      damage and critical strike chance. The swap also wants a
      [[Diamond Flask]], a crit-chance suffix on any of your flasks, and
      [[Assassin's Mark]] applied on hit, and maxroll times it at level 85 to 90.

patch:
  - note: >-
      **Nothing in this build changed.** Cyclone, [[Cyclone of Tumult]],
      [[Shockwave Support]], [[Void Shockwave Support]],
      [[General's Cry]] and [[Autoexertion]] are all untouched in the normal
      game.
  - entry: ruthless-changes
    note: >-
      **Slayer was not buffed. Check anyone who says it was.** The Impact and
      [[Endless Hunger]] lines that appear to improve Slayer are in the
      **Ruthless-only** section. One game-data site renders them with no
      Ruthless label, which makes the error easy to make honestly. Impact is
      still up to 50% area of effect and Endless Hunger still has no attack
      speed in the normal game.
  - entry: mercenary-nerfs
    note: >-
      **A modest relative buff.** This build uses no mercenary, so every
      mercenary-carried competitor got worse relative to it.
  - entry: loot-rarity-rework
    note: >-
      **Favourable.** A build that clears packs fast and has 20% more damage
      against unique enemies plus an execute is well placed for currency that
      now comes mostly from rare and unique monsters. Note the wording: "a
      much greater percentage", not "most".
  - entry: league-fates
    note: >-
      **Cuts both ways.** Single target matters more in 3.30 than in 3.29,
      and that is this archetype's weaker axis.
      [[Bane of Legends]] and [[General's Cry]] soften it, but you are
      playing a clear-first build in a league that asks for bossing.
  - entry: wickerman-viscera
    note: >-
      **Unknown, flagged rather than guessed.** poe-vault says the
      [[Wickerman]] mechanic's interaction with Cyclone has not been worked
      out. Nobody has played it yet.

strengths:
  - "Strong clear: each shockwave hits everything within a 2.7 metre base radius of the enemy that triggered it, with no limit on enemies hit. Maxroll describes the screen clear as comfortable."
  - "Zero mandatory unique items, so the start is almost free."
  - "Slayer leech is genuinely tanky, and it never switches off."
  - "One button. Every source praises the playstyle."
  - "Cyclone attacks while moving, which both guides point to. That it helps against boss telegraphs is our reading, not a source's."
  - "General's Cry clones add damage with no extra input."
weaknesses:
  - "Precise Technique needs constant accuracy management: every life roll raises the bar."
  - "You are in melee range of everything, standing in every ground effect."
  - "Slow movement until Mageblood, and much slower on Tumult without Stampede."
  - "Level-hungry: the real payoff is the crit respec at 85 to 90."
  - "A bad weapon is a bad build, and no unique fixes it."
  - "Gearing pressure, especially Stranglegasp, and four map modifiers that break it."
avoidIf: >-
  Do not pick this if you dislike being in melee range of everything, or if
  you play on high latency — a channelled skill punishes both. Do not pick it
  if you want to be finished gearing at level 80, or if you are not willing to
  manage an accuracy threshold, two mana-cost wheels and a mid-league crit
  respec. It is not a cheap pinnacle bosser out of the gate.

