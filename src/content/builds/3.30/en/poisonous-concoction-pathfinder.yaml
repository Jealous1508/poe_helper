name: Poisonous Concoction of Bouncing Pathfinder
tagline: >-
  You fight with no weapon at all. You throw your life flask at people, it
  shatters, bounces twice more, and everything it touched dies of poison.
class: Ranger
ascendancy: Pathfinder
role: starter
budget: starter
budgetNote: >-
  **The guide gives no currency figures anywhere.** Not one price, for any
  item, at any stage. We are not going to invent them. What it says instead is
  structural, and it is the important part: the build "doesn't require any
  Unique items to function", and because the skill is an unarmed attack you
  never buy a weapon. Its own gear plan is essences and the crafting bench, not
  trade. The two uniques it names as early trade-league picks are
  [[The Embalmer]] and [[Dendrobate]]; the best-in-slot list
  ([[Fury Valve]], [[Snakebite]]) is a four-Voidstone goal, and the
  aspirational list ([[Svalinn]], [[Olesya's Delight]], [[Dying Sun]],
  [[Progenesis]], [[Betrayal's Sting]]) is not a starter budget in any league.
mainSkill: Poisonous Concoction of Bouncing
image: asc-icon-pathfinder
hero: art-pathfinder
tags: [Unarmed, Chaos, Poison, Flasks, Shield]
ratings: { clear: 5, bossing: 3, survivability: 4, ease: 4 }
verified: "2026-11-13"
confidence: mixed
confidenceNote: >-
  **This is the rare case of a guide that really was updated for 3.30.** The
  Maxroll page is titled Covens of Umbra 3.30 and its changelog entry of
  12 November 2026 reads "Updated for PoE 3.30 Covens of Umbra". We checked,
  because several guides on this site failed that check.


  Three things are still unproven. **First, the planner is not 3.30.** Its own
  import button is labelled "Open In PoB (3.29 for 3.30)", so every number
  behind it is 3.29-era. **Second, the 3.30 page publishes no rating table at
  all** — the Difficulty Very Low / Budget Low / Mapping Great / Bossing Weak /
  Defence Average block you may have seen belongs to the *archived* plain
  Poisonous Concoction guide, last touched in July 2024, and we have not
  reproduced it as if it were current. The four ratings above are our own
  reading. **Third, the two Maxroll pages disagree about the ascendancy order**
  (see the Labyrinth table). We say which is which rather than picking one
  silently.
modes:
  ssf: >-
    One of the better choices on this site. No unique item is required, there
    is no weapon to find, and [[Poisonous Concoction of Bouncing]] is a
    transfigured gem from the [[Divine Font]] at the end of the Labyrinth,
    which you can farm yourself. The gear plan is essences and bench crafts,
    both self-found. Our assessment; the guide gives no SSF verdict.
  hardcore: >-
    The guide gives no verdict. Our read: the campaign is unusually safe,
    because you fight at range and never need a weapon upgrade. The map-level
    concern is that your damage, your recovery and your ammunition are all the
    same resource — the life flask — so anything that cuts flask charges cuts
    all three at once.

idea: |
  [[Poisonous Concoction]] is an attack you can only use with an **empty main hand and no off-hand weapon**. You throw a bottle of poison. It bursts on the ground, deals area damage, and poisons whatever it touched.

  Two things make this more than a gimmick.

  The first is where the damage comes from. Part of it is written on the gem, and part of it is **a percentage of how much life your flask recovers**. So the single biggest damage upgrade available to you is a bigger life flask. Your gear budget goes into a flask, not a bow.

  The second is the transfigured version. [[Poisonous Concoction of Bouncing]] adds "Chains +2 Times" — the bottle bursts, then bounces to a new target, then bounces again. The guide's claim is that one bottle can poison the same enemy "5 to 10 times or more". You level with the plain version and swap to this one from the [[Divine Font]].

  [[Plague Bearer]] is the other half. It banks a share of all the poison damage you deal, and when the bank is full you release it as a passive aura that kills everything you walk past. Clear and single target are the same two buttons used in a different order.

chain:
  - label: Throw
    text: "[[Poisonous Concoction]] hurls a bottle. It is an unarmed attack, so your hands must be empty; a shield is fine and the build wears one."
  - label: Bounce
    text: "The of Bouncing version chains +2 times, so one throw lands up to three bursts, and overlapping bursts poison the same enemy repeatedly."
  - label: Poison
    text: "Poison is chaos damage over time. It stacks without limit, so hit rate and poison chance matter more than any single big number."
  - label: Bank and release
    text: "[[Plague Bearer]] stores a portion of that poison damage. At maximum Plague value you release it as an aura and walk through packs with [[Withering Step]] or [[Shield Charge]]."
  - label: Pay for it
    text: "Every throw drains Life Flask charges. [[Nature's Adrenaline]] and flask-charge modifiers are therefore damage stats, not comfort stats."

chainDetails:
  - title: Your life flask is the weapon
    body: |
      This is the thing to understand before anything else.

      PoEDB lists the gem's added chaos damage as 22–33 at gem level 1 and 537–806 at gem level 20 — and **on top of that, added chaos damage equal to 6–18% of the flask's recovery amount**.

      That is why the guide's flask advice reads like weapon advice: a [[Divine Life Flask]] is best in slot from level 60, and the four-Voidstone target is "Divine Life Flasks with 50%+ Increased Amount Recovered". A better flask is a better weapon.

      It also means the usual league-start instinct — spend on the weapon slot — is wrong here. There is nothing in that slot.
  - title: How many flask charges a throw actually costs
    body: |
      **We could not settle this from the sources we had, so we are not going to state a single number.**

      The archived plain-Concoction guide says the skill removes **2 Life Flask charges** per attack. PoEDB's page for [[Poisonous Concoction of Bouncing]] lists **8 charges per projectile fired**. Those cannot both describe the same thing; they may describe the base gem versus the transfigured one, or per-attack versus per-projectile, and no source we read reconciles them.

      What is not in doubt is the consequence: flask charge generation is part of your damage. The guide's own scaling note is to take "at least 33% increased Flask Charges Gained" on the tree, which it says raises "the 3 Charges per hit to 4". It does not explain where the base 3 comes from, and we are flagging that rather than guessing.
  - title: Why the skill sometimes greys out
    body: |
      This is the single most common new-player problem with the build, and the guide gives it its own FAQ entry: "Poisonous Concoction is an unarmed attack skill, meaning you cannot have any weapon equipped."

      The usual cause is the game's auto-equip picking up a weapon for you. Unequip it and the skill comes back.

      A shield does not count as a weapon. The build wears one from Act 1, which is also where a good deal of its life and resistances come from.
  - title: What Plague Bearer actually does
    body: |
      [[Plague Bearer]] has two states. While it is "gaining" it silently banks a share of the poison damage you inflict. While it is "infecting" it spends that bank as an aura that damages everything near you.

      The guide's instruction is the same sentence for both jobs: use it "at its Maximum Plague Value". For single target you pop it on the boss; for clear you pop it and then move through the pack with [[Withering Step]] or [[Shield Charge]].

      The guide also suggests running extra Merciless Labyrinths purely to level and quality the gem, which tells you how much of the build's output sits in it.
  - title: Mana, and the four things the guide offers
    body: |
      The FAQ has an entry titled "How do I solve Mana?", which is a fair sign that it bites. The options it lists are:

      1. [[Thrill of Battle]] on the tree.
      2. Paying the cost with life instead, through a Life Mastery.
      3. Flat mana on gear.
      4. From the gear page: craft "Non-Channelling Skills have -# to Total Mana Cost" on a ring or amulet.

      None of these is presented as the answer. Expect to combine two of them.

mandatory:
  - term: Poisonous Concoction
    why: >-
      What you press for the whole campaign. Bought from Nessa at level 12,
      and it is the same gem level requirement as the transfigured version.
  - term: Poisonous Concoction of Bouncing
    why: >-
      The transfigured version, and the reason this build is written up for
      3.30 rather than its plain sibling. "Chains +2 Times" turns one throw
      into up to three bursts.
    detail: >-
      It comes from the [[Divine Font]] at the end of the Labyrinth. The guide
      has you swap to it after the Merciless Labyrinth, which is also when you
      are farming that lab for [[Plague Bearer]] levels.
  - term: Plague Bearer
    why: >-
      Your clear and your single target, both. The guide calls it and the main
      skill "both your primary clear and single target combo".
  - term: Master Toxicist
    why: >-
      Poison damage and poison chance from the ascendancy. The 3.30 page takes
      it first, where the archived guide took it second.
  - term: Nature's Reprisal
    why: >-
      Applies Wither on hit and makes each Wither stack half again as strong,
      so the enemy takes much more chaos damage. Named as the single-target
      notable.
  - term: Nature's Adrenaline
    why: >-
      Flasks gain charges on a timer. Since flask charges are your ammunition,
      this is a damage notable disguised as a convenience one.
  - term: Divine Life Flask
    why: >-
      Best in slot from level 60, because part of your damage is a percentage
      of the flask's recovery. Target 50%+ increased Amount Recovered.
  - term: Unbound Ailments Support
    why: >-
      More poison damage and longer poison duration. Present in every
      published link for this skill that we could read.
  - term: Void Manipulation Support
    why: >-
      More chaos damage. The standard partner to Unbound Ailments in the main
      link.
  - term: Withering Step
    why: >-
      Applies Wither around you and gives a burst of speed, which is also how
      you move through a pack while Plague Bearer is infecting.
  - term: Shield Charge
    level: recommended
    why: >-
      Your movement skill, and the thing you use to drag a released
      [[Plague Bearer]] through a pack. You wear a shield anyway.
  - term: Despair
    level: recommended
    why: >-
      Lowers chaos resistance, which is the resistance your whole damage
      output is measured against. Cast it on bosses.
  - term: Grace
    level: recommended
    why: >-
      The build's main aura. Listed alongside [[Flesh and Stone]] and
      [[Malevolence]]; [[Precision]] is used only at low levels.
  - term: The Embalmer
    level: recommended
    why: >-
      One of the two uniques the guide names as an early trade-league pick.
      Nothing in the build requires it.
  - term: Dendrobate
    level: recommended
    why: >-
      The other early trade-league pick. Poison-focused body armour.
  - term: Fury Valve
    level: recommended
    why: >-
      Listed as best in slot at the four-Voidstone stage. A late goal, not a
      starting one.
  - term: Apothecary's Gloves
    level: recommended
    why: >-
      3.30 changed this base's implicit from increased damage over time to
      +14–18% damage over time *multiplier*, which is a materially stronger
      kind of scaling for a poison build. The guide does not mention it.

labs:
  - lab: Normal
    node: Master Toxicist
    why: "**The two Maxroll pages disagree here.** The 3.30 page lists Master Toxicist first and [[Nature's Reprisal]] second; the archived leveling page has Nature's Reprisal around level 30 and Master Toxicist in Cruel. We follow the 3.30 page, because it is the one that was updated."
  - lab: Cruel
    node: Nature's Reprisal
    why: "The single-target notable: Wither on hit, and 50% increased Wither effect. Run it in the mid-Act-7 window."
  - lab: Merciless
    node: Nature's Adrenaline
    why: "Flask uptime, which for this build means ammunition. This is also the lab that hands you [[Poisonous Concoction of Bouncing]] from the [[Divine Font]]."
  - lab: Eternal
    node: Nature's Boon
    why: "Stronger utility flasks. Note that the 3.30 order takes none of the three notables 3.30 actually changed — see the patch notes below."

stages:
  - id: acts-1-3
    image: caustic-arrow
    title: Acts 1–3
    levels: Level 1–21
    uses: >-
      [[Caustic Arrow]] from level 2 and [[Shrapnel Ballista]] from level 4,
      then [[Poisonous Concoction]] at 12, which is where the build really
      starts. Put a shield in your off hand and nothing in your main hand.
    changes: >-
      [[Plague Bearer]] and [[Despair]] arrive at 21 in Act 3 and the
      two-button rhythm appears. [[Herald of Agony]], [[Blood Rage]] and
      [[Summon Skitterbots]] come in at 16.
    links:
      - name: Level 2–11
        gems: [Caustic Arrow, Pierce Support, Lesser Multiple Projectiles Support]
      - name: From level 12
        gems: [Poisonous Concoction, Volley Support, Onslaught Support]
      - name: Four-link by level 18
        gems: [Poisonous Concoction, Volley Support, Onslaught Support, Faster Attacks Support]
      - name: Utility
        gems: [Withering Step, Smoke Mine, Herald of Agony, Blood Rage]
    moveOn: "Poisonous Concoction is in a four-link, Plague Bearer is on your bar, and you have finished Act 3."
    details:
      - title: Where this level-by-level list comes from, and its weakness
        body: |
          **The 3.30 page does not contain a leveling walkthrough.** Maxroll keeps the skill-and-gem detail inside an embedded planner tool that is not readable as text, and the prose sections only name the skills, not the links.

          The levels above come from the **archived** companion guide's leveling page, which is stamped 3.29-era and sits under the plain Poisonous Concoction build. We used it because it is the only published level-by-level route for this skill, and because quest reward levels do not move between leagues. Treat the support gems as a reasonable route rather than the author's current intent.
      - title: The gem list the archived page gives
        body: |
          - **Level 2:** [[Caustic Arrow]] from Tarkleigh, with [[Pierce Support]].
          - **Level 4:** [[Shrapnel Ballista]] and [[Dash]] from Tarkleigh; [[Mirage Archer Support]], [[War Banner]] and a [[Quicksilver Flask]] from Nessa.
          - **Level 8:** [[Lesser Multiple Projectiles Support]] from Nessa.
          - **Level 10:** [[Smoke Mine]], replacing Dash.
          - **Level 12:** [[Poisonous Concoction]] from Nessa, plus [[Withering Step]], [[Onslaught Support]] and [[Volley Support]].
          - **Level 16:** [[Herald of Agony]] from Greust; [[Blood Rage]] and [[Summon Skitterbots]] from Yeena.
          - **Level 18:** [[Faster Attacks Support]] from Silk.
          - **Level 21:** [[Despair]] from Maramoa and [[Plague Bearer]] from Clarissa.

          [[Volley Support]] is the normal-play support and [[Onslaught Support]] is swapped in for boss fights.
      - title: Empty hands, full off-hand
        body: |
          Equip a shield as soon as one drops and keep your main hand empty for the rest of the character's life. Any shield will do early; later you want a rare with life and resistances.

          Turn off auto-equip if you can, or expect the skill to grey out the first time a sword drops on your cursor.
      - title: Bandits and Pantheon
        body: |
          **The 3.30 page is a placeholder on both.** It says only "Take a look at this section to learn the details about the Pantheon and Bandits" and then gives no details.

          The archived page's answer is to **kill all three bandits** for the extra passive point, and to take **Soul of the Brine King** as major with **Soul of Abberath** as minor. That same page then contradicts itself by selecting Ralakesh in Act 7. We report the conflict rather than resolve it.
  - id: acts-4-10
    image: asc-pathfinder
    title: Acts 4–10
    levels: Level 21–68
    uses: >-
      [[Poisonous Concoction]] with [[Unbound Ailments Support]] once you reach
      level 27, [[Plague Bearer]] on cooldown, and [[Grace]] as your aura.
      [[Shield Charge]] replaces [[Smoke Mine]] for movement.
    changes: >-
      You ascend three times. [[Increased Area of Effect Support]] and
      [[Flame Dash]] arrive at 42. After the Act 5 and Act 10 bosses you lose
      30% of every elemental resistance each time, so aim for roughly 105%
      before Kitava.
    links:
      - name: Main skill
        gems: [Poisonous Concoction, Volley Support, Unbound Ailments Support, Faster Attacks Support, Void Manipulation Support]
      - name: Clear and single target
        gems: [Plague Bearer, Withering Step]
      - name: Auras
        gems: [Grace, Malevolence, Precision]
      - name: Curse and movement
        gems: [Despair, Shield Charge, Flame Dash]
    moveOn: "resistances are back at 75% after Act 10, you have three ascendancy points' worth of notables, and Plague Bearer is leveled."
    details:
      - title: The one place the build is genuinely awkward
        body: |
          Mana. It is the subject of its own FAQ entry on the 3.30 page, and the four fixes it offers are listed in the mechanics section above. The cheapest of them during the campaign is flat mana on gear and a mana flask; the real fix, a crafted "-# to Total Mana Cost of Non-Channelling Skills", arrives later.
      - title: Passive tree, as far as the guide commits
        body: |
          The 3.30 page names exactly one tree target in prose: **at least 33% increased Flask Charges Gained**, which it says takes your charges per hit from 3 to 4.

          The archived page adds one notable, **[[Graceful Assault]]**, around level 27.

          Everything else lives in the embedded planner. **We are not going to reconstruct a tree we cannot read.** Open the guide's planner and follow its node order.
      - title: Flasks during the campaign
        body: |
          The archived page's flask plan: two life, one mana and two quicksilver by level 13; a [[Jade Flask]] around 38; a [[Quartz Flask]] in Act 7; a [[Sulphur Flask]] in Act 10.

          Keep your life flasks current. They are not a safety net here, they are the magazine.
  - id: early-maps
    image: divine-life-flask
    title: Early maps
    levels: White and yellow maps, one to two Voidstones
    uses: >-
      [[Poisonous Concoction of Bouncing]] in a five- or six-link, a
      [[Divine Life Flask]] from level 60, and rare gear rolled with essences.
    changes: >-
      The transfigured gem goes in after the Merciless Labyrinth and the clear
      changes character completely. [[Cast when Damage Taken Support]] with
      [[Immortal Call]] goes in as a guard.
    links:
      - name: Main skill
        gems: [Poisonous Concoction of Bouncing, Unbound Ailments Support, Void Manipulation Support, Vicious Projectiles Support, Greater Volley Support]
      - name: Clear and single target
        gems: [Plague Bearer, Withering Step]
      - name: Auras
        gems: [Grace, Malevolence, Flesh and Stone]
      - name: Guard and curse
        gems: [Cast when Damage Taken Support, Immortal Call, Despair]
    moveOn: "the guide's own one-Voidstone target: around 3,000 life and energy shield combined, and a million damage per second in the planner."
    details:
      - title: The numbers the guide actually publishes
        body: |
          It gives progression targets rather than measured stats, and **all of them are 3.29-era**, because the planner behind them is labelled "3.29 for 3.30":

          - **Two Voidstones:** "3K+ Life & Energy Shield and 1Million+ DPS."
          - **Four Voidstones:** "3.6K to 4K+ Life & Energy Shield and 2Million to 3Million+ DPS."

          There is no effective-hit-point figure anywhere in the guide, and no measured damage number for any specific gear set. Do not treat these as what you will see on your own character.
      - title: Gearing is essences, not trade
        body: |
          The guide's gear plan is a list of essences by slot: Shrieking Essence of Loathing on the helmet, Screaming or Deafening Essence of Zeal on gloves and boots, Deafening Essence of Greed on the shield, and Shrieking Essence of Rage or Envy on the belt. Then a [[Stygian Vise]] with an abyss jewel, Eldritch currency on the right slots, and gambling with Faustus for a body armour.

          This suits 3.30. Red maps now only drop Screaming-tier essences and better, so the tiers this plan wants get easier to find as you progress — while the cheap low tiers you would use on leveling gear now only come from white maps and the campaign.
      - title: The one map modifier to reroll
        body: |
          The 3.30 FAQ names exactly one: **"Monsters have +50% Chance to Block Attack Damage."** Poisonous Concoction is an attack, so a blocked throw is a throw that did nothing and still spent flask charges.

          The archived page adds three more worth avoiding: chance to avoid poison, monsters with extra chaos resistance, and −% maximum resistances. It also lists reduced aura effect, which matters once [[Grace]] and [[Flesh and Stone]] are carrying your defence.
  - id: red-maps
    image: asc-icon-pathfinder
    title: Red maps and beyond
    levels: Tier 11–16 maps, three to four Voidstones
    uses: >-
      A six-link with awakened supports where you can afford them,
      [[Petrified Blood]] added to the aura block, and the best
      [[Divine Life Flask]] you can roll.
    changes: >-
      Upgrades become flask rolls and gem quality rather than new items. The
      aspirational unique list opens up, and none of it is required.
    moveOn: "there is no next stage. What is left is flask rolls, awakened gems and the aspirational uniques."
    details:
      - title: What a finished link looks like
        body: |
          **The guide does not print its six-link as text.** The setup below is from community Path of Building files for this skill in 3.29, which agree with each other:

          [[Poisonous Concoction of Bouncing]], [[Unbound Ailments Support]], [[Void Manipulation Support]], [[Vicious Projectiles Support]], [[Greater Volley Support]] and [[Greater Multiple Projectiles Support]], with the awakened versions of the first three at the top end.

          Flagged as a cross-reference, not as the author's own list.
      - title: The aspirational list, and why it is not a plan
        body: |
          The guide's own aspirational slots are [[Svalinn]], [[Fury Valve]], [[Snakebite]], [[Ralakesh's Impatience]], [[Olesya's Delight]], [[Dying Sun]], [[Progenesis]] and [[Betrayal's Sting]].

          Every one of those was expensive in 3.29 and **no price for any of them exists for 3.30**, because there is no economy yet. Read the list as a direction, not a shopping trip.
      - title: What it does not do
        body: |
          - Nothing in the guide addresses Uber pinnacle bosses, so we make no claim about them.
          - Poison is damage over time, so there is no burst. A boss with a short damage window is a worse match than a boss with a long one.
          - The build is unarmed, which locks you out of every weapon-based scaling route for the rest of the league.

patch:
  - entry: pathfinder-flask-changes
    note: >-
      **Check this one before you believe a tier list.** 3.30 changed exactly
      three Pathfinder notables: [[Master Surgeon]], [[Master Alchemist]] and
      [[Master Distiller]]. The 3.30 guide's ascendancy order takes
      **none of them** — it takes [[Master Toxicist]],
      [[Nature's Reprisal]], [[Nature's Adrenaline]] and [[Nature's Boon]]. So
      one popular 3.30 tier list placing this build in A tier "because 3.30
      buffed Pathfinder" is reasoning from changes this allocation never
      touches. The build may well deserve A; that is not the reason.


      One change is worth a swap, though: Master Alchemist now removes **all**
      ailments on flask use, Bleeding and Poison included, where it used to
      remove only elemental ones. That is a real option for a build that
      presses a flask constantly.
  - entry: special-base-implicits
    note: >-
      **The actual 3.30 buff to this build, and the guide misses it.**
      [[Apothecary's Gloves]] changed from 14–18% *increased* damage over time
      to +14–18% damage over time *multiplier*. Multiplier is a separate and
      stronger kind of scaling, and your whole output is damage over time. The
      one nerf in the same entry, the Amethyst Ring implicit dropping to
      +13–19% chaos resistance, costs you a little resistance and nothing else.
  - entry: essence-changes
    note: >-
      **Mildly favourable, because the gear plan is essence-based.** Red maps
      now generate only Screaming-tier essences and above, which is the tier
      range the guide's recipes call for. The catch is the other end: Weeping
      and Wailing essences are gone from yellow and red maps, so use the cheap
      ones you find in the campaign on your leveling gear instead of hoarding
      them.
  - entry: ruthless-changes
    note: >-
      **Pathfinder is in both lists, which is exactly how people get this
      wrong.** 3.30 has real normal-game Pathfinder changes *and* a
      Ruthless-only section that adjusts about twenty ascendancy notables,
      Pathfinder's among them. So "Pathfinder was changed in 3.30" is true of
      both sections and tells you nothing. If you read a specific Pathfinder
      number this league, check which section it came from before you rebuild
      a tree around it.
  - note: >-
      **The skill itself was not touched.** Neither
      [[Poisonous Concoction]] nor [[Poisonous Concoction of Bouncing]] appears
      in the 3.30 skill changes, and PoEDB's most recent change to the
      transfigured gem is from 3.27. Nothing in the patch moves its damage.
  - note: >-
      **The planner is still 3.29.** The guide's import button says so in as
      many words: "Open In PoB (3.29 for 3.30)". Every damage and life figure
      it produces predates this patch.

strengths:
  - "No weapon slot. You never buy, craft or upgrade a weapon, all league."
  - "No unique item is required, which the guide states outright."
  - "Very strong clear once Plague Bearer and the bouncing version are both online."
  - "Poison is chaos damage over time, so enemy energy shield does nothing."
  - "Cheap to gear: essences and the crafting bench, not the trade site."
  - "Excellent solo self-found pick, including the transfigured gem."
weaknesses:
  - "Mana is bad enough to have its own FAQ entry."
  - "Your damage, your recovery and your ammunition are one resource. Lose flask charges and you lose all three."
  - "Auto-equip picks up a weapon and silently disables your main skill."
  - "Damage over time means no burst. Short boss windows are a poor match."
  - "The guide publishes no currency figures at all, so you cannot plan a budget from it."
  - "Its planner is 3.29, and its rating block belongs to an archived guide."
avoidIf: >-
  Pick something else if you want to feel a weapon upgrade, if you want burst
  damage, or if you want a build whose budget you can plan from published
  prices — this one gives none. Skip it too if a build that cannot function
  with anything in its hands sounds like a trap you will fall into; it is, and
  the guide's own FAQ exists because people do.

