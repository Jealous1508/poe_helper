name: Lacerate Bleed Gladiator
tagline: >-
  Two wide slashes from arm's length put one huge bleed on everything in front
  of you, behind a shield that blocks close to nine hits in ten. It starts on
  almost no gear.
class: Duelist
ascendancy: Gladiator
role: starter
budget: starter
budgetNote: >-
  **The main written guide quotes no prices at all.** It says only that the
  build "requires nothing to function", that [[Jack, the Axe]] "is cheap even
  with a fortify corruption", and that [[Ryslatha's Coil]] is "likely far too
  expensive early". The one source with numbers is a video description
  published two days before the league: Tier 16 maps "for 200 Chaos Orbs",
  scaling "up to over 170 divines". Those figures were written before 3.30 had
  an economy, so they are **3.29 prices** and a rough guide only.
mainSkill: Lacerate of Haemorrhage
image: lacerate-of-haemorrhage
hero: art-gladiator
tags: [Melee, Bleed, Block, Tanky]
ratings: { clear: 3, bossing: 4, survivability: 5, ease: 3 }
verified: "2026-11-14"
confidence: mixed
confidenceNote: >-
  **The four ratings are ours.** No source publishes a rating block for this
  build. The mechanics are proven: bleed [[Gladiator]] has been a league
  starter for years and 3.30 did not touch it. The sources are weaker than
  they look. The PoE Vault guide carries a 3.30 banner dated 12 November 2026,
  but the only entry in its changelog is from March 2020 and its Path of
  Building files use the 3.27 and 3.28 passive trees. Two creators published
  3.30 videos on 11 November; we read their descriptions and decoded their
  Path of Building files (3.29 trees) but did not watch the videos. Nobody had
  played 3.30 when any of this was written. Every damage, life and price
  figure below is 3.29-era or older.
modes:
  ssf: >-
    Works. The guide's own words are that it "requires nothing to function":
    the skill gem is a quest reward, block comes from the ascendancy, and
    [[Resolute Technique]] removes accuracy from your gear. You upgrade the gem
    at the [[Divine Font]] in the Labyrinth. [[Jack, the Axe]] and
    [[Ryslatha's Coil]] are drops you may never see; the published fallback for
    the axe is a rare one crafted with Jagged Fossils.
  hardcore: >-
    No source gives a verdict, and the main Path of Building file opens with
    "We're on softcore." Our read: the block is strong enough, but the
    low-budget file has 4,025 life, no spell suppression and −6% chaos
    resistance. Take the guide's suppression option early and fix chaos
    resistance before you trust it.

idea: |
  [[Lacerate of Haemorrhage]] swings twice. Each swing sends out a wide wave, and an enemy standing where the two waves cross is hit by both. The waves reach well past your weapon, so this is melee that plays from a step back.

  You are not trying to kill with the hits. Every hit can cause Bleeding, a physical damage-over-time effect sized by the hit that caused it. The gem multiplies that bleed: up to 132% more damage with bleeding at level 20, and 40% more on top from 20% quality.

  Normally a bleed only does full damage while the enemy walks. [[Jagged Technique]] removes that condition. Every bleed you cause is **aggravated**, which means it always counts the enemy as moving. That is three times the damage, on a boss that stands still.

  Monsters that die while bleeding explode for a fifth of their life ([[Gratuitous Violence]]), which is how you clear maps.

  The other half of [[Gladiator]] is the shield. Any shield gives you 50% block, extra attack block spills over into spell block, and the last ascendancy point makes every block roll twice and keep the better result.

chain:
  - label: Slash twice
    text: "[[Lacerate of Haemorrhage]] sends out two waves. Enemies in the overlap take both hits. It needs a one-handed axe or sword."
  - label: Bleed
    text: "Each hit has a chance to cause Bleeding. Only your strongest bleed on an enemy deals damage, so big hits matter and fast hits do not."
  - label: Aggravate
    text: "[[Jagged Technique]] makes every bleed aggravated: it always deals damage as if the enemy were moving, which is three times the normal rate."
  - label: Explode and block
    text: "[[Gratuitous Violence]] explodes bleeding enemies you kill. [[Determined Survivor]] and [[More Than Skill]] give you 50% block from any shield, rolled twice."

chainDetails:
  - title: Only your biggest bleed counts
    body: |
      PoEDB's wording for Bleeding is that it "deals Physical Damage over time, based on the base Physical Damage of the Skill". A second bleed on the same enemy does not add to the first. The stronger one deals damage and the weaker one waits.

      So the build does not care about your average hit. It cares about the top of your damage range, because sooner or later you roll high and that bleed is the one that ticks.

      Three pieces in every published version exist for this reason:

      - [[Volatility Support]]: 30–58% more maximum attack damage, 50–69% less minimum.
      - The Physical Mastery "10% more Maximum Physical Attack Damage".
      - [[Ryslatha's Coil]] later: up to 40% more maximum and up to 40% less minimum physical attack damage.

      The low rolls these create are simply overwritten.
  - title: What the transfigured gem changes
    body: |
      Base [[Lacerate]] has two stances. It can only cause Bleeding in Blood Stance, where it has 25% chance to bleed and 50–88% more damage with bleeding. It attacks at 60% of your weapon's speed.

      [[Lacerate of Haemorrhage]] drops the stances. It always has the 25% chance and 75–132% more damage with bleeding, plus up to 40% more from quality, and it attacks at 80% of base speed. In exchange it only works with a one-handed axe or sword.

      Those figures are from PoEDB. The guide's "172% more" is the level 20 value plus the 20% quality bonus. It calls the gem a straight upgrade over the base version and says it "should be acquired as early as possible".

      **Quality matters more than usual on this gem.** A gem in a socket of its own colour also gets a small quality bonus, so put it in a green socket.
  - title: "Two schools: Jagged Technique or Crimson Dance"
    body: |
      The written guide and one of the two video builds take [[Jagged Technique]]. One enormous aggravated bleed, refreshed by every hit.

      The most-watched 3.30 video build does the opposite. Its tree takes the [[Crimson Dance]] keystone and the ascendancy notable [[War of Attrition]], and skips Jagged Technique.

      The live tree text explains the trade. Crimson Dance: "You can inflict Bleeding on an Enemy up to 8 times", but your bleeding "cannot be Aggravated" and deals 50% less damage. War of Attrition: 1% more damage to rare and unique enemies for each second they have been in your presence, up to 100%.

      So that version stacks eight weaker bleeds and gets stronger the longer a boss lives. Its author says it reaches the game's damage-over-time cap, and his file does read exactly that figure, 35.8 million per second, on gear he prices at over 170 Divine (3.29).

      **This article follows the Jagged Technique version.** It is the one with a written guide and a tree for every level bracket, and it is at full strength on the first hit after every dodge. We did not test either.
  - title: A shield, or two weapons
    body: |
      [[Determined Survivor]] has two lines: "Gain 50% Chance to Block from Equipped Shield instead of the Shield's value", and "Inherent Bonuses from Dual Wielding are doubled".

      The written guide uses the first line. Any shield at all gives 50% block, so you choose the shield for its other modifiers.

      One video build uses the second line with an axe and the sword [[Rigwald's Command]]. Its author writes that this "gives us more damage but requires slightly more investment to cap block". His file shows the same 87.75% attack and spell block either way.

      Start with the shield. It is cheaper and both written milestones assume it.
  - title: Endurance charges are damage here
    body: |
      The Bleeding Mastery gives "+3% to Damage over Time Multiplier for Bleeding per Endurance Charge". Every published tree takes it.

      Charges come from the notable Deflection (25% chance to gain one when you block) and from [[Enduring Cry]]. While you are in a pack you block constantly and stay full. At the start of a boss fight you have none.

      That is why the guide rates [[Kaom's Sign]] so highly: the ring adds one maximum endurance charge, and here a charge is damage as well as defence.
  - title: Blood Magic or mana, the sources disagree
    body: |
      The guide's low and medium budget trees take [[Blood Magic]]. You have no mana, skills cost life, and [[Pride]] runs through [[Eternal Blessing Support]] with no reservation. The guide calls that its only aura.

      The same guide's high-budget file drops Blood Magic and runs [[Pride]] and [[Determination]] on mana. Both video builds stay on mana from the start.

      There is also a wobble inside the levelling file: the tree for levels 52–67 has Blood Magic, the next tree does not, and the finished low-budget tree has it again. **Follow the finished tree, and check which keystones you really have before copying a gem setup.**
  - title: One number the guide gets wrong about itself
    body: |
      The guide's overview says that even with the best gear, damage is "unlikely to exceed ~5m DPS".

      Its own two high-budget Path of Building files read 14.4 and 17.8 million bleed damage per second, and a note inside one of them values a single jewel at "about 2.5 million dps, so roughly a fifth".

      The prose and the files cannot both be right. The files are newer (3.28 trees; the text predates them), so we treat the 5 million line as stale. All of these are Path of Building figures on old trees, with the enemy assumed bleeding, maimed and cursed.

mandatory:
  - term: Lacerate of Haemorrhage
    why: >-
      The skill. Up to 132% more damage with bleeding without needing a stance,
      and a faster attack than the base gem.
    detail: >-
      It is a transfigured gem: you get it from the [[Divine Font]] at the end
      of the Labyrinth, or from another player. Base [[Lacerate]] is a level 12
      quest reward for the Duelist and carries you until then. It requires a
      one-handed axe or sword, which is why you only switch to it once you hold
      a shield.
  - term: Jagged Technique
    why: >-
      "Bleeding you inflict is Aggravated." Three times the bleed damage on
      anything, moving or not.
    detail: >-
      One 3.30 video build replaces it with [[Crimson Dance]] and
      [[War of Attrition]]. See the section on the two schools above.
  - term: Gratuitous Violence
    why: >-
      Bleeding enemies you kill explode for 20% of their maximum life as
      physical damage. This is your map clear.
  - term: Determined Survivor
    why: >-
      50% block chance from any shield, whatever the shield says. You never
      shop for block rolls.
  - term: More Than Skill
    why: >-
      "Chance to Block Attack or Spell Damage is Lucky if you've Blocked
      Recently." The low-budget file reads 87.75% attack block with it.
  - term: Versatile Combatant
    why: >-
      Lowers your maximum block by 10%, and gives 2% spell block for every 1%
      of attack block above the cap. It is how spell block catches up.
    detail: >-
      It only pays if your attack block is over the cap. The trees get there
      with the Shield Mastery, Deflection and Aggressive Bastion.
  - term: Resolute Technique
    why: >-
      Your hits cannot be evaded and never crit. Bleeds cannot crit anyway, so
      you lose nothing and need no accuracy on gear.
  - term: Brutality Support
    why: >-
      More physical damage, and the skill deals no other damage type. In all
      four published six-links.
  - term: Melee Physical Damage Support
    why: >-
      In all four published six-links. The guide prefers it to
      [[Ruthless Support]]: about the same damage, with fewer conditions.
  - term: Volatility Support
    why: >-
      30–58% more maximum attack damage for 50–69% less minimum. Only the
      biggest bleed counts, so the downside costs nothing.
    detail: >-
      The Duelist buys it from Yeena in Act 2 after the quest Sharp and Cruel.
      It needs level 18.
  - term: Pride
    level: recommended
    why: >-
      The damage aura in every version. Nearby enemies take more physical
      damage.
  - term: Vulnerability
    level: recommended
    why: >-
      Cursed enemies take more physical damage. The guide lists a "manual
      curse" among the buttons you press.
  - term: Enduring Cry
    level: recommended
    why: >-
      Endurance charges on demand. Linked to [[Urgent Orders Support]] so the
      shout is quick. Press it at the start of every boss.
  - term: Jack, the Axe
    level: recommended
    why: >-
      The guide's starting weapon: 130–150% increased physical damage and
      +25–35% to bleed damage over time multiplier, and it grants a skill that
      gives 20% more damage with bleeding.
    detail: >-
      It requires level 65, which fits the switch to one-handed at about 68.
      The author's note: "incredibly potent early on. Consider grabbing this if
      it is cheap." His fallback is a rare axe made with Jagged Fossils.
  - term: Kaom's Sign
    level: recommended
    why: >-
      +1 maximum endurance charge on a ring. Each charge is 3% bleed multiplier
      and some mitigation.
    detail: >-
      The guide says: if it becomes very expensive, wear an Amethyst Ring
      instead.
  - term: Ryslatha's Coil
    level: recommended
    why: >-
      The best belt in every source. It widens your physical damage range, and
      the top of the range is what your bleed is made of.
    detail: >-
      The guide warns it is "likely far too expensive early" and suggests
      [[Belt of the Deceiver]] or a rare Stygian Vise until then.

labs:
  - lab: Normal
    node: Gratuitous Violence
    why: "The guide gives the order without reasons. Its levelling tree does this lab at about level 33. Explosions help at once; the block nodes do nothing until you hold a shield."
  - lab: Cruel
    node: Jagged Technique
    why: "Level 44–52 in the guide's trees. From here your bleed is always aggravated."
  - lab: Merciless
    node: Determined Survivor
    why: "Level 52–67 in the guide's trees. This is the cue to move to a one-handed axe and a shield. One video build takes this second and Jagged Technique third."
  - lab: Eternal
    node: More Than Skill
    why: "Lucky block. Last, because it multiplies a block chance that has to exist first."

stages:
  - id: acts-1-3
    phase: early
    image: sunder
    title: Acts 1–3
    levels: Level 1–33
    uses: >-
      A two-handed weapon and a slam. [[Ground Slam]] from level 1, then
      [[Sunder]] from level 12. You are not playing Lacerate yet.
    changes: >-
      After the Chamber of Sins in Act 2 you add [[Blood Rage]],
      [[Herald of Purity]] and [[Warlord's Mark]]. Normal Labyrinth gives you
      [[Gratuitous Violence]], and the tree picks up
      [[Resolute Technique]] at the same time.
    links:
      - name: Act 1, before Merveil
        gems: [Ground Slam, Ruthless Support, Maim Support]
      - name: After Merveil
        gems: [Sunder, Maim Support, Ruthless Support]
      - name: Act 2 four-link
        gems: [Sunder, Close Combat Support, Chance to Bleed Support, Cruelty Support]
      - name: Movement and warcry
        gems: [Leap Slam, Faster Attacks Support, Frostblink, Intimidating Cry]
      - name: Buffs
        gems: [Blood and Sand, War Banner, Blood Rage, Herald of Purity, Warlord's Mark]
    moveOn: "Sunder is in a four-link, Normal Labyrinth is done, and you are in Act 4."
    details:
      - title: Three sources, three levelling routes
        body: |
          They agree on the destination and not on the road.

          - **The written guide:** two-handed slams the whole campaign, switching to Lacerate after the Merciless Labyrinth, at about level 68. This is the route above. Its file says Sunder against Ground Slam is "100% preference".
          - **One video build:** the same slams, then [[Bladestorm]] from Act 6, then [[Lacerate]] in Act 10.
          - **The other video build:** [[Splitting Steel]] first, then base Lacerate from level 12 "until you can either farm lab or trade for the alternate gem".

          We follow the written guide because it is the only one with a tree for each level bracket. If you would rather learn the real skill early, the third route is legitimate: base Lacerate works with two-handed axes and swords.
      - title: Where the gems come from
        body: |
          - **Level 4:** [[Blood and Sand]], Duelist reward for Breaking Some Eggs.
          - **Level 12:** [[Lacerate]], Duelist reward for The Siren's Cadence. Take it even if you level with Sunder, so it gains experience in a spare socket.
          - **Level 18:** [[Volatility Support]], bought from Yeena after Sharp and Cruel in Act 2.

          The guide's file notes that Blood Rage, Herald of Purity and the mark all arrive together after the Chamber of Sins.

          **The guide does not say where the Duelist gets Ground Slam or Sunder.** Its file simply starts with them. We are not going to guess the vendor.
      - title: The Brutus trick
        body: |
          The guide's Act 1 gem set has a small extra link labelled "Grab these for Brutus": [[Double Strike]] with [[Chance to Bleed Support]]. It is a single-target tool for one fight, on a character whose slam is slow at that level.
  - id: acts-4-10
    phase: early
    image: jagged-technique
    title: Acts 4–10
    levels: Level 33–68
    uses: >-
      Still [[Sunder]] on a two-handed weapon. From Act 5, [[Pride]] linked to
      [[Eternal Blessing Support]] replaces [[Blood and Sand]] and
      [[Herald of Purity]].
    changes: >-
      Two more labs: [[Jagged Technique]] at level 44–52 and
      [[Determined Survivor]] at 52–67. Then the one big respec of the build:
      one-handed axe, shield, and [[Lacerate]].
    links:
      - name: Main skill
        gems: [Sunder, Close Combat Support, Chance to Bleed Support, Cruelty Support]
      - name: Aura from Act 5
        gems: [Pride, Eternal Blessing Support]
      - name: Buffs
        gems: [War Banner, Intimidating Cry, Blood Rage, Warlord's Mark]
      - name: After the switch
        gems: [Lacerate, Volatility Support, Melee Physical Damage Support, Brutality Support]
      - name: Movement after the switch
        gems: [Shield Charge, Faster Attacks Support, Culling Strike Support, Maim Support]
      - name: Charges after the switch
        gems: [Enduring Cry, Urgent Orders Support]
    moveOn: "Merciless Labyrinth is done, you hold a one-handed axe and a shield, and the two-handed passives are refunded."
    details:
      - title: The switch, step by step
        body: |
          The guide's levelling file has a tree named for it: "Clean up. Unspec 2H nodes, go shield." In one sitting:

          1. Take [[Determined Survivor]] in the Merciless Labyrinth.
          2. Equip a one-handed axe and any shield. The shield's own block value does not matter.
          3. Refund the two-handed damage notables and the Two Hand Mastery.
          4. Take [[Versatile Combatant]], the Shield Mastery ("+1% Chance to Block Attack Damage per 5% Chance to Block on Equipped Shield"), the Block Mastery ("+1% Chance to Block Spell Damage per 5% Chance to Block Attack Damage") and the Axe Mastery ("Bleeding you inflict deals Damage 15% Faster").
          5. Put [[Lacerate]] in your best links.

          [[Jack, the Axe]] requires level 65, so it can be the axe you switch to.
      - title: Base Lacerate needs Blood Stance
        body: |
          Until you have the transfigured gem, the base gem only bleeds in Blood Stance. PoEDB notes that you are in Blood Stance by default.

          The guide is blunt about the other one: dipping into Sand Stance makes damage "feel really bad". If your damage vanishes, check that you did not press [[Blood and Sand]] by accident.
      - title: The guard link is optional for now
        body: |
          The guide's switch-over gem set adds a low-level [[Cast when Damage Taken Support]] link with [[Molten Shell]], [[Purifying Flame]] and [[Cold Snap]]. Its own label reads: "Spells not important yet. Ditch if no blue sockets."
      - title: Bandits and Pantheon
        body: |
          The guide offers both: kill all three bandits for the passive point, or help **Alira** for 15% to all elemental resistances, which it calls the league-start option. You can change later.

          Pantheon: **Soul of the Brine King** as the major power, for freeze and chill. **Soul of Abberath** as the minor, against burning ground.
  - id: early-maps
    phase: early
    image: determined-survivor
    title: Early maps
    levels: White and yellow maps
    uses: >-
      [[Lacerate]] in your best links, [[Jack, the Axe]] if you can get one, a
      shield, [[Kaom's Sign]], and rare armour pieces with life and
      resistances.
    changes: >-
      Get [[Lacerate of Haemorrhage]] as early as you can. Run the Eternal
      Labyrinth for [[More Than Skill]]. Add [[Fortify Support]] and
      [[Cruelty Support]] as you gain links.
    links:
      - name: Main skill (six-link)
        gems: [Lacerate of Haemorrhage, Volatility Support, Brutality Support, Melee Physical Damage Support, Cruelty Support, Fortify Support]
      - name: Aura
        gems: [Pride, Eternal Blessing Support]
      - name: Movement
        gems: [Shield Charge, Faster Attacks Support, Maim Support, Culling Strike Support]
      - name: Charges and buffs
        gems: [Enduring Cry, Urgent Orders Support, Blood Rage, War Banner]
      - name: Guard
        gems: [Cast when Damage Taken Support, Molten Shell, Purifying Flame, Cold Snap]
      - name: Curse and blink
        gems: [Vulnerability, Frostblink]
    moveOn: "you have the transfigured gem, capped resistances, lucky block, and chaos resistance out of the negatives."
    details:
      - title: What the low-budget character looks like
        body: |
          From the guide's low-budget file at level 90:

          - 4,025 life, 8,279 armour, 68% physical damage reduction.
          - 87.75% attack block and 79.75% spell block.
          - No spell suppression.
          - Resistances 79/78/79, and chaos at **−6%**.
          - About 2 million bleed damage per second.

          **This file uses the 3.27 passive tree.** It also assumes the enemy is bleeding, maimed and cursed. Read the chaos line twice: it is the weak point of the cheap version.
      - title: Before you have six links
        body: |
          The guide's stopgap is the unique helmet [[The Bringer of Rain]], which acts as a six-link in one item. It takes away your body armour slot. The guide calls that a fair trade early, because early body armours are weak, and tells you to replace it once you can afford a proper six-link.

          Which gems to drop on four or five links is shown in the switch-over gem set: [[Volatility Support]], [[Melee Physical Damage Support]] and [[Brutality Support]] come first.
      - title: The shield
        body: |
          Because block comes from the ascendancy, the shield is chosen for one modifier: "Recover 5% of Life when you Block". The guide accepts 4% on a tight budget, then armour, then life.

          That modifier needs a Shaper-influenced shield. The guide tells you to craft it yourself and calls it "rather simple once you have the base", **but it does not print the steps**; it points to a separate crafting hub. We could not verify a recipe, so we do not give one.
      - title: Rare gear and one mastery
        body: |
          The guide's low-budget list: armour bases everywhere, with resistances and life first. Movement speed on boots. Attack speed and life on gloves. The amulet is one of the best places to find physical damage over time multiplier.

          One trap: the tree takes the Life Mastery "15% increased maximum Life if there are no Life Modifiers on Equipped Body Armour". So the file says to avoid life on the chest "until you can get a really, really good one"; the guide's line is that a life roll above 100 is worth dropping the mastery for.
      - title: Flasks
        body: |
          A Divine [[Life Flask]] with instant recovery and bleed removal, then [[Granite Flask]], [[Silver Flask]], [[Sulphur Flask]] and [[Quicksilver Flask]].

          The published flasks use the prefix that gains charges when you are hit. The guide has two rules:

          1. One utility flask must have increased armour during its effect, ideally 50%.
          2. One must give freeze immunity, which it calls mandatory, until your Brine King power is upgraded.
  - id: red-maps
    phase: endgame
    image: versatile-combatant
    title: Red maps
    levels: Tier 11–16 maps
    uses: >-
      The guide's medium budget. Armour-and-evasion gear with spell
      suppression, a crafted [[Reaver Axe]], [[Ryslatha's Coil]], and a
      [[Lacquered Buckler]] with life on block.
    changes: >-
      Spell suppression goes from nothing to 100%, and [[Iron Reflexes]] turns
      the evasion on the new gear into armour. Then the weapon. The guide's
      order is explicit: suppression gear before the axe.
    links:
      - name: Main skill
        gems: [Lacerate of Haemorrhage, Melee Physical Damage Support, Brutality Support, Volatility Support, Cruelty Support, Fortify Support]
      - name: Aura
        gems: [Pride, Eternal Blessing Support]
      - name: Curse and buff
        gems: [Vulnerability, Enhance Support, Blood Rage]
      - name: Charges
        gems: [Enduring Cry, Urgent Orders Support, More Duration Support, War Banner]
      - name: Movement
        gems: [Shield Charge, Faster Attacks Support, Maim Support, Culling Strike Support]
      - name: Guard
        gems: [Cast when Damage Taken Support, Vaal Molten Shell, Cold Snap, Purifying Flame]
    moveOn: "suppression is capped, the axe is crafted, and Tier 16 maps are routine."
    details:
      - title: What this version costs you and gives you
        body: |
          From the medium-budget file at level 95, on the 3.28 tree:

          - 5,942 life, 10,896 armour, 85% physical damage reduction.
          - 89.76% attack block, 87.75% spell block, 100% spell suppression.
          - Resistances 82/80/81, chaos 71%.
          - Largest physical hit survived: 19,851, up from 8,117 in the low-budget file.
          - About 3.3 million bleed damage per second.

          The damage rises by about two thirds. The defence more than doubles. That is the real point of this stage.

          **No source prices this gear set.** The only figures anywhere are the video author's 200 Chaos for a Tier 16 start and over 170 Divine for his finished character, both 3.29.
      - title: The gear that changes
        body: |
          - **Helmet, body, gloves, boots:** armour-and-evasion or evasion bases with spell suppression. The file's amulet anoints the notable Inveterate for the last 15%.
          - **Shield:** a Shaper [[Lacquered Buckler]] with "Recover 5% of Life when you Block" and suppression.
          - **Axe:** a rare [[Reaver Axe]]. The file's example has 144% increased physical damage, 29–52 added physical damage, 25% attack speed and a crafted 18–20% physical damage over time multiplier.
          - **Belt:** [[Ryslatha's Coil]].
          - **Rings:** life and resistances; the file uses Vermillion Rings.

          The guide's advice on the unique axe: crafted axes outscale it in the end, and you replace it only after the suppression gear is in place.
      - title: Eldritch implicits in the file
        body: |
          - Helmet: increased [[Vulnerability]] curse effect, and physical damage from hits taken as lightning.
          - Body armour: gain a frenzy charge every 15 seconds, and increased [[Pride]] aura effect.
          - Gloves: physical damage over time multiplier, and spell suppression.
          - Boots: increased action speed, and "Bleeding you inflict deals Damage faster".
      - title: How the endgame axe is made
        body: |
          The recipe is written in the notes of the guide's high-budget file:

          1. Start from an axe with a fractured hybrid modifier: increased physical damage together with accuracy.
          2. Roll it with Deafening [[Essence of Contempt]], which guarantees added physical damage.
          3. You are looking for a high tier of increased physical damage.
          4. When you hit it and a suffix is open, protect the prefixes at the crafting bench and scour the suffixes.
          5. Remove the protection, add "Can have up to 3 Crafted Modifiers", and craft physical damage over time multiplier and attack speed.

          The author labels the result 'Somewhat "easy" to make'. **Both the fractured base and the bench crafts changed in 3.30**; see What 3.30 changed below.
  - id: endgame
    phase: endgame
    image: ryslathas-coil
    title: Endgame
    levels: Tier 17, pinnacle and uber bosses
    uses: >-
      The guide's high budget at level 100. [[Pride]] and [[Determination]]
      together, [[Swift Affliction Support]] and [[Deadly Ailments Support]] in
      the main link, a [[Blood Sap Tincture]], and tattoos on the tree.
    changes: >-
      [[Blood Magic]] comes off the tree and you go back to mana.
      [[Fortify Support]] leaves the six-link and returns as an imbued seventh
      effect on the gem. The guide's author says this file is only for players
      who really enjoy Lacerate.
    links:
      - name: Main skill
        gems: [Lacerate of Haemorrhage, Volatility Support, Melee Physical Damage Support, Brutality Support, Swift Affliction Support, Deadly Ailments Support]
      - name: Auras
        gems: [Determination, Pride, Frostblink]
      - name: Curse and buffs
        gems: [War Banner, Vulnerability, Blood Rage, Enhance Support]
      - name: Movement
        gems: [Leap Slam, Faster Attacks Support, Maim Support, Culling Strike Support]
      - name: Charges
        gems: [Enduring Cry, Urgent Orders Support, More Duration Support, Lifetap Support]
      - name: Guard
        gems: [Vaal Molten Shell, Cast when Damage Taken Support, Lifetap Support]
    moveOn: "there is no next stage. What is left is a better axe and the other school of the build."
    details:
      - title: The seventh effect on the gem
        body: |
          The guide's plan is to imbue the main gem with a Fortify effect and take [[Fortify Support]] out of the six-link. It says the gem must already be 20% quality when you do it, so buy one at 20% and imbue that.

          Weaker results it would accept: Deadly Ailments, Swift Affliction, Melee Physical Damage or Volatility. It treats the whole thing as a late addition, because the outcome is random and costly.

          The second video author ranks the options the same way, Fortify first, and adds a warning we repeat: "I have no idea how rare or common, or expensive or cheap they will be."

          The guide calls the items Coins. **In 3.30 they are Soul Cores, and they can now roll a bad effect.**
      - title: Notes the author left in the file
        body: |
          - **Shield:** the example is a synthesised shield, not a Shaper one, because synthesised bases were cheap when the file was made. That is a 3.28 price judgement.
          - **Life rolls** are kept deliberately low "to simulate a sort of minimum".
          - **[[The Light of Meaning]]:** the damage version is in the tree. Swapping it for the chaos-resistance version costs "about 2.5 million dps, so roughly a fifth" and gives 73% chaos resistance.
          - **[[Sulphur Flask]]:** "doesn't truthfully do very much". Swap it freely.
          - **[[Silver Flask]]:** keep it. "Lacerate feels pretty bad mechanically when the attackspeed drops too low."
          - **[[Progenesis]]:** "a massive upgrade defensively", but it does not have permanent uptime here and it does not let you drop chaos resistance. "Do not do that. You will die."
          - **Last four passive points:** life, via Heart of the Warrior.
      - title: The other school at the top end
        body: |
          The most-watched 3.30 video build finishes on [[Crimson Dance]] and [[War of Attrition]] with [[Multistrike Support]] in the main link, and adds [[Eviscerate]], a retaliation attack you can use after you block.

          Its file at level 98, on the 3.29 tree, reads 4,773 life, 26,456 armour, 90% physical damage reduction, chaos resistance 75%, and bleed damage at the game's cap of 35.8 million per second.

          Two cautions. The same file shows 70% attack block and 65% spell block as saved, which is lower than the title "Max Block" suggests; the "blocked recently" condition may simply not be ticked. And [[War of Attrition]] takes 100 seconds in a boss's presence to reach full value.

powerCurve: |
  Four things multiply this build, and they arrive at different times.

  1. **The size of your biggest hit.** Weapon physical damage, [[Volatility Support]], the Physical Mastery, and later [[Ryslatha's Coil]].
  2. **Bleed multipliers.** The gem's own "more damage with bleeding", and damage over time multiplier from the axe, the amulet, the tree and endurance charges.
  3. **Aggravation.** [[Jagged Technique]], a flat three times.
  4. **Block.** 50% from [[Determined Survivor]], spell block through [[Versatile Combatant]], then lucky from [[More Than Skill]].

  **At level 30** you have none of them. You are a two-handed slam character with [[Resolute Technique]] and exploding corpses. It plays like any Duelist levelling build, and it should.

  **At level 70** you have just changed character. Aggravation has been on since Cruel Labyrinth, and the shield, the 50% block and the real skill all arrived together at about 68. Defence jumps at once. Damage does not, because the gem is still the base version and the axe is whatever you found. Expect a flat week of white and yellow maps where you are safe and a little slow.

  **At level 95** every multiplier is in place and they stack: transfigured gem, crafted axe, Coil, suppression. The published files go from about 2 million to 3.3 million between the low and medium budgets, and to 14–18 million at the high budget.

  **Our reading, not the guide's:** this is a build with one sudden step (the switch at 68) and then a long, even slope. Nothing after the transfigured gem changes how it plays. Each purchase is a percentage, which is why it suits players who dislike rebuilding a character and bores players who want a transformation.

upgrades:
  - step: "[[Lacerate of Haemorrhage]], at 20% quality if you can"
    why: >-
      First because it multiplies everything after it: up to 132% more bleed
      damage against 88%, another 40% from quality, and a third more attacks
      per second. The guide: "Should be acquired as early as possible."
  - step: "[[Jack, the Axe]]"
    why: >-
      A weapon with bleed multiplier and a free 20% more bleed damage, usable
      from level 65. It comes before any crafting because it needs none. The
      guide calls it cheap; it gives no figure.
  - step: "Capped resistances, chaos resistance above zero, and [[Kaom's Sign]]"
    why: >-
      The low-budget file sits at −6% chaos resistance and survives a 4,271
      chaos hit. No damage purchase is worth more than fixing that. Kaom's Sign
      is in this step because its endurance charge is both mitigation and
      bleed multiplier.
  - step: "A shield with life recovered on block"
    why: >-
      You block almost nine hits in ten, so 4–5% of life per block is your main
      recovery. It sits below resistances because recovery does not help
      against a hit that kills you outright.
  - step: "A six-link"
    why: >-
      Two more supports on the main skill. [[The Bringer of Rain]] covers the
      gap, which is why this is fifth and not second.
  - step: "Spell suppression on all four armour slots, and [[Iron Reflexes]]"
    why: >-
      The guide puts this before the weapon in so many words. Between the low
      and medium files, damage rises by two thirds and the largest physical
      hit survived rises from 8,117 to 19,851.
  - step: "A crafted [[Reaver Axe]]"
    why: >-
      The largest damage step left: your bleed is made from weapon damage.
      Later than suppression because it is the most expensive single item and
      Jack is good enough to reach red maps.
  - step: "[[Ryslatha's Coil]]"
    why: >-
      Up to 40% more maximum physical attack damage, which is close to 40%
      more bleed. Last among the real upgrades only because the guide expects
      it to be "far too expensive early". After this: Eldritch implicits, the
      imbued gem, a tincture.
    cost: "No figure in any source. The one finished character with a price is the video build: over 170 Divine, 3.29."

play:
  mapping: |
    Move with [[Shield Charge]]. The guide's gem page uses it; its overview and its high-budget file prefer [[Leap Slam]]. Both sit in the same four-link with [[Maim Support]] and [[Culling Strike Support]], so the movement skill also maims and finishes rare monsters.

    Stop a step short of the pack and attack once or twice. The waves reach further than you expect. The first monsters to die explode, and the explosions do the rest of the pack.

    Keep [[Blood Rage]] running. The guard link fires by itself when you take damage. The guide says to plant [[War Banner]] only on tanky targets, because it now builds up slowly.

    You do not need to wait for the bleed. Once a rare monster is bleeding and cursed, move on and let it die behind you.
  bossing: |
    Before the fight: press [[Enduring Cry]]. You walked in with no endurance charges, and each one is 3% bleed multiplier. One video author writes that the cry at the start "is a good idea", and that later the charges stay up because you block so much.

    Then curse with [[Vulnerability]], plant [[War Banner]], and attack. Stand so the boss is inside both waves.

    **The tension in the build is here.** Your bleed keeps its full, aggravated strength while you dodge, which is the whole reason to take [[Jagged Technique]]. But a bleed runs out, so you have to come back and hit again every few seconds. And [[More Than Skill]] only makes block lucky "if you've Blocked Recently", so after a long dodge your defence is back to plain block for the first hit. This last point is our reading of the node text; no guide spells it out.

    Use the utility flasks for the armour, and save the [[Vaal Molten Shell]] for the phase you know hurts.

deaths:
  - situation: "Chaos damage on the cheap setup: poison clouds, chaos-damage map bosses, caustic ground."
    cause: >-
      The low-budget file has −6% chaos resistance and survives a 4,271 chaos
      hit, against roughly 24,000 for each element. Block does nothing against
      damage over time.
    fix: >-
      Amethyst Rings and chaos resistance on every rare. The file's note:
      amethyst rings are "infinitely better, but also infinitely more
      expensive". The high-budget author adds that a [[Progenesis]] "does not
      permit us to drop chaos resistance on gear".
  - situation: "Frozen or chilled in the middle of a pack."
    cause: >-
      You stand close, and a frozen character cannot act.
    fix: >-
      The guide's rule: freeze immunity on a flask, "consider this mandatory",
      until the Brine King power is upgraded. Then switch that flask to ignite
      or shock.
  - situation: "The one hit you do not block."
    cause: >-
      Block is a chance. In the low-budget file an unblocked physical hit above
      about 8,100 kills a 4,025-life character with 68% physical reduction.
    fix: >-
      An armour flask up at all times, [[Molten Shell]], and
      [[Fortify Support]] in the main link. The medium budget is the real fix:
      85% reduction and a 19,851 hit survived.
  - situation: "The first seconds of a boss fight, or the moment after a long dodge."
    cause: >-
      No endurance charges yet, and lucky block needs a recent block. This is
      our reading of Deflection and [[More Than Skill]], not a line from a
      guide.
    fix: >-
      [[Enduring Cry]] before you engage, and take the first hits on purpose
      from something small if you can.

troubleshooting:
  - symptom: "My bleed does almost nothing, on a character that was fine an hour ago."
    cause: >-
      You are playing base [[Lacerate]] in Sand Stance. The base gem only
      causes Bleeding, and only has its bleed multiplier, in Blood Stance.
    fix: >-
      Press [[Blood and Sand]] once to go back. The transfigured gem has no
      stances and ends the problem for good.
  - symptom: "Lacerate feels slow and clumsy."
    cause: >-
      Attack speed. Base Lacerate swings at 60% of your weapon's speed and the
      transfigured gem at 80%. The high-budget author writes that it "feels
      pretty bad mechanically when the attackspeed drops too low".
    fix: >-
      Keep a [[Silver Flask]], look for attack speed on the axe and gloves, and
      upgrade the gem. Both video builds go further and put
      [[Multistrike Support]] in the main link.
  - symptom: "Maps melt, bosses take forever."
    cause: >-
      In maps most of the damage is [[Gratuitous Violence]]: explosions worth a
      fifth of each monster's life. A boss gets none of that. It takes only
      your one bleed, and at the start of the fight you have no endurance
      charges.
    fix: >-
      [[Enduring Cry]], [[Vulnerability]] and [[War Banner]] every boss. After
      that it is weapon damage: the bleed is made from the top of your hit.
  - symptom: "My spell block is far below my attack block."
    cause: >-
      [[Versatile Combatant]] gives 2% spell block per 1% of attack block
      *above the cap*. If your attack block only just reaches the cap, you get
      nothing from it.
    fix: >-
      Take the Shield Mastery and Deflection, and the Block Mastery that turns
      attack block into spell block. The low-budget file still ends 8 points
      short on spells; the medium one closes the gap.
  - symptom: "It was fine until red maps."
    cause: >-
      The low-budget character has 4,025 life and no spell suppression. Its
      guide says so itself: "We're foregoing suppression early on in favor of
      damage."
    fix: >-
      The medium-budget gear: suppression on four armour slots and
      [[Iron Reflexes]]. If you want it sooner, the file tells you to take the
      Entrench wheel instead of the damage nodes.

patch:
  - note: >-
      **Nothing in this build changed.** We searched the official notes for
      Lacerate, bleeding, aggravate, block, [[Volatility Support]],
      [[Jack, the Axe]] and [[Ryslatha's Coil]]. None appears in the
      normal-game sections. The only mention of Lacerate is a bug fix to the
      description of an old Crucible modifier.
  - entry: ruthless-changes
    note: >-
      **Ignore claims that Gladiator's block was cut to 40%.** The word
      "Gladiator" appears once in the notes, inside the Ruthless section, and
      it refers to the Scion Ascendant's notable of that name. GGG's own tree
      data shows the Duelist's [[Determined Survivor]] at 50% in the normal
      game and 40% only in the Ruthless file.
  - entry: special-base-implicits
    note: >-
      **One small buff and one small nerf to gear the guide names.**
      [[Apothecary's Gloves]], which the guide lists as an honourable mention,
      now have +14–18% damage over time *multiplier* as their implicit, where
      it used to be increased damage over time. That is the stat this build
      stacks, so they are a better option than the guide's text assumes; this
      is our reading. Amethyst Rings, the guide's endgame ring, drop to
      +13–19% chaos resistance from +17–23%.
  - entry: royal-visage-soul-cores
    note: >-
      **The imbued-gem plan is riskier.** The guide's "Coins" are now Soul
      Cores, and they can roll one of a set of bad support effects. Do not use
      one on a 20%-quality [[Lacerate of Haemorrhage]] you cannot replace.
  - entry: fractured-items-rarer
    note: >-
      **The endgame axe starts from a rarer base.** The published recipe
      begins with a fractured axe, and fractured items now come from far fewer
      places. Expect the base to cost more than last league. Prices are not
      settled.
  - entry: meta-crafting-costs
    note: >-
      **The same recipe protects prefixes at the crafting bench.** Those
      bench costs changed in 3.30. Nobody has republished the craft with new
      numbers.
  - entry: harvest-rework
    note: >-
      **One fallback in the file is unverified.** If [[Jack, the Axe]] is
      expensive, the author suggests Jagged Fossils or reforging for physical
      modifiers at the Harvest bench. Harvest was reworked in 3.30 and we
      could not confirm that craft is unchanged.
  - entry: league-fates
    note: >-
      **A good match, untested.** The league makes area bosses harder and pays
      for killing them. A bleed that keeps full strength while you dodge new
      hazards, behind 88% block, is pointed the right way. Nobody has measured
      it.

strengths:
  - "Starts on nothing: the gem is a quest reward and block comes from the ascendancy."
  - "About 88% attack block on the cheapest published version, 90% and 88% on the next."
  - "Guaranteed aggravated bleed: full damage on a boss that stands still, and on the first hit after every dodge."
  - "Reaches further than melee usually does, so you fight from a step back."
  - "No accuracy and no crit to gear for."
  - "A long, even upgrade path with no second rebuild after level 68."
weaknesses:
  - "Many buttons: the guide lists the main skill, Molten Shell, Blood Rage, a manual curse and War Banner."
  - "Chaos damage is the thin layer on the cheap version."
  - "The campaign is played as a different build, and the switch at 68 is a real respec."
  - "No burst. A bleed ticks at its own rate, so short damage windows are wasted on you."
  - "Resolute Technique caps how far the damage can scale; even the guide's author calls its top end a file for enthusiasts."
  - "The best written guide is old under a new banner, and contradicts its own files on the damage ceiling."
avoidIf: >-
  Pick something else if you want fast, one-button mapping, or if you want to
  delete bosses in a burst and leave. Skip it if you dislike respeccing in the
  middle of a campaign. And if you want a Gladiator that slams, the Earthquake
  build on this site uses the same ascendancy with a guide that is truly
  current.

