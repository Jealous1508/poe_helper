name: Kinetic Blast Deadeye
tagline: >-
  A wand build whose every shot bursts into extra explosions and clears the
  screen from a distance. Very fast, needs no unique item, and dies to
  whatever it fails to kill first.
class: Ranger
ascendancy: Deadeye
role: starter
budget: low
budgetNote: >-
  **The guide gives no currency figure for anything.** What it does say: the
  build "doesn't require any Unique items to function", and it is marked as
  viable for a fresh solo self-found start. We still rate it Low rather than
  Starter, for two reasons. The damage is your wand, so the build is as good
  as the wand you find, gamble or craft. And the guide's headline — Act 10
  in three hours, four Voidstones in about ten — is the pace of its author,
  who holds campaign speedrun records. Its own list of drawbacks ends with
  "Need Investment for T17s".
mainSkill: Kinetic Blast
image: kinetic-blast
hero: art-deadeye
tags: [Wand, Projectile, Elemental, Crit]
ratings: { clear: 5, bossing: 3, survivability: 2, ease: 3 }
verified: "2026-11-14"
confidence: mixed
confidenceNote: >-
  **Better dated than most guides this week, and thin in specific places.**
  This is havoc616's Maxroll guide, updated 12 November 2026. Unlike several
  guides that only changed their banner, its planner is really a 3.30
  object: it is named for 3.30, saved on 12 November, and stamped with the
  3.30 data version. Its Path of Building export is labelled "3.29 for
  3.30", honestly. One small ascendancy widget on the page is left over from
  an older planner; the four notables it shows have not changed. What the
  guide does **not** have: any price, any rating block, any measured damage
  or survivability figure (only targets to aim for), and its own leveling
  section — it sends you to three separate campaign guides, which we did not
  read in full. The gem's numbers are from PoEDB. The one independent 3.30
  character we found, by Kassadus, is a level 92 [[Headhunter]] version and
  is where every measured number on this page comes from. Its title puts
  the word "starter" in quotation marks, and you should keep that in mind.
  The four ratings are ours.
modes:
  ssf: >-
    The guide says yes: "SSF Fresh Start League Start Viable", and none of
    its progression items is a unique. The gear plan leans on gambling for a
    wand, on Essences, and on Abyss for a [[Stygian Vise]] — and 3.30 made
    two of those three harder (see the patch notes below). Expect the wand
    to be the wall.
  hardcore: >-
    No source recommends it, and the guide's first drawback is "Don't Get
    Hit Playstyle". The independent 3.30 character has 3,779 life, 27,689
    effective hit points and can take 7,300 physical damage in one hit. That
    is a softcore character.

idea: |
  [[Kinetic Blast]] is a wand attack. Each projectile that hits something bursts into four more explosions around the point of impact. Fire several projectiles into a pack and the explosions overlap across the whole screen.

  [[Deadeye]] is the ascendancy for it because of one notable, [[Endless Munitions]]: two extra projectiles on every skill. More projectiles means more impacts, and every impact is four more explosions. The guide does not let you use the skill at all until you have that notable.

  So this is two builds in a row. You level with a different skill — a flask-throwing attack called [[Explosive Concoction]] — and swap to wands after the third Labyrinth.

  Its damage scales in an unusual way. Kinetic Blast has a property called Arcane Might: increases to *spell* damage also raise its *attack* damage, at one and a half times their value. So the best off-hand is a caster's shield.

  The defence is to not be hit. You kill from range and move through packs; evasion, spell suppression and a little energy shield are there for what gets through.

chain:
  - label: Fire
    text: "[[Kinetic Blast]] fires wand projectiles. [[Endless Munitions]] adds two more to every shot."
  - label: Burst
    text: "Each projectile that hits creates 4 additional explosions. They deal 40% less area damage, and there are a lot of them."
  - label: Wisps join in
    text: "[[Sacred Wisps Support]] summons two wisps that each have a 25% chance to fire the skill with you — 50% when a Rare or Unique enemy is close."
  - label: Spell damage counts
    text: "150% Arcane Might: increased spell damage on your wand and shield applies to this attack at one and a half times its value."
  - label: Bosses get a second kit
    text: "[[Kinetic Bolt]] ballista totems and a [[Tornado]] you shoot into. Against pinnacle bosses you swap the main skill itself."

chainDetails:
  - title: Why you cannot start with it
    body: |
      [[Kinetic Blast]] needs character level 28 and a wand. More to the point, the guide's plan is to "swap to Kinetic Blast after acquiring Endless Munitions from the Merciless Lab", which is the *third* Labyrinth, near the end of the campaign.

      Until then the build has too few projectiles to make the explosions overlap, and no wand worth using. So you level as something else entirely and treat the swap as an event.

      A Ranger is also not offered the gem. PoEDB lists it as a Witch quest reward in Act 3, sold by Clarissa to Scion, Shadow, Templar and Witch. For a Ranger that leaves [[Siosa]] in the Act 3 Library, who sells gems to every class, or Lilly Roth from Act 6.
  - title: Arcane Might, and why you hold a caster's shield
    body: |
      PoEDB's line for the gem: "150% Arcane Might". Increases and reductions to spell damage also apply to the skill's attack damage, at 150% of their value. A shield with 60% increased spell damage is therefore worth 90% increased damage to this attack.

      That is the reason for the gear list. The guide wants "a high % spell damage shield" as one of its first two purchases, crafts a Harmonic Spirit Shield for it later, and its wand carries spell damage as an implicit and as a bench craft.

      [[Kinetic Bolt]], the single-target skill, has **200%** Arcane Might and a much higher damage effectiveness — 220% at gem level 20 against Kinetic Blast's 155%. That gap is why the guide swaps skills for pinnacle bosses.

      This was nerfed one league ago. In 3.29 Kinetic Blast went from 200% Arcane Might to 150%, and from 35% less area damage to 40%. Nothing changed it in 3.30.
  - title: What the wand is for
    body: |
      The skill deals 140% of weapon damage at gem level 1 and 155% at level 20, and attacks at 115% of base speed. Everything starts from the wand's own damage.

      The guide asks for "a high elemental DPS wand": flat fire, cold and lightning damage. Its finished wand has all three as prefixes. [[Wrath]] adds flat lightning on top, and a [[Spellslinger]] setup casts [[Flame Wall]] for you so that, in the guide's words, your attacks pick up "additional flat fire damage".

      **Our reading, not the guide's:** this is also why [[Trinity Support]] is in the link. It rewards dealing more than one element, and a wand with three kinds of flat damage plus the wall and the aura does exactly that.
  - title: Sacred Wisps, in numbers
    body: |
      From PoEDB. [[Sacred Wisps Support]] works only with wands. Hitting with the supported skill summons 2 wisps for 10 seconds. Whenever you fire, each wisp has a 25% chance to use the skill as well, and that rises by another 25% while a Rare or Unique enemy is in your presence.

      A wisp's version deals 60% less damage at gem level 1 and 51% less at level 20, and the support has a 140% cost multiplier. It needs level 18, and a Ranger buys it from Yeena in Act 2 after the quest Sharp and Cruel.

      So the support is strongest exactly where the skill is weakest: standing near something dangerous.
  - title: The single-target kit
    body: |
      Kinetic Blast's explosions are built for packs. For anything with a health bar the guide adds two things.

      - **[[Kinetic Bolt]] on [[Ballista Totem Support]].** Three totems by default, placed before the boss wakes up, firing a bolt that zig-zags and forks.
      - **[[Tornado]].** PoEDB: for its first 1.5 seconds your projectiles can hit the tornado, up to 20 times, and it passes damage on to enemies inside it; then it chases enemies for 4 more seconds. The guide's description is that it "deals massive single target damage based on the damage of the first 20 projectiles you fire into it". [[More Duration Support]] is linked to it.

      Against pinnacle bosses the guide goes one step further and swaps two gems in the main link: [[Kinetic Blast]] for [[Kinetic Bolt]], and [[Returning Projectiles Support]] for [[Barrage Support]]. It repeats this instruction four times on one page, which suggests how often people forget it.
  - title: What we could not find
    body: |
      - **Prices.** None, for anything.
      - **Measured numbers from the guide.** It gives targets — a million damage per second for the first two Voidstones, two to three million for all four — and no figures from its own character.
      - **A leveling section.** The guide points to Explosive Concoction, Rain of Arrows and Lightning Arrow campaign guides. The gem steps below are read from the planner inside this guide; the campaign tree is not described in text.
      - **Which keystones.** The planner has five trees. The prose names [[Ghost Dance]], the notable [[Entrench]] and one suppression mastery, and nothing else.
      - **Third-party ranking.** We found no 3.30 tier list that places this build. It is popular: wand Deadeyes sit at the top of one site's list of most-viewed 3.30 projectile builds.

mandatory:
  - term: Kinetic Blast
    why: >-
      The skill. Level 28, wands only. 4 additional explosions per impact,
      40% less area damage, 150% Arcane Might.
    detail: >-
      Gem quality adds up to one more explosion. A Ranger does not get the
      gem as a reward: buy it from [[Siosa]] in the Act 3 Library or from
      Lilly Roth in Act 6.
  - term: Endless Munitions
    why: >-
      "Skills fire 2 additional Projectiles." The guide's condition for
      using Kinetic Blast at all. Third Labyrinth.
  - term: Sacred Wisps Support
    why: >-
      Two wisps that copy your attack some of the time, and half of the time
      when a Rare or Unique enemy is near. In the main link at every stage.
  - term: Returning Projectiles Support
    why: >-
      Projectiles come back through the pack. In the clear link until the
      very top tier, where the [[Nimis]] ring provides the same thing and
      frees the socket.
  - term: Trinity Support
    why: >-
      More elemental damage for a skill that deals several elements. In the
      link from the first Kinetic Blast setup to the six-link.
  - term: Elemental Damage with Attacks Support
    why: >-
      More elemental damage with attacks. Carried over from the leveling
      link and kept until the aspirational version.
  - term: Kinetic Bolt
    why: >-
      On ballista totems for map bosses, and as the main skill itself
      against pinnacle bosses. A Ranger buys it from Nessa in Act 1.
  - term: Tornado
    why: >-
      Shoot into it. Its damage comes from the first 20 projectiles that hit
      it. Part of the boss rotation at every stage.
  - term: Wrath
    why: >-
      Flat lightning damage for attacks. The one aura the guide keeps in
      every map setup.
  - term: Spell Suppression
    why: >-
      100% is the stated goal for the last two Voidstones. The guide's
      second drawback is "Must Finetune your Defence (Ex: Cap Suppression)".
  - term: Ghost Dance
    why: >-
      Recovers energy shield when you are hit, which is the build's answer to
      burst damage. It needs some energy shield to work with.
    detail: >-
      The guide's number: "ensure you have 100 to 300+ total energy shield
      to effectively use Ghost Dance". That is why the body armour and
      helmet are evasion-and-energy-shield hybrids.
  - term: Assassin's Mark
    why: >-
      Applied by [[Mark On Hit Support]]. With quality it generates power
      charges in long fights, and it helps reach the crit cap.
    detail: >-
      The guide swaps it for [[Sniper's Mark]] only once pinnacle bosses are
      done, crit is near the cap without it, and map bosses die in under ten
      seconds.
  - term: Gathering Winds
    level: recommended
    why: >-
      First Labyrinth. Tailwind for you and nearby allies, stronger with
      each skill you use. The guide calls it "the de-facto choice" for
      speed and damage together.
  - term: Focal Point
    level: recommended
    why: >-
      Fourth Labyrinth. 75% increased effect of your marks, and 25% less
      damage taken from other enemies near the marked one.
  - term: Grace
    level: recommended
    why: >-
      Evasion. Replaces [[Haste]] in the aura slot once you are going for the
      last two Voidstones.
  - term: Diamond Flask
    level: recommended
    why: >-
      With a [[Silver Flask]], both rolled with "chance to gain a Flask
      Charge when you deal a Critical Strike". The guide says this "greatly"
      raises single-target damage in long boss fights.
  - term: Quartz Flask
    level: recommended
    why: >-
      Phasing. The guide's clearing instruction is to attack into each pack
      "and run through them with a Quartz Flask or any other source of
      Phasing".
  - term: The Taming
    level: recommended
    why: >-
      Two of them in the endgame set, with 20% quality from Turbulent
      Catalysts. Not needed before then.
  - term: Replica Hyrri's Ire
    level: recommended
    why: >-
      The endgame body armour. Named by the guide as one of four uniques the
      build "benefits from"; it does not say what the item contributes, and
      we did not check.

labs:
  - lab: Normal
    node: Gathering Winds
    why: "Action speed through Tailwind: mobility, clear and single target at once."
  - lab: Cruel
    node: Ricochet
    why: "Skills chain one more time, and it is on the way to Endless Munitions. Far Shot is offered as the alternative for long-range play, with the warning that you then need a projectile mechanic from somewhere else."
  - lab: Merciless
    node: Endless Munitions
    why: "Two additional projectiles. The guide: this is what enables the swap to Kinetic Blast."
  - lab: Eternal
    node: Focal Point
    why: "Stronger marks, for single-target damage."

stages:
  - id: acts-1-3
    phase: early
    image: poisonous-concoction
    title: Acts 1–3
    levels: Level 1–28
    uses: >-
      [[Caustic Arrow]] with a bow to level 12, then
      [[Poisonous Concoction]], which uses no weapon at all, until 28.
    changes: >-
      At 12 you put the bow down. [[Blood Rage]] and [[Herald of Ash]] join
      at 16, [[Haste]] at 24. You are not playing a wand build yet and will
      not be for the whole campaign.
    links:
      - name: Level 1–12
        gems: [Caustic Arrow, Volley Support, Mirage Archer Support]
      - name: Level 1–12, second attack
        gems: [Burning Arrow, Momentum Support]
      - name: Level 12–28
        gems: [Poisonous Concoction, Volley Support, Momentum Support]
      - name: Movement
        gems: [Shield Charge, Faster Attacks Support, Momentum Support]
      - name: Utility by level 24
        gems: [Sniper's Mark, Blood Rage, Frostblink, Withering Step, Herald of Ash, Haste]
    moveOn: "you are level 28 and can equip Explosive Concoction."
    details:
      - title: Where these steps come from
        body: |
          The guide's own text says only that "during the campaign, you level with Explosive Concoction, Rain of Arrows or Lightning Arrow", and links a separate guide for each. The gem steps here are the ones saved in the planner inside the Kinetic Blast guide, which follows the Explosive Concoction route.

          **We did not read the separate leveling guide in full.** For the passive tree, the guide says to "click through the campaign embed"; the campaign tree exists only there, not in words.
      - title: What to pick up
        body: |
          The guide's four campaign gear goals, in its order: "Any Shield that improves your DPS", boots with 25% to 30% movement speed, life and resistance gear, and flat damage on rings, amulet or gloves.

          A concoction is thrown with an empty main hand, which is why a shield is on that list from the start. This site's Poisonous Concoction Pathfinder guide explains the skill itself.
      - title: Bandits and Pantheon
        body: |
          The planner has **Alira**, and so does the independent 3.30 character. Pantheon in the planner: Soul of the Brine King and Soul of Ryslatha. The guide's Pantheon section is a link to a general page and gives no reasons.
  - id: acts-4-10
    phase: early
    image: gathering-winds
    title: Acts 4–10
    levels: Level 28–68
    uses: >-
      [[Explosive Concoction]] in a four-link. [[Haste]] and, from 38,
      [[Flesh and Stone]]. [[Sniper's Mark]] applied by
      [[Mark On Hit Support]].
    changes: >-
      Three Labyrinths: [[Gathering Winds]], [[Ricochet]], then
      [[Endless Munitions]]. The third is the one that matters. The
      character is non-crit throughout and stays that way until maps.
    links:
      - name: Level 28–38
        gems: [Explosive Concoction, Volley Support, Lesser Multiple Projectiles Support, Elemental Damage with Attacks Support]
      - name: Level 38+
        gems: [Explosive Concoction, Greater Volley Support, Elemental Damage with Attacks Support, Fire Penetration Support]
      - name: Mark
        gems: [Sniper's Mark, Mark On Hit Support, Blood Rage]
      - name: Auras
        gems: [Haste, Flesh and Stone]
      - name: Movement
        gems: [Shield Charge, Faster Attacks Support, Momentum Support, Frostblink]
    moveOn: "you have Endless Munitions, Act 10 is finished, and your resistances are capped."
    details:
      - title: Start collecting for the swap
        body: |
          You can carry the wand skills in spare sockets long before you use them. [[Kinetic Bolt]] is sold to Rangers by Nessa in Act 1. [[Sacred Wisps Support]] comes from Yeena in Act 2. [[Kinetic Blast]] itself is from [[Siosa]] in Act 3 or Lilly Roth in Act 6.

          Leveling them early is our suggestion; the guide does not mention it.
      - title: After the Act 10 boss
        body: |
          The guide: "Upon defeating Act 10 Kitava, use the Gambling Vendor to upgrade any weaker item drops from earlier acts, primarily focusing on basic resistance capping. The life resistance gear you equip here is viable for defeating Eater and Exarch."

          Note for 3.30: gambling at high level now costs more and gives worse items than it did when that sentence was written.
  - id: early-maps
    phase: early
    image: kinetic-blast
    title: "Early maps: the swap"
    levels: White and yellow maps
    uses: >-
      [[Kinetic Blast]] in a five-link, a wand with elemental damage, a
      shield with spell damage, and the boss kit: [[Kinetic Bolt]] totems,
      [[Tornado]] and a triggered [[Flame Wall]].
    changes: >-
      Everything. You change weapon type, main skill and most of your
      sockets on the same day, and somewhere in this stretch you also move
      the tree from non-crit to crit.
    links:
      - name: Main skill (five-link)
        gems: [Kinetic Blast, Returning Projectiles Support, Elemental Damage with Attacks Support, Trinity Support, Sacred Wisps Support]
      - name: Boss totems
        gems: [Kinetic Bolt, Ballista Totem Support, Barrage Support, Focused Ballista Support]
      - name: Fire wall
        gems: [Spellslinger, Flame Wall]
      - name: Tornado
        gems: [Tornado, More Duration Support, Precision]
      - name: Mark and movement
        gems: [Shield Charge, Faster Attacks Support, Mark On Hit Support, Assassin's Mark]
      - name: Auras and guard
        gems: [Haste, Wrath, Cast when Damage Taken Support, Immortal Call]
      - name: Second movement skill
        gems: [Flame Dash]
    moveOn: "the tree is crit, the wand and shield are real ones, and you are clearing yellow maps without thinking."
    details:
      - title: When to go crit
        body: |
          The guide offers three choices and picks one:

          1. Force it at level 60 to 70 or later, whatever your wand and tree look like.
          2. Wait until you find "a very well rolled" flat elemental wand and spell damage shield. **This is the author's recommendation**, and he says it should ideally happen early in map progression.
          3. Wait for a five-link and socket [[Increased Critical Strikes Support]].

          His reason for not waiting longer: "Non-Crit runs out of efficient scaling options at T16s and is surpassed by Crit at that point." He wants you fully swapped by the Tier 16 section.

          While you are still non-crit, the low-level [[Precision]] helps keep [[Precise Technique]] active.
      - title: Auras
        body: |
          [[Wrath]] for flat lightning and, at this stage, [[Haste]]. [[Precision]] at level 1 caps your chance to hit and adds some crit chance.

          The guide lists alternatives without ranking them: [[Haste]] in place of Grace or Wrath for mobility, and [[Anger]] in place of Grace or Wrath for more flat damage.
      - title: Mana
        body: |
          The guide lists three optional fixes and does not choose between them: the [[Thrill of Battle]] notable; a Life Mastery that makes skills cost life instead of 15% of their mana cost; and flat mana on gear.
      - title: Map modifiers to avoid
        body: |
          The guide's full list:

          - Monsters cannot be Leeched from
          - Monsters reflect Elemental Damage
          - Monsters reflect Physical Damage
          - Players have −9% to −12% to all maximum Resistances
  - id: red-maps
    phase: endgame
    image: tornado
    title: Red maps and the first two Voidstones
    levels: Tier 11–16 maps, Eater of Worlds and Searing Exarch
    uses: >-
      The same gems as the swap, on better items: a wand you gambled or
      crafted for, a spell damage shield, and two flasks rolled to refill on
      critical strikes.
    changes: >-
      Crit is finished by Tier 16. Before the two bosses you take
      [[Entrench]] and the mastery that makes your chance to suppress spell
      damage lucky. The guide's targets for this stage: **3,000 or more life
      and energy shield combined, and a million damage per second.**
    links:
      - name: Main skill, maps
        gems: [Kinetic Blast, Returning Projectiles Support, Elemental Damage with Attacks Support, Trinity Support, Sacred Wisps Support]
      - name: Main skill, pinnacle bosses
        gems: [Kinetic Bolt, Barrage Support, Elemental Damage with Attacks Support, Trinity Support, Sacred Wisps Support]
      - name: Boss totems
        gems: [Kinetic Bolt, Ballista Totem Support, Barrage Support, Focused Ballista Support]
      - name: Tornado and fire wall
        gems: [Tornado, More Duration Support, Spellslinger, Flame Wall]
      - name: Auras and guard
        gems: [Haste, Wrath, Cast when Damage Taken Support, Immortal Call]
    moveOn: "Eater of Worlds and the Searing Exarch are dead and you have two Voidstones."
    details:
      - title: Getting the wand
        body: |
          The guide's plan: "Around T11 Maps, gamble the gold you've acquired on Wands, aiming for a Wand with High Elemental DPS. Alternatively, use Wrath Essences on the new Wand Bases with 'Cannot Roll Caster Modifiers'."

          Both routes are touched by 3.30. High-level gambling "costs more and gives worse items", in the words of this site's changelog. Essences are the safer route now: in red maps every Essence you free is Screaming tier or better.

          **Nobody has re-tested the gambling step since the patch.** If it disappoints, craft.
      - title: Flasks
        body: |
          "Ensure your [[Diamond Flask]] and [[Silver Flask]] are rolled with the % chance to gain a Flask Charge when you deal a Critical Strike modifier, to greatly increase your single target DPS during extended boss fights."

          That modifier does nothing until you are crit, which is one more reason the crit swap is scheduled before this stage.
      - title: The gear looks ordinary on purpose
        body: |
          Every slot in the planner's set for this stage is a rare. The priorities attached to the slots are short: attack speed and life on gloves; spell damage, flat cold and lightning damage and local crit chance on the wand; the flask-charge-on-crit modifier on the utility flasks.

          The guide adds one finishing step, and only as the last one: Eater or Exarch implicits with Lesser Eldritch Ember or Ichor.
  - id: four-stones
    phase: endgame
    image: ghost-dance
    title: All four Voidstones
    levels: Maven and Uber Elder, level 90+
    uses: >-
      100% spell suppression, a five-link evasion-and-energy-shield body
      armour, [[Grace]] in place of [[Haste]], and a [[Stygian Vise]] with a
      Searching Eye jewel.
    changes: >-
      This stage is about not dying. The guide: capped suppression
      "significantly improves your survivability versus the final 2 Pinnacle
      Bosses". Its targets: **3,600 to 4,000 or more life and energy shield
      combined, and two to three million damage per second.**
    links:
      - name: Main skill, maps
        gems: [Kinetic Blast, Returning Projectiles Support, Elemental Damage with Attacks Support, Trinity Support, Sacred Wisps Support]
      - name: Boss totems
        gems: [Kinetic Bolt, Ballista Totem Support, Barrage Support, Focused Ballista Support]
      - name: Mark and movement
        gems: [Shield Charge, Faster Attacks Support, Mark On Hit Support, Assassin's Mark]
      - name: Auras and guard
        gems: [Wrath, Grace, Cast when Damage Taken Support, Immortal Call]
    moveOn: "you have four Voidstones. From here the upgrades are choices."
    details:
      - title: Crafting, as the guide lays it out
        body: |
          - **Rings, amulet, gloves:** Screaming Essences of Torment, Anguish and Suffering.
          - **Wand:** Shrieking Essence of Wrath, Shrieking Essence of Anger or Screaming Essence of Hatred.
          - **Shield:** a Harmonic Spirit Shield; roll a high increased spell damage modifier with [[Orb of Alteration]] and [[Orb of Augmentation]]; if you do not need a life or resistance suffix, craft attack speed.
          - **Body armour:** gamble for a five-link hybrid. When crafting hybrid pieces, an Essence of Woe guarantees flat energy shield.
          - **Belt and jewel:** "use the trade site or run Abyss in search of a Stygian Vise and a Searching Eye Jewel".

          In 3.30 the last line needs an Abyss Thread, and the belt needs an Item Tier of 5 to drop.
      - title: A veiled craft worth knowing
        body: |
          If a rare does not need a life or resistance suffix, the guide suggests the veiled modifier "Regenerate 150 Energy shield per second while a Rare or Unique Enemy is Nearby" to improve energy shield recovery. That feeds [[Ghost Dance]] in exactly the fights where you need it.
      - title: What an independent character looks like
        body: |
          The only measured 3.30 file we found is Kassadus's, level 92, and it is *ahead* of this stage: it wears a [[Headhunter]], an [[Esh's Mirror]], [[The Fledgling]] and a [[Death Rush]].

          Its numbers: **2.4 million** total damage per second (1.6 million from hits), 7.26 attacks per second. 3,779 life and 1,157 energy shield. 12,253 evasion for a 68% chance to evade, 96% spell suppression, 24% block. Resistances 75/76/75 and **−25% chaos**. Effective hit points 27,689. Maximum hit taken: 7,300 physical, about 24,000 of each element, 3,000 chaos.

          Set that beside the guide's targets and they agree: this build finishes the Atlas on about four to five thousand total pool and two to three million damage. It does it by killing first.
  - id: endgame
    phase: endgame
    image: the-taming
    title: Endgame and beyond
    levels: Tier 17 maps and Uber bosses
    uses: >-
      A six-link with [[Volatility Support]], a wand with all three flat
      elemental prefixes, a finished shield, and four uniques:
      [[Replica Hyrri's Ire]], two of [[The Taming]], [[Yoke of Suffering]]
      and [[Dying Sun]].
    changes: >-
      [[Sniper's Mark]] replaces Assassin's Mark. The tree starts dropping
      suppression and accuracy nodes as gear takes over those jobs. Above
      this sits an "aspirational" version built around [[Headhunter]].
    links:
      - name: Main skill (six-link)
        gems: [Kinetic Blast, Returning Projectiles Support, Elemental Damage with Attacks Support, Trinity Support, Sacred Wisps Support, Volatility Support]
      - name: Mark and movement
        gems: [Shield Charge, Faster Attacks Support, Sniper's Mark, Mark On Hit Support]
      - name: Auras and guard
        gems: [Wrath, Grace, Cast when Damage Taken Support, Immortal Call]
      - name: "Aspirational main skill (with Nimis)"
        gems: [Kinetic Blast, Sacred Wisps Support, Increased Critical Damage Support, Volatility Support, Greater Fork Support, Invert the Rules Support]
      - name: Aspirational auras
        gems: [Wrath, Herald of Ash, Summon Skitterbots, Enlighten Support]
    moveOn: "there is no next stage."
    details:
      - title: The finished wand and shield
        body: |
          **Wand.** Use Shrieking Essences of Wrath, Hatred or Anger until you hit a second flat elemental modifier of tier 3 or better. Do the same on a second wand, so that between them the two have all three elements. Recombine them until one wand has all three as prefixes. The guide: "Only use Shrieking Essences", and it is best to have no other prefixes on either wand first.

          **Shield.** Recombine blue Harmonic Spirit Shields for increased spell damage and life; fill the suffixes; a Redeemer's Exalted Orb for increased elemental damage with attack skills; then "Prefixes Cannot Be Changed" and a [[Veiled Chaos Orb]], hoping for a chance to deal double damage; attack speed to finish.

          **Two 3.30 warnings, neither in the guide.** Recombinators now return fewer modifiers when the two inputs have few between them, which is exactly the "two prefixes on each wand" case described above. And protecting prefixes on a weapon costs 4 Divine plus a [[Sacred Orb]]. The method still works on paper. What it costs is unknown.
      - title: The aspirational version
        body: |
          The guide's words: "There are many viable high investment build options for an endgame Wander. The example provided is a Map Blaster that uses a [[Headhunter]] to steal Damage as Extra modifiers with a High Physical Damage wand."

          It adds [[Esh's Mirror]] for flat lightning damage based on shocked enemies killed recently, [[Nimis]] for returning projectiles, "massively improving clear speed and damage by freeing a support gem", and a crafted body armour that makes enemies explode. [[Progenesis]] is in the flask row.

          Notice the wand changes type here: high *physical* damage, not elemental. That is a rebuild, not an upgrade to the previous wand.
      - title: What the build still does badly
        body: |
          - It has almost no margin. Around four to five thousand total pool, and chaos resistance the guide treats as optional.
          - Pinnacle bosses need a gem swap you have to remember before the fight.
          - Three kinds of map are off the table: both reflects and no-leech.
          - The guide's own third drawback: "Need Investment for T17s". It does not say how much.

powerCurve: |
  This build does not have a power curve so much as a cliff with a staircase after it.

  **At level 30 it is not this build.** You are throwing [[Explosive Concoction]] with no weapon, and nothing you own will matter after the swap except life, resistances and movement speed. That is why the campaign is fast and also why it teaches you nothing about how the character will feel.

  **Around level 70 everything arrives in one afternoon.** Three things multiply Kinetic Blast's clear, and the swap gives you all of them at once: the number of projectiles ([[Endless Munitions]] adds two), the four explosions each one makes, and [[Returning Projectiles Support]] sending them back through the pack. That product is why clear speed is excellent from the first map on a five-link. Single-target damage has none of those multipliers — one target cannot be hit by more explosions than land on it — so it starts weak and is patched with totems and [[Tornado]].

  **From there the damage is your wand, one upgrade at a time.** Flat elemental damage on the wand, times attack speed, times spell damage counted at one and a half through Arcane Might, times crit once you swap. Each is an ordinary gearing step, which is why the guide can give targets by stage: a million by two Voidstones, two to three million by four. *Our reading:* crit is the one real jump in that staircase, and the author says as much when he writes that non-crit "runs out of efficient scaling options at T16s".

  **Defence barely climbs at all.** The guide's pool target moves from 3,000 to about 4,000 between the first Voidstone and the last. What improves is avoidance: suppression to 100%, [[Grace]], [[Ghost Dance]]. So the character at level 95 clears many times faster than at 75 and survives a direct hit only slightly better. That gap, not the damage, is what decides whether you enjoy it.
upgrades:
  - step: Movement speed boots and capped resistances
    why: >-
      The guide's campaign list, and first because the build's defence is
      distance and speed. Nothing that follows helps a character that
      cannot get out of the way.
  - step: A high elemental damage wand
    why: >-
      Kinetic Blast deals 140–155% of weapon damage, so the wand is the base
      everything else multiplies. It comes before the shield because spell
      damage through Arcane Might multiplies the wand's damage, and a
      multiplier on a bad wand is still a bad number.
  - step: A shield with a high increased spell damage roll
    why: >-
      Counted at 150% for this skill. The guide pairs it with the wand as
      the two things to get straight after the swap. It is cheap to roll on
      a Harmonic Spirit Shield with basic currency, which is why it sits
      this high.
  - step: The crit swap, with flasks that refill on critical strikes
    why: >-
      The largest single step in damage, and free in currency: it is a
      respec. It follows the wand and shield because the author's own
      advice is to wait for good rolls on both before swapping.
  - step: Hybrid body armour, some energy shield, and 100% spell suppression
    why: >-
      [[Ghost Dance]] needs 100 to 300 energy shield to be worth having, and
      capped suppression is the guide's stated requirement for Maven and
      Uber Elder. Below the damage steps only because the first two
      Voidstones do not demand it. If you are dying, move it up.
  - step: Stygian Vise and a Searching Eye jewel
    why: >-
      More flat damage on a slot that had none. After suppression because it
      adds to a number that is already adequate, while suppression fixes one
      that is not.
  - step: The three-element wand and the finished shield
    why: >-
      The same two items as steps two and three, done properly. It is this
      late because it means Shrieking Essences, a recombinator and a
      protected craft, and each of those got more expensive or less reliable
      in 3.30.
  - step: "Replica Hyrri's Ire, two of The Taming, Yoke of Suffering and Dying Sun"
    why: >-
      The guide's endgame uniques. Last among the ordinary upgrades because
      the build "doesn't require any Unique items to function": these refine
      a working character and none of them fixes a problem.
play:
  mapping: |
    Hold [[Kinetic Blast]] and aim at the middle of the pack. You do not need to aim at individual monsters: the explosions happen around whatever the projectiles hit, and [[Returning Projectiles Support]] brings them back through.

    Then move *through* the pack, not around it. The guide's instruction is to "attack into each pack and run through them with a [[Quartz Flask]] or any other source of Phasing". [[Shield Charge]] is the main movement, with [[Flame Dash]] for gaps. If you prefer [[Frostblink]], the guide notes it can be used at the end of a Shield Charge.

    [[Spellslinger]] drops [[Flame Wall]] as you attack; you do not press it. [[Mark On Hit Support]] applies your mark. [[Immortal Call]] fires by itself when you take damage.

    For a map boss: place three [[Kinetic Bolt]] totems "before the boss becomes active", cast [[Tornado]], then hold Kinetic Blast. Replace the totems and the tornado as the fight goes on.

    The tension: the build is fastest when you run into packs and safest when you stay away from them. Phasing lets you do the first. Nothing lets you survive doing it carelessly.
  bossing: |
    **Before** a pinnacle fight, swap two gems in the body armour: [[Kinetic Blast]] out, [[Kinetic Bolt]] in; [[Returning Projectiles Support]] out, [[Barrage Support]] in. Carry the spares. The guide's warning runs the other way too: "Do not use Barrage when clearing Maps."

    The rotation is the same shape as for a map boss. Three totems down before the boss is active. [[Tornado]]. Then hold Kinetic Bolt on the boss, and fire through the tornado when you can, because its damage comes from the first 20 projectiles that hit it.

    Keep your flasks running. With the refill-on-crit modifier the [[Diamond Flask]] and [[Silver Flask]] stay up through a long fight, and the guide counts on that.

    What changes most is that you cannot kill the boss before it acts. In maps the answer to danger is that it is already dead. Here you have a four-thousand pool, 100% suppression, evasion and your feet. Stop firing to dodge; the totems and the tornado keep some damage going while you move.
deaths:
  - situation: A reflect map
    cause: >-
      The guide lists both "Monsters reflect Elemental Damage" and "Monsters
      reflect Physical Damage" as modifiers to avoid. You fire many
      projectiles, each makes several explosions, and each one that hits
      sends damage back at a character with a small pool.
    fix: >-
      Reroll the map. There is nothing in the published setup that answers
      reflect.
  - situation: One physical hit from something you did not see
    cause: >-
      Evasion is a chance, not a reduction. The independent 3.30 character
      evades 68% of attacks and can take 7,300 physical damage from the one
      that lands.
    fix: >-
      [[Immortal Call]] on [[Cast when Damage Taken Support]] and
      [[Ghost Dance]] are the guide's answer to burst, and both work only
      after the first hit. The real fix is the one the guide puts first in
      its drawbacks: do not get hit. Kill from the edge of the screen.
  - situation: Spell damage in the last two pinnacle fights
    cause: >-
      Spell suppression below 100% lets some spells through at full damage.
      The guide makes the cap its "primary passive tree goal" for Maven and
      Uber Elder for that reason.
    fix: >-
      Cap it before you attempt them. Take the mastery that makes your
      chance to suppress lucky earlier, for the first two bosses.
  - situation: Chaos damage and degeneration
    cause: >-
      The guide treats chaos resistance as optional ("if you value it"), on
      the argument that a wand build off-screens enemies without being hit.
      The independent character sits at −25% chaos resistance with a 3,000
      chaos maximum hit.
    fix: >-
      **Our advice, not the guide's:** if you die to chaos damage more than
      once, value it. A fractured chaos resistance base is the route the
      guide itself mentions.
  - situation: A map where monsters cannot be leeched from
    cause: >-
      It is on the guide's avoid list. The independent character recovers
      922 life per second from leech and 92 from regeneration; take the
      first away and almost nothing is left.
    fix: >-
      Reroll.
troubleshooting:
  - symptom: My damage on bosses is far lower than in maps
    cause: >-
      Kinetic Blast's damage is its explosions overlapping across a pack. On
      one target that multiplier is gone, and the gem also takes 40% less
      area damage.
    fix: >-
      Use the kit: three [[Kinetic Bolt]] totems, [[Tornado]], and both
      flasks. For pinnacle bosses, swap the main skill to Kinetic Bolt with
      [[Barrage Support]] — Kinetic Bolt has 220% damage effectiveness and
      200% Arcane Might against Kinetic Blast's 155% and 150%.
  - symptom: I run out of mana
    cause: >-
      A fast attack with a 140% cost multiplier from
      [[Sacred Wisps Support]], on a character that reserves two auras.
    fix: >-
      The guide's three options: the [[Thrill of Battle]] notable; a Life
      Mastery that turns part of the mana cost into a life cost; flat mana
      on gear.
  - symptom: It felt fine until red maps
    cause: >-
      Usually you are still non-crit. The author: non-crit "runs out of
      efficient scaling options at T16s". Or you swapped to crit on a poor
      wand and shield and lost damage doing it.
    fix: >-
      Get the wand and shield first, then respec. Roll the crit-refill
      modifier on the [[Diamond Flask]] and [[Silver Flask]] the same day.
  - symptom: I swapped to Kinetic Blast and it feels worse than the concoction
    cause: >-
      Either you swapped before [[Endless Munitions]], so too few
      projectiles are making too few explosions, or your wand is a leveling
      wand. The concoction did not use a weapon; this skill is nothing but
      its weapon.
    fix: >-
      Finish the third Labyrinth first. Then do not judge the build until
      you have a wand with real flat elemental damage.
  - symptom: I miss a lot
    cause: >-
      Accuracy. The guide runs a level 1 [[Precision]] specifically "to cap
      your hit chance", and takes accuracy on the tree until gear covers it.
      The independent character is at 92.9%.
    fix: >-
      Keep Precision on, and do not drop the tree's accuracy nodes until
      your gear replaces them.

patch:
  - entry: mercenary-nerfs
    note: >-
      **There is no new Kinetic Blast nerf in 3.30 — check this if you read
      otherwise.** The line in the notes, "Adjusted Kinetic Blast on Hired
      Mercenaries to have 150% Arcane Might", is under Mercenary Changes and
      brings mercenaries into line with players. The player's gem took that
      change a league ago: 3.29 moved it from 200% Arcane Might to 150% and
      from 35% less area damage to 40%. PoEDB shows no 3.30 entry for it.
  - note: >-
      **Deadeye was not changed.** None of [[Gathering Winds]],
      [[Ricochet]], [[Endless Munitions]] or [[Focal Point]] appears in the
      3.30 notes, and Deadeye is not among the classes in the Ruthless-only
      section either. Nor do [[Kinetic Bolt]], [[Tornado]],
      [[Spellslinger]] or [[Sacred Wisps Support]] appear.
  - entry: crafting-service-tweaks
    note: >-
      **This hits the guide's gear plan in two places.** High-level gambling
      costs more and gives worse items, and the guide gambles for its
      Tier 11 wand and its five-link body armour. Recombinators give fewer
      modifiers when the inputs have few, and the finished wand is made by
      recombining two wands with two prefixes each. The guide was updated on
      12 November and does not mention either.
  - entry: essence-changes
    note: >-
      **Good for the wand.** In red maps every Essence is now Screaming tier
      or better, and the wand craft wants Shrieking Essences of Wrath, Anger
      and Hatred.
  - entry: no-random-league-mechanics
    note: >-
      **"Run Abyss" now means "run an Abyss Thread".** The guide sends you
      to Abyss for a [[Stygian Vise]] and a Searching Eye jewel. Abyss no
      longer appears in maps without a Thread.
  - entry: item-tiers
    note: >-
      **Mixed.** A Stygian Vise needs an Item Tier of 5 to drop. On the
      other side, tiered rares from Act 6 make the campaign's life and
      resistance gear easier to spot, and that is all the campaign asks for.
  - entry: meta-crafting-costs
    note: >-
      **The finished shield costs a different amount.** Its recipe uses
      "Prefixes Cannot Be Changed", which is now 4 Divine plus a second
      currency. No new total has been published.
  - entry: league-fates
    note: >-
      **A caution, and it is ours.** This league's mechanic makes area
      bosses harder on purpose. A build that survives by killing first is
      the wrong shape for a boss you chose to strengthen. Invoke fewer Fates
      than you would on a sturdier character until you know your damage.

strengths:
  - "Clear speed that is excellent from the first map, on a five-link."
  - "No required unique item, at any stage up to four Voidstones."
  - "A guide whose planner really is saved for 3.30, with gems for every level range."
  - "Mobile: Tailwind, Shield Charge and phasing."
  - "A very high ceiling for anyone who finds a Headhunter."
weaknesses:
  - "You do not play the build until after the third Labyrinth."
  - "Around four thousand total life and energy shield. One hit that connects can end it."
  - "Single-target damage needs totems, a tornado and, for pinnacle bosses, a gem swap."
  - "The wand is the build, and 3.30 made two of the guide's ways of getting one worse."
  - "Three map modifiers are simply off the table."
  - "No prices and no measured figures anywhere in the guide."
avoidIf: >-
  Pick something else if you want to stand in the middle of a fight, or if
  dying to a hit you did not see makes you stop playing. Skip it if you want
  one skill from level 1: this build is a different character for the whole
  campaign. And skip it as a boss killer: the guide needs a gem swap and two
  helper skills to fight a pinnacle boss at all, and the one independent
  3.30 character has 27,689 effective hit points. If what you want is to clear maps very fast on rare items, this is
  the best-documented way to do it this league.

