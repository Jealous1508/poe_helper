name: Lightning Arrow Deadeye (league starter)
tagline: >-
  The cheapest fast mapper on this list. One arrow clears a screen. It is also
  the weakest bosser here, and that matters more this league than last.
class: Ranger
ascendancy: Deadeye
role: starter
budget: starter
budgetNote: >-
  **No source publishes a 3.30 budget for this build, and we will not invent
  one.** Maxroll's own budget rating is 3 out of 5, and that is a **3.29**
  figure. The one concrete price anyone gives is 7–10 Divine for
  [[Hyrri's Ire]] "on league start", which is also **3.29** and was written
  about a different economy. A third number, roughly 49 chaos, appears on an
  auto-generated archive page that we could not open and that looks like a
  low-level snapshot. Ignore all three as current prices. What is reliable is
  the shape: no unique item is required, and your first real cost is a bow.
mainSkill: Lightning Arrow
image: lightning-arrow
hero: art-deadeye
tags: [Bow, Elemental, Mapper, Cheap start]
ratings: { clear: 5, bossing: 2, survivability: 2, ease: 3 }
verified: "2026-11-13"
confidence: mixed
confidenceNote: >-
  **Clear and bossing are Maxroll's own numbers; survivability and ease are
  ours.** The planner behind the guide rates Mapping 5, Bossing 2, Defence 2,
  Difficulty 4 and Budget 3. We scored survivability 2 and ease 3 to match
  those, rounding our own 2.5 down. All of those are **3.29 ratings**. The
  guide page is stamped 3.30, but its title still reads 3.28, its planner
  carries league 3.29 with a 3.26 passive tree, and its entire 3.30 changelog
  entry reads "Awaiting PoB update, no changes in 3.30 patch notes". Nothing
  about the build changed in 3.30, so the stale data is still largely correct —
  but do not treat any number on that page as measured this league.
modes:
  ssf: >-
    No source rates it. In its favour: no unique item is required and the bow
    is craftable. Against it: the published gearing path leans on bought
    fractured bases and recombinators. Our judgement, not a sourced claim.
  hardcore: >-
    No source addresses it. Around 4,500 life behind evasion and spell
    suppression, with a 2 out of 5 defence rating, is a poor hardcore profile.
    Again our judgement, and we would not do it.

idea: |
  You fire one arrow. It converts most of its damage to lightning and then fires beams at everything nearby. Packs die before the arrow finishes travelling.

  [[Deadeye]] makes every projectile do more: two extra arrows, more damage at range, and a copy of you that keeps shooting while you move.

  There is a catch that no tier list puts on the front page, so we will. **For the first stretch of a league you do not really play Lightning Arrow.** You play [[Elemental Hit of the Spectrum]], because it is the only bow skill that supplies a lot of flat damage, and flat damage is exactly what you lack with no currency. You swap to Lightning Arrow once you own a genuinely good bow.

  This is a shell with two skill phases, not a single-skill build. If that sounds like a bait and switch, it is better to know now than in week one.

  **Where it leads:** this article is the starter. The same character at mirror budget, built fully around Elemental Hit of the Spectrum and two [[The Taming]] rings, is the endgame article on this site, *Lightning Arrow / Elemental Hit of the Spectrum Deadeye*. You do not reroll to get there. You keep the same bow shell and keep buying.

chain:
  - label: Shoot
    text: "[[Lightning Arrow]] converts physical damage to lightning and strikes nearby enemies with beams on hit."
  - label: Multiply
    text: "[[Endless Munitions]] adds two projectiles, [[Far Shot]] adds damage at range, and [[Mirage Archer Support]] leaves a copy of you shooting."
  - label: Balance the elements
    text: "[[Trinity Support]] rewards hitting with more than one element. You only need two of the three dealing damage for the full effect."
  - label: Survive
    text: "Evasion, 100% [[Spell Suppression]] and about 4,500 life. There is no absorbing layer and no recovery engine."

chainDetails:
  - title: Why you start on Elemental Hit and not on Lightning Arrow
    body: |
      This is the single most useful thing in the article.

      At league start your bow is bad and your rings are bad, so you have almost no flat added damage. [[Elemental Hit of the Spectrum]] carries its damage on the gem itself, which is why it works on nothing. [[Lightning Arrow]] scales off what your gear adds, which is why it feels dead until the gear exists.

      Two sources agree without saying so directly. The guide's own planner has Elemental Hit in its early and mid loadouts and Lightning Arrow only in the late one. The most-watched author's own notes say Lightning Arrow feels much better once you have a really good bow or [[Hyrri's Ire]] to make up for the low flat damage.

      So: level on Lightning Arrow because it is free from level 12, map on Elemental Hit of the Spectrum, and come back to Lightning Arrow when your bow deserves it.
  - title: What a good bow actually means
    body: |
      The two sources that give a number give different numbers, for different reasons, so take neither as "the" threshold.

      One says 8% base critical strike chance and 800+ elemental damage per second. The other uses 6% base crit as the point to swap [[Increased Critical Damage Support]] for [[Increased Critical Strikes Support]]. Those answer different questions.

      Bases both agree on: Spine Bow, Bone Bow, Ivory Bow. [[Spine Bow]] is the usual target for a crafted one.
  - title: Pierce first, fork later
    body: |
      Early on you want pierce, from a glove implicit or from three passive points. It is the cheaper way to make one arrow hit a line of enemies.

      Later you swap to [[Greater Fork Support]], which splits projectiles instead. Two sources describe the same transition from opposite directions, which is unusually good agreement for this build.
  - title: Precise Technique, and the rule that breaks it
    body: |
      You run [[Precise Technique]] during the campaign: no critical strikes, but you never miss and you get a large damage bonus. Later you respec to a crit build.

      **The rule everyone forgets: Precise Technique only works while your accuracy is higher than your maximum life.** Two sources warn about this. Every time you add a big life roll, check that accuracy is still ahead of it.
  - title: Where the defence comes from, and what it is not
    body: |
      Evasion, spell suppression and life. The passive tree alone supplies about 80% spell suppression. Another 15% comes from the Evasion Mastery, but only if your helmet, body, gloves and boots **all** have evasion.

      Accuracy target for Tier 16 is around 3,300. Anything above about 4,500 is wasted.

      For scale, one published level 98 file reads 4,562 life, 42,903 effective hit points, 14,550 evasion and 63% evade chance. That is a **3.29** file. It is thin, and the author does not pretend otherwise.

mandatory:
  - term: Lightning Arrow
    why: >-
      The skill the build is named after and the one you level with from level
      12. It becomes your main skill again once your bow is good.
  - term: Elemental Hit of the Spectrum
    why: >-
      The skill you actually map with at low budget, because it supplies its
      own damage. Treat it as a mandatory part of this build, not as an
      alternative to it.
    detail: >-
      Both the guide's planner ordering and the most-watched author's notes put
      Elemental Hit in the early and mid game and Lightning Arrow in the late
      game. If you skip this step you will conclude the build is weak, and you
      will be right about your version of it.
  - term: Trinity Support
    why: >-
      Present in every published setup. It rewards hitting with multiple
      elements, and the common misconception is that you need all three — you
      need two dealing damage for the full effect.
  - term: Mirage Archer Support
    why: >-
      A copy of you that keeps firing while you move. It is in every setup and
      it is most of why the build feels smooth.
  - term: Spell Suppression
    why: >-
      100%. With roughly 4,500 life and no recovery, half of all spell damage
      has to stop existing or you die to it.
  - term: Precise Technique
    why: >-
      The campaign keystone. Never miss, no crit, large damage bonus — and it
      switches off if your maximum life exceeds your accuracy.
  - term: Spine Bow
    level: recommended
    why: >-
      The usual crafted base. A bow is the first real purchase and the thing
      that gates the swap back to Lightning Arrow.
  - term: Hyrri's Ire
    level: recommended
    why: >-
      The chest to aim for if you are playing Lightning Arrow rather than
      Elemental Hit, because its flat damage is worth more to Lightning Arrow.
    detail: >-
      The quoted 7–10 Divine is a **3.29 league-start price** and should not be
      read as a 3.30 one. [[Daresso's Defiance]] is the cheap stand-in: 20%
      movement speed, but none of the spell suppression.
  - term: Hyrri's Truth
    level: recommended
    why: >-
      Bow damage, accuracy and crit on one cheap amulet. The archetype default
      early amulet.
  - term: The Fledgling
    level: recommended
    why: >-
      Its [[Far Shot]] stacks with the ascendancy's, because they are separate
      modifiers. One author states up to 90% more damage at maximum range.
  - term: Ancestral Vision
    level: recommended
    why: >-
      100% ailment avoidance, which lets you drop [[Purity of Elements]] and
      free the reservation. Two sources agree on this one.
  - term: Lethal Pride
    level: recommended
    why: >-
      A later jewel. One author wants two or three "double damage" rolls on it,
      and it also solves the Strength requirement for [[Steelskin]].
  - term: The Taming
    level: recommended
    why: >-
      Not a starter item. Two of them are the core of the endgame version of
      this character, so they are what you are saving for.

labs:
  - lab: Normal
    node: Gathering Winds
    why: "Tailwind: you and your allies move and act faster. The planner's own leveling tips put it first."
  - lab: Cruel
    node: Far Shot
    why: "More damage the further the projectile has travelled. The guide says the bonus caps around 75 units; one other author says 70. Do not treat either number as exact."
  - lab: Merciless
    node: Endless Munitions
    why: "+2 projectiles. The largest single clear increase in the ascendancy."
  - lab: Eternal
    node: Focal Point
    why: "Increases the effect of your mark. **This one is inferred** — no source states the fourth lab, but the set of four notables is agreed, so Focal Point is what is left."

stages:
  - id: acts-1-3
    image: lightning-arrow
    title: Acts 1–3
    levels: Level 1–33
    uses: >-
      [[Galvanic Arrow]] from level 2, then [[Lightning Arrow]] from level 12
      after Fairgraves in the Cavern of Wrath. [[Shrapnel Ballista]] and
      [[Sniper's Mark]] for anything with a health bar.
    changes: >-
      Pick up [[Mirage Archer Support]] at 4, [[Manaforged Arrows Support]] at
      8, and [[Trinity Support]] after the Weaver at 18. Buy a
      [[Sapphire Ring]] before Merveil and a Lapis Amulet for the Dexterity
      and Intelligence.
    links:
      - name: Level 2–11
        gems: [Galvanic Arrow, Momentum Support, Mirage Archer Support]
      - name: From level 12
        gems: [Lightning Arrow, Mirage Archer Support, Lesser Multiple Projectiles Support]
      - name: Single target
        gems: [Shrapnel Ballista, Sniper's Mark]
      - name: Utility
        gems: [Dash, Frostblink, Blink Arrow, Burning Arrow]
      - name: From level 16–18
        gems: [Lightning Arrow, Mirage Archer Support, Trinity Support, Elemental Damage with Attacks Support]
    moveOn: "Lightning Arrow is in a four-link with Trinity and you have finished Act 3."
    details:
      - title: Three authors, three leveling skills
        body: |
          The guide levels with [[Galvanic Arrow]]. A second source says the build starts on [[Rain of Arrows]] and swaps to Lightning Arrow once pierce is online. A third says the same author levels with Rain of Arrows.

          All three are real approaches and none is wrong. We follow the guide's companion leveling guide because it is the most detailed, but pick whichever you have in your gem slots.
      - title: Where a Ranger gets each gem
        body: |
          From the guide's companion Ranger leveling guide:

          - **Level 2**, after Hillock: [[Galvanic Arrow]] and [[Momentum Support]].
          - **Level 4**, after Hailrake: [[Mirage Archer Support]], [[Shrapnel Ballista]], [[Sniper's Mark]], [[Dash]].
          - **Level 8**, Lower Prison: [[Burning Arrow]], [[Manaforged Arrows Support]], [[Frostblink]].
          - **Level 10**, after Brutus: [[Blink Arrow]].
          - **Level 12**, Cavern of Wrath after Fairgraves: [[Lightning Arrow]].
          - **Level 16**, after Fidelitas: [[Herald of Ice]]; [[Frenzy]] into Manaforged.
          - **Level 18**, after the Weaver: [[Trinity Support]] or [[Elemental Damage with Attacks Support]] free, buy the other.
          - **Level 24**, after Tolman: [[Anger]]; [[Grace]] free.
          - **Level 28**, after Gravicius: [[Storm Rain]] free; [[Blast Rain]] and [[Artillery Ballista]] optional.
      - title: Bandits and small decisions
        body: |
          Help **Alira**. The planner says so and the elemental resistances make the campaign much easier.

          Take Primal Spirit for the Strength. Buy two-stone rings after level 20. Reach level 32 before you enter Kaom's Stronghold.
  - id: acts-4-10
    image: trinity-support
    title: Acts 4–10
    levels: Level 33–68
    uses: >-
      The same [[Lightning Arrow]] link with [[Trinity Support]] and
      [[Elemental Damage with Attacks Support]]. [[Anger]] and [[Grace]] as
      auras from Act 3.
    changes: >-
      You ascend three times. At level 38 you get [[Returning Projectiles Support]]
      from Lady Dialla and [[Tornado]] from Oyun. Keep your accuracy above your
      maximum life so [[Precise Technique]] keeps working.
    links:
      - name: Main skill
        gems: [Lightning Arrow, Mirage Archer Support, Trinity Support, Elemental Damage with Attacks Support, Lesser Multiple Projectiles Support]
      - name: Single target
        gems: [Artillery Ballista, Focused Ballista Support, Elemental Damage with Attacks Support]
      - name: Automatic
        gems: [Storm Rain, Manaforged Arrows Support, Lifetap Support]
      - name: Auras
        gems: [Anger, Grace]
      - name: Mark and movement
        gems: [Sniper's Mark, Dash, Frostblink]
    moveOn: "resistances are back at 75% after Act 10 and you have three ascendancy points spent."
    details:
      - title: Pantheon is a three-way disagreement
        body: |
          Three sources, three answers, and we are not going to pretend there is a consensus.

          - The guide: Brine King with all three upgrades, plus Tukohama.
          - The most-watched author: Brine King until you are ailment-immune, then Solaris or Lunaris; minor Ralakesh or Shakari.
          - A third guide: Arakaali plus Abberath.

          Brine King is the safe campaign pick in all three readings. Change it later when you know what is killing you.
      - title: Watch the accuracy rule
        body: |
          [[Precise Technique]] switches off the moment your maximum life passes your accuracy. This is the most common silent damage loss in the build.

          Every time you equip a big life roll, open your character sheet and check both numbers.
      - title: Resistances
        body: |
          After the Act 5 boss you lose 30% of every elemental resistance, and another 30% after Act 10. Fix both at the crafting bench before you go further.

          This build has no spare defence to absorb uncapped resistances.
  - id: early-maps
    image: elemental-hit-of-the-spectrum
    title: Early maps
    levels: White and yellow maps
    uses: >-
      **This is where you swap off Lightning Arrow.**
      [[Elemental Hit of the Spectrum]] in a six-link, with
      [[Artillery Ballista]] as your single target and
      [[Anger]] plus [[Grace]] as auras.
    changes: >-
      Work on spell suppression towards 100%, and on resistances. Keep accuracy
      above 3,300 and do not bother pushing past about 4,500. The bow you are
      saving for is the thing that ends this stage.
    links:
      - name: Main skill
        gems: [Elemental Hit of the Spectrum, Mirage Archer Support, Trinity Support, Returning Projectiles Support, Added Cold Damage Support, Elemental Damage with Attacks Support]
      - name: Single target
        gems: [Artillery Ballista, Focused Ballista Support, Elemental Damage with Attacks Support, Immolate Support]
      - name: Reactive
        gems: [Cast when Damage Taken Support, Immortal Call]
      - name: Auras
        gems: [Anger, Grace, Precision]
      - name: Mark and movement
        gems: [Sniper's Mark, Dash, Frostblink]
    moveOn: "you have a bow worth swapping back to Lightning Arrow for, and spell suppression is close to capped."
    details:
      - title: Do not feel bad about the swap
        body: |
          It is not a failure of the build. It is how the build is designed, in the guide's own planner, even though nothing on the page says so plainly.

          Elemental Hit of the Spectrum supplies its own damage. Lightning Arrow borrows yours. At this point you do not have any to lend.
      - title: Suppression, in order
        body: |
          The passive tree gives about 80%. The Evasion Mastery gives another 15%, but only if your helmet, body armour, gloves **and** boots all have an evasion value.

          That last condition is the bit people miss. One armour base in the set with no evasion and the mastery is dead.
      - title: Earning your first currency in 3.30
        body: |
          The loot rework moved value onto rare and unique monsters and onto bosses. This build clears fast and kills bosses slowly, which is the wrong way round this league.

          The practical answer is to run plenty of maps rather than hard ones, and to actually stop and kill the rares instead of running past them.
  - id: red-maps
    image: spine-bow
    title: Red maps
    levels: Tier 11–16 maps
    uses: >-
      [[Lightning Arrow]] again, now in a six-link with
      [[Greater Fork Support]] and [[Inspiration Support]], behind a real bow.
      A [[Manaforged Arrows Support]] package fires your utility for you.
    changes: >-
      You respec from [[Precise Technique]] to crit here. Add
      [[Power Charge On Critical Support]] on a [[Frenzy]] and Manaforged link
      so your charges keep themselves full.
    links:
      - name: Main skill
        gems: [Lightning Arrow, Mirage Archer Support, Inspiration Support, Elemental Damage with Attacks Support, Greater Fork Support, Trinity Support]
      - name: Automatic utility
        gems: [Storm Rain, Blast Rain, Manaforged Arrows Support, Lifetap Support, Inspiration Support, Elemental Damage with Attacks Support]
      - name: Charges
        gems: [Frenzy, Manaforged Arrows Support, Power Charge On Critical Support]
      - name: Mark
        gems: [Sniper's Mark, Mark On Hit Support]
      - name: Auras
        gems: [Grace, Anger, Haste, Enlighten Support]
    moveOn: "you clear Tier 16 maps comfortably and the crit respec is finished."
    details:
      - title: The crit swap
        body: |
          [[Precise Technique]] and crit are mutually exclusive. The swap is a respec, not a gradual change, and you do it when your bow has enough base critical strike chance to be worth it.

          One source uses 6% base crit as the marker for switching [[Increased Critical Damage Support]] in for [[Increased Critical Strikes Support]]. Another uses 8% base crit as the bar for the bow itself. Those are different questions with different answers.
      - title: A five-link is enough for a while
        body: |
          One older write-up, marked out of date by its own author, says a five-link carries you to Tier 16. We mention it because it is true of the archetype and it saves you an early six-link purchase.

          Spend on the bow first.
      - title: A 3.30 crafting change nobody has written up
        body: |
          One author's crafting notes carry a line that is genuinely 3.30-specific: "cannot roll attack" no longer works for annulments this patch.

          If you were planning the published recombinator route to a triple-tier-2 bow, check the current method before you spend. That one line is also the proof that the notes were partly revised for 3.30 even though the file header still says 3.29.
  - id: endgame
    image: the-taming
    title: Endgame
    levels: Tier 17 and beyond
    uses: >-
      A crafted bow with three top-tier prefixes, [[Lethal Pride]],
      [[Nimis]], and eventually two [[The Taming]] rings.
    changes: >-
      This is the handover point. The character you are building becomes the
      endgame article on this site, *Lightning Arrow / Elemental Hit of the
      Spectrum Deadeye* — same shell, same ascendancy, built around two Taming
      rings and a crit trigger package.
    links:
      - name: Main skill
        gems: [Lightning Arrow, Mirage Archer Support, Inspiration Support, Elemental Damage with Attacks Support, Greater Fork Support, Invert the Rules Support]
      - name: Automatic utility
        gems: [Storm Rain, Blast Rain, Manaforged Arrows Support, Lifetap Support, Inspiration Support, Elemental Damage with Attacks Support]
      - name: Auras
        gems: [Grace, Anger, Haste, Enlighten Support]
    moveOn: "there is no next stage here. Read the endgame article for where the character goes."
    details:
      - title: The upgrade order, with no prices attached
        body: |
          Three sources agree on the order even though none of them gives a cost:

          six-link → suppression-capped rares → [[Hyrri's Truth]] → [[The Taming]] → [[Hyrri's Ire]] → [[The Fledgling]] → a crafted bow with three top-tier prefixes → [[Lethal Pride]] → [[Nimis]] → [[Headhunter]] → [[Mageblood]].

          **No source gives a Divine-denominated total cost for this build at any stage.** A day-one league has no economy to price against anyway.
      - title: Bossing does not get fixed
        body: |
          Maxroll's own planner rates this build Bossing 2 out of 5 against Mapping 5. A second source rates its boss damage 3 out of 5, its lowest score on that list.

          There is no clean answer to this. The build is a map blaster and it stays one. If your league plan is boss farming, this is the wrong pick and three of the other builds on this site are better.
      - title: The bow interaction being hyped in 3.30
        body: |
          One tier list describes an interaction for bow Deadeyes in 3.30: with a particular unique, splitting projectiles can shotgun all their hits into a single target, estimated at 20 to 60 times the damage.

          Treat that with caution. It is **one site's estimate, not a measurement**, it belongs to an Ice Shot setup rather than a Lightning Arrow one, and the video it comes from could not be opened. It is adjacent to this build, not part of it.

patch:
  - note: >-
      **Nothing about this build changed in 3.30.** [[Lightning Arrow]] is not
      mentioned in the notes. Neither is [[Deadeye]]. There are no bow skill or
      bow base changes at all. You are inheriting a 3.29-proven shell intact.
  - entry: special-base-implicits
    note: >-
      **One change that touches your gear.** The Artillery Quiver's implicit is
      now "+1 to maximum number of Summoned Totems" for attack skills. This
      build runs [[Artillery Ballista]] in its early and mid setups, so the
      change is a real, if small, buff to that part of the build.
  - entry: mercenary-nerfs
    note: >-
      **Relative buff.** Mercenary builds were cut hard. This one uses none, so
      it moved up the list without changing.
  - entry: winter-orb-nerf
    note: >-
      **Relative buff.** The most-played starter of last league was cut hard,
      which clears space near the top of the mapping tier lists.
  - entry: loot-rarity-rework
    note: >-
      **This is the headwind, and it is the single most decision-relevant fact
      for this build.** Valuable currency now comes much more from rare and
      unique monsters and from bosses. A build its own author rates 2 out of 5
      for bossing is pointed away from where the patch puts the rewards. It was
      not nerfed. The rewards moved.
  - entry: league-fates
    note: >-
      **Same problem, from the other side.** The league mechanic empowers area
      bosses and gates its rewards behind killing them. Plan to borrow or buy
      boss damage rather than expecting the build to supply it.
  - entry: ruthless-changes
    note: >-
      **Nothing here to unlearn for Deadeye, but know the trap.** A long list of
      ascendancy changes in the notes sits inside the Ruthless-specific section
      and does not apply to the normal game. Deadeye appears in neither list.
      Several launch articles have applied that section to the normal game for
      other classes.
  - entry: meta-crafting-costs
    note: >-
      **The crafted bow may work differently.** One author's notes record that
      "cannot roll attack" no longer works for annulments in 3.30, which
      affects the published crafting route. No new method has been written up.

strengths:
  - "Elite clear speed. One of the two fastest mappers on this list."
  - "Cheap to enter. No unique item is required at any point."
  - "Very strong leveling: the skill is free at level 12 and carries the whole campaign."
  - "Most of the utility automates itself through Manaforged Arrows."
  - "Scales smoothly with currency, with no single hard gate."
  - "3.30 changed nothing about it, so last league's knowledge transfers directly."
weaknesses:
  - "Bossing is the weak axis and stays weak. The author's own rating is 2 out of 5."
  - "Damage is poor at low budget, which is why you spend the early game on a different skill."
  - "Around 4,500 life behind evasion. One large hit still kills you."
  - "You manage three breakpoints yourself: suppression, accuracy and resistances."
  - "You swap main skills once and respec your keystone once. It is not a one-skill build."
  - "The published guide is 3.28 and 3.29 data under a 3.30 banner."
avoidIf: >-
  Pick something else if your league plan is boss farming. The build is rated 2
  out of 5 for bossing by its own author, and 3.30 moved the rewards towards
  bosses. Skip it too if you dislike tracking suppression, accuracy and
  resistance breakpoints after every gear change, or if you want to press one
  skill from level 1 to level 100 — you will change main skill once and respec
  a keystone once. It is a poor hardcore choice, though no source says so
  outright.

