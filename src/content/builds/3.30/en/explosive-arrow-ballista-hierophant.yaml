name: Explosive Arrow Ballista Hierophant
tagline: >-
  Five totems stack fuses on whatever you point at until it detonates. You hold
  one button, and 3.30 just handed the build a free sixth totem.
class: Templar
ascendancy: Hierophant
role: starter
budget: starter
budgetNote: >-
  **The guide says "very cheap to make" and then gives no figure for anything.**
  No prices, no divine totals, no per-stage budget — we checked all four of its
  pages. What it gives instead is a two-column table of budget versus
  best-in-slot for every slot, and the budget column is genuinely cheap: a
  [[Quill Rain]], a [[Skirmish]] quiver, and rares with life and resistances
  everywhere else. The best-in-slot column ends at [[Headhunter]] and
  [[Mageblood]], which is not a starter budget in any league, and the crafted
  [[Artillery Quiver]] it wants instead of Skirmish has a crafting guide that
  the page says is "posted shortly" and which does not exist yet.
mainSkill: Explosive Arrow
image: explosive-arrow
hero: art-hierophant
tags: [Bow, Totems, Fire, Ignite, One button]
ratings: { clear: 5, bossing: 3, survivability: 4, ease: 5 }
verified: "2026-11-13"
confidence: mixed
confidenceNote: >-
  **Read this before the ascendancy question below.** The guide carries a
  Covens of Umbra 3.30 label and a 12 November 2026 date, and unlike most
  launch-week pages it genuinely knows about a 3.30 change: it says in as many
  words that "Starting with Patch 3.30" the [[Artillery Quiver]] implicit
  becomes an extra totem. That is correct.


  But **its Path of Building file is titled "Level 78 Explosive Arrow Totem
  Hierophant [3.29]"**, so every number behind the guide is 3.29-era, and it is
  a level 78 snapshot with uncapped resistances (49/49/49/−60) rather than a
  finished character. The figures we quote from it are labelled accordingly.
  The guide also publishes no ratings; the four above are our reading of its
  own pros and cons list.
modes:
  ssf: >-
    Workable but slower than it looks. [[Quill Rain]] is a common unique and
    [[Skirmish]] is cheap, so the entry version is fine. The best-in-slot list
    is five specific uniques deep ([[Viridi's Veil]],
    [[Replica Dragonfangs' Flight]], [[Daresso's Defiance]],
    [[Breathstealer]], [[Dawnstrider]]), and the +3 Explosive Arrow amulet roll
    in particular is a long hunt. Our assessment; the guide gives no SSF
    verdict.
  hardcore: >-
    The guide gives no verdict. Our read: the totems take the hits and you
    stand behind them, which is structurally safe, and [[Dawnstrider]]
    deliberately redirects damage onto them. Against that, the level 78
    planner we could read has 20,098 effective hit points with resistances far
    below the cap, so nothing in the published material demonstrates a
    hardcore-grade defensive layer.

idea: |
  [[Explosive Arrow]] does nothing when it hits. The arrow sticks in the target with a one-second fuse. The damage happens when the fuse runs out, and **every arrow already stuck in that target is consumed into the same explosion**, adding its damage to it.

  So the skill rewards a very high rate of fire at a single point, which is the one thing you personally are bad at and a row of totems is excellent at. [[Ballista Totem Support]] turns the skill into ballistas that fire it for you. You stand still, point, and the stack builds.

  [[Hierophant]] is the totem ascendancy: more totems, and totems that place faster and live longer. [[Ancestral Bond]] on the tree means you deal no damage yourself at all — which costs you nothing, because you were never going to.

  The 3.30 relevance is small and real. The [[Artillery Quiver]] implicit changed from totem placement speed to **+1 maximum totem for attack skills**. One more ballista is one more fuse stack per second, forever.

chain:
  - label: Place totems
    text: "[[Ballista Totem Support]] makes [[Explosive Arrow]] summon ballistas that fire it. Hold the button and they keep firing at whatever you aim at."
  - label: Stack fuses
    text: "Each arrow sticks to the target. Up to 20 can be stuck at once, 22 at full gem quality, and each one adds +6% more hit damage and +1 to +0.2 metres of radius."
  - label: Detonate
    text: "When the first fuse expires every stuck arrow is consumed into one explosion. More totems means a bigger stack means a bigger explosion."
  - label: Scale it
    text: "[[Elemental Equilibrium]] and [[Flammability]] drop the target's fire resistance; [[Combustion Support]] and [[Point Blank]] do the rest."
  - label: Stand behind them
    text: "[[Ancestral Bond]] means you deal no damage yourself. [[Dawnstrider]] redirects damage to your totems, [[Grace]] and [[Purity of Elements]] cover the rest."

chainDetails:
  - title: Why this is a Hierophant in 3.30 and not an Elementalist or a Champion
    body: |
      This build has been written up as an Elementalist and as a Champion in past leagues, and if you search for it now you will mostly find those. **Both of those guides are stale, and we checked each one.**

      - **Maxroll's Elementalist version** (Palsteron) is marked **Archived**. Its newest changelog entry reads "Updated for 3.28 Mirage", dated 6 March 2026.
      - **PoE Vault's Champion version** (TbXie) is tagged **Out Of Date** and sits in the site's Legacy section. It is labelled Settlers of Kalguur 3.25, and it says outright that the author does "not recommend playing this build anymore".
      - **Maxroll's own 3.30 build index** lists its Explosive Arrow Ballista guide as Champion and stamps it **3.29**, while stamping forty-two other guides 3.30. It was not updated this league.
      - **PoE Vault's Hierophant version** (POEGuy) is labelled Covens of Umbra 3.30, dated 12 November 2026, and it is the one that names a 3.30 change in its own text.

      So the answer is not a damage comparison; it is that only one of the three has an author behind it this league. If you want the Elementalist or Champion tree, you will be porting a 3.25 or 3.28 guide yourself.
  - title: What the quiver change is actually worth, and the trap in it
    body: |
      The guide's wording: "Starting with Patch 3.30 ... this quiver will grant us +1 additional totem through its implicit instead of Totem Placement Speed!"

      That is accurate. [[Artillery Quiver]]'s implicit is now "Attack Skills have +1 to maximum number of Summoned Totems", replacing 20–30% increased totem placement speed.

      **The trap the guide does not mention:** the official notes say existing items are not affected. An [[Artillery Quiver]] that dropped before this patch still has placement speed. You need one that drops in 3.30, and the base only drops on magic and rare items at a high enough Item Tier. Do not buy a cheap old one and expect the totem.

      Until you have one, [[Skirmish]] is the budget quiver and also gives +1 totem, so you are not blocked.
  - title: The two things that quietly break the damage
    body: |
      Both are in the guide's own "common mistakes" list, and both are silent — nothing tells you it has happened.

      1. **Any flat "Added Fire Damage to Attacks" on your gear breaks [[Elemental Equilibrium]].** Elemental Equilibrium raises the target's resistance to the element you just hit it with and lowers the other two. The build hits with cold or lightning first, to drop fire resistance, then explodes for fire. Add fire damage to your attacks and you are raising the resistance you need lowered.
      2. **Pierce.** The guide names using a [[Penetrating Arrow Quiver]] as a mistake. An arrow that pierces does not stick, and an arrow that does not stick is not in the explosion.

      A third, less destructive one: not swapping [[Lesser Multiple Projectiles Support]] out for [[Combustion Support]] once you have the extra-arrow notable on the tree.
  - title: Where the totem count comes from
    body: |
      Four sources, and they add up:

      - [[Pursuit of Faith]] and the Hierophant tree.
      - [[Artillery Quiver]]'s new implicit, or [[Skirmish]] on a budget: +1.
      - [[Ancestral Bond]] on the passive tree, which is also why [[Dawnstrider]] saves you points — the boots grant the keystone's effect.
      - Totem mastery nodes.

      The guide does not state a final number, and we are not going to compute one from a 3.29 planner and call it a 3.30 figure.
  - title: The spectre, and the one claim we could not verify
    body: |
      The gem page lists a [[Raise Spectre]] setup holding a Perfect Guardian Turtle, and says the Perfect version "provides the Determination aura" and activates [[Fertile Will]], the Farrul ascendancy node, which the pantheon page describes as 100% increased damage, stun immunity and 3% of maximum life regenerated per second while you have a Beast spectre.

      **That is a large claim resting on one page of one guide.** We found no second source for it, the spectre in question is a league-mechanic creature, and the guide's own build page lists "not unlocking the labs (including the Farrul Ascendancy with the Spectre combo)" as a common mistake — which reads as though the mechanism needs setup the guide does not spell out. Treat it as unconfirmed.

mandatory:
  - term: Explosive Arrow
    why: >-
      The skill. Gem level is the largest single damage source, and the guide
      wants it at level 21 with 20% quality, in a green socket for the extra
      quality.
    detail: >-
      PoEDB: the arrow sticks with a one-second base fuse; up to 20 arrows can
      be stuck on one enemy, raised to 22 at 20% quality; each stuck arrow adds
      6% more damage with hits, 3% more with ailments, and +0.2 metres of
      radius up to +1.2. The explosion itself deals 50% less base damage, which
      is why the stack is everything.
  - term: Ballista Totem Support
    why: >-
      Turns the skill into totems that fire it for you. This is the whole
      build; without it you are a person with a bow and a one-second fuse.
  - term: Elemental Damage with Attacks Support
    why: >-
      The main damage multiplier in the link, in the guide's endgame six-link
      and in its campaign setup.
  - term: Combustion Support
    why: >-
      More fire damage and lowers the target's fire resistance. It replaces
      [[Lesser Multiple Projectiles Support]] once you have the extra-arrow
      notable.
  - term: Lifetap Support
    why: >-
      The guide's endgame setup "uses Lifetap Support for all skills", which is
      why it lists no mana management at all among its problems.
  - term: Cruelty Support
    why: >-
      The sixth socket on a budget. Replace it with a level 4
      [[Empower Support]] when you can afford one.
  - term: Ancestral Bond
    why: >-
      You deal no damage with your own hits; your totems deal 50% more. You
      were not hitting things anyway.
    detail: >-
      [[Dawnstrider]] grants its effect, which is where the guide's "saves
      passive points" note comes from, and it also redirects damage to your
      totems for roughly 10% mitigation when stacked with the Totem mastery.
  - term: Elemental Equilibrium
    why: >-
      Hit with cold or lightning, explode with fire. Breaking this with flat
      added fire damage on gear is the single most common way to lose half your
      damage without noticing.
  - term: Point Blank
    why: >-
      Named in the guide's common-mistakes list as something people fail to
      take. Projectile hits do more damage at close range, and your totems
      stand where you stand.
  - term: Quill Rain
    why: >-
      The weapon, at every budget. 100% increased attack speed is more fuses
      per second, and the guide wants one with close to 100% projectile speed
      so that the Bow Mastery can convert it into up to 100% increased damage.
  - term: Pursuit of Faith
    why: >-
      First ascendancy notable, "as early as possible" in the guide's words.
      More totems and longer-lasting ones.
  - term: Ritual of Awakening
    why: >-
      Second notable, same reasoning. Totem placement speed and life
      regeneration while you have a totem.
  - term: Artillery Quiver
    level: recommended
    why: >-
      The 3.30 upgrade. Its implicit is now +1 maximum totem for attack
      skills. It must be a quiver that dropped this league — existing items
      keep the old implicit.
  - term: Skirmish
    level: recommended
    why: >-
      The budget quiver, and it also gives +1 totem. Use it until a 3.30
      [[Artillery Quiver]] turns up.
  - term: Viridi's Veil
    level: recommended
    why: >-
      Best-in-slot helmet: critical strike immunity, enemy hits roll unlucky,
      resistances, armour and levels to socketed aura and spectre gems. It
      requires a magic ring in the left ring slot, which is why the guide's
      ring 1 is deliberately magic.
  - term: Daresso's Defiance
    level: recommended
    why: >-
      Permanent Onslaught at +100% effect, so 40% increased attack and
      movement speed, plus armour, evasion and life.
  - term: Replica Dragonfangs' Flight
    level: recommended
    why: >-
      The amulet, and it must be the roll that gives +3 to all Explosive Arrow
      gems specifically. A plain rare with +1 to all fire skill gems is the
      budget stand-in.
  - term: Dawnstrider
    level: recommended
    why: >-
      Grants [[Ancestral Bond]], redirects damage to your totems, and gives
      30% movement speed. It is a damage item, a defence item and a passive
      point refund at once.

labs:
  - lab: Normal
    node: Pursuit of Faith
    why: "The guide says to take it \"as early as possible\". Run the lab at the Act 4 town."
  - lab: Cruel
    node: Ritual of Awakening
    why: "Second, for the same reason. Around the Act 8 town."
  - lab: Merciless
    node: Conviction of Power
    why: "**The guide gives no reason for this pick** — it lists it third and says nothing else. Run it before the Act 10 boss as usual."
  - lab: Eternal
    node: Fertile Will
    why: "The Farrul ascendancy node, reached through the guide's spectre setup, not the ordinary tree. See the chain detail above: we could not confirm this independently and the guide's own mistakes list suggests it needs setup it does not explain."

stages:
  - id: acts-1-3
    image: holy-flame-totem
    title: Acts 1–3
    levels: Level 1–28
    uses: >-
      [[Holy Flame Totem]] with [[Combustion Support]] and
      [[Infused Channelling Support]], plus [[Flame Wall]]. Totems from the
      first act, which is the whole reason this leveling route exists.
    changes: >-
      [[Purifying Flame]] is on the bar until you allocate [[Ancestral Bond]],
      at which point it stops doing anything and comes off. Run the guide's
      Holy Flame Totem tree, not the Explosive Arrow one, until Act 3.
    links:
      - name: Main skill
        gems: [Holy Flame Totem, Combustion Support, Infused Channelling Support]
      - name: Clear
        gems: [Flame Wall, Purifying Flame]
      - name: Utility
        gems: [Frostblink, Clarity]
    moveOn: "you reach Act 3 and [[Explosive Arrow]] is available at character level 28."
    details:
      - title: Two trees, one character
        body: |
          The guide is explicit about this: use the Holy Flame Totem tree for Acts 1 to 3, then switch to the Explosive Arrow Ballista tree from Act 3, and continue the campaign "once Explosive Arrow reaches level 2".

          That is a respec, and it is intended. Both trees are in the planner.
      - title: Why you do not start with Explosive Arrow
        body: |
          [[Explosive Arrow]] requires character level 28. That is most of the way through Act 3. There is no version of this build that starts earlier, which is why the leveling skill is a totem skill rather than a bow skill — it keeps the playstyle and the tree pointed the same direction the whole time.
      - title: What the guide does not tell you here
        body: |
          **There is no level-by-level gem list, no quest reward table, and no vendor list anywhere in this guide.** The campaign gem setup lives inside the Path of Building file, and the gem page says so: it gives "only an endgame setup and says the campaign uses a simpler setup, which is in the PoB".

          The three links above are what its text names, in the order its text names them. We have not invented the gaps.
      - title: Bandits and Pantheon
        body: |
          **Kill all three bandits** for the extra passive point; the guide says so directly.

          Pantheon: **Soul of Lunaris** as major and **Soul of Shakari** as minor. The guide shows "fully unlocked" screenshots for both and does not explain either choice, so we cannot tell you which upgrade matters most. Shakari for a Templar in red maps is the conventional chaos-damage pick.
  - id: acts-3-10
    image: explosive-arrow
    title: Acts 3–10
    levels: Level 28–68
    uses: >-
      [[Explosive Arrow]] with [[Ballista Totem Support]],
      [[Elemental Damage with Attacks Support]] and
      [[Lesser Multiple Projectiles Support]]. A [[Quill Rain]] as soon as you
      can get one.
    changes: >-
      Swap [[Lesser Multiple Projectiles Support]] out for
      [[Combustion Support]] once [[Master Fletcher]] is allocated.
      [[Precision]] is your campaign aura and becomes
      [[Purity of Elements]] after the campaign.
    links:
      - name: Main skill
        gems: [Explosive Arrow, Ballista Totem Support, Elemental Damage with Attacks Support, Lesser Multiple Projectiles Support]
      - name: Guard
        gems: [Steelskin, Automation]
      - name: Curse and charges
        gems: [Flammability, Frenzy, Manaforged Arrows Support]
      - name: Auras and movement
        gems: [Clarity, Precision, Frostblink]
    moveOn: "you have killed the Act 10 boss, resistances are back at 75%, and three ascendancy notables are allocated."
    details:
      - title: The support swap, and why it is not optional
        body: |
          [[Master Fletcher]] on the tree makes your bow attacks fire an additional arrow. Once you have it, [[Lesser Multiple Projectiles Support]]'s damage penalty is paying for projectiles you already get, so it comes out and [[Combustion Support]] goes in.

          The guide lists failing to do this as a common mistake. It is the kind of mistake that costs damage quietly for twenty levels.
      - title: Frenzy as an automatic skill
        body: |
          [[Frenzy]] linked to [[Manaforged Arrows Support]] fires itself after you have spent enough mana on your other bow attacks, generating frenzy charges without a button. Later the guide moves it to [[Mirage Archer Support]] and [[Culling Strike Support]].

          This is also where "no mana management" in the pros list comes from: by the endgame every skill is on [[Lifetap Support]], so almost nothing costs mana at all.
      - title: The resistance cliff
        body: |
          The Act 5 boss and the Act 10 boss each take 30% off every elemental resistance. The crafting bench in every town from Act 2 fixes it.

          This matters more here than for most builds, because the planner we could read is sitting at 49% in three resistances at level 78 — that is a character mid-repair, not a finished one, and it is a reminder that the guide's own file does not show you a capped character.
  - id: early-maps
    image: quill-rain
    title: Early maps
    levels: White and yellow maps
    uses: >-
      The same four-link growing towards six, [[Quill Rain]] with
      [[Skirmish]], and rares with life and resistances in every other slot.
      [[Grace]] and [[Purity of Elements]] replace the campaign auras.
    changes: >-
      [[Lifetap Support]] starts appearing in every link. Hunt a 3.30
      [[Artillery Quiver]] to replace Skirmish, and start the hunt for
      [[Viridi's Veil]] and [[Daresso's Defiance]].
    links:
      - name: Main skill
        gems: [Explosive Arrow, Ballista Totem Support, Elemental Damage with Attacks Support, Lifetap Support, Combustion Support]
      - name: Guard
        gems: [Steelskin, Automation, Lifetap Support]
      - name: Curse and charges
        gems: [Frenzy, Lifetap Support, Flammability, Blood Rage]
      - name: Auras
        gems: [Purity of Elements, Grace]
    moveOn: "the six-link is full, Elemental Equilibrium is not broken by any item, and Tier 10 maps are comfortable."
    details:
      - title: The numbers the planner shows, and what they are worth
        body: |
          The guide's Path of Building file is **titled "Level 78 Explosive Arrow Totem Hierophant [3.29]"**. From it: 20,098 effective hit points, 2,701 life, 205 energy shield, 6,353 armour, 11,918 evasion, 59% evade chance, resistances at 49/49/49/−60.

          **Three caveats, all of which matter.** It is 3.29 data. It is a level 78 snapshot, not a finished character. And the resistances are uncapped, which means the effective hit point figure is not the figure a geared character would show.

          The file reports no damage-per-second number at all. It shows maximum hits taken by type instead. We are therefore not quoting a DPS figure for this build, because none exists in any source we read.
      - title: Flasks
        body: |
          The guide's five: a [[Divine Life Flask]] with corrupted blood immunity, a [[Granite Flask]], a [[Jade Flask]], a [[Quicksilver Flask]], and an [[Amethyst Flask]] which becomes a [[Sulphur Flask]] or [[Progenesis]] once your chaos resistance is above 50%.

          Suffixes it wants: armour, evasion or movement speed during effect, and reduced curse effect. Prefixes: duration, charge recovery or maximum charges. Quality them with a [[Glassblower's Bauble]] and put "Used When Charges Reach Full" on the utility flasks with an [[Instilling Orb]].
      - title: Map modifiers
        body: |
          **The guide names none.** It links regex filters for Tier 16 and Tier 16.5 maps instead of listing modifiers, so we have nothing sourced to give you.

          Our own note, flagged as ours: totems are summoned, so anything that kills your totems quickly costs you the whole fuse stack, and the build's damage is all fire, so monsters with high fire resistance or an immunity to ignite are the obvious bad rolls.
  - id: red-maps
    image: artillery-quiver
    title: Red maps and Tier 16.5
    levels: Tier 11–16 maps and Originator maps
    uses: >-
      The full endgame setup: a six-link body armour, a bow full of automatic
      skills, [[Viridi's Veil]] with a magic ring in the left slot, and a
      crafted [[Artillery Quiver]].
    changes: >-
      [[Cruelty Support]] becomes a level 4 [[Empower Support]].
      [[Minion Life Support]] in the spectre link becomes
      [[Companionship Support]]. Tattoos and a Runegraft of Gemcraft go in.
    moveOn: "the guide's own ceiling: Tier 16.5 maps clear comfortably. It says the build is not designed for Tier 17 and cannot farm pinnacle bosses on Uber mode."
    details:
      - title: The endgame links, as the guide prints them
        body: |
          These are quoted by slot, which is how the guide lays them out.

          - **Body armour:** [[Explosive Arrow]], [[Ballista Totem Support]], [[Elemental Damage with Attacks Support]], [[Lifetap Support]], [[Combustion Support]], [[Cruelty Support]] — the last replaced by a level 4 [[Empower Support]] later.
          - **Bow:** [[Frenzy]], [[Lifetap Support]], [[Cast On Critical Strike Support]], [[Flammability]], [[Blood Rage]], [[Cursed Ground Support]].
          - **Boots:** [[Dash]], [[Second Wind Support]], [[Lifetap Support]], optionally [[Enhance Support]].
          - **Gloves:** [[Steelskin]], [[Automation]], [[Lifetap Support]], [[Convocation]].
          - **Helmet:** [[Purity of Elements]], [[Grace]].
          - **Spectre:** [[Raise Spectre]] at level 20 with 20% quality, plus [[Minion Life Support]], later [[Companionship Support]].

          Note that this is six slots of gems with [[Lifetap Support]] in four of them. That is a build with essentially no mana costs, and it is deliberate.
      - title: Jewels, and the one that is a trap
        body: |
          [[The Light of Meaning]] for 6% increased fire damage, a [[Lethal Pride]] with 10% chance to intimidate on hit, and a [[Watcher's Eye]] with chaos resistance while affected by [[Purity of Elements]].

          The optional abyss jewel is the interesting one: **flat cold or lightning damage to attacks**, specifically to help [[Elemental Equilibrium]] fire correctly. Flat *fire* damage in the same slot would do the opposite. Read the mod before you socket it.
      - title: Where this build stops, in its own words
        body: |
          The guide's cons list is two items, and both are limits rather than annoyances:

          - "Cannot farm pinnacle bosses on Uber Mode."
          - "Not designed for T17 mapping (only possible when fully maxed)."

          Its own suggested answer is to transition to a different build for that content — the same author's Shrapnel Ballista Hierophant, which is the endgame article on this site. That transition reuses your Hierophant and your totem tree, which is a real part of the appeal.

patch:
  - entry: special-base-implicits
    note: >-
      **This is the one real 3.30 change for the build, and it is a buff.**
      [[Artillery Quiver]]'s implicit is now "Attack Skills have +1 to maximum
      number of Summoned Totems", replacing 20–30% increased totem placement
      speed. The guide knows: "Starting with Patch 3.30 ... this quiver will
      grant us +1 additional totem through its implicit instead of Totem
      Placement Speed!"


      **What the guide does not say:** the official notes add that existing
      items are not affected. A quiver that dropped before this patch keeps the
      old implicit. You need a 3.30 drop, and the base now only appears on
      magic and rare items at a high enough Item Tier. [[Skirmish]] also gives
      +1 totem and costs nothing, so this is an upgrade to chase, not a
      blocker.
  - entry: ruthless-changes
    note: >-
      **Ignore any article telling you Hierophant changed in 3.30.** Every
      Hierophant adjustment in the patch — [[Pursuit of Faith]] totem
      duration, [[Arcane Blessing]], Illuminated Devotion — sits inside the
      Ruthless-specific section, which also covers Champion, Guardian,
      Elementalist and six other classes. None of it applies to the normal
      game. This matters here more than usual, because the two ascendancies
      people will tell you to use instead, Elementalist and Champion, are both
      on that Ruthless list too: if someone says 3.30 moved the needle between
      them, check which section they read.
  - note: >-
      **The skill and the support are untouched.** PoEDB's most recent change
      to [[Explosive Arrow]] is from 3.25, and it records none for
      [[Ballista Totem Support]] in 3.29 or 3.30. Nothing in this patch moves
      the fuse mechanic, the 20-arrow cap or the explosion's damage.
  - note: >-
      **The planner is 3.29 even though the guide is 3.30.** Its Path of
      Building file is titled "[3.29]" and shows a level 78 character with
      uncapped resistances. The guide's prose is 3.30-aware; its arithmetic is
      not.
  - entry: item-tiers
    note: >-
      **Helpful, and connected to the quiver.** The build needs little more
      than life and resistances on its rares, which tiered drops make easier
      to find — and the special bases, [[Artillery Quiver]] among them, now
      only drop at a high enough Item Tier, so the tier system is the thing
      standing between you and the new implicit.

strengths:
  - "Totems from level 1, so the playstyle and the tree never change direction."
  - "One button. Place, hold, move on."
  - "Essentially no mana costs once Lifetap is in every link."
  - "Very cheap entry: Quill Rain and Skirmish, both common uniques."
  - "The only Explosive Arrow Ballista guide with an author behind it in 3.30."
  - "3.30 gave it a free extra totem through the Artillery Quiver implicit."
  - "It transitions into an endgame build on the same ascendancy and tree."
weaknesses:
  - "Its own guide rules out Uber pinnacle bosses and Tier 17 maps."
  - "Two silent damage killers: flat added fire damage breaking Elemental Equilibrium, and any pierce."
  - "No currency figures and no damage figure exist in any source."
  - "The planner is a 3.29 level 78 snapshot with uncapped resistances."
  - "Damage is delayed by a fuse, so nothing dies the instant you point at it."
  - "No level-by-level leveling route is published anywhere."
avoidIf: >-
  Pick something else if you want to kill Uber bosses or farm Tier 17 maps on
  your starter — the guide says plainly that this build does neither. Skip it
  if you want to read a budget before you commit, because there is not one.
  And skip it if you specifically wanted the Elementalist or Champion version:
  those guides exist, but they are stamped 3.28 and 3.25 and one of them tells
  you not to play it.

