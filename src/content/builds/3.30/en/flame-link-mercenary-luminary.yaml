name: Flame Link Mercenary Luminary
tagline: >-
  You hire a Mercenary for good, tie yourself to it with a Link, and it does
  the killing while you carry the auras. 3.30 cut it in four places. It is
  still playable, and it is no longer the build its 3.29 videos show.
class: Scion
ascendancy: Luminary
role: endgame
budget: medium
budgetNote: >-
  **Every figure here is from 3.29 and none is a current price.** The way in
  is cheap: Allie's guide says the first support kit costs "the few Chaos
  Orbs required to buy everything", and her levelling notes suggest 30–40
  Chaos from an hour or two of Heist, a plan 3.30 has changed (see What 3.30
  changed). The middle is not cheap: she warns that good Mercenaries "will get
  quite expensive", and the working Tier 16 version needs
  [[Crystallised Omniscience]], which PoEDB lists as a drop from the Uber
  Searing Exarch. The top has no ceiling. Her own words for the finished
  character are "multiple mirrors deep". No source gives a total, so we do
  not give one.
mainSkill: Flame Link
image: flame-link
hero: art-ascendant
tags: [Mercenary, Support, Auras, Link, Life stacking]
ratings: { clear: 4, bossing: 3, survivability: 4, ease: 2 }
verified: "2026-11-14"
confidence: predicted
confidenceNote: >-
  **Verdict: playable but cut, not ended.** What is confirmed: the four
  3.30 nerfs, word for word from the official notes, and the Golden Glory
  line in GGG's own passive tree data, which now reads "at 50% of their
  value". What is not: how it plays. Two known authors republished for 3.30
  on 12–13 November. Allie calls her guide "fully updated", but its Path of
  Building still carries a 3.29 passive tree on every one of its 23 pages,
  her levelling video was recorded before Mercenaries existed, and the
  text still names two items she has removed and one that no longer works
  on a Mercenary. CaptainLance9 heads
  his page "did NOT have time to fully update". Neither had a 3.30 character
  to show when we read them on 14 November. The four ratings are ours, and
  the arithmetic in this article that compares 3.29 with 3.30 is ours too
  and is marked where it appears.
modes:
  ssf: >-
    Poor fit, and no source claims otherwise. The damage comes from one
    specific Mercenary with specific skills and supports, which trade players
    buy as a [[Mercenary Warrant]]; alone you reset zones until one appears.
    The Tier 16 version leans on [[Crystallised Omniscience]], an Uber boss
    drop. The levelling half — [[Righteous Fire]] — is fine solo self-found.
    This is our reading; the guides do not discuss it.
  hardcore: >-
    No source gives a verdict. The character itself is sturdy: a life-stacked
    Scion with five or more auras and capped block later on. The risk sits
    elsewhere. [[Oath of Fealty]] stops you dying when your linked Mercenary
    dies, but your damage dies with it, and since 3.30 a Mercenary has −60%
    to all resistances in maps. Our reading: possible for someone who has
    played it before, a bad first hardcore character.

idea: |
  [[Luminary]] is the third Scion ascendancy. Its first notable, [[Noble Blood]], lets you hire a [[Mercenary]] permanently and dress it like a second character. You then stop being the damage dealer. The Mercenary shoots; you make it stronger.

  The main tool is [[Flame Link]]. It ties you to one ally and gives that ally added fire damage: a fixed amount from the gem, plus 3% of **your** maximum life. So you stack life, not damage, and every point of life is damage for someone else.

  On top of that you run as many auras as you can fit, and a second helper — an [[Animate Guardian]] the guide calls Bob — wears items that buff the Mercenary too.

  [[Golden Glory]] is the notable the build was known for in 3.29: your [[Light Radius]] also raises the effect of your Link on your Mercenary. 3.30 halved it. In the most detailed 3.30 guide it is now a stepping stone for the first maps, and is taken off again at Tier 16.

chain:
  - label: Hire
    text: "[[Noble Blood]] lets you keep one [[Mercenary]] for good. The one you want is a bow user called a Manyshot, with Vaal Ice Shot."
  - label: Link
    text: "[[Flame Link]] gives it added fire damage: 219–329 from a level 20 gem, plus 3% of your maximum life. [[Oath of Fealty]] makes the Link last the whole area."
  - label: Multiply
    text: "Auras, a mark on the boss, [[Smite]]'s buff and Bob's items all land on the Mercenary. Early on, [[Light Radius]] through [[Golden Glory]] raises the Link itself."
  - label: Stay alive
    text: "You are a life-stacked aura carrier with [[Purity of Elements]] and, later, three more Purities and 90% maximum resistances. Your job is to not die."

chainDetails:
  - title: What 3.30 took, in numbers
    body: |
      Four separate changes hit this build. All four are in the normal-game sections of the official notes; none is from the Ruthless section.

      1. **[[Golden Glory]]**: Light Radius applies to Link effect on your Mercenary "at 50% of their value (previously 100%)".
      2. **[[Flame Link]]**: 3% of your maximum life, down from 5%. The gem's own flat damage went up, from 169–254 to 219–329 at level 20.
      3. **Mercenaries**: "up to 20% less Attack Damage at level 83", −60% to all resistances in level 68+ areas, less damage reduction at high level, more life.
      4. **Items**: [[The Untouched Soul]] and Screams of the Desiccated no longer work on a Mercenary, and Mercenaries cannot wear [[Kalandra's Touch]]. A bug fix also ends Eldritch implicits "while a Pinnacle Boss is in your Presence" being always on for a Mercenary.

      One change went the other way. Light Radius on rare weapons, helmets and rings now rolls up to 30%, where it was 15%.
  - title: "Our arithmetic: how much Flame Link is left"
    body: |
      This is our own calculation from the patch-note numbers. Nobody has published a measured figure.

      Take the average of the gem's range and add the life share. At gem level 20 that is 211.5 + 5% of life in 3.29, and 274 + 3% of life in 3.30. The two are equal at about 3,100 life. Below that, the new gem is better.

      | Your life | 3.29 | 3.30 | Change |
      |---|---|---|---|
      | 3,000 | 362 | 364 | level |
      | 6,000 | 512 | 454 | −11% |
      | 9,160 | 670 | 549 | −18% |
      | 13,900 | 907 | 691 | −24% |

      9,160 is the life on CaptainLance9's first-day planner; 13,900 is the life on Path of Evening's finished 3.29 character. The result matches what CaptainLance9 wrote without showing working: Flame Link is "same ish early game", "10–30% lower late game".
  - title: "Our arithmetic: Golden Glory on rare gear is about level, on uniques it is not"
    body: |
      Also ours.

      Four rare slots can carry Light Radius: weapon, helmet and two rings. In 3.29 they rolled 15% each, and Golden Glory counted all of it: 60% more Link effect. In 3.30 they roll 30% each and Golden Glory counts half: 60% again. On rare gear the buff and the nerf cancel.

      The loss is in the uniques. A top-rolled Rotmother's Mutiny was 75% in 3.29. It now rolls 20–40%, counted at half: 10–20%. [[The Hallowed Monarch]] was 50% and is now 25–35% at half: 12.5–17.5%.

      So the people who lost most are the ones who stacked Light Radius hardest. That is also why a 3.29 video is a poor guide to what you will see.
  - title: One number in the 3.30 guide that does not add up
    body: |
      Allie's first support setup reaches 152% Light Radius and says this "will over double the total benefit" of Flame Link.

      At the 3.30 rate, 152% Light Radius is 76% more Link effect, not over 100%. "Over double" is true at the 3.29 rate. Either the sentence was not revised or it counts something the page does not show. Plan on 76%.
  - title: Two authors, two answers on Golden Glory
    body: |
      **Allie** takes Golden Glory last, in the Eternal Labyrinth, wears Light Radius gear through white and yellow maps, and then removes the notable at Tier 16. The two points go to Legendary Helmets and Legendary Amulets so the Mercenary can wear [[Black Sun Crest]] and [[Crystallised Omniscience]]. In her words the player's Light Radius weapon and rings are then "useless".

      **CaptainLance9** takes it third, in the Merciless Labyrinth, and builds his tree around Flame Link's effect and your life. His page says aura effect only matters more "in giga late game setups".

      We could not read Allie's 3.29 text, so we cannot say whether dropping the notable is new this patch. What we can say is that in her 3.30 version, "the Light Radius build" lasts about fifteen levels.
  - title: Which Mercenary, and why not just any
    body: |
      Mercenaries come in types, and each type draws its skills from a fixed pool. Both 3.30 guides and the 3.29 one agree on the best all-rounder: the **Manyshot**, a bow user that always has Ice Shot.

      What to look for, from Allie and CaptainLance9:

      - **Vaal Ice Shot.** This is its boss damage.
      - **No Icicle Rain.** It has no cooldown, so the Mercenary keeps swapping to it and loses both clear and damage.
      - **Returning Projectiles on its skills.** Allie says it doubles the damage of each skill, but only if the projectile can pierce once first: either a Pierce support on the skill, or +1 pierce crafted on the Mercenary's gear.

      The **Kineticist**, a wand user with Kinetic Blast of Clustering, clears best and is rare. 3.30 set its Kinetic Blast to "150% Arcane Might, matching the player version" (it was 200%) and fixed a bug in the clustering radius. CaptainLance9 reads the first as spell damage counting one and a half times where it counted double.

      A Mercenary's level follows you. Its gear does not: it cannot wear anything with an item level above the area you hired it in. A Mercenary from Act 4 can never wear endgame gear.
  - title: The second helper, Bob
    body: |
      Bob is Allie's name for an [[Animate Guardian]]. He is an older kind of companion: you drop items on the ground and he wears them for good. He can use a weapon, shield, helmet, body armour, gloves and boots.

      Early on he carries [[Dying Breath]] and [[Leer Cast]], which raise the damage of allies near him. Later he gets [[Kingmaker]], [[Crown of the Tyrant]] and [[Garb of the Ephemeral]].

      He is the fragile part of the plan. Allie says so herself: he dies as you reach Tier 16 maps, until you wear [[The Hallowed Monarch]], which lets you Link a minion and makes that minion take 65–75% less damage.

      Take [[Animate Guardian]] off your skill bar once he is dressed. Pressing it over another item replaces what he wears, with no warning.

mandatory:
  - term: Flame Link
    why: >-
      The build. Scions get it as the reward for Breaking the Seal in Act 4.
      Keep [[Lifetap Support]] on it so it never switches off for lack of
      mana.
    detail: >-
      PoEDB still shows the 3.29 and 3.30 values side by side on the same
      page. The 3.30 ones are 219–329 at level 20 and 3% of your maximum
      life.
  - term: Noble Blood
    why: >-
      "You can hire a Mercenary permanently." Without it there is no build.
      A permanently hired Mercenary deals less damage than a temporary one.
      PoEDB lists the hidden value as 30% less.
  - term: Oath of Fealty
    why: >-
      Links last the whole area, cost half as much, and you no longer die
      when your linked Mercenary dies. You cast [[Flame Link]] once per map.
  - term: Legendary Arms
    why: >-
      Lets the Mercenary use unique weapons, shields and quivers, and gives
      it 8% more damage for each unique it wears. The small nodes in front
      of it unlock one more unique slot each.
  - term: Mercenary
    why: >-
      A Manyshot with Vaal Ice Shot and no Icicle Rain, or a Kineticist with
      Kinetic Blast of Clustering. Do not start maps as a support without
      one of these; Allie's notes repeat that three times.
  - term: Righteous Fire
    why: >-
      How you level. Both 3.30 guides use it from Act 2 because its
      life-and-regeneration tree overlaps the support tree, so the later
      respec is small.
  - term: Purity of Elements
    why: >-
      Your first aura and, since 3.30, the Mercenary's resistances as well.
      It now has −60% to all resistances in maps.
  - term: The Hand of Phrecia
    level: recommended
    why: >-
      20–40% more aura effect while you have a linked target. With
      [[Oath of Fealty]] that is always.
    detail: >-
      It also makes your auras apply only to you and your linked targets.
      That is why Bob gets nothing from your auras until you can Link him as
      well. Allie also removed Stormblast Mine because it "does not work"
      with these gloves.
  - term: Golden Glory
    level: recommended
    why: >-
      Light Radius adds to Link effect on your Mercenary at half its value.
      Worth it while you wear four rare Light Radius items; Allie drops it at
      Tier 16, CaptainLance9 keeps it.
  - term: Light Radius
    level: recommended
    why: >-
      Up to 30% each on a rare one-handed weapon, a helmet and two rings
      since 3.30. [[Lori's Lantern]] is the fallback ring.
  - term: Soulthirst
    level: recommended
    why: >-
      On the Mercenary. Soul Eater during any flask effect: 5% attack speed
      per soul, up to 45.
    detail: >-
      It needs [[Ceinture of Benevolence]] on you, which makes your utility
      flasks apply to linked targets. Because you drink the flask and the
      Mercenary does not, its souls are not reset.
  - term: Ceinture of Benevolence
    level: recommended
    why: >-
      Your belt until the Mercenary has [[Headhunter]]. It is the other half
      of the [[Soulthirst]] trick and does nothing without it.
  - term: Animate Guardian
    level: recommended
    why: >-
      Bob. A second carrier of buffs for the Mercenary. Use the normal gem,
      not the Smiting one: Allie picks it for the extra life.
  - term: Smite
    level: recommended
    why: >-
      Its buff gives allies added lightning damage. Tap it every few seconds
      in maps; hold it on bosses once [[Pyre Support]] is linked.
  - term: Crystallised Omniscience
    level: recommended
    why: >-
      On the Mercenary from Tier 16. Every attribute becomes Omniscience, and
      each 15 gives it 1% elemental penetration and 1% elemental resistance.
    detail: >-
      This is what replaced Enmity's Embrace in Allie's guide on 11 November.
      She does not say why. Our reading: that ring scaled with the
      Mercenary's fire resistance, which 3.30 hit twice — −60% in maps, and
      [[The Untouched Soul]] no longer working on a Mercenary.
  - term: Alpha's Howl
    level: recommended
    why: >-
      +2 to socketed aura gems and the reservation to fit another aura. Your
      helmet at Tier 16, until [[The Hallowed Monarch]] takes the slot.
  - term: The Hallowed Monarch
    level: recommended
    why: >-
      Lets Links target minions, and your linked minions take 65–75% less
      damage. This is what keeps Bob alive in red maps.
    detail: >-
      Its Light Radius is 25–35% since 3.30, down from 50%. PoEDB still
      shows 50%.

labs:
  - lab: Normal
    node: Noble Blood
    why: "Allie runs it in Act 4 after level 31, then hires in The Grand Arena. CaptainLance9 runs it in Act 3 and hires in The Sceptre of God. Either way, ascend **before** you look for a Mercenary, or you cannot keep it."
  - lab: Cruel
    node: Oath of Fealty
    why: "Act 7 in Allie's notes. From here you cast [[Flame Link]] once per area."
  - lab: Merciless
    node: Legendary Arms
    why: "Allie's order: take it in Act 10 **through the Legendary Belts node**, so the Mercenary can wear [[Soulthirst]]. CaptainLance9 takes [[Golden Glory]] here and Legendary Arms last."
  - lab: Eternal
    node: Golden Glory
    why: "Allie's order, around level 80–85, once you are settled as a support. She removes it again at Tier 16 for Legendary Helmets and Legendary Amulets."

stages:
  - id: acts-1-3
    phase: early
    image: righteous-fire
    title: Acts 1–3
    levels: Level 1–31
    uses: >-
      [[Spectral Throw]] for Act 1, [[Sunder]] from level 12, then
      [[Righteous Fire]] from about level 18 with [[Scorching Ray]] for
      bosses. You are an ordinary Righteous Fire Scion; nothing about this
      half is a Mercenary build.
    changes: >-
      The swap to Righteous Fire needs 75% fire resistance first: two Ruby
      Rings, the Arsonist notable and the [[Fire Mastery]] that gives life
      regeneration per 1% fire resistance. At level 24 [[Fire Trap]]
      replaces Scorching Ray and [[Shield Charge]] replaces [[Leap Slam]].
    links:
      - name: Level 1–11
        gems: [Spectral Throw, Volley Support]
      - name: Level 12–17
        gems: [Sunder, Chance to Bleed Support, Ruthless Support]
      - name: From level 18
        gems: [Righteous Fire, Efficacy Support, Elemental Focus Support]
      - name: Bosses, level 18–23
        gems: [Scorching Ray, Efficacy Support]
      - name: Movement and aura
        gems: [Leap Slam, Faster Attacks Support, Frostblink, Vitality]
    moveOn: "Righteous Fire is on, your fire resistance is above 75%, and you are in Act 4 ready for the first Labyrinth."
    details:
      - title: The guides disagree on when Righteous Fire starts
        body: |
          Allie's overview page says Sunder "until Level 24". Her own levelling notes, inside the Path of Building, say level 18, after the Chambers of Sin, with [[Fire Trap]] arriving at 24. CaptainLance9 says "~Lvl 18ish".

          Two against one, and the one is a summary. Use 18.
      - title: What you must have before you turn it on
        body: |
          From Allie's notes:

          - The Arsonist notable and the Fire Mastery "Regenerate 1 Life per second for each 1% Uncapped Fire Resistance".
          - Two Ruby Rings. If the vendors have none, sell an Iron Ring with a red skill gem to get one.
          - 75% fire resistance. Every point above the cap still adds regeneration.
          - One [[Orb of Alteration]] to buy the gem from Yenna, and two [[Orb of Transmutation]] for the supports. Sell unidentified magic items for Transmutation shards.

          She also wants two mana flasks before Brutus and Merveil.
      - title: The levelling video is not this build
        body: |
          Allie links a full levelling run. Her notes say plainly that it was recorded "before Mercs were added into the game as a Reliquarian" and is "not 100% accurate to this exact guide".

          It shows the Righteous Fire route. It does not show hiring or linking.
      - title: Bandits
        body: |
          Allie helps **Alira** for the resistances and switches to killing all three at Tier 16, when the Purities cover resistances. CaptainLance9 lists Kraityn or kill all. No source argues the difference.
  - id: acts-4-10
    phase: early
    image: flame-link
    title: Acts 4–10
    levels: Level 31–70
    uses: >-
      [[Righteous Fire]] is still your damage. From Act 4 you also have a
      hired [[Mercenary]] with [[Flame Link]] on it, and it does a growing
      share of the work.
    changes: >-
      Three Labyrinths give you [[Noble Blood]], [[Oath of Fealty]] and
      [[Legendary Arms]]. You swap Mercenaries whenever a better one turns
      up, moving its gear across each time.
    links:
      - name: Main skill
        gems: [Righteous Fire, Efficacy Support, Elemental Focus Support, Burning Damage Support]
      - name: Bosses
        gems: [Fire Trap, Lifetap Support, Trap and Mine Damage Support, Concentrated Effect Support]
      - name: On the Mercenary
        gems: [Flame Link, Lifetap Support]
      - name: Aura and guard
        gems: [Purity of Elements, Steelskin, Automation, Flammability]
      - name: Movement
        gems: [Shield Charge, Faster Attacks Support, Frostblink]
    moveOn: "you have finished Act 10 with three ascendancy notables and a Manyshot or Kineticist hired from The Control Blocks."
    details:
      - title: Where a Mercenary is guaranteed
        body: |
          Five campaign areas always have one. The first four come from two sources that agree; the last from Allie and CaptainLance9.

          - Act 3: The Sceptre of God
          - Act 4: The Grand Arena
          - Act 6: The Ridge
          - Act 8: The Hidden Underbelly, reached from The Grain Gate
          - Act 10: The Control Blocks

          Allie's notes add that the Underbelly stops guaranteeing one once you are level 68 or higher, while The Control Blocks keeps its guarantee at any level.

          In the campaign nearly any Mercenary is strong. Her list of good early ones: Cruel Mistress with Soulrend of Reaping, Flamehand, Frosthand, Bladecaster, Bladebiter, any Fallen Reverend.
      - title: Hire the map Mercenary before you kill Kitava
        body: |
          The Mercenary you take into maps should come from The Control Blocks in Act 10, because its gear is capped at the level of the area you found it in.

          Look for a Manyshot with Vaal Ice Shot and a projectile support on Ice Shot, or a Kineticist with Kinetic Blast of Clustering. Avoid a Kineticist whose only Kinetic Blast is the "Greater" one: it has a cooldown.

          Allie's notes describe getting a new one by leaving the area and opening a fresh copy from the waypoint.
      - title: Her Heist plan is a 3.29 plan
        body: |
          Allie's notes tell you to collect Heist Contracts from Act 6 and run them before Kitava for 50–100 Chaos.

          3.30 changed how Heist is reached. Rogue's Markers and Contracts no longer drop from ordinary monsters, and Whakano sells Contracts for Gold once you are level 68. Her notes do not account for that. Treat the 50–100 Chaos as a 3.29 figure and the route as unconfirmed.
      - title: Mercenary basics that surprise people
        body: |
          - It is not a minion. Minion modifiers on your gear and tree do nothing for it.
          - It does not raise monster life the way a second player would.
          - You can keep three, and swap between them in town.
          - A Mercenary that arrives holding a unique weapon cannot use it until you have [[Legendary Arms]]. Give it a rare one.
  - id: early-maps
    phase: early
    image: golden-glory
    title: The swap to support, and the first maps
    levels: Level 70–90, white and yellow maps
    uses: >-
      You respec out of [[Righteous Fire]] and become the support. Four rare
      [[Light Radius]] items with [[Golden Glory]], [[The Hand of Phrecia]],
      [[The Jinxed Juju]], and rare armour with life everywhere else. The
      Mercenary gets [[Quill Rain]] and [[Drillneck]], or the Kineticist's
      wand and shield.
    changes: >-
      Your own damage goes to zero on purpose. Bob joins. The Eternal
      Labyrinth, at level 80–85, gives you [[Golden Glory]].
    links:
      - name: Link
        gems: [Flame Link, Frostblink, Lifetap Support]
      - name: Auras
        gems: [Purity of Elements, Vitality, Precision, Summon Skitterbots]
      - name: Mana and mark
        gems: [Clarity, Arrogance Support, Sniper's Mark]
      - name: Guard and buff
        gems: [Steelskin, Convocation, Automation, Smite]
      - name: Movement
        gems: [Shield Charge, Faster Attacks Support, Momentum Support]
      - name: Bob
        gems: [Animate Guardian, Minion Life Support, Meat Shield Support, Elemental Army Support]
    moveOn: "you clear yellow maps with the Mercenary doing all the damage, and you are close to Tier 16."
    details:
      - title: Do not swap without the right Mercenary
        body: |
          Allie's strongest advice in the whole guide: stay on [[Righteous Fire]] until you have a Kineticist or Manyshot. Without one "you can potentially be forced to Map with an awful feeling Mercenary that is worse than just playing Righteous Fire".

          The Control Blocks is always there to go back to.
      - title: What to buy for yourself
        body: |
          - A one-handed weapon, a helmet and two rings, each with a 30% [[Light Radius]] roll. On the weapon nothing else matters, so look for Strength. On the helmet and rings, life and chaos resistance.
          - [[The Hand of Phrecia]] and, if the price allows, [[The Jinxed Juju]]. Both add aura effect. Allie says the amulet "tends to be quite expensive early into a season": skip it and wear a life amulet.
          - Rare body armour, shield and boots on armour bases with life and resistances. No six-link is needed yet.

          Allie's total is 137% Light Radius, 152% with the Link nodes on the tree. Under 3.30 that is 76% more Link effect.

          Every trade search in the guide still points at the 3.29 league, and the page says so: "GGG Broke all trade links. I will have to fix them after launch."
      - title: Running the auras
        body: |
          Take the Sovereignty and Champion of the Cause notables or the auras will not fit.

          [[Vitality]] may have to stop at level 17–18 so that 30–40 mana stays free. [[Precision]] stays at level 1. [[Clarity]] sits on [[Arrogance Support]] at level 3–4. Everything else goes to level 20.
      - title: What the Mercenary wears
        body: |
          Unique weapon and off-hand, then rare gear everywhere else:

          - Capped resistances first. Check its Defensive tab.
          - One attack leech roll on its amulet or rings, "to make sure they do not die".
          - Accuracy on helmet and amulet, attack speed on gloves and rings.
          - [[Soulthirst]] as its belt as soon as you can afford it, with [[Ceinture of Benevolence]] on you.

          The resistance step matters more than the guide's wording suggests. That sentence was written when Mercenaries had no resistance penalty.
      - title: Atlas advice we are not repeating
        body: |
          Allie names Atlas passives to raise your chance of meeting the right Mercenary type. 3.30 rebuilt the Atlas tree and reworked the Mercenary cluster, and the guide's text predates that. We could not check a single one of those node names against the new tree, so they are not listed here.
  - id: red-maps
    phase: endgame
    image: purity-of-elements
    title: "Red maps: the first working version"
    levels: Level 90, Tier 14–16 maps
    uses: >-
      [[Alpha's Howl]] on you for another aura. On the Mercenary:
      [[Crystallised Omniscience]], [[Black Sun Crest]] and rare gear with
      two attribute rolls on each piece.
    changes: >-
      The build stops being a Light Radius build. [[Golden Glory]] comes off;
      its two points go to Legendary Helmets and Legendary Amulets.
      [[Purity of Fire]] replaces [[Summon Skitterbots]], and [[Haste]] or
      [[Anger]] joins once you have the Leadership and Charisma notables.
    links:
      - name: Link
        gems: [Flame Link, Frostblink, Lifetap Support]
      - name: Auras
        gems: [Purity of Elements, Haste, Purity of Fire, Vitality]
      - name: Buff
        gems: [Smite, Pyre Support, Precision, Generosity Support]
      - name: Mana
        gems: [Clarity, Arrogance Support]
      - name: Guard and mark
        gems: [Steelskin, Convocation, Automation, Sniper's Mark]
      - name: Bob
        gems: [Animate Guardian, Minion Life Support, Meat Shield Support, Elemental Army Support]
    moveOn: "the Mercenary wears Omniscience and Black Sun Crest, and you run Purity of Elements, Purity of Fire and a damage aura."
    details:
      - title: Why Omniscience replaces Light Radius
        body: |
          With [[Crystallised Omniscience]], the Mercenary's Strength, Dexterity and Intelligence all become one attribute. Every 15 of it is 1% elemental penetration and 1% elemental resistance.

          Allie calls the penetration "the cornerstone of their scaling for the rest of the build". It also frees you from stacking fire damage only: any added element now works. And between it and [[Purity of Elements]], the Mercenary's resistances stop being a worry — the one part of this step 3.30 made more valuable.

          [[Black Sun Crest]] follows because its three percentage-attribute rolls all become percentage Omniscience.
      - title: The pierce trap
        body: |
          [[Black Sun Crest]] replaces the Mercenary's rare helmet, and with it the crafted +1 pierce that made Returning Projectiles work.

          If its Ice Shot and Vaal Ice Shot do not both have a Pierce support, anoint the Piercing Shots notable on its amulet. Miss this and, by the guide's own figure for Returning Projectiles, you lose about half its damage with no warning on screen.
      - title: Rage gloves, and a 3.30 caveat
        body: |
          Allie's next Mercenary upgrade is gloves with the Eldritch implicit that grants Rage on hit: 1% more damage per Rage, up to 20%. She recommends buying a pair that dropped with it and crafting attack speed on with Essences.

          Later, in the endgame crafts, she upgrades to the version that only works "while a Pinnacle Atlas Boss is in your Presence", which used to be always on for a Mercenary. 3.30 fixed that as a bug. Her changelog admits the endgame crafts "are now slightly wrong". Buy the plain version.
      - title: Rings and weapon after the swap
        body: |
          Your Light Radius weapon and rings have no further use. Allie replaces them with a one-handed weapon that has +1 to fire skill gems and Strength, and Vermillion Rings with life.

          The +1 takes [[Purity of Fire]] to level 23 in [[Alpha's Howl]], which is one more point of maximum fire resistance.
  - id: midgame
    phase: endgame
    image: animate-guardian
    title: "Tier 16 and up: the finished support"
    levels: Tier 16 maps and beyond
    uses: >-
      [[The Hallowed Monarch]], [[The Dark Seer]], [[Dawnbreaker]] and
      [[Ralakesh's Impatience]] on you. All three single-element Purities in
      a six-link with [[Enlighten Support]]. Two spectres. Bob in
      [[Garb of the Ephemeral]], [[Kingmaker]] and [[Crown of the Tyrant]].
    changes: >-
      90% maximum elemental resistances for you. Bob becomes close to
      unkillable. The Mercenary gets a crafted bow in place of
      [[Quill Rain]], a crafted quiver, and boots with Tailwind.
    links:
      - name: Auras (six-link)
        gems: [Purity of Elements, Purity of Fire, Purity of Lightning, Purity of Ice, Arctic Armour, Enlighten Support]
      - name: Link
        gems: [Flame Link, Lifetap Support, Empower Support]
      - name: Buff
        gems: [Smite, Pyre Support, Precision, Generosity Support]
      - name: Helpers
        gems: [Animate Guardian, Raise Spectre, Meat Shield Support, Minion Life Support]
      - name: Guard and mark
        gems: [Vaal Molten Shell, Automation, Convocation, Assassin's Mark]
      - name: Movement
        gems: [Vitality, Frostblink, Shield Charge]
    moveOn: "you sit at 90% maximum resistances and Bob no longer dies. What is left is money spent on the Mercenary."
    details:
      - title: The road to 90% maximum resistances
        body: |
          In Allie's order:

          1. [[The Hallowed Monarch]] replaces [[Alpha's Howl]]. To pay for the lost reservation she uses Bubonic Trail with a unique Abyss jewel.
          2. Three jewels with +2% maximum cold or lightning resistance.
          3. [[Purity of Ice]], paid for with three small reservation cluster jewels.
          4. [[Purity of Lightning]], which needs a level 3 [[Enlighten Support]] and a six-linked body armour.
          5. Level 21 Purities, which with the +2 levels from [[The Dark Seer]] reach gem level 23 and one more point of maximum resistance each.

          Each step moves gems between items. She asks readers not to change anything until the text says to.
      - title: Ralakesh's Impatience changed in 3.30
        body: |
          The guide swaps to [[Ralakesh's Impatience]] for permanent Endurance Charges, then respecs for +2 maximum Endurance Charges.

          Boots that drop in 3.30 carry −1 to maximum Power, Endurance or Frenzy Charges. Older boots do not. The guide's text does not mention it. If your pair says −1 maximum Endurance Charges, that step is worth one charge less than she describes.
      - title: Spectres, and the way to lose them
        body: |
          Two spectres join once Bubonic Trail is gone: a Perfect Guardian Turtle for a [[Determination]] aura, and a Host Chieftain from The Ashen Fields in Act 7 for Power Charges. A Perfect Forest Tiger replaces the Chieftain later.

          The Turtle is a bought corpse that works once. And any time you remove the [[Raise Spectre]] gem, the item holding it, or the attributes needed to use that item, your spectres fall to the ground as corpses. Raise them again before you leave.
      - title: What Bob's new items do
        body: |
          - [[Garb of the Ephemeral]]: nearby allies cannot be critically hit and cannot be slowed below base action speed. Allie names critical strikes as the likely cause of most deaths at this stage.
          - [[Gravebind]]: Bob gets credit for the Mercenary's kills, so [[The Hallowed Monarch]] hands him the modifiers of slain rare monsters. The aura ones reach you and the Mercenary.
          - [[Kingmaker]] and [[Crown of the Tyrant]]: culling strike and more damage for the Mercenary.
  - id: endgame
    phase: endgame
    image: headhunter
    title: "Endgame: money into the Mercenary, then energy shield"
    levels: Pinnacle and Uber bosses; level 100 for the last step
    uses: >-
      [[Headhunter]] on the Mercenary and near-perfect crafted rares in its
      other slots. Then, for you, [[Chaos Inoculation]] with
      [[Aegis Aurora]], a Twilight Regalia and [[Discipline]].
    changes: >-
      Once the Mercenary's bow carries enough added fire damage, your life
      matters less to [[Flame Link]], and you can leave life for energy
      shield. The guide's last two parts are unwritten.
    links:
      - name: Link (no Lifetap)
        gems: [Flame Link, Empower Support]
      - name: Auras (six-link)
        gems: [Purity of Elements, Purity of Fire, Purity of Lightning, Purity of Ice, Arctic Armour, Enlighten Support]
      - name: More auras (in separate items)
        gems: [Precision, Tempest Shield, Vitality, Discipline, Clarity]
      - name: Buff and movement
        gems: [Smite, Pyre Support, Shield Charge, Frostblink]
      - name: Helpers
        gems: [Animate Guardian, Raise Spectre, Meat Shield Support, Minion Life Support]
      - name: Guard and mark
        gems: [Vaal Molten Shell, Automation, Convocation, Assassin's Mark]
    moveOn: "there is no next stage that anyone has written down."
    details:
      - title: Where the guide stops
        body: |
          Endgame Parts 3 and 4 carry this note from the author: "Due to my waning interest in 3.29 I will not be finishing this section for now. I plan to play Luminary again in 3.30 and we will continue where we left off."

          Part 3 lists a Watcher's Eye, The Eternal Struggle and [[Mageblood]], and then becomes unfinished notes in capitals. We stop where the finished writing stops.
      - title: The endgame crafts are the stalest part
        body: |
          Allie says it herself: "fully updated to 3.30 outside of the crafts in Endgame Part 1". Three things in those crafts no longer hold:

          - They aim for Eldritch implicits "while a Pinnacle Atlas Boss is in your Presence". 3.30 stopped those being always on for a Mercenary.
          - One glove craft is justified by a socket for [[The Untouched Soul]], which no longer works on a Mercenary.
          - A gem note still credits fire resistance to Enmity's Embrace, the ring she removed.

          The craft costs and odds are 3.29 as well. 3.30 changed the price of protecting modifiers at the bench.
      - title: The energy shield swap is all or nothing
        body: |
          The guide lists what you must own before you switch: [[The Dark Seer]] with energy shield and mana, [[Aegis Aurora]] corrupted with [[Glancing Blows]], a crafted Twilight Regalia, new boots, ring, jewels and clusters, and a [[Militant Faith]] in place of [[Elegant Hubris]].

          It also asks for level 100 first.

          One consequence is easy to miss. In this version [[Lifetap Support]] comes off [[Flame Link]], so the Link costs mana again.
      - title: What numbers to expect
        body: |
          **Nobody publishes a damage figure for the Mercenary.** Each planner shows "Flame Link: 0" as the skill's damage, because the damage is not yours.

          The numbers that do exist are your defences, and they are 3.29: CaptainLance9's first-day character has 9,160 life and about 31,000 effective hit points; Path of Evening's finished one has 13,901 life, 91% block and 90% maximum resistances.

powerCurve: |
  This is our reading of the mechanics, checked against the patch notes; the guides do not lay it out this way.

  The damage has three multipliers and none of them is on you. The **Mercenary's own kit** — its skill, its supports, its weapon — is the base. **[[Flame Link]]** adds flat fire damage that grows with your life. **Everything else** — auras, a mark, [[Smite]], Bob, penetration from [[Crystallised Omniscience]] — multiplies what the first two produce.

  At level 30 you have none of this. You are a [[Righteous Fire]] character with a helper. At level 70 you have the helper and the Link but not the tree, the auras or the gear, which is why both guides keep Righteous Fire until the right Mercenary is hired. The jump comes at the respec, around level 75: your own damage disappears and the Mercenary takes over in one sitting.

  From there it is flat steps bought with currency, and the step that mattered most in 3.29 — more [[Light Radius]] — is now the weakest. The flat fire from Flame Link is also worth less the better the Mercenary's own weapon gets, because flat damage adds to flat damage. Allie's guide follows that through: at the top, the bow's added fire replaces what your life gave, and you drop life altogether. So the build starts as "stack life and light" and ends as "an aura carrier standing behind a very expensive archer".

  What 3.30 changed in that curve: the early part is close to level, by our arithmetic and by CaptainLance9's account. The middle lost the most, because the cheap ways to scale a Mercenary — fire resistance through [[The Untouched Soul]], the always-on pinnacle implicits — are gone, and it deals up to 20% less attack damage at level 83. The top end, he says, "is still OP". We have no way to check that.

upgrades:
  - step: "A Manyshot with Vaal Ice Shot and no Icicle Rain"
    why: >-
      First because everything else multiplies it. A support in perfect gear
      behind the wrong Mercenary is, in Allie's words, worse than staying on
      [[Righteous Fire]]. Free if you find it in The Control Blocks.
  - step: "Four rare [[Light Radius]] items and [[Golden Glory]]"
    cost: "3.29: Allie says a few Chaos covers the whole first kit — written when these rolls were 15%, not 30%"
    why: >-
      The cheapest multiplier on [[Flame Link]] while your life is still
      low: 120% on gear is 60% more Link effect. It sits above the uniques
      because rare rolls were doubled in 3.30 and unique ones were cut.
  - step: "[[The Hand of Phrecia]], then [[Soulthirst]] with [[Ceinture of Benevolence]]"
    why: >-
      Aura effect for every aura you run, then attack speed for the
      Mercenary that never resets. Below the Light Radius set only because
      they cost more; Allie tells you to buy the belts in Act 10 if you can.
  - step: "[[Alpha's Howl]] and a damage aura"
    why: >-
      One more aura is a multiplier on the Mercenary's whole damage, where
      the next step only improves one part of it. Needs the Leadership and
      Charisma notables.
  - step: "[[Crystallised Omniscience]], attribute rares and [[Black Sun Crest]] for the Mercenary"
    why: >-
      Penetration multiplies all its elemental damage and the same item
      repairs its resistances, which 3.30 made a real problem. It comes
      after the aura because it costs a respec of two ascendancy points and
      a full set of new rares. No price in any source.
  - step: "[[The Hallowed Monarch]] and the three Purities"
    why: >-
      Defence, not damage: 90% maximum resistances for you and a Bob who
      survives. It waits until here because white and yellow maps do not
      need it, and Bob's buffs are worth little while he is dead.
  - step: "A crafted bow and quiver, then [[Headhunter]], for the Mercenary"
    why: >-
      The Mercenary's weapon is the base of everything, but a good one is a
      craft with long odds; the guide's own bow section is marked "will
      likely be changed post 3.30 based on prices". Buy the cheap multipliers
      first.
  - step: "[[Chaos Inoculation]] with [[Aegis Aurora]]"
    why: >-
      Last because it adds no damage and needs a dozen items bought
      together, plus level 100. It is for content that kills a 90%-resistance
      life character, which is a short list.

play:
  mapping: |
    1. At the start of the area, cast [[Flame Link]] on the Mercenary. With [[Oath of Fealty]] that is the only time. Once you wear [[The Hallowed Monarch]], Bob is linked too — but he has a spawn animation, and the Link will not take until he is up.
    2. Move with [[Shield Charge]] and [[Frostblink]]. The Mercenary teleports to keep up and kills what you pass.
    3. Tap [[Smite]] on anything every few seconds to keep its added lightning buff on your allies.
    4. Your utility flasks are set to use themselves when full. With [[Ceinture of Benevolence]] they reach the Mercenary too, which is what keeps [[Soulthirst]] running.

    The tension is that you are fast and the damage is not attached to you. Run too far ahead and you arrive at a pack alone, doing nothing.

    Map modifiers to avoid, from Path of Evening's 3.29 guide: monsters block attack damage, less effect of flasks, reduced effect of non-curse auras, no regeneration, less recovery of life and energy shield.
  bossing: |
    1. Put your mark on the boss: [[Sniper's Mark]] early, [[Assassin's Mark]] from the midgame. Skip it if your Mercenary already curses with [[Elemental Weakness]].
    2. Hold [[Smite]] on the boss. With [[Pyre Support]], enemies the Mercenary ignites take 20% more fire damage for four seconds.
    3. Then, in Allie's words, "just run in a circle while your Mercenary takes care of them". [[Vaal Molten Shell]] is your panic button.

    What changes from a map is that there is nothing to feed [[Soulthirst]], and no rare monsters for Bob to borrow auras from. The Mercenary's boss damage is mostly its Vaal Ice Shot — which is why a Manyshot without it is not worth hiring.

    CaptainLance9 plays the boss differently: Stormblast Mine, [[Assassin's Mark]], and [[Battlemage's Cry]]. Allie removed Stormblast Mine because it does not work with [[The Hand of Phrecia]]. If you wear those gloves, follow her.

deaths:
  - situation: "The Mercenary dies in a map it used to clear"
    cause: >-
      Since 3.30 it has −60% to all resistances in level 68+ areas, and less
      damage reduction at high level. A Mercenary dressed for damage alone
      is now uncapped.
    fix: >-
      Open its Defensive tab. Cap elemental resistances with
      [[Purity of Elements]] and its gear, then
      [[Crystallised Omniscience]]. Give it one attack leech roll and some
      chaos resistance.
  - situation: "Bob dies in the first red maps"
    cause: >-
      An [[Animate Guardian]] has a lot of life and nothing else. Because of
      [[The Hand of Phrecia]], he does not even receive your auras until you
      can Link him.
    fix: >-
      Chaos resistance and armour on his body armour and boots, then
      [[The Hallowed Monarch]] as soon as you can. If he dies you can raise
      him once more in that map, and again for free in your hideout.
  - situation: "You die to one large hit while standing behind the Mercenary"
    cause: >-
      Allie names two things: physical damage, "the scariest damage type to
      us by quite a bit", and critical strikes. Purities do nothing for
      either.
    fix: >-
      [[Dawnbreaker]] to take part of physical damage as fire,
      [[Garb of the Ephemeral]] on Bob so nearby allies cannot be critically
      hit, and Endurance Charges from [[Ralakesh's Impatience]].
  - situation: "You lose the fight against a Mercenary you paid for"
    cause: >-
      To hire from a [[Mercenary Warrant]] you must beat it. Allie warns
      they "have extreme Level scaling and will be very dangerous at near
      Level 83", and that you get one attempt.
    fix: >-
      Check the monster level on the Warrant before you buy. 3.30 moved
      these rematches to an area called the Proving Grounds; her warning was
      written for the old system, and whether it is still one attempt is not
      something we could confirm.
  - situation: "In the energy shield version, the damage stops in the middle of a fight"
    cause: >-
      [[Lifetap Support]] is gone, so [[Flame Link]] costs mana. Run out —
      to a monster that drains mana, say — and every Link switches off.
    fix: >-
      Level [[Clarity]] until regeneration covers the Link, lowering
      [[Vitality]] if you need the reservation. Keep enough spare for your
      mark and [[Vaal Molten Shell]].

troubleshooting:
  - symptom: "Bosses take far longer than packs"
    cause: >-
      The Mercenary is not using Vaal Ice Shot, or does not have it. Icicle
      Rain in its skill list is the usual reason: it has no cooldown, so the
      Mercenary alternates and rarely fires the Vaal skill.
    fix: >-
      Hire a different Manyshot. Skills cannot be changed on a Mercenary you
      already have.
  - symptom: "Damage roughly halved after I changed the Mercenary's helmet or amulet"
    cause: >-
      Returning Projectiles only hits a second time if the projectile
      pierced first. The pierce came from the item you replaced.
    fix: >-
      Pierce support on both skills, +1 pierce on a rare helmet, the Piercing
      Shots anoint, or +1 pierce as an Eldritch implicit on its gloves.
  - symptom: "It felt strong in white maps and weak by Tier 16"
    cause: >-
      A Mercenary cannot wear gear above the level of the area you hired it
      in. One from the campaign is locked out of endgame items for good.
    fix: >-
      Hire again from a high-tier map, or buy a Warrant with a higher
      monster level, and move the gear across.
  - symptom: "I cannot turn all the auras on"
    cause: >-
      Reservation. The setup assumes specific notables at each stage, and
      gem levels held down on purpose.
    fix: >-
      Sovereignty and Champion of the Cause first; [[Vitality]] at 17–18,
      [[Precision]] at 1. Later stages add Leadership, Charisma, small
      reservation clusters and [[Enlighten Support]].
  - symptom: "My numbers are far below a 3.29 video of the same build"
    cause: >-
      They should be. [[Golden Glory]] counts Light Radius at half, the two
      Light Radius uniques were cut, [[Flame Link]] takes 3% of life and not
      5%, and the Mercenary lost up to 20% attack damage.
    fix: >-
      Nothing to fix. Compare against the 3.30 pages, and expect the middle
      of the build to be where it hurts.
  - symptom: "My spectres vanished"
    cause: >-
      You unsocketed [[Raise Spectre]], took off the item holding it, or
      dropped below its attribute requirements. The spectres fall as corpses
      where you stand.
    fix: >-
      Raise them again before leaving. The energy shield swap is the classic
      place to lose a bought corpse this way.

patch:
  - entry: reliquarian-luminary
    note: >-
      **The headline nerf, and it is real.** [[Golden Glory]] now applies
      Light Radius to Link effect on your Mercenary "at 50% of their value
      (previously 100%)". We checked it twice: the line sits under Ascendancy
      Changes, not in the Ruthless section, and GGG's own passive tree export
      already carries the new wording.
  - entry: link-and-pact-changes
    note: >-
      **A second nerf to the same number.** [[Flame Link]] gives 3% of your
      maximum life as added fire, down from 5%, and more from the gem itself
      (219–329 at level 20, was 169–254). By our arithmetic that is level at
      3,000 life, −11% at 6,000 and −24% at 13,900.
  - entry: mercenary-nerfs
    note: >-
      **The Mercenary itself is weaker and now has to be geared
      defensively.** Up to 20% less attack damage at level 83; −30% to all
      resistances in level 46–67 areas and −60% from level 68; less damage
      reduction, more life. It cannot wear [[Kalandra's Touch]], and
      [[The Untouched Soul]] and Screams of the Desiccated do nothing on it.
  - note: >-
      **A bug fix that reads like a nerf.** "Eldritch modifiers that only
      applied while a Unique Monster or Pinnacle Boss was in your Presence
      were always applying when on a Minion or a Mercenary." Fixed. The
      endgame Mercenary crafts in Allie's guide were built on that.
  - entry: other-unique-changes
    note: >-
      **Both Light Radius uniques cut.** [[The Hallowed Monarch]] 25–35%
      (was 50%); Rotmother's Mutiny 20–40% (was 25–75%). The helmet is still
      worn, for what it does for Bob.
  - entry: special-base-implicits
    note: >-
      **The one buff.** Light Radius on rare weapons, helmets and rings now
      reaches 30%, where it stopped at 15%. On rare gear alone this cancels
      the Golden Glory change exactly: 120% at half value is what 60% at
      full value was.
  - entry: ralakeshs-impatience
    note: >-
      **Small.** New [[Ralakesh's Impatience]] boots carry −1 to one kind of
      maximum charge. The guide's midgame uses them for Endurance Charges
      and does not mention it.
  - entry: heist-delve-access
    note: >-
      **The guide's starting-currency plan is out of date.** It collects
      Heist Contracts from Act 6. Contracts no longer drop from ordinary
      monsters, and Whakano sells them for Gold from level 68.
  - entry: atlas-tree-rework
    note: >-
      **Atlas advice in both guides predates the new tree.** The official
      notes list Mercenaries among the Atlas clusters that were reworked, so
      the passives Allie names for finding the right Mercenary type may not
      exist as written.
  - entry: map-device-items
    note: >-
      **Buying a Mercenary works differently.** A [[Mercenary Warrant]] now
      opens a rematch in an area called the Proving Grounds and is no longer
      used with a map. Both guides describe the old way.
  - note: >-
      **Not confirmed either way:** the Kineticist. Its Kinetic Blast went
      from 200% to 150% Arcane Might and a clustering bug was fixed.
      CaptainLance9 calls these "targeted nerfs"; nobody has measured them.

strengths:
  - "A relaxed way to play: one cast per map, then you move and the Mercenary shoots."
  - "The character you actually control is very hard to kill once the Purities are in."
  - "Life is both your defence and, through Flame Link, someone else's damage."
  - "No six-link needed to start, and the first support kit is rare gear."
  - "The Mercenary can be re-dressed for different content without rebuilding your character."
  - "It doubles as a real support for group play from the midgame, according to its author."
weaknesses:
  - "Cut four ways in 3.30: Golden Glory, Flame Link, Mercenary damage and resistances, and three item interactions."
  - "Everything depends on finding or buying one specific Mercenary."
  - "You level as a different build and respec at level 75."
  - "Three things to keep alive and geared: you, the Mercenary and the Animate Guardian."
  - "No tool can show you the Mercenary's damage. Every planner reads zero."
  - "The top end is extremely expensive, and the guide's last two parts were never written."
  - "Both 3.30 guides were updated in a hurry: one ships a 3.29 tree, the other says it is not fully updated."
avoidIf: >-
  Do not start this if you want the build from the 3.29 videos; that one no
  longer exists. Skip it if this is your first character of the league and
  you have not played a Mercenary before, if you want to press a button and
  see your own damage, or if you play solo self-found. If what you want is a
  Luminary and you do not mind doing the killing yourself, the Earthshatter
  Facebreaker Luminary on this site is the one a dated 3.30 tier list ranks
  at the top, and 3.30 barely touched it.

