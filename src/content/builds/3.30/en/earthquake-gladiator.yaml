name: Earthquake Gladiator
tagline: >-
  Slam the ground, let the aftershock apply one enormous bleed, then dodge
  freely while it ticks. Bleeding monsters you kill explode and chain.
class: Duelist
ascendancy: Gladiator
role: starter
budget: starter
budgetNote: >-
  **No price figures exist for this build in any source, in any patch.** The
  guide quotes no chaos and no Divine amounts anywhere — the only monetary
  language is "a couple of Chaos Orbs" for some early uniques and "at least a
  [[Mirror of Kalandra]]" for the far-endgame axe. So there is not even a stale
  3.29 number to warn you about. What is published is the author's own budget
  rating of Moderate, 3 out of 5, and one named cost risk:
  [[Ryslatha's Coil]]. Two popular Gladiator guides require that belt, so
  expect launch-week demand for it.
mainSkill: Earthquake
image: asc-icon-gladiator
hero: art-gladiator
tags: [Melee, Bleed, Block, Tanky]
ratings: { clear: 3, bossing: 4, survivability: 5, ease: 4 }
verified: "2026-11-13"
confidence: mixed
confidenceNote: >-
  **The four ratings are the author's own**, taken from the planner's rating
  block: map clear 3 (Average), bossing 4 (Great), survivability 5 (Amazing),
  ease 4 (Low difficulty). Our independent read agrees, except that we would
  put clear at 3.5 and we round halves down. On sources, this is the most
  current guide we found for any build: the planner was saved on launch day
  with the league field set to 3.30, and the author annotates a 3.30-specific
  change inline. **But the author states in his own FAQ that he had no alpha
  access and could not test the build on 3.30 before launch**, and says he will
  adjust in the first days. That is well-informed pre-league theory, not tested
  practice, and it is a more honest disclosure than most guides make.
modes:
  ssf: >-
    Excellent, and probably the best choice on this site for it. The author
    wrote the progression for solo self-found explicitly. Everything is
    essence-craftable rares, [[Resolute Technique]] removes accuracy gearing,
    and [[Determined Survivor]] removes block-roll hunting. There is a
    documented no-suppression tree variant too. The one real pain is
    [[Ryslatha's Coil]] and [[Kaom's Sign]] dropping at all.
  hardcore: >-
    Very strong, and the guide's headline claim. Roughly 88% attack and spell
    block, 90% capped physical damage reduction, 6,750 life, 23,000 armour,
    stun immunity and life on block. Two caveats: chaos damage is the thin
    layer, and the guide ships no dedicated hardcore tree — the nearest thing
    is its pre-suppression armour tree.

idea: |
  You slam the ground with [[Earthquake]]. A crack appears. One second later the crack erupts, and that eruption deals 150% more damage than the slam did.

  Bleeding is applied by the physical damage of the hit that caused it, and a stronger bleed replaces a weaker one. So the eruption's bleed is the one that sticks. The whole build exists to land eruptions, as big as possible, as often as possible.

  Then [[Jagged Technique]] makes every bleed you apply **aggravated**, which means it always deals damage as though the enemy were moving. That is three times the damage, with no dice roll.

  So on a boss you land one enormous bleed and then dodge for as long as you like. The damage keeps ticking whether you are attacking or not.

  In maps, bleeding monsters you kill explode for a fifth of their maximum life, and the explosions chain.

chain:
  - label: Slam
    text: "[[Earthquake]] hits at 75% of your attack speed and leaves a crack on the ground."
  - label: Aftershock
    text: "After one second the crack erupts for 150% more damage with hits **and** ailments. This is the hit that matters."
  - label: Aggravated bleed
    text: "[[Jagged Technique]] aggravates every bleed. Aggravated bleeding deals damage as if the target were moving: three times the normal rate."
  - label: Explode and block
    text: "[[Gratuitous Violence]] explodes bleeding enemies you kill. [[More Than Skill]] makes your block lucky, taking 65% to about 88%."

chainDetails:
  - title: "The rule that shapes everything: maximum hit, not damage per second"
    body: |
      Bleeding is calculated from the physical damage of the hit that applied it. It does not care about your damage per second.

      Both authors of Maxroll's Gladiator guides repeat the same line: maximum hit damage matters, not damage per second.

      That is why attack speed sits ninth on the author's own scaling list, described as "not a damage stat here, but very good for how the build feels". And it is why the build wears a belt that deliberately widens its damage range.
  - title: Why Ryslatha's Coil is a damage item
    body: |
      [[Ryslatha's Coil]] gives −30% minimum and +40% maximum physical attack damage. On most builds that is a wash.

      Here it is not, because only the biggest bleed you have applied is dealing damage. You hit often, so sooner or later you roll near the top of a deliberately widened band, and that oversized bleed persists. The low rolls simply get overwritten.

      It also brings +40 Strength, +100 maximum life and 50 life on stun. The author calls it the biggest non-weapon upgrade in the build.
  - title: Endurance charges are the key to the whole thing
    body: |
      The Bleeding mastery gives "+3% to Damage over Time Multiplier for Bleeding per Endurance Charge". Each charge is also 4% physical and 4% elemental damage reduction.

      So one mastery makes endurance charges simultaneously your damage stat and your defence stat. That single node is why two [[Kaom's Sign]] rings justify two ring slots, and why the author drops Determination in favour of [[Blood Magic]] plus charge stacking.

      The endgame target is 8 charges, and the count can be checked: three base, Vigour and Stamina on the tree, the Endurance anoint on the amulet, and one from each [[Kaom's Sign]]. The published Path of Building reads 7 because its endgame item set wears only one Kaom's Sign, with a rare ring it labels an alternative in the other slot. Adding them up from that file's tree and items is our arithmetic; the 8 is the guide's own number.
  - title: What Jagged Technique is actually worth
    body: |
      Honest version, because the simple version oversells it.

      Aggravated bleeding is three times normal. Without [[Jagged Technique]] you get aggravation from chance sources instead — 10% from Bloodletting, 10% from [[Vulnerability]] quality, up to 30% from a glove implicit.

      Per hit, the gap looks enormous: about 1.4 times against 3 times with no glove implicit. But bleeds last about five seconds and an aggravated bleed overwrites a weaker one, so at roughly two attacks a second you get eleven hits inside one bleed window. Even at a 19% per-hit chance, something aggravates about 91% of the time.

      **So Jagged Technique does not pay in sustained face-tanking. It pays in ramp time and interrupted uptime.** Every time you stop attacking — a dodge, a phase change, an invulnerability window, a knockback — the chance-based build starts flipping coins again while yours is at full value on the next hit.

      That is exactly the shape of a 3.30 boss fight with hazards to dodge. Neither case was run in Path of Building, so the exact difference is untested.
  - title: Crimson Dance is not used, and the reason is in the keystone
    body: |
      [[Crimson Dance]] lets bleeds stack, which sounds good and is the usual bleed keystone.

      It is absent from every tree variant in this guide, and 3.30's text makes it a hard no: under Crimson Dance bleeding **cannot be aggravated**, on top of 50% less damage with bleeding.

      Aggravation is the build. So the keystone is off the table, not a preference.
  - title: The 2-hand to 1-hand switch, and why it is the biggest spike
    body: |
      You level with two-handed axes. After Merciless Labyrinth, around level 68, you swap to a one-handed axe and a shield, and respec the two-handed nodes at the same time.

      [[Earthquake]] supports both one-handed and two-handed axes, which is exactly why this works without changing your main skill.

      Everything defensive turns on at once: [[Determined Survivor]] gives flat 50% block from any shield, [[Versatile Combatant]] converts your overcapped attack block into spell block at two for one, and [[More Than Skill]] later makes it lucky. It costs you nothing offensively.

      This is the single largest power spike in the build.

mandatory:
  - term: Earthquake
    why: >-
      The base gem, not a transfigured version, and not Vaal Earthquake. Usable
      from level 28.
    detail: >-
      The guide keeps [[Sunder]] through the campaign and lists Earthquake only
      in its maps skill set. **It never states the swap level.** Earthquake is
      usable at 28; treat the changeover as somewhere between there and the
      Merciless lab, and do not trust any precise level you read.
  - term: Jagged Technique
    why: >-
      Every bleed you apply is aggravated, which means a flat three times
      damage against anything, moving or not. No other bleed build on this site
      has it.
  - term: Gratuitous Violence
    why: >-
      Bleeding enemies you kill explode for 20% of their maximum life. This is
      the entire clear, and it chains.
    detail: >-
      The author tempers expectations: do not expect much from it in Normal
      Labyrinth. It comes alive in maps, where packs are dense enough to chain.
  - term: Determined Survivor
    why: >-
      Flat 50% block chance from any shield, so you never hunt for block rolls
      on gear. Requires a shield, which is why the one-hand swap is mandatory.
  - term: More Than Skill
    why: >-
      Your block becomes lucky, which takes 65% to roughly 88% on both attacks
      and spells. The single largest defensive multiplier in the build.
    detail: >-
      Those are the guide's own figures, and they hold up: 65% rolled twice is
      87.75% by our arithmetic. The 65% is a ceiling, not a gearing target,
      because [[Versatile Combatant]] also takes 10% off maximum block. The
      level 98 file reads 87.75% spell block and 89.76% attack block; its tree
      takes As The Mountain for +3% to maximum attack block, and 68% rolled
      twice is 89.76%. One condition sits in the node's own text: block is
      lucky only if you have blocked recently, and the file's figures are
      worked out with that condition switched on.
  - term: Versatile Combatant
    why: >-
      Converts overcapped attack block into spell block at 2% per 1%. It is the
      only reason your spell block reaches the same number as your attack
      block.
  - term: Resolute Technique
    why: >-
      Never crit, never miss. Zero accuracy on gear, zero crit scaling, and
      perfectly predictable bleed application.
  - term: Blood Magic
    why: >-
      Permanent here, in every tree variant. Skills cost life instead of mana,
      and the points that would have gone to Determination go into endurance
      charges instead.
    detail: >-
      The trade-off is real: no mana-based panic buttons, and every skill use
      comes off your life pool. The published file reads 55 life per use.
  - term: Unwavering Stance
    why: >-
      Stun immunity. You stand still and slam, so you cannot afford to be
      stun-locked.
  - term: Ryslatha's Coil
    why: >-
      The biggest non-weapon upgrade. It widens your damage range, and only
      your biggest bleed matters.
    detail: >-
      The author's own listed weakness is that it may be expensive. Two popular
      Gladiator guides both require it, so demand will be concentrated at
      league start.
  - term: Fist of War Support
    level: recommended
    why: >-
      At gem level 20, Ancestrally Boosted slams deal 98% more damage with hits
      and ailments, and a slam can be boosted no more than once every 1.8
      seconds. [[Earthquake]] carries the Slam tag.
    detail: >-
      **One honest caveat:** nobody has confirmed whether Fist of War's boost
      reaches the aftershock or only the slam. The game data says the boost does
      not apply to repeats of an attack, and never says whether the aftershock
      counts as a repeat. The author puts it in the six-link and has it enabled,
      so he plainly believes it applies. Treat any specific multiplier here as
      unverified.
  - term: Kaom's Sign
    level: recommended
    why: >-
      Two of them. +1 maximum endurance charge each, which is both damage and
      defence thanks to the Bleeding mastery. Cheap on trade.
    detail: >-
      Also +30 life implicit, +20 Strength and a level 10 [[Enduring Cry]].
      Corrupt your spares looking for +1 maximum charge, bleed damage over time
      multiplier, attack speed, or increased [[Pride]] aura effect.
  - term: Vulnerability
    why: >-
      With quality: 30% increased physical damage taken, 25% chance to bleed,
      and up to 10% chance to aggravate. Keep the quality.
  - term: Lacerate of Haemorrhage
    level: recommended
    why: >-
      A separate six-link swap for uber pinnacle bosses. More damage than
      [[Earthquake]] on a single target, worse for clear.
    detail: >-
      The author gates this behind "more advanced player". The gem itself
      carries 75–132% more damage with bleeding, plus up to 40% more from
      quality.
  - term: Kongming's Stratagem
    level: recommended
    why: >-
      A cheap early shield. Its "No Chance to Block" line does not apply to
      you, because [[Determined Survivor]] forces 50% shield block regardless.
    detail: >-
      It needs a chance-to-blind-on-hit source somewhere in your gear. A second
      Maxroll author independently confirms Determined Survivor is 50% in the
      normal game, not the 40% that appears in the Ruthless section of the
      notes.

labs:
  - lab: Normal
    node: Gratuitous Violence
    why: "Around level 33. Bleed explosions. Taken first only because nothing else is better that early: the block nodes do nothing until you hold a shield, three labs away."
  - lab: Cruel
    node: Jagged Technique
    why: "Around level 52. The pivot point. The author's words: the build starts mostly hit-based and slowly transitions to bleed, and Cruel lab is where you can fully focus on bleed damage."
  - lab: Merciless
    node: Determined Survivor
    why: "Around level 68, and you do the two-hand to one-hand swap in the same session. Flat 50% block from any shield."
  - lab: Eternal
    node: More Than Skill
    why: "Lucky block on attacks and spells, 65% to about 88%. Last, because it needs the block base to exist first."

stages:
  - id: acts-1-3
    image: blood-and-sand
    title: Acts 1–3
    levels: Level 1–28
    uses: >-
      [[Spectral Throw]] from level 1, then [[Sunder]] with
      [[Ruthless Support]] from level 12. Two-handed axes the whole way.
    changes: >-
      [[Seismic Cry]] replaces [[Intimidating Cry]] at 24, and [[Vulnerability]]
      comes in at the same time. [[Pride]] joins at 28. Keep repeating the
      weapon vendor recipe below as you find bigger axes.
    links:
      - name: Level 1–11
        gems: [Spectral Throw, Chance to Bleed Support, Volley Support]
      - name: Level 12
        gems: [Sunder, Ruthless Support, Maim Support]
      - name: Level 18, first four-link
        gems: [Sunder, Chance to Bleed Support, Cruelty Support, Close Combat Support]
      - name: Level 28
        gems: [Sunder, Chance to Bleed Support, Cruelty Support, Maim Support]
      - name: Movement and warcries
        gems: [Leap Slam, Faster Attacks Support, Intimidating Cry, Dash, Frostblink]
      - name: Buffs
        gems: [War Banner, Blood and Sand, Blood Rage, Warlord's Mark]
    moveOn: "you have a four-link Sunder, Normal Labyrinth is done, and you are heading into Act 4."
    details:
      - title: The one vendor recipe to repeat all campaign
        body: |
          Vendor any weapon together with a magic or rare [[Rustic Sash]] and a [[Blacksmith's Whetstone]]. You get the same base back with increased physical damage.

          Do this to your first axe and to every upgrade after it. For a build that lives on maximum hit damage, it is free power.
      - title: Other small leveling buys
        body: |
          - [[Sapphire Ring]] before Merveil.
          - [[Amber Amulet]] for the Strength to equip [[Leap Slam]].
          - Vendor an Iron Ring plus a red, green or blue gem for a Ruby, Topaz or Sapphire Ring.
          - Bench resistances cost one [[Orb of Transmutation]] and work on normal items.
      - title: Which bandit, and an unresolved disagreement
        body: |
          **The guide disagrees with itself here.** Its written FAQ says that if you are not sure, stick with Oak for the flat life. Its planner data says kill all three.

          We flag it rather than guess. Oak is the safer pick for a newer player; kill-all is what the build data assumes.
      - title: Intimidating Cry is real damage early
        body: |
          The author calls [[Intimidating Cry]] significant single-target damage early on. Use it on every rare and every boss until [[Seismic Cry]] replaces it at 24.

          After that it is gone. The planner's gem sets carry no Intimidating Cry from level 24 on; the Path of Building file keeps it in its level 18–31 set, so the two files differ by a few levels on when. The warcry the guide does tell you to keep for bosses behind a loading screen is [[Enduring Cry]], and that one arrives in maps. See the note in the red maps stage.
  - id: acts-4-10
    image: unwavering-stance
    title: Acts 4–10
    levels: Level 28–68
    uses: >-
      Still [[Sunder]], now with [[Fist of War Support]] from level 38.
      [[Pride]] with [[Eternal Blessing Support]] so it costs no reservation.
    changes: >-
      Add [[Urgent Orders Support]] to [[Seismic Cry]] at level 31. You ascend
      twice here: [[Gratuitous Violence]] around 33 and [[Jagged Technique]]
      around 52. The second one is where the build changes character.
    links:
      - name: Main skill from level 38
        gems: [Sunder, Fist of War Support, Chance to Bleed Support, Cruelty Support]
      - name: Warcries
        gems: [Seismic Cry, Urgent Orders Support]
      - name: Auras and banner
        gems: [Pride, Eternal Blessing Support, Vitality, War Banner]
      - name: Movement
        gems: [Leap Slam, Faster Attacks Support, Frostblink]
      - name: Curse and buff
        gems: [Vulnerability, Blood Rage]
    moveOn: "Merciless Labyrinth is done, you are holding a one-handed axe and a shield, and the two-handed nodes are respecced."
    details:
      - title: The hit-to-bleed pivot at Cruel lab
        body: |
          Before [[Jagged Technique]], your damage is mostly the hit. After it, your damage is mostly the bleed.

          That changes what you look for on gear. From Cruel lab onward, chase physical damage over time multiplier and the Bleeding mastery rather than raw attack speed.
      - title: The one-hand swap, step by step
        body: |
          At Merciless Labyrinth, around level 68:

          1. Take [[Determined Survivor]].
          2. Equip a one-handed axe and a shield.
          3. Respec the two-handed nodes into block, shield and armour masteries.

          The published Path of Building has a tree spec literally named for this step. Do all three in one sitting; half of it is worse than either.
      - title: "Pantheon: two answers, for two versions of the build"
        body: |
          The planner says Brine King with all three upgrades, plus Ralakesh. The published Path of Building opens on Lunaris plus Ralakesh. Both files were saved six minutes apart, and we used to list this as a conflict.

          It is not one. The Path of Building file carries two configurations. The one named Default has Brine King, and its name tags it for the midgame tree and the suppression endgame tree. The one named Ailment Avoid has Lunaris, is tagged for the no-suppression endgame tree and the cluster setup, and is the one the file was saved on. The file's notes say the no-suppression versions reach ailment immunity. Our reading is that this is why Brine King gives way there; the notes do not spell the reason out.

          So: Brine King through the campaign and midgame, which is what the planner shows, and Lunaris once you are on an ailment-immune endgame setup. Ralakesh is the minor god in both.
  - id: early-maps
    image: versatile-combatant
    title: Early maps
    levels: White and yellow maps
    uses: >-
      [[Earthquake]] with [[Fist of War Support]] and
      [[Less Duration Support]], behind a one-handed [[Reaver Axe]] and a
      shield. [[Brutality Support]] replaces [[Chance to Bleed Support]]. The
      guide publishes its map link only as six gems and does not say which one
      to leave out while your chest has five links.
    changes: >-
      Fix the −30% resistances from the Act 10 boss first. Chaos resistance can
      lag, but push it towards 0%. Get [[Kaom's Sign]] rings as soon as they
      are affordable.
    links:
      - name: "Main skill: the guide's map set, published as six links"
        gems: [Earthquake, Brutality Support, Fist of War Support, Cruelty Support, Fortify Support, Less Duration Support]
      - name: Single target
        gems: [Bladestorm, Maim Support, Culling Strike Support, More Duration Support]
      - name: Movement
        gems: [Shield Charge, Faster Attacks Support, Flame Dash]
      - name: "Warcry: Enduring Cry, or Seismic Cry while mapping"
        gems: [Seismic Cry, Urgent Orders Support, Enduring Cry]
      - name: Auras and banner
        gems: [Pride, Eternal Blessing Support, Vitality, War Banner]
      - name: Curse and buff
        gems: [Vulnerability, Blood Rage]
      - name: Guard, on Cast when Damage Taken
        gems: [Cast when Damage Taken Support, Molten Shell, More Duration Support]
    moveOn: "resistances are capped, you have two Kaom's Sign rings, and block is the main project."
    details:
      - title: Why Less Duration is in the main link
        body: |
          The crack takes one second to erupt. [[Less Duration Support]] shortens that, so aftershocks land sooner and your big bleed refreshes faster.

          Cracks created before the first one erupts do **not** spawn their own aftershocks. Slamming faster than the aftershock cycle wastes slams, which is another reason attack speed is not a damage stat here.

          The one substitution the author describes is for the Lacerate gem swap. That chest has to be five red sockets and one green, so Earthquake takes [[Swift Affliction Support]] in place of Less Duration there. Make the green socket white and you can keep Less Duration.
      - title: Socket colours are worth real damage
        body: |
          A gem in a socket of its own colour gets +10% quality. On [[Earthquake]], quality is directly more aftershock damage — up to +30% at 20% quality.

          So the correct colour under your main skill gem is a straight 10% more aftershock damage. The published file has both Earthquake and [[Lacerate of Haemorrhage]] at 30% quality for this reason.
      - title: Your first real weapon
        body: |
          A high-quality one-handed [[Reaver Axe]] with maximum physical damage, made with a Deafening or Shrieking [[Essence of Contempt]].

          The milestone to aim for is 550 or more top-end physical damage. That is the author's own target and it is the number that matters most.
      - title: Flasks and the bleed problem
        body: |
          A Divine [[Life Flask]] with either the instant or the 50%-instant prefix, and the "of Sealing" suffix for bleed immunity. Then [[Jade Flask]], [[Quicksilver Flask]], [[Quartz Flask]] and [[Sulphur Flask]].

          Utility suffix priority: reduced curse effect, then increased armour, then reduced shock, then reduced chill and freeze, then movement speed.
      - title: Bladestorm, honestly
        body: |
          The author is refreshingly blunt about it: [[Bladestorm]] is single-target only, and even then it is not that important.

          Keep it in a four-link if you have the sockets. Do not spend currency on it. It is not a stopgap, though: the guide's gem sets keep the same four-link through red maps and in the uber bossing setups.
  - id: red-maps
    image: more-than-skill
    title: Red maps
    levels: Tier 11–16 maps
    uses: >-
      A six-link [[Earthquake]], [[Ryslatha's Coil]], and about 88% block on
      both attacks and spells after [[More Than Skill]].
    changes: >-
      The author's priority order is explicit: Eldritch implicits first, then
      the endgame axe, then Ryslatha's Coil, then a damage amulet re-anointed to
      Endurance, then cluster jewels, then a life-on-block shield.
    links:
      - name: "Main skill: the planner and Path of Building map set"
        gems: [Earthquake, Brutality Support, Fist of War Support, Cruelty Support, Fortify Support, Less Duration Support]
      - name: "Boss swap: the (Uber) Bossing set"
        gems: [Lacerate of Haemorrhage, Brutality Support, Volatility Support, Melee Physical Damage Support, Endurance Charge on Melee Stun Support, Fortify Support]
      - name: Single target
        gems: [Bladestorm, Maim Support, Culling Strike Support, More Duration Support]
      - name: Movement
        gems: [Shield Charge, Faster Attacks Support, Flame Dash]
      - name: "Warcry: Enduring Cry, or Seismic Cry while mapping"
        gems: [Seismic Cry, Urgent Orders Support, Enduring Cry]
      - name: Auras and banner
        gems: [Pride, Eternal Blessing Support, Vitality, War Banner]
      - name: Curse and buff
        gems: [Vulnerability, Blood Rage]
      - name: Guard, on Cast when Damage Taken
        gems: [Cast when Damage Taken Support, Molten Shell, More Duration Support]
    moveOn: "block is capped and lucky, and your axe is at 550 or more top-end physical damage."
    details:
      - title: Keep Enduring Cry for bosses with a loading screen
        body: |
          The guide's map gem sets list [[Enduring Cry]], linked to [[Urgent Orders Support]]. [[Seismic Cry]] is an optional swap: the author's FAQ says you can run it in place of Enduring Cry in the Earthquake setup, because your endurance charges should be permanently up while mapping anyway.

          The same FAQ entry carries the warning: for bosses with their own loading screen you definitely want Enduring Cry. Endurance charges are lost when you cross a loading screen, and by the guide's count eight of them are 32% physical and 32% elemental damage reduction. Through the Bleeding mastery they are also +24% damage over time multiplier for bleeding, which is our arithmetic from 3% a charge. So if you do map with Seismic Cry, put Enduring Cry back for any boss you walk into through a portal or a transition.
      - title: The endgame axe, and the 3.30 problem
        body: |
          Two published routes to a [[Reaver Axe]] with 550+ top-end physical damage:

          1. **Recombinators.** About ten item-level-83 Reaver Axes, a few thousand [[Orb of Alteration]], and a one-in-three success rate per recombine.
          2. **The older route.** [[Essence of Contempt]], a [[Veiled Orb]], the prefixes-cannot-be-changed bench option, finished with a Warlord's Exalted Orb.

          The author warns inline that recombinators were nerfed in 3.30 by an amount he calls currently unknown. That pushes you towards the slower second route or towards buying the finished axe.
      - title: The two map modifiers that brick you
        body: |
          The author supplies the filter regex himself. The two to never run:

          - **Monsters have a chance to avoid Poison, Impale and Bleeding.** His words: if we do not bleed, we do not deal damage.
          - **Players have less Armour, or reduced Chance to Block.** Your entire defence is those two numbers.
      - title: Where the explode clear falls short
        body: |
          Corpse-explosion clear means things die behind you. The author concedes this, and the fix is a good loot filter rather than a build change.

          Combine that with 75% attack speed slams, a one-second aftershock cycle and low mobility, which the author lists as a weakness himself (Shield Charge and a Flame Dash are all the movement in his map gem sets), and you have the reason his own map clear rating is 3 out of 5.
  - id: endgame
    image: kalandras-touch
    title: Endgame
    levels: Tier 17, uber pinnacle bosses and beyond
    uses: >-
      A life-on-block shield, cluster jewels, [[Kalandra's Touch]] to duplicate
      a corrupted rare ring, and the [[Lacerate of Haemorrhage]] swap for ubers.
    changes: >-
      Damage stops coming from the tree and starts coming from implicits and a
      better axe. The far end is a synthesised-implicit axe at 800+ top-end
      physical, which the author says costs at least a
      [[Mirror of Kalandra]].
    links:
      - name: "Mapping: the Path of Building file's Exceptional Gems set"
        gems: [Earthquake, Melee Physical Damage Support, Brutality Support, Fist of War Support, Fortify Support, Less Duration Support]
      - name: "Uber bossing: the Exceptional Gems set"
        gems: [Lacerate of Haemorrhage, Volatility Support, Brutality Support, Melee Physical Damage Support, Greater Multistrike Support, Deadly Ailments Support]
      - name: Single target
        gems: [Bladestorm, Maim Support, Culling Strike Support, More Duration Support]
      - name: Movement
        gems: [Shield Charge, Faster Attacks Support, Flame Dash]
      - name: "Warcry: Enduring Cry, or Seismic Cry while mapping"
        gems: [Seismic Cry, Urgent Orders Support, Enduring Cry]
    moveOn: "there is no next stage. What is left is a mirror-tier axe and marginal implicits."
    details:
      - title: What the finished character looks like
        body: |
          From the published Path of Building at level 98, configured for the no-suppression variant:

          - 89.76% attack block and 87.75% spell block, both after the lucky roll. The guide's text rounds both to 88%; the file's tree has a 68% ceiling on attack block against 65% on spell block.
          - 6,750 life, 23,063 armour, 90% physical damage reduction — the cap.
          - Resistances 77/76/76, and chaos at 47.
          - Around 1,100 life per second regenerated, 925 net, plus 675 leech per hit.
          - Largest survivable hit: 21,800 physical, about 57,000 elemental, 20,810 chaos.

          **These are the author's numbers from a 3.29-engine Path of Building, for a softcore cluster-jewel setup.** Read the chaos figures carefully: your chaos buffer is about a third of your elemental buffer. That is the build's one thin layer.
      - title: The shield to finish on
        body: |
          A shield with increased spell suppression and "Recover 5% of Life when you Block". Use a pure evasion base such as a [[Lacquered Buckler]], which makes suppression easier to reach.

          Alternatively, take the documented no-suppression route: drop suppression and [[Iron Reflexes]], invest fully into armour, and use the guide's pre-suppression tree. That is the route the solo self-found and hardcore-adjacent players should look at.
      - title: Bleed cannot be burst-scaled
        body: |
          This is the honest counterweight to everything good above. If a boss has a damage check, an enrage timer, or a phase you have to end quickly, a fixed-rate damage-over-time effect has no answer.

          "Damage not insane" is the author's own assessment of his own build. Believe him.
      - title: Jagged Technique in the Lacerate setup is an optional swap
        body: |
          The guide's build information lists two chance sources of aggravation for the [[Lacerate of Haemorrhage]] boss setup, 10% from Bloodletting and 10% from [[Vulnerability]] quality, as though [[Jagged Technique]] were not there. We used to flag that as a contradiction. The notes inside the published Path of Building file settle it.

          Those notes say the author rates [[War of Attrition]] as the best fourth ascendancy pick for pinnacle bosses, and call it a nearly dead node in maps. The two chance sources are how you aggravate if you take it in place of Jagged Technique. He then adds that in Settlers league he did not bother swapping and it was still completely fine, and that if you do not want to swap he recommends sticking with Jagged Technique. Every tree in the file keeps Jagged Technique, and the node's text carries no condition: "Bleeding you inflict is Aggravated". So unless you choose the swap, it is active with Lacerate too.

          One loose end remains. The guide's Uber lab section talks about Jagged Technique as the flexible pick and offers a defensive notable in its place, while the planner and the file's trees take it second, at Cruel lab. Our reading is that the section is about which node you give up once you have all four, not about the order you take them in. The substantive takeaway stands either way: Jagged Technique is the designated droppable node, and the guide tells you how to replace its aggravation.

powerCurve: |
  The damage is three things multiplied together, and the defence is three layers stacked. Splitting it this way is our framing; each part is in the guide or the game data. **The size of one hit** is the aftershock's physical damage, which comes from the axe and later from [[Ryslatha's Coil]]. **Aggravation** triples the bleed that hit leaves, and [[Jagged Technique]] makes it certain. **The bleed multiplier** grows with every endurance charge, through the Bleeding mastery. On the other side sit block, armour, and the same endurance charges again.

  Early, you have only the first of these. Until the Cruel Labyrinth around level 52 the build is a two-handed [[Sunder]] character that kills with the hit, and the vendor recipe for physical damage is the only scaling that matters. [[Gratuitous Violence]] at 33 adds explosions the author says not to expect much from yet. Jagged Technique is where the damage turns into bleed. The defence is still missing: the block nodes do nothing until you hold a shield.

  The Merciless Labyrinth, around level 68, is the largest single step, and all of it is defence. [[Determined Survivor]] and a shield give flat 50% block, [[Versatile Combatant]] turns the excess into spell block, and the swap to one hand costs you nothing offensively. Maps then add the cheap multipliers: [[Earthquake]] itself, with its 150% more aftershock; two [[Kaom's Sign]] rings, where each charge is damage and mitigation at once; and [[More Than Skill]] at the fourth lab, which takes block from 65% to about 88%.

  From red maps on, the two halves part ways. The defence is finished: about 88% block by the guide's figure (the author's level 98 file reads 89.76% against attacks and 87.75% against spells) and, in the same file, physical damage reduction at the 90% cap. The damage is not, and what is left of it has to be bought, because by the guide's own account it stops coming from the tree and starts coming from implicits and a better axe. The far end of that road is an axe the author says costs at least a [[Mirror of Kalandra]]. So expect a character that stops dying long before it starts killing quickly, and bosses that go down at a steady rate, never in a burst. The author's own words for it are "damage not insane".

upgrades:
  - step: "Two [[Kaom's Sign]] rings"
    why: >-
      First because they are cheap on trade, and nothing else on this list
      buys damage and defence with the same coin. Each ring is +1 maximum
      endurance charge, and through the Bleeding mastery every charge is +3%
      damage over time multiplier for bleeding plus 4% physical and 4%
      elemental damage reduction. The guide has you buy them in early maps,
      before the author's own ranked list begins. It gives no figure for
      them.
  - step: "A one-handed [[Reaver Axe]] crafted with [[Essence of Contempt]]"
    why: >-
      Bleed is worked out from the physical damage of the hit that applied
      it, so the top of the axe's damage range is the number everything else
      multiplies. Use a high-quality base and a Deafening or Shrieking
      essence. This is the guide's first real weapon, in early maps. It sits
      below the rings only because the rings are a fixed purchase and the
      rest of a craft is luck. That ordering is ours.
  - step: "The sixth link, with [[Earthquake]] in a socket of its own colour"
    why: >-
      The colour is damage for the price of recolouring one socket: a gem in
      a socket of its own colour gets +10% quality, and on Earthquake that is
      a straight 10% more aftershock damage. The guide publishes
      its map link only as six gems: Brutality, Fist of War,
      [[Cruelty Support]], Fortify and Less Duration behind Earthquake, with
      Melee Physical Damage in place of Cruelty in the file's Exceptional Gems
      set. It never shows a five-link, so no source says which support is the
      sixth. The author's ranked list does not
      place the six-link anywhere. We put it here because a link multiplies
      whichever axe you hold, so it keeps its value through the axe upgrades
      below. That ordering is ours, and no source prices a six-link in 3.30.
  - step: "Eldritch implicits"
    why: >-
      The first item in the author's own red-map order, and from here down to
      the shield the order is his. His reason is timing: the gloves, helmet,
      body armour and boots are all due an upgrade, it is the last one those
      slots get for a while, and so the implicits go on with it. He names
      them slot by slot. Helmet: increased [[Vulnerability]] curse effect,
      and physical damage from hits taken as elemental. Body armour: maximum
      resistances, and increased [[Pride]] aura effect. Gloves: physical
      damage over time multiplier, and chance to suppress spell damage.
      Boots: action speed, and life regeneration per endurance charge. If you
      give up [[Jagged Technique]], he rolls chance to aggravate on the
      gloves in place of suppression. He gives no figure for what any of them
      adds, and neither do we.
  - step: "The endgame axe: 550 or more top-end physical damage"
    why: >-
      The author's own milestone, and the number he says matters most. Two
      routes are published. One uses recombinators: about ten
      item-level-83 Reaver Axes, a few thousand [[Orb of Alteration]] and a
      one-in-three success rate per recombine. The older one uses Essence of
      Contempt, a [[Veiled Orb]] and the bench. He warns that recombinators
      were nerfed in 3.30 by an amount he calls unknown, so expect the slower
      route, or expect to buy the axe finished. No price exists for either.
  - step: "[[Ryslatha's Coil]]"
    why: >-
      The author calls it the biggest non-weapon upgrade and ranks it third.
      It gives −30% minimum and +40% maximum physical attack damage, and only
      your biggest bleed deals damage: the high rolls stay and the low rolls
      are overwritten. It also brings +40 Strength and +100 maximum life. It
      is the build's one named cost risk, because two popular Gladiator
      guides require it, so expect demand in launch week. No price exists for
      it in any patch.
  - step: "A damage amulet re-anointed to Endurance, then cluster jewels, then a life-on-block shield"
    why: >-
      The last three items of the author's order, kept in his sequence. He
      does not say how much each adds and nothing we read prices them, so we
      group them. The shield is the one with a number on it: "Recover 5% of
      Life when you Block", on a character that blocks about 88% of hits. The
      guide suggests an evasion base such as a [[Lacquered Buckler]] if you
      also want spell suppression, and documents a no-suppression route if
      you do not.
  - step: "[[Kalandra's Touch]], the [[Lacerate of Haemorrhage]] six-link, then a better axe"
    why: >-
      Last because all of it belongs to the final stage, past everything on
      the author's ranked list. The guide's min-max ring is a rare one, corrupted
      for +1 maximum endurance charge and crafted for damage over time
      multiplier, and Kalandra's Touch copies it; the author's stated reason is
      that this saves some Divines over making two. It is not a Kaom's Sign
      that gets copied: the guide's text and the file's Minmax item set both
      show a rare ring. The
      Lacerate link is a second six-link used only on uber pinnacle bosses,
      and the author reserves it for more advanced players. The axe ends at a
      synthesised-implicit one with 800+ top-end physical damage, which he
      says costs at least a [[Mirror of Kalandra]]. Read that as a direction.

play:
  mapping: |
    Written for red maps, with a shield on your arm and [[Earthquake]] on six links. The loop is short because the build is slow on purpose: a slam at 75% of your attack speed, then a wait for the crack.

    1. **Read the map before you open it.** Never run "Monsters have a chance to avoid Poison, Impale and Bleeding", and never run less Armour or reduced Chance to Block. The first removes your damage and the second your defence. The author supplies a regex for exactly these.
    2. **[[Shield Charge]] to the pack.** That is the author's own description of mapping: you Shield Charge around. His map gem sets link it to [[Faster Attacks Support]] and also carry a [[Flame Dash]]; the playstyle note in his Path of Building file says he mostly just shield charges and flame dashes around.
    3. **Slam once, on the pack.** The crack erupts about a second later, sooner with [[Less Duration Support]], and that aftershock is the hit that matters. Cracks made before the first one erupts get no aftershock of their own. Our reading of that rule is that a second slam straight away adds little on an ordinary pack: slam and step on.
    4. **Let the explosions do the rest.** With [[Gratuitous Violence]], a bleeding monster you kill explodes for a fifth of its maximum life, and in a dense pack the explosions chain. Things die behind you. The author's answer is a good loot filter, not a change to the build.
    5. **The warcry is optional while you map.** The guide's map gem sets list [[Enduring Cry]]; its FAQ says you can run [[Seismic Cry]] in its place for mapping, because your endurance charges should stay up there anyway. The guide does not say how often to press either one, so we give no rhythm for it.
    6. **Stop for Rare monsters and the map boss.** Cast [[Vulnerability]], slam, wait for the aftershock, slam again. The curse is a button you press: nothing in the published links triggers it, and the playstyle note in the author's file says that on single target you cast Vulnerability, use Bladestorm for Maim and put down your War Banner, which is instant.

    Two things to keep an eye on. [[Blood Magic]] means every skill comes out of your life: the published file reads 55 life per use. And the "of Sealing" suffix on your life flask is what removes a bleed from you, so press it when you are bleeding. The guard skill is the one thing you do not press: the guide's gem sets put [[Molten Shell]] on [[Cast when Damage Taken Support]] with More Duration, so it fires by itself when you take damage.
  bossing: |
    The plan is the one in the guide's opening lines: land one very large bleed, then move as much as you like while it ticks. A bleed lasts about five seconds and a stronger one replaces a weaker one, so you are never building a stack. You are trying to roll one big aftershock and then keep it refreshed.

    1. **Get your charges back first.** Endurance charges are lost at a loading screen, and the guide counts eight of them as 32% physical and 32% elemental damage reduction. By our arithmetic they are also +24% damage over time multiplier for bleeding, at 3% a charge from the Bleeding mastery. If you reached the boss through a portal or a transition, press [[Enduring Cry]] before anything else.
    2. **Curse the boss** with [[Vulnerability]]. With quality on the gem, the boss takes 30% increased physical damage.
    3. **Slam in time with the aftershock, not faster.** A crack made before the last one has erupted gets no aftershock, so the extra slams are wasted. [[Fist of War Support]] boosts a slam no more than once every 1.8 seconds; whether its bonus reaches the aftershock is not confirmed.
    4. **When the boss does something dangerous, walk away.** The bleed keeps ticking whether you are attacking or not. It lasts about five seconds, so that is how long you can stay away before the damage stops. The five-second limit is our arithmetic, not a line from the guide.
    5. **Come back and slam again.** [[Jagged Technique]] aggravates every bleed, so the first aftershock after a dodge is worth as much as any other. Each aftershock is also another roll at a bigger bleed: with [[Ryslatha's Coil]] the range is wide on purpose, the high roll stays and the low ones are overwritten.

    The [[Bladestorm]] four-link, with [[Culling Strike Support]] in it, stays in the guide's gem sets through every map stage, the uber setups included. The author's FAQ says it applies Maim and Culling Strike and gives extra chances to aggravate, that you only use it on a single target, and that even then it is not that important.

    For uber pinnacle bosses the author swaps the whole six-link to [[Lacerate of Haemorrhage]]: more damage on one target, worse clear, and reserved by him for more advanced players. Jagged Technique stays active in that setup unless you choose to swap it out. The notes in his Path of Building file rate [[War of Attrition]] higher for pinnacle bosses, with aggravation then coming from chance sources, and add that he did not bother swapping in Settlers league. The endgame stage has the detail.

    What does not change: bleed has no burst. A damage check, an enrage timer or a phase you must end quickly has no answer in this build. And block is a chance, so the hit that gets through is not made any smaller by it. The big telegraphed attacks are still worth walking out of. That last point is our reading, and this build makes it cheap to follow, because walking costs you no damage.

deaths:
  - situation: "A map with less Armour or reduced Chance to Block"
    cause: >-
      Your entire defence is those two numbers. The map takes part of it away
      before you reach the first pack.
    fix: >-
      Never run them. The author supplies a regex that catches both, together
      with the modifier that lets monsters avoid bleeding.
  - situation: "Chaos damage, in any amount you did not plan for"
    cause: >-
      This is the build's one thin layer. The author's finished level 98 file
      has 47% chaos resistance and survives a chaos hit of 20,810, against
      about 57,000 elemental: roughly a third. Those are 3.29-engine numbers
      for finished gear. In early maps the guide only asks you to push chaos
      resistance towards 0%.
    fix: >-
      Keep raising chaos resistance once the elemental resistances are
      capped, and budget extra before chaos-heavy content. The guide names no
      specific item for this, so neither do we.
  - situation: "A boss you reach through a portal or a loading screen"
    cause: >-
      Endurance charges are lost at the loading screen. The guide counts
      eight of them as 32% physical and 32% elemental damage reduction, and
      by our arithmetic they are +24% damage over time multiplier for
      bleeding as well, so you arrive both softer and weaker.
    fix: >-
      Press [[Enduring Cry]] before the fight starts. It is in the guide's
      warcry link from early maps, and each [[Kaom's Sign]] also carries a
      level 10 one.
  - situation: "The large hit that block does not catch"
    cause: >-
      Block is a chance. At the guide's 88%, roughly one hit in eight gets through,
      and block does nothing to shrink that one. What is left is armour,
      endurance charges and life: the author's finished file survives 21,800
      physical in a single hit, on a 3.29 engine with endgame gear. No source
      lists this as a cause of death; it follows from block being a roll.
    fix: >-
      Walk out of the big telegraphed attacks. The bleed keeps ticking while
      you do, so dodging costs this build no damage. A shield with "Recover
      5% of Life when you Block" refills you between hits; it does not help
      with the hit you failed to block.
  - situation: "A boss with a damage check, an enrage timer or a phase that must end quickly"
    cause: >-
      Bleed deals its damage at a fixed rate, and nothing you press makes it
      faster. The author's own verdict on his build is "damage not insane".
    fix: >-
      There is no fix in how you play. More damage means a better axe, or the
      [[Lacerate of Haemorrhage]] six-link the author keeps for uber pinnacle
      bosses. If fights like these are your plan for the league, this
      article's own advice is to pick another build.

troubleshooting:
  - symptom: "Nothing dies in one particular map"
    cause: >-
      Almost certainly "Monsters have a chance to avoid Poison, Impale and
      Bleeding". The author's words: if we do not bleed, we do not deal
      damage.
    fix: >-
      Reroll the map. This modifier, and the pair that cuts Armour or Chance
      to Block, are the two the build never runs.
  - symptom: "Bosses and Rare monsters take too long to die"
    cause: >-
      Part of this is the build, which has no burst. The parts you can fix
      are these. (a) You slam faster than the crack erupts, and cracks made
      before the first eruption get no aftershock. (b) You crossed a loading
      screen and have no endurance charges. (c) [[Vulnerability]] is not on
      the target, or the gem has no quality.
    fix: >-
      (a) Slam, wait for the eruption, slam again; [[Less Duration Support]]
      shortens the wait. (b) Press [[Enduring Cry]] on arrival. (c) Curse
      first and keep the quality on the gem: it is 30% increased physical
      damage taken.
  - symptom: "A new axe shows more damage per second, and bosses die no faster"
    cause: >-
      Bleed is worked out from the physical damage of the hit that applied
      it, not from damage per second. Attack speed is ninth on the author's
      own scaling list.
    fix: >-
      Compare axes by top-end physical damage; the milestone is 550 or more.
      Then check the socket under [[Earthquake]]: a socket of the gem's own
      colour gives +10% quality, which is 10% more aftershock damage.
  - symptom: "The character got worse right after the Merciless Labyrinth"
    cause: >-
      Most likely half a swap. [[Determined Survivor]] gives its block only
      with a shield, and the tree is still built for a two-handed axe until
      you respec it. Half of the change is worse than either end of it.
    fix: >-
      Do all three steps in one sitting: take Determined Survivor, equip a
      one-handed axe and a shield, and respec the two-handed nodes into
      block, shield and armour masteries. The published Path of Building has
      a tree named for this step.
  - symptom: "Clear is slow, and the loot is always behind you"
    cause: >-
      A slam at 75% of your attack speed, a one-second aftershock cycle and
      low mobility, which is the author's own listed weakness:
      [[Shield Charge]] and a Flame Dash are all the movement in his map gem
      sets. The explosions kill
      monsters you have already passed, and they need a dense pack to chain.
      The author rates his own map clear 3 out of 5.
    fix: >-
      A good loot filter, which is the author's own answer. Nothing in your
      character is broken; this is the pace of the build.
  - symptom: "Your life drops every time you attack"
    cause: >-
      [[Blood Magic]]. Skills cost life instead of mana in every tree
      variant, and the published file reads 55 life per use.
    fix: >-
      Nothing is wrong. The finished file regenerates about 1,100 life per
      second, on a 3.29 engine, and [[Vitality]] sits in the guide's aura
      link from the campaign on. What you give up is any mana-based panic
      button.

patch:
  - note: >-
      **Nothing in this build changed.** [[Gladiator]] is not mentioned once in
      the normal-game sections of the notes. No [[Earthquake]], [[Sunder]],
      [[Fist of War Support]], slam, bleed, aggravate or block changes appear
      anywhere.
  - entry: ruthless-changes
    note: >-
      **The one Gladiator line in the notes is not about you.** The only
      occurrence of the word "Gladiator" in the whole patch notes is inside the
      Ruthless section, and it refers to the Scion Ascendant's notable of that
      name dropping from 50% to 40% shield block. **The Duelist's
      [[Determined Survivor]] is still 50% in the normal game**, confirmed by
      the official tree data and restated independently by a second Maxroll
      author. If you read that Gladiator block was nerfed, that is the error.
  - entry: item-tiers
    note: >-
      **A direct gearing buff.** Rare and magic items now carry tiers from Act 6
      onward, influencing modifier tiers, base level, quality, sockets and
      links. This build wears eleven rare slots and crafts nearly everything, so
      it benefits more than most.
  - entry: mercenary-nerfs
    note: >-
      **Relative buff.** Mercenaries were cut hard and this build uses none.
  - entry: loot-rarity-rework
    note: >-
      **Well aligned.** Value now concentrates in rare and unique monsters and
      in bosses. A build its own author rates 4 out of 5 for bossing and 5 out
      of 5 for survivability is pointed at where the rewards are.
  - entry: league-fates
    note: >-
      **The best fit on this site, with one reservation.** The league lets you
      empower an area boss and then take [[Viscera]] from it for your
      [[Wickerman]]. Guaranteed aggravation is worth most exactly when your
      attack uptime is interrupted, which is what a harder boss fight with more
      hazards produces. Your damage also keeps ticking while you dodge. The
      reservation: none of this has been tested in 3.30 by anyone, including the
      author.
  - note: >-
      **One concrete nerf to your gearing path.** The author notes inline that
      recombinators were nerfed in 3.30 by a currently unknown amount. That
      degrades the cheaper of the two routes to the endgame axe. Magnitude
      untested; nobody has published a figure.
  - note: >-
      **A new defensive option the guide already uses.** 3.30 added Bloodline
      alternate ascendancies, and the author already integrates one of them as
      a swap for [[Jagged Technique]] if your jewels are not there yet. That is
      further evidence this guide is genuinely current.

strengths:
  - "The tankiest build on this site. About 88% block on attacks and spells, with 90% physical damage reduction."
  - "Damage keeps ticking while you dodge, so boss uptime is not a problem."
  - "Guaranteed bleed aggravation. No dice rolls, and no ramp after an interruption."
  - "Bleeding enemies you kill explode and the explosions chain."
  - "Easy to gear: Resolute Technique removes accuracy, Determined Survivor removes block hunting."
  - "Written for solo self-found by its author, with a documented no-suppression tree."
  - "The most current guide of the ten we looked at. The planner was saved on launch day."
weaknesses:
  - "Slow. 75% attack speed slams, a one-second aftershock cycle, and low mobility by the author's own list: Shield Charge and a Flame Dash are all the movement in his map gem sets."
  - "No burst. Bleed is a fixed-rate damage-over-time effect, so damage checks and enrage timers have no answer."
  - "Things die behind you. Fix it with a loot filter, not with the build."
  - "Chaos damage is the thin layer: 47% resistance and about a third of the elemental buffer."
  - "Blood Magic means no mana-based panic buttons, and every skill use costs life."
  - "Two map modifiers shut you down completely rather than slowing you."
  - "The mid-campaign two-hand to one-hand switch is a real restructure, not a tweak."
avoidIf: >-
  Pick something else if you are a clear-speed player. The author's own map
  clear rating is 3 out of 5, and that is with explosions. Skip it too if you
  want to delete bosses quickly rather than outlast them, if you will not do a
  six-link gem swap for uber pinnacles, or if you dislike respeccing — the
  two-hand to one-hand transition is a genuine mid-campaign restructure. And if
  your league plan is chaos-heavy content, budget extra chaos resistance before
  you start.

