name: Shrapnel Ballista Hierophant
tagline: >-
  A strength stacker where Strength is your damage, your block chance and the
  number of totems you can place. Built to kill uber bosses, not to map.
class: Templar
ascendancy: Hierophant
role: endgame
budget: extreme
budgetNote: >-
  **~150 Divine Orbs, and that figure is stated for 3.29, not 3.30.** It is the
  only published budget for this build, and the guide also requires a level 94+
  character you are willing to transplant. There is no 50 / 300 / mirror
  breakdown anywhere; what exists is three Path of Building files at three
  equipment levels, which is how the stages below are organised. Prices for
  [[Replica Iron Commander]] in particular are unusable — third-party mirrors
  citing the same source report 2 chaos, 12, and about 2,126, all dated four
  months ago and from the wrong league. We quote none of them.
mainSkill: Shrapnel Ballista
image: shrapnel-ballista
hero: art-hierophant
tags: [Bow, Totems, Chaos damage, Strength stacker, Boss killer]
ratings: { clear: 2, bossing: 5, survivability: 4, ease: 3 }
verified: "2026-11-13"
confidence: predicted
confidenceNote: >-
  **The four ratings are our editorial reading. The guide publishes no rating
  table at all** — we checked specifically. poe-vault shows four tags (Boss
  Killer, Ranged, High Budget, Extreme Budget) and a vote widget, and nothing
  else. Clear is a 2 because the guide never claims the build maps well, only
  that it survives map modifiers, and its own weakness list names shorter range
  than the alternatives. Bossing is a 5 on the strength of what it is pitched
  at and the damage its files report. Survivability is a 4 rather than 5
  because roughly 2,000 life regeneration per second is load-bearing and no
  source addresses no-regeneration maps. **The whole guide is also a 3.29 guide
  wearing a 3.30 label** — see the patch notes section.
modes:
  ssf: >-
    Not realistic. The build is five specific unique items deep before it
    functions, one of them a [[Replica Iron Commander]], and its own guide
    assumes a trade economy and a level 94+ character to transplant.
  hardcore: >-
    No source discusses it. On paper the layered defences suit it, but the
    recovery is regeneration you can lose to a map modifier, totems die and
    need resummoning mid-fight, and nobody has tested any of this in 3.30.

idea: |
  This build turns Strength into everything. [[Replica Alberon's Warpath]] gives you chaos damage for every 80 Strength you have, [[The Iron Fortress]] gives you block chance for every 50 Strength, and [[Replica Iron Commander]] gives you another totem for every 200 Strength. So the one stat you stack pays you three times.

  You do not attack. You place [[Shrapnel Ballista]] totems, which fire arrows that fragment into several hits each, and then you stand back. Because the damage is chaos, it goes straight through enemy energy shield.

  [[Crown of Eyes]] is the piece that ties it together: it makes increases to spell damage apply to your attacks instead. That is why the cluster jewel you must buy is the one whose small passives give increased spell damage — each of those becomes attack damage at 150% of its value.

chain:
  - label: Stack Strength
    text: "[[Astramentis]], [[Helical Ring]], a Strength belt, [[Split Personality]], [[Lethal Pride]] and [[Inertia]]. The published files reach 2,665–3,351 Strength."
  - label: Strength becomes damage
    text: "[[Replica Alberon's Warpath]] adds 1 to 80 chaos damage to attacks per 80 Strength. At 2,700 Strength that is roughly 33 rolls of 1–80 added to every hit."
  - label: Strength becomes totems
    text: "[[Replica Iron Commander]] gives [[Shrapnel Ballista]] +1 maximum totem per 200 Strength. The breakpoints that matter are 1,800, 2,000 and 2,200."
  - label: Spell damage becomes attack damage
    text: "[[Crown of Eyes]] makes increases to spell damage apply to attacks at 150%. A spell-damage [[Large Cluster Jewel]] is therefore a damage item."
  - label: Survive
    text: "Over 50% block from Strength, 90% physical damage reduction, and about 2,000 life regenerated per second from [[Ritual of Awakening]] and [[Fertile Will]] — which scales with totem count."

chainDetails:
  - title: What Shrapnel Ballista actually does
    body: |
      It is a Dexterity bow gem with the Attack, Projectile, Totem and Bow tags. Each totem fires three arrows that fragment, so one attack lands several hits.

      The numbers that shape the build: attack damage is **46–53%** of base, attack speed is **50%** of base, the totem lasts **8 seconds**, and the gem itself grants **+2 to 3 maximum Summoned Ballista Totems**, rising to +4 at gem level 22. It lost its physical tag in 3.25, which is why nothing physical is in the links.

      The 8-second duration is the playstyle. You are resummoning constantly, and the guide lists totems dying in some fights as a real weakness.
  - title: How many totems, actually
    body: |
      **No source states a total.** The guide never prints one, which for a build whose damage is "per totem times N totems" is a surprising gap.

      Adding up what the guide does say: 1 base, +4 from the gem at level 22, +1 from [[Pursuit of Faith]], +1 from the [[Watchtowers]] anoint, and one more per 200 Strength from the bow. At 2,712 Strength that is around 20. **That arithmetic is ours, not the author's**, and you should check it in Path of Building rather than trust it.

      Two things follow. First, the chest wants a corruption that gives +1 socketed gems or +2 socketed projectile gems, because that is what pushes the gem to level 22 and unlocks the fourth innate totem. Second, totem count is also a defensive statistic — see the regeneration note below.
  - title: Why the totem count is a defence
    body: |
      [[Ritual of Awakening]] gives 3% more damage, 1% life regeneration and 0.5% mana regeneration **per totem**. [[Fertile Will]] adds 100% increased damage, 3% maximum life regenerated per second and stun immunity while you have a Beast Spectre — a Perfect Guardian Turtle, which throws in a free Determination aura.

      Together that is roughly 2,000 life per second on a character with only 6,079–6,645 life. Almost none of this build's survivability is a pool. It is block, evasion, suppression, 90% physical damage reduction and regeneration.

      **The unverified risk:** that regeneration, plus [[Lifetap Support]] in four separate gem setups, should make no-regeneration maps painful. The guide claims it handles all Tier 16 modifiers and never addresses the question. No source confirms or denies it. Treat it as an open risk, not a finding.
  - title: Three things people get wrong about this build
    body: |
      **It does not use an [[Artillery Quiver]].** It uses a crafted [[Penetrating Arrow Quiver]]. The Artillery Quiver belongs to the same author's Explosive Arrow build. This matters because the 3.30 quiver buff everybody is quoting lands on *that* build, not this one.

      **There is no Forbidden Flesh and Flame pair, and no Militant Faith.** The timeless jewel is [[Lethal Pride]]. [[Headhunter]], Legacy of Fury, Kaom's Spirit and Enlighten appear nowhere in the gear page either.

      **The anoint is [[Watchtowers]], not Surveillance.** One cross-reference describes Surveillance as giving a generic extra totem; PoEDB's current wording makes its +1 Ballista-specific. Either way, this build's amulet takes Watchtowers.
  - title: The numbers, and exactly what they assume
    body: |
      Three published Path of Building files, all **level 100 and all labelled 3.29**. Neither the guide text nor the gem page prints a single damage figure — every number below was read out of the files.

      | Tier | Damage per second | Effective hit points | Life | Strength |
      |---|---|---|---|---|
      | Entry, no Mageblood | 40,059,064 | 90,616 | 6,645 | 2,712 |
      | Mid, with Mageblood | 34,397,880 | 114,091 | 6,079 | 2,665 |
      | Min-max | 71,803,952 | 118,421 | 6,191 | 3,351 |

      **Read those with the configuration attached: 3 frenzy charges, 15 Wither stacks, no boss target set, 3.29 engine.** There is no Sirus, Maven or Uber Elder flag, no enemy level, no power charges, no shock, no exposure, no enemy resistances, no flask state and no totem count. These are not uber-boss damage claims, and Path of Building has not been updated for 3.30, so even the defensive figures are pre-patch.

      One real finding does fall out of the table: the entry tier trades about 24,000 effective hit points for about 5.6 million damage against the Mageblood tier. **[[Mageblood]] is a defensive purchase in this build, not a damage one** — the author says it costs you roughly 200 Strength, a whole totem, and is worth it anyway.

mandatory:
  - term: Replica Iron Commander
    why: >-
      Gives [[Shrapnel Ballista]] +1 maximum totem per 200 Strength. Without
      it, stacking Strength stops being a totem-count decision and the build
      has no identity.
    detail: >-
      Blessed Orb the implicit. The gear page names 1,800 / 2,000 / 2,200
      Strength as the breakpoints; the main guide sets a hard floor of 2,000.
      That floor is the real purchase principle: buy whatever cheapest
      Strength crosses the next 200. **That reading is ours — no source
      states it as advice.**
  - term: Replica Alberon's Warpath
    why: >-
      Adds 1 to 80 chaos damage to attacks per 80 Strength. This is where the
      damage comes from. Remove it and you have totems that do nothing.
    detail: >-
      It is also why the build deals chaos, which bypasses energy shield, and
      why the links are [[Void Manipulation Support]],
      [[Withering Touch Support]] and [[Volatility Support]] rather than
      anything physical. Corrupted copies must still read at least 1 to 80
      chaos per 80 Strength.
  - term: Crown of Eyes
    why: >-
      Makes increases and reductions to spell damage apply to your attacks at
      150% of their value. It is what turns the passive tree's spell nodes
      into attack damage.
    detail: >-
      "More" and "less" multipliers do not carry over — only increases and
      reductions. That distinction is why the mandatory
      [[Large Cluster Jewel]] base is the one whose small passives give 10%
      increased spell damage: each becomes 15% increased attack damage. Want
      a decent accuracy roll on the helmet too.
  - term: The Iron Fortress
    why: >-
      +1% chance to block attack damage per 50 Strength, plus up to +120
      Strength and 80–100% increased armour. It is the whole block layer.
    detail: >-
      The normal version, **not** the Foulborn one, which swaps attack and
      spell block. Spell block is Unlucky on this chest, which is a real
      downside you accept. Ideally corrupted with +1 socketed gems or +2
      socketed projectile gems, to reach [[Shrapnel Ballista]] level 22 and
      its fourth innate totem.
  - term: Maligaro's Virtuosity
    why: >-
      Sets critical strike multiplier to 300%, so you spend nothing else in
      the build on crit multiplier. One slot replaces a whole scaling axis.
  - term: Astramentis
    why: >-
      The Strength base. Blessed Orb the implicit, twenty Intrinsic Catalysts
      on it, and anoint [[Watchtowers]] for the extra totem.
  - term: Penetrating Arrow Quiver
    why: >-
      Crafted, not unique. It must carry: bow attacks fire an additional
      arrow, projectiles pierce 2 additional targets, and tier-1 Strength.
    detail: >-
      This is the slot people get wrong. It is **not** an
      [[Artillery Quiver]], despite what you will read about the 3.30 quiver
      buff. The buff is real and it applies to the author's Explosive Arrow
      build. Whether this build should move its crafted modifiers onto an
      Artillery base for a free totem is **the obvious 3.30 question and no
      source addresses it.**
  - term: Helical Ring
    why: >-
      Tier-1 Strength plus tier-1 all attributes, twice. The budget version
      is a rare with a fractured +12 to 16 all attributes.
  - term: Pursuit of Faith
    why: >-
      First ascendancy point. An extra totem and faster totem placement,
      which on an 8-second-duration build is quality of life you need from
      the start.
  - term: Ritual of Awakening
    why: >-
      3% more damage, 1% life regeneration and 0.5% mana regeneration per
      totem. It is simultaneously your biggest damage node and your recovery.
  - term: Fertile Will
    why: >-
      100% increased damage, 3% maximum life regenerated per second and stun
      immunity while you have a Beast Spectre. The spectre is not optional.
    detail: >-
      The spectre is a Perfect Guardian Turtle, raised with [[Raise Spectre]]
      at gem level 20 or higher, which also gives you a free Determination
      aura. The budget version is an ordinary Guardian Turtle. If the spectre
      dies you lose the regeneration and the stun immunity together.
  - term: Large Cluster Jewel
    why: >-
      Twelve passives on the 10% increased Spell Damage base, with high
      Strength and increased effect. Through [[Crown of Eyes]] every one of
      those small passives is attack damage.
  - term: Watcher's Eye
    level: recommended
    why: >-
      The guide wants increased chaos resistance while affected by
      [[Purity of Elements]]. Alternatives it names are evade chance under
      [[Grace]], or all maximum elemental resistances under Purity of
      Elements.
  - term: Mageblood
    level: recommended
    why: >-
      A defensive purchase here, not a damage one. It costs you about 200
      Strength — a whole totem — and pays it back in capped resistances,
      movement speed, permanent phasing and better suppression.
    detail: >-
      The published files bear this out: the Mageblood version has lower
      damage and about 24,000 more effective hit points than the entry
      version. Both numbers are 3.29 Path of Building figures. Do not pay the
      Foulborn premium — its modifier is rightmost flasks instead of
      leftmost, which is equivalent, not better. What matters is the 4-flask
      roll.
  - term: Lethal Pride
    level: recommended
    why: >-
      The timeless jewel for this build. Strength from Karui notables in its
      radius. Note it is Lethal Pride, not Militant Faith, whatever you read
      elsewhere.
  - term: Simplex Amulet
    level: recommended
    why: >-
      The more expensive strength-stacking amulet, used in the min-max file
      in place of [[Astramentis]]. Part of why that file reaches 3,351
      Strength.
  - term: Bound by Destiny
    level: recommended
    why: >-
      +15% Strength if you are wearing two Warlord-influenced items.
      Min-max only.
  - term: Bottled Faith
    level: recommended
    why: >-
      Replaces the Sulphur flask in the non-Mageblood setup, as can
      [[Progenesis]]. Irrelevant once Mageblood is in.

labs:
  - lab: Normal
    node: Pursuit of Faith
    why: "An extra totem and faster placement. Taken first because an 8-second totem needs to go down fast."
  - lab: Cruel
    node: Ritual of Awakening
    why: "Damage, life regeneration and mana regeneration per totem. The node that makes totem count a defensive statistic."
  - lab: Merciless
    node: Conviction of Power
    why: "Power charges and endurance charges for a Hierophant who generates neither on its own."
  - lab: Eternal
    node: Fertile Will
    why: "100% increased damage, 3% maximum life per second and stun immunity, as long as the Beast Spectre is alive."

stages:
  - id: transition-in
    image: artillery-quiver
    title: Transition in
    levels: From the Explosive Arrow starter, level 94+
    uses: >-
      [[Explosive Arrow]] ballista totems on a Hierophant, which is the
      author's own league starter and the on-ramp his guides name. That build
      uses the [[Artillery Quiver]] and does benefit from the 3.30 buff.
    changes: >-
      The starter guide says it outright: if you want uber pinnacle farming or
      Tier 17 maps, move to Shrapnel Ballista. More powerful, similar
      playstyle, much more expensive. The Shrapnel guide itself only says
      "transition from another Templar build".
    links:
      - name: Main skill (starter, as the Explosive Arrow guide prints it)
        gems: [Explosive Arrow, Ballista Totem Support, Elemental Damage with Attacks Support, Lifetap Support, Combustion Support, Cruelty Support]
      - name: Auras
        gems: [Purity of Elements, Grace]
      - name: Utility
        gems: [Dash, Second Wind Support, Steelskin, Automation]
    moveOn: "you are level 94+, you have roughly 150 Divine to spend, and you have decided you want a boss killer rather than a mapper."
    details:
      - title: Why this build has an entry requirement
        body: |
          "Not designed for new players" is the only item in the guide's own formal weakness list. The rest of the entry cost is practical: you need a level 94+ character to transplant, and you need the currency to buy five uniques before anything works.

          There is no version of this build that functions on partial gear. Without [[Replica Alberon's Warpath]] there is no damage; without [[Replica Iron Commander]] there is no reason to stack Strength; without [[Crown of Eyes]] the tree does nothing.
      - title: The quiver question nobody has answered
        body: |
          3.30 changed the [[Artillery Quiver]] implicit to +1 maximum summoned totem for attack skills, and existing copies are unaffected, so you need a new one.

          This matters for the starter you are leaving, which names a crafted Artillery Quiver as best in slot. It does **not** reach the build you are moving to, which uses a crafted [[Penetrating Arrow Quiver]] for the extra arrow and the pierce.

          Whether the Shrapnel build should migrate its crafted modifiers onto an Artillery base for the free totem is our speculation. The guide has not been updated to consider it.
  - id: entry
    image: replica-iron-commander
    title: Entry tier
    levels: ~150 Divine, 3.29 figure
    uses: >-
      [[Replica Iron Commander]], [[Crown of Eyes]], [[The Iron Fortress]],
      [[Maligaro's Virtuosity]], [[Replica Alberon's Warpath]],
      [[Astramentis]] and a crafted [[Penetrating Arrow Quiver]]. A rare
      [[Heavy Belt]] and [[Helical Ring]] pair underneath.
    changes: >-
      Everything at once, because nothing works alone. The Path of Building
      for this tier reports **40,059,064 damage per second and 90,616
      effective hit points** at 2,712 Strength — 3.29 engine, 3 frenzy
      charges, 15 Wither stacks, no boss target set.
    links:
      - name: Main skill (chest)
        gems: [Shrapnel Ballista, Void Manipulation Support, Withering Touch Support, Volatility Support, Increased Critical Strikes Support, Lifetap Support]
      - name: Bow
        gems: [Automation, Lifetap Support, Steelskin, Blood Rage, Convocation, Despair]
      - name: Helm, aura pair
        gems: [Purity of Elements, Grace]
      - name: Helm, second pair
        gems: [Frenzy, Lifetap Support]
      - name: Gloves, aura pair
        gems: [Precision, Arrogance Support]
      - name: Gloves, spectre pair
        gems: [Raise Spectre, Companionship Support]
      - name: Boots
        gems: [Dash, Second Wind Support, Lifetap Support]
    moveOn: "you are past 2,000 Strength, the Beast Spectre is a Guardian Turtle, and you can clear Simulacrum."
    details:
      - title: Flasks, non-Mageblood
        body: |
          [[Life Flask]] — must have Corrupted Blood immunity and Instant Recovery. Then [[Diamond Flask]], [[Quartz Flask]], [[Quicksilver Flask]] and [[Sulphur Flask]].

          All at 20% quality. Set the utility flasks to "Used When Charges Reach Full" and stop thinking about them. [[Bottled Faith]] or [[Progenesis]] can replace the Sulphur flask once you can afford one.
      - title: The jewels the gear page calls core
        body: |
          [[Rain of Splinters]] for +2 projectiles, [[The Light of Meaning]] for chaos resistance, [[Emperor's Mastery]], [[Lethal Pride]], two [[Split Personality]], [[Inertia]] placed near Elemental Equilibrium, a medium cluster with [[Sleepless Sentries]] for permanent Onslaught, and the twelve-passive spell-damage [[Large Cluster Jewel]].

          The budget substitutions the gear page gives, in order: a rare Strength, life and resistance jewel or Emperor's Might before [[Emperor's Mastery]]; a plain Guardian Turtle before the Perfect one; Enhance before the cooldown recovery support.
      - title: Avoid four-links in the gloves and helm
        body: |
          The guide warns against them in both items, in the same words: "For the gems to work, you don't want a 4-link setup". It gives no reason beyond pointing at a picture.

          What it prints for each item is two separate pairs. The helmet holds the two auras and, apart from them, Frenzy with Lifetap. The gloves hold Precision with Arrogance and, apart from them, the spectre with Companionship Support — Minion Life Support on a budget.

          Our reading of the reason, which the guide does not state: a support applies to everything linked to it. Link all four and Lifetap is on your auras and Arrogance is on your spectre.
  - id: mageblood
    image: mageblood
    title: Mid budget
    levels: The Mageblood swap
    uses: >-
      [[Mageblood]] with a 4-flask roll, [[Kalandra's Touch]], and the flask
      suite rebuilt around magic utility flasks.
    changes: >-
      You lose about 200 Strength — a whole totem — and gain capped
      resistances, movement speed, permanent phasing and better suppression.
      The published file for this tier reads **34,397,880 damage per second
      and 114,091 effective hit points**: lower damage, 24,000 more effective
      hit points. Same 3.29 caveats.
    links:
      - name: Main skill (chest)
        gems: [Shrapnel Ballista, Void Manipulation Support, Withering Touch Support, Volatility Support, Increased Critical Strikes Support, Lifetap Support]
      - name: Bow
        gems: [Automation, Lifetap Support, Steelskin, Blood Rage, Convocation, Despair]
      - name: Helm, aura pair
        gems: [Purity of Elements, Grace]
      - name: Helm, second pair
        gems: [Frenzy, Lifetap Support]
      - name: Gloves, aura pair
        gems: [Precision, Arrogance Support]
      - name: Gloves, spectre pair
        gems: [Raise Spectre, Companionship Support]
    moveOn: "resistances are overcapped by 40–50% and you are farming ubers rather than learning them."
    details:
      - title: Mageblood is the defensive purchase
        body: |
          This is the one genuinely interesting trade in the build, and the author is straight about it: switching to Mageblood costs you a totem, and it is still correct.

          So buy it when your problem is dying, not when your problem is damage. If you are killing bosses and surviving, [[Simplex Amulet]] and more Strength is the better place for the same currency. The guide prints no price for Mageblood, and neither do we.
      - title: Mageblood flasks
        body: |
          [[Life Flask]] (Divine), then Topaz, Sapphire, Quicksilver and Ruby. Each wants the 70% increased effect enchantment, suffixes covering armour, crit, evasion or additional elemental resistance during effect, and a prefix of 25% increased effect.

          **Do not pay the Foulborn premium on Mageblood.** Its modifier is rightmost flasks rather than leftmost — the same thing, differently worded. The roll that matters is 4 flasks, and the Foulborn copies carried roughly an 18 Divine premium at 3.29 prices for nothing.
  - id: min-max
    image: simplex-amulet
    title: Min-max
    levels: 3,351 Strength
    uses: >-
      [[Simplex Amulet]] in place of [[Astramentis]], [[Bound by Destiny]],
      and corruptions on gloves, helmet, boots and chest.
      [[Kalandra's Touch]] is not new at this tier: it is already in the
      Mageblood file.
    changes: >-
      Strength goes from about 2,665 to 3,351, which is three more totems and
      a great deal more chaos damage. The published file reports
      **71,803,952 damage per second and 118,421 effective hit points** — the
      highest number of the three, with the same missing configuration.
    links:
      - name: Main skill (chest)
        gems: [Shrapnel Ballista, Void Manipulation Support, Withering Touch Support, Volatility Support, Increased Critical Strikes Support, Lifetap Support]
      - name: Bow
        gems: [Automation, Lifetap Support, Steelskin, Blood Rage, Convocation, Despair]
    moveOn: "there is no next stage. No source describes anything beyond this file."
    details:
      - title: What the min-max file actually reports
        body: |
          14,437 armour, 11,156 evasion, 64% evade chance, 100% hit chance. Maximum hits taken: 13,262 physical, 58,451 fire, 58,451 cold, 65,327 lightning, 21,566 chaos. Character resistances 84/84/86 with 59% chaos.

          Every one of those is computed on the 3.29 engine against **no boss target**. There is no mirror tier described for this build by anyone, so this file is the top of the published ladder.
      - title: The corruptions worth chasing
        body: |
          The chest corruption is the one that pays: +1 socketed gems or +2 socketed projectile gems takes [[Shrapnel Ballista]] to level 22 and gives you the fourth innate totem. [[Maligaro's Virtuosity]], [[Crown of Eyes]] and [[Replica Alberon's Warpath]] all have corruption outcomes the gear page lists as worth trying, but a corrupted Alberon's must still read at least 1 to 80 chaos per 80 Strength or it is scrap.
      - title: No awakened gems
        body: |
          The gem page lists none at all. That is a gap in the guide rather than proof they are worthless, but it means nobody has published what an awakened version of this link is worth. Do not assume the usual upgrades apply.

powerCurve: |
  Damage here is damage per totem multiplied by the number of totems, and Strength is on both sides of that sum. [[Replica Alberon's Warpath]] turns every 80 Strength into added chaos damage on each hit; [[Replica Iron Commander]] turns every 200 Strength into another totem; and [[Ritual of Awakening]] then pays 3% more damage per totem on top. The same two numbers are the defence: [[The Iron Fortress]] turns Strength into block, and each totem is 1% life regeneration.

  There is no early part to this curve. Nothing works alone — no boots, no damage; no bow, no reason to stack Strength; no [[Crown of Eyes]], and the tree does nothing — so the character goes from not functioning to the entry tier in one purchase. The entry file reports about 40 million damage per second at 2,712 Strength. That is a 3.29 figure with 3 frenzy charges, 15 Wither stacks and no boss target set.

  After that, power arrives in lumps, and this is our reading of why. A point of Strength adds a little chaos damage, but a totem arrives only at each 200, and a totem is damage, a Ritual of Awakening stack and regeneration at once. So upgrades feel like nothing, nothing, then a jump. It is also why [[Mageblood]] is a sideways step: about 200 Strength lost, a whole totem, for about 24,000 more effective hit points in the published files.

  The top of the published ladder is the min-max file at 3,351 Strength: three more totems and about 72 million, with the same missing configuration. What never improves is clearing. The totems last 8 seconds, their range is shorter than the other ballista builds, and the guide never claims this maps well.

upgrades:
  - step: "The whole entry set at once: [[Replica Iron Commander]], [[Replica Alberon's Warpath]], [[Crown of Eyes]], [[The Iron Fortress]], [[Maligaro's Virtuosity]], [[Astramentis]] with the [[Watchtowers]] anoint, a crafted [[Penetrating Arrow Quiver]] and the twelve-passive spell-damage [[Large Cluster Jewel]]"
    cost: "3.29: about 150 Divine for the entry tier — the only published budget"
    why: >-
      It is first because there is no order inside it: nothing works alone.
      The boots are the damage, the bow is the totem count, the helmet makes
      the tree work, the chest is the block. Buying half of it buys nothing.
      Budget extra for the quiver: in 3.30 its "Prefixes cannot be changed"
      craft costs 4 Divine plus 4 Blessed.
  - step: "Strength up to the next 200: past 2,000, then 2,200"
    why: >-
      The guide sets a hard floor of 2,000 Strength and names 1,800, 2,000
      and 2,200 as the breakpoints. Each one is a totem, and a totem is
      damage, 3% more damage on every other totem, and 1% life regeneration.
      The buying rule — take whatever cheapest Strength crosses the next 200
      — is our reading; no source states it as advice.
  - step: "A corrupted [[The Iron Fortress]] with +1 socketed gems or +2 socketed projectile gems"
    why: >-
      It takes [[Shrapnel Ballista]] to level 22, which unlocks the gem's
      fourth innate totem. The article calls it the corruption that pays. We
      put it straight after the Strength floor because it is a totem you
      cannot get from Strength at any price; where it falls by cost we cannot
      say, because nothing prices it.
  - step: "Undo the budget substitutions: [[Emperor's Mastery]], then a Perfect Guardian Turtle, then the cooldown recovery support in place of Enhance"
    why: >-
      That is the gear page's own order. The Perfect turtle adds a free
      Determination aura to the regeneration and stun immunity that
      [[Fertile Will]] already gives through the plain one. These sit below
      the totem steps because none of them adds a totem.
  - step: "[[Mageblood]] with a 4-flask roll — if your problem is dying"
    why: >-
      A defensive purchase, not a damage one: capped resistances, movement
      speed, permanent phasing and better suppression, for about 200
      Strength. The published files show lower damage and about 24,000 more
      effective hit points. Do not pay extra for a Foulborn copy; at 3.29
      prices that was roughly 18 Divine for an equivalent modifier.
  - step: "[[Simplex Amulet]] and more Strength — if your problem is damage"
    why: >-
      The article is direct about the choice: if you are killing bosses and
      surviving, this is the better use of the same money than Mageblood. It
      replaces Astramentis and is part of how the min-max file reaches 3,351
      Strength.
  - step: "[[Bound by Destiny]], corruptions on the gloves, helmet and boots, and [[Kalandra's Touch]] once one ring is worth copying"
    why: >-
      The last stretch of Strength. Bound by Destiny is +15% Strength while
      you wear two Warlord-influenced items. Together with the amulet this is
      three more totems in the published file. The gear page's use for
      Kalandra's Touch is to mirror an expensive ring into your other ring
      slot; it is already in the published Mageblood file, so it is not a
      min-max-only piece. These are last because they are the most currency
      per totem on the list — our judgement, since no source prices any of
      it. A corrupted Alberon's must still read at least 1 to 80 chaos per 80
      Strength.

play:
  mapping: |
    1. Place the [[Shrapnel Ballista]] totems and stand back. They do all of the damage.
    2. Place them again. They last 8 seconds, so you are resummoning the whole time, and their range is shorter than the other ballista builds — you place closer and more often than you expect.
    3. Move with [[Dash]].
    4. Leave the rest alone. [[Steelskin]] and [[Blood Rage]] sit on [[Automation]] in the bow, and the utility flasks use themselves when full.

    [[Despair]] and [[Frenzy]] are in the links but are not for maps: the guide's gem page says you do not need the curse for general mapping and do not need to spam Frenzy there. One gap we will not paper over: Tier 17 and Tier 16.5 maps need a modifier filter that the guide does not supply.
  bossing: |
    Two buttons you ignored in maps come into use, and keeping totems on the field becomes the whole job.

    1. Check the Beast Spectre is alive before you go in. [[Fertile Will]] gives nothing without it.
    2. Cast Despair on the boss by hand. The guide's words are "Manually cast Despair on hard bosses", and it calls Frenzy "useful for bossing".
    3. Place the totems, and place them again before they expire rather than after. The guide lists totems dying in some fights as a real weakness.
    4. Treat the totem count as your life bar as well as your damage. Each totem is 1% life regeneration from [[Ritual of Awakening]], so a fight that clears your totems also cuts your recovery. That link is our reading of the node, not something the guide says about bossing.
    5. Stay out of what you can see coming. Block, evasion and suppression are chances.

    The published damage assumes 15 Wither stacks. [[Withering Touch Support]] is in the main link, so we read the opening seconds of a fight as weaker than the number; no source says how long the stacks take.

deaths:
  - situation: "The Beast Spectre dies in the middle of a fight"
    cause: >-
      The article states the mechanism: if the spectre dies you lose the
      regeneration and the stun immunity together, because [[Fertile Will]]
      only works while you have a Beast Spectre. That it is a usual death is
      our inference; no source reports how this build dies.
    fix: >-
      [[Raise Spectre]] at gem level 20 or higher, and check the turtle
      before every boss. [[Convocation]] is in the bow link; we read that as
      being there to keep it beside you.
  - situation: "Your totems are gone and your life stops coming back"
    cause: >-
      Our reasoning from the node text. [[Ritual of Awakening]]'s
      regeneration is per totem, the totems last 8 seconds and die in some
      fights, and almost none of this build's survivability is a pool: about
      2,000 life per second on a little over 6,000 life.
    fix: >-
      Resummon early, not late. [[Pursuit of Faith]]'s placement speed is
      what makes that possible; treat an empty field as an emergency, not as
      a gap in damage.
  - situation: "A map with no regeneration"
    cause: >-
      An open risk, not a finding. The regeneration is load-bearing and
      [[Lifetap Support]] is in four separate setups, so this modifier should
      hurt badly. The guide claims the build handles every Tier 16 modifier
      and never addresses it. No source confirms or denies it.
    fix: >-
      Until someone has tested it in 3.30, skip the modifier. We have no
      measured answer to give you.

troubleshooting:
  - symptom: "You have fewer totems than you expected"
    cause: >-
      No source states a total, so check each contributor: Strength against
      the next 200 on [[Replica Iron Commander]], the gem at level 22 for its
      fourth innate totem, [[Pursuit of Faith]], and the [[Watchtowers]]
      anoint — not Surveillance. Our own sum comes to around 20 at 2,712
      Strength.
    fix: >-
      Count them in Path of Building rather than trusting our arithmetic,
      then buy the cheapest Strength that crosses the next 200.
  - symptom: "The totems fire and almost nothing dies"
    cause: >-
      One of the pieces that makes the damage is missing or wrong. A
      corrupted [[Replica Alberon's Warpath]] that no longer reads at least
      1 to 80 chaos per 80 Strength is scrap. And [[Crown of Eyes]] only
      carries increases across, so the [[Large Cluster Jewel]] must be the
      base whose small passives give 10% increased spell damage.
    fix: >-
      Read the boots' chaos line and the cluster's base before anything
      else. There is no version of this build that works on partial gear.
  - symptom: "Attack block is far lower than the guide's"
    cause: >-
      You have the Foulborn [[The Iron Fortress]], which swaps attack and
      spell block. Or your Strength is lower than the file's: the chest
      gives 1% attack block per 50 Strength.
    fix: >-
      The normal version of the chest. Spell block is Unlucky on it either
      way; that downside comes with the item.
  - symptom: "Your Path of Building number is well under the published one"
    cause: >-
      The published files are configured with 3 frenzy charges and 15 Wither
      stacks, at level 100, on the 3.29 engine, with no boss target set.
      They are not boss numbers, and they are not your numbers until your
      configuration matches.
    fix: >-
      Match the configuration before comparing, and then compare Strength:
      the three files sit at 2,712, 2,665 and 3,351.
  - symptom: "You bought Mageblood and your damage went down"
    cause: >-
      That is the trade working as described. It costs about 200 Strength,
      which is a whole totem; the published Mageblood file has less damage
      than the entry file and about 24,000 more effective hit points.
    fix: >-
      Nothing is broken. If damage was your problem, the article's answer
      was [[Simplex Amulet]] and more Strength instead.
  - symptom: "Crafting the quiver costs far more than the guide implies"
    cause: >-
      3.30 changed the crafting the guide was written against. Meta-modifier
      recipes moved to Nightmare Maps, and "Prefixes cannot be changed" on
      armour and quivers now costs 4 Divine plus 4 Blessed — exactly the
      craft the [[Penetrating Arrow Quiver]] needs.
    fix: >-
      Budget for it, or buy a finished quiver. It must carry an additional
      arrow, pierce 2 additional targets and tier-1 Strength.

patch:
  - note: >-
      **The headline caveat: this is a 3.29 guide wearing a 3.30 label.** The
      page is dated the day before launch, its body text says it is for
      "the current Patch 3.29", every attached Path of Building is marked
      3.29, and the video it promises is a 3.29 video. **Nothing on any of its
      four sub-pages mentions a single 3.30 change.** Read every number here
      as a 3.29 number.
  - note: >-
      **The quiver buff everyone is quoting does not reach this build.** The
      [[Artillery Quiver]] implicit is now +1 maximum summoned totem for
      attack skills — but this build wears a crafted
      [[Penetrating Arrow Quiver]]. The buff lands on the Explosive Arrow
      starter you transition *from*.
  - entry: meta-crafting-costs
    note: >-
      **This one lands directly, and it is negative.** Meta-modifier recipes
      moved to Nightmare Maps, which gates a build whose belt, quiver and
      ring crafts all use them. "Prefixes cannot be changed" on armour and
      quivers now costs 4 Divine plus 4 Blessed, which is exactly the
      mandatory quiver craft. The Recombinator takes the selected input's
      item level and cannot touch corrupted items, and Rog now offers 1, 3
      or 5 rerolls instead of 3, 6 or 10.
  - entry: ruthless-changes
    note: >-
      **Ignore any article telling you Hierophant was buffed.** Every
      Hierophant change in 3.30 — [[Pursuit of Faith]] totem duration,
      [[Arcane Blessing]] granting 8% more spell damage, Illuminated
      Devotion's rework — sits in the Ruthless-specific section and does not
      apply to the normal game. No source we read made this mistake for this
      build, but it is the most likely error you will meet elsewhere.
  - note: >-
      **No ballista changes and no totem changes in the normal game at all.**
      [[Shrapnel Ballista]] is untouched.
  - note: >-
      **Net: neutral to slightly negative.** No buff reaches the build, and
      self-crafting on two mandatory slots costs meaningfully more.

strengths:
  - "Built for one job and good at it: uber bosses, Simulacrum, Tier 17 and Tier 16.5 maps."
  - "Layered defence: over 50% block, over 60% evade, 90% physical damage reduction, high suppression, ailment immunity, about 2,000 life per second."
  - "Low-effort playstyle. The totems kill; you place and reposition them."
  - "Chaos damage bypasses enemy energy shield entirely."
  - "Handles every Tier 16 map modifier and every Eater of Worlds altar modifier, per the guide."
  - "One stat to shop for. Any cheap source of Strength is an upgrade."
weaknesses:
  - "Shorter range than the Siege Ballista and Explosive Arrow versions. This is the mapping cost, and the guide never claims it maps well."
  - "Totems last 8 seconds and die in some fights. You resummon constantly."
  - "Explicitly not for new players, by the guide's own weakness list."
  - "Needs an existing level 94+ character and roughly 150 Divine, a figure stated for 3.29."
  - "Tier 17 and Tier 16.5 need a map-modifier filter, which the guide does not supply."
  - "Survivability leans on regeneration. No-regeneration maps should hurt it badly, and no source addresses this."
  - "Every published number is from a 3.29 Path of Building with no boss target configured."
avoidIf: >-
  Pick something else if you want to clear maps quickly — buy the Siege
  Ballista or Explosive Arrow version of the same chassis instead. Skip it if
  this is your first or second character, if you do not already have a level
  94+ Templar to transplant, or if you do not have roughly 150 Divine spare.
  Skip it too if you dislike builds where the character you control does no
  damage: your whole input is placing and repositioning totems. And if you
  want a build that is verified for 3.30, this is not it — the guide has not
  been revised since the patch.

