name: Lightning Arrow / Elemental Hit of the Spectrum Deadeye
tagline: >-
  A crit bow Deadeye that clears a screen at a time and survives by not being
  hit. Cheap to enter, and hard to make tanky.
class: Ranger
ascendancy: Deadeye
role: endgame
budget: high
budgetNote: >-
  **No author publishes a budget for this build.** Maxroll gives no Divine
  figures on any of its Deadeye pages, and the guide page has no budget field.
  What you are buying is a crit bow shell plus two [[The Taming]] rings; the
  rest is rare gear you craft or buy. A search snippet attaching a ~38 chaos
  budget to a Fubgun Path of Building belongs to a 3.29 league-start file, not
  this one, so we do not quote it.
mainSkill: Elemental Hit of the Spectrum
image: elemental-hit-of-the-spectrum
hero: art-deadeye
tags: [Bow, Elemental, Crit, Mapper]
ratings: { clear: 5, bossing: 3, survivability: 2, ease: 4 }
verified: "2026-11-13"
confidence: predicted
confidenceNote: >-
  **The four ratings above are our reading, not a source's.** No author of this
  build publishes clear, bossing, survivability or ease scores — we checked all
  three Maxroll pages and the guide page. Clear and ease come from the authors'
  own qualitative lists. Bossing is a 3: the single-target package exists, but
  no source tests this build against an uber boss, and its Path of Building is
  not even configured for one. Survivability is a 2 because the authors
  describe a "don't get hit" build whose defences you have to finish yourself.
modes:
  ssf: >-
    A strong pick in solo self-found. The published ladder is
    Voidstone-gated, not purchase-gated: roughly 3 hours to the Act 10 boss,
    5 hours to 2 Voidstones, 9–10 hours to 4. [[Lethal Pride]] with a good
    roll and [[Thread of Hope]] are the parts you cannot shop for.
  hardcore: >-
    No current guide recommends it. 4,562 life with layered evasion and
    suppression is a profile that punishes one mistake, and the authors say
    plainly that you avoid damage rather than absorb it.

idea: |
  This is a bow character that kills whole packs with one shot and moves constantly. You start the league on [[Lightning Arrow]], and the endgame version swaps to a transfigured gem called [[Elemental Hit of the Spectrum]], which fires a projectile that deals fire, cold and lightning damage and then explodes on the target.

  The trick is that the skill deals **more** damage for each type of elemental ailment already on the enemy: 10% per type, written on the gem. Two [[The Taming]] rings count the same ailments, but their line says *increased*, not more: (30–40)% increased elemental damage per type, on each ring. Increased adds up with the rest of your increased damage, and the gem's more multiplies the total. The author calls the rings something to prioritise, and also says the build functions without them.

  Defence is not a big life pool. It is 100% spell suppression and high evasion, with little behind them. You will have around 4,500 life. Played well, nothing reaches you; played badly, you die to things a tankier build walks through.

chain:
  - label: Shoot
    text: "[[Elemental Hit of the Spectrum]] fires a projectile that hits with fire, cold and lightning and detonates an area of effect on the target."
  - label: Ailments
    text: "The skill deals 10% more damage per type of elemental ailment on the enemy. Each [[The Taming]] adds (30–40)% increased elemental damage per type. The gem's line is a multiplier; the rings' line is not."
  - label: Crit engine
    text: "[[Manaforged Arrows Support]] fires [[Storm Rain]] as you spend mana on the main attack. Storm Rain's crits cast [[Tornado]] through [[Cast On Critical Strike Support]] and fill power charges through [[Power Charge On Critical Support]]."
  - label: Survive
    text: "100% [[Spell Suppression]] and 14,550 evasion. No single large pool. The chest, [[Daresso's Defiance]], is the cheap damage option, not a defensive piece."

chainDetails:
  - title: The guide is called Lightning Arrow. The skill is not.
    body: |
      This is the first thing to know and the easiest thing to get wrong. The guide is titled Lightning Arrow, but the Path of Building attached to it has **[[Elemental Hit of the Spectrum]]** as the active skill.

      [[Lightning Arrow]] is what you level and map with early. Elemental Hit of the Spectrum is where the build ends up. The transfigured gem is real and its behaviour is documented on PoEDB and the wiki, both linked under Sources.

      A second author on Maxroll reaches the same destination from a different start: his [[Storm Rain]] guide tells you to swap to Lightning Arrow or Elemental Hit of the Spectrum once you have 4 Voidstones. That independent agreement is the strongest argument for picking this shell.
  - title: There is no published damage number, and we will not invent one
    body: |
      The endgame Path of Building for this build **renders Total DPS as 0**. That is almost certainly the 3.29 Path of Building fork failing to evaluate the trigger setup, not a real zero — but it means no sourced damage figure exists for this build at any budget.

      The 1 million and 2–3 million figures you may see quoted are a different thing: they are the other author's *progression targets* for 2 and 4 Voidstones. They are checkpoints on the way up, not endgame numbers. Do not read them as what a finished character does.

      What the Path of Building does report, computed on the **3.29 engine** because Path of Building has not been updated for 3.30 yet: 42,903 effective hit points, 4,562 life, 100% spell suppression, 14,550 evasion and 63% evade chance, 2,556 armour and 42% physical damage reduction, resistances 71/75/75 (fire, cold, lightning). The enemy is a generic "Boss" — no Sirus, no uber toggle, no Wither configured.
  - title: What the trigger package actually does
    body: |
      In the published endgame loadout this is one six-link, and it is two triggers chained together. [[Manaforged Arrows Support]] fires [[Storm Rain]] for you once you have spent enough mana on your main attack. Storm Rain is an attack, so when it crits, [[Cast On Critical Strike Support]] casts the spells in the link: [[Tornado]], and [[Sniper's Mark]], which sits in the same six-link. [[Power Charge On Critical Support]] turns those same crits into power charges, so the crits keep happening. You press nothing. Your main attack is not in this link and its crits do not set it off. What triggers what is read from the gem text on PoEDB, not from the author: his file lists the link without explaining it.

      It exists for single target. Your clear comes from the main skill plus [[Returning Projectiles Support]], which makes every projectile hit twice on the way back, and [[Mirage Archer Support]], which leaves a copy of you shooting while you move.
  - title: Where the defence comes from, and why you must finish it yourself
    body: |
      In order of importance: cap spell suppression at 100%, then evasion.

      [[Daresso's Defiance]] is the chest in the published loadout, and the author's note does not pick it for defence: it is the cheap option, roughly equal in damage to [[Hyrri's Ire]], and unlike Hyrri's Ire it brings no spell suppression. The same note ranks a well-rolled rare chest above both, at a much higher price. [[Lethal Pride]] is not part of the defence, whatever its label suggests. The file names the jewel "Lethal Pride 13348; 3; Wind Dancer", but the jewel does not grant [[Wind Dancer]]: PoEDB lists three keystones a Lethal Pride can put on the tree and Wind Dancer is not one of them, and no tree in the file allocates it. Our reading of the label is seed, number of double-damage notables, and the socket it goes in. Pantheon is Lunaris plus Ralakesh.

      Both authors say the same thing about this: the defences **do not come free with the gear**. You have to count your suppression and your evasion yourself and fix what is short. That is the single most common reason people bounce off this build.
  - title: Items the published endgame loadout does not contain
    body: |
      The figures on this page come from the loadout the file opens on, which the author titles "Endgame no HH". Worth knowing before you shop, because other bow builds use all of them: that loadout has **no Mageblood, no Headhunter, no Forbidden Flesh and Flame pair, no Watcher's Eye, no awakened gems, no Nimis, no Progenesis, no Dying Sun.** It does socket cluster jewels.

      The same file carries on past that loadout. Two later ones add [[Headhunter]], and one titled "Uber Endgame" wears Headhunter, [[Progenesis]] and [[Nimis]], the last in place of one of the two rings. [[Dying Sun]] is in the file only on a Tornado Shot loadout. [[Esh's Mirror]] is not in the file at all: we found it only in a *different* author's guide, in the "aspirational" section of Maxroll's [[Kinetic Blast]] Deadeye.

mandatory:
  - term: The Taming
    level: recommended
    why: >-
      Two of them. They scale the one thing the skill already does best:
      damage per elemental ailment on the enemy. The author's own note says
      the build functions without them and that you should prioritise them
      anyway, so the gem comes first and the rings follow.
    detail: >-
      Prismatic rings with (30–40)% increased elemental damage with hits and
      ailments for each type of elemental ailment on the enemy, plus elemental
      resistances and a 10% chance to Freeze, Shock and Ignite.
      [[Elemental Hit of the Spectrum]] carries a separate 10% *more* per
      type. The rings' increased adds to your other increased damage and the
      gem's more multiplies the result; they are not two multipliers. In the
      author's "Uber Endgame" loadout one of the pair gives its slot to
      [[Nimis]].
  - term: Elemental Hit of the Spectrum
    why: >-
      The endgame skill. It cannot deal physical or chaos damage at all, which
      is what forces the whole build to be elemental.
  - term: Trinity Support
    why: >-
      Rewards hitting with fire, cold and lightning in turn, which this gem
      does on its own. Drop it and you lose the resonance multiplier the gem
      was chosen for.
  - term: Returning Projectiles Support
    why: >-
      Every projectile hits a second time on the way back. It is close to a
      doubling of your clear, and it is the socket [[Nimis]] would free later.
  - term: Spell Suppression
    why: >-
      100%, not 90%. Half of all spell damage simply stops existing. With
      4,500 life there is no second plan for spell damage.
    detail: >-
      Both authors list "you must finetune your defences yourself, for example
      cap suppression" as a weakness of the build. It is the one number to
      check after every gear change.
  - term: Lethal Pride
    why: >-
      A damage jewel here, not a defensive one. The author's note asks for one
      that puts chance to deal double damage on two or three of your notables.
      You buy the roll, not the name.
    detail: >-
      The published file uses seed 13348 and labels it "13348; 3; Wind
      Dancer". Our reading of the label is seed, number of double-damage
      notables, and the socket: the one beside [[Wind Dancer]], where every
      tree in the file puts it. The jewel does not grant Wind Dancer, and no
      tree in the file allocates it. A different seed puts different modifiers
      on the same notables, so search trade by seed number, not by item name.
      The author also notes that the Strength it adds is what lets him run
      Steelskin.
  - term: Sniper's Mark
    why: >-
      A Mark, so one target at a time. It is your single-target damage
      multiplier and does nothing for clear.
  - term: Hyrri's Truth
    why: >-
      Bow damage, accuracy and crit on one amulet. The author's note calls it
      extremely cheap and effective. It also says Yoke of Suffering is the
      better amulet, far more expensive, and a late swap made mostly to help
      with resistances; his "Uber Endgame" loadout wears one.
  - term: The Fledgling
    why: >-
      The helmet the crit and projectile scaling is built around. The
      published setup assumes it.
  - term: Daresso's Defiance
    level: recommended
    why: >-
      The cheap chest, not a defensive one. The author's note puts it at
      roughly the damage of [[Hyrri's Ire]] without that chest's spell
      suppression, and likes the movement speed it gives early on. He ranks a
      well-rolled rare chest above both, at a much higher price.
  - term: Thread of Hope
    why: >-
      Reaches a tree cluster that is not connected to your path, without
      paying for the travel nodes. Pure point efficiency; nothing replaces it.
  - term: Mirage Archer Support
    level: recommended
    why: >-
      A second autonomous attacker. It is most of why the build feels smooth
      while you are moving or dodging.
  - term: Unnatural Instinct
    level: recommended
    why: >-
      Grants the unallocated small passives around it. Stat density, nothing
      more. Buy it when the cheaper upgrades are done.
  - term: Nimis
    level: recommended
    why: >-
      Grants return projectiles as a ring modifier, which frees the
      [[Returning Projectiles Support]] socket for a damage gem. It is a ring,
      so it takes the place of one [[The Taming]]: that is how the author's
      own "Uber Endgame" loadout wears it. No source measures the trade.
  - term: Headhunter
    level: recommended
    why: >-
      Steals modifiers from rare monsters and turns dense maps into a blur.
      It is not in the loadout our figures come from, which the author titles
      "Endgame no HH"; the loadouts after it in the same file add it.

stages:
  - id: transition-in
    image: lightning-arrow
    title: Transition in
    levels: 4 Voidstones, level 90+
    uses: >-
      [[Lightning Arrow]] or [[Storm Rain]] in a six-link, rare bow and
      quiver, rare gear with life and resistances. The gem swap to
      [[Elemental Hit of the Spectrum]] happens here at the latest. The Storm
      Rain guide swaps at 4 Voidstones; the author's file and Maxroll's guide
      for the gem use it as soon as you own it. The links below are the
      "Starter" loadout of the author's file, the last one before the rings.
      One thing is not in the list: Precision, which the loadout's
      [[Hyrri's Truth]] grants without a socket.
    changes: >-
      Cap [[Spell Suppression]] at 100% before anything else. The published
      targets for this point are 3,600–4,000 combined life and energy shield
      and 2–3 million damage per second. Those are 3.29 Path of Building
      numbers and they are checkpoints, not endgame figures.
    links:
      - name: Main skill (bow)
        gems: [Elemental Hit of the Spectrum, Elemental Damage with Attacks Support, Mirage Archer Support, Trinity Support, Returning Projectiles Support, Increased Critical Damage Support]
      - name: Second six-link (body armour)
        gems: [Vaal Burning Arrow, Manaforged Arrows Support, Trinity Support, Increased Critical Damage Support, Elemental Damage with Attacks Support, Elemental Focus Support]
      - name: Auras and mark (gloves)
        gems: [Haste, Sniper's Mark, Mark On Hit Support, Grace]
      - name: Charges (helmet)
        gems: [Frostblink, Power Charge On Critical Support, Manaforged Arrows Support, Frenzy]
      - name: Triggers (boots)
        gems: [Manaforged Arrows Support, Storm Rain, Cast On Critical Strike Support, Tornado]
      - name: Movement
        gems: [Blink Arrow]
    moveOn: "spell suppression is at 100% and you are comfortable in Tier 16 maps."
    details:
      - title: When the gem swap happens
        body: |
          The published ladder is written in Voidstones rather than Divine Orbs, because the gating is your atlas progress, not your wallet. Roughly: Act 10 boss in 3 hours, 2 Voidstones in 5, 4 Voidstones in 9–10, all solo self-found.

          On the swap itself the sources differ. The [[Storm Rain]] guide swaps after 4 Voidstones. Maxroll's guide for the gem tells you to swap as early as you can, and the author's file already has [[Elemental Hit of the Spectrum]] in its first maps loadout, keeping a [[Lightning Arrow]] link only for players who do not have the gem yet. His stated reason is flat damage, the stat a league-start bow lacks. What they agree on is the order: the gem first, the crit conversion around the Tier 16 section, and the two rings after that.
      - title: What to fix first if you are dying
        body: |
          Suppression, then evasion, then resistances. In that order.

          This build has no recovery engine and no large pool. If you are dying with suppression capped and resistances where the published file has them, 71/75/75, the answer is usually that you are standing still too long, not that you need another item.
  - id: the-taming-pair
    image: the-taming
    title: Mid budget
    levels: The two rings
    uses: >-
      Two [[The Taming]] rings, [[Hyrri's Truth]] and [[The Fledgling]], with
      a crafted bow and quiver underneath. [[Daresso's Defiance]] comes one
      loadout later in the author's file; this one still wears a rare chest.
      The links below are his "Mid game" loadout, the first with both rings.
      Not in the list: Precision, granted by Hyrri's Truth.
    changes: >-
      This is the step that makes it this build rather than a generic crit
      bow build. The author's note says to prioritise the rings, and also that
      the build functions without them. No source measures what they add.
    links:
      - name: Main skill (bow)
        gems: [Elemental Hit of the Spectrum, Elemental Damage with Attacks Support, Mirage Archer Support, Returning Projectiles Support, Trinity Support, Increased Critical Damage Support]
      - name: Second six-link (body armour)
        gems: [Vaal Burning Arrow, Trinity Support, Manaforged Arrows Support, Increased Critical Damage Support, Elemental Focus Support, Elemental Damage with Attacks Support]
      - name: Auras and mark (gloves)
        gems: [Haste, Purity of Elements, Sniper's Mark, Mark On Hit Support]
      - name: Charges (boots)
        gems: [Manaforged Arrows Support, Frenzy, Power Charge On Critical Support, Storm Rain]
      - name: Guard (helmet)
        gems: [Blink Arrow, Immortal Call, Cast when Damage Taken Support]
      - name: Movement (helmet)
        gems: [Frostblink]
    moveOn: "both rings are on, power charges stay full by themselves, and the triggered links fire without you thinking about them."
    details:
      - title: What order to buy in
        body: |
          **No source publishes an ordered buy list with prices for this build.** We are not going to make one up. What the sources do support is which item to prioritise, and the author's note names it: the two rings.

          After them, the published setup is a crafted [[Spine Bow]] and a crafted quiver, [[Hyrri's Truth]], [[The Fledgling]], [[Daresso's Defiance]] and a [[Stygian Vise]] with an abyss jewel. None of these have a 3.30 price yet, because the economy data for the new league does not exist.
      - title: The trigger package, slot by slot
        body: |
          In the "Mid game" loadout these links come from, everything automatic runs on [[Manaforged Arrows Support]]. In the boots it fires Frenzy and [[Storm Rain]] from the mana you spend on the main attack, and [[Power Charge On Critical Support]] turns their crits into power charges. In the body armour it sits in a second six-link with a Vaal Burning Arrow gem; by the support's own text it cannot trigger a Vaal skill, so our reading is that it fires the gem's ordinary Burning Arrow. The author does not explain that link. [[Cast On Critical Strike Support]] and [[Tornado]] are not in this loadout at all: they sit in the boots of the two loadouts before it, and return one loadout later as the chest six-link, where Storm Rain's crits cast Tornado and [[Sniper's Mark]].

          It is single-target only in practice. If it feels like it is doing nothing in maps, that is expected — your clear is the main skill.
  - id: high-budget
    image: lethal-pride
    title: High budget
    levels: The seeded jewels
    uses: >-
      [[Lethal Pride]] with two or three double-damage notables, in the socket
      beside [[Wind Dancer]], [[Thread of Hope]] for the unconnected cluster,
      and [[Unnatural Instinct]] for stat density. The links below are the
      "Endgame no HH" loadout, the one the figures on this page come from.
      Precision is not in the list because [[Hyrri's Truth]] grants it, and
      the file itself lists Blink Arrow twice.
    changes: >-
      The money moves from gear to the tree. No source describes any of these
      three jewels as a defensive purchase; Lethal Pride is damage and
      Strength by the author's own note. This is also where the build stops
      being cheap without becoming obviously stronger, which is the usual
      complaint about it.
    links:
      - name: Main skill (bow)
        gems: [Elemental Hit of the Spectrum, Elemental Damage with Attacks Support, Mirage Archer Support, Returning Projectiles Support, Trinity Support, Increased Critical Damage Support]
      - name: Trigger package (body armour)
        gems: [Cast On Critical Strike Support, Sniper's Mark, Power Charge On Critical Support, Manaforged Arrows Support, Tornado, Storm Rain]
      - name: Auras (gloves)
        gems: [Haste, Purity of Elements, Flesh and Stone, Blink Arrow]
      - name: Guard (helmet)
        gems: [Blink Arrow, Steelskin, Automation]
      - name: Movement (helmet)
        gems: [Frostblink]
      - name: Bleed and charges (boots)
        gems: [Blood Rage, Manaforged Arrows Support, Puncture, Frenzy]
    moveOn: "you have the seeded Lethal Pride and the tree is finished."
    details:
      - title: Buying a timeless jewel by seed
        body: |
          [[Lethal Pride]] rolls a seed number, and the seed decides which extra modifier each notable in its radius receives. You are not buying "a Lethal Pride" — you are buying one specific seed, for one specific socket.

          On trade, search the seed. The file's label, "13348; 3; Wind Dancer", reads to us as seed, number of double-damage notables, and socket: the jewel goes in the socket beside [[Wind Dancer]] and does not give you that keystone. If you cannot find the seed, the author's note asks only for two or three double-damage notables, so another seed that does that on notables you have allocated is a substitute. Check it in Path of Building before you pay.
      - title: What this tier does not buy you
        body: |
          No source has tested this build against an uber boss in 3.30. The published Path of Building is not configured against Sirus or any uber target.

          The one thing both authors do say about hard content: Tier 17 maps need large investment, and one of the two says only that the build "won't trivialise" them. Same author, two different strengths of claim, so read it as "expect to work for Tier 17s".
  - id: map-blaster
    image: nimis
    title: Map-blaster conversion
    levels: Optional, and unmeasured
    uses: >-
      The author's "Uber Endgame" loadout: [[Headhunter]], [[Nimis]] beside
      one [[The Taming]], [[Progenesis]], and a rare chest where
      [[Daresso's Defiance]] was. Maxroll's [[Kinetic Blast]] guide adds what
      that loadout does not have: a crafted chest that explodes corpses,
      [[Esh's Mirror]] and [[Dying Sun]]. The links below are the "Uber
      Endgame" loadout.
    changes: >-
      This stage is assembled from two places: the later loadouts of the
      author's own file, which add Headhunter and then Nimis, and Maxroll's
      aspirational sections. We found Headhunter and Nimis there in the
      [[Kinetic Blast]] guide and in the guide for this gem, and not in the
      Storm Rain guide. The Maxroll planner under Sources belongs to the guide
      for this gem and we could not read its contents. Neither source gives a
      damage figure, so nothing in it is measured on this build.
    links:
      - name: Main skill (bow)
        gems: [Elemental Hit of the Spectrum, Mirage Archer Support, Inspiration Support, Trinity Support, Awakened Elemental Damage with Attacks Support, Invert the Rules Support]
      - name: Trigger package (body armour)
        gems: [Manaforged Arrows Support, Cast On Critical Strike Support, Sniper's Mark, Power Charge On Critical Support, Tornado, Storm Rain]
      - name: Auras (helmet)
        gems: [Enlighten Support, Purity of Elements, Haste, Anger]
      - name: Guard and charges (gloves)
        gems: [Steelskin, Automation, Manaforged Arrows Support, Frenzy]
      - name: Movement and Precision (boots)
        gems: [Blink Arrow, Frostblink, Precision]
    moveOn: "there is no next stage. From here you are choosing between clear speed and all-round capability."
    details:
      - title: Read this before you buy any of it
        body: |
          [[Headhunter]] and [[Nimis]] are in the later loadouts of the author's own file. They are not in the "Endgame no HH" loadout our figures come from. On Maxroll we found both in the "Aspirational" sections of the [[Kinetic Blast]] guide and of the guide for this gem. We did not find them in the [[Storm Rain]] guide. The Maxroll planner listed under Sources is titled as the planner of the guide for this gem, not of the Storm Rain guide, and beyond its title it is not readable as text, so it confirms nothing either way. [[Esh's Mirror]] and the explode chest we found in the Kinetic Blast guide only.

          [[Nimis]] has a clear mechanical fit: it grants return projectiles as a ring modifier, so the [[Returning Projectiles Support]] socket becomes a damage gem instead. The price is a ring slot. The author's "Uber Endgame" loadout wears one [[The Taming]] and one Nimis, so what you give up is the second ring's increased damage per ailment and its resistances. His note adds that Nimis lets you stand next to a boss and still get the full range bonus from [[The Fledgling]]. [[Headhunter]] is a map-clear item and will do nothing for a boss.

          We mark this whole stage as unmeasured rather than leave it out: no source puts a number on any of it.
      - title: If clear speed is all you want
        body: |
          The honest answer is to play the [[Kinetic Blast]] version instead. It is the same author, the same quality of sourcing, and its high-investment section is explicitly a traditional map blaster built on Headhunter, [[Esh's Mirror]], Nimis and an explode chest.

          Its cost is single target, which is why it is not the pick here. It also publishes no endgame damage, no effective hit points and no Path of Building configuration at all.

powerCurve: |
  The damage has three parts, and the defence is two ways of not taking the hit. Splitting it this way is our framing, but each part is in the guides or the gem data. On the damage side, [[Elemental Hit of the Spectrum]] deals more damage for each type of elemental ailment on the enemy, the two [[The Taming]] rings add increased damage for the same ailments, and crit feeds a trigger package built for single targets. On the defence side there is 100% [[Spell Suppression]] and evasion. [[Wind Dancer]] is not one of the layers: the [[Lethal Pride]] in the file carries that name on its label, but no tree in the file allocates the keystone. Behind them there is no large life pool and no recovery engine.

  Early, you have none of this and do not need it. You level and reach maps on [[Lightning Arrow]] or [[Storm Rain]] with rare gear, and the published route is gated by Voidstones, not by currency: about 9–10 hours to four of them in solo self-found. The other author's checkpoints for that point are 2–3 million damage per second and 3,600–4,000 combined life and energy shield. Those are 3.29 Path of Building targets on the way up, not what a finished character does.

  The middle is where the build becomes itself. Around Tier 16 maps you convert to crit, the gem is in by four Voidstones at the latest, and then the two rings arrive. The gem data gives the skill its own chance to Freeze, Shock and Ignite, so the ailments it counts come from your own hits, and the rings count the same ailments again. The author's note says to prioritise the rings, and also that the build functions without them. How large the step is, nobody can tell you: the endgame Path of Building renders Total DPS as 0, so no sourced figure exists.

  Late, the money moves from gear to the tree: the seeded Lethal Pride, which the author's note wants for chance to deal double damage on notables, then [[Thread of Hope]] and [[Unnatural Instinct]]. No source describes any of the three as a defensive purchase. What does not grow is the pool. The published endgame file has 4,562 life, not far above the 3,600–4,000 target for four Voidstones. Those two numbers come from different authors, so read the comparison loosely, but our reading is that the character never becomes tanky. That is why the build feels fast and complete early, and fragile at every budget.

upgrades:
  - step: "100% [[Spell Suppression]], before any unique"
    why: >-
      First because nothing else works without it. At 100%, half of all spell
      damage is gone, and with about 4,500 life there is no second plan for
      spell damage. Both authors list capping it yourself as a weakness of the
      build. None of the uniques below is named as a source of it, so nothing
      on this list is a reason to wait.
  - step: "Two [[The Taming]] rings"
    why: >-
      The first unique the author tells you to prioritise.
      [[Elemental Hit of the Spectrum]] deals 10% more damage for each type of
      elemental ailment on the enemy, and each ring adds (30–40)% increased
      elemental damage for the same ailments, plus resistances. The ring's
      line is increased, not more, so it adds to your other increased damage
      and is not a second multiplier. The author's note is plain on both
      sides: the build functions without the pair, and they are among the best
      rings you can wear until far more expensive ones. No source measures
      what they add or prices them for 3.30.
  - step: "The trigger package: [[Manaforged Arrows Support]] firing [[Storm Rain]], whose crits cast [[Tornado]]"
    why: >-
      You pay in gems and sockets, not currency.
      [[Cast On Critical Strike Support]] is what turns Storm Rain's crits
      into Tornado, and [[Power Charge On Critical Support]] turns them into
      power charges. It adds single-target damage and keeps power charges
      full, and in maps it does close to nothing. That is why we put it under
      the rings, which add to every shot you fire. The ordering is ours. In
      the author's file the trigger gems are already socketed in the loadout
      before the rings, which fits something that costs sockets and not
      currency.
  - step: "The rest of the published setup: [[The Fledgling]], [[Hyrri's Truth]], [[Daresso's Defiance]], a crafted [[Spine Bow]] and quiver, a [[Stygian Vise]]"
    why: >-
      These are the pieces the endgame file assumes. No source ranks them
      against each other or prices them, so we do not either. Two cautions.
      The chest is the cheap option by the author's own note: about the damage
      of [[Hyrri's Ire]] and none of its spell suppression. Our reading is
      that the helmet likewise takes a slot where a rare could have carried
      suppression, so count suppression again after every swap. And in 3.30
      protecting modifiers at the bench is priced by item type, so the crafted
      bow and quiver may cost more than they did.
  - step: "[[Lethal Pride]] with two or three double-damage notables"
    why: >-
      From here the money goes into the tree, not into gear. You are buying a
      roll, not the item: the author's note asks for chance to deal double
      damage on two or three notables, and the published file uses seed 13348
      in the socket beside [[Wind Dancer]]. It does not give you Wind Dancer,
      and it is not a defensive jewel; the author's other stated use for it is
      Strength. The file adds Thread of Hope one loadout earlier than this
      jewel. We still put Lethal Pride first because it is the only one of the
      three the author's notes explain. That is our call.
  - step: "[[Thread of Hope]], then [[Unnatural Instinct]]"
    why: >-
      Thread of Hope reaches a cluster your path does not connect to, without
      paying for the travel nodes, and nothing replaces it. Unnatural Instinct
      grants the small passives around it: stat density and nothing more, to
      buy when the cheaper upgrades are done. This is the point where the
      build stops being cheap without becoming obviously stronger.
  - step: "[[Nimis]] and [[Headhunter]], the top of the author's file"
    why: >-
      Last, and unmeasured: no source puts a figure on either. Both are in the
      later loadouts of the author's own file. On Maxroll we found them in the
      aspirational sections of the [[Kinetic Blast]] guide and of the guide
      for this gem, and not in the Storm Rain guide. Nimis is a ring. In the
      author's "Uber Endgame" loadout it takes the place of one of the two
      The Taming rings, and [[Returning Projectiles Support]] leaves the main
      link because the ring returns projectiles itself. So the trade is the
      second ring's increased damage per ailment and its resistances, for a
      free support socket. Headhunter speeds up dense maps and does nothing
      against a boss. Nobody has weighed the trade in numbers.

play:
  mapping: |
    The published setup is one attack, one mark and a trigger package that fires itself, at +218% movement speed. No source writes out a rotation for it. The steps below are the published links read in order, and where a step is our reading it says so.

    1. **Count your defences before you open a map**, if you changed any gear: [[Spell Suppression]] at 100% first, then evasion, then resistances.
    2. **Shoot a pack once or twice and keep moving.** [[Elemental Hit of the Spectrum]] explodes on the target, [[Returning Projectiles Support]] makes each projectile hit again on the way back, and [[Mirage Archer Support]] keeps shooting behind you.
    3. **Move with [[Blink Arrow]] and [[Frostblink]].** Every Elemental Hit loadout in the author's file carries both.
    4. **Let [[Sniper's Mark]] apply itself.** It marks one target at a time and does nothing for clear. No loadout in the author's file casts it by hand: the earlier ones link it to [[Mark On Hit Support]], and the endgame link puts it inside the trigger package.
    5. **Do not stop.** The build has no recovery engine and no large pool. If you die with suppression capped and resistances where the published file has them, 71/75/75, the usual reason is that you stood still too long.

    The trigger package will look idle in maps. That is expected: it exists for single targets, and your clear is the main skill.

    No source lists map modifiers to avoid for this build, so we do not list any.
  bossing: |
    Read this as mechanics in the order they apply, not as a tested fight plan. The published Path of Building is set against a generic boss and shows no damage figure, and no source tests the build on an uber boss.

    1. **[[Sniper's Mark]] goes on the boss by itself.** It is your single-target multiplier. In the author's file either Mark On Hit or the trigger package applies it; with the trigger package it lands once the package starts firing.
    2. **Keep attacking.** The mana you spend sets off [[Storm Rain]], its crits cast [[Tornado]] through the trigger package, and [[Power Charge On Critical Support]] keeps power charges full so the crits keep coming. The package runs off your own attacks, so it stops when you stop. That last point is our reading of the links.
    3. **Give the ailments a moment to land.** The skill and the rings both count ailments already on the enemy, and the gem data gives the skill its own chance to Freeze, Shock and Ignite. Our reading is that the first shots do the least and the damage climbs from there. No source says how many ailments stay on a boss.
    4. **Dodge by moving, then shoot again.** [[Mirage Archer Support]] keeps firing while you move. Suppression makes spell hits smaller and evasion makes attacks land less often, but there is no large pool behind them for the hit that gets through.

    What does not change: Tier 17 maps need large investment by both authors' account, and uber bossing is untested. If uber bosses are your goal, this is the wrong build.

deaths:
  - situation: "Spell damage, soon after a gear swap"
    cause: >-
      Suppression slipped under 100%. At the cap, half of all spell damage is
      gone; under it, some spells arrive whole on about 4,500 life. The
      author's note says [[Daresso's Defiance]] brings no suppression, where
      Hyrri's Ire would, and our reading is that [[The Fledgling]] likewise
      takes a helmet slot that a rare could have used for it.
    fix: >-
      Count suppression after every gear change and fix it before the next
      map. Both authors name this as the job the build leaves to you.
  - situation: "Dying with suppression capped and resistances at the published 71/75/75"
    cause: >-
      Standing still. The build has no recovery engine and no large pool. The
      published file shows a 63% chance to evade, so the rest of the attacks
      aimed at you land on 4,562 life.
    fix: >-
      Keep moving, and let [[Mirage Archer Support]] shoot while you do. The
      order for fixes is suppression, then evasion, then resistances. If all
      three are done, another item is usually not the answer.
  - situation: "Tier 17 maps and uber bosses"
    cause: >-
      Both authors say Tier 17 maps need large investment, and one of them
      says only that the build "won't trivialise" them. No source tests it
      against an uber boss, and the published Path of Building is not
      configured for one.
    fix: >-
      Treat both as outside what the build is shown to do. No source gives a
      gear fix, so we do not invent one. If this content is your goal, pick a
      build that is written for it.

troubleshooting:
  - symptom: "Path of Building shows Total DPS as 0"
    cause: >-
      The published endgame file does the same. It is almost certainly the
      3.29 Path of Building fork failing to evaluate the trigger setup, not a
      real zero.
    fix: >-
      Nothing is broken on your character. There is also nothing to compare
      it with: no sourced damage figure exists at any budget, and the 1
      million and 2–3 million numbers are another author's checkpoints for 2
      and 4 Voidstones.
  - symptom: "After the gem swap it plays like any other bow build"
    cause: >-
      One of the pieces built on top of the gem is missing. Without
      [[The Taming]] rings there is no second bonus per ailment, and without
      [[Trinity Support]] you lose the multiplier the gem was chosen for.
    fix: >-
      Check that Trinity is in the main link, and whether both rings are on.
      If you swapped the gem before you owned the rings, that is the order the
      sources use, and this is expected until you do.
  - symptom: "The trigger package seems to do nothing in maps"
    cause: >-
      Expected. In practice it is single-target only. Your clear is the main
      skill with [[Returning Projectiles Support]] and
      [[Mirage Archer Support]].
    fix: >-
      Judge it on a boss, not on packs.
  - symptom: "Power charges drop off and the trigger package fires only now and then"
    cause: >-
      The package runs in two steps: the mana you spend sets off Storm Rain
      through [[Manaforged Arrows Support]], and Storm Rain's crits do the
      rest, with [[Power Charge On Critical Support]] refilling the charges
      that keep the crits coming. Our reading is that too little crit chance
      breaks that loop at its second step. No source lists this as a fault; it
      follows from the gem text.
    fix: >-
      Check your crit chance in Path of Building. In the published file
      [[Precision]] is granted by [[Hyrri's Truth]], which also carries crit
      multiplier. If you have not converted to crit yet, the package is not
      meant to work yet.
  - symptom: "You socketed [[Lethal Pride]] and [[Wind Dancer]] is not on your tree"
    cause: >-
      It is not meant to be. The file labels the jewel "13348; 3; Wind
      Dancer", and our reading is that the last part names the socket it goes
      in, the one beside that keystone. A Lethal Pride adds a modifier to each
      notable in its radius. PoEDB lists three keystones it can put on the
      tree and Wind Dancer is not one of them, and no tree in the file
      allocates it.
    fix: >-
      Nothing to fix. What to check is the roll: the author's note asks for
      chance to deal double damage on two or three of your notables. Search
      trade by seed number, not by item name, and check the seed in Path of
      Building, in that socket, before you pay.
  - symptom: "The build got expensive and does not feel stronger"
    cause: >-
      This is the usual complaint about the high-budget stage. The jewels
      there work through the tree: chance to deal double damage, Strength,
      small passives. None of that shows as speed.
    fix: >-
      It is the build, not your character. If clear speed is what you want
      for the money, the [[Kinetic Blast]] version of the same archetype has
      better high-investment guidance. The [[Nimis]] and [[Headhunter]]
      loadouts in the author's file come with no figures.

patch:
  - note: >-
      **3.30 does not touch this build, and that is the reason to pick it.**
      [[Deadeye]] is not mentioned in the notes. Neither are
      [[Lightning Arrow]], Elemental Hit or [[Storm Rain]]. Bows got no
      balance changes at all — only two cosmetic fixes. You are inheriting a
      3.29-proven shell unchanged.
  - entry: bug-fixes
    note: >-
      **One line could matter and nobody has tested it.** Sources of Direct
      Flight now enforce the stated maximum projectile distance for returned
      projectiles. This build runs [[Returning Projectiles Support]]. No
      source analyses the interaction.
  - entry: ruthless-changes
    note: >-
      **Nothing to unlearn here, but know the trap.** A long list of
      ascendancy changes in the 3.30 notes sits in the Ruthless-specific
      section and does not apply to the normal game. Deadeye is in neither
      list, so no launch article has misread anything about this build — but
      several have for other classes.
  - entry: meta-crafting-costs
    note: >-
      **The crafted bow and quiver may cost more.** Protecting modifiers at
      the bench is priced by item type now, and the recipes moved to
      Nightmare Maps. No 3.30 price exists for either craft.
  - entry: new-uniques
    note: >-
      **Unknown.** The new uniques have not been read against this build by
      anyone. Worth checking yourself before you commit to the published
      item list.

strengths:
  - "Simple to play: one main attack, one mark, and a trigger package that fires itself."
  - "Very mobile. The published setup runs +218% movement speed."
  - "Fast progression: around 9–10 hours to 4 Voidstones in solo self-found."
  - "Cheap entry. The published file starts on rare rings, and the two that define it come at mid game."
  - "3.30 changed nothing about it, so 3.29 knowledge transfers directly."
  - "Needs no Mageblood, no Headhunter and no Forbidden pair to function."
weaknesses:
  - "A don't-get-hit build. 4,562 life, and the defence is layers rather than a pool."
  - "You have to finish the defences yourself. Suppression does not come free with the gear."
  - "No sourced damage number exists at any budget. The endgame Path of Building renders 0."
  - "Tier 17 maps need large investment, by both authors' own admission."
  - "Uber bossing is untested. Nobody has configured the Path of Building against one."
  - "[[Lethal Pride]] is bought by seed, not by name, which makes one mandatory item awkward to buy."
avoidIf: >-
  Pick something else if you want to stand still, if you want a build that
  absorbs hits rather than avoids them, or if you dislike counting your own
  defensive statistics after every gear swap. Also skip it if your goal is
  uber bosses: no source tests this build against one, and other builds on
  this site are written for exactly that. If pure clear
  speed is what you want, the Kinetic Blast version of the same archetype has
  better high-investment guidance.

