confidenceNote: >-
  **The skill is proven; this particular build is one person's claim.**
  [[Static Strike]]'s own mechanics are read off PoEDB and are not in doubt:
  its last change was in 3.28.0 and 3.30 does not mention it anywhere. The
  Guardian version comes from one author, Alohaa, posted 11 November 2026
  under the title "The Strongest Leaguestarter I Ever Played" with 154,000
  views by launch day — easily the most-viewed single build on
  poebuilds.cc's Covens list. **But his planner is labelled 3.29**, and it is
  a finished level-98 character with a Forbidden jewel pair in it, not a
  leveling plan. No established guide site — Maxroll, Mobalytics, PoE Vault
  — has published anything on Static Strike Guardian for 3.30. The four
  ratings are ours. What *is* independently corroborated is Static Strike as
  a 3.30 league-start skill: jungroan posted a Blade Flurry Static Strike
  Slayer starter the same week, and a separate Static Strike Assassin starter
  is on the same list.
modes:
  ssf: >-
    The staff is the problem. [[The Yielding Mortality]] is a forged unique:
    PoEDB lists it as a Harvest drop and as a vendor recipe,
    [[The Enmity Divine]] plus a [[Haemocombustion Scroll]]. Harvest is still
    a "secondary" mechanic in 3.30, so Sacred Flora keep spawning in maps on
    their own, which keeps the route open — but it is a route, not a
    guarantee. **No source discusses solo self-found for this build.**
  hardcore: >-
    No source discusses it either. On paper the published character is the
    best-defended on this site: 219,015 effective hit points, 82% physical
    damage reduction, 75% block and 75% spell block. Read that as a
    destination. It is a level 98 trade character, and nothing tells you what
    the defences look like in Act 6.

idea: |
  [[Static Strike]] is a melee attack with a delayed payoff. You hit one enemy with your weapon, and that grants you a buff called static energy. While it is up, beams fire out of you at nearby enemies on their own, every third of a second, chaining to extra targets.

  So the rhythm is: hit something once, then keep moving. The beams do the clearing. You are never obliged to stand in a pack and keep swinging.

  The [[Guardian]] half of the build is doing something different and unrelated: it is making you extremely hard to kill. The published character blocks three quarters of attacks and three quarters of spells, has ten thousand armour, and takes 82% less physical damage from hits. [[Divine Shield]] then turns the damage that armour and block prevented into energy shield regeneration.

  Those two halves are why this is a league starter rather than a glass cannon. The damage comes almost entirely from one skill gem you get in Act 1 and one staff; the survival comes from the tree and the ascendancy, which cost nothing but passive points.

chain:
  - label: Hit once
    text: "[[Static Strike]] is an attack. Hitting an enemy grants static energy for a base 4 seconds, and it stacks up to 3 times."
  - label: Beams fire themselves
    text: "While static energy is up, beams hit enemies every 0.32 seconds at gem level 20, up to 6 targets, with one extra chain. They deal 30% less damage than the attack."
  - label: Half of it becomes lightning
    text: "The skill converts 50% of its physical damage to lightning, so the build scales with both physical weapon damage and lightning damage."
  - label: Ailments multiply it
    text: "[[The Taming]] gives 30–40% increased elemental damage with hits and ailments *for each type* of elemental ailment on the enemy. Static Strike shocks on its own."
  - label: Nothing kills you
    text: "75% block, 75% spell block, 10,348 armour and 82% physical damage reduction. [[Divine Shield]] turns prevented physical damage into energy shield regeneration."

chainDetails:
  - title: Why your weapon matters here, unlike a damage-over-time build
    body: |
      This is the opposite of a build like Toxic Rain, where the gem carries the damage and the weapon is nearly irrelevant.

      [[Static Strike]] has 346% effectiveness of added damage at gem level 20, up from 150.6% at level 1. Effectiveness is the multiplier applied to damage added by your weapon and your gear. At 346% every point of added damage is worth three and a half times its face value, which makes a big weapon roll enormous.

      That is also the reason the build uses the staff it uses. [[The Yielding Mortality]] adds 225–265 to 315–385 physical damage and 30–40% increased critical strike chance, and half of all that physical damage converts to lightning on the way out.

      The beams deal 30% less damage than the attack itself, so the attack is still the single-target tool and the beams are the clear.
  - title: The staff is the build, and it is a forged unique
    body: |
      [[The Yielding Mortality]] is an Imperial Staff, level 66, 113 Strength and 113 Intelligence. Its full modifier list from PoEDB:

      - +25% Chance to Block Spell Damage
      - Socketed Gems are supported by Level 1 Chance to Bleed
      - Grants [[Summon Greater Harbinger of Brutality]] Skill
      - +5% Chance to Block Attack Damage while wielding a Staff
      - +(60–80)% to Damage over Time Multiplier for Bleeding from Critical Strikes
      - Adds (225–265) to (315–385) Physical Damage
      - (30–40)% increased Critical Strike Chance

      Two of those lines are why the Guardian reaches 75% spell block: +25% spell block and +5% attack block on one item. The added physical damage and the critical strike chance are the damage. The bleeding lines are the part you are *not* using — nothing in the build makes them matter.

      How you get it: PoEDB lists a Harvest drop source, and a vendor recipe of [[The Enmity Divine]] plus a [[Haemocombustion Scroll]]. It was added to the core drop pool in 3.28.0. **No price exists for it in any league that we could find.**
  - title: "The Taming wants three ailments. Static Strike gives you one."
    body: |
      [[The Taming]] is a Prismatic Ring: +(8–10)% and +(20–30)% to all elemental resistances, 10% chance to Freeze, Shock and Ignite, and **(30–40)% increased elemental damage with hits and ailments for each type of elemental ailment on the enemy.**

      That last line is multiplicative in the number of *types*. Shock alone gives you one stack of it. Shock, freeze and ignite together give three. On a 40% roll that is the difference between +40% and +120%.

      [[Static Strike]] has had a base 10% chance to shock since 3.0.0, and it converts half its physical damage to lightning, so shock arrives by itself. Freeze and ignite do not: the skill deals no cold or fire damage at all. The ring's own 10% chance to freeze, shock and ignite is the only route the item gives you.

      **This is our reading, not the author's**, and it is the biggest open question in the build: nothing on his page explains how the third ailment is applied. 3.30 does hand you a new answer if you want one — [[Doedre's Tongue]] now rolls "All Damage can Ignite, Shock or Freeze against Cursed Enemies", which would turn your lightning damage into a freeze and an ignite on a cursed target. The build already runs [[Elemental Weakness]]. Nobody has tested that pairing.
  - title: What the planner actually says, and what it assumes
    body: |
      One file, pobb.in/Wpo4TuYfRXFT, titled "Level 98 Hybrid Crit Static Strike Guardian" and **labelled 3.29**.

      **Damage:** [[Static Strike]] at 20/20 reporting **10.6 million hit damage per second** at 1.83 attacks per second, 92.7% critical strike chance and 415% critical multiplier. Total damage per second across everything, which is what the planner headlines, is **11,630,874**, and the extra comes from [[Summon Greater Harbinger of Brutality]] off the staff.

      **Defence:** 4,922 life, 1,777 energy shield, **219,015 effective hit points**. Resistances 79 fire, 79 cold, 78 lightning, 46 chaos. 10,348 armour, 82% physical damage reduction, 75% block, 75% spell block. 984 life leeched per second, 150 life and 150 energy shield regenerated per second, +50% movement speed. Level 98, bandits killed, Pantheon Brine King and Garukhan, 223 Strength / 98 Dexterity / 187 Intelligence.

      **What is switched on:** the configuration line reads only **"15% Shock, Power"** — a 15% shock effect and power charges. **No boss is selected and no enemy level is shown.** So the 10.6 million is against the planner's default target, not against a pinnacle boss, and the shock assumption is a modest one rather than a generous one.

      And the tree is 3.29 data. Path of Building has not been updated for Covens of Umbra, so no 3.30 tree or balance change is in that number.
  - title: "Divine Shield has a ceiling you should know about"
    body: |
      The keystone regenerates 3% of the physical damage prevented from hits in the last few seconds as energy shield per second — and, per the wiki, **you cannot recover energy shield above your armour value**.

      On this character that cap is 10,348, and the energy shield pool is 1,777, so the cap is not binding. It matters in the other direction: Divine Shield pays you nothing until you are being hit, and it pays in proportion to how much your armour and block already stopped. It is a reward for being tanky, not a way of becoming tanky.

      A detail we could not resolve: whether blocked hits count as "prevented". There is an official forum thread titled exactly that question, and we could not read an answer out of it. If blocked damage does not count, a 75% block character is collecting Divine Shield from a quarter of the hits it takes.
  - title: What is not published for this build
    body: |
      Said plainly, because several of these are things a starter guide normally has:

      - **No leveling tree and no gem progression.** The only planner is the finished level-98 character.
      - **No Labyrinth order.** We do not know which Guardian notable he takes first, so this page has no Labyrinth table.
      - **No support gem list for the Guardian version.** The page shows [[Static Strike]] and the staff's granted skill, and does not show what is linked to what.
      - **Which notable the Forbidden pair allocates.** The character wears a corrupted [[Forbidden Flame]] and [[Forbidden Flesh]], and the page does not say what is written on them. A Forbidden pair that names two different notables does nothing, so this is not a small gap.
      - **Any price at all.**

mandatory:
  - term: Static Strike
    why: >-
      The skill. An Act 1 quest reward from The Siren's Cadence for Marauder,
      Scion and Templar, usable from character level 12.
    detail: >-
      Gem level is the main scaling you control early: effectiveness of added
      damage runs from 150.6% at level 1 to 346% at level 20, and the beams
      fire faster and hit more targets as the gem levels. Keep it at the
      highest level you can carry.
  - term: The Yielding Mortality
    why: >-
      The staff the whole build is arranged around: added physical damage,
      increased critical strike chance, +25% spell block and +5% attack block
      while wielding a staff.
    detail: >-
      A forged unique. PoEDB lists a Harvest drop source and a vendor recipe
      of [[The Enmity Divine]] plus a [[Haemocombustion Scroll]]. **No price
      was found in any league.** Until you have it, any rare two-hander with
      a large physical roll does the same job worse.
  - term: Divine Shield
    why: >-
      The keystone that turns prevented physical damage into energy shield
      regeneration. It is the only keystone the published character takes.
    detail: >-
      3% of physical damage prevented from hits recently, regenerated as
      energy shield per second, and energy shield cannot be recovered above
      your armour. With 10,348 armour that cap is not a problem here.
  - term: The Taming
    level: recommended
    why: >-
      A large elemental damage multiplier per type of elemental ailment on
      the enemy, plus up to +40% to all elemental resistances on one ring
      slot. Worn by the published character.
    detail: >-
      Read the detail above before you buy it: Static Strike shocks on its
      own but deals no cold or fire damage, so two of the three ailments have
      to come from somewhere, and no source says where.
  - term: Summon Greater Harbinger of Brutality
    level: recommended
    why: >-
      Granted free by the staff, and it is the whole difference between the
      planner's 10.6 million for Static Strike and 11.6 million in total. You
      do not spend a socket on it.
  - term: Trinity Support
    level: recommended
    why: >-
      More elemental damage when you deal all three elemental damage types.
      **From the author's 3.29 Static Strike Slayer file, not the Guardian
      one** — his Guardian page does not publish a link.
  - term: Melee Physical Damage Support
    level: recommended
    why: >-
      More melee physical damage, half of which converts to lightning. Also
      from the 3.29 Slayer file.
  - term: Ruthless Support
    level: recommended
    why: >-
      Every third hit does much more damage. From the 3.29 Slayer file. On a
      1.83-attacks-per-second character the pattern is easy to keep.
  - term: Fortify Support
    level: recommended
    why: >-
      Less damage taken from hits, and it suits a melee character that is
      hitting constantly. From the 3.29 Slayer file.
  - term: Elemental Damage with Attacks Support
    level: recommended
    why: >-
      More elemental damage with attacks, which is where half of Static
      Strike's damage lands after conversion. From the 3.29 Slayer file.
  - term: Elemental Weakness
    level: recommended
    why: >-
      Lowers all three elemental resistances. The published Guardian carries
      it. It is also the curse you would need if you chase the
      [[Doedre's Tongue]] ailment route.
  - term: Shield Charge
    level: recommended
    why: >-
      Movement. The published character has it, which is slightly odd on a
      staff build and may be a leftover — **we flag it rather than explain
      it.**

stages:
  - id: acts-1-10
    image: static-strike
    title: Acts 1–10
    levels: Level 12–68
    uses: >-
      [[Static Strike]] from the Act 1 quest The Siren's Cadence, in whatever
      links you find, with whatever two-handed weapon has the biggest
      physical roll. Before level 12 use any Templar starting skill.
    changes: >-
      **Nothing here is sourced.** No leveling plan is published for this
      build. What follows is the general rule for a converted physical melee
      skill, and we say so rather than dressing it up as the author's advice.
    links:
      - name: "From level 12 (our suggestion, not sourced)"
        gems: [Static Strike, Melee Physical Damage Support, Ruthless Support]
      - name: "Four-link (our suggestion, not sourced)"
        gems: [Static Strike, Melee Physical Damage Support, Ruthless Support, Fortify Support]
      - name: Utility
        gems: [Molten Shell, Flame Dash, Precision]
    moveOn: >-
      you have finished Act 10, your elemental resistances are back at 75%,
      and Static Strike is in at least a four-link.
    details:
      - title: Where a Templar gets the gem
        body: |
          [[Static Strike]] is a quest reward for The Siren's Cadence in Act 1, offered to Marauder, Scion and Templar, and it requires character level 12 with 21 Strength and 14 Intelligence. PoEDB also lists Nessa against that quest, but does not say outright that she sells it, so take the quest reward.

          Its tags are Attack, Melee, Strike, Area of Effect, Duration, Lightning and Chaining. The Duration tag matters: skill effect duration extends how long static energy lasts, which means more beam time per hit.
      - title: Why the staff cannot be your campaign weapon
        body: |
          [[The Yielding Mortality]] needs level 66, which is roughly the end of Act 10. So the entire campaign is run on rare weapons, and the thing you are looking for is a single large physical damage roll, because of the 346% added-damage effectiveness.

          3.30 helps here. From Act 6, Magic and Rare items can drop with an Item Tier from 2 to 5 printed in the name, and a higher tier means better modifiers. You can see a good weapon on the ground now instead of identifying everything.
      - title: What we cannot tell you
        body: |
          Which Guardian notable to take first, in which order to run the Labyrinth, which bandit to help, or which Pantheon powers to use while progressing. The published character has bandits killed and Brine King and Garukhan at level 98; that is an endgame choice and not necessarily a campaign one.

          If you want a leveling plan for this skill rather than this ascendancy, the author's 3.29 Static Strike Slayer post advertises a full leveling Path of Building in its video. **We could not read that file** — only the finished 3.29 Slayer build, pobb.in/767t-xufLl6G, is linked on the page.
  - id: early-maps
    image: divine-shield
    title: Early maps
    levels: White and yellow maps
    uses: >-
      [[The Yielding Mortality]] as soon as you can get one, rares with life
      and resistances everywhere else, and [[Divine Shield]] once your armour
      is large enough for it to pay.
    changes: >-
      This is where the Guardian half starts to be the point. Block and
      armour come from the tree and the ascendancy, so they arrive on
      schedule whatever your gear looks like.
    links:
      - name: "Main link (shape from the 3.29 Slayer file)"
        gems: [Static Strike, Melee Physical Damage Support, Ruthless Support, Fortify Support, Trinity Support, Elemental Damage with Attacks Support]
      - name: Curse and movement
        gems: [Elemental Weakness, Shield Charge, Faster Attacks Support]
      - name: Defence
        gems: [Vaal Molten Shell, Cast when Damage Taken Support]
    moveOn: "your block is high, your resistances are capped, and the staff is equipped."
    details:
      - title: Getting the staff
        body: |
          Two routes, both from PoEDB rather than from the build author:

          1. **Harvest.** It is listed as a Harvest drop. Harvest changed shape in 3.30 — the Sacred Grove portal is gone and Sacred Flora grow in the map itself — but Harvest is a *secondary* mechanic, so it still spawns in maps on its own without a Thread.
          2. **The vendor recipe.** [[The Enmity Divine]] plus a [[Haemocombustion Scroll]].

          **Neither route has a published cost or drop rate.** If you are trading, this is one item to price-check rather than budget for.
      - title: Trinity needs all three elements
        body: |
          [[Trinity Support]] only pays out if you are dealing fire, cold *and* lightning damage. Static Strike gives you lightning by conversion. The other two have to come from your gear or from an aura such as [[Hatred]] for cold.

          The author's 3.29 Slayer file runs [[Hatred]] and [[Herald of Ash]], which covers cold and fire. **His Guardian page does not publish its aura set**, so we cannot tell you whether the Guardian keeps that arrangement.
      - title: Earning currency in 3.30
        body: |
          Worth repeating on every starter page this league: Abyss, Bestiary, Betrayal, Blight, Breach, Expedition, Incursion, Legion, Ritual and Ultimatum no longer spawn in maps at random. They appear only where a Thread puts them.

          So the early plan is Threads from Shaped Regions, and not skipping rare monsters or map bosses.
  - id: red-maps
    image: the-taming
    title: Red maps and the published character
    levels: Tier 11–16 maps
    uses: >-
      The published level-98 setup: [[The Yielding Mortality]], [[The Taming]]
      in one ring slot, rares in every other slot, and a corrupted
      [[Forbidden Flame]] and [[Forbidden Flesh]] pair.
    changes: >-
      Block reaches 75% and 75%, armour reaches ten thousand, and the damage
      lands at 10.6 million for Static Strike on a 3.29 planner with a 15%
      shock assumption and no boss selected.
    links:
      - name: "Main link (shape from the 3.29 Slayer file)"
        gems: [Static Strike, Melee Physical Damage Support, Ruthless Support, Fortify Support, Trinity Support, Elemental Damage with Attacks Support]
      - name: "Auras (from the 3.29 Slayer file, not the Guardian one)"
        gems: [Hatred, Herald of Ash, Precision, Arrogance Support, Enlighten Support]
      - name: Granted by the staff
        gems: [Summon Greater Harbinger of Brutality]
    moveOn: >-
      there is no published next stage. The author's file is a finished
      character and he does not describe anything beyond it.
    details:
      - title: The gear list, as published
        body: |
          [[The Yielding Mortality]] in the weapon slot. Then rares in every other slot: a Magistrate Crown helmet, a Paladin's Hauberk body armour, Mesh Gloves, Legion Boots, an amulet, one rare ring, and a belt. [[The Taming]] is the second ring.

          Jewels include a corrupted [[Forbidden Flame]] and [[Forbidden Flesh]] pair. **The notable they allocate is not shown on the page**, and that is the single most load-bearing unknown in the whole setup.

          Note what is *absent*: no [[Mageblood]], no [[Progenesis]], no [[Headhunter]], no [[Watcher's Eye]], no cluster jewels. For a character with eleven and a half million damage per second and 219,000 effective hit points, that is a cheap-looking list — which is part of why the author calls it a league starter.
      - title: Reading the 219,015 figure honestly
        body: |
          Effective hit points in Path of Building is a single number squeezed out of life, energy shield, resistances, armour, block and physical damage reduction against an assumed attack profile. It is useful for comparing two versions of the same build and poor for comparing across builds.

          The parts you can check directly are more informative: 4,922 life and 1,777 energy shield is not a large pool, and 82% physical damage reduction with 75% block on both attacks and spells is what makes it hold. That shape fails in a specific way — against something that neither blocks nor cares about armour, such as a large unavoidable elemental hit or heavy chaos damage, where chaos resistance sits at 46%.

          **No source says this.** It follows from the numbers, and we flag it as the question to ask rather than a tested weakness.
      - title: Why Guardian rather than Slayer
        body: |
          The author wrote both. His 3.29 Static Strike Slayer reports 11.6 million damage per second, 5,556 life, 149,638 effective hit points, 22,589 armour and 90% physical damage reduction with 65% block on both axes. His 3.30 Guardian reports almost identical damage with 219,015 effective hit points, less armour and ten points more block on each axis.

          So the trade, on his own two files, is: the same damage, less raw armour, more block, and a much larger effective hit point number. **He gives no reason for the switch** beyond the title of the video, and we did not watch it.

powerCurve: |
  This build is two halves that never touch, so it has two curves. The damage is a multiplication: the gem's effectiveness of added damage, which climbs from 150.6% at gem level 1 to 346% at level 20, applied to the physical damage on your weapon, with half of the result converted to lightning. Crit and [[The Taming]] multiply that again in the published character. The defence is block and armour from the [[Guardian]] side, with [[Divine Shield]] paying out on top once there is armour for it to work with.

  The damage curve we can describe, because it is read off the gem and the staff. From level 12 the skill is on, and what you feel is gem levels and weapon rolls: every gem level raises the multiplier, and every weapon you swap in is multiplied by it. There is one real step, at level 66, when [[The Yielding Mortality]] replaces whatever rare two-hander you were carrying. That reading is ours, from PoEDB's numbers; the author publishes no levelling plan.

  The defence curve we cannot describe. The article's own line is that block and armour come from the tree and the ascendancy, but no levelling tree and no Labyrinth order is published, so nothing says when they arrive. What exists is the far end: a level 98 character on a 3.29 planner with 75% block, 75% spell block, 10,348 armour and 10.6 million hit damage per second against no selected boss. Part of that spell block is the staff's own +25%. Treat everything between level 12 and that file as unmapped.

play:
  mapping: |
    The rhythm below comes from the gem's own text. The author has published no written guide, so nobody has described how he plays it.

    1. Hit one enemy with [[Static Strike]]. The hit grants static energy for a base 4 seconds; it stacks up to 3 times.
    2. Keep moving. While static energy is up, beams fire from you on their own — every 0.32 seconds at gem level 20, at up to 6 targets, with one extra chain. They do the clearing.
    3. Hit something again before the 4 seconds run out. Skill effect duration stretches that window.
    4. [[Vaal Molten Shell]] sits on [[Cast when Damage Taken Support]] and needs nothing from you.

    The published character carries [[Elemental Weakness]], and the page does not show how it is applied.
  bossing: |
    The beams deal 30% less damage than the attack, so on a boss the attack is the tool and the beams are a bonus. You stand in melee range and keep swinging, which is the opposite of how you clear.

    1. Curse the boss with [[Elemental Weakness]].
    2. Keep the swings coming. If you run the link shape from the author's 3.29 Slayer file, [[Ruthless Support]] makes every third hit much larger; at the published 1.83 attacks per second that pattern is easy to keep.
    3. Step out of anything large and elemental. Block and armour are what hold this character up, and the article flags unavoidable elemental hits and heavy chaos damage as the place that shape should fail. No source has tested that; it follows from the numbers.

    Do not expect the published 10.6 million on a pinnacle boss. That figure has no boss selected.

troubleshooting:
  - symptom: "[[The Taming]] adds far less than its text suggests"
    cause: >-
      The ring pays per type of elemental ailment on the enemy, and Static
      Strike supplies one. It shocks on its own but deals no cold or fire
      damage, so freeze and ignite come only from the ring's own 10% chance.
      This is our reading; nothing on the author's page explains the third
      ailment.
    fix: >-
      Nobody has published an answer. Value the ring at one ailment type
      until you have seen three on a target. 3.30 offers an untested idea:
      [[Doedre's Tongue]] with "All Damage can Ignite, Shock or Freeze
      against Cursed Enemies", on a target cursed with [[Elemental Weakness]].
  - symptom: "[[Trinity Support]] is giving you nothing"
    cause: >-
      It only pays out while you deal fire, cold and lightning damage.
      Static Strike gives you lightning by conversion and nothing else.
    fix: >-
      Cold and fire have to come from gear or auras. The author's 3.29
      Slayer file uses [[Hatred]] and [[Herald of Ash]]; his Guardian page
      does not publish an aura set, so we cannot say the Guardian keeps
      them.
  - symptom: "The Forbidden jewel pair does nothing"
    cause: >-
      [[Forbidden Flame]] and [[Forbidden Flesh]] only work as a pair that
      names the same notable. Two different notables do nothing.
    fix: >-
      Match the notable on both before you buy. Which notable the published
      character uses is not shown on the page, so we cannot tell you which
      one to match — do not buy a pair on that character's say-so.
  - symptom: "[[Divine Shield]] is not regenerating anything"
    cause: >-
      It pays 3% of the physical damage prevented from hits recently, so it
      pays nothing until you are being hit and little until armour is
      stopping a lot. Energy shield cannot be recovered above your armour
      value. Whether blocked hits count as prevented is a question we could
      not resolve.
    fix: >-
      Take it once your armour is large. It is a reward for being tanky, not
      a way of becoming tanky.
  - symptom: "Your damage is nowhere near the published 10.6 million"
    cause: >-
      That number is a level 98 character with a 20/20 gem, the staff, 92.7%
      critical strike chance and a 415% multiplier, power charges and a 15%
      shock, on the 3.29 engine with no boss selected. It is a destination,
      not a benchmark for a character in maps.
    fix: >-
      Compare like with like. Then check the two things the gem multiplies
      hardest: the added physical damage on your weapon, and the gem's own
      level.
  - symptom: "The campaign has slowed to a crawl"
    cause: >-
      Not sourced — this is the general rule for a converted physical melee
      skill, and we say so. Your weapon has fallen behind. With added damage
      multiplied this heavily, an old weapon costs more here than on most
      builds.
    fix: >-
      A rare two-hander with the largest single physical damage roll you can
      find. From Act 6 the Item Tier is printed in the name, so you can read
      a good one off the ground.

patch:
  - entry: ruthless-changes
    note: >-
      **Check any claim that [[Guardian]] was changed this league.** The
      official notes do contain one Guardian line — Elemental Relics from
      [[Unwavering Crusade]] have a maximum level of 80, down from 85 — and
      **it sits in the Ruthless-specific section.** It does not apply to
      normal Covens of Umbra. Several launch articles have been reprinting
      Ruthless ascendancy changes as if they were general, and Guardian is on
      the list of classes affected only there.
  - note: >-
      **[[Static Strike]] was not touched.** PoEDB's version history ends at
      3.28.0, and the skill's name does not appear anywhere in the 3.30
      notes. Nor do [[The Yielding Mortality]] or [[The Taming]], whose own
      version histories end at 3.28.0. Treat that as "not mentioned in the
      sources we read" rather than proven unchanged: the official thread is
      129,000 characters and our reads covered it in two passes.
  - entry: doryani-and-doedre
    note: >-
      **A possible answer to the build's open question.**
      [[Doedre's Tongue]] now rolls one of "All Damage can Ignite, Shock or
      Freeze against Cursed Enemies", and has 30–35% to all elemental
      resistances. On a character that curses with [[Elemental Weakness]] and
      wants three ailment types for [[The Taming]], that is the obvious
      pairing. **Entirely untested, and nobody has proposed it.** The amulet
      now only drops from Covens of Umbra encounters.
  - entry: item-tiers
    note: >-
      **Helpful, and more than usually so.** Static Strike multiplies added
      damage by 346% at gem level 20, so a weapon upgrade is felt
      immediately. Being able to read a Rare's tier off the ground from Act 6
      makes the campaign weapon hunt much less blind.
  - entry: harvest-rework
    note: >-
      **This is your route to the staff.** Harvest no longer uses the Sacred
      Grove portal; Sacred Flora grow in the map. Harvest is a secondary
      mechanic, so it still appears without a Thread, which keeps the listed
      drop source alive.
  - entry: quality-of-life
    note: >-
      **Two small wins.** The crafting bench can now turn every socket white
      for an [[Orb of Scouring]], which removes the last reason to care about
      socket colours on a six-link. And granted skills on items show their
      description on hover, which is useful on a staff that grants a skill
      you may never have used.
  - entry: no-random-league-mechanics
    note: >-
      **Your early currency plan has to change.** Ten mechanics now appear
      only through Threads. Any 3.29 advice about farming Betrayal or Legion
      in white maps no longer works.

strengths:
  - "The skill is an Act 1 quest reward, so day one costs nothing."
  - "Hit once and move: the beams clear while you walk away, which is unusual for a melee build."
  - "The most-viewed single build on poebuilds.cc's 3.30 list, by a wide margin."
  - "The published defences are the strongest on this site: 75% block, 75% spell block, 82% physical damage reduction, 219,015 effective hit points."
  - "No expensive chase unique in the published gear. No Mageblood, no Headhunter, no cluster jewels."
  - "Neither the skill nor the ascendancy was changed in 3.30, in the normal game."
weaknesses:
  - "Single author. No guide site has covered it for 3.30."
  - "No leveling plan, no gem progression, no Labyrinth order, no prices are published anywhere."
  - "The planner is labelled 3.29, is a finished level-98 character, and has no boss selected."
  - "The Forbidden jewel pair's notable is not published, and a mismatched pair does nothing."
  - "[[The Taming]] wants three elemental ailment types and the skill supplies one. Nobody explains the gap."
  - "The staff is a forged unique with no published price and a Harvest-dependent drop."
  - "Block-and-armour defence is weakest exactly where it is weakest: unavoidable elemental hits and 46% chaos resistance."
avoidIf: >-
  Pick something else if you need a written leveling guide to follow, because
  this build does not have one — three other starters on this site publish an
  act-by-act tree and this one publishes nothing before level 98. Skip it too
  if you dislike melee range, or if you want to know what a build costs
  before you commit to it. What you are buying into here is a very strong
  skill and a very strong ascendancy, assembled by one person who has not
  written down how he got there.

