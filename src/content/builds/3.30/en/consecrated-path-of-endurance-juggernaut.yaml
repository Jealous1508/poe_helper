name: Consecrated Path of Endurance Juggernaut
tagline: >-
  A slam that teleports you into the pack and hits 10% harder and 10% wider
  for every endurance charge you hold. Nobody has published a 3.30 guide for
  it, so this page is built from last league's ladder and two older guides.
class: Marauder
ascendancy: Juggernaut
role: endgame
budget: low
budgetNote: >-
  **No source gives a currency figure for any part of this build, in any
  league.** Odealo's guide has a budget rating we could not read and calls
  [[Kaom's Sign]] and [[Ryslatha's Coil]] cheap, in 3.25 words. We list the
  build under endgame, not starter, for three reasons: no guide walks a
  league start in 3.30, the gem has to come out of the [[Divine Font]], and
  the version on last league's ladder wears a boss-only helmet and Forbidden
  jewels. It can still be levelled from nothing, and the stages below say
  how.
mainSkill: Consecrated Path of Endurance
image: asc-icon-juggernaut
hero: art-juggernaut
tags: [Slam, Fire, Endurance charges, Warcries, Two-handed]
ratings: { clear: 4, bossing: 3, survivability: 4, ease: 2 }
verified: "2026-11-14"
confidence: predicted
confidenceNote: >-
  **There is no 3.30 guide for this build. We looked on Maxroll, PoE Vault,
  Mobalytics, poebuilds.cc and the forum, and found none.** What this page
  rests on: Odealo's written guide, last updated for 3.25 in July 2024; a
  second Odealo guide for 3.29 that plays the same skill through totems but
  levels it by hand; the 245 characters using the skill on poe.ninja's 3.29
  ladder; one level 100 character's Path of Building from 3.29; and the gem,
  item and passive text as it stands today. The 3.30 patch notes do not
  change the skill, its supports or the Juggernaut, which we checked line by
  line. Every usage percentage here is 3.29 ladder data, and the ladder only
  shows characters that got far, so it describes the finished build and not
  the first week. The ratings are ours: no source gives a rating we could
  read. PoB Archives lists more builds for this skill, but its bot check
  blocked us and we did not open them.
modes:
  ssf: >-
    Possible in a plain form, and no source says so, so this is our reading.
    The gem comes from the [[Divine Font]], which is self-found by nature.
    [[Kaom's Sign]] is an ordinary unique ring. What you will not have for a
    long time is [[Echoes of Creation]], which PoEDB lists as an Uber Shaper
    drop, and the Forbidden jewels.
  hardcore: >-
    No source gives a verdict. Odealo calls the 3.25 version "extremely
    durable". The risk we see is that the damage reduction and the damage
    are the same resource: when the charges run out you lose both at once.

idea: |
  [[Consecrated Path of Endurance]] is a slam. You click near an enemy, the skill teleports you to it, you hit the ground, and everything around you takes fire damage.

  The gem has two lines that decide everything: **10% more attack damage and 10% more area of effect for each endurance charge you have.** A normal character holds three charges. This build holds ten or more.

  The catch is the cooldown. The skill can only be used once every 2 seconds, unless you spend an endurance charge to skip the wait. So every slam after the first costs a charge, and the charges are also your damage. The whole build is about getting charges back faster than the slam spends them.

  [[Juggernaut]] is the answer the sources give. [[Unflinching]] hands you charges when you are hit, and one time in four it refills all of them at once.

chain:
  - label: Slam
    text: "[[Consecrated Path of Endurance]] teleports you to the target and hits around you. Half the physical damage is already fire."
  - label: Spend a charge
    text: "The 2-second cooldown is skipped by spending one endurance charge. That is every slam except the first."
  - label: Earn it back
    text: "[[Endurance Charge on Melee Stun Support]] returns a charge when the hit stuns. [[Unflinching]] returns charges when you are hit."
  - label: Shout
    text: "[[Autoexertion]] fires your warcries by itself. Each warcry that exerts the slam adds damage through [[Overexertion Support]]."

chainDetails:
  - title: What one charge is worth
    body: |
      From the gem and support text on PoEDB:

      - The gem: 10% more attack damage and 10% more area of effect per charge.
      - [[Endurance Charge on Melee Stun Support]]: 4% more damage per charge.
      - [[Unyielding]], if you take it: 8% increased damage and 6% increased area per charge.

      The first two multiply each other. At 4 charges that is about 1.6 times the damage of a character with none. At 10 charges it is 2.8 times. At 11 it is about 3 times. **That arithmetic is ours**, from the two "more" lines above; no guide prints it.

      It is why the 3.25 guide says to aim for 10 or 11 charges, and why one 3.29 video is titled "18 Endurance Charge Stacker".
  - title: Where the charges come from
    body: |
      Odealo's guide lists these, and we checked each against the current text:

      1. [[Endurance Charge on Melee Stun Support]]: a charge when a melee hit from the linked skill stuns.
      2. [[Unflinching]]: 30% chance for a charge when you are hit, one charge every second if you were hit recently, and a 25% chance that any charge you gain becomes a full refill.
      3. [[Unyielding]]: 25% chance for a charge when you stun.
      4. [[Enduring Cry]], pressed by hand.

      That last point has a reason. [[Autoexertion]]'s own text says the warcries it triggers "do not grant Buffs or Charges to You or Allies". Put Enduring Cry in the automatic link and it gives you nothing. Odealo keeps it on a key, and so should you.
  - title: Why almost everyone takes Avatar of Fire
    body: |
      The skill converts 50% of its physical damage to fire. [[Avatar of Fire]] converts the other half, so every point of damage is fire and one kind of penetration covers all of it.

      62% of last league's ladder characters had it allocated. The 3.29 Odealo guide offers a second route while levelling: a Fire Mastery that converts 40% of physical damage to fire, which 14% of the ladder used.

      Avatar of Fire also means you deal no damage that is not fire. Added cold or lightning damage on a weapon is half wasted.
  - title: The helmet that hurts you
    body: |
      [[Echoes of Creation]] was on 78% of last league's ladder characters. Its text: skills deal 10–15% more damage for each warcry exerting them, and when you attack you take 15–20% of your life as physical damage for each warcry exerting the attack.

      With four warcries exerting one slam, that is 40–60% more damage and a hit of 60–80% of your life before mitigation. **The multiplication is ours.** The same endurance charges that power the slam are what reduce that hit, through [[Unrelenting]] and the charges themselves.

      PoEDB lists the helmet as a drop from the Uber Shaper. It is not a starting item, and nothing in the build needs it to work.
  - title: Crit or no crit
    body: |
      The two written guides do not use critical strikes. They take [[Precise Technique]], which is 40% more attack damage while your accuracy is higher than your life, and [[Undeniable]] makes that easy by giving accuracy equal to twice your Strength.

      Last league's ladder went the other way: 75% of characters were crit and 25% were not. The one Path of Building we decoded used [[Resolute Technique]].

      **No source we could open explains the crit version**: which nodes, how much accuracy, what it costs. We are not going to guess. Start on Precise Technique, which two guides describe.

mandatory:
  - term: Consecrated Path of Endurance
    why: >-
      The skill. It is a transfigured gem, so it does not come from a vendor
      or a quest.
    detail: >-
      PoEDB shows the base gem, [[Consecrated Path]], at level 28 from
      Clarissa in Act 3 for a Marauder. The "of Endurance" version comes
      from the [[Divine Font]] at the end of a Labyrinth run, or from another
      player. PoEDB lists it as the only transfigured version of the base
      gem, so the font has nothing else to give you by mistake. That last
      point is our reading of the gem's family list.
  - term: Endurance Charge on Melee Stun Support
    why: >-
      Returns a charge when the slam stuns, and gives 4% more damage per
      charge. Odealo calls it obligatory, and it was in 95% of last league's
      ladder links.
    detail: >-
      PoEDB: Yeena sells it to a Marauder after Sharp and Cruel in Act 2,
      from level 18.
  - term: Unflinching
    why: >-
      Charges when you are hit, one more maximum charge, and a one-in-four
      chance to refill completely. 94% of last league's ladder characters
      had it. The 3.29 guide makes it the moment you switch to the skill.
  - term: Enduring Cry
    why: >-
      Your manual refill. Press it at the start of a map and whenever the
      charge count drops. It must stay out of the [[Autoexertion]] link.
    detail: >-
      [[Kaom's Sign]] grants a level 10 Enduring Cry, so with the ring on you
      do not need the gem or a socket for it.
  - term: Pulverise Support
    why: >-
      More melee area damage and more area. In 90% of last league's ladder
      links.
  - term: Overexertion Support
    why: >-
      7–10% more damage for each warcry exerting the attack, and 10–14% more
      if it is exerted at all. In 89% of ladder links.
    detail: >-
      PoEDB: a Marauder gets it as a reward for The Eternal Nightmare in
      Act 4. It needs level 38.
  - term: Autoexertion
    why: >-
      Fires the linked warcries whenever their cooldown ends, so four shouts
      cost you no key presses. 92% of the ladder used it.
    detail: >-
      It reserves mana for every warcry linked to it; PoEDB shows a 20%
      reservation on the support. It needs level 24.
  - term: Kaom's Sign
    level: recommended
    why: >-
      +1 maximum endurance charge on a ring that needs level 1, plus a free
      [[Enduring Cry]]. On 86% of last league's ladder characters. Odealo
      names it as the cheap alternative to the best rings.
  - term: Avatar of Fire
    level: recommended
    why: >-
      Converts the half of your damage the gem leaves physical. 62% of the
      ladder took it.
  - term: Precise Technique
    level: recommended
    why: >-
      40% more attack damage while accuracy is above life. The version both
      written guides describe.
  - term: Determination
    level: recommended
    why: >-
      The one aura every source agrees on. With [[Sublime Vision]] it also
      becomes a maximum charge.
  - term: Death's Door
    level: recommended
    why: >-
      Boots with +1 maximum endurance charge and immunity to bleeding. On
      36% of the ladder. Odealo notes any boots can be corrupted for a
      chance at the same charge.
  - term: Sublime Vision
    level: recommended
    why: >-
      The Determination version gives +1 maximum endurance charge and
      stronger auras on you, and turns off every other aura. On 68% of the
      ladder.
  - term: Echoes of Creation
    level: recommended
    why: >-
      10–15% more damage per warcry exerting the slam, paid for in your own
      life. On 78% of the ladder, and an Uber Shaper drop.

labs:
  - lab: Normal
    node: Undeniable
    why: "Both Odealo guides take it first. It adds 500 accuracy plus twice your Strength, which is what turns on [[Precise Technique]]."
  - lab: Cruel
    node: Unflinching
    why: "The engine. The 3.29 guide says this is when you can swap to the skill: \"after the second lab where you allocate Unflinching\"."
  - lab: Merciless
    node: Unyielding
    why: "More damage and area per charge and a second way to gain charges on stun. **The guides disagree here**: the 3.25 guide takes [[Unbreakable]] third, the 3.29 one takes Unyielding."
  - lab: Eternal
    node: Unrelenting
    why: "1% less elemental and 1% less physical damage taken per charge. Both guides end on it or offer it, and 82% of the ladder had it."

stages:
  - id: acts-1-3
    phase: early
    image: sunder
    title: Acts 1–3
    levels: Level 1–33
    uses: >-
      [[Ground Slam]], then [[Sunder]] from level 12. **You do not play
      Consecrated Path here.** The 3.29 guide says so in one line: start
      with Sunder.
    changes: >-
      You pick up the pieces you will need later: [[Endurance Charge on
      Melee Stun Support]] in Act 2, and the base [[Consecrated Path]] gem
      from Clarissa in Act 3, to level in a spare socket.
    links:
      - name: Level 1–11
        gems: [Ground Slam, Ruthless Support]
      - name: From level 12
        gems: [Sunder, Ruthless Support, Melee Physical Damage Support]
      - name: Movement
        gems: [Leap Slam, Faster Attacks Support]
    moveOn: "Sunder is in a three-link or better and you have finished Act 3."
    details:
      - title: Where these links come from
        body: |
          **Neither Odealo guide lists levelling gems for this build.** The 3.25 guide points to a general two-handed Marauder guide. The 3.29 one names Sunder and stops.

          The links above are the standard Marauder opening from Maxroll's Boneshatter Juggernaut guide, which this site already carries. It is the same class, the same weapon type and the same first ten acts.
      - title: What the 3.29 guide adds
        body: |
          It tells you to keep [[Blood Rage]] on, to add fire damage with [[Herald of Ash]] and [[Infernal Cry]], and to include [[Seismic Cry]] and [[Intimidating Cry]] as they become available.

          On the tree: [[Graceful Assault]] for Onslaught, a source of Rage on hit, and two-handed damage nodes. It also lists [[Kaom's Sign]] among the uniques worth wearing early.

          It was written for a totem version of the skill. This levelling advice is from before the totems arrive, when you are still slamming by hand, so it applies.
      - title: Level the base gem now
        body: |
          Buy [[Consecrated Path]] from Clarissa after Sever the Right Hand and leave it in a spare socket. PoEDB shows it at level 28.

          Whether the [[Divine Font]] keeps a gem's level when it changes it is something we could not confirm. Levelling the base gem costs nothing either way.
  - id: acts-4-10
    phase: early
    image: unflinching
    title: Acts 4–10
    levels: Level 33–68
    uses: >-
      [[Sunder]] until the Cruel Labyrinth. After [[Unflinching]], switch to
      [[Consecrated Path of Endurance]] if you have the gem. Warcries go
      into [[Autoexertion]] from level 24.
    changes: >-
      [[Undeniable]] from the first lab, then [[Precise Technique]] straight
      after. At the switch you convert the rest of your damage to fire, with
      a Fire Mastery or [[Avatar of Fire]].
    links:
      - name: Until the switch
        gems: [Sunder, Ruthless Support, Melee Physical Damage Support, Endurance Charge on Melee Stun Support]
      - name: After the switch
        gems: [Consecrated Path of Endurance, Endurance Charge on Melee Stun Support, Pulverise Support, Melee Physical Damage Support]
      - name: Automatic warcries
        gems: [Autoexertion, Intimidating Cry, Seismic Cry, Infernal Cry]
      - name: Movement
        gems: [Leap Slam, Faster Attacks Support]
      - name: By hand
        gems: [Enduring Cry, Blood Rage]
    moveOn: "you are on Consecrated Path of Endurance, the slam never sits on its cooldown in a pack, and your resistances are back at 75%."
    details:
      - title: When to switch
        body: |
          The 3.29 guide: after the second lab. The 3.25 guide is more careful: switch "if you're positive you can withstand the Endurance Charge drain".

          Put those together. Before [[Unflinching]] you have three charges and one way to get them back. After it you have four and three ways. If the slam still stalls on its 2-second cooldown, go back to [[Sunder]] for a few levels. Nothing is lost.

          You also need the gem, which means a Labyrinth run that ends at a [[Divine Font]], or a trade. If you have neither by Cruel, keep playing Sunder. It is a complete character.
      - title: The four-link after the switch is ours
        body: |
          No guide gives a four-link. The set above is the four supports most used with the skill on last league's ladder, minus [[Overexertion Support]], which does nothing until warcries are exerting the slam and multiplies the skill's mana cost by 1.4.

          Add Overexertion when [[Autoexertion]] is running and your mana allows it.
      - title: Bandits and Pantheon
        body: |
          **Kill all three bandits.** Odealo says so, and 86% of last league's ladder characters did. The single Path of Building we decoded helped Alira, which 13% did.

          Pantheon is unsettled. Odealo's 3.25 guide takes Soul of Solaris and Soul of Abberath. Its 3.29 guide takes the Brine King and Gruthkul. The ladder split three ways between the Brine King, Lunaris and Arakaali at about 30% each.
      - title: Passive tree
        body: |
          The 3.25 guide describes its trees in one line each. At 26 points: life, some damage, and converting the rest of your damage to fire. At 67 points: more life, elemental damage, and the first maximum endurance charge nodes.

          It links full trees, for 3.25. **We found no levelling tree made for 3.29 or 3.30.**
  - id: early-maps
    phase: early
    image: kaoms-sign
    title: Early maps
    levels: White and yellow maps
    uses: >-
      [[Consecrated Path of Endurance]] in a five-link on a rare two-handed
      weapon with high physical damage, one or two [[Kaom's Sign]] rings,
      and rare armour with life and resistances.
    changes: >-
      You start counting maximum charges. [[Determination]] goes on.
      [[Overexertion Support]] joins the main link.
    links:
      - name: Main skill
        gems: [Consecrated Path of Endurance, Endurance Charge on Melee Stun Support, Pulverise Support, Overexertion Support, Melee Physical Damage Support]
      - name: Automatic warcries
        gems: [Autoexertion, Intimidating Cry, Seismic Cry, Infernal Cry, Battlemage's Cry]
      - name: Movement
        gems: [Leap Slam, Faster Attacks Support, Blood Rage]
      - name: Guard and curse
        gems: [Cast when Damage Taken Support, Molten Shell, Flammability]
      - name: Aura
        gems: [Determination]
    moveOn: "you hold six or more charges in a fight and the slam clears a pack in one hit."
    details:
      - title: Do not buy Tidebreaker on the old guide's word
        body: |
          The 3.25 guide recommends [[Tidebreaker]] as the cheap first weapon, because it has [[Endurance Charge on Melee Stun Support]] built in and, at the time, 10% increased physical damage per endurance charge.

          **3.29 rewrote the mace.** PoEDB's history: it lost the damage per charge, and now has "50% chance to gain a Brine Charge instead of an Endurance Charge".

          For a skill that spends an endurance charge on every use, losing half of your charge gains is a real cost. That is our reading of the new text, and nobody has written it up. The ladder agrees in its own way: only 9% of last league's characters used a two-handed mace of any kind.
      - title: What to look for on the weapon
        body: |
          Odealo: the weapon is "still the most important part of an attack build", and you want the highest physical damage per second you can get. Its 3.25 target for a finished rare mace was 750.

          The skill uses 167% of your weapon's damage at gem level 1 and 306% at level 20, and attacks at 80% of the weapon's speed. Slow and heavy is fine. Odealo says attack speed is "redundant for clearing".
      - title: Counting charges at this stage
        body: |
          Three to start, one from [[Unflinching]], one from each [[Kaom's Sign]]. That is five or six, plus whatever maximum charge nodes your tree has reached.

          Each one after that is a gear slot: boots, a staff, a jewel. Those are the red-map stage.
      - title: Mana
        body: |
          [[Autoexertion]] reserves mana for every warcry linked to it, and [[Determination]] reserves more. What is left has to pay for the slam.

          79% of last league's ladder took the mastery for 12% mana reservation efficiency, and 26% took "Skills Cost Life instead of 15% of Mana Cost". The level 100 character we decoded carries two mana flasks. Expect this to be tight.
  - id: red-maps
    phase: endgame
    image: sublime-vision
    title: Red maps
    levels: Tier 11–16 maps
    uses: >-
      A rare staff on an [[Eventuality Rod]] base, [[Death's Door]], a
      [[Sublime Vision]] set to [[Determination]], and the six-link.
    changes: >-
      You reach the 10 or 11 charges the 3.25 guide aims for. Every aura
      except Determination is switched off by the jewel, so the build gets
      simpler as it gets stronger.
    links:
      - name: Main skill
        gems: [Consecrated Path of Endurance, Endurance Charge on Melee Stun Support, Pulverise Support, Overexertion Support, Melee Physical Damage Support, Fist of War Support]
      - name: Automatic warcries
        gems: [Autoexertion, Intimidating Cry, Seismic Cry, Infernal Cry, Battlemage's Cry]
      - name: Movement
        gems: [Leap Slam, Faster Attacks Support, Momentum Support, Blood Rage]
      - name: Guard and curse
        gems: [Cast when Damage Taken Support, Vaal Molten Shell, Flammability]
      - name: Aura
        gems: [Determination, Enlighten Support]
    moveOn: "ten or more charges, capped resistances, and Tier 16 maps without the slam ever stalling."
    details:
      - title: Why the ladder moved to staves
        body: |
          80% of last league's characters with this skill held a staff. The one we decoded used an [[Eventuality Rod]], whose implicit is +1 to maximum power and endurance charges, with a second +1 maximum endurance charge as a rolled modifier.

          Two charges on the weapon slot is why. Odealo's 3.25 guide already mentions the base as an option "for one extra Endurance Charge", and warns it needs changes to the tree. It does not say which changes, and we did not find them written anywhere.
      - title: The sixth support is a choice
        body: |
          Four supports are near-universal on the ladder. The fifth and sixth vary: [[Melee Physical Damage Support]] 81%, [[Increased Critical Damage Support]] 41%, [[Elemental Damage with Attacks Support]] 35%, [[Fist of War Support]] 20%.

          Odealo's 3.25 link ends on Fist of War and says to swap it out if your attack speed is very high. The crit support is for the crit version, which we cannot describe.
      - title: What Sublime Vision costs
        body: |
          The jewel disables every aura other than [[Determination]]. That removes [[Herald of Ash]] and [[Precision]], which the 3.25 guide runs.

          In return: one more maximum charge, and Determination itself up to a third stronger on you. 68% of the ladder made that trade.
      - title: Numbers, all from 3.29
        body: |
          The level 100 character on pobb.in shows 12.6 million damage per second, 94,000 effective hit points, 40,000 armour and 4,576 life.

          It also shows where it is thin. Its largest survivable hit is about 228,000 fire and 61,500 physical, and 22,900 chaos. **Chaos damage is the gap** on that character.

          On poe.ninja, level 97–100 characters ranged from under 5 million to over 100 million damage, and from 25,000 to over 200,000 effective hit points. That is a wide spread, and none of it is 3.30.
  - id: endgame
    phase: endgame
    image: autoexertion
    title: Endgame
    levels: Tier 17, pinnacle bosses and beyond
    uses: >-
      [[Echoes of Creation]], a [[Forbidden Flame]] and [[Forbidden Flesh]]
      pair for another Juggernaut notable, [[Elegant Hubris]],
      [[Kalandra's Touch]] copying a [[Kaom's Sign]], and cluster jewels.
    changes: >-
      This is the version on last league's ladder, and three in four of
      those characters were crit. The helmet makes every exerted slam cost
      you life.
    moveOn: "there is no next stage. A quarter of the ladder went on to [[Mageblood]]."
    details:
      - title: What the top of the ladder wore
        body: |
          Usage among the 245 characters, 3.29:

          - [[Kaom's Sign]] 86%, [[Kalandra's Touch]] 72%.
          - [[Echoes of Creation]], [[Elegant Hubris]], and the Forbidden jewel pair: 78% each.
          - [[Sublime Vision]] 68%, [[Thread of Hope]] 58%.
          - [[Death's Door]] 36%, [[Watcher's Eye]] 33%.
          - [[Mageblood]] 27%, [[Ralakesh's Impatience]] 24%, a Foulborn [[Ambu's Charge]] 23%.

          This is a list of what finished characters had. It is not an order to buy things in, and it says nothing about price.
      - title: The notable in the Forbidden jewels
        body: |
          The character we decoded used the pair for [[Unyielding]], on top of [[Unflinching]], [[Unrelenting]] and [[Untiring]] from the tree.

          On the ladder as a whole: Unflinching 94%, Unrelenting 82%, Unyielding 62%, [[Unstoppable]] 61%. [[Undeniable]], the first lab pick in both guides, is not among the twelve most-taken notables. That fits a ladder that went crit and stopped needing its accuracy for [[Precise Technique]]. **The explanation is ours.**
      - title: Cluster jewels and masteries
        body: |
          The notables that recur: Fuel the Fight 76%, Overlord 72%, Martial Prowess 64%, and on the warcry mediums Lead By Example and Mob Mentality at 70% each.

          Masteries: 3% increased damage per endurance, frenzy or power charge (80%), warcries have a minimum of 10 power (73%), and warcries grant Rage (66%).
      - title: What we could not find
        body: |
          - A crit tree, or any explanation of the switch to crit.
          - A budget for any stage.
          - Which bosses the build handles badly. Odealo says only that single-target damage is "relatively low".
          - Anything at all written for 3.30.

powerCurve: |
  This build has one multiplier that matters more than the rest, and it is a number you can read off your screen: **how many endurance charges you hold.** The gem gives 10% more damage and area per charge, and the stun support gives another 4% more damage per charge. Everything else, the weapon, the warcries, the fire conversion, sits on top of that.

  **At level 30 you have none of it.** You are a [[Sunder]] character with three charges and no reason to care about them. The gem does not exist for you yet. This part of the game says nothing about how the build will feel.

  **Around level 55, at the Cruel Labyrinth, it starts.** [[Unflinching]] gives a fourth charge and, more importantly, the refill. Four charges is roughly 1.6 times the damage of none, by our arithmetic. At level 70, with two [[Kaom's Sign]] rings, you are at six: about twice. It is a working character, and it will feel ordinary.

  **By level 95 you want ten or eleven**, from boots, a staff and a jewel: about three times. The last step is a different axis. [[Echoes of Creation]] and [[Overexertion Support]] multiply by how many warcries exert each slam, and that is where the 3.29 ladder found its top end.

  So the curve is flat, then a step at Cruel lab, then a steady climb where **each upgrade is one more charge**. It is also why the build is fragile in one specific way: the same count sets your damage, your area and, through [[Unrelenting]], your damage reduction. Lose the charges and all three fall together. The reasoning in this section is ours; the numbers in it are the game's.

upgrades:
  - step: "A [[Kaom's Sign]], then a second"
    why: >-
      One maximum charge per ring, from level 1, on an ordinary unique. Each
      charge is 10% more damage and area on the gem and 4% more on the
      support. Nothing else gives a charge for less. The order of this whole
      list is ours: no source ranks these.
  - step: "A two-handed weapon with more physical damage"
    why: >-
      The slam uses up to 306% of weapon damage, so the weapon is the base
      everything multiplies. It comes second only because a charge is
      cheaper than a weapon. Odealo's 3.25 target was 750 physical damage
      per second on a rare.
  - step: "The six-link with [[Pulverise Support]] and [[Overexertion Support]]"
    why: >-
      Two more multipliers on the same hit. After the weapon, because
      supports multiply the weapon's damage and a weak weapon leaves them
      little to multiply.
  - step: "Boots with +1 maximum endurance charge"
    why: >-
      [[Death's Door]] has it built in. Odealo says any boots can be
      corrupted for a chance at it. One more charge, in a slot that was
      giving no damage.
  - step: "[[Sublime Vision]] for [[Determination]]"
    why: >-
      Another charge and a stronger Determination. It sits this late because
      it turns off every other aura, so buy it once you are ready to give
      those up.
  - step: "A staff on an [[Eventuality Rod]] base"
    why: >-
      Up to two charges on the weapon slot. It is below the jewel because it
      replaces your weapon, and the 3.25 guide warns the tree has to change
      to fit it without saying how.
  - step: "[[Echoes of Creation]]"
    why: >-
      10–15% more damage per warcry exerting the slam. It multiplies a
      different axis from charges, so it stacks with all of the above. Last
      on purpose: it is an Uber Shaper drop, and it hurts you until your
      charges and armour can absorb the self-hit.
  - step: "A Forbidden jewel pair, then [[Kalandra's Touch]]"
    why: >-
      A fifth ascendancy notable, and a third Kaom's Sign in effect. Both
      were on about three quarters of the 3.29 ladder. Luxury items: they
      add to a build that already works.

play:
  mapping: |
    1. **Before the first pack, press [[Enduring Cry]].** You enter every map with no charges, which means no damage bonus and a 2-second cooldown.
    2. Click [[Consecrated Path of Endurance]] on a pack. It teleports you in and slams. Click the next pack. The skill is your movement inside a fight.
    3. [[Autoexertion]] shouts for you. You do not press those warcries.
    4. [[Leap Slam]] across gaps and between packs that are too far to teleport to.
    5. Watch the charge count. If it drops to two or three, Enduring Cry again.

    Odealo's summary of clearing: the area and the size of the hit make attack speed unimportant. You should be killing packs in one slam, not standing in them.

    The built-in tension: the skill puts you in the middle of every pack, every time. You are not choosing where to stand.
  bossing: |
    Odealo names single-target damage as the build's one weakness, and the mechanics say why.

    - **Stand on the boss.** The gem deals up to 20% more damage to closer targets.
    - **Enduring Cry on cooldown.** A boss is one target. If your hit does not stun it you get nothing back from the stun support, and [[Unflinching]] only pays while you are being hit.
    - **Count your exerts.** [[Intimidating Cry]] exerts only two attacks, three with Measured Fury. Odealo notes you attack about once a second, so it "may not always be available".
    - Curse with [[Flammability]]. The guide applies it by hand, through a corrupted glove implicit, or with Hextouch.

    If the slam goes onto its cooldown mid-fight, you are out of charges. Stop, shout, and start again. Slamming at the 2-second pace with no charges is the worst of both.

deaths:
  - situation: "The first pack of a map, or the first seconds after a long walk."
    cause: >-
      No charges. You teleport into a pack with none of the damage reduction
      the build is designed around, and the slam is on its 2-second cooldown
      after one use. Our reading of the mechanics; no source reports it.
    fix: >-
      [[Enduring Cry]] before you engage, every time. With [[Kaom's Sign]]
      it is always on your bar.
  - situation: "A map where monsters cannot be stunned, or a boss you cannot stun."
    cause: >-
      [[Endurance Charge on Melee Stun Support]] and [[Unyielding]] both
      need a stun. Without one, the slam spends charges and only being hit
      gives them back.
    fix: >-
      Reroll "cannot be stunned" maps. On bosses, keep Enduring Cry on
      cooldown and accept a slower rhythm. The Boneshatter Juggernaut
      article on this site, another endurance-charge build, lists the same
      map modifier among the things that kill it.
  - situation: "Dying to your own attack after putting on Echoes of Creation."
    cause: >-
      The helmet deals 15–20% of your life to you as physical damage for
      each warcry exerting the attack. With four warcries and few charges
      up, most of your life is gone before the enemy does anything. The sum
      is ours, from the item text.
    fix: >-
      Do not equip it until your charges and armour are in place. Then keep
      the charges up: they are what mitigates the hit.
  - situation: "Chaos damage and damage over time in red maps."
    cause: >-
      Everything here reduces hits, and mostly physical and elemental ones.
      The one 3.29 character we decoded could take a 228,000 fire hit and
      only a 22,900 chaos hit.
    fix: >-
      Chaos resistance on rare gear. Odealo's stat list puts it seventh; we
      would put it higher once you are in red maps.

troubleshooting:
  - symptom: "The skill keeps going on a 2-second cooldown."
    cause: >-
      You have no endurance charge to spend. Either the hits are not
      stunning, or [[Endurance Charge on Melee Stun Support]] is missing
      from the link, or you are using a weapon that turns charge gains into
      something else.
    fix: >-
      Check the link first. Then check the weapon: [[Tidebreaker]] has
      turned half of all endurance charge gains into Brine Charges since
      3.29. More hit damage stuns more often; so does the support's own
      reduced stun threshold as it levels.
  - symptom: "My damage on bosses is far lower than in maps."
    cause: >-
      In maps, every pack refills you through stuns and through being hit.
      A boss does neither reliably, so you fight it with fewer charges, and
      your warcry exerts run out faster than they come back.
    fix: >-
      [[Enduring Cry]] on cooldown, stay close for the gem's 20% bonus, and
      curse with [[Flammability]]. More maximum charges also means a deeper
      reserve to spend during the fight.
  - symptom: "I run out of mana."
    cause: >-
      [[Autoexertion]] reserves mana for each linked warcry, and
      [[Determination]] takes most of the rest. [[Overexertion Support]]
      multiplies the slam's cost by 1.4.
    fix: >-
      The reservation efficiency mastery, which 79% of the ladder took.
      Fewer warcries in the automatic link. A quarter of the ladder used
      the mastery that moves part of the cost to life.
  - symptom: "The 40% from Precise Technique is not showing."
    cause: >-
      Your accuracy is not higher than your maximum life. Both Odealo
      guides repeat this warning.
    fix: >-
      [[Undeniable]] gives accuracy equal to twice your Strength, so more
      Strength fixes it. Accuracy on gloves, or a low-level [[Precision]]
      if you have not yet equipped [[Sublime Vision]].
  - symptom: "It felt fine until red maps."
    cause: >-
      You are still on five or six charges. The damage per charge does not
      change, but the content does. At six charges you have about two
      thirds of the damage of a ten-charge character, by our arithmetic.
    fix: >-
      Count your maximum charges and add the next one: boots, then the
      jewel, then the staff. Check resistances are capped at the same time.

patch:
  - note: >-
      **Nothing in 3.30 touches the skill, its supports or the Juggernaut.**
      We read the skill, support, ascendancy and unique item sections of the
      notes for all of them, and compared the Juggernaut's notables against
      GGG's current tree data. The Juggernaut is not even in the
      Ruthless-only list.
  - entry: mercenary-nerfs
    note: >-
      **The Pulverise change is not yours.** The notes raise Pulverise
      Support to 25% more melee area damage, under Mercenary Changes, for
      gems used by hired mercenaries. The player's
      [[Pulverise Support]] is not mentioned.
  - entry: ralakeshs-impatience
    note: >-
      **Check the boots before you buy.** New [[Ralakesh's Impatience]]
      roll -1 to maximum power, endurance or frenzy charges. A pair with
      the endurance penalty costs this build a charge. A quarter of last
      league's ladder wore these boots. Older pairs are unchanged.
  - entry: special-base-implicits
    note: >-
      **A small free buff.** [[Spiked Gloves]] now give 24–30% increased
      melee damage, up from 16–20%. 96% of ladder characters wore rare
      gloves, so the base is open to you.
  - note: >-
      **The change that matters is from 3.29, and the main guide predates
      it.** [[Tidebreaker]] lost its damage per endurance charge and gained
      a 50% chance to give a Brine Charge instead of an endurance charge.
      The 3.25 guide's cheap starter weapon now works against the skill.
  - entry: league-fates
    note: >-
      **Go easy on Fates at first.** Each Fate makes the area boss harder,
      and single targets are where this build is weakest. Our suggestion,
      not a tested one: one Fate per boss until you hold ten charges.
  - entry: item-tiers
    note: >-
      **Helpful for the plain version.** The starting gear is rare armour
      with life and resistances and a rare two-handed weapon, and tiered
      drops from Act 6 make those easier to find.

strengths:
  - "Fast clear: the skill moves you from pack to pack by itself (Odealo)."
  - "Very large hits and area, both of which grow with one number you can see."
  - "Durable against hits. Odealo calls it one of the most durable builds for its price."
  - "A cheap first step in [[Kaom's Sign]], and a long list of upgrades after it."
  - "Warcries are automated, so the button count is lower than older guides suggest."
weaknesses:
  - "No guide for 3.30, 3.29 or anything newer than 3.25 that plays it by hand."
  - "Single-target damage is relatively low (Odealo's only listed con)."
  - "Damage, area and damage reduction all fall together when charges run out."
  - "The gem is transfigured: no vendor, no quest."
  - "The ladder version is crit and nobody has written down how."
  - "Mana is tight between Autoexertion and Determination."
avoidIf: >-
  Pick something else if you want a build you can follow step by step: this
  one has no current guide, and you will be reading a tree from 2024 and a
  ladder from last league. Skip it too if you want strong boss damage on a
  budget, or if you dislike a character that jumps into the middle of every
  pack whether you meant it to or not. If what you want is a tanky
  Juggernaut with a guide behind it, the Boneshatter Juggernaut on this site
  has one.

