name: Frost Blades Slayer
tagline: >-
  Hit one monster from long reach and icy blades fly out of it into the rest
  of the pack. You clear the Atlas on a two-handed axe, then rebuild into a
  claw-and-shield crit character.
class: Duelist
ascendancy: Slayer
role: starter
budget: starter
budgetNote: >-
  **The author gives no prices anywhere**, in the video description or in the
  Path of Building file, and we are not going to invent any. What he does say:
  the campaign and early maps run on rare two-handed axes you find. Around
  Tier 10–11 maps you "spend what currency you have" on three things: a
  [[Carnage Heart]] or an attribute amulet, [[Devoto's Devotion]], and a
  corrupted six-link. The final version is another matter. Its example gear
  has six fractured items, and fractured items are harder to get in 3.30.
mainSkill: Frost Blades
image: asc-icon-slayer
hero: art-slayer
tags: [Melee, Strike, Cold, Crit later]
ratings: { clear: 5, bossing: 3, survivability: 3, ease: 3 }
verified: "2026-11-14"
confidence: mixed
confidenceNote: >-
  **The four ratings are ours.** The author rates the build himself in his
  video, at the 2:21 mark, and we could not watch it; we worked from the video
  description and from his Path of Building file, which we decoded and read in
  full. That file is detailed (a tree and a gem set for every act, and the
  author's written notes on the endgame), but it uses the 3.29 passive tree,
  it was saved without any damage or life totals, and it is one author's work.
  We found no second written guide for a Slayer version in 3.30. The skill
  itself is long proven, and the author's own summary is that "nothing has
  really changed for a while with Frost Blades". So: proven archetype, one
  source, no numbers.
modes:
  ssf: >-
    The author gives no verdict. Our read: the first half suits it well. The
    axe version is rare two-handed axes and rare armour, and his notes say you
    can clear the Atlas on it. The second half does not. [[Carnage Heart]],
    [[Devoto's Devotion]], [[Heatshiver]] and [[The Taming]] are all drops,
    and the finished claw in his file is a fractured base.
  hardcore: >-
    The author gives no verdict. Our read: not a natural fit. The defence is
    leech, evasion, spell suppression and later a shield, with one automated
    guard skill. All of those are chances or need you to keep hitting. His own
    note about league start is that "horrible corrupted maps will feel bad".

idea: |
  [[Frost Blades]] is a melee strike with unusually long reach. When it hits its first enemy, blades of ice fly out of that enemy towards others nearby. You hit one monster and the pack behind it takes the blades.

  The gem turns 60% of your physical damage into cold damage. So you scale it like a weapon attack (a big weapon, attack speed) and like a cold skill ([[Hatred]], cold penetration, freezing things) at the same time.

  [[Slayer]] supplies what a melee character usually lacks. Life leech that keeps running when your life is full. Monsters at 20% life or less simply die. More damage against bosses. Later, as many endurance charges as you have frenzy charges.

  This guide's version has two lives. First a two-handed axe that never crits, using [[Precise Technique]]. The author says that version clears the whole Atlas. Then, with currency in hand, you switch to a claw and a shield and become a crit build that freezes what it hits.

chain:
  - label: Strike
    text: "[[Frost Blades]] hits from 1.8 to 2.1 metres further than a normal strike, and 60% of the physical damage becomes cold."
  - label: Blades fly
    text: "The first enemy hit releases 5 to 8 icy projectiles at other enemies. They deal 30% less damage than the strike."
  - label: More targets
    text: "Each extra enemy the strike can target releases its own set of blades. A mastery in Act 2 and a glove implicit later each add one."
  - label: Leech and cull
    text: "[[Brutal Fervour]] keeps life leech running at full life. [[Headsman]] kills anything at 20% life or lower."

chainDetails:
  - title: Why the first weapon is a two-handed axe
    body: |
      Frost Blades deals a percentage of your weapon's damage: 144% of base at gem level 1 and 410% at level 20, according to PoEDB. A two-handed axe has the biggest base damage you can pick up off the ground.

      The keystone [[Precise Technique]] then gives "40% more Attack Damage if Accuracy Rating is higher than Maximum Life", at the price of never dealing a critical strike. The author takes it in Act 3 and keeps it until the claw switch.

      To make the condition true on levelling gear, his tree takes the Accuracy Mastery "+500 to Accuracy Rating" in Act 2, and swaps it in Act 7 for the one that makes Dexterity give +3 accuracy per point.

      The result is a character that needs no crit and no special items for most of the Atlas. That is the reason it works as a league starter.
  - title: Strike targets are your clear speed
    body: |
      A strike skill normally hits one enemy. Every additional enemy it can target releases another set of blades.

      The author's first link in Act 1 uses [[Ancestral Call Support]], which lets the strike target two more enemies. PoEDB's own tutorial text for this pairing says that with at least three enemies nearby this can triple the number of blade projectiles.

      In Act 2 his tree takes the Attack Mastery "Non-Vaal Strike Skills target 1 additional nearby Enemy", and Ancestral Call leaves the link for a damage support. In the endgame sets the gloves carry the same line as an Eldritch implicit.
  - title: All cold in the axe phase, and why that has to end
    body: |
      In Act 4 the tree takes the Cold Mastery "40% of Physical Damage Converted to Cold Damage". With the gem's own 60%, every point of damage is now cold. That is ideal while you never crit: one damage type, one aura, one resistance to get through.

      The claw version needs the opposite. Its tree takes the Bleeding Mastery "80% increased Critical Strike Chance against Bleeding Enemies", and only physical damage can cause bleeding.

      So the author's note on the switch is firm: change the Cold Mastery from the conversion to "enemies take more damage when frozen", because "you need physical damage to bleed to proc a lot of crit chance and crit multi".

      If you forget this step your claw character has no bleed and far less crit. See the troubleshooting list.
  - title: What Slayer gives, in the order you take it
    body: |
      From GGG's tree data:

      - **[[Bane of Legends]]:** 20% more damage with hits against unique enemies, 10% more damage if you have killed recently, and you cannot take reflected physical damage.
      - **[[Headsman]]:** kills enemies at 20% life or lower. 10% attack speed for 20 seconds after killing a rare or unique enemy, and 10% movement speed for 20 seconds after any kill.
      - **[[Brutal Fervour]]:** life leech is not removed when your life is full, 100% increased maximum recovery per leech, and 10% reduced damage taken while leeching.
      - **[[Masterful Form]]:** +1 maximum frenzy charge, and your maximum endurance charges equal your maximum frenzy charges.

      The build does not take the notables Impact or Endless Hunger.
  - title: Freezing, in the finished version
    body: |
      The last gear set is built around frozen enemies.

      - [[Heatshiver]]: "Gain 30% of Cold Damage as Extra Fire Damage against Frozen Enemies", and 1% per 1% of chill on enemies that are only chilled. The author's note: get one "as soon as possible", it "gives a lot more damage".
      - The Cold Mastery from the claw tree: enemies permanently take 5% increased damage for each second they have ever been frozen by you, up to 50%.
      - [[Summon Skitterbots]] with [[Bonechill Support]] to chill what you cannot freeze.
      - [[The Taming]], a ring that gives more elemental damage for each type of elemental ailment on the enemy.
      - [[Herald of Ice]], which makes frozen enemies shatter.

      A boss that cannot be frozen still takes the chill half of this.
  - title: What we could not get from this source
    body: |
      - **The author's own ratings.** They are in the video and not written down.
      - **Any price.** There is none in the description or the file.
      - **Any damage or life total.** The file was saved without them, and we do not run Path of Building ourselves.
      - **Map modifiers to avoid.** The author publishes a search string for rolling maps but not a list, and we will not guess what the string expands to.
      - **Why he picks each bandit, Pantheon power and lab order.** The file records the choices, not the reasons.

mandatory:
  - term: Frost Blades
    why: >-
      The skill, from level 1 to the end. It is the base gem: the build does
      not use a transfigured version.
    detail: >-
      PoEDB lists it as a quest reward only for the Ranger. The Duelist buys
      it from Nessa after Enemy at the Gate, the first quest in the game.
  - term: Precise Technique
    why: >-
      40% more attack damage while your accuracy is higher than your life.
      It is the engine of the axe version.
    detail: >-
      Taken in Act 3. It leaves the tree at the claw switch, when the build
      starts to crit.
  - term: Bane of Legends
    why: >-
      Your first ascendancy notable in the author's trees. More damage against
      unique enemies, and more after a recent kill.
  - term: Brutal Fervour
    why: >-
      Leech that keeps going at full life. It is your recovery, and it makes
      "damage while leeching" modifiers on your gear work all the time.
  - term: Multistrike Support
    why: >-
      In the main link from Act 5 to the last gear set. It repeats the attack
      twice more, faster.
  - term: Elemental Damage with Attacks Support
    why: >-
      In the main link from Act 3 through the whole axe phase, and again in
      the finished set.
  - term: Hatred
    why: >-
      The damage aura from Act 3 through the whole axe phase. It adds cold
      damage based on your physical damage and gives more cold damage.
    detail: >-
      It is missing from both claw gem sets in the author's file, along with
      [[Precision]]. The file does not say why, and we could not tell whether
      that is deliberate. Check what your mana allows before dropping it.
  - term: Ice Bite Support
    level: recommended
    why: >-
      Joins the main link in early maps and stays to the end.
  - term: Fortify Support
    level: recommended
    why: >-
      In the link from Act 6 for the damage reduction. In the last set it is
      replaced by a body armour implicit that gives a chance to fortify on
      melee hit.
  - term: Carnage Heart
    level: recommended
    why: >-
      The author's first purchase when the build slows down: attributes,
      resistances, life leech, and increased damage while leeching.
    detail: >-
      His alternative is any amulet with attributes, with "damage while
      leeching" added at the crafting bench.
  - term: Devoto's Devotion
    level: recommended
    why: >-
      His second purchase: 16% attack speed, 20% movement speed and a large
      block of Dexterity on a helmet.
  - term: Heatshiver
    level: recommended
    why: >-
      Replaces [[Devoto's Devotion]] in the crit version. Extra fire damage
      against chilled and frozen enemies.
  - term: Assassin's Mark
    level: recommended
    why: >-
      Applied for you by [[Mark On Hit Support]] in the claw version. The
      author's instruction: put it in a blue socket on the claw and get the gem
      to 10% quality, for "consistent power charges on bosses".
  - term: Summon Skitterbots
    level: recommended
    why: >-
      Chill and shock on everything near you, from early maps. Later linked to
      [[Bonechill Support]].
  - term: Vaal Haste
    level: recommended
    why: >-
      A speed burst for bosses. The author's note says to use the tincture and
      Vaal Haste together on map bosses.

labs:
  - lab: Normal
    node: Bane of Legends
    why: "It is in the author's Act 3 tree. He gives no written reason. Ours: it is the only one of the four that is plain damage, and damage is what the campaign asks for."
  - lab: Cruel
    node: Headsman
    why: "In his Act 7–8 tree. Culling at 20% life shortens every fight, and the movement speed after each kill is the first real mapping speed you get."
  - lab: Merciless
    node: Brutal Fervour
    why: "In his last campaign tree. Your recovery from here on. The same tree picks up the Leech Mastery."
  - lab: Eternal
    node: Masterful Form
    why: "In his final axe tree. His notes say that gear lets you \"breeze through Uber Lab\". It turns frenzy charge nodes into endurance charges as well."

stages:
  - id: acts-1-3
    phase: early
    image: spectral-throw
    title: Acts 1–3
    levels: Level 1–33
    uses: >-
      [[Frost Blades]] from level 1 for packs, with [[Spectral Throw]] in a
      second link for single targets. Rare two-handed axes, replaced often.
    changes: >-
      In Act 2 the tree takes the strike-target mastery and the accuracy
      mastery. In Act 3 you add [[Hatred]], take [[Precise Technique]], and
      run the Normal Labyrinth for [[Bane of Legends]].
    links:
      - name: Act 1, packs
        gems: [Frost Blades, Added Fire Damage Support, Ancestral Call Support]
      - name: Act 1, single target
        gems: [Spectral Throw, Chance to Bleed Support, Added Fire Damage Support]
      - name: Act 2
        gems: [Frost Blades, Added Fire Damage Support, Ruthless Support]
      - name: Act 3 four-link
        gems: [Frost Blades, Added Fire Damage Support, Elemental Damage with Attacks Support, Close Combat Support]
      - name: Movement
        gems: [Leap Slam, Faster Attacks Support, Momentum Support, Dash]
      - name: Act 2 buffs
        gems: [Herald of Ash, Blood Rage, Decoy Totem]
      - name: Act 3 aura and curse
        gems: [Hatred, Punishment]
    moveOn: "Frost Blades is in a four-link, Precise Technique is active, and Bane of Legends is taken."
    details:
      - title: The author simplified the weapon path for 3.30
        body: |
          His description for this league: "levelling has been improved and the white wind dagger part removed from the build", because going "axes - dagger - claw" was "a little too complex".

          So the path is now two steps. Two-handed axes until deep into maps, then one switch to a claw and shield.

          The example axes in his file, act by act: Jade Chopper, Poleaxe, Shadow Axe, Timber Axe, Ezomyte Axe, then a Despot Axe in maps. From Act 5 the example has increased physical damage added at the crafting bench. Pick up every two-handed axe base that is new to you.
      - title: Keep Precise Technique switched on
        body: |
          The keystone only works while your accuracy rating is higher than your maximum life. Early on that is easy to break: one good life roll and no accuracy.

          The tree's answer is the Accuracy Mastery "+500 to Accuracy Rating, −2 to Accuracy Rating per Level". It is strongest at low level and fades, which is why the author swaps it in Act 7 for the mastery that gives +3 accuracy per point of Dexterity.

          If your damage drops for no reason, compare the two numbers on your character sheet.
      - title: A fire mastery on a cold build
        body: |
          The Act 2 tree takes the Fire Mastery that gives "100% increased Damage with Hits against Ignited Enemies", and the early links use [[Added Fire Damage Support]] and [[Herald of Ash]].

          That is a levelling choice: the mastery is a large bonus against anything that is burning. The file does not explain how the author expects enemies to be ignited, so we cannot tell you how often it applies. It is refunded in Act 6, when the tree takes the Elemental Mastery instead.
      - title: Bandits and Pantheon
        body: |
          The file records "kill all three bandits" and **Soul of the Brine King** with **Soul of Gruthkul**. The reasons are in the video, which we did not watch.
  - id: acts-4-10
    phase: early
    image: precise-technique
    title: Acts 4–10
    levels: Level 33–68
    uses: >-
      [[Frost Blades]] with [[Multistrike Support]] from Act 5 and
      [[Fortify Support]] from Act 6. [[Hatred]], [[Precision]] and
      [[Flesh and Stone]] as auras.
    changes: >-
      Act 4 converts the rest of your physical damage to cold. You ascend twice
      more: [[Headsman]], then [[Brutal Fervour]]. From Act 7 the tree starts
      on spell suppression.
    links:
      - name: Act 5 four-link
        gems: [Frost Blades, Elemental Damage with Attacks Support, Multistrike Support, Close Combat Support]
      - name: Act 6 five-link
        gems: [Frost Blades, Elemental Damage with Attacks Support, Multistrike Support, Close Combat Support, Fortify Support]
      - name: Movement
        gems: [Leap Slam, Faster Attacks Support, Momentum Support, Flame Dash]
      - name: Auras
        gems: [Hatred, Precision, Flesh and Stone]
      - name: Curse and golem
        gems: [Elemental Weakness, Summon Flame Golem]
    moveOn: "three ascendancy notables are taken, resistances are repaired after Act 10, and you are entering maps."
    details:
      - title: What the tree does in each act
        body: |
          Read off the author's trees:

          - **Act 4:** Cold Mastery, 40% of physical damage converted to cold. The notables Fangs of Frost and Hatchet Master.
          - **Act 5:** Axe Mastery, "Gain 2 Rage on Hit with Axes".
          - **Act 6:** Elemental Mastery, hits have a 15% chance to treat enemy resistances as inverted. The fire mastery from Act 2 is refunded.
          - **Acts 7–8:** the notable Inveterate and the mastery that makes spell suppression lucky. The reservation mastery, so three auras fit.
          - **Late campaign:** the Leech Mastery, 5% of leech is instant.

          For the exact route between them, open the file under Sources. It has one tree per act.
      - title: One change in the last campaign gem set
        body: |
          The gem set labelled "Act 8 to Maps" drops [[Fortify Support]] for [[Added Cold Damage Support]]. The next set, for early maps, has Fortify back.

          **The file does not explain this.** It may be about socket colours on campaign gear. Use whichever you have links for; neither changes how the build plays.
      - title: Flame Golem is slightly weaker in 3.30
        body: |
          [[Summon Flame Golem]] sits in the gem sets from Act 4 until maps. Its damage buff was cut in this patch. It is a one-socket levelling extra and not worth worrying about.
  - id: early-maps
    phase: early
    image: hatred
    title: Early maps
    levels: White and yellow maps
    uses: >-
      A rare two-handed Despot Axe, a five-link, and rare armour with life and
      resistances. A Prismatic Tincture in a flask slot.
    changes: >-
      [[Ice Bite Support]] joins the link. [[Steelskin]] goes on
      [[Automation]]. [[Summon Skitterbots]] and [[Vaal Haste]] appear. The
      tree adds frenzy charge nodes.
    links:
      - name: Main skill
        gems: [Frost Blades, Elemental Damage with Attacks Support, Multistrike Support, Fortify Support, Ice Bite Support]
      - name: Guard
        gems: [Steelskin, Automation, More Duration Support]
      - name: Auras and curse
        gems: [Hatred, Precision, Elemental Weakness]
      - name: Movement
        gems: [Leap Slam, Faster Attacks Support, Momentum Support, Flame Dash]
      - name: Extras
        gems: [Summon Skitterbots, Vaal Haste]
    moveOn: "you reach about Tier 10 maps and the build starts to struggle. That is expected; see the next stage."
    details:
      - title: Gear in the author's early-maps set
        body: |
          Nothing unique at all. Evasion and armour bases with life and two resistances each. Two-Stone Rings. An amulet and belt from the campaign. One ring with a large accuracy roll, to keep [[Precise Technique]] working as your life grows.

          The axe in the example has 123% increased physical damage, 14–29 added physical damage and 15% attack speed.
      - title: The tincture
        body: |
          His sets carry a Prismatic Tincture from early maps to the end: increased elemental damage with melee weapons, and in his example, elemental penetration.

          A tincture is switched on, not drunk, and burns mana while it is active. His boss advice is to turn it on together with [[Vaal Haste]].
      - title: Complete the Atlas in order
        body: |
          The author's note: "You should be mid 80s by early red maps if you complete your atlas in order, ie, do all the T1 maps, then T2".

          He wants the levels. The build "benefits from both our character level and gem levels", and the claw switch comes later than most players expect.
  - id: red-maps
    phase: endgame
    image: bane-of-legends
    title: Red maps on the axe
    levels: Tier 11–16 maps
    uses: >-
      The same two-handed axe build, finished: [[Carnage Heart]],
      [[Devoto's Devotion]], a corrupted six-link with
      [[Cold Penetration Support]], and a better Despot Axe.
    changes: >-
      Three purchases, the Eternal Labyrinth for [[Masterful Form]], and
      nothing else. The author says this version clears the Atlas and earns
      the currency for the next one.
    links:
      - name: Main skill (six-link)
        gems: [Frost Blades, Elemental Damage with Attacks Support, Multistrike Support, Fortify Support, Ice Bite Support, Cold Penetration Support]
      - name: Guard
        gems: [Steelskin, Automation, More Duration Support]
      - name: Auras and curse
        gems: [Hatred, Precision, Elemental Weakness]
      - name: Movement
        gems: [Leap Slam, Faster Attacks Support, Momentum Support, Flame Dash]
      - name: Extras
        gems: [Summon Skitterbots, Vaal Haste]
    moveOn: "the Atlas is cleared, you are in the mid 80s or higher, and you have currency for a claw."
    details:
      - title: The wall at Tier 10–11, in the author's words
        body: |
          "The build will start to fall away on junk gear and a 5 link around T10-T11 maps."

          His fix, in his order:

          1. "A carnage heart or amulet with attributes and craft damage while leeching."
          2. [[Devoto's Devotion]].
          3. A corrupted six-link body armour.

          "Aim for gear similar to the POB for end non crit axe and you will breeze through Uber Lab."

          **What it costs is not stated.** The three items are common uniques and a corrupted chest, which were cheap in past leagues; that is general knowledge and not a 3.30 price.
      - title: What the finished axe set looks like
        body: |
          From the file: a Despot Axe with 132% increased physical damage, 14–29 added physical damage and 23% attack speed. Carnage Heart, anointed with the notable Kinetic Impacts. Devoto's Devotion. Everything else is still rare gear with life and resistances.

          The tree adds [[Masterful Form]] and the Evasion Mastery that gives 15% spell suppression when all four armour pieces have evasion.
      - title: His farming plan, and a 3.30 caution
        body: |
          The author's plan for earning the claw is to "complete scoured T16 Blight Maps" on this set.

          In 3.30 Blight no longer appears in ordinary maps by itself. We could not confirm from the patch notes how Blighted Maps are obtained or priced now. Treat the plan as an example of content the axe set can do, and farm whatever your Atlas is set up for.
  - id: claw-and-shield
    phase: endgame
    image: lacquered-buckler
    title: The claw and shield switch
    levels: Tier 14–16 maps, level 85 or higher
    uses: >-
      A rare claw with high cold damage and attack speed, a
      [[Lacquered Buckler]], [[Perseverance]], and the gloves, helmet and
      amulet you already own. The build now crits.
    changes: >-
      [[Precise Technique]] and the axe nodes come off the tree; claw and crit
      nodes go on. The Cold Mastery changes. [[Assassin's Mark]],
      [[Herald of Ice]] and [[Whirling Blades]] join the gems.
    links:
      - name: Main skill
        gems: [Frost Blades, Multistrike Support, Ice Bite Support, Added Cold Damage Support, Cold Penetration Support, Fortify Support]
      - name: Mark
        gems: [Assassin's Mark, Mark On Hit Support, Lifetap Support]
      - name: Movement and charges
        gems: [Whirling Blades, Faster Attacks Support, Enduring Cry]
      - name: Buffs
        gems: [Herald of Ice, Flesh and Stone, Blood Rage]
      - name: Chill
        gems: [Summon Skitterbots, Bonechill Support]
      - name: Guard and burst
        gems: [Steelskin, Automation, Vaal Haste]
    moveOn: "the claw version does alch-and-go Tier 16 maps comfortably. That is the author's own test."
    details:
      - title: The entry claw
        body: |
          The author changed his mind after recording the video, and wrote in capitals above the note to make sure it was read. His current advice:

          "I would recommend just aiming for a claw with big cold, big attack speed and crafted hits cannot be evaded. If you can get crit too then great but it might be too expensive for an entry claw."

          The example in the file: an Imperial Claw with 87–153 added cold damage, 24% attack speed, life gained per enemy hit, and "Hits can't be Evaded" crafted at the bench.

          That craft matters because the accuracy masteries leave the tree with [[Precise Technique]]. This last sentence is our reading of his trees, not his words.
      - title: The step everyone forgets
        body: |
          "Make sure you change your cold mastery from 40% physical converted to cold to enemies take more damage when frozen. You need physical damage to bleed to proc a lot of crit chance and crit multi."

          The claw tree takes the Bleeding Mastery "80% increased Critical Strike Chance against Bleeding Enemies" and the Critical Mastery "+25% to Critical Strike Multiplier against Unique Enemies". Without some physical damage left in your hit, nothing bleeds.
      - title: Small things he says not to overlook
        body: |
          - Critical strike multiplier on jewels.
          - Added cold damage and increased elemental damage on rings.
          - A blue socket on the claw for [[Assassin's Mark]], at 10% quality.
          - The tincture and [[Vaal Haste]] together on map bosses.
      - title: Do not rush it
        body: |
          "Do not rush this switch as the build benefits from both our character level and gem levels."

          The claw tree in the file has the same number of nodes as the finished axe tree, which is a character in the high 80s. Below that you would be giving up a working build for a half-finished one.
  - id: endgame
    phase: endgame
    image: the-taming
    title: Finished league start
    levels: Tier 16 maps and beyond
    uses: >-
      A fractured Gemini Claw, [[Heatshiver]], [[The Taming]],
      [[The Arkhon's Tools]], and a body armour with two Eldritch implicits:
      chance to fortify, and an endurance charge every 15 seconds.
    changes: >-
      [[Fortify Support]] leaves the six-link for
      [[Increased Critical Damage Support]], because the armour now fortifies
      for you. The endurance charge nodes come off the tree and the points go
      into a jewel socket, life and ailment avoidance.
    links:
      - name: Main skill
        gems: [Frost Blades, Elemental Damage with Attacks Support, Multistrike Support, Increased Critical Damage Support, Added Cold Damage Support, Ice Bite Support]
      - name: Mark
        gems: [Assassin's Mark, Mark On Hit Support, Lifetap Support]
      - name: Chill
        gems: [Summon Skitterbots, Bonechill Support, Unbound Ailments Support]
      - name: Movement
        gems: [Whirling Blades, Faster Attacks Support, Flame Dash]
      - name: Buffs
        gems: [Herald of Ice, Flesh and Stone, Blood Rage]
      - name: Guard and burst
        gems: [Steelskin, Automation, Vaal Haste, More Duration Support]
      - name: Weapon swap
        gems: [Enduring Cry, Urgent Orders Support]
    moveOn: "there is no next stage in this guide. The author links a separate big-budget video from an earlier league."
    details:
      - title: The order the author gives after the claw
        body: |
          1. [[Heatshiver]] "as soon as possible".
          2. A body armour "with the fortify and endurance charge implicit".
          3. Then "drop the endurance charge nodes from the tree and pick up the jewel socket on the right side of the tree and start filling out the life and avoid ailments wheel next to point blank keystone at the bottom of the tree".
      - title: What is in the example gear
        body: |
          - **Claw:** a Gemini Claw with fractured 89–156 added cold damage, 30% attack speed and 37% critical strike chance, with "Hits can't be Evaded" and elemental penetration crafted.
          - **Shield:** a [[Lacquered Buckler]] with increased block chance, spell suppression and life.
          - **Belt:** [[The Arkhon's Tools]], which adds a third Skitterbot and makes the Skitterbots' auras affect you as well.
          - **Ring:** [[The Taming]].
          - **Gloves:** Eldritch implicits for cold exposure on hit and one additional strike target.
          - **Flasks:** [[Diamond Flask]], [[Silver Flask]], [[Jade Flask]] and [[Quicksilver Flask]], each crafted to use itself when its charges are full.

          Six of the pieces are fractured items. See What 3.30 changed.
      - title: The weapon swap for Enduring Cry
        body: |
          The second weapon set in the file holds [[Enduring Cry]] with [[Urgent Orders Support]] in the unique shield [[Redblade Banner]], whose current version gives warcries infinite power.

          Normally a warcry counts the monsters around you. With infinite power, one shout gives full endurance charges against a lone boss. You swap weapons, shout, and swap back. The author does not describe this in his notes; it is our reading of the gear.
      - title: Where this guide stops
        body: |
          There are no cluster jewels, no price list and no pinnacle or uber boss advice in this source. The author points to a separate video for his large-budget Frost Blades from an earlier league. We did not use it, because it is not a 3.30 source.

powerCurve: |
  The axe version multiplies four plain things: the base damage of the axe, the gem's own percentage (144% of weapon damage at level 1, 410% at level 20), [[Precise Technique]]'s 40% more, and attack speed through [[Multistrike Support]]. Clear speed is a fifth thing, and it comes from how many enemies the strike can target.

  **At level 30** you already have most of it. Frost Blades is in your hand from the first zone, the strike-target mastery arrives in Act 2, and Precise Technique and [[Bane of Legends]] in Act 3. This is why the campaign feels strong: nothing is waiting for an item.

  **At level 70** you have three ascendancy notables and a five-link, and the growth has been steady. From here the only things still rising are the axe you find and the gem's level. That is a slow slope, and around Tier 10–11 maps monster life rises faster than it does. The author names that wall himself.

  **At level 85–95** you open multipliers that were closed: critical strikes, freezing, and [[Heatshiver]]'s extra fire damage against frozen enemies. That is the claw switch. It is a second build stacked on the levels and gem levels of the first, which is why he tells you not to rush it.

  **Our reading, not the author's:** strong early, flat in the middle, then one deliberate jump that you pay for. If the flat part bores you, the cure is the three cheap purchases, not an early claw.

upgrades:
  - step: "[[Carnage Heart]], or an attribute amulet with damage while leeching crafted"
    why: >-
      The author's first purchase. With [[Brutal Fervour]] you are always
      leeching, so "damage while leeching" is simply damage. It also brings
      attributes and resistances, which rare levelling gear is short of.
  - step: "[[Devoto's Devotion]]"
    why: >-
      16% attack speed and 20% movement speed in one slot. Second because it
      costs you the life and resistances a rare helmet had, so the amulet's
      resistances need to be there first. That reason is ours.
  - step: "A corrupted six-link body armour"
    why: >-
      One more support, [[Cold Penetration Support]] in his set. Third
      because a sixth link is a smaller step than the first two items on a
      character whose problem is base damage and speed.
  - step: "Eternal Labyrinth for [[Masterful Form]]"
    why: >-
      Free. It sits here because his notes say the gear above is what makes
      the lab easy.
  - step: "An entry claw: high cold damage, high attack speed, \"Hits can't be Evaded\" crafted. Plus a shield and the mastery change."
    why: >-
      The big one. It opens crit and frozen-enemy scaling. It is fifth and not
      first because it replaces your weapon, your keystone and a quarter of
      your tree, and only pays once level and gem levels are high.
  - step: "Crit multiplier on jewels; added cold and elemental damage on rings"
    why: >-
      Multiplier is worth nothing before you crit and a lot after. These are
      small items you can buy one at a time.
  - step: "[[Heatshiver]]"
    why: >-
      Extra fire damage against chilled and frozen enemies, which only works
      well once you freeze reliably. That needs the crit and the Skitterbots
      first.
  - step: "Body armour with fortify and endurance charge implicits"
    why: >-
      Last because it is a convenience that turns into power: it frees a
      support slot and several passive points at once.

play:
  mapping: |
    Travel with [[Leap Slam]] in the axe version and [[Whirling Blades]] in the claw version. Both are linked to [[Faster Attacks Support]].

    Attack the nearest monster from as far away as the strike reaches. You do not aim at the pack: the blades leave the first enemy hit and find the others. With two or three strike targets, one swing sends blades out of several monsters at once.

    Then move. [[Headsman]] gives movement speed after every kill and attack speed after every rare, so the build speeds up as it goes.

    Keep [[Blood Rage]] running. [[Steelskin]] fires by itself through [[Automation]]. In the last gear set the four utility flasks also use themselves.
  bossing: |
    Before the fight in the claw version: swap weapons, press [[Enduring Cry]], swap back.

    Then, on the author's instruction, switch the tincture on and press [[Vaal Haste]]. [[Assassin's Mark]] is applied by your hits and feeds you power charges.

    **The tension in the build:** the blades that clear a map deal 30% less damage than the strike and fly at *other* enemies. Against one boss, your damage is the strike itself, so you stand in reach and keep swinging. Your recovery asks the same of you, because leech and life gained per hit both stop when you stop. This paragraph is our reading of the gem and the gear; the author's boss advice is in the video.

troubleshooting:
  - symptom: "It was smooth, then fell off around Tier 10–11 maps."
    cause: >-
      The author's own diagnosis: "junk gear and a 5 link". Until then the only
      things growing are the axe and the gem level.
    fix: >-
      His three purchases, in order: [[Carnage Heart]] or an amulet with
      damage while leeching, [[Devoto's Devotion]], a corrupted six-link.
  - symptom: "I switched to the claw and my crit chance is poor."
    cause: >-
      The Cold Mastery is still converting the last 40% of your physical
      damage. With no physical damage you cause no bleeding, and the Bleeding
      Mastery's 80% increased crit chance never applies.
    fix: >-
      Change the Cold Mastery to the frozen-enemies option, as the author's
      note says.
  - symptom: "I switched to the claw and I miss a lot."
    cause: >-
      [[Precise Technique]] and the accuracy masteries are gone, and nothing
      replaced them. This is our reading of the two trees.
    fix: >-
      Craft "Hits can't be Evaded" on the claw. It is one of the three things
      the author asks for on an entry claw.
  - symptom: "I switched to the claw and I am weaker than before."
    cause: >-
      Too early. "The build benefits from both our character level and gem
      levels."
    fix: >-
      Go back to the axe if you kept it, finish the Atlas, and switch in the
      mid-to-high 80s.
  - symptom: "No power charges on bosses."
    cause: >-
      [[Assassin's Mark]] is missing, low quality, or in a link that does not
      trigger it.
    fix: >-
      The author: a blue socket on the claw, the gem at 10% quality, linked to
      [[Mark On Hit Support]].

patch:
  - note: >-
      **Nothing changed for the skill.** [[Frost Blades]] does not appear in
      the 3.30 notes, and neither do [[Precise Technique]],
      [[Multistrike Support]], [[Heatshiver]] or the tincture the build uses.
      The author's own line: "Nothing has really changed for a while with
      Frost Blades".
  - entry: ruthless-changes
    note: >-
      **Slayer was not changed, whatever you read.** The notes list changes to
      Slayer's Impact and Endless Hunger, but inside the Ruthless-only
      section. GGG's tree data for the normal game is identical before and
      after the patch. This build takes neither notable in any case.
  - entry: fractured-items-rarer
    note: >-
      **The finished gear is harder to copy.** Six pieces in the author's last
      set are fractured items, including the claw. Fractured items now come
      from far fewer places. His file was built before that mattered.
  - entry: no-random-league-mechanics
    note: >-
      **His farming plan needs checking.** He earns the claw with Blighted
      Maps. Blight no longer appears in maps without a Thread, and we could
      not confirm how Blighted Maps are obtained now.
  - entry: special-base-implicits
    note: >-
      **Possibly a small buff to one belt.** The claw set wears
      [[Perseverance]], a Vanguard Belt that gives attack damage for the lower
      of your armour and evasion. The Vanguard Belt implicit now rolls up to
      +480 of each, where it used to stop at 320. PoEDB's page for the unique
      still showed the old range when we checked, so we cannot confirm the
      unique benefits.
  - entry: golem-buff-nerfs
    note: >-
      **Trivial, and campaign only.** [[Summon Flame Golem]] gives 15–24%
      increased damage, down from 20–29%. It is a levelling gem here.
  - entry: league-fates
    note: >-
      **A clear-speed build in a league that pays for bosses.** The mechanic
      makes area bosses harder and rewards killing them. Frost Blades is at
      its best on packs and at its plainest on a single target. That is our
      reading, and nobody has measured it.

strengths:
  - "The main skill is in your hand from the first zone and never changes."
  - "Screen-wide clear from one swing, with no item required."
  - "Speeds up as it kills: movement speed after every kill, attack speed after every rare."
  - "The first version needs no uniques until about Tier 10 maps."
  - "One author's file with a tree and gem set for every act."
  - "A clear upgrade order, written down by the author."
weaknesses:
  - "Single target is the strike alone; the blades go elsewhere and deal 30% less."
  - "You must stay in reach and keep hitting, for damage and for recovery."
  - "The middle of the Atlas is flat until you buy three items."
  - "The claw switch is a real rebuild: weapon, keystone, masteries, a quarter of the tree."
  - "The finished gear leans on fractured items, which 3.30 made rarer."
  - "One source, with no prices, no damage figures and a video we could not check."
avoidIf: >-
  Pick something else if you want to stand back from bosses, or if you want a
  build that is finished when the campaign is. Skip it if rebuilding a working
  character at level 85 sounds like a chore rather than a reward. And if you
  need prices and published numbers before you commit, this guide cannot give
  them to you: its one source has neither.

