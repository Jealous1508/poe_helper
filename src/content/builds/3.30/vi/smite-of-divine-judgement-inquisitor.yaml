    moveOn: "map Tier 16 đã thoải mái và bạn có một cây Foulborn Ghostwrithe đúng mod."
    details:
      - title: Attack speed trước, gem sau
        body: |
          Câu chữ của guide rất mạnh: nó "heavily recommended", tức đặc biệt khuyên, rằng bạn có increased attack speed trên những món này trước khi đổi:

          - 12% trở lên trên gloves.
          - 6% trở lên trên mỗi viên jewel.

          Và lần nữa trong phần ghi chú skill: Smite of Divine Judgement "requires sufficient Attack Speed on your Gear/Passive Tree to feel good, do not neglect this!" Phải đủ attack speed trên gear và cây thì chơi mới sướng, đừng xem nhẹ.

          PoEDB cho biết lý do. Gem attack ở 85% base speed của vũ khí.
      - title: Gear đổi những gì
        body: |
          - **Gloves:** Eldritch implicit "Non-Vaal Strike Skills target 1 additional nearby Enemy" là "your first priority" trong số các implicit.
          - **Off hand:** [[Rathpith Globe]]. Guide nói increased spell damage của nó có "great synergy" với [[Crown of Eyes]].
          - **Belt:** [[The Magnate]]. Tới lúc này bạn dư sức đạt yêu cầu Strength của nó; "grab it if it isn't too expensive", không quá đắt thì lấy.
          - **Body armour:** cây mẫu thêm "+1% to all maximum Resistances" và "1% less Damage Taken per 230 Strength" làm implicit.
      - title: Hai mastery cho chặng này
        body: |
          - Life Mastery "You count as on Full Life while at 90% of maximum Life or above". Không có nó thì [[Damage on Full Life Support]] tắt ngay vết xước đầu tiên.
          - Notable Aggressive Bastion, thứ guide dùng làm "a consistent source of Endurance Charges while mapping", nguồn endurance charge đều đặn khi chạy map.

          Kiếm thêm "Reduced Effect of Curses on You" trên một viên jewel. Cộng với Consecrated Ground của bạn, nó khiến bạn trên thực tế miễn curse, và khi đó guide bỏ Protection Mastery.
      - title: Chuyện đổi golem là tùy chọn
        body: |
          [[Summon Ice Golem]] có mặt vì ở chặng này accuracy khó kiếm hơn. "If your gear has sufficient Accuracy without it, keep using Summon Lightning Golem." Nếu gear đã đủ accuracy mà không cần nó thì cứ giữ Summon Lightning Golem.
