name: Smite of Divine Judgement Inquisitor
tagline: >-
  Một cú strike còn gọi cả sét giáng xuống mọi thứ xung quanh, trên một nhân
  vật mà life regeneration nạp đầy luôn energy shield. Nó khởi đầu là một build
  Strength rẻ tiền và kết thúc bằng việc biến maximum life thành damage vũ khí.
class: Templar
ascendancy: Inquisitor
role: starter
budget: low
budgetNote: >-
  **Guide không in một cái giá nào.** Nó chỉ nói mấy món unique của nó
  "usually incredibly cheap" (thường cực rẻ), và tự liệt kê "Some Uniques May
  Be Expensive" trong phần điểm yếu của chính nó. Có hai thứ phải mua ngay sau
  campaign: [[Brutus' Lead Sprinkler]], món tác giả đoán sẽ tốn vài
  [[Chaos Orb]], và về sau là transfigured gem. Anh ta cũng công bố một phương
  án dự phòng cho trường hợp cây sceptre đắt trong ngày đầu. Gói endgame
  ([[Foulborn Ghostwrithe]], [[Rathpith Globe]], một Timeless Jewel) không có
  con số nào gắn kèm ở bất cứ đâu trong guide, cho bất kỳ league nào.
mainSkill: Smite of Divine Judgement
image: asc-icon-inquisitor
hero: art-inquisitor
tags: [Melee, Strike, Lightning, Crit, Life stacking]
ratings: { clear: 4, bossing: 4, survivability: 4, ease: 2 }
verified: "2026-11-14"
confidence: mixed
confidenceNote: >-
  **Bốn điểm số là của chúng tôi**; guide không có bảng điểm. Xét về độ cập
  nhật của nguồn, đây là một trong những guide khá hơn mà chúng tôi dùng:
  planner của nó được lưu ngày 12/11/2026 với trường season đặt là 3.30, và
  changelog của nó có hai mục tháng 11, một trong số đó phản ứng với một cú
  nerf của 3.30. Nhưng nó được viết vào tháng 7/2026 cho 3.29, file Path of
  Building của nó vẫn dùng passive tree 3.29, và nó là công sức của một tác
  giả, không có guide thứ hai để so. Tác giả nói anh ta đã chơi cùng bộ khung
  phòng thủ này ở hardcore solo self-found hai league trước. Chưa ai chơi nó
  trong 3.30 vào lúc chúng tôi đọc. Mọi con số damage và life bên dưới đều đến
  từ một file Path of Building chạy engine 3.29.
modes:
  ssf: >-
    Câu trả lời của tác giả là "Definitely", và chính anh ta đã chơi kiểu đó.
    Nhưng anh ta nói rõ rằng đầu Atlas thì khác và lộ trình anh ta viết không
    bao phủ nó. Bạn không mua được [[Brutus' Lead Sprinkler]], nên bạn ở lại
    với [[Static Strike]] cùng một cây warstaff crit, thứ anh ta nói đủ tốt
    cho map Tier 16, và farm Breach để lấy [[Foulborn Ghostwrithe]].
    [[Rathpith Globe]] là drop hiếm hơn; cho tới khi bạn tìm được một cái thì
    anh ta gợi ý một bản [[Energy Blade]] hai tay. Trong file của anh ta có
    hai loadout solo.
  hardcore: >-
    Bằng chứng tốt hơn phần lớn build ở đây: tác giả đã chơi bộ khung này ở
    hardcore solo self-found trong league Mirage và có dẫn link nhân vật. File
    hoàn chỉnh có khoảng 8,400 life, 2,900 energy shield, 75% attack block và
    78% spell block. Bản thân guide thì viết cho softcore trade và không đưa
    cây riêng nào cho hardcore.

idea: |
  [[Smite of Divine Judgement]] là một melee strike có phần thứ hai: khi bạn attack, sét còn đánh tới ba con quái trong vòng 5 mét và gây damage lên một vùng quanh mỗi con. Nên một nhát chém đánh trúng con quái trước mặt bạn và vài con khác khắp màn hình.

  Skill gốc ghi mỗi mục tiêu chỉ bị hit một lần. Mẹo của guide là cú strike và tia sét là hai phần riêng, và nếu đứng đúng vị trí thì cùng một con boss ăn cả hai. Chuyện đó gần như nhân đôi damage single-target của bạn.

  [[Inquisitor]] làm hai việc. Đứng yên tạo ra Consecrated Ground, thứ regenerate life, và [[Pious Path]] khiến phần regeneration đó nạp luôn energy shield. Và một khi bạn crit ổn định, [[Inevitable Judgement]] làm critical strike của bạn bỏ qua hoàn toàn elemental resistance của quái.

  Bạn không khởi đầu với bất cứ thứ nào trong đó. Campaign và mấy map đầu được chơi bằng [[Static Strike]], như một nhân vật Strength cầm mace hai tay. Transfigured gem tới ở map đỏ. Endgame life-stacking, nơi tổng life của bạn thành damage vũ khí, tới sau đó nữa.

chain:
  - label: Strike
    text: "Một cú melee hit đổi một nửa physical damage thành lightning. Nó attack ở 85% tốc độ vũ khí của bạn, nên attack speed trên gear rất quan trọng."
  - label: Sét đánh
    text: "Sét đánh tới ba con quái trong vòng 5 mét, kèm area damage quanh mỗi con. Thêm strike target trên gear thì nó trải khắp màn hình."
  - label: Bỏ qua resistance
    text: "[[Righteous Providence]] biến Strength và Intelligence thành crit chance. [[Inevitable Judgement]] làm crit bỏ qua elemental resistance."
  - label: Regenerate hai lần
    text: "[[Sanctuary]] cho bạn Consecrated Ground khi đứng yên. [[Pious Path]] khiến life regeneration của nó hồi luôn energy shield, và làm hiệu ứng nán lại."

chainDetails:
  - title: Ba build trong một nhân vật
    body: |
      Guide có năm loadout. Chúng rơi vào ba động cơ khác nhau, và biết mình đang ở cái nào thì có ích.

      1. **Campaign: Strength và cú hit exerted.** [[Static Strike]] trên mace hai tay với [[Resolute Technique]], được warcry đẩy lên.
      2. **Map đầu và map đỏ: Strength thành fire damage, và crit.** [[Brutus' Lead Sprinkler]] thêm fire damage cho mỗi 10 Strength. [[Crown of Eyes]] và [[Iron Will]] đếm Strength của bạn thêm lần thứ hai. Bạn thôi dùng Resolute Technique và bắt đầu crit.
      3. **Endgame: life thành lightning damage.** [[Foulborn Ghostwrithe]] đặt energy shield của bạn bằng 35% life, và [[Energy Blade]] biến energy shield thành damage vũ khí. Strength hết quan trọng và life là tất cả.

      Mỗi lần đổi là một lần respec và một danh sách mua sắm mới. Đó là lý do chúng tôi chấm độ dễ chơi 2 trên 5.
  - title: Cú hit kép hoạt động thế nào
    body: |
      Lời giải thích của tác giả, từ FAQ của anh ta.

      Một mod như "Non-Vaal Strike Skills target 1 additional nearby Enemy" làm hiện ra hình ảnh một ancestor đánh vào con quái thứ hai. Nó không phải minion. Nó là phần nối dài của chính đòn đánh của bạn.

      Bất chấp câu chữ trên gem, một con quái có thể bị hit bởi hai *phần khác nhau* của skill. Nên bạn đứng hơi ngoài tầm melee. Cú strike của chính bạn trượt con boss, nhưng tia sét của nó rơi trúng. Cú strike của ancestor thì đánh thẳng vào boss. Một con quái, hai cú hit.

      Anh ta nói thêm rằng chuyện đó "pretty clear when you are doing it correctly", làm đúng là thấy rõ ngay, vì bạn gây khoảng gấp đôi damage.

      Đó là lý do Eldritch implicit đầu tiên anh ta đòi là dòng strike target trên gloves. Attack Mastery có cùng dòng chữ đó thì đã nằm sẵn trong cây campaign.
  - title: Strength, đếm hai lần
    body: |
      Động cơ thứ hai chạy thế này.

      - [[Brutus' Lead Sprinkler]]: "Adds 4 to 7 Fire Damage to Attacks with this Weapon per 10 Strength".
      - [[Righteous Providence]]: +50 Strength và Intelligence, và 1% increased critical strike chance cho mỗi điểm của cái nào thấp hơn.
      - [[Iron Will]]: bonus damage của Strength áp dụng luôn cho spell damage.
      - [[Crown of Eyes]]: increase của spell damage áp dụng luôn cho attack damage, ở 150% giá trị.

      Nên Strength cho bonus attack bình thường của nó, rồi cho thêm lần nữa dưới dạng spell damage mà helmet đổi ngược lại thành attack damage, và thêm flat fire damage qua cây sceptre. Guide gọi Strength là "an all-star stat" ở giai đoạn này, và lấy notable Utmost Might vì nó.
  - title: Life, đếm ba lần
    body: |
      Động cơ endgame thay hết những thứ đó.

      - [[Foulborn Ghostwrithe]], với đúng một mod Foulborn cụ thể: "Your Maximum Energy Shield is Equal to 35% of Your Maximum Life".
      - [[Energy Blade]]: lightning damage của cây sword dựa trên energy shield của bạn, tới 40% của nó ở cận trên của dải. Bình thường buff này còn cho 50% less maximum energy shield.
      - [[Rathpith Globe]]: 3% increased spell damage cho mỗi 100 maximum life trong file được công bố, thứ [[Crown of Eyes]] đổi thành attack damage.

      Dòng trên body armour ghi đè penalty của Energy Blade. Nên nhiều life hơn nghĩa là nhiều energy shield hơn, tức là vũ khí to hơn, và nhiều life hơn cũng nghĩa là nhiều increased damage hơn qua cây shield. Life cũng chính là máu của bạn. Một chỉ số làm ba việc, và đó là ý của guide khi nói scale tấn công và phòng thủ cùng lúc.
  - title: Consecrated Ground, và vì sao nó luôn ở đó
    body: |
      [[Sanctuary]] cho bạn Consecrated Ground khi bạn đứng yên. Con số của guide cho vùng đất này: regenerate 5% life mỗi giây và 50% reduced effect of curses lên bạn. Quái đứng trên nó ăn increased damage.

      [[Pious Path]] làm các hiệu ứng nán lại 4 giây sau khi bạn rời đi, và khiến life regeneration hồi luôn energy shield.

      Ý của tác giả là sau mỗi cú [[Leap Slam]] bạn đều dừng một nhịp, nên trên thực tế hiệu ứng không bao giờ rớt.

      Với notable Devotion và Shining Justice, guide đưa con số 8.75% life mỗi giây và 87.5% reduced curse effect "as early as White Maps", tức sớm ngay từ map trắng. Về sau một viên jewel có reduced curse effect đưa nó lên miễn nhiễm hoàn toàn. Shining Justice còn cho 30% increased accuracy khi bạn đứng trên vùng đất, thứ có ý nghĩa một khi [[Resolute Technique]] đã đi.
  - title: Static Strike và luật bốn giây
    body: |
      Bạn chơi [[Static Strike]] suốt campaign và mấy map đầu, nên cái luật duy nhất của nó đáng để học.

      Sau một cú hit, static energy rời nhân vật bạn trong 4 giây và đánh quái gần đó nhiều lần. Game coi toàn bộ chỗ đó là một attack. Nên nếu bạn hô [[Intimidating Cry]] trước, mọi tia trong 4 giây đó đều exerted và gây gấp đôi damage. [[Rallying Cry]] cộng thêm vào.

      Luật: **đừng đánh tiếp cho tới khi hết 4 giây.** Một cú hit mới sẽ thay static exerted bằng static thường.

      Một cái bẫy: [[Leap Slam]] là một attack và sẽ tiêu mất exert. Từ map đầu guide bảo bạn craft "Warcries cannot Exert Travel Skills" lên một cây ring, và gọi nó là rất quan trọng.

mandatory:
  - term: Smite of Divine Judgement
    why: >-
      Main skill từ map đỏ trở đi. Sét đánh ba mục tiêu thay vì một, area
      damage nhiều hơn, và nó bỏ cái aura mà gem gốc có.
    detail: >-
      Đây là transfigured gem. Guide nói farm Merciless Labyrinth để lấy nó
      hoặc mua. Tác giả không coi nó là thứ định hình build: FAQ của anh ta
      nói cùng bộ khung phòng thủ đó chạy được với bất kỳ melee skill nào bạn
      thích.
  - term: Static Strike
    why: >-
      Thứ bạn thật sự chơi từ level 12 tới map đỏ. Quest reward của The
      Siren's Cadence.
  - term: Sanctuary
    why: >-
      Consecrated Ground khi bạn đứng yên: regeneration, giảm curse, và quái
      đứng trên nó ăn thêm 15% increased damage.
  - term: Pious Path
    why: >-
      Life regeneration hồi luôn energy shield, và hiệu ứng của vùng đất nán
      lại 4 giây. Đây là nguồn hồi phục của build, và là lý do golem với
      spectre của bạn sống được mà không cần passive minion nào.
  - term: Righteous Providence
    why: >-
      +50 Strength và Intelligence cùng một lượng lớn crit chance. Guide ghép
      nó với cây sceptre bên dưới.
  - term: Inevitable Judgement
    why: >-
      Critical strike bỏ qua elemental resistance của quái. Guide nói crit
      chance đã cap khi tới map đỏ, nên trên thực tế cú hit nào cũng vậy.
  - term: Brutus' Lead Sprinkler
    why: >-
      Vũ khí cho map đầu và map đỏ. Fire damage cho mỗi 10 Strength. Là
      "immediate priority after finishing the Campaign" của guide, tức ưu tiên
      ngay sau khi xong campaign.
    detail: >-
      Nó chỉ cần level 28. Nếu nó đắt trong ngày đầu, guide bảo bạn ở lại với
      [[Static Strike]] cùng một cây warstaff cho tới khi mua nổi. Nếu phải
      chọn giữa cây sceptre và transfigured gem, mua sceptre trước.
  - term: Crown of Eyes
    why: >-
      Spell damage áp dụng cho attack ở 150%, cộng life và mana leech. Món mua
      thứ hai của guide. Lưu ý dòng −30% fire resistance trên nó.
  - term: Iron Will
    why: >-
      Bonus damage của Strength áp dụng luôn cho spell damage, thứ
      [[Crown of Eyes]] chuyển tiếp sang attack của bạn.
  - term: Foulborn Ghostwrithe
    why: >-
      Đặt energy shield bằng 35% maximum life. Guide gọi nó là bắt buộc cho
      setup endgame.
    detail: >-
      Nó phải có đúng một mod Foulborn, và phải là đúng mod đó. Ở solo
      self-found tác giả farm Breach để lấy nó.
  - term: Energy Blade
    why: >-
      Biến cây sword một tay của bạn thành vũ khí lightning scale theo energy
      shield. Chỉ đáng dùng khi đi cùng cây body armour ở trên.
  - term: Rathpith Globe
    level: recommended
    why: >-
      Increased spell damage cho mỗi 100 maximum life, 10% more life, và spell
      block. Vào ở map đỏ, trước setup life-stacking.
  - term: Multistrike Support
    level: recommended
    why: >-
      Smite attack ở 85% base speed. Multistrike và attack speed trên gear là
      thứ làm nó sướng tay.
  - term: Raise Spectre
    level: recommended
    why: >-
      Ở endgame, cho một con spectre mà guide gọi là bắt buộc: Perfect Spirit
      of Fortune, con này làm lightning damage của bạn thành lucky. Tác giả
      định giá chuyện đó khoảng 40% more damage.
  - term: Glorious Vanity
    level: recommended
    why: >-
      Bản Doryani, để lấy keystone [[Corrupted Soul]]. Nó chia damage nhận vào
      giữa life và energy shield, thứ tác giả nói là trên thực tế nhân đôi hồi
      phục của bạn.
  - term: Ralakesh's Impatience
    level: recommended
    why: >-
      Ghép với [[Arn's Anguish]] ở setup endgame đầu tiên. Bị nerf trong 3.30;
      xem mục 3.30 đổi gì cho build này.

labs:
  - lab: Normal
    node: Sanctuary
    why: "Consecrated Ground mỗi khi bạn đứng yên: regeneration và giảm curse suốt campaign, và quái đứng trên nó ăn thêm damage."
  - lab: Cruel
    node: Pious Path
    why: "Hiệu ứng của vùng đất nán lại, và regeneration nạp energy shield. Guide lưu ý nó còn giữ cho Lightning Golem của bạn sống."
  - lab: Merciless
    node: Righteous Providence
    why: "+50 Strength và Intelligence cùng crit chance. Lấy nó trước khi mua Brutus' Lead Sprinkler, món được ghép với nó."
  - lab: Eternal
    node: Inevitable Judgement
    why: "Crit bỏ qua elemental resistance. Guide bảo bạn đổi Fire Penetration Support sang Elemental Damage with Attacks Support ngay khi có nó."

stages:
  - id: acts-1-3
    phase: early
    image: ground-slam
    title: Act 1–3
    levels: Level 1–33
    uses: >-
      [[Ground Slam]] suốt Act 1, rồi [[Static Strike]] từ level 12 trên một
      cây mace hai tay. [[Smite]] nằm trong một socket trống và được bấm một
      lần mỗi trận boss.
    changes: >-
      Ở Act 2 [[Shockwave Support]] vào link, và từ đó vũ khí của bạn phải là
      mace hoặc warstaff. [[Intimidating Cry]] tới để có cú hit exerted.
      Normal Labyrinth cho bạn [[Sanctuary]].
    links:
      - name: Đầu Act 1
        gems: [Ground Slam, Chance to Bleed Support, Ruthless Support]
      - name: Level 12
        gems: [Static Strike, Chance to Bleed Support, Ruthless Support]
      - name: Act 2
        gems: [Static Strike, Shockwave Support, Melee Physical Damage Support]
      - name: Di chuyển
        gems: [Leap Slam, Faster Attacks Support, Frostblink]
      - name: Aura và herald
        gems: [Precision, Clarity, Herald of Ash, Herald of Purity]
      - name: Món thêm
        gems: [Smite, Intimidating Cry, Holy Flame Totem, Summon Phantasm Support]
    moveOn: "Static Strike với Shockwave đã nằm trong three-link hoặc four-link, và bạn đã có Sanctuary."
    details:
      - title: Giờ đầu tiên
        body: |
          Từ ghi chú của guide: Templar bắt đầu với Holy Strike. Dùng nó giết Hailrake, lấy [[Ground Slam]], và dùng cái đó cho phần còn lại của Act 1 tới Cavern of Wrath.

          [[Static Strike]] cần level 12 và là reward của The Siren's Cadence.

          [[Smite]] ở đây là gem gốc. Đánh trúng quái bằng nó thì nhận một aura added lightning damage trong 4 giây. Lời khuyên của guide là dùng nó một lần lúc mở trận boss để lấy damage miễn phí.
      - title: Tìm gì trên gear
        body: |
          - "Your primary concern in the Campaign is getting as much damage on your weapon as possible." Trong campaign, mối lo chính là dồn damage lên vũ khí càng nhiều càng tốt. Physical là lý tưởng; elemental thì giai đoạn đầu cũng ổn.
          - Base hybrid armour và energy shield, để dùng được cả hai kiểu hồi phục.
          - Từ level 12, chỉ mace hoặc warstaff, vì [[Shockwave Support]].
          - Sau Piety ở Act 3, crafting bench thêm được lightning damage to attacks lên gloves, amulet và ring. Guide gọi đó là một cú đẩy lớn.
      - title: Cái cây, và một mastery bạn không được bỏ
        body: |
          [[Resolute Technique]] nằm trong cây campaign, nên accuracy chưa phải mối lo.

          Lời cảnh báo của guide: Attack Mastery "Non-Vaal Strike Skills target 1 additional nearby Enemy" là "crucial" với Static Strike. "Don't skip it!"

          Attribute là chỗ cọ xát quen thuộc của một Templar cần cả ba loại. Guide nói hãy giải quyết chúng trên gear, lấy tạm một notable attribute nếu buộc phải vậy, và để [[Blood Rage]] với [[Elemental Weakness]] ở level thấp hơn nếu bạn không đáp ứng nổi yêu cầu của chúng.
      - title: Bandit và Pantheon
        body: |
          Giúp **Alira** trong campaign. Về sau, khi gear đã tốt, đổi sang giết cả ba.

          Pantheon: **Soul of Lunaris** và **Soul of Ralakesh**.
  - id: acts-4-10
    phase: early
    image: static-strike
    title: Act 4–10
    levels: Level 33–68
    uses: >-
      [[Static Strike]] trong four-link, exert bằng [[Intimidating Cry]] và
      [[Rallying Cry]]. [[Summon Lightning Golem]] để lo mana và attack speed.
    changes: >-
      Cruel Labyrinth cho [[Pious Path]]. Hai mastery đổi link của bạn:
      Fortify Mastery cho phép [[Fortify Support]] rời đi, và Fire Mastery cho
      phép [[Trinity Support]] vào.
