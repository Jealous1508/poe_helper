    moveOn: "còn một bước nữa, và đó là bước đắt."
    details:
      - title: Nhân vật được công bố trông ra sao
        body: |
          File Path of Building được lưu với loadout này đang bật, nên đây là các con số của nó:

          - 8,357 life và 2,925 energy shield. Số sau đúng bằng 35% số trước.
          - 75% attack block và 78% spell block.
          - Resistance 79/78/79, chaos 75%.
          - Khoảng 1,280 life và 1,280 energy shield regenerate mỗi giây.
          - Cú hit lớn nhất sống sót được: 23,725 physical, từ 92,000 tới 96,000 cho mỗi element, 50,584 chaos.
          - 28.3 triệu damage mỗi giây, tính gộp cú strike, cú hit area và culling.

          **File này dùng passive tree 3.29 và thiết lập quái của riêng tác giả.** Con số damage cũng giả định bạn đáp được cú hit kép mọi lần. Phần mở đầu của guide hứa một bể máu gộp "of over 12,000"; file thì hiện khoảng 11,300.
      - title: Các mảnh ghép, và hai lời cảnh báo đi kèm
        body: |
          - [[Foulborn Ghostwrithe]] với **chỉ** mod "Your Maximum Energy Shield is Equal to 35% of your Maximum Life".
          - Sword một tay nào có Abyssal socket cũng được. Cái socket vẫn còn khi [[Energy Blade]] biến đổi vũ khí.
          - "As much Life as possible on all of your gear, this scales your defense AND offense." Life càng nhiều càng tốt trên mọi món gear, vì nó scale cả phòng thủ LẪN tấn công.
          - [[Ralakesh's Impatience]], bản endurance charge, và [[Arn's Anguish]]. "You can use Ralakesh without Arn's, DO NOT use Arn's without Ralakesh." Dùng Ralakesh không có Arn's thì được, còn Arn's mà không có Ralakesh thì ĐỪNG.
          - Elemental resistance overcap 25%, để hấp thụ exposure. Chaos resistance thì không cần overcap.
          - Increased life regeneration rate, thứ guide gọi là "a very powerful stat for this build".
          - [[Enhance Support]] trên Energy Blade: "an enormous amount of attack speed, even a Level 3 is worth using". Một lượng attack speed khổng lồ, level 3 thôi cũng đáng dùng.
      - title: Spectre
        body: |
          Chúng sống được mà không cần passive minion là nhờ Consecrated Ground của bạn.

          - **Perfect Spirit of Fortune: bắt buộc.** Nó cho aura Wrath và "Your Lightning Damage is Lucky", thứ tác giả ước chừng khoảng 40% more damage. Anh ta lưu ý nó hợp với dải damage rộng của Energy Blade và với [[Volatility Support]].
          - **Spectre thứ hai, tùy bạn.** Perfect Forest Warrior: Onslaught và Culling Strike, rất rẻ. Perfect Guardian Turtle: Determination và thêm physical damage reduction. Perfect Forest Tiger: Haste và frenzy charge, nhưng mỏng manh.
      - title: Jewel và Timeless Jewel
        body: |
          - [[Glorious Vanity]] phải ghi "in the name of Doryani", để lấy [[Corrupted Soul]]. Tìm một seed có notable Blood-Quenched Bulwark, hoặc có notable life hay spell block.
          - [[Watcher's Eye]]: mod đáng quan tâm là increased attack speed while affected by Precision.
          - Một viên [[The Red Dream]] Foulborn để lấy life và fire resistance.
          - Jewel rare: increased maximum life, và attack speed with swords hoặc while holding a shield. Một viên trong số đó cần reduced curse effect.
          - Một small cluster có Enduring Composure "solves your Endurance Charge generation", giải quyết luôn chuyện tạo endurance charge.
      - title: Corrupted Soul không hiện energy shield nào, và vậy là ổn
        body: |
          Từ FAQ. Body armour ghi đè phần lớn các mod khác lên maximum energy shield, nên bonus của keystone không hiện ra.

          Nó vẫn đáng lấy. Bình thường chỉ energy shield của bạn ăn damage, nên life regeneration không có gì để nạp lại và bị phí. Corrupted Soul gửi một phần mỗi cú hit vào life, và cả hai dòng regeneration cùng làm việc.
