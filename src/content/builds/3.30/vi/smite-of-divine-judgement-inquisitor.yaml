    moveOn: "Kitava đã chết và resistance đã vá xong. Chạy Merciless Labyrinth lấy Righteous Providence trước khi mua cây sceptre."
    details:
      - title: Thứ tự của hai cái mastery
        body: |
          1. Lấy Fortify Mastery "Melee Hits Fortify". Giờ [[Fortify Support]] thành thừa.
          2. Trong khoảng trống ngắn sau đó, guide đặt [[Elemental Damage with Attacks Support]] vào chỗ của nó.
          3. Lấy Fire Mastery "40% of Physical Damage Converted to Fire Damage". Guide nói cái này "necessary to enable [[Trinity Support]]", tức phải có nó thì Trinity mới chạy. Đổi Trinity vào.

          Nếu Trinity có vẻ chẳng làm gì, là bạn đã bỏ bước 3.
      - title: Bài đánh boss trong campaign
        body: |
          Rotation single-target của guide: [[Intimidating Cry]] và [[Rallying Cry]], rồi một cú [[Static Strike]] ngay lập tức, rồi giữ [[Elemental Weakness]] và aura của [[Smite]] trong lúc static làm việc suốt 4 giây.

          "Be sure to immediately use Static Strike after the Warcries." Hô xong là đánh Static Strike ngay. Và nhớ là [[Leap Slam]] có thể nuốt mất exert.
      - title: Mấy ghi chú nhỏ từ guide
        body: |
          - [[Summon Lightning Golem]] sống được nhờ Consecrated Ground của bạn, "fixing your mana sustain and providing some nice Attack Speed": nó lo chuyện mana và cho thêm chút attack speed.
          - Ở Sand Stance khi dùng [[Flesh and Stone]].
          - Respec mấy node khởi đầu một khi bạn đã có notable Spiritual Aid và Spiritual Command.
      - title: Gem cần nuôi level trong weapon swap
        body: |
          Sau khi bạn đã giúp Lilly Roth ở Act 6, guide bảo bạn mua những viên này và nuôi level trong bộ vũ khí thứ hai, sẵn sàng cho map: [[Fire Penetration Support]], [[Increased Critical Damage Support]], [[Multistrike Support]], [[Purity of Elements]], [[Tempest Shield]] và [[Assassin's Mark]].
