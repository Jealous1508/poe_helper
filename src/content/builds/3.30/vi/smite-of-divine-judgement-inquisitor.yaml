        body: |
          - [[Mageblood]] "heavily frees up Suffix pressure and allows you to reach 90% Maximum Elemental Resistances": nó gỡ rất nhiều áp lực suffix và cho bạn chạm 90% maximum elemental resistance. Nó còn cho một dạng Onslaught tốt hơn, nên spectre thứ hai thành Perfect Guardian Turtle.
          - [[Zana's Ingenuity]]: mod quan trọng nhất là "Elemental Resistance Cannot Be Penetrated". Nó cũng nên có life và attack speed.
          - [[Melding of the Flesh]] cap cả ba resistance ở 90% mà không cần ba cây flask resistance, nhờ đó bạn chạy được [[Silver Flask]] và [[Diamond Flask]] thay vào.
          - [[Progenesis]]: "incredible for any Life-based build".
          - Một viên [[Megalomaniac]] có Enduring Composure, để lấy endurance charge khi Ralakesh's đã đi.
          - Large cluster jewel để lấy attack speed và resistance.
          - Trang sức Heist mirrored để lấy sức mạnh thuần.
      - title: Gem imbue
        body: |
          - Trên main skill: hiệu ứng Fortify là "the best Imbue", và tiết kiệm 5 passive point. Phương án thay nếu nó quá đắt: Endurance Charge on Melee Stun, Cruelty, hoặc Increased Critical Strikes.
          - Trên [[Tempest Shield]]: Culling Strike, thứ guide thừa nhận "may be inconsistent at times", có lúc không ổn định.
          - Trên [[Assassin's Mark]]: Mark On Hit, giải phóng một socket cho [[Enlighten Support]] và cho bạn bỏ nguyên một wheel reservation.
      - title: Corrupt hai món cốt lõi
        body: |
          Bước cuối của guide là corrupt [[Rathpith Globe]] và [[Foulborn Ghostwrithe]] bằng Volatile Vaal Orb để nâng dải roll của chúng, dùng một Tailoring Orb lên body armour trước để tăng hiệu lực các mod phòng thủ của nó.

          Nó không nói một cú corrupt hỏng thì bạn mất gì. Đừng làm chuyện này với bản duy nhất bạn có.

powerCurve: |
  Sức mạnh của build này không lớn lên theo một đường. Nó đổi nguồn hai lần.

  **Ở level 30** damage của bạn là một cây mace hai tay to, static energy của [[Static Strike]], và một warcry nhân đôi nó. Phòng thủ là life, armour và việc đứng trên Consecrated Ground của chính mình. Đó là một nhân vật melee chắc chắn, bình thường, và chưa món nào định hình build tồn tại cả.

  **Ở level 70** bạn đổi động cơ trong một buổi chiều. [[Righteous Providence]] và [[Inevitable Judgement]] đến từ hai lab cuối, mà cây của guide lấy sau campaign, còn [[Brutus' Lead Sprinkler]] và [[Crown of Eyes]] thì được mua. Giờ ba thứ nhân lẫn nhau: Strength (thành fire damage, và hai lần thành increased damage), critical strike, và việc bỏ qua resistance. Đây là cú nhảy đột ngột đầu tiên, và nó rẻ. Đó là lý do build làm starter được.

  **Quanh level 85–90** bạn đổi skill, không đổi động cơ: [[Smite of Divine Judgement]] và một implicit strike target. Clear và single target đều tăng, nhưng chỉ khi attack speed đã có sẵn.

  **Ở level 95** bạn lại đổi động cơ. Life thay Strength. [[Foulborn Ghostwrithe]] và [[Energy Blade]] biến life thành damage vũ khí, [[Rathpith Globe]] biến nó thành increased damage, và lightning damage lucky của con spectre nhân kết quả lên. Phòng thủ lớn lên cùng chính những món mua đó, vì chỉ số bạn đang chồng là máu của bạn.

  **Cách đọc của chúng tôi, không phải của tác giả:** đường cong là hai bậc thang và hai đoạn bằng. Nó thấy chậm trong các act, đột ngột ở mấy map đầu, phẳng suốt map vàng trong lúc bạn gom attack speed, rồi đột ngột lần nữa ở cuối. Người ghét mấy đoạn phẳng nên biết đó là lúc cú nhảy kế tiếp đang được trả tiền.

upgrades:
  - step: "[[Brutus' Lead Sprinkler]], và một cây shield"
    why: >-
      Đứng đầu vì mọi thứ trong động cơ thứ hai đều nhân nó lên. Nó chỉ cần
      [[Righteous Providence]] và số Strength bạn đã có. Guide: mua nó "with
      any Chaos Orbs you have found".
    cost: "Không có con số nào. Tác giả chỉ nói chuyện nó đắt là \"very unlikely\", mà đó là kỳ vọng của 3.29."
  - step: "[[Crown of Eyes]]"
    why: >-
      Món mua kế của guide. Với [[Iron Will]] nó đếm bonus Strength của bạn
      lần thứ hai ở 150%, và nó thêm life với mana leech. Nó đi sau cây
      sceptre vì không có flat fire damage thì nó chẳng có mấy thứ để nhân.
  - step: "Strength và attack speed trên đồ rare, cùng dòng craft ring cho warcry"
    why: >-
      Ở giai đoạn này Strength là damage và crit, còn attack speed là vé vào
      cửa cho bước kế. Dòng craft trên ring chặn [[Leap Slam]] nuốt cú hit
      exerted của bạn. Rẻ, và nó gỡ một khoản hao hụt nhỏ nhưng liên tục.
  - step: "[[Smite of Divine Judgement]], kèm implicit strike target trên gloves"
    why: >-
      Chỉ tới lúc này, khi gloves đã có 12% attack speed và mỗi viên jewel có
      6%. Mua sớm hơn thì nó làm nhân vật chơi tệ đi; tác giả đã dời nó về sau
      trong chính guide của mình vì lý do đó.
  - step: "[[Rathpith Globe]] và [[The Magnate]]"
    why: >-
      Thêm increased damage qua cái helmet, 10% life, spell block. Nằm dưới
      gem vì gem đổi số quái mỗi nhát chém đánh trúng, còn mấy món này chỉ làm
      mỗi cú hit to hơn.
  - step: "[[Foulborn Ghostwrithe]], [[Energy Blade]] và một cây sword một tay Abyssal, cùng lúc"
    why: >-
      Lần đổi động cơ thứ hai. Đây là một món mua gồm ba phần: thiếu cây body
      armour thì Energy Blade cắt nửa energy shield của bạn và bạn được chẳng
      bao nhiêu. Nó muộn thế này vì cùng lúc đó gear của bạn phải được mua lại
      theo hướng life.
  - step: "[[Ralakesh's Impatience]] với [[Arn's Anguish]], rồi [[Glorious Vanity]] bản Doryani"
    why: >-
      Có charge mà không phải tạo ra chúng, một cây belt life lớn, và
      [[Corrupted Soul]] để bắt life regeneration của bạn làm việc. Chúng tinh
      chỉnh động cơ; chúng không khởi động nó.
  - step: "[[Mageblood]], [[Zana's Ingenuity]], gem imbue"
    why: >-
      Đứng cuối vì mỗi món đắt hơn tất cả những thứ phía trên cộng lại mà đem
      lại ít hơn. Guide đặt tên loadout này là Aspirational.

play:
  mapping: |
    [[Leap Slam]] tới pack kế. Bạn đáp xuống, và trong khoảnh khắc đó bạn đang đứng yên, nên Consecrated Ground hiện ra và hiệu ứng của nó nán lại sau lưng bạn.

    Một hai nhát [[Smite of Divine Judgement]]. Đừng đuổi theo từng con quái: sét chọn tới ba mục tiêu trong vòng 5 mét quanh mỗi cú strike, và mỗi strike target thêm lại làm y như vậy lần nữa.

    Giữ [[Blood Rage]] chạy. Đó là toàn bộ rotation trong guide: cái skill, và chữ "maintain" bên cạnh Blood Rage.

    [[Automation]] với [[Convocation]] kéo golem hoặc spectre về bên bạn mà không cần bấm phím. Mark thì được chính các cú hit của bạn áp lên.

    **Trước map đỏ** vòng lặp khác đi: một cú [[Static Strike]], rồi di chuyển trong lúc static energy dọn dẹp suốt 4 giây. [[Intimidating Cry]] tự hô qua [[Autoexertion]].
  bossing: |
    Vị trí trước đã. Đứng hơi ngoài tầm melee của chính bạn, để tia sét từ cú strike của bạn và cú strike của ancestor cùng rơi lên boss. Nếu damage tụt một nửa, là bạn đã trôi vào quá gần hoặc ra quá xa.

    Bật tincture. Guide để dành nó cho "tanky Rares and Bosses". Dùng [[Vaal Smite]] để lấy aura của nó khi nó đã nạp xong.

    Rồi đứng yên hết mức trận đánh cho phép. Regeneration, lớp chống curse và 15% increased damage mà quái phải ăn đều đến từ vùng đất chỉ hiện ra khi bạn đứng yên, và nán lại 4 giây sau đó.

    **Chỗ giằng co của build** chính là thế. Nó muốn bạn đứng yên, ở đúng một khoảng cách chính xác, trong tầm melee, trước những con boss được thiết kế để bắt bạn di chuyển. 4 giây nán lại và block là thứ khiến chuyện đó khả thi. Cách đặt vấn đề này là của chúng tôi; guide mô tả các mảnh ghép, không mô tả cái xung đột.

    Trong campaign và mấy map đầu, bài đánh boss là exert: cả hai warcry, một cú hit, rồi buông tay 4 giây.

deaths:
  - situation: "Map mà người chơi không regenerate được life, mana hay energy shield, hoặc có less recovery rate."
    cause: >-
      Regeneration là nguồn hồi phục cho cả hai bể. Leech từ [[Crown of Eyes]]
      chỉ là phần phụ nhỏ và [[Eternal Youth]] còn cắt nó một nửa.
    fix: >-
      Cả hai mod đều nằm trong danh sách cần tránh của guide. Reroll map.
  - situation: "Map có elemental reflect."
    cause: >-
      Crit của bạn bỏ qua resistance và cú hit của Energy Blade rất to. Bị
      reflect thì chúng quay ngược về bạn.
    fix: >-
      Đứng đầu danh sách cần tránh của guide. Đừng bao giờ chạy.
  - situation: "Fire damage, không lâu sau khi bạn đội Crown of Eyes."
    cause: >-
      Helmet này có −30% fire resistance. Đây là lời cảnh báo của chúng tôi từ
      dòng chữ trên món đồ; guide chỉ nói giữ resistance ở cap.
    fix: >-
      Kiểm fire resistance trong town sau khi đội nó. Bộ gear mẫu vá bằng một
      cây ring craft và, về sau, viên [[The Red Dream]] Foulborn.
  - situation: "Reduced chance to block, hoặc reduced effect of non-curse auras."
    cause: >-
      Block là một lớp chính (75% và 78% trong file hoàn chỉnh), còn
      [[Purity of Elements]], [[Tempest Shield]] và [[Precision]] là aura.
    fix: >-
      Cả hai đều nằm trong danh sách cần tránh của guide, cùng với less
      accuracy rating.
  - situation: "Setup Energy Blade, lắp vào từng mảnh một."
    cause: >-
      [[Energy Blade]] đứng một mình cho 50% less maximum energy shield. Không
      có dòng ghi đè của body armour thì bạn mất phòng thủ và được một cây vũ
      khí yếu.
    fix: >-
      Có đủ hết rồi hãy đổi. Guide gọi [[Foulborn Ghostwrithe]] là "mandatory
      to swap to this setup", bắt buộc để đổi sang setup này.

troubleshooting:
  - symptom: "Mới ngày đầu mà Brutus' Lead Sprinkler đã đắt."
    cause: >-
      Ai theo guide cũng muốn đúng cây sceptre đó trong cùng một giờ.
    fix: >-
      Câu trả lời của chính guide: ở lại với [[Static Strike]], chuyển sang
      warstaff sau Merciless Labyrinth, và theo file dự phòng. Nếu bạn chỉ mua
      nổi một trong hai giữa sceptre và gem, mua sceptre.
  - symptom: "Tôi đổi sang Smite và nó thấy tệ hơn Static Strike."
    cause: >-
      Attack speed. Gem chém ở 85% base speed.
    fix: >-
      Quay lại Static Strike cho tới khi gloves có 12% attack speed và mỗi
      viên jewel có 6%. Đó là ngưỡng guide nêu ra.
  - symptom: "Damage đánh boss của tôi chỉ bằng khoảng một nửa guide cho thấy."
    cause: >-
      Bạn đang đáp được một phần của skill thay vì hai. Con số damage được
      công bố tính gộp cú strike và cú hit area.
    fix: >-
      Đứng hơi ngoài tầm melee. Tác giả nói khi làm đúng bạn sẽ thấy khác biệt
      ngay.
  - symptom: "Static Strike exerted của tôi đánh không đau."
    cause: >-
      Hoặc [[Leap Slam]] đã tiêu mất exert, hoặc bạn attack lần nữa trong
      4 giây và thay mất static exerted.
    fix: >-
      Craft "Warcries cannot Exert Travel Skills" lên một cây ring, và mỗi
      tiếng hô chỉ đánh một cú.
  - symptom: "Damage on Full Life Support chẳng làm gì."
    cause: >-
      Trong một trận đánh bạn gần như không bao giờ ở đúng full life.
    fix: >-
      Life Mastery "You count as on Full Life while at 90% of maximum Life or
      above". Guide nêu đích danh nó cho support này.
  - symptom: "Tôi miss nhiều hơn từ khi bỏ Resolute Technique."
    cause: >-
      Từ map đầu, accuracy lại là vấn đề của bạn.
    fix: >-
      Notable Shining Justice (30% increased accuracy trên vùng đất của bạn),
      [[Precision]], accuracy trên gloves, và cú đổi sang
      [[Summon Ice Golem]] của guide.

patch:
  - note: >-
      **Skill và ascendancy không bị đụng tới.** Smite, Static Strike, Energy
      Blade và Inquisitor không xuất hiện trong patch note 3.30, ở bất kỳ phần
      nào. Changelog của chính tác giả xác nhận anh ta đã kiểm: cả hai mục
      tháng 11 của anh ta đều nói về item.
  - entry: ralakeshs-impatience
    note: >-
      **Một cú nerf thật cho một món endgame, và tác giả đã trả lời rồi.**
      Boots [[Ralakesh's Impatience]] mới lấy đi một maximum charge của một
      loại. Mục ngày 12/11 của anh ta: cú nerf "makes it a bit rough to use
      now without Arn's" (giờ dùng mà không có Arn's thì hơi khó), nên anh ta
      gỡ đôi boots khỏi loadout Aspirational và giữ nó trong setup endgame rẻ
      hơn, ghép với [[Arn's Anguish]], vì vẫn "inexpensive and efficient".
  - entry: no-random-league-mechanics
    note: >-
      **Cây body armour mà endgame phụ thuộc vào đến từ Breach**, mà Breach
      không còn tự xuất hiện trong map. Bạn cần Breach Thread, hoặc một người
      bán. Tính trước là nguồn cung [[Foulborn Ghostwrithe]] sẽ vận hành khác
      league trước; chưa ai có giá.
  - entry: golem-buff-nerfs
    note: >-
      **Nhỏ.** [[Summon Lightning Golem]] cho 8% attack và cast speed, giảm từ
      10%. Bạn dùng nó từ Act 5 tới map đỏ, trên một build thèm attack speed.
  - entry: special-base-implicits
    note: >-
      **Nhỏ.** Ring mẫu cho tới map đỏ là Amethyst Ring, implicit của chúng
      tụt xuống +13–19% chaos resistance từ +17–23%.
  - entry: royal-visage-soul-cores
    note: >-
      **Gem imbue trong loadout cuối mang một rủi ro mới.** Mấy món thêm hiệu
      ứng support vào gem giờ là Soul Core và có thể roll ra hiệu ứng xấu.
      Danh sách kết quả tốt của guide được viết trước chuyện đó.
  - entry: league-fates
    note: >-
      **Có lẽ hợp, nhưng có một cái vướng.** Boss khu vực khó hơn thì hợp với
      một build hồi phục nhiều thế này và có mẹo single-target mạnh. Cái vướng
      là thêm mối nguy nghĩa là phải di chuyển nhiều hơn, mà build này mạnh
      nhất khi đứng yên. Đó là cách đọc của chúng tôi, và chưa được thử.

strengths:
  - "Hồi phục không điều kiện: regeneration nạp life và energy shield cùng lúc, và curse gần như không ảnh hưởng tới bạn."
  - "Crit bỏ qua elemental resistance, nên quái kháng cao và mod map không làm nó chậm lại."
  - "Một nhát chém đánh trúng mục tiêu và vài con quái khác khắp màn hình."
  - "Block, fortify, blind và một bể máu lớn, chồng lớp lên nhau."
  - "Cú nhảy sức mạnh đầu tiên rất rẻ: một cây sceptre và một cái helmet."
  - "Về cuối, tấn công và phòng thủ scale từ cùng một chỉ số."
  - "Một guide mà tác giả vẫn đang chỉnh sửa cho 3.30."
weaknesses:
  - "Ba động cơ khác nhau và hai lần respec thật sự giữa level 68 và 95."
  - "Main skill là một transfigured gem mà tới map đỏ bạn mới dùng."
  - "Cú hit kép đòi vị trí chính xác, trong tầm melee."
  - "Thiếu attack speed thì chơi rất dở; tác giả nói vậy không chỉ một lần."
  - "Endgame phụ thuộc vào một cây body armour với đúng một mod, từ một cơ chế mà 3.30 làm khó tiếp cận hơn."
  - "Không có giá ở bất cứ đâu trong guide, và không có nguồn thứ hai."
avoidIf: >-
  Chọn build khác nếu bạn muốn một build từ level 1 tới cuối. Đây là ba build,
  và mỗi lần đổi là bán gear với hoàn điểm passive. Bỏ qua nếu bạn không muốn
  học một mẹo đứng vị trí để có đủ damage, hoặc nếu bạn ghét đứng yên. Còn nếu
  bạn muốn bản endgame mà bỏ qua cả hành trình, hãy kiểm trước xem bạn có thật
  sự kiếm được một cây [[Foulborn Ghostwrithe]] đúng mod không.

