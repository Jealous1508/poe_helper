    moveOn: "bạn có cây sceptre, cái helmet, attack speed trên gloves và jewel, và transfigured gem đã cầm trong tay."
    details:
      - title: Vì sao bạn vẫn ở Static Strike
        body: |
          Tác giả cố ý đổi chỗ này. Mục changelog của anh ta: anh ta chuyển giai đoạn đầu map "to stay on Static Strike, as swapping to Smite of Divine Judgement without sufficient Attack Speed can feel bad". Ở lại với Static Strike, vì đổi sang Smite of Divine Judgement khi chưa đủ attack speed thì chơi rất dở.

          Nên đừng vội nhét gem vào link. Mua nó khi mua được, và đổi khi đã đủ attack speed. Các ngưỡng nằm ở chặng kế.
      - title: Thứ tự mua sắm của guide
        body: |
          1. [[Brutus' Lead Sprinkler]], "with any Chaos Orbs you have found", tức bằng bất cứ Chaos Orb nào bạn nhặt được. Setup campaign đủ mạnh cho map trắng nếu bạn phải chờ.
          2. [[Crown of Eyes]].
          3. Strength và attack speed trên mọi món rare, với resistance đã cap.
          4. Trên một cây ring, craft "Warcries cannot Exert Travel Skills". "It is very important."
          5. Một Prismatic Tincture có elemental damage, cho quái rare trâu và boss.

          [[Carnage Heart]], [[Alberon's Warpath]] và một cây Foulborn Meginord's Girdle xuất hiện trong bộ gear mẫu. Guide nói chúng "are not necessary to swap to this setup", không bắt buộc để đổi sang setup này: dùng đồ rare có Strength, life và resistance cho tới khi bạn mua nổi.
      - title: Ba luật nhỏ
        body: |
          - **Không có life trên body armour.** Cây lấy Life Mastery "15% increased maximum Life if there are no Life Modifiers on Equipped Body Armour".
          - **[[Arrogance Support]] chỉ gắn với [[Precision]].** "Do NOT link Arrogance Support to any Auras besides Precision."
          - **Anoint Smashing Strikes** lên amulet để có endurance charge. Guide đưa Weapon Artistry làm phương án thay nếu bạn thiếu attack speed. Một lời dè chừng từ chúng tôi: dòng chữ hiện hành trên cây của Smashing Strikes cho endurance charge khi melee crit nói chung, nhưng mấy dòng damage của nó là cho staff. Nó hợp với phương án dự phòng warstaff của anh ta hơn là với một cây sceptre.
      - title: Jewel
        body: |
          "Your main priority on jewels is Attack Speed, followed by Strength." Ưu tiên chính trên jewel là attack speed, rồi tới Strength.

          Increased attack speed with maces là dòng tốt nhất; attack speed while holding a shield cũng tốt. Nếu jewel kiểu đó rẻ, guide nói hãy lấy jewel socket sớm hơn cây của nó thể hiện.
      - title: Nếu cây sceptre đắt trong ngày đầu
        body: |
          Đây chính là câu FAQ đầu tiên của guide. Bạn tiếp tục chơi [[Static Strike]], nhưng đổi từ mace sang warstaff ngay sau Merciless Labyrinth. Một file riêng cho thấy setup đó ở map vàng và ở Tier 16.

          **File dự phòng đó được lưu vào tháng 7/2026**, nên nó là 3.29 thuần.
  - id: red-maps
