    details:
      - title: Craft, theo cách guide bày ra
        body: |
          - **Ring, amulet, gloves:** Screaming Essence of Torment, Anguish và Suffering.
          - **Wand:** Shrieking Essence of Wrath, Shrieking Essence of Anger hoặc Screaming Essence of Hatred.
          - **Shield:** một cây Harmonic Spirit Shield; roll một modifier increased spell damage cao bằng [[Orb of Alteration]] và [[Orb of Augmentation]]; nếu bạn không cần suffix life hay resistance thì craft attack speed.
          - **Body armour:** gamble ra một cái hybrid five-link. Khi craft đồ hybrid, một Essence of Woe bảo đảm flat energy shield.
          - **Belt và jewel:** "use the trade site or run Abyss in search of a Stygian Vise and a Searching Eye Jewel".

          Trong 3.30, dòng cuối cần một Abyss Thread, và cây belt cần Item Tier 5 mới rơi.
      - title: Một craft veiled đáng biết
        body: |
          Nếu một món rare không cần suffix life hay resistance, guide gợi ý modifier veiled "Regenerate 150 Energy shield per second while a Rare or Unique Enemy is Nearby" để cải thiện hồi energy shield. Nó nuôi [[Ghost Dance]] đúng trong những trận bạn cần.
      - title: Một nhân vật độc lập trông thế nào
        body: |
          File 3.30 đo được duy nhất chúng tôi tìm thấy là của Kassadus, level 92, và nó đi *trước* stage này: nó đeo một cây [[Headhunter]], một [[Esh's Mirror]], [[The Fledgling]] và một [[Death Rush]].

          Các con số của nó: tổng **2.4 triệu** damage mỗi giây (1.6 triệu từ hit), 7.26 attack mỗi giây. 3,779 life và 1,157 energy shield. 12,253 evasion cho 68% cơ hội evade, 96% spell suppression, 24% block. Resistance 75/76/75 và **−25% chaos**. Effective hit point 27,689. Maximum hit taken: 7,300 physical, khoảng 24,000 mỗi nguyên tố, 3,000 chaos.

          Đặt cái đó cạnh mục tiêu của guide thì chúng khớp nhau: build này xong Atlas với khoảng bốn tới năm nghìn tổng bể máu và hai tới ba triệu damage. Nó làm được vậy bằng cách giết trước.
