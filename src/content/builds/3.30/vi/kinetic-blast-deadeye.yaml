    moveOn: "Eater of Worlds và Searing Exarch đã chết và bạn có hai Voidstone."
    details:
      - title: Kiếm cây wand
        body: |
          Kế hoạch của guide: "Around T11 Maps, gamble the gold you've acquired on Wands, aiming for a Wand with High Elemental DPS. Alternatively, use Wrath Essences on the new Wand Bases with 'Cannot Roll Caster Modifiers'."

          Cả hai đường đều bị 3.30 đụng tới. Gamble ở level cao thì "đắt hơn mà đồ lại tệ hơn", theo chữ changelog của site này. Essence là đường an toàn hơn lúc này: ở map đỏ, mọi Essence bạn giải phóng đều là tier Screaming trở lên.

          **Chưa ai thử lại bước gamble kể từ patch.** Nếu nó làm bạn thất vọng thì craft.
      - title: Flask
        body: |
          "Ensure your [[Diamond Flask]] and [[Silver Flask]] are rolled with the % chance to gain a Flask Charge when you deal a Critical Strike modifier, to greatly increase your single target DPS during extended boss fights."

          Modifier đó không làm gì cho tới khi bạn là crit, thêm một lý do nữa để cú chuyển sang crit được xếp trước stage này.
      - title: Gear trông tầm thường là có chủ ý
        body: |
          Mọi ô trong bộ gear của planner cho stage này đều là đồ rare. Các ưu tiên gắn với từng ô thì ngắn: attack speed và life trên gloves; spell damage, flat cold và lightning damage với local crit chance trên wand; modifier nhận flask charge khi crit trên các utility flask.

          Guide thêm một bước hoàn thiện, và chỉ như bước cuối: implicit Eater hoặc Exarch bằng Lesser Eldritch Ember hoặc Ichor.
  - id: four-stones
