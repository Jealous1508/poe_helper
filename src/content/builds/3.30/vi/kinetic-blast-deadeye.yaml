name: Kinetic Blast Deadeye
tagline: >-
  Build wand mà mỗi phát bắn nổ bung thành thêm mấy cú nổ nữa và dọn sạch màn
  hình từ xa. Rất nhanh, không cần unique nào, và chết vì bất cứ thứ gì nó không
  kịp giết trước.
class: Ranger
ascendancy: Deadeye
role: starter
budget: low
budgetNote: >-
  **Guide không đưa ra con số currency nào cho bất cứ thứ gì.** Những gì nó có
  nói: build "doesn't require any Unique items to function", và nó được đánh dấu
  là chơi được cho một khởi đầu solo self-found từ con số không. Chúng tôi vẫn
  xếp nó ở Low chứ không phải Starter, vì hai lý do. Damage chính là cây wand
  của bạn, nên build tốt ngang với cây wand bạn nhặt được, gamble được hoặc
  craft được. Và dòng tít của guide — Act 10 trong ba tiếng, bốn Voidstone
  trong khoảng mười tiếng — là tốc độ của tác giả, người đang giữ các kỷ lục
  speedrun campaign. Danh sách nhược điểm của chính nó kết thúc bằng "Need
  Investment for T17s".
mainSkill: Kinetic Blast
image: kinetic-blast
hero: art-deadeye
tags: [Wand, Projectile, Elemental, Crit]
ratings: { clear: 5, bossing: 3, survivability: 2, ease: 3 }
verified: "2026-11-14"
confidence: mixed
confidenceNote: >-
  **Ghi ngày tháng tử tế hơn phần lớn guide tuần này, và mỏng ở vài chỗ cụ
  thể.** Đây là guide Maxroll của havoc616, cập nhật ngày 12/11/2026. Khác với
  vài guide chỉ đổi mỗi cái banner, planner của nó thật sự là đồ 3.30: nó được
  đặt tên cho 3.30, lưu ngày 12/11, và đóng dấu phiên bản dữ liệu 3.30. Bản
  export Path of Building của nó gắn nhãn "3.29 for 3.30", một cách trung thực.
  Một widget ascendancy nhỏ trên trang là đồ sót lại từ một planner cũ hơn; bốn
  notable nó hiện thì không đổi. Những gì guide **không** có: bất kỳ giá nào,
  bất kỳ bảng điểm nào, bất kỳ con số damage hay độ sống sót nào được đo (chỉ
  có các mục tiêu để nhắm tới), và phần leveling của riêng nó — nó đẩy bạn sang
  ba guide campaign riêng, mà chúng tôi không đọc hết. Các con số của gem là từ
  PoEDB. Nhân vật 3.30 độc lập duy nhất chúng tôi tìm được, của Kassadus, là
  một bản [[Headhunter]] level 92, và mọi con số đo được trên trang này đều đến
  từ đó. Tiêu đề của nó đặt chữ "starter" trong ngoặc kép, và bạn nên nhớ
  chuyện đó. Bốn điểm rating là của chúng tôi.
modes:
  ssf: >-
    Guide nói được: "SSF Fresh Start League Start Viable", và không món nào
    trong lộ trình của nó là unique. Kế hoạch gear dựa vào chuyện gamble ra
    wand, vào Essence, và vào Abyss để lấy một cây [[Stygian Vise]] — mà 3.30
    làm hai trong ba thứ đó khó hơn (xem phần patch note bên dưới). Hãy chuẩn
    bị tinh thần là cây wand sẽ là bức tường.
  hardcore: >-
    Không nguồn nào khuyên chơi, và nhược điểm đầu tiên của guide là "Don't Get
    Hit Playstyle". Nhân vật 3.30 độc lập có 3,779 life, 27,689 effective hit
    point và chịu được 7,300 physical damage trong một hit. Đó là một nhân vật
    softcore.

idea: |
  [[Kinetic Blast]] là một attack bằng wand. Mỗi projectile trúng thứ gì đó sẽ nổ bung thành bốn cú nổ nữa quanh điểm chạm. Bắn vài projectile vào một pack là mấy cú nổ chồng lên nhau khắp màn hình.

  [[Deadeye]] là ascendancy dành cho nó vì một notable, [[Endless Munitions]]: thêm hai projectile cho mọi skill. Nhiều projectile hơn là nhiều điểm chạm hơn, và mỗi điểm chạm là thêm bốn cú nổ. Guide không cho bạn dùng skill này chút nào cho tới khi có notable đó.

  Nên đây là hai build nối nhau. Bạn lên level bằng một skill khác — một attack ném flask tên [[Explosive Concoction]] — rồi đổi sang wand sau Labyrinth thứ ba.

  Damage của nó tăng theo một kiểu khác thường. Kinetic Blast có một thuộc tính tên Arcane Might: mấy khoản increased *spell* damage cũng nâng *attack* damage của nó, ở mức gấp rưỡi giá trị. Nên món off-hand tốt nhất là shield của caster.

  Phòng thủ là đừng để bị đánh trúng. Bạn giết từ xa và đi xuyên qua pack; evasion, spell suppression và một chút energy shield là để lo những gì lọt qua.

chain:
  - label: Bắn
    text: "[[Kinetic Blast]] bắn projectile từ wand. [[Endless Munitions]] thêm hai cái nữa vào mỗi phát bắn."
  - label: Nổ bung
    text: "Mỗi projectile trúng đích tạo thêm 4 cú nổ. Chúng gây 40% less area damage, và có rất nhiều cú như vậy."
  - label: Wisp nhập cuộc
    text: "[[Sacred Wisps Support]] triệu hai con wisp, mỗi con có 25% cơ hội bắn skill cùng bạn — 50% khi có kẻ địch Rare hoặc Unique ở gần."
  - label: Spell damage cũng tính
    text: "150% Arcane Might: increased spell damage trên wand và shield của bạn áp vào attack này ở mức gấp rưỡi giá trị."
  - label: Boss có bộ đồ nghề thứ hai
    text: "Totem ballista [[Kinetic Bolt]] và một cái [[Tornado]] để bạn bắn vào. Gặp pinnacle boss thì bạn đổi luôn main skill."

chainDetails:
  - title: Vì sao bạn không bắt đầu bằng nó được
    body: |
      [[Kinetic Blast]] cần nhân vật level 28 và một cây wand. Quan trọng hơn, kế hoạch của guide là "swap to Kinetic Blast after acquiring Endless Munitions from the Merciless Lab", tức Labyrinth *thứ ba*, gần cuối campaign.

      Tới trước đó build có quá ít projectile để mấy cú nổ chồng lên nhau, và không có cây wand nào đáng dùng. Nên bạn lên level như một thứ hoàn toàn khác và coi cú đổi là một sự kiện.

      Ranger cũng không được chào viên gem này. PoEDB liệt nó là quest reward của Witch ở Act 3, được Clarissa bán cho Scion, Shadow, Templar và Witch. Với Ranger thì chỉ còn [[Siosa]] ở Library, Act 3, người bán gem cho mọi class, hoặc Lilly Roth từ Act 6.
  - title: Arcane Might, và vì sao bạn cầm shield của caster
    body: |
      Dòng của PoEDB cho gem: "150% Arcane Might". Các khoản increase và reduction của spell damage cũng áp vào attack damage của skill, ở mức 150% giá trị. Vì vậy một cái shield có 60% increased spell damage đáng 90% increased damage cho attack này.

      Đó là lý do của danh sách gear. Guide muốn "a high % spell damage shield" là một trong hai món mua đầu tiên, về sau craft một cây Harmonic Spirit Shield cho nó, và cây wand của nó mang spell damage dưới dạng implicit lẫn craft bench.

      [[Kinetic Bolt]], skill single-target, có **200%** Arcane Might và damage effectiveness cao hơn nhiều — 220% ở gem level 20 so với 155% của Kinetic Blast. Khoảng cách đó là lý do guide đổi skill khi đánh pinnacle boss.

      Cái này bị nerf cách đây một league. Trong 3.29 Kinetic Blast đi từ 200% Arcane Might xuống 150%, và từ 35% less area damage thành 40%. Trong 3.30 không gì đổi nó.
  - title: Cây wand để làm gì
    body: |
      Skill gây 140% weapon damage ở gem level 1 và 155% ở level 20, và attack ở 115% base speed. Mọi thứ bắt đầu từ damage của chính cây wand.

      Guide đòi "a high elemental DPS wand": flat fire, cold và lightning damage. Cây wand hoàn chỉnh của nó có cả ba làm prefix. [[Wrath]] cộng thêm flat lightning lên trên, và một setup [[Spellslinger]] cast [[Flame Wall]] thay bạn để, theo chữ của guide, attack của bạn nhặt thêm "additional flat fire damage".

      **Cách đọc của chúng tôi, không phải của guide:** đây cũng là lý do [[Trinity Support]] nằm trong link. Nó thưởng cho việc gây nhiều hơn một nguyên tố, và một cây wand có ba loại flat damage cộng bức tường với aura thì làm đúng chuyện đó.
  - title: Sacred Wisps, bằng con số
    body: |
      Từ PoEDB. [[Sacred Wisps Support]] chỉ chạy với wand. Đánh trúng bằng skill được support sẽ triệu 2 con wisp trong 10 giây. Mỗi khi bạn bắn, mỗi con wisp có 25% cơ hội dùng skill đó theo, và con số đó tăng thêm 25% nữa khi có kẻ địch Rare hoặc Unique trong presence của bạn.

      Bản của wisp gây 60% less damage ở gem level 1 và 51% less ở level 20, và support này có cost multiplier 140%. Nó cần level 18, và Ranger mua nó từ Yeena ở Act 2 sau quest Sharp and Cruel.

      Nên support này mạnh nhất đúng ở chỗ skill yếu nhất: đứng gần một thứ nguy hiểm.
  - title: Bộ đồ nghề single-target
    body: |
      Mấy cú nổ của Kinetic Blast được làm ra cho pack. Với bất cứ thứ gì có thanh máu, guide thêm hai thứ.

      - **[[Kinetic Bolt]] trên [[Ballista Totem Support]].** Mặc định ba totem, đặt trước khi boss thức dậy, bắn ra một tia đi zig-zag và fork.
      - **[[Tornado]].** PoEDB: trong 1.5 giây đầu, projectile của bạn đánh trúng được cái tornado, tối đa 20 lần, và nó chuyển damage sang kẻ địch bên trong; rồi nó đuổi theo kẻ địch thêm 4 giây nữa. Mô tả của guide là nó "deals massive single target damage based on the damage of the first 20 projectiles you fire into it". [[More Duration Support]] được link với nó.

      Gặp pinnacle boss, guide đi thêm một bước và đổi hai viên gem trong main link: [[Kinetic Blast]] lấy [[Kinetic Bolt]], và [[Returning Projectiles Support]] lấy [[Barrage Support]]. Nó lặp lại chỉ dẫn này bốn lần trên một trang, đủ gợi ra người ta hay quên chuyện đó tới mức nào.
  - title: Những gì chúng tôi không tìm được
    body: |
      - **Giá.** Không có, cho bất cứ thứ gì.
      - **Con số đo được từ guide.** Nó đưa mục tiêu — một triệu damage mỗi giây cho hai Voidstone đầu, hai tới ba triệu cho cả bốn — và không có con số nào từ nhân vật của chính nó.
      - **Một phần leveling.** Guide chỉ sang các guide campaign Explosive Concoction, Rain of Arrows và Lightning Arrow. Các bước gem bên dưới là đọc từ planner bên trong guide này; cây campaign thì không được mô tả bằng chữ.
      - **Keystone nào.** Planner có năm cây. Phần văn xuôi nêu [[Ghost Dance]], notable [[Entrench]] và một mastery suppression, ngoài ra không gì khác.
      - **Xếp hạng từ bên thứ ba.** Chúng tôi không tìm được tier list 3.30 nào xếp build này. Nó thì phổ biến: mấy bản Deadeye dùng wand đứng đầu danh sách build projectile 3.30 được xem nhiều nhất của một site.

mandatory:
  - term: Kinetic Blast
    why: >-
      Bản thân skill. Level 28, chỉ dùng với wand. Thêm 4 cú nổ mỗi điểm chạm,
      40% less area damage, 150% Arcane Might.
    detail: >-
      Quality của gem thêm tối đa một cú nổ nữa. Ranger không nhận gem này làm
      reward: mua nó từ [[Siosa]] ở Library, Act 3 hoặc từ Lilly Roth ở Act 6.
  - term: Endless Munitions
    why: >-
      "Skills fire 2 additional Projectiles." Điều kiện của guide để dùng
      Kinetic Blast, dù chỉ một chút. Labyrinth thứ ba.
  - term: Sacred Wisps Support
    why: >-
      Hai con wisp thỉnh thoảng chép lại attack của bạn, và chép một nửa số lần
      khi có kẻ địch Rare hoặc Unique ở gần. Có trong main link ở mọi stage.
  - term: Returning Projectiles Support
    why: >-
      Projectile quay ngược lại xuyên qua pack. Nằm trong link clear cho tới
      tier cao nhất, nơi cây ring [[Nimis]] cung cấp đúng thứ đó và giải phóng
      ô socket.
  - term: Trinity Support
    why: >-
      More elemental damage cho một skill gây nhiều nguyên tố. Có trong link từ
      setup Kinetic Blast đầu tiên tới six-link.
  - term: Elemental Damage with Attacks Support
    why: >-
      More elemental damage với attack. Mang sang từ link leveling và giữ tới
      bản aspirational.
  - term: Kinetic Bolt
    why: >-
      Trên totem ballista cho boss map, và làm luôn main skill khi đánh
      pinnacle boss. Ranger mua nó từ Nessa ở Act 1.
  - term: Tornado
    why: >-
      Bắn vào nó. Damage của nó đến từ 20 projectile đầu tiên trúng nó. Là một
      phần của rotation đánh boss ở mọi stage.
  - term: Wrath
    why: >-
      Flat lightning damage cho attack. Aura duy nhất guide giữ trong mọi setup
      chạy map.
  - term: Spell Suppression
    why: >-
      100% là mục tiêu được nêu cho hai Voidstone cuối. Nhược điểm thứ hai của
      guide là "Must Finetune your Defence (Ex: Cap Suppression)".
  - term: Ghost Dance
    why: >-
      Hồi energy shield khi bạn bị hit, đó là câu trả lời của build cho burst
      damage. Nó cần chút energy shield để có cái mà làm việc.
    detail: >-
      Con số của guide: "ensure you have 100 to 300+ total energy shield to
      effectively use Ghost Dance". Đó là lý do body armour và helmet là hybrid
      evasion với energy shield.
  - term: Assassin's Mark
    why: >-
      Được [[Mark On Hit Support]] áp. Có quality thì nó sinh power charge
      trong các trận dài, và nó giúp chạm cap crit.
    detail: >-
      Guide chỉ đổi nó lấy [[Sniper's Mark]] khi pinnacle boss đã xong, crit đã
      gần cap mà không cần nó, và boss map chết trong dưới mười giây.
  - term: Gathering Winds
    level: recommended
    why: >-
      Labyrinth thứ nhất. Tailwind cho bạn và đồng minh ở gần, mạnh hơn theo
      mỗi skill bạn dùng. Guide gọi nó là "the de-facto choice" cho tốc độ và
      damage cùng lúc.
  - term: Focal Point
    level: recommended
    why: >-
      Labyrinth thứ tư. 75% increased effect cho mark của bạn, và 25% less
      damage taken từ các kẻ địch khác ở gần con bị mark.
  - term: Grace
    level: recommended
    why: >-
      Evasion. Thay [[Haste]] ở ô aura khi bạn nhắm tới hai Voidstone cuối.
  - term: Diamond Flask
    level: recommended
    why: >-
      Cùng một cây [[Silver Flask]], cả hai roll "chance to gain a Flask Charge
      when you deal a Critical Strike". Guide nói chuyện này nâng single-target
      damage "greatly" trong các trận boss dài.
  - term: Quartz Flask
    level: recommended
    why: >-
      Phasing. Chỉ dẫn clear của guide là attack vào từng pack "and run through
      them with a Quartz Flask or any other source of Phasing".
  - term: The Taming
    level: recommended
    why: >-
      Hai cây trong bộ endgame, với 20% quality từ Turbulent Catalyst. Trước đó
      thì không cần.
  - term: Replica Hyrri's Ire
    level: recommended
    why: >-
      Body armour endgame. Được guide nêu là một trong bốn unique mà build
      "benefits from"; nó không nói món này đóng góp gì, và chúng tôi không
      kiểm.

labs:
  - lab: Normal
    node: Gathering Winds
    why: "Action speed qua Tailwind: cơ động, clear và single target cùng lúc."
  - lab: Cruel
    node: Ricochet
    why: "Skill chain thêm một lần, và nó nằm trên đường tới Endless Munitions. Far Shot được đưa ra làm phương án thay thế cho lối chơi tầm xa, kèm lời cảnh báo rằng khi đó bạn cần một cơ chế projectile từ chỗ khác."
  - lab: Merciless
    node: Endless Munitions
    why: "Thêm hai projectile. Guide: đây là thứ cho phép đổi sang Kinetic Blast."
  - lab: Eternal
    node: Focal Point
    why: "Mark mạnh hơn, cho single-target damage."

stages:
  - id: acts-1-3
    phase: early
    image: poisonous-concoction
    title: Act 1–3
    levels: Level 1–28
    uses: >-
      [[Caustic Arrow]] với một cây bow tới level 12, rồi
      [[Poisonous Concoction]], thứ không dùng vũ khí nào cả, cho tới 28.
    changes: >-
      Ở 12 bạn đặt cây bow xuống. [[Blood Rage]] và [[Herald of Ash]] vào ở 16,
      [[Haste]] ở 24. Bạn chưa chơi build wand, và suốt cả campaign cũng sẽ
      chưa.
    links:
      - name: Level 1–12
        gems: [Caustic Arrow, Volley Support, Mirage Archer Support]
      - name: Level 1–12, attack thứ hai
        gems: [Burning Arrow, Momentum Support]
      - name: Level 12–28
        gems: [Poisonous Concoction, Volley Support, Momentum Support]
      - name: Di chuyển
        gems: [Shield Charge, Faster Attacks Support, Momentum Support]
      - name: Utility tới level 24
        gems: [Sniper's Mark, Blood Rage, Frostblink, Withering Step, Herald of Ash, Haste]
    moveOn: "bạn level 28 và cắm được Explosive Concoction."
    details:
      - title: Mấy bước này đến từ đâu
        body: |
          Phần chữ của chính guide chỉ nói "during the campaign, you level with Explosive Concoction, Rain of Arrows or Lightning Arrow", và link một guide riêng cho từng cái. Các bước gem ở đây là những bước được lưu trong planner bên trong guide Kinetic Blast, cái đi theo lộ trình Explosive Concoction.

          **Chúng tôi không đọc hết guide leveling riêng đó.** Về passive tree, guide nói hãy "click through the campaign embed"; cây campaign chỉ tồn tại ở đó, không có bằng chữ.
      - title: Nhặt gì
        body: |
          Bốn mục tiêu gear campaign của guide, theo thứ tự của nó: "Any Shield that improves your DPS", boots có 25% tới 30% movement speed, gear life với resistance, và flat damage trên ring, amulet hoặc gloves.

          Concoction được ném với tay chính để trống, đó là lý do shield có trong danh sách đó ngay từ đầu. Guide Poisonous Concoction Pathfinder của site này giải thích bản thân skill.
      - title: Bandit và Pantheon
        body: |
          Planner chọn **Alira**, và nhân vật 3.30 độc lập cũng vậy. Pantheon trên planner: Soul of the Brine King và Soul of Ryslatha. Phần Pantheon của guide là một link tới một trang chung và không đưa lý do nào.
  - id: acts-4-10
    phase: early
    image: gathering-winds
    title: Act 4–10
    levels: Level 28–68
    uses: >-
      [[Explosive Concoction]] trong một four-link. [[Haste]] và, từ 38,
      [[Flesh and Stone]]. [[Sniper's Mark]] được [[Mark On Hit Support]] áp.
    changes: >-
      Ba Labyrinth: [[Gathering Winds]], [[Ricochet]], rồi
      [[Endless Munitions]]. Cái thứ ba mới là cái quan trọng. Nhân vật là
      non-crit suốt chặng và giữ nguyên vậy cho tới map.
    links:
      - name: Level 28–38
        gems: [Explosive Concoction, Volley Support, Lesser Multiple Projectiles Support, Elemental Damage with Attacks Support]
      - name: Level 38+
        gems: [Explosive Concoction, Greater Volley Support, Elemental Damage with Attacks Support, Fire Penetration Support]
      - name: Mark
