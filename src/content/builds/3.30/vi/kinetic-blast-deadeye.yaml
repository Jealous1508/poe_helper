    moveOn: "bạn đã có Endless Munitions, Act 10 đã xong, và resistance của bạn đã cap."
    details:
      - title: Bắt đầu gom đồ cho cú đổi
        body: |
          Bạn mang mấy skill wand trong socket thừa được từ rất lâu trước khi dùng chúng. [[Kinetic Bolt]] được Nessa bán cho Ranger ở Act 1. [[Sacred Wisps Support]] đến từ Yeena ở Act 2. Bản thân [[Kinetic Blast]] thì từ [[Siosa]] ở Act 3 hoặc Lilly Roth ở Act 6.

          Lên level cho chúng sớm là gợi ý của chúng tôi; guide không nhắc tới.
      - title: Sau boss Act 10
        body: |
          Guide: "Upon defeating Act 10 Kitava, use the Gambling Vendor to upgrade any weaker item drops from earlier acts, primarily focusing on basic resistance capping. The life resistance gear you equip here is viable for defeating Eater and Exarch."

          Lưu ý cho 3.30: gamble ở level cao giờ tốn hơn và cho đồ tệ hơn so với lúc câu đó được viết.
  - id: early-maps
    phase: early
    image: kinetic-blast
    title: "Map đầu: cú đổi"
    levels: Map trắng và map vàng
    uses: >-
      [[Kinetic Blast]] trong một five-link, một cây wand có elemental damage,
      một cái shield có spell damage, và bộ đồ nghề đánh boss: totem
      [[Kinetic Bolt]], [[Tornado]] và một [[Flame Wall]] được trigger.
    changes: >-
      Mọi thứ. Bạn đổi loại vũ khí, main skill và phần lớn socket trong cùng
      một ngày, và đâu đó trong khúc này bạn còn chuyển cây từ non-crit sang
