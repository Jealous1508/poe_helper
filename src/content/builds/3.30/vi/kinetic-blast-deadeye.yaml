    moveOn: "không còn stage nào nữa."
    details:
      - title: Cây wand và cái shield hoàn chỉnh
        body: |
          **Wand.** Dùng Shrieking Essence of Wrath, Hatred hoặc Anger cho tới khi bạn trúng một modifier flat elemental thứ hai ở tier 3 trở lên. Làm y vậy trên một cây wand thứ hai, sao cho hai cây cộng lại có đủ cả ba nguyên tố. Recombine chúng cho tới khi một cây có cả ba làm prefix. Guide: "Only use Shrieking Essences", và tốt nhất là trước đó cả hai cây đều không có prefix nào khác.

          **Shield.** Recombine các cây Harmonic Spirit Shield màu xanh để lấy increased spell damage và life; lấp đầy suffix; một Redeemer's Exalted Orb để lấy increased elemental damage with attack skills; rồi "Prefixes Cannot Be Changed" và một [[Veiled Chaos Orb]], hy vọng ra chance to deal double damage; attack speed để kết thúc.

          **Hai cảnh báo 3.30, cả hai đều không có trong guide.** Recombinator giờ trả lại ít modifier hơn khi hai món đầu vào có ít modifier cộng lại, mà đó chính là trường hợp "hai prefix trên mỗi cây wand" mô tả ở trên. Và bảo vệ prefix trên một món weapon tốn 4 Divine cộng một [[Sacred Orb]]. Trên giấy thì cách làm vẫn chạy. Nó tốn bao nhiêu thì chưa biết.
      - title: Bản aspirational
        body: |
          Chữ của guide: "There are many viable high investment build options for an endgame Wander. The example provided is a Map Blaster that uses a [[Headhunter]] to steal Damage as Extra modifiers with a High Physical Damage wand."

          Nó thêm [[Esh's Mirror]] cho flat lightning damage dựa trên số quái bị shock giết gần đây, [[Nimis]] cho returning projectile, "massively improving clear speed and damage by freeing a support gem", và một cái body armour craft làm quái phát nổ. [[Progenesis]] nằm trong hàng flask.

          Để ý cây wand đổi loại ở đây: *physical* damage cao, không phải elemental. Đó là dựng lại, không phải nâng cấp cây wand trước.
      - title: Build vẫn làm dở chuyện gì
        body: |
          - Nó gần như không có biên an toàn. Khoảng bốn tới năm nghìn tổng bể máu, và chaos resistance thì guide coi là tùy chọn.
          - Pinnacle boss cần một cú đổi gem mà bạn phải nhớ trước trận.
          - Ba loại map nằm ngoài cuộc chơi: cả hai reflect và no-leech.
          - Nhược điểm thứ ba của chính guide: "Need Investment for T17s". Nó không nói bao nhiêu.

powerCurve: |
  Build này không hẳn có một đường cong sức mạnh, đúng hơn là một cái vách đá với một cái cầu thang phía sau.

  **Ở level 30 nó chưa phải build này.** Bạn đang ném [[Explosive Concoction]] không cần vũ khí, và không thứ gì bạn có còn quan trọng sau cú đổi ngoài life, resistance và movement speed. Đó là lý do campaign nhanh, và cũng là lý do nó không dạy bạn gì về cảm giác của nhân vật sau này.

  **Quanh level 70 mọi thứ tới trong một buổi chiều.** Có ba thứ nhân clear của Kinetic Blast lên, và cú đổi cho bạn cả ba cùng lúc: số projectile ([[Endless Munitions]] thêm hai), bốn cú nổ mỗi cái tạo ra, và [[Returning Projectiles Support]] gửi chúng ngược lại qua pack. Cái tích đó là lý do clear speed xuất sắc ngay từ map đầu tiên trên một five-link. Single-target damage thì không có hệ số nào trong số đó — một mục tiêu không thể bị trúng nhiều cú nổ hơn số rơi lên nó — nên nó khởi đầu yếu và được vá bằng totem với [[Tornado]].

  **Từ đó trở đi damage là cây wand của bạn, mỗi lần một nâng cấp.** Flat elemental damage trên wand, nhân attack speed, nhân spell damage tính ở mức gấp rưỡi qua Arcane Might, nhân crit khi bạn đã chuyển. Mỗi cái là một bước gear bình thường, đó là lý do guide đưa được mục tiêu theo stage: một triệu ở hai Voidstone, hai tới ba triệu ở bốn. *Cách đọc của chúng tôi:* crit là cú nhảy thật sự duy nhất trên cái cầu thang đó, và tác giả cũng nói gần như vậy khi viết rằng non-crit "runs out of efficient scaling options at T16s".

  **Phòng thủ gần như không leo lên chút nào.** Mục tiêu bể máu của guide đi từ 3,000 lên khoảng 4,000 giữa Voidstone đầu và Voidstone cuối. Thứ cải thiện là khả năng né: suppression lên 100%, [[Grace]], [[Ghost Dance]]. Nên nhân vật ở level 95 clear nhanh gấp nhiều lần so với ở 75 mà chịu một cú hit trực diện chỉ khá hơn chút ít. Cái khoảng cách đó, chứ không phải damage, mới quyết định bạn có thích nó hay không.
upgrades:
  - step: Boots có movement speed và resistance đã cap
    why: >-
      Danh sách campaign của guide, và đứng đầu vì phòng thủ của build là
      khoảng cách với tốc độ. Không thứ gì phía sau giúp được một nhân vật
      không tránh ra kịp.
  - step: Một cây wand elemental damage cao
    why: >-
      Kinetic Blast gây 140–155% weapon damage, nên cây wand là cái nền mà mọi
      thứ khác nhân lên. Nó đi trước shield vì spell damage qua Arcane Might
      nhân damage của wand lên, và một hệ số nhân trên một cây wand tệ thì vẫn
      là một con số tệ.
  - step: Một cái shield có roll increased spell damage cao
    why: >-
      Được tính ở mức 150% cho skill này. Guide ghép nó với cây wand thành hai
      thứ phải có ngay sau cú đổi. Roll nó trên một cây Harmonic Spirit Shield
      bằng currency cơ bản thì rẻ, đó là lý do nó nằm cao thế này.
  - step: Cú chuyển sang crit, cùng flask nạp lại khi critical strike
    why: >-
      Bước lớn nhất về damage, và miễn phí về currency: nó là một lần respec.
      Nó đi sau wand và shield vì lời khuyên của chính tác giả là chờ roll tốt
      trên cả hai rồi mới chuyển.
  - step: Body armour hybrid, chút energy shield, và 100% spell suppression
    why: >-
      [[Ghost Dance]] cần 100 tới 300 energy shield mới đáng có, và
      suppression đã cap là yêu cầu guide nêu rõ cho Maven và Uber Elder. Nằm
      dưới các bước damage chỉ vì hai Voidstone đầu không đòi nó. Nếu bạn đang
      chết thì dời nó lên.
  - step: Stygian Vise và một viên jewel Searching Eye
    why: >-
      Thêm flat damage trên một ô trước đó không có. Sau suppression vì nó
      cộng vào một con số vốn đã đủ dùng, còn suppression thì chữa một con số
      chưa đủ.
  - step: Cây wand ba nguyên tố và cái shield hoàn chỉnh
    why: >-
      Vẫn hai món của bước hai và bước ba, làm cho tử tế. Nó muộn thế này vì
      nó đồng nghĩa với Shrieking Essence, một cái recombinator và một craft
      được bảo vệ, mà mỗi thứ đó đều đắt lên hoặc kém chắc ăn đi trong 3.30.
  - step: "Replica Hyrri's Ire, hai cây The Taming, Yoke of Suffering và Dying Sun"
    why: >-
      Các unique endgame của guide. Đứng cuối trong các nâng cấp bình thường
      vì build "doesn't require any Unique items to function": mấy món này
      trau chuốt một nhân vật đã chạy được và không món nào chữa một vấn đề.
play:
  mapping: |
    Giữ [[Kinetic Blast]] và nhắm vào giữa pack. Bạn không cần nhắm từng con quái: mấy cú nổ xảy ra quanh bất cứ thứ gì projectile trúng, và [[Returning Projectiles Support]] đem chúng quay ngược lại.

    Rồi đi *xuyên qua* pack, đừng đi vòng. Chỉ dẫn của guide là "attack into each pack and run through them with a [[Quartz Flask]] or any other source of Phasing". [[Shield Charge]] là cách di chuyển chính, có [[Flame Dash]] cho mấy cái khe. Nếu bạn thích [[Frostblink]] hơn, guide ghi chú là nó dùng được ở cuối một cú Shield Charge.

    [[Spellslinger]] thả [[Flame Wall]] trong lúc bạn attack; bạn không bấm nó. [[Mark On Hit Support]] áp mark của bạn. [[Immortal Call]] tự nổ khi bạn ăn damage.

    Với boss map: đặt ba totem [[Kinetic Bolt]] "before the boss becomes active", cast [[Tornado]], rồi giữ Kinetic Blast. Đặt lại totem và tornado khi trận đánh kéo dài.

    Thế giằng co: build nhanh nhất khi bạn chạy vào pack và an toàn nhất khi bạn tránh xa chúng. Phasing cho bạn làm cái thứ nhất. Không gì cho bạn sống sót khi làm chuyện đó một cách cẩu thả.
  bossing: |
    **Trước** một trận pinnacle, đổi hai viên gem trong body armour: [[Kinetic Blast]] ra, [[Kinetic Bolt]] vào; [[Returning Projectiles Support]] ra, [[Barrage Support]] vào. Mang theo mấy viên dự phòng. Lời cảnh báo của guide cũng chạy theo chiều ngược lại: "Do not use Barrage when clearing Maps."

    Rotation có cùng dáng với đánh boss map. Ba totem đặt xuống trước khi boss hoạt động. [[Tornado]]. Rồi giữ Kinetic Bolt vào boss, và bắn xuyên qua cái tornado khi được, vì damage của nó đến từ 20 projectile đầu tiên trúng nó.

    Giữ flask chạy. Có modifier nạp lại khi crit thì [[Diamond Flask]] và [[Silver Flask]] trụ suốt một trận dài, và guide trông vào chuyện đó.

    Thứ đổi nhiều nhất là bạn không giết được boss trước khi nó ra tay. Trong map, câu trả lời cho nguy hiểm là nó đã chết rồi. Ở đây bạn có bể máu bốn nghìn, 100% suppression, evasion và đôi chân. Ngừng bắn để né; totem và tornado giữ cho một phần damage tiếp tục trong lúc bạn di chuyển.
deaths:
  - situation: Một cái map reflect
    cause: >-
      Guide liệt cả "Monsters reflect Elemental Damage" lẫn "Monsters reflect
      Physical Damage" là modifier cần tránh. Bạn bắn nhiều projectile, mỗi cái
      tạo vài cú nổ, và mỗi cú trúng đích gửi damage ngược về một nhân vật có
      bể máu nhỏ.
    fix: >-
      Reroll map. Trong setup được công bố không có gì trả lời được reflect.
  - situation: Một cú hit physical từ thứ bạn không thấy
    cause: >-
      Evasion là một cơ hội, không phải một khoản giảm. Nhân vật 3.30 độc lập
      evade 68% attack và chịu được 7,300 physical damage từ cú lọt qua.
    fix: >-
      [[Immortal Call]] trên [[Cast when Damage Taken Support]] và
      [[Ghost Dance]] là câu trả lời của guide cho burst, và cả hai chỉ chạy
      sau cú hit đầu tiên. Cách vá thật là cái guide đặt đầu tiên trong danh
      sách nhược điểm: đừng để bị đánh trúng. Giết từ mép màn hình.
  - situation: Spell damage trong hai trận pinnacle cuối
    cause: >-
      Spell suppression dưới 100% để vài spell lọt qua nguyên damage. Vì lý do
      đó guide coi mức cap là "primary passive tree goal" cho Maven và Uber
      Elder.
    fix: >-
      Cap nó trước khi thử. Lấy cái mastery làm cơ hội suppress của bạn thành
      lucky sớm hơn, cho hai con boss đầu.
  - situation: Chaos damage và degeneration
    cause: >-
      Guide coi chaos resistance là tùy chọn ("if you value it"), với lập luận
      rằng một build wand giết quái từ ngoài màn hình mà không bị đánh trúng.
      Nhân vật độc lập nằm ở −25% chaos resistance với maximum hit chaos là
      3,000.
    fix: >-
      **Lời khuyên của chúng tôi, không phải của guide:** nếu bạn chết vì chaos
      damage hơn một lần thì hãy coi trọng nó. Một cái base fractured chaos
      resistance là đường chính guide có nhắc.
  - situation: Một cái map mà quái không bị leech được
    cause: >-
      Nó nằm trong danh sách cần tránh của guide. Nhân vật độc lập hồi 922 life
      mỗi giây từ leech và 92 từ regeneration; lấy cái đầu đi thì gần như không
      còn gì.
    fix: >-
      Reroll.
troubleshooting:
  - symptom: Damage của tôi trên boss thấp hơn hẳn trong map
    cause: >-
      Damage của Kinetic Blast là mấy cú nổ chồng lên nhau khắp một pack. Trên
      một mục tiêu thì hệ số nhân đó mất, và gem còn chịu thêm 40% less area
      damage.
    fix: >-
      Dùng bộ đồ nghề: ba totem [[Kinetic Bolt]], [[Tornado]], và cả hai flask.
      Với pinnacle boss, đổi main skill sang Kinetic Bolt với
      [[Barrage Support]] — Kinetic Bolt có 220% damage effectiveness và 200%
      Arcane Might so với 155% và 150% của Kinetic Blast.
  - symptom: Tôi hết mana
    cause: >-
      Một attack nhanh với cost multiplier 140% từ [[Sacred Wisps Support]],
      trên một nhân vật reserve hai aura.
    fix: >-
      Ba lựa chọn của guide: notable [[Thrill of Battle]]; một Life Mastery
      biến một phần mana cost thành life cost; flat mana trên gear.
  - symptom: Mọi thứ vẫn ổn cho tới map đỏ
    cause: >-
      Thường là bạn vẫn còn non-crit. Tác giả: non-crit "runs out of efficient
      scaling options at T16s". Hoặc bạn chuyển sang crit trên wand với shield
      tệ và mất damage vì chuyện đó.
    fix: >-
      Kiếm wand và shield trước, rồi mới respec. Roll modifier nạp-lại-khi-crit
      lên [[Diamond Flask]] và [[Silver Flask]] trong cùng ngày.
  - symptom: Tôi đổi sang Kinetic Blast và thấy nó tệ hơn concoction
    cause: >-
      Hoặc bạn đổi trước khi có [[Endless Munitions]], nên quá ít projectile
      tạo ra quá ít cú nổ, hoặc cây wand của bạn là wand leveling. Concoction
      không dùng vũ khí; còn skill này thì không là gì ngoài vũ khí của nó.
    fix: >-
      Xong Labyrinth thứ ba trước đã. Rồi đừng đánh giá build cho tới khi bạn
      có một cây wand có flat elemental damage thật sự.
  - symptom: Tôi đánh trượt nhiều
    cause: >-
      Accuracy. Guide chạy một viên [[Precision]] level 1 chính là "to cap your
      hit chance", và lấy accuracy trên cây cho tới khi gear lo được. Nhân vật
      độc lập ở 92.9%.
    fix: >-
      Giữ Precision bật, và đừng bỏ mấy node accuracy trên cây cho tới khi gear
      thay được chúng.

patch:
  - entry: mercenary-nerfs
    note: >-
      **Không có cú nerf Kinetic Blast mới nào trong 3.30 — hãy kiểm lại nếu
      bạn đọc thấy điều khác.** Dòng trong patch note, "Adjusted Kinetic Blast
      on Hired Mercenaries to have 150% Arcane Might", nằm dưới Mercenary
      Changes và đưa mercenary về ngang với người chơi. Gem của người chơi đã
      nhận thay đổi đó cách đây một league: 3.29 đưa nó từ 200% Arcane Might
      xuống 150% và từ 35% less area damage thành 40%. PoEDB không hiện mục
      3.30 nào cho nó.
  - note: >-
      **Deadeye không bị đổi.** Không cái nào trong [[Gathering Winds]],
      [[Ricochet]], [[Endless Munitions]] hay [[Focal Point]] xuất hiện trong
      patch note 3.30, và Deadeye cũng không nằm trong số các class ở phần
      riêng của Ruthless. [[Kinetic Bolt]], [[Tornado]], [[Spellslinger]] và
      [[Sacred Wisps Support]] cũng không xuất hiện.
  - entry: crafting-service-tweaks
    note: >-
      **Chuyện này trúng kế hoạch gear của guide ở hai chỗ.** Gamble ở level
      cao tốn hơn và cho đồ tệ hơn, mà guide thì gamble ra cây wand Tier 11 và
      cái body armour five-link của nó. Recombinator cho ít modifier hơn khi
      đầu vào có ít, mà cây wand hoàn chỉnh được làm bằng cách recombine hai
      cây wand mỗi cây hai prefix. Guide được cập nhật ngày 12/11 và không
      nhắc tới chuyện nào trong hai.
  - entry: essence-changes
    note: >-
      **Tốt cho cây wand.** Ở map đỏ mọi Essence giờ là tier Screaming trở
      lên, và craft wand thì cần Shrieking Essence of Wrath, Anger và Hatred.
  - entry: no-random-league-mechanics
    note: >-
      **"Run Abyss" giờ nghĩa là "chạy một Abyss Thread".** Guide đẩy bạn sang
      Abyss để lấy một cây [[Stygian Vise]] và một viên jewel Searching Eye.
      Abyss không còn xuất hiện trong map nếu không có Thread.
  - entry: item-tiers
    note: >-
      **Lẫn lộn.** Một cây Stygian Vise cần Item Tier 5 mới rơi. Mặt khác, đồ
      rare có tier từ Act 6 làm gear life với resistance của campaign dễ nhận
      ra hơn, mà campaign chỉ đòi có vậy.
  - entry: meta-crafting-costs
    note: >-
      **Cái shield hoàn chỉnh tốn một khoản khác.** Công thức của nó dùng
      "Prefixes Cannot Be Changed", giờ là 4 Divine cộng một loại currency thứ
      hai. Chưa có tổng mới nào được công bố.
  - entry: league-fates
    note: >-
      **Một lời dè chừng, và nó là của chúng tôi.** Cơ chế của league này cố
      tình làm boss khu vực khó hơn. Một build sống sót bằng cách giết trước
      là sai dáng cho một con boss mà chính bạn chọn làm mạnh lên. Hãy gọi ít
      Fate hơn so với trên một nhân vật trâu hơn, cho tới khi bạn biết damage
      của mình.

strengths:
  - "Clear speed xuất sắc ngay từ map đầu tiên, trên một five-link."
  - "Không có unique bắt buộc nào, ở bất cứ stage nào cho tới bốn Voidstone."
  - "Một guide có planner thật sự được lưu cho 3.30, với gem cho từng khoảng level."
  - "Cơ động: Tailwind, Shield Charge và phasing."
  - "Trần rất cao cho ai tìm được một cây Headhunter."
weaknesses:
  - "Bạn chưa chơi build này cho tới sau Labyrinth thứ ba."
  - "Khoảng bốn nghìn tổng life cộng energy shield. Một cú hit trúng đích là có thể kết thúc."
  - "Single-target damage cần totem, một cái tornado và, với pinnacle boss, một cú đổi gem."
  - "Cây wand chính là build, mà 3.30 làm hai cách kiếm wand của guide tệ đi."
  - "Ba mod map đơn giản là nằm ngoài cuộc chơi."
  - "Không có giá và không có con số đo được nào ở bất cứ đâu trong guide."
avoidIf: >-
  Chọn build khác nếu bạn muốn đứng giữa trận đánh, hoặc nếu chết vì một cú hit
  bạn không thấy làm bạn bỏ chơi. Bỏ qua nếu bạn muốn một skill từ level 1:
  build này là một nhân vật khác suốt cả campaign. Và bỏ qua nếu bạn cần một
  con giết boss: guide cần một cú đổi gem và hai skill phụ trợ thì mới đánh
  được pinnacle boss, và nhân vật 3.30 độc lập duy nhất có 27,689 effective hit
  point. Nếu thứ bạn muốn là clear map thật nhanh trên đồ rare, đây là cách
  được ghi chép kỹ nhất để làm chuyện đó league này.

