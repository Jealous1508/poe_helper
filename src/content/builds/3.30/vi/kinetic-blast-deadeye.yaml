    moveOn: "cây đã là crit, wand và shield là đồ thật, và bạn clear map vàng mà không phải nghĩ."
    details:
      - title: Khi nào chuyển sang crit
        body: |
          Guide đưa ba lựa chọn và chọn một:

          1. Ép chuyển ở level 60 tới 70 hoặc muộn hơn, bất kể wand và cây của bạn trông ra sao.
          2. Chờ tới khi bạn tìm được một cây wand flat elemental và một cái shield spell damage thuộc loại "a very well rolled". **Đây là khuyến nghị của tác giả**, và tác giả nói lý tưởng là chuyện đó xảy ra sớm trong tiến trình map.
          3. Chờ có five-link rồi cắm [[Increased Critical Strikes Support]].

          Lý do tác giả không chờ lâu hơn: "Non-Crit runs out of efficient scaling options at T16s and is surpassed by Crit at that point." Tác giả muốn bạn chuyển xong hẳn trước phần Tier 16.

          Trong lúc bạn còn non-crit, viên [[Precision]] level thấp giúp giữ [[Precise Technique]] hoạt động.
      - title: Aura
        body: |
          [[Wrath]] cho flat lightning và, ở stage này, [[Haste]]. [[Precision]] ở level 1 cap cơ hội đánh trúng của bạn và thêm chút crit chance.

          Guide liệt kê các phương án thay thế mà không xếp hạng: [[Haste]] thay cho Grace hoặc Wrath để cơ động, và [[Anger]] thay cho Grace hoặc Wrath để thêm flat damage.
      - title: Mana
        body: |
          Guide liệt kê ba cách chữa tùy chọn và không chọn giữa chúng: notable [[Thrill of Battle]]; một Life Mastery khiến skill tốn life thay cho 15% mana cost của chúng; và flat mana trên gear.
      - title: Mod map cần tránh
        body: |
          Danh sách đầy đủ của guide:

          - Monsters cannot be Leeched from
          - Monsters reflect Elemental Damage
          - Monsters reflect Physical Damage
          - Players have −9% to −12% to all maximum Resistances
  - id: red-maps
    phase: endgame
    image: tornado
    title: Map đỏ và hai Voidstone đầu
    levels: Map Tier 11–16, Eater of Worlds và Searing Exarch
    uses: >-
      Vẫn mấy viên gem của cú đổi, trên đồ tốt hơn: một cây wand bạn gamble
      hoặc craft ra, một cái shield spell damage, và hai flask được roll để nạp
