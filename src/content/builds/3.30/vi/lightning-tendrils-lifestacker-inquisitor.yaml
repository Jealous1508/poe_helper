name: Lightning Tendrils of Escalation Lifestacking Inquisitor
tagline: >-
  Maximum life chính là chỉ số damage. Một cái shield biến bể máu của bạn thành
  spell damage và spell crit, nên mọi nâng cấp phòng thủ cũng là nâng cấp damage.
