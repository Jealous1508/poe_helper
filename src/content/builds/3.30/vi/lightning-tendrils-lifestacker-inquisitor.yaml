budget: extreme
budgetNote: >-
  **Khởi đầu rẻ, hoàn thiện thì cực đắt, và mọi giá dưới đây đều là giá thời
  3.29.** poe.ninja chưa có dữ liệu kinh tế Covens of Umbra — API trả về 404 —
  nên đây là giá cuối league Allflame, lúc 1 Divine khoảng 497 chaos. Hãy chuẩn
  bị tinh thần giá tuần đầu Covens lệch rất xa, nhất là [[Mageblood]]. Mấy món
  lõi thì rẻ thật: [[Rathpith Globe]] khoảng 0.19 Divine, [[Kaom's Heart]] khoảng
  0.3, [[Glorious Vanity]] khoảng 0.04. Cả bộ unique tới hết midgame cộng lại
  tầm 31 Divine. Rồi riêng một cây [[Mageblood]] 4 flask đã là 203 Divine, còn
  bản 5 flask là 2,691. **Phép tính đó là của chúng tôi trên bảng giá của tác
  giả, không phải con số của anh ta.**
