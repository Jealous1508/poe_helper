confidenceNote: >-
  **Bốn điểm số là cách đọc của chúng tôi. Không tác giả hay site nào công bố
  điểm số cho build này** — trang guide chỉ hiện mấy mục mạnh yếu định tính của
  tác giả cộng một bộ đếm like. Clear là 3 vì chính tác giả nói thẳng nó chậm ở
  budget thấp. Ease là 2, thấp nhất trên site này, vì mục nhược điểm của anh ta
  nói rằng nếu không theo guide cho đúng thì build cảm giác rất yếu, và anh ta
  nói thật. Có một điểm đáng khen: trong bốn build ở đây, đây là build duy nhất
  mà cấu hình Path of Building được biết đầy đủ, vì khối config được đọc trực
  tiếp. Nó cũng chỉ có một tác giả, và cái shield của nó được mô phỏng trong Path
  of Building tốt hơn món thật — xem phần ghi chú dưới chuỗi cơ chế.
modes:
  ssf: >-
    Phần lõi thân thiện với solo self-found một cách bất ngờ so với tầm giá này:
    [[Rathpith Globe]], [[Kaom's Heart]], [[Glorious Vanity]] và
    [[Maligaro's Virtuosity]] đều là drop phổ biến. Còn cái trần thì không — cặp
    [[Forbidden Flame]] và [[Forbidden Flesh]], một Mageblood 4 flask và một
    [[The Dark Seer]] double-corrupt là đồ trade.
  hardcore: >-
    Không nguồn nào bàn tới. Hình dáng của nó khá lạ: life khổng lồ, regeneration
    khổng lồ, mà cố tình ở mức máu thấp vĩnh viễn. Phần cuối đó nghĩa là
    [[Petrified Blood]], [[Righteous Fire]] và một cái shield hy sinh máu mỗi lần
    cast đều đang rút máu bạn theo thiết kế, tức là khá nhiều bộ phận động để đem
    một mạng duy nhất ra tin.

idea: |
  [[Rathpith Globe]] là một cái shield cho bạn increased spell damage và increased spell critical strike chance theo mỗi 100 maximum life bạn có. Nên bạn thôi coi life là chỉ số phòng thủ. Từng điểm life trên gear của bạn cũng là damage.

  Rồi bạn stack life ở mọi chỗ: [[Kaom's Heart]] cho 1,210 life phẳng, [[The Dark Seer]] cho life và energy shield theo level, mấy viên [[Grand Spectrum]] cho life theo phần trăm, [[The Red Dream]] bản Foulborn để biến passive resistance thành life. Nhân vật được công bố đạt 16,663 life.

  Phía trên đó là mấy multiplier spell quen thuộc, nhưng xếp theo cách lạ: bạn giữ mình ở mức máu thấp vĩnh viễn bằng [[Petrified Blood]], thứ mở [[Pain Attunement]] cho 30% more spell damage và khiến mấy cú đánh lớn tới chậm đủ để regeneration của bạn chạy nhanh hơn chúng. [[Righteous Fire]] đốt bạn để lấy thêm 40% more. Nghe như liều mạng. Nhưng trên giấy thì nó là build sống dai nhất trong bốn cái.

