chainDetails:
  - title: Cái shield trong Path of Building tốt hơn món thật
    body: |
      Đây là lưu ý quan trọng nhất của build và đáng đọc hai lần.

      Cây [[Rathpith Globe]] đang đeo trong file công bố đọc ra **4%** increased spell damage và **4%** increased spell crit mỗi 100 maximum life, hy sinh 9% life. **Món thật là 3% / 3% / hy sinh 10%.** Nó bị nerf từ 5% trong 3.29.0, và PoEDB với dữ liệu biến thể hiện hành của chính Path of Building đều đồng ý về giá trị live. **4% không phải một roll có thể lấy được.**

      Nhìn thì giống lỗi cơ sở dữ liệu unique của Path of Building ở một vị trí slider, chứ không phải lừa người đọc — chính tác giả viết "kể cả sau mấy đợt nerf Rathpith Globe", nên anh ta biết về cái nerf. Nhưng điều đó nghĩa là **damage thật trong game sẽ thấp hơn con 88 triệu được công bố một cách đáng kể**: mất khoảng một phần tư multiplier spell damage của Rathpith, cộng ít crit hơn.

      Danh sách mua của chính tác giả cũng đòi một cây Rathpith 4% / 4%. Đừng đi tìm nó.

      Còn một khẳng định sai nữa đang lan truyền: rằng Rathpith cho 5% mỗi 100 life, hoặc 10% cho bản Foulborn. Cả hai nửa đều sai. Nó đã là 3% từ 3.29, và bản Foulborn *thay thế* mod spell damage với spell crit bằng bản damage over time hoặc ailment, khiến nó thành dở hẳn ở đây. Bản Foulborn giao dịch khoảng 274 Divine, còn bản bạn muốn thì khoảng 0.19.
  - title: Các con số, và chính xác chúng giả định gì
    body: |
      Trong bốn build trên site này, đây là build duy nhất có cấu hình Path of Building được đọc ra từ file thay vì phải đoán. Nên các lưu ý ở đây là chính xác chứ không mơ hồ.

      **File mới hơn:** [[Lightning Tendrils of Escalation]] ở 20/20, báo **88.1 triệu hit damage mỗi giây**, 5.97 cast mỗi giây, 100% critical strike chance, 570% critical multiplier. Life 16,663, energy shield 4,228, **244,286 effective hit point**. Resistance 89/87/87 elemental và 75 chaos, 5,167 armour, 56% physical damage reduction, 35% block và 39% spell block. Cú hit lớn nhất chịu được 41,100 physical và 234,000–267,000 elemental. Regeneration 6,342 life và 5,515 energy shield mỗi giây, cộng 1,141 life leech mỗi giây.

      **Những gì đang bật:** endurance, frenzy và power charge đều đầy. **Shock ở mức 40% effect**, một giả định khá mạnh. Flask đang chạy, vì Mageblood giữ bốn utility flask magic bật vĩnh viễn. Adrenaline, Arcane Surge, Fortification, infusion của Infused Channelling, Intensify 3, sáu stack channelling, quái bị blind, chill và unnerve, cả bạn lẫn quái đứng trên consecrated ground, Low Life, vừa bị hit và vừa bị hit bằng spell. Assassin's Mark có cắm nên Path of Building áp nó luôn. Pantheon Lunaris và Tukohama, bandit giết cả ba, level 100.

      **Những gì không bật: không có boss nào.** Mục tiêu là một con quái **level 84** chung chung ở mức resistance mặc định của Path of Building, 50% elemental và 30% chaos. Không penalty curse effectiveness của boss, không damage reduction của boss. Wither *không* được bật — 15 stack trong file là giá trị mặc định đang xám.

      Và dữ liệu cây ghi là 3.29, nên không thay đổi cây hay balance nào của 3.30 được phản ánh. Path of Building chưa cập nhật cho patch này.
  - title: Vì sao Leadership's Price là cái bẫy nếu bạn đọc lướt
    body: |
      Ở budget đầu và giữa, tác giả cân Strength với Intelligence **bằng nhau tuyệt đối** trên [[Leadership's Price]], để mọi damage của bạn sap, brittle và scorch cùng lúc. Brittle cho tới +6% critical strike chance phẳng và sap cho 20% less damage taken, hai cái đó cộng [[Maligaro's Virtuosity]] đưa bạn tới khoảng 300% critical multiplier gần như không mất gì.

      Hậu quả là một luật rất dễ bỏ sót: **sau campaign, tránh Strength và Intelligence trên gear.** Đeo một trong hai lên bất kỳ món nào là cái amulet hết chạy. Cân sai là bạn mất cap crit và 20% giảm damage cùng một lúc.

      Đây chính là nội dung thật của nhược điểm mà tác giả tự ghi — "nếu không theo guide cho đúng, build có thể cảm giác rất yếu". **Cách đọc đó là của chúng tôi**, nhưng nó suy ra trực tiếp từ cách các mảnh ghép tương tác. Anh ta cũng nói rõ là đừng chạy [[Annihilation's Approach]] cùng với Maligaro's.
  - title: Kaom's Heart không có socket. Đây là cách chữa.
    body: |
      [[Kaom's Heart]] là khối life lớn nhất trong build và nó có đúng không socket. Gem level của bạn phải đến từ chỗ khác.

      Giai đoạn đầu thì đó là [[Crest of Desire]] với +8 level cho socketed gem. Tới endgame nó thành một cây Archdemon Crown double-influence Shaper với Elder, có +2 skill gem, +2 area of effect gem, [[Concentrated Effect Support]] ở mức 25, Hypothermia ở mức 25, và socketed gem gây 30% more elemental damage. Tác giả gọi cây của chính anh ta là helm mức mirror và không có giá nào tồn tại cho nó.
  - title: Mấy món chase build này không dùng
    body: |
      Đọc thẳng từ danh sách item: không [[Headhunter]], không [[Progenesis]] — không tương thích, vì Mageblood cần utility flask *magic* — không [[Astramentis]], không Voices, không Militant Faith, không Sublime Vision, không Annihilating Light, không Dissolution of the Flesh, không Ashes of the Stars, không [[Malachai's Loop]], không [[Shavronne's Wrappings]]. Danh sách gem cũng không có awakened gem nào.

      Cặp Forbidden duy nhất trong build là [[Arcane Blessing]], notable của Hierophant. Không phải More Than Skill và không phải cái gì khác.
  - title: Đồ Foulborn vẫn lấy được trong 3.30
    body: |
      Đáng nói vì hai trong số các món sang là bản Foulborn, mà người ta hay tưởng cơ chế này đã chết.

      Unique Foulborn đến từ nội dung Breach: birth một Ancient Wombgift ở Genesis Tree với tỷ lệ gốc khoảng 20%, điều chỉnh được bằng passive Genesis; Grasping Coffer trong Hive Fortress và Colony; chắc chắn rơi từ It That Was Esh trong Hive Colony; và safehouse vận chuyển của It That Fled. Trên trade, lọc bằng "Is Foulborn".

mandatory:
  - term: Rathpith Globe
    why: >-
      Toàn bộ phép chuyển đổi damage. 3% increased spell damage và 3% increased
      spell crit mỗi 100 maximum life. Không có nó thì life chỉ là life và build
      không còn lý do tồn tại.
    detail: >-
      Bản thường, **không phải** Foulborn — bản Foulborn thay mod spell damage và
      spell crit bằng bản damage over time hoặc ailment, vô dụng ở đây, mà nó còn
      tốn khoảng 274 Divine so với 0.19 của bản bạn muốn. Nó cũng hy sinh 10% life
      mỗi lần cast, và đó là một phần cách bạn giữ máu thấp.
  - term: Kaom's Heart
    why: >-
      +1,210 life phẳng, khối lớn nhất trong build. Khoảng 0.3 Divine ở giá 3.29.
    detail: >-
      Nó **không có socket**. Đó không phải nhược điểm bạn xử lý sau — nó là ràng
      buộc thiết kế buộc bạn dùng [[Crest of Desire]] giai đoạn đầu và một helmet
      double-influence ở endgame.
  - term: Glorious Vanity
    why: >-
      Seed cho Doryani, để allocate [[Corrupted Soul]]. Nó chia damage nhận vào
      giữa life và energy shield, và đó là thứ biến một bể life khổng lồ thành
      phòng thủ thật chứ không chỉ là một con số.
    detail: >-
      Một bản gốc khoảng 0.04 Divine. Bản có notable tốt trong bán kính thì đắt
      hơn nhiều và **không tìm được giá** cho một roll tốt.
  - term: Corrupted Soul
    why: >-
      Chia damage nhận vào giữa hai bể life và energy shield. Cùng với
      [[Pious Path]] hồi cả hai cùng lúc, nó là lõi của phòng thủ.
  - term: Petrified Blood
    why: >-
      Giữ bạn ở mức máu thấp vĩnh viễn, thứ bật [[Pain Attunement]] và dàn mấy cú
      đánh lớn thành damage over time mà regeneration của bạn chạy nhanh hơn.
  - term: Pain Attunement
    why: >-
      30% more spell damage khi ở low life. Build vốn cố tình low life, nên cái
      này miễn phí.
  - term: Righteous Fire
    why: >-
      40% more spell damage, trả bằng việc đốt máu của chính bạn. Với hơn 6,000
      life hồi mỗi giây thì bạn không cảm thấy cái giá đó.
  - term: Forbidden Flame
    why: >-
      Một nửa của cặp allocate [[Arcane Blessing]], notable Hierophant. Khoảng
      5.08 Divine mỗi viên ở giá 3.29, nên tầm 10.2 cho cả cặp.
  - term: Forbidden Flesh
    why: >-
      Nửa còn lại. Cả hai phải ghi cùng một notable, không thì cặp đó vô dụng. Đây
      là cặp Forbidden duy nhất trong build.
  - term: Crest of Desire
    why: >-
      +8 level cho socketed gem, cách duy nhất để có gem level giai đoạn đầu khi
      chest của bạn không có socket. Khoảng 5.18 Divine.
  - term: Leadership's Price
    why: >-
      Dùng ở budget đầu và giữa. Cân Strength với Intelligence bằng nhau tuyệt
      đối, để mọi thứ bạn hit đều sap, brittle và scorch cùng lúc.
    detail: >-
      Luật đi kèm nó: **sau campaign, tránh Strength hoặc Intelligence trên
      gear**, để cái amulet cân được bằng tattoo. Đeo một trong hai chỉ số đó lên
      một món đồ là, theo lời tác giả, cái amulet thành vô dụng. Giá của nó
      **không tìm được** trên poe.ninja.
  - term: Maligaro's Virtuosity
    why: >-
      Một phần của chiêu 300% critical multiplier gần như miễn phí, cùng với
      [[Leadership's Price]]. Nên có implicit corrupt cho spell crit. Khoảng 0.01
      Divine.
  - term: Enlighten Support
    why: >-
      Level 4. Build chạy [[Zealotry]], [[Vitality]], [[Anger]], [[Precision]] và
      [[Tempest Shield]] dưới [[Blood Magic]], mà không có nó thì không nhét vừa.
      Khoảng 12.18 Divine.
  - term: Blood Magic
    why: >-
      Tiêu máu thay vì mana. Trong lộ trình công bố thì spec quanh Act 6, và đó là
      lý do dàn aura cần Enlighten.
  - term: The Dark Seer
    level: recommended
    why: >-
      Corrupt với +2 maximum life **và** +2 maximum energy shield mỗi level —
      +200 mỗi loại ở level 100. Bản gốc khoảng 1.02 Divine; bản double-corrupt
      thì **không có giá công bố**.
    detail: >-
      Lý tưởng là có thêm implicit +1 to lightning skills. Đây là món life lớn
      nhất sau Kaom's Heart và cũng là món khó tìm nhất trong nhóm gần-như-bắt-buộc.
  - term: Mageblood
    level: recommended
    why: >-
      Với roll 4 flask. Khoảng 203 Divine ở giá 3.29, và là lần mua duy nhất đưa
      build này từ "xong" sang "hoàn chỉnh".
    detail: >-
      **Đừng trả giá chênh cho bản Foulborn.** Mod của nó là flask bên phải thay
      vì bên trái, cùng một chuyện diễn đạt khác đi. Bản Foulborn 4 flask là
      221.6 Divine so với 203.1 của bản thường, để đổi lấy con số không. Roll
      đáng quan tâm là 4 flask. Một cây Mageblood 5 flask là 2,691 Divine và là
      món mua ở mức mirror.
  - term: Watcher's Eye
    level: recommended
    why: >-
      Bản được công bố là một cây triple: +50% crit multiplier dưới [[Anger]],
      +26% dưới [[Precision]], và 15% increased life recovery rate dưới
      [[Vitality]].
    detail: >-
      Danh sách mua của tác giả chỉ đòi mod life recovery của Vitality trước, nên
      hãy bắt đầu từ đó. Một cây Watcher's Eye gốc là 0.07 Divine; **đúng tổ hợp
      này thì không có giá công bố.**
  - term: Grand Spectrum
    level: recommended
    why: >-
      5% increased maximum life mỗi viên Grand Spectrum, nên một bộ ba đáng giá
      hơn hẳn một viên. 0.1–0.45 Divine mỗi viên.
  - term: The Red Dream
    level: recommended
    why: >-
      Bản Foulborn, khiến passive resistance trong bán kính của nó cũng cho
      increased maximum life ở mức 50% giá trị. Bản một mod khoảng 19.29 Divine,
      bản hai mod khoảng 117.3.
  - term: The Light of Meaning
    level: recommended
    why: >-
      Miễn corrupted blood, thứ mà một build sống vĩnh viễn ở máu thấp không thể
      thiếu lâu được. Khoảng 0.24 Divine.
  - term: Lori's Lantern
    level: recommended
    why: >-
      Bản Foulborn, cho chaos resistance và lucky damage khi ở low life. Khoảng
      0.14 Divine, rẻ đến mức đáng ngạc nhiên so với những gì nó làm trên một
      nhân vật low life vĩnh viễn.
  - term: Oriath's End
    level: recommended
    why: >-
      Dành cho clear, trục yếu của build này. Khoảng 0.2 Divine và mua ở giai
      đoạn endgame.
  - term: Replica Dragonfangs' Flight
    level: recommended
    why: >-
      Dùng với [[Lightning Tendrils of Escalation]], và **chỉ** khi bạn đã ở hoặc
      gần cap crit. Không tìm được giá.
  - term: Annihilation's Approach
    level: recommended
    why: >-
      Adrenaline vĩnh viễn, khoảng 0.2 Divine. Tác giả nói nó chỉ đáng khi bạn ở
      tầm 300% crit multiplier, và nói rõ là đừng chạy nó cùng
      [[Maligaro's Virtuosity]].

stages:
  - id: core-items
    image: rathpith-globe
    title: Bước vào
    levels: Phase 1, mấy món lõi
    uses: >-
      [[Singularity]] với implicit +1 lightning skills, [[Crest of Desire]],
      [[Kaom's Heart]], [[Rathpith Globe]], ring và belt rare có life với
      resistance, boots rare có life regeneration rate theo phần trăm và movement
      speed, cùng [[Maligaro's Virtuosity]] có implicit corrupt spell crit.
    changes: >-
      Rồi tới [[Glorious Vanity]] seed cho Doryani, [[Leadership's Price]] với +3
      maximum fire resistance, và một [[Watcher's Eye]] hạng khởi đầu. Cả phase
      này chỉ tốn vài Divine ở giá 3.29 và đây là lúc build bắt đầu chạy.
    links:
      - name: Main skill
        gems: [Lightning Tendrils of Escalation, Infused Channelling Support, Intensify Support, Arcane Surge Support, Concentrated Effect Support]
      - name: Lõi phòng thủ
        gems: [Petrified Blood, Righteous Fire, Tempest Shield]
      - name: Aura
        gems: [Zealotry, Eternal Blessing Support, Vitality, Anger, Precision]
      - name: Curse
        gems: [Assassin's Mark]
    moveOn: "Rathpith với Kaom's Heart đã lên người, bạn đang low life vĩnh viễn một cách cố ý, và phần cân chỉ số cho Leadership's Price là chính xác."
    details:
      - title: Một luật duy nhất có thể phá cả build
        body: |
          **Sau campaign, đừng lấy Strength hay Intelligence trên gear.** [[Leadership's Price]] phải được cân bằng tattoo, và bất kỳ chỉ số nào từ một món đồ cũng làm lệch cán cân.

          Khi cán cân lệch, bạn thôi áp sap và brittle. Bạn mất tới 6% crit chance phẳng và 20% less damage taken cùng một lúc. Đây là con đường dễ nhất để lời cảnh báo của chính tác giả thành sự thật: một nhân vật cảm giác rất yếu vì guide không được làm theo.
      - title: Vì sao ở đây nó chậm
        body: |
          Tác giả nói thẳng: chậm ở budget thấp. Clear đến từ việc channel một spell vào mặt quái, còn mấy món làm chuyện đó dễ thở hơn — [[Oriath's End]], flask bật liên tục nhờ [[Mageblood]] — thì còn cách hai phase.

          Anh ta cũng nói việc đứng hứng đòn của uber "chỉ tới ở budget cao hơn". Hãy chuẩn bị tinh thần phase này là một nhân vật chạy map rất khó chết mà không nhanh.
      - title: Lên level, ngắn gọn
        body: |
          Lên level bằng spell nào bạn thích — tác giả dùng Freezing Pulse — và spec [[Blood Magic]] quanh Act 6. Lấy [[Vitality]], [[Petrified Blood]], [[Tempest Shield]] và [[Precision]], rồi [[Zealotry]] với [[Eternal Blessing Support]] khi đã có Blood Magic.

          Danh sách unique twink của anh ta: Thousand Ribbons, Seven League Steps, Replica Karua Ward, Lochtonial Caress, Goldrim, Springleaf, Ashcaller, [[Lori's Lantern]] và hai cây Ixchel Temptation.
  - id: midgame
    image: the-dark-seer
    title: Budget trung bình
    levels: Phase 2, trước Mageblood
    uses: >-
      [[Viscera]] từ uber boss, rồi [[Lori's Lantern]] bản Foulborn,
      [[Lightning Tendrils of Escalation]] ở gem level 20, [[The Dark Seer]] với
      +2 life và +2 energy shield mỗi level, và cặp [[Forbidden Flame]] với
      [[Forbidden Flesh]] cho [[Arcane Blessing]].
    changes: >-
      Rồi một [[Watcher's Eye]] tốt hơn, [[The Light of Meaning]], một
      [[Glorious Vanity]] tốt hơn, [[The Red Dream]] bản Foulborn, một Archdemon
      Crown rare, [[Replica Dragonfangs' Flight]] khi bạn đã cap crit,
      [[Enlighten Support]] level 4, một cây Rathpith tốt hơn, và một Kaom's Heart
      +1200 life.
    links:
      - name: Main skill
        gems: [Lightning Tendrils of Escalation, Infused Channelling Support, Intensify Support, Arcane Surge Support, Concentrated Effect Support]
      - name: Lõi phòng thủ
        gems: [Petrified Blood, Righteous Fire, Tempest Shield]
      - name: Aura
        gems: [Zealotry, Eternal Blessing Support, Vitality, Anger, Precision, Enlighten Support]
      - name: Quy trình đánh boss
        gems: [Pact of Lycia, Assassin's Mark]
    moveOn: "cặp Forbidden đã vào, The Dark Seer đã double-corrupt, và bạn đang ở hoặc gần 100% crit chance."
    details:
      - title: Thứ tự mua đầy đủ nhất trong bốn build
        body: |
          Tác giả này công bố một danh sách mua có thứ tự rõ ràng ngay trong phần ghi chú Path of Building, điều mà ba người kia không làm. Thứ tự ở trên là của anh ta, dựng lại dưới dạng trình tự thay vì đoạn văn.

          Một lưu ý: **mọi link trade của anh ta đều trỏ về league 3.29**, và anh ta ghi trên trang guide rằng chúng chưa chạy được và sẽ cập nhật khi league mở.
      - title: Cặp Forbidden là Arcane Blessing
        body: |
          Không phải More Than Skill, không phải cái gì khác. [[Arcane Blessing]] là một notable của [[Hierophant]] và đây là cặp Forbidden duy nhất trong build. Khoảng 5.08 Divine mỗi viên ở giá 3.29.

          **Và đây là cái bẫy:** patch note 3.30 chính thức *có* đổi Arcane Blessing — giờ nó cho Arcane Surge và 8% more spell damage — **nhưng mục đó nằm ở phần riêng của Ruthless và không áp dụng cho game thường.** Nguồn nào gắn cái buff đó cho trade league là nguồn sai. Notable trong game thường không đổi, nên cặp này hoạt động đúng như ở 3.29.
      - title: Replica Dragonfangs' Flight, và khi nào đừng mua
        body: |
          Nó nâng level của một skill gem cụ thể, ở đây là [[Lightning Tendrils of Escalation]]. Tác giả nói rõ nó chỉ đáng mua **khi bạn đã ở hoặc gần cap crit**, vì trước đó phần crit bạn còn thiếu đáng giá hơn mấy level gem.

          Không tìm được giá cho nó, ở bất kỳ league nào.
  - id: endgame
    image: mageblood
    title: Budget cao
    levels: Phase 3, khoảng 235–250 Divine
    uses: >-
      Một [[Mageblood]] 4 flask, [[Oriath's End]], một ring Manifold với +290
      life và +35 crit multiplier, gloves rare có life regeneration rate, +100
      life và chaos resistance, cùng một Focused Amulet với +400 life và +120
      crit multiplier.
    changes: >-
      Rồi bộ ba [[Grand Spectrum]] và cái helmet mức mirror. Tác giả gọi đây là
      mức mà build đã xong. **Con số 235–250 Divine là phép tính của chúng tôi
      trên bảng giá 3.29 của anh ta, không phải con số của anh ta.**
    links:
      - name: Main skill
        gems: [Lightning Tendrils of Escalation, Infused Channelling Support, Intensify Support, Arcane Surge Support, Concentrated Effect Support]
      - name: Lõi phòng thủ
        gems: [Petrified Blood, Righteous Fire, Tempest Shield]
      - name: Aura
        gems: [Zealotry, Eternal Blessing Support, Vitality, Anger, Precision, Enlighten Support]
      - name: Quy trình đánh boss
        gems: [Pact of Lycia, Assassin's Mark]
    moveOn: "Mageblood đã vào với roll 4 flask và bạn đang đi săn từng điểm phần trăm chứ không còn săn từng món đồ."
    details:
      - title: Mageblood ở đây để làm gì
        body: |
          Bốn utility flask magic bật vĩnh viễn. Đó cũng là một trong những giả định được nhúng vào con số damage công bố, nên con số và cái belt không độc lập với nhau.

          [[Progenesis]] **không** tương thích — Mageblood cần flask magic, mà Progenesis là unique. Nếu bạn quen chạy cả hai, ở đây thì không được.
      - title: Quy trình đánh boss
        body: |
          Bấm [[Pact of Lycia]] rồi đứng yên channel. Thật sự chỉ có vậy. Mục mạnh của chính tác giả gọi lối chơi này là "cực kỳ lười".

          Tùy chọn: một Animated Guardian và mấy con spectre. Anh ta nói chúng "không thật sự cần thiết và chết suốt", gần như là lời khuyên đừng dùng, ở mức một guide có thể nói.
      - title: Nó vật lộn với cái gì, nói thật
        body: |
          Mod map kiểu reflect và no-regeneration hay no-leech là rủi ro rõ ràng với một build low life dựa vào regeneration. **Không nguồn nào nói điều này, nên đừng coi nó là có nguồn** — chúng tôi gắn cờ nó như câu hỏi cần hỏi, không phải một kết luận. Tác giả có link mấy bộ search trade map 8 mod và Nightmare map đã lọc sẵn, điều này ngụ ý map juice nặng thì ổn.
  - id: mirror-tier
    image: the-red-dream
    title: Mức mirror
    levels: Phần lớn không có giá
    uses: >-
      Một [[Mageblood]] 5 flask, [[The Red Dream]] Foulborn bản hai mod, một
      [[Archdemon Crown]] Shaper với Elder, một [[Watcher's Eye]] ba mod, một
      [[The Dark Seer]] double-corrupt và [[Replica Dragonfangs' Flight]].
    changes: >-
      Mageblood 5 flask là 2,691 Divine và Red Dream hai mod là 117.3, cả hai ở
      giá 3.29. **Bốn món còn lại không có giá công bố nào cả.** Đây là build duy
      nhất trong bốn cái trên site này có một mức mirror được ghi lại.
    links:
      - name: Main skill
        gems: [Lightning Tendrils of Escalation, Infused Channelling Support, Intensify Support, Arcane Surge Support, Concentrated Effect Support]
      - name: Aura
        gems: [Zealotry, Eternal Blessing Support, Vitality, Anger, Precision, Enlighten Support]
    moveOn: "không còn stage nào nữa."
    details:
      - title: Cái helmet
        body: |
          Một [[Archdemon Crown]] double-influence Shaper với Elder, có +2 skill gem, +2 area of effect gem, [[Concentrated Effect Support]] ở mức 25, Hypothermia ở mức 25, và socketed gem gây 30% more elemental damage.

          Tác giả gọi cây của chính anh ta là helm mức mirror và không đưa giá. Nó tồn tại vì [[Kaom's Heart]] không có socket, nên từng điểm gem level trong build đều phải đến từ cái helmet.
      - title: Một mốc so sánh từ 3.29, độ tin cậy thấp
        body: |
          Search snippet cho bản cuối 3.29 của tác giả báo 98.79 triệu damage mỗi giây, 237,350 effective hit point, 11,640 life và 4,870 energy shield.

          Site chứa nó nằm sau một lớp chặn bot nên không kiểm chứng được, và cấu hình của nó cũng không đọc được. Chúng tôi đưa vào chỉ vì nó là mốc dữ liệu duy nhất gợi ý rằng bản 3.30 không mạnh hơn hẳn bản 3.29 mà nó thay thế.

powerCurve: |
  Phần lớn build mua damage và phòng thủ từ những món khác nhau. Build này mua **maximum life** và được trả bằng cả hai, vì [[Rathpith Globe]] cho 3% increased spell damage và 3% increased spell crit theo mỗi 100 life. Phía trên là hai multiplier cố định không tốn gì một khi bạn đã sống ở low life — [[Pain Attunement]] cho 30% more và [[Righteous Fire]] cho 40% more — cùng một gói crit mà [[Leadership's Price]] với [[Maligaro's Virtuosity]] cấp cho gần như miễn phí.

  Cái lạ nằm ở thời điểm: **tất cả những thứ đó đã có đủ từ Phase 1**, với vài Divine ở giá 3.29. Không có món muộn nào bật công tắc cho build. Thứ lớn lên về sau là tổng life và phần crit: [[The Dark Seer]] và cặp [[Arcane Blessing]] ở giữa, với 100% crit chance là vạch đích của phase đó, rồi [[Mageblood]], bộ ba [[Grand Spectrum]] và cái helmet về cuối. Một ghi chú của chúng tôi về phép tính: bonus của cái shield là *increased*, không phải *more*, nên mỗi 100 life thêm vào là cộng vào một đống lớn chứ không nhân nó lên, và cùng một nâng cấp life thì về cuối đẩy damage ít hơn hồi đầu. Không ai nói điều đó; nó suy ra từ chính câu chữ trên cái shield.

  Phòng thủ đi theo cùng đường cong đó và xuất phát cao. Bể life, [[Corrupted Soul]] chia cú đánh giữa life và energy shield, [[Pious Path]] hồi cả hai, và [[Petrified Blood]] dàn mấy cú đánh lớn thành damage over time đều có mặt từ Phase 1. Đó là lý do nhân vật rất khó chết từ lâu trước khi nó nhanh: tác giả nói thẳng là nó chậm ở budget thấp và việc đứng hứng đòn uber chỉ tới ở budget cao hơn. Clear là cái trục duy nhất phải chờ, vì hai thứ được nêu tên để chữa nó, [[Oriath's End]] và flask bật vĩnh viễn, đều nằm ở Phase 3.

  Hãy đặt mấy con số công bố vào đúng chỗ của chúng. 88.1 triệu damage và 244,286 effective hit point mô tả nhân vật level 100 đã hoàn chỉnh, đeo một cái shield 4% không tồn tại, đánh một mục tiêu level 84 không phải boss. Chúng đánh dấu đỉnh của đường cong, có phần nói quá, chứ không phải chỗ bạn đang đứng.

upgrades:
  - step: >-
      [[Rathpith Globe]], [[Kaom's Heart]] và [[Crest of Desire]]
    why: >-
      Cái shield là phép chuyển đổi, cái chest là khối life lớn nhất để nó
      chuyển, còn cái helmet cấp gem level mà một cái chest không socket không
      thể cho. Không có món đầu tiên thì mọi thứ bên dưới không làm được gì, và
      cả ba đều rẻ.
    cost: >-
      Khoảng 0.19, 0.3 và 5.18 Divine ở giá 3.29.
  - step: >-
      [[Maligaro's Virtuosity]], [[Glorious Vanity]] seed cho Doryani, và
      [[Leadership's Price]]
    why: >-
      Crit và phần phòng thủ thật, vẫn nằm trong Phase 1. Đôi gloves và cái
      amulet đã cân là gói crit gần như miễn phí; viên jewel allocate
      [[Corrupted Soul]], thứ biến bể life thành phòng thủ. Chúng đứng thứ hai
      vì chúng làm việc trên một tổng life bạn phải có sẵn — lập luận đó là của
      chúng tôi, còn thứ tự là của tác giả.
    cost: >-
      Đôi gloves khoảng 0.01 Divine và một viên jewel gốc khoảng 0.04, ở giá
      3.29. Không tìm được giá cho cái amulet.
  - step: >-
      [[Lori's Lantern]] bản Foulborn, một viên gem level 20 và một
      [[The Dark Seer]] double-corrupt
    why: >-
      Mở đầu Phase 2. The Dark Seer là món life lớn nhất sau Kaom's Heart, +200
      life và +200 energy shield ở level 100, mà life ở đây chính là damage.
      Danh sách của chính tác giả mở phase này bằng một [[Viscera]] từ uber
      boss; chưa ai công bố từng cái Viscera làm gì, nên chúng tôi không xếp
      hạng nó.
    cost: >-
      Lori's Lantern khoảng 0.14 Divine và một cây Dark Seer gốc khoảng 1.02, ở
      giá 3.29. Bản double-corrupt thì không có giá công bố.
  - step: >-
      [[Forbidden Flame]] và [[Forbidden Flesh]], cả hai ghi
      [[Arcane Blessing]]
    why: >-
      Thứ tự của tác giả đặt cặp này ở đây và chúng tôi giữ nguyên. Bài viết
      không ghi lại notable đó cho gì trong game thường, nên chúng tôi không
      đưa lý do nào của riêng mình. Nó là cặp Forbidden duy nhất trong build
      và là khoản mua có giá lớn nhất tính tới lúc này, ít ra đó cũng là một
      lý do để đừng mua nó đầu tiên.
    cost: >-
      Khoảng 5.08 Divine mỗi viên, tầm 10.2 cho cả cặp, ở giá 3.29.
  - step: >-
      [[The Light of Meaning]], một [[Watcher's Eye]] tốt hơn và
      [[The Red Dream]] bản Foulborn
    why: >-
      Jewel: miễn corrupted blood, một cây Watcher's Eye có nhiều hơn cái mod
      Vitality bạn khởi đầu, và passive resistance cho luôn cả life. Mỗi món là
      một bước nhỏ hơn các món ở trên. Red Dream là món đắt nhất trong ba, và
      đó là cách chúng tôi đọc lý do nó không nằm sớm hơn.
    cost: >-
      The Light of Meaning khoảng 0.24 Divine và một Red Dream Foulborn bản một
      mod khoảng 19.29, ở giá 3.29. Một tổ hợp Watcher's Eye cụ thể thì không
      có giá công bố.
  - step: >-
      [[Enlighten Support]] level 4, rồi [[Replica Dragonfangs' Flight]]
    why: >-
      Enlighten là thứ cho cả dàn aura nhét vừa dưới [[Blood Magic]]; vậy mà
      thứ tự của tác giả vẫn để nó muộn thế này, sau mấy món life, và chúng tôi
      theo anh ta. Replica Dragonfangs' Flight chỉ tới khi bạn đã ở hoặc gần
      cap crit, vì trước đó, theo lời anh ta, phần crit bạn còn thiếu đáng giá
      hơn mấy level gem.
    cost: >-
      Enlighten khoảng 12.18 Divine ở giá 3.29. Không tìm được giá cho Replica
      Dragonfangs' Flight ở bất kỳ league nào.
  - step: >-
      Một [[Mageblood]] 4 flask, cùng [[Oriath's End]]
    why: >-
      Bốn utility flask magic bật vĩnh viễn, thứ mà con số damage công bố vốn
      đã giả định, cộng cái flask mà bài viết nêu tên cho clear. Nó nằm muộn
      thế này vì một lý do: theo phép tính của chúng tôi trên bảng giá của tác
      giả, riêng cái belt đã đắt hơn sáu lần cả bộ unique đứng trước nó. Đừng
      trả thêm cho cái belt Foulborn.
    cost: >-
      Khoảng 203 Divine cho cái belt và 0.2 cho Oriath's End, ở giá 3.29. Hãy
      chuẩn bị tinh thần giá tuần đầu lệch rất xa.
  - step: >-
      Đồ rare có life và crit multiplier, bộ ba [[Grand Spectrum]], rồi cái
      helmet
    why: >-
      Phần còn lại của Phase 3: một ring Manifold, gloves rare và một Focused
      Amulet mang life với crit multiplier, rồi ba viên Grand Spectrum ở mức 5%
      increased maximum life mỗi viên Grand Spectrum, rồi một
      [[Archdemon Crown]] double-influence. Tác giả gọi đây là mức mà build đã
      xong. Anh ta đặt mấy viên Grand Spectrum rẻ tiền sau cái belt mà không
      nói vì sao; chúng tôi giữ thứ tự của anh ta thay vì đoán. Qua khỏi đây là
      mức mirror, phần lớn không có giá.
    cost: >-
      Grand Spectrum 0.1–0.45 Divine mỗi viên ở giá 3.29. Cái helmet thì không
      có giá.

play:
  mapping: |
    Channel [[Lightning Tendrils of Escalation]] vào pack cho tới khi nó chết, đi bộ sang pack kế, lặp lại. [[Righteous Fire]], [[Petrified Blood]] và dàn aura thì bật một lần rồi để đó. Các link trong bài không liệt skill di chuyển nào và cũng không có skill guard nào, và chúng tôi sẽ không bịa ra một cái cho nó.

    Nó chậm, và tác giả nói vậy. Spell này muốn bạn đứng yên, và cách chúng tôi đọc cấu hình Path of Building là mấy stack Intensify với stack channelling của nó chỉ có sau một lúc channel không bị ngắt, nên một lần dừng ngắn ở một pack nhỏ thì không bao giờ chạm tới mức damage công bố. [[Oriath's End]] và flask bật vĩnh viễn của [[Mageblood]] là hai thứ bài viết nêu tên để clear dễ thở hơn, và cả hai đều là Phase 3.
  bossing: |
    Bấm [[Pact of Lycia]], đứng yên và giữ channel. Bài viết nói thẳng đó là toàn bộ quy trình, và tác giả gọi lối chơi này là "cực kỳ lười". Assassin's Mark nằm cùng link đó; bài viết nói nó được cắm vào chứ không nói nó được áp lên boss bằng cách nào.

    Đứng yên chính là mục đích, không phải đi tắt. Sáu stack channelling, Intensify ở mức 3 và consecrated ground dưới chân cả bạn lẫn boss đều nằm sẵn trong con số công bố, và — cách đọc của chúng tôi — cái nào trong số đó cũng mất hoặc mỏng đi khi bạn đổi chỗ. Nên chỉ di chuyển vì những cú đánh sẽ giết bạn, không vì gì khác, rồi lại cắm chân xuống.

    Cú nào là cú đó thì tùy budget của bạn. Tác giả nói việc đứng hứng đòn uber "chỉ tới ở budget cao hơn". Trước khi có [[Mageblood]], hãy coi mấy đòn lớn của uber là thứ phải bước ra khỏi. Một con Animated Guardian và mấy con spectre là tùy chọn; anh ta nói chúng "không thật sự cần thiết và chết suốt".

deaths:
  - situation: >-
      Ngay sau một lần đổi gear, khi vẫn đang đeo [[Leadership's Price]]
    cause: >-
      Món mới có Strength hoặc Intelligence, cán cân của cái amulet không còn
      chính xác, và bạn thôi áp sap. Sap là 20% less damage taken, và nó mất
      cùng lúc với phần crit của brittle.
    fix: >-
      Gỡ món đó ra, hoặc cân lại bằng tattoo cho tới khi Strength và
      Intelligence lại bằng nhau tuyệt đối. Sau campaign, soi hai chỉ số đó
      trên từng món đồ trước khi mua.
  - situation: >-
      Corrupted blood chồng lên người trong lúc bạn channel
    cause: >-
      Bài viết nói thẳng: một build sống vĩnh viễn ở máu thấp không thể thiếu
      miễn corrupted blood được lâu. Nó không nói rõ cơ chế, và chúng tôi sẽ
      không gắn con số nào cho chuyện đó.
    fix: >-
      [[The Light of Meaning]] có miễn corrupted blood, khoảng 0.24 Divine ở
      giá 3.29. Danh sách của tác giả đặt nó ở Phase 2; nếu bạn đang chết kiểu
      này, lời khuyên của chúng tôi là mua nó sớm hơn.
  - situation: >-
      Một cái map no regeneration, no leech, hoặc có reflect
    cause: >-
      **Không có nguồn.** Không guide nào nói build này chết ở đây. Chúng tôi
      gắn cờ vì toàn bộ phòng thủ là regeneration chạy nhanh hơn damage, trong
      khi [[Righteous Fire]], [[Petrified Blood]] và phần hy sinh life của cái
      shield đều đang rút máu bạn theo thiết kế.
    fix: >-
      Đọc mod trước khi mở map, và thử cẩn thận một cái thay vì tin chúng tôi
      hay tin mấy con số công bố. Tác giả có link mấy bộ search map 8 mod và
      Nightmare map đã lọc sẵn, điều này ngụ ý map juice nặng thì ngoài ra vẫn
      ổn.
  - situation: >-
      Đứng trong mấy đòn lớn của uber boss với một nhân vật Phase 1 hoặc Phase 2
    cause: >-
      244,286 effective hit point và 6,342 life hồi mỗi giây là của cái file
      level 100 đã hoàn chỉnh, với flask của [[Mageblood]] đang chạy. Tác giả
      nói việc đứng hứng đòn uber chỉ tới ở budget cao hơn.
    fix: >-
      Trước Phase 3, cứ bước ra khỏi những cú đánh bạn thấy trước được và chấp
      nhận mất stack channelling. Nhân vật này rất khó chết trong map từ lâu
      trước khi nó đứng được trong mọi thứ.

troubleshooting:
  - symptom: >-
      Damage của tôi không tới gần nổi con 88 triệu được công bố
    cause: >-
      File công bố đeo một cây [[Rathpith Globe]] 4%; món thật là 3%, mà bài
      viết tính là mất khoảng một phần tư cái multiplier đó, cộng ít crit hơn.
      Con số đó còn giả định 40% shock, đủ mọi charge, flask bật vĩnh viễn,
      level 100 và một mục tiêu level 84 chung chung không chọn boss, trên dữ
      liệu cây 3.29.
    fix: >-
      Trong game thì không có gì để sửa. Trong Path of Building, chỉnh cái
      shield về giá trị thật và chọn một con boss trước khi so mình với con số
      đó.
  - symptom: >-
      Crit chance tụt và nhân vật bỗng dưng cảm giác yếu
    cause: >-
      Nguyên nhân dễ gặp nhất, theo cách đọc của bài viết, là
      [[Leadership's Price]]. Strength và Intelligence không còn bằng nhau
      tuyệt đối, thường là vì một món mới mang theo một trong hai, nên phần
      crit phẳng của brittle và phần giảm damage của sap dừng cùng lúc.
    fix: >-
      Tìm món có Strength hoặc Intelligence rồi thay nó, sau đó cân hai chỉ số
      lại bằng tattoo.
  - symptom: >-
      Tôi không tìm được cây Rathpith trong danh sách mua, hoặc cây tôi mua
      không cho spell damage nào
    cause: >-
      Danh sách của tác giả đòi một roll 4% / 4%, thứ không thể lấy được. Còn
      bản Foulborn thì thay mod spell damage với spell crit bằng bản damage
      over time hoặc ailment.
    fix: >-
      Mua cái shield thường 3% / 3%, khoảng 0.19 Divine ở giá 3.29. Bản
      Foulborn khoảng 274 Divine và ở đây thì dở hơn.
  - symptom: >-
      Mấy viên jewel Forbidden không làm gì, hoặc làm ít hơn tôi đọc được
    cause: >-
      [[Forbidden Flame]] và [[Forbidden Flesh]] phải cùng ghi
      [[Arcane Blessing]]. Và thay đổi 3.30 cho notable đó Arcane Surge với 8%
      more spell damage thì nằm ở phần riêng của Ruthless trong patch note.
    fix: >-
      Kiểm xem cả hai viên có ghi cùng một notable không. Trong game thường thì
      cặp này hoạt động đúng như ở 3.29; đừng tính cái buff đó vào budget.
  - symptom: >-
      [[Replica Dragonfangs' Flight]] gần như không nhích damage của tôi
    cause: >-
      Nó được mua trước khi cap crit. Tác giả nói nó chỉ đáng mua khi bạn đã ở
      hoặc gần 100% crit chance, vì trước đó phần crit bạn còn thiếu đáng giá
      hơn mấy level gem.
    fix: >-
      Lo xong crit trước. Trong build này crit chance đến từ life, qua cái
      shield, và từ brittle, qua phần cân của cái amulet — bản tóm tắt đó là
      của chúng tôi, rút từ bài viết, không phải checklist của tác giả.
  - symptom: >-
      Clear chậm
    cause: >-
      Đúng là chậm, ở budget thấp, và tác giả nói vậy. Clear là một spell
      channel chĩa vào từng pack một.
    fix: >-
      [[Oriath's End]] và flask bật vĩnh viễn của [[Mageblood]] là hai cách
      chữa mà bài viết nêu tên, và thứ tự của tác giả đặt cả hai ở Phase 3. Tới
      lúc đó thì đây là một nhân vật chạy map khó chết, không phải một con
      nhanh.

patch:
  - note: >-
      **[[Inquisitor]] không có thay đổi nào.** Nó không xuất hiện ở mục Ascendancy
      Changes của game thường, cũng không ở phần Ruthless.
  - entry: ruthless-changes
    note: >-
      **Đây là chỗ cần kiểm cho build này, và kết quả là sạch.** Cặp Forbidden
      allocate [[Arcane Blessing]], một notable của [[Hierophant]]. Patch note
      chính thức *có* đổi Arcane Blessing thành cho Arcane Surge và 8% more spell
      damage — **nhưng mục đó nằm ở phần riêng của Ruthless và không áp dụng cho
      game thường.** Chúng tôi xác nhận bằng cách đọc trực tiếp thread chính
      thức. Nguồn nào gắn cái buff đó cho trade league là nguồn sai, và cặp này
      hoạt động đúng như ở 3.29.
  - entry: winter-orb-nerf
    note: >-
      **Né được, và né có chủ đích.** Tác giả chuyển build này từ [[Winter Orb]]
      sang [[Lightning Tendrils of Escalation]] cho 3.30, chính changelog của anh
      ta ghi lại. Winter Orb mất một projectile ở level thấp, được thêm damage
      effectiveness và base damage trong patch này. Mấy bản Winter Orb 3.29 của
      build này trên kênh của anh ta là dòng đã bị thay thế — đừng import chúng.
  - note: >-
      **Không tìm thấy thay đổi 3.30 nào** với [[Rathpith Globe]],
      [[Kaom's Heart]], [[Mageblood]], Lightning Tendrils, [[Grand Spectrum]],
      [[Glorious Vanity]], [[Petrified Blood]], [[Righteous Fire]],
      [[Watcher's Eye]], [[The Dark Seer]], [[Annihilation's Approach]] hay
      [[Oriath's End]], trong cả patch note chính thức lẫn bản tóm tắt độc lập.
      Cả hai lần fetch đều bị cắt ở gần 100,000 ký tự, nên hãy đọc đó là "không
      tìm thấy đề cập trong hai nguồn" chứ không phải đã chứng minh là không đổi.
  - entry: royal-visage-soul-cores
    note: >-
      **Tác giả khẳng định damage tăng 50–60% trong 3.30. Hãy coi đó là ước lượng
      của anh ta, chưa kiểm chứng, và một phần là suy đoán của chính anh ta.** Một
      phần đến từ corruption Soul Core thêm một support thẳng vào skill gem. Cơ
      chế đó là thật, nhưng cái support rơi ra là ngẫu nhiên từ một nhóm tương
      thích. Việc anh ta giả định nó sẽ là Arcane Surge cho 35% more spell damage
      là trường hợp tốt nhất, không phải điều chắc chắn.
  - entry: wickerman-viscera
    note: >-
      **Nửa còn lại của cái buff được khẳng định đó, và nó chưa được xác nhận.**
      Anh ta trông vào một [[Viscera]] từ uber cho frenzy charge miễn phí và một
      [[Viscera]] khiến quái trên consecrated ground ăn thêm damage. Hệ thống
      [[Wickerman]] được xác nhận là thật, nhưng không nguồn nào công bố từng
      buff Viscera cụ thể, và chính tác giả viết "sẽ cập nhật khi biết thêm" ngay
      cạnh dòng đó. Anh ta cũng ghi là chưa xem hết mấy unique mới.

strengths:
  - "Trâu một cách khó tin ở mọi giai đoạn. 244,286 effective hit point trên Path of Building 3.29, với hơn 6,000 life và 5,500 energy shield hồi mỗi giây."
  - "Mọi nâng cấp life cũng là nâng cấp damage, nên danh sách mua của bạn không bao giờ bị chẻ làm hai."
  - "Mấy món lõi cực rẻ: Rathpith khoảng 0.19 Divine, Kaom's Heart khoảng 0.3, Glorious Vanity khoảng 0.04."
  - "Lối chơi \"cực kỳ lười\" theo đúng lời tác giả: channel rồi đứng yên."
  - "Làm được nội dung mà build khác vật lộn, cụ thể là Ultimatum và delve sâu."
  - "Build duy nhất trong bốn cái có thứ tự mua được công bố, các mức budget và một cấu hình Path of Building đọc được đầy đủ."
  - "Nó né được đợt nerf Winter Orb của 3.30 vì tác giả đã chuyển nó khỏi Winter Orb trước khi launch."
weaknesses:
  - "Chậm ở budget thấp, chính tác giả thừa nhận. Clear là trục yếu suốt cả hành trình."
  - "Đứng hứng đòn uber chỉ tới ở budget cao hơn."
  - "Một cái bẫy cho ai đọc lướt. Cân sai chỉ số cho [[Leadership's Price]] là bạn mất cap crit và 20% giảm damage cùng lúc."
  - "Bất kỳ Strength hay Intelligence nào trên gear đều làm cái amulet thành vô dụng sau campaign."
  - "Một tác giả, một nguồn. Chưa ai dựng lại build này một cách độc lập."
  - "Cái shield trong file công bố là roll 4% không tồn tại trong game, nên damage thật thấp hơn 88 triệu một cách đáng kể."
  - "Con số 88.1 triệu giả định 40% shock và một mục tiêu level 84 chung chung, không chọn boss, trên engine 3.29."
  - "Cái buff damage 3.30 được khẳng định thì dựa vào mấy hiệu ứng Viscera mà chưa ai ghi lại."
avoidIf: >-
  Chọn build khác nếu bạn muốn một con chạy map nhanh từ ngày đầu, nếu bạn muốn
  hạ uber boss với budget nhỏ, hoặc nếu bạn ghét channel và đứng yên để đánh
  single target — quy trình đánh boss đúng nghĩa là bấm [[Pact of Lycia]] rồi giữ
  nút. Quan trọng nhất, bỏ qua nếu bạn sẽ không đọc một guide cơ chế dài. Build
  này xếp [[Blood Magic]], [[Petrified Blood]], low life vĩnh viễn,
  [[Righteous Fire]], một cái shield hy sinh máu mỗi lần cast và
  [[Corrupted Soul]] lên nhau, và một phép cân chỉ số chính xác giữ cả phần crit
  với phần giảm damage lại với nhau. Theo nửa vời thì ra một nhân vật yếu, và đó
  là nhược điểm duy nhất mà chính tác giả của nó viết ra giấy.

