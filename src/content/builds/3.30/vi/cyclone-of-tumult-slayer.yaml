name: Cyclone of Tumult Slayer
tagline: >-
  Melee xoay một nút, block gần chín trên mười cú đánh, mà còn block kiểu lucky.
  Build có nguồn tốt nhất trên site này, và khó chết nhất.
class: Duelist
ascendancy: Slayer
role: endgame
budget: high
budgetNote: >-
  **Không nguồn 3.30 nào định giá build này ở bất kỳ mức nào, và chúng tôi thà
  nói thẳng hơn là bịa cho đủ.** Không có con số 50 Divine, không có 300 Divine,
  không có mức mirror ở bất cứ đâu. Chỉ có đúng hai cái giá ghi ngày 3.30:
  [[Lethal Pride]] 1–3 Divine, và [[The Light of Meaning]] "tầm vài Divine". Cấu
  trúc của mức đắt thì biết rõ — [[Mageblood]], cặp [[Forbidden Flesh]] và
  [[Forbidden Flame]], [[Watcher's Eye]], [[Stranglegasp]] — nhưng chưa ai gắn
  được con số lên đó. Bỏ qua con "hơn 100 Divine" đang lan truyền cho archetype
  này: nó gắn với một Static Strike Slayer, từ một guide tự nhận là của 3.22.
mainSkill: Cyclone of Tumult
image: cyclone-of-tumult
hero: art-slayer
tags: [Melee, Physical, Block, Một nút, Tank]
ratings: { clear: 4, bossing: 4, survivability: 5, ease: 4 }
verified: "2026-11-13"
confidence: mixed
confidenceNote: >-
  Cơ chế của nó được chứng thực tốt nhất trong bốn build: bốn tác giả độc lập ở
  ba site đồng ý về bộ khung, và hai người trong số đó công bố bản bossing riêng.
  **Nhưng bốn điểm số trên vẫn là cách đọc của chúng tôi, không phải của nguồn
  nào** — không tác giả nào công bố điểm clear, bossing, survivability và ease.
  Thứ gần nhất là năm trục của một tác giả (Ease of Transitioning 3, New Player
  Friendliness 4, Playstyle 5, Ease of Gearing 3, Easily Executable 4), vốn không
  phải mấy trục này. Clear là 4 chứ không phải 5 vì mọi nguồn đều nói nó chạy map
  tốt nhưng chậm cho tới khi có Mageblood. Bossing là 4 vì nó giết boss bằng độ
  trâu và sức bền, không bằng burst. Mọi con số trích dưới đây đều được tính trên
  Path of Building 3.29.
modes:
  ssf: >-
    Một tác giả gọi nó là chơi được solo self-found, và bộ khung thì hợp: cây
    staff là tự craft chứ không phải mua, còn thứ mở khóa block giai đoạn đầu là
    [[Rumi's Concoction]]. Nửa đắt tiền — cặp Forbidden, [[Mageblood]],
    [[Stranglegasp]] — thì thực tế chỉ có trade mới ra.
  hardcore: >-
    Cùng tác giả đó gọi nó là chơi được hardcore, và trong bốn build ở đây thì nó
    là cái duy nhất có cơ sở. 87.75% lucky block, leech vĩnh viễn, miễn ailment
    và miễn stun là đúng dạng hình. Chưa nguồn nào thử nó trong 3.30.

idea: |
  Bạn giữ một nút và xoay. [[Cyclone of Tumult]] là bản transfigured của Cyclone với vùng đánh lớn hơn nhiều và trần damage cao hơn, trả giá bằng penalty movement speed rất nặng khi bạn đang đủ stage.

  Lý do để chơi nó là phòng thủ. Bạn cầm warstaff — chọn vì cái implicit 25% block, không vì damage của nó — rồi stack block từ sáu bảy nguồn khác cho tới khi attack block vượt xa cap. [[Versatile Combatant]] sau đó đổi toàn bộ phần bạn overcap trên 65% thành **gấp đôi** số đó thành spell block. Nên bạn mua attack block và được tặng spell block.

  Mảnh cuối là [[More Than Skill]], một notable của Gladiator mà Slayer cướp được bằng cặp [[Forbidden Flesh]] và [[Forbidden Flame]]. Nó làm block của bạn thành **lucky**, nghĩa là game roll hai lần rồi lấy kết quả tốt hơn. Con số được công bố là 87.75% block cho cả attack lẫn spell.

chain:
  - label: Xoay
    text: "[[Cyclone of Tumult]] channel physical melee damage thuần trong một vòng lớn quanh bạn. Một nút, 360 độ."
  - label: Nhân lên
    text: "Không có đòn bẩy lớn nào duy nhất. [[Pride]], [[Blood and Sand]] cộng [[Flesh and Stone]], [[Herald of Purity]], [[Brutality Support]], [[Melee Physical Damage Support]], [[Pulverise Support]], [[Infused Channelling Support]] và [[Void Shockwave Support]], xếp lên nhau."
  - label: Overcap block
    text: "Implicit warstaff 25%, [[Serpent Stance]] 5%, [[Enigmatic Defence]] 8%, body armour 9%, [[Whirling Barrier]] 8%, [[Steelwood Stance]] 10%, rồi tattoo để chốt nốt."
  - label: Đổi và lucky nó
    text: "[[Versatile Combatant]] biến attack block trên 65% thành gấp đôi số đó thành spell block. [[More Than Skill]] làm cả hai thành lucky. Kết quả: 87.75% mỗi loại."
  - label: Leech xuyên qua
    text: "[[Brutal Fervour]] giữ leech chạy liên tục trong lúc bạn xoay, nên damage lẻ không bao giờ dồn lại. Cộng 30,000 armour, 6 endurance charge và [[Fortification]] vĩnh viễn."

chainDetails:
  - title: Vì sao cây staff là một món phòng thủ
    body: |
      Đây là thứ phải hiểu trước khi craft bất cứ gì. Cây warstaff được chọn vì cái **implicit 25% block**. Damage của nó là chuyện thứ yếu. Base Ezomyte, Maelstrom hay [[Judgement Staff]] tự craft đều dùng được, và cả hai tác giả nói chi tiết về vũ khí đều craft chứ không mua.

      Mọi thứ còn lại trong phòng thủ đều xuất phát từ việc có cái implicit đó. Không có nó thì bạn thiếu 25 điểm phần trăm trong một tổng block chỉ hoạt động được vì nó vượt xa cap.
  - title: 87.75% lucky block được dựng thế nào
    body: |
      [[Versatile Combatant]] là notable Slayer làm việc chuyển đổi: attack block overcap trên 65% trở thành **gấp đôi** số đó thành spell block. Nên kế hoạch là stack attack block cao vô lý rồi để spell block tự tới miễn phí.

      Các nguồn được nêu tên: implicit warstaff 25%, [[Serpent Stance]] 5%, [[Enigmatic Defence]] 8%, 9% trên body armour, [[Whirling Barrier]] 8%, [[Steelwood Stance]] 10%, và Tattoo of the Valako Shieldbearer để chốt.

      Rồi [[More Than Skill]] làm block thành lucky — roll hai lần, giữ kết quả tốt hơn. Một tác giả đặt con số cuối ở **87.75% attack và spell block**; người khác nói "gần 90%". Cả hai đồng ý về cơ chế. Tác giả công bố con số đó cũng nói thẳng rằng cặp Forbidden **không bắt buộc**, chỉ là "cực kỳ dễ thở", và nêu [[Master of Metal]] hoặc [[Worthy Foe]] làm phương án rẻ hơn.
  - title: Zero mana cost là yêu cầu, không phải tối ưu hóa
    body: |
      Channel [[Cyclone of Tumult]] mà còn mana cost thì không chạy được. Cách chữa là một mod **-20 mana cost craft trên chest** cộng -3 trên một ring.

      Đó là lý do build này có cả một hạ tầng giảm mana cost trông rất lạ từ bên ngoài, và đó là yêu cầu của thời nay sinh ra từ mấy thay đổi mana cost gần đây, chứ không phải di sản từ các guide Cyclone cũ. Nếu Cyclone của bạn bị giật cục, đây là thứ đầu tiên cần kiểm. Chỉ một trong bốn tác giả nói rõ chuyện này, nhưng anh ta nói không hề mơ hồ.
  - title: General's Cry, Desecrate, và khi nào bỏ cả hai
    body: |
      Để đánh boss, các setup công bố chạy [[General's Cry]], mà skill này cần xác để tạo mirage warrior. Sàn đấu boss trống thì không có xác nào, nên một con [[Desecrate]] **level 1** nằm trên thanh skill chỉ để tạo xác.

      Ở mức đỉnh nhất, một tác giả **bỏ hẳn [[General's Cry]]** và dồn tất cả vào Cyclone. Cả hai hướng đều do cùng những người đó công bố; khác nhau nằm ở chỗ staff và cây của bạn đã tạo ra bao nhiêu damage sẵn.
  - title: Các con số, và vì sao một trong số đó không phải thứ nó trông như vậy
    body: |
      Bản min-max level 100 báo **177 triệu damage mỗi giây** và **bể máu hiệu dụng 713,000**, với 4,892 life, 30,159 armour, 87.75% block, resistance 76/75/75/75, 352% movement speed, cùng 6 endurance, 4 frenzy và 3 power charge.

      **Đọc con 177 triệu cho cẩn thận.** Trang đó ghi nhãn "Skill DPS *Estimation*" và bể máu là "*Simulated* Effective Health Pool" — đây là mấy con số site tự suy ra từ một Path of Building được import, không phải cấu hình do tác giả nêu. **Trang không nêu mục tiêu boss nào**: không Uber Sirus, không Maven, không Uber Elder, không resistance của boss, không shock, không Wither, và không nói flask có đang bật hay không. Trang còn tự treo banner work-in-progress của chính tác giả. Hãy coi 177 triệu là một số hiển thị chưa cấu hình.

      Bản còn lại của cùng tác giả, ghim ở level 96, mới là bản hữu dụng để lên kế hoạch: 4,809 life, 22,254 armour, **57% block**, 130,000 effective hit point, cú hit lớn nhất chịu được 22,000 physical và 51,000–57,000 elemental. Bảng chỉ số của anh ta không chịu đổi sang bản bossing, và phần damage thì hiện ra theo gem sai, nên **không có con số damage nào cho bản bossing.** Hai trong bốn tác giả không công bố damage hay effective hit point gì cả.

      Tất cả đều là output của Path of Building 3.29. Path of Building chưa được cập nhật cho 3.30.
  - title: Một mâu thuẫn trong tier list mà bạn nên bỏ qua
    body: |
      Có một tier list đang lan truyền xếp "Cyclone of Tumult" hạng S với nhận xét "bossing mượt, dễ", rồi ngay trên cùng trang đó xếp "Cyclone Shockwave" hạng B với "không phải con giết boss tốt".

      Về cơ bản chúng là cùng một build. Một trong bốn guide có tiêu đề đúng là Cyclone Shockwave Slayer và nó là một build Cyclone of Tumult. Sự chia đôi đó là lỗi đặt nhãn, không phải hai build khác nhau với hai kết luận khác nhau.

mandatory:
  - term: Cyclone of Tumult
    why: >-
      Transfigured gem, không phải Cyclone thường. Vùng đánh lớn hơn và trần cao
      hơn, mua bằng một penalty movement speed rất nặng khi đủ stage.
    detail: >-
      Cái penalty di chuyển đó là lời phàn nàn được nhắc nhiều nhất về build. Nó
      được chữa bằng [[The Stampede]] giai đoạn đầu và bằng [[Mageblood]] cộng
      một Quicksilver flask về sau, và đó là lý do "chậm cho tới khi có Mageblood"
      xuất hiện trong danh sách nhược điểm của mọi nguồn.
  - term: Judgement Staff
    why: >-
      Hoặc base Ezomyte hay Maelstrom. Bạn đang mua cái implicit 25% block. Mất
      cây staff là toàn bộ kế hoạch phòng thủ sụp.
    detail: >-
      Cả hai tác giả nói chi tiết về vũ khí đều craft chứ không mua. Các mod
      damage vẫn quan trọng, nhưng cái implicit mới là thứ build được thiết kế
      quanh nó.
  - term: Versatile Combatant
    why: >-
      Đổi attack block overcap trên 65% thành gấp đôi số đó thành spell block. Nó
      là lý do việc stack attack block mới đáng làm.
  - term: Brutal Fervour
    why: >-
      Giữ leech chạy liên tục trong lúc bạn channel. Nó là nguồn hồi phục, và đó
      là lý do mod map No Leech thật sự nguy hiểm với build này chứ không chỉ gây
      khó chịu.
  - term: Rumi's Concoction
    why: >-
      Thứ mở khóa block cho tới khi chest craft và tattoo về. Rẻ mà gánh cả đoạn
      giữa của build.
  - term: Lethal Pride
    why: >-
      Seed cho Kaom và Strength of Blood. Mọi nguồn đều gọi đây là bước nhảy
      damage rẻ nhất mà lớn nhất trong build. Có đúng một cái giá ghi ngày 3.30:
      1–3 Divine.
  - term: Overlord
    why: >-
      Cung cấp [[Fortification]] vĩnh viễn, qua một [[Large Cluster Jewel]].
      Fortification giảm thẳng hit damage và đây là nguồn duy nhất của nó trong
      build.
  - term: Pride
    why: >-
      Khiến quái gần bạn ăn thêm physical damage. Nó là aura mà cả chồng damage
      được dựng lên trên, và mấy mod [[Watcher's Eye]] bạn muốn đều gắn với nó.
  - term: Brutality Support
    why: >-
      More physical damage, đổi lại bạn không gây được chút elemental hay chaos
      damage nào. Build thuần physical, nên mặt trái đó là miễn phí.
  - term: Infused Channelling Support
    why: >-
      More damage khi channel, cộng giảm damage khi infusion đang bật. Một gem
      damage mà đồng thời là một lớp phòng thủ, đúng chủ đề của cả build.
  - term: Void Shockwave Support
    why: >-
      Thêm hit shockwave. Một tác giả gọi nó là bản nâng cấp của
      [[Shockwave Support]] thường, "khi bạn mua nổi".
  - term: Desecrate
    why: >-
      Ở gem level 1, chỉ để tạo xác cho [[General's Cry]] làm mirage warrior
      trong sàn đấu boss trống. Bỏ nó thì damage boss của bạn tụt đúng ở những
      trận bạn cần nhất.
  - term: Unwavering Stance
    why: >-
      Miễn stun. Bạn không channel xuyên qua stun được, và một build một nút
      channel mà bị ngắt là một build đã chết.
  - term: More Than Skill
    level: recommended
    why: >-
      Làm block của bạn thành lucky, đó là bước từ rất trâu lên gần như bất tử.
      Lấy như một notable [[Gladiator]] qua cặp [[Forbidden Flesh]] và
      [[Forbidden Flame]].
    detail: >-
      Tác giả công bố con 87.75% nói nó **không bắt buộc**, chỉ là "thêm 17.75%
      chance to block thì cực kỳ dễ thở". Anh ta cũng cảnh báo mua cặp này sớm,
      vì giá nó leo dần suốt league. Phương án rẻ hơn ở cùng slot:
      [[Master of Metal]] hoặc [[Worthy Foe]], cái nào rẻ hơn lúc bạn tra.
  - term: Mageblood
    level: recommended
    why: >-
      Tự động hóa flask và chữa luôn vấn đề di chuyển, nhờ vậy bạn tháo được boots
      [[The Stampede]]. Cả bốn nguồn đều gọi penalty di chuyển là nhược điểm chính
      của build và gọi món này là câu trả lời.
    detail: >-
      Sau Mageblood bạn đổi sang boots rare có Onslaught, Elusive hoặc Tailwind
      cộng một Quicksilver flask, đạt 200–250% movement speed. Mục nhược điểm của
      một nguồn ghi đúng nguyên văn là "di chuyển chậm cho tới khi mua nổi
      Mageblood".
  - term: Watcher's Eye
    level: recommended
    why: >-
      Muốn mod gắn với [[Pride]] và [[Purity of Elements]]. Hai tác giả độc lập
      nêu cùng một mod: impale bạn gây ra kéo dài thêm 2 hit khi đang dùng Pride.
    detail: >-
      Setup công bố chạy mod impale đó cùng với chance to deal double damage và
      chaos resistance. Increased critical multiplier, increased physical damage
      và increased attack speed được nêu là mod thứ ba tốt tương đương.
  - term: Stranglegasp
    level: recommended
    why: >-
      Bốn anoint trên một amulet: [[Whispers of Doom]], [[Enigmatic Defence]],
      [[Serpent Stance]] và [[Mark the Prey]]. Một tác giả gọi nó tốt hơn gần như
      mọi phương án khác, trừ mức mirror.
  - term: The Stampede
    level: recommended
    why: >-
      Thứ chữa penalty di chuyển trước khi có [[Mageblood]]. Replica Stampede
      hoạt động y hệt. Sau này bạn sẽ tháo chúng ra.
  - term: The Light of Meaning
    level: recommended
    why: >-
      Bản physical. Một trong chỉ hai món của build này có giá ghi ngày 3.30:
      "thường là tầm vài Divine".
  - term: Enlighten Support
    level: recommended
    why: >-
      Level 4, để nhét vừa dàn aura. Trong lộ trình công bố thì mua quanh level
      95, cùng lúc với mấy viên jewel.
  - term: Cogwork Ring
    level: recommended
    why: >-
      Hai cái ở mức min-max. Đổi một prefix lấy thêm một suffix, và đó là cách
      mấy mod curse-on-hit với mana cost nhét vừa hết.

stages:
  - id: transition-in
    image: rumis-concoction
    title: Bước vào
    levels: Từ level 33 trở đi, rẻ
    uses: >-
      Một cây warstaff tự craft giá rẻ và [[Rumi's Concoction]]. Bộ này mở khóa
      động cơ block, thứ duy nhất buộc phải chạy được sớm.
    changes: >-
      Cả hai lộ trình công bố đều lên level bằng skill khác rồi đổi sang Cyclone
      quanh level 32 hoặc 33, rồi chạy lab ở tầm 58, 70 và 81. Build không cần
      món đắt nào để clear atlas.
    links:
      - name: Main skill
        gems: [Cyclone of Tumult, Brutality Support, Melee Physical Damage Support, Pulverise Support, Infused Channelling Support, Shockwave Support]
      - name: Aura
        gems: [Pride, Blood and Sand, Flesh and Stone, Herald of Purity]
      - name: Phòng thủ
        gems: [Molten Shell, Automation, Purity of Elements]
    moveOn: "Cyclone là nút duy nhất của bạn, cây staff đã có implicit block, và Rumi's nằm trên thanh flask."
    details:
      - title: Lộ trình công bố, theo thứ tự
        body: |
          Act 1, rồi Act 2 bằng Static Strike, đổi sang Cyclone ở level 33, lab ở 58, 70 và 81, cụm Fortify ở 90, bản bossing ở 90 rồi làm lại ở 95, [[Enlighten Support]] với jewel ở 95, đổi sang [[Mageblood]] trong khoảng 95 tới 100, rồi bản min-max level 100.

          Lộ trình của tác giả thứ hai gần như y hệt — Spectral Throw, rồi Static Strike, rồi Cyclone ở 32 — với loadout **level 96** của anh ta được nêu là đủ để đi hết atlas, 4 Voidstone và farm currency ở Tier 16 với 16.5.

          Hai tác giả độc lập ra cùng một lộ trình chuyển bản là bằng chứng mạnh nhất rằng archetype này thật sự chuyển lên được, chứ không phải một build khác khoác cùng cái tên.
      - title: Chữa mana cost trước mọi thứ khác
        body: |
          [[Cyclone of Tumult]] buộc phải tốn không mana. Craft -20 mana cost trên chest cộng -3 trên một ring là câu trả lời được công bố.

          Làm việc này trước khi mua một món sang nào. Mọi thứ về cảm giác chơi build đều phụ thuộc vào việc dòng channel không bị ngắt.
      - title: Stage này còn chưa làm được gì
        body: |
          Uber. Một tác giả nói thẳng: chờ tới budget trung bình hãy thử.

          Mod map cần reroll: **No Leech** trên hết, vì [[Brutal Fervour]] là lõi phòng thủ. Rồi Reduced Recovery và less cooldown recovery rate. Cùng tác giả đó nói hãy tránh hẳn map Valdo's.
  - id: mid-budget
    image: lethal-pride
    title: Budget trung bình
    levels: Lethal Pride, Overlord, Void Shockwave
    uses: >-
      [[Lethal Pride]] seed cho Kaom và Strength of Blood, một
      [[Large Cluster Jewel]] với [[Overlord]], [[Void Shockwave Support]] thay
      cho [[Shockwave Support]] thường, và [[The Stampede]] để di chuyển.
    changes: >-
      Đây là chỗ đáng tiền nhất trong build. Lethal Pride là bước nhảy damage rẻ
      nhất mà lớn nhất, ở mức 1–3 Divine ghi ngày 3.30, còn Overlord biến
      [[Fortification]] thành vĩnh viễn.
