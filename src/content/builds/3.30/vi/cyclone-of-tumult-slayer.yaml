    moveOn: "không còn stage nào nữa, và không nguồn nào định giá stage này."
    details:
      - title: Danh sách min-max gồm những gì
        body: |
          Corrupt một [[Stranglegasp]] mong ra rare bốn anoint, rồi một Tainted Mythic Orb hướng tới [[Astramentis]] bốn anoint, Carnage Heart hoặc Hinekora's Sight — chính tác giả gắn cờ đây là "CỰC min-max, chỉ làm nếu bạn có cả núi currency để đốt".

          Rồi một body armour bốn influence với frenzy on hit, -20 mana cost, aura effect và physical taken as cold; hai [[Cogwork Ring]]; một helmet fractured craft bằng essence với cái mod chỉ rơi từ Rogue Exile khiến quái ăn thêm physical damage theo mỗi hai [[Fortification]]; và [[The Light of Meaning]] bản physical.
      - title: Những món build này không dùng
        body: |
          [[Headhunter]] chỉ xuất hiện ở một trong bốn guide, và chỉ như một phương án belt endgame chung chung. [[Atziri's Acuity]], [[Shavronne's Wrappings]] và [[Malachai's Loop]] cũng không được dùng, kể cả sau mấy thay đổi 3.30 của chúng.

          **Awakened gem: không guide nào trong bốn cái nhắc tới cái nào.** Hãy coi đó là lỗ hổng của các guide chứ không phải bằng chứng chúng vô dụng.
      - title: Stage này không dành cho ai
        body: |
          Nguyên văn lời tác giả của nó. Bản đỉnh được dựng quanh một cây staff tự craft, một chest bốn influence, mấy cái Cogwork ring curse-on-hit và mod helmet fractured, và anh ta khuyên bản đổi Mageblood đơn giản hơn cho bất kỳ ai chưa phải một người craft tự tin.

powerCurve: |
  Phần lớn build được dựng nên bởi một đòn bẩy damage. Build này thì không có đòn bẩy lớn nào duy nhất cho damage, mà lại có một cái rất lớn cho phòng thủ. Damage là một chồng hệ số nhân bình thường: [[Pride]], [[Brutality Support]] cùng mấy support còn lại, rồi tới [[Lethal Pride]] và [[Watcher's Eye]]. Phòng thủ là block, dựng qua ba bước: chạm mốc 65%, stack vượt qua nó để [[Versatile Combatant]] đổi phần dư thành spell block, rồi làm nó thành lucky bằng [[More Than Skill]]. Đằng sau block là leech từ [[Brutal Fervour]], armour, endurance charge và [[Fortification]]. Cách chia này là của chúng tôi; từng phần trong đó đều có trong các guide.

  Giai đoạn đầu, bạn có phòng thủ trước, và nó rẻ. Cả hai lộ trình công bố đều đổi sang Cyclone ở level 32 hoặc 33 với một cây warstaff tự craft giá rẻ, mà cái implicit 25% block mới là lý do cầm nó, còn [[Rumi's Concoction]] lấp chỗ cho phần block bạn chưa có. Các lab ở tầm 58, 70 và 81 đem về mấy notable Slayer mà kế hoạch dựa vào. Không món đắt nào là cần để clear atlas. Thứ bạn chưa có ở giai đoạn này là tốc độ: penalty movement speed khi đủ stage có mặt ngay từ vòng xoay đầu tiên, [[The Stampede]] làm nó nhẹ đi, và mọi nguồn vẫn gọi build là chậm cho tới khi có [[Mageblood]].

  Giai đoạn giữa là chỗ đáng tiền nhất của build. [[Lethal Pride]] là bước nhảy damage rẻ mà lớn nhất, [[Overlord]] biến Fortification thành vĩnh viễn, và [[Void Shockwave Support]] thay cho bản thường. Nhưng hãy rõ ràng về phòng thủ ở thời điểm này. Bảng chỉ số level 96 duy nhất được công bố ghi 57% block, 4,809 life và 22,254 armour, và tác giả của nó gọi loadout đó là đủ để đi hết atlas, 4 Voidstone và farm Tier 16. Đó là một nhân vật trâu. Nó chưa phải nhân vật 87.75%. Mấy con số đó là output của Path of Building 3.29.

  Về cuối, hai món làm đổi cảm giác chơi build đều không phải damage. Cặp Forbidden làm block thành lucky: 65% roll hai lần ra 87.75%, đó là phép tính của chúng tôi trên con số được công bố. [[Mageblood]] chấm dứt lời phàn nàn về di chuyển. Sau đó mọi thứ đều là phần lề, và chính tác giả của nó nói vậy. Nên hãy kỳ vọng một nhân vật khó chết từ sớm, chậm trong một thời gian dài, và không bao giờ có burst. Nó giết boss bằng cách sống dai hơn chúng.

upgrades:
  - step: "Một cây warstaff tự craft có implicit 25% block, và [[Rumi's Concoction]]"
    why: >-
      Đứng đầu vì động cơ block là thứ duy nhất buộc phải chạy được sớm, và
      hai món này chính là động cơ block. Bạn đang mua cái implicit của cây
      staff chứ không phải damage của nó: base Ezomyte, Maelstrom hay
      [[Judgement Staff]] đều dùng được. Cả hai tác giả nói chi tiết về vũ khí
      đều craft chứ không mua, nên không có giá nào để đưa ra. Rumi's gánh
      phần block mà chest craft và tattoo sẽ cung cấp về sau.
  - step: "Zero mana cost: craft -20 trên chest và -3 trên một ring"
    why: >-
      [[Cyclone of Tumult]] mà còn chút mana cost nào thì không channel được,
      nên đây là yêu cầu chứ không phải nâng cấp. Nó tốn một lần craft ở bench
      và một mod trên ring. Chỉ một trong bốn tác giả nói ra chuyện này, và
      anh ta nói không hề mơ hồ. Không lộ trình công bố nào liệt kê nó như một
      món cần mua; đặt nó thứ hai là quyết định của chúng tôi, vì không món
      nào mua ở phía dưới giúp được gì khi dòng channel cứ bị ngắt.
  - step: "[[Lethal Pride]], seed cho Kaom và Strength of Blood"
    cost: "1–3 Divine, giá ghi ngày 3.30 từ một tác giả"
    why: >-
      Bước nhảy damage rẻ mà lớn nhất trong build, và mọi nguồn đều nói vậy.
      Phía damage không có đòn bẩy lớn nào duy nhất, nên phần lớn nâng cấp
      damage đều nhỏ. Đây là ngoại lệ, và vì vậy nó đứng trước mọi thứ khác
      tốn currency.
  - step: "[[The Stampede]], hoặc Replica Stampede"
    why: >-
      Penalty di chuyển khi đủ stage là lời phàn nàn mà mọi nguồn đều nêu, và
      đôi boots này là câu trả lời cho tới khi có [[Mageblood]]. Nó không thêm
      damage, cũng không thêm phòng thủ. Nó đứng cao thế này trong thứ tự mà
      hai lộ trình đồng ý với nhau, vì vấn đề nó chữa có mặt ngay từ map đầu
      tiên. Sau Mageblood bạn sẽ tháo nó ra. Không nguồn nào định giá nó.
  - step: "Một [[Large Cluster Jewel]] có [[Overlord]], và [[Void Shockwave Support]]"
    why: >-
      Overlord biến [[Fortification]] thành vĩnh viễn, và nó là nguồn
      Fortification duy nhất trong build. Void Shockwave là bản nâng cấp của
      [[Shockwave Support]] thường, "khi bạn mua nổi", theo lời một tác giả.
      Lộ trình công bố lấy cụm Fortify ở level 90. Cùng với hai bước phía
      trên, bước này làm trọn stage budget trung bình, nơi map Tier 16 thành
      chuyện thường ngày.
  - step: "Cặp [[Forbidden Flesh]] và [[Forbidden Flame]], để lấy [[More Than Skill]]"
    why: >-
      Đây là thứ làm block thành lucky. Nó nằm ở vị trí này vì một lý do không
      liên quan gì tới sức mạnh: tác giả công bố con 87.75% cảnh báo rằng giá
      cặp này leo dần suốt league, và bảo mua sớm. Anh ta cũng nói nó không
      bắt buộc. Nếu giá đã bỏ xa bạn, [[Master of Metal]] hoặc [[Worthy Foe]]
      nằm cùng slot, cái nào rẻ hơn thì lấy. Bạn giữ được block và mất phần
      lucky.
  - step: "[[Watcher's Eye]], [[Stranglegasp]] và [[Enlighten Support]] level 4"
    why: >-
      Watcher's Eye cần mod gắn với [[Pride]] làm impale kéo dài thêm 2 hit,
      được hai tác giả độc lập nêu tên. Stranglegasp mang bốn anoint, và hai
      trong số đó, [[Enigmatic Defence]] với [[Serpent Stance]], là block.
      Enlighten có mặt để nhét vừa dàn aura, và lộ trình công bố mua nó quanh
      level 95 cùng với jewel. [[The Light of Meaning]] bản physical là món
      mua sau, có giá ghi ngày 3.30 là "thường là tầm vài Divine"; chính xác
      nó rơi vào đâu thì chúng tôi không nói được. Không nguồn nào xếp hạng
      mấy món này với nhau hay định giá ba món đầu, nên chúng tôi cũng không.
  - step: "[[Mageblood]], rồi boots rare và một [[Quicksilver Flask]]"
    why: >-
      Món cuối trong số những món thật sự phải mua: lộ trình công bố đổi sang
      nó trong khoảng level 95 tới 100. Nó tự động hóa flask và chữa di
      chuyển. Tháo The Stampede, đeo boots rare có Onslaught, Elusive hoặc
      Tailwind, và movement speed đạt 200–250%. Build vốn đã clear được atlas
      khi chưa có nó; thứ nó mua là tốc độ, và mấy cây flask bạn không còn
      phải tự bấm. Vì vậy chúng tôi thấy để nó cuối cùng là ổn, và đó là cách
      đọc của chúng tôi. Qua nó là phần craft mức mirror, thứ mà chính tác giả
      của nó gọi là quá khó để nhiều người theo được. Không nguồn nào định giá
      bất cứ món nào ở đây.

play:
  mapping: |
    Một nút, nên danh sách ngắn. Phần lớn chuyện hỏng trong một map đã được quyết định từ trước khi bạn mở nó.

    1. **Đọc map trước khi mở.** Reroll No Leech trên hết, rồi Reduced Recovery và less cooldown recovery rate. Một tác giả nói hãy tránh hẳn map Valdo's. Reflect không nằm trong danh sách: build miễn nhiễm physical và elemental reflect.
    2. **Bật [[Rumi's Concoction]] và giữ cho nó chạy.** Cho tới khi chest craft và tattoo về, nó là một phần block của bạn, và cho tới khi có [[Mageblood]] thì không gì bấm nó thay bạn.
    3. **Giữ [[Cyclone of Tumult]] và đi xuyên qua pack.** Nó đánh trọn một vòng với vùng đánh lớn, nên bạn chỉ lái bằng con trỏ chứ không cần nhắm.
    4. **Giữ cho dòng channel chạy.** Leech từ [[Brutal Fervour]] chạy trong lúc bạn đang đánh trúng quái, còn [[Infused Channelling Support]] giảm damage khi infusion đang bật. Cách đọc của chúng tôi là vòng xoay bị ngắt thì bạn mất cả hai cùng lúc. Không nguồn nào nói rõ chuyện này.
    5. **Phần còn lại cứ để yên.** [[Molten Shell]] tự cast qua [[Automation]], còn aura thì luôn bật.

    Tốc độ là vậy đó. Khi đủ stage, skill mang một penalty movement speed rất nặng, [[The Stampede]] làm nó nhẹ đi, và mọi nguồn vẫn gọi build là chậm cho tới khi có Mageblood. Nó chạy map tốt, chứ không nhanh.
  bossing: |
    Build này giết boss bằng cách sống dai hơn chúng. Không có cửa sổ burst nào để canh, nên cả trận là chuyện giữ cho vòng xoay chạy và đừng đứng trong đúng cái đòn kết thúc nó.

    1. **Tạo xác.** Sàn đấu boss lúc đầu trống trơn, nên cast con [[Desecrate]] level 1.
    2. **Bấm [[General's Cry]].** Nó biến mấy cái xác đó thành mirage warrior. Không nguồn nào chúng tôi đọc cho biết nhịp lặp lại cặp này, nên chúng tôi cũng không đưa ra.
    3. **Xoay sát trên người boss.** [[Pride]] tác dụng lên quái ở gần, và leech của bạn chỉ chạy khi bạn đang đánh trúng.
    4. **Đi ra khỏi mấy đòn lớn có báo trước.** Block là xác suất, không phải giảm damage. Ở 87.75% thì khoảng một trong tám cú vẫn vào trọn, đó là phép tính của chúng tôi, và cả hai bảng chỉ số được công bố đều dưới 5,000 life. Penalty di chuyển khi đủ stage nghĩa là bạn rời đi sớm, hoặc không kịp rời.
    5. **Giữ Rumi's chạy** suốt trận nếu block của bạn còn phụ thuộc vào nó.

    Có hai thứ đổi theo level. Từ level 90, cả hai tác giả Mobalytics dùng một loadout bossing riêng, sửa lại ở 95. Đó là đổi cả gear lẫn cây, nên là một lần respec chứ không phải đổi gem. Và ở mức đỉnh nhất, một tác giả bỏ hẳn General's Cry rồi dồn tất cả vào Cyclone, khi đó bước 1 và 2 biến mất.

    Về Uber, một tác giả nói chờ tới budget trung bình hãy thử. Không có con số damage nào cho bản bossing, nên chúng tôi không nói được một trận nên kéo dài bao lâu.

deaths:
  - situation: "Map có No Leech, hoặc Reduced Recovery"
    cause: >-
      Leech liên tục từ [[Brutal Fervour]] chính là nguồn hồi phục. Nó là thứ
      ngăn damage lẻ dồn lại. Lấy nó đi thì mọi cú hit lọt qua block đều nằm
      lại trên người bạn.
    fix: >-
      Reroll. Tác giả liệt kê mấy mod này đặt No Leech lên đầu, và thêm less
      cooldown recovery rate cùng toàn bộ map Valdo's vào cùng danh sách.
  - situation: "Vòng xoay dừng lại ngay giữa pack"
    cause: >-
      Stun ngắt dòng channel, và một Cyclone còn tốn mana cũng vậy. Cách đọc
      của chúng tôi là leech và phần giảm damage từ
      [[Infused Channelling Support]] đều rơi theo nó, nên cái pack bạn đang
      đứng giữa sẽ đánh vào một nhân vật không còn gì che. Không nguồn nào nói
      rõ chuyện này.
    fix: >-
      [[Unwavering Stance]] để miễn stun, và zero mana cost nhờ craft -20 trên
      chest cộng -3 trên một ring. Kiểm cả hai trước khi đổ lỗi cho thứ gì
      khác.
  - situation: "Chơi như thể đã có 87.75% block trong khi bạn chưa có"
    cause: >-
      Con số trên tiêu đề thuộc về bản level 100 có cặp Forbidden. Bảng chỉ số
      level 96 duy nhất được công bố ghi 57%. Sớm hơn nữa, một phần block của
      bạn là [[Rumi's Concoction]], thứ chỉ tính khi nó đang chạy, và trước
      khi có [[Mageblood]] thì chính bạn là người phải bấm nó.
    fix: >-
      Giữ Rumi's bật như một thói quen, đừng như một phản xạ lúc nguy. Coi
      Uber là mục tiêu về sau: một tác giả nói chờ tới budget trung bình. Các
      con số trong bảng chỉ số là output của Path of Building 3.29.
  - situation: "Một đòn lớn của boss mà bạn không block được"
    cause: >-
      Block là cơ hội không ăn gì cả, không phải giảm damage. Ở 87.75% thì
      khoảng một trong tám cú vẫn tới trọn vẹn, và các mức life được công bố
      đều dưới 5,000. Penalty di chuyển khi đủ stage giữ bạn tại chỗ trong lúc
      đòn đang lên. Không nguồn nào liệt kê đây là một nguyên nhân chết; nó
      suy ra từ các con số được công bố.
    fix: >-
      Armour, endurance charge, [[Fortification]] vĩnh viễn từ [[Overlord]] và
      [[Molten Shell]] là những thứ làm cú hit lọt vào nhỏ lại. Bảng chỉ số
      level 96 đặt cú hit lớn nhất chịu được ở 22,000 physical và
      51,000–57,000 elemental, trên Path of Building 3.29. Qua mức đó thì câu
      trả lời là đi ra sớm.

troubleshooting:
  - symptom: "Cyclone bị giật cục, hoặc cứ chạy rồi dừng"
    cause: >-
      Kiểm mana trước. [[Cyclone of Tumult]] mà còn chút mana cost nào thì
      không channel được, và yêu cầu này sinh ra từ mấy thay đổi mana cost gần
      đây, nên các guide Cyclone cũ không nhắc tới.
    fix: >-
      Craft -20 mana cost trên chest và kiếm -3 trên một ring. Nếu cost đã về
      không rồi, xem bạn đã có [[Unwavering Stance]] chưa: stun cũng ngắt dòng
      channel.
  - symptom: "Nhân vật thấy chậm quá mức"
    cause: >-
      Đúng như dự kiến. Transfigured gem này trả giá cho vùng đánh và trần
      damage bằng một penalty movement speed rất nặng khi đủ stage, và mọi
      nguồn đều gọi đó là nhược điểm chính của build.
    fix: >-
      [[The Stampede]] hoặc Replica Stampede ngay bây giờ. Về sau là
      [[Mageblood]] với boots rare có Onslaught, Elusive hoặc Tailwind và một
      [[Quicksilver Flask]], đạt 200–250% movement speed. Trước lúc đó thì
      nhân vật của bạn không hỏng gì cả; build này chạy map kiểu vậy.
  - symptom: "Boss chết lâu hơn hẳn so với cảm giác lúc chạy map"
    cause: >-
      Thường là một trong ba chuyện. (a) Sàn đấu không có xác, nên
      [[General's Cry]] không có gì để tạo mirage warrior. (b) Bạn đang đánh
      bằng setup chạy map, trong khi cả hai tác giả Mobalytics đổi sang một
      loadout bossing riêng từ level 90. (c) Bản chất build là vậy: bossing
      của nó là sức bền, không có trần burst.
    fix: >-
      (a) Đặt một con [[Desecrate]] level 1 lên thanh skill và cast nó trước.
      (b) Lên kế hoạch respec; nó đổi gear và cây, không đổi gem. (c) Nếu
      [[Lethal Pride]] chưa vào, đó là bước nhảy damage rẻ mà lớn nhất hiện
      có. Sau đó thì chấp nhận một trận dài hơn.
  - symptom: "Path of Building của bạn không hiện ra con nào gần 177 triệu"
    cause: >-
      Con số đó là "Skill DPS Estimation" do một site tự suy ra cho bản
      min-max level 100, không chọn mục tiêu boss, trên engine 3.29, trên một
      trang còn treo banner work-in-progress của chính tác giả. Hai trong bốn
      tác giả không công bố con số damage nào, và bản bossing thì không có con
      nào cả.
    fix: >-
      Không có gì hỏng cả. Đừng lên kế hoạch quanh con số đó. Về phòng thủ,
      bảng chỉ số level 96 mới là thứ đáng đem ra so với nhân vật của bạn, và
      nó cũng là output 3.29.
  - symptom: "Spell block thấp hơn attack block rất nhiều"
    cause: >-
      Spell block không mua trực tiếp được. [[Versatile Combatant]] cho gấp
      đôi phần attack block bạn có trên 65%, và dưới mốc đó thì không cho gì.
      Sáu nguồn mà các guide nêu kèm con số cộng lại đúng bằng 65%, nên spell
      block đến từ phần chồng thêm lên trên: tattoo, và trước đó là
      [[Rumi's Concoction]]. Phép cộng đó là của chúng tôi, và danh sách được
      công bố có thể chưa đầy đủ.
    fix: >-
      Cộng attack block của bạn lại, tính cả phần trên 65%. Kiểm xem mọi nguồn
      được nêu tên đã vào chưa và Rumi's có đang chạy không, rồi thêm tattoo
      cho tới khi phần dư đạt mức bạn muốn.

patch:
  - note: >-
      **Về cơ bản nó không đổi gì, và đó chính là kết luận.** Changelog của một
      tác giả ghi lại việc cập nhật guide cho 3.30 và nói rằng về cơ bản build
      không đổi gì. Một tier list độc lập đánh dấu [[Cyclone of Tumult]] "không
      đổi trong 3.30". Hôm sau anh ta thêm các bản speed và bossing riêng, và đó
      là lý do mấy cái cây bossing đỉnh cao tồn tại.
  - entry: ruthless-changes
    note: >-
      **Đây là chỗ cần kiểm.** [[Slayer]] ([[Impact]], [[Endless Hunger]]),
      Champion (Fortitude) và block của Gladiator trên Ascendant đều nằm ở phần
      Ruthless-specific Changes và **không áp dụng cho game thường**. Không nguồn
      Cyclone nào chúng tôi đọc khẳng định Slayer được buff. [[Brutal Fervour]],
      thứ build này dựa vào, nguyên vẹn trong game thường. Nếu bạn thấy bài 3.30
      nào nói Slayer được buff, bài đó đọc sai patch note.
  - note: >-
      **Một dấu hiệu mềm.** Một trong bốn tác giả viết rằng build đã trở nên rất
      trâu với nhiều damage sau "mấy thay đổi gần đây", mà không nêu tên chúng.
      Mơ hồ đủ để chúng tôi không dựa vào — nhưng lưu ý là anh ta **không** khẳng
      định ascendancy Slayer được buff.
  - entry: league-fates
    note: >-
      **Độ phù hợp với league, đây là suy luận của chúng tôi chứ không phải khẳng
      định có nguồn.** Covens of Umbra cho bạn thêm Fate vào boss của một khu,
      khiến nó khó hơn và giàu hơn. Một build có bài quảng cáo là 87.75% lucky
      block, leech vĩnh viễn và miễn ailment thì ở vị thế tốt cho chuyện đó.
      Không nguồn nào nói cơ chế này thưởng cho độ trâu hay cho damage thuần.
  - entry: meta-crafting-costs
    note: >-
      **Chỉ liên quan tới mức đỉnh.** Kế hoạch mức mirror là một cây staff tự
      craft, một chest bốn influence và mấy mod helmet fractured. Recipe
      meta-modifier chuyển sang Nightmare Map, và "cannot be changed" trên vũ khí
      giờ tốn 4 Divine cộng 1 Sacred. Không nguồn nào tính lại giá các craft đó.

strengths:
  - "Bốn tác giả độc lập cùng đồng ý: trâu, bossing dễ, clear 360 độ, một nút."
  - "87.75% lucky block cho cả attack lẫn spell, với spell block mua được miễn phí bằng cách overcap attack block."
  - "Leech vĩnh viễn qua [[Brutal Fervour]], nên damage lẻ không bao giờ dồn lại."
  - "Miễn nhiễm physical và elemental reflect, và miễn elemental ailment."
  - "Chuyển lên từ chính league starter rẻ tiền của nó, không cần một nhân vật riêng."
  - "3.30 không đổi gì ở nó, nên mọi guide 3.29 vẫn còn dùng được."
  - "Build duy nhất trong bốn cái có lời khẳng định được công bố cho hardcore và solo self-found."
weaknesses:
  - "Chậm cho tới khi có [[Mageblood]]. Từng nguồn một đều nêu. Nó chạy map tốt, chứ không nhanh."
  - "No Leech là mod map thật sự nguy hiểm, không chỉ gây khó chịu. Reduced Recovery và less cooldown recovery rate cũng vậy."
  - "Rất ngốn level, cộng thêm một lần đổi cả gear lẫn cây giữa level 90 và 100. Đường chạy đà dài."
  - "Phụ thuộc vũ khí, mà vũ khí thì tự craft chứ không mua."
  - "Bossing tốt vì nó trâu và bền, không phải vì nó có trần burst."
  - "Con số 177 triệu damage là số hiển thị tự suy ra, không chọn mục tiêu boss, trên engine 3.29."
  - "Bản đỉnh, theo chính lời tác giả, quá khó để nhiều người đọc theo được."
avoidIf: >-
  Chọn build khác nếu bạn muốn clear cả màn hình tức thì mà không phải mua
  [[Mageblood]] trước, hoặc nếu bạn muốn một chuyên gia single-target — build này
  giết boss bằng cách sống dai hơn chúng, không phải bằng burst. Bỏ qua nếu bạn
  đang chạy league gấp: nó rất ngốn level và có một lần đổi gear ở khoảng level
  95 tới 100. Bỏ hẳn mức mirror nếu bạn không phải người craft tự tin; chính tác
  giả của nó nói vậy và trỏ bạn sang bản đơn giản hơn. Và nếu bạn ghét melee
  channel kiểu ghim chân bạn tại chỗ trong lúc boss ra chiêu, thì bao nhiêu block
  cũng không làm cảm giác đó dễ chịu hơn.

