name: Poisonous Concoction of Bouncing Pathfinder
tagline: >-
  Bạn đánh nhau mà không có vũ khí nào cả. Bạn ném cây life flask vào mặt quái,
  nó vỡ, nảy thêm hai lần nữa, và mọi thứ nó chạm vào đều chết vì độc.
class: Ranger
ascendancy: Pathfinder
role: starter
budget: starter
budgetNote: >-
  **Guide không đưa ra con số currency nào cả.** Không một cái giá, cho món nào,
  ở stage nào. Chúng tôi sẽ không bịa ra. Thay vào đó nó nói chuyện cấu trúc, mà
  đó mới là phần quan trọng: build "không cần unique nào để chạy được", và vì
  skill là một unarmed attack nên bạn không bao giờ phải mua weapon. Kế hoạch
  gear của chính nó là essence với crafting bench, không phải trade. Hai món
  unique nó nêu như lựa chọn trade-league giai đoạn đầu là [[The Embalmer]] và
  [[Dendrobate]]; danh sách best-in-slot ([[Fury Valve]], [[Snakebite]]) là mục
  tiêu bốn Voidstone, còn danh sách để mơ ([[Svalinn]],
  [[Olesya's Delight]], [[Dying Sun]], [[Progenesis]], [[Betrayal's Sting]]) thì
  không phải budget starter ở league nào.
mainSkill: Poisonous Concoction of Bouncing
image: asc-icon-pathfinder
hero: art-pathfinder
tags: [Unarmed, Chaos, Poison, Flasks, Shield]
ratings: { clear: 5, bossing: 3, survivability: 4, ease: 4 }
verified: "2026-11-13"
confidence: mixed
confidenceNote: >-
  **Đây là ca hiếm: một guide thật sự được cập nhật cho 3.30.** Trang Maxroll có
  tiêu đề Covens of Umbra 3.30 và changelog đề ngày 12/11/2026 ghi "Updated for
  PoE 3.30 Covens of Umbra". Chúng tôi đã kiểm, vì nhiều guide trên site này
  không qua được bài kiểm đó.


  Ba chuyện vẫn chưa được chứng minh. **Thứ nhất, planner không phải 3.30.** Nút
  import của chính nó ghi "Open In PoB (3.29 for 3.30)", nên mọi con số phía sau
  nó đều là hàng 3.29. **Thứ hai, trang 3.30 không công bố bảng điểm nào cả** —
  cái khối Difficulty Very Low / Budget Low / Mapping Great / Bossing Weak /
  Defence Average mà bạn có thể đã thấy đâu đó thuộc về guide Poisonous
  Concoction trơn *đã lưu trữ*, sửa lần cuối tháng 7/2024, và chúng tôi không
  dựng lại nó như thể nó còn hiện hành. Bốn điểm số ở trên là cách đọc của riêng
  chúng tôi. **Thứ ba, hai trang Maxroll không khớp nhau về thứ tự ascendancy**
  (xem bảng Labyrinth). Chúng tôi nói rõ cái nào là cái nào thay vì âm thầm chọn
  một bên.
modes:
  ssf: >-
    Một trong những lựa chọn khá nhất trên site này. Không bắt buộc unique nào,
    không có weapon nào phải đi tìm, và [[Poisonous Concoction of Bouncing]] là
    transfigured gem từ [[Divine Font]] ở cuối Labyrinth, chỗ bạn tự farm được.
    Kế hoạch gear là essence với craft ở bench, cả hai đều tự lo được. Đây là
    nhận định của chúng tôi; guide không đưa ra kết luận SSF nào.
  hardcore: >-
    Guide không đưa ra kết luận nào. Cách đọc của chúng tôi: campaign an toàn
    một cách lạ thường, vì bạn đánh từ xa và không bao giờ cần nâng cấp weapon.
    Chuyện đáng lo ở tầm map là damage, hồi phục và đạn của bạn đều là cùng một
    nguồn tài nguyên — cây life flask — nên bất cứ thứ gì cắt flask charge là
    cắt luôn cả ba cùng lúc.

idea: |
  [[Poisonous Concoction]] là một attack chỉ dùng được khi **tay chính trống không và tay phụ không có weapon**. Bạn ném một bình độc. Nó vỡ trên mặt đất, gây damage theo vùng, và đầu độc mọi thứ nó chạm tới.

  Hai điều làm nó thành thứ nghiêm túc chứ không phải chiêu lạ.

  Thứ nhất là damage đến từ đâu. Một phần ghi trên gem, và một phần là **phần trăm lượng máu mà flask của bạn hồi**. Nên nâng cấp damage lớn nhất bạn có được là một cây life flask lớn hơn. Tiền gear của bạn đi vào flask, không đi vào bow.

  Thứ hai là bản transfigured. [[Poisonous Concoction of Bouncing]] thêm "Chains +2 Times" — cái bình vỡ, rồi nảy sang mục tiêu mới, rồi nảy tiếp lần nữa. Guide nói một cái bình có thể đầu độc cùng một con quái "5 tới 10 lần hoặc hơn". Bạn lên level bằng bản trơn rồi đổi sang bản này từ [[Divine Font]].

  [[Plague Bearer]] là nửa còn lại. Nó gửi vào két một phần mọi poison damage bạn gây ra, và khi két đầy thì bạn xả ra thành một aura thụ động giết sạch mọi thứ bạn đi ngang qua. Clear và single target là cùng hai cái nút đó, chỉ bấm theo thứ tự khác.

chain:
  - label: Ném
    text: "[[Poisonous Concoction]] phóng một cái bình. Đây là unarmed attack, nên tay bạn phải trống; shield thì không sao và build có đeo một cây."
  - label: Nảy
    text: "Bản of Bouncing chain thêm 2 lần, nên một cú ném rơi xuống tới ba lần vỡ, và mấy cú vỡ chồng lên nhau đầu độc cùng một con quái nhiều lần."
  - label: Độc
    text: "Poison là chaos damage over time. Nó chồng vô hạn, nên tốc độ ra đòn và poison chance quan trọng hơn bất kỳ con số to nào."
  - label: Gửi két và xả
    text: "[[Plague Bearer]] giữ một phần poison damage đó. Ở Plague value tối đa bạn xả nó thành aura rồi đi xuyên qua pack bằng [[Withering Step]] hoặc [[Shield Charge]]."
  - label: Trả giá
    text: "Mỗi cú ném ăn Life Flask charge. Nên [[Nature's Adrenaline]] và mấy mod flask charge là chỉ số damage, không phải chỉ số tiện nghi."

chainDetails:
  - title: Cây life flask chính là vũ khí
    body: |
      Đây là thứ cần hiểu trước mọi thứ khác.

      PoEDB ghi added chaos damage của gem là 22–33 ở gem level 1 và 537–806 ở gem level 20 — và **trên hết, cộng thêm added chaos damage bằng 6–18% lượng hồi phục của flask**.

      Đó là lý do phần khuyên về flask của guide đọc như phần khuyên về weapon: một [[Divine Life Flask]] là best in slot từ level 60, và mục tiêu bốn Voidstone là "Divine Life Flask với 50%+ Increased Amount Recovered". Flask tốt hơn là vũ khí tốt hơn.

      Nó cũng có nghĩa là bản năng quen thuộc lúc league start — dồn tiền vào ô weapon — ở đây là sai. Trong ô đó chẳng có gì.
  - title: Một cú ném thật ra tốn mấy flask charge
    body: |
      **Chúng tôi không chốt được chuyện này từ mấy nguồn đang có, nên chúng tôi sẽ không nêu một con số duy nhất.**

      Guide Concoction trơn đã lưu trữ nói skill lấy đi **2 Life Flask charge** mỗi lần attack. Trang PoEDB cho [[Poisonous Concoction of Bouncing]] ghi **8 charge mỗi projectile được bắn ra**. Hai câu đó không thể cùng mô tả một thứ; có thể chúng đang nói về gem gốc so với bản transfigured, hoặc mỗi-attack so với mỗi-projectile, và không nguồn nào chúng tôi đọc dung hòa được chúng.

      Điều không ai nghi ngờ là hệ quả: tốc độ nạp flask charge là một phần damage của bạn. Ghi chú về scaling của chính guide là lấy "ít nhất 33% increased Flask Charges Gained" trên cây, mà nó nói là nâng "3 Charge mỗi hit lên 4". Nó không giải thích con số 3 gốc đến từ đâu, và chúng tôi nêu chuyện đó ra chứ không đoán.
  - title: Vì sao skill thỉnh thoảng bị xám đi
    body: |
      Đây là vấn đề phổ biến nhất của người mới với build này, và guide cho nó một mục FAQ riêng: "Poisonous Concoction là một unarmed attack skill, nghĩa là bạn không được đeo weapon nào."

      Nguyên nhân thường gặp là tính năng tự trang bị của game nhặt một cây weapon lên giúp bạn. Tháo nó ra là skill quay lại.

      Shield không bị tính là weapon. Build đeo một cây từ Act 1, và đó cũng là chỗ cho khá nhiều life với resistance của nó.
  - title: Plague Bearer thật ra làm gì
    body: |
      [[Plague Bearer]] có hai trạng thái. Lúc đang "gaining" nó âm thầm gửi vào két một phần poison damage bạn gây ra. Lúc đang "infecting" nó tiêu cái két đó thành một aura gây damage cho mọi thứ quanh bạn.

      Chỉ dẫn của guide là cùng một câu cho cả hai nhiệm vụ: dùng nó "ở Maximum Plague Value của nó". Đánh single target thì bạn bật nó lên người boss; dọn pack thì bạn bật rồi đi xuyên qua pack bằng [[Withering Step]] hoặc [[Shield Charge]].

      Guide cũng gợi ý chạy thêm Merciless Labyrinth chỉ để lên level và quality cho viên gem, điều đó cho bạn biết bao nhiêu phần output của build nằm trong nó.
  - title: Mana, và bốn thứ guide đưa ra
    body: |
      FAQ có một mục tên "How do I solve Mana?", đó là dấu hiệu khá rõ rằng nó cắn thật. Các lựa chọn nó liệt kê:

      1. [[Thrill of Battle]] trên cây.
      2. Trả cost bằng life thay vì mana, qua một Life Mastery.
      3. Flat mana trên gear.
      4. Từ trang gear: craft "Non-Channelling Skills have -# to Total Mana Cost" lên ring hoặc amulet.

      Không cái nào được trình bày như câu trả lời. Chuẩn bị tinh thần ghép hai trong số đó lại.

mandatory:
  - term: Poisonous Concoction
    why: >-
      Thứ bạn bấm suốt cả campaign. Mua từ Nessa ở level 12, và nó cùng yêu cầu
      gem level với bản transfigured.
  - term: Poisonous Concoction of Bouncing
    why: >-
      Bản transfigured, và là lý do build này được viết cho 3.30 thay vì ông anh
      em bản trơn của nó. "Chains +2 Times" biến một cú ném thành tới ba lần vỡ.
    detail: >-
      Nó đến từ [[Divine Font]] ở cuối Labyrinth. Guide cho bạn đổi sang nó sau
      Merciless Labyrinth, cũng là lúc bạn đang farm cái lab đó để lấy level cho
      [[Plague Bearer]].
  - term: Plague Bearer
    why: >-
      Vừa là clear vừa là single target của bạn. Guide gọi nó cùng main skill là
      "combo clear và single target chính" của build.
  - term: Master Toxicist
    why: >-
      Poison damage và poison chance từ ascendancy. Trang 3.30 lấy nó đầu tiên,
      chỗ mà guide đã lưu trữ lấy nó thứ hai.
  - term: Nature's Reprisal
    why: >-
      Áp Wither on hit và làm mỗi stack Wither mạnh thêm một nửa, nên quái ăn
      nhiều chaos damage hơn hẳn. Được nêu là notable cho single target.
  - term: Nature's Adrenaline
    why: >-
      Flask nhận charge theo đồng hồ. Vì flask charge là đạn của bạn, đây là một
      notable damage đội lốt notable tiện nghi.
  - term: Divine Life Flask
    why: >-
      Best in slot từ level 60, vì một phần damage của bạn là phần trăm lượng hồi
      phục của flask. Nhắm 50%+ increased Amount Recovered.
  - term: Unbound Ailments Support
    why: >-
      More poison damage và poison duration dài hơn. Có trong mọi link được công
      bố cho skill này mà chúng tôi đọc được.
  - term: Void Manipulation Support
    why: >-
      More chaos damage. Cặp đôi chuẩn với Unbound Ailments trong main link.
  - term: Withering Step
    why: >-
      Áp Wither quanh bạn và cho một đoạn tăng tốc, cũng là cách bạn đi xuyên qua
      pack trong lúc Plague Bearer đang infecting.
  - term: Shield Charge
    level: recommended
    why: >-
      Skill di chuyển của bạn, và là thứ bạn dùng để kéo một
      [[Plague Bearer]] đã xả đi xuyên qua pack. Dù sao bạn cũng đang đeo shield.
  - term: Despair
    level: recommended
    why: >-
      Hạ chaos resistance, mà đó đúng là resistance mà toàn bộ damage output của
      bạn bị đo lại. Cast lên boss.
  - term: Grace
    level: recommended
    why: >-
      Aura chính của build. Được liệt kê cùng [[Flesh and Stone]] và
      [[Malevolence]]; [[Precision]] chỉ dùng ở level thấp.
  - term: The Embalmer
    level: recommended
    why: >-
      Một trong hai món unique guide nêu như lựa chọn trade-league giai đoạn đầu.
      Không có gì trong build bắt buộc phải có nó.
  - term: Dendrobate
    level: recommended
    why: >-
      Món trade-league giai đoạn đầu còn lại. Body armour hướng poison.
  - term: Fury Valve
    level: recommended
    why: >-
      Được liệt kê là best in slot ở mốc bốn Voidstone. Mục tiêu muộn, không phải
      mục tiêu khởi đầu.
  - term: Apothecary's Gloves
    level: recommended
    why: >-
      3.30 đổi implicit của base này từ increased damage over time sang
      +14–18% damage over time *multiplier*, một kiểu scaling mạnh hơn hẳn về bản
      chất cho một build poison. Guide không nhắc tới chuyện này.

labs:
  - lab: Normal
    node: Master Toxicist
    why: "**Hai trang Maxroll không khớp nhau ở đây.** Trang 3.30 xếp Master Toxicist trước và [[Nature's Reprisal]] sau; trang leveling đã lưu trữ thì đặt Nature's Reprisal quanh level 30 và Master Toxicist ở Cruel. Chúng tôi theo trang 3.30, vì đó là trang được cập nhật."
  - lab: Cruel
    node: Nature's Reprisal
    why: "Notable cho single target: Wither on hit, và 50% increased Wither effect. Chạy nó trong khoảng giữa Act 7."
  - lab: Merciless
    node: Nature's Adrenaline
    why: "Flask luôn sẵn charge, mà với build này nghĩa là đạn. Đây cũng là cái lab giao cho bạn [[Poisonous Concoction of Bouncing]] từ [[Divine Font]]."
  - lab: Eternal
    node: Nature's Boon
    why: "Utility flask mạnh hơn. Lưu ý là thứ tự của trang 3.30 không lấy cái nào trong ba notable mà 3.30 thật sự đã đổi — xem phần patch note bên dưới."

stages:
  - id: acts-1-3
    image: caustic-arrow
    title: Act 1–3
    levels: Level 1–21
    uses: >-
      [[Caustic Arrow]] từ level 2 và [[Shrapnel Ballista]] từ level 4, rồi
      [[Poisonous Concoction]] ở level 12, đó mới là lúc build thật sự bắt đầu.
      Nhét một cây shield vào tay phụ và không nhét gì vào tay chính.
    changes: >-
      [[Plague Bearer]] và [[Despair]] tới ở level 21 trong Act 3 và cái nhịp hai
      nút xuất hiện. [[Herald of Agony]], [[Blood Rage]] và
      [[Summon Skitterbots]] vào ở level 16.
    links:
      - name: Level 2–11
        gems: [Caustic Arrow, Pierce Support, Lesser Multiple Projectiles Support]
      - name: Từ level 12
        gems: [Poisonous Concoction, Volley Support, Onslaught Support]
      - name: Four-link trước level 18
        gems: [Poisonous Concoction, Volley Support, Onslaught Support, Faster Attacks Support]
      - name: Utility
        gems: [Withering Step, Smoke Mine, Herald of Agony, Blood Rage]
    moveOn: "Poisonous Concoction đã nằm trong four-link, Plague Bearer đã lên thanh skill, và bạn đã xong Act 3."
    details:
      - title: Danh sách theo từng level này đến từ đâu, và điểm yếu của nó
        body: |
          **Trang 3.30 không chứa phần hướng dẫn leveling nào.** Maxroll nhét chi tiết skill với gem vào trong một planner nhúng mà không đọc được dưới dạng chữ, còn mấy mục văn xuôi thì chỉ nêu tên skill, không nêu link.

          Mấy mốc level ở trên đến từ trang leveling của guide đồng hành **đã lưu trữ**, trang đó đóng dấu thời 3.29 và nằm dưới build Poisonous Concoction trơn. Chúng tôi dùng nó vì đó là lộ trình theo từng level duy nhất được công bố cho skill này, và vì level của quest reward không đổi giữa các league. Hãy coi mấy support gem đó là một lộ trình hợp lý chứ không phải ý định hiện tại của tác giả.
      - title: Danh sách gem mà trang đã lưu trữ đưa ra
        body: |
          - **Level 2:** [[Caustic Arrow]] từ Tarkleigh, kèm [[Pierce Support]].
          - **Level 4:** [[Shrapnel Ballista]] và [[Dash]] từ Tarkleigh; [[Mirage Archer Support]], [[War Banner]] và một [[Quicksilver Flask]] từ Nessa.
          - **Level 8:** [[Lesser Multiple Projectiles Support]] từ Nessa.
          - **Level 10:** [[Smoke Mine]], thay cho Dash.
          - **Level 12:** [[Poisonous Concoction]] từ Nessa, cộng [[Withering Step]], [[Onslaught Support]] và [[Volley Support]].
          - **Level 16:** [[Herald of Agony]] từ Greust; [[Blood Rage]] và [[Summon Skitterbots]] từ Yeena.
          - **Level 18:** [[Faster Attacks Support]] từ Silk.
          - **Level 21:** [[Despair]] từ Maramoa và [[Plague Bearer]] từ Clarissa.

          [[Volley Support]] là support cho lúc chơi thường và [[Onslaught Support]] thì đổi vào cho mấy trận boss.
      - title: Tay trống, tay phụ thì đầy
        body: |
          Đeo shield ngay khi rơi được một cây và giữ tay chính trống suốt phần đời còn lại của nhân vật. Shield nào cũng được ở giai đoạn đầu; sau này bạn muốn một cây rare có life với resistance.

          Tắt tự động trang bị nếu được, hoặc chuẩn bị tinh thần thấy skill xám đi ngay lần đầu một cây sword rơi vào con trỏ.
      - title: Bandit và Pantheon
        body: |
          **Trang 3.30 chỉ để chỗ trống cho cả hai.** Nó chỉ nói "Hãy xem mục này để biết chi tiết về Pantheon và Bandit" rồi không đưa chi tiết nào.

          Câu trả lời của trang đã lưu trữ là **giết cả ba bandit** để lấy thêm một passive point, và lấy **Soul of the Brine King** làm major với **Soul of Abberath** làm minor. Rồi chính trang đó tự mâu thuẫn khi chọn Ralakesh ở Act 7. Chúng tôi báo lại chỗ xung đột chứ không giải quyết nó.
  - id: acts-4-10
    image: asc-pathfinder
    title: Act 4–10
    levels: Level 21–68
    uses: >-
      [[Poisonous Concoction]] với [[Unbound Ailments Support]] khi bạn tới level
      27, [[Plague Bearer]] bấm theo cooldown, và [[Grace]] làm aura.
      [[Shield Charge]] thay [[Smoke Mine]] để di chuyển.
    changes: >-
      Bạn ascend ba lần. [[Increased Area of Effect Support]] và
      [[Flame Dash]] tới ở level 42. Sau boss Act 5 và boss Act 10 bạn mất 30%
      mọi elemental resistance mỗi lần, nên hãy nhắm tầm 105% trước Kitava.
    links:
      - name: Main skill
        gems: [Poisonous Concoction, Volley Support, Unbound Ailments Support, Faster Attacks Support, Void Manipulation Support]
      - name: Clear và single target
        gems: [Plague Bearer, Withering Step]
      - name: Aura
        gems: [Grace, Malevolence, Precision]
      - name: Curse và di chuyển
        gems: [Despair, Shield Charge, Flame Dash]
    moveOn: "resistance về lại 75% sau Act 10, bạn đã có notable đủ cho ba điểm ascendancy, và Plague Bearer đã lên level."
    details:
      - title: Chỗ duy nhất build thật sự lóng ngóng
        body: |
          Mana. Nó có mục FAQ riêng trên trang 3.30, và bốn cách chữa nó đưa ra thì đã liệt kê ở mục cơ chế bên trên. Cách rẻ nhất trong lúc chạy campaign là flat mana trên gear cộng một cây mana flask; cách chữa thật, craft "-# to Total Mana Cost of Non-Channelling Skills", thì tới muộn hơn.
      - title: Passive tree, tới mức guide dám cam kết
        body: |
          Trang 3.30 nêu đúng một mục tiêu trên cây bằng văn xuôi: **ít nhất 33% increased Flask Charges Gained**, mà nó nói là đưa charge mỗi hit của bạn từ 3 lên 4.

          Trang đã lưu trữ thêm một notable, **[[Graceful Assault]]**, quanh level 27.

          Mọi thứ khác nằm trong planner nhúng. **Chúng tôi sẽ không dựng lại một cái cây mà chúng tôi không đọc được.** Hãy mở planner của guide và theo thứ tự node của nó.
      - title: Flask trong lúc chạy campaign
        body: |
          Kế hoạch flask của trang đã lưu trữ: hai life, một mana và hai quicksilver trước level 13; một [[Jade Flask]] quanh level 38; một [[Quartz Flask]] ở Act 7; một [[Sulphur Flask]] ở Act 10.

          Giữ life flask luôn mới. Ở đây chúng không phải lưới an toàn, chúng là băng đạn.
  - id: early-maps
    image: divine-life-flask
    title: Map đầu
    levels: Map trắng và map vàng, một tới hai Voidstone
    uses: >-
      [[Poisonous Concoction of Bouncing]] trong five-link hoặc six-link, một
      [[Divine Life Flask]] từ level 60, và đồ rare roll bằng essence.
    changes: >-
      Transfigured gem vào sau Merciless Labyrinth và phần clear đổi tính cách
      hoàn toàn. [[Cast when Damage Taken Support]] với [[Immortal Call]] vào
      làm guard.
    links:
      - name: Main skill
        gems: [Poisonous Concoction of Bouncing, Unbound Ailments Support, Void Manipulation Support, Vicious Projectiles Support, Greater Volley Support]
      - name: Clear và single target
        gems: [Plague Bearer, Withering Step]
      - name: Aura
        gems: [Grace, Malevolence, Flesh and Stone]
      - name: Guard và curse
        gems: [Cast when Damage Taken Support, Immortal Call, Despair]
    moveOn: "mục tiêu một-Voidstone của chính guide: tầm 3,000 life với energy shield cộng lại, và một triệu damage mỗi giây trong planner."
    details:
      - title: Mấy con số guide thật sự công bố
        body: |
          Nó cho mục tiêu theo tiến độ chứ không phải chỉ số đo được, và **tất cả đều là hàng 3.29**, vì cái planner phía sau chúng đóng nhãn "3.29 for 3.30":

          - **Hai Voidstone:** "3K+ Life & Energy Shield and 1Million+ DPS."
          - **Bốn Voidstone:** "3.6K to 4K+ Life & Energy Shield and 2Million to 3Million+ DPS."

          Trong cả guide không có con số effective hit point nào, và không có con số damage đo được cho bộ gear cụ thể nào. Đừng coi mấy số này là thứ bạn sẽ thấy trên nhân vật của mình.
      - title: Lo gear bằng essence, không phải bằng trade
        body: |
          Kế hoạch gear của guide là một danh sách essence theo từng ô: Shrieking Essence of Loathing lên helmet, Screaming hoặc Deafening Essence of Zeal lên gloves với boots, Deafening Essence of Greed lên shield, và Shrieking Essence of Rage hoặc Envy lên belt. Rồi một [[Stygian Vise]] với một viên abyss jewel, Eldritch currency lên mấy ô đúng chỗ, và đánh cược với Faustus để lấy body armour.

          Chuyện này hợp với 3.30. Map đỏ giờ chỉ rơi essence tier Screaming trở lên, nên mấy tier mà kế hoạch này cần sẽ dễ tìm hơn khi bạn đi sâu — còn mấy tier thấp rẻ tiền bạn dùng cho gear leveling thì giờ chỉ đến từ map trắng và campaign.
      - title: Mod map duy nhất cần reroll
        body: |
          FAQ của bản 3.30 nêu đúng một cái: **"Monsters have +50% Chance to Block Attack Damage."** Poisonous Concoction là một attack, nên một cú ném bị block là một cú ném không làm gì cả mà vẫn ăn flask charge.

          Trang đã lưu trữ thêm ba cái nữa đáng tránh: chance to avoid poison, quái có thêm chaos resistance, và −% maximum resistances. Nó cũng liệt kê reduced aura effect, cái này có ý nghĩa khi [[Grace]] với [[Flesh and Stone]] đang gánh phần phòng thủ của bạn.
  - id: red-maps
    image: asc-icon-pathfinder
    title: Map đỏ trở lên
    levels: Map Tier 11–16, ba tới bốn Voidstone
    uses: >-
      Một six-link với support awakened ở những chỗ bạn kham được,
      [[Petrified Blood]] thêm vào khối aura, và cây
      [[Divine Life Flask]] tốt nhất bạn roll được.
    changes: >-
      Nâng cấp dần thành chuyện roll flask và gem quality chứ không phải món mới.
      Danh sách unique để mơ mở ra, và không món nào trong đó là bắt buộc.
    moveOn: "không còn stage nào nữa. Thứ còn lại là roll flask, awakened gem và mấy món unique để mơ."
    details:
      - title: Một cái link hoàn chỉnh trông như thế nào
        body: |
          **Guide không in cái six-link của nó ra dưới dạng chữ.** Setup dưới đây đến từ mấy file Path of Building của cộng đồng cho skill này trong 3.29, và chúng khớp với nhau:

          [[Poisonous Concoction of Bouncing]], [[Unbound Ailments Support]], [[Void Manipulation Support]], [[Vicious Projectiles Support]], [[Greater Volley Support]] và [[Greater Multiple Projectiles Support]], với bản awakened của ba viên đầu ở mức cao cấp nhất.

          Nêu rõ đây là đối chiếu chéo, không phải danh sách của chính tác giả.
      - title: Danh sách để mơ, và vì sao nó không phải một kế hoạch
        body: |
          Mấy ô để mơ của chính guide là [[Svalinn]], [[Fury Valve]], [[Snakebite]], [[Ralakesh's Impatience]], [[Olesya's Delight]], [[Dying Sun]], [[Progenesis]] và [[Betrayal's Sting]].

          Món nào trong đó cũng đắt trong 3.29 và **chưa món nào có giá cho 3.30**, vì chưa có kinh tế nào cả. Hãy đọc danh sách đó như một hướng đi, không phải một chuyến đi chợ.
      - title: Nó không làm được gì
        body: |
          - Không có chỗ nào trong guide nói về Uber pinnacle boss, nên chúng tôi không khẳng định gì về chúng.
          - Poison là damage over time, nên không có burst. Một con boss có cửa sổ damage ngắn là đối thủ khó chịu hơn con có cửa sổ dài.
          - Build này đánh tay không, nghĩa là bạn bị khóa khỏi mọi hướng scaling dựa trên weapon suốt cả league.

patch:
  - entry: pathfinder-flask-changes
    note: >-
      **Kiểm cái này trước khi tin một tier list.** 3.30 đổi đúng ba notable của
      Pathfinder: [[Master Surgeon]], [[Master Alchemist]] và
      [[Master Distiller]]. Thứ tự ascendancy của guide 3.30 **không lấy cái
      nào** trong số đó — nó lấy [[Master Toxicist]],
      [[Nature's Reprisal]], [[Nature's Adrenaline]] và [[Nature's Boon]]. Nên
      một tier list 3.30 nổi tiếng xếp build này vào hạng A "vì 3.30 buff
      Pathfinder" là đang suy luận từ mấy thay đổi mà cách lấy điểm này không hề
      chạm tới. Build có thể xứng hạng A thật; chỉ là không phải vì lý do đó.


      Dù vậy, có một thay đổi đáng để đổi: Master Alchemist giờ xóa **mọi**
      ailment khi dùng flask, kể cả Bleeding với Poison, trước đây nó chỉ xóa mấy
      cái elemental. Đó là một lựa chọn thật cho một build bấm flask liên tục.
  - entry: special-base-implicits
    note: >-
      **Đây là cú buff 3.30 thật sự cho build này, và guide bỏ sót nó.**
      [[Apothecary's Gloves]] đổi từ 14–18% *increased* damage over time sang
      +14–18% damage over time *multiplier*. Multiplier là một kiểu scaling riêng
      và mạnh hơn, mà toàn bộ output của bạn là damage over time. Cú nerf duy
      nhất trong cùng mục đó, implicit của Amethyst Ring tụt xuống
      +13–19% chaos resistance, chỉ lấy của bạn một chút resistance, không gì
      thêm.
  - entry: essence-changes
    note: >-
      **Hơi có lợi, vì kế hoạch gear dựa trên essence.** Map đỏ giờ chỉ sinh ra
      essence tier Screaming trở lên, đúng khoảng tier mà mấy recipe của guide
      cần. Cái bẫy nằm ở đầu kia: essence Weeping với Wailing biến mất khỏi map
      vàng và map đỏ, nên hãy dùng mấy cây rẻ bạn nhặt trong campaign lên gear
      leveling thay vì để dành.
  - entry: ruthless-changes
    note: >-
      **Pathfinder nằm trong cả hai danh sách, và đó đúng là cách người ta hiểu
      sai chuyện này.** 3.30 có thay đổi Pathfinder thật cho game thường *và* một
      mục riêng của Ruthless chỉnh khoảng hai mươi notable ascendancy, trong đó
      có Pathfinder. Nên câu "Pathfinder bị đổi trong 3.30" đúng với cả hai mục
      và chẳng nói lên điều gì. Nếu league này bạn đọc được một con số Pathfinder
      cụ thể, hãy kiểm nó đến từ mục nào trước khi dựng lại cả cây quanh nó.
  - note: >-
      **Bản thân skill không bị đụng tới.** Cả
      [[Poisonous Concoction]] lẫn [[Poisonous Concoction of Bouncing]] đều không
      xuất hiện trong phần thay đổi skill của 3.30, và thay đổi gần nhất của
      PoEDB cho viên transfigured là từ 3.27. Không gì trong patch làm xê dịch
      damage của nó.
  - note: >-
      **Planner vẫn là 3.29.** Nút import của guide nói đúng y như vậy: "Open In
      PoB (3.29 for 3.30)". Mọi con số damage và life nó cho ra đều có trước patch
      này.

strengths:
  - "Không có ô weapon. Suốt cả league bạn không mua, craft hay nâng cấp weapon."
  - "Không bắt buộc unique nào, chính guide nói thẳng vậy."
  - "Clear cực mạnh khi Plague Bearer với bản nảy đã cùng vào chỗ."
  - "Poison là chaos damage over time, nên energy shield của quái vô dụng."
  - "Lo gear rẻ: essence với crafting bench, không phải trang trade."
  - "Lựa chọn solo self-found tuyệt vời, kể cả khoản transfigured gem."
weaknesses:
  - "Mana tệ tới mức có mục FAQ riêng."
  - "Damage, hồi phục và đạn của bạn là cùng một nguồn. Mất flask charge là mất cả ba."
  - "Tự động trang bị nhặt một cây weapon lên và âm thầm tắt main skill của bạn."
  - "Damage over time nghĩa là không có burst. Cửa sổ boss ngắn là đối thủ khó chịu."
  - "Guide không công bố con số currency nào cả, nên bạn không lập budget từ nó được."
  - "Planner của nó là 3.29, và bảng điểm của nó thì thuộc một guide đã lưu trữ."
avoidIf: >-
  Chọn build khác nếu bạn muốn cảm giác nâng cấp một cây weapon, nếu bạn muốn
  burst damage, hoặc nếu bạn muốn một build mà budget lập được từ giá đã công bố
  — build này không cho cái nào. Bỏ qua luôn nếu một build không chạy được khi
  tay có bất cứ thứ gì nghe như cái bẫy mà bạn sẽ sa vào; nó là cái bẫy đó thật,
  và FAQ của chính guide tồn tại vì người ta sa vào thật.

sources:
  - title: "Maxroll: Poisonous Concoction of Bouncing Pathfinder League Starter"
    url: https://maxroll.gg/poe/build-guides/poisonous-concoction-of-bouncing-pathfinder-league-starter
    kind: guide
    note: "Đóng nhãn Covens of Umbra 3.30, changelog ngày 12/11/2026 ghi \"Updated for PoE 3.30 Covens of Umbra\". Nguồn chính. Không công bố điểm số, không giá, và không in gem link dưới dạng chữ. Nút PoB của nó ghi \"3.29 for 3.30\"."
  - title: "Maxroll: Path of Building cho build"
    url: https://maxroll.gg/poe/pob/t71rw400
    kind: pob
    note: "Ghi \"Level 99 Pathfinder\". Chúng tôi không rút ra được nhóm gem, con số damage hay life từ nó, nên ở đây không trích con nào."
  - title: "Maxroll: Poisonous Concoction Pathfinder (đã lưu trữ)"
    url: https://maxroll.gg/poe/build-guides/poisonous-concoction-pathfinder-league-starter-guide
    kind: guide
    note: "Bản tiền nhiệm dùng Concoction trơn, đánh dấu Archived, cập nhật lần cuối tháng 7/2024, tiêu đề trên trình duyệt vẫn ghi 3.20. Nguồn của khối Difficulty/Budget/Mapping/Bossing/Defence mà các site khác trích như thể còn hiện hành, và của thứ tự ascendancy cũ."
  - title: "Maxroll: trang leveling đã lưu trữ"
    url: https://maxroll.gg/poe/build-guides/poisonous-concoction-pathfinder-league-starter-guide/leveling-poisonous-concoction
    kind: guide
    note: "Lộ trình theo từng level duy nhất được công bố cho skill này. Đóng dấu \"Updated July 24, 2026\", đó là ngày cập nhật cho 3.29, và nó nằm dưới guide đã lưu trữ. Nguồn của mấy mốc gem, bandit, Pantheon và flask trong campaign."
  - title: "PoEDB: Poisonous Concoction of Bouncing"
    url: https://poedb.tw/us/Poisonous_Concoction_of_Bouncing
    kind: data
    note: "Nguồn của yêu cầu level 12, \"Chains +2 Times\", bán kính 1.8 mét, 22–33 tới 537–806 added chaos damage, 6–18% lượng hồi phục của flask, và yêu cầu tay không. Mục thay đổi gần nhất của nó là 3.27."
  - title: "PoEDB: Poisonous Concoction"
    url: https://poedb.tw/us/Poisonous_Concoction
    kind: data
    note: "Dùng để xác nhận gem gốc dùng chung yêu cầu level và chung giới hạn tay không."
  - title: "insanebuild: tier list build 3.30"
    url: https://insanebuild.gg/blog/path-of-exile/build-guide-e35d/poe-3-30-build-tier-list
    kind: guide
    note: "Xếp build này hạng A, lên từ B, với lý do nêu ra là \"3.30 buff Pathfinder\". Xem phần patch note bên trên để biết vì sao lý do đó không khớp với thứ tự ascendancy của build này. Công bằng mà nói, nó chỉ liệt kê thay đổi ascendancy 3.30 cho Pathfinder, Warden, Trickster, Luminary và Reliquarian, và không nhai lại mấy khẳng định chỉ-thuộc-Ruthless như các site launch khác."
  - title: "Các file Path of Building của cộng đồng cho bản of Bouncing"
    url: https://pobarchives.com/build/MWGpkj4Y
    kind: pob
    note: "Hàng 3.29. Chỉ dùng để đối chiếu chéo, và là nguồn của cái six-link chúng tôi trích ở stage map đỏ. Không phải file của tác giả guide."
  - title: "Patch note chính thức 3.30.0"
    url: https://www.pathofexile.com/forum/view-thread/4013680
    kind: official
    note: "Nguồn của ba thay đổi notable Pathfinder, thay đổi implicit của Apothecary's Gloves, mấy thay đổi về essence, và phần xác nhận rằng danh sách Pathfinder thứ hai nằm trong mục riêng của Ruthless."
