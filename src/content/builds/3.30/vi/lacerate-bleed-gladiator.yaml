        gems: [Enduring Cry, Urgent Orders Support, More Duration Support, War Banner]
      - name: Di chuyển
        gems: [Shield Charge, Faster Attacks Support, Maim Support, Culling Strike Support]
      - name: Guard
        gems: [Cast when Damage Taken Support, Vaal Molten Shell, Cold Snap, Purifying Flame]
    moveOn: "suppression đã cap, cây axe đã craft xong, và map Tier 16 thành chuyện thường ngày."
    details:
      - title: Bản này lấy của bạn gì và cho bạn gì
        body: |
          Từ file budget trung bình ở level 95, trên cây 3.28:

          - 5,942 life, 10,896 armour, 85% physical damage reduction.
          - 89.76% attack block, 87.75% spell block, 100% spell suppression.
          - Resistance 82/80/81, chaos 71%.
          - Cú physical hit lớn nhất sống sót được: 19,851, tăng từ 8,117 ở file budget thấp.
          - Khoảng 3.3 triệu bleed damage mỗi giây.

          Damage tăng khoảng hai phần ba. Phòng thủ tăng hơn gấp đôi. Đó mới là mục đích thật của chặng này.

          **Không nguồn nào định giá bộ gear này.** Những con số duy nhất tồn tại ở bất cứ đâu là 200 Chaos của tác giả video cho lúc bắt đầu Tier 16 và hơn 170 Divine cho nhân vật hoàn chỉnh của anh ta, cả hai đều là 3.29.
      - title: Những món gear thay đổi
        body: |
          - **Helmet, body, gloves, boots:** base armour-và-evasion hoặc evasion có spell suppression. Amulet trong file anoint notable Inveterate để lấy 15% cuối.
          - **Shield:** một cây [[Lacquered Buckler]] Shaper có "Recover 5% of Life when you Block" và suppression.
          - **Axe:** một cây [[Reaver Axe]] rare. Cây mẫu trong file có 144% increased physical damage, 29–52 added physical damage, 25% attack speed và một dòng craft 18–20% physical damage over time multiplier.
          - **Belt:** [[Ryslatha's Coil]].
          - **Ring:** life và resistance; file dùng Vermillion Ring.

          Lời khuyên của guide về cây axe unique: axe craft cuối cùng sẽ vượt nó, và bạn chỉ thay nó sau khi gear suppression đã vào chỗ.
      - title: Eldritch implicit trong file
        body: |
          - Helmet: increased curse effect của [[Vulnerability]], và physical damage from hits taken as lightning.
          - Body armour: nhận một frenzy charge mỗi 15 giây, và increased aura effect của [[Pride]].
          - Gloves: physical damage over time multiplier, và spell suppression.
          - Boots: increased action speed, và "Bleeding you inflict deals Damage faster".
      - title: Cây axe endgame được làm thế nào
        body: |
          Recipe được viết trong phần ghi chú của file budget cao của guide:

          1. Bắt đầu từ một cây axe có mod hybrid fractured: increased physical damage đi kèm accuracy.
          2. Roll nó bằng Deafening [[Essence of Contempt]], cái này bảo đảm added physical damage.
          3. Bạn đang tìm một tier cao của increased physical damage.
          4. Khi trúng và còn trống một suffix, bảo vệ prefix ở crafting bench rồi scour suffix.
          5. Gỡ dòng bảo vệ, thêm "Can have up to 3 Crafted Modifiers", rồi craft physical damage over time multiplier và attack speed.

          Tác giả dán nhãn kết quả là 'Somewhat "easy" to make'. **Cả base fractured lẫn mấy craft bench đều đã đổi trong 3.30**; xem mục 3.30 đổi gì cho build này bên dưới.
  - id: endgame
    phase: endgame
    image: ryslathas-coil
    title: Endgame
    levels: Tier 17, pinnacle boss và uber boss
    uses: >-
      Budget cao của guide ở level 100. [[Pride]] và [[Determination]] cùng
      lúc, [[Swift Affliction Support]] và [[Deadly Ailments Support]] trong
      main link, một [[Blood Sap Tincture]], và tattoo trên cây.
    changes: >-
