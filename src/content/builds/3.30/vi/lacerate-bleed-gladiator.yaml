        gems: [Vaal Molten Shell, Cast when Damage Taken Support, Lifetap Support]
    moveOn: "không còn chặng nào nữa. Thứ còn lại là một cây axe tốt hơn và trường phái kia của build."
    details:
      - title: Hiệu ứng thứ bảy trên gem
        body: |
          Kế hoạch của guide là imbue main gem bằng một hiệu ứng Fortify rồi rút [[Fortify Support]] khỏi six-link. Nó nói gem phải có sẵn 20% quality lúc bạn làm, nên hãy mua một viên 20% rồi imbue viên đó.

          Những kết quả yếu hơn mà nó chấp nhận: Deadly Ailments, Swift Affliction, Melee Physical Damage hoặc Volatility. Nó coi cả chuyện này là món thêm vào sau cùng, vì kết quả là ngẫu nhiên và tốn kém.

          Tác giả video thứ hai xếp hạng các lựa chọn y như vậy, Fortify đứng đầu, và thêm một lời cảnh báo mà chúng tôi nhắc lại: "I have no idea how rare or common, or expensive or cheap they will be." Anh ta không biết chúng sẽ hiếm hay nhiều, đắt hay rẻ.

          Guide gọi mấy món đó là Coin. **Trong 3.30 chúng là Soul Core, và giờ chúng có thể roll ra hiệu ứng xấu.**
      - title: Những ghi chú tác giả để lại trong file
        body: |
          - **Shield:** cây mẫu là shield synthesised chứ không phải Shaper, vì base synthesised rẻ vào lúc file được làm. Đó là một nhận định giá của 3.28.
          - **Dòng life** được cố ý giữ thấp "to simulate a sort of minimum", tức để mô phỏng một kiểu mức tối thiểu.
          - **[[The Light of Meaning]]:** bản damage nằm trong cây. Đổi sang bản chaos resistance thì mất "about 2.5 million dps, so roughly a fifth" (khoảng 2.5 triệu dps, tức tầm một phần năm) và được 73% chaos resistance.
          - **[[Sulphur Flask]]:** "doesn't truthfully do very much". Thật ra nó chẳng làm được bao nhiêu, cứ đổi thoải mái.
          - **[[Silver Flask]]:** giữ lại. "Lacerate feels pretty bad mechanically when the attackspeed drops too low."
          - **[[Progenesis]]:** "a massive upgrade defensively", một nâng cấp phòng thủ khổng lồ, nhưng ở đây nó không chạy vĩnh viễn được và nó không cho phép bạn bỏ chaos resistance. "Do not do that. You will die."
          - **Bốn passive point cuối:** life, qua Heart of the Warrior.
      - title: Trường phái kia ở tầm đỉnh
        body: |
          Build video 3.30 được xem nhiều nhất kết thúc với [[Crimson Dance]] và [[War of Attrition]], có [[Multistrike Support]] trong main link, và thêm [[Eviscerate]], một đòn retaliation dùng được sau khi bạn block.

          File của nó ở level 98, trên cây 3.29, hiện 4,773 life, 26,456 armour, 90% physical damage reduction, chaos resistance 75%, và bleed damage ở trần của game là 35.8 triệu mỗi giây.

          Hai điều cần dè chừng. Cũng file đó, ở trạng thái được lưu, hiện 70% attack block và 65% spell block, thấp hơn cái tiêu đề "Max Block" gợi ra; có thể chỉ đơn giản là điều kiện "blocked recently" chưa được tick. Và [[War of Attrition]] cần 100 giây ở trong presence của boss mới đạt đủ giá trị.

powerCurve: |
  Bốn thứ nhân build này lên, và chúng tới vào những thời điểm khác nhau.

  1. **Độ lớn của cú hit to nhất.** Physical damage của vũ khí, [[Volatility Support]], Physical Mastery, và về sau là [[Ryslatha's Coil]].
  2. **Hệ số bleed.** Dòng "more damage with bleeding" của chính gem, và damage over time multiplier từ axe, amulet, cây và endurance charge.
  3. **Aggravate.** [[Jagged Technique]], gấp ba cố định.
  4. **Block.** 50% từ [[Determined Survivor]], spell block qua [[Versatile Combatant]], rồi lucky từ [[More Than Skill]].

  **Ở level 30** bạn chưa có cái nào. Bạn là một nhân vật slam hai tay có [[Resolute Technique]] và xác quái phát nổ. Nó chơi y như mọi build leveling của Duelist, và nên như vậy.

  **Ở level 70** bạn vừa đổi nhân vật. Aggravate đã bật từ Cruel Labyrinth, còn shield, 50% block và skill thật thì tới cùng lúc ở tầm 68. Phòng thủ nhảy vọt ngay. Damage thì không, vì gem vẫn là bản gốc và axe thì nhặt được cây nào dùng cây đó. Chuẩn bị tinh thần cho một tuần bằng phẳng ở map trắng và map vàng, lúc bạn an toàn và hơi chậm.

  **Ở level 95** mọi hệ số đã vào chỗ và chúng chồng lên nhau: transfigured gem, axe craft, Coil, suppression. Mấy file được công bố đi từ khoảng 2 triệu lên 3.3 triệu giữa budget thấp và budget trung bình, rồi lên 14–18 triệu ở budget cao.

  **Cách đọc của chúng tôi, không phải của guide:** đây là build có một bậc nhảy đột ngột (cú đổi ở 68) rồi một con dốc dài, đều. Sau transfigured gem không còn gì đổi cách nó chơi. Mỗi món mua thêm là một con số phần trăm, và đó là lý do nó hợp với người ghét dựng lại nhân vật mà làm chán người muốn một cú lột xác.

upgrades:
  - step: "[[Lacerate of Haemorrhage]], ở 20% quality nếu được"
    why: >-
      Đứng đầu vì nó nhân mọi thứ đi sau nó: tới 132% more bleed damage so với
      88%, thêm 40% nữa từ quality, và nhiều hơn một phần ba số attack mỗi
      giây. Guide: "Should be acquired as early as possible."
  - step: "[[Jack, the Axe]]"
    why: >-
      Một vũ khí có bleed multiplier và 20% more bleed damage miễn phí, dùng
      được từ level 65. Nó đứng trước mọi thứ craft vì nó không cần craft gì.
      Guide gọi nó là rẻ; không đưa con số nào.
  - step: "Resistance đã cap, chaos resistance trên số không, và [[Kaom's Sign]]"
    why: >-
      File budget thấp nằm ở −6% chaos resistance và sống được một cú chaos
      hit 4,271. Không món damage nào đáng mua hơn việc vá chỗ đó. Kaom's Sign
      nằm trong bước này vì endurance charge của nó vừa là giảm damage vừa là
      bleed multiplier.
  - step: "Một cây shield có hồi life khi block"
    why: >-
      Bạn block gần chín trên mười cú đánh, nên 4–5% life mỗi lần block là
      nguồn hồi phục chính. Nó nằm dưới resistance vì hồi phục không cứu được
      bạn khỏi một cú hit giết thẳng.
  - step: "Một cây six-link"
    why: >-
      Thêm hai support cho main skill. [[The Bringer of Rain]] lấp khoảng
      trống, và đó là lý do bước này đứng thứ năm chứ không phải thứ hai.
  - step: "Spell suppression trên cả bốn slot armour, và [[Iron Reflexes]]"
    why: >-
      Guide đặt cái này trước vũ khí, nói thẳng ra bằng chữ. Giữa file budget
      thấp và file budget trung bình, damage tăng hai phần ba còn cú physical
      hit lớn nhất sống sót được tăng từ 8,117 lên 19,851.
  - step: "Một cây [[Reaver Axe]] craft"
    why: >-
      Bậc damage lớn nhất còn lại: vết bleed của bạn làm từ damage vũ khí. Đi
      sau suppression vì nó là món đơn lẻ đắt nhất và Jack đủ tốt để tới map
      đỏ.
  - step: "[[Ryslatha's Coil]]"
    why: >-
      Tới 40% more maximum physical attack damage, tức gần 40% more bleed.
      Đứng cuối trong số các nâng cấp thật chỉ vì guide đoán nó sẽ "far too
      expensive early". Sau món này: Eldritch implicit, gem imbue, một cây
      tincture.
    cost: "Không nguồn nào có con số. Nhân vật hoàn chỉnh duy nhất có giá là build video: hơn 170 Divine, 3.29."

play:
  mapping: |
    Di chuyển bằng [[Shield Charge]]. Trang gem của guide dùng nó; phần tổng quan và file budget cao thì thích [[Leap Slam]] hơn. Cả hai đều nằm trong cùng một four-link với [[Maim Support]] và [[Culling Strike Support]], nên skill di chuyển cũng maim và kết liễu luôn quái rare.

    Dừng cách pack một bước rồi đánh một hai cú. Sóng vươn xa hơn bạn tưởng. Mấy con chết đầu tiên phát nổ, và mấy cú nổ lo nốt phần còn lại của pack.

    Giữ [[Blood Rage]] chạy. Link guard tự kích khi bạn ăn damage. Guide nói chỉ cắm [[War Banner]] với mục tiêu trâu, vì giờ nó tích lên chậm.

    Bạn không cần chờ vết bleed. Một khi con quái rare đã bleed và dính curse, cứ đi tiếp và để nó chết sau lưng.
  bossing: |
    Trước trận: bấm [[Enduring Cry]]. Bạn bước vào mà không có endurance charge nào, và mỗi cái là 3% bleed multiplier. Một tác giả video viết rằng hô lúc mở đầu "is a good idea", và rằng về sau charge tự giữ được vì bạn block rất nhiều.

    Rồi curse bằng [[Vulnerability]], cắm [[War Banner]], và đánh. Đứng sao cho boss nằm trong cả hai lượt sóng.

    **Chỗ giằng co của build nằm ở đây.** Vết bleed giữ nguyên sức mạnh aggravated đầy đủ trong lúc bạn né, và đó là toàn bộ lý do lấy [[Jagged Technique]]. Nhưng bleed thì hết hạn, nên cứ vài giây bạn phải quay lại đánh tiếp. Còn [[More Than Skill]] chỉ làm block thành lucky "if you've Blocked Recently", nên sau một cú né dài, phòng thủ của bạn quay về block trơn cho cú hit đầu tiên. Điểm cuối này là cách đọc của chúng tôi từ dòng chữ của node; không guide nào nói rõ.

    Dùng utility flask để lấy armour, và để dành [[Vaal Molten Shell]] cho phase mà bạn biết là đau.

deaths:
  - situation: "Chaos damage trên setup rẻ: mây poison, boss map gây chaos damage, caustic ground."
    cause: >-
      File budget thấp có −6% chaos resistance và sống được một cú chaos hit
      4,271, so với khoảng 24,000 cho mỗi element. Block chẳng làm được gì
      trước damage over time.
    fix: >-
      Amethyst Ring và chaos resistance trên mọi món rare. Ghi chú của file:
      amethyst ring thì "infinitely better, but also infinitely more
      expensive", tốt hơn vô cùng mà cũng đắt hơn vô cùng. Tác giả của file
      budget cao thêm rằng một cây [[Progenesis]] "does not permit us to drop
      chaos resistance on gear".
  - situation: "Bị freeze hoặc chill giữa một pack."
    cause: >-
      Bạn đứng sát, mà nhân vật bị freeze thì không làm được gì.
    fix: >-
      Luật của guide: miễn freeze trên một cây flask, "consider this
      mandatory", cho tới khi Brine King được nâng cấp. Sau đó đổi cây flask
      ấy sang chống ignite hoặc shock.
  - situation: "Đúng cái cú hit mà bạn không block."
    cause: >-
      Block là xác suất. Trong file budget thấp, một cú physical hit không
      block được trên khoảng 8,100 sẽ giết một nhân vật 4,025 life có 68%
      physical reduction.
    fix: >-
      Một cây flask armour luôn bật, [[Molten Shell]], và [[Fortify Support]]
      trong main link. Budget trung bình mới là cách vá thật: 85% reduction và
      sống được cú hit 19,851.
  - situation: "Mấy giây đầu của một trận boss, hoặc khoảnh khắc ngay sau một cú né dài."
    cause: >-
      Chưa có endurance charge, và block lucky cần một lần block gần đây. Đây
      là cách đọc của chúng tôi về Deflection và [[More Than Skill]], không
      phải một câu trong guide nào.
    fix: >-
      [[Enduring Cry]] trước khi lao vào, và nếu được thì cố ý ăn mấy cú hit
      đầu từ thứ gì đó nhỏ.

troubleshooting:
  - symptom: "Bleed của tôi gần như chẳng gây gì, trên một nhân vật mà một tiếng trước còn ổn."
    cause: >-
      Bạn đang chơi [[Lacerate]] gốc ở Sand Stance. Gem gốc chỉ gây Bleeding,
      và chỉ có bleed multiplier của nó, ở Blood Stance.
    fix: >-
      Bấm [[Blood and Sand]] một lần để quay lại. Transfigured gem không có
      stance và dứt hẳn vấn đề này.
  - symptom: "Lacerate thấy chậm và vụng."
    cause: >-
      Attack speed. Lacerate gốc chém ở 60% tốc độ vũ khí còn transfigured gem
      ở 80%. Tác giả của file budget cao viết rằng nó "feels pretty bad
      mechanically when the attackspeed drops too low".
    fix: >-
      Giữ một cây [[Silver Flask]], tìm attack speed trên axe và gloves, và
      nâng cấp gem. Cả hai build video còn đi xa hơn và cắm
      [[Multistrike Support]] vào main link.
  - symptom: "Map thì tan chảy, boss thì đánh mãi không chết."
    cause: >-
      Trong map phần lớn damage là [[Gratuitous Violence]]: mấy cú nổ bằng một
      phần năm máu của mỗi con quái. Boss thì chẳng được cái nào trong đó. Nó
      chỉ ăn đúng một vết bleed của bạn, mà lúc mở trận bạn lại không có
      endurance charge.
    fix: >-
      [[Enduring Cry]], [[Vulnerability]] và [[War Banner]] ở mọi trận boss.
      Sau đó là chuyện damage vũ khí: vết bleed làm từ cận trên của cú hit.
  - symptom: "Spell block của tôi thấp hơn attack block rất xa."
    cause: >-
      [[Versatile Combatant]] cho 2% spell block cho mỗi 1% attack block
      *vượt cap*. Nếu attack block của bạn chỉ vừa chạm cap thì bạn chẳng được
      gì từ nó.
    fix: >-
      Lấy Shield Mastery và Deflection, cùng Block Mastery biến attack block
      thành spell block. File budget thấp vẫn kết thúc thiếu 8 điểm ở spell;
      file budget trung bình thì lấp được khoảng cách đó.
  - symptom: "Mọi thứ ổn cho tới map đỏ."
    cause: >-
      Nhân vật budget thấp có 4,025 life và không có spell suppression. Guide
      của nó tự nói vậy: "We're foregoing suppression early on in favor of
      damage."
    fix: >-
      Gear budget trung bình: suppression trên bốn slot armour và
      [[Iron Reflexes]]. Nếu bạn muốn sớm hơn, file bảo lấy wheel Entrench
      thay cho mấy node damage.

patch:
  - note: >-
      **Không gì trong build này thay đổi.** Chúng tôi đã tìm trong patch note
      chính thức các từ Lacerate, bleeding, aggravate, block,
      [[Volatility Support]], [[Jack, the Axe]] và [[Ryslatha's Coil]]. Không
      cái nào xuất hiện trong các phần của game thường. Lần duy nhất Lacerate
      được nhắc tới là một bản sửa lỗi cho mô tả của một mod Crucible cũ.
  - entry: ruthless-changes
    note: >-
      **Đừng tin mấy lời nói block của Gladiator bị cắt xuống 40%.** Chữ
      "Gladiator" xuất hiện một lần trong patch note, bên trong phần Ruthless,
      và nó chỉ notable cùng tên của Scion Ascendant. Dữ liệu cây của chính
      GGG cho thấy [[Determined Survivor]] của Duelist là 50% trong game
      thường và 40% chỉ trong file Ruthless.
  - entry: special-base-implicits
    note: >-
      **Một buff nhỏ và một nerf nhỏ cho gear mà guide nêu tên.**
      [[Apothecary's Gloves]], món guide liệt kê như một lựa chọn đáng nhắc
      tới, giờ có implicit +14–18% damage over time *multiplier*, trước đây là
      increased damage over time. Đó là chỉ số build này chồng, nên chúng là
      lựa chọn tốt hơn mức phần chữ của guide giả định; đây là cách đọc của
      chúng tôi. Amethyst Ring, ring endgame của guide, tụt xuống +13–19%
      chaos resistance từ +17–23%.
  - entry: royal-visage-soul-cores
    note: >-
      **Kế hoạch imbue gem rủi ro hơn.** Mấy "Coin" của guide giờ là Soul
      Core, và chúng có thể roll ra một trong một nhóm hiệu ứng support xấu.
      Đừng dùng lên một viên [[Lacerate of Haemorrhage]] 20% quality mà bạn
      không thay được.
  - entry: fractured-items-rarer
    note: >-
      **Cây axe endgame bắt đầu từ một base hiếm hơn.** Recipe được công bố mở
      đầu bằng một cây axe fractured, mà đồ fractured giờ đến từ ít nguồn hơn
      hẳn. Tính trước là base sẽ đắt hơn league trước. Giá chưa ổn định.
  - entry: meta-crafting-costs
    note: >-
      **Cũng recipe đó bảo vệ prefix ở crafting bench.** Mấy chi phí bench đó
      đã đổi trong 3.30. Chưa ai công bố lại cách craft với con số mới.
  - entry: harvest-rework
    note: >-
      **Một phương án dự phòng trong file chưa được kiểm chứng.** Nếu
      [[Jack, the Axe]] đắt, tác giả gợi ý Jagged Fossil hoặc reforge lấy mod
      physical ở bench Harvest. Harvest được làm lại trong 3.30 và chúng tôi
      không xác nhận được craft đó còn nguyên.
  - entry: league-fates
    note: >-
      **Hợp, nhưng chưa ai thử.** League làm boss khu vực khó hơn và trả
      thưởng cho việc giết chúng. Một vết bleed giữ nguyên sức mạnh trong lúc
      bạn né mấy mối nguy mới, sau 88% block, là đang chĩa đúng hướng. Chưa ai
      đo cả.

strengths:
  - "Khởi đầu từ con số không: gem là quest reward và block đến từ ascendancy."
  - "Khoảng 88% attack block trên bản rẻ nhất được công bố, 90% và 88% trên bản kế."
  - "Bleed aggravated bảo đảm: đủ damage lên con boss đứng yên, và ngay cú hit đầu tiên sau mỗi lần né."
  - "Vươn xa hơn melee thường, nên bạn đánh từ cách một bước chân."
  - "Không phải lo accuracy hay crit trên gear."
  - "Đường nâng cấp dài và đều, không có lần dựng lại thứ hai sau level 68."
weaknesses:
  - "Nhiều nút: guide liệt kê main skill, Molten Shell, Blood Rage, một curse bấm tay và War Banner."
  - "Chaos damage là lớp mỏng trên bản rẻ."
  - "Campaign được chơi như một build khác, và cú đổi ở 68 là một lần respec thật sự."
  - "Không có burst. Bleed trừ máu theo nhịp riêng của nó, nên mấy cửa sổ damage ngắn là phí với bạn."
  - "Resolute Technique chặn trần scale của damage; đến cả tác giả guide cũng gọi bản đỉnh của nó là file dành cho người mê."
  - "Guide viết tốt nhất là đồ cũ dưới banner mới, và tự mâu thuẫn với chính các file của nó về trần damage."
avoidIf: >-
  Chọn build khác nếu bạn muốn chạy map nhanh bằng một nút, hoặc muốn xóa boss
  trong một cú burst rồi đi. Bỏ qua nếu bạn ghét respec giữa campaign. Còn nếu
  bạn muốn một Gladiator chuyên slam, build Earthquake trên site này dùng cùng
  ascendancy với một guide thật sự cập nhật.

