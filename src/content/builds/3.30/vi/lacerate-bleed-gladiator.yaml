name: Lacerate Bleed Gladiator
tagline: >-
  Hai nhát chém rộng từ cách một sải tay đặt một vết bleed khổng lồ lên mọi thứ
  trước mặt bạn, sau một cây shield block gần chín trên mười cú đánh. Khởi đầu
  gần như không cần gear.
class: Duelist
ascendancy: Gladiator
role: starter
budget: starter
budgetNote: >-
  **Guide viết chính không nêu một cái giá nào cả.** Nó chỉ nói build
  "requires nothing to function" (không cần gì để chạy), rằng [[Jack, the Axe]]
  "is cheap even with a fortify corruption" (rẻ kể cả khi có corruption
  fortify), và rằng [[Ryslatha's Coil]] thì "likely far too expensive early"
  (nhiều khả năng quá đắt ở giai đoạn đầu). Nguồn duy nhất có con số là phần mô
  tả của một video đăng hai ngày trước league: map Tier 16 "for 200 Chaos
  Orbs", scale "up to over 170 divines". Mấy con số đó được viết khi 3.30 chưa
  có nền kinh tế nào, nên chúng là **giá 3.29** và chỉ để tham khảo thô.
mainSkill: Lacerate of Haemorrhage
image: lacerate-of-haemorrhage
hero: art-gladiator
tags: [Melee, Bleed, Block, Tanky]
ratings: { clear: 3, bossing: 4, survivability: 5, ease: 3 }
verified: "2026-11-14"
confidence: mixed
confidenceNote: >-
  **Bốn điểm số là của chúng tôi.** Không nguồn nào công bố bảng điểm cho build
  này. Cơ chế thì đã được kiểm chứng: bleed [[Gladiator]] là league starter
  nhiều năm nay và 3.30 không đụng tới nó. Nguồn thì yếu hơn vẻ ngoài của
  chúng. Guide PoE Vault mang banner 3.30 đề ngày 12/11/2026, nhưng mục duy
  nhất trong changelog của nó là từ tháng 3/2020 và các file Path of Building
  của nó dùng passive tree 3.27 và 3.28. Hai creator đăng video 3.30 ngày
  11/11; chúng tôi đọc phần mô tả và giải mã file Path of Building của họ (cây
  3.29) nhưng không xem video. Chưa ai chơi 3.30 vào lúc bất kỳ thứ nào trong
  số này được viết ra. Mọi con số damage, life và giá bên dưới đều thuộc thời
  3.29 hoặc cũ hơn.
modes:
  ssf: >-
    Chơi được. Nguyên văn của guide là build "requires nothing to function":
    skill gem là quest reward, block đến từ ascendancy, và
    [[Resolute Technique]] gỡ luôn accuracy khỏi gear của bạn. Bạn nâng cấp gem
    ở [[Divine Font]] trong Labyrinth. [[Jack, the Axe]] và [[Ryslatha's Coil]]
    là đồ drop mà có khi bạn chẳng bao giờ thấy; phương án dự phòng được công
    bố cho cây axe là một cây rare craft bằng Jagged Fossil.
  hardcore: >-
    Không nguồn nào đưa ra kết luận, và file Path of Building chính mở đầu bằng
    câu "We're on softcore." Cách đọc của chúng tôi: block thì đủ mạnh, nhưng
    file budget thấp có 4,025 life, không có spell suppression và −6% chaos
    resistance. Lấy phương án suppression của guide từ sớm và vá chaos
    resistance trước khi bạn tin nó.

idea: |
  [[Lacerate of Haemorrhage]] chém hai nhát. Mỗi nhát phóng ra một lượt sóng rộng, và con quái đứng ở chỗ hai lượt sóng giao nhau thì ăn cả hai cú hit. Sóng vươn xa hơn hẳn tầm vũ khí của bạn, nên đây là melee chơi từ cách một bước chân.

  Bạn không cố giết bằng cú hit. Mỗi cú hit đều có thể gây Bleeding, một hiệu ứng physical damage over time lớn nhỏ theo cú hit đã gây ra nó. Gem nhân vết bleed đó lên: tới 132% more damage with bleeding ở level 20, và thêm 40% more nữa từ 20% quality.

  Bình thường một vết bleed chỉ gây đủ damage khi con quái đang đi. [[Jagged Technique]] bỏ điều kiện đó. Mọi vết bleed bạn gây ra đều **aggravated**, nghĩa là nó luôn coi như con quái đang di chuyển. Đó là gấp ba damage, lên một con boss đứng yên.

  Quái chết trong lúc đang bleed thì nổ, gây damage bằng một phần năm máu của chúng ([[Gratuitous Violence]]), và đó là cách bạn clear map.

  Nửa còn lại của [[Gladiator]] là cây shield. Shield nào cũng cho bạn 50% block, phần attack block dư tràn sang spell block, và điểm ascendancy cuối cùng khiến mỗi lần block được roll hai lần rồi giữ kết quả tốt hơn.

chain:
  - label: Chém hai nhát
    text: "[[Lacerate of Haemorrhage]] phóng ra hai lượt sóng. Quái đứng trong vùng giao nhau ăn cả hai cú hit. Skill cần axe hoặc sword một tay."
  - label: Bleed
    text: "Mỗi cú hit có cơ hội gây Bleeding. Chỉ vết bleed mạnh nhất của bạn trên một con quái mới gây damage, nên hit to mới quan trọng còn hit nhanh thì không."
  - label: Aggravate
    text: "[[Jagged Technique]] làm mọi vết bleed thành aggravated: nó luôn gây damage như thể con quái đang di chuyển, tức gấp ba tốc độ bình thường."
  - label: Nổ và block
    text: "[[Gratuitous Violence]] cho nổ những con quái đang bleed mà bạn giết. [[Determined Survivor]] và [[More Than Skill]] cho bạn 50% block từ bất kỳ shield nào, roll hai lần."

chainDetails:
  - title: Chỉ vết bleed lớn nhất của bạn mới tính
    body: |
      Câu chữ của PoEDB về Bleeding là nó "deals Physical Damage over time, based on the base Physical Damage of the Skill". Vết bleed thứ hai trên cùng một con quái không cộng vào vết thứ nhất. Vết mạnh hơn gây damage còn vết yếu hơn thì nằm chờ.

      Nên build không quan tâm cú hit trung bình của bạn. Nó quan tâm cận trên của dải damage, vì sớm hay muộn bạn cũng roll cao và vết bleed đó mới là vết trừ máu.

      Ba món có mặt trong mọi bản được công bố đều vì lý do này:

      - [[Volatility Support]]: 30–58% more maximum attack damage, 50–69% less minimum.
      - Physical Mastery "10% more Maximum Physical Attack Damage".
      - Về sau là [[Ryslatha's Coil]]: tới 40% more maximum và tới 40% less minimum physical attack damage.

      Mấy cú roll thấp mà chúng tạo ra thì đơn giản là bị ghi đè.
  - title: Bản transfigured của gem đổi những gì
    body: |
      [[Lacerate]] gốc có hai stance. Nó chỉ gây được Bleeding ở Blood Stance, nơi nó có 25% chance to bleed và 50–88% more damage with bleeding. Nó attack ở 60% tốc độ vũ khí của bạn.

      [[Lacerate of Haemorrhage]] bỏ luôn stance. Nó luôn có 25% chance đó và 75–132% more damage with bleeding, cộng tới 40% more từ quality, và attack ở 80% base speed. Đổi lại nó chỉ chạy với axe hoặc sword một tay.

      Mấy con số đó lấy từ PoEDB. Con "172% more" của guide là giá trị level 20 cộng bonus của 20% quality. Guide gọi gem này là nâng cấp thẳng so với bản gốc và nói nó "should be acquired as early as possible", tức lấy càng sớm càng tốt.

      **Quality trên gem này quan trọng hơn thường lệ.** Gem nằm trong socket đúng màu của nó còn được thêm chút quality, nên hãy cắm nó vào socket xanh lá.
  - title: "Hai trường phái: Jagged Technique hay Crimson Dance"
    body: |
      Guide viết và một trong hai build video lấy [[Jagged Technique]]. Một vết bleed aggravated khổng lồ, được mỗi cú hit làm mới.

      Build video 3.30 được xem nhiều nhất thì làm ngược lại. Cây của nó lấy keystone [[Crimson Dance]] và notable ascendancy [[War of Attrition]], và bỏ qua Jagged Technique.

      Dòng chữ trên cây hiện hành giải thích cuộc đánh đổi. Crimson Dance: "You can inflict Bleeding on an Enemy up to 8 times", nhưng bleeding của bạn "cannot be Aggravated" và gây 50% less damage. War of Attrition: 1% more damage lên quái rare và unique cho mỗi giây chúng đã ở trong presence của bạn, tối đa 100%.

      Nên bản đó chồng tám vết bleed yếu hơn và càng mạnh khi boss sống càng lâu. Tác giả của nó nói nó chạm trần damage over time của game, và file của anh ta đúng là hiện chính xác con số đó, 35.8 triệu mỗi giây, trên bộ gear anh ta định giá hơn 170 Divine (3.29).

      **Bài này đi theo bản Jagged Technique.** Đó là bản có guide viết và có cây cho từng khoảng level, và nó đủ sức mạnh ngay cú hit đầu tiên sau mỗi lần né. Chúng tôi không thử bản nào cả.
  - title: Một cây shield, hay hai vũ khí
    body: |
      [[Determined Survivor]] có hai dòng: "Gain 50% Chance to Block from Equipped Shield instead of the Shield's value", và "Inherent Bonuses from Dual Wielding are doubled".

      Guide viết dùng dòng thứ nhất. Shield nào cũng cho 50% block, nên bạn chọn shield theo các mod khác của nó.

      Một build video dùng dòng thứ hai với một cây axe và cây sword [[Rigwald's Command]]. Tác giả của nó viết rằng cách này "gives us more damage but requires slightly more investment to cap block": nhiều damage hơn, nhưng phải đầu tư thêm một chút mới cap được block. File của anh ta hiện cùng một con số 87.75% attack và spell block ở cả hai cách.

      Bắt đầu bằng shield. Nó rẻ hơn và cả hai mốc trong guide viết đều giả định bạn cầm shield.
  - title: Ở đây endurance charge là damage
    body: |
      Bleeding Mastery cho "+3% to Damage over Time Multiplier for Bleeding per Endurance Charge". Mọi cây được công bố đều lấy nó.

      Charge đến từ notable Deflection (25% cơ hội nhận một charge khi bạn block) và từ [[Enduring Cry]]. Khi đứng giữa pack bạn block liên tục và luôn đầy charge. Lúc mở đầu một trận boss thì bạn không có cái nào.

      Đó là lý do guide đánh giá [[Kaom's Sign]] cao như vậy: ring này thêm một maximum endurance charge, mà ở đây một charge vừa là damage vừa là phòng thủ.
  - title: Blood Magic hay mana, các nguồn nói khác nhau
    body: |
      Cây budget thấp và budget trung bình của guide lấy [[Blood Magic]]. Bạn không có mana, skill tốn máu, và [[Pride]] chạy qua [[Eternal Blessing Support]] mà không reserve gì. Guide gọi đó là aura duy nhất của nó.

      File budget cao của cùng guide đó thì bỏ Blood Magic và chạy [[Pride]] với [[Determination]] bằng mana. Cả hai build video đều ở lại với mana từ đầu.

      Còn có một chỗ chao đảo ngay trong file leveling: cây cho level 52–67 có Blood Magic, cây kế thì không, và cây budget thấp hoàn chỉnh lại có. **Đi theo cây hoàn chỉnh, và kiểm xem bạn thật sự đang có keystone nào trước khi chép một bộ gem.**
  - title: Một con số mà guide nói sai về chính nó
    body: |
      Phần tổng quan của guide nói kể cả với gear tốt nhất, damage cũng "unlikely to exceed ~5m DPS", tức khó mà vượt quá khoảng 5 triệu DPS.

      Hai file Path of Building budget cao của chính nó thì hiện 14.4 và 17.8 triệu bleed damage mỗi giây, và một ghi chú bên trong một file định giá riêng một viên jewel ở "about 2.5 million dps, so roughly a fifth".

      Phần chữ và mấy cái file không thể cùng đúng. File thì mới hơn (cây 3.28; phần chữ có trước chúng), nên chúng tôi coi dòng 5 triệu là đã cũ. Tất cả đều là số Path of Building trên cây cũ, với giả định quái đang bleed, bị maim và bị curse.

mandatory:
  - term: Lacerate of Haemorrhage
    why: >-
      Skill chính. Tới 132% more damage with bleeding mà không cần stance, và
      attack nhanh hơn gem gốc.
    detail: >-
      Đây là transfigured gem: bạn lấy nó từ [[Divine Font]] ở cuối Labyrinth,
      hoặc từ người chơi khác. [[Lacerate]] gốc là quest reward level 12 của
      Duelist và gánh bạn tới lúc đó. Nó đòi axe hoặc sword một tay, và đó là
      lý do bạn chỉ đổi sang nó khi đã cầm shield.
  - term: Jagged Technique
    why: >-
      "Bleeding you inflict is Aggravated." Gấp ba bleed damage lên mọi thứ,
      đang chạy hay đứng yên cũng vậy.
    detail: >-
      Một build video 3.30 thay nó bằng [[Crimson Dance]] và
      [[War of Attrition]]. Xem phần hai trường phái ở trên.
  - term: Gratuitous Violence
    why: >-
      Quái đang bleed mà bạn giết thì nổ, gây physical damage bằng 20% máu tối
      đa của chúng. Đây là phần clear map của bạn.
  - term: Determined Survivor
    why: >-
      50% block chance từ bất kỳ shield nào, mặc kệ shield ghi gì. Bạn không
      bao giờ phải đi săn dòng block.
  - term: More Than Skill
    why: >-
      "Chance to Block Attack or Spell Damage is Lucky if you've Blocked
      Recently." File budget thấp hiện 87.75% attack block khi có nó.
  - term: Versatile Combatant
    why: >-
      Hạ maximum block của bạn 10%, và cho 2% spell block cho mỗi 1% attack
      block vượt cap. Đó là cách spell block đuổi kịp.
    detail: >-
      Nó chỉ có lời khi attack block của bạn vượt cap. Mấy cái cây tới được đó
      nhờ Shield Mastery, Deflection và Aggressive Bastion.
  - term: Resolute Technique
    why: >-
      Cú hit của bạn không bị evade và không bao giờ crit. Bleed vốn dĩ không
      crit được, nên bạn chẳng mất gì và không cần accuracy trên gear.
  - term: Brutality Support
    why: >-
      More physical damage, và skill không gây loại damage nào khác. Có trong
      cả bốn six-link được công bố.
  - term: Melee Physical Damage Support
    why: >-
      Có trong cả bốn six-link được công bố. Guide thích nó hơn
      [[Ruthless Support]]: damage ngang ngửa, mà ít điều kiện hơn.
  - term: Volatility Support
    why: >-
      30–58% more maximum attack damage đổi lấy 50–69% less minimum. Chỉ vết
      bleed lớn nhất mới tính, nên mặt trái chẳng tốn gì.
    detail: >-
      Duelist mua nó từ Yeena ở Act 2 sau quest Sharp and Cruel. Cần level 18.
  - term: Pride
    level: recommended
    why: >-
      Aura damage trong mọi bản. Quái ở gần ăn thêm physical damage.
  - term: Vulnerability
    level: recommended
    why: >-
      Quái bị curse ăn thêm physical damage. Guide liệt kê một "manual curse"
      trong số các nút bạn bấm.
  - term: Enduring Cry
    level: recommended
    why: >-
      Endurance charge theo yêu cầu. Link với [[Urgent Orders Support]] để hô
      cho nhanh. Bấm nó lúc mở đầu mọi trận boss.
  - term: Jack, the Axe
    level: recommended
    why: >-
      Vũ khí khởi đầu của guide: 130–150% increased physical damage và +25–35%
      bleed damage over time multiplier, và nó cấp một skill cho 20% more
      damage with bleeding.
    detail: >-
      Nó đòi level 65, vừa khớp với cú đổi sang một tay ở tầm 68. Ghi chú của
      tác giả: "incredibly potent early on. Consider grabbing this if it is
      cheap." Phương án dự phòng của anh ta là một cây axe rare làm bằng Jagged
      Fossil.
  - term: Kaom's Sign
    level: recommended
    why: >-
      +1 maximum endurance charge trên một cây ring. Mỗi charge là 3% bleed
      multiplier và một ít giảm damage.
    detail: >-
      Guide nói: nếu nó thành ra quá đắt thì đeo Amethyst Ring thay.
  - term: Ryslatha's Coil
    level: recommended
    why: >-
      Belt tốt nhất trong mọi nguồn. Nó nới rộng dải physical damage của bạn,
      mà cận trên của dải đó chính là thứ làm nên vết bleed.
    detail: >-
      Guide cảnh báo nó "likely far too expensive early" và gợi ý
      [[Belt of the Deceiver]] hoặc một cây Stygian Vise rare cho tới lúc đó.

labs:
  - lab: Normal
    node: Gratuitous Violence
    why: "Guide đưa thứ tự mà không nêu lý do. Cây leveling của nó chạy lab này ở tầm level 33. Nổ xác có ích ngay; mấy node block thì chẳng làm gì cho tới khi bạn cầm shield."
  - lab: Cruel
    node: Jagged Technique
    why: "Level 44–52 trong các cây của guide. Từ đây vết bleed của bạn luôn aggravated."
  - lab: Merciless
    node: Determined Survivor
    why: "Level 52–67 trong các cây của guide. Đây là tín hiệu để chuyển sang axe một tay và shield. Một build video lấy cái này thứ hai và Jagged Technique thứ ba."
  - lab: Eternal
    node: More Than Skill
    why: "Block lucky. Lấy cuối, vì nó nhân lên một block chance phải có sẵn trước đã."

stages:
  - id: acts-1-3
    phase: early
    image: sunder
    title: Act 1–3
    levels: Level 1–33
    uses: >-
      Một vũ khí hai tay và một skill slam. [[Ground Slam]] từ level 1, rồi
      [[Sunder]] từ level 12. Bạn chưa chơi Lacerate đâu.
    changes: >-
      Sau Chamber of Sins ở Act 2 bạn thêm [[Blood Rage]],
      [[Herald of Purity]] và [[Warlord's Mark]]. Normal Labyrinth cho bạn
      [[Gratuitous Violence]], và cây lấy luôn [[Resolute Technique]] cùng lúc
      đó.
    links:
      - name: Act 1, trước Merveil
        gems: [Ground Slam, Ruthless Support, Maim Support]
      - name: Sau Merveil
        gems: [Sunder, Maim Support, Ruthless Support]
      - name: Four-link Act 2
        gems: [Sunder, Close Combat Support, Chance to Bleed Support, Cruelty Support]
      - name: Di chuyển và warcry
        gems: [Leap Slam, Faster Attacks Support, Frostblink, Intimidating Cry]
      - name: Buff
        gems: [Blood and Sand, War Banner, Blood Rage, Herald of Purity, Warlord's Mark]
    moveOn: "Sunder đã nằm trong four-link, Normal Labyrinth đã xong, và bạn đang ở Act 4."
    details:
      - title: Ba nguồn, ba đường lên level
        body: |
          Chúng đồng ý về đích đến chứ không đồng ý về đường đi.

          - **Guide viết:** slam hai tay suốt campaign, đổi sang Lacerate sau Merciless Labyrinth, ở tầm level 68. Đây là lộ trình ở trên. File của nó nói chọn Sunder hay Ground Slam là "100% preference", tức hoàn toàn tùy sở thích.
          - **Một build video:** cũng mấy skill slam đó, rồi [[Bladestorm]] từ Act 6, rồi [[Lacerate]] ở Act 10.
          - **Build video còn lại:** [[Splitting Steel]] trước, rồi Lacerate gốc từ level 12 "until you can either farm lab or trade for the alternate gem", tức cho tới khi bạn farm được lab hoặc trade được viên gem kia.

          Chúng tôi theo guide viết vì nó là cái duy nhất có cây cho từng khoảng level. Nếu bạn thích học skill thật từ sớm thì đường thứ ba là chính đáng: Lacerate gốc chạy được với axe và sword hai tay.
      - title: Gem lấy ở đâu
        body: |
          - **Level 4:** [[Blood and Sand]], reward của Duelist cho Breaking Some Eggs.
          - **Level 12:** [[Lacerate]], reward của Duelist cho The Siren's Cadence. Cứ lấy nó kể cả khi bạn lên level bằng Sunder, để nó ăn experience trong một socket trống.
          - **Level 18:** [[Volatility Support]], mua từ Yeena sau Sharp and Cruel ở Act 2.

          File của guide ghi chú rằng Blood Rage, Herald of Purity và cái mark đều tới cùng lúc sau Chamber of Sins.

          **Guide không nói Duelist lấy Ground Slam hay Sunder ở đâu.** File của nó cứ thế mở đầu bằng hai skill đó. Chúng tôi sẽ không đoán vendor.
      - title: Mẹo đánh Brutus
        body: |
          Bộ gem Act 1 của guide có một link phụ nhỏ dán nhãn "Grab these for Brutus": [[Double Strike]] với [[Chance to Bleed Support]]. Đó là công cụ single-target cho đúng một trận, trên một nhân vật mà cú slam còn chậm ở level đó.
  - id: acts-4-10
    phase: early
    image: jagged-technique
    title: Act 4–10
    levels: Level 33–68
    uses: >-
      Vẫn [[Sunder]] trên vũ khí hai tay. Từ Act 5, [[Pride]] link với
      [[Eternal Blessing Support]] thay cho [[Blood and Sand]] và
      [[Herald of Purity]].
    changes: >-
      Thêm hai lab: [[Jagged Technique]] ở level 44–52 và
      [[Determined Survivor]] ở 52–67. Rồi tới cú respec lớn duy nhất của
      build: axe một tay, shield, và [[Lacerate]].
    links:
      - name: Main skill
        gems: [Sunder, Close Combat Support, Chance to Bleed Support, Cruelty Support]
      - name: Aura từ Act 5
        gems: [Pride, Eternal Blessing Support]
      - name: Buff
        gems: [War Banner, Intimidating Cry, Blood Rage, Warlord's Mark]
      - name: Sau cú đổi
        gems: [Lacerate, Volatility Support, Melee Physical Damage Support, Brutality Support]
      - name: Di chuyển sau cú đổi
        gems: [Shield Charge, Faster Attacks Support, Culling Strike Support, Maim Support]
      - name: Charge sau cú đổi
        gems: [Enduring Cry, Urgent Orders Support]
    moveOn: "Merciless Labyrinth đã xong, bạn cầm axe một tay với shield, và mấy passive hai tay đã được hoàn điểm."
    details:
      - title: Cú đổi, từng bước một
        body: |
          File leveling của guide có hẳn một cây đặt tên cho việc này: "Clean up. Unspec 2H nodes, go shield." Làm trong một lần ngồi:

          1. Lấy [[Determined Survivor]] ở Merciless Labyrinth.
          2. Cầm một cây axe một tay và shield nào cũng được. Chỉ số block của chính cây shield không quan trọng.
          3. Hoàn điểm mấy notable damage hai tay và Two Hand Mastery.
          4. Lấy [[Versatile Combatant]], Shield Mastery ("+1% Chance to Block Attack Damage per 5% Chance to Block on Equipped Shield"), Block Mastery ("+1% Chance to Block Spell Damage per 5% Chance to Block Attack Damage") và Axe Mastery ("Bleeding you inflict deals Damage 15% Faster").
          5. Cắm [[Lacerate]] vào bộ link tốt nhất của bạn.

          [[Jack, the Axe]] đòi level 65, nên nó có thể chính là cây axe bạn đổi sang.
      - title: Lacerate gốc cần Blood Stance
        body: |
          Khi chưa có transfigured gem, gem gốc chỉ gây bleed ở Blood Stance. PoEDB ghi chú rằng mặc định bạn đang ở Blood Stance.

          Guide nói thẳng về stance còn lại: lỡ bước sang Sand Stance thì damage "feel really bad". Nếu damage của bạn biến mất, kiểm xem bạn có lỡ tay bấm [[Blood and Sand]] không.
      - title: Link guard lúc này chưa bắt buộc
        body: |
          Bộ gem lúc đổi của guide thêm một link [[Cast when Damage Taken Support]] level thấp với [[Molten Shell]], [[Purifying Flame]] và [[Cold Snap]]. Nhãn của chính nó ghi: "Spells not important yet. Ditch if no blue sockets." Tức là mấy spell này chưa quan trọng, không có socket xanh dương thì bỏ.
      - title: Bandit và Pantheon
        body: |
          Guide đưa cả hai lựa chọn: giết cả ba bandit để lấy passive point, hoặc giúp **Alira** để lấy 15% tất cả elemental resistance, cái mà nó gọi là lựa chọn cho league start. Sau này đổi được.

          Pantheon: **Soul of the Brine King** làm major, để chống freeze và chill. **Soul of Abberath** làm minor, chống burning ground.
  - id: early-maps
    phase: early
    image: determined-survivor
    title: Map đầu
    levels: Map trắng và map vàng
    uses: >-
      [[Lacerate]] trong bộ link tốt nhất của bạn, [[Jack, the Axe]] nếu kiếm
      được, một cây shield, [[Kaom's Sign]], và đồ armour rare có life với
      resistance.
    changes: >-
      Lấy [[Lacerate of Haemorrhage]] sớm nhất có thể. Chạy Eternal Labyrinth
      lấy [[More Than Skill]]. Thêm [[Fortify Support]] và [[Cruelty Support]]
      khi có thêm link.
    links:
      - name: Main skill (six-link)
        gems: [Lacerate of Haemorrhage, Volatility Support, Brutality Support, Melee Physical Damage Support, Cruelty Support, Fortify Support]
      - name: Aura
        gems: [Pride, Eternal Blessing Support]
      - name: Di chuyển
        gems: [Shield Charge, Faster Attacks Support, Maim Support, Culling Strike Support]
      - name: Charge và buff
        gems: [Enduring Cry, Urgent Orders Support, Blood Rage, War Banner]
      - name: Guard
        gems: [Cast when Damage Taken Support, Molten Shell, Purifying Flame, Cold Snap]
