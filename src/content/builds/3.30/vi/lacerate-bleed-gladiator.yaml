      suppression, một cây [[Reaver Axe]] craft, [[Ryslatha's Coil]], và một
      cây [[Lacquered Buckler]] có hồi life khi block.
    changes: >-
      Spell suppression đi từ con số không lên 100%, và [[Iron Reflexes]] biến
      evasion trên bộ gear mới thành armour. Rồi tới vũ khí. Thứ tự của guide
      rất rõ: gear suppression trước cây axe.
    links:
      - name: Main skill
        gems: [Lacerate of Haemorrhage, Melee Physical Damage Support, Brutality Support, Volatility Support, Cruelty Support, Fortify Support]
      - name: Aura
        gems: [Pride, Eternal Blessing Support]
      - name: Curse và buff
        gems: [Vulnerability, Enhance Support, Blood Rage]
