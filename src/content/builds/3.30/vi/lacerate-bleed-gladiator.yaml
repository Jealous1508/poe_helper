        gems: [Vulnerability, Frostblink]
    moveOn: "bạn có transfigured gem, resistance đã cap, block lucky, và chaos resistance đã ra khỏi số âm."
    details:
      - title: Nhân vật budget thấp trông ra sao
        body: |
          Từ file budget thấp của guide ở level 90:

          - 4,025 life, 8,279 armour, 68% physical damage reduction.
          - 87.75% attack block và 79.75% spell block.
          - Không có spell suppression.
          - Resistance 79/78/79, còn chaos ở **−6%**.
          - Khoảng 2 triệu bleed damage mỗi giây.

          **File này dùng passive tree 3.27.** Nó cũng giả định quái đang bleed, bị maim và bị curse. Đọc dòng chaos hai lần: đó là điểm yếu của bản rẻ.
      - title: Khi bạn chưa có six-link
        body: |
          Món chữa cháy của guide là helmet unique [[The Bringer of Rain]], hoạt động như một six-link gói trong một món. Nó lấy mất slot body armour của bạn. Guide gọi đó là cuộc đổi chác công bằng ở giai đoạn đầu, vì body armour lúc đó còn yếu, và bảo bạn thay nó khi đã đủ tiền mua một cây six-link tử tế.

          Bỏ gem nào khi chỉ có bốn hay năm link thì bộ gem lúc đổi đã chỉ ra: [[Volatility Support]], [[Melee Physical Damage Support]] và [[Brutality Support]] đi trước.
      - title: Cây shield
        body: |
          Vì block đến từ ascendancy, shield được chọn theo đúng một mod: "Recover 5% of Life when you Block". Guide chấp nhận 4% khi budget eo hẹp, rồi tới armour, rồi life.

          Mod đó cần shield có influence Shaper. Guide bảo bạn tự craft và gọi chuyện đó là "rather simple once you have the base", **nhưng nó không in các bước ra**; nó trỏ sang một trang crafting riêng. Chúng tôi không kiểm chứng được recipe nào, nên không đưa ra cái nào.
      - title: Gear rare và một cái mastery
        body: |
          Danh sách budget thấp của guide: base armour ở mọi slot, ưu tiên resistance và life trước. Movement speed trên boots. Attack speed và life trên gloves. Amulet là một trong những chỗ tốt nhất để tìm physical damage over time multiplier.

          Một cái bẫy: cây lấy Life Mastery "15% increased maximum Life if there are no Life Modifiers on Equipped Body Armour". Nên file bảo tránh life trên chest "until you can get a really, really good one"; còn câu của guide là một dòng life trên 100 thì đáng để bỏ mastery.
      - title: Flask
        body: |
          Một [[Life Flask]] Divine hồi tức thì và xóa bleed, rồi [[Granite Flask]], [[Silver Flask]], [[Sulphur Flask]] và [[Quicksilver Flask]].

          Mấy cây flask được công bố dùng prefix nhận charge khi bạn bị hit. Guide có hai luật:

          1. Một utility flask phải có increased armour trong lúc có hiệu lực, lý tưởng là 50%.
          2. Một cây phải cho miễn freeze, cái mà nó gọi là bắt buộc, cho tới khi Brine King của bạn được nâng cấp.
  - id: red-maps
