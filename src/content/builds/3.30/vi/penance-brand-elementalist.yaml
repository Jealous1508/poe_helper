      con golem vẫn ở nguyên chỗ, trên boots; từ map trở đi Path of Building
      chạy Stone Golem bản Safeguarding, thứ mà guide gọi là một lựa chọn.
      [[Wave of Conviction]] ra khi gloves đã gây Fire Exposure.
