confidenceNote: >-
  **Trang maxroll khoác nhãn 3.30 lên phần chữ 3.29.** Planner nhúng trong đó
  đóng dấu `version: 3290`, lưu ngày 3 tháng 8 2026. Tác giả thực sự có ra một
  bản sửa 3.30 thật ở ngoài trang vào ngày 12 tháng 11 — nó xóa lộ trình level
  Storm Brand cũ, thêm hai cây level theo wand attack, thêm một stage map đỏ và
  thêm hai gem — nên file Path of Building là mới, còn phần chữ thì là text 3.29
  đúng khoảng 95%. Chúng tôi dùng Path of Building 3.30 làm chuẩn xuyên suốt. Các
  điểm số là phán đoán ngày đầu của researcher bên chúng tôi, làm tròn xuống từ
  số lẻ nửa điểm (bossing 3.5 khi làm starter, lên tầm 4.5 khi đủ gear; ease
  3.5).
modes:
  ssf: >-
    Chơi được nhưng guide không bàn tới. Mấy cây unique rẻ gánh giai đoạn đầu đều
    là drop phổ biến, nhưng [[Archdemon Crown]] cần base Elder và Elegant Hubris
    cần một seed cụ thể. Chuẩn bị tinh thần ngồi ở mức sức mạnh giữa game khá
    lâu.
  hardcore: >-
    Không nguồn nào đánh giá. Lớp vỏ phòng thủ — block đã cap, maximum resistance
    cao, 90% physical damage reduction — trên giấy thì vững, nhưng nó tới muộn và
    chưa ai thử trong league này.

idea: |
  [[Penance Brand]] gắn vào một con quái. Mỗi một phần mười giây nó cộng một energy và lớn lên. Ở 20 energy nó phát nổ thành một cú hit lớn rồi biến mất.

  Cú hit đó là physical và lightning. Không có chút fire nào trên nó cả. Fire đến từ ascendancy: [[Shaper of Flames]] nói mọi damage của bạn đều có thể ignite, nên cú physical hit to đùng đó làm quái bốc cháy, và cái lửa mới là thứ giết thật.

  Vì ignite scale theo độ lớn của cú hit, bạn đi tìm flat added damage, gem level và multiplier "more" thay vì critical strike. Build cố ý chạy gần như không crit chút nào.

  Để dọn quái, bạn Shield Charge vào một pack, [[Obliteration]] cho con đầu tiên bạn giết nổ ra, mỗi cú nổ lại ignite, và gloves có implicit lan ignite nối cái lửa đó đi khắp màn hình. Bạn gần như không cast.

chain:
  - label: Gắn
    text: "[[Penance Brand]] dính vào con quái trong tầm khoảng 3 mét rồi bắt đầu nạp."
  - label: Phát nổ
    text: "Ở 20 energy nó nổ thành một cú physical và lightning lớn. [[Runebinder]] cho bạn chồng hai brand lên cùng một mục tiêu."
  - label: Ignite
    text: "[[Shaper of Flames]] khiến mọi cú hit đều ignite và cho mọi loại damage ignite được, nên một cú physical và lightning không có chút fire nào vẫn làm quái bốc cháy."
  - label: Lan
    text: "[[Obliteration]] cho xác nổ, gloves Searing Exarch lan mỗi cú ignite 1.2 mét, và cả pack bốc cháy cùng nhau."
  - label: Sống sót
    text: "[[Melding of the Flesh]] và [[Aegis Aurora]] đẩy mọi maximum resistance lên, thay vì stack life."

chainDetails:
  - title: Lửa thật ra đến từ đâu
    body: |
      Đây là phần người ta hay hiểu sai. Bản thân brand không có fire damage, và nó cũng không cần. Ba lớp tạo ra ngọn lửa, và chúng xếp theo thứ tự:

      1. **[[Shaper of Flames]]** — hit luôn ignite, và *mọi damage đều có thể ignite*. Dòng thứ hai là dòng gánh cả build: không có nó thì một cú physical và lightning không ignite được chút nào. Dòng thứ ba của notable, "Enemies Ignited by you have 40% of Physical Damage they deal converted to Fire", nói về damage mà mấy con quái đó đánh lên bạn. Nó là phòng thủ, không cộng gì vào damage của bạn, và không con số nào trong bài này cho biết nó đáng bao nhiêu.
      2. **Physical damage gain thành extra damage, trên gear.** Không phải tất cả đều là fire: [[Obliteration]] cho extra chaos, [[The Balance of Terror]] cho một element ngẫu nhiên khi bạn đã cast Elemental Weakness trong 10 giây vừa qua, còn Grace of the Goddess cho extra fire, cold và lightning. Mà nó cũng không cần phải là fire. Cách chúng tôi đọc dòng "All Damage can Ignite", chỗ mà PoEDB không giải thích gì thêm: loại damage nào nằm trên cú hit cũng được tính vào ignite.
      3. **[[Herald of Ash]]**, nhân lên theo số herald bạn chạy.

      Nên cái ignite là một phần trăm của tổng cú hit từ brand. Mọi thứ làm cú hit lớn hơn đều làm ngọn lửa lớn hơn.
  - title: Vì sao ở đây không có critical strike
    body: |
      Critical strike chance của build là 9.78%. Đó không phải sơ suất.

      Nó dùng [[Elemental Overload]] thay thế: 40% more elemental damage phẳng chỉ cần crit được thỉnh thoảng, đổi lại crit của bạn không gây thêm damage. Với một build mà damage là hiệu ứng damage over time scale theo độ lớn cú hit, cái đổi chác đó là miễn phí.

      Thứ tự scale mà tác giả đưa ra là: gem level, rồi flat added damage to spell, rồi phần trăm physical gain thành extra element, rồi các multiplier "more" như [[Cruelty Support]] và [[Archdemon Crown]], rồi fire damage-over-time multiplier, rồi herald buff effect, rồi cast speed, rồi area.
  - title: Trâu mà không cần Mageblood
    body: |
      Phòng thủ ở đây là maximum resistance, không phải life. [[Melding of the Flesh]] đặt mọi cap resistance bằng maximum resistance *cao nhất* của bạn. [[Aegis Aurora]] cộng 5% maximum cold resistance và hồi energy shield bằng 2% armour mỗi khi bạn block. [[Purity of Ice]] đẩy cap cold cao hơn nữa, rồi Melding copy nó đi khắp nơi.

      Mấy con số này đến từ hai chỗ, nên phải đọc tách ra. Path of Building 3.30, ở level 92 và trước khi bộ này lên người, hiện 75% block, 71% spell block và 90% physical damage reduction, có [[Tempest Shield]] và Vaal Molten Shell trên trigger. Resistance của nó vẫn là 76/78/76/68. Con số maximum resistance là ghi chú của tác giả chứ không phải số trong file đó: có Aegis với Purity of Ice thì lên "86+" là "không khó lắm". File showcase cũ hơn, cái mà planner 3.29 dẫn tới, mặc đủ bộ ở level 99 và hiện 90% ở cả ba elemental resistance. [[Mind Over Matter]] thì tới muộn.

      Nguyên văn tác giả là đây là một setup cực trâu mà không cần [[Mageblood]]. Với một league starter thì chuyện đó hiếm, và đáng để đi mua theo danh sách.
  - title: Không phải Penance Brand of Dissipation
    body: |
      Bản transfigured bị nerf nặng: thời gian kích hoạt từ 0.75 lên 1 giây và multiplier "more" mỗi energy từ 30% xuống 20%.

      Ghi chú của chính tác giả là hãy chơi [[Penance Brand]] bản thường với ignite thay vì bản đó. Changelog của PoEDB xác nhận mấy con số. Nếu một guide bảo bạn dùng Dissipation, guide đó đã lỗi thời.
  - title: Vấn đề mana
    body: |
      Mỗi lần cast tốn 47 mana, và cast liên tục là khoảng 107 mana mỗi giây. File Path of Building showcase còn 78 mana trống.

      Đó là lý do [[Inspiration Support]] nằm trong main link và lý do Brand Mastery giảm cost không phải tùy chọn. Bỏ một trong hai thứ đó là bạn đứng đó không cast được, và nó sẽ trông như một cái bug.

mandatory:
  - term: Penance Brand
    why: >-
      Bản thân skill. Level 28, và Witch không lấy được nó bằng quest reward.
    detail: >-
      PoEDB ghi rõ reward "Sever the Right Hand" ở Act 3 thuộc về Templar, và
      Clarissa chỉ bán cho Scion với Templar — Witch bị gỡ khỏi danh sách từ
      3.15.0. Đường thường đi là Siosa trong The Library sau A Fixture of Fate,
      ông này bán gem bất kể class, hoặc đơn giản là mua. **Hãy tính trước là
      mua hoặc trade nó ở level 28.** Chúng tôi không xác nhận được đường Siosa
      trong lần nghiên cứu này; thứ đã xác nhận là Witch không có quest và không
      có quyền mua từ Clarissa.
  - term: Shaper of Flames
    why: >-
      Hit luôn ignite và mọi damage đều có thể ignite: một cái brand physical
      không ignite được nếu không có nó. Dòng thứ ba của nó là phòng thủ chứ
      không phải damage — quái bạn đã ignite bị chuyển 40% physical damage
      chúng gây ra thành fire. Lấy ngay từ lab đầu tiên.
  - term: Runebinder
    why: >-
      Cho bạn gắn brand thứ hai lên cùng một con quái. Đó là gần như nhân đôi
      damage single target.
  - term: Elemental Overload
    why: >-
      Multiplier damage cho một build cố ý không crit.
  - term: Cruelty Support
    why: >-
      Multiplier "more" lớn nhất trong link.
  - term: Ignite Proliferation Support
    why: >-
      Không có hiệu ứng lan ignite thì bạn chỉ có single target và không có
      clear. Gem này chỉ lan ignite của chính cái brand, và nó ở lại trong link
      ở mọi stage, kể cả trong helmet endgame. Gloves Searing Exarch không thay
      nó: chúng lan mọi cú ignite bạn gây ra, kể cả ignite từ mấy cú nổ. Gem
      cần level 38, nên trong campaign thì Elemental Proliferation Support giữ
      chỗ cho nó.
  - term: Shield Charge
    why: >-
      Hệ thống giao hàng. Build này là một autobomber: bạn charge vào pack, giết
      một con, và mấy cú nổ lo phần còn lại.
  - term: Obliteration
    why: >-
      Một cây wand unique rẻ với 20% cơ hội cho quái bạn giết nổ ra. Bước nhảy
      clear speed lớn nhất với số tiền ít nhất.
  - term: Bringer of Ruin
    why: >-
      66% increased herald buff effect và 66% herald reservation efficiency. Đây
      là thứ cho phép nhét năm herald hoặc hơn vào cùng lúc.
  - term: Mastermind of Discord
    level: recommended
    why: >-
      Hiệu ứng exposure của bạn áp thêm −25% resistance. Giai đoạn muộn đổi được
      sang Lycia's Farewell to Flesh khi herald buff effect đã cao.
  - term: Liege of the Primordial
    level: recommended
    why: >-
      Hai golem thêm, golem miễn elemental damage, và tự gọi lại. Build chạy bốn
      golem.
  - term: Cinderswallow Urn
    level: recommended
    why: >-
      Nguyên văn tác giả: thêm cả tấn damage. Rẻ. Lấy sớm.
  - term: Lost Unity
    level: recommended
    why: >-
      Một herald miễn phí, 20% tất cả resistance và 37% chaos resistance, gói
      trong một cây unique rẻ.
  - term: Nycta's Lantern
    level: recommended
    why: >-
      Cho Battlemage, nên added fire damage của vũ khí nuôi luôn cái spell. Cái
      này lo đoạn từ level 28 tới khi vào map.
  - term: Melding of the Flesh
    level: recommended
    why: >-
      Cap mọi resistance bằng maximum resistance cao nhất của bạn. Một trong ba
      mảnh làm build trâu mà không cần [[Mageblood]].
  - term: Aegis Aurora
    level: recommended
    why: >-
      +5% maximum cold resistance và hồi energy shield bằng 2% armour khi block.
      Với 75% block thì đó là hồi phục liên tục.
  - term: Purity of Ice
    level: recommended
    why: >-
      Nâng maximum cold resistance, rồi [[Melding of the Flesh]] copy nó sang mọi
      resistance khác.
  - term: Archdemon Crown
    level: recommended
    why: >-
      Món damage lớn nhất: +2 và +2 gem level, Burning Damage miễn phí, và 30%
      more elemental damage. Cần base Elder.
  - term: The Balance of Terror
    level: recommended
    why: >-
      Một viên jewel, hai lớp scale của build: Fire Exposure on hit và một phần
      physical damage gain thành một element ngẫu nhiên, mỗi dòng chỉ chạy khi
      bạn đã cast đúng curse của nó — Flammability, Elemental Weakness — trong
      10 giây vừa qua. Từ map đỏ thì gloves đã lo Fire Exposure rồi; Path of
      Building 3.30 chỉ cắm viên jewel này ở cây endgame.
  - term: Whispers of Doom
    level: recommended
    why: >-
      Anoint lên amulet, để bạn curse được [[Flammability]] và Elemental Weakness
      cùng lúc.

labs:
  - lab: Normal
    node: Shaper of Flames
    why: "Guide chốt rõ cái này. Chưa có nó thì brand của bạn không ignite được và build không tồn tại."
  - lab: Cruel
    node: Liege of the Primordial
    why: "Hai golem thêm, miễn elemental và tự gọi lại. Bốn con golem của bạn thôi chết."
  - lab: Merciless
    node: Bringer of Ruin
    why: "Herald effect và reservation efficiency. Đây là lúc dàn herald trở thành damage."
  - lab: Uber
    node: Mastermind of Discord
    why: "Thêm −25% resistance từ exposure. Muộn hơn, bạn có thể đổi sang Lycia's Farewell to Flesh; hai cái sát nhau."

stages:
  - id: acts-1-12
    image: asc-icon-elementalist
    title: Act 1–3, level 1–28
    levels: Level 1–28
    uses: >-
      [[Rolling Magma]] suốt cả đoạn, với [[Holy Flame Totem]] và
      [[Flame Wall]] cho boss. [[Shield Charge]] ngay từ đầu, vì lối chơi
      endgame cũng đúng cái thói quen di chuyển đó.
    changes: >-
      Ở level 16, thêm [[Herald of Ice]] và [[Herald of Thunder]]: guide ghi 16
      và gem cũng đòi level đó, dù Path of Building xếp chúng vào loadout level
      12–28. Tầm level 12, lấy [[Runebinder]] với [[Elemental Overload]] trên
      cây và đổi [[Frostblink]] sang [[Flame Dash]].
    links:
      - name: Main skill
        gems: [Rolling Magma, Elemental Proliferation Support, Combustion Support]
      - name: Boss
        gems: [Holy Flame Totem, Flame Wall]
      - name: Di chuyển
        gems: [Shield Charge, Faster Attacks Support, Momentum Support]
      - name: Từ level 16
        gems: [Herald of Ice, Herald of Thunder]
    moveOn: "bạn đã level 28 và có một viên gem Penance Brand trong tay."
    details:
      - title: Gear cần để mắt
        body: |
          Ashcaller, Honourhome, Wanderlust, Berek's Grip và Replica Prismweave. Tất cả đều là unique đầu league giá rẻ và tất cả đều gánh bạn tới map.

          Honourhome quan trọng nhất: nó cho +2 level cho gem cắm trong đó, và đó là nơi bước nhảy damage thật đầu tiên của bạn đến từ.
      - title: Hướng wand attack của 3.30
        body: |
          Bản sửa 3.30 thêm một lộ trình level thứ hai: Kinetic Bolt rồi lên setup ballista Kinetic Fusillade, kèm hai cây riêng.

          Cái này mới và không có trong planner cũ, nên cộng đồng chưa có kinh nghiệm gì với nó. [[Rolling Magma]] là đường đã được kiểm chứng. Chỉ dùng đường wand nếu bạn đã biết chắc là mình thích nó.
      - title: Đừng tính tới Storm Brand
        body: |
          Phần chữ guide 3.29 đưa Storm Brand ra như một lựa chọn để level. **Path of Building 3.30 xóa hẳn cây đó.**

          Cứ ở Rolling Magma tới 28. Nếu bạn đọc phần chữ cũ và nó nói khác, thì planner là thứ mới hơn.
  - id: acts-4-10
    image: tempest-shield
    title: Act 4–10
    levels: Level 28–68
    uses: >-
      [[Penance Brand]] trong một four-link nằm trong cây Honourhome +2, với
      [[Nycta's Lantern]] làm vũ khí để added fire damage của sceptre nuôi cái
      spell. Four-link là hết cỡ rồi: Honourhome là helmet, mà helmet thì tối
      đa bốn socket.
    changes: >-
      Dàn golem vào từ đây: bốn golem, được [[Liege of the Primordial]] giữ sống.
      Thêm [[Wave of Conviction]] cho exposure và [[Flammability]] khi đánh boss.
      [[Herald of Ice]] và [[Herald of Thunder]] nhường chỗ cho
      [[Herald of Ash]] với Herald of Purity, hai cái mà guide nói scale brand
      tốt hơn nhiều; cả hai quay lại khi vào map. Loadout level 28 trong Path of
      Building 3.30 thì vẫn ghi Ice và Thunder cạnh [[Tempest Shield]], nên phần
      chữ và file của tác giả lệch nhau ở chỗ này. Chúng tôi theo phần chữ.
    links:
      - name: Main skill
        gems: [Penance Brand, Elemental Proliferation Support, Cruelty Support, Swiftbrand Support]
      - name: Exposure
        gems: [Wave of Conviction, Added Fire Damage Support]
      - name: Herald
        gems: [Tempest Shield, Herald of Ash, Herald of Purity]
      - name: Golem
        gems: [Summon Lightning Golem, Summon Flame Golem, Summon Stone Golem, Summon Chaos Golem]
      - name: Di chuyển và curse
        gems: [Shield Charge, Faster Attacks Support, Flame Dash, Flammability]
    moveOn: "Penance Brand đã nằm trong four-link trên helmet, resistance đã cap sau Act 10, và bạn đã ascend hai lần."
    details:
      - title: Bandit và Pantheon
        body: |
          **Giết cả ba bandit** để lấy passive point.

          Pantheon: Soul of the Brine King và Soul of Garukhan. Cả hai file Path of Building đều đồng ý. Ô planner của maxroll lại ghi Brine King và Abberath — hãy tin Path of Building, vì nó là file mới hơn.
      - title: Gần như không có aura nào
        body: |
          Đây là build reserve bằng herald, không phải build aura. Bạn chạy Herald of Ash, Thunder, Ice và Purity, Herald of the Hive từ [[Lost Unity]], [[Tempest Shield]], và sau đó là [[Purity of Ice]], [[Flesh and Stone]] với [[Enlighten Support]].

          Không phải tất cả đều chạy từ level 28. Ash và Purity gánh campaign; guide thêm Thunder và Ice trở lại khi bạn đã có [[Bringer of Ruin]] và Lost Unity. Trong Path of Building 3.30, Herald of Ice lúc đó nằm riêng một socket trên gloves, tách khỏi nhóm herald, nên các danh sách link từ map trở đi ghi nó thành một dòng riêng.

          Đó là lý do [[Bringer of Ruin]] là ascendancy thứ ba chứ không phải thứ nghĩ sau. Reservation efficiency là thứ khiến cả bộ nhét vừa.
      - title: Thứ tự ascendancy được suy ra thế nào
        body: |
          Guide chỉ nêu tên notable đầu tiên trong phần chữ. Rồi nó cho bốn bước hai điểm riêng biệt, ánh xạ một-một vào bốn cái labyrinth.

          Đọc chúng như thứ tự lab là cách hiểu duy nhất hợp lý, nhưng đó là **suy luận của chúng tôi, không phải lời tác giả**. Nếu bạn muốn làm khác, [[Shaper of Flames]] trước là phần duy nhất chắc chắn.
  - id: early-maps
    image: herald-of-purity
    title: Map đầu
    levels: Map trắng và map vàng
    uses: >-
      Một cây body armour six-link cắm brand, [[Obliteration]] làm vũ khí, và
      gloves có implicit Searing Exarch "ignites spread".
    changes: >-
      Đây là lúc build thành autobomber. Nhặt [[Cinderswallow Urn]] và Kaom's
      Binding, dồn dàn herald vào một nhóm bốn socket, và ascend lấy
      [[Bringer of Ruin]]. Có nó cùng [[Lost Unity]] rồi thì [[Herald of Ice]]
      quay lại, nằm riêng một socket trên gloves. [[Wave of Conviction]] thì cứ
      giữ đã: nó chỉ ra khi gloves có thêm implicit Eater gây Fire Exposure, và
      loadout Maps của Path of Building 3.30 vẫn còn nó, gắn trên trigger Cast
      when Damage Taken.
