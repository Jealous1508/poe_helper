role: starter
budget: starter
budgetNote: >-
  **Không nguồn nào công bố budget cho build này, ở bất cứ mức nào.** Researcher
  bên chúng tôi đã rà cả trang guide tìm giá và không thấy gì; mấy tier list
  cũng không có. Tín hiệu duy nhất về mức dễ mua mà tác giả đưa ra là độ khó gear
  2 trên 5, thấp hơn là dễ hơn. Bộ đồ khởi đầu thì rẻ thật —
  [[Obliteration]], [[Lost Unity]], [[Cinderswallow Urn]],
  [[Nycta's Lantern]] và Replica Prismweave đều là unique đầu league giá bèo.
  Phần đắt ([[Archdemon Crown]], [[Melding of the Flesh]], Elegant Hubris) thì
  chưa có giá 3.30, mà ngày đầu thì chẳng thứ gì có giá.
