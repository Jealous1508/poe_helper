    moveOn: "bạn đã có Melding of the Flesh, Aegis Aurora và Purity of Ice chạy cùng nhau."
    details:
      - title: Chồng resistance reduction
        body: |
          Khác với con Chieftain trên trang này, build này *muốn* resistance reduction và chồng nó thật nặng.

          Hai curse qua [[Whispers of Doom]]. Fire Exposure on hit từ implicit Eater trên Death Mitts, áp −13% fire resistance; đây là thứ thay [[Wave of Conviction]]. [[Mastermind of Discord]] cho thêm −25% lên cái exposure. Hai Fire Mastery, mỗi cái −5%. [[The Balance of Terror]] cũng có một dòng Fire Exposure, nhưng Path of Building 3.30 chỉ cắm nó ở cây endgame, nên từ map đỏ thì gloves mới là nguồn.

          Mỗi lớp nhân lên với damage bạn đã có, và đó là lý do giữa game cảm giác như bỗng dưng gấp đôi.
      - title: Chuyển đổi phòng thủ
        body: |
          [[Melding of the Flesh]], [[Aegis Aurora]] và [[Purity of Ice]] chỉ chạy khi đủ bộ. Melding cap mọi resistance bằng maximum resistance cao nhất của bạn, Aegis nâng cap cold và hồi energy shield khi block, còn Purity of Ice nâng cap cold thêm lần nữa.

          Mua cả ba trong cùng một buổi nếu được. Mặc Melding mà thiếu hai món kia là hạ resistance của chính bạn.
