        gems: [Shield Charge, Faster Attacks Support, Flame Dash]
      - name: "Warcry: Enduring Cry, hoặc Seismic Cry khi chạy map"
        gems: [Seismic Cry, Urgent Orders Support, Enduring Cry]
    moveOn: "không còn stage nào nữa. Thứ còn lại là một cây axe mức mirror và mấy cái implicit cỏn con."
    details:
      - title: Nhân vật hoàn chỉnh trông như thế nào
        body: |
          Từ file Path of Building công bố ở level 98, cấu hình cho bản không dùng suppression:

          - 89.76% attack block và 87.75% spell block, cả hai đều sau khi roll lucky. Phần chữ của guide làm tròn cả hai thành 88%; cây trong file có mức trần 68% cho attack block so với 65% cho spell block.
          - 6,750 life, 23,063 armour, 90% physical damage reduction — đúng mức cap.
          - Resistance 77/76/76, và chaos ở 47.
          - Tầm 1,100 life hồi mỗi giây, 925 sau khi trừ, cộng 675 leech mỗi hit.
          - Cú hit lớn nhất sống được: 21,800 physical, tầm 57,000 elemental, 20,810 chaos.

          **Đây là số của tác giả, từ một file Path of Building chạy trên engine 3.29, cho một setup softcore dùng cluster jewel.** Đọc kỹ mấy con chaos: bộ đệm chaos của bạn chỉ bằng khoảng một phần ba bộ đệm elemental. Đó là cái lớp mỏng duy nhất của build.
      - title: Cây shield để chốt lại
        body: |
          Một cây shield có increased spell suppression và "Recover 5% of Life when you Block". Dùng base evasion thuần như [[Lacquered Buckler]], thứ này làm suppression dễ đạt hơn.

          Hoặc đi đường không dùng suppression đã được ghi lại: bỏ suppression và [[Iron Reflexes]], dồn hẳn vào armour, và dùng cây trước suppression của guide. Đó là đường mà người chơi solo self-found và kiểu gần hardcore nên xem.
      - title: Bleed không thể scale thành burst
        body: |
          Đây là đối trọng trung thực cho mọi điều tốt đẹp ở trên. Nếu một con boss có cổng kiểm damage, có đồng hồ enrage, hoặc có một phase bạn phải kết thúc nhanh, thì một hiệu ứng damage over time ở tốc độ cố định không có câu trả lời nào.

          "Damage không điên" là lời tự nhận xét của tác giả về chính build của anh ta. Tin anh ta đi.
      - title: Jagged Technique trong setup Lacerate là một cú đổi tùy chọn
        body: |
          Phần thông tin build của guide liệt kê hai nguồn aggravate theo tỷ lệ cho setup boss dùng [[Lacerate of Haemorrhage]], 10% từ Bloodletting và 10% từ quality của [[Vulnerability]], như thể [[Jagged Technique]] không có ở đó. Trước đây chúng tôi nêu chỗ này là một mâu thuẫn. Phần ghi chú nằm trong file Path of Building công bố đã giải nó.

          Ghi chú đó nói tác giả coi [[War of Attrition]] là lựa chọn ascendancy thứ tư tốt nhất cho pinnacle boss, và gọi nó là node gần như chết hẳn khi chạy map. Hai nguồn theo tỷ lệ kia là cách bạn aggravate nếu lấy nó thay cho Jagged Technique. Rồi anh ta nói thêm rằng ở league Settlers anh ta còn chẳng buồn đổi mà vẫn hoàn toàn ổn, và nếu bạn không muốn đổi thì anh ta khuyên cứ giữ Jagged Technique. Mọi bản cây trong file đều giữ Jagged Technique, và dòng chữ của node không kèm điều kiện nào: "Bleeding you inflict is Aggravated". Nên trừ khi bạn tự chọn cú đổi đó, nó vẫn hoạt động cả với Lacerate.

          Còn một đầu mối chưa buộc lại. Phần Uber lab của guide nói về Jagged Technique như lựa chọn linh hoạt và đưa ra một notable phòng thủ thay vào chỗ đó, trong khi planner và các cây trong file lấy nó thứ hai, ở Cruel lab. Cách đọc của chúng tôi là phần đó nói về chuyện bạn bỏ node nào một khi đã có đủ bốn, chứ không nói về thứ tự lấy. Dù sao thì điều đáng rút ra vẫn đứng vững: Jagged Technique là node được chỉ định để bỏ, và guide có nói cách thay thế phần aggravate của nó.

powerCurve: |
  Damage của build là ba thứ nhân với nhau, còn phòng thủ là ba lớp chồng lên nhau. Cách chia này là của chúng tôi; từng phần thì đều nằm trong guide hoặc trong dữ liệu game. **Độ lớn của một cú hit** là physical damage của cú dư chấn, đến từ cây axe và về sau từ [[Ryslatha's Coil]]. **Aggravate** nhân ba vết bleed mà cú hit đó để lại, và [[Jagged Technique]] biến chuyện đó thành chắc chắn. **Hệ số bleed** lớn dần theo từng endurance charge, qua Bleeding mastery. Bên phía phòng thủ là block, armour, và lại chính mấy endurance charge đó.

  Giai đoạn đầu, bạn chỉ có thứ đầu tiên trong ba thứ đó. Cho tới Cruel Labyrinth quanh level 52, build là một nhân vật [[Sunder]] cầm axe hai tay, giết bằng cú hit, và cái vendor recipe cộng physical damage là thứ scale duy nhất đáng kể. [[Gratuitous Violence]] ở level 33 thêm nổ xác, mà tác giả dặn là lúc đó chưa nên mong gì nhiều. Jagged Technique là chỗ damage chuyển thành bleed. Phòng thủ thì vẫn chưa có: mấy node block vô dụng cho tới khi bạn cầm shield.

  Merciless Labyrinth, quanh level 68, là bậc lớn nhất, và toàn bộ nó là phòng thủ. [[Determined Survivor]] cùng một cây shield cho 50% block cố định, [[Versatile Combatant]] đổi phần dư thành spell block, và cú đổi sang một tay không khiến bạn mất gì về mặt tấn công. Sau đó map thêm mấy hệ số nhân rẻ: chính [[Earthquake]], với cú dư chấn 150% more; hai ring [[Kaom's Sign]], nơi mỗi charge vừa là damage vừa là giảm damage; và [[More Than Skill]] ở lab thứ tư, đưa block từ 65% lên tầm 88%.

  Từ map đỏ trở đi, hai nửa tách nhau. Phòng thủ đã xong: tầm 88% block theo con số của guide (file level 98 của tác giả ghi 89.76% với attack và 87.75% với spell) và, cũng trong file đó, physical damage reduction ở đúng mức cap 90%. Damage thì chưa, và phần còn lại phải mua, vì theo chính guide thì nó thôi đến từ cây và bắt đầu đến từ implicit với một cây axe tốt hơn. Cuối con đường đó là một cây axe mà tác giả nói tốn ít nhất một [[Mirror of Kalandra]]. Nên cứ kỳ vọng một nhân vật thôi chết từ rất lâu trước khi nó bắt đầu giết nhanh, và boss gục theo một nhịp đều, không bao giờ theo kiểu burst. Lời của chính tác giả về chuyện này là "damage không điên".

upgrades:
  - step: "Hai ring [[Kaom's Sign]]"
    why: >-
      Đứng đầu vì chúng rẻ trên trade, và không món nào khác trong danh sách
      này mua được cả damage lẫn phòng thủ bằng cùng một đồng. Mỗi ring là +1
      endurance charge tối đa, và qua Bleeding mastery thì mỗi charge là +3%
      damage over time multiplier cho bleed cộng 4% physical và 4% elemental
      damage reduction. Guide bảo bạn mua chúng ở map đầu, trước khi danh
      sách xếp hạng của chính tác giả bắt đầu. Nó không đưa con số nào cho
      chúng.
  - step: "Một cây [[Reaver Axe]] một tay craft bằng [[Essence of Contempt]]"
    why: >-
      Bleed được tính từ physical damage của cú hit đã áp nó, nên cận trên
      của dải damage trên cây axe là con số mà mọi thứ khác nhân vào. Dùng
      base quality cao và essence loại Deafening hoặc Shrieking. Đây là vũ
      khí tử tế đầu tiên của guide, ở map đầu. Nó nằm dưới hai cái ring chỉ
      vì ring là món cứ mua là có, còn phần còn lại của một lần craft là may
      rủi. Thứ tự này là của chúng tôi.
  - step: "Link thứ sáu, với [[Earthquake]] nằm trong socket đúng màu của nó"
    why: >-
      Màu socket là damage với giá của việc đổi màu một ô: một viên gem nằm
      trong socket đúng màu của nó được +10% quality, và trên Earthquake thì
      đó là thẳng 10% more aftershock damage. Guide chỉ công bố link map
      của nó dưới dạng sáu gem: Brutality, Fist of War, [[Cruelty Support]],
      Fortify và Less Duration đứng sau Earthquake, còn bộ Exceptional Gems
      trong file thì đặt Melee Physical Damage vào chỗ Cruelty. Nó chưa bao
      giờ đưa ra một five-link, nên không nguồn nào nói support nào là viên
      thứ sáu. Danh sách xếp hạng của tác giả
      không đặt six-link vào chỗ nào cả. Chúng tôi đặt nó ở đây vì một link
      nhân vào bất kỳ cây axe nào bạn đang cầm, nên nó giữ nguyên giá trị qua
      mấy lần nâng axe bên dưới. Thứ tự này là của chúng tôi, và không nguồn
      nào định giá six-link trong 3.30.
  - step: "Eldritch implicit"
    why: >-
      Món đầu tiên trong thứ tự map đỏ của chính tác giả, và từ đây xuống tới
      cây shield thì thứ tự là của anh ta. Lý do của anh ta là thời điểm:
      gloves, helmet, body armour và boots đều tới lúc cần nâng, đó là lần
      nâng cuối của mấy ô này trong một thời gian dài, nên implicit được gắn
      luôn cùng lúc. Anh ta nêu tên theo từng ô. Helmet: increased curse
      effect cho [[Vulnerability]], và physical damage từ hit nhận vào dưới
      dạng elemental. Body armour: maximum resistance, và increased aura
      effect cho [[Pride]]. Gloves: physical damage over time multiplier, và
      chance to suppress spell damage. Boots: action speed, và life hồi mỗi
      giây theo từng endurance charge. Nếu bạn bỏ [[Jagged Technique]], anh
      ta roll chance to aggravate trên gloves thay cho suppression. Anh ta
      không đưa con số nào cho phần mỗi cái thêm được, và chúng tôi cũng
      không.
  - step: "Cây axe endgame: 550 physical damage cận trên trở lên"
    why: >-
      Mốc của chính tác giả, và là con số anh ta nói quan trọng nhất. Có hai
      đường được công bố. Một đường dùng recombinator: tầm mười cây Reaver
      Axe item level 83, vài nghìn [[Orb of Alteration]] và tỷ lệ thành công
      một trên ba mỗi lần recombine. Đường cũ hơn dùng Essence of Contempt,
      một [[Veiled Orb]] và bench. Anh ta cảnh báo rằng recombinator bị nerf
      trong 3.30 với mức độ mà anh ta gọi là chưa rõ, nên hãy tính tới đường
      chậm hơn, hoặc tính tới chuyện mua cây axe thành phẩm. Không có giá
      nào cho cả hai đường.
  - step: "[[Ryslatha's Coil]]"
    why: >-
      Tác giả gọi nó là nâng cấp lớn nhất không phải vũ khí và xếp nó thứ ba.
      Nó cho −30% physical attack damage tối thiểu và +40% tối đa, mà chỉ vết
      bleed lớn nhất của bạn mới gây damage: mấy cú roll cao dính lại còn mấy
      cú roll thấp bị ghi đè. Nó còn mang +40 Strength và +100 maximum life.
      Đây là rủi ro chi phí duy nhất được nêu tên của build, vì hai guide
      Gladiator phổ biến đều cần nó, nên chờ nhu cầu dồn vào trong tuần đầu
      league. Không có giá nào cho nó ở bất kỳ patch nào.
  - step: "Một cái amulet damage anoint lại sang Endurance, rồi cluster jewel, rồi một cây shield có life-on-block"
    why: >-
      Ba món cuối trong thứ tự của tác giả, giữ đúng trình tự của anh ta. Anh
      ta không nói mỗi món thêm được bao nhiêu và không thứ gì chúng tôi đọc
      định giá chúng, nên chúng tôi gộp lại. Cây shield là món có con số đi
      kèm: "Recover 5% of Life when you Block", trên một nhân vật block tầm
      88% số cú hit. Guide gợi ý base evasion như [[Lacquered Buckler]] nếu
      bạn muốn có cả spell suppression, và có ghi lại một đường không dùng
      suppression nếu bạn không muốn.
  - step: "[[Kalandra's Touch]], six-link [[Lacerate of Haemorrhage]], rồi một cây axe tốt hơn"
    why: >-
      Đứng cuối vì tất cả đều thuộc stage cuối, sau mọi thứ trong danh sách
      xếp hạng của tác giả. Cái ring min-max của guide là một cái ring
      rare, corrupt để có +1 endurance charge tối đa và craft để có damage
      over time multiplier, và Kalandra's Touch sao chép nó; lý do tác giả
      nêu là làm vậy đỡ tốn vài Divine so với làm hai cái. Thứ được sao chép
      không phải Kaom's Sign: phần chữ của guide và bộ đồ Minmax trong file
      đều cho thấy một cái ring rare. Link Lacerate là một six-link thứ hai chỉ dùng cho uber pinnacle
      boss, và tác giả dành nó cho người chơi nâng cao hơn. Cây axe thì kết
      thúc ở một cây có synthesised implicit với 800+ physical damage cận
      trên, mà anh ta nói tốn ít nhất một [[Mirror of Kalandra]]. Hãy đọc đó
      như một hướng đi.

play:
  mapping: |
    Viết cho map đỏ, lúc bạn đã cầm shield và [[Earthquake]] đã nằm trong six-link. Vòng lặp ngắn vì build cố ý chậm: một cú giã ở 75% attack speed của bạn, rồi chờ vết nứt.

    1. **Đọc map trước khi mở.** Không bao giờ chạy "Monsters have a chance to avoid Poison, Impale and Bleeding", và không bao giờ chạy less Armour hay reduced Chance to Block. Mod thứ nhất lấy mất damage của bạn, mod thứ hai lấy mất phòng thủ. Tác giả tự đưa regex cho đúng mấy mod này.
    2. **[[Shield Charge]] tới pack.** Đó là cách chính tác giả tả chuyện chạy map: cứ Shield Charge vòng vòng. Các bộ gem cho map của anh ta link nó với [[Faster Attacks Support]] và còn mang thêm một [[Flame Dash]]; ghi chú playstyle trong file Path of Building của anh ta nói anh ta chủ yếu chỉ shield charge với flame dash đi vòng vòng.
    3. **Giã một cú, ngay trên pack.** Vết nứt nổ sau khoảng một giây, sớm hơn nếu có [[Less Duration Support]], và cú dư chấn đó mới là cú hit đáng quan tâm. Mấy vết nứt tạo ra trước khi vết đầu tiên nổ thì không có dư chấn riêng. Cách đọc của chúng tôi về luật đó là với một pack bình thường, giã thêm cú thứ hai ngay lập tức chẳng thêm được bao nhiêu: giã rồi đi tiếp.
    4. **Để mấy cú nổ lo phần còn lại.** Có [[Gratuitous Violence]] thì quái đang bleed mà bạn giết sẽ nổ, mất một phần năm máu tối đa của nó, và trong một pack dày thì mấy cú nổ lan sang nhau. Quái chết sau lưng bạn. Câu trả lời của tác giả là một loot filter tốt, không phải đổi build.
    5. **Warcry là tùy chọn trong lúc chạy map.** Các bộ gem cho map của guide liệt kê [[Enduring Cry]]; mục FAQ của nó nói bạn có thể chạy [[Seismic Cry]] thay vào khi chạy map, vì ở đó endurance charge của bạn đằng nào cũng giữ được. Guide không nói bấm cái nào thường xuyên cỡ nào, nên chúng tôi không đưa ra nhịp nào cho nó.
    6. **Dừng lại cho quái Rare và boss map.** Cast [[Vulnerability]], giã, chờ dư chấn, giã tiếp. Curse là một nút bạn tự bấm: trong các link được công bố không có gì trigger nó, và ghi chú playstyle trong file của tác giả nói với single target thì bạn cast Vulnerability, dùng Bladestorm để áp Maim và đặt War Banner xuống, cái này instant.

    Hai thứ cần để mắt tới. [[Blood Magic]] nghĩa là mọi skill đều trừ vào máu của bạn: file công bố ghi 55 life mỗi lần dùng. Và suffix "of Sealing" trên life flask là thứ gỡ bleed khỏi người bạn, nên bấm nó khi bạn đang bị bleed. Skill guard là thứ duy nhất bạn không phải bấm: các bộ gem của guide đặt [[Molten Shell]] lên [[Cast when Damage Taken Support]] cùng More Duration, nên nó tự bật khi bạn ăn damage.
  bossing: |
    Kế hoạch là đúng cái ở mấy dòng mở đầu của guide: áp một vết bleed thật lớn, rồi di chuyển bao nhiêu tùy thích trong lúc nó trừ máu. Một vết bleed sống khoảng năm giây và vết mạnh hơn thì ghi đè vết yếu hơn, nên bạn không bao giờ đi chồng stack. Bạn đang cố roll ra một cú dư chấn lớn rồi giữ cho nó được làm mới.

    1. **Lấy lại charge trước đã.** Endurance charge mất khi qua màn hình loading, mà guide tính tám charge là 32% physical và 32% elemental damage reduction. Theo phép tính của chúng tôi chúng còn là +24% damage over time multiplier cho bleed, ở mức 3% mỗi charge từ Bleeding mastery. Nếu bạn tới chỗ boss qua portal hay qua một đoạn chuyển khu, bấm [[Enduring Cry]] trước mọi thứ khác.
    2. **Curse boss** bằng [[Vulnerability]]. Gem có quality thì boss ăn 30% increased physical damage.
    3. **Giã theo nhịp dư chấn, đừng nhanh hơn.** Một vết nứt tạo ra trước khi vết trước đó nổ thì không có dư chấn, nên mấy cú giã dư là lãng phí. [[Fist of War Support]] boost một cú giã không quá một lần mỗi 1.8 giây; còn phần tăng của nó có chạm tới cú dư chấn hay không thì chưa được xác nhận.
    4. **Khi boss làm gì đó nguy hiểm, cứ đi ra.** Vết bleed vẫn trừ máu dù bạn có đang đánh hay không. Nó sống khoảng năm giây, nên đó là quãng bạn có thể đứng ngoài trước khi damage ngừng. Giới hạn năm giây là phép tính của chúng tôi, không phải một dòng trong guide.
    5. **Quay lại và giã tiếp.** [[Jagged Technique]] aggravate mọi vết bleed, nên cú dư chấn đầu tiên sau một lần né đáng giá ngang mọi cú khác. Mỗi cú dư chấn còn là thêm một lần roll để có vết bleed lớn hơn: có [[Ryslatha's Coil]] thì dải damage được cố ý nới rộng, cú roll cao dính lại còn mấy cú thấp bị ghi đè.

    Cái four-link [[Bladestorm]], có [[Culling Strike Support]] trong đó, nằm lại trong các bộ gem của guide qua mọi stage map, kể cả mấy setup đánh uber. Mục FAQ của tác giả nói nó áp Maim và Culling Strike và cho thêm cơ hội aggravate, rằng bạn chỉ dùng nó với single target, và kể cả vậy thì nó cũng không quan trọng gì lắm.

    Với uber pinnacle boss, tác giả đổi cả six-link sang [[Lacerate of Haemorrhage]]: damage cao hơn trên một mục tiêu, clear tệ hơn, và anh ta dành nó cho người chơi nâng cao hơn. Jagged Technique vẫn hoạt động trong setup đó trừ khi bạn tự chọn đổi nó đi. Phần ghi chú trong file Path of Building của anh ta đánh giá [[War of Attrition]] cao hơn cho pinnacle boss, lúc đó aggravate đến từ các nguồn theo tỷ lệ, và nói thêm rằng ở league Settlers anh ta chẳng buồn đổi. Chi tiết nằm ở stage endgame.

    Thứ không đổi: bleed không có burst. Một cổng kiểm damage, một đồng hồ enrage hay một phase bạn phải kết thúc nhanh thì build này không có câu trả lời. Và block là xác suất, nên cú hit lọt qua không hề nhỏ đi nhờ nó. Mấy đòn lớn có báo trước thì vẫn đáng để bước ra khỏi. Ý cuối này là cách đọc của chúng tôi, và build này khiến việc làm theo rất rẻ, vì bước đi không làm bạn mất chút damage nào.

deaths:
  - situation: "Map có less Armour hoặc reduced Chance to Block"
    cause: >-
      Toàn bộ phòng thủ của bạn là đúng hai con số đó. Map lấy mất một phần
      của nó trước khi bạn chạm tới pack đầu tiên.
    fix: >-
      Không bao giờ chạy chúng. Tác giả tự đưa regex bắt được cả hai, cùng
      với cái mod cho quái né bleed.
  - situation: "Chaos damage, ở bất kỳ mức nào bạn chưa tính trước"
    cause: >-
      Đây là cái lớp mỏng duy nhất của build. File level 98 hoàn chỉnh của
      tác giả có 47% chaos resistance và sống được một cú hit chaos 20,810,
      so với tầm 57,000 elemental: khoảng một phần ba. Đó là số trên engine
      3.29 cho gear đã hoàn chỉnh. Ở map đầu, guide chỉ bảo bạn đẩy chaos
      resistance về 0%.
    fix: >-
      Cứ nâng chaos resistance lên tiếp sau khi các elemental resistance đã
      cap, và tính dư ra trước khi vào nội dung nặng chaos. Guide không nêu
      tên món cụ thể nào cho việc này, nên chúng tôi cũng không.
  - situation: "Một con boss bạn phải đi vào qua portal hoặc qua màn hình loading"
    cause: >-
      Endurance charge mất ở màn hình loading. Guide tính tám charge là 32%
      physical và 32% elemental damage reduction, và theo phép tính của
      chúng tôi chúng còn là +24% damage over time multiplier cho bleed, nên
      bạn tới nơi vừa mềm hơn vừa yếu hơn.
    fix: >-
      Bấm [[Enduring Cry]] trước khi trận đánh bắt đầu. Nó nằm trong link
      warcry của guide từ map đầu, và mỗi cái [[Kaom's Sign]] cũng mang sẵn
      một cái level 10.
  - situation: "Cú hit lớn mà block không bắt được"
    cause: >-
      Block là xác suất. Ở mức 88% của guide thì khoảng một trong tám cú hit lọt qua,
      và block không làm cú đó nhỏ đi chút nào. Thứ còn lại là armour,
      endurance charge và life: file hoàn chỉnh của tác giả sống được 21,800
      physical trong một cú hit, trên engine 3.29 với gear endgame. Không
      nguồn nào liệt kê đây là một nguyên nhân chết; nó suy ra từ chuyện
      block là một lần roll.
    fix: >-
      Bước ra khỏi mấy đòn lớn có báo trước. Vết bleed vẫn trừ máu trong lúc
      bạn làm vậy, nên né không làm build này mất damage. Một cây shield có
      "Recover 5% of Life when you Block" đổ đầy lại máu cho bạn giữa các cú
      hit; nó không giúp gì với cú hit bạn block hụt.
  - situation: "Một con boss có cổng kiểm damage, đồng hồ enrage hoặc một phase phải kết thúc nhanh"
    cause: >-
      Bleed gây damage ở tốc độ cố định, và không nút nào bạn bấm làm nó
      nhanh hơn được. Lời tự nhận xét của tác giả về build của anh ta là
      "damage không điên".
    fix: >-
      Không có cách chữa nào nằm ở cách chơi. Thêm damage nghĩa là một cây
      axe tốt hơn, hoặc cái six-link [[Lacerate of Haemorrhage]] mà tác giả
      để dành cho uber pinnacle boss. Nếu mấy trận kiểu này là kế hoạch
      league của bạn, lời khuyên của chính bài này là chọn build khác.

troubleshooting:
  - symptom: "Không thứ gì chết trong một map cụ thể"
    cause: >-
      Gần như chắc chắn là "Monsters have a chance to avoid Poison, Impale
      and Bleeding". Nguyên văn lời tác giả: nếu không bleed được thì không
      gây damage được.
    fix: >-
      Reroll map đó. Mod này, và cặp mod cắt Armour hoặc Chance to Block, là
      hai thứ build không bao giờ chạy.
  - symptom: "Boss và quái Rare chết quá lâu"
    cause: >-
      Một phần là do build, vốn không có burst. Mấy phần bạn sửa được là
      đây. (a) Bạn giã nhanh hơn tốc độ vết nứt nổ, mà mấy vết nứt tạo ra
      trước cú nổ đầu tiên thì không có dư chấn. (b) Bạn vừa qua một màn
      hình loading và không còn endurance charge nào. (c) [[Vulnerability]]
      không nằm trên mục tiêu, hoặc gem không có quality.
    fix: >-
      (a) Giã, chờ vết nứt nổ, giã tiếp; [[Less Duration Support]] rút ngắn
      quãng chờ. (b) Bấm [[Enduring Cry]] ngay khi tới nơi. (c) Curse trước
      và giữ quality trên gem: đó là 30% increased physical damage taken.
  - symptom: "Cây axe mới hiện damage mỗi giây cao hơn, mà boss chết không nhanh hơn"
    cause: >-
      Bleed được tính từ physical damage của cú hit đã áp nó, không phải từ
      damage mỗi giây. Attack speed nằm thứ chín trong danh sách scale của
      chính tác giả.
    fix: >-
      So axe theo physical damage cận trên; mốc là 550 trở lên. Rồi kiểm cái
      socket dưới [[Earthquake]]: socket đúng màu của gem cho +10% quality,
      tức là 10% more aftershock damage.
  - symptom: "Nhân vật tệ đi ngay sau Merciless Labyrinth"
    cause: >-
      Nhiều khả năng nhất là đổi nửa vời. [[Determined Survivor]] chỉ cho
      block khi có shield, và cây vẫn đang dựng cho axe hai tay cho tới khi
      bạn respec nó. Làm nửa vời thì tệ hơn cả hai đầu.
    fix: >-
      Làm cả ba bước trong một lần ngồi: lấy Determined Survivor, đeo axe
      một tay cùng một shield, và respec mấy node hai tay sang block, shield
      và armour mastery. File Path of Building công bố có một bản cây đặt
      tên đúng cho bước này.
  - symptom: "Clear chậm, và loot lúc nào cũng nằm sau lưng bạn"
    cause: >-
      Một cú giã ở 75% attack speed của bạn, một vòng dư chấn một giây và
      khả năng di chuyển thấp, vốn là nhược điểm chính tác giả tự liệt kê:
      [[Shield Charge]] với một Flame Dash là toàn bộ phần di chuyển trong
      các bộ gem cho map của anh ta. Mấy cú nổ giết những
      con quái bạn đã đi qua, và chúng cần pack dày thì mới lan. Tác giả tự
      chấm map clear của mình 3 trên 5.
    fix: >-
      Một loot filter tốt, và đó là câu trả lời của chính tác giả. Không có
      gì hỏng trong nhân vật của bạn; đây là nhịp của build.
  - symptom: "Máu của bạn tụt mỗi lần bạn đánh"
    cause: >-
      [[Blood Magic]]. Skill tốn máu thay vì mana trong mọi bản cây, và file
      công bố ghi 55 life mỗi lần dùng.
    fix: >-
      Không có gì sai cả. File hoàn chỉnh hồi tầm 1,100 life mỗi giây, trên
      engine 3.29, và [[Vitality]] nằm trong link aura của guide từ campaign
      trở đi. Thứ bạn mất là mọi nút cứu mạng dùng mana.

patch:
  - note: >-
      **Không có gì trong build này đổi.** [[Gladiator]] không được nhắc một lần
      nào trong các phần dành cho game thường của patch note. Không có thay đổi
      nào về [[Earthquake]], [[Sunder]], [[Fist of War Support]], slam, bleed,
      aggravate hay block ở bất cứ đâu.
  - entry: ruthless-changes
    note: >-
      **Dòng duy nhất về Gladiator trong patch note không nói về bạn.** Lần duy
      nhất chữ "Gladiator" xuất hiện trong cả patch note là bên trong phần
      Ruthless, và nó nói về notable cùng tên của Scion Ascendant bị hạ từ 50%
      xuống 40% shield block. **[[Determined Survivor]] của Duelist vẫn là 50%
      trong game thường**, được xác nhận bằng dữ liệu cây chính thức và được một
      tác giả Maxroll thứ hai nhắc lại độc lập. Nếu bạn đọc thấy block của
      Gladiator bị nerf, đó chính là chỗ sai.
  - entry: item-tiers
    note: >-
      **Một buff trực tiếp cho chuyện lo gear.** Đồ rare và magic giờ mang tier từ
      Act 6 trở đi, ảnh hưởng tới tier của mod, base level, quality, socket và
      link. Build này đeo mười một ô đồ rare và craft gần như mọi thứ, nên nó được
      lợi nhiều hơn phần lớn build khác.
  - entry: mercenary-nerfs
    note: >-
      **Buff tương đối.** Mercenary bị cắt rất nặng mà build này không dùng con
      nào.
  - entry: loot-rarity-rework
    note: >-
      **Khớp rất tốt.** Giá trị giờ dồn vào quái rare với unique và vào boss. Một
      build mà chính tác giả cho 4 trên 5 về bossing và 5 trên 5 về survivability
      thì đang được chỉ đúng vào chỗ có phần thưởng.
  - entry: league-fates
    note: >-
      **Khớp nhất trên site này, kèm một điểm bảo lưu.** League cho bạn tăng cường
      một con boss khu vực rồi lấy [[Viscera]] từ nó cho [[Wickerman]] của bạn.
      Aggravate bảo đảm thì đáng giá nhất đúng vào lúc uptime đánh của bạn bị
      ngắt, mà đó chính là thứ một trận boss khó hơn với nhiều thứ phải né tạo ra.
      Damage của bạn cũng tiếp tục trừ máu trong lúc bạn né. Điểm bảo lưu: chưa ai
      thử bất cứ điều nào trong số này trong 3.30, kể cả tác giả.
  - note: >-
      **Một cú nerf cụ thể cho lộ trình gear của bạn.** Tác giả ghi chú ngay trong
      bài rằng recombinator bị nerf trong 3.30 với mức độ hiện chưa rõ. Chuyện đó
      làm xấu đi đường rẻ hơn trong hai đường dẫn tới cây axe endgame. Mức độ chưa
      được kiểm; chưa ai công bố con số nào.
  - note: >-
      **Một lựa chọn phòng thủ mới mà guide đã dùng sẵn.** 3.30 thêm mấy
      ascendancy thay thế hệ Bloodline, và tác giả đã tích hợp một trong số đó như
      một phương án đổi cho [[Jagged Technique]] nếu mấy viên jewel của bạn chưa
      tới. Đó là thêm một bằng chứng rằng guide này đúng là mới.

strengths:
  - "Build trâu nhất trên site này. Tầm 88% block cho attack và spell, với 90% physical damage reduction."
  - "Damage vẫn trừ máu trong lúc bạn né, nên uptime khi đánh boss không phải vấn đề."
  - "Aggravate bleed được bảo đảm. Không roll xúc xắc, và không phải khởi động lại sau khi bị ngắt."
  - "Quái đang bleed mà bạn giết thì nổ, và mấy cú nổ lan sang nhau."
  - "Dễ lo gear: Resolute Technique bỏ chuyện accuracy, Determined Survivor bỏ chuyện săn dòng block."
  - "Được chính tác giả viết cho solo self-found, kèm một bản cây không dùng suppression có ghi lại."
  - "Guide cập nhật nhất trong mười cái chúng tôi xem. Planner được lưu đúng ngày launch."
weaknesses:
  - "Chậm. Mấy cú giã ở 75% attack speed, một vòng dư chấn một giây, và khả năng di chuyển thấp theo chính danh sách của tác giả: Shield Charge với một Flame Dash là toàn bộ phần di chuyển trong các bộ gem cho map của anh ta."
  - "Không có burst. Bleed là damage over time ở tốc độ cố định, nên cổng kiểm damage và đồng hồ enrage thì không có cách nào."
  - "Quái chết sau lưng bạn. Chữa bằng loot filter, không phải bằng build."
  - "Chaos damage là lớp mỏng: resistance 47% và bộ đệm chỉ bằng tầm một phần ba bộ đệm elemental."
  - "Blood Magic nghĩa là không có nút cứu mạng nào dùng mana, và mỗi lần dùng skill là mất máu."
  - "Hai mod map tắt hẳn bạn chứ không chỉ làm bạn chậm."
  - "Cú đổi hai tay sang một tay giữa campaign là một lần dựng lại thật sự, không phải chỉnh sửa nhỏ."
avoidIf: >-
  Chọn build khác nếu bạn là dân chạy nhanh. Điểm map clear của chính tác giả là 3
  trên 5, mà đó là đã có nổ xác. Bỏ qua luôn nếu bạn muốn xóa boss thật nhanh chứ
  không muốn sống dai hơn chúng, nếu bạn sẽ không đổi cả một six-link gem cho uber
  pinnacle, hoặc nếu bạn ghét respec — cú chuyển hai tay sang một tay là một lần
  dựng lại thật sự ngay giữa campaign. Và nếu kế hoạch league của bạn là nội dung
  nặng chaos, hãy tính dư chaos resistance trước khi bắt đầu.

