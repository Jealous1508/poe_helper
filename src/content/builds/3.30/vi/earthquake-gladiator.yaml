name: Earthquake Gladiator
tagline: >-
  Giã búa xuống đất, để cú dư chấn áp một vết bleed khổng lồ, rồi tha hồ né
  trong lúc nó trừ máu. Quái đang bleed mà bạn giết thì nổ, và nổ lan.
