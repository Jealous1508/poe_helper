budgetNote: >-
  **Không có con số giá nào cho build này trong bất kỳ nguồn nào, ở bất kỳ patch
  nào.** Guide không trích một con chaos hay một con Divine nào cả — ngôn ngữ
  tiền tệ duy nhất là "a couple of Chaos Orbs" cho vài món unique giai đoạn đầu
  và "ít nhất một [[Mirror of Kalandra]]" cho cây axe cuối game. Nên thậm chí
  không có con số 3.29 cũ nào để mà cảnh báo bạn. Thứ được công bố là điểm budget
  của chính tác giả, Moderate, 3 trên 5, và một rủi ro chi phí được nêu tên:
  [[Ryslatha's Coil]]. Hai guide Gladiator phổ biến đều cần cây belt đó, nên chờ
  nhu cầu dồn vào nó trong tuần đầu league.
