      Damage thôi đến từ cây và bắt đầu đến từ implicit với một cây axe tốt hơn.
      Điểm cuối là một cây axe có synthesised implicit ở 800+ physical cận trên,
      mà tác giả nói tốn ít nhất một [[Mirror of Kalandra]].
    links:
      - name: "Chạy map: bộ Exceptional Gems trong file Path of Building"
        gems: [Earthquake, Melee Physical Damage Support, Brutality Support, Fist of War Support, Fortify Support, Less Duration Support]
      - name: "Đánh uber boss: bộ Exceptional Gems"
