name: Flame Link Mercenary Luminary
tagline: >-
  Bạn thuê hẳn một Mercenary, buộc mình vào nó bằng một cái Link, và nó lo
  chuyện giết quái trong lúc bạn gánh aura. 3.30 cắt nó ở bốn chỗ. Nó vẫn chơi
  được, và nó không còn là cái build mà mấy video 3.29 chiếu nữa.
class: Scion
ascendancy: Luminary
role: endgame
budget: medium
budgetNote: >-
  **Mọi con số ở đây đều từ 3.29 và không con nào là giá hiện tại.** Đường vào
  thì rẻ: guide của Allie nói bộ đồ support đầu tiên chỉ tốn vài Chaos Orb,
  nguyên văn "the few Chaos Orbs required to buy everything", và ghi chú
  leveling của cô gợi ý kiếm 30–40 Chaos từ một hai tiếng chạy Heist, một kế
  hoạch mà 3.30 đã làm đổi (xem mục 3.30 đổi gì cho build này). Khúc giữa thì
  không rẻ: cô cảnh báo Mercenary tốt sẽ khá đắt, "will get quite expensive",
  và bản chạy được Tier 16 cần [[Crystallised Omniscience]], món PoEDB ghi là
  rơi từ Uber Searing Exarch. Khúc trên cùng thì không có trần. Chữ của chính
  cô cho nhân vật hoàn chỉnh là "multiple mirrors deep", ngập sâu nhiều
  Mirror. Không nguồn nào đưa ra con số tổng, nên chúng tôi cũng không đưa.
mainSkill: Flame Link
