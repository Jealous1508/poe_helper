hero: art-ascendant
tags: [Mercenary, Support, Auras, Link, Life stacking]
ratings: { clear: 4, bossing: 3, survivability: 4, ease: 2 }
verified: "2026-11-14"
confidence: predicted
confidenceNote: >-
  **Kết luận: chơi được nhưng đã bị cắt, chứ chưa bị khai tử.** Cái đã được
  xác nhận: bốn cú nerf của 3.30, từng chữ theo patch note chính thức, và dòng
  Golden Glory trong dữ liệu passive tree của chính GGG, giờ ghi "at 50% of
  their value", tức là tính ở 50% giá trị. Cái chưa: nó chơi ra sao. Hai tác
  giả có tiếng đã đăng lại cho 3.30 vào ngày 12–13/11. Allie gọi guide của cô
  là "fully updated", cập nhật đầy đủ, nhưng file Path of Building của nó vẫn
  mang passive tree 3.29 trên cả 23 trang, video leveling của cô được quay
  trước khi Mercenary tồn tại, và phần chữ vẫn nêu tên hai món cô đã bỏ và một
  món không còn chạy trên Mercenary. CaptainLance9 đặt ngay đầu trang của anh
  dòng "did NOT have time to fully update", không kịp cập nhật đầy đủ. Không
  ai trong hai người có nhân vật 3.30 để đưa ra khi chúng tôi đọc họ ngày
  14/11. Bốn điểm số là của chúng tôi, và phép tính so 3.29 với 3.30 trong bài
  này cũng là của chúng tôi, có đánh dấu ở chỗ nó xuất hiện.
modes:
  ssf: >-
    Không hợp, và không nguồn nào nói khác. Damage đến từ một con Mercenary cụ
    thể với skill và support cụ thể, thứ người chơi trade mua dưới dạng một tờ
    [[Mercenary Warrant]]; chơi một mình thì bạn reset zone cho tới khi nó
    xuất hiện. Bản Tier 16 dựa vào [[Crystallised Omniscience]], đồ rơi từ
    Uber boss. Nửa leveling — [[Righteous Fire]] — thì solo self-found chơi
    ổn. Đây là cách đọc của chúng tôi; các guide không bàn chuyện này.
  hardcore: >-
    Không nguồn nào đưa ra kết luận. Bản thân nhân vật thì cứng: một Scion
    stack life với năm aura trở lên và về sau cap block. Rủi ro nằm ở chỗ
    khác. [[Oath of Fealty]] giúp bạn không chết khi con Mercenary đang được
    link chết, nhưng damage của bạn chết theo nó, và từ 3.30 một con Mercenary
    có −60% all resistances trong map. Cách đọc của chúng tôi: làm được với
    người đã từng chơi nó, còn làm nhân vật hardcore đầu tiên thì tệ.

idea: |
  [[Luminary]] là ascendancy thứ ba của Scion. Notable đầu tiên của nó, [[Noble Blood]], cho bạn thuê vĩnh viễn một [[Mercenary]] và mặc đồ cho nó như một nhân vật thứ hai. Từ đó bạn thôi làm người gây damage. Mercenary bắn; bạn làm nó mạnh lên.

  Công cụ chính là [[Flame Link]]. Nó buộc bạn vào một đồng minh và cho đồng minh đó added fire damage: một lượng cố định từ gem, cộng 3% maximum life của **bạn**. Nên bạn stack life chứ không stack damage, và mỗi điểm life là damage cho người khác.

  Trên đó nữa, bạn chạy nhiều aura hết mức nhét vừa, và một trợ thủ thứ hai — một con [[Animate Guardian]] mà guide gọi là Bob — mặc mấy món cũng buff cho Mercenary.

  [[Golden Glory]] là notable làm nên tên tuổi build ở 3.29: [[Light Radius]] của bạn cũng nâng luôn effect của Link trên Mercenary. 3.30 cắt nó một nửa. Trong guide 3.30 chi tiết nhất, giờ nó là một bước đệm cho mấy map đầu, và bị gỡ ra lại ở Tier 16.

chain:
  - label: Thuê
    text: "[[Noble Blood]] cho bạn giữ hẳn một [[Mercenary]]. Con bạn cần là một con dùng bow tên Manyshot, có Vaal Ice Shot."
  - label: Link
    text: "[[Flame Link]] cho nó added fire damage: 219–329 từ một viên gem level 20, cộng 3% maximum life của bạn. [[Oath of Fealty]] làm Link kéo dài hết cả khu vực."
  - label: Nhân lên
    text: "Aura, một cái mark trên boss, buff của [[Smite]] và đồ của Bob đều rơi lên Mercenary. Giai đoạn đầu, [[Light Radius]] qua [[Golden Glory]] nâng chính cái Link."
  - label: Sống sót
    text: "Bạn là một người gánh aura stack life, có [[Purity of Elements]] và về sau thêm ba Purity nữa cùng 90% maximum resistances. Việc của bạn là đừng chết."

chainDetails:
  - title: 3.30 lấy đi những gì, bằng con số
    body: |
      Bốn thay đổi riêng rẽ đánh vào build này. Cả bốn đều nằm trong các mục game thường của patch note chính thức; không cái nào từ mục Ruthless.

      1. **[[Golden Glory]]**: Light Radius áp vào Link effect trên Mercenary "at 50% of their value (previously 100%)" — còn 50% giá trị, trước là 100%.
      2. **[[Flame Link]]**: 3% maximum life của bạn, giảm từ 5%. Phần damage cố định của chính viên gem thì tăng, từ 169–254 lên 219–329 ở level 20.
      3. **Mercenary**: "up to 20% less Attack Damage at level 83" (tới 20% less attack damage ở level 83), −60% all resistances ở khu vực level 68 trở lên, ít damage reduction hơn ở level cao, nhiều life hơn.
      4. **Item**: [[The Untouched Soul]] và Screams of the Desiccated không còn chạy trên Mercenary, và Mercenary không đeo được [[Kalandra's Touch]]. Một bản sửa bug cũng chấm dứt chuyện Eldritch implicit "while a Pinnacle Boss is in your Presence" lúc nào cũng bật trên Mercenary.

      Có một thay đổi đi theo chiều ngược lại. Light Radius trên weapon, helmet và ring rare giờ roll tới 30%, trước là 15%.
  - title: "Phép tính của chúng tôi: Flame Link còn lại bao nhiêu"
    body: |
      Đây là phép tính của riêng chúng tôi, từ các con số trong patch note. Chưa ai công bố một con số đo thật.

      Lấy trung bình khoảng damage của gem rồi cộng phần ăn theo life. Ở gem level 20, đó là 211.5 + 5% life ở 3.29, và 274 + 3% life ở 3.30. Hai bên bằng nhau ở khoảng 3,100 life. Dưới mức đó, viên gem mới tốt hơn.

      | Life của bạn | 3.29 | 3.30 | Thay đổi |
      |---|---|---|---|
      | 3,000 | 362 | 364 | ngang |
      | 6,000 | 512 | 454 | −11% |
      | 9,160 | 670 | 549 | −18% |
      | 13,900 | 907 | 691 | −24% |

      9,160 là life trên planner ngày đầu của CaptainLance9; 13,900 là life trên nhân vật 3.29 hoàn chỉnh của Path of Evening. Kết quả khớp với điều CaptainLance9 viết mà không trình bày cách tính: Flame Link "same ish early game" (đầu game gần như cũ), "10–30% lower late game" (cuối game thấp hơn 10–30%).
  - title: "Phép tính của chúng tôi: Golden Glory trên đồ rare thì gần như ngang, trên unique thì không"
    body: |
      Cũng là của chúng tôi.

      Bốn ô rare mang được Light Radius: weapon, helmet và hai ring. Ở 3.29 mỗi ô roll 15%, và Golden Glory tính hết: 60% more Link effect. Ở 3.30 mỗi ô roll 30% và Golden Glory tính một nửa: lại là 60%. Trên đồ rare, cú buff và cú nerf triệt tiêu nhau.

      Chỗ mất nằm ở unique. Một cây Rotmother's Mutiny roll đỉnh là 75% ở 3.29. Giờ nó roll 20–40%, tính một nửa: 10–20%. [[The Hallowed Monarch]] từng là 50%, giờ là 25–35% tính một nửa: 12.5–17.5%.

      Nên người mất nhiều nhất là người stack Light Radius nặng tay nhất. Đó cũng là lý do một video 3.29 là chỉ dẫn tồi cho thứ bạn sẽ thấy.
  - title: Một con số trong guide 3.30 tính không ra
    body: |
      Setup support đầu tiên của Allie đạt 152% Light Radius và nói mức này "will over double the total benefit" của Flame Link, tức là hơn gấp đôi tổng lợi ích.

      Theo tỉ lệ 3.30, 152% Light Radius là 76% more Link effect, không phải trên 100%. "Over double" thì đúng theo tỉ lệ 3.29. Hoặc câu đó chưa được sửa, hoặc nó tính thứ gì mà trang không cho thấy. Hãy lên kế hoạch theo 76%.
  - title: Hai tác giả, hai câu trả lời về Golden Glory
    body: |
      **Allie** lấy Golden Glory sau cùng, ở Eternal Labyrinth, đeo đồ Light Radius qua map trắng và map vàng, rồi gỡ notable đó ở Tier 16. Hai điểm chuyển sang Legendary Helmets và Legendary Amulets để Mercenary đeo được [[Black Sun Crest]] và [[Crystallised Omniscience]]. Theo chữ của cô, lúc đó weapon và ring Light Radius của người chơi là "useless", vô dụng.

      **CaptainLance9** lấy nó thứ ba, ở Merciless Labyrinth, và dựng cây quanh effect của Flame Link và life của bạn. Trang của anh nói aura effect chỉ quan trọng hơn "in giga late game setups", ở mấy setup cuối game cực nặng.

      Chúng tôi không đọc được bản chữ 3.29 của Allie, nên không nói được việc bỏ notable này có phải là mới của patch này hay không. Điều chúng tôi nói được là trong bản 3.30 của cô, "build Light Radius" sống được khoảng mười lăm level.
  - title: Mercenary nào, và vì sao không phải con nào cũng được
    body: |
      Mercenary chia theo loại, và mỗi loại rút skill từ một nhóm cố định. Cả hai guide 3.30 lẫn cái guide 3.29 đều đồng ý về con đa dụng tốt nhất: **Manyshot**, một con dùng bow lúc nào cũng có Ice Shot.

      Cần tìm gì, theo Allie và CaptainLance9:

      - **Vaal Ice Shot.** Đây là damage đánh boss của nó.
      - **Không có Icicle Rain.** Skill này không có cooldown, nên Mercenary cứ đổi sang nó hoài và mất cả clear lẫn damage.
      - **Returning Projectiles trên skill của nó.** Allie nói nó nhân đôi damage của mỗi skill, nhưng chỉ khi projectile pierce được một lần trước đã: hoặc một support Pierce trên skill, hoặc +1 pierce craft trên gear của Mercenary.

      **Kineticist**, một con dùng wand có Kinetic Blast of Clustering, clear tốt nhất và hiếm. 3.30 chỉnh Kinetic Blast của nó về "150% Arcane Might, matching the player version" (trước là 200%), cho khớp với bản của người chơi, và sửa một bug ở bán kính clustering. CaptainLance9 đọc ý đầu là spell damage được tính một lần rưỡi ở chỗ trước đây tính gấp đôi.

      Level của Mercenary đi theo bạn. Gear của nó thì không: nó không đeo được món nào có item level cao hơn khu vực bạn thuê nó. Một con Mercenary từ Act 4 thì không bao giờ đeo được đồ endgame.
  - title: Trợ thủ thứ hai, Bob
    body: |
      Bob là tên Allie đặt cho một con [[Animate Guardian]]. Nó là kiểu bạn đồng hành đời cũ hơn: bạn thả item xuống đất và nó mặc luôn vĩnh viễn. Nó dùng được weapon, shield, helmet, body armour, gloves và boots.

      Giai đoạn đầu nó mang [[Dying Breath]] và [[Leer Cast]], hai món nâng damage của đồng minh đứng gần nó. Về sau nó nhận [[Kingmaker]], [[Crown of the Tyrant]] và [[Garb of the Ephemeral]].

      Nó là phần mong manh của kế hoạch. Chính Allie nói vậy: nó chết khi bạn tới map Tier 16, cho tới khi bạn đội [[The Hallowed Monarch]], món cho bạn Link một minion và làm minion đó nhận ít hơn 65–75% damage.

      Gỡ [[Animate Guardian]] khỏi thanh skill khi nó đã mặc đồ xong. Bấm nó lên một item khác là thay luôn thứ nó đang mặc, không có cảnh báo nào.

mandatory:
  - term: Flame Link
    why: >-
      Chính là build. Scion nhận nó làm reward của quest Breaking the Seal ở
      Act 4. Giữ [[Lifetap Support]] trên nó để nó không bao giờ tắt vì thiếu
      mana.
    detail: >-
      PoEDB vẫn hiện giá trị 3.29 và 3.30 cạnh nhau trên cùng một trang. Giá
      trị 3.30 là 219–329 ở level 20 và 3% maximum life của bạn.
  - term: Noble Blood
    why: >-
      "You can hire a Mercenary permanently." — bạn thuê được một Mercenary
      vĩnh viễn. Không có nó thì không có build. Mercenary thuê vĩnh viễn gây
      ít damage hơn con thuê tạm. PoEDB ghi giá trị ẩn là 30% less.
  - term: Oath of Fealty
    why: >-
      Link kéo dài hết cả khu vực, tốn một nửa, và bạn không còn chết khi con
      Mercenary được link chết. Mỗi map bạn cast [[Flame Link]] một lần.
  - term: Legendary Arms
    why: >-
      Cho Mercenary dùng weapon, shield và quiver unique, và cho nó 8% more
      damage với mỗi món unique nó đeo. Mấy node nhỏ phía trước nó mỗi node mở
      thêm một ô unique.
  - term: Mercenary
    why: >-
      Một con Manyshot có Vaal Ice Shot và không có Icicle Rain, hoặc một con
      Kineticist có Kinetic Blast of Clustering. Đừng vào map làm support khi
      chưa có một trong hai; ghi chú của Allie lặp lại điều đó ba lần.
  - term: Righteous Fire
    why: >-
      Cách bạn lên level. Cả hai guide 3.30 dùng nó từ Act 2 vì cây life với
      regeneration của nó trùng với cây support, nên lần respec về sau nhỏ.
  - term: Purity of Elements
    why: >-
      Aura đầu tiên của bạn và, từ 3.30, cũng là resistance của Mercenary. Giờ
      nó có −60% all resistances trong map.
  - term: The Hand of Phrecia
    level: recommended
    why: >-
      20–40% more aura effect khi bạn có mục tiêu đang được link. Với
      [[Oath of Fealty]] thì là luôn luôn.
    detail: >-
      Nó cũng làm aura của bạn chỉ áp lên bạn và các mục tiêu được link. Đó là
      lý do Bob không nhận gì từ aura của bạn cho tới khi bạn Link được cả nó.
      Allie cũng bỏ Stormblast Mine vì nó "does not work", không chạy, với đôi
      gloves này.
  - term: Golden Glory
    level: recommended
    why: >-
      Light Radius cộng vào Link effect trên Mercenary ở một nửa giá trị. Đáng
      lấy khi bạn đeo bốn món rare có Light Radius; Allie bỏ nó ở Tier 16,
      CaptainLance9 thì giữ.
  - term: Light Radius
    level: recommended
    why: >-
      Tới 30% mỗi món trên một weapon một tay rare, một helmet và hai ring kể
      từ 3.30. [[Lori's Lantern]] là cái ring dự phòng.
  - term: Soulthirst
    level: recommended
    why: >-
      Đeo trên Mercenary. Soul Eater trong lúc có bất kỳ flask effect nào: 5%
      attack speed mỗi soul, tối đa 45.
    detail: >-
      Nó cần [[Ceinture of Benevolence]] trên người bạn, món làm utility flask
      của bạn áp lên các mục tiêu được link. Vì người uống flask là bạn chứ
      không phải Mercenary, soul của nó không bị reset.
  - term: Ceinture of Benevolence
    level: recommended
    why: >-
      Belt của bạn cho tới khi Mercenary có [[Headhunter]]. Nó là nửa còn lại
      của mẹo [[Soulthirst]] và thiếu nửa kia thì chẳng làm gì.
  - term: Animate Guardian
    level: recommended
    why: >-
      Bob. Người mang buff thứ hai cho Mercenary. Dùng gem thường, không phải
      bản Smiting: Allie chọn nó vì thêm life.
  - term: Smite
    level: recommended
    why: >-
      Buff của nó cho đồng minh added lightning damage. Trong map thì vài giây
      bấm một cái; đánh boss thì giữ nút khi đã link [[Pyre Support]].
  - term: Crystallised Omniscience
    level: recommended
    why: >-
      Trên Mercenary từ Tier 16. Mọi attribute thành Omniscience, và cứ 15
      điểm cho nó 1% elemental penetration và 1% elemental resistance.
    detail: >-
      Đây là thứ thay Enmity's Embrace trong guide của Allie ngày 11/11. Cô
      không nói vì sao. Cách đọc của chúng tôi: cái ring đó scale theo fire
      resistance của Mercenary, thứ bị 3.30 đánh hai lần — −60% trong map, và
      [[The Untouched Soul]] không còn chạy trên Mercenary.
  - term: Alpha's Howl
    level: recommended
    why: >-
      +2 cho aura gem gắn trong nó và phần reservation để nhét thêm một aura.
      Helmet của bạn ở Tier 16, cho tới khi [[The Hallowed Monarch]] chiếm ô
      đó.
  - term: The Hallowed Monarch
    level: recommended
    why: >-
      Cho Link nhắm được vào minion, và minion được bạn link nhận ít hơn
      65–75% damage. Đây là thứ giữ Bob sống ở map đỏ.
    detail: >-
      Light Radius của nó là 25–35% kể từ 3.30, giảm từ 50%. PoEDB vẫn hiện
      50%.

labs:
  - lab: Normal
    node: Noble Blood
    why: "Allie chạy nó ở Act 4 sau level 31, rồi thuê ở The Grand Arena. CaptainLance9 chạy nó ở Act 3 và thuê ở The Sceptre of God. Kiểu nào cũng vậy, hãy ascend **trước** khi đi tìm Mercenary, không thì bạn không giữ được nó."
  - lab: Cruel
    node: Oath of Fealty
    why: "Act 7 theo ghi chú của Allie. Từ đây mỗi khu vực bạn cast [[Flame Link]] một lần."
  - lab: Merciless
    node: Legendary Arms
    why: "Thứ tự của Allie: lấy nó ở Act 10 **đi qua node Legendary Belts**, để Mercenary đeo được [[Soulthirst]]. CaptainLance9 thì lấy [[Golden Glory]] ở đây và Legendary Arms sau cùng."
  - lab: Eternal
    node: Golden Glory
    why: "Thứ tự của Allie, khoảng level 80–85, khi bạn đã yên vị làm support. Cô lại gỡ nó ra ở Tier 16 để lấy Legendary Helmets và Legendary Amulets."

stages:
  - id: acts-1-3
    phase: early
    image: righteous-fire
    title: Act 1–3
    levels: Level 1–31
    uses: >-
      [[Spectral Throw]] cho Act 1, [[Sunder]] từ level 12, rồi
      [[Righteous Fire]] từ khoảng level 18 với [[Scorching Ray]] cho boss.
      Bạn là một Scion Righteous Fire bình thường; nửa này không có gì là build
      Mercenary cả.
    changes: >-
      Muốn đổi sang Righteous Fire thì cần 75% fire resistance trước: hai Ruby
      Ring, notable Arsonist và cái [[Fire Mastery]] cho life regeneration
      theo mỗi 1% fire resistance. Ở level 24, [[Fire Trap]] thay Scorching
      Ray và [[Shield Charge]] thay [[Leap Slam]].
    links:
      - name: Level 1–11
        gems: [Spectral Throw, Volley Support]
      - name: Level 12–17
        gems: [Sunder, Chance to Bleed Support, Ruthless Support]
      - name: Từ level 18
        gems: [Righteous Fire, Efficacy Support, Elemental Focus Support]
      - name: Boss, level 18–23
        gems: [Scorching Ray, Efficacy Support]
      - name: Di chuyển và aura
        gems: [Leap Slam, Faster Attacks Support, Frostblink, Vitality]
    moveOn: "Righteous Fire đã bật, fire resistance của bạn trên 75%, và bạn đang ở Act 4, sẵn sàng cho Labyrinth đầu tiên."
    details:
      - title: Các guide không thống nhất lúc nào bắt đầu Righteous Fire
        body: |
          Trang tổng quan của Allie nói dùng Sunder "until Level 24", tới level 24. Ghi chú leveling của chính cô, nằm trong file Path of Building, thì nói level 18, sau Chambers of Sin, còn [[Fire Trap]] tới ở 24. CaptainLance9 nói "~Lvl 18ish".

          Hai chọi một, mà cái một lại là bản tóm tắt. Dùng 18.
      - title: Phải có gì trước khi bật nó
        body: |
          Theo ghi chú của Allie:

          - Notable Arsonist và cái Fire Mastery "Regenerate 1 Life per second for each 1% Uncapped Fire Resistance".
          - Hai Ruby Ring. Nếu vendor không có, bán một Iron Ring kèm một skill gem đỏ để lấy một cái.
          - 75% fire resistance. Mỗi điểm vượt cap vẫn cộng thêm regeneration.
          - Một [[Orb of Alteration]] để mua gem từ Yenna, và hai [[Orb of Transmutation]] cho mấy support. Bán đồ magic chưa identify để lấy Transmutation shard.

          Cô cũng muốn có hai mana flask trước Brutus và Merveil.
      - title: Video leveling không phải build này
        body: |
          Allie dẫn link một lượt leveling đầy đủ. Ghi chú của cô nói thẳng rằng nó được quay "before Mercs were added into the game as a Reliquarian" — trước khi game có Mercenary, bằng một con Reliquarian — và "not 100% accurate to this exact guide", không khớp 100% với đúng guide này.

          Nó cho thấy lộ trình Righteous Fire. Nó không cho thấy chuyện thuê hay link.
      - title: Bandit
        body: |
          Allie giúp **Alira** để lấy resistance và chuyển sang giết cả ba ở Tier 16, khi mấy Purity đã lo phần resistance. CaptainLance9 ghi Kraityn hoặc giết hết. Không nguồn nào biện luận cho chỗ khác nhau đó.
  - id: acts-4-10
    phase: early
    image: flame-link
    title: Act 4–10
    levels: Level 31–70
    uses: >-
      [[Righteous Fire]] vẫn là damage của bạn. Từ Act 4 bạn còn có một
      [[Mercenary]] đã thuê với [[Flame Link]] trên người nó, và nó gánh phần
      việc ngày một lớn.
    changes: >-
      Ba Labyrinth cho bạn [[Noble Blood]], [[Oath of Fealty]] và
      [[Legendary Arms]]. Hễ có con Mercenary tốt hơn xuất hiện là bạn đổi,
      mỗi lần đều chuyển gear của nó sang.
    links:
      - name: Main skill
        gems: [Righteous Fire, Efficacy Support, Elemental Focus Support, Burning Damage Support]
      - name: Boss
        gems: [Fire Trap, Lifetap Support, Trap and Mine Damage Support, Concentrated Effect Support]
      - name: Trên Mercenary
        gems: [Flame Link, Lifetap Support]
      - name: Aura và guard
        gems: [Purity of Elements, Steelskin, Automation, Flammability]
      - name: Di chuyển
        gems: [Shield Charge, Faster Attacks Support, Frostblink]
    moveOn: "bạn đã xong Act 10 với ba notable ascendancy và một con Manyshot hoặc Kineticist thuê từ The Control Blocks."
    details:
      - title: Chỗ nào chắc chắn có Mercenary
        body: |
          Năm khu vực trong campaign lúc nào cũng có một con. Bốn cái đầu đến từ hai nguồn khớp nhau; cái cuối từ Allie và CaptainLance9.

          - Act 3: The Sceptre of God
          - Act 4: The Grand Arena
          - Act 6: The Ridge
          - Act 8: The Hidden Underbelly, đi vào từ The Grain Gate
          - Act 10: The Control Blocks

          Ghi chú của Allie nói thêm rằng Underbelly thôi đảm bảo có một con khi bạn đã level 68 trở lên, còn The Control Blocks thì giữ đảm bảo ở mọi level.

          Trong campaign thì gần như con Mercenary nào cũng mạnh. Danh sách mấy con đầu game tốt của cô: Cruel Mistress có Soulrend of Reaping, Flamehand, Frosthand, Bladecaster, Bladebiter, bất kỳ con Fallen Reverend nào.
      - title: Thuê con Mercenary đi map trước khi giết Kitava
        body: |
          Con Mercenary bạn mang vào map nên đến từ The Control Blocks ở Act 10, vì gear của nó bị chặn ở level của khu vực bạn tìm thấy nó.

          Tìm một con Manyshot có Vaal Ice Shot và một support projectile trên Ice Shot, hoặc một con Kineticist có Kinetic Blast of Clustering. Tránh con Kineticist mà Kinetic Blast duy nhất của nó là bản "Greater": bản đó có cooldown.

          Ghi chú của Allie mô tả cách lấy con mới là rời khu vực rồi mở một bản mới từ waypoint.
      - title: Kế hoạch Heist của cô là kế hoạch 3.29
        body: |
          Ghi chú của Allie bảo bạn gom Heist Contract từ Act 6 và chạy chúng trước Kitava để lấy 50–100 Chaos.

          3.30 đổi cách vào Heist. Rogue's Marker và Contract không còn rơi từ quái thường, và Whakano bán Contract lấy Gold khi bạn đã level 68. Ghi chú của cô không tính tới chuyện đó. Hãy coi 50–100 Chaos là con số 3.29 và lộ trình đó là chưa xác nhận.
      - title: Mấy điều cơ bản về Mercenary hay làm người ta bất ngờ
        body: |
          - Nó không phải minion. Mod minion trên gear và cây của bạn không làm gì cho nó.
          - Nó không làm life của quái tăng lên như khi có người chơi thứ hai.
          - Bạn giữ được ba con, và đổi giữa chúng trong town.
          - Một con Mercenary tới tay đang cầm weapon unique thì không dùng được nó cho tới khi bạn có [[Legendary Arms]]. Đưa nó một cây rare.
  - id: early-maps
    phase: early
    image: golden-glory
    title: Cú đổi sang support, và mấy map đầu
    levels: Level 70–90, map trắng và map vàng
    uses: >-
      Bạn respec khỏi [[Righteous Fire]] và thành support. Bốn món rare có
      [[Light Radius]] cùng [[Golden Glory]], [[The Hand of Phrecia]],
      [[The Jinxed Juju]], và giáp rare có life ở mọi chỗ còn lại. Mercenary
      nhận [[Quill Rain]] và [[Drillneck]], hoặc wand với shield của
      Kineticist.
    changes: >-
      Damage của chính bạn về không, có chủ đích. Bob nhập hội. Eternal
      Labyrinth, ở level 80–85, cho bạn [[Golden Glory]].
    links:
      - name: Link
        gems: [Flame Link, Frostblink, Lifetap Support]
      - name: Aura
        gems: [Purity of Elements, Vitality, Precision, Summon Skitterbots]
      - name: Mana và mark
        gems: [Clarity, Arrogance Support, Sniper's Mark]
      - name: Guard và buff
        gems: [Steelskin, Convocation, Automation, Smite]
      - name: Di chuyển
        gems: [Shield Charge, Faster Attacks Support, Momentum Support]
      - name: Bob
        gems: [Animate Guardian, Minion Life Support, Meat Shield Support, Elemental Army Support]
    moveOn: "bạn clear map vàng với Mercenary gây toàn bộ damage, và bạn đã gần tới Tier 16."
    details:
      - title: Đừng đổi khi chưa có đúng Mercenary
        body: |
          Lời khuyên mạnh nhất của Allie trong cả guide: ở lại với [[Righteous Fire]] cho tới khi bạn có một con Kineticist hoặc Manyshot. Không có thì, theo chữ của cô, "you can potentially be forced to Map with an awful feeling Mercenary that is worse than just playing Righteous Fire" — bạn có thể bị ép chạy map với một con Mercenary chơi dở tệ, còn kém cả việc cứ chơi Righteous Fire.

          The Control Blocks thì lúc nào cũng ở đó để quay lại.
      - title: Mua gì cho bản thân
        body: |
          - Một weapon một tay, một helmet và hai ring, mỗi món có một dòng 30% [[Light Radius]]. Trên weapon thì không gì khác quan trọng, nên tìm Strength. Trên helmet và ring thì life với chaos resistance.
          - [[The Hand of Phrecia]] và, nếu giá cho phép, [[The Jinxed Juju]]. Cả hai đều cộng aura effect. Allie nói cái amulet "tends to be quite expensive early into a season", thường khá đắt lúc đầu mùa: bỏ qua nó và đeo một cái amulet life.
          - Body armour, shield và boots rare trên base armour, có life với resistance. Chưa cần six-link.

          Tổng của Allie là 137% Light Radius, 152% khi tính mấy node Link trên cây. Dưới 3.30 thì đó là 76% more Link effect.

          Mọi link tìm trade trong guide vẫn trỏ vào league 3.29, và trang có nói vậy: "GGG Broke all trade links. I will have to fix them after launch."
      - title: Chạy dàn aura
        body: |
          Lấy notable Sovereignty và Champion of the Cause, không thì aura không nhét vừa.

          [[Vitality]] có thể phải dừng ở level 17–18 để còn trống 30–40 mana. [[Precision]] giữ ở level 1. [[Clarity]] nằm trên [[Arrogance Support]] ở level 3–4. Còn lại lên hết level 20.
      - title: Mercenary mặc gì
        body: |
          Weapon và off-hand unique, rồi đồ rare ở mọi chỗ còn lại:

          - Cap resistance trước. Xem tab Defensive của nó.
          - Một dòng attack leech trên amulet hoặc ring của nó, "to make sure they do not die", để chắc là nó không chết.
          - Accuracy trên helmet và amulet, attack speed trên gloves và ring.
          - [[Soulthirst]] làm belt của nó ngay khi bạn mua nổi, cùng [[Ceinture of Benevolence]] trên người bạn.

          Bước resistance quan trọng hơn mức câu chữ của guide gợi ra. Câu đó được viết khi Mercenary chưa có penalty resistance nào.
      - title: Lời khuyên Atlas mà chúng tôi không nhắc lại
        body: |
          Allie nêu tên mấy passive Atlas để tăng cơ hội gặp đúng loại Mercenary. 3.30 dựng lại cây Atlas và làm lại cụm Mercenary, mà phần chữ của guide có từ trước đó. Chúng tôi không kiểm được một cái tên node nào trong đó với cây mới, nên chúng không được liệt kê ở đây.
  - id: red-maps
    phase: endgame
    image: purity-of-elements
    title: "Map đỏ: bản chạy được đầu tiên"
    levels: Level 90, map Tier 14–16
    uses: >-
      [[Alpha's Howl]] trên người bạn để thêm một aura. Trên Mercenary:
      [[Crystallised Omniscience]], [[Black Sun Crest]] và đồ rare có hai dòng
      attribute trên mỗi món.
    changes: >-
      Build thôi là build Light Radius. [[Golden Glory]] được gỡ ra; hai điểm
      của nó chuyển sang Legendary Helmets và Legendary Amulets.
      [[Purity of Fire]] thay [[Summon Skitterbots]], và [[Haste]] hoặc
      [[Anger]] vào khi bạn có notable Leadership và Charisma.
    links:
      - name: Link
        gems: [Flame Link, Frostblink, Lifetap Support]
      - name: Aura
        gems: [Purity of Elements, Haste, Purity of Fire, Vitality]
      - name: Buff
        gems: [Smite, Pyre Support, Precision, Generosity Support]
      - name: Mana
        gems: [Clarity, Arrogance Support]
      - name: Guard và mark
        gems: [Steelskin, Convocation, Automation, Sniper's Mark]
      - name: Bob
        gems: [Animate Guardian, Minion Life Support, Meat Shield Support, Elemental Army Support]
    moveOn: "Mercenary đeo Omniscience và Black Sun Crest, còn bạn chạy Purity of Elements, Purity of Fire và một aura damage."
    details:
      - title: Vì sao Omniscience thay Light Radius
        body: |
          Với [[Crystallised Omniscience]], Strength, Dexterity và Intelligence của Mercenary gộp hết thành một attribute. Cứ 15 điểm của nó là 1% elemental penetration và 1% elemental resistance.

          Allie gọi phần penetration là "the cornerstone of their scaling for the rest of the build", viên đá tảng cho việc scale của nó suốt phần còn lại của build. Nó cũng giải thoát bạn khỏi chuyện chỉ stack fire damage: giờ added element nào cũng chạy. Và giữa nó với [[Purity of Elements]], resistance của Mercenary thôi là nỗi lo — phần duy nhất của bước này mà 3.30 làm cho có giá hơn.

          [[Black Sun Crest]] đi theo sau vì ba dòng attribute phần trăm của nó đều thành Omniscience phần trăm.
      - title: Cái bẫy pierce
        body: |
          [[Black Sun Crest]] thay cái helmet rare của Mercenary, và theo đó mất luôn dòng +1 pierce craft, thứ làm Returning Projectiles chạy được.

          Nếu Ice Shot và Vaal Ice Shot của nó không cùng có support Pierce, hãy anoint notable Piercing Shots lên amulet của nó. Bỏ sót chỗ này thì, theo con số của chính guide về Returning Projectiles, bạn mất khoảng nửa damage của nó mà không có cảnh báo nào trên màn hình.
      - title: Gloves Rage, và một lưu ý của 3.30
        body: |
          Nâng cấp Mercenary kế tiếp của Allie là gloves có Eldritch implicit cho Rage on hit: 1% more damage mỗi Rage, tối đa 20%. Cô khuyên mua một đôi rơi ra đã có sẵn nó rồi craft attack speed lên bằng Essence.

          Về sau, trong phần craft endgame, cô nâng lên bản chỉ chạy "while a Pinnacle Atlas Boss is in your Presence", bản từng lúc nào cũng bật trên Mercenary. 3.30 sửa chuyện đó như một bug. Changelog của cô thừa nhận phần craft endgame "are now slightly wrong", giờ hơi sai. Mua bản thường.
      - title: Ring và weapon sau cú đổi
        body: |
          Weapon và ring Light Radius của bạn không còn dùng vào đâu nữa. Allie thay chúng bằng một weapon một tay có +1 fire skill gem và Strength, và Vermillion Ring có life.

          Dòng +1 đưa [[Purity of Fire]] lên level 23 trong [[Alpha's Howl]], tức là thêm một điểm maximum fire resistance.
  - id: midgame
    phase: endgame
    image: animate-guardian
    title: "Tier 16 trở lên: bản support hoàn chỉnh"
    levels: Map Tier 16 trở lên
    uses: >-
      [[The Hallowed Monarch]], [[The Dark Seer]], [[Dawnbreaker]] và
      [[Ralakesh's Impatience]] trên người bạn. Cả ba Purity đơn nguyên tố
      trong một six-link với [[Enlighten Support]]. Hai con spectre. Bob mặc
      [[Garb of the Ephemeral]], [[Kingmaker]] và [[Crown of the Tyrant]].
    changes: >-
      90% maximum elemental resistances cho bạn. Bob gần như không giết nổi.
      Mercenary nhận một cây bow craft thay [[Quill Rain]], một cái quiver
      craft, và boots có Tailwind.
    links:
      - name: Aura (six-link)
        gems: [Purity of Elements, Purity of Fire, Purity of Lightning, Purity of Ice, Arctic Armour, Enlighten Support]
      - name: Link
        gems: [Flame Link, Lifetap Support, Empower Support]
      - name: Buff
        gems: [Smite, Pyre Support, Precision, Generosity Support]
      - name: Trợ thủ
        gems: [Animate Guardian, Raise Spectre, Meat Shield Support, Minion Life Support]
      - name: Guard và mark
        gems: [Vaal Molten Shell, Automation, Convocation, Assassin's Mark]
      - name: Di chuyển
        gems: [Vitality, Frostblink, Shield Charge]
    moveOn: "bạn ngồi ở 90% maximum resistances và Bob không còn chết nữa. Thứ còn lại là tiền đổ vào Mercenary."
    details:
      - title: Đường tới 90% maximum resistances
        body: |
          Theo thứ tự của Allie:

          1. [[The Hallowed Monarch]] thay [[Alpha's Howl]]. Để bù phần reservation bị mất, cô dùng Bubonic Trail với một viên Abyss jewel unique.
          2. Ba jewel có +2% maximum cold hoặc lightning resistance.
          3. [[Purity of Ice]], trả bằng ba cluster jewel nhỏ loại reservation.
          4. [[Purity of Lightning]], cần một viên [[Enlighten Support]] level 3 và một body armour six-link.
          5. Purity level 21, cộng +2 level từ [[The Dark Seer]] thì lên gem level 23, mỗi cái thêm một điểm maximum resistance.

          Mỗi bước đều chuyển gem giữa các món đồ. Cô xin người đọc đừng đổi gì cho tới khi phần chữ bảo đổi.
      - title: Ralakesh's Impatience đã đổi trong 3.30
        body: |
          Guide đổi sang [[Ralakesh's Impatience]] để có Endurance Charge vĩnh viễn, rồi respec lấy +2 maximum Endurance Charges.

          Boots rơi trong 3.30 mang −1 maximum Power, Endurance hoặc Frenzy Charges. Boots cũ thì không. Phần chữ của guide không nhắc tới. Nếu đôi của bạn ghi −1 maximum Endurance Charges, bước đó đáng ít hơn một charge so với cô mô tả.
      - title: Spectre, và cách làm mất chúng
        body: |
          Hai con spectre vào khi Bubonic Trail đã đi: một con Perfect Guardian Turtle để lấy aura [[Determination]], và một con Host Chieftain từ The Ashen Fields ở Act 7 để lấy Power Charge. Về sau một con Perfect Forest Tiger thay con Chieftain.

          Con Turtle là một cái xác mua về, dùng được một lần. Và bất cứ lúc nào bạn gỡ gem [[Raise Spectre]], cởi món đồ đang giữ nó, hoặc mất phần attribute cần để dùng món đó, mấy con spectre của bạn rơi xuống đất thành xác. Raise chúng lại trước khi rời đi.
      - title: Đồ mới của Bob làm gì
        body: |
          - [[Garb of the Ephemeral]]: đồng minh gần đó không bị critical strike và không bị làm chậm xuống dưới action speed gốc. Allie nêu critical strike là nguyên nhân có lẽ của phần lớn cái chết ở giai đoạn này.
          - [[Gravebind]]: Bob được tính công cho mấy mạng Mercenary giết, nên [[The Hallowed Monarch]] trao cho nó mod của quái rare bị hạ. Mấy mod dạng aura thì tới được bạn và Mercenary.
          - [[Kingmaker]] và [[Crown of the Tyrant]]: culling strike và more damage cho Mercenary.
  - id: endgame
    phase: endgame
    image: headhunter
    title: "Endgame: đổ tiền vào Mercenary, rồi tới energy shield"
    levels: Pinnacle boss và Uber boss; level 100 cho bước cuối
    uses: >-
      [[Headhunter]] trên Mercenary và đồ rare craft gần hoàn hảo ở các ô còn
      lại của nó. Rồi, cho bạn, [[Chaos Inoculation]] với [[Aegis Aurora]],
      một cây Twilight Regalia và [[Discipline]].
    changes: >-
      Khi cây bow của Mercenary mang đủ added fire damage, life của bạn bớt
      quan trọng với [[Flame Link]], và bạn bỏ life sang energy shield được.
      Hai phần cuối của guide chưa được viết.
    links:
      - name: Link (không Lifetap)
        gems: [Flame Link, Empower Support]
      - name: Aura (six-link)
        gems: [Purity of Elements, Purity of Fire, Purity of Lightning, Purity of Ice, Arctic Armour, Enlighten Support]
      - name: Thêm aura (nằm ở các món riêng)
        gems: [Precision, Tempest Shield, Vitality, Discipline, Clarity]
      - name: Buff và di chuyển
        gems: [Smite, Pyre Support, Shield Charge, Frostblink]
      - name: Trợ thủ
        gems: [Animate Guardian, Raise Spectre, Meat Shield Support, Minion Life Support]
      - name: Guard và mark
        gems: [Vaal Molten Shell, Automation, Convocation, Assassin's Mark]
    moveOn: "không có stage kế tiếp nào được ai viết ra."
    details:
      - title: Guide dừng ở đâu
        body: |
          Endgame Part 3 và 4 mang dòng ghi chú này của tác giả: "Due to my waning interest in 3.29 I will not be finishing this section for now. I plan to play Luminary again in 3.30 and we will continue where we left off." Ý là: vì hứng thú với 3.29 đã cạn, cô tạm chưa viết xong phần này, định chơi lại Luminary ở 3.30 rồi viết tiếp từ chỗ bỏ dở.

          Part 3 liệt kê một viên Watcher's Eye, The Eternal Struggle và [[Mageblood]], rồi biến thành mấy dòng ghi chú dang dở viết hoa. Chúng tôi dừng ở chỗ phần viết hoàn chỉnh dừng.
      - title: Phần craft endgame là phần cũ nhất
        body: |
          Chính Allie nói: "fully updated to 3.30 outside of the crafts in Endgame Part 1" — cập nhật đầy đủ cho 3.30, trừ phần craft ở Endgame Part 1. Ba thứ trong mấy craft đó không còn đúng:

          - Chúng nhắm tới Eldritch implicit "while a Pinnacle Atlas Boss is in your Presence". 3.30 đã chặn chuyện mấy dòng đó lúc nào cũng bật trên Mercenary.
          - Một craft gloves được biện minh bằng một socket cho [[The Untouched Soul]], món không còn chạy trên Mercenary.
          - Một ghi chú gem vẫn tính fire resistance cho Enmity's Embrace, cái ring cô đã bỏ.

          Giá và tỉ lệ craft cũng là của 3.29. 3.30 đổi giá bảo vệ mod ở bench.
      - title: "Cú đổi sang energy shield: làm hết hoặc đừng làm"
        body: |
          Guide liệt kê những thứ bạn phải có trước khi đổi: [[The Dark Seer]] có energy shield và mana, [[Aegis Aurora]] corrupt ra [[Glancing Blows]], một cây Twilight Regalia craft, boots, ring, jewel và cluster mới, và một viên [[Militant Faith]] thay [[Elegant Hubris]].

          Nó cũng đòi level 100 trước.

          Có một hệ quả dễ bỏ sót. Ở bản này [[Lifetap Support]] rời khỏi [[Flame Link]], nên Link lại tốn mana.
      - title: Nên chờ đợi con số nào
        body: |
          **Không ai công bố con số damage nào cho Mercenary.** Planner nào cũng hiện "Flame Link: 0" làm damage của skill, vì damage đó không phải của bạn.

          Mấy con số có tồn tại là phần phòng thủ của bạn, và chúng là 3.29: nhân vật ngày đầu của CaptainLance9 có 9,160 life và khoảng 31,000 effective hit point; nhân vật hoàn chỉnh của Path of Evening có 13,901 life, 91% block và 90% maximum resistances.

powerCurve: |
  Đây là cách chúng tôi đọc cơ chế, đã đối chiếu với patch note; các guide không trình bày theo kiểu này.

  Damage có ba hệ số nhân và không cái nào nằm trên người bạn. **Bộ đồ nghề của chính Mercenary** — skill, support, weapon của nó — là cái nền. **[[Flame Link]]** cộng fire damage cố định, lớn dần theo life của bạn. **Mọi thứ còn lại** — aura, một cái mark, [[Smite]], Bob, penetration từ [[Crystallised Omniscience]] — nhân lên thứ mà hai cái đầu tạo ra.

  Ở level 30 bạn không có gì trong số này. Bạn là một nhân vật [[Righteous Fire]] có một trợ thủ. Ở level 70 bạn có trợ thủ và cái Link nhưng chưa có cây, aura hay gear, và đó là lý do cả hai guide giữ Righteous Fire cho tới khi thuê được đúng Mercenary. Cú nhảy tới ở lần respec, quanh level 75: damage của chính bạn biến mất và Mercenary tiếp quản chỉ trong một buổi.

  Từ đó trở đi là những bậc đều đều mua bằng currency, và cái bậc quan trọng nhất ở 3.29 — thêm [[Light Radius]] — giờ là bậc yếu nhất. Phần fire cố định từ Flame Link cũng càng mất giá khi weapon của chính Mercenary càng tốt, vì damage cố định cộng với damage cố định. Guide của Allie đi tới cùng theo logic đó: ở trên đỉnh, added fire của cây bow thay cho thứ life của bạn từng cho, và bạn bỏ hẳn life. Nên build bắt đầu là "stack life với ánh sáng" và kết thúc là "một người gánh aura đứng sau một tay cung cực kỳ đắt tiền".

  3.30 đổi gì trên đường cong đó: khúc đầu gần như ngang, theo phép tính của chúng tôi và theo lời CaptainLance9. Khúc giữa mất nhiều nhất, vì mấy cách rẻ để scale Mercenary — fire resistance qua [[The Untouched Soul]], mấy implicit pinnacle lúc nào cũng bật — đã mất, và nó gây ít hơn tới 20% attack damage ở level 83. Khúc đỉnh thì, anh nói, "is still OP", vẫn quá mạnh. Chúng tôi không có cách nào kiểm chuyện đó.

upgrades:
  - step: "Một con Manyshot có Vaal Ice Shot và không có Icicle Rain"
    why: >-
      Đứng đầu vì mọi thứ khác đều nhân lên từ nó. Một support đồ hoàn hảo
      đứng sau sai Mercenary thì, theo lời Allie, còn tệ hơn ở lại với
      [[Righteous Fire]]. Miễn phí nếu bạn tìm được nó ở The Control Blocks.
  - step: "Bốn món rare có [[Light Radius]] và [[Golden Glory]]"
    cost: "3.29: Allie nói vài Chaos là đủ cả bộ đồ đầu tiên — viết khi mấy dòng này roll 15%, chưa phải 30%"
    why: >-
      Hệ số nhân rẻ nhất cho [[Flame Link]] khi life của bạn còn thấp: 120%
      trên gear là 60% more Link effect. Nó đứng trên mấy món unique vì roll
      trên đồ rare được nhân đôi trong 3.30 còn roll trên unique thì bị cắt.
  - step: "[[The Hand of Phrecia]], rồi [[Soulthirst]] cùng [[Ceinture of Benevolence]]"
    why: >-
      Aura effect cho mọi aura bạn chạy, rồi attack speed không bao giờ reset
      cho Mercenary. Đứng dưới bộ Light Radius chỉ vì chúng đắt hơn; Allie bảo
      bạn mua hai cây belt ở Act 10 nếu được.
  - step: "[[Alpha's Howl]] và một aura damage"
    why: >-
      Thêm một aura là một hệ số nhân lên toàn bộ damage của Mercenary, còn
      bước kế chỉ cải thiện một phần của nó. Cần notable Leadership và
      Charisma.
  - step: "[[Crystallised Omniscience]], đồ rare attribute và [[Black Sun Crest]] cho Mercenary"
    why: >-
      Penetration nhân lên toàn bộ elemental damage của nó và cũng chính món
      đó sửa lại resistance của nó, thứ 3.30 biến thành vấn đề thật. Nó đi sau
      aura vì nó tốn một lần respec hai điểm ascendancy và nguyên một bộ đồ
      rare mới. Không nguồn nào có giá.
  - step: "[[The Hallowed Monarch]] và ba Purity"
    why: >-
      Phòng thủ, không phải damage: 90% maximum resistances cho bạn và một Bob
      sống sót được. Nó chờ tới đây vì map trắng và map vàng chưa cần, và buff
      của Bob chẳng đáng bao nhiêu khi nó đang chết.
  - step: "Một cây bow và quiver craft, rồi [[Headhunter]], cho Mercenary"
    why: >-
      Weapon của Mercenary là nền của mọi thứ, nhưng một cây tốt là một lần
      craft với tỉ lệ thấp; mục bow của chính guide được đánh dấu "will likely
      be changed post 3.30 based on prices", nhiều khả năng sẽ đổi sau 3.30
      tùy theo giá. Mua mấy hệ số nhân rẻ trước.
  - step: "[[Chaos Inoculation]] với [[Aegis Aurora]]"
    why: >-
      Sau cùng vì nó không thêm damage và cần cả chục món mua cùng lúc, cộng
      level 100. Nó dành cho content giết được một nhân vật life có 90%
      resistance, mà danh sách đó thì ngắn.

play:
  mapping: |
    1. Đầu khu vực, cast [[Flame Link]] lên Mercenary. Có [[Oath of Fealty]] thì đó là lần duy nhất. Khi bạn đã đội [[The Hallowed Monarch]], Bob cũng được link — nhưng nó có animation xuất hiện, và Link không ăn cho tới khi nó đứng dậy xong.
    2. Di chuyển bằng [[Shield Charge]] và [[Frostblink]]. Mercenary teleport để theo kịp và giết những thứ bạn chạy ngang qua.
    3. Vài giây bấm [[Smite]] vào bất cứ thứ gì một cái để giữ buff added lightning của nó trên đồng minh.
    4. Utility flask của bạn được đặt tự dùng khi đầy. Có [[Ceinture of Benevolence]] thì chúng tới cả Mercenary, và đó là thứ giữ cho [[Soulthirst]] chạy.

    Chỗ căng là bạn thì nhanh mà damage lại không gắn trên người bạn. Chạy vượt lên quá xa là bạn tới một pack một mình, chẳng làm được gì.

    Mod map cần tránh, theo guide 3.29 của Path of Evening: monsters block attack damage, less effect of flasks, reduced effect of non-curse auras, no regeneration, less recovery of life and energy shield.
  bossing: |
    1. Đặt mark lên boss: [[Sniper's Mark]] lúc đầu, [[Assassin's Mark]] từ midgame. Bỏ qua nếu Mercenary của bạn đã curse bằng [[Elemental Weakness]] rồi.
    2. Giữ [[Smite]] lên boss. Có [[Pyre Support]] thì quái bị Mercenary ignite ăn 20% more fire damage trong bốn giây.
    3. Rồi, theo lời Allie, "just run in a circle while your Mercenary takes care of them" — cứ chạy vòng tròn trong lúc Mercenary lo phần còn lại. [[Vaal Molten Shell]] là nút cứu nguy của bạn.

    Khác với map là không có gì để nuôi [[Soulthirst]], và không có quái rare cho Bob mượn aura. Damage đánh boss của Mercenary chủ yếu là Vaal Ice Shot của nó — đó là lý do một con Manyshot không có skill này thì không đáng thuê.

    CaptainLance9 đánh boss kiểu khác: Stormblast Mine, [[Assassin's Mark]] và [[Battlemage's Cry]]. Allie bỏ Stormblast Mine vì nó không chạy với [[The Hand of Phrecia]]. Nếu bạn đeo đôi gloves đó thì theo cô.

deaths:
  - situation: "Mercenary chết trong một cái map nó từng clear được"
    cause: >-
      Từ 3.30 nó có −60% all resistances ở khu vực level 68 trở lên, và ít
      damage reduction hơn ở level cao. Một con Mercenary chỉ mặc đồ damage
      thì giờ không còn cap.
    fix: >-
      Mở tab Defensive của nó. Cap elemental resistance bằng
      [[Purity of Elements]] và gear của nó, rồi tới
      [[Crystallised Omniscience]]. Cho nó một dòng attack leech và ít chaos
      resistance.
  - situation: "Bob chết ở mấy map đỏ đầu tiên"
    cause: >-
      Một con [[Animate Guardian]] có rất nhiều life và không có gì khác. Vì
      [[The Hand of Phrecia]], nó thậm chí không nhận aura của bạn cho tới khi
      bạn Link được nó.
    fix: >-
      Chaos resistance và armour trên body armour với boots của nó, rồi
      [[The Hallowed Monarch]] sớm nhất có thể. Nếu nó chết, bạn raise lại
      được một lần nữa trong map đó, và lần nữa miễn phí ở hideout.
  - situation: "Bạn chết vì một cú hit lớn trong lúc đứng sau Mercenary"
    cause: >-
      Allie nêu hai thứ: physical damage, "the scariest damage type to us by
      quite a bit" — loại damage đáng sợ nhất với build, bỏ xa các loại khác —
      và critical strike. Purity không giúp gì cho cái nào.
    fix: >-
      [[Dawnbreaker]] để nhận một phần physical damage thành fire,
      [[Garb of the Ephemeral]] trên Bob để đồng minh gần đó không bị critical
      strike, và Endurance Charge từ [[Ralakesh's Impatience]].
  - situation: "Bạn thua trận với một con Mercenary đã bỏ tiền mua"
    cause: >-
      Muốn thuê từ một tờ [[Mercenary Warrant]] thì bạn phải đánh thắng nó.
      Allie cảnh báo chúng "have extreme Level scaling and will be very
      dangerous at near Level 83" — scale theo level cực gắt và rất nguy hiểm
      khi gần level 83 — và bạn chỉ được một lần thử.
    fix: >-
      Xem monster level trên Warrant trước khi mua. 3.30 chuyển mấy trận tái
      đấu này sang một khu vực tên Proving Grounds; lời cảnh báo của cô được
      viết cho hệ thống cũ, và chuyện nó có còn là một lần thử hay không thì
      chúng tôi không xác nhận được.
  - situation: "Ở bản energy shield, damage tắt giữa trận"
    cause: >-
      [[Lifetap Support]] đã đi, nên [[Flame Link]] tốn mana. Hết mana — vì
      một con quái hút mana chẳng hạn — là mọi Link tắt.
    fix: >-
      Lên level [[Clarity]] tới khi regeneration đủ nuôi cái Link, hạ
      [[Vitality]] nếu bạn cần reservation. Chừa đủ dư cho mark và
      [[Vaal Molten Shell]].

troubleshooting:
  - symptom: "Boss lâu chết hơn pack rất nhiều"
    cause: >-
      Mercenary không dùng Vaal Ice Shot, hoặc không có nó. Icicle Rain trong
      danh sách skill của nó là lý do thường gặp: skill này không có cooldown,
      nên Mercenary cứ xen kẽ và hiếm khi bắn Vaal skill.
    fix: >-
      Thuê một con Manyshot khác. Skill trên một con Mercenary bạn đã có thì
      không đổi được.
  - symptom: "Damage giảm cỡ một nửa sau khi tôi đổi helmet hoặc amulet của Mercenary"
    cause: >-
      Returning Projectiles chỉ trúng lần thứ hai nếu projectile đã pierce
      trước. Phần pierce đến từ món bạn vừa thay.
    fix: >-
      Support Pierce trên cả hai skill, +1 pierce trên một helmet rare, anoint
      Piercing Shots, hoặc +1 pierce làm Eldritch implicit trên gloves của nó.
  - symptom: "Ở map trắng thấy mạnh mà tới Tier 16 thì yếu"
    cause: >-
      Mercenary không đeo được gear cao hơn level của khu vực bạn thuê nó. Một
      con từ campaign thì bị khóa vĩnh viễn khỏi đồ endgame.
    fix: >-
      Thuê lại từ một map tier cao, hoặc mua một Warrant có monster level cao
      hơn, rồi chuyển gear sang.
  - symptom: "Tôi không bật được hết aura"
    cause: >-
      Reservation. Setup giả định những notable cụ thể ở từng stage, và gem
      level bị cố ý giữ thấp.
    fix: >-
      Sovereignty và Champion of the Cause trước; [[Vitality]] ở 17–18,
      [[Precision]] ở 1. Các stage sau thêm Leadership, Charisma, cluster nhỏ
      loại reservation và [[Enlighten Support]].
  - symptom: "Con số của tôi thấp hơn nhiều so với một video 3.29 của cùng build"
    cause: >-
      Phải vậy thôi. [[Golden Glory]] tính Light Radius ở một nửa, hai món
      unique Light Radius bị cắt, [[Flame Link]] lấy 3% life chứ không phải
      5%, và Mercenary mất tới 20% attack damage.
    fix: >-
      Không có gì để sửa. So với các trang 3.30, và chuẩn bị tinh thần là khúc
      giữa của build là chỗ đau nhất.
  - symptom: "Spectre của tôi biến mất"
    cause: >-
      Bạn đã tháo [[Raise Spectre]] khỏi socket, cởi món đồ giữ nó, hoặc tụt
      xuống dưới yêu cầu attribute của nó. Spectre rơi thành xác ngay chỗ bạn
      đứng.
    fix: >-
      Raise chúng lại trước khi rời đi. Cú đổi sang energy shield là chỗ kinh
      điển để mất một cái xác mua về theo kiểu này.

patch:
  - entry: reliquarian-luminary
    note: >-
      **Cú nerf lên trang nhất, và nó là thật.** [[Golden Glory]] giờ áp Light
      Radius vào Link effect trên Mercenary "at 50% of their value (previously
      100%)". Chúng tôi kiểm hai lần: dòng đó nằm dưới Ascendancy Changes,
      không nằm trong mục Ruthless, và bản export passive tree của chính GGG
      đã mang câu chữ mới.
  - entry: link-and-pact-changes
    note: >-
      **Cú nerf thứ hai vào cùng một con số.** [[Flame Link]] cho 3% maximum
      life của bạn thành added fire, giảm từ 5%, và cho nhiều hơn từ chính
      viên gem (219–329 ở level 20, trước là 169–254). Theo phép tính của
      chúng tôi thì ngang nhau ở 3,000 life, −11% ở 6,000 và −24% ở 13,900.
  - entry: mercenary-nerfs
    note: >-
      **Bản thân Mercenary yếu đi và giờ phải được mặc đồ phòng thủ.** Tới 20%
      less attack damage ở level 83; −30% all resistances ở khu vực level
      46–67 và −60% từ level 68; ít damage reduction hơn, nhiều life hơn. Nó
      không đeo được [[Kalandra's Touch]], còn [[The Untouched Soul]] và
      Screams of the Desiccated thì không làm gì trên nó.
  - note: >-
      **Một bản sửa bug đọc lên như một cú nerf.** "Eldritch modifiers that
      only applied while a Unique Monster or Pinnacle Boss was in your
      Presence were always applying when on a Minion or a Mercenary." Tức là
      mấy dòng Eldritch lẽ ra chỉ áp khi có Unique Monster hay Pinnacle Boss
      trong Presence thì lại luôn áp khi nằm trên Minion hay Mercenary. Đã
      sửa. Mấy craft Mercenary endgame trong guide của Allie được dựng trên
      chuyện đó.
  - entry: other-unique-changes
    note: >-
      **Cả hai món unique Light Radius đều bị cắt.** [[The Hallowed Monarch]]
      25–35% (trước là 50%); Rotmother's Mutiny 20–40% (trước là 25–75%). Cái
      helmet vẫn được đội, vì những gì nó làm cho Bob.
  - entry: special-base-implicits
    note: >-
      **Cú buff duy nhất.** Light Radius trên weapon, helmet và ring rare giờ
      lên tới 30%, trước dừng ở 15%. Chỉ tính đồ rare thì cái này triệt tiêu
      đúng bằng thay đổi Golden Glory: 120% ở nửa giá trị chính là thứ 60% ở
      trọn giá trị từng cho.
  - entry: ralakeshs-impatience
    note: >-
      **Nhỏ.** Boots [[Ralakesh's Impatience]] mới mang −1 cho một loại
      maximum charge. Midgame của guide dùng chúng để lấy Endurance Charge và
      không nhắc tới chuyện đó.
  - entry: heist-delve-access
    note: >-
      **Kế hoạch kiếm currency khởi đầu của guide đã lỗi thời.** Nó gom Heist
      Contract từ Act 6. Contract không còn rơi từ quái thường, và Whakano bán
      chúng lấy Gold từ level 68.
  - entry: atlas-tree-rework
    note: >-
      **Lời khuyên Atlas trong cả hai guide có từ trước cây mới.** Patch note
      chính thức liệt Mercenary trong số các cụm Atlas được làm lại, nên mấy
      passive Allie nêu để tìm đúng loại Mercenary có thể không tồn tại đúng
      như được viết.
  - entry: map-device-items
    note: >-
      **Mua Mercenary giờ chạy kiểu khác.** Một tờ [[Mercenary Warrant]] giờ
      mở một trận tái đấu trong một khu vực tên Proving Grounds và không còn
      dùng chung với map nữa. Cả hai guide mô tả cách cũ.
  - note: >-
      **Chưa xác nhận theo chiều nào:** Kineticist. Kinetic Blast của nó đi từ
      200% xuống 150% Arcane Might và một bug clustering được sửa.
      CaptainLance9 gọi đây là "targeted nerfs", nerf nhắm đích; chưa ai đo
      chúng.

strengths:
  - "Một lối chơi thong thả: mỗi map cast một lần, rồi bạn di chuyển còn Mercenary bắn."
  - "Nhân vật bạn thật sự điều khiển rất khó chết khi đã có đủ Purity."
  - "Life vừa là phòng thủ của bạn, vừa — qua Flame Link — là damage của người khác."
  - "Không cần six-link để bắt đầu, và bộ đồ support đầu tiên là đồ rare."
  - "Mercenary thay đồ được cho content khác nhau mà không phải dựng lại nhân vật của bạn."
  - "Từ midgame nó kiêm luôn vai support thật cho chơi nhóm, theo lời tác giả của nó."
weaknesses:
  - "Bị cắt bốn đường trong 3.30: Golden Glory, Flame Link, damage với resistance của Mercenary, và ba tương tác item."
  - "Mọi thứ phụ thuộc vào chuyện tìm hoặc mua được một con Mercenary cụ thể."
  - "Bạn lên level bằng một build khác và respec ở level 75."
  - "Ba thứ phải giữ cho sống và có gear: bạn, Mercenary và Animate Guardian."
  - "Không công cụ nào cho bạn xem damage của Mercenary. Planner nào cũng hiện số không."
  - "Khúc đỉnh cực kỳ đắt, và hai phần cuối của guide chưa bao giờ được viết."
  - "Cả hai guide 3.30 đều được cập nhật vội: một cái mang cây 3.29, cái kia tự nói là chưa cập nhật đầy đủ."
avoidIf: >-
  Đừng bắt đầu build này nếu bạn muốn cái build trong mấy video 3.29; cái đó
  không còn tồn tại. Bỏ qua nếu đây là nhân vật đầu tiên của bạn trong league
  và bạn chưa từng chơi Mercenary, nếu bạn muốn bấm một nút và thấy damage của
  chính mình, hoặc nếu bạn chơi solo self-found. Nếu thứ bạn muốn là một
  Luminary và bạn không ngại tự tay giết quái, thì Earthshatter Facebreaker
  Luminary trên site này là build được một tier list 3.30 có đề ngày xếp ở
  trên cùng, và 3.30 gần như không đụng tới nó.

sources:
  - title: "Mobalytics: Allie's Luminary Guide"
    url: https://mobalytics.gg/poe/builds/allie-luminary-guide
    kind: guide
    note: "Guide chi tiết nhất, lưu lần cuối ngày 12/11/2026. Tự nói là đã cập nhật đầy đủ cho 3.30 trừ phần craft endgame. Nguồn của thứ tự stage, các setup gem và Bob. Mấy link tìm trade của nó vẫn trỏ vào league 3.29."
  - title: "Path of Building bên trong guide của Allie"
    url: https://mobalytics.gg/poe/builds/allie-luminary-guide
    kind: pob
    note: "Chúng tôi giải mã đoạn code đăng trên trang. Cả 23 trang cây của nó đều đóng dấu 3.29. Ghi chú leveling bên trong là nguồn của các bước theo từng act, và chúng vẫn dẫn link tới bản 3.29 của guide."
  - title: "Mobalytics: CaptainLance9's Luminary Merc Bot"
    url: https://mobalytics.gg/poe/profile/captainlance/builds/captainlance9-s-luminary-merc-bot
    kind: guide
    note: "Đề ngày 13/11/2026 và mở đầu bằng dòng \"did NOT have time to fully update\". Chỗ duy nhất có một tác giả liệt kê các thay đổi 3.30 và đưa kết luận theo từng stage. Phần chữ ascendancy của nó vẫn khuyên dùng Enmity's Embrace."
  - title: "CaptainLance9: 3.30 update thoughts"
    url: https://www.youtube.com/watch?v=6ErOgwwvP2k
    kind: video
    note: "Được dẫn link từ trang của anh như phần lập luận đằng sau kết luận. Chúng tôi dùng bản tóm tắt viết, không dùng video."
  - title: "Allie: video guide có một phần về các thay đổi 3.30"
    url: https://youtu.be/5tofiQICHNE
    kind: video
    note: "Chưa xem. Guide viết của cô đẩy phần thay đổi của patch sang video này, nên ở đó có những lập luận về 3.30 mà bài viết này không chứa."
  - title: "Mobalytics: Mercenary Support Luminary (Path of Evening)"
    url: https://mobalytics.gg/poe/builds/mercenary-support-luminary-path-of-evening
    kind: guide
    note: "3.29, đề ngày 2/10/2026, không được cập nhật. Cho thấy build ở đỉnh 3.29: stack Light Radius và fire resistance với Enmity's Embrace và The Untouched Soul. Gọi nó là \"not a league starter build, it is a league finisher build\" — không phải build mở league mà là build kết league. Nguồn của mấy mod map cần tránh."
  - title: "Maxroll: tier list league starter cho 3.30"
    url: https://maxroll.gg/poe/tierlists/league-starter-build-tier-list
    kind: data
    note: "Đề ngày 13/11/2026. Liệt kê một build Luminary, ở S tier, và đó là build Facebreaker nơi người chơi tự gây damage. Không có build nào kiểu Mercenary gánh trong danh sách."
  - title: "GGG passive tree export"
    url: https://raw.githubusercontent.com/grindinggear/skilltree-export/master/data.json
    kind: data
    note: "Phần chữ node 3.30 đang chạy trong game. Xác nhận Luminary là ascendancy của Scion, câu chữ chính xác của mọi notable Luminary, và \"at 50% of their value\" trên Golden Glory."
  - title: "PoEDB: Flame Link"
    url: https://poedb.tw/us/Flame_Link
    kind: data
    note: "Hiện cả con số 3.29 lẫn 3.30 trên một trang. Nguồn của quest reward ở Act 4."
  - title: "PoEDB: Luminary"
    url: https://poedb.tw/us/Luminary
    kind: data
    note: "Ghi giá trị ẩn −30 damage trên Noble Blood. Phần chữ Golden Glory của nó vẫn là câu chữ 3.29."
  - title: "PoEDB: The Hand of Phrecia"
    url: https://poedb.tw/us/The_Hand_of_Phrecia
    kind: data
    note: "Câu chữ chính xác của các dòng aura. Câu chữ của Soulthirst, Ceinture of Benevolence, Crystallised Omniscience và Hallowed Monarch cũng lấy từ trang PoEDB của chúng."
  - title: "Playnews: Trarthus Mercenaries and the Luminary ascendancy"
    url: https://www.playnews.gg/en/guides/path-of-exile-3-29-the-guide-to-trarthus-s-mercenaries-and-the-eminence-luminary-ascendancy
    kind: guide
    note: "3.29, dịch máy từ tiếng Pháp, nên vài cái tên bị sai (nó gọi ascendancy là Eminence). Chỉ dùng để đối chiếu luật Mercenary và con số 30%."
  - title: "Patch note chính thức 3.30.0"
    url: https://www.pathofexile.com/forum/view-thread/4013680
    kind: official
    note: "Nguồn của mọi thay đổi được trích. Tất cả đều nằm trong các mục game thường."
