confidenceNote: >-
  Guide này **đúng là 3.30 thật** (cập nhật 12 tháng 11 2026), và Cyclone,
  Shockwave, General's Cry với Slayer đều không bị patch đụng tới. Có ba chỗ yếu.
  **Cái link Path of Building của chính guide không mở ra build này** khi
  researcher bên chúng tôi tải về — nó trả về một trang tên là
  "Level 98 Volley Support Slayer" không có gear — nên hãy mở nó trong browser
  trước khi tin; các con số ở đây đến từ một bản export riêng của cộng đồng.
  **Không nguồn 3.30 nào cho thứ tự ascendancy theo từng lab**, và ba nguồn thì
  xung đột, nên thứ tự dưới đây là khuyến nghị của chúng tôi và được ghi rõ như
  vậy. Và không có budget nào tồn tại. Các điểm số là phán đoán ngày đầu của
  researcher bên chúng tôi, làm tròn xuống từ số lẻ nửa điểm: clear 4.5, bossing
  3.5 khi làm starter rồi lên tầm 4.5 khi đủ gear, ease 3.5.
modes:
  ssf: >-
    Nửa phần starter thì cực hợp chơi một mình: không unique, vũ khí từ vendor
    recipe, và gem là quest reward. Phần endgame thì không —
    [[Void Shockwave Support]] chỉ rơi từ Uber Elder, còn
    [[The Stampede]], [[Stranglegasp]] và [[Mageblood]] là mục tiêu trade. Chơi
    được tới tầm Voidstone, rồi là một cuộc grind. Không nguồn nào bàn tới.
  hardcore: >-
    Không nguồn nào bàn tới. Phán đoán của chúng tôi: leech vĩnh viễn, 90%
    physical damage reduction và 57% block là một lớp vỏ hợp lệ, nhưng 4,800 life
    trên một nhân vật melee đứng trong mọi telegraph của boss, cộng với
    "cannot be leeched from" là một đối trọng cứng, khiến nó tốt nhất cũng chỉ ở
    mức trung bình. Chưa ai thử.

idea: |
  [[Cyclone]] là một attack channel. Bạn giữ nút, bạn vừa xoay vừa di chuyển, và bạn hit mọi thứ bạn đi xuyên qua.

  Damage thật ra không phải cái vòng xoay. Nó là [[Shockwave Support]], thứ kích hoạt một cú nổ diện rộng riêng biệt khi melee hit — 336% attack damage của bạn ở gem 20, trong bán kính 2.7 mét, tới bốn lần mỗi giây. Việc của Cyclone là cung cấp hit và di chuyển; mấy đợt shockwave mới là thứ xóa sổ pack. Đó là lý do build được đặt tên theo viên support gem.

  Bạn sống nhờ [[Brutal Fervour]]. Vì Cyclone hit liên tục, leech của bạn không bao giờ dừng, và leech của Slayer không tắt khi đầy máu. Bạn hồi phục vĩnh viễn và ăn ít damage hơn 10% vĩnh viễn.

  Một luật cứng duy nhất: **Shockwave chỉ chạy với mace, sceptre và staff.** Không sword, không axe.

chain:
  - label: Xoay
    text: "[[Cyclone]] attack ở 300% tốc độ gốc với 2–3 mana và vừa attack vừa di chuyển."
  - label: Nổ
    text: "[[Shockwave Support]] biến tới bốn cú hit mỗi giây thành những cú nổ diện rộng riêng, tâm nằm ở con quái."
  - label: Không bao giờ miss
    text: "[[Precise Technique]] cho 40% more attack damage khi accuracy của bạn cao hơn máu tối đa, và cấm crit."
  - label: Leech mãi mãi
    text: "[[Brutal Fervour]] giữ leech chạy cả khi full máu và cắt 10% damage nhận vào trong lúc nó chạy."
  - label: Thêm bản sao
    text: "[[General's Cry]] gọi tới năm mirage warrior từ xác, mỗi con vung Cyclone của bạn một lần."

chainDetails:
  - title: Cyclone gốc hay Cyclone of Tumult? Cả hai câu trả lời đều đúng
    body: |
      Các nguồn chia rẽ thật, và chuyện đó là về *khi nào*, không phải *cái nào*.

      **Maxroll giữ [[Cyclone]] gốc** suốt cả guide, vì tính di động và vì ít thời gian ramp, và chỉ đưa [[Cyclone of Tumult]] ra khi bạn đã có [[The Stampede]] hoặc [[Replica Stampede]]. **Guide 3.30 của poe-vault và bản export chính của cộng đồng thì đều dùng Tumult** với The Stampede.

      Lý do cơ học: Tumult dựng năm stage, mỗi 0.4 giây một stage, mỗi stage cho 25% more attack speed, thêm chút bán kính, và **10% less movement speed**. Ở năm stage là khoảng 125% more attack speed và 50% less movement speed. The Stampede *đặt* luôn movement speed của bạn về một giá trị cố định, thứ ghi đè cái penalty — và đó là lý do nó là điều kiện mở khóa chứ không phải món có thì tốt.

      **Khởi đầu bằng Cyclone gốc. Đổi sang Tumult khi bạn có Stampede.** Cách đó dung hòa mọi nguồn, và Stampede sẽ không rẻ ngày đầu.
  - title: Shockwave, rồi Void Shockwave
    body: |
      [[Shockwave Support]] gây 231% attack damage ở gem level 1 và 336% ở level 20, trong bán kính 2.4 tới 2.7 mét, trên một cooldown một giây cho phép một lần dùng ở level 1 và **bốn lần mỗi cooldown ở level 20**.

      [[Void Shockwave Support]] là bản nâng cấp và là bước nhảy gem lớn nhất của build: cooldown một nửa, 440% lên tới 528% attack damage, và nó hit tới mười con quái thay vì tới hai. Nó cần level 72 và **rơi từ Uber Elder**. Giới hạn vũ khí của nó mở rộng ra, có cả axe.

      Một chỗ đáng sửa cho biết: có một tier list liệt "Void Shockwave" thành một skill riêng ở hạng thấp hơn. Nó không phải một skill. Nó là viên support gem này, và cái mục đó là cùng một build bị đếm hai lần ở hai mức gear.
  - title: Cái ngưỡng accuracy mà bạn phải quản
    body: |
      [[Precise Technique]] ghi: 40% more attack damage nếu accuracy rating của bạn cao hơn máu tối đa, và bạn không bao giờ gây critical strike.

      Đó là một cái mốc di động. **Mỗi điểm máu tối đa bạn thêm vào lại đẩy cái mốc bạn phải vượt lên cao hơn.** Đó là lý do [[Precision]] chạy như một aura từ level 12, lý do 50% increased accuracy của [[Impact]] quan trọng ngoài chuyện tầm đánh, và lý do maxroll cảnh báo rằng build này đòi quản accuracy liên tục.

      Quanh level 85 tới 90 bạn bỏ hẳn Precise Technique, mua một cây staff có crit chance, thêm một [[Diamond Flask]] với [[Assassin's Mark]], và vấn đề biến mất. Maxroll đưa ra cả 85 lẫn 90 ở những chỗ khác nhau; cái nào cũng ổn.
  - title: Vì sao chest của bạn tuyệt đối không được roll life phẳng
    body: |
      Cái Barbarism Life Mastery mà build này lấy là có điều kiện: nó ngừng chạy nếu body armour của bạn có mod life phẳng hay life regeneration trên đó.

      Nên khi mua một cây chest six-link, bạn đang đi tìm **armour cao và không roll life nào**, tức là ngược hẳn với lời khuyên bình thường, và rất dễ làm sai.
  - title: Mana, một giới hạn thật sự
    body: |
      Channel Cyclone tốn mana liên tục. Maxroll bảo bạn giữ *cả hai* bánh xe giảm mana cost trên cây cho tới khi bạn có một cây body armour double-influence với −20 to mana cost.

      Mấy cây ring mức trung bình của poe-vault thì cụ thể là "reduced cost for channelling skills", nhắm tổng −3 để đạt **mana cost bằng không**. Hai nguồn độc lập đồng ý là chuyện này quan trọng. Hãy tính trước thay vì phát hiện ra giữa đường.

mandatory:
  - term: Shockwave Support
    why: >-
      Đây chính là build. Tới bốn cú nổ diện rộng mỗi giây ở mức 336% attack
      damage của bạn, do hit của Cyclone kích hoạt.
    detail: >-
      Có từ level 18, nên nó sẽ nằm sẵn trong túi chờ lúc Cyclone mở ở 28. Giới
      hạn vũ khí là tuyệt đối: chỉ mace, sceptre hoặc staff.
  - term: Cyclone
    why: >-
      Động cơ tạo hit và cũng là cách di chuyển. Level 28, và Duelist lấy nó làm
      quest reward Act 3 từ Sever the Right Hand.
    detail: >-
      Clarissa cũng bán nó cho Duelist, Marauder, Ranger, Scion và Templar, nên
      thay thế rất dễ. Link nó với Shockwave ngay khi bạn có.
  - term: Brutal Fervour
    why: >-
      Leech chạy tiếp cả khi full máu, mức hồi tối đa mỗi lần leech nhân đôi, và
      bạn ăn ít damage hơn 10% trong lúc đang leech. Bỏ nó ra thì bạn là một
      nhân vật melee 4,800 life không có sức bền.
  - term: Precise Technique
    why: >-
      40% more attack damage cho cả giai đoạn trước khi lên crit, miễn là
      accuracy giữ được cao hơn máu tối đa.
  - term: Impact
    why: >-
      +0.4 mét tầm đánh và 50% increased accuracy. Cả hai đều nuôi các phần khác
      của build: Cyclone đổi tầm đánh thành diện tích, còn accuracy nuôi Precise
      Technique.
  - term: Bane of Legends
    why: >-
      20% more damage lên quái unique, và bạn không ăn physical damage phản lại.
      Cái miễn reflect gỡ bỏ một mod map đáng lẽ sẽ giết bạn ngay tức khắc.
  - term: Headsman
    level: recommended
    why: >-
      Giết luôn quái ở 20% máu trở xuống, cộng attack và movement speed khi giết.
      Maxroll ước tính khoảng 25% more damage, đó là ước tính của guide chứ không
      phải một phép đo.
  - term: Precision
    why: >-
      Chạy như một aura từ level 12 và ở đó luôn. Đây là accuracy rẻ nhất trong
      build và Precise Technique thì phụ thuộc vào nó.
  - term: Unwavering Stance
    level: recommended
    why: >-
      Bạn không thể bị stun. Trên một skill melee channel thì đó là một lớp phòng
      thủ, không phải một tiện nghi.
  - term: General's Cry
    level: recommended
    why: >-
      Tới năm mirage warrior, mỗi con dùng Cyclone của bạn một lần. Xác không bị
      tiêu thụ. Lớp single target thêm chính của bạn.
    detail: >-
      Cast [[Desecrate]] một lần trước trận boss trong phòng riêng để General's
      Cry có xác mà dùng. Link nó với [[Autoexertion]] là nó tự bật, đổi lại 20%
      mana reservation và bạn không nhận buff warcry.
  - term: Autoexertion
    level: recommended
    why: >-
      Tự kích hoạt warcry của bạn. Đây là thứ khiến build thành một nút thay vì
      ba nút.
  - term: The Stampede
    level: recommended
    why: >-
      Đặt movement speed của bạn về một giá trị cố định, ghi đè mọi mod. Là lý do
      duy nhất [[Cyclone of Tumult]] chơi được. [[Replica Stampede]] cũng được.
  - term: Rumi's Concoction
    level: recommended
    why: >-
      Block và armour trong một cây flask. poe-vault liệt nó ở mọi mức budget,
      chuyện khá lạ.
  - term: Stranglegasp
    level: recommended
    why: >-
      Để lấy anoint [[Enigmatic Defence]]. Maxroll ghi đây là nguồn áp lực gear
      nặng nhất của build.
  - term: Void Shockwave Support
    level: recommended
    why: >-
      Bước nâng cấp gem lớn nhất của build, ở level 72. Rơi từ Uber Elder.
  - term: Mageblood
    level: recommended
    why: >-
      Belt endgame, và cũng là cách insanebuild nói để chữa vấn đề movement speed
      của build này. [[Headhunter]] là phương án thay thế.

labs:
  - lab: Normal
    node: Brutal Fervour
    why: >-
      **Khuyến nghị của chúng tôi, không phải của nguồn nào.** Nó là node sống
      sót, nó là node hai điểm có ngay lập tức, và poe-vault đặt normal lab ở
      level 38 trở lên — đúng lúc bạn cần sức bền nhất.
  - lab: Cruel
    node: Impact
    why: "Tầm đánh và accuracy, tức là damage và uptime của Precise Technique cùng một lúc. Chạy quanh level 59 với tầm 2,000 life."
  - lab: Merciless
    node: Bane of Legends
    why: >-
      Miễn reflect trước khi vào map. Chạy nó **trước khi giết Kitava**, để bạn
      đánh Izaro mà không bị penalty resistance. Hoãn lại nếu bạn dưới 3,000
      life.
  - lab: Uber
    node: Headsman
    why: >-
      Cái cuối trong bốn cái. Để ý hình học của cây: Brutal Fervour dẫn tới
      Endless Hunger, không phải ngược lại, nên với tám điểm bạn lấy bốn notable
      hai điểm và bỏ hẳn [[Endless Hunger]].

stages:
  - id: acts-1-3
    image: asc-icon-slayer
    title: Act 1–3
    levels: Level 1–28
    uses: >-
      [[Spectral Throw]] cho cả pack và boss tới level 12, rồi [[Sunder]] làm
      cầu nối. Life và resistance trên mọi thứ không phải vũ khí; vũ khí là slot
      đáng quan tâm.
    changes: >-
      Aura online ở level 12: [[Precision]], [[Blood and Sand]] ở blood stance,
      và [[Herald of Ash]]. Đeo một [[Sapphire Ring]] trước Merveil. Two-Stone
      Ring từ level 20.
    links:
      - name: Level 1–12
        gems: [Spectral Throw, Volley Support, Faster Attacks Support]
      - name: Từ level 12
        gems: [Sunder, Melee Physical Damage Support, Ruthless Support]
      - name: Aura
        gems: [Precision, Blood and Sand, Herald of Ash]
      - name: Di chuyển
        gems: [Leap Slam, Faster Attacks Support]
    moveOn: "bạn đã level 28 với một cây mace hoặc staff tử tế và một viên Shockwave Support trong túi."
    details:
      - title: Vendor recipe cho vũ khí
        body: |
          Bán một base mace hoặc staff tốt, một viên Blacksmith's Whetstone và một cây Rustic Sash cùng lúc. Một cây Rustic Sash **rare** cho kết quả tốt hơn một cây magic.

          Lặp lại mỗi khi damage tụt. Vũ khí là món quan trọng nhất của build ở mọi giai đoạn, và không unique nào thay được nó.
      - title: Ghi chú cây cho 28 level đầu
        body: |
          Lấy Mana Flows để có +20 Intelligence, đó là thứ cho bạn dùng [[Frostblink]]. Lấy Burning Brutality Fire Mastery và Barbarism Life Mastery.

          Nhớ cái điều kiện của Barbarism khi sau này bạn mua chest: không life phẳng, không life regeneration trên body armour.
      - title: Dễ bỏ qua mà lại thật sự hữu ích
        body: |
          Nếu bạn tìm được một cây axe hay sword mạnh trước khi có mace hoặc staff tốt, maxroll nói bạn có thể tạm bỏ [[Shockwave Support]] và dùng luôn cây vũ khí tốt hơn.

          Shockwave là động cơ dài hạn, nhưng một cây vũ khí tốt hơn hẳn thì thắng một viên support gem trong campaign.
  - id: acts-4-10
    image: precision
    title: Act 4–10
    levels: Level 28–68
    uses: >-
      [[Cyclone]] với [[Shockwave Support]] ngay từ lúc bạn lấy được gem ở level
      28. [[Sunder]] vào stash.
    changes: >-
      Cứ tiếp tục nâng cây mace hoặc staff và giữ resistance cap. Thêm một Decoy
      Totem hoặc [[Steelskin]] cho mấy con rare trâu. Chạy Merciless lab trước
      Kitava.
    links:
      - name: Main skill
        gems: [Cyclone, Shockwave Support, Melee Physical Damage Support, Brutality Support]
      - name: Aura
        gems: [Precision, Blood and Sand, Herald of Ash]
      - name: Di chuyển
        gems: [Frostblink, Lifetap Support, Leap Slam, Faster Attacks Support]
      - name: Warcry
        gems: [Autoexertion, General's Cry, Desecrate]
    moveOn: "resistance đã cap sau Act 10 và Cyclone đã nằm trong ít nhất một four-link."
    details:
      - title: Bandit và Pantheon, cả hai đều tranh chấp
        body: |
          **Bandit:** poe-vault nói Alira khi còn nghèo, để lấy 15% all elemental resistance, rồi đổi sang passive point khi attribute đã xong và bạn đã overcap thoải mái. Bản export chính của cộng đồng thì giết cả ba. Câu trả lời thật thà là Alira khi nghèo, giết cả ba khi đã có gear.

          **Pantheon:** các nguồn không đồng ý chút nào. Trang 3.30 của poe-vault nói Ryslatha với Lunaris khi budget thấp, Ralakesh với Lunaris về sau, và Lunaris đổi sang Solaris cho Uber boss. Trang 3.29 của họ thì nói Brine King với Abberath. Bản export của cộng đồng dùng Arakaali với Shakari. **Không có đồng thuận — hãy chọn theo nội dung bạn đang chạy.**
      - title: Thứ tự ascendancy đến từ đâu
        body: |
          Maxroll liệt bốn notable theo thứ tự — Impact, Bane of Legends, Brutal Fervour, Headsman — mà không nói cái nào thuộc lab nào. Một file Path of Building của cộng đồng nói cái thứ hai nên là Brutal Fervour hoặc Bane of Legends. Một guide 3.19 cho thứ tự gần như đảo ngược.

          Thứ tự trong bảng Labyrinth phía trên là **của chúng tôi**, dựng trên hướng dẫn về *thời điểm* chạy lab của poe-vault cộng với nhận xét rằng Brutal Fervour là node sống sót và có ngay lập tức. Nếu bạn thích thứ tự nguyên văn của maxroll, cái giá duy nhất là sức bền giai đoạn đầu hơi yếu hơn. Kiểu nào cũng chưa ai thử.
  - id: early-maps
    image: shockwave-support
    title: Map đầu
    levels: Map trắng và map vàng
    uses: >-
      Một cây body armour six-link có armour cao và **không mod life nào**, cắm
      Cyclone với Shockwave. [[Rumi's Concoction]] trên thanh flask.
    changes: >-
      Cap resistance và attribute. Roll flask cho armour, critical strike chance
      và movement speed, và nhét miễn corrupted blood lên cây life flask. Cả hai
      bánh xe mana cost vẫn ở trên cây.
    links:
      - name: Main skill (six-link)
        gems: [Cyclone, Shockwave Support, Melee Physical Damage Support, Pulverise Support, Brutality Support, Infused Channelling Support]
      - name: Curse on hit
        gems: [Lifetap Support, Assassin's Mark, Mark On Hit Support, Blood Rage]
      - name: Aura
        gems: [Blood and Sand, Flesh and Stone, Pride, Herald of Purity, Purity of Elements, Enlighten Support]
      - name: Di chuyển
        gems: [Frostblink, Lifetap Support, Leap Slam, Faster Attacks Support]
      - name: Guard
        gems: [Automation, Molten Shell]
      - name: Single target
        gems: [General's Cry, Autoexertion, Desecrate]
    moveOn: "bạn clear map vàng thoải mái và mana không cạn trong lúc channel."
    details:
      - title: Hai phiên bản của main link
        body: |
          Cho Cyclone gốc: *Cyclone, Shockwave, Melee Physical Damage, Pulverise, Brutality, Infused Channelling.* Cái này được tổng hợp từ một file Path of Building của cộng đồng cộng phần chữ của maxroll — **một nguồn duy nhất**, dù nó khớp khá sát với bản của poe-vault.

          Link Tumult đã được xác minh trên trang của poe-vault là: *Cyclone of Tumult, Shockwave, Melee Physical Damage, Brutality, Volatility, Infused Channelling*, với [[Void Shockwave Support]] thay Shockwave về sau.

          [[Brutality Support]] cấm mọi damage không phải physical, nên trong build này không có chuyển đổi elemental ở đâu cả. Impale là lớp damage thứ hai; một bản export cho thấy 4.9 triệu hit cộng 3.3 triệu impale.
      - title: Herald of Ash hay Herald of Purity
        body: |
          Maxroll chạy [[Herald of Ash]]; poe-vault chạy [[Herald of Purity]]. Cả hai đều được. Chọn cái nào vừa reservation của bạn.

          Đây là kiểu bất đồng trông quan trọng mà thật ra không. Hãy dồn sự chú ý vào cây vũ khí.
      - title: Mod map làm build vỡ
        body: |
          - **Cannot be leeched from.** Cái này gỡ bỏ [[Brutal Fervour]], tức là cả hệ phòng thủ của bạn.
          - **Reduced recovery rate.**
          - **−9% tới −12% maximum resistances.**
          - **Reduced cooldown recovery**, thứ làm chậm mấy đợt shockwave.

          poe-vault còn ghi map Valdos là không hỗ trợ.
  - id: red-maps
    image: diamond-flask
    title: Map đỏ và bước đổi sang crit
    levels: Map Tier 11–16, level 85–90
    uses: >-
      Vẫn setup đó cho tới lúc đổi sang crit, rồi là một cây staff physical
      damage cao có critical strike chance, một [[Diamond Flask]] với suffix
      crit, và [[Assassin's Mark]] áp khi hit.
    changes: >-
      Bạn bỏ [[Precise Technique]] và cái ngưỡng accuracy-so-với-life biến mất.
      Đây là một lần respec giữa league, không phải một lần nâng gear, và build
      thì rất cần level: nguyên văn poe-vault là "incredibly".
    links:
      - name: Main skill, sau khi lên crit
        gems: [Cyclone, Shockwave Support, Melee Physical Damage Support, Pulverise Support, Brutality Support, Increased Critical Damage Support]
      - name: Khi có Stampede
        gems: [Cyclone of Tumult, Void Shockwave Support, Melee Physical Damage Support, Brutality Support, Volatility Support, Infused Channelling Support]
      - name: Curse on hit
        gems: [Lifetap Support, Assassin's Mark, Mark On Hit Support, Blood Rage]
      - name: Aura
        gems: [Blood and Sand, Flesh and Stone, Pride, Herald of Purity, Purity of Elements, Enlighten Support]
    moveOn: "bạn có staff crit, có Void Shockwave, và boss Tier 16 chết trước khi sang phase hai."
    details:
      - title: Bước đổi sang crit cần gì
        body: |
          Một cây staff có physical damage mỗi giây cao và critical strike chance. Một [[Diamond Flask]] với suffix "critical strike chance during flask effect". [[Assassin's Mark]] với [[Mark On Hit Support]] và [[Lifetap Support]]. Abyssus là tùy chọn và là một rủi ro thật trên một nhân vật melee.

          Đừng bắt đầu đổi cho tới khi cây staff đã nằm trong tay. Bỏ Precise Technique mà chưa có vũ khí crit là mất 40% more damage và thay bằng không gì cả.
      - title: Craft endgame
        body: |
          Lộ trình của poe-vault là một cây Ezomyte Staff recombinate ở item level 84, với khoảng một trên sáu cơ hội ra kết quả ba prefix. Cây chest budget cao là một Royal Plate ở item level 86, bị beast chặn, cần ít nhất 60 Memory Strand.

          Không thứ nào trong đó có giá cho 3.30, mà 3.30 thì đã đổi chi phí crafting. Hãy coi nó là hình dạng của kế hoạch.
      - title: Cluster jewel
        body: |
          Maxroll ghi rằng ba cây large cluster Physical Damage thì yếu hơn *một chút* so với cluster Staff, và [[Overlord]] cho bạn bỏ bánh xe Fortify khỏi cây.

          Đây là tối ưu giai đoạn muộn. Nó không thuộc về 90 level đầu của bạn.
  - id: endgame
    image: void-shockwave-support
    title: Endgame
    levels: Pinnacle boss và map juice
    uses: >-
      [[Void Shockwave Support]], một cây staff Shaper, [[Stranglegasp]] cho
      anoint [[Enigmatic Defence]], [[Mageblood]], [[Lethal Pride]] và một
      [[Watcher's Eye]].
    changes: >-
      Lối chơi không đổi gì cả. Bạn đang mua movement speed, tần suất shockwave
      và effective hit point.
    moveOn: "không còn stage nào nữa."
    details:
      - title: Nhân vật hoàn chỉnh trông thế nào
        body: |
          Theo bản export chính của cộng đồng, ở level 96: 18.4 triệu full damage mỗi giây, 8.3 triệu trên main skill, 4,809 life, 962 life leech mỗi giây, 22,254 armour, 90% physical damage reduction, 57% block và 48% spell block, 129,972 effective hit point.

          Đọc con số life cho kỹ. Build này trâu nhờ leech, block và giảm trừ, không nhờ một bể máu lớn.
      - title: Một điều thật sự chưa biết cho tuần đầu
        body: |
          poe-vault nói thẳng là tương tác giữa cơ chế [[Wickerman]] và Cyclone thì vẫn chưa ai biết.

          Đó là một skill melee channel gặp một loại encounter hoàn toàn mới. Đáng để theo dõi, và đáng để không giả định.

patch:
  - note: >-
      **Không có gì trong build này bị đổi.** Cyclone, [[Cyclone of Tumult]],
      [[Shockwave Support]], [[Void Shockwave Support]],
      [[General's Cry]] và [[Autoexertion]] đều nguyên vẹn trong game thường.
  - entry: ruthless-changes
    note: >-
      **Slayer không được buff. Hãy kiểm lại ai nói là có.** Mấy dòng Impact và
      [[Endless Hunger]] trông như làm Slayer mạnh hơn thì nằm ở phần **chỉ dành
      cho Ruthless**. Một trang dữ liệu game render chúng mà không có nhãn
      Ruthless, nên cái lỗi này rất dễ mắc một cách thật thà. Impact vẫn là tới
      50% area of effect và Endless Hunger vẫn không có attack speed trong game
      thường.
  - entry: mercenary-nerfs
    note: >-
      **Một cú buff tương đối, vừa phải.** Build này không dùng mercenary, nên mọi
      đối thủ được mercenary gánh đều yếu đi so với nó.
  - entry: loot-rarity-rework
    note: >-
      **Thuận lợi.** Một build dọn pack nhanh và có 20% more damage lên quái
      unique cộng một đòn execute thì rất hợp với currency giờ chủ yếu đến từ quái
      rare và unique. Để ý cách diễn đạt: "một tỷ lệ lớn hơn hẳn", không phải
      "phần lớn".
  - entry: league-fates
    note: >-
      **Cắt cả hai phía.** Single target quan trọng hơn trong 3.30 so với 3.29,
      mà đó là trục yếu hơn của dòng build này.
      [[Bane of Legends]] và [[General's Cry]] làm dịu phần nào, nhưng bạn đang
      chơi một build ưu tiên clear trong một league đòi bossing.
  - entry: wickerman-viscera
    note: >-
      **Chưa biết, được ghi nhận thay vì đoán.** poe-vault nói tương tác giữa cơ
      chế [[Wickerman]] và Cyclone thì chưa ai tính ra. Chưa ai chơi nó.

strengths:
  - "Clear cả màn hình rất mạnh: tới bốn đợt shockwave mỗi giây trên 2.7 mét."
  - "Không bắt buộc unique nào, nên khởi đầu gần như miễn phí."
  - "Leech của Slayer trâu thật, và nó không bao giờ tắt."
  - "Một nút. Mọi nguồn đều khen lối chơi."
  - "Cyclone vừa attack vừa di chuyển, thứ giúp né telegraph của boss."
  - "Mấy bản sao từ General's Cry thêm damage mà không cần thêm thao tác."
weaknesses:
  - "Precise Technique đòi quản accuracy liên tục: mỗi roll life lại đẩy cái mốc lên."
  - "Bạn ở trong tầm melee của mọi thứ, đứng trong mọi hiệu ứng mặt đất."
  - "Di chuyển chậm cho tới khi có Mageblood, và chậm hơn nhiều khi chơi Tumult mà không có Stampede."
  - "Cần level: phần thưởng thật là lần respec sang crit ở 85 tới 90."
  - "Vũ khí dở là build dở, và không unique nào chữa được."
  - "Áp lực gear, nhất là Stranglegasp, cộng bốn mod map làm build vỡ."
avoidIf: >-
  Đừng chọn cái này nếu bạn không thích ở trong tầm melee của mọi thứ, hoặc nếu
  bạn chơi ping cao — một skill channel trừng phạt cả hai. Đừng chọn nếu bạn muốn
  lo xong gear ở level 80, hoặc nếu bạn không chịu quản một cái ngưỡng accuracy,
  hai bánh xe mana cost và một lần respec sang crit giữa league. Nó không phải
  một con giết pinnacle boss giá rẻ ngay từ đầu.

