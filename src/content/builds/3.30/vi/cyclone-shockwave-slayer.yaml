    moveOn: "bạn clear map vàng thoải mái và mana không cạn trong lúc channel."
    details:
      - title: Hai phiên bản của main link
        body: |
          Cho Cyclone gốc: *Cyclone, Shockwave, Melee Physical Damage, Pulverise, Brutality, Infused Channelling.* Cái này được tổng hợp từ một file Path of Building của cộng đồng cộng phần chữ của maxroll — **một nguồn duy nhất**, dù nó khớp khá sát với bản của poe-vault.

          Link Tumult đã được xác minh trên trang của poe-vault là: *Cyclone of Tumult, Shockwave, Melee Physical Damage, Brutality, Volatility, Infused Channelling*, với [[Void Shockwave Support]] thay Shockwave về sau.

          [[Brutality Support]] cấm mọi damage không phải physical, nên trong build này không có chuyển đổi elemental ở đâu cả. Impale là lớp damage thứ hai. Trang này từng trích một phép chia hit với impale từ "một bản export"; bản export chúng tôi mở được chỉ hiện một con số tổng, không có phép chia nào như vậy, và chúng tôi không truy ra được mấy con số đó từ nguồn nào. Nên chúng tôi không trích con nào: không có phép chia nào được đo giữa damage của hit và damage của impale.
      - title: "Aura: hai guide chạy hai bộ khác nhau"
        body: |
          Link aura phía trên là của maxroll: [[Precision]], Blood and Sand và [[Herald of Ash]], bật từ level 12 cùng với Autoexertion. Đó là bộ aura duy nhất mà phần chữ của maxroll nêu tên, và ghi chú campaign của họ giao việc cho Herald of Ash: dọn quái sót, và bật ignite cho Fire Mastery. Việc đó nằm khá vênh bên cạnh Brutality Support trong main link; ghi chú về Herald of Ash ở stage trước nói rõ thứ gì chúng tôi đọc được và không đọc được. Lời khuyên về Watcher's Eye cho endgame của họ thì tính có cả Pride lẫn Precision, nhưng phần chữ của guide không nói khi nào Pride vào.

          Link của poe-vault là Blood and Sand, Flesh and Stone, Pride, [[Herald of Purity]], Purity of Elements và Enlighten. Nó không có Precision, và các trang của poe-vault không nhắc tới Precision lẫn [[Precise Technique]]. Bản export level 96 cũng không chạy Precision, và không chạy herald nào. Link đó được đặt ở stage sau.

          Chúng tôi đặt bộ của maxroll ở đây vì stage này vẫn còn dùng Precise Technique, và accuracy từ Precision là thứ giữ cho nó bật. Lựa chọn đó là của chúng tôi. Không nguồn nào cho thấy Precision được thêm vào bộ năm aura của poe-vault, nên chúng tôi không nói được cả hai có vừa reservation của bạn hay không. Chuyện herald là kiểu bất đồng trông quan trọng mà thật ra không: Herald of Ash là của maxroll, Herald of Purity là của poe-vault. Hãy dồn sự chú ý vào cây vũ khí. Hai link Di chuyển và Guard phía trên là link mức trung bình của poe-vault.
      - title: Mod map làm build vỡ
        body: |
          - **Cannot be leeched from.** Cái này gỡ bỏ [[Brutal Fervour]], tức là cả hệ phòng thủ của bạn.
          - **Reduced recovery rate.**
          - **−9% tới −12% maximum resistances.** Maxroll gọi nó là rất nguy hiểm, và nói thêm rằng bạn vẫn chạy được nếu không ngại chết.
          - **Reduced cooldown recovery.** poe-vault liệt nó vì tốc độ mà nó lấy mất của bạn ở budget cao, lúc bạn di chuyển bằng Frostblink. Còn chuyện nó cũng làm chậm mấy đợt shockwave, vốn chạy trên cooldown, là cách đọc của chúng tôi.

          poe-vault còn ghi map Valdos là không hỗ trợ.
