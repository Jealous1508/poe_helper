      Cyclone với Shockwave. [[Rumi's Concoction]] trên thanh flask.
    changes: >-
      Cap resistance và attribute. Roll flask cho armour và movement speed, và
      nhét miễn corrupted blood lên cây life flask. Danh sách affix flask của
      maxroll còn có critical strike chance, nhưng danh sách đó nằm trong khối
      gear đổi sang crit của họ, và roll ấy không làm gì khi Precise Technique
      còn cấm crit, nên nó để dành cho stage sau. Lo ba cái còn lại sớm từ lúc
      này là quyết định của chúng tôi. Cả hai bánh xe mana cost vẫn ở trên cây.
