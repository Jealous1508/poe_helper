    moveOn: "bạn có staff crit, có Void Shockwave, và boss Tier 16 chết trước khi sang phase hai."
    details:
      - title: Bước đổi sang crit cần gì
        body: |
          Một cây staff có physical damage mỗi giây cao và critical strike chance. Một [[Diamond Flask]], và suffix "increased Critical Strike Chance during Effect" trên bất kỳ cây flask nào của bạn. [[Assassin's Mark]] với [[Mark On Hit Support]] và [[Lifetap Support]]. Abyssus là tùy chọn và là một rủi ro thật trên một nhân vật melee.

          Đừng bắt đầu đổi cho tới khi cây staff đã nằm trong tay. Bỏ Precise Technique mà chưa có vũ khí crit là mất 40% more damage và thay bằng không gì cả.

          Danh sách đó là của maxroll, và danh sách affix flask cơ bản của họ cũng nằm trong cùng khối gear này: armour, critical strike chance, movement speed, và miễn corrupted blood trên cây life flask.

          poe-vault thì không mô tả bước đổi nào cả. Các trang của họ không nhắc tới Precise Technique hay Precision, họ đòi một Diamond Flask và suffix crit cho flask ở mọi mức budget, và hai link phía trên có ghi là của poe-vault — link mark có Blood Rage, link aura không có Precision — được đưa ra mà không chia theo budget. Bản export level 96 cũng không chạy Precision, còn lời khuyên về Watcher's Eye của maxroll thì vẫn tính có nó. Vậy là các nguồn bất đồng về chuyện khi nào mấy mảnh crit vào, và về chuyện Precision có ở lại sau đó hay không. Trang này theo thời điểm của maxroll. Lựa chọn đó là của chúng tôi.
      - title: Craft endgame
        body: |
          Lộ trình của poe-vault là một cây Ezomyte Staff recombinate ở item level 84, với khoảng một trên sáu cơ hội ra kết quả ba prefix. Cây chest budget cao là một Royal Plate ở item level 86, bị beast chặn, cần ít nhất 60 Memory Strand.

          Không thứ nào trong đó có giá cho 3.30, mà 3.30 thì đã đổi chi phí crafting. Hãy coi nó là hình dạng của kế hoạch.
      - title: Cluster jewel
        body: |
          Maxroll ghi rằng ba cây large cluster Physical Damage thì yếu hơn *một chút* so với cluster Staff, và [[Overlord]] cho bạn bỏ bánh xe Fortify khỏi cây.

          Đây là tối ưu giai đoạn muộn. Nó không thuộc về 90 level đầu của bạn.
