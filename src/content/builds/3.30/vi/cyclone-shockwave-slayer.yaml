name: Cyclone Shockwave Slayer
tagline: >-
  Bạn giữ một nút và xoay. Vài cú hit lại có một đợt shockwave bung ra từ con
  quái bạn đang chạm, và leech thì không bao giờ tắt.
class: Duelist
ascendancy: Slayer
role: starter
budget: starter
budgetNote: >-
  **Không nguồn nào cho một con số currency đáng tin cho 3.30, và đó là lỗ hổng
  bằng chứng lớn nhất của build này.** Maxroll không in giá nào cả; poe-vault chỉ
  dùng ba mức thấp, trung bình và cao. Điều nói chắc được: khởi đầu gần như miễn
  phí, vì không bắt buộc unique nào và vũ khí của bạn đến từ vendor recipe. Đường
  cong chi phí đi: body armour six-link → một cây staff rare tốt hoặc
  recombinate → [[The Stampede]] nếu bạn đi Tumult →
  [[Stranglegasp]] → [[Void Shockwave Support]] → [[Mageblood]] hoặc
  [[Progenesis]]. Bỏ qua hai con số bạn có thể gặp: cái "endgame bosser 100
  Divine" thuộc về một con Occultist cold damage over time, không phải build này,
  còn mấy con số ~49 và ~433 Divine đang lưu truyền cho Cyclone Slayer endgame là
  của những nhân vật 3.29 đã hoàn chỉnh.
mainSkill: Cyclone
image: asc-icon-slayer
hero: art-slayer
tags: [Melee, Physical, Một nút, Không cần unique]
ratings: { clear: 4, bossing: 3, survivability: 4, ease: 3 }
verified: "2026-11-13"
confidence: mixed
confidenceNote: >-
  Guide này **đúng là 3.30 thật** (cập nhật 12 tháng 11 2026), và Cyclone,
  Shockwave, General's Cry với Slayer đều không bị patch đụng tới. Có ba chỗ yếu.
  **Cái link Path of Building của chính guide không mở ra build này** khi
  researcher bên chúng tôi tải về — nó trả về một trang tên là
  "Level 98 Volley Support Slayer" không có gear — nên hãy mở nó trong browser
  trước khi tin; các con số ở đây đến từ một bản export riêng của cộng đồng, mà
  file đó tự gắn nhãn 3.29 ngay trong tiêu đề và là một nhân vật Cyclone of
  Tumult crit, nên chúng không phải số của 3.30 và không phải của bản starter
  Cyclone gốc.
  **Không nguồn 3.30 nào cho thứ tự ascendancy theo từng lab**, và ba nguồn thì
  xung đột, nên thứ tự dưới đây là khuyến nghị của chúng tôi và được ghi rõ như
  vậy. Và không có budget nào tồn tại. Các điểm số là phán đoán ngày đầu của
  researcher bên chúng tôi, làm tròn xuống từ số lẻ nửa điểm: clear 4.5, bossing
  3.5 khi làm starter rồi lên tầm 4.5 khi đủ gear, ease 3.5.
modes:
  ssf: >-
    Nửa phần starter thì cực hợp chơi một mình: không unique, vũ khí từ vendor
    recipe, và gem là quest reward. Phần endgame thì không —
    [[Void Shockwave Support]] chỉ rơi từ Uber Elder, còn
    [[The Stampede]], [[Stranglegasp]] và [[Mageblood]] là mục tiêu trade. Chơi
    được tới tầm Voidstone, rồi là một cuộc grind. Không nguồn nào bàn tới.
  hardcore: >-
    Không nguồn nào bàn tới. Phán đoán của chúng tôi: leech vĩnh viễn, cộng 90%
    physical damage reduction và 57% block của bản export gắn nhãn 3.29, là một
    lớp vỏ hợp lệ, nhưng 4,800 life của bản export đó trên một nhân vật melee đứng trong mọi telegraph của boss, cộng với
    "cannot be leeched from" là một đối trọng cứng, khiến nó tốt nhất cũng chỉ ở
    mức trung bình. Chưa ai thử.

idea: |
  [[Cyclone]] là một attack channel. Bạn giữ nút, bạn vừa xoay vừa di chuyển, và bạn hit mọi thứ bạn đi xuyên qua.

  Damage thật ra không phải cái vòng xoay. Nó là [[Shockwave Support]], thứ kích hoạt một cú nổ diện rộng riêng biệt khi melee hit — 336% attack damage của bạn ở gem 20, trong bán kính 2.7 mét, từ tối đa bốn lượt dùng trữ sẵn trên một cooldown một giây. Việc của Cyclone là cung cấp hit và di chuyển; mấy đợt shockwave mới là thứ xóa sổ pack. Đó là lý do build được đặt tên theo viên support gem.

  Bạn sống nhờ [[Brutal Fervour]]. Vì Cyclone hit liên tục, leech của bạn không bao giờ dừng, và leech của Slayer không tắt khi đầy máu. Bạn hồi phục vĩnh viễn và ăn ít damage hơn 10% vĩnh viễn.

  Một luật cứng duy nhất: **Shockwave chỉ chạy với mace, sceptre và staff.** Không sword, không axe.

chain:
