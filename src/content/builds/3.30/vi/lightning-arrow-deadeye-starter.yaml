      - name: Single target
        gems: [Artillery Ballista, Focused Ballista Support, Elemental Damage with Attacks Support, Immolate Support]
      - name: Phản ứng
        gems: [Cast when Damage Taken Support, Immortal Call]
      - name: Aura
        gems: [Anger, Grace, Precision]
      - name: Mark và di chuyển
        gems: [Sniper's Mark, Dash, Frostblink]
    moveOn: "bạn có một cây bow đáng để đổi về Lightning Arrow, và spell suppression đã gần cap."
    details:
      - title: Đừng thấy tệ vì phải đổi skill
        body: |
          Đó không phải thất bại của build. Đó là cách build được thiết kế, nằm trong chính planner của guide, dù không chỗ nào trên trang nói thẳng ra.

          Elemental Hit of the Spectrum tự cấp damage cho mình. Lightning Arrow thì mượn damage của bạn. Ở thời điểm này bạn chẳng có gì để cho mượn.
      - title: Suppression, theo thứ tự
        body: |
          Passive tree cho tầm 80%. Evasion Mastery cho thêm 15%, nhưng chỉ khi helmet, body armour, gloves **và** boots đều có chỉ số evasion.

          Điều kiện cuối đó là chỗ người ta bỏ sót. Một món base giáp trong bộ không có evasion là cái mastery đó chết.
      - title: Kiếm currency đầu tiên trong 3.30
        body: |
          Bản làm lại loot chuyển giá trị sang quái rare với unique và sang boss. Build này clear nhanh và giết boss chậm, đúng chiều ngược với league này.

          Câu trả lời thực dụng là chạy nhiều map chứ không chạy map khó, và thật sự dừng lại giết mấy con rare thay vì chạy qua chúng.
  - id: red-maps
    image: spine-bow
    title: Map đỏ
    levels: Map Tier 11–16
    uses: >-
      [[Lightning Arrow]] trở lại, giờ trong six-link cùng
      [[Greater Fork Support]] và [[Inspiration Support]], đứng sau một cây bow
      thật sự. Một gói [[Manaforged Arrows Support]] bắn phần utility thay bạn.
    changes: >-
      Bạn respec từ [[Precise Technique]] sang crit ở đây. Thêm
      [[Power Charge On Critical Support]] vào link [[Frenzy]] với Manaforged để
      charge tự giữ mình luôn đầy.
    links:
      - name: Main skill
        gems: [Lightning Arrow, Mirage Archer Support, Inspiration Support, Elemental Damage with Attacks Support, Greater Fork Support, Trinity Support]
      - name: Utility tự động
        gems: [Storm Rain, Blast Rain, Manaforged Arrows Support, Lifetap Support, Inspiration Support, Elemental Damage with Attacks Support]
      - name: Charge
        gems: [Frenzy, Manaforged Arrows Support, Power Charge On Critical Support]
      - name: Mark
        gems: [Sniper's Mark, Mark On Hit Support]
      - name: Aura
        gems: [Grace, Anger, Haste, Enlighten Support]
    moveOn: "bạn clear map Tier 16 thoải mái và đã respec xong sang crit."
    details:
      - title: Cú đổi sang crit
        body: |
          [[Precise Technique]] và crit loại trừ nhau. Cú đổi là một lần respec, không phải thay đổi dần dần, và bạn làm nó khi cây bow đã đủ base critical strike chance để đáng làm.

          Một nguồn dùng mốc 6% base crit làm dấu để đổi [[Increased Critical Damage Support]] vào thay [[Increased Critical Strikes Support]]. Nguồn khác dùng mốc 8% base crit làm chuẩn cho chính cây bow. Đó là hai câu hỏi khác nhau với hai câu trả lời khác nhau.
      - title: Five-link là đủ trong một thời gian
        body: |
          Một bài viết cũ hơn, do chính tác giả gắn nhãn đã lỗi thời, nói một five-link gánh bạn tới Tier 16. Chúng tôi nhắc vì nó đúng với archetype này và nó giúp bạn khỏi phải mua six-link quá sớm.

          Dồn tiền vào cây bow trước.
      - title: Một thay đổi craft của 3.30 chưa ai viết ra
        body: |
          Ghi chú craft của một tác giả có một dòng đúng là riêng cho 3.30: "cannot roll attack" không còn dùng được cho annul trong patch này.

          Nếu bạn định đi lộ trình recombinator được công bố để làm cây bow ba mod tier 2, hãy kiểm cách làm hiện tại trước khi tiêu tiền. Chính một dòng đó cũng là bằng chứng rằng mấy ghi chú đó được sửa một phần cho 3.30, dù phần header của file vẫn ghi 3.29.
  - id: endgame
    image: the-taming
    title: Endgame
    levels: Tier 17 trở lên
    uses: >-
      Một cây bow tự craft với ba prefix tier cao nhất, [[Lethal Pride]],
      [[Nimis]], và cuối cùng là hai ring [[The Taming]].
    changes: >-
      Đây là điểm chuyển giao. Nhân vật bạn đang dựng trở thành bài endgame trên
      site này, *Lightning Arrow / Elemental Hit of the Spectrum Deadeye* — cùng
      bộ khung, cùng ascendancy, dựng quanh hai ring Taming và một gói trigger
      theo crit.
    links:
      - name: Main skill
        gems: [Lightning Arrow, Mirage Archer Support, Inspiration Support, Elemental Damage with Attacks Support, Greater Fork Support, Invert the Rules Support]
      - name: Utility tự động
        gems: [Storm Rain, Blast Rain, Manaforged Arrows Support, Lifetap Support, Inspiration Support, Elemental Damage with Attacks Support]
      - name: Aura
        gems: [Grace, Anger, Haste, Enlighten Support]
    moveOn: "ở đây không còn stage nào nữa. Đọc bài endgame để biết nhân vật đi tiếp tới đâu."
    details:
      - title: Thứ tự nâng cấp, không kèm giá nào
        body: |
          Ba nguồn đồng ý về thứ tự dù không nguồn nào đưa ra chi phí:

          six-link → đồ rare cap suppression → [[Hyrri's Truth]] → [[The Taming]] → [[Hyrri's Ire]] → [[The Fledgling]] → một cây bow tự craft với ba prefix tier cao nhất → [[Lethal Pride]] → [[Nimis]] → [[Headhunter]] → [[Mageblood]].

          **Không nguồn nào đưa ra tổng chi phí tính bằng Divine cho build này ở bất kỳ stage nào.** Mà một league ngày đầu thì cũng chưa có nền kinh tế nào để mà định giá.
      - title: Chuyện đánh boss không được chữa
        body: |
          Chính planner của Maxroll cho build này điểm Bossing 2 trên 5 so với Mapping 5. Một nguồn thứ hai cho damage boss của nó 3 trên 5, điểm thấp nhất của nó trong danh sách đó.

          Không có câu trả lời gọn gàng cho chuyện này. Build này là một con phá map và nó vẫn cứ là vậy. Nếu kế hoạch league của bạn là farm boss, đây là lựa chọn sai và ba build khác trên site này tốt hơn.
      - title: Cái tương tác bow đang được hype trong 3.30
        body: |
          Một tier list mô tả một tương tác cho Deadeye dùng bow trong 3.30: với một unique cụ thể, projectile chẻ ra có thể dồn toàn bộ hit vào một mục tiêu kiểu shotgun, ước tính 20 tới 60 lần damage.

          Hãy thận trọng với chuyện đó. Nó là **ước tính của một site, không phải một phép đo**, nó thuộc về một setup Ice Shot chứ không phải Lightning Arrow, và cái video nó dẫn ra thì không mở được. Nó nằm cạnh build này, không phải một phần của nó.

powerCurve: |
  Damage là một cái nền nhân với những gì [[Deadeye]] làm cho projectile. Cái nền là flat added damage, và câu hỏi ở mọi giai đoạn là ai cấp nó: viên gem hay gear của bạn. Chồng lên trên là hai mũi tên thêm từ [[Endless Munitions]], [[Far Shot]] ở tầm xa, [[Trinity Support]], và về sau là crit. Gọi nó là một cái nền với vài hệ số nhân là cách diễn đạt của chúng tôi. Từng phần thì là của các nguồn.

  Giai đoạn đầu, campaign dễ. [[Lightning Arrow]] miễn phí ở level 12, [[Precise Technique]] cho một khoản damage lớn mà không cần dựng crit, và mỗi lab thêm một hệ số nhân, trong đó Endless Munitions ở lab thứ ba là cái lớn nhất cho clear. Skill này gánh cả campaign.

  Giai đoạn giữa là lúc nó lộ ra. Ở map trắng và map vàng, bow với ring của bạn gần như không cộng gì, nên Lightning Arrow không có gì để nhân. Đó là lý do quãng này chơi bằng [[Elemental Hit of the Spectrum]], skill mang cái nền trên chính viên gem. Build không yếu đi ở đây. Nó đổi skill để khỏi yếu đi.

  Về cuối, cái nền là thứ mua được. Một cây bow có elemental damage thật và có base crit cho bạn đổi về Lightning Arrow và respec từ Precise Technique sang crit. Đó là bậc thang lớn duy nhất của build, và nó đến từ currency chứ không phải từ level. Phòng thủ thì không bao giờ có bậc nào như vậy: evasion, 100% spell suppression và tầm 4,500 life, không có lớp hấp thụ và không có hồi phục, theo một file **3.29**. Nên nhân vật nhanh lên rất nhiều mà vẫn mỏng gần như cũ, và bossing vẫn đứng ở chỗ chính tác giả chấm cho nó, 2 trên 5.

upgrades:
  - step: "Một cây bow đủ tốt để đổi về Lightning Arrow"
    why: >-
      Lightning Arrow scale theo những gì gear cộng vào, nên đây là món kết
      thúc giai đoạn Elemental Hit. Base thường dùng là [[Spine Bow]]. Hai
      nguồn đưa ra ngưỡng và hai ngưỡng khác nhau: 8% base crit với 800+
      elemental damage mỗi giây, hoặc 6% base crit làm mốc đổi support crit.
      Thứ tự ba nguồn bên dưới không liệt kê cây bow đầu tiên này. Đặt nó lên
      đầu là theo các stage phía trên, chỗ nói dồn tiền vào cây bow trước. Một
      tác giả ghi rằng "cannot roll attack" không còn dùng được cho annul
      trong 3.30, nên hãy kiểm cách craft trước khi tiêu tiền.
  - step: "Một six-link"
    why: >-
      Đứng đầu trong thứ tự mà ba nguồn đồng ý. Một bài viết cũ hơn, do chính
      tác giả gắn nhãn đã lỗi thời, nói five-link gánh bạn tới Tier 16, nên
      chúng tôi để nó chờ sau cây bow.
  - step: "Giáp rare để cap [[Spell Suppression]]"
    why: >-
      Đứng thứ hai trong thứ tự của các nguồn, và là bước phòng thủ duy nhất
      trong danh sách. Cây cho tầm 80% và Evasion Mastery thêm 15%, nhưng chỉ
      khi helmet, body, gloves và boots đều có evasion. Với tầm 4,500 life và
      không có hồi phục, nửa spell damage mà nó xóa đi không phải thứ tùy
      chọn.
  - step: "[[Hyrri's Truth]]"
    why: >-
      Bow damage, accuracy và crit trên một cái amulet rẻ. Nó đứng thứ ba
      trong thứ tự của các nguồn và là amulet mặc định giai đoạn đầu của
      archetype này.
  - step: "[[The Taming]]"
    why: >-
      Các nguồn đặt nó ở đây, trước cả chest. Hai cái là lõi của bản endgame
      của nhân vật này, nên đây là chỗ bản starter bắt đầu biến thành build
      đó. Không nguồn nào nói vì sao nó xếp trên Hyrri's Ire, và chúng tôi sẽ
      không đoán.
  - step: "[[Hyrri's Ire]]"
    cost: "7–10 Divine lúc league start ở 3.29"
    why: >-
      Flat damage của nó đáng giá với Lightning Arrow hơn là với Elemental
      Hit, nên nó chỉ có lời khi bạn đã đổi về. Cái giá là của một tác giả,
      viết cho một nền kinh tế khác; đừng đọc nó như con số 3.30.
      [[Daresso's Defiance]] là món thay tạm giá rẻ, có movement speed mà
      không có chút suppression nào.
  - step: "[[The Fledgling]], rồi một cây bow tự craft với ba prefix tier cao nhất"
    why: >-
      Far Shot của The Fledgling cộng dồn với Far Shot của ascendancy; một tác
      giả nói lên tới 90% more damage ở khoảng cách xa nhất. Cây bow thứ hai
      là phiên bản đắt tiền của bước đầu tiên, và các nguồn đặt nó muộn như
      vậy.
  - step: "[[Lethal Pride]] và [[Nimis]], rồi [[Headhunter]] và [[Mageblood]]"
    why: >-
      Đoạn cuối trong thứ tự của các nguồn. Một tác giả muốn hai hoặc ba dòng
      "double damage" trên viên jewel. Không nguồn nào đưa ra chi phí cho bất
      cứ món nào ở đây, và từ chỗ này bài endgame trên site tiếp quản.

play:
  mapping: |
    Viết cho setup map đỏ. Ở map trắng và map vàng thì vòng lặp y như vậy, chỉ là mũi tên là [[Elemental Hit of the Spectrum]].

    1. **Bắn một mũi tên vào pack rồi đi tiếp.** Pack chết trước khi mũi tên bay xong, và [[Mirage Archer Support]] bắn tiếp phía sau bạn.
    2. **Không bấm gì khác.** [[Manaforged Arrows Support]] bắn [[Storm Rain]] và [[Blast Rain]] thay bạn, link [[Frenzy]] giữ charge, còn [[Mark On Hit Support]] áp [[Sniper's Mark]].
    3. **Dừng lại cho quái Rare.** Trong 3.30 đó là chỗ có currency, nên đừng chạy qua chúng.

    Các nguồn không cho rotation nào nhiều hơn thế này.
  bossing: |
    Bossing là trục yếu và không gì dưới đây chữa được nó. Đây là những thứ các nguồn đưa cho bạn để xoay xở.

    1. **Giữ khoảng cách.** [[Far Shot]] cộng damage theo quãng đường mũi tên đã bay, tới một mức cap mà một nguồn đặt quanh 75 đơn vị và nguồn khác nói 70. Đứng sát boss là vứt khoản đó đi.
    2. **Mark boss.** Tự bấm [[Sniper's Mark]] cho tới khi [[Mark On Hit Support]] làm thay bạn.
    3. **Ở setup early và mid, đặt [[Artillery Ballista]].** Nó nằm trong một link riêng cùng [[Focused Ballista Support]] và là single target của bạn ở giai đoạn đó. Link của map đỏ không còn liệt kê ballista nào, nên từ đó boss bị giết bằng chính mũi tên dùng cho mọi thứ khác. Vế cuối là cách đọc của chúng tôi từ các danh sách link.
    4. **Đừng đổi đòn.** Tầm 4,500 life núp sau evasion nghĩa là một cú đánh lớn vẫn giết bạn, và không có hồi phục nào để đứng chịu.

    Patch này tăng cường boss khu vực và đặt phần thưởng sau lưng chúng. Kế hoạch thành thật, như phần patch note phía trên nói, là đi mượn hoặc đi mua damage boss.

deaths:
  - situation: "Một cú đánh lớn"
    cause: >-
      Tầm 4,500 life núp sau evasion, không có lớp hấp thụ và không có động cơ
      hồi phục. Evasion né cú hit; nó không làm cú hit trúng nhỏ lại.
    fix: >-
      Không gì trong build đã công bố gỡ được chuyện này. Cap suppression để
      spell bị cắt một nửa, giữ [[Cast when Damage Taken Support]] với
      [[Immortal Call]] từ link map đầu, và né những gì có báo trước.
  - situation: "Spell damage, khi suppression chưa đủ 100%"
    cause: >-
      Cây cho tầm 80%. 15% của Evasion Mastery tắt nếu bất kỳ món nào trong
      helmet, body, gloves hay boots không có chỉ số evasion.
    fix: >-
      Kiểm cả bốn món sau mỗi lần đổi đồ. Một món base giáp không có evasion
      là đủ giết cái mastery.
  - situation: "Một lần đổi gear làm một resistance tụt dưới 75%"
    cause: >-
      Build không có phòng thủ dư nào để gánh một resistance chưa cap. Đó là
      một trong ba mốc chặn bạn tự quản, cùng với suppression và accuracy.
    fix: >-
      Kiểm lại resistance ở crafting bench sau mỗi lần nâng cấp, không chỉ sau
      boss Act 5 và boss Act 10.

troubleshooting:
  - symptom: "Damage tụt sau khi bạn đeo một món gear tốt hơn"
    cause: >-
      [[Precise Technique]] chỉ hoạt động khi accuracy cao hơn maximum life.
      Một cục life lớn có thể đẩy life vượt qua nó, và khoản thưởng tắt mà
      không báo gì.
    fix: >-
      Mở bảng nhân vật và so hai con số sau mỗi lần nâng life. Thêm accuracy
      cho tới khi nó vượt lên lại.
  - symptom: "Lightning Arrow cảm giác như chết ở map trắng và map vàng"
    cause: >-
      Nó scale theo flat damage từ gear, mà bạn chưa có chút nào. Nhân vật của
      bạn không sai chỗ nào cả.
    fix: >-
      Đổi sang [[Elemental Hit of the Spectrum]], đúng như planner của guide
      làm trong loadout early và mid. Quay về khi cây bow đã tốt.
  - symptom: "Spell suppression kẹt ở quanh 80%"
    cause: >-
      Evasion Mastery không chạy. Nó cần chỉ số evasion trên helmet, body
      armour, gloves và boots, đủ cả bốn.
    fix: >-
      Thay món duy nhất không có evasion.
  - symptom: "Bạn đang cố gây đủ cả ba nguyên tố cho [[Trinity Support]]"
    cause: >-
      Một chỗ hiểu sai phổ biến. Trinity đạt hiệu lực tối đa khi có hai trong
      ba nguyên tố gây damage.
    fix: >-
      Thôi dựng lại gear quanh nguyên tố thứ ba.
  - symptom: "Mũi tên bắn trượt sau khi respec sang crit"
    cause: >-
      Precise Technique chính là thứ làm bạn không bao giờ miss. Không có nó
      thì accuracy lại có ý nghĩa. Nối hai chuyện này với nhau là cách đọc của
      chúng tôi; mấy con số thì là của một nguồn.
    fix: >-
      Nhắm tầm 3,300 accuracy cho Tier 16. Quá tầm 4,500 là thừa.
  - symptom: "Boss chết quá lâu"
    cause: >-
      Phần lớn là do build. Chính tác giả chấm bossing 2 trên 5, và một nguồn
      thứ hai cho damage boss điểm thấp nhất của nó.
    fix: >-
      Tận dụng tầm xa cho [[Far Shot]] và giữ [[Sniper's Mark]] trên boss. Qua
      đó rồi thì không có câu trả lời gọn gàng nào: chạy nhiều map thay vì map
      khó, và kiếm damage boss từ chỗ khác.

patch:
  - note: >-
      **Không có gì về build này đổi trong 3.30.** [[Lightning Arrow]] không được
      nhắc trong patch note. [[Deadeye]] cũng không. Không có thay đổi nào về
      skill bow hay base bow cả. Bạn đang thừa hưởng nguyên vẹn một bộ khung đã
      được kiểm chứng ở 3.29.
  - entry: special-base-implicits
    note: >-
      **Một thay đổi có đụng tới gear của bạn.** Implicit của Artillery Quiver giờ
      là "+1 to maximum number of Summoned Totems" cho skill attack. Build này
      chạy [[Artillery Ballista]] trong setup early và mid, nên thay đổi đó là
      một buff thật, dù nhỏ, cho phần đó của build.
  - entry: mercenary-nerfs
    note: >-
      **Buff tương đối.** Mấy build dùng mercenary bị cắt nặng. Build này không
      dùng con nào, nên nó leo lên trong danh sách mà chẳng cần đổi gì.
  - entry: winter-orb-nerf
    note: >-
      **Buff tương đối.** Con starter được chơi nhiều nhất league trước bị cắt
      nặng, chuyện đó dọn chỗ ở gần đỉnh mấy cái tier list về chạy map.
  - entry: loot-rarity-rework
    note: >-
      **Đây là cơn gió ngược, và là sự thật ảnh hưởng tới quyết định nhiều nhất
      với build này.** Currency giá trị giờ đến nhiều hơn hẳn từ quái rare với
      unique và từ boss. Một build mà chính tác giả cho 2 trên 5 về bossing thì
      đang bị chỉ ra xa khỏi chỗ patch đặt phần thưởng. Nó không bị nerf. Phần
      thưởng đã dịch chỗ.
  - entry: league-fates
    note: >-
      **Cùng vấn đề đó, nhìn từ phía khác.** Cơ chế league tăng cường boss khu
      vực và chặn phần thưởng của nó sau việc giết chúng. Hãy tính chuyện đi mượn
      hoặc đi mua damage boss, thay vì mong build tự cấp.
  - entry: ruthless-changes
    note: >-
      **Không có gì ở đây cần học lại cho Deadeye, nhưng biết cái bẫy.** Một danh
      sách dài các thay đổi ascendancy trong patch note nằm bên trong phần riêng
      của Ruthless và không áp dụng cho game thường. Deadeye không xuất hiện ở
      danh sách nào. Vài bài viết ngày launch đã đem phần đó áp vào game thường
      cho các class khác.
  - entry: meta-crafting-costs
    note: >-
      **Cây bow tự craft có thể làm theo cách khác.** Ghi chú của một tác giả có
      ghi lại rằng "cannot roll attack" không còn dùng được cho annul trong 3.30,
      chuyện đó ảnh hưởng tới lộ trình craft đã công bố. Chưa ai viết ra cách làm
      mới.

strengths:
  - "Tốc độ clear thuộc hàng đỉnh. Một trong hai con chạy map nhanh nhất danh sách này."
  - "Vào rẻ. Không bắt buộc unique nào ở bất kỳ điểm nào."
  - "Leveling cực ngon: skill miễn phí từ level 12 và gánh cả campaign."
  - "Phần lớn utility tự động hóa chính nó qua Manaforged Arrows."
  - "Scale mượt theo currency, không có cổng chặn cứng nào."
  - "3.30 không đổi gì ở nó, nên kiến thức league trước chuyển sang dùng trực tiếp."
weaknesses:
  - "Bossing là trục yếu và nó cứ yếu. Điểm của chính tác giả là 2 trên 5."
  - "Damage tệ khi budget thấp, và đó là lý do bạn tiêu cả đoạn đầu game với một skill khác."
  - "Tầm 4,500 life núp sau evasion. Một cú đánh lớn vẫn giết bạn."
  - "Bạn tự quản ba mốc chặn: suppression, accuracy và resistance."
  - "Bạn đổi main skill một lần và respec keystone một lần. Nó không phải build một skill."
  - "Guide được công bố là dữ liệu 3.28 với 3.29 nằm dưới cái banner 3.30."
avoidIf: >-
  Chọn build khác nếu kế hoạch league của bạn là farm boss. Build được chính tác
  giả cho 2 trên 5 về bossing, mà 3.30 thì dịch phần thưởng về phía boss. Bỏ qua
  luôn nếu bạn ghét phải theo dõi mấy mốc suppression, accuracy và resistance sau
  mỗi lần đổi gear, hoặc nếu bạn muốn bấm đúng một skill từ level 1 tới level 100
  — bạn sẽ đổi main skill một lần và respec một keystone một lần. Nó là lựa chọn
  hardcore tệ, dù không nguồn nào nói thẳng ra như vậy.

