name: Lightning Arrow Deadeye (league starter)
tagline: >-
  Con chạy map nhanh rẻ nhất trong danh sách này. Một mũi tên dọn cả màn hình.
  Nó cũng là con đánh boss yếu nhất ở đây, và chuyện đó league này nặng hơn
  league trước.
class: Ranger
ascendancy: Deadeye
role: starter
budget: starter
budgetNote: >-
  **Không nguồn nào công bố budget 3.30 cho build này, và chúng tôi sẽ không bịa
  ra một con số.** Điểm budget của chính Maxroll là 3 trên 5, mà đó là con số
  **3.29**. Cái giá cụ thể duy nhất có người đưa ra là 7–10 Divine cho
  [[Hyrri's Ire]] "lúc league start", cũng là **3.29** và được viết cho một nền
  kinh tế khác. Con số thứ ba, khoảng 49 chaos, xuất hiện trên một trang lưu trữ
  tự sinh mà chúng tôi không mở được và trông như một bản chụp ở level thấp. Bỏ
  qua cả ba như giá hiện tại. Thứ đáng tin là hình dạng của nó: không bắt buộc
  unique nào, và khoản chi thật đầu tiên của bạn là một cây bow.
mainSkill: Lightning Arrow
image: lightning-arrow
hero: art-deadeye
tags: [Bow, Elemental, Mapper, Khởi đầu rẻ]
ratings: { clear: 5, bossing: 2, survivability: 2, ease: 3 }
verified: "2026-11-13"
confidence: mixed
confidenceNote: >-
  **Clear và bossing là số của chính Maxroll; survivability và ease là của chúng
  tôi.** Cái planner đứng sau guide cho điểm Mapping 5, Bossing 2, Defence 2,
  Difficulty 4 và Budget 3. Chúng tôi cho survivability 2 và ease 3 để khớp với
  mấy số đó, làm tròn 2.5 của mình xuống. Tất cả đều là **điểm 3.29**. Trang
  guide đóng dấu 3.30, nhưng tiêu đề của nó vẫn ghi 3.28, planner của nó ghi
  league 3.29 với passive tree 3.26, và toàn bộ dòng changelog 3.30 của nó viết
  "Awaiting PoB update, no changes in 3.30 patch notes". Không có gì trong build
  đổi trong 3.30, nên dữ liệu cũ phần lớn vẫn đúng — nhưng đừng coi con số nào
  trên trang đó là được đo trong league này.
modes:
  ssf: >-
    Không nguồn nào cho điểm. Điểm có lợi: không bắt buộc unique nào và cây bow
    thì craft được. Điểm bất lợi: lộ trình lo gear được công bố dựa vào base
    fractured mua ngoài và recombinator. Đây là nhận định của chúng tôi, không
    phải khẳng định có nguồn.
  hardcore: >-
    Không nguồn nào nói tới. Tầm 4,500 life núp sau evasion với spell
    suppression, kèm điểm defence 2 trên 5, là một lý lịch hardcore tệ. Lại là
    nhận định của chúng tôi, và chúng tôi sẽ không làm vậy.

idea: |
  Bạn bắn một mũi tên. Nó chuyển phần lớn damage sang lightning rồi phóng tia điện vào mọi thứ xung quanh. Pack quái chết trước khi mũi tên bay xong.

  [[Deadeye]] làm mọi projectile mạnh hơn: thêm hai mũi tên, thêm damage ở xa, và một bản sao của bạn tiếp tục bắn trong lúc bạn di chuyển.

  Có một điểm gài mà không tier list nào đưa lên trang nhất, nên chúng tôi làm. **Trong đoạn đầu của một league, bạn không thật sự chơi Lightning Arrow.** Bạn chơi [[Elemental Hit of the Spectrum]], vì nó là skill bow duy nhất tự cấp một lượng lớn flat damage, mà flat damage đúng là thứ bạn thiếu khi chưa có currency. Bạn đổi về Lightning Arrow khi đã sở hữu một cây bow thật sự tốt.

  Đây là một bộ khung có hai pha skill, không phải một build một skill. Nếu nghe như bị dụ, thì biết bây giờ còn hơn biết vào tuần đầu.

  **Nó dẫn tới đâu:** bài này là bản starter. Cùng nhân vật đó ở mức budget mirror, dựng hẳn quanh Elemental Hit of the Spectrum và hai ring [[The Taming]], chính là bài endgame trên site này, *Lightning Arrow / Elemental Hit of the Spectrum Deadeye*. Bạn không phải reroll để tới đó. Bạn giữ nguyên bộ khung bow đó và mua tiếp.

chain:
  - label: Bắn
    text: "[[Lightning Arrow]] chuyển physical damage sang lightning và đánh trúng quái gần đó bằng mấy tia điện khi hit."
  - label: Nhân lên
    text: "[[Endless Munitions]] thêm hai projectile, [[Far Shot]] thêm damage ở xa, và [[Mirage Archer Support]] để lại một bản sao của bạn đứng bắn."
  - label: Cân bằng các nguyên tố
    text: "[[Trinity Support]] thưởng cho việc hit bằng nhiều hơn một nguyên tố. Bạn chỉ cần hai trong ba nguyên tố gây damage là đủ hiệu lực tối đa."
  - label: Sống sót
    text: "Evasion, 100% [[Spell Suppression]] và tầm 4,500 life. Không có lớp hấp thụ nào và không có động cơ hồi phục nào."

chainDetails:
  - title: Vì sao bạn mở đầu bằng Elemental Hit chứ không phải Lightning Arrow
    body: |
      Đây là điều hữu ích nhất trong cả bài.

      Lúc league start, bow của bạn dở và ring của bạn dở, nên bạn gần như không có flat added damage nào. [[Elemental Hit of the Spectrum]] mang damage trên chính viên gem, nên nó chạy được với đồ trống trơn. [[Lightning Arrow]] scale theo những gì gear cộng vào, nên nó cảm giác như chết cho tới khi gear tồn tại.

      Hai nguồn đồng ý với nhau mà không nói thẳng ra. Chính planner của guide đặt Elemental Hit trong loadout early và mid, còn Lightning Arrow chỉ có ở loadout late. Phần ghi chú của tác giả được xem nhiều nhất nói Lightning Arrow dễ chịu hơn nhiều khi bạn đã có một cây bow thật tốt hoặc [[Hyrri's Ire]] để bù cho phần flat damage thấp.

      Nên: lên level bằng Lightning Arrow vì nó miễn phí từ level 12, chạy map bằng Elemental Hit of the Spectrum, rồi quay về Lightning Arrow khi cây bow của bạn xứng đáng.
  - title: "\"Bow tốt\" thật ra nghĩa là gì"
    body: |
      Hai nguồn có đưa ra con số thì đưa hai con số khác nhau, vì hai lý do khác nhau, nên đừng coi cái nào là ngưỡng duy nhất.

      Một nguồn nói 8% base critical strike chance và 800+ elemental damage mỗi giây. Nguồn kia dùng mốc 6% base crit làm điểm để đổi [[Increased Critical Damage Support]] sang [[Increased Critical Strikes Support]]. Hai cái đó trả lời hai câu hỏi khác nhau.

      Base mà cả hai đồng ý: Spine Bow, Bone Bow, Ivory Bow. [[Spine Bow]] là mục tiêu thường gặp cho một cây tự craft.
  - title: Pierce trước, fork sau
    body: |
      Giai đoạn đầu bạn muốn pierce, từ implicit của gloves hoặc từ ba passive point. Đó là cách rẻ hơn để một mũi tên xuyên cả một hàng quái.

      Về sau bạn đổi sang [[Greater Fork Support]], gem này chẻ projectile ra thay vì xuyên. Hai nguồn mô tả cùng một cú chuyển từ hai hướng đối lập, mức đồng thuận hiếm thấy với build này.
  - title: Precise Technique, và cái luật phá nó
    body: |
      Bạn chạy [[Precise Technique]] trong campaign: không có critical strike, nhưng bạn không bao giờ miss và được một khoản damage lớn. Về sau bạn respec sang build crit.

      **Cái luật ai cũng quên: Precise Technique chỉ hoạt động khi accuracy của bạn cao hơn maximum life.** Hai nguồn cảnh báo chuyện này. Mỗi lần bạn thêm một cục life lớn, kiểm lại xem accuracy có còn vượt lên trên không.
  - title: Phòng thủ đến từ đâu, và nó không phải cái gì
    body: |
      Evasion, spell suppression và life. Chỉ riêng passive tree đã cấp tầm 80% spell suppression. Thêm 15% nữa từ Evasion Mastery, nhưng chỉ khi helmet, body, gloves và boots của bạn **tất cả** đều có evasion.

      Mốc accuracy cho Tier 16 là quanh 3,300. Trên tầm 4,500 là thừa.

      Để lấy thang đo, một file level 98 được công bố cho 4,562 life, 42,903 effective hit point, 14,550 evasion và 63% evade chance. Đó là file **3.29**. Nó mỏng, và tác giả cũng không giả vờ là không.

mandatory:
  - term: Lightning Arrow
    why: >-
      Cái skill mà build được đặt tên theo, và là skill bạn lên level cùng từ
      level 12. Nó thành main skill của bạn lần nữa khi cây bow đã tốt.
  - term: Elemental Hit of the Spectrum
    why: >-
      Cái skill bạn thật sự dùng để chạy map khi budget thấp, vì nó tự cấp damage
      cho mình. Hãy coi nó là một phần bắt buộc của build này, không phải một
      phương án thay thế nó.
    detail: >-
      Cả thứ tự loadout trong planner của guide lẫn ghi chú của tác giả được xem
      nhiều nhất đều đặt Elemental Hit ở early và mid game, còn Lightning Arrow ở
      late game. Nếu bạn bỏ qua bước này, bạn sẽ kết luận build yếu, và bạn kết
      luận đúng về phiên bản của bạn.
  - term: Trinity Support
    why: >-
      Có mặt trong mọi setup được công bố. Nó thưởng cho việc hit bằng nhiều
      nguyên tố, và điều nhiều người hiểu sai là tưởng phải đủ cả ba — bạn chỉ
      cần hai nguyên tố gây damage là đủ hiệu lực tối đa.
  - term: Mirage Archer Support
    why: >-
      Một bản sao của bạn tiếp tục bắn trong lúc bạn di chuyển. Nó có trong mọi
      setup và nó là phần lớn lý do build chơi thấy mượt.
  - term: Spell Suppression
    why: >-
      100%. Với tầm 4,500 life và không có hồi phục, một nửa toàn bộ spell damage
      buộc phải biến mất, không thì bạn chết vì nó.
  - term: Precise Technique
    why: >-
      Keystone của campaign. Không bao giờ miss, không crit, một khoản damage lớn
      — và nó tắt nếu maximum life của bạn vượt quá accuracy.
  - term: Spine Bow
    level: recommended
    why: >-
      Base craft thường dùng. Cây bow là khoản chi thật đầu tiên và là thứ chặn
      cửa cho cú đổi về Lightning Arrow.
  - term: Hyrri's Ire
    level: recommended
    why: >-
      Cái chest cần nhắm nếu bạn đang chơi Lightning Arrow chứ không phải
      Elemental Hit, vì phần flat damage của nó đáng giá hơn với Lightning Arrow.
    detail: >-
      Con 7–10 Divine được trích là **giá lúc league start của 3.29** và không nên
      đọc như giá 3.30. [[Daresso's Defiance]] là món thay tạm giá rẻ: 20%
      movement speed, nhưng không có chút spell suppression nào.
  - term: Hyrri's Truth
    level: recommended
    why: >-
      Bow damage, accuracy và crit trên một cái amulet rẻ. Amulet mặc định giai
      đoạn đầu của cả archetype này.
  - term: The Fledgling
    level: recommended
    why: >-
      [[Far Shot]] của nó cộng dồn với Far Shot của ascendancy, vì chúng là hai
      mod riêng. Một tác giả nói lên tới 90% more damage ở khoảng cách xa nhất.
  - term: Ancestral Vision
    level: recommended
    why: >-
      100% ailment avoidance, nhờ đó bạn bỏ được [[Purity of Elements]] và giải
      phóng phần reservation. Hai nguồn đồng ý với nhau về món này.
  - term: Lethal Pride
    level: recommended
    why: >-
      Một viên jewel về sau. Một tác giả muốn hai hoặc ba dòng "double damage"
      trên nó, và nó cũng giải quyết luôn yêu cầu Strength cho [[Steelskin]].
  - term: The Taming
    level: recommended
    why: >-
      Không phải món cho starter. Hai cái là lõi của bản endgame của nhân vật
      này, nên chúng là thứ bạn đang để dành tiền cho.

labs:
  - lab: Normal
    node: Gathering Winds
    why: "Tailwind: bạn và đồng minh di chuyển và hành động nhanh hơn. Phần tip leveling của chính planner đặt nó đầu tiên."
  - lab: Cruel
    node: Far Shot
    why: "Projectile bay càng xa damage càng cao. Guide nói khoản thưởng cap ở quanh 75 đơn vị; một tác giả khác nói 70. Đừng coi con số nào là chính xác."
  - lab: Merciless
    node: Endless Munitions
    why: "+2 projectile. Mức tăng clear lớn nhất trong cả ascendancy."
  - lab: Eternal
    node: Focal Point
    why: "Tăng hiệu lực của mark. **Cái này là suy luận** — không nguồn nào nêu lab thứ tư, nhưng bộ bốn notable thì đã được thống nhất, nên Focal Point là cái còn lại."

stages:
  - id: acts-1-3
    image: lightning-arrow
    title: Act 1–3
    levels: Level 1–33
    uses: >-
      [[Galvanic Arrow]] từ level 2, rồi [[Lightning Arrow]] từ level 12 sau
      Fairgraves ở Cavern of Wrath. [[Shrapnel Ballista]] và [[Sniper's Mark]]
      cho bất cứ thứ gì có thanh máu.
    changes: >-
      Lấy [[Mirage Archer Support]] ở level 4, [[Manaforged Arrows Support]] ở 8,
      và [[Trinity Support]] sau Weaver ở 18. Mua một [[Sapphire Ring]] trước
      Merveil và một Lapis Amulet cho Dexterity với Intelligence.
    links:
      - name: Level 2–11
        gems: [Galvanic Arrow, Momentum Support, Mirage Archer Support]
      - name: Từ level 12
        gems: [Lightning Arrow, Mirage Archer Support, Lesser Multiple Projectiles Support]
      - name: Single target
        gems: [Shrapnel Ballista, Sniper's Mark]
      - name: Utility
        gems: [Dash, Frostblink, Blink Arrow, Burning Arrow]
      - name: Từ level 16–18
        gems: [Lightning Arrow, Mirage Archer Support, Trinity Support, Elemental Damage with Attacks Support]
    moveOn: "Lightning Arrow đã nằm trong four-link cùng Trinity và bạn đã xong Act 3."
    details:
      - title: Ba tác giả, ba skill để lên level
        body: |
          Guide lên level bằng [[Galvanic Arrow]]. Một nguồn thứ hai nói build mở đầu bằng [[Rain of Arrows]] rồi đổi sang Lightning Arrow khi pierce đã có. Nguồn thứ ba nói cùng tác giả đó lên level bằng Rain of Arrows.

          Cả ba đều là cách làm thật và không cách nào sai. Chúng tôi theo guide leveling đi kèm của guide chính vì nó chi tiết nhất, nhưng bạn cứ dùng cái nào đang có trong ô gem của mình.
      - title: Ranger lấy từng gem ở đâu
        body: |
          Theo guide leveling Ranger đi kèm:

          - **Level 2**, sau Hillock: [[Galvanic Arrow]] và [[Momentum Support]].
          - **Level 4**, sau Hailrake: [[Mirage Archer Support]], [[Shrapnel Ballista]], [[Sniper's Mark]], [[Dash]].
          - **Level 8**, Lower Prison: [[Burning Arrow]], [[Manaforged Arrows Support]], [[Frostblink]].
          - **Level 10**, sau Brutus: [[Blink Arrow]].
          - **Level 12**, Cavern of Wrath sau Fairgraves: [[Lightning Arrow]].
          - **Level 16**, sau Fidelitas: [[Herald of Ice]]; [[Frenzy]] cắm vào Manaforged.
          - **Level 18**, sau Weaver: [[Trinity Support]] hoặc [[Elemental Damage with Attacks Support]] miễn phí, mua cái còn lại.
          - **Level 24**, sau Tolman: [[Anger]]; [[Grace]] miễn phí.
          - **Level 28**, sau Gravicius: [[Storm Rain]] miễn phí; [[Blast Rain]] và [[Artillery Ballista]] tùy chọn.
      - title: Bandit và mấy quyết định nhỏ
        body: |
          Giúp **Alira**. Planner nói vậy và mấy dòng elemental resistance làm campaign dễ hơn hẳn.

          Lấy Primal Spirit cho Strength. Mua ring hai đá sau level 20. Lên level 32 trước khi bước vào Kaom's Stronghold.
  - id: acts-4-10
    image: trinity-support
    title: Act 4–10
    levels: Level 33–68
    uses: >-
      Vẫn link [[Lightning Arrow]] đó cùng [[Trinity Support]] và
      [[Elemental Damage with Attacks Support]]. [[Anger]] và [[Grace]] làm aura
      từ Act 3.
    changes: >-
      Bạn ascend ba lần. Ở level 38 bạn nhận [[Returning Projectiles Support]] từ
      Lady Dialla và [[Tornado]] từ Oyun. Giữ accuracy cao hơn maximum life để
      [[Precise Technique]] còn chạy.
    links:
      - name: Main skill
        gems: [Lightning Arrow, Mirage Archer Support, Trinity Support, Elemental Damage with Attacks Support, Lesser Multiple Projectiles Support]
      - name: Single target
        gems: [Artillery Ballista, Focused Ballista Support, Elemental Damage with Attacks Support]
      - name: Tự động
        gems: [Storm Rain, Manaforged Arrows Support, Lifetap Support]
      - name: Aura
        gems: [Anger, Grace]
      - name: Mark và di chuyển
        gems: [Sniper's Mark, Dash, Frostblink]
    moveOn: "resistance về lại 75% sau Act 10 và bạn đã dùng xong ba điểm ascendancy."
    details:
      - title: Pantheon là một cuộc tranh cãi ba bên
        body: |
          Ba nguồn, ba câu trả lời, và chúng tôi không định giả vờ là có đồng thuận.

          - Guide: Brine King với cả ba nâng cấp, cộng Tukohama.
          - Tác giả được xem nhiều nhất: Brine King cho tới khi bạn miễn ailment, rồi Solaris hoặc Lunaris; minor thì Ralakesh hoặc Shakari.
          - Một guide thứ ba: Arakaali cộng Abberath.

          Brine King là lựa chọn an toàn cho campaign theo cả ba cách đọc. Đổi về sau khi bạn biết thứ gì đang giết mình.
      - title: Để ý cái luật accuracy
        body: |
          [[Precise Technique]] tắt ngay khoảnh khắc maximum life của bạn vượt accuracy. Đây là kiểu mất damage âm thầm phổ biến nhất trong build.

          Mỗi lần bạn đeo một cục life lớn, mở bảng nhân vật ra và kiểm cả hai con số.
      - title: Resistance
        body: |
          Sau boss Act 5 bạn mất 30% mọi elemental resistance, và mất thêm 30% nữa sau Act 10. Vá cả hai ở crafting bench trước khi đi tiếp.

          Build này không có phòng thủ dư nào để gánh phần resistance chưa cap.
  - id: early-maps
    image: elemental-hit-of-the-spectrum
    title: Map đầu
    levels: Map trắng và map vàng
    uses: >-
      **Đây là lúc bạn đổi khỏi Lightning Arrow.**
      [[Elemental Hit of the Spectrum]] trong một six-link, với
      [[Artillery Ballista]] làm single target và [[Anger]] cộng [[Grace]] làm
      aura.
    changes: >-
      Lo spell suppression hướng tới 100%, và lo resistance. Giữ accuracy trên
      3,300 và đừng tốn công đẩy quá tầm 4,500. Cây bow bạn đang để dành tiền
      chính là thứ kết thúc stage này.
    links:
