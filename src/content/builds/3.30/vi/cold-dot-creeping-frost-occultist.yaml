name: Cold Damage over Time Creeping Frost Occultist
tagline: >-
  Mấy vũng băng mục ruỗng quái trong lúc bạn bước đi, trên một nhân vật đẩy cold
  resistance của quái xuống sâu dưới số âm rồi nhân nó lên bằng một cái helmet
  trông như một nhược điểm.
class: Witch
ascendancy: Occultist
role: endgame
budget: high
budgetNote: >-
  **Con số "100 Divine" là một tiêu đề video và không là gì khác, còn mọi giá
  trên trang này thì thiếu chứ không phải cũ.** Trang build của chính tác giả
  không có mục currency, không có giá item và không có mức budget nào — chúng tôi
  đã kiểm cả ba trang 3.30 của anh ta. Chưa có kinh tế Covens of Umbra, và mấy
  trang kinh tế Allflame 3.29 của poe.ninja thì không render được với đọc tự
  động, nên chúng tôi không định giá được một món nào trong danh sách. Tệ hơn cho
  cái tiêu đề: nhân vật được công bố đeo một [[Kalandra's Touch]], món copy cái
  ring còn lại của bạn và trong quá khứ vẫn là món hàng trăm Divine. **Hoặc là
  con 100 Divine nói về một bản trước của nhân vật, hoặc là nó không tính cái
  ring. Chúng tôi không giải quyết được là cái nào, và chúng tôi sẽ không đoán.**
  Hãy coi `high` là khung của chúng tôi cho "vượt xa một starter, chưa tới một
  build Mageblood", không phải một con số được dẫn lại.
mainSkill: Creeping Frost of Floes
image: art-occultist
tags: [Spell, Cold damage over time, Energy shield, Chaos Inoculation, Curse]
ratings: { clear: 4, bossing: 4, survivability: 4, ease: 3 }
verified: "2026-11-13"
confidence: mixed
confidenceNote: >-
  **Skill thì đã được kiểm chứng, tác giả thì viết rất nhiều, và planner thì ghi
  3.29 ngay trên nhãn.** Con số của [[Creeping Frost of Floes]] đến từ PoEDB và
  chắc chắn: lần đổi gần nhất là 3.29.0 và 3.30 không nhắc tới nó. Build đến từ
  một tác giả, bLut, người đã công bố ba trang 3.30 riêng cho nó trong sáu ngày
  cộng một dòng 3.29 dài phía sau, nhiều tính liên tục hơn phần lớn build trên
  site này. **Nhưng planner đứng sau bài "100 Div Endgame" có tiêu đề "Level 100
  CI MoM Creeping Frost of Floes Occultist 3.29" và bộ configuration của nó đọc
  ra "None"** — không boss, không level quái, không curse hay shock nào được bật
  trong tab config. Planner "Zero to Endgame" của anh ta còn tệ hơn: nó báo 1,707
  life và 1,772 effective hit point ở level 100, nghĩa là không có gear nào được
  áp trong bộ đang bật, nên không con số nào đọc ra được từ đó cả. Bốn điểm số là
  của chúng tôi. Bản thân dòng cold damage over time thì đang sống độc lập trong
  3.30 — một tác giả thứ hai, rank1gear, đăng một bản Elementalist cùng tuần —
  nhưng chưa ai khác công bố bản Occultist này.
modes:
  ssf: >-
    Phần lõi thì ổn: [[Creeping Frost]] là quest reward Act 1,
    [[Creeping Frost of Floes]] ra từ Divine Font trong Labyrinth, và
    [[Eye of Malice]] là unique core-pool level 45. Còn cái trần thì không.
    [[Kalandra's Touch]], một [[Eye of Malice]] đã corrupt, gloves corrupt, một
    [[Empower Support]] level 4, một [[Elegant Hubris]] và hai large cluster
    jewel đều là đồ trade. **Không nguồn nào bàn về solo self-found.**
  hardcore: >-
    Không nguồn nào bàn tới. Hình dáng của nó thì hợp lý cho hardcore — energy
    shield, 78% spell block, 56% block, và không có chỗ nào tự gây damage lên
    mình — nhưng nhân vật được công bố có 2% physical damage reduction và cú
    physical hit lớn nhất chịu được là 15,600, đó mới là con số đáng lo.

idea: |
  [[Creeping Frost of Floes]] bắn ra một projectile, nó nổ thành một vũng băng trên mặt đất. Vũng đó chill, và nó gây cold damage over time cho bất cứ thứ gì đứng trong đó. Bạn rải vũng rồi đi; damage tự tới.

  Vì damage là một degeneration chứ không phải một hit, nó bỏ qua armour của quái hoàn toàn và nó tiếp tục chạy khi bạn đã ở chỗ khác. [[Vortex]] là nửa còn lại của cùng ý tưởng đó, cast tức thì ngay trên đầu boss.

  Thứ làm bản này đắt chứ không chỉ dễ chịu là một món đồ dùng ngược. [[Eye of Malice]] ghi "Nearby Enemies have 50% increased Fire and Cold Resistances", trông như một hình phạt rõ ràng. Nó không phải vậy, nếu cold resistance của quái vốn đã *âm*: tăng một số âm thêm 50% làm nó âm hơn. Nên build dồn cả ngân sách gear và gem để đẩy cold resistance của quái xuống — [[Frostbite]], [[Elemental Weakness]], [[Punishment]], Cold Exposure từ chính cái helmet — rồi cái helmet nhân cái hố nó vừa đào lên.

  [[Occultist]] cấp phần energy shield và curse effectiveness mà phần còn lại dựa vào, và nhân vật kết thúc ở [[Chaos Inoculation]]: một máu, miễn nhiễm chaos damage, mọi thứ nằm trong bể energy shield.

chain:
  - label: Rải vũng
    text: "[[Creeping Frost of Floes]] nổ khi va chạm thành một vùng chill. Tối đa 5 vùng tồn tại cùng lúc, mỗi vùng sống 5 giây gốc."
  - label: Mặt đất lo phần damage
    text: "Base cold damage mỗi giây là 3,035.2 ở gem level 20. Nó là một degeneration, nên armour của quái vô nghĩa và bạn không phải ở lại."
  - label: Vortex cho boss
    text: "[[Vortex]] cast tức thì ngay chỗ bạn đứng, với vùng chill riêng của nó. Nó là nửa single-target của cặp đôi."
  - label: Đào cái hố resistance
    text: "[[Frostbite]], [[Elemental Weakness]] và [[Punishment]] làm curse, cộng Cold Exposure từ [[Eye of Malice]], đẩy cold resistance của quái xuống sâu dưới số không."
  - label: Rồi nhân nó lên
    text: "[[Eye of Malice]] cho quái gần đó 50% increased fire và cold resistance. Áp lên một resistance âm thì nó làm tệ hơn, và đó mới là điểm chính."
  - label: Sống trong energy shield
    text: "[[Chaos Inoculation]], 8,200 energy shield, 78% spell block và 56% block. Một máu, không chaos damage, và [[Vaal Discipline]] để chữa cháy."

chainDetails:
  - title: Chiêu Eye of Malice, nói cho cẩn thận
    body: |
      [[Eye of Malice]] là một Callous Mask, level 45, và danh sách mod đầy đủ của nó từ PoEDB là:

      - (400–500)% increased Evasion and Energy Shield
      - +(20–40)% to Fire Resistance
      - +(20–40)% to Cold Resistance
      - 25% chance to inflict Cold Exposure on Hit
      - 25% chance to inflict Fire Exposure on Hit
      - Nearby Enemies have 50% increased Fire and Cold Resistances

      Cold Exposure áp −10% cold resistance trong 4 giây, theo đúng dòng nhắc trên chính món đồ.

      Dòng cuối là dòng làm việc. Mod "increased" scale cái giá trị nó áp vào, và resistance thì âm được. Đẩy một con quái xuống −60% cold resistance bằng curse với exposure, rồi tăng 50% lên giá trị đó, thì nó đi xuống tiếp chứ không quay lên.

      **Cách đọc đó là của chúng tôi, từ chữ trên món đồ.** Trang của tác giả không có giải thích viết nào cho bất cứ thứ gì, nên chúng tôi không gán lập luận đó cho anh ta được — chỉ gán được cho món đồ, thứ không có gì nhập nhằng, và cho ba cái curse với nguồn exposure mà anh ta ghép cùng nó, mấy thứ chỉ hợp lý khi đi chung. Nếu bạn chưa chắc, hãy kiểm resistance của quái khi có và khi không có cái helmet trên một con boss trước khi cam kết với nó: đó là một bài thử một phút và nó giải quyết xong câu hỏi.

      Cũng để ý xem cái helmet *không* làm gì ở đây: +20–40% fire với cold resistance của chính nó và 400–500% increased evasion and energy shield của nó là thật, và trên một nhân vật energy shield thì cái cuối mới là phần lớn lý do cái helmet này đeo được mà không xót.
  - title: Con số tiêu đề của planner không phải damage của skill
    body: |
      Chuyện này làm người ta hiểu sai và đáng nói cho chính xác.

      pobb.in để tiêu đề cho file là **Total DPS 31,441,178**. Cùng file đó, khi tách ra, báo [[Creeping Frost of Floes]] ở **5.9 triệu total damage mỗi giây** — 226,000 của hit damage và 5.7 triệu của damage over time, ở 2.42 cast mỗi giây, 3.6% critical strike chance và 150% critical multiplier.

      Con 31.4 triệu là **Full DPS** của Path of Building: mọi thứ gây damage mà nhân vật đang chạy, cộng lại hết. Trên nhân vật này thì nó bao gồm [[Vortex]], [[Vaal Cold Snap]], curse [[Punishment]] và một [[Aspect of the Spider]] do boots cho, thứ mà trang liệt kê riêng ở 93,700 mỗi hit.

      Cả hai con số đều đúng và chúng trả lời hai câu hỏi khác nhau. Nếu bạn muốn biết "một con boss chết nhanh cỡ nào", con số trung thực nằm đâu đó giữa 5.9 triệu mà main skill báo và 31.4 triệu tổng, vì vài trong số các nguồn đó thật sự áp lên một mục tiêu đơn lẻ và vài cái thì không.

      **Và bộ configuration đọc ra "None".** Không loại boss, không level quái, không Wither, không áp curse và không shock nào được bật trong tab config, mà với một build có tiền đề là giảm resistance của quái thì đó là một chỗ thiếu đáng kể theo cả hai hướng: mấy cái curse có cắm nên một phần hiệu ứng của chúng được tính, nhưng cũng không có penalty curse effectiveness của boss nào được áp.
  - title: Ba planner, ba nhân vật khác nhau
    body: |
      Tác giả công bố ba trang 3.30 trong sáu ngày và chúng không mô tả cùng một nhân vật. Trình bày thẳng ra, vì khác biệt khá lớn:

      **"100 Div Endgame Build"**, 8 tháng 11, pobb.in/70BTtuQwEnxu, tiêu đề "Level 100 CI MoM Creeping Frost of Floes Occultist 3.29". Level 100, 8,200 energy shield, **121,393 effective hit point**, resistance 76/76/77 và −26 chaos, 56% block và 78% spell block, 2,504 evasion, 2% physical damage reduction, 100 energy shield hồi mỗi giây. Cú hit lớn nhất chịu được 15,600 physical và khoảng 51,000 mỗi element. Main skill 5.9 triệu, full 31.4 triệu.

      **"CI Swap Guide"**, 13 tháng 11. Level 94, 6,129 energy shield, **82,806 effective hit point**, resistance 75/75/76 và −60 chaos, 57% block và 78% spell block. [[Vortex]] là main skill được liệt kê, ở 2.5 triệu total và 12.1 triệu full. Keystone [[Chaos Inoculation]], [[Bitter Frost]] và [[Wicked Ward]].

      **"From Zero to Endgame"**, 12 tháng 11, pobb.in/tZctFTpeCShp. Level 100 và nó báo 1,707 life, 105 energy shield và **1,772 effective hit point** với resistance âm toàn bộ. Đó là một file không có gear nào được áp trong bộ đang bật. **Không con số nào lấy được từ nó.**

      Nên cái guide "zero to endgame" — cái nghe có ích nhất — lại là cái có planner rỗng, còn lời khẳng định 100 Divine thì thuộc về một file vốn đã ở trên Chaos Inoculation, trong khi một trang riêng, ra sau, lại mang tiêu đề là guide chuyển sang Chaos Inoculation. Chúng tôi không dung hòa được chuyện đó, và chúng tôi gắn cờ nó chứ không xoa cho phẳng.
  - title: Cái gem thật sự làm gì, với mấy con số 3.29 vẫn còn đúng
    body: |
      [[Creeping Frost of Floes]] ở gem level 20, từ PoEDB:

      - 248 tới 372 cold damage mỗi hit, và **3,035.2 base cold damage mỗi giây** cho vùng chill
      - 65% effectiveness of added damage
      - 7.50% critical strike chance
      - 0.60 giây cast time
      - Tối đa **5** vùng chill cùng lúc, mỗi vùng duration gốc 5 giây
      - Vùng chill có 100% increased movement speed ở gem level 20

      Nó được đổi lần cuối trong **3.29.0**, và thay đổi đó đáng biết vì nó mới đủ để guide cũ ghi sai: critical strike chance đi từ 6% lên 7.5%, effectiveness of added damage ở level 20 tụt từ 80% xuống 65%, base cold damage mỗi giây lên từ 2,669.1 thành 3,035.2, và damage mỗi hit giảm từ 395–592 xuống 248–372.

      Đọc chung lại, 3.29 đẩy skill đi xa hơn về phía một degeneration thuần: ít hit hơn, nhiều damage mặt đất hơn. Đó là lý do bản hiện tại ghép nó với [[Hypothermia Support]] và [[Controlled Destruction Support]] thay vì scale crit, và là lý do con 3.6% critical strike chance trong planner không phải một lỗi.

      **Không có thay đổi nào ở 3.30.** Bản transfigured mới là bản bạn muốn, không phải [[Creeping Frost]] gốc: ít vũng hơn nhưng to hơn và đánh mạnh hơn.
  - title: Vì sao đây là một hình dáng khác với các build endgame còn lại ở đây
    body: |
      Nói có chủ đích, vì bốn bài endgame khác của site là một Slayer tầm Mageblood, một Deadeye bow, một strength stacker và một life stacker, và cả bốn đều là nhân vật dựa vào hit, muốn một con số khổng lồ duy nhất.

      Cái này không phải vậy. Damage là một degeneration, nghĩa là:

      - **Armour của quái không làm gì cả.** Physical damage reduction cũng vậy.
      - **Bạn không cần phải ở đó.** Rải vũng, đi, để chúng kết liễu. Đó là lý do điểm clear cao bằng điểm bossing.
      - **Accuracy và critical strike gần như vô nghĩa.** 3.6% critical strike chance trên nhân vật được công bố.
      - **Chỉ số để scale là resistance của quái, không phải damage của bạn.** Và đó là lý do một cái helmet đáng hơn một lần nâng cấp vũ khí.

      Chi phí cũng khác. Không có lần mua 200 Divine duy nhất nào biến đổi nó. Phần đắt là một cái helmet corrupt, gloves corrupt, một [[Empower Support]] level 4, hai large cluster jewel, một [[Elegant Hubris]] và — trong file được công bố — một [[Kalandra's Touch]]. Nó là build bạn lắp dần chứ không phải build bạn mua một món là xong.
  - title: Ba cái Pact, và một thay đổi 3.30 âm thầm giúp bạn
    body: |
      Nhân vật được công bố chạy [[Pact of Lycia]], [[Pact of K'Tash]] và [[Pact of Ghorr]] cùng lúc. Tác giả không công bố giải thích nào, nên chúng tôi sẽ không bịa ra, ngoài điều hiển nhiên: ba buff Pact thay vì một.

      Dòng 3.30 liên quan thì nhỏ và thật. "K'Tash's, Ghorr's and Beidat's Magnificence and Blood Shrine buffs are now retained when transitioning between areas." Hai trong ba buff mà nhân vật này duy trì giờ sống qua được một cái portal. Trên một build vốn phải áp lại ba Pact và ba curse mỗi lần vào map, đó là một cái lợi về trải nghiệm thật sự.

      Pact duy nhất bị đổi về số trong patch này là [[Pact of Beidat]], mà build này không dùng.

mandatory:
  - term: Creeping Frost of Floes
    why: >-
      Main skill. Một [[Creeping Frost]] transfigured, đổi nhiều vũng nhỏ thành
      tối đa 5 vũng to hơn và đánh mạnh hơn.
    detail: >-
      [[Creeping Frost]] gốc là quest reward Act 1 từ The Siren's Cadence ở level
      12, cho Scion, Shadow, Templar và Witch. Bản transfigured ra từ Divine Font
      ở cuối một lượt Labyrinth, hoặc từ trade. Gem level quan trọng hơn gần như
      mọi thứ khác ở đây, và đó là lý do file được công bố chạy nó ở 21/20 với
      một [[Empower Support]] level 4.
  - term: Vortex
    why: >-
      Nửa single-target. Cast tức thì ngay chỗ bạn đứng, với vùng chill riêng,
      nên bạn giữ được nó trên boss trong lúc di chuyển.
    detail: >-
      File CI Swap liệt kê Vortex chứ không phải Creeping Frost làm main skill,
      ở 2.5 triệu total damage mỗi giây. Hai file không đồng ý với nhau về skill
      nào là skill chính, và tác giả không nói.
  - term: Eye of Malice
    why: >-
      Món đồ mà build thật sự nói về. Dòng "Nearby Enemies have 50% increased
      Fire and Cold Resistances" của nó nhân một cold resistance vốn đã âm, và nó
      còn cấp 25% chance to inflict Cold Exposure cùng 400–500% increased evasion
      and energy shield.
    detail: >-
      Bản được công bố là bản **corrupt**. Một Callous Mask, level 45, và là
      unique core-pool từ 3.14.0, nên nó rơi bình thường. Lịch sử phiên bản của
      nó không có gì ở 3.29 hay 3.30.
  - term: Frostbite
    why: >-
      Hạ cold resistance. Cái đầu tiên và lớn nhất trong ba curse làm cái helmet
      đáng đeo.
  - term: Elemental Weakness
    why: >-
      Hạ cả ba elemental resistance, cộng dồn với Frostbite trên trục cold.
  - term: Chaos Inoculation
    why: >-
      Maximum life thành 1 và bạn miễn nhiễm chaos damage. Đó là lý do con −26%
      hay −60% chaos resistance của nhân vật được công bố không quan trọng, và là
      lý do mọi thứ sống trong bể energy shield.
  - term: Hypothermia Support
    why: >-
      More cold damage over time lên quái đang bị chill. Mấy vùng chill của chính
      bạn bảo đảm điều kiện đó, nên nó gần như là một multiplier miễn phí. Nó nằm
      trong cả hai main link của tác giả.
  - term: Controlled Destruction Support
    why: >-
      More spell damage, trả bằng critical strike chance, thứ build này không
      dùng. Có trong cả hai main link.
  - term: Empower Support
    why: >-
      Ở level 4 trong file được công bố. Trên một degeneration có damage ghi trên
      gem, gem level là lần mua damage hiệu quả nhất.
  - term: Inspiration Support
    why: >-
      Giảm mana cost và thêm elemental damage. Có trong cả hai link, và build chỉ
      có 989 mana trong khi [[Mind Over Matter]] thì rút damage ra từ đó.
  - term: Punishment
    level: recommended
    why: >-
      Curse thứ ba. Path of Building tính nó vào con số Full DPS, và đó là một
      phần lý do con số đó lớn hơn hẳn con số của main skill.
  - term: Vaal Discipline
    level: recommended
    why: >-
      Energy shield tức thì và một khoảng miễn nhiễm việc energy shield bị ngắt.
      Trên một nhân vật Chaos Inoculation thì đây là nút chữa cháy.
  - term: Pact of Lycia
    level: recommended
    why: >-
      Một trong ba buff Pact mà nhân vật được công bố chạy. Tác giả không đưa lý
      do nào, và chúng tôi không bịa ra.
  - term: Pact of K'Tash
    level: recommended
    why: >-
      Pact thứ hai. Buff của nó giờ sống qua các khu vực từ 3.30, khiến việc mang
      ba cái đỡ nhọc hơn trước.
  - term: Pact of Ghorr
    level: recommended
    why: >-
      Pact thứ ba, và là cái còn lại có buff sống qua được một cái portal.
  - term: Wicked Ward
    level: recommended
    why: >-
      Keystone được allocate trong file CI Swap. Energy shield recharge không bị
      damage ngắt, và đó là câu trả lời dựa trên recharge cho damage lẻ.
  - term: Bitter Frost
    level: recommended
    why: >-
      Được allocate trong file CI Swap cùng với Chaos Inoculation và Wicked Ward.
      **Câu chữ của notable này chưa được kiểm chứng**, nên mục này ghi lại việc
      anh ta có lấy nó, không ghi nó làm gì.
  - term: Kalandra's Touch
    level: recommended
    why: >-
      Trong file endgame được công bố: nó soi gương cái ring còn lại của bạn. Nó
      cũng là món làm cái tiêu đề "100 Divine" khó tin. Mua cuối cùng, hoặc đừng
      mua.
  - term: Elegant Hubris
    level: recommended
    why: >-
      Một timeless jewel trong file được công bố. Seed nào và nó chuyển notable
      nào thì **không được công bố**, mà chi tiết đó chính là toàn bộ giá trị của
      một timeless jewel, nên hãy coi đây là một dòng chưa giải quyết trên danh
      sách đi chợ.
  - term: Aspect of the Spider
    level: recommended
    why: >-
      Do boots cho trong file được công bố, ở level 30. Nó làm chậm và hinder, và
      nó là một trong các nguồn damage làm phồng con số Full DPS.

stages:
  - id: transition-in
    image: frostbite
    title: Bước vào
    levels: Từ bất kỳ nhân vật cold hay spell nào
    uses: >-
      [[Creeping Frost of Floes]] và [[Vortex]] với
      [[Controlled Destruction Support]], [[Hypothermia Support]] và
      [[Inspiration Support]], [[Frostbite]] với [[Elemental Weakness]] làm
      curse, và một [[Eye of Malice]] sớm nhất có thể, từ level 45.
    changes: >-
      Cái helmet là bước damage lớn rẻ nhất và nó là unique core-pool phổ biến,
      nên nó tới trước. Mọi thứ khác ở giai đoạn này là đồ rare có energy shield
      với resistance.
    links:
      - name: Main skill
        gems: [Creeping Frost of Floes, Inspiration Support, Controlled Destruction Support, Hypothermia Support]
      - name: Single target
        gems: [Vortex, Inspiration Support, Controlled Destruction Support, Elemental Focus Support, Hypothermia Support]
      - name: Curse
        gems: [Frostbite, Elemental Weakness, Punishment]
      - name: Di chuyển và utility
        gems: [Frostblink, Shield Charge, Faster Attacks Support, Automation]
    moveOn: >-
      cái helmet đã lên người, ba curse đều dính, và bể energy shield của bạn đã
      đủ lớn để [[Chaos Inoculation]] sống được.
    details:
      - title: Không có lộ trình leveling hay Labyrinth nào được công bố
        body: |
          Nói ngay đầu stage để nó không bị chôn ở dưới. Ba trang 3.30 của tác giả không có một chữ viết nào — không mục leveling, không thứ tự ascendancy, không bandit, không Pantheon. Bài "League Start Build Guide" 3.29 của anh ta thì có tồn tại và có 11,700 view, nhưng nó là một video và trang cũng không có nội dung viết.

          Nên trang này không có bảng Labyrinth. Chúng tôi không biết anh ta lấy notable [[Occultist]] nào trước, và chúng tôi sẽ không khẳng định một cái nào.
      - title: Vì sao Chaos Inoculation chứ không phải một build life
        body: |
          [[Chaos Inoculation]] đặt maximum life thành 1 và làm bạn miễn nhiễm chaos damage. File endgame được công bố nằm ở −26% chaos resistance còn file CI Swap ở −60%, và cả hai đều không quan trọng, vì chaos damage không chạm tới bạn được.

          Điều đó giải phóng từng điểm resistance và từng slot gear cho energy shield, thứ mà [[Eye of Malice]] rồi nhân lên 400–500%. Nó là một gói đồng bộ chứ không phải hai lựa chọn riêng lẻ.

          Cái giá: không life flask nào còn tác dụng, và một cú physical hit đơn lẻ là thứ giết bạn. Cú physical hit lớn nhất nhân vật được công bố chịu được là 15,600, so với khoảng 51,000 cho mỗi element, với 2% physical damage reduction. **Sự lệch đó là nhược điểm thật của build và không nguồn nào nhắc tới.**
      - title: Dòng cold damage over time đang đứng ở đâu trong 3.30
        body: |
          Thay đổi balance liên quan duy nhất của league này là một đợt nerf vào một skill cold *khác*. [[Winter Orb]] mất projectile thứ ba, 15% base damage và 10 điểm added damage effectiveness — khoảng 40% damage của nó ở gem level 20 — và nó là một trong những spell được chơi nhiều nhất ở 3.29.

          Mục changelog của chính chúng tôi cho đợt nerf đó nói, đúng bằng nhiều chữ như vậy, rằng nếu bạn muốn một spell cold để khởi đầu league thì nên nhìn sang cold damage over time. Nên dòng build này không chỉ không bị ảnh hưởng, nó là người được lợi được nêu tên.

          Độc lập với đó, một tác giả thứ hai, rank1gear, đăng một guide cold damage over time Elementalist cho 3.30 cùng tuần, và guide Spellslinger Cold DoT Elementalist 3.29 của jungroan — 170,000 view — là tài liệu lớn nhất gần đây của dòng này. Không cái nào trong số đó là build này, nhưng chung lại chúng nói rằng cái động cơ này chạy được.
  - id: midgame
    image: empower
    title: Gem level và dàn curse
    levels: Trước mấy món corrupt
    uses: >-
      Vẫn mấy link đó, thêm [[Empower Support]], một sceptre hoặc wand có cold
      damage-over-time multiplier, spell damage và cast speed, cùng ba cái Pact.
    changes: >-
      Đây là lúc damage thật sự tới. Damage của skill ghi trên gem, nên gem level
      và cold damage-over-time multiplier đáng hơn mọi thứ khác bạn mua được.
    links:
      - name: Main skill
        gems: [Creeping Frost of Floes, Inspiration Support, Controlled Destruction Support, Hypothermia Support, Empower Support]
      - name: Single target
        gems: [Vortex, Inspiration Support, Controlled Destruction Support, Elemental Focus Support, Hypothermia Support]
      - name: Pact
        gems: [Pact of Lycia, Pact of K'Tash, Pact of Ghorr]
      - name: Aura và phòng thủ
        gems: [Malevolence, Vaal Discipline, Tempest Shield, Immortal Call, Automation]
      - name: Burst
        gems: [Vaal Cold Snap, Efficacy Support, More Duration Support]
    moveOn: >-
      [[Empower Support]] đã ở level 4, gem chính của bạn đã ở 21, và ba curse
      cộng Cold Exposure đều dính lên boss.
    details:
      - title: Vì sao Empower ở đây không phải tùy chọn
        body: |
          Một degeneration có base damage in trên gem thì scale gần như tuyến tính theo gem level, và không gì khác trên gear của bạn nhân được sạch sẽ như vậy. File được công bố chạy main skill ở 21/20 với một [[Empower Support]] level 4 trong link.

          Đây là cùng một logic với cây bow +3 trên trang Toxic Rain của site này, áp lên một spell: mua gem level trước khi mua bất cứ thứ gì khác.
      - title: Vũ khí là một cái cọc chỉ số, và chúng tôi không nói được mod của nó
        body: |
          Vũ khí trong file được công bố là một sceptre Tyrant's Sekhem rare, liệt kê với spell damage, cast speed và cold damage over time. Off-hand là một Vaal Spirit Shield rare. File CI Swap thì dùng một Opal Wand Foulborn.

          **Tier chính xác của các mod không được công bố trên trang**, và hai trong ba file của anh ta dùng loại vũ khí khác nhau, nên không có một món mục tiêu duy nhất để craft tới. Cái slot đó để làm gì thì khá rõ: cold damage-over-time multiplier trước, rồi spell damage, rồi cast speed.

          Nếu bạn tự craft, để ý rằng 3.30 đã đổi chi phí meta-craft — bảo vệ một prefix hay một suffix giờ rẻ hơn, 1 tới 2 Divine, còn bảo vệ tất cả thì tốn 4 Divine cộng một loại currency thứ hai, và game tự chọn mod nào được bảo vệ một cách ngẫu nhiên mà không cho bạn biết.
      - title: Đọc dàn curse như một hệ thống
        body: |
          [[Frostbite]] và [[Elemental Weakness]] đều giảm cold resistance, Cold Exposure từ [[Eye of Malice]] áp thêm −10% trong 4 giây, và [[Punishment]] là curse thứ ba tự gây damage riêng.

          Hai điều suy ra từ đó. Thứ nhất, **curse effect và curse effectiveness trên gear của bạn là mod damage cho build này**, không phải tiện nghi. Thứ hai, một con boss có curse resistance cao hoặc một mod map giảm curse effect là một lần mất damage thật sự chứ không phải một chuyện khó chịu.

          Không nguồn nào nêu hai điểm này. Cả hai suy ra từ danh sách item và gem.
  - id: endgame
    image: kalandras-touch
    title: Bản endgame được công bố
    levels: File "100 Divine"
    uses: >-
      Một [[Eye of Malice]] corrupt, gloves corrupt, một [[Empower Support]]
      level 4, một [[Elegant Hubris]], hai large cluster jewel, boots cho
      [[Aspect of the Spider]], và một [[Kalandra's Touch]] ở một slot ring.
    changes: >-
      File báo 5.9 triệu cho main skill và 31.4 triệu Full DPS ở level 100, với
      8,200 energy shield và 121,393 effective hit point. **Đó là những con số
      trên engine 3.29 với bộ configuration để ở "None".**
    links:
      - name: Main skill
        gems: [Creeping Frost of Floes, Inspiration Support, Controlled Destruction Support, Hypothermia Support, Empower Support]
      - name: Single target
        gems: [Vortex, Inspiration Support, Controlled Destruction Support, Elemental Focus Support, Hypothermia Support]
      - name: Pact
        gems: [Pact of Lycia, Pact of K'Tash, Pact of Ghorr]
      - name: Curse và aura
        gems: [Malevolence, Punishment, Elemental Weakness, Frostbite]
      - name: Phòng thủ và di chuyển
        gems: [Tempest Shield, Vaal Discipline, Immortal Call, Frostblink, Shield Charge, Automation]
    moveOn: >-
      bạn đang mua implicit corrupt và roll cluster jewel chứ không còn mua món
      nguyên. Tác giả không công bố gì xa hơn file này.
    details:
      - title: Danh sách gear đầy đủ, đúng như được công bố
        body: |
          Vũ khí một Tyrant's Sekhem rare với Shield Charge, Faster Attacks và Elemental Weakness cắm trong đó; off-hand một Vaal Spirit Shield rare; helmet một [[Eye of Malice]] **corrupt**; body armour một Twilight Regalia rare; gloves Bronzescale Gauntlets **corrupt**; boots Warlock Boots rare cho [[Aspect of the Spider]] ở level 30; amulet một Jade Amulet rare; ring [[Kalandra's Touch]] và một Cogwork Ring fracture; belt một Cloth Belt rare.

          Flask: một Quartz cùng hai Quicksilver và hai Silver, tất cả đều magic. Jewel: năm viên Cobalt, một timeless jewel [[Elegant Hubris]], và hai [[Large Cluster Jewel]].

          Để ý cái gì vắng mặt: không [[Mageblood]], không [[Headhunter]], không [[Progenesis]], không [[Watcher's Eye]], không cặp Forbidden, không awakened gem. Với một build endgame thì đó là một danh sách lạ — tiền nằm ở mấy lần corrupt và cluster jewel chứ không nằm ở unique có tên.
      - title: Mấy lần corrupt để làm gì, và chúng tôi không biết gì
        body: |
          Hai món trong file là đồ corrupt: helmet và gloves. **Trang không hiện implicit corrupt là gì.** Trên một [[Eye of Malice]] thì mục tiêu hiển nhiên là thêm một level cho socketed gem hoặc tăng hiệu ứng của chính mấy dòng trên helmet; trên gloves thì là cold damage hoặc curse effect.

          Chúng tôi liệt kê chỗ này như một chỗ trống chứ không lấp nó. Một implicit corrupt mà bạn không gọi được tên thì không phải một chỉ dẫn đi chợ.
      - title: Mod map cần cẩn thận
        body: |
          **Không nguồn nào nêu cái nào**, nên đây là suy luận từ cấu trúc của build và nên được coi là một câu hỏi cần thử chứ không phải một kết luận:

          - **Reduced effect of curses on monsters.** Ba cái curse và cả cái tương tác Eye of Malice đều phụ thuộc vào việc resistance của quái đang âm.
          - **Monsters have increased elemental resistance.** Cùng lý do, từ hướng ngược lại.
          - **Less recovery hoặc no regeneration.** Nhân vật được công bố hồi 100 energy shield mỗi giây và dựa vào [[Vaal Discipline]]; một bể dựa trên recharge thì rất ngán damage lẻ.
          - **Physical damage nặng.** 2% physical damage reduction và một cú physical hit tối đa 15,600 trên một nhân vật 121,393 effective hit point là con số lệch duy nhất trong file.

          Tác giả không link chiến lược map nào cả, nên cũng không có gì trong số này bị phản bác.
  - id: ci-swap
    image: chaos-inoculation
    title: Lần chuyển sang Chaos Inoculation
    levels: Trang mới nhất của anh ta, và cũng là trang khó hiểu nhất
    uses: >-
      [[Chaos Inoculation]], [[Wicked Ward]] và [[Bitter Frost]], với [[Vortex]]
      được liệt kê làm main skill và một Opal Wand Foulborn thay cho cây sceptre.
    changes: >-
      Level 94, 6,129 energy shield, 82,806 effective hit point, 2.5 triệu trên
      Vortex và 12.1 triệu Full DPS. **Thấp hơn trên mọi trục so với file "100
      Div", mà file đó thì đã ở trên Chaos Inoculation rồi.**
    moveOn: >-
      không đi đâu cả, theo nghĩa là chúng tôi không nói được stage này để làm gì.
      Hãy đọc phần chi tiết bên dưới trước khi theo nó.
    details:
      - title: Vì sao chúng tôi để nó cuối và gắn cờ nó
        body: |
          Trang có tiêu đề "Cold DoT Build CI Swap Guide", đăng 13 tháng 11, và có 58 view khi chúng tôi đọc. Planner của nó ở level 94 với ít energy shield hơn, ít effective hit point hơn và ít damage hơn file "100 Div Endgame" ngày 8 tháng 11 — mà bản thân file đó lại có tiêu đề "Level 100 CI MoM Creeping Frost of Floes Occultist".

          Nên hoặc là file ra trước được dựng trước cả cái guide giải thích cách tới đó, hoặc hai cái là hai nhân vật khác nhau ở hai thời điểm khác nhau, hoặc một trong hai tiêu đề là sai. **Mấy trang đó không có chữ viết nào, nên không có gì để giải quyết chuyện này.**

          Thứ chúng tôi rút ra: Chaos Inoculation là nơi build này kết thúc, lần chuyển đó là một bước có chủ đích mà tác giả cho là đáng một video riêng, và mấy con số thấp hơn có lẽ là một ảnh chụp giữa lúc đang chuyển chứ không phải một bước lùi. **Câu cuối đó là một phỏng đoán và được ghi rõ là như vậy.**
      - title: Một thứ cụ thể mà nó thêm vào
        body: |
          Ba keystone, có tên: [[Chaos Inoculation]], [[Wicked Ward]] và [[Bitter Frost]]. Danh sách keystone của file endgame không được công bố, nên đây là chỗ duy nhất mà gói keystone phòng thủ xuất hiện, dù chỉ một lần.

          [[Wicked Ward]] làm energy shield recharge không bị ngắt là bạn đồng hành hiển nhiên của Chaos Inoculation trên một nhân vật không có máu để hồi. Chúng tôi không kiểm chứng được câu chữ của [[Bitter Frost]], nên chúng tôi ghi lại rằng anh ta có lấy nó và không gì hơn.

powerCurve: |
  Có ba thứ nhân damage của build này lên, và không cái nào là con số mà một build hit hay đuổi theo. **Gem level** của [[Creeping Frost of Floes]], vì damage in ngay trên gem. **Cold damage-over-time multiplier**, phần lớn từ vũ khí. Và **cold resistance của quái**, thứ mà ba curse cộng Cold Exposure đẩy xuống dưới số không rồi [[Eye of Malice]] làm nó âm thêm. Critical strike và accuracy không làm gì cả.

  Chúng tới theo thứ tự giá, không phải theo độ lớn. Cái helmet đeo được từ level 45 và là unique phổ biến, nên trục resistance mở trước — nhưng, theo cách chúng tôi đọc món đồ, chỉ khi mấy cái curse đã dính, vì dòng của nó nhân một cái hố phải có sẵn. Gem level là đoạn giữa: [[Empower Support]] ở level 4 và gem chính ở 21 là chỗ mà bài viết nói damage thật sự tới. Về cuối thì không còn lần mua đơn lẻ nào nữa, chỉ còn implicit corrupt, roll cluster jewel và một [[Elegant Hubris]] có seed không ai công bố. Nên build này không bao giờ có cú nhảy lớn duy nhất như mấy build endgame khác ở đây. Nó được lắp dần.

  Phòng thủ là một cái bể duy nhất. Energy shield, được chính dòng 400–500% của cái helmet nuôi, rồi block với spell block, rồi [[Chaos Inoculation]], thứ gạch chaos damage khỏi danh sách vấn đề và gạch luôn máu khỏi danh sách tài nguyên. File level 100 được công bố — một planner 3.29 — lên tới 8,200 energy shield và 78% spell block mà vẫn hiện 2% physical damage reduction và một cú physical hit tối đa 15,600, so với khoảng 51,000 cho mỗi element. Đó là số của lúc build đã xong, nên cái lỗ đó vẫn còn mở khi mọi thứ khác đã hoàn chỉnh. Nhận xét đó là của chúng tôi, từ planner; tác giả không nói gì về nó.

upgrades:
  - step: >-
      [[Eye of Malice]], bản chưa corrupt
    why: >-
      Bài viết gọi nó là bước damage lớn rẻ nhất: một unique core-pool phổ
      biến đeo được từ level 45. Dòng 400–500% increased evasion and energy
      shield của nó khiến nó đồng thời là một món phòng thủ, điều mà không
      bước nào về sau nói được.
  - step: >-
      Cả ba curse đều dính, và curse effect ở bất cứ chỗ nào gear có
    why: >-
      [[Frostbite]], [[Elemental Weakness]] và [[Punishment]] đào cái hố mà
      cái helmet nhân lên. Nó đứng thứ hai chỉ vì mấy viên gem gần như không
      tốn gì; trên thực tế nó lên người cùng lúc với cái helmet, vì theo cách
      chúng tôi đọc thì dòng của helmet là một hình phạt cho tới khi
      resistance âm. Chuyện curse effect là một chỉ số damage ở đây là suy
      luận của chính bài viết, từ danh sách gem và item.
  - step: >-
      Energy shield trên mọi slot rare, cho tới khi [[Chaos Inoculation]] sống được
    why: >-
      Stage đầu tiên kết thúc ở đây, trước mọi khoản damage đắt tiền, và nó
      không mua thêm chút damage nào. Nó tới sớm vậy vì mọi thứ sau nó đều giả
      định là nhân vật còn sống khi đứng cạnh boss. Không nguồn nào cho con số
      energy shield mà ở đó lần chuyển là an toàn, nên chúng tôi cũng không
      cho.
  - step: >-
      [[Empower Support]] lên level 4, và gem chính lên 21/20
    why: >-
      Bước đầu tiên tốn currency thật. Một degeneration có base damage in trên
      gem thì scale gần như tuyến tính theo gem level, và quy tắc của bài viết
      là mua gem level trước mọi thứ khác bạn phải trả tiền. Cái helmet chỉ đi
      trước nó vì helmet rẻ.
  - step: >-
      Một sceptre hoặc wand có cold damage-over-time multiplier, rồi spell damage, rồi cast speed
    why: >-
      Thứ tự ưu tiên đó là của bài viết. Nó nằm dưới gem level vì tier của mod
      chưa bao giờ được công bố và hai file của tác giả dùng hai loại vũ khí
      khác nhau, nên không có một món duy nhất để nhắm tới — bạn đang mua một
      chỉ số, mà một chỉ số thì dễ bị mua hớ hơn một gem level. Vế cuối đó là
      đánh giá của chúng tôi.
  - step: >-
      Một [[Eye of Malice]] corrupt, gloves corrupt, hai [[Large Cluster Jewel]] và một [[Elegant Hubris]]
    why: >-
      Bản endgame được công bố. Nó nằm muộn vì một lý do khó chịu: trang không
      hiện implicit corrupt lẫn seed của viên jewel, nên không ai nói được bạn
      nên mua bản nào. Mấy món này thêm được gì thì cũng là thêm lên trên những
      bước đã biết rõ hoàn toàn.
  - step: >-
      [[Kalandra's Touch]]
    why: >-
      Phán quyết của bài viết là mua cuối cùng, hoặc đừng mua. Nó soi gương cái
      ring còn lại của bạn, nên — theo cách chúng tôi đọc — nó đáng đúng bằng
      cái ring kia, và cái ring kia phải tới trước.

play:
  mapping: |
    **Tác giả không công bố chữ viết nào và không có chiến lược map nào.** Phần dưới đây là mô tả skill của bài viết, xếp theo thứ tự bạn sẽ bấm. Nó không phải rotation của anh ta.

    Ném [[Creeping Frost of Floes]] vào một pack rồi cứ đi tiếp. Vũng băng chill và tự gây damage; bạn không phải chờ nó. Tối đa năm vũng tồn tại cùng lúc và mỗi vũng sống năm giây gốc, nên lúc di chuyển là bạn đang rải chúng phía trước mình, xen [[Frostblink]] với [[Shield Charge]] ở giữa.

    Khi vào map, áp lại bất cứ thứ gì không sống qua cái portal. Từ 3.30 thì buff của [[Pact of K'Tash]] và [[Pact of Ghorr]] sống qua được; [[Pact of Lycia]] không nằm trong danh sách đó. Bài viết tính cả ba curse vào những thứ phải áp lại. Mấy file không nói anh ta áp chúng bằng cách nào và chúng tôi sẽ không đoán một cách — chỉ cần kiểm là cả ba đều đang nằm trên thứ bạn đang giết.

    [[Vaal Discipline]] là nút chữa cháy. Bấm nó lúc energy shield đang tụt, không phải sau khi đã hết.
  bossing: |
    Vào gần và ở gần. Hai dòng trên cái helmet chỉ chạy theo kiểu đó: "Nearby Enemies" cho phần nhân resistance, và Cold Exposure, thứ là 25% chance on hit. Cả hai đều suy ra từ chữ trên món đồ. Không nguồn nào mô tả một trận boss.

    Giữ [[Vortex]] trên boss — nó cast tức thì ngay chỗ bạn đứng, nên không tốn nhịp di chuyển nào — và giữ vũng dưới chân nó bằng [[Creeping Frost of Floes]]. Hai file được công bố không đồng ý với nhau về cái nào trong hai là main skill, nên dùng cả hai. [[Vaal Cold Snap]] là link burst khi nó đã nạp xong.

    Thứ bạn thật sự đang duy trì là cái hố resistance: ba curse và exposure. Nếu một con boss chết chậm hơn lẽ ra phải vậy, kiểm cái đó trước, trước cả gear.

    Và nhớ con số lệch kia. Cạnh boss là chỗ có physical hit, mà theo chính số của planner thì nhân vật này chịu một cú hit element tốt hơn một cú physical khoảng ba lần. Mấy cú slam thì né bằng tay.

deaths:
  - situation: >-
      Một cú physical hit lớn, thường là khi đứng cạnh boss
    cause: >-
      File level 100 được công bố, một planner 3.29, có 2% physical damage
      reduction và cú physical hit tối đa 15,600, so với khoảng 51,000 cho mỗi
      element. Trên [[Chaos Inoculation]] thì không có máu nào nằm sau lớp
      shield. Mà cái helmet lại muốn bạn đứng gần quái, đúng chỗ mấy cú đó rơi
      xuống — mối nối cuối đó là cách chúng tôi đọc; không nguồn nào nhắc tới
      nhược điểm này cả.
    fix: >-
      Không nguồn nào đưa ra cách chữa và không file được công bố nào lấp cái
      lỗ đó. Thứ suy ra từ con số: bỏ qua hoặc thử cẩn thận các mod map
      physical nặng, và né slam thay vì tin vào block. [[Immortal Call]] có
      nằm trong link phòng thủ được công bố; trang không cho chúng tôi nói nó
      đáng bao nhiêu.
  - situation: >-
      Damage lẻ trong một map có less recovery hoặc no regeneration
    cause: >-
      Nhân vật được công bố hồi 100 energy shield mỗi giây, ngoài ra thì chờ
      recharge, và không life flask nào có tác dụng trên Chaos Inoculation.
      Damage nhỏ liên tục là thứ một cái bể recharge xử lý tệ nhất. Mấy mod
      map là suy luận của chúng tôi từ planner — một câu hỏi cần thử, không
      phải một kết luận.
    fix: >-
      [[Wicked Ward]], được nêu tên trong file CI Swap, không cho damage ngắt
      recharge. [[Vaal Discipline]] lo cái khoảnh khắc mà chừng đó chưa đủ.
      Cho tới khi bạn tự thử, cứ roll lại hai mod đó.
  - situation: >-
      Ngay sau khi lấy [[Chaos Inoculation]]
    cause: >-
      Maximum life thành 1, nên phần energy shield trước giờ là đồ thêm thì
      nay là cả nhân vật. Stage đầu của bài viết chỉ kết thúc khi cái bể "đủ
      lớn để Chaos Inoculation sống được", và không nguồn nào nói đủ lớn là
      bao nhiêu. Mốc tham chiếu duy nhất được công bố là chính file swap:
      6,129 energy shield ở level 94.
    fix: >-
      Mua energy shield trước, respec sau, và lấy [[Wicked Ward]] trong cùng
      lần respec đó, như file swap làm. Hãy đọc con 6,129 là mô tả một nhân
      vật, không phải một ngưỡng.

troubleshooting:
  - symptom: >-
      Damage lên boss của tôi không hề gần 31 triệu
    cause: >-
      31.4 triệu là Full DPS của Path of Building: [[Vortex]],
      [[Vaal Cold Snap]], [[Punishment]] và [[Aspect of the Spider]] đều được
      cộng vào main skill. Riêng [[Creeping Frost of Floes]] thì đọc ra 5.9
      triệu trong cùng file đó, và configuration của file là "None" — không
      boss, không level quái.
    fix: >-
      So dòng main skill của bạn với 5.9 triệu, không phải với con số tiêu đề,
      và đặt một con boss trong tab configuration trước khi so bất cứ thứ gì.
      Cả hai con số đều từ một planner ghi nhãn 3.29.
  - symptom: >-
      Đeo helmet lên mà damage không tăng, hoặc còn giảm
    cause: >-
      "50% increased" áp lên một resistance dương thì đẩy nó lên. Chiêu này
      cần cold resistance của quái đã nằm dưới số không sẵn, nghĩa là mấy cái
      curse và exposure phải đang dính. Đây là cách chúng tôi đọc chữ trên món
      đồ — cũng chính là cách đọc mà cả bài viết dựa lên.
    fix: >-
      Làm bài thử một phút: nhìn cold resistance của một con boss khi có
      helmet và khi không có. Nếu nó chưa âm trước khi helmet lên người, sửa
      mấy cái curse trước.
  - symptom: >-
      Phần lớn map thì ổn, vài map thì yếu thấy rõ
    cause: >-
      Nhiều khả năng là một mod giảm effect của curse lên quái, hoặc một mod
      tăng elemental resistance của chúng; boss kháng curse cũng gây ra đúng
      chuyện đó. Không nguồn nào liệt mod map cho build này. Điều này suy ra
      từ danh sách gem và item.
    fix: >-
      Roll lại mấy map đó cho tới khi bạn tự thử, và coi curse effect trên
      gear là damage chứ không phải tiện nghi.
  - symptom: >-
      Planner tôi import vào hiện 1,772 effective hit point
    cause: >-
      Bạn đang cầm file "From Zero to Endgame". Bộ đang bật của nó không có
      gear nào được áp, nên nó báo 1,707 life và resistance âm ở level 100.
      Không con số nào đọc ra được từ đó.
    fix: >-
      Dùng file "100 Div Endgame" thay vào, và nhớ là nó ghi nhãn 3.29 với
      configuration để ở "None".
  - symptom: >-
      Lần nào vào map cũng thiếu một cái buff
    cause: >-
      Từ 3.30 thì buff của [[Pact of K'Tash]] và [[Pact of Ghorr]] được giữ
      qua các khu vực. Patch note không nêu tên [[Pact of Lycia]], và bài viết
      cũng tính ba curse vào những thứ bạn phải áp lại.
    fix: >-
      Áp lại cái Pact thứ ba và kiểm mấy cái curse như việc đầu tiên bạn làm
      trong mỗi map. Vậy là ít hơn hai thứ so với hồi 3.29.

patch:
  - entry: winter-orb-nerf
    note: >-
      **Lý do để nhìn tới build này ngay từ đầu.** [[Winter Orb]] bắn 2 projectile
      ở mọi gem level thay vì lên được 3, mất khoảng 15% base damage và 10 điểm
      added damage effectiveness — cộng lại khoảng 40% damage của nó ở gem level
      20. Nó là một trong những spell được chơi nhiều nhất ở 3.29. Lời khuyên
      trong mục changelog của chính chúng tôi cho ai muốn một spell cold là nhìn
      sang cold damage over time, mà đó đúng là cái này.
  - entry: ruthless-changes
    note: >-
      **Cái bẫy dành riêng cho build này, và nó là một cái bẫy khó chịu.** Patch
      note chính thức có đổi notable [[Occultist]] — [[Withering Presence]],
      [[Void Beacon]] và [[Profane Bloom]] đều có chữ mới — **và từng mục trong
      số đó đều nằm ở phần riêng của Ruthless.** Riêng [[Void Beacon]] là món
      ruột của build cold, nên một bài viết ngày launch in lại thay đổi đó như
      thay đổi chung sẽ trông hoàn toàn đáng tin. Trong Covens of Umbra thường
      thì Occultist không đổi. Chúng tôi xác nhận bằng cách đọc trực tiếp thread
      chính thức.
  - note: >-
      **[[Creeping Frost of Floes]] không bị đổi trong 3.30.** Lần đổi gần nhất
      là 3.29.0 — critical strike chance từ 6% lên 7.5%, effectiveness of added
      damage ở level 20 từ 80% xuống 65%, base cold damage mỗi giây từ 2,669.1
      lên 3,035.2 — và chuyện đó mới đủ để các guide từ 3.28 trở về trước ghi sai
      số. [[Vortex]], [[Cold Snap]] và [[Eye of Malice]] cũng không hiện gì ở
      3.30. Hãy đọc đó là "không được nhắc trong các nguồn chúng tôi đọc" chứ
      không phải đã chứng minh là không đổi.
  - entry: quality-of-life
    note: >-
      **Một cái lợi nhỏ nhưng thật, cho một build mang ba cái Pact.** "K'Tash's,
      Ghorr's and Beidat's Magnificence and Blood Shrine buffs are now retained
      when transitioning between areas", nên hai trong ba buff Pact sống qua được
      một cái portal. Bench cũng đặt được mọi socket thành màu trắng với một
      [[Orb of Scouring]], chuyện có ý nghĩa trên một nhân vật chạy hai five-link
      và ba curse.
  - entry: link-and-pact-changes
    note: >-
      **Không liên quan, dù tiêu đề nghe vậy.** Pact duy nhất bị đổi về số là
      [[Pact of Beidat]], mất hai chain và hai projectile ở gem level 20. Build
      này chạy [[Pact of Lycia]], [[Pact of K'Tash]] và [[Pact of Ghorr]] nên
      không bị đụng tới.
  - entry: meta-crafting-costs
    note: >-
      **Đổi cách bạn craft cây vũ khí.** Bảo vệ một prefix hay suffix đơn lẻ giờ
      tốn 1 hoặc 2 Divine, còn craft "prefixes cannot be changed" đầy đủ tốn 4
      Divine cộng một loại currency thứ hai — và FAQ của GGG nói rằng game tự
      chọn mod nào được bảo vệ một cách ngẫu nhiên và không cho bạn thấy. Mọi kế
      hoạch craft cây sceptre từ 3.29 đều cần tính lại giá.
  - entry: doryani-and-doedre
    note: >-
      **Đáng nhìn, nhưng không nằm trong build.** [[Doedre's Tongue]] giờ cho
      30–35% to all elemental resistances và roll được "All Damage can Freeze
      against Cursed Enemies". Trên một nhân vật vốn đã dính ba curse thì ít nhất
      nó cũng đáng thử so với cây Jade Amulet rare được công bố. **Chưa ai đề xuất
      và chúng tôi chưa thử.** Cái amulet giờ chỉ rơi từ các encounter Covens of
      Umbra.

strengths:
  - "Một hình dáng thật sự khác với các build endgame còn lại của site này: một degeneration, nên armour và physical damage reduction của quái không làm gì cả."
  - "Bạn rải damage rồi đi, khiến phần clear mạnh ngang phần bossing."
  - "Main skill là một gem Act 1 cộng một lần transfigure ở Labyrinth, không phải một lần mua."
  - "Eye of Malice là một unique core-pool rẻ đang làm việc lớn nhất trong build."
  - "Critical strike và accuracy đều vô nghĩa, bỏ đi luôn hai bài toán gear."
  - "Người được lợi được nêu tên của đợt nerf Winter Orb trong 3.30, theo đúng lời khuyên trong changelog của chúng tôi."
  - "Ba trang 3.30 riêng từ tác giả trong sáu ngày, trên nền một dòng 3.29 dài."
weaknesses:
  - "Không tồn tại một cái giá nào, cho món nào, ở league nào. Con số \"100 Divine\" là một tiêu đề video."
  - "File được công bố đeo một Kalandra's Touch, khiến con số đó khó tin."
  - "Planner ghi nhãn 3.29 và bộ configuration của nó đọc ra \"None\" — không boss, không level quái."
  - "Planner \"Zero to Endgame\" không có gear nào được áp và báo 1,772 effective hit point ở level 100."
  - "Ba file được công bố không đồng ý với nhau về skill nào là chính, cũng không đồng ý về level và chỉ số của nhân vật."
  - "Không có chữ viết nào ở đâu cả: không lộ trình leveling, không thứ tự Labyrinth, không bandit, không Pantheon, không chiến lược map."
  - "2% physical damage reduction và một cú physical hit tối đa 15,600, so với khoảng 51,000 cho mỗi element."
  - "Damage phụ thuộc vào việc dính được ba curse, nên boss kháng curse và mod map về curse đau hơn bình thường."
avoidIf: >-
  Chọn build khác nếu bạn muốn biết một build tốn bao nhiêu trước khi bắt đầu, vì
  cái này không có một cái giá nào và con số tiêu đề của nó thì bị chính danh
  sách gear của nó phản bác. Cũng bỏ qua nếu bạn không thích damage có độ trễ —
  bạn rải vũng và kết quả tới sau một nhịp, chuyện đó không bao giờ hết cảm giác
  khác với một build giết thứ nó đánh. Và bỏ qua nếu bạn không sẵn sàng làm đúng
  một bài thử mà trang này không làm thay bạn được: đeo [[Eye of Malice]] vào,
  nhìn cold resistance của một con boss, và tự thỏa mãn rằng cái tương tác mà cả
  build dựa lên đang chạy đúng như chữ trên món đồ đọc ra.

sources:
  - title: "poebuilds.cc: PoE 3.30 Cold DoT Occultist | 100 Div Endgame Build (bLut)"
