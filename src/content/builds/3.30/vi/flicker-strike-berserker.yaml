confidenceNote: >-
  **Cả bốn điểm số là của chúng tôi. Không nguồn nào cho build này điểm nào
  cả.** Maxroll không công bố điểm cho nó, và profile nó lưu là một khối Path of
  Building thô chứ không phải định dạng đầy đủ hơn của Maxroll, nên mấy trường
  điểm số, điểm mạnh và điểm yếu thật sự không tồn tại. Mấy bảng sao ở chỗ khác
  thì không bao gồm Flicker. Chúng tôi làm tròn bossing xuống từ 3.5.
  Survivability 3 là mức trung bình của hai trạng thái rất khác nhau: tầm 1.5
  trước [[Foulborn Ghostwrithe]] và tầm 4.5 sau đó. Về nguồn: **đừng gọi đây là
  guide 3.30.** Changelog của nó nói "về cơ bản không đổi gì cho 3.30", nhưng
  planner thì ghi ngày 28 tháng 7 năm 2026 mà không có trường league. Đó là dữ
  liệu 3.29 mà tác giả đọc lại rồi tuyên bố vẫn còn đúng. Một tier list độc lập
  cũng gắn nhãn nó là 3.29.
modes:
  ssf: >-
    Từ dở tới tệ, và chúng tôi sẽ khuyên bạn chọn Slayer thay vào đó. Hai món
    chặn cứng theo drop mà không có gì thay thế: [[Foulborn Ghostwrithe]] với
    đúng dòng roll, và [[Glorious Vanity]] từ đúng một conqueror cụ thể.
    Ghostwrithe thì farm được; viên jewel mới là thứ chí tử. Mấy lớp phòng thủ
    tương đương của Slayer thì được ascendancy cho miễn phí. Không nguồn nào nói
    tới câu hỏi nào trong hai câu này — đây là nhận định của chúng tôi.
  hardcore: >-
    Đừng. [[Aspect of Carnage]] thêm thẳng 10% increased damage taken,
    [[Rite of Ruin]] rút máu liên tục một khi bạn đã lấy nó, bạn dịch chuyển vào
    giữa mấy pack quái mà bạn không thấy, và lớp phòng thủ duy nhất của bạn thì
    sập cùng một lúc. Hai
    nguồn độc lập cảnh báo rằng bạn chết trước khi build thành hình. Lại là nhận
    định của chúng tôi; không nguồn nào cho điểm.

idea: |
  [[Flicker Strike]] dịch chuyển bạn tới một con quái rồi đánh nó. Nó có cooldown hai giây, và bạn bỏ qua cooldown đó bằng cách tiêu một frenzy charge. Nên miễn là charge còn vào đều, bạn không bao giờ ngừng di chuyển.

  Đó là toàn bộ cảm giác của build: bạn không đi bộ tới đâu cả. Bạn nháy xuyên qua một pack quái và nó chết sau lưng bạn.

  Damage thì đến từ một chỗ không ai ngờ. Bạn chồng **maximum life**, rồi [[Foulborn Ghostwrithe]] chuyển một cục máu đó thành energy shield, rồi [[Energy Blade]] biến energy shield của bạn thành lightning damage trên vũ khí. Một nhân vật mười nghìn máu cuối cùng vung một cây sword có tầm 1 tới 3,500 lightning damage trên đó.

  **Hãy thật thà với bản thân trước khi bắt đầu con này.** Bạn chơi tầm 45 level như một nhân vật slam, rồi một giai đoạn Flicker mong manh, trước khi build thật tồn tại. Và Flicker thì đi đâu nó thích — nếu không có con quái cụ thể nào được nhắm, game tự chọn một con ngẫu nhiên. Khối người không chơi nổi chỉ vì lý do đó, và đó không phải chuyện tay kém.

chain:
  - label: Dịch chuyển
    text: "[[Flicker Strike]] có cooldown hai giây mà bạn bỏ qua bằng cách tiêu một frenzy charge. Charge vào, di chuyển ra."
  - label: Nhân đôi số hit
    text: "[[Ancestral Fury]] khiến skill strike cũng nhắm luôn vào vị trí trước đó nó được dùng. Mỗi cú Flicker hit hai lần: chỗ bạn đang đứng, và chỗ bạn vừa rời."
  - label: Máu thành damage
    text: "[[Foulborn Ghostwrithe]] biến life thành energy shield, [[Energy Blade]] biến energy shield thành lightning damage trên vũ khí, và [[Voice of the Storm]] roll cái damage đó hai lần rồi giữ kết quả tốt hơn."
  - label: Overleech
    text: "[[Immortal Ambition]] giữ leech chạy cả khi máu bạn đã đầy. Đúng cái lưu lượng đó là thứ giữ bạn sống, và là thứ không cho [[Rite of Ruin]] giết bạn một khi bạn đã lấy nó."

chainDetails:
  - title: Vì sao Berserker chứ không phải Slayer
    body: |
      Lựa chọn này thật sự còn đang mở. Một tier list xếp build vào hạng cao nhất của nó dưới tên "Flicker Strike, Slayer **hoặc** Berserker", còn cái video Flicker 3.30 được xem nhiều nhất thì là một con Slayer.

      **Lý lẽ dứt khoát duy nhất cho Berserker là [[Ancestral Fury]]:** skill strike cũng nhắm luôn vào vị trí trước đó nó được dùng. Trên một skill dịch chuyển, nghĩa là mỗi lần dùng đều hit cả chỗ bạn đáp xuống lẫn chỗ bạn vừa đi khỏi. Guide nói chuyện này nhân đôi damage và nhân đôi tốc độ nạp frenzy charge của bạn. Không notable nào của Slayer làm được gì tương đương riêng cho Flicker.

      **Chỗ Slayer thật sự tốt hơn, và chúng tôi sẽ không giả vờ là không:** Bane of Legends cho 20% more damage với quái unique, nhắm thẳng vào thứ 3.30 thưởng. Brutal Fervour cho hành vi kiểu overleech miễn phí, còn Berserker thì phải mua một viên [[Glorious Vanity]] để có. Masterful Form thêm khoảng trần cho charge. Và cái guide Slayer thì đúng là được viết cho 3.30.

      **Chơi solo self-found thì lấy Slayer.** Endgame của Berserker bị chặn bởi item nhiều hơn hẳn.
  - title: Frenzy charge, và phép tính đằng sau chữ "tự duy trì"
    body: |
      Các nguồn build này dùng:

      - Bản thân [[Flicker Strike]]: 15% chance to gain a frenzy charge on hit.
      - Quality của nó: thêm tới 10%. **Dữ liệu game ở đây tự mâu thuẫn** — dải quality ghi 0–10% nhưng một ghi chú cũ hơn tính ra 5% ở quality 20%, và dữ liệu đó tự gắn cờ chỗ không khớp của mình. Nằm đâu đó giữa 5% và 10%.
      - Quality của [[Poacher's Mark]]: 5% cơ hội cho quái bị curse cấp một charge khi bị hit.
      - Sword mastery: 8% cơ hội khi hit một con quái **unique**.
      - [[Multistrike Support]]: ba cú đánh cho mỗi charge tiêu.
      - [[Ancestral Fury]]: nhân đôi số vị trí hit của bạn.
      - [[Blood Rage]]: charge khi kill, nên chỉ dùng được lúc dọn quái.

      **Phép tính của chúng tôi, ghi rõ là của chúng tôi chứ không phải của nguồn nào:** một lần dùng tiêu một charge; Multistrike cho ba cú đánh; Ancestral Fury thêm một vị trí thứ hai cho mỗi cú đánh, nên tầm sáu hit mỗi charge. Ở mức tầm 30% mỗi hit khi đánh pack, nó trả về khoảng 1.8 charge. Khi đánh boss, có Sword mastery, thì tầm 2.3.

      Tự duy trì thoải mái — và đó là lý do build này không cần một cây vũ khí unique nào để mở khóa.

      **Một chỗ bất định thật sự:** chúng tôi không xác nhận được rằng vị trí hit thứ hai của Ancestral Fury có roll cơ hội nạp charge một cách độc lập. Guide khẳng định là có. Nếu không có, hãy chia đôi mấy con số đó xuống tầm 0.9 và 1.14 — vẫn duy trì được, nhưng sát sạt.
  - title: Một chỗ cần sửa, đáng đọc hai lần
    body: |
      Hai notable của Berserker bị lẫn với nhau suốt, và hiểu ngược chúng sẽ đổi luôn việc bạn nên làm gì với chúng.

      - **[[Aspect of Carnage]]** là node increased damage taken: 40% more damage dealt, 10% increased damage taken. Cố định, luôn bật.
      - **[[Rite of Ruin]]** **không** phải increased damage taken. Nó là một dòng mất máu theo rage: bạn mất 0.1% máu mỗi giây cho mỗi điểm rage trong lúc bạn không mất rage. Ở 50 rage thì đó là 5% máu của bạn mỗi giây, rút liên tục.

      Hai vấn đề khác nhau. Rite of Ruin bị đánh bại bằng **lưu lượng leech**, không phải bằng armour hay resistance. Nếu leech của bạn hỏng, Rite of Ruin giết bạn giữa màn hình trống không.
  - title: Những thứ build này không cần, dù truyền miệng nói khác
    body: |
      - **Oro's Sacrifice không được dùng, và câu chuyện về nó thì đơn giản là sai.** Chúng tôi đã kiểm cả danh sách mod. **Không** có mod "Flicker Strike does not consume Frenzy Charges" nào trên nó. Nó cho một frenzy charge khi một cú attack gây ignite, tức là một động cơ ignite và dù sao cũng không tương thích với một build lightning.
      - **[[Terminus Est]] không được dùng.** Nó cho một charge khi critical strike, mà build này không bao giờ crit vì [[Resolute Technique]]. Căn bản hơn: [[Energy Blade]] thay luôn vũ khí của bạn, nên mod của bất kỳ cây sword unique nào cũng bị bỏ đi.
      - **The Red Trail không được dùng.** Nói chung đó là một công nghệ nạp charge dùng được, chỉ là không phải đường này.

      **Nên đây không phải build bị chặn bởi vũ khí. Nó bị chặn bởi body armour và jewel.** Chỗ nghẽn là [[Foulborn Ghostwrithe]] và đúng viên [[Glorious Vanity]].
  - title: Vì sao chuyện energy shield bị rút không quan trọng
    body: |
      [[Immortal Ambition]] là một keystone mạnh với mấy dòng chữ nhỏ xấu xí: energy shield bắt đầu từ không, không recharge và không regenerate được, và bạn mất 5% của nó mỗi giây.

      Nghe như đủ để phá hỏng một build energy shield. Nó không, vì [[Energy Blade]] scale theo energy shield **tối đa** của bạn, không theo energy shield hiện tại. Phần bị rút đó không khiến bạn mất gì về tấn công.

      Đổi lại bạn được overleech vĩnh viễn: hiệu ứng leech không bị xóa khi phần life không bị reserve của bạn đã đầy, và lúc bạn đầy máu thì chúng hồi energy shield thay vào đó.
  - title: Voice of the Storm giờ là món không crit
    body: |
      Chỗ này làm người ta lẫn, nên nói rõ: [[Voice of the Storm]] làm lightning damage của **non-critical** strike thành lucky, nghĩa là nó roll cái dải khổng lồ 1 tới 3,500 kia hai lần rồi giữ kết quả tốt hơn. Guide đặt nó ở mức tầm 33% more damage, không kèm điều kiện.

      Hiệu ứng dựa vào crit cũ của nó bị bỏ từ mấy patch trước. Đúng vì vậy mà [[Resolute Technique]] chạy được ở đây. Không có mâu thuẫn nào, dù đọc lên thì nghe như có.

mandatory:
  - term: Flicker Strike
    why: >-
      Chính cái skill. Marauder không lấy được nó làm quest reward — bạn mua từ
      [[Nessa]] ở Act 1 sau The Caged Brute, hoặc từ [[Siosa]] ở Act 3.
    detail: >-
      Gem level 1 cần nhân vật level 10 và 29 Dexterity, còn level 20 cần 155
      Dexterity. Marauder phải đi đường cây để lo khoản đó, và vì vậy mà
      [[Versatility]] được lấy sớm.
  - term: Multistrike Support
    why: >-
      Ba cú đánh cho một frenzy charge tiêu. **Đây mới là cổng thật của cú đổi
      skill, không phải bản thân Flicker** — không có ba cú đánh mỗi charge thì
      vòng lặp bị đói.
    detail: >-
      Nó mở ở level 38, đó là mốc sớm nhất guide nói bạn đổi được. Guide khuyên
      chờ tới level 45, và phần hướng dẫn của chính nó đặt cú đổi ở Act 6, khớp
      với 45 chứ không phải 38.
  - term: Ancestral Fury
    why: >-
      Skill strike cũng nhắm luôn vào vị trí trước đó nó được dùng. Trên một skill
      dịch chuyển, chuyện đó nhân đôi số hit và nhân đôi tốc độ nạp charge của
      bạn. Đây là lý do duy nhất để một con Flicker Berserker tồn tại.
  - term: Glorious Vanity
    why: >-
      Bạn cần dòng roll từ đúng một conqueror cụ thể, Ahuana, để lấy được
      [[Immortal Ambition]]. Guide gọi nó là bắt buộc: không có nó bạn không hồi
      energy shield cho đúng được và bạn mất overleech.
    detail: >-
      Đây là cái cổng khó nhất của build, và là lý do nó là lựa chọn solo
      self-found tệ. Một conqueror cụ thể trên một viên timeless jewel ngẫu nhiên
      là món để trade, không phải món drop bạn lên kế hoạch dựa vào được.
  - term: Foulborn Ghostwrithe
    why: >-
      Phải là dòng roll ghi rằng maximum energy shield của bạn bằng 35% maximum
      life. Không có gì thay thế.
    detail: >-
      Ghostwrithe gốc chỉ *chuyển đổi* life, nên bạn mất phần đó. Foulborn thì
      **cộng thêm** energy shield lên trên, trong khi vẫn giữ dòng chuyển đổi. Đáng
      biết: con số đó bị nerf từ 50% xuống 40% rồi xuống 35% trong 3.29, và mấy món
      đang tồn tại có thể bị hạ cấp bằng một [[Divine Orb]]. 3.30 không đổi gì.
      Nếu có con số nào trong file công bố có từ trước lần hạ cuối cùng, thì damage
      của nó bị nói quá — hãy kiểm lúc import.
  - term: Energy Blade
    why: >-
      Biến maximum energy shield của bạn thành lightning damage trên vũ khí. Một
      Energy Blade hai tay được 70% more lightning damage.
    detail: >-
      Cần nhân vật level 24. Từ 3.29, **mọi vũ khí bạn đang đeo đều phải là
      sword** thì nó mới chạy, và bản thân cái buff đó cho 50% less maximum energy
      shield.
  - term: Tattoo of the Kitava Blood Drinker
    why: >-
      Guide gọi nó là bắt buộc để leech được với [[Energy Blade]]. Leech là toàn bộ
      phòng thủ của bạn, nên đây không phải chuyện tùy chọn.
  - term: Resolute Technique
    why: >-
      Không bao giờ crit, không bao giờ miss. Nó bỏ hẳn chuyện accuracy ra khỏi
      việc lo gear, và nó là lý do hiệu ứng non-crit của [[Voice of the Storm]]
      chạy được.
  - term: Voice of the Storm
    level: recommended
    why: >-
      Lightning damage của non-critical strike thành lucky, mà guide đặt ở mức tầm
      33% more damage. Món damage tốt nhất sau phần lõi.
  - term: Crown of the Inward Eye
    level: recommended
    why: >-
      Phần tăng maximum life cũng áp vào attack damage ở mức 30% giá trị của nó.
      Mọi node life trên cây của bạn thành một node damage.
  - term: Poacher's Mark
    level: recommended
    why: >-
      Có quality thì quái bị curse có 5% cơ hội cấp một frenzy charge khi bị hit.
      Một phần nhỏ nhưng thật trong khả năng tự duy trì của bạn.
  - term: Melee Splash Support
    level: recommended
    why: >-
      Hit lan quanh mục tiêu, và đó là thứ nuôi việc nạp charge khi đánh pack. Đổi
      nó sang [[Ruthless Support]] khi đánh pinnacle boss, và nhớ đổi lại.
    detail: >-
      Nghe nói một guide 3.30 khác gọi [[Tribal Fury]] là bắt buộc thay vào đó —
      nó cấp splash từ trên cây, giải phóng ô socket này với giá là mấy passive
      point. Chúng tôi không đọc trực tiếp được trang đó. **Chúng là hai phương án
      thay thế nhau, không phải cả hai đều bắt buộc.** Cả hai giải cùng một vấn đề.
  - term: Carnage Heart
    level: recommended
    why: >-
      Attribute, life leech và resistance trong một cái amulet. Nằm trong danh
      sách khuyến nghị của chính guide.
  - term: Bronn's Lithe
    level: recommended
    why: >-
      Attack speed và movement speed scale theo quality. Một cái chest rẻ cho đoạn
      trước khi có [[Foulborn Ghostwrithe]].
  - term: Greater Multistrike Support
    level: recommended
    why: >-
      Nhân bốn số hit thay vì nhân ba. Ghi chú của chính guide là nó rất đắt, nên
      coi nó là món mua ở endgame xa.
  - term: Fuel the Fight
    level: recommended
    why: >-
      Mana leech từ một cây cluster jewel. [[Flicker Strike]] ở attack speed cao
      là một vấn đề mana trước khi là bất cứ vấn đề gì khác.

labs:
  - lab: Normal
    node: Ancestral Fury
    why: "Rõ ràng, và là cái duy nhất guide nói dứt khoát. Nó là thứ làm Flicker chạy được ở mức cơ bản: hit đôi nghĩa là nạp charge đôi, nghĩa là một vòng lặp tự duy trì."
  - lab: Cruel
    node: Aspect of Carnage
    why: "40% more damage đổi lấy 10% increased damage taken. **Guide tự mâu thuẫn ở lựa chọn này** — phần mở đầu của nó nói Aspect of Carnage thứ hai, còn phần FAQ với phần Act 6 nói Crave the Slaughter thứ hai. Lấy Aspect of Carnage nếu gear của bạn hứng nổi phần damage thêm, lấy [[Crave the Slaughter]] nếu không."
  - lab: Merciless
    node: Crave the Slaughter
    why: "Cái nào trong hai cái bạn chưa lấy ở lần thứ hai. Nạp rage và phần attack speed đi kèm."
  - lab: Eternal
    node: Gore Dancer
    why: "Guide đưa hai lựa chọn cho notable cuối này, [[Rite of Ruin]] hoặc Gore Dancer, và nghiêng về Rite of Ruin. **Bắt đầu bằng Gore Dancer là cách đọc của chúng tôi, không phải của guide.** Nó biến 30% life leech thành instant, thứ làm phần damage thêm của Aspect of Carnage còn sống nổi lúc league start, và nó cho bạn khỏi chịu dòng rút máu của Rite of Ruin tới khi bạn trả nổi. Respec Gore Dancer sang Rite of Ruin về sau, khi bể máu và leech của bạn đã lớn."

stages:
  - id: acts-1-3
    image: blood-rage
    title: Act 1–5
    levels: Level 1–45
    uses: >-
      [[Ground Slam]] từ Tarkleigh sau Hillock, rồi [[Static Strike]] từ level
      12. [[Intimidating Cry]] để có double damage trên mấy cú attack được exert.
    changes: >-
      Phi thẳng tới [[Measured Fury]], guide nói nó cải thiện đáng kể chất lượng
      chơi vì cắt bớt thời gian bạn tốn cho warcry. Lấy [[Versatility]] cho
      accuracy và cho phần Dexterity bạn sẽ cần về sau.
    links:
      - name: Level 1–11
        gems: [Ground Slam, Chance to Bleed Support, Momentum Support]
      - name: Từ level 12
        gems: [Static Strike, Ancestral Call Support, Close Combat Support]
      - name: Di chuyển và warcry
        gems: [Leap Slam, Faster Attacks Support, Intimidating Cry, Frostblink]
    moveOn: "bạn đã level 38 trở lên, mà lý tưởng là level 45, với [[Multistrike Support]] trong tay."
    details:
      - title: Static Strike là một skill tử tế, không phải đồ lót chỗ
        body: |
          Bạn tốn khá nhiều thời gian với nó, nên đáng biết là một tier list liệt kê [[Static Strike]] như một build 3.30 hạng B riêng. Nó không phải món tạm bợ bạn phải chịu đựng.

          [[Close Combat Support]] chỉ chạy với sword và axe, nên chọn vũ khí campaign của bạn theo đó.
      - title: Marauder lấy Flicker Strike ở đâu
        body: |
          **Nó không phải quest reward của Marauder.** Nó là món mua từ vendor.

          Mua từ [[Nessa]] ở Act 1 sau The Caged Brute — bảng mở khóa theo quest liệt kê Marauder là được phép mua. Nếu bạn bỏ lỡ chỗ đó, [[Siosa]] ở The Library, Act 3 bán mọi gem cho mọi class.
      - title: Mấy món nhỏ nên mua khi lên level
        body: |
          - Hai cái Iron Ring và một [[Rustic Sash]] từ [[Nessa]].
          - Một [[Orb of Transmutation]] cộng cái bench để craft một dòng resistance lên từng cái.
          - Một Lapis Amulet, hoặc [[Versatility]] trên cây, cho phần Dexterity mà [[Frostblink]] cần.
  - id: acts-4-10
    image: flesh-and-stone
    title: Act 6–10
    levels: Level 45–68
    uses: >-
      **Cú đổi xảy ra ở đây, trong Act 6.** [[Flicker Strike]] với
      [[Multistrike Support]] và [[Melee Splash Support]], cộng
      [[Poacher's Mark]].
    changes: >-
      Tới lúc này [[Resolute Technique]] đã nằm trên cây từ Act 4 hoặc 5 và chữa
      accuracy vĩnh viễn, [[Intimidating Cry]] đã link với [[Autoexertion]] nên
      warcry tự bật, còn [[Herald of Ash]] với [[Blood Rage]] thì đang chạy.
      Guide thêm tất cả mấy thứ đó trước cú đổi. Cap resistance ở 75% trước khi
      vào map.
    links:
      - name: Main skill
        gems: [Flicker Strike, Multistrike Support, Melee Splash Support, Close Combat Support]
      - name: Warcry, tự động
        gems: [Intimidating Cry, Autoexertion]
      - name: Buff và aura
        gems: [Herald of Ash, Blood Rage, Flesh and Stone, Arctic Armour]
      - name: Di chuyển
        gems: [Leap Slam, Faster Attacks Support, Frostblink]
    moveOn: "resistance đã ở 75% và bạn giữ được một chuỗi Flicker xuyên qua cả pack quái mà không bị dừng."
    details:
      - title: Đừng đổi ở level 38 chỉ vì đổi được
        body: |
          [[Multistrike Support]] mở ở 38, và guide nói bạn *có thể* đổi lúc đó. Nó cũng khuyên 45, và phần hướng dẫn của chính nó đặt cú đổi ở Act 6, khớp với 45.

          Lý do là chuyện duy trì charge. Ba cú đánh mỗi charge là tỷ lệ tối thiểu chơi được. Ở level 38 thì gear và cây của bạn chưa tới đó, và một con Flicker bị đói charge thì khổ lắm.
      - title: Berserk là tùy chọn ở đây
        body: |
          Nguyên văn lời guide: [[Berserk]] thêm vào được ở điểm này nhưng chưa cần thiết, vì nó rút rage của bạn rất nhanh.

          Cứ để đó cho tới khi khả năng nạp rage của bạn tốt hơn. Bớt được một nút trong khúc khó nhất của build.
      - title: Flesh and Stone phải để ở Sand Stance
        body: |
          [[Flesh and Stone]] có hai stance và chỉ một cái giúp được bạn. Sand Stance làm quái gần đó bị blind; Blood Stance làm chuyện hoàn toàn khác.

          Kiểm lại sau mỗi lần bạn chết, vì nó rất dễ bị lật ngược mà không để ý.
      - title: Đây là cửa sổ mà cả hai nguồn đều cảnh báo
        body: |
          Hai nguồn độc lập liệt kê cùng một nhược điểm, gần như từng chữ: bạn có thể chết trước khi món giáp chủ chốt về tay, và Flicker thì đi đâu nó thích.

          Hai nguồn độc lập gặp nhau ở câu "bạn chết trước khi có Ghostwrithe" là tín hiệu tiêu cực mạnh nhất chúng tôi tìm được cho bất kỳ build nào trên site này. Hãy đi hai stage kế tiếp thật chậm.
  - id: early-maps
    image: molten-shell
    title: Map đầu
    levels: Map trắng và map vàng
    uses: >-
      [[Flicker Strike]] với [[Multistrike Support]], cắm trong body armour để ăn
      thêm gem level. [[Melee Splash Support]] để clear.
    changes: >-
      Không có gì về cấu trúc đổi ở đây. Bạn đang gom ba món lõi và sống sót tới
      lúc chúng về. Giữ resistance cap và giữ bể máu lớn dần, vì life là gốc của
      damage của bạn.
    links:
      - name: Main skill
        gems: [Flicker Strike, Multistrike Support, Melee Splash Support, Close Combat Support]
      - name: Warcry và berserk
        gems: [Intimidating Cry, Autoexertion, Berserk]
      - name: Buff và aura
        gems: [Herald of Ash, Blood Rage, Flesh and Stone, Arctic Armour]
      - name: Guard
        gems: [Cast when Damage Taken Support, Molten Shell]
      - name: Mark
        gems: [Poacher's Mark]
    moveOn: "bạn có [[Foulborn Ghostwrithe]] với đúng dòng roll. Tới trước đó thì bạn chưa chơi build thật."
    details:
      - title: Về số socket, chúng tôi sẽ không đoán
        body: |
          **Guide nêu tên các gem nhưng không đưa số socket và không đưa danh sách aura đầy đủ.** Chúng tôi sẽ không bịa ra mấy bản chia four-link, five-link và six-link cho nó.

          Mấy viên gem ở trên là những viên nó nêu tên. Muốn biết lộ trình màu với socket thì bạn phải import file Path of Building, có link ở mục Nguồn.
      - title: Mua gì trước
        body: |
          Thứ tự guide đưa ra, không kèm giá nào vì chẳng có giá nào tồn tại:

          [[Foulborn Ghostwrithe]] → [[Glorious Vanity]] với dòng Ahuana → [[Voice of the Storm]] → [[Crown of the Inward Eye]] → [[Greater Multistrike Support]] → [[Mageblood]] hoặc [[Headhunter]].

          Mọi thứ trước Ghostwrithe là để sống sót. Mọi thứ sau nó mới là build.
      - title: Hai món rẻ đáng biết thêm
        body: |
          [[Death Rush]] được mô tả là một cú đẩy sức mạnh chung chung nếu bạn mua nổi, và không bắt buộc kiểu nào cả. Guide kèm một cảnh báo cụ thể: đừng mua dòng roll một giây, vì uptime khi đó tệ quá.

          [[Cinderswallow Urn]] thì đáng ghép với một viên abyss jewel có flat fire damage, nếu bạn có chạy nó.
  - id: red-maps
    image: glorious-vanity
    title: Map đỏ
    levels: Map Tier 11–16
    uses: >-
      Build thật: [[Foulborn Ghostwrithe]], [[Energy Blade]] trên một cây sword
      craft bằng [[Hollow Fossil]], và [[Glorious Vanity]] để lấy
      [[Immortal Ambition]].
    changes: >-
      Overleech bật lên và build đổi hẳn tính cách. Giờ energy shield gánh damage
      của bạn. Phần damage thêm của [[Aspect of Carnage]] trở nên sống nổi vì
      leech cuối cùng cũng làm việc của nó, và đây là lúc dòng rút máu của
      [[Rite of Ruin]] trở nên trả nổi, nên nó có thể thế chỗ Gore Dancer.
    links:
      - name: Main skill
        gems: [Flicker Strike, Multistrike Support, Melee Splash Support, Close Combat Support]
      - name: Đổi để đánh boss
        gems: [Flicker Strike, Multistrike Support, Ruthless Support, Close Combat Support]
      - name: Energy shield
        gems: [Energy Blade]
      - name: Warcry và berserk
        gems: [Intimidating Cry, Autoexertion, Berserk]
      - name: Buff và aura
        gems: [Herald of Ash, Blood Rage, Flesh and Stone, Arctic Armour]
    moveOn: "overleech đã vĩnh viễn, bể energy shield của bạn đã lớn, và bạn thôi chết vô cớ."
    details:
      - title: Cây sword chỉ là cái giá đỡ, không hơn
        body: |
          [[Energy Blade]] thay luôn vũ khí của bạn. Nên cây sword bạn cầm chỉ tồn tại để mang socket.

          Lấy bất kỳ cây sword năm hoặc sáu socket — base [[Lion Sword]] là lựa chọn thường gặp — rồi dùng một viên [[Hollow Fossil]] lên nó. Đừng tiêu currency cho damage của nó, vì chẳng phần nào sống sót qua cú đổi.

          Nhớ rằng từ 3.29 thì **mọi** vũ khí đang đeo đều phải là sword, nên nếu bạn cầm hai tay hai cây hoặc mang theo một bộ đổi, hãy kiểm cả hai.
      - title: Cú đổi gem cho boss, và chuyện nhớ đổi lại
        body: |
          Với pinnacle boss, đổi [[Melee Splash Support]] sang
          [[Ruthless Support]]. Ghi chú của chính guide có câu "nhưng đừng quên đổi
          lại nhé", câu đó cho bạn biết người ta hay quên tới mức nào.

          Tác giả khẳng định rằng với đủ đầu tư vào setup Ghostwrithe thì bạn làm hết uber một cách thoải mái. Đó là một nguồn duy nhất khẳng định về chính build của mình, trên dữ liệu 3.29. Nghe hợp lý, chưa kiểm trong 3.30.
      - title: Làm gì khi bị đói charge
        body: |
          Khi charge cạn, ba chuyện tệ xảy ra cùng lúc: bạn ngừng di chuyển, bạn mất 10% attack speed cho mỗi charge còn thiếu, và [[Rite of Ruin]], nếu bạn đã đổi sang nó, thì vẫn rút máu bạn.

          Cách chữa, theo thứ tự: quality trên viên [[Flicker Strike]], quality trên [[Poacher's Mark]], Sword mastery cho quái unique, và [[Melee Splash Support]] hoặc [[Tribal Fury]] để mỗi cú vung chạm được nhiều mục tiêu hơn.

          Cách guide nói thì công bằng: bạn không cần đủ mọi nguồn charge, nhưng bỏ hết thì khả năng tự duy trì của bạn sụp.
  - id: endgame
    image: mageblood
    title: Endgame
    levels: Tier 17, uber pinnacle boss trở lên
    uses: >-
      [[Voice of the Storm]], [[Crown of the Inward Eye]], một cây cluster jewel
      có [[Fuel the Fight]], và cuối cùng là [[Greater Multistrike Support]].
    changes: >-
      Thứ tự scale từ đây thì cố định: maximum life, rồi energy shield, rồi
      lightning damage, rồi attack speed. Accuracy thì đã được
      [[Resolute Technique]] giải quyết và không bao giờ phải scale.
    links:
      - name: Chạy map
        gems: [Flicker Strike, Greater Multistrike Support, Melee Splash Support, Close Combat Support]
      - name: Đánh uber boss
        gems: [Flicker Strike, Greater Multistrike Support, Ruthless Support, Close Combat Support]
      - name: Energy shield
        gems: [Energy Blade]
    moveOn: "không còn stage nào nữa. [[Mageblood]] và [[Headhunter]] là những gì còn lại."
    details:
      - title: Mấy con số tham khảo, và vì sao bạn không so chúng được
        body: |
          Có hai file Path of Building thật ghi ngày 3.30 cho Flicker, và chúng **không so sánh được với nhau** — khác ascendancy, khác budget, khác stage:

          - Một con **Slayer** ở level 89: 5.6 triệu hit damage mỗi giây, 8.89 cú đánh mỗi giây, 3,614 life, 23,526 effective hit point.
          - Một con **Berserker**: 1.1 triệu total damage mỗi giây, 4.74 cú đánh mỗi giây, 3,723 life, **30 energy shield**, 11,185 effective hit point.

          Đọc kỹ cái thứ hai. **30 energy shield chứng minh nó hoàn toàn không phải build Ghostwrithe hay Energy Blade** — nó là một con Flicker Berserker khác, cũ hơn. Nó không phải bằng chứng rằng Berserker yếu hơn Slayer.

          Không có phép so sánh cùng điều kiện nào tồn tại trong bất kỳ nguồn nào, và chúng tôi sẽ không chế ra một cái.
      - title: Nó có kế hoạch single-target không
        body: |
          Có, nhưng có điều kiện. [[Ruthless Support]] trong bộ đổi, 70% more
          lightning damage của [[Energy Blade]] trên vũ khí hai tay, hệ số lucky
          tầm 33% của [[Voice of the Storm]], double damage của
          [[Intimidating Cry]], và phần nạp charge của Sword mastery chạy riêng
          với quái unique.

          Đó là một kế hoạch thật. Nó cũng là khẳng định của một tác giả về chính build của anh ta, trên dữ liệu 3.29.
      - title: Nền kinh tế 3.30 làm gì với nó
        body: |
          Lợi thế truyền thống của Flicker là số lượng quái giết được mỗi giờ. 3.30 chuyển giá trị sang quái rare, unique và boss, rồi bóc item quantity ra khỏi mấy mod của quái.

          Nên lợi thế của bạn đáng giá tương đối ít hơn trước, dù chẳng có gì về build thay đổi. Hãy tính chuyện thật sự giết mấy con quái rare chứ không nháy vượt qua chúng.

powerCurve: |
  Khi đã dựng xong, damage của build này là một chuỗi bắt đầu từ tổng máu của bạn. [[Foulborn Ghostwrithe]] đặt maximum energy shield bằng 35% maximum life, [[Energy Blade]] biến maximum energy shield thành lightning damage trên vũ khí, [[Voice of the Storm]] roll cái damage đó hai lần, và [[Ancestral Fury]] cho mỗi lần dùng đáp xuống hai chỗ. Phòng thủ cũng lấy từ đúng cái bể đó: leech, được [[Immortal Ambition]] giữ chạy cả khi máu đã đầy. Một chỉ số, maximum life, nuôi cả hai nửa, và đó là cách chúng tôi đọc thứ tự scale của guide — life trước tiên, attack speed sau cùng.

  Gần như suốt quãng lên level thì chưa có gì trong số đó tồn tại. Bạn là một nhân vật slam tới tầm level 45, chơi [[Static Strike]]. Từ cú đổi ở Act 6, bạn có tốc độ của Flicker mà chưa có chút phòng thủ nào của nó: nếu bạn lấy [[Aspect of Carnage]] thứ hai thì nó đã thêm 10% increased damage taken rồi, còn phần leech đáng lẽ phải trả giá cho nó thì chưa dựng. Đây là khúc mà hai nguồn độc lập cảnh báo, và là lý do điểm survivability của chúng tôi là trung bình của tầm 1.5 trước cái chest và 4.5 sau đó.

  Rồi sức mạnh tới trong đúng một bước, và nó bị chặn bởi item chứ không phải bởi level: cây Ghostwrithe đúng dòng roll, Energy Blade trên một cây sword chỉ để cắm socket, và một viên [[Glorious Vanity]] với dòng Ahuana. Trước bước đó, life chỉ là để sống; sau nó, mỗi điểm life cũng là damage. Mấy món mua về sau nhân lên thứ đã có sẵn — Voice of the Storm tầm 33% more theo con số của guide, [[Crown of the Inward Eye]] biến phần tăng life thành attack damage, [[Greater Multistrike Support]] thêm cú hit thứ tư.

  Hãy cầm tất cả những điều này một cách lỏng tay. Guide là dữ liệu 3.29 mà tác giả đọc lại rồi tuyên bố vẫn còn đúng, không nguồn nào cho build này điểm nào cả, và con số của Ghostwrithe đã bị cắt từ 50% xuống 35% trong 3.29. Hình dạng của đường cong thì có căn cứ vững. Còn độ lớn của từng bước là khẳng định của một tác giả về chính build của anh ta.

upgrades:
  - step: "[[Foulborn Ghostwrithe]] với dòng roll đặt maximum energy shield bằng 35% maximum life — cộng [[Energy Blade]], một cây sword [[Hollow Fossil]] và [[Tattoo of the Kitava Blood Drinker]]"
    why: >-
      Đứng đầu trong thứ tự của guide, và trước nó thì chưa có build nào cả:
      mọi thứ trước Ghostwrithe là để sống sót. Nó là thứ biến bể máu của bạn
      thành damage. Nó được mô tả là ra khá thường xuyên từ cây Breach, nên
      hãy farm chứ đừng định giá; không có giá nào đáng tin tồn tại. Cây sword
      chỉ là cái giá cắm socket, nên đừng tiêu gì cho damage của nó. Guide gọi
      cái tattoo là bắt buộc để leech được với Energy Blade.
  - step: "[[Glorious Vanity]] với dòng Ahuana, để lấy [[Immortal Ambition]]"
    why: >-
      Thứ hai trong thứ tự của guide, và guide gọi nó là bắt buộc: không có nó
      bạn không hồi energy shield cho đúng được và bạn mất overleech. Nó là
      cái cổng khó nhất của build và là món để trade, không phải món drop bạn
      lên kế hoạch dựa vào được. Cách đọc của chúng tôi: coi món này với bước
      trên là một lần mua, vì bài viết không gọi đây là build thật cho tới khi
      có cả hai.
  - step: "[[Voice of the Storm]]"
    why: >-
      Lightning damage của non-critical strike thành lucky, mà guide đặt ở mức
      tầm 33% more damage, không kèm điều kiện. Nó là món damage tốt nhất sau
      phần lõi. Nó đứng thứ ba vì hai bước trên làm cho build tồn tại, còn món
      này chỉ nhân nó lên.
  - step: "[[Crown of the Inward Eye]]"
    why: >-
      Phần tăng maximum life cũng áp vào attack damage ở mức 30% giá trị của
      nó, nên mọi node life trên cây thành một node damage. Thứ tư trong thứ
      tự của guide. Guide không nói vì sao nó nằm dưới Voice of the Storm, và
      chúng tôi không có con số nào để so hai món.
  - step: "[[Greater Multistrike Support]]"
    why: >-
      Bốn hit mỗi lần dùng thay vì ba. Ghi chú của chính guide là nó rất đắt,
      và đó là toàn bộ lý do nó nằm xa thế này. Phần chúng tôi thêm, từ phép
      tính charge của chính chúng tôi chứ không từ nguồn nào: cú đánh thứ tư
      cho mỗi charge tiêu chắc cũng làm việc duy trì frenzy charge dễ thở hơn.
  - step: "[[Mageblood]] hoặc [[Headhunter]]"
    why: >-
      Thứ guide nêu là còn lại sau mọi thứ khác. Nó không đưa lý do cho món
      nào và không đưa cách chọn giữa hai món, và chúng tôi sẽ không bịa ra.

deaths:
  - situation: "Giữa cú đổi ở Act 6 và [[Foulborn Ghostwrithe]], bạn chết trong pack quái hết lần này tới lần khác"
    cause: >-
      Bạn có tốc độ mà chưa có phòng thủ. Flicker đặt bạn vào giữa mấy pack
      quái bạn không chọn, [[Aspect of Carnage]] thêm thẳng 10% increased
      damage taken, còn cái overleech đáng lẽ gánh hết chỗ đó thì chưa tồn
      tại. Hai nguồn độc lập liệt kê đây là nhược điểm chính của build.
    fix: >-
      Đi mấy stage này thật chậm. Cap resistance ở 75% trước khi vào map, giữ
      [[Flesh and Stone]] ở Sand Stance, và nếu gear của bạn không hứng nổi
      phần damage thêm thì lấy [[Crave the Slaughter]] thứ hai thay cho Aspect
      of Carnage. Gore Dancer ở lab thứ tư là cách đọc của chúng tôi, không
      phải của guide. Không thứ nào trong đây lấp được khoảng trống; chỉ cái
      chest mới lấp được.
  - situation: "Chuỗi Flicker dừng lại giữa một pack quái"
    cause: >-
      Đói charge. Ba chuyện xảy ra cùng lúc: bạn ngừng di chuyển, bạn mất 10%
      attack speed cho mỗi charge còn thiếu, và [[Rite of Ruin]], nếu bạn đã
      lấy nó, thì vẫn rút máu bạn. Bạn không chữa được giữa trận.
    fix: >-
      Chữa trước trận, theo thứ tự của bài viết: quality trên viên Flicker
      Strike, quality trên [[Poacher's Mark]], Sword mastery cho quái unique,
      rồi [[Melee Splash Support]] hoặc [[Tribal Fury]] để mỗi cú vung chạm
      được nhiều mục tiêu hơn. Và đừng đổi sang Flicker ở level 38 chỉ vì
      [[Multistrike Support]] mở ở đó.
  - situation: "Bạn chết giữa màn hình trống, không có gì đánh bạn"
    cause: >-
      [[Rite of Ruin]]. Nó không phải increased damage taken; nó là một dòng
      rút máu 0.1% mỗi giây cho mỗi điểm rage, tức 5% máu của bạn mỗi giây ở
      50 rage. Chỉ lưu lượng leech mới thắng được nó. Phần giải thích của
      chúng tôi về cái màn hình trống: không có gì để đánh thì không có gì để
      leech.
    fix: >-
      Armour và resistance không làm được gì ở đây. Đừng lấy Rite of Ruin cho
      tới khi bể máu và leech của bạn đã lớn — thứ tự lab của chúng tôi giữ nó
      lại đúng vì lý do đó — và phải có [[Immortal Ambition]] với
      [[Tattoo of the Kitava Blood Drinker]] sẵn trước đã.

troubleshooting:
  - symptom: "[[Energy Blade]] không chạy"
    cause: >-
      Từ 3.29, mọi vũ khí bạn đang đeo đều phải là sword. Một món không phải
      sword ở bất cứ đâu là đủ làm nó hỏng.
    fix: >-
      Kiểm cả hai tay và bộ weapon swap. Cây sword chỉ cần mang socket: bất kỳ
      cây sword năm hoặc sáu socket nào có dùng một viên [[Hollow Fossil]] lên
      nó.
  - symptom: "Thanh energy shield của bạn nằm gần cạn và không bao giờ đầy lại"
    cause: >-
      Đó là [[Immortal Ambition]] chạy đúng như chữ ghi: energy shield bắt đầu
      từ không, không recharge và không regenerate được, và bạn mất 5% của nó
      mỗi giây. Nó không khiến bạn mất gì về tấn công, vì Energy Blade scale
      theo energy shield tối đa, không theo energy shield hiện tại.
    fix: >-
      Không có gì để chữa. Hãy đánh giá nhân vật theo maximum energy shield,
      và chỉ trông leech làm đầy thanh đó lúc máu bạn đang đầy.
  - symptom: "Damage của bạn thấp hơn hẳn file Path of Building được công bố"
    cause: >-
      Kiểm cái chest trước. Ghostwrithe gốc chỉ chuyển đổi life; nó phải là
      [[Foulborn Ghostwrithe]] với dòng roll cộng thêm energy shield bằng 35%
      maximum life. Con số đó từng là 50%, rồi 40%, trong 3.29, và nếu file
      công bố có từ trước lần cắt cuối cùng thì damage của nó bị nói quá.
      Chúng tôi không xác minh được chuyện đó mà không giải mã file.
    fix: >-
      Đọc dòng chữ trên chính cái chest của bạn, rồi so với file lúc import.
      Khoảng chênh đến từ con số trong file thì không phải thứ bạn lấp được.
  - symptom: "Bạn cạn mana khi attack speed đã lên"
    cause: >-
      Flicker Strike ở attack speed cao là một vấn đề mana trước khi là bất cứ
      vấn đề gì khác.
    fix: "Mana leech từ [[Fuel the Fight]] trên một cây cluster jewel."
  - symptom: "Một con pinnacle boss đánh mãi không chết — hoặc clear sụp ngay sau khi đánh xong một con"
    cause: >-
      Cú đổi gem, chiều này hoặc chiều kia. [[Melee Splash Support]] là cho
      pack quái còn [[Ruthless Support]] là cho pinnacle boss; ghi chú của
      chính guide dặn đừng quên đổi lại.
    fix: "Đổi trước khi vào boss, và đổi lại trước map kế tiếp."
  - symptom: "Sau một lần chết, bạn bắt đầu ăn đòn nhiều hơn hẳn trước đó"
    cause: >-
      [[Flesh and Stone]] đã lật sang Blood Stance. Chỉ Sand Stance mới làm
      quái gần đó bị blind, và nó rất dễ bị lật ngược mà không để ý.
    fix: "Kiểm lại stance sau mỗi lần chết."

patch:
  - note: >-
      **Không có gì trong build này đổi.** [[Flicker Strike]] không được nhắc ở
      bất cứ đâu trong patch note chính thức, và một tier list độc lập xác nhận
      "thay đổi 3.30: không đổi". [[Berserker]] không được nhắc một lần nào.
      [[Energy Blade]], [[Multistrike Support]], [[Poacher's Mark]],
      [[Blood Rage]], [[Berserk]] và Ghostwrithe không xuất hiện ở đâu trong phần
      balance.
  - entry: ruthless-changes
    note: >-
      **Slayer chỉ xuất hiện trong phần Ruthless, và chuyện đó quan trọng nếu bạn
      đang chọn giữa hai bên.** Mấy dòng về Impact và Endless Hunger chỉ thuộc
      Ruthless. **Một vấn đề dữ liệu đang tồn tại cần biết:** trang Slayer của
      poedb hiện Impact với tới 50% area of effect và Endless Hunger với 20%
      increased attack speed khi đang leech, mà không có nhãn Ruthless. Nó đang
      gộp mấy giá trị Ruthless ghi đè vào cùng một khối chứ không phải khẳng định
      sai, nhưng người đọc chỉ dùng trang đó sẽ kết luận sai rằng Slayer được buff
      trong 3.30. Hãy coi patch note chính thức là nguồn có thẩm quyền.
  - entry: ralakeshs-impatience
    note: >-
      **Một cú nerf item ở ngoài lề.** [[Ralakesh's Impatience]] giờ có −1 cho
      power, endurance **hoặc** frenzy charge tối đa. Chuyện đó liên quan tới mấy
      build frenzy charge từng dùng nó. Build này thì không.
  - entry: loot-rarity-rework
    note: >-
      **Cơn gió ngược thật sự.** Giá trị giờ dồn vào quái rare với unique và vào
      boss. Lợi thế của Flicker luôn là số lượng kill mỗi giờ, mà số lượng thì
      patch này đáng giá tương đối ít hơn. Không có gì bị nerf; phần thưởng đã dịch
      chỗ.
  - entry: quantity-to-atlas-drops
    note: >-
      **Cùng chiều đó.** Item quantity bị bóc ra khỏi mod của quái và mấy cái altar
      quantity thì mất, chuyện đó làm mất giá kiểu farm dựa thuần vào độ dày pack
      quái — đúng thứ build này giỏi nhất.
  - entry: league-fates
    note: >-
      **Hơi bất lợi.** Cơ chế league thưởng cho single target, mà đó là nửa yếu
      hơn của Flicker. Riêng Berserker thì thiếu cái 20% more damage với quái
      unique của Slayer, nên đây là trục mà lựa chọn Berserker-hay-Slayer khiến bạn
      mất nhiều nhất.
  - entry: mercenary-nerfs
    note: >-
      **Buff tương đối, được bao nhiêu thì được.** Mercenary bị cắt rất nặng mà
      build này không dùng con nào.
  - note: >-
      **Một cú nerf đã xảy ra rồi, cần kiểm lúc import.**
      [[Foulborn Ghostwrithe]] đi từ 50% xuống 40% rồi xuống 35% trong 3.29. File
      công bố ghi ngày 3.29 thì đáng lẽ đã phản ánh mức 35%, nhưng nếu có con số
      nào trong đó có từ trước lần hạ cuối cùng, thì damage của nó bị nói quá.
      Chúng tôi không xác minh được chuyện này mà không giải mã file.

strengths:
  - "Clear nhanh nhất trên site này. Flicker là cái mốc của cả thể loại và không có gì phải đi bộ."
  - "Ancestral Fury nhân đôi từng cú hit, và đó là thứ riêng của Berserker trên skill này."
  - "Không cần vũ khí unique nào để mở khóa. Cây sword chỉ là cái giá cắm socket."
  - "Mọi node life là một node damage, khi đã đeo Crown of the Inward Eye."
  - "Rất dai khi đã dựng xong: overleech vĩnh viễn trên một bể máu lớn."
  - "Đi được từ con số không tới một nhân vật endgame đủ bộ mà không phải mua vũ khí."
weaknesses:
  - "Bạn có thể chết hết lần này tới lần khác trước khi Foulborn Ghostwrithe về. Hai nguồn độc lập liệt kê đây là nhược điểm chính."
  - "Flicker đi đâu nó thích. Nếu không có gì được nhắm, game tự chọn ngẫu nhiên."
  - "Nhiều nút: Flicker, Berserk, warcry, mark, Blood Rage và một cái stance, cộng một cú đổi gem cho boss."
  - "Bị đói charge thì cảm giác như tùy hứng và bạn không chữa được giữa trận."
  - "Tầm 45 level chơi một skill hoàn toàn khác trước khi build bắt đầu."
  - "Bị chặn sau một viên timeless jewel của đúng một conqueror, và chuyện đó làm nó thành build chỉ chơi được khi có trade."
  - "Guide là dữ liệu 3.29 được kiểm lại cho 3.30, không phải được viết lại cho nó."
avoidIf: >-
  Đây là build duy nhất trên site này mà chúng tôi sẽ chủ động can một số người
  đừng chơi. Đừng chơi nếu bạn dễ bị say hình hoặc dễ mất phương hướng khi nhìn:
  bạn dịch chuyển liên tục và bạn không điều khiển được chỗ mình đáp xuống, mà đó
  không phải thứ luyện tập chữa được. Đừng chơi nếu bạn muốn ít công sức — nó là
  mặt đối lập của một build một nút. Đừng chơi nếu mấy cái chết cảm giác tùy hứng
  sẽ làm hỏng league của bạn, vì đói charge tạo ra đúng mấy cái chết đó. Đừng chơi
  nếu bạn ghét một nhân vật dở trước khi nó ngon. Và đừng chơi nếu bạn sẽ không
  trade, vì viên [[Glorious Vanity]] bạn cần đến từ đúng một conqueror cụ thể. Chơi
  solo self-found hay hardcore thì lấy Slayer, hoặc một build khác hẳn.

sources:
  - title: "Maxroll: Flicker Strike Berserker league starter (cptngarbage)"
    url: https://maxroll.gg/poe/build-guides/flicker-strike-berserker-league-starter
    kind: guide
    note: "Nguồn chính. Changelog của nó nói \"về cơ bản không đổi gì cho 3.30\", nhưng cái planner được lưu thì ghi ngày 28 tháng 7 năm 2026 mà không có trường league. Đó là dữ liệu 3.29 được kiểm lại, không phải viết lại."
  - title: "Path of Building: file được công bố"
    url: https://maxroll.gg/poe/pob/1xq93w0x
    kind: pob
    note: "Một khối Path of Building thô chứ không phải định dạng planner đầy đủ hơn của Maxroll, và đó là lý do build này không có điểm số, điểm mạnh hay điểm yếu nào. Import nó để lấy lộ trình socket với màu mà trang không đưa ra."
  - title: "So sánh với Slayer: guide Flicker 3.30 của MAGEFIST"
    url: https://www.poebuilds.cc/poe1/build/fjCN-vN_Tvk
    kind: guide
    note: "Video Flicker 3.30 được xem nhiều nhất, và đúng là được viết cho 3.30. Nguồn của mấy con số tham khảo cho Slayer. Nếu bạn muốn bản được ghi chép tốt hơn của archetype này, thì là nó."
  - title: "Path of Building: MAGEFIST Slayer, level 89"
    url: https://poe.ninja/poe1/pob/9a72a
    kind: pob
  - title: "Path of Building: LugoHQ Berserker, ghi ngày 3.30"
    url: https://pobb.in/oC261dUuG64l
    kind: pob
    note: "Một file Berserker thứ hai, ở mức 30 energy shield — nên không phải build Ghostwrithe hay Energy Blade. Trích chỉ để cho thấy vì sao hai bảng chỉ số tham khảo kia không so được với nhau."
  - title: "PoEDB: Flicker Strike"
    url: https://poedb.tw/us/Flicker_Strike
    kind: data
    note: "Nguồn của cooldown hai giây, luật bỏ qua cooldown bằng charge, cái 15% chance nạp charge có sẵn và hành vi nhắm mục tiêu ngẫu nhiên. Dải quality của nó mâu thuẫn với ghi chú cũ hơn của chính nó, và đó là lý do chúng tôi đưa ra một khoảng."
  - title: "PoEDB: Energy Blade"
    url: https://poedb.tw/us/Energy_Blade
    kind: data
    note: "Nguồn của yêu cầu level 24, luật chỉ dùng sword từ 3.29, và cái 70% more lightning damage trên blade hai tay."
  - title: "PoEDB: Ghostwrithe"
    url: https://poedb.tw/us/Ghostwrithe
    kind: data
    note: "Xác nhận hai bản Foulborn, và rằng chỉ dòng 35%-của-life mới cộng thêm energy shield chứ không chuyển đổi nó."
  - title: "PoEDB: Oro's Sacrifice"
    url: https://poedb.tw/us/Oros_Sacrifice
    kind: data
    note: "Kiểm riêng để xác nhận rằng mod \"Flicker Strike does not consume Frenzy Charges\" không tồn tại trên món này. Tìm đúng nguyên văn thì không ra gì cả."
  - title: "PoEDB: Slayer"
    url: https://poedb.tw/us/Slayer
    kind: data
    note: "**Hiện giá trị của Ruthless mà không có nhãn.** Hữu ích để đọc chữ trên node, nhưng đừng đọc thay đổi 3.30 của Slayer từ trang này."
  - title: "insanebuild: tier list build 3.30"
    url: https://insanebuild.gg/blog/path-of-exile/build-guide-e35d/poe-3-30-build-tier-list
    kind: guide
    note: "Hạng cao nhất, dưới tên \"Flicker Strike, Slayer hoặc Berserker\". Nó độc lập gắn nhãn guide Maxroll này là 3.29, và hai nhược điểm nó nêu gần y hệt của chính tác giả: bạn chết trước khi có món giáp, và Flicker đi đâu nó thích."
  - title: "Patch note chính thức 3.30.0"
    url: https://www.pathofexile.com/forum/view-thread/4013680
    kind: official
    note: "Đã kiểm Flicker Strike, Berserker, Energy Blade, Multistrike, Poacher's Mark, Blood Rage, Berserk và Ghostwrithe. Không cái nào xuất hiện trong các mục balance. Slayer chỉ xuất hiện bên trong phần Ruthless."
