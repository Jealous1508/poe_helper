name: Flicker Strike Berserker
tagline: >-
  Dịch chuyển liên hoàn xuyên qua pack quái mà không bao giờ phải đi bộ. Clear
  nhanh nhất trên site này, và cũng là con đòi hỏi bạn nhiều nhất trước khi nó
  chạy được.
class: Marauder
ascendancy: Berserker
role: starter
budget: starter
budgetNote: >-
  **Không nguồn nào công bố con số currency cho build này. Không 3.30, cũng không
  3.29.** Maxroll không đưa giá nào trên cả trang, và cả hai tier list có nhắc tới
  nó cũng không đưa giá nào. Một league ngày đầu thì chưa có nền kinh tế nào để mà
  định giá. Thứ tác giả có khẳng định bằng chữ là "setup endgame rất đáng tiền" và
  "lo gear dễ, thẳng tuột" — lời của chính anh ta về chính build của anh ta. Hai
  thông tin hữu ích: [[Foulborn Ghostwrithe]] được mô tả là ra khá thường xuyên từ
  cây Breach, nên nó farm được chứ không phải mua; và [[Opalescent Oil]] để anoint
  thì rẻ. **Có mấy bản chụp giá cũ của Ghostwrithe trên một site, từ tháng 7 năm
  2026, và hai mục rao trên cùng một trang lệch nhau gần ba lần. Đừng dùng chúng.**
