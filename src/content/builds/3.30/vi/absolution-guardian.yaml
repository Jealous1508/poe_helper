budgetNote: >-
  Campaign và mấy map đầu không tốn gì: gem là quest reward ở Act 1 và các stage
  đầu trên planner toàn đồ rare. **Guide đã công bố không đưa ra con số currency
  nào cho bất cứ thứ gì.** Những con số duy nhất chúng tôi có là ba mức từ một
  bản codex 3.29 do độc giả gửi tới, không ghi tên tác giả: dưới 50 Chaos để vào
  map, 2–15 Divine để farm Tier 16 thoải mái, và 40 Divine trở lên cho bản
  [[Doryani's Prototype]]. Đó là **số liệu 3.29 từ một nguồn không kiểm chứng
  được**, và nền kinh tế 3.30 thì chưa tồn tại. Hãy đọc chúng như một cỡ độ lớn,
  không hơn.
