    moveOn: "không còn stage nào bạn cần nữa. Phần tiếp theo là bản đắt tiền."
    details:
      - title: Các mảnh, theo guide
        body: |
          Danh sách của tác giả, theo thứ tự của tác giả:

          1. **[[Glorious Vanity]], loại Xibaqua**, đặt "in the top socket so it will replace [[Hex Master]]". Keystone trong bán kính của nó thành [[Divine Flesh]]. Nếu viên jewel còn biến các passive nhỏ thành chaos resistance, "it will be even better". Tác giả có link một video về cách tìm một viên.
          2. **[[Dawnbreaker]]** "with at least 18-20% of Lightning as Fire and 18-20% of Cold as Fire".
          3. **Một viên [[Watcher's Eye]]** có cold và lightning damage taken as fire khi đang chịu ảnh hưởng của [[Purity of Fire]] — và chính cái aura đó, đã bật.

          Rồi: "get rid of Lightning resistance from all items and get Rings with -Lightning resistance from trade", nhắm tới −200%. Và cap chaos resistance: "roll chaos res on most of the items and use [[The Light of Meaning]]".

          Nhượng bộ duy nhất của tác giả: "If you have Glorious Vanity + Shield but don't have Watcher's you can still swap but try to get Watcher's ASAP."
      - title: Vì sao nó là tất cả hoặc không gì cả
        body: |
          Mỗi mảnh che một lỗ mà mảnh khác mở ra.

          Cái armour gỡ bỏ lightning resistance của bạn với tư cách một lớp phòng thủ. [[Divine Flesh]] dời một nửa chỗ lightning damage đó — và một nửa mọi fire với cold — sang chaos resistance, nên chaos resistance phải được cap *trước*, không thì keystone làm bạn yếu đi. Divine Flesh cũng tắt luôn energy shield với tư cách một bể máu. [[Dawnbreaker]] và [[Watcher's Eye]] dời thêm lightning sang fire, nên fire resistance phải cao hết mức bạn với tới được; nhân vật được công bố nằm ở 87%. Và modifier của Watcher's Eye chỉ tồn tại khi [[Purity of Fire]] đang bật.

          Bỏ ra một cái thì mấy cái còn lại không xuống cấp từ từ. Đây là phần được lập luận tốt nhất của codex, và cơ chế kiểm lại thì khớp từng dòng.
      - title: Một thứ tự an toàn để làm
        body: |
          **Chỉ từ riêng codex** — guide đưa danh sách ở trên mà không đưa trình tự. Nó hợp lý, nên nó ở đây, được đánh dấu đúng như bản chất của nó:

          1. Gom đủ từng món trước. Chưa mặc gì cả.
          2. Kiểm chaos resistance và fire resistance của bộ hoàn chỉnh trong Path of Building trước khi tiêu passive point.
          3. Respec cây: bỏ mấy node elemental resistance, cắm [[Glorious Vanity]], xác nhận [[Divine Flesh]] đã sáng.
          4. Đeo shield và jewel, bật [[Purity of Fire]].
          5. Mặc body armour. Xác nhận [[Determination]] đang chạy.
          6. Ring sau cùng. Nhớ con bug: ở đúng 0% lightning resistance, dòng chính của cái armour có thể không làm gì.
          7. Đổi curse và thử ở một cái map thấp trước khi vào Tier 16.

          Lời khuyên còn lại của nó là bắt đầu săn viên timeless jewel từ quanh level 90, vì tìm được một viên có mấy passive bị đổi hợp với cây của bạn là thứ mất thời gian nhất.
      - title: Nhân vật hoàn chỉnh trông thế nào
        body: |
          Từ Path of Building của tác giả, **gắn nhãn 3.28**, level 97: 4,761 life, 919 energy shield (giờ không bảo vệ gì), 37,327 armour, 90% physical damage reduction, 75% block và 78% spell block. Resistance 87% fire, 76% cold, **−200% lightning**, 82% chaos.

          Maximum hit taken: 19,173 physical, 54,058 fire, 51,049 cold, 50,518 lightning, 47,187 chaos. Effective hit point 238,456. Tổng damage mỗi giây 25,214,806.

          Đọc con số lightning hai lần. Khi resistance không đóng góp gì, mấy lớp chuyển đổi và armour kéo một cú hit lightning về ngang với một cú hit cold. Đó là cú đổi đang chạy đúng.

          Các giả định đằng sau con số damage: 15% shock, "Nearby Allies' Damage with Hits is Lucky", minion nhận 20% physical damage as extra lightning, một con spectre cấp Wrath không tốn reservation, Animate Guardian không được tính, và không chọn boss nào.
