    moveOn: "sau đây không còn gì ngoài một cây [[Mageblood]], thứ tác giả giữ thành một file level 99 riêng."
    details:
      - title: Những gì chúng tôi nói được và không nói được ở đây
        body: |
          Cách xếp gem ở trên là đọc từ trang level 98 của guide. Thứ chúng tôi không đọc được là chính cái helmet: support nào được craft trên nó, và bằng cách nào. Tác giả có một video craft "7-link helmet" riêng. Codex mô tả một cây [[Bone Helmet]] với hai modifier "socketed gems are supported by" và nói hãy kiểm pool craft trước khi tiêu bất cứ thứ gì. Chúng tôi xin lặp lại lời cảnh báo đó chứ không lặp lại công thức.

          Ở bản này [[Zealotry]], [[Wrath]] và [[Haste]] được liệt là "Spectre Auras": chúng đến từ spectre, không phải từ reservation của chính bạn.
      - title: Bloodline, nói ngắn
        body: |
          Guide nhắc tới việc dùng "Corruption Embrace chaos ascendancy to have almost 100% uptime of additional Vaal Absolution minion", và cây của tác giả có hiện một notable Chaos Bloodline.

          Mục của PoEDB cho Corruption's Embrace ghi Vaal skill không phải aura cần ít hơn 80% soul, với bonus thêm khi mặc bốn, sáu và tám món corrupted; bloodline này mở khóa bằng cách đánh bại Trialmaster. Một guide 3.28 không liên quan cảnh báo đừng đi tới sáu món corrupted. **Guide không đưa chỉ dẫn nào cho lớp này**, nên chúng tôi nhắc tới rồi dừng.
      - title: Build vẫn làm dở chuyện gì
        body: |
          - Một con boss lẻ không cho vòng lặp thứ gì để ăn. Bạn phụ thuộc vào một cú roll 25% mỗi hit và vào Vaal Absolution.
          - Sau cú đổi bạn phải ở trong vòng sáu mét với thứ bạn đang giết.
          - Bể life dưới 5,000 và energy shield không còn được tính. Block và một lần hồi máu mỗi bốn giây không chặn được một cú hit lớn.
          - Guide 3.28 không liên quan liệt "not made for Uber bosses" vào các điểm yếu của nó. Tác giả thì nói bản của mình làm được, ở tier đắt tiền.

powerCurve: |
  Có năm thứ nhân damage của build này lên, và chúng không tới cùng lúc. Đó là lý do nó thấy bình thường trong một thời gian dài rồi thôi bình thường, hai lần.

  **Có bao nhiêu Sentinel đang đứng, và chúng ở gem level nào.** Cả hai có từ level 12, cả hai đều yếu. Ở level 30 bạn có một three-link, cast chậm và Sentinel hết giờ giữa các pack; bạn tự gây phần lớn damage và build thấy như một caster trơn. **Aura miễn phí** là cú nhảy đầu tiên: Sentinel of Radiance ở khoảng 33, rồi Elemental Relic ở Labyrinth thứ hai, thứ đáng xấp xỉ ba aura level 27 lúc bạn level 85 mà không tốn gì. Đó là khoảnh khắc minion tiếp quản, và nó không tốn currency — đó là toàn bộ lý lẽ để coi đây là một league starter.

  Tới level 70 các mảnh đầu game còn lại đã vào: [[Eldritch Battery]] để reserve được aura, [[Zealotry]], một five-link, [[Vaal Absolution]]. Từ 70 tới giữa khoảng 90, phần lợi là **gem level trên gear, link thứ sáu, và crit** — có thật, nhưng mỗi cái là một lát, còn độ khó của map thì lên nhanh hơn damage của bạn. Khúc này là chỗ codex nói người ta bỏ build, và chúng tôi nghĩ đó là cách đọc đúng: ở đây bạn đang dựng block, armour và mana, không phải sức mạnh.

  Hệ số nhân thứ năm là **lightning resistance của kẻ địch**, và nó không nhúc nhích chút nào cho tới cú đổi. Rồi nó đi hết quãng đường, trong một lần. Hai file của tác giả kẹp nó ở hai đầu: 2.4 triệu ở level 94 không có cái armour, 25.2 triệu ở level 97 có nó và có mọi thứ khác tốt hơn. *Phần chia giữa "cái armour" và "mọi thứ khác" là suy luận của chúng tôi; chưa ai công bố nó.*

  Phòng thủ đi theo đường cong ngược lại. Nó mạnh từ sớm và miễn phí — một phần năm mỗi cú hit được chuyển hướng từ level 33, hồi đầy máu mỗi bốn giây từ Labyrinth thứ ba, 75% block từ cái thứ tư — rồi cú đổi lấy đi một lớp và bắt bạn đứng gần hơn. Trên hai file của tác giả, nhân vật đã đổi đánh mạnh hơn khoảng mười lần so với nhân vật ngày đầu và, ở những mặt quan trọng trong một trận boss, mỏng manh hơn.
upgrades:
  - step: "+1 level cho minion skill gem trên wand, shield và helmet"
    why: >-
      Luật của tác giả, lặp lại ở ba stage: đây là "the stat that will give
      you the most damage". Life và damage gốc của Sentinel tăng theo gem
      level, nên nó nhân lên mọi thứ khác bạn sẽ mua. Nó đứng đầu vì nó nằm
      trên đồ rare, vốn rẻ, và vì nó không cần thứ gì khác có sẵn.
    cost: "Nằm trong mức đầu tiên của codex, dưới 50 Chaos cho cả nhân vật. 3.29, chỉ từ codex, chưa kiểm chứng."
  - step: Một cây wand còn trống suffix, rồi craft trigger
    why: >-
      Tự động hóa [[Desecrate]], [[Spirit Offering]] và curse của bạn. Nó
      không phải một con số damage; nó là ba cái nút bạn không còn phải bấm,
      trên một build có điểm yếu là quá nhiều nút. Nó đi trước link vì nó đổi
      cách build chơi mà gần như không tốn gì.
  - step: Six-link, và một viên Vaal Absolution level 20 có quality
    why: >-
      Viên gem thứ sáu là [[Increased Critical Strikes Support]], một hệ số
      nhân trực tiếp cho bạn và Sentinel. Nằm dưới mấy món gem level vì thêm
      một support là khoản lợi nhỏ hơn vài gem level, và six-link thì đắt hơn.
  - step: Small cluster Enduring Composure, và block lên 75% ở cả hai phía
    why: >-
      Guide nói "ASAP" cho cây cluster. Đây là khoản mua phòng thủ đầu tiên vì
      không thứ gì về sau chạy được nếu bạn không đứng nổi trong map đỏ, và
      block là lớp đi qua cú đổi mà không thay đổi gì.
  - step: Double curse qua anoint Whispers of Doom
    why: >-
      [[Elemental Weakness]] cộng [[Conductivity]] là cách rẻ nhất để dời
      resistance của quái trước cú đổi; ghi chú trên planner gọi nó là "a
      strong DPS boost". Nó nằm thấp thế này vì bạn vứt nó đi ở level 96 — cái
      armour đặt resistance, mà curse không hạ được một giá trị đã được đặt —
      nên đừng tiêu quá tay vào nó.
  - step: Trọn cú đổi, mua cùng lúc
    why: >-
      [[Doryani's Prototype]], [[Glorious Vanity]] Xibaqua, [[Dawnbreaker]],
      [[Watcher's Eye]], ring resistance âm và chaos resistance đã cap. Hệ số
      nhân đơn lẻ lớn nhất của build, và được đặt thứ sáu có chủ ý: nó nhân
      lên những gì năm bước đầu đã dựng, và bất kỳ mảnh nào đứng một mình cũng
      không đáng gì, hoặc còn tệ hơn không có.
    cost: "Mức thứ ba của codex: 40 Divine trở lên. 3.29, chỉ từ codex, chưa kiểm chứng. Guide không đưa con số nào."
  - step: "Replica Dragonfangs' Flight với +3 cho Absolution"
    why: >-
      Thêm ba gem level cho cái chỉ số ở bước một. Guide gọi nó là "a great
      choice if you have the budget". Sau cú đổi, vì cú đổi là hệ số nhân lớn
      hơn trên mỗi đồng bỏ ra và cây amulet này chưa bao giờ rẻ.
  - step: Cái helmet seven-link
    why: >-
      Dời main skill vào helmet để sáu socket của body armour mang được nhóm
      minion. Mô tả của chính tác giả về bản level 98 là "expensive (mostly
      the helmet)". Đứng cuối vì nó tốn nhiều currency nhất cho khoản lợi nhỏ
      nhất còn lại. 3.30 nâng implicit của [[Bone Helmet]] lên 20–30%
      increased minion damage, giúp được file level 100 một chút.
play:
  mapping: |
    [[Shield Charge]] vào pack. Đó là cách bạn di chuyển, và nó tính là một cú attack, thứ giữ cho nửa attack của [[Bastion of Hope]] luôn bật.

    Cast [[Absolution]] một hai lần để cả pack bị đánh dấu. Debuff kéo dài 3 giây, nên bạn không phải tự giết thứ gì: cái gì chết trong khoảng đó đều nuôi Sentinel. Rồi charge tiếp. Mỗi cú cast cũng kích trigger của cây wand, thứ chạy [[Desecrate]], [[Spirit Offering]] và curse của bạn mà bạn không phải đụng tới, còn [[Molten Shell]] thì tự lên qua [[Automation]].

    Bấm [[Convocation]] khi bạn sang một màn hình mới, vì Sentinel sẽ ở lại để kết thúc cái chúng đã bắt đầu. Bấm [[Vaal Absolution]] khi nó sẵn sàng và có thứ đáng để dùng; sau mỗi lần dùng nó không nhận soul trong 30 giây, nên nó không phải cái nút để giữ.

    Thế giằng co có sẵn: **đứng yên là tắt phòng thủ của bạn.** Ngừng attack và cast bốn giây là bạn mất 25% block ở mỗi phía. Sau cú đổi còn cái thứ hai: vòng tròn sáu mét. Sentinel bay lên trước và đánh ở ngoài vòng đó là đang đánh kẻ địch ở mức resistance bình thường của chúng.
  bossing: |
    Quyết định trước khi vào xem [[Animate Guardian]] có đi cùng không. Nếu nó chết, gear của nó mất, và phòng boss là chỗ nó chết.

    Mở màn bằng cách cast, để trigger đưa offering và curse của bạn lên trước khi cú hit đầu tiên tới.

    Rồi cứ cast vào boss suốt cả trận. Mỗi cú hit có 25% cơ hội dựng hoặc làm mới một con Sentinel, và cú roll đó là thứ duy nhất giữ ba con Sentinel trong một căn phòng không có quái nào khác. Có [[Spell Echo Support]] thì mỗi cú cast là hai hit. Một con Sentinel sống 15 giây, nên một pha né kéo dài có thể làm bạn mất cả ba.

    Dùng [[Vaal Absolution]] khi boss đang đứng yên cho bạn: nó cần một con Sentinel đang có để ascend. Nếu trận đánh có quái nhỏ, hãy giết chúng lúc chúng bị đánh dấu.

    Sau cú đổi, ở trong vòng sáu mét. Đi ra xa cho an toàn là bỏ toàn bộ lợi ích của cái armour. Và né bằng tay: block là một cơ hội còn [[Time of Need]] là một cái đồng hồ, và không cái nào trả lời được một cú hit lớn đơn lẻ. File của chính tác giả chịu được 19,173 physical damage trong một hit và không hơn.
deaths:
  - situation: Bạn dừng lại chờ một chiêu của boss qua đi rồi chết vì cú hit thường kế tiếp
    cause: >-
      [[Bastion of Hope]] chỉ cho block khi bạn đã attack và cast trong bốn
      giây vừa qua. Đứng yên là mất 25% ở mỗi phía, trên một nhân vật có dưới
      5,000 life.
    fix: >-
      Cứ hành động trong lúc di chuyển. [[Shield Charge]] sang ngang tính là
      một cú attack; một cú cast [[Absolution]] vào khoảng không tính là một
      cú cast.
  - situation: Bạn mặc cái armour vào rồi chết ngay ở map đầu tiên
    cause: >-
      [[Doryani's Prototype]] khiến lightning resistance thôi không bảo vệ
      bạn. Thiếu mấy lớp chuyển hướng — [[Divine Flesh]], [[Dawnbreaker]],
      [[Watcher's Eye]] với [[Purity of Fire]] thật sự đang bật — bạn ăn hit
      lightning ở mức gấp bốn lần một nhân vật đã cap.
    fix: >-
      Đừng mặc nó cho tới khi từng món đã nằm trong stash. Kiểm xem Purity of
      Fire có đang bật không: modifier của viên jewel không làm gì nếu thiếu
      nó. Tránh map có extra lightning damage cho tới khi đủ bộ.
  - situation: Sau cú đổi, chaos damage và degeneration giết bạn rất nhanh
    cause: >-
      [[Divine Flesh]] biến một nửa mọi elemental damage bạn nhận thành chaos
      damage. Nếu chaos resistance chưa cap, bạn đã làm mọi cú hit elemental
      tệ hơn chứ không phải tốt hơn. File ngày đầu của tác giả nằm ở 39% chaos
      resistance; file sau cú đổi của tác giả ở 82%.
    fix: >-
      Cap chaos resistance trước khi cắm [[Glorious Vanity]]. Roll nó trên
      phần lớn các món và dùng [[The Light of Meaning]], như guide nói.
  - situation: Một cú hit lớn, khi mọi thứ đã dựng đúng
    cause: >-
      Bể máu nhỏ là do thiết kế, và sau cú đổi energy shield không còn được
      tính. Block là một cơ hội còn [[Time of Need]] là một cái đồng hồ bốn
      giây. Trước nhiều cú hit nhỏ thì chúng trung bình ra được. Trước một cú
      hit lớn thì không.
    fix: >-
      Ở mức budget này không có cách vá bằng gear. Giữ [[Molten Shell]] trên
      [[Automation]], giữ endurance charge qua [[Enduring Composure]], và học
      xem đòn nào của boss thì phải bước ra.
  - situation: Bạn đột nhiên ăn nhiều damage hơn giữa trận
    cause: >-
      [[Radiant Crusade]] gửi 20% mỗi cú hit sang life của Sentinel of
      Radiance. Nếu nó chết, lớp đó mất cho tới khi nó quay lại. Nó cũng không
      làm gì trước damage over time.
    fix: >-
      Triệu lại nó. Nó là một skill bình thường, cast mất 0.75 giây. Codex gợi
      ý một mastery cho minion life regeneration vì lý do này; tác giả thì lấy
      "Minions Leech 1% of Damage as Life" thay vào.
troubleshooting:
  - symptom: Damage của tôi trên boss thấp hơn hẳn trong map
    cause: >-
      Dáng của build là vậy. Sentinel được tạo từ quái không phải unique chết
      lúc bị đánh dấu, mà phòng boss thì không có con nào. Thứ bạn còn lại là
      25% cơ hội mỗi hit trên một kẻ địch Rare hoặc Unique.
    fix: >-
      Cast không nghỉ; đừng để Sentinel hết giờ trong lúc né; để dành
      [[Vaal Absolution]] cho lúc boss đứng yên. **Về [[The Writhing Jar]]:**
      codex nói mấy con sâu của nó chết lúc bị đánh dấu và nuôi Sentinel, và
      cây flask này đúng là có nằm trong các ô flask ở vài stage trên planner
      của tác giả. Phần chữ của tác giả không hề giải thích nó, còn món đồ thì
      ghi mấy con sâu "destroyed when Hit", nên chúng tôi không xác nhận được
      là chúng để lại cái xác mà skill nuốt được. Điều chắc chắn, từ dòng chữ
      của notable, là mỗi con sâu bạn giết là một cú roll 25% ra một Elemental
      Relic.
  - symptom: Tôi không bao giờ có đủ ba Sentinel trong map
    cause: >-
      Quái đang chết lúc không có dấu, hoặc ở ngoài vùng bạn đánh trúng.
      Debuff kéo dài 3 giây và chỉ cái chết của quái không phải unique mới
      tính.
    fix: >-
      Cast vào pack trước khi minion tới nơi, không phải sau. Lấy Minion
      Offence Mastery cho 30% minion area, thứ tác giả có từ level 22. Nếu bạn
      đang đọc lời khuyên cũ nói debuff kéo dài một giây, thì nó có từ trước
      3.28.
  - symptom: Tôi hết mana
    cause: >-
      Aura đã reserve hết bể mana và có quá ít energy shield nuôi
      [[Eldritch Battery]].
    fix: >-
      Thêm energy shield trên gear: dùng base armour với energy shield. Phương
      án lùi của guide là bỏ [[Tempest Shield]] hoặc [[Flesh and Stone]]. Tác
      giả lấy Mana Mastery cho 12% reservation efficiency.
  - symptom: Tôi mặc cái armour vào mà damage gần như không nhúc nhích
    cause: >-
      Một trong bốn chuyện. Lightning resistance của bạn chưa âm. Nó ở đúng
      0%, mức mà một con bug coi như không có hiệu lực. Bạn với Sentinel đang
      đánh cách nhau hơn sáu mét. Hoặc bạn vẫn đang chạy [[Conductivity]], thứ
      không còn hạ được một resistance mà cái armour đặt.
    fix: >-
      Gỡ lightning resistance khỏi mọi món và mua ring âm; nhắm tới −200%.
      Dùng [[Convocation]] để giữ trận đánh ngay trên người bạn. Đổi curse
      sang [[Assassin's Mark]] và [[Punishment]].
  - symptom: Mọi thứ vẫn ổn cho tới map đỏ
    cause: >-
      Từ level 70 tới cú đổi, build tăng theo từng lát chứ không theo bội số,
      trong khi map khó lên rất nhiều. Thứ còn thiếu thường là phòng thủ:
      block dưới 75%, không có endurance charge, resistance mỏng đi sau khi
      đổi gear.
    fix: >-
      Hoàn tất mấy block mastery và hai notable Sanctuary với Safeguard, lấy
      cây cluster [[Enduring Composure]], và đặt minion gem level lên wand,
      shield và helmet trước bất cứ thứ gì lạ. Đừng với tới cái armour sớm để
      chữa chuyện này. Nó làm vấn đề này tệ hơn.
  - symptom: Tooltip nói Spell Echo không làm gì cho Vaal Absolution
    cause: >-
      Đúng, và vô hại. Spell Echo không support được Vaal skill. Vaal gem cũng
      cho bạn [[Absolution]] thường, thứ nó có support, và các cú cast của
      chính Sentinel, thứ nó cũng support.
    fix: >-
      Không cần làm gì. Một độc giả của guide đã bỏ một nhân vật vì chuyện
      này; link đúng như được công bố.

patch:
  - entry: ruthless-changes
    note: >-
      **Dòng duy nhất về Guardian trong patch note 3.30 chỉ thuộc Ruthless.**
      Chuyện Elemental Relic từ [[Unwavering Crusade]] có level tối đa 80 thay
      vì 85 nằm trong phần riêng của Ruthless. PoE Wiki liệt đúng câu đó dưới
      3.23.0, cũng đánh dấu Ruthless, và PoEDB vẫn hiện mức trần 85 cho game
      thường. Nếu bạn đọc thấy aura của Guardian bị nerf league này, đó chính
      là chỗ đọc sai.
  - note: >-
      **[[Absolution]] không được nhắc tới trong patch note 3.30.** Thay đổi
      gần nhất của nó là cast time ở 3.29.0. [[Vaal Absolution]],
      [[Doryani's Prototype]], [[Dawnbreaker]], [[Divine Flesh]] và
      [[Glorious Vanity]] cũng không. Hãy đọc đó là "không tìm thấy trong
      patch note", từ các lượt dò từ khóa trên một thread 128,000 ký tự, không
      phải một lời bảo đảm.
  - entry: doryani-and-doedre
    note: >-
      **Không phải món này.** 3.30 làm lại [[Doryani's Invitation]], một cây
      belt. [[Doryani's Prototype]], cái body armour build này mặc, không có
      mục nào trong lịch sử phiên bản của nó sau 3.16.0, lúc mức sàn −200%
      resistance được đưa vào.
  - entry: no-random-league-mechanics
    note: >-
      **Abyss giờ cần một Thread.** Từ 3.29 Abyss là nguồn duy nhất của
      Abyssal Jewel và Stygian Vise, và nhân vật được công bố đeo một cây
      [[Darkness Enthroned]] đầy mấy thứ đó. Lời khuyên 3.29 là "farm Abyss"
      vẫn chỉ đúng cơ chế; chỉ là nó không còn tự xuất hiện trong map.
  - entry: item-tiers
    note: >-
      **Lẫn lộn.** Đồ rare có tier rơi dưới đất làm việc săn base armour với
      energy shield lúc đầu dễ hơn. Nhưng patch note chính thức lại lấy đúng
      base belt của build này làm ví dụ cho một base bị hạn chế: một cây
      [[Stygian Vise]] cần Item Tier 5 thì mới rơi.
  - entry: incursion-atziri-rework
    note: >-
      **[[Vaal Absolution]] có thể khó kiếm hơn lúc đầu.** Vaal side area
      không còn xuất hiện trong map. Main link dùng Vaal gem từ level 70 trên
      planner của tác giả. Gem thường chạy được trong cùng link đó cho tới khi
      bạn có một viên.
  - entry: special-base-implicits
    note: >-
      **Buff nhỏ ở tận trên đỉnh.** [[Bone Helmet]] giờ có 20–30% increased
      minion damage, tăng từ 15–20%. Chỉ file level 100 của tác giả là đội một
      cây.
  - entry: meta-crafting-costs
    note: >-
      **Cây wand và cái helmet craft có thể tốn một khoản khác.** Hai video
      craft của tác giả là từ 3.28 và 3.29. Bảo vệ prefix hoặc suffix trên một
      món weapon giờ tốn 4 Divine cộng một [[Sacred Orb]]; mấy craft mới rẻ
      hơn thì bảo vệ một modifier được chọn ngẫu nhiên.
  - entry: golem-buff-nerfs
    note: >-
      **Vặt vãnh.** [[Summon Stone Golem]] cho 16% increased defences ở chỗ
      trước đây nó cho 20%.

strengths:
  - "Chơi được từ level 12 trên một viên gem quest reward, không có unique bắt buộc nào trước level 96."
  - "Aura miễn phí của Guardian buff bạn và mọi minion cùng lúc, không tốn reservation."
  - "Phòng thủ mạnh mà không tốn currency: 75% block ở cả hai phía, một phần năm mỗi cú hit được chuyển hướng, hồi đầy máu mỗi bốn giây."
  - "Minion đánh xa: bạn đánh dấu pack rồi cứ đi tiếp."
  - "Curse và ailment bị gỡ mỗi bốn giây, nên ít mod map phải reroll."
  - "Trần rất cao. File level 97 của tác giả hiện 25.2 triệu damage mỗi giây (3.28, giả định rộng rãi)."
weaknesses:
  - "Một tác giả. Guide của tác giả mang tiêu đề 3.29 và các file planner gắn nhãn 3.28."
  - "Single-target damage phụ thuộc vào một cú roll 25% mỗi hit khi không còn gì khác để giết."
  - "Nhiều nút trước khi có trigger trên wand, và danh sách điểm yếu của chính tác giả nói minion \"can feel strange\"."
  - "Cú đổi là tất cả hoặc không gì cả và cần vài món cụ thể cùng một lúc."
  - "Sau cú đổi bạn phải đánh trong vòng sáu mét, với dưới 5,000 life và không có energy shield."
  - "Một khúc dài bằng phẳng từ level 70 tới giữa khoảng 90, nơi map vượt lên trước damage của bạn."
  - "Guide không định giá thứ gì. Mọi con số budget ở đây đều từ một tài liệu 3.29 không ghi tên tác giả."
avoidIf: >-
  Chọn build khác nếu bạn muốn tự tay giết quái chứ không phải qua minion, hoặc
  nếu bạn muốn một build không thay đổi. Đây là hai nhân vật: một summoner trâu,
  rẻ cho tới Tier 16, và một chuyên gia tầm gần sau một cú đổi đắt tiền và lắm
  công. Bỏ qua nếu mục tiêu của bạn là boss với budget nhỏ — cái vòng lặp làm
  map dễ chính là thứ một phòng boss lấy đi. Và bỏ qua bản level 96 ở hardcore.

sources:
  - title: "Mobalytics: Holy Absolution Guardian, step by step from league starter to Ubers (Ronarray)"
    url: https://mobalytics.gg/poe/builds/ronarray-holy-absolution-guardian
    kind: guide
    note: "Bản thân build. Mang tiêu đề 3.29, trang đề ngày 11/11/2026, không có chữ nào về 3.30. Nguồn của mọi setup gem theo level, các luật gear, danh sách cho cú đổi, các curse và mọi câu trích. Nó không đưa con số currency nào. Bản codex 3.29 do độc giả gửi tới, thứ bài này được đối chiếu với, nêu guide này là nguồn của chính nó; codex không có tác giả và không có URL, nên nó không được liệt kê riêng."
  - title: "Path of Building: file guide của Ronarray, mười hai cây"
    url: https://pobb.in/ivQj4_8aKaDQ
    kind: pob
    note: "Gắn nhãn 3.28. Level 97: 25,214,806 DPS, 238,456 eHP, 4,761 life, 37,327 armour, −200% lightning resistance. Config: 15% shock, hit của đồng minh là lucky, Wrath từ spectre, không chọn boss nào."
  - title: "Path of Building: nhân vật ngày đầu của Ronarray"
    url: https://pobb.in/pK1ae8LS-HDt
    kind: pob
    note: "Gắn nhãn 3.28. Level 94, không có Doryani's Prototype: 2,419,446 DPS, 108,685 eHP, 39% chaos resistance. File đo đạc duy nhất trước cú đổi."
  - title: "Path of Building: file cú đổi Doryani của Ronarray"
    url: https://pobb.in/lUcuTI0waHLG
    kind: pob
    note: "Gắn nhãn 3.28. Cùng nhân vật với file guide."
  - title: "poebuilds.cc: Even STRONGER Now! Holy Absolution Guardian, 3.29 (Ronarray)"
    url: https://www.poebuilds.cc/poe1/build/k6xZ3LckqtM
    kind: video
    note: "95,000 lượt xem, gắn tag 3.29. Chúng tôi đọc phần liệt kê gear và chỉ số trên trang, không xem video. Trang của tác giả không hiện mục 3.30 nào."
  - title: "Forum chính thức: [3.28] A Basic Absolution Guardian Guide (devon752)"
    url: https://www.pathofexile.com/forum/view-thread/3929320
    kind: thread
    note: "Phần đối chiếu độc lập. Một build khác, đơn giản hơn, không có Doryani's Prototype. Xác nhận vòng lặp cốt lõi và Radiant Crusade, Unwavering Crusade với Time of Need là ba lựa chọn đầu tiên, và liệt \"not made for Uber bosses\" là một điểm yếu."
  - title: "poebuilds.cc: [3.30] Guardian Looks Promising, SSF Absolution test run (P4RL3Y)"
    url: https://www.poebuilds.cc/poe1/build/VuK_5RzW6zE
    kind: video
    note: "Bản Absolution Guardian duy nhất gắn tag 3.30 mà chúng tôi tìm được: một nhân vật tập dượt solo self-found level 53. Bằng chứng là có người đang khởi đầu bằng nó league này, và không hơn."
  - title: "PoE Wiki: Absolution"
    url: https://www.poewiki.net/wiki/Absolution
    kind: data
    note: "Phần chữ của gem, cái luật rằng support áp lên cả spell của người chơi lẫn spell của Sentinel, hai spell và cooldown của Sentinel, và câu nói rằng Physical to Lightning Support cho chuyển đổi hoàn toàn mà không cần Triad Grip. Lịch sử phiên bản dừng ở 3.29.0."
  - title: "PoE Wiki: Doryani's Prototype"
    url: https://www.poewiki.net/wiki/Doryani%27s_Prototype
    kind: data
    note: "Bốn dòng, bán kính 6 mét, đặt-chứ-không-giảm, penetration vẫn chạy, con bug ở 0% resistance, và danh sách các cách chuyển hướng lightning damage nhận vào."
  - title: "PoEDB: Guardian"
    url: https://poedb.tw/us/Guardian
    kind: data
    note: "Nguyên văn của Radiant Crusade, Unwavering Crusade, Time of Need và Bastion of Hope."
  - title: "PoE Wiki: Summon Elemental Relic"
    url: https://www.poewiki.net/wiki/Summon_Elemental_Relic
    kind: data
    note: "25% cơ hội trigger, mỗi nguyên tố một relic, 5 giây, các giá trị aura ở level 85, và mức trần level 80 chỉ của Ruthless được liệt dưới 3.23.0."
  - title: "PoEDB: Dawnbreaker"
    url: https://poedb.tw/us/Dawnbreaker
    kind: data
    note: "10–20% cold, lightning và physical damage nhận vào thành fire, khoản phạt block cho mỗi 200 fire damage nhận vào, và nguồn rơi là Searing Exarch."
  - title: "PoEDB: Divine Flesh"
    url: https://poedb.tw/us/Divine_Flesh
    kind: data
  - title: "PoEDB: Vaal Absolution"
    url: https://poedb.tw/us/Vaal_Absolution
    kind: data
    note: "40 soul, 300% more damage và 70% less damage taken cho con Ascended Sentinel, 20 giây, 30 giây chặn nhận soul."
  - title: "PoEDB: Triad Grip"
    url: https://poedb.tw/us/Triad_Grip
    kind: data
    note: "Thay đổi của 3.29 từ màu socket sang màu của gem được cắm. Được liệt kê vì codex dựa vào nó; build không dùng món này."
  - title: "PoEDB: patch note phiên bản 3.29.0"
    url: https://poedb.tw/us/Version_3.29.0
    kind: data
    note: "Cast time của Absolution 0.65 giây, \"All Non-Spectre Minions no longer pause while attacking\", Abyss là nguồn độc quyền của Abyssal Jewel và Stygian Vise."
  - title: "Patch note chính thức 3.30.0"
    url: https://www.pathofexile.com/forum/view-thread/4013680
    kind: official
    note: "Đã tìm Absolution, Guardian, từng notable và từng món đồ. Kết quả duy nhất cho Guardian là dòng Elemental Relic, nằm dưới Ruthless-specific Changes."
