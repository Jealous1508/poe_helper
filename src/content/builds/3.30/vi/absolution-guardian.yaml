  Bạn cast một spell lightning; quái chết vì nó đứng dậy thành ba con Sentinel,
  và chính chúng mới gây damage thật. Khởi đầu không tốn gì, và một cái body
  armour ở level 96 đổi luôn bản chất của cả nhân vật.
