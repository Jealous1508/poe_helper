confidenceNote: >-
  **Ba lớp, và chúng không chắc như nhau.** (1) Phần cơ chế được kiểm từng dòng
  với PoEDB và PoE Wiki: gem [[Absolution]], cả bốn notable của Guardian, từng
  dòng của [[Doryani's Prototype]], [[Divine Flesh]], [[Dawnbreaker]] và mấy
  aura của Elemental Relic. Mấy thứ đó không có gì phải nghi ngờ. (2) Bản thân
  build là của một tác giả, Ronarray: một guide trên Mobalytics có setup cho
  từng khoảng level từ 10 tới 100. **Nó mang tiêu đề 3.29, các file Path of
  Building của nó gắn nhãn 3.28, và dù trang được chạm tới ngày 11/11/2026, nó
  không nói gì về 3.30.** Một guide 3.28 không liên quan trên forum xác nhận ba
  lựa chọn ascendancy đầu tiên và vòng lặp cốt lõi, ngoài ra không xác nhận gì
  khác. (3) Nguồn của chính chủ site cho bài này là một bản "Master Codex" 3.29
  dài, viết bằng tiếng Việt, không ghi tên tác giả, và nó nói nó được dựng từ
  guide của Ronarray. Chúng tôi dùng nó làm đầu mối và kiểm lại nó. **Nó đúng về
  Doryani's Prototype, và sai hoặc đã lỗi thời ở chín điểm**, liệt kê ở mục
  "Những chỗ codex sai" bên dưới — trong đó có cả phần bổ sung nổi bật nhất của
  nó, [[Triad Grip]], thứ build không cần. Những phần chỉ dựa vào riêng codex,
  và được đánh dấu ở chỗ chúng xuất hiện: ba mức budget, thứ tự của Labyrinth
  thứ ba và thứ tư, danh sách gear cho Animate Guardian, các notable trên large
  cluster và thứ tự an toàn cho cú đổi. Bốn điểm rating là của chúng tôi. Chưa
  có dữ liệu ladder hay dữ liệu giá nào cho 3.30.
modes:
  ssf: >-
    Ổn cho tới map Tier 16: trước cú đổi không có unique nào là bắt buộc, và có
    một lần chạy thử 3.30 đúng kiểu này (P4RL3Y, solo self-found, level 53) đã
    được đăng. Bản level 96 thì là chuyện khác. [[Doryani's Prototype]] rơi
    được ở bất cứ đâu, nhưng [[Dawnbreaker]] là đồ rơi từ Searing Exarch,
    [[Watcher's Eye]] cần đúng một modifier cụ thể, và [[Glorious Vanity]] phải
    là loại Xibaqua. **Không nguồn nào bàn tới cú đổi trong solo self-found**;
    hãy tính chuyện ở lại bản trước cú đổi một thời gian dài.
  hardcore: >-
    Không nguồn nào khuyên chơi. Trước cú đổi thì dáng build hợp lý: 75% block
    cả attack lẫn spell, một con minion nhận một phần năm mỗi cú hit, và hồi
    đầy máu mỗi bốn giây. Sau cú đổi, bạn đứng trong vòng sáu mét với mọi thứ,
    với khoảng 4,800 life, không có energy shield và maximum physical hit là
    19,000 trong chính file của tác giả. Cách đọc của chúng tôi: chỉ chơi bản
    trước cú đổi.

idea: |
  [[Absolution]] là một spell đánh dấu những gì nó đánh trúng. Nếu một con quái normal, magic hoặc rare chết trong lúc bị đánh dấu, xác của nó bị nuốt và một con **Sentinel of Absolution** đứng dậy thế chỗ. Bạn có được ba con. Mỗi con sống 15 giây, và mỗi cú giết có dấu tiếp theo làm mới một con trong số đó.

  Mấy con Sentinel chính là build. Chúng tự cast spell lightning của riêng chúng, và qua mấy act đầu rồi thì phần lớn việc giết là của chúng. Việc của bạn là cast liên tục để pack luôn bị đánh dấu và ba con Sentinel không bao giờ hết giờ.

  [[Guardian]] thêm ba thứ mà không ascendancy nào khác cho rẻ như vậy: một con minion vệ sĩ vĩnh viễn nhận 20% mỗi cú hit nhắm vào bạn, mấy aura miễn phí buff bạn và Sentinel cùng lúc, và một lần hồi đầy máu mỗi bốn giây.

  Rồi, ở khoảng level 96, build đổi dáng. [[Doryani's Prototype]] khiến mọi kẻ địch trong vòng sáu mét có lightning resistance bằng với của bạn — nên bạn đẩy lightning resistance của chính mình xuống −200% và mọi thứ gần bạn ăn gấp ba lightning damage. Cái giá là toàn bộ phòng thủ của bạn phải dựng lại trong một lần ngồi, và từ đó trở đi bạn phải đứng gần.

chain:
  - label: Cast
    text: "[[Absolution]] đánh một vùng và để lại một debuff trên mọi kẻ địch trong 3 giây."
  - label: Giết lúc còn dấu
    text: "Một kẻ địch không phải unique chết khi đang dính debuff sẽ thành một con Sentinel of Absolution. Tối đa ba con, mỗi con 15 giây; giết thêm thì làm mới một con."
  - label: Sentinel cast
    text: "Mỗi con Sentinel có hai spell lightning của riêng nó. Mọi support trong link Absolution của bạn mà áp được lên spell của minion thì cũng áp lên spell của chúng."
  - label: Guardian nuôi chúng
    text: "[[Unwavering Crusade]] triệu Elemental Relic mang aura Anger, Hatred và Wrath. Aura tới được đồng minh, nên Sentinel cũng nhận."
  - label: Sống sót
    text: "75% block attack lẫn spell, 20% mỗi cú hit được chuyển sang Sentinel of Radiance, armour, và [[Time of Need]] hồi đầy máu cho bạn mỗi 4 giây."

chainDetails:
  - title: Vòng lặp có một lỗ hổng, và đó là phòng boss
    body: |
      Mọi thứ ở trên đều dựa vào chuyện có thứ gì đó không phải unique chết trong lúc bị đánh dấu. Trong map thì chuyện đó xảy ra liên tục: giết thì ra Sentinel, Sentinel thì giết tiếp. Đó là một vòng lặp tự nuôi mình, và là lý do clear thấy mạnh hơn nhiều so với con số gợi ra.

      Một con boss đứng một mình trong phòng thì phá vòng đó. Không gì chết, nên không có xác nào bị nuốt. Gem che chỗ này bằng một dòng: **25% cơ hội triệu một con Sentinel khi đánh trúng một kẻ địch Rare hoặc Unique.** Đó là cách duy nhất để dựng hoặc làm mới Sentinel trên một con boss lẻ, và nó chỉ roll khi *bạn* đánh trúng. Nên đánh boss thì bạn không bao giờ ngừng cast.

      Công cụ thứ hai là [[Vaal Absolution]]. Nó "ascend" một con Sentinel bạn đang có: 300% more damage, 70% less damage taken, 20 giây, và không tính vào giới hạn ba con. Nó tốn 40 soul và khóa việc nhận soul trong 30 giây sau đó.

      Cái thứ ba thì còn tranh cãi — xem [[The Writhing Jar]] ở mục "Nếu thấy có gì đó sai sai".
  - title: "Support của bạn cũng support luôn cho Sentinel"
    body: |
      Đây là cái luật quyết định cả link gem, và bản codex do độc giả gửi tới nói ngược lại.

      Câu chữ của PoE Wiki: bất kỳ support gem nào áp được cho cả spell lẫn minion skill thì áp cho **cả hai**, cú cast của bạn và spell của Sentinel. Ví dụ của chính Wiki là [[Spell Echo Support]], thứ khiến Sentinel lặp lại cú cast của chúng cũng như bạn.

      Hai hệ quả:

      - [[Physical to Lightning Support]] chuyển đổi damage của Sentinel, không chỉ của bạn. Gem vốn đã chuyển 50% physical damage thành lightning cho "this Spell and Minions"; support chuyển nốt phần còn lại. Wiki nói thẳng ra rằng như vậy là chuyển đổi hoàn toàn **mà không cần [[Triad Grip]]**.
      - [[Minion Damage Support]] là support duy nhất chỉ giúp Sentinel. Mọi thứ khác trong link được công bố — Spell Echo, [[Concentrated Effect Support]], [[Increased Critical Damage Support]] — đều chạy ở cả hai phía.

      Sentinel có cast time gốc 1.33 giây và 6% critical strike chance gốc. Spell thứ hai của chúng, Empowered Lightning Blast, có cooldown 6 giây và có hai vùng cùng đánh trúng được một mục tiêu. Cái cooldown đó là lý do bonus quality của gem lẫn Minion Offence Mastery đều cho minion cooldown recovery.
  - title: Guardian thật sự cho gì, bằng con số
    body: |
      Đọc từ PoEDB và PoE Wiki, không phải từ một guide.

      - **[[Radiant Crusade]].** Cấp một con Sentinel of Radiance level 20, và "20% of Damage from Hits is taken from your Sentinel of Radiance's Life before you". Con Sentinel này là vĩnh viễn từ 3.28, level của nó đi theo level của bạn tới 85, nó taunt, và nó đốt kẻ địch trong vòng 4 mét với 20% maximum life của chính nó mỗi giây. Để ý chữ "from Hits": nó không làm gì trước damage over time.
      - **[[Unwavering Crusade]].** 25% cơ hội trigger một Elemental Relic level 20 khi bạn hoặc một đồng minh ở gần giết một kẻ địch, hoặc đánh trúng một con Rare hay Unique. Mỗi nguyên tố một relic, mỗi cái 5 giây, được lần trigger kế làm mới. Ở nhân vật level 85, các relic cho: Anger, 182–259 added fire damage cho attack và spell; Hatred, 43% physical damage as extra cold; Wrath, 26–415 added lightning cho attack và **23% more spell lightning damage**. Tức là mỗi cái xấp xỉ một aura level 27, không tốn reservation.
      - **[[Time of Need]].** Mỗi 4 giây: gỡ curse và ailment, và regenerate 100% life trong một giây. Từ 3.28 nó gỡ mọi ailment, không chỉ elemental ailment.
      - **[[Bastion of Hope]].** +25% chance to block attack nếu bạn vừa attack gần đây, +25% block spell nếu bạn vừa cast spell gần đây, cho bạn và đồng minh ở gần. "Recently" nghĩa là bốn giây vừa qua.

      Không cái nào trong bốn tự nó là một hệ số nhân damage. Guardian là hạ tầng, và build này là thứ dùng hết chỗ hạ tầng đó.
  - title: "Doryani's Prototype, từng dòng một"
    body: |
      Một cây Saint's Hauberk, level 67. Bốn dòng đặc biệt của nó, nguyên văn từ PoEDB, và mỗi dòng bắt bạn trả giá gì:

      - **"Nearby Enemies have Lightning Resistance equal to yours."** Kẻ địch trong vòng 6 mét lấy giá trị trên character sheet của bạn. Resistance không xuống dưới −200% được, nên −200% là mục tiêu. Vì giá trị này được *đặt*, curse và exposure không đẩy nó thấp hơn được; penetration thì vẫn chạy, dù Wiki ghi chú rằng ở mức giới hạn đó nó thường là một lựa chọn yếu.
      - **"Lightning Resistance does not affect Lightning Damage taken."** Bạn ăn lightning damage như thể có 0% resistance — không phải −200%. Vậy vẫn là gấp bốn lần mức một nhân vật đã cap phải ăn.
      - **"Armour also applies to Lightning Damage taken from Hits."** Câu trả lời của chính món đồ cho dòng ở trên. Chỉ với hit, không với lightning damage over time.
      - **"Deal no Non-Lightning Damage."** Một cái luật về *bạn*. Absolution của bạn phải được chuyển đổi hoàn toàn, nên [[Physical to Lightning Support]] không phải thứ tùy chọn.

      Một cái bẫy từ Wiki mà không guide nào nhắc: **ở đúng 0% lightning resistance thì dòng đầu tiên không làm gì cả**, do một con bug. Mặc cái armour vào trước khi có ring resistance âm không cho bạn "một bản nhỏ hơn" của bonus. Nó có thể chẳng cho bạn gì.
  - title: Cú đổi thật sự lớn cỡ nào
    body: |
      Con số nổi bật nhất của codex là damage tăng gấp năm: một con quái map ở 40% lightning resistance ăn 0.6 damage của bạn, và ở −200% thì nó ăn 3.0.

      Phép tính đó đúng, còn phép so sánh thì không. Trước cú đổi bạn vốn đã curse bằng [[Elemental Weakness]] và [[Conductivity]], nên con quái không ở mức 40% lúc bạn bắt đầu. **Cách đọc của chúng tôi:** bước nhảy thật thì nhỏ hơn gấp năm trên quái thường, thứ mà curse của bạn vốn đã với tới, và gần con số đó hơn trên boss, thứ gạt đi phần lớn hiệu lực của curse mà không gạt được cái armour.

      Các file của chính tác giả là phép đo trước-và-sau duy nhất, và chúng là 3.28: một nhân vật ngày đầu level 94 ở **2.42 triệu** damage mỗi giây và 108,685 effective hit point, và nhân vật Doryani level 97 ở **25.2 triệu** và 238,456. Khoảng cách đó là cú đổi *cộng với* ba level, một cây amulet +3, cluster jewel và spectre. Planner tính 15% shock, "Nearby Allies' Damage with Hits is Lucky" và Wrath của một con spectre không tốn reservation, và không chọn boss nào.
  - title: Vì sao Eldritch Battery, và vì sao armour hybrid
    body: |
      [[Eldritch Battery]] khiến energy shield bảo vệ mana thay vì life, và tiêu nó trước mana cho skill cost. Câu của guide là khi đó bạn "need only 1 mana to play", và đó là thứ cho phép bạn reserve gần như mọi thứ cho aura.

      Sau cú đổi, nó không còn là một tiện nghi nữa. [[Divine Flesh]] ghi "All Damage taken bypasses Energy Shield", nên energy shield vô giá trị với tư cách một bể máu, và công dụng duy nhất còn lại của nó là làm nhiên liệu. Đó là lý do mọi món giáp trong các set được công bố đều là hybrid armour với energy shield: armour bảo vệ bạn, energy shield trả tiền cho việc cast.
  - title: Những chỗ codex sai
    body: |
      Tài liệu nguồn của chủ site được làm cẩn thận và tự công khai liệt kê năm điều mà một bản nháp trước của chính nó đã sai. Đối chiếu nó với PoEDB, PoE Wiki và cái guide mà nó nói nó dựa vào thì tìm ra thêm. **Nếu bạn đã đọc codex, đây là các điểm đính chính:**

      1. **Thời lượng.** Nó ghi debuff là 1 giây và Sentinel là 10 giây. Đó là các giá trị từ trước 3.28. Debuff là 3 giây và Sentinel sống 15 giây.
      2. **[[Triad Grip]].** Nó gọi đôi gloves này là "điểm bổ sung quan trọng nhất" và nói thiếu nó thì một nửa damage của Sentinel vẫn là physical. Wiki nói Physical to Lightning Support vốn đã cho chuyển đổi hoàn toàn, và setup level 96 của guide đeo Paladin Gloves rare. Triad Grip không có trong bất kỳ file nào của tác giả.
      3. **Support nào tới được Sentinel.** Nó nói Spell Echo, Concentrated Effect và các support added damage "không chạm vào" Sentinel. Chúng có áp lên Sentinel.
      4. **Elemental Relic.** Nó đọc [[Unwavering Crusade]] là chắc chắn ra relic khi giết và 25% khi hit. Cả hai đều là 25%.
      5. **Time of Need.** Nó ghi elemental ailment. Từ 3.28 là mọi ailment.
      6. **Base item.** Nó nêu Saintly Chainmail. Doryani's Prototype là một cây Saint's Hauberk.
      7. **Không có ring thì "vẫn lợi, nhưng chỉ ~1.7× thay vì 5×".** Ở đúng 0% resistance, con bug nói trên nghĩa là bạn có thể không được gì.
      8. **Lightning Penetration sau cú đổi.** Về cơ chế thì nó chạy; Wiki gọi nó là một lựa chọn thường yếu ở mức giới hạn, và tác giả không dùng nó.
      9. **"Skill DPS tham chiếu" khoảng 390,000 ở level 96.** Chúng tôi không lần ra được nguồn của con số này. Planner của tác giả hiện tổng cộng 25.2 triệu.

      Những gì nó nói đúng, mà phần lớn guide không nói rõ ra: bốn dòng của Doryani's Prototype và hệ quả của chúng, logic của Divine Flesh với Eldritch Battery, chuyện resistance được đặt chứ không phải bị giảm, bán kính sáu mét, và mọi dòng patch note 3.29 mà nó trích.

mandatory:
  - term: Absolution
    why: >-
      Bản thân skill. Quest reward của Templar cho The Siren's Cadence ở Act 1,
      dùng được từ level 12. Gem level là thứ lớn nhất bạn kiểm soát được: life
      và damage gốc của Sentinel tăng theo nó.
    detail: >-
      Từ 3.29 cast time là 0.65 giây, giảm từ 0.75. Từ 3.28 debuff kéo dài 3
      giây và Sentinel sống 15 giây. Cả gem lẫn bản Vaal của nó đều không được
      nhắc tới trong patch note 3.30.
  - term: Physical to Lightning Support
    why: >-
      Chuyển nửa damage còn lại thành lightning, cho bạn và cho Sentinel. Có
      trong link từ level 22 trên planner của tác giả, và là bắt buộc một khi
      [[Doryani's Prototype]] chặn bạn gây bất cứ thứ gì không phải lightning.
  - term: Minion Damage Support
    why: >-
      More minion damage. Support duy nhất trong link chỉ chạy cho Sentinel, mà
      damage thì nằm ở đó.
  - term: Spell Echo Support
    why: >-
      Lặp lại cú cast của bạn và cú cast của Sentinel. Có trong link được công
      bố từ level 40 trở đi, và ở tier cao nhất thì là
      [[Greater Spell Echo Support]].
    detail: >-
      Nó không support được Vaal skill, chuyện làm những ai thấy nó link với
      [[Vaal Absolution]] phải lo. Một Vaal gem cũng cấp luôn skill thường, và
      Spell Echo support cái đó cùng với Sentinel.
  - term: Radiant Crusade
    why: >-
      Một vệ sĩ vĩnh viễn nhận 20% mỗi cú hit trước bạn, và gánh campaign bằng
      aura đốt của nó.
  - term: Unwavering Crusade
    why: >-
      Aura Anger, Hatred và Wrath miễn phí từ Elemental Relic, cho bạn và mọi
      minion. Riêng relic Wrath đã là 23% more spell lightning damage.
  - term: Time of Need
    why: >-
      Hồi đầy máu trong một giây, mỗi bốn giây, và mỗi lần như vậy nó gỡ luôn
      curse với ailment. Đây chính là phần hồi phục; build không có leech và
      không có động cơ flask nào.
  - term: Bastion of Hope
    why: >-
      +25% attack block khi bạn vừa attack gần đây và +25% spell block khi bạn
      vừa cast gần đây. Mảnh cuối cùng của 75% và 75%.
    detail: >-
      Đó là lý do [[Shield Charge]] có mặt trong mọi setup từ level 22: ghi chú
      trên planner của tác giả nói dùng nó cho điều kiện "attacked recently".
      Ngừng di chuyển và ngừng cast bốn giây là block biến mất.
  - term: Eldritch Battery
    why: >-
      Energy shield trả tiền cho spell của bạn, nên mana reserve được cho aura.
      Lấy trước level 70 trên planner. Bắt buộc một khi [[Divine Flesh]] khiến
      energy shield vô dụng với mọi việc khác.
  - term: Convocation
    why: >-
      Kéo mọi minion về chỗ bạn. Sentinel hay lang thang đi kết thúc mấy trận
      đánh cũ; đây là cách bạn đem damage tới pack kế, và tới vòng sáu mét
      quanh bạn sau cú đổi.
  - term: Shield Charge
    why: >-
      Di chuyển, và là cú attack giữ cho phần attack block của
      [[Bastion of Hope]] luôn bật.
  - term: Vaal Absolution
    level: recommended
    why: >-
      Ascend một con Sentinel đang có: 300% more damage trong 20 giây, nằm
      ngoài giới hạn ba con. Có trong main link của mọi setup từ level 70.
    detail: >-
      Là gem corrupted, nên level và quality của nó không đổi được sau khi bạn
      có nó. 3.30 bỏ Vaal side area khỏi map, vốn là chỗ Vaal gem hay rơi nhất.
      Corrupt một viên Absolution bằng [[Vaal Orb]] là cách làm ra nó có từ
      lâu; chúng tôi không xác nhận được nguồn phổ biến hiện giờ là gì.
  - term: Enduring Composure
    level: recommended
    why: >-
      Một notable trên small cluster jewel, cho endurance charge khi bạn bị
      hit. Guide nói lấy nó "ASAP", trong khoảng level 70 tới 90.
  - term: Elemental Weakness
    level: recommended
    why: >-
      Cùng với [[Conductivity]], đây là double curse trước cú đổi, qua anoint
      [[Whispers of Doom]]. Ghi chú trên planner gọi double curse là "a strong
      DPS boost". Cả hai đều bị bỏ ở cú đổi.
  - term: Spirit Offering
    level: recommended
    why: >-
      Được kích bằng craft "Trigger a Socketed Spell when you Use a Skill" trên
      wand, cùng [[Desecrate]] để tạo xác. Tác giả dùng nó ở mọi stage từ
      level 70.
  - term: Raise Spectre
    level: recommended
    why: >-
      Không phải để lấy damage. Link với [[Feeding Frenzy Support]] để buff tới
      được mọi minion của bạn. Guide nói con spectre phòng thủ nào cũng được,
      và nếu bạn chưa quen spectre thì dùng một con [[Summon Stone Golem]] thay
      vào.
  - term: Doryani's Prototype
    level: recommended
    why: >-
      Bản level 96. Đặt lightning resistance của mọi thứ trong vòng sáu mét
      bằng với của bạn. Không phải món của tuần đầu và cũng không phải món bắt
      buộc: build tới được map Tier 16 mà không cần nó.
  - term: Divine Flesh
    level: recommended
    why: >-
      Một nửa mọi elemental damage nhận vào thành chaos, +5% maximum chaos
      resistance. Đến từ một viên [[Glorious Vanity]] Xibaqua. Bắt buộc khi mặc
      cái armour, vô dụng nếu chaos resistance chưa cap.
  - term: Dawnbreaker
    level: recommended
    why: >-
      10–20% cold, lightning và physical damage nhận vào thành fire. Guide muốn
      roll lightning và cold ở mức 18–20%. Một phần của cú đổi.
    detail: >-
      PoEDB còn liệt kê một dòng mà cả guide lẫn codex đều bỏ qua: nó mất 1%
      attack block cho mỗi 200 fire damage nhận từ hit trong bốn giây vừa qua.
      Một cái shield có nhiệm vụ biến damage thành fire damage lại tự làm yếu
      block của chính nó trong lúc làm việc đó.

labs:
  - lab: Normal
    node: Radiant Crusade
    why: "Quanh level 33 trên planner của tác giả. Sentinel of Radiance tới và lo phần lớn việc giết trong mấy act kế tiếp. Được xác nhận bởi file của tác giả và bởi một guide 3.28 không liên quan."
  - lab: Cruel
    node: Unwavering Crusade
    why: "Elemental Relic bắt đầu xuất hiện khi giết quái: ba hiệu ứng aura không tốn reservation. Cùng hai nguồn đó."
  - lab: Merciless
    node: Time of Need
    why: "Hồi đầy máu mỗi bốn giây. Guide không liên quan kia cũng xếp nó thứ ba. Chuyện nó đi trước Bastion of Hope trong thứ tự của chính tác giả thì dựa vào codex."
  - lab: Eternal
    node: Bastion of Hope
    why: "Hoàn tất 75% block ở cả hai phía. Ghi chú trên planner của tác giả về Shield Charge và \"attacked recently\" cho thấy tác giả có lấy nó; còn thời điểm là của codex."

stages:
  - id: acts-1-3
    phase: early
    image: rolling-magma
    title: Act 1–3
    levels: Level 1–33
    uses: >-
      [[Rolling Magma]] tới level 12–14, rồi [[Absolution]] cho hết phần còn
      lại của game. [[Holy Flame Totem]] và [[Flame Wall]] ở lại trên thanh
      skill làm damage phụ suốt Act 1.
    changes: >-
      Ở 12–14 bạn đổi main skill. Tới cuối Act 2, link là Absolution với
      [[Physical to Lightning Support]], và [[Shield Charge]] với
      [[Herald of Purity]] đã vào. Normal Labyrinth, quanh level 33, cho bạn
      Sentinel of Radiance.
    links:
      - name: Level 10, Brutus
        gems: [Rolling Magma, Added Lightning Damage Support, Combustion Support]
      - name: Level 14, Merveil
        gems: [Absolution, Added Lightning Damage Support, Added Fire Damage Support]
      - name: Level 22, cuối Act 2
        gems: [Absolution, Physical to Lightning Support, Added Lightning Damage Support]
      - name: Level 33, four-link
        gems: [Absolution, Added Lightning Damage Support, Physical to Lightning Support, Added Fire Damage Support]
      - name: Damage phụ ở Act 1
        gems: [Holy Flame Totem, Flame Wall, Elemental Proliferation Support]
      - name: Utility
        gems: [Shield Charge, Frostblink, Herald of Purity, Vitality, Clarity]
    moveOn: "Absolution đã nằm trong four-link, bạn đã có Radiant Crusade, và Act 3 đã xong."
    details:
      - title: Mười hai level đầu
        body: |
          Chữ của guide: mở đầu bằng [[Rolling Magma]], với [[Elemental Proliferation Support]] trước, rồi đổi sang [[Combustion Support]] và [[Added Lightning Damage Support]] "ASAP". Thêm [[Vitality]] và [[Clarity]] "to make leveling more comfortable".

          "Once you reach level 12-14 you can swap to Absolution. It will be your main skill from now on." Giữ cái totem với bức tường thêm một lúc; chúng vẫn cộng damage.

          Ở khúc này bạn là người giết. Sentinel còn yếu và chuyện có đủ ba con chưa phải mặc nhiên. Vậy là bình thường, và đó là lý do khúc này chưa cho thấy build là gì.
      - title: Passive point lúc lên level
        body: |
          Guide đăng một cây cho từng khoảng level, nhưng chỉ có các lựa chọn mastery là hiện ra dưới dạng chữ. Minion Offence Mastery đầu tiên là "Minions have 25% chance to gain Unholy Might for 4 seconds on Kill" ở level 14, tới level 22 thì đổi sang "Minions have 30% increased Area of Effect". Một Life Mastery cho +30 maximum life được lấy trước level 45.

          **Một chỗ trống mà chính độc giả của guide chỉ ra:** không có cây nào giữa level 45 và level 70. Một người bình luận hỏi xin và không được trả lời. Còn lộ trình cụ thể thì hãy import file Path of Building của tác giả, có link ở mục Nguồn — nó mang mười hai cây.
      - title: Bandit
        body: |
          Guide: "Get rid of all, or Alira early and swap later." +15% tất cả resistance của Alira là lý do để giúp bà ấy khi gear của bạn còn tệ. Nhân vật hoàn chỉnh thì đã giết cả ba.
      - title: Chuỗi tìm kiếm cho vendor
        body: |
          Tác giả đăng một chuỗi tìm kiếm cho cửa sổ vendor, nó làm nổi mấy socket đã link có màu dùng được và boots có movement speed. Nó dài, nên hãy copy từ guide của tác giả chứ đừng copy từ đây.
  - id: acts-4-10
    phase: early
    image: zealotry
    title: Act 4–10
    levels: Level 33–70
    uses: >-
      [[Absolution]] trong một four-link, có [[Spell Echo Support]] từ level
      40. [[Zealotry]] là aura thật sự đầu tiên, [[Elemental Weakness]] là
      curse đầu tiên, và một con [[Summon Stone Golem]] với
      [[Feeding Frenzy Support]] vào ở 45.
    changes: >-
      Cruel Labyrinth cho Elemental Relic. Từ đây Sentinel và Sentinel of
      Radiance lo phần lớn công việc, còn bạn đi theo chúng. Resistance tụt 30%
      sau Act 5 và tụt lần nữa sau Act 10.
    links:
      - name: Level 40, Malachai
        gems: [Absolution, Spell Echo Support, Physical to Lightning Support, Added Lightning Damage Support]
      - name: Level 45, Kitava
        gems: [Absolution, Physical to Lightning Support, Spell Echo Support, Added Fire Damage Support]
      - name: Buff cho minion
        gems: [Summon Stone Golem, Feeding Frenzy Support]
      - name: Aura và curse
        gems: [Zealotry, Herald of Purity, Clarity, Elemental Weakness]
      - name: Di chuyển
        gems: [Shield Charge, Frostblink]
    moveOn: "Act 10 đã xong, elemental resistance của bạn về lại 75%, và bạn đã có Time of Need hoặc chỉ còn cách nó một Labyrinth."
    details:
      - title: Vì sao Zealotry chứ không phải một aura damage thứ hai
        body: |
          [[Zealotry]] cho more spell damage cho bạn **và đồng minh ở gần**. Sentinel cast spell, nên chúng nhận trọn. Cùng logic đó là lý do Elemental Relic quan trọng tới vậy ở đây: một cái aura trên build minion thì trả tiền một lần và mọi thứ bạn có đều nhận.
      - title: Đi theo minion, và gọi chúng về
        body: |
          Sentinel of Radiance taunt và đốt; Sentinel of Absolution cast từ xa. Bạn cast vào từng pack để đánh dấu nó rồi cứ đi tiếp.

          Minion tụt lại phía sau và kẹt lại để kết thúc mấy trận đánh cũ. [[Convocation]] đem chúng về chỗ bạn. Ghi chú trên planner của tác giả chỉ đơn giản là nó "pulls minions to you for faster clearing". Đặt nó vào một phím bạn thật sự sẽ bấm.
      - title: Trước boss Act 10
        body: |
          Cap resistance cho cú phạt 30% thứ hai trước khi vào map, và bắt đầu thay các món armour thuần bằng hybrid armour với energy shield. Bạn sắp lấy [[Eldritch Battery]] và nó cần energy shield.

          Đây là lời khuyên campaign chung cộng với luật gear của guide ("at least a few of those also should have hybrid ES"); checklist level 70 của codex thêm mức tối thiểu 3,000 life, đó là con số của riêng nó.
  - id: early-maps
    phase: early
    image: eldritch-battery
    title: Map đầu
    levels: Map trắng và map vàng, level 70+
    uses: >-
      [[Vaal Absolution]] trong một five-link, [[Eldritch Battery]], ba aura
      trong helmet, một nhóm spectre với [[Feeding Frenzy Support]], và
      offering với curse được một craft trên wand kích.
    changes: >-
      Link quay sang crit với [[Increased Critical Damage Support]].
      [[Determination]] và [[Flesh and Stone]] vào cùng [[Zealotry]]. Block bắt
      đầu có ý nghĩa: Shield mastery và Block mastery được lấy ở đây.
    links:
      - name: Main skill (five-link)
        gems: [Vaal Absolution, Minion Damage Support, Physical to Lightning Support, Spell Echo Support, Increased Critical Damage Support]
      - name: Spectre và golem
        gems: [Raise Spectre, Feeding Frenzy Support, Minion Life Support, Summon Stone Golem]
      - name: Aura
        gems: [Determination, Zealotry, Flesh and Stone]
      - name: Wand, được trigger
        gems: [Elemental Weakness, Desecrate, Spirit Offering]
      - name: Tự động
        gems: [Convocation, Molten Shell, Automation]
      - name: Di chuyển
        gems: [Frostblink, Shield Charge, Vitality]
    moveOn: "ba aura chạy mà không bỏ đói mấy cú cast của bạn, block của bạn gần 75% ở cả hai phía, và bạn clear map vàng mà không chết vì mấy cú hit thường."
    details:
      - title: Chỉ số duy nhất quan trọng trên gear
        body: |
          Trích nguyên, vì guide lặp lại nó ở ba stage: "The stat that will give you the most damage is + Level to minion skills. Make sure to have it on Wand, Shield and Helmet."

          Cho tới khi bạn mua nổi mấy món đó, guide gợi ý [[Leer Cast]] như "a cheap damage bonus for your minions" ở ô helmet, để rồi thay bằng một cái rare có minion gem level "as soon as you can afford it".

          Trên wand, tìm thêm +1 cho mọi spell, lightning hoặc physical skill gem, rồi tới minion damage, trong đó crit và speed được xếp cao nhất. **Chừa trống một suffix** cho craft bench "Trigger a Socketed Spell when you Use a Skill".
      - title: Phần phòng thủ bạn đang dựng
        body: |
          Guide gọi block là "a key defensive layer" và bảo bạn đầu tư vào hai notable Sanctuary và Safeguard khi có thể. Hai mastery lo phần lớn chỗ còn lại: "+1% Chance to Block Attack Damage per 5% Chance to Block on Equipped Shield" và "+1% Chance to Block Spell Damage per 5% Chance to Block Attack Damage".

          [[Flesh and Stone]] thì để ở **Sand Stance**. Guide nói "always".

          Endurance charge đến từ một cây small cluster jewel [[Enduring Composure]], thứ guide muốn có trong khoảng level 70 tới 90.
      - title: Nếu hết mana
        body: |
          Từ guide: có [[Eldritch Battery]] thì "you will need only 1 mana to play". Nếu vẫn thiếu, "dropping [[Tempest Shield]] or [[Flesh and Stone]] is a valid option".

          Trên thực tế, cách chữa là thêm energy shield trên gear, và đó là lý do mấy cái base hybrid quan trọng.
      - title: Kiếm currency trong 3.30
        body: |
          Lời khuyên farm của codex là Abyss, để lấy jewel và base belt mà build này muốn. Trong 3.29 Abyss trở thành nguồn duy nhất của Abyssal Jewel và Stygian Vise, và chuyện đó vẫn đúng.

          Cái đã đổi là đường vào. Trong 3.30 Abyss không còn tình cờ xuất hiện trong map: nó cần một Thread, và mấy cái miễn phí đến từ map bên trong một Abyss Shaped Region. Một cây [[Stygian Vise]] giờ cũng cần Item Tier 5 thì mới rơi.
  - id: red-maps
    phase: endgame
    image: determination
    title: Map đỏ, trước cú đổi
    levels: Map Tier 11–16, level 90+
    uses: >-
      Bản hoàn chỉnh đầu tiên. [[Vaal Absolution]] trong một six-link với hai
      support crit, bốn aura, double curse [[Elemental Weakness]] và
      [[Conductivity]], và gear rare có minion gem level trên wand, shield và
      helmet.
    changes: >-
      [[Increased Critical Strikes Support]] là viên gem thứ sáu.
      [[Tempest Shield]] thành aura thứ tư để lấy block. Curse thứ hai đến từ
      anoint [[Whispers of Doom]], và Minion Offence Mastery "Minions Penetrate
      8% of Cursed Enemies' Elemental Resistances" được lấy để đi cùng nó.
      **Đây là bản để ở lại cho tới khi bạn mua nổi trọn cú đổi.**
    links:
      - name: Main skill (six-link)
        gems: [Vaal Absolution, Minion Damage Support, Physical to Lightning Support, Spell Echo Support, Increased Critical Damage Support, Increased Critical Strikes Support]
      - name: Spectre và golem
        gems: [Raise Spectre, Feeding Frenzy Support, Minion Life Support, Summon Stone Golem]
      - name: Aura
        gems: [Determination, Zealotry, Flesh and Stone, Tempest Shield]
      - name: Wand, được trigger
        gems: [Elemental Weakness, Desecrate, Spirit Offering]
      - name: Tự động
        gems: [Convocation, Molten Shell, Automation, Shield Charge]
      - name: Curse thứ hai và di chuyển
        gems: [Conductivity, Frostblink]
    moveOn: "bạn farm map Tier 16 mà không chết, và từng món của cú đổi đã nằm sẵn trong stash."
    details:
      - title: Bản này tốn gì và làm được gì
        body: |
          File đo đạc duy nhất gần stage này là nhân vật ngày đầu level 94 của tác giả, từ 3.28: **2.42 triệu** damage mỗi giây với giả định 15% shock, 4,732 life, 28,382 armour, 108,685 effective hit point, resistance 79/80/79 và 39% chaos. Toàn gear rare, một cái spirit shield, không có Doryani's Prototype.

          Codex đặt stage này ở mức 2–15 Divine. **Đó là con số 3.29 từ một nguồn chúng tôi không kiểm được.** Chữ của tác giả cho cả build là "not very expensive to setup".

          Chỉ dẫn của chính tác giả trên trang endgame là "go for the 90+ T16 version before you can afford most stuff in this one".
      - title: Spectre và Animate Guardian
        body: |
          Quan điểm của guide: socket trên gloves chứa "a supportive setup with additional minions. It can be Spectres, Golem or Animated Guardian if you have a budget for it." Spectre nào, và con guardian mặc gì, thì nằm trong một video riêng mà chúng tôi không xem. Có một dòng còn lại dưới dạng chữ: "Always buy Tiger LAST because it is expensive."

          Codex lấp chỗ trống này bằng một bộ đồ đầy đủ cho [[Animate Guardian]] — Kingmaker, Garb of the Ephemeral, Leer Cast, Southbound hoặc Meginord's Vise, Victario's Flight — và cái luật quan trọng với bất kỳ bộ nào: **khi con guardian chết, mọi thứ nó mặc mất hết.** Bộ đồ đó là của codex, không phải của tác giả, và chúng tôi chưa đối chiếu nó với video của tác giả. Còn cái luật thì đơn giản là cách gem hoạt động.

          Hai chuyện độc giả của guide báo lại, chưa được trả lời: con Stone Golem "is always dead" trong map juice nặng, và spectre cũng chết ở đó. [[Minion Life Support]] đã nằm sẵn trong link.
      - title: Cluster jewel
        body: |
          Nhân vật được công bố mang hai large cluster jewel, ba viên [[Grand Spectrum]], một [[Thread of Hope]] và một cây belt [[Darkness Enthroned]] có abyss jewel bên trong. **Notable của chúng không hiện ra trên trang nào chúng tôi đọc được.**

          Codex nêu Vicious Bite, Call to the Slaughter và Renewal cho mấy cây large cluster, với Vicious Bite là nguồn crit cho minion. Hợp lý, và chưa được kiểm chứng với file của tác giả.
  - id: doryani-swap
    phase: endgame
    image: glorious-vanity
    title: Cú đổi
    levels: Level 96+
    uses: >-
      [[Doryani's Prototype]], một viên [[Glorious Vanity]] Xibaqua để lấy
      [[Divine Flesh]], [[Dawnbreaker]], một viên [[Watcher's Eye]] có modifier
      chuyển đổi của [[Purity of Fire]], hai ring có lightning resistance âm,
      và chaos resistance ở mức cap.
    changes: >-
      Mọi thứ về phòng thủ. Lightning resistance thôi không bảo vệ bạn nữa, nên
      lightning damage được chuyển hướng: một nửa sang chaos qua Divine Flesh,
      thêm một phần sang fire qua shield và jewel, và phần còn lại gặp armour
      của bạn. Curse trở thành [[Assassin's Mark]] và [[Punishment]].
      [[Concentrated Effect Support]] thay support crit thứ hai, và
      [[Animate Guardian]] vào nhóm minion.
    links:
      - name: Main skill, trong body armour
        gems: [Vaal Absolution, Physical to Lightning Support, Spell Echo Support, Minion Damage Support, Concentrated Effect Support, Increased Critical Damage Support]
      - name: Minion
        gems: [Animate Guardian, Feeding Frenzy Support, Raise Spectre, Summon Stone Golem]
      - name: Aura
        gems: [Zealotry, Determination, Haste, Enlighten Support]
