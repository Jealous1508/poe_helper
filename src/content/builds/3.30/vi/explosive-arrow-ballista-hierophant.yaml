name: Explosive Arrow Ballista Hierophant
tagline: >-
  Một dãy totem chồng ngòi nổ lên bất cứ thứ gì bạn chỉ vào, tới lúc nó phát nổ.
  Gần như cả trận bạn chỉ giữ một nút, và 3.30 đặt thêm một cây totem lên cây
  quiver best-in-slot của build.
class: Templar
ascendancy: Hierophant
role: starter
budget: starter
budgetNote: >-
  **Guide nói "rất rẻ để làm" rồi không đưa ra con số nào cho bất cứ thứ gì.**
  Không giá, không tổng số divine, không budget theo từng stage — chúng tôi đã
  kiểm cả bốn trang của nó. Thay vào đó nó cho một bảng hai cột budget so với
  best-in-slot cho từng ô, và cột budget thì rẻ thật: một [[Quill Rain]], một
  quiver [[Skirmish]], và đồ rare có life với resistance ở mọi ô còn lại. Cột
  best-in-slot thì kết thúc ở [[Headhunter]] và [[Mageblood]], cái đó không phải
  budget starter ở league nào, còn cây [[Artillery Quiver]] tự craft mà nó muốn
  dùng thay Skirmish thì có một guide craft mà trang nói là "sẽ đăng ngay thôi"
  và hiện vẫn chưa tồn tại.
mainSkill: Explosive Arrow
image: explosive-arrow
hero: art-hierophant
tags: [Bow, Totems, Fire, Ignite, Một nút]
ratings: { clear: 5, bossing: 3, survivability: 4, ease: 5 }
verified: "2026-11-13"
confidence: mixed
confidenceNote: >-
  **Đọc phần này trước câu hỏi về ascendancy bên dưới.** Guide có nhãn Covens of
  Umbra 3.30 và đề ngày 12/11/2026, và khác với phần lớn mấy trang viết trong
  tuần launch, nó biết thật về một thay đổi của 3.30: nó nói đúng y như vậy rằng
  "Starting with Patch 3.30" implicit của [[Artillery Quiver]] thành một cây
  totem thêm. Chuyện đó đúng.


  Nhưng **file Path of Building của nó lại có tiêu đề "Level 78 Explosive Arrow
  Totem Hierophant [3.29]"**, nên mọi con số phía sau guide đều là hàng 3.29, và
  đó là ảnh chụp một nhân vật level 78 với resistance chưa cap
  (49/49/49/−60) chứ không phải một nhân vật hoàn chỉnh. Mấy con số chúng tôi
  trích từ nó đều được dán nhãn tương ứng. Guide cũng không công bố điểm số nào;
  bốn điểm ở trên là cách đọc của chúng tôi từ chính danh sách ưu nhược của nó.
modes:
  ssf: >-
    Chơi được nhưng chậm hơn vẻ ngoài của nó. [[Quill Rain]] là unique phổ biến
    và [[Skirmish]] thì rẻ, nên bản nhập môn thì ổn. Danh sách best-in-slot sâu
    tới năm món unique cụ thể ([[Viridi's Veil]],
    [[Replica Dragonfangs' Flight]], [[Daresso's Defiance]],
    [[Breathstealer]], [[Dawnstrider]]), và riêng dòng +3 Explosive Arrow trên
    amulet là một cuộc săn dài. Đây là nhận định của chúng tôi; guide không đưa
    ra kết luận SSF nào.
  hardcore: >-
    Guide không đưa ra kết luận nào. Cách đọc của chúng tôi: totem ăn đòn và bạn
    đứng sau chúng, chuyện đó an toàn về mặt cấu trúc, và [[Dawnstrider]] thì cố
    tình dồn damage sang chúng. Ngược lại, cái planner level 78 mà chúng tôi đọc
    được chỉ có 20,098 effective hit point với resistance thấp xa dưới cap, nên
    không có gì trong tài liệu đã công bố chứng minh được một lớp phòng thủ đạt
    chuẩn hardcore.

idea: |
  [[Explosive Arrow]] không làm gì khi nó trúng. Mũi tên cắm vào mục tiêu với một ngòi nổ một giây. Damage xảy ra khi ngòi cháy hết, và **mọi mũi tên đang cắm trên mục tiêu đó đều bị tiêu vào cùng một cú nổ**, góp damage của nó vào đó.

  Nên skill thưởng cho tốc độ bắn cực cao vào một điểm, mà đó đúng là thứ bản thân bạn làm dở và một dãy totem thì làm xuất sắc. [[Ballista Totem Support]] biến skill thành mấy cây ballista bắn thay bạn. Bạn đứng yên, chỉ, và cái stack tự dày lên.

  [[Hierophant]] là ascendancy của totem: nhiều totem hơn, totem đặt nhanh hơn và sống lâu hơn. [[Ancestral Bond]] trên cây nghĩa là bản thân bạn không gây damage nào cả — mà chuyện đó không mất gì, vì bạn vốn chẳng định gây damage.

  Phần liên quan tới 3.30 thì nhỏ nhưng có thật. Implicit của [[Artillery Quiver]] đổi từ totem placement speed sang **+1 totem tối đa cho attack skill**. Một cây ballista nữa là một stack ngòi nổ nữa mỗi giây, mãi mãi. Nói cho chính xác là nhiều hơn cái gì một cây: cây Artillery Quiver của league trước. Cây quiver budget, [[Skirmish]], thì xưa nay vẫn có đúng dòng đó.

chain:
  - label: Đặt totem
    text: "[[Ballista Totem Support]] làm [[Explosive Arrow]] triệu ra mấy cây ballista bắn nó. Giữ nút là chúng bắn liên tục vào chỗ bạn nhắm."
  - label: Chồng ngòi nổ
    text: "Mỗi mũi tên cắm vào mục tiêu. Tối đa 20 mũi cắm cùng lúc, 22 khi gem full quality, và mỗi mũi thêm +6% more hit damage với +1 tới +0.2 mét bán kính."
  - label: Kích nổ
    text: "Khi ngòi đầu tiên cháy hết, mọi mũi tên đang cắm bị tiêu vào một cú nổ. Nhiều totem hơn nghĩa là stack dày hơn nghĩa là cú nổ to hơn."
  - label: Nhân damage lên
    text: "[[Elemental Equilibrium]] và [[Flammability]] hạ fire resistance của mục tiêu; [[Combustion Support]] với [[Point Blank]] làm phần còn lại."
