    text: "[[Ancestral Bond]] nghĩa là bản thân bạn không gây damage. [[Dawnstrider]] dồn damage sang totem, [[Grace]] với [[Purity of Elements]] lo phần còn lại."

chainDetails:
  - title: Vì sao trong 3.30 đây là Hierophant chứ không phải Elementalist hay Champion
    body: |
      Build này từng được viết thành Elementalist và thành Champion ở các league trước, và nếu bạn đi tìm bây giờ thì phần lớn sẽ gặp mấy bản đó. **Cả hai guide đó đều cũ rồi, và chúng tôi đã kiểm từng cái.**

      - **Bản Elementalist của Maxroll** (Palsteron) bị đánh dấu **Archived**. Mục changelog mới nhất của nó ghi "Updated for 3.28 Mirage", đề ngày 6/3/2026.
      - **Bản Champion của PoE Vault** (TbXie) bị gắn thẻ **Out Of Date** và nằm trong mục Legacy của site. Nó mang nhãn Settlers of Kalguur 3.25, và nó nói thẳng rằng tác giả "không còn khuyên chơi build này nữa".
      - **Chính trang index build 3.30 của Maxroll** xếp guide Explosive Arrow Ballista của nó là Champion và đóng dấu **3.29**, trong khi đóng dấu 3.30 cho bốn mươi hai guide khác. League này nó không được cập nhật.
      - **Bản Hierophant của PoE Vault** (POEGuy) mang nhãn Covens of Umbra 3.30, đề ngày 12/11/2026, và đó là bản nêu được một thay đổi của 3.30 trong chính phần chữ của nó.

      Nên câu trả lời không phải là so damage; nó là league này chỉ một trong ba bản còn có tác giả đứng sau. Nếu bạn muốn cây của Elementalist hay Champion, bạn sẽ phải tự chuyển một guide 3.25 hoặc 3.28 sang.
  - title: Thay đổi quiver thật sự đáng bao nhiêu, và cái bẫy trong đó
    body: |
      Nguyên văn của guide: "Starting with Patch 3.30 ... this quiver will grant us +1 additional totem through its implicit instead of Totem Placement Speed!"

      Chuyện đó chính xác. Implicit của [[Artillery Quiver]] giờ là "Attack Skills have +1 to maximum number of Summoned Totems", thay cho 20–30% increased totem placement speed.

      **Cái bẫy guide không nhắc tới:** patch note chính thức nói mấy món đã tồn tại thì không bị ảnh hưởng. Một cây [[Artillery Quiver]] rơi trước patch này vẫn có placement speed. Bạn cần một cây rơi trong 3.30, mà base này chỉ rơi trên đồ magic với rare ở Item Tier đủ cao. Đừng mua một cây cũ giá rẻ rồi trông đợi có totem.

      Tới khi có cây đó, [[Skirmish]] là quiver budget và nó mang đúng y dòng đó — PoEDB in "Attack Skills have +1 to maximum number of Summoned Totems" trên cả hai — nên bạn không bị chặn.

      Điều đó cũng có nghĩa là chuyển từ Skirmish sang một cây Artillery Quiver không thêm cây totem nào. Thứ 3.30 đổi là cây quiver best-in-slot của guide không còn bắt bạn bỏ đi cây totem mà Skirmish đang cho.
  - title: Hai thứ âm thầm phá damage
    body: |
      Cả hai đều nằm trong danh sách "lỗi thường gặp" của chính guide, và cả hai đều im lặng — không có gì báo cho bạn biết là nó đã xảy ra.

      1. **Bất kỳ dòng flat "Added Fire Damage to Attacks" trên gear đều phá [[Elemental Equilibrium]].** Elemental Equilibrium nâng resistance của mục tiêu với nguyên tố bạn vừa đánh và hạ hai nguyên tố còn lại. Build đánh bằng cold hoặc lightning trước, để hạ fire resistance, rồi mới nổ bằng fire. Thêm fire damage vào attack là bạn đang nâng đúng cái resistance cần hạ.
      2. **Pierce.** Guide nêu việc dùng [[Penetrating Arrow Quiver]] như một lỗi. Mũi tên xuyên qua thì không cắm lại, và mũi tên không cắm thì không có trong cú nổ.

      Còn một cái thứ ba, ít tai hại hơn: không đổi [[Lesser Multiple Projectiles Support]] ra lấy [[Combustion Support]] sau khi bạn đã có notable thêm mũi tên trên cây.
  - title: Số totem đến từ đâu
    body: |
      Bốn nguồn, và chúng cộng vào nhau:

      - [[Pursuit of Faith]] và cây của Hierophant.
      - Implicit mới của [[Artillery Quiver]], hoặc [[Skirmish]] khi còn ít tiền: +1.
      - [[Ancestral Bond]] trên passive tree, cũng là lý do [[Dawnstrider]] tiết kiệm point cho bạn — đôi boots đó cho sẵn hiệu ứng của keystone.
      - Mấy node totem mastery.

      Guide không nêu con số cuối cùng, và chúng tôi sẽ không tự tính một con từ planner 3.29 rồi gọi nó là số của 3.30.
  - title: Con spectre, và lời khẳng định duy nhất chúng tôi không kiểm được
    body: |
      Trang gem ghi một setup [[Raise Spectre]] giữ một con Perfect Guardian Turtle, và nói bản Perfect "cấp aura Determination" và kích hoạt [[Fertile Will]], node ascendancy của Farrul, mà trang pantheon mô tả là 100% increased damage, miễn stun và hồi 3% maximum life mỗi giây khi bạn có một con spectre Beast.

      **Đó là một lời khẳng định lớn dựa trên một trang của một guide.** Chúng tôi không tìm được nguồn thứ hai cho nó, con spectre đang nói tới là sinh vật của một cơ chế league, và chính trang build của guide liệt kê "không mở mấy cái lab (bao gồm Farrul Ascendancy với combo Spectre)" như một lỗi thường gặp — đọc lên nghe như cơ chế này cần phần dựng mà guide không nói rõ. Hãy coi nó là chưa xác nhận.

mandatory:
  - term: Explosive Arrow
    why: >-
      Skill chính. Gem level là nguồn damage lớn nhất, không gì sánh bằng, và
      guide muốn nó ở level 21 với 20% quality, nằm trong socket xanh lá để ăn
      thêm quality.
    detail: >-
      Theo PoEDB: mũi tên cắm vào với ngòi nổ gốc một giây; tối đa 20 mũi cắm
      được trên một con quái, nâng lên 22 ở 20% quality; mỗi mũi đang cắm thêm
      6% more damage with hits, 3% more với ailment, và +0.2 mét bán kính tới mức
      +1.2. Bản thân cú nổ gây 50% less base damage, đó là lý do cái stack là tất
      cả.
  - term: Ballista Totem Support
    why: >-
      Biến skill thành totem bắn thay bạn. Đây là cả cái build; không có nó thì
      bạn là một người cầm bow với một cái ngòi nổ một giây.
  - term: Elemental Damage with Attacks Support
    why: >-
      Hệ số damage chính trong link, có trong six-link endgame của guide và trong
      setup campaign của nó.
  - term: Combustion Support
    why: >-
      More fire damage và hạ fire resistance của mục tiêu. Nó thay
      [[Lesser Multiple Projectiles Support]] sau khi bạn đã có notable thêm mũi
      tên.
  - term: Lifetap Support
    why: >-
      Setup endgame của guide "dùng Lifetap Support cho mọi skill", đó là lý do
      nó không liệt kê chuyện lo mana nào trong phần nhược điểm.
  - term: Cruelty Support
    why: >-
      Ô thứ sáu khi còn ít tiền. Thay nó bằng [[Empower Support]] level 4 khi bạn
      kham được.
  - term: Ancestral Bond
    why: >-
      Bạn không gây damage bằng hit của chính mình; totem của bạn gây 50% more.
      Dù sao bạn cũng chẳng đánh gì.
    detail: >-
      [[Dawnstrider]] cho sẵn hiệu ứng của nó, đó là chỗ ghi chú "tiết kiệm
      passive point" của guide đến từ, và nó cũng dồn damage sang totem của bạn,
      cho tầm 10% giảm damage khi xếp cùng Totem mastery.
  - term: Elemental Equilibrium
    why: >-
      Đánh bằng cold hoặc lightning, nổ bằng fire. Phá cái này bằng flat added
      fire damage trên gear là cách phổ biến nhất để mất nửa damage mà không hay
      biết.
  - term: Point Blank
    why: >-
      Được nêu trong danh sách lỗi thường gặp của guide như thứ người ta quên
      lấy. Projectile hit gây nhiều damage hơn ở cự ly gần, mà totem của bạn thì
      đứng đúng chỗ bạn đứng.
  - term: Quill Rain
    why: >-
      Vũ khí, ở mọi mức budget. 100% increased attack speed là nhiều ngòi nổ hơn
      mỗi giây, và guide muốn một cây có projectile speed gần 100% để Bow Mastery
      chuyển nó thành tới 100% increased damage.
  - term: Pursuit of Faith
    why: >-
      Notable ascendancy đầu tiên, "càng sớm càng tốt" theo nguyên văn của guide.
      Thêm một totem, totem duration gấp đôi và placement speed gấp đôi.
  - term: Ritual of Awakening
    why: >-
      Notable thứ hai, cùng lý do. 3% more damage cho mỗi totem đang có, cộng
      hồi life và hồi mana cho mỗi cây. Guide không mô tả notable nào trong hai
      cái; cả hai dòng là của PoEDB.
  - term: Artillery Quiver
    level: recommended
    why: >-
      Nâng cấp của 3.30. Implicit của nó giờ là +1 totem tối đa cho attack skill.
      Nó phải là cây quiver rơi trong league này — món đã tồn tại thì giữ
      implicit cũ.
  - term: Skirmish
    level: recommended
    why: >-
      Quiver budget, và nó cũng cho +1 totem. Dùng nó tới khi một
      [[Artillery Quiver]] của 3.30 xuất hiện.
  - term: Viridi's Veil
    level: recommended
    why: >-
      Helmet best-in-slot: miễn critical strike, hit của quái roll unlucky, cộng
      resistance, armour và level cho gem aura với spectre gắn trong đó. Nó đòi
      một cây ring magic ở ô ring bên trái, đó là lý do ring 1 của guide cố tình
      để magic.
  - term: Daresso's Defiance
    level: recommended
    why: >-
      Onslaught vĩnh viễn ở +100% effect, nên là 40% increased attack và movement
      speed, cộng armour, evasion và life.
  - term: Replica Dragonfangs' Flight
    level: recommended
    why: >-
      Cây amulet, và nó phải là dòng cho +3 cho mọi gem Explosive Arrow nói
      riêng. Một cây rare trơn có +1 cho mọi fire skill gem là phương án thế chỗ
      khi còn ít tiền.
  - term: Dawnstrider
    level: recommended
    why: >-
      Cho sẵn [[Ancestral Bond]], dồn damage sang totem của bạn, và cho 30%
      movement speed. Nó vừa là món damage, vừa là món phòng thủ, vừa là một cú
      hoàn passive point, cùng lúc.

labs:
  - lab: Normal
    node: Pursuit of Faith
    why: "Guide nói lấy nó \"càng sớm càng tốt\". Chạy lab ở town Act 4."
  - lab: Cruel
    node: Ritual of Awakening
    why: "Thứ hai, cùng lý do đó. Quanh town Act 8."
  - lab: Merciless
    node: Conviction of Power
    why: "**Guide không đưa lý do nào cho lựa chọn này** — nó xếp thứ ba rồi không nói gì thêm. Chạy trước boss Act 10 như thường."
  - lab: Eternal
    node: Fertile Will
    why: "Node ascendancy của Farrul, lấy qua setup spectre của guide chứ không phải qua cây thường. Xem phần chi tiết bên trên: chúng tôi không xác nhận được nó một cách độc lập và chính danh sách lỗi của guide cho thấy nó cần phần dựng mà nó không giải thích."

stages:
  - id: acts-1-3
    image: holy-flame-totem
    title: Act 1–3
    levels: Level 1–28
    uses: >-
      [[Holy Flame Totem]] với [[Combustion Support]] và
      [[Infused Channelling Support]], cộng [[Flame Wall]]. Có totem từ act đầu
      tiên, đó là cả lý do lộ trình leveling này tồn tại.
    changes: >-
      [[Purifying Flame]] nằm trên thanh skill tới khi bạn lấy
      [[Ancestral Bond]], lúc đó nó hết tác dụng và tháo ra. Chạy cây Holy Flame
      Totem của guide, không phải cây Explosive Arrow, cho tới Act 3.
    links:
      - name: Main skill
        gems: [Holy Flame Totem, Combustion Support, Infused Channelling Support]
      - name: Clear
        gems: [Flame Wall, Purifying Flame]
      - name: Utility
        gems: [Frostblink, Clarity]
    moveOn: "bạn tới Act 3 và [[Explosive Arrow]] dùng được ở nhân vật level 28."
    details:
      - title: Hai cái cây, một nhân vật
        body: |
          Guide nói rõ chuyện này: dùng cây Holy Flame Totem cho Act 1 tới 3, rồi đổi sang cây Explosive Arrow Ballista từ Act 3, và chạy tiếp campaign "khi Explosive Arrow lên level 2".

          Đó là một cú respec, và nó là có chủ ý. Cả hai cây đều nằm trong planner.
      - title: Vì sao bạn không mở đầu bằng Explosive Arrow
        body: |
          [[Explosive Arrow]] cần nhân vật level 28. Tức là gần hết Act 3. Không có bản nào của build này bắt đầu sớm hơn, đó là lý do skill leveling là một skill totem chứ không phải skill bow — nó giữ lối chơi và cái cây chỉ về cùng một hướng suốt cả chặng.
      - title: Guide không nói gì cho bạn ở khúc này
        body: |
          **Trong cả guide không có danh sách gem theo từng level, không bảng quest reward, không danh sách vendor.** Setup gem cho campaign nằm bên trong file Path of Building, và trang gem nói thẳng vậy: nó cho "chỉ một setup endgame và nói campaign dùng setup đơn giản hơn, cái đó nằm trong PoB".

          Ba cái link ở trên là những gì phần chữ của nó nêu, theo thứ tự nó nêu. Chúng tôi không bịa ra mấy chỗ trống.
      - title: Bandit và Pantheon
        body: |
          **Giết cả ba bandit** để lấy thêm một passive point; guide nói thẳng vậy.

          Pantheon: **Soul of Lunaris** làm major và **Soul of Shakari** làm minor. Guide đưa ảnh chụp "đã mở hết" cho cả hai và không giải thích lựa chọn nào, nên chúng tôi không nói được nâng cấp nào quan trọng nhất. Shakari cho một Templar trong map đỏ là lựa chọn chaos damage theo lệ thường.
  - id: acts-3-10
    image: explosive-arrow
    title: Act 3–10
    levels: Level 28–68
    uses: >-
      [[Explosive Arrow]] với [[Ballista Totem Support]],
      [[Elemental Damage with Attacks Support]] và
      [[Lesser Multiple Projectiles Support]]. Một [[Quill Rain]] ngay khi bạn
      kiếm được.
    changes: >-
      Đổi [[Lesser Multiple Projectiles Support]] ra lấy
      [[Combustion Support]] sau khi đã lấy [[Master Fletcher]].
      [[Precision]] là aura campaign của bạn và thành
      [[Purity of Elements]] sau campaign.
    links:
      - name: Main skill
        gems: [Explosive Arrow, Ballista Totem Support, Elemental Damage with Attacks Support, Lesser Multiple Projectiles Support]
      - name: Guard
        gems: [Steelskin, Automation]
      - name: Curse và charge
        gems: [Flammability, Frenzy, Manaforged Arrows Support]
      - name: Aura và di chuyển
        gems: [Clarity, Precision, Frostblink]
    moveOn: "bạn đã hạ boss Act 10, resistance về lại 75%, và đã lấy ba notable ascendancy."
    details:
      - title: Cú đổi support, và vì sao nó không phải tùy chọn
        body: |
          [[Master Fletcher]] trên cây làm bow attack của bạn bắn thêm một mũi. Khi đã có nó, phần penalty damage của [[Lesser Multiple Projectiles Support]] đang trả tiền cho mấy projectile bạn vốn đã có sẵn, nên nó ra và [[Combustion Support]] vào.

          Guide liệt kê việc quên làm chuyện này như một lỗi thường gặp. Đó là loại lỗi âm thầm lấy damage của bạn suốt hai mươi level.
      - title: Frenzy như một skill tự động
        body: |
          [[Frenzy]] link với [[Manaforged Arrows Support]] tự bắn sau khi bạn tiêu đủ mana cho các bow attack khác, nạp frenzy charge mà không cần nút nào. Sau này guide chuyển nó sang [[Mirage Archer Support]] với [[Culling Strike Support]].

          Nó không tự động mãi. Trong setup endgame, nguyên văn của chính guide là "You will manually attack harder enemies with Frenzy to generate Frenzy Charges".

          Đây cũng là chỗ câu "không phải lo mana" trong danh sách ưu điểm đến từ: tới endgame thì mọi skill đều nằm trên [[Lifetap Support]], nên gần như không gì tốn mana cả.
      - title: Vách resistance
        body: |
          Boss Act 5 và boss Act 10 mỗi con lấy 30% của mọi elemental resistance. Crafting bench ở mọi town từ Act 2 vá lại được.

          Chuyện này ở đây quan trọng hơn phần lớn build khác, vì cái planner chúng tôi đọc được đang ngồi ở 49% trong ba resistance ở level 78 — đó là một nhân vật đang vá dở, không phải một nhân vật hoàn chỉnh, và nó nhắc rằng chính file của guide không cho bạn thấy một nhân vật đã cap.
  - id: early-maps
    image: quill-rain
    title: Map đầu
    levels: Map trắng và map vàng
    uses: >-
      Vẫn cái four-link đó, lớn dần lên sáu, [[Quill Rain]] với
      [[Skirmish]], và đồ rare có life với resistance ở mọi ô còn lại.
      [[Grace]] và [[Purity of Elements]] thay cho mấy aura campaign.
    changes: >-
      [[Lifetap Support]] bắt đầu xuất hiện trong mọi link. Đi săn một
      [[Artillery Quiver]] của 3.30 để thay Skirmish, và bắt đầu cuộc săn
      [[Viridi's Veil]] với [[Daresso's Defiance]].
    links:
      - name: Main skill
        gems: [Explosive Arrow, Ballista Totem Support, Elemental Damage with Attacks Support, Lifetap Support, Combustion Support]
      - name: Guard
        gems: [Steelskin, Automation, Lifetap Support]
      - name: Curse và charge
        gems: [Frenzy, Lifetap Support, Flammability, Blood Rage]
      - name: Aura
        gems: [Purity of Elements, Grace]
    moveOn: "six-link đã đầy, Elemental Equilibrium không bị món nào phá, và map Tier 10 đã thấy nhẹ nhàng."
    details:
      - title: Mấy con số planner cho thấy, và chúng đáng tới đâu
        body: |
          File Path of Building của guide **có tiêu đề "Level 78 Explosive Arrow Totem Hierophant [3.29]"**. Từ nó: 20,098 effective hit point, 2,701 life, 205 energy shield, 6,353 armour, 11,918 evasion, 59% evade chance, resistance ở 49/49/49/−60.

          **Ba điều cần lưu ý, cả ba đều quan trọng.** Đó là dữ liệu 3.29. Đó là ảnh chụp ở level 78, không phải nhân vật hoàn chỉnh. Và resistance thì chưa cap, nghĩa là con số effective hit point đó không phải con số một nhân vật đã lo gear sẽ hiện ra.

          File không báo con số damage mỗi giây nào cả. Nó hiện lượng hit lớn nhất chịu được theo từng loại thay vì vậy. Nên chúng tôi không trích con số DPS nào cho build này, vì không nguồn nào chúng tôi đọc có con nào.
      - title: Flask
        body: |
          Năm cây của guide: một [[Divine Life Flask]] miễn corrupted blood, một [[Granite Flask]], một [[Jade Flask]], một [[Quicksilver Flask]], và một [[Amethyst Flask]] mà sau này thành [[Sulphur Flask]] hoặc [[Progenesis]] khi chaos resistance của bạn trên 50%.

          Suffix nó muốn: armour, evasion hoặc movement speed during effect, và reduced curse effect. Prefix: duration, charge recovery hoặc maximum charges. Lên quality cho chúng bằng [[Glassblower's Bauble]] và gắn "Used When Charges Reach Full" lên mấy cây utility flask bằng [[Instilling Orb]].
      - title: Mod map
        body: |
          **Guide không nêu cái nào.** Nó dẫn link mấy bộ regex filter cho map Tier 16 và Tier 16.5 thay vì liệt kê mod, nên chúng tôi không có gì có nguồn để đưa bạn.

          Ghi chú của riêng chúng tôi, nêu rõ là của chúng tôi: totem là thứ được triệu ra, nên bất cứ thứ gì giết totem nhanh là lấy của bạn cả cái stack ngòi nổ, và damage của build toàn là fire, nên quái có fire resistance cao hoặc miễn ignite là mấy dòng roll tệ hiển nhiên.
  - id: red-maps
    image: artillery-quiver
    title: Map đỏ và Tier 16.5
    levels: Map Tier 11–16 và map Originator
    uses: >-
      Trọn bộ setup endgame: một body armour six-link, một cây bow chứa Frenzy
      cùng mấy skill nó kích ra, [[Viridi's Veil]] với một ring magic ở ô bên
      trái, và một [[Artillery Quiver]] tự craft.
    changes: >-
      [[Cruelty Support]] thành [[Empower Support]] level 4.
      [[Minion Life Support]] trong link spectre thành
      [[Companionship Support]]. Tattoo và một Runegraft of Gemcraft vào chỗ.
    moveOn: "trần của chính guide: map Tier 16.5 clear nhẹ nhàng. Nó nói build không được thiết kế cho Tier 17 và không farm được pinnacle boss ở chế độ Uber."
    details:
      - title: Mấy link endgame, đúng như guide in ra
        body: |
          Mấy cái này được trích theo từng ô, vì guide trình bày như vậy.

          - **Body armour:** [[Explosive Arrow]], [[Ballista Totem Support]], [[Elemental Damage with Attacks Support]], [[Lifetap Support]], [[Combustion Support]], [[Cruelty Support]] — cái cuối sau này thay bằng [[Empower Support]] level 4.
          - **Bow:** [[Frenzy]], [[Lifetap Support]], [[Cast On Critical Strike Support]], [[Flammability]], [[Blood Rage]], [[Cursed Ground Support]]. Bạn tự tay attack quái khó bằng Frenzy; guide không giải thích phần còn lại của link được kích từ nó ra sao.
          - **Boots:** [[Dash]], [[Second Wind Support]], [[Lifetap Support]], tùy chọn thêm [[Enhance Support]].
          - **Gloves:** [[Steelskin]], [[Automation]], [[Lifetap Support]], [[Convocation]].
          - **Helmet:** [[Purity of Elements]], [[Grace]].
          - **Spectre:** [[Raise Spectre]] ở level 20 với 20% quality, cộng [[Minion Life Support]], sau này là [[Companionship Support]].

          Để ý là sáu ô gem mà có [[Lifetap Support]] trong bốn ô. Đó là một build gần như không có mana cost nào, và chuyện đó là có chủ ý.
      - title: Jewel, và cái jewel là một cái bẫy
        body: |
          [[The Light of Meaning]] cho 6% increased fire damage, một [[Lethal Pride]] với 10% chance to intimidate on hit, và một [[Watcher's Eye]] có chaos resistance khi đang chịu ảnh hưởng của [[Purity of Elements]].

          Viên abyss jewel tùy chọn mới là cái thú vị: **flat cold hoặc lightning damage to attacks**, cụ thể là để giúp [[Elemental Equilibrium]] nổ cho đúng. Flat *fire* damage ở cùng ô đó sẽ làm điều ngược lại. Đọc cái mod trước khi bạn cắm nó vào.
      - title: Build dừng ở đâu, theo chính lời nó
        body: |
          Danh sách nhược điểm của guide có hai dòng, và cả hai đều là giới hạn chứ không phải chuyện phiền phức:

          - "Cannot farm pinnacle bosses on Uber Mode."
          - "Not designed for T17 mapping (only possible when fully maxed)."

          Câu trả lời nó tự gợi ý là chuyển sang một build khác cho nội dung đó — Shrapnel Ballista Hierophant của cùng tác giả, cũng là bài endgame trên site này. Cú chuyển đó tái dùng chính Hierophant và cây totem của bạn, và đó là một phần hấp dẫn thật sự.

powerCurve: |
  Damage là một cú nổ, và có ba thứ quyết định nó to cỡ nào. Bao nhiêu mũi tên đang cắm trên mục tiêu lúc ngòi đầu tiên cháy hết: số totem nhân với attack speed, tối đa 20 mũi, 22 khi gem full quality. Mỗi mũi tên đáng bao nhiêu, mà phần lớn là gem level — guide gọi nó là nguồn damage lớn nhất. Và fire resistance của mục tiêu, bị [[Elemental Equilibrium]], [[Flammability]] với [[Combustion Support]] kéo xuống. Phòng thủ trước hết là chuyện vị trí: totem đứng phía trước và ăn đòn, với [[Grace]], [[Purity of Elements]] và một [[Steelskin]] tự động đứng sau.

  Gần như tất cả những thứ đó đã vào chỗ từ Act 4. [[Explosive Arrow]] mở ở level 28 cùng [[Ballista Totem Support]], lab đầu tiên thêm totem, và hai món làm nên bản budget — [[Quill Rain]] với [[Skirmish]] — đều là unique phổ biến. Đó là lý do build này cho cảm giác xong xuôi sớm một cách bất thường: không thứ gì nó cần là đồ hiếm.

  Khúc giữa là dọn dẹp, không phải lớn lên. Một six-link, [[Lifetap Support]] trong mọi link để mana thôi tồn tại, và cú đổi sang Combustion sau khi đã lấy [[Master Fletcher]]. Thứ gì hỏng ở khúc này thì hỏng trong im lặng, và đó là lý do guide giữ một danh sách lỗi thường gặp.

  Về cuối, đường cong phẳng lại, và chính guide nói vậy: map Tier 16.5 là trần, không Uber pinnacle boss, còn Tier 17 thì chỉ khi đã max hết. Cách chúng tôi đọc lý do, từ chính chữ trên gem chứ không từ nguồn nào: cái stack có trần. Một khi totem của bạn cắm đủ hai mươi mũi tên trong một ngòi nổ, thêm totem và thêm attack speed không thêm được gì, và chỉ damage trên từng mũi — gem level, resistance — là còn lớn tiếp. Chúng tôi không nói được điểm đó rơi vào đâu, vì cái planner duy nhất của guide là ảnh chụp level 78 của 3.29 và không báo con số damage nào cả.

upgrades:
  - step: "[[Quill Rain]] với projectile speed gần 100%, và [[Skirmish]]"
    why: >-
      Guide không xếp hạng gì và không định giá gì, nên thứ tự của danh sách
      này là của chúng tôi, đọc ra từ cột budget của nó và từ các stage của bài
      viết. Hai món này chính là cột budget. 100% increased attack speed của
      Quill Rain là nhiều ngòi nổ hơn mỗi giây, và Bow Mastery biến projectile
      speed của nó thành tới 100% increased damage; Skirmish là +1 totem. Cả
      hai đều là unique phổ biến, nên không gì khác cho nhiều thế này với giá
      rẻ thế này.
  - step: "Một body armour six-link"
    why: >-
      Explosive Arrow, Ballista Totem, Elemental Damage with Attacks, Lifetap,
      Combustion và [[Cruelty Support]] ở ô thứ sáu. Mỗi socket là một hệ số
      nhân lên từng mũi tên trong stack. Nó đi sau hai món unique vì hai món
      đó đổi số mũi tên có mặt, còn một support chỉ đổi mỗi mũi đáng bao
      nhiêu.
  - step: "Gem level: một viên [[Explosive Arrow]] 21/20, và một cây amulet rare có +1 cho mọi fire skill gem"
    why: >-
      Guide gọi gem level là nguồn damage lớn nhất. Đây là đầu rẻ của chuyện
      đó: cây amulet là phương án thế chỗ khi còn ít tiền của guide cho
      [[Replica Dragonfangs' Flight]]. Nó vẫn trả lợi sau khi stack đã đầy,
      còn attack speed thì không — vế cuối đó là suy luận của chúng tôi.
  - step: "[[Viridi's Veil]] với một ring magic ở ô bên trái, và [[Daresso's Defiance]]"
    why: >-
      Hai món unique bài viết bắt đầu săn từ map đầu. Cái helmet là phòng thủ:
      miễn critical strike, và hit của quái roll unlucky. Nó không làm gì nếu
      thiếu một ring magic ở ô ring bên trái. Cái chest là Onslaught vĩnh viễn
      ở effect gấp đôi, 40% increased attack và movement speed, cộng armour,
      evasion và life. Guide liệt cả hai là best-in-slot mà không xếp hạng cái
      nào trên cái nào.
  - step: "[[Dawnstrider]]"
    why: >-
      Nó cho sẵn [[Ancestral Bond]], tức là hoàn lại mấy passive point bạn đã
      tiêu để tới keystone, dồn damage sang totem của bạn cho tầm 10% giảm
      damage khi có Totem mastery, và cho 30% movement speed. Chúng tôi đặt nó
      sau helmet với chest chỉ vì các stage của bài viết nêu hai món kia
      trước; guide không đưa thứ tự nào.
  - step: "Một cây [[Artillery Quiver]] rơi trong 3.30"
    why: >-
      Implicit mới của nó là +1 totem tối đa cho attack skill — đúng cái +1
      mà Skirmish vốn đã cho bạn. Nên thay Skirmish không thêm một cây totem
      nào; thứ nó thêm là bất cứ gì khác một cây quiver rare mang theo, mà
      guide craft cho nó thì chưa tồn tại. Đó là lý do chúng tôi xếp nó thấp
      thế này trong danh sách mua. Một cây quiver có từ trước patch thì giữ
      implicit cũ và hoàn toàn vô dụng.
  - step: "[[Replica Dragonfangs' Flight]] với +3 cho gem Explosive Arrow, và một viên [[Empower Support]] level 4 thay cho Cruelty"
    why: >-
      Đầu đắt của gem level. Cây amulet phải là dòng roll cho đúng Explosive
      Arrow, và bài viết gọi nó là một cuộc săn dài. Nằm cuối vì mấy bản
      budget đã cho bạn bước đầu của cùng một thứ. Xa hơn nữa thì cột
      best-in-slot của guide kết thúc ở [[Headhunter]] và [[Mageblood]].

play:
  mapping: |
    1. Nhắm vào pack và giữ đúng một nút. Mấy cây ballista được đặt xuống và bắn vào chỗ bạn đang chỉ.
    2. Chờ hết ngòi nổ. Mũi tên không làm gì khi cắm vào; pack chết khoảng một giây sau, khi ngòi đầu tiên cháy hết và mọi mũi tên đang cắm nổ cùng nhau.
    3. Đi tiếp bằng [[Dash]] rồi đặt lại ở pack kế.
    4. Với một pack bình thường thì không bấm gì khác. [[Steelskin]] nằm trên [[Automation]] và mấy cây utility flask được cài tự dùng khi đầy. Với quái khó, guide bảo bạn tự tay attack bằng [[Frenzy]] để lấy frenzy charge. [[Flammability]] nằm chung link đó trong cây bow, và guide không nói nó được kích bằng cách nào.

    Đứng sau totem. Chuyện chúng ăn đòn thay bạn là cách chúng tôi đọc hình dạng của build; guide không nói bằng mấy chữ đó.
  bossing: |
    Có thêm một nút bên cạnh nút đầu: guide bảo bạn tự tay attack quái khó bằng Frenzy, để lấy frenzy charge. Về chỗ đứng thì cũng có hai thứ đổi.

    1. Đặt totem sát boss. [[Point Blank]] làm projectile hit gây nhiều damage hơn ở cự ly gần, mà totem của bạn thì đứng đúng chỗ bạn đứng.
    2. Cứ giữ nút. Stack đầy tới trần rồi nổ một lần mỗi ngòi, nên damage tới theo từng nhịp chứ không thành dòng.
    3. Khi boss đi ra xa, đặt lại ngay cạnh nó thay vì để mấy cây totem ở xa bắn tiếp.

    Biết chỗ nó dừng. Guide nói bằng chính lời nó rằng build không farm được pinnacle boss ở chế độ Uber, và câu trả lời của nó là chuyển sang Shrapnel Ballista Hierophant của cùng tác giả cho nội dung đó.

troubleshooting:
  - symptom: "Damage của bạn thấp hơn hẳn mức đáng có mà không gì trên màn hình nói vì sao"
    cause: >-
      Một dòng flat "Added Fire Damage to Attacks" đâu đó trên gear đã phá
      [[Elemental Equilibrium]]. Mũi tên đáng lẽ phải đánh bằng cold hoặc
      lightning, thứ hạ fire resistance, trước khi cú nổ gây fire. Có fire
      trên mũi tên là nâng đúng cái resistance bạn cần hạ. Nó nằm trong danh
      sách lỗi thường gặp của guide.
    fix: >-
      Đọc từng món xem có added fire damage to attacks không: ring, gloves,
      quiver, jewel. Viên abyss jewel tùy chọn của guide có flat cold hoặc
      lightning damage to attacks thì làm điều ngược lại và giúp Elemental
      Equilibrium nổ cho đúng.
  - symptom: "Stack không bao giờ dày lên và cú nổ cứ nhỏ"
    cause: >-
      Mũi tên của bạn pierce. Mũi tên xuyên qua thì không cắm lại, và mũi tên
      không cắm thì không có trong cú nổ. Guide nêu
      [[Penetrating Arrow Quiver]] là thủ phạm thường gặp.
    fix: "Gỡ mọi nguồn pierce, bắt đầu từ cây quiver."
  - symptom: "Damage âm thầm thấp từ hồi campaign"
    cause: >-
      Một trong hai thứ guide liệt là lỗi thường gặp.
      [[Lesser Multiple Projectiles Support]] vẫn nằm trong link sau khi đã
      lấy [[Master Fletcher]], nên bạn đang trả phần penalty damage của nó cho
      một mũi tên cây đã cho sẵn. Hoặc [[Point Blank]] chưa bao giờ được lấy.
    fix: >-
      Đổi Lesser Multiple Projectiles ra lấy [[Combustion Support]], và lấy
      Point Blank.
  - symptom: "Bạn mua một cây Artillery Quiver mà không được thêm totem"
    cause: >-
      Hoặc nó rơi trước 3.30 — món đã tồn tại thì giữ implicit placement speed
      cũ — hoặc nó thay [[Skirmish]], cây vốn đã cho bạn đúng cái +1 đó.
    fix: >-
      Kiểm dòng implicit trước khi trả tiền: nó phải ghi "Attack Skills have
      +1 to maximum number of Summoned Totems". Giữ Skirmish cho tới khi bạn
      có một cây ghi đúng như vậy.
  - symptom: "Đã đội [[Viridi's Veil]] mà nó có vẻ không làm gì"
    cause: >-
      Nó đòi một cây ring magic ở ô ring bên trái. Đó là lý do ring đầu tiên
      của guide cố tình để magic.
    fix: "Đeo một ring magic vào ô ring bên trái, và cứ để nó magic."
  - symptom: "Phần bonus spectre từ [[Fertile Will]] không có"
    cause: >-
      Chính danh sách lỗi của guide có mục không mở mấy cái lab, "bao gồm
      Farrul Ascendancy với combo Spectre", và phần mô tả của nó cần một con
      spectre Beast — một con Perfect Guardian Turtle trong [[Raise Spectre]].
      Ngoài chừng đó thì guide không nói rõ phần dựng, và chúng tôi không xác
      nhận được cơ chế này từ một nguồn thứ hai.
    fix: >-
      Chúng tôi không đưa được những bước mà guide không đưa. Hãy coi phần
      bonus này là chưa xác nhận và đừng lo gear trên giả định là bạn có nó.

patch:
  - entry: special-base-implicits
    note: >-
      **Đây là thay đổi 3.30 thật sự duy nhất cho build, và nó là một cú buff.**
      Implicit của [[Artillery Quiver]] giờ là "Attack Skills have +1 to maximum
      number of Summoned Totems", thay cho 20–30% increased totem placement
      speed. Guide biết chuyện này: "Starting with Patch 3.30 ... this quiver
      will grant us +1 additional totem through its implicit instead of Totem
      Placement Speed!"


      **Chỗ guide không nói:** patch note chính thức thêm rằng mấy món đã tồn tại
      thì không bị ảnh hưởng. Một cây quiver rơi trước patch này giữ implicit cũ.
      Bạn cần một cây rơi trong 3.30, và base đó giờ chỉ xuất hiện trên đồ magic
      với rare ở Item Tier đủ cao. [[Skirmish]] mang đúng dòng +1 totem đó, nên
      một nhân vật đang đeo nó không được thêm totem nào khi đổi: cú buff là cho
      cây quiver best-in-slot, thứ trước đây phải bỏ cây totem đó đi. Một nâng
      cấp để đuổi theo, không phải thứ chặn đường.
  - entry: ruthless-changes
    note: >-
      **Bỏ qua mọi bài nói Hierophant bị đổi trong 3.30.** Mọi điều chỉnh
      Hierophant trong patch — totem duration của [[Pursuit of Faith]],
      [[Arcane Blessing]], Illuminated Devotion — đều nằm trong mục riêng của
      Ruthless, mục đó cũng bao luôn Champion, Guardian, Elementalist và sáu
      class khác. Không cái nào áp vào game thường. Ở đây chuyện này quan trọng
      hơn bình thường, vì hai cái ascendancy mà người ta sẽ bảo bạn dùng thay
      thế, Elementalist với Champion, cũng đều nằm trong danh sách Ruthless đó:
      nếu ai nói 3.30 làm xê dịch cán cân giữa chúng, hãy kiểm họ đọc mục nào.
  - note: >-
      **Skill và support đều không bị đụng tới.** Thay đổi gần nhất của PoEDB cho
      [[Explosive Arrow]] là từ 3.25, và nó không ghi thay đổi nào cho
      [[Ballista Totem Support]] trong 3.29 hay 3.30. Không gì trong patch này
      làm xê dịch cơ chế ngòi nổ, cái trần 20 mũi tên hay damage của cú nổ.
  - note: >-
      **Planner là 3.29 dù guide là 3.30.** File Path of Building của nó có tiêu
      đề "[3.29]" và hiện một nhân vật level 78 với resistance chưa cap. Phần văn
      xuôi của guide thì biết về 3.30; phần tính toán của nó thì không.
  - entry: item-tiers
    note: >-
      **Có lợi, và liên quan tới cây quiver.** Build chỉ cần hơn life với
      resistance một chút trên đồ rare, mà drop theo tier làm mấy thứ đó dễ tìm
      hơn — và mấy base đặc biệt, trong đó có [[Artillery Quiver]], giờ chỉ rơi ở
      Item Tier đủ cao, nên hệ thống tier chính là thứ đứng giữa bạn và cái
      implicit mới.

strengths:
  - "Có totem từ level 1, nên lối chơi và cái cây không bao giờ đổi hướng."
  - "Một nút cho gần như mọi thứ: đặt, giữ, đi tiếp. Tự tay Frenzy vào quái khó là cái nút duy nhất còn lại."
  - "Gần như không có mana cost khi Lifetap đã vào mọi link."
  - "Nhập môn cực rẻ: Quill Rain với Skirmish, cả hai đều là unique phổ biến."
  - "Guide Explosive Arrow Ballista duy nhất còn tác giả đứng sau trong 3.30."
  - "3.30 cho cây quiver best-in-slot của nó đúng cái +1 totem mà cây quiver budget vốn đã có."
  - "Nó chuyển tiếp được sang một build endgame trên cùng ascendancy và cùng cây."
weaknesses:
  - "Chính guide của nó loại Uber pinnacle boss và map Tier 17."
  - "Hai thứ âm thầm giết damage: flat added fire damage phá Elemental Equilibrium, và bất kỳ pierce nào."
  - "Không nguồn nào có con số currency và con số damage."
  - "Planner là ảnh chụp level 78 của 3.29 với resistance chưa cap."
  - "Damage bị ngòi nổ làm trễ, nên không gì chết ngay khoảnh khắc bạn chỉ vào."
  - "Không chỗ nào công bố lộ trình leveling theo từng level."
avoidIf: >-
  Chọn build khác nếu bạn muốn giết Uber boss hay farm map Tier 17 bằng con
  starter — guide nói thẳng là build này không làm cả hai. Bỏ qua nếu bạn muốn
  đọc một cái budget trước khi cam kết, vì không có cái nào. Và bỏ qua nếu bạn
  nhất định muốn bản Elementalist hay Champion: mấy guide đó tồn tại, nhưng
  chúng đóng dấu 3.28 với 3.25 và một trong hai thì bảo bạn đừng chơi nó.

sources:
  - title: "PoE Vault: Explosive Arrow Ballista Hierophant build guide (POEGuy)"
    url: https://www.poe-vault.com/guides/explosive-arrow-ballista-hierophant-build-guide
    kind: guide
    note: "Đóng nhãn Covens of Umbra 3.30, đề ngày 12/11/2026. Nguồn chính: danh sách ưu nhược, thứ tự lab, lộ trình gem trong campaign, danh sách lỗi thường gặp và phần chia budget so với best."
  - title: "PoE Vault: gear và flask"
    url: https://www.poe-vault.com/guides/explosive-arrow-ballista-hierophant-gear-flasks
    kind: guide
    note: "Chỗ chứa lời khẳng định về Artillery Quiver của 3.30, được trích nguyên văn trong phần patch note bên trên. Cũng là nguồn của kế hoạch flask, mấy viên jewel, tattoo và cái ring bên trái cố tình để magic."
  - title: "PoE Vault: Path of Building, passive tree và gem link"
    url: https://www.poe-vault.com/guides/explosive-arrow-ballista-hierophant-passive-skill-tree-gem-links
    kind: guide
    note: "Nguồn của mấy link endgame theo từng ô. Nói rõ rằng nó chỉ cho một setup endgame và setup campaign thì nằm trong planner. Không in mốc nào trên cây và không in con số damage hay life nào."
  - title: "PoE Vault: pantheon, ascendancy và bandit"
    url: https://www.poe-vault.com/guides/explosive-arrow-ballista-hierophant-pantheon-ascendancies-bandits
    kind: guide
    note: "Thứ tự ascendancy, giết hết bandit, Lunaris với Shakari. Không đưa lý do nào cho Conviction of Power và không gắn notable nào với một lab cụ thể."
  - title: "Path of Building: file của chính guide"
    url: https://pobb.in/kQGOsJn7IbQX
    kind: pob
    note: "Có tiêu đề \"Level 78 Explosive Arrow Totem Hierophant [3.29]\". Nguồn của 20,098 effective hit point, 2,701 life, 6,353 armour, 11,918 evasion và resistance 49/49/49/−60. Không báo con số damage mỗi giây nào."
  - title: "Maxroll: Explosive Arrow Ballista Elementalist (Palsteron) — đã lưu trữ"
    url: https://maxroll.gg/poe/build-guides/explosive-arrow-ballista-elementalist
    kind: guide
    note: "Bản Elementalist. Đánh dấu Archived; mục changelog mới nhất ghi \"Updated for 3.28 Mirage League\", ngày 6/3/2026. Một trong hai lý do chúng tôi không chọn Elementalist."
  - title: "PoE Vault: Explosive Arrow Ballista Champion (TbXie) — hết hạn"
    url: https://www.poe-vault.com/guides/explosive-arrow-ballista-champion-build-guide
    kind: guide
    note: "Bản Champion. Đóng nhãn Settlers of Kalguur 3.25, gắn thẻ Out Of Date, nằm trong mục Legacy, và nó nói \"we do not recommend playing this build anymore\"."
  - title: "Maxroll: trang index guide build 3.30"
    url: https://maxroll.gg/poe/build-guides
    kind: guide
    note: "Kiểm vào ngày launch: bốn mươi ba guide, bốn mươi hai cái đóng dấu 3.30, và mục Explosive Arrow Ballista Champion đóng dấu 3.29. Đó là bằng chứng đơn lẻ rõ nhất rằng bản Champion không được cập nhật league này."
  - title: "PoEDB: Explosive Arrow"
    url: https://poedb.tw/us/Explosive_Arrow
    kind: data
    note: "Nguồn của yêu cầu level 28, ngòi nổ một giây, cái trần 20 mũi tên và 22 khi có quality, +6% hit với +3% ailment damage mỗi mũi, cách bán kính tăng, và 50% less base damage của cú nổ. Mục thay đổi mới nhất là 3.25."
  - title: "PoEDB: Artillery Quiver"
    url: https://poedb.tw/us/Artillery_Quiver
    kind: data
