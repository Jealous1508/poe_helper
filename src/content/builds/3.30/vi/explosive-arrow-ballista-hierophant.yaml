    url: https://insanebuild.gg/blog/path-of-exile/build-guide-e35d/poe-3-30-build-tier-list
    kind: guide
    note: "Không xếp Explosive Arrow Ballista vào hạng nào cả, đó là lý do trong bài này không có khẳng định nào về tier. Nó có xếp Kinetic Fusillade Hierophant của cùng tác giả vào hạng A."
  - title: "poebuilds.cc: index build cộng đồng 3.30"
    url: https://www.poebuilds.cc/poe1?league=covens
    kind: guide
    note: "Kiểm phần nội dung 3.30 cho Explosive Arrow. Không video guide nào nêu tên skill trong tiêu đề; hai video league-start Hierophant của POEGuy đều dẫn về guide PoE Vault ở trên. Đó là toàn bộ phần nội dung cộng đồng 3.30 của nó."
  - title: "Patch note chính thức 3.30.0"
    url: https://www.pathofexile.com/forum/view-thread/4013680
    kind: official
    note: "Nguồn của thay đổi implicit Artillery Quiver và dòng \"existing items are not affected\", và của phần xác nhận rằng mọi thay đổi Hierophant, Champion, Guardian và Elementalist trong patch này đều nằm trong mục riêng của Ruthless."
