name: Storm Burst of Repulsion Totem Hierophant
tagline: >-
  Đặt ba cái totem cho tụi nó phủ kín màn hình bằng mấy quả cầu điện, rồi đặt
  totem mới để kích nổ toàn bộ quả cầu cùng lúc. Không cần gear vẫn chạy.
class: Templar
ascendancy: Hierophant
role: starter
budget: starter
budgetNote: >-
  Không tác giả nào công bố budget khởi điểm hay chi phí nâng cấp cho build này.
  Con số currency duy nhất trong cả guide là 2 Divine cho một lựa chọn ở crafting
  bench, mà đó là **giá 3.29**. Coi nó như một thang đo thô, không phải một chi
  phí. Điều ai cũng đồng ý là vào build không tốn gì: guide ghi rõ là build không
  cần gear nào để hoạt động.
mainSkill: Storm Burst of Repulsion
image: asc-icon-hierophant
hero: art-hierophant
tags: [Totem, Lightning, Đặt rồi quên, Crit]
ratings: { clear: 4, bossing: 3, survivability: 3, ease: 4 }
verified: "2026-11-13"
confidence: mixed
confidenceNote: >-
  **Bốn điểm số trên là cách đọc của chúng tôi, không phải của tác giả nào.**
  Không nguồn nào công bố điểm theo từng trục cho build này: Maxroll không có
  bảng điểm cho nó, và mấy bảng sao trên các site tổng hợp thì không liệt kê nó
  luôn. Một tier list xếp nó hạng B. Chỗ nào điểm của chúng tôi rơi vào nửa điểm
  thì chúng tôi làm tròn xuống, nên bossing thật ra là 3.5, còn survivability
  nhảy từ 2 khi chưa có block lên 4 sau khi có. Về nguồn: cái planner đứng sau
  guide đúng là 3.30, ghi ngày launch, nhưng mấy phần hướng dẫn craft trên chính
  trang đó vẫn mô tả bộ máy league 3.29 có thể đã không còn tồn tại. Không có dữ
  liệu ladder 3.30 cho bất cứ thứ gì.
modes:
  ssf: >-
    Tốt. Guide liệt kê solo self-found như một điểm mạnh rõ ràng, và transfigured
    gem thì tự farm được: [[Storm Burst]] chỉ có đúng một bản transfigured, nên
    [[Divine Font]] không thể trả cho bạn bản sai.
  hardcore: >-
    Không nên, theo đúng bản được viết ra. Guide không nói gì về hardcore và
    thừa nhận build không trâu cho tới khi block được scale lên. Cửa sổ đó chạy
    từ level 31 tới tầm level 80. Chỉ tính tới nếu bạn chịu hoãn map lại cho tới
    khi block cap.

idea: |
  Bạn không đánh. Bạn đặt totem, và totem làm hết mọi việc.

  Mỗi cái totem channel [[Storm Burst of Repulsion]], skill này nhả ra những quả cầu điện nhỏ nhảy lan ra trên mặt đất. Khi một totem ngừng channel, mọi quả cầu nó còn giữ nổ cùng một lúc. Cách nhanh nhất để một totem ngừng channel là đặt một cái mới lên đúng chỗ đó.

  Nên vòng lặp là: đặt totem, để cầu lan ra, đặt lại để cho cầu nổ. Lúc chạy map bạn gần như không phải nghĩ. Đánh boss thì bạn đặt lại liên tục, và damage đến từ chỗ đó.

  [[Hierophant]] cho bạn đúng hai thứ làm chuyện này chạy được: thêm totem, và totem đặt nhanh gấp đôi.

chain:
  - label: Đặt
    text: "Ba totem (bốn nếu có shield tự craft) mỗi cái channel [[Storm Burst of Repulsion]] và nhả ra mấy quả cầu điện nhảy xa khỏi bạn."
  - label: Lan ra
    text: "Mỗi lần nhảy, quả cầu đánh một vùng nhỏ. Vì đây là bản Repulsion, chúng đi ra ngoài thay vì dồn vào một mục tiêu. Đó chính là phần clear."
  - label: Kích nổ
    text: "Cho một totem ngừng channel là mấy quả cầu còn sống của nó nổ, mỗi 0.4 giây duration còn lại ăn 75% damage của skill. Đặt lại totem là cách bạn kích nó."
  - label: Sống sót
    text: "Attack và spell block cap, [[Mind Over Matter]], năm endurance charge và [[Arcane Cloak]]. Ở level 31 thì chưa có cái nào trong số đó cả."

chainDetails:
  - title: Vì sao duration ở đây là một chỉ số damage
    body: |
      Cú nổ trả ra 75% damage của skill cho mỗi 0.4 giây duration mà mấy quả cầu còn lại. Duration dài hơn nghĩa là cú nổ to hơn, không chỉ lâu hơn.

      Nhờ vậy build có trục scale thứ ba, bên cạnh gem level và crit. Đó là lý do [[Ashes of the Stars]] là một nâng cấp lớn: cái quality-cho-mọi-gem của nó đẩy thẳng base duration của skill lên.

      Guide khẳng định một viên Ashes roll hoàn hảo đáng khoảng 43% skill duration. Con số đó là của riêng guide và chúng tôi không xác minh được, dù hướng thì đúng.
  - title: Repulsion so với gem gốc, và vì sao chuyện đó quan trọng trong league này
    body: |
      [[Storm Burst]] gốc kéo mấy quả cầu **về phía** điểm bạn nhắm. Cầu dồn cục lại, single-target damage tăng dần theo thời gian totem sống, và cách chơi đúng là để totem yên.

      [[Storm Burst of Repulsion]] đẩy chúng **ra xa**. Clear tốt hơn hẳn. Single-target damage lại tụt dần theo thời gian totem channel, nên cách chơi đúng là ngược lại: đặt lại liên tục.

      Repulsion cũng đánh mạnh hơn mỗi lần cast. Nó có added-damage effectiveness 80% so với 45% của gem gốc, và base damage ở level 20 cao hơn tầm 84%, trả giá bằng base duration ngắn hơn, 0.8 giây.

      Một hệ quả thực tế đáng làm theo: **giữ một viên Storm Burst gốc trong stash.** Không có gì trong gear hay trong dàn support thay đổi giữa hai gem, nên đổi sang để đánh boss là miễn phí. 3.30 là league lấy boss làm trung tâm, còn Repulsion là nửa thiên về clear trong cặp đó. Chuyện đổi gem miễn phí là lời của guide; còn mang cả hai là khuyến nghị của chúng tôi.
  - title: Lấy transfigured gem thế nào
    body: |
      Transfigured gem đến từ [[Divine Font]] ở cuối Labyrinth. Bạn đút một viên gem vào và nó đưa ra một bộ lựa chọn giới hạn.

      [[Storm Burst]] có đúng một bản transfigured. Nên nếu lựa chọn transfigure hiện ra, bạn được Repulsion. Không có cú roll nào để thua.

      Guide chỉ bạn đi Merciless Labyrinth, nơi cho nhiều lựa chọn nhất. Chạy nó với một viên Storm Burst quality 20% là bạn vào map với một viên Repulsion 20/20. Nếu thấy chậm thì bỏ qua, mua gem là xong.

      Một lưu ý: số lượng lựa chọn công bố theo từng độ khó đến từ mấy trang wiki viết cho patch cũ hơn, và chưa được xác nhận cho 3.30.
  - title: Vì sao bạn không chơi được build này trước level 31
    body: |
      Ba cái cổng, và cả ba đều phải mở:

      1. **Nhân vật level 31**, để respec cây sang [[Ancestral Bond]].
      2. **Xong Normal Labyrinth**, để lấy [[Pursuit of Faith]].
      3. **Xong The Library ở Act 3**, để [[Siosa]] chịu bán gem cho bạn.

      Trước đó bạn là một caster hệ lửa. Guide lên level bằng [[Rolling Magma]] rồi đổi sang [[Firestorm]] quanh level 28. Một tác giả khác lên level bằng Fireball. Cách nào cũng được; cả hai đều chẳng giống gì build hoàn chỉnh.
  - title: Thật ra bạn có bao nhiêu totem
    body: |
      Một cái gốc, cộng một từ [[Ancestral Bond]], cộng một từ [[Pursuit of Faith]]. Tức là **ba** cho suốt campaign và map đầu.

      Cái thứ tư đến từ một shield influence Shaper có "+1 to maximum number of Summoned Totems". Craft đó là món duy nhất guide bảo bạn phải làm.

      Hai cái nữa đến sau, từ [[Multiple Totems Support]] cắm vào [[Decoy Totem]], nhưng hai cái đó là decoy, không phải damage.

      Lưu ý riêng cho 3.30: implicit mới của Artillery Quiver cũng cho +1 totem, nhưng nó ghi là cho skill **attack**. Storm Burst là spell, và build này dùng wand với shield. Nó chẳng làm gì cho bạn.

mandatory:
  - term: Storm Burst of Repulsion
    why: >-
      Chính cái skill. [[Storm Burst]] gốc dùng tạm được cho tới khi
      [[Divine Font]] trả cho bạn bản transfigured.
  - term: Spell Totem Support
    why: >-
      Bắt buộc, không phải tùy chọn. Storm Burst là spell channel tự cast. Viên
      gem này là thứ duy nhất biến nó thành skill totem.
  - term: Pursuit of Faith
    why: >-
      +1 totem, totem duration nhiều hơn, và 100% increased totem placement
      speed. Guide gọi nó là bắt buộc trước khi bạn chơi build này cho thoải mái
      được.
    detail: >-
      Phần placement speed là chỗ người ta đánh giá thấp. Cả lối chơi là đặt lại
      totem để kích nổ mấy quả cầu, nên bạn đặt nhanh tới đâu là bạn gây damage
      nhanh tới đó.
  - term: Ancestral Bond
    why: >-
      +1 totem, và bạn không còn tự gây damage được nữa. Cú respec ở level 31
      trong campaign tồn tại là để tới được nó.
  - term: Mind Over Matter
    why: >-
      Một phần damage bạn nhận bị trừ vào mana trước. Với bể mana lớn và hồi mana
      từ totem, đây là một lớp phòng thủ thật sự.
  - term: Titanium Spirit Shield
    why: >-
      Influence Shaper, với block và spell block tier cao nhất, cộng prefix từ
      Shaper's Exalted Orb "+1 maximum Summoned Totems". Craft duy nhất mà guide
      nhất quyết bắt làm.
    detail: >-
      Nó vừa là cái totem thứ tư của bạn vừa là nguồn attack block chính, cùng
      một lúc. Lấp suffix trước: trên base này, Shaper's Exalted Orb chỉ có đúng
      một kết quả prefix, nên lấp kín suffix là ép ra được nó. Một tác giả khác
      dùng Archon Kite Shield thay thế, nên base chưa phải chuyện đã chốt. Lưu ý
      là phần hướng dẫn craft này trong guide được viết dựa trên công cụ 3.29.
  - term: Ashes of the Stars
    level: recommended
    why: >-
      Quality cho mọi gem của bạn, điều đó đẩy skill duration lên, mà duration là
      hệ số damage trực tiếp cho cú nổ. Món damage lớn nhất sau cây shield.
  - term: Militant Faith
    level: recommended
    why: >-
      Với seed Dominus, nó biến một notable thành [[Inner Conviction]], nhờ đó
      bạn xóa được dàn mine phải mang theo từ hồi campaign.
    detail: >-
      Kiểm seed trong Path of Building trước khi mua. Viên jewel không được biến
      đổi một notable bạn đã lấy nằm trong bán kính của nó.
  - term: Anathema
    level: recommended
    why: >-
      Cho bạn áp năm curse. Đi cặp với [[Arcanist Brand]] trong setup endgame.
  - term: Arcane Cloak
    level: recommended
    why: >-
      Tiêu mana để tạo một lớp guard hấp thụ một cú đánh. Tự động hóa nó bằng
      [[Automation]] để bạn không bao giờ phải bấm.
  - term: Decoy Totem
    level: recommended
    why: >-
      Hút quái ra xa bạn. Với [[Multiple Totems Support]] bạn có hai cái, và đó
      là một lớp phòng thủ thật sự cho một build không có phòng thủ bằng di
      chuyển.
  - term: Elemental Overload
    level: recommended
    why: >-
      Hệ số damage của bạn trong campaign, với uptime bảo đảm nhờ
      [[Conviction of Power]]. Bạn respec bỏ nó ở map đầu khi chuyển sang crit.
  - term: Archdemon Crown
    level: recommended
    why: >-
      Helmet cho endgame xa. Với craft essence đúng, nó biến main link thành
      tương đương eight-link và giải phóng chest của bạn cho curse.

labs:
  - lab: Normal
    node: Pursuit of Faith
    why: "Xong Normal Labyrinth trước khi bạn đổi sang totem ở level 31. Không có node này thì không gì chạy."
  - lab: Cruel
    node: Conviction of Power
    why: "+4 mức tối thiểu và +1 mức tối đa cho endurance với power charge. Trâu hơn, và Elemental Overload bật liên tục."
  - lab: Merciless
    node: Arcane Blessing
    why: "Bạn và totem của bạn cho Arcane Surge, mà Arcane Surge cho 20% more spell damage. Miễn phí, tự động, luôn bật."
  - lab: Eternal
    node: Ritual of Awakening
    why: "3% more damage mỗi totem, cộng hồi life và mana mỗi totem. Để cuối, vì phần hồi phục chỉ thật quan trọng khi bạn đã vào map."

stages:
  - id: acts-1-3
    image: arcane-blessing
    title: Act 1–3
    levels: Level 1–31
    uses: >-
      Skill hệ lửa. [[Rolling Magma]] với [[Elemental Proliferation Support]] và
      [[Combustion Support]], cộng [[Holy Flame Totem]] và một [[Flame Wall]]
      đặt giữa bạn với mục tiêu. Đổi sang [[Firestorm]] sau Gravicius.
    changes: >-
      Không có gì ở đây là build thật. Bạn đang giết thời gian tới level 31. Phi
      thẳng vào mấy notable hệ lửa, mua wand Goat's Horn ở level 6, và thêm
      vendor recipe "Adds Fire Damage to Spells" lên nó ngay khi xong Solaris
      Temple.
    links:
      - name: Level 1–27
        gems: [Rolling Magma, Elemental Proliferation Support, Combustion Support, Volley Support]
      - name: Totem
        gems: [Holy Flame Totem, Infused Channelling Support, Added Fire Damage Support, Elemental Focus Support]
      - name: Di chuyển
        gems: [Shield Charge, Faster Attacks Support, Momentum Support]
      - name: Level 28–31
        gems: [Firestorm, Elemental Proliferation Support, Combustion Support, Faster Casting Support]
      - name: Herald và utility
        gems: [Herald of Thunder, Herald of Ice, Frostblink, Arcane Surge Support]
    moveOn: "bạn đã level 31, xong Normal Labyrinth, và xong The Library ở Act 3."
    details:
      - title: Tạo một con Ranger mule trước khi bắt đầu
        body: |
          Roll một con Ranger, giết Hillock, rồi lấy [[Momentum Support]] làm reward. Bạn cũng được thêm một lượt vendor để đổi boots có movement speed.

          Hai nguồn đồng ý về mẹo này. Một nguồn thêm rằng xong luôn Mercy Mission trên con mule thì bạn còn được một [[Quicksilver Flask]] và [[Volley Support]] nữa.
      - title: Templar lấy gem ở đâu
        body: |
          [[Storm Burst]] gốc được ghi là quest reward cho Templar từ The Siren's Cadence ở Act 1, dùng được từ level 12.

          Nhưng ô reward đó là một lựa chọn trong nhiều lựa chọn, nên đường chắc ăn là đường guide dùng: xong The Library ở Act 3 rồi mua những gì bạn cần từ [[Siosa]], ông này bán gem bất kể class của bạn là gì.

          Bản transfigured thì không bao giờ là quest reward. Chỉ [[Divine Font]] mới có.
      - title: Dọn quái bằng Rolling Magma
        body: |
          Rolling Magma bay theo đường thẳng và nảy. Cứ để một pack quái dồn lại phía sau, quay người, rồi đánh cả đám trên đường đi qua.

          Đặt [[Flame Wall]] giữa bạn với thứ bạn đang bắn. Projectile xuyên qua nó được cộng thêm fire damage.
      - title: Bandit
        body: |
          Guide nói giết cả ba và lấy passive point từ Eramir. Một tác giả khác thích Alira hơn, vì resistance và hồi mana.

          Giết hết là mặc định an toàn hơn ở đây, vì build hoàn chỉnh có thừa mana và lấy resistance từ gear.
  - id: acts-4-10
    image: pursuit-of-faith
    title: Act 4–10
    levels: Level 31–68
    uses: >-
      Build thật bắt đầu. [[Storm Burst]] trong một four-link cùng
      [[Spell Totem Support]], cộng một dàn mine để cắt resistance và nạp charge.
    changes: >-
      Ở level 31 bạn respec một khúc cây sang [[Ancestral Bond]] và bỏ mấy
      notable hệ lửa. Từ đây bạn lấy node duration, [[Mind Over Matter]] và node
      mana. Ở level 38, link [[Eternal Blessing Support]] vào aura.
    links:
      - name: Main skill
        gems: [Storm Burst, Spell Totem Support, Physical to Lightning Support, Lightning Penetration Support]
      - name: Mine
        gems: [Wave of Conviction, High Impact Mine Support, Charged Mines Support, Lifetap Support]
      - name: Mine tự động
        gems: [Automation, Detonate Mines]
      - name: Aura và di chuyển
        gems: [Haste, Eternal Blessing Support, Frostblink, Elemental Weakness]
      - name: Five-link cuối campaign
        gems: [Storm Burst, Spell Totem Support, Physical to Lightning Support, Lightning Penetration Support, More Duration Support]
    moveOn: "bạn có five-link, ba totem, và resistance về lại 75% sau Act 10."
    details:
      - title: Dàn mine, và vì sao bạn phải chịu đựng nó
        body: |
          [[Wave of Conviction]] áp lightning exposure, thứ này cắt lightning resistance của quái. [[Charged Mines Support]] nạp frenzy và power charge rất nhanh. [[Automation]] cùng một viên [[Detonate Mines]] level 1 kích mine thay bạn.

          Nó lằng nhằng. Nhưng nó cũng là thứ duy nhất cấp charge và exposure ở giai đoạn này. Bạn xóa sạch cả gói này về sau, khi [[Militant Faith]] cho bạn [[Inner Conviction]].
      - title: Haste hay Wrath
        body: |
          Guide thích [[Haste]] hơn trong campaign. Dexterity của bạn dù sao cũng chặn level của [[Wrath]], và movement speed rút ngắn campaign nhiều hơn damage.

          Đổi sang Wrath khi bạn leo tier map.
      - title: Eternal Blessing và cái aura
        body: |
          Ở level 38, link [[Eternal Blessing Support]] vào aura. Nó làm aura không reserve mana nào cả, chuyện này quan trọng vì [[Mind Over Matter]] muốn bể mana của bạn để trống.

          Trong lúc Mind Over Matter chưa được lấy, bạn còn cần [[Arrogance Support]] trên aura. Khi Eternal Blessing đã vào, Arrogance là bắt buộc trên đó.
      - title: Vì sao bạn vẫn thấy yếu
        body: |
          Bạn có ba totem, không crit, không block và không Arcane Cloak. Đây là khúc mỏng nhất của build và nói thẳng ra như vậy là trung thực.

          Giữ life và mana cao trên mọi món gear, giữ resistance cap, và đừng vội leo tier map.
  - id: early-maps
    image: increased-critical-strikes-support
    title: Map đầu
    levels: Map trắng và map vàng
    uses: >-
      [[Storm Burst of Repulsion]] trong five-link hoặc six-link, giờ dựng quanh
      crit. [[Decoy Totem]] với [[Multiple Totems Support]] để hút quái.
    changes: >-
      Ba thay đổi cùng lúc: respec bỏ [[Elemental Overload]], lấy phần chuyển đổi
      của [[Lightning Mastery]] để bỏ được
      [[Physical to Lightning Support]], và đổi [[Elemental Weakness]] sang
      [[Assassin's Mark]]. Bắt đầu leo lên cho block cap.
    links:
      - name: Main skill
        gems: [Storm Burst of Repulsion, Spell Totem Support, Increased Critical Damage Support, Lightning Penetration Support, Increased Critical Strikes Support]
      - name: Hút quái
        gems: [Decoy Totem, Multiple Totems Support]
      - name: Guard
        gems: [Arcane Cloak, Automation, More Duration Support, Detonate Mines]
      - name: Aura
        gems: [Wrath, Eternal Blessing Support]
    moveOn: "bạn có transfigured gem, đã respec xong sang crit, và đang làm cây shield Shaper."
    details:
      - title: Vì sao bạn bỏ Elemental Overload
        body: |
          [[Elemental Overload]] cho một hệ số damage cố định nhưng chặn crit multiplier làm được việc gì có ích. Khi bạn lo nổi crit chance với crit multiplier trên gear và trên cây, crit là con số lớn hơn.

          Cú đổi này không phải tùy chọn và cũng không làm dần dần. Respec một lần cho xong, rồi cắm [[Increased Critical Strikes Support]] với [[Increased Critical Damage Support]] vào cùng lúc.
      - title: Ưu tiên gear
        body: |
          Cap resistance trước. Rồi life với mana trên mọi món.

          Đừng bỏ qua chaos resistance. Base Amethyst và crafting bench là đường rẻ.

          Cast speed trên ring thì đến từ một lần Harvest reforge với mod caster.
      - title: Đây là lúc bạn mong manh nhất
        body: |
          Giờ bạn có crit damage mà không có block. Guide nói thẳng là build không trâu cho tới khi block được scale lên, và đây đúng là cửa sổ đó.

          Đừng đẩy tier map nhanh hơn block của bạn. Cây shield Shaper là cách chữa, và nó là stage kế tiếp.
      - title: Mod map cần tránh
        body: |
          Bốn cái, và chúng là rào chặn hẳn chứ không chỉ gây khó chịu:

          - Cannot regenerate life, mana or energy shield.
          - Players have 20–40% reduced chance to block.
          - 60% less recovery rate.
          - Monsters' skills chain two additional times.
  - id: red-maps
    image: titanium-spirit-shield
    title: Map đỏ
    levels: Map Tier 11–16
    uses: >-
      Một six-link, cây [[Titanium Spirit Shield]] tự craft cho cái totem thứ tư
      và cho block của bạn, cùng [[Militant Faith]] để xóa dàn mine.
    changes: >-
      Block là dự án chính. Craft cái shield, thêm block lên chest ở bench, anoint
      As The Mountain, và craft +1 minimum endurance charge lên một ring. Khi
      [[Inner Conviction]] đã vào, cả gói mine được tháo ra.
    links:
      - name: Main skill
        gems: [Storm Burst of Repulsion, Spell Totem Support, Increased Critical Damage Support, Increased Critical Strikes Support, Lightning Penetration Support, More Duration Support]
      - name: Guard, sau khi bỏ mine
        gems: [Arcane Cloak, Automation, More Duration Support, Efficacy Support]
      - name: Hút quái
        gems: [Decoy Totem, Multiple Totems Support]
      - name: Aura
        gems: [Wrath, Eternal Blessing Support]
    moveOn: "attack và spell block đều cap và bạn không còn mang mine theo nữa."
    details:
      - title: Craft cây shield, kèm một lời cảnh báo
        body: |
          Bạn muốn một [[Titanium Spirit Shield]] influence Shaper với block tier cao nhất, spell block tier cao nhất, và prefix từ Shaper's Exalted Orb "+1 maximum Summoned Totems".

          Lấp kín suffix trước khi dùng Shaper's Exalted Orb. Trên base này, prefix đó là kết quả prefix duy nhất, nên lấp kín suffix là ép ra được kết quả.

          **Phần hướng dẫn từng bước cho craft này trong guide được viết cho 3.29.** Nó nhắc tới công cụ league và vendor từ mấy league cũ, có thể patch này không còn. Món cần nhắm thì đúng; còn đường đi tới nó thì có thể không. Chuẩn bị tinh thần tự mò ra cách làm hiện tại, hoặc mua luôn cây shield thành phẩm.
      - title: Militant Faith bỏ được những gì
        body: |
          [[Inner Conviction]] thay thế đúng phần việc mà mấy con mine đang làm. Khi có nó rồi, tháo [[Wave of Conviction]], [[High Impact Mine Support]], [[Charged Mines Support]] và [[Detonate Mines]] ra, rồi cắm [[Efficacy Support]] vào link Arcane Cloak cho uptime.

          Đây là bước nhảy dễ thở lớn nhất trong cả build.
      - title: Đổi cây cho endgame
        body: |
          Bỏ Arcane Sanctuary và Primal Manifestation. Cả hai làm totem của bạn dai hơn, mà với lối chơi đặt lại liên tục thì totem của bạn là thứ dùng một lần.

          Mấy điểm đó chuyển sang block, duration và cluster jewel.
  - id: endgame
    image: archdemon-crown
    title: Endgame
    levels: Tier 17, pinnacle boss trở lên
    uses: >-
      [[Ashes of the Stars]], [[Anathema]], cluster jewel,
      [[Unnatural Instinct]] và [[The Light of Meaning]]. Một viên gem 21/20
      corrupt có imbued support.
    changes: >-
      Damage đến từ gem quality, duration và chồng curse, chứ không từ cây nữa.
      Bước cuối là dọn main link vào một [[Archdemon Crown]] và nhét năm curse
      lên [[Arcanist Brand]] trong cái chest vừa được giải phóng.
    links:
      - name: Main skill trong helmet
        gems: [Storm Burst of Repulsion, Spell Totem Support, Increased Critical Damage Support, Increased Critical Strikes Support]
      - name: Curse trên brand
        gems: [Arcanist Brand, Elemental Weakness, Conductivity, Assassin's Mark]
      - name: Phản ứng
        gems: [Cast when Damage Taken Support, Enfeeble, Punishment]
      - name: Hút quái
        gems: [Decoy Totem, Multiple Totems Support, Empower Support]
    moveOn: "không còn stage nào nữa. [[Mageblood]], [[Progenesis]] và [[Stormshroud]] là những gì còn lại."
    details:
      - title: Nên kỳ vọng con số nào
        body: |
          Path of Building endgame của một tác giả độc lập hiện 4,734 life, 3,944 mana, khoảng 50,000 effective hit point, resistance 75/75/75/53, và 19.1 triệu full damage mỗi giây so với 4.8 triệu hit damage mỗi giây.

          **Đó là số liệu 3.29 từ file của một tác giả khác, không phải của guide này.** Chúng tôi trích chỉ để lấy thang đo. Không ai có con số 3.30 nào cho build này.
      - title: Viên gem corrupt
        body: |
          Một viên [[Storm Burst of Repulsion]] 21/20 được imbue thêm Power Charge On Critical level 1 hoặc [[Infused Channelling Support]] qua soul core từ Incursion đáng khoảng 20% damage, theo guide.

          Con số đó là của riêng guide và chưa ai kiểm lại.
      - title: Build này vẫn chưa làm được gì
        body: |
          Totem của bạn không di chuyển. Đánh một con boss bắt bạn đổi chỗ thì mỗi lần đổi chỗ là damage của mấy cái totem bỏ lại kết thúc.

          Với Repulsion thì chuyện đó tự triệt tiêu một phần, vì kết thúc dòng channel đúng là thứ kích nổ mấy quả cầu. Giá thật nằm ở khoảng trống sau đó: trong lúc bạn còn đang chạy, bạn không có totem nào dưới sàn và không có quả cầu nào ngoài kia. Placement speed của [[Pursuit of Faith]] là thứ thu hẹp khoảng trống đó.

          Kết luận thực dụng: damage của bạn khi đánh boss là một hàm của lượng thời gian trận đấu cho phép bạn đứng yên, không phải của con số trong Path of Building. Hãy tính cả chuyện đó khi bạn so nó với một build ballista.

powerCurve: |
  Có bốn thứ nhân damage của build này lên: bạn có bao nhiêu totem, mỗi quả cầu đánh mạnh cỡ nào (gem level, rồi tới crit), mấy quả cầu còn bao nhiêu duration lúc chúng nổ, và bạn đặt totem nhanh tới đâu để kích chúng. Phòng thủ là một chồng riêng, không nợ gì phần damage: attack và spell block cap, [[Mind Over Matter]], năm endurance charge và [[Arcane Cloak]].

  Ở level 31, phía damage bật lên mà không cần món gear nào. Ba totem, [[Pursuit of Faith]] nhân đôi placement speed, và [[Elemental Overload]] làm hệ số cố định; mấy lần lab sau thêm [[Arcane Blessing]] với 20% more spell damage và Ritual of Awakening với 3% more mỗi totem, tất cả miễn phí. Phía phòng thủ thì gần như trống, và bài viết nói thẳng ra vậy: ba totem, không crit, không block, không Arcane Cloak.

  Map đầu nới cái khoảng cách đó rộng thêm trước khi có gì thu nó lại. Transfigured gem và cú respec sang crit tới cùng lúc, nên damage nhảy vọt trong khi block vẫn thiếu — chính guide thừa nhận build không trâu cho tới khi block được scale lên, và điểm survivability của chúng tôi nhảy từ 2 khi chưa có block lên 4 sau khi có. Rồi đúng một món thu cả hai phía lại cùng lúc: cây [[Titanium Spirit Shield]] Shaper vừa là cái totem thứ tư vừa là nguồn attack block chính của bạn.

  Từ đó damage đến từ gem quality, duration và curse, chứ không từ cây nữa: [[Ashes of the Stars]], rồi [[Anathema]] và bước dọn vào một [[Archdemon Crown]]. Có một giới hạn không bao giờ được gỡ. Totem không di chuyển, nên khi đánh boss, damage thật của bạn do lượng thời gian trận đấu cho bạn đứng yên quyết định, không phải con số trong Path of Building.

upgrades:
  - step: "Một viên [[Storm Burst of Repulsion]] 20/20: chạy Merciless Labyrinth với một viên [[Storm Burst]] quality 20%, hoặc mua gem"
    why: >-
      Không nguồn nào công bố thứ tự nâng cấp hay giá cho build này, nên thứ tự
      trong danh sách này là của chúng tôi, đọc ra từ các stage của bài viết.
      Món này đứng đầu vì nó có thể không tốn gì: Storm Burst chỉ có đúng một
      bản transfigured, nên [[Divine Font]] không thể trả cho bạn bản sai.
      Repulsion có added-damage effectiveness 80% so với 45% của gem gốc, và
      base damage ở level 20 cao hơn tầm 84%.
  - step: "Cap resistance, rồi life với mana trên mọi món, rồi chaos resistance"
    why: >-
      Ưu tiên gear của guide cho map đầu, theo đúng thứ tự của nó. Không cái
      nào là damage; đó là thứ giữ bạn sống trong cái cửa sổ bạn có crit mà
      không có block. Base Amethyst và crafting bench là đường rẻ tới chaos
      resistance.
  - step: "Một six-link cho main skill"
    why: >-
      Ô socket thứ sáu trong link map đỏ của bài viết là
      [[More Duration Support]], mà duration ở đây là một chỉ số damage: cú nổ
      trả ra 75% damage của skill cho mỗi 0.4 giây mấy quả cầu còn lại. Nó nằm
      dưới phần gear ở trên vì, theo chính lời guide, thứ build này thiếu khi
      vào map là phòng thủ chứ không phải damage.
  - step: "Một cây [[Titanium Spirit Shield]] Shaper với block tier cao nhất, spell block tier cao nhất và \"+1 maximum Summoned Totems\""
    why: >-
      Craft duy nhất mà guide nhất quyết bắt làm, và là món mua duy nhất ở đây
      kéo cả damage lẫn phòng thủ lên cùng lúc: cái totem thứ tư bên trên ba
      cái, và nguồn attack block chính của bạn. Không có nó thì phần phòng thủ
      của build không bao giờ tới. Lấp kín suffix trước khi dùng Shaper's
      Exalted Orb. Đường đi tới nó trong guide được viết cho công cụ 3.29, nên
      chuẩn bị tinh thần tự mò ra cách làm hiện tại hoặc mua cây shield thành
      phẩm.
  - step: "Phần block còn lại: craft block lên chest, anoint As The Mountain, +1 minimum endurance charge trên một ring"
    why: >-
      Mấy mảnh nhỏ làm nốt việc cây shield bắt đầu; stage map đỏ chưa xong cho
      tới khi attack và spell block đều cap. Chúng đi sau cây shield vì cây
      shield là nguồn block chính.
  - step: "[[Militant Faith]] với seed Dominus, để lấy [[Inner Conviction]]"
    why: >-
      Nó thay thế đúng phần việc mấy con mine đang làm, nên cả gói mine được
      tháo ra — bài viết gọi đây là bước nhảy dễ thở lớn nhất trong cả build.
      Nó thêm sự thoải mái chứ không thêm một lớp mới, và đó là lý do chúng tôi
      đặt nó sau block. Kiểm seed trong Path of Building trước: nó không được
      biến đổi một notable bạn đã lấy.
  - step: "[[Ashes of the Stars]]"
    why: >-
      Quality cho mọi gem đẩy base duration của skill lên, mà duration nhân
      cú nổ lên. Bài viết gọi nó là món damage lớn nhất sau cây shield. Con số
      khoảng 43% skill duration cho một viên roll hoàn hảo là của riêng guide
      và chưa được xác minh.
  - step: "[[Anathema]], rồi dọn main link vào một [[Archdemon Crown]], rồi một viên gem 21/20 corrupt"
    why: >-
      Đoạn xa nhất. Anathema cho [[Arcanist Brand]] mang năm curse; cái crown,
      với craft essence đúng, biến main link thành tương đương eight-link và
      giải phóng chest cho mấy curse đó. Guide đặt viên gem corrupt ở mức
      khoảng 20% damage, con số chưa ai kiểm lại. [[Mageblood]],
      [[Progenesis]] và [[Stormshroud]] là những gì còn lại sau đó.

play:
  mapping: |
    1. Đọc map trước. Bốn mod là rào chặn hẳn: không regeneration, reduced chance to block, 60% less recovery rate, và skill của quái chain thêm hai lần.
    2. Đặt totem lên pack quái. Mấy quả cầu tự nhảy lan ra, và đó chính là phần clear.
    3. Đi tới pack kế rồi đặt lại. Totem mới thay totem cũ, totem cũ ngừng channel, và mọi quả cầu chúng còn giữ nổ sau lưng bạn.
    4. Cho tới khi có [[Militant Faith]], dàn mine [[Wave of Conviction]] là một phần của vòng lặp. Bạn ném chúng, [[Automation]] kích chúng, và chúng cấp lightning exposure cùng charge. Bài viết không nói ném thường xuyên cỡ nào; thói quen của chúng tôi là ném vào bất cứ thứ gì sống qua lượt đặt đầu tiên.
    5. Đặt [[Decoy Totem]] xuống khi có thứ gì nguy hiểm đang lao vào bạn. [[Arcane Cloak]] thì tự bật.

    Dừng lại giết quái rare chứ đừng chạy qua chúng: 3.30 đã đặt giá trị ở đó.
  bossing: |
    Bạn đánh boss kiểu nào tùy vào viên gem nào đang cắm, và hai kiểu ngược hẳn nhau.

    - Với [[Storm Burst of Repulsion]], single-target damage tụt dần theo thời gian một totem channel. **Đặt lại liên tục.** Mỗi lần đặt lại kích nổ mấy quả cầu, và damage đến từ chỗ đó.
    - Với [[Storm Burst]] gốc, cầu kéo về phía mục tiêu và damage tăng dần theo thời gian totem sống. **Để totem yên.** Guide nói đổi gem không tốn gì; còn mang viên gem gốc theo để đánh boss là khuyến nghị của chúng tôi.

    Kiểu nào cũng vậy: decoy xuống trước, mine lên boss cho tới khi bạn có [[Inner Conviction]], rồi tới totem damage. Khi boss bắt bạn di chuyển, mấy cái totem bạn bỏ lại coi như xong. Đặt cái mới ngay lúc bạn dừng — placement speed của [[Pursuit of Faith]] là thứ giữ cho khoảng trống đó ngắn.

deaths:
  - situation: "Map trắng và map vàng, ngay sau cú respec sang crit"
    cause: >-
      Bạn có crit damage mà không có block. Block cap, cái totem thứ tư và
      [[Arcane Cloak]] tự động đều còn ở phía trước, và guide nói thẳng là
      build không trâu cho tới khi block được scale lên.
    fix: >-
      Đừng đẩy tier map nhanh hơn block của bạn. Life với mana trên mọi món,
      resistance cap, hai cái [[Decoy Totem]] để hút quái. Cây shield Shaper
      mới là cách chữa thật.
  - situation: "Map đỏ mà chưa có cây shield Shaper"
    cause: >-
      Cây [[Titanium Spirit Shield]] tự craft là nguồn attack block chính của
      bạn. Không có nó thì bạn mắc ở ba totem và không có attack block, và
      phần phòng thủ còn lại không có gì để đứng lên.
    fix: >-
      Craft hoặc mua nó trước khi leo. Rồi block trên chest, anoint As The
      Mountain và +1 minimum endurance charge trên một ring, cho tới khi
      attack và spell block đều cap.
  - situation: "Bạn mở một map và build đơn giản là không trụ nổi"
    cause: >-
      Một trong bốn mod. Guide liệt chúng là rào chặn hẳn mà không giải thích
      từng cái. Cách đọc của chúng tôi: không regeneration và less recovery
      bỏ đói phần mana mà [[Mind Over Matter]] với Arcane Cloak tiêu, còn
      reduced chance to block thì cắt thẳng vào lớp chính. Với cái mod chain
      thì chúng tôi không có lời giải thích nào để đưa ra.
    fix: "Reroll cả bốn. Chúng tắt hẳn build chứ không chỉ làm nó chậm."
  - situation: "Boss giết bạn trong lúc bạn đứng đặt totem"
    cause: >-
      Suy luận của chúng tôi, không phải lời của nguồn nào: build không có
      phòng thủ bằng di chuyển, mà damage của nó lại đòi bạn đứng và đặt lại.
      Hai thứ đó kéo ngược nhau suốt cả trận.
    fix: >-
      Decoy trước, để boss bị hút ra khỏi bạn. Khi phải di chuyển thì di
      chuyển, và chấp nhận khoảng trống damage; placement speed đưa bạn quay
      lại rất nhanh.

troubleshooting:
  - symptom: "Damage lên boss thấp hơn hẳn con số trong Path of Building"
    cause: >-
      Hai nguyên nhân, cả hai đều có trong bài viết. Con số đó giả định totem
      đang đứng và đang channel, mà mỗi lần đổi chỗ là chúng kết thúc. Và với
      Repulsion, một totem bị để yên gây single-target damage ít dần theo
      thời gian nó channel.
    fix: >-
      Với Repulsion, đặt lại liên tục. Hoặc đổi sang [[Storm Burst]] gốc cho
      trận đó rồi làm ngược lại. Không cách nào trong hai cách đổi được lượng
      thời gian trận đấu cho bạn đứng yên.
  - symptom: "Bạn vẫn chỉ có ba totem"
    cause: >-
      Cái thứ tư chỉ đến từ dòng "+1 maximum Summoned Totems" trên cây shield
      Shaper. Implicit mới của Artillery Quiver ghi là cho skill attack và
      chẳng làm gì cho một spell, còn [[Multiple Totems Support]] trên Decoy
      Totem thì thêm decoy, không phải damage.
    fix: "Craft cây [[Titanium Spirit Shield]]. Không gì khác thêm được một totem damage."
  - symptom: "Đổi sang crit xong damage lại tệ đi"
    cause: >-
      [[Elemental Overload]] vẫn còn được gán, hoặc mới chỉ cắm một trong hai
      support crit. Cú đổi này không làm dần dần được.
    fix: >-
      Respec bỏ Elemental Overload một lần cho xong, rồi cắm
      [[Increased Critical Strikes Support]] với
      [[Increased Critical Damage Support]] vào cùng lúc.
  - symptom: "Bạn tháo mine ra rồi mất luôn charge với exposure"
    cause: >-
      [[Inner Conviction]] thật ra chưa vào. Seed của [[Militant Faith]] phải
      là seed Dominus, và nó không được biến đổi một notable bạn đã lấy nằm
      trong bán kính của nó.
    fix: >-
      Kiểm seed trong Path of Building trước khi mua, và cứ để gói mine cắm
      đó cho tới khi Inner Conviction hiện trên cây của bạn.
  - symptom: "Divine Font không đưa Repulsion cho bạn"
    cause: >-
      Storm Burst có một bản transfigured, nên nếu lựa chọn transfigure hiện
      ra thì bạn được Repulsion — nhưng không phải lúc nào nó cũng hiện ra.
      Guide chỉ bạn đi Merciless Labyrinth để có nhiều lựa chọn nhất; số
      lượng lựa chọn được công bố là từ một patch cũ hơn và chưa được xác
      nhận cho 3.30.
    fix: >-
      Chạy Merciless lần nữa, hoặc bỏ qua rồi mua gem. Storm Burst gốc dùng
      tạm được cho tới lúc đó.
  - symptom: "Totem của bạn cứ chết hoài"
    cause: >-
      Chúng vốn là thứ dùng một lần. Dù sao bạn cũng đặt lại liên tục, nên độ
      dai của chúng không bao giờ quan trọng.
    fix: >-
      Không có gì để mua. Bài viết bỏ Arcane Sanctuary và Primal
      Manifestation đúng vì lý do này và chuyển mấy điểm đó sang block,
      duration và cluster jewel.

patch:
  - note: >-
      **Không có gì trong build này thay đổi.** [[Hierophant]] không được nhắc
      trong phần ascendancy của game thường trong patch note. Storm Burst,
      [[Spell Totem Support]] và [[Ancestral Bond]] cũng không xuất hiện ở bất kỳ
      đâu trong phần balance.
  - entry: ruthless-changes
    note: >-
      **Cả ba dòng về Hierophant trong patch note đều chỉ thuộc Ruthless.** Phần
      Ruthless hạ [[Arcane Blessing]] xuống 8% more spell damage. Trong game
      thường nó vẫn là 20%, đó là con số guide dùng và là con số dữ liệu game
      hiện ra. Nếu bạn đọc một bài ngày launch nói Hierophant bị nerf, bài đó đã
      đem phần Ruthless áp vào game thường.
  - entry: special-base-implicits
    note: >-
      **Implicit mới của Artillery Quiver không giúp gì bạn.** Nó cho +1 totem
      tối đa cho skill **attack**. Storm Burst là spell, và build này cầm wand
      với shield. Đó là buff thật cho mấy build ballista dùng bow, còn với bạn
      thì không là gì.
  - entry: mercenary-nerfs
    note: >-
      **Buff tương đối.** Mercenary bị cắt rất nặng mà build này không dùng con
      nào — mọi loadout trong planner đều để trống ô mercenary. Mấy đối thủ dựa
      vào chúng thì tệ đi; bạn thì không.
  - entry: winter-orb-nerf
    note: >-
      **Buff tương đối.** Con starter clear kiểu lười được chơi nhiều nhất league
      trước bị cắt, chuyện đó tự động đẩy build này lên cao hơn trong danh sách
      mấy con chạy map ít công sức.
  - entry: league-fates
    note: >-
      **Đây là cơn gió ngược thật sự duy nhất.** League được dựng quanh mấy con
      boss khu vực được tăng cường, nên single-target damage quan trọng hơn trước.
      Repulsion là nửa thiên về clear trong cặp Storm Burst, và chính phần ghi chú
      của guide nói gem gốc tiện hơn cho việc đánh boss. Giữ một viên
      [[Storm Burst]] gốc trong stash và đổi vào khi đánh boss. Đổi không tốn gì.
  - entry: loot-rarity-rework
    note: >-
      **Hơi có lợi.** Giá trị giờ dồn vào quái rare và unique, chuyện đó thưởng
      cho việc thật sự giết quái chứ không phải chạy qua chúng.

strengths:
  - "Đặt rồi quên trong lúc chạy map. Công sức rất thấp so với mức clear bạn nhận được."
  - "Không cần gear nào để nó hoạt động. Chi phí vào build gần như bằng không."
  - "Độ dai của totem không bao giờ quan trọng, vì dù sao bạn cũng đặt lại liên tục."
  - "Ba trục scale riêng biệt: gem level, crit, và skill duration."
  - "Attack và spell block cap, năm endurance charge và Mind Over Matter khi đã dựng xong."
  - "Thân thiện với solo self-found. Transfigured gem chỉ có đúng một kết quả."
weaknesses:
  - "Không trâu cho tới khi block được scale. Cửa sổ đó là từ level 31 tới tầm level 80."
  - "Totem đứng một chỗ, nên clear ở mức tạm ổn chứ không nhanh."
  - "Không có damage nào cả trong lúc bạn đổi chỗ khi đánh boss."
  - "Một dàn mine lằng nhằng bạn phải mang từ campaign cho tới khi Militant Faith về."
  - "Bốn mod map tắt hẳn build chứ không chỉ làm nó chậm."
  - "Endgame dựa nhiều vào craft, mà phần hướng dẫn craft của guide thì viết cho 3.29."
avoidIf: >-
  Chọn build khác nếu bạn muốn chạy map juice tốc độ cao, nếu bạn ghét damage
  đứng một chỗ, hoặc nếu bạn không muốn đặt lại totem hết lần này tới lần khác
  suốt một trận boss. Bỏ qua luôn nếu bạn sẽ không làm và cũng không mua cây
  shield Shaper craft: không có nó thì bạn mắc ở ba totem và không có attack
  block, và phần phòng thủ của build không bao giờ tới. Nó cũng là lựa chọn
  hardcore tệ theo đúng bản được viết ra, vì cửa sổ yếu nhất lại là cửa sổ dài
  nhất.

