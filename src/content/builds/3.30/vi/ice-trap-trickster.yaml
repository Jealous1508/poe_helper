ascendancy: Trickster
role: starter
budget: starter
budgetNote: >-
  **Guide không đưa ra con số currency nào cả — không cho món nào, cũng không cho
  cả build.** Chúng tôi sẽ không bịa ra con nào. Điểm budget của chính nó là Low,
  4 trên 5, và điểm đó là **hàng 3.29**. Những gì guide có nói bằng chữ: cần ít
  unique; [[Sunblast]] "khá hiếm, và có thể khó kiếm lúc league start", nên bỏ
  qua rồi quay lại sau; một [[Large Cluster Jewel]] có thể cực đắt lúc mới mở
  league, nên mua một cây rẻ có hai notable dùng được; awakened gem có thể không
  đáng ở giai đoạn đầu; và six-link sớm thì đắt, nên chạy five-link trong thời
  gian dài.
