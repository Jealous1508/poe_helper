confidenceNote: >-
  **Hai lời cảnh báo, cả hai đều quan trọng.** Thứ nhất, điểm số của chính guide
  là **hàng 3.29**: Difficulty 4, Budget 4, Mapping 3, Bossing 4, Defence 3. Cách
  đọc độc lập của chúng tôi thì gần vậy — chúng tôi sẽ nói bossing 4.5 và clear
  3.5, mà chúng tôi làm tròn nửa điểm xuống. Thứ hai, và nặng hơn: **guide này
  thật ra không được sửa lại cho 3.30.** Changelog của nó, đề ngày 12/11/2026,
  khẳng định là có, nhưng chính tiêu đề của nó vẫn ghi 3.29, planner của nó ghi
  league 3.28 và dữ liệu ascendancy của nó đóng dấu 3280. Chúng tôi không xác
  nhận được là mấy con số phòng thủ của nó đã tính tới thay đổi [[Spellbreaker]]
  của 3.30, cái đưa lượng suppressed spell damage được chặn từ 15% lên 20%.
  **Hãy chuẩn bị tự dựng lại cây và đừng tin phần tính toán phòng thủ của
  guide.** Trên hết, đây là một lựa chọn chỉ có một nguồn:
  không tier list nào xếp một build Ice Trap vào hạng nào cho 3.30. Archetype này
  thì có nền tảng — mấy build trap khác được đánh giá tốt — nhưng đúng build này
  thì không.
modes:
  ssf: >-
    Hợp lý. "Cần ít unique" là thật, và [[Ice Trap of Hollowness]] thì tự farm
    được từ Merciless Labyrinth. Bức tường thật sự duy nhất là
    [[Replica Dragonfangs' Flight]], món này đến từ curio display trong Heist, mà
    guide thì đã đưa sẵn phương án thay thế. Đây là nhận định của chúng tôi;
    guide không đưa ra kết luận nào.
  hardcore: >-
    Guide không đưa ra kết luận nào. Cách đọc của chúng tôi: chơi được một cách
    dè dặt qua campaign và map vàng, và **bỏ hẳn cú đổi sang low life ở
    endgame**, vì nó đem cái bộ đệm thật sự duy nhất của build ra đổi lấy damage.
    Giảm damage physical thấp, damage có độ trễ và không có leech là một tổ hợp
    hardcore tệ.

idea: |
  [[Ice Trap of Hollowness]] là một spell được trap phóng ra. Bạn ném trap, nó lên nòng, nó nổ, và một **vòng** các cú nổ băng bùng lên quanh điểm nó rơi xuống.

  Đọc lại chữ đó lần nữa. Một cái vòng. **Tâm của cú nổ là chỗ yếu.** Đánh boss thì bạn ném trap ra lệch một bên, để cái vòng rơi lên người boss chứ không phải vòng quanh nó. Đây là điều phản trực giác nhất của build và là chỗ phần lớn người chơi làm sai ngày đầu.

  Một cây belt tên [[Sunblast]] biến build từ lóng ngóng thành ngon. Nó chặn quái kích trap của bạn, và khiến trap tự nổ khi thời lượng đã bị cắt ngắn của chúng hết. Kết hợp với việc ném thêm trap, một cú ném thành ba cái trap tự nổ sau đó khoảng một giây.

  Nên cảm giác thật là: ném, dừng một nhịp, ba vòng băng chồng lên nhau. Bạn vẫn cứ di chuyển trong lúc chúng làm việc.

  [[Trickster]] cấp phần phòng thủ, mà phòng thủ đó là một mạng keystone energy shield với evasion chứ không phải armour.

chain:
  - label: Ném
    text: "Một cú ném đặt tới ba cái trap, nhờ [[Sunblast]] và mấy notable trap."
  - label: Kích nổ
    text: "Với Sunblast, quái không kích được trap của bạn. Thay vào đó thời lượng đã bị cắt ngắn của chúng hết, tầm nửa giây tới một giây sau, và cả ba nổ."
  - label: Vòng băng
    text: "Mỗi cái trap nổ ra một vòng tròn các cú nổ băng. Chồng được ba vòng đó là damage của bạn; đánh mục tiêu đơn thì nhắm lệch tâm."
  - label: Sống sót
    text: "[[Eldritch Battery]], [[Mind Over Matter]], [[Ghost Dance]], [[Wicked Ward]] và [[Spellbreaker]], cộng 100% [[Spell Suppression]] và đóng băng quái cho chúng không hành động được."

chainDetails:
  - title: Chồng hồi phục là một hệ thống, và nó sập cả cục
    body: |
      Một build trap thì không có leech nào dùng được. Không có cái nào. Nên phần hồi phục hoàn toàn là năm mảnh cài vào nhau, và thiếu một mảnh là sập cả hệ. Guide nói chuyện này hai lần, và đó là điểm yếu cấu trúc của build.

      - [[Eldritch Battery]] — energy shield bảo vệ mana thay vì life, và bạn tiêu nó trước mana.
      - [[Mind Over Matter]] — 40% damage trừ vào mana trước life, nên bể energy shield của bạn cuối cùng cũng hấp thụ thay cho life.
      - [[Ghost Dance]] — ba ghost shroud; khi bị hit bạn mất một cái và hồi energy shield bằng 3% evasion rating. Energy shield của bạn không vượt được evasion.
      - [[Wicked Ward]] — energy shield recharge không bị damage ngắt nếu nó vừa mới bắt đầu.
      - [[Spellbreaker]] — 50% cơ hội khởi động lại recharge khi bạn suppress spell damage.

      Để ý tính vòng tròn của nó: [[Escape Artist]] biến energy shield trên helmet thành evasion và evasion trên body armour thành energy shield; Ghost Dance thì chặn energy shield ở mức evasion và hồi máu dựa trên evasion.

      Đây không phải Chaos Inoculation. Mọi món gear trong setup công bố đều roll maximum life, và endgame thì đi **low life**, không phải [[Chaos Inoculation]].
  - title: Vì sao Swift Killer là lựa chọn ascendancy đầu tiên
    body: |
      Đây là một chỗ phản tương tác thật mà guide chỉ giải thích một nửa, nên dưới đây là bản đầy đủ.

      [[Charged Traps Support]] nạp frenzy và power charge "khi trap của bạn bị quái kích". [[Sunblast]] làm chuyện đó thành bất khả thi, vì quái không còn kích trap của bạn nữa.

      Bản vá là [[Summon Skitterbots]], mấy con này kích trap của bạn với cooldown tầm ba giây. Nên charge vẫn nhỏ giọt vào, chỉ là thất thường.

      [[Swift Killer]] cho +2 frenzy charge tối đa và 200% increased charge duration. Chính cái duration đó làm mấy cục charge thất thường kia sống đủ lâu để giữ throw speed và crit multiplier của bạn. Đó là lý do nó đi đầu.
  - title: Ba hệ thống giành nhau throw speed của bạn
    body: |
      1. **Throw speed.** [[Trap and Mine Damage Support]] cho 30–49% more trap damage nhưng mang theo 10% less trap throwing speed. [[Charged Traps Support]] trả lại 10% increased throwing speed mỗi frenzy charge.
      2. **Trần số trap đặt được.** Notable Saboteur trên cây thêm +2 trap đặt được, và anoint [[Master Sapper]] thêm +2 nữa. Lưu ý "additional traps *placed*" và "additional traps *thrown*" là hai chỉ số khác nhau. Cả hai đều quan trọng.
      3. **Kích nổ.** [[Sunblast]] đổi luôn ai là người cho trap nổ, từ quái sang cái đồng hồ.

      Trước Sunblast thì build tệ hơn danh tiếng của nó: bạn phải nhắm trap *vào* quái rồi chờ chúng đi vào. Sau Sunblast, guide mô tả damage là tăng gấp ba trên thực tế.
  - title: 3.30 thật ra cho ascendancy này cái gì
    body: |
      Trickster nhận ba buff cho game thường. Build này lấy hai trong số đó.

      - **[[Spellbreaker]]: từ 15% lên 20% được chặn.** Với Inveterate ở 100% suppression, phần damage được chặn đi từ 68% lên 73%, tức là ăn ít hơn tầm 15.6% spell damage — nhưng chỉ khi bạn đang đầy energy shield. Thật, và có điều kiện.
      - **[[One Step Ahead]]: sàn action speed từ 90% lên 105%.** Đây là cái quan trọng. Ở 90% thì nó chẳng làm gì trừ khi có thứ gì làm bạn chậm lại. Ở 105% thì nó là 5% faster action speed không điều kiện, nghĩa là ném trap nhanh hơn tầm 5%, **và** một cái sàn cứng chống Temporal Chains, chill với maim. Nó cải thiện thẳng vào trục yếu nhất của build, cái nhịp có độ trễ.
      - **[[Heartstopper]]: từ 50% lên 75% less damage over time taken.** Buff lớn nhất trong ba cái, và **build này không lấy nó**, nên theo đúng bản được viết ra thì khoản lợi là không.

      Gợi ý của chúng tôi, nói rõ là của chúng tôi chứ không phải của cái guide hàng 3.29: vì vùng phòng thủ mỏng nhất của build là degeneration với damage over time, một cặp Forbidden Flame và Flesh để lấy **Heartstopper** giờ là mục tiêu endgame hấp dẫn hơn mấy cái guide liệt kê.
  - title: Cú đổi sang low life, và vì sao bạn bỏ qua được
    body: |
      Về sau, build reserve hơi dưới một nửa life bằng [[Petrified Blood]] cộng [[Vitality]] với [[Arctic Armour]] qua [[Arrogance Support]], để bật [[Pain Attunement]] lấy 30% more spell damage.

      Nó cần life recoup trên ring và trên cây để bù lại phần Petrified Blood lấy của bạn, cộng thêm Reservation mastery.

      Đó là một cú đổi thẳng: một cục lớn effective hit point để lấy 30% more spell damage. Ở softcore với một nhịp kích nổ tốt thì lấy. Ở hardcore, hoặc nếu bạn chết nhiều, thì đừng.
  - title: Viên gem duy nhất không phải mục tiêu lúc league start
    body: |
      [[Invert the Rules Support]] nằm trong six-link endgame của guide. Nó cần gem level 72 tới 76, tốn 140% mana multiplier, và **rơi từ Maven với Uber Maven**.

      Chuyện đó làm cái six-link công bố thành thứ để mơ, không phải mục tiêu khởi đầu. Guide chưa bao giờ nói năm viên gem nào bạn chạy trong five-link, và việc bỏ Invert the Rules khỏi cái six-link là suy luận của chúng tôi.

mandatory:
  - term: Ice Trap of Hollowness
    why: >-
      Transfigured gem. Guide gọi nó là một cú đẩy khổng lồ cho damage và area of
      effect, và nói hãy lấy nó trước khi bạn bắt đầu chạy map.
    detail: >-
      Nó đến từ [[Divine Font]] ở cuối Labyrinth, mà guide nói bạn farm được ở
      Merciless, hoặc mua từ trade. Nó dùng chung yêu cầu level 28 của [[Ice Trap]]
      gốc, nên nó cắm thẳng vào link hiện có của bạn ngay khoảnh khắc bạn có nó.
  - term: Trickster
    why: >-
      [[Escape Artist]] và [[Spellbreaker]] là phần phòng thủ chịu lực. Không gì
      thay thế được chúng, và đó là lý do đây không phải build bạn bê sang
      ascendancy khác được.
  - term: Eldritch Battery
    why: >-
      Energy shield bảo vệ mana thay vì life, và bạn tiêu nó trước. Mảnh thứ nhất
      của chồng hồi phục.
  - term: Mind Over Matter
    why: >-
      40% damage nhận vào trừ mana trước life. Xếp lên [[Eldritch Battery]], bể
      energy shield của bạn cuối cùng cũng hấp thụ thay cho bể life.
  - term: Ghost Dance
    why: >-
      Ba ghost shroud. Mỗi cú hit ăn một cái và hồi energy shield bằng 3% evasion
      rating của bạn.
    detail: >-
      Nó cũng chặn energy shield của bạn ở mức evasion. Đó là lý do build muốn
      base hybrid evasion với energy shield ở mọi món, không phải energy shield
      thuần.
  - term: Wicked Ward
    why: >-
      Energy shield recharge không bị damage ngắt nếu nó vừa bắt đầu. Không có nó
      thì recharge không bao giờ xong trong một trận đánh.
  - term: Spell Suppression
    why: >-
      100%. Guide gọi nó là một trong những cách giảm damage mạnh nhất trong game,
      và chuyện khởi động lại recharge của [[Spellbreaker]] chỉ nổ khi bạn
      suppress.
    detail: >-
      Cây cho bạn gần hết, thiếu tầm 11%. Phần còn lại đến từ gloves, boots và
      body armour, cộng implicit Eater trên gloves.
  - term: Summon Skitterbots
    why: >-
      Sau [[Sunblast]], đây là thứ duy nhất còn kích trap của bạn, nên nó là thứ
      duy nhất còn nạp charge qua [[Charged Traps Support]].
  - term: Charged Traps Support
    why: >-
      Frenzy và power charge khi trap bị kích, và 10% increased throwing speed mỗi
      frenzy charge.
  - term: Trap and Mine Damage Support
    why: >-
      30–49% more trap damage, đổi lại 10% less throwing speed. Support damage cố
      định lớn nhất trong cả link.
  - term: Cold Penetration Support
    why: >-
      Cold resistance của quái là thứ chính chắn giữa bạn và con số damage của
      bạn. Có trong mọi setup được công bố.
  - term: Sunblast
    level: recommended
    why: >-
      Trap không bị quái kích được, và trap duration bị cắt 50–75%. Một cú ném
      thành ba cái trap tự nổ. Guide nói nó tăng damage của bạn gấp ba trên thực
      tế.
    detail: >-
      Chính guide của nó cảnh báo rằng nó khá hiếm và có thể khó lấy lúc league
      start, và nói hãy bỏ qua rồi quay lại nếu nó đắt. Đeo nó cũng có nghĩa là
      phải bỏ node trigger của Trap mastery và mấy notable trigger.
  - term: Carcass Jack
    level: recommended
    why: >-
      +50% area damage và +50% area of effect. Diện tích của cái vòng chính là tốc
      độ clear của bạn, nên đây vừa là món damage vừa là món clear.
    detail: >-
      Corrupt tốt nhất là +2 cho gem area-of-effect gắn trong đó, hoặc +2 cho gem
      trap với mine gắn trong đó.
  - term: Tinkerskin
    level: recommended
    why: >-
      Rõ ràng là cái chest tốt *trước khi* có [[Sunblast]]. Rẻ, và nó che đúng
      khúc game mà build yếu nhất.
  - term: Replica Dragonfangs' Flight
    level: recommended
    why: >-
      Anoint [[Master Sapper]]. Nó phải là dòng cộng level riêng cho [[Ice Trap]],
      không phải Dragonfangs bất kỳ.
    detail: >-
      Phương án dự phòng guide đưa ra là một cái amulet +1 cold skill gem trơn.
      Unique Replica đến từ curio display trong Heist, nên đây là bức tường solo
      self-found thật sự duy nhất.
  - term: Hubris Circlet
    level: recommended
    why: >-
      Base maximum energy shield. Energy Shield mastery nhân đôi energy shield
      trên helmet, rồi phần đó chảy vào [[Escape Artist]] và từ đó thành evasion
      của bạn.
  - term: Medium Cluster Jewel
    level: recommended
    why: >-
      Guerilla Tactics và Set and Forget. Guide gọi mấy cây medium cluster quan
      trọng hơn cây large nhiều.

labs:
  - lab: Normal
    node: Swift Killer
    why: "Trích từ guide: lấy Swift Killer ở lab đầu tiên để có 2 frenzy charge. Nó cho damage và trap throwing speed, và cái charge duration của nó là thứ làm mấy cục charge thất thường trở nên dùng được."
  - lab: Cruel
    node: Escape Artist
    why: "Trích: lấy Escape Artist ở lab thứ hai. Đây là lúc bạn đổi sang base evasion cao hoặc base hybrid và spec Eldritch Battery."
  - lab: Merciless
    node: Spellbreaker
    why: "Trích: lấy Spellbreaker ở Merciless Labyrinth để bật được setup Eldritch Battery với Mind Over Matter. Được buff trong 3.30 từ 15% lên 20%."
  - lab: Eternal
    node: One Step Ahead
    why: "**Nhãn lab là suy luận** — guide không nêu tên cái thứ tư. 3.30 nâng sàn action speed của nó từ 90% lên 105%, biến nó từ một tấm bảo hiểm thành một khoản lợi 5% vĩnh viễn và làm luận điểm chọn nó mạnh hơn so với [[Heartstopper]]."

stages:
  - id: acts-1-3
    image: skitterbots
    title: Act 1–3
    levels: Level 1–28
    uses: >-
      [[Stormblast Mine]] và [[Orb of Storms]] từ level 4, rồi
      [[Lightning Trap]] từ level 12 ở Act 2. [[Ice Trap]] thay nó ở level 28.
    changes: >-
      [[Summon Skitterbots]] vào ở 16. Ở 28 thì main skill thật tới và
      [[Charged Traps Support]] vào cùng nó. Normal Labyrinth cho bạn
      [[Swift Killer]].
    links:
      - name: Level 4–11
        gems: [Stormblast Mine, Swift Assembly Support, Orb of Storms, Arcane Surge Support]
      - name: Từ level 12 trở đi
        gems: [Lightning Trap, Swift Assembly Support, Added Lightning Damage Support]
      - name: Level 28
        gems: [Ice Trap, Swift Assembly Support, Added Cold Damage Support, Charged Traps Support]
      - name: Single target
        gems: [Bear Trap, Frost Bomb, Assassin's Mark]
      - name: Utility
        gems: [Summon Skitterbots, Flame Dash, Frostblink, Clarity, Vitality]
    moveOn: "Ice Trap đã nằm trong four-link và bạn đã xong The Library ở Act 3."
    details:
      - title: Chúng tôi không biết bạn bấm gì ở level 1
        body: |
          **Guide không nói.** Lộ trình của chính nó bắt đầu từ level 4, và nó đẩy mấy level đầu sang một guide campaign chung.

          Chúng tôi sẽ không bịa ra. Cứ lấy bất cứ thứ gì class của bạn được cho ở level 1 rồi lên tới [[Stormblast Mine]] ở level 4.
      - title: Shadow lấy Ice Trap ở đâu
        body: |
          [[Ice Trap]] gốc cần nhân vật level 28. Nó là quest reward ở Act 3 của "Sever the Right Hand" từ Clarissa, và nó cũng mua được.

          [[Siosa]] ở The Library, Act 3 bán gem cho mọi class, đó là đường chắc ăn nếu bạn đã dùng ô reward cho thứ khác.

          Nên kế hoạch là: [[Lightning Trap]] từ 12 tới 28, rồi đổi.
      - title: Mấy món nhỏ nên mua khi lên level
        body: |
          - Dùng vendor recipe làm một cây wand spell damage: wand cộng một Chain Belt cộng một [[Blacksmith's Whetstone]].
          - [[Sapphire Ring]] trước Merveil; một Ruby Ring cho Vaal Ruins ở Act 2.
          - Một Jade Amulet cho Dexterity.
          - Ring hai đá sau level 20.
      - title: Bandit
        body: |
          Giúp **Alira**. Guide nói vậy, và phần resistance với hồi mana thì hợp với một build crit không có leech.
  - id: acts-4-10
    image: grace
    title: Act 4–10
    levels: Level 28–68
    uses: >-
      [[Ice Trap]] trong một four-link. [[Grace]] làm aura chính từ level 24 nếu
      bạn đang vật lộn, [[Shield Charge]] để di chuyển, và [[Bear Trap]] cộng
      [[Frost Bomb]] cho bất cứ thứ gì có thanh máu.
    changes: >-
      Ở Cruel Labyrinth bạn lấy [[Escape Artist]], rồi đổi sang base evasion cao
      hoặc base hybrid evasion với energy shield và spec [[Eldritch Battery]].
      [[Summon Stone Golem]] vào ở level 34.
    links:
      - name: Main skill
        gems: [Ice Trap, Swift Assembly Support, Added Cold Damage Support, Charged Traps Support]
      - name: Single target
        gems: [Bear Trap, Frost Bomb, Assassin's Mark]
      - name: Aura
        gems: [Grace, Clarity, Vitality]
      - name: Utility
        gems: [Summon Skitterbots, Summon Stone Golem, Shield Charge, Faster Attacks Support, Flame Dash]
    moveOn: "đã lấy Escape Artist, bạn đang dùng base hybrid, và Eldritch Battery đã được spec."
    details:
      - title: Thứ tự phần phòng thủ bật lên
        body: |
          Cruel lab cho bạn [[Escape Artist]] và cho phép spec
          [[Eldritch Battery]]. Merciless lab cho bạn [[Spellbreaker]], đó là thứ
          làm cả hệ [[Mind Over Matter]] với recharge chạy được.

          Tới trước Merciless, phần hồi phục của bạn còn dở dang và bạn nên chuẩn bị chết nhiều hơn so với về sau. Đó là bản chất build, không phải bạn làm sai.
      - title: Đổi base, không chỉ đổi gear
        body: |
          [[Escape Artist]] đọc evasion từ body armour của bạn và đọc energy shield từ helmet. [[Ghost Dance]] đọc cả hai.

          Nghĩa là base hybrid Dexterity với Intelligence ở mọi ô giáp. Setup công bố dùng chúng ở khắp nơi. Món armour thuần hay energy shield thuần ở đây là một mất mát thật, không phải chuyện nhỏ.
      - title: Nhắm lệch tâm
        body: |
          Bắt đầu luyện từ bây giờ, trên mấy con boss của act. Đòn đánh là một cái vòng, nên một cái trap ném đúng lên đầu boss sẽ đặt mấy cú nổ *vòng quanh* nó.

          Ném ra một bên. Nó sẽ thấy sai sai trong khoảng một tiếng.
  - id: early-maps
    image: spell-suppression
    title: Map đầu
    levels: Map trắng và map vàng
    uses: >-
      [[Ice Trap of Hollowness]] trong một five-link. Một cái chest evasion hoặc
      energy shield five-link giá rẻ, hoặc [[Tinkerskin]].
    changes: >-
      Merciless Labyrinth cho bạn [[Spellbreaker]] và cả chồng hồi phục bật lên.
      Dồn hết vào life với resistance. Lấy transfigured gem trước khi bắt đầu chạy
      map nếu được.
    links:
      - name: Main skill
        gems: [Ice Trap of Hollowness, Charged Traps Support, Trap and Mine Damage Support, Cold Penetration Support, Increased Critical Damage Support]
      - name: Single target
        gems: [Bear Trap, Frost Bomb, Assassin's Mark]
      - name: Chill và freeze
        gems: [Summon Skitterbots, Bonechill Support, Unbound Ailments Support]
      - name: Aura
        gems: [Grace, Vitality, Arrogance Support]
      - name: Guard và di chuyển
        gems: [Cast when Damage Taken Support, Immortal Call, Shield Charge, Faster Attacks Support]
    moveOn: "chồng hồi phục đã chạy, bạn có transfigured gem, và bạn đang đi săn một cây Sunblast."
    details:
      - title: Five-link thật sự là đủ
        body: |
          Guide nói rõ rằng build này chạy five-link được khá lâu. Six-link sớm thì đắt và đó không phải chỗ currency của bạn nên đi.

          Mua một cây Sadist Garb, Carnal Armour hoặc Blood Raiment five-link, hoặc craft một cây bằng fossil Dense, hoặc đeo [[Tinkerskin]].

          **Guide chưa bao giờ liệt kê năm viên gem nào vào five-link.** Bộ ở trên là cách đọc của chúng tôi: lấy six-link công bố trừ đi [[Invert the Rules Support]], viên đó rơi từ Maven và không phải mục tiêu khởi đầu.
      - title: Một chỗ guide tự mâu thuẫn mà bạn sẽ thấy
        body: |
          Phần support crit của chính guide không nhất quán ở ba chỗ. Cái six-link trong planner của nó dùng [[Increased Critical Damage Support]]; phần văn xuôi thì bàn về [[Increased Critical Strikes Support]] như nguồn crit chance; còn mục awakened gem thì bảo bạn thay Increased Critical Strikes bằng Awakened Added Cold Damage.

          Ba lời không thể cùng đúng. Dùng crit chance khi base crit của bạn còn thấp và dùng crit damage khi nó đã cao, và hãy kiểm trong Path of Building chứ đừng làm theo trang đó.
      - title: Flask
        body: |
          Một [[Life Flask]] Divine với prefix instant-khi-máu-thấp và một suffix chống bleed hoặc corrupted blood, rồi [[Quartz Flask]], [[Quicksilver Flask]], [[Diamond Flask]] và [[Jade Flask]].

          [[Diamond Flask]] quan trọng hơn bình thường: đây là build crit mà không có nguồn ổn định crit nào khác.
      - title: Mod map cần tránh
        body: |
          Guide liệt kê mấy cái này hai lần, nghe như người ta hay bỏ qua chúng:

          - **Reduced effect of non-curse auras.** Nguy hiểm. [[Grace]], [[Zealotry]] và [[Arctic Armour]] *chính là* phần phòng thủ.
          - **Cannot regenerate life, mana or energy shield.** Nguy hiểm.
          - **−% maximum resistances.** Nguy hiểm.
          - **Monsters reflect elemental damage.** Chỉ thành vấn đề nếu bạn đánh trúng quái bằng [[Frostblink]].
  - id: red-maps
    image: replica-dragonfangs-flight
    title: Map đỏ
    levels: Map Tier 11–16
    uses: >-
      [[Sunblast]], một cây wand crit base fractured với craft trigger, và
      [[Replica Dragonfangs' Flight]] anoint [[Master Sapper]].
    changes: >-
      Spell suppression lên 100%. Đeo Sunblast nghĩa là phải bỏ node trigger của
      Trap mastery và mấy notable trigger, và lối chơi đổi từ nhắm trap vào quái
      sang ném về phía trước mặt mình.
    links:
      - name: Main skill
        gems: [Ice Trap of Hollowness, Charged Traps Support, Trap and Mine Damage Support, Cold Penetration Support, Increased Critical Damage Support, Increased Critical Strikes Support]
      - name: Chill và freeze
        gems: [Summon Skitterbots, Bonechill Support, Unbound Ailments Support]
      - name: Aura từ một con spectre
        gems: [Raise Spectre, Guardian's Blessing Support, Zealotry]
      - name: Aura
        gems: [Grace, Vitality, Arctic Armour, Arrogance Support]
      - name: Guard và di chuyển
        gems: [Cast when Damage Taken Support, Immortal Call, Shield Charge, Faster Attacks Support]
    moveOn: "đã đeo Sunblast, suppression ở 100%, và trap của bạn tự nổ."
    details:
      - title: Cái gì đổi vào ngày bạn đeo Sunblast
        body: |
          Trước: bạn ném trap vào chỗ quái sẽ đi qua, rồi chờ.

          Sau: trap tự nổ tầm nửa giây tới một giây sau khi rơi, và bạn ném về phía trước trong lúc đang chạy bằng [[Shield Charge]].

          Bạn cũng phải bỏ mấy node trap trigger, vì chuyện quái kích trap không còn xảy ra nữa. Đừng quên bước đó — nếu không thì đó là mấy passive point miễn phí bị bỏ không.
      - title: Mẹo lấy aura từ spectre
        body: |
          [[Zealotry]] đến từ một con [[Raise Spectre]] link với
          [[Guardian's Blessing Support]]. Bạn triệu hai con Dark Marionette
          trong hideout; còn một con sống là bạn còn giữ aura mà không phải trả
          reservation.

          Lằng nhằng một lần lúc dựng, rồi miễn phí mãi mãi.
      - title: Tự động hóa curse
        body: |
          Craft "Trigger a Socketed Spell when you Use a Skill" lên cây wand và cắm [[Assassin's Mark]] vào. [[Shield Charge]] của bạn sẽ áp curse thay bạn.

          Bớt được một nút trong một build vốn đã đòi bấm khá nhiều.
  - id: endgame
    image: pain-attunement
    title: Endgame
    levels: Tier 17, pinnacle boss trở lên
    uses: >-
      [[Carcass Jack]], một cây [[Hubris Circlet]] maximum energy shield, ring có
      life recoup, cluster jewel, và cú đổi sang low life để lấy
      [[Pain Attunement]].
    changes: >-
      [[Petrified Blood]] cộng [[Vitality]] với [[Arctic Armour]] đã reserve kéo
      bạn xuống dưới nửa life để bật Pain Attunement lấy 30% more spell damage.
      Đó là một cú đổi thật, không phải nâng cấp miễn phí.
    links:
      - name: Main skill
        gems: [Ice Trap of Hollowness, Charged Traps Support, Trap and Mine Damage Support, Cold Penetration Support, Increased Critical Damage Support, Invert the Rules Support]
      - name: Chill và freeze
        gems: [Summon Skitterbots, Bonechill Support, Unbound Ailments Support]
      - name: Low life
        gems: [Petrified Blood, Vitality, Arctic Armour, Arrogance Support]
    moveOn: "không còn stage nào nữa. Thứ còn lại là một [[Watcher's Eye]], [[Lethal Pride]] và mấy viên awakened gem."
    details:
      - title: Một gợi ý của chúng tôi mà guide không thể đưa ra
        body: |
          3.30 làm [[Heartstopper]] thành buff Trickster lớn nhất: 75% less damage over time taken, tăng từ 50%. Build này không lấy nó, nên nó không được gì.

          Vùng phòng thủ mỏng nhất của build là degeneration với damage over time. Nên một cặp [[Forbidden Flame]] và [[Forbidden Flesh]] để lấy Heartstopper giờ là mục tiêu endgame tốt hơn mấy cái guide liệt kê — guide nêu Polymath, [[Born in the Shadows]] và [[Pyromaniac]] thay vào đó.

          Đây là suy luận của chúng tôi, từ một thay đổi 3.30 đặt cạnh một guide 3.29. Chưa ai thử nó.
      - title: Hai node Saboteur trong danh sách đó, và cái bẫy Ruthless
        body: |
          Cẩn thận ở đây. Danh sách jewel Forbidden của guide có
          [[Born in the Shadows]] và [[Pyromaniac]], đó là node **Saboteur**.

          Patch note 3.30 đổi cả hai cái đó — bên trong phần **riêng của
          Ruthless**. Born in the Shadows đi từ 10% lên 15% là Ruthless đang đuổi
          theo game thường, nơi nó vẫn là 15% từ đầu tới giờ. Chúng tôi xác nhận
          chuyện này bằng cách so dữ liệu cây chính thức: giá trị trong game
          thường không nhúc nhích.

          Nên nếu bạn đọc thấy Saboteur được buff trong 3.30, đó chính là chỗ đọc
          sai. Mấy con số đó không áp vào game của bạn.
      - title: Một chỗ guide mâu thuẫn nữa, trong mấy cái cây
        body: |
          Bản cây endgame dùng cluster jewel của guide **bỏ
          [[Ghost Dance]]**, dù chính phần văn xuôi của nó gọi Ghost Dance là lõi
          của chồng hồi phục.

          Chưa giải quyết. Hãy kiểm xem bạn thật sự có nguồn hồi phục nào trước khi
          import một bản cây.
      - title: Build vẫn chưa làm được gì
        body: |
          - Tâm cú nổ của bạn là vùng chết, nên mục tiêu đơn thì mãi mãi phải cắt lệch tâm.
          - [[Charged Traps Support]] bị chính cái belt bắt buộc của build vô hiệu một phần.
          - Không có leech nào, nên từng điểm hồi phục đều phụ thuộc vào năm keystone cùng chạy.
          - Cú đổi sang low life đem effective hit point ra đổi lấy damage.

powerCurve: |
  Damage là có bao nhiêu cái vòng chồng lên mục tiêu và mỗi vòng đánh đau cỡ nào. Có ba thứ đẩy nó lên, và chúng tới cách nhau rất xa: **[[Ice Trap of Hollowness]]**, thứ guide gọi là một cú đẩy khổng lồ cho damage và area; **[[Sunblast]]**, thứ biến một cú ném thành ba cái trap tự nổ, và được guide mô tả là tăng damage gấp ba trên thực tế; và, về cuối, [[Pain Attunement]] cho 30% more spell damage. Nằm dưới tất cả là throw speed, tức là frenzy charge qua [[Charged Traps Support]], được [[Swift Killer]] giữ cho sống.

  Trong campaign bạn không có cái nào trong ba thứ đó: [[Lightning Trap]] tới level 28, rồi [[Ice Trap]] gốc nhắm vào quái. Ở map trắng và map vàng bạn có transfigured gem trong một five-link, nhưng vẫn đang chờ quái đi vào trap, và bài viết nói thẳng là build trước Sunblast tệ hơn danh tiếng của nó. Cây belt là món của map đỏ và chính guide gọi nó là khá hiếm lúc league start, nên khúc giữa lóng ngóng đó kéo dài bao lâu thì không nằm trong tay bạn. [[Carcass Jack]], cluster jewel và cú đổi sang low life tới sau nó.

  Phòng thủ tới trong hai bước lab và một bước gear. [[Escape Artist]] với [[Eldritch Battery]] tới ở Cruel lab; [[Spellbreaker]] ở Merciless hoàn tất chồng hồi phục, và tới trước lúc đó bạn nên chuẩn bị chết nhiều hơn; [[Spell Suppression]] thì tới map đỏ mới lên 100%. Không có lớp armour nào ở bất cứ mốc nào, và cú đổi ở endgame đem một phần bộ đệm ra tiêu vào damage.

  Mọi chữ "khi nào" ở trên hãy đọc là của guide, mà guide thì chạy trên dữ liệu 3.28 với 3.29. "Gấp ba" là chữ của nó, không phải một phép đo, và chúng tôi không xác nhận được là mấy con số phòng thủ của nó đã tính tới 3.30.

play:
  mapping: |
    Trước [[Sunblast]], quái là thứ làm trap của bạn nổ, nên bạn ném vào chỗ một pack sắp đi qua rồi chờ nó đi vào. Đó là bản chậm của build và không có mẹo nào làm nó nhanh lên.

    Sau Sunblast, bạn di chuyển bằng [[Shield Charge]] và ném về phía trước mặt mình. Trap tự nổ tầm nửa giây tới một giây sau khi rơi, nên nhịp là ném, một nhịp chờ, nổ, và lúc đó bạn đã chạy tiếp rồi. Có craft trigger trên cây wand thì Shield Charge cũng áp [[Assassin's Mark]] thay bạn luôn.

    Không còn gì khác phải bấm. [[Summon Skitterbots]] chill quái, và kích một cái trap mỗi ba giây hay cỡ đó, đó là chỗ charge của bạn giờ đến từ. [[Immortal Call]] nằm trên [[Cast when Damage Taken Support]].
  bossing: |
    Ném ra một bên con boss, đừng ném lên nó. Đòn đánh là một cái vòng và tâm của nó là vùng chết, nên một cái trap nằm ngay trên boss sẽ đặt mấy cú nổ vòng quanh nó. Một cú ném là ba cái vòng, và việc của bạn là cho chúng chồng lên người boss.

    Trap đặt được trước khi boss hoạt động, nên hãy mở màn với một cú ném đã nằm sẵn dưới đất; bài viết liệt chuyện đó là một điểm mạnh. Sau đó thì cứ di chuyển và cứ ném. Vì damage rơi xuống trễ một nhịp so với cú ném, hãy nhắm vào chỗ boss sẽ đứng chứ không phải chỗ nó đang đứng — câu đó là cách chúng tôi đọc cái độ trễ, không phải một chỉ dẫn của guide.

    Tới hết map đầu, bài viết có liệt một link single target riêng gồm [[Bear Trap]], [[Frost Bomb]] và [[Assassin's Mark]]. Danh sách link ở map đỏ và endgame không còn hiện nó, và guide chưa bao giờ nói nó có ở lại hay không, nên chúng tôi sẽ không bảo bạn là có. Giữ [[Diamond Flask]] chạy khi đánh boss: bài viết gọi nó là nguồn ổn định crit duy nhất của build.

deaths:
  - situation: >-
      Trong campaign, trước Merciless lab
    cause: >-
      Chồng hồi phục chưa xong. [[Spellbreaker]] là mảnh làm cho
      [[Mind Over Matter]] và energy shield recharge chạy được cùng nhau, và
      nó tới cùng cái lab thứ ba.
    fix: >-
      Câu trả lời của bài viết là đó là bản chất build, không phải bạn làm
      sai. Đánh từ tầm ném trap, dồn hết vào life với resistance, và lấy cái
      lab đó sớm nhất có thể.
  - situation: >-
      Sau khi import một bản cây, hoặc đổi một món giáp
    cause: >-
      Không có leech, nên hồi phục là [[Eldritch Battery]],
      [[Mind Over Matter]], [[Ghost Dance]], [[Wicked Ward]] và
      [[Spellbreaker]] chạy như một hệ thống, và bài viết nói chúng sập cùng
      nhau. Bản cây cluster jewel của chính guide thì bỏ Ghost Dance, trong
      khi phần văn xuôi của nó gọi cái đó là lõi.
    fix: >-
      Đếm đủ cả năm cái trên cây trước khi chạy map. Giữ base hybrid evasion
      với energy shield ở mọi ô giáp, vì [[Escape Artist]] và Ghost Dance đều
      đọc từ chúng.
  - situation: >-
      Một cái map có reduced aura effect, không regeneration, hoặc bị hạ
      maximum resistance
    cause: >-
      Guide đánh dấu cả ba là nguy hiểm, và liệt chúng hai lần. Với cái đầu,
      bài viết có cho lý do: [[Grace]], [[Zealotry]] và [[Arctic Armour]]
      chính là phần phòng thủ. Với hai cái còn lại thì guide không cho cơ chế
      nào và chúng tôi cũng không tự đưa ra.
    fix: >-
      Roll lại map. Không cái nào trong ba đáng để tập chơi né.
  - situation: >-
      Ngay sau cú đổi sang low life
    cause: >-
      [[Petrified Blood]] và mấy aura đã reserve kéo bạn xuống dưới nửa life
      để bật [[Pain Attunement]]. Bài viết gọi đó là một cú đổi thẳng, đem
      effective hit point lấy 30% more spell damage, và nó chỉ đứng vững khi
      có life recoup trên ring và trên cây.
    fix: >-
      Có sẵn recoup và Reservation mastery trước khi đổi. Nếu vẫn chết thì
      gỡ ra; bài viết nói bỏ qua cú đổi ở hardcore hoặc nếu bạn chết nhiều.
  - situation: >-
      Một cú hit physical nặng, hoặc đứng trong damage over time
    cause: >-
      Không có lớp armour nào cả, và bài viết nêu degeneration với damage
      over time là phần mỏng nhất của phòng thủ.
    fix: >-
      Dùng cái tầm xa mà trap cho bạn và đừng đứng trong pack. Với damage
      over time, gợi ý của chính bài viết là [[Heartstopper]] qua jewel
      Forbidden; đó là suy luận của chúng tôi từ một thay đổi 3.30 và chưa ai
      thử nó.

troubleshooting:
  - symptom: >-
      Boss gần như không mất máu, dù pack thì chết
    cause: >-
      Bạn đang ném lên người boss. Mấy cú nổ tạo thành một cái vòng quanh
      điểm rơi, và tâm là chỗ yếu.
    fix: >-
      Ném lệch ra một bên để cái vòng rơi lên boss. Bài viết nói nó sẽ thấy
      sai sai trong khoảng một tiếng.
  - symptom: >-
      Charge trở nên chập chờn từ ngày đeo [[Sunblast]]
    cause: >-
      [[Charged Traps Support]] cho charge khi quái kích trap, mà Sunblast
      thì chặn quái kích chúng. Chỉ còn [[Summon Skitterbots]] kích được,
      với cooldown tầm ba giây.
    fix: >-
      Không có gì hỏng cả. Kiểm xem Skitterbots có đang ra không và
      [[Swift Killer]] đã được lấy chưa, vì charge duration của nó là thứ làm
      mấy giọt charge đó sống đủ lâu.
  - symptom: >-
      Có mấy passive point như không làm gì sau khi đeo Sunblast
    cause: >-
      Node trigger của Trap mastery và mấy notable trigger vẫn đang được
      gán. Chúng phụ thuộc vào chuyện quái kích trap, thứ không còn xảy ra
      nữa.
    fix: >-
      Bỏ chúng đi và tiêu mấy điểm đó vào chỗ khác.
  - symptom: >-
      Energy shield thấp hơn tổng số trên gear
    cause: >-
      [[Ghost Dance]] chặn energy shield ở mức evasion rating của bạn. Món
      energy shield thuần thì nâng một vế của chuyện đó mà không nâng vế kia.
    fix: >-
      Base hybrid evasion với energy shield ở mọi chỗ, và kiểm xem
      [[Escape Artist]] đang chuyển những gì từ helmet và body armour của
      bạn.
  - symptom: >-
      Damage lúc cao lúc thấp giữa các cú ném
    cause: >-
      Đây là build crit mà nguồn ổn định crit duy nhất là [[Diamond Flask]],
      và guide thì tự mâu thuẫn về chuyện chạy support crit nào.
    fix: >-
      Giữ flask chạy. Quy tắc của bài viết: support crit chance khi base crit
      còn thấp, crit damage khi nó đã cao, kiểm trong Path of Building chứ
      không đối chiếu với trang guide.

patch:
  - entry: trickster-buffs
    note: >-
      **Tin ascendancy tốt nhất trong mọi build trên site này.** Trickster nhận ba
      buff cho game thường và build này lấy hai cái. [[Spellbreaker]] giờ chặn 20%
      thay vì 15%, đáng tầm 15.6% less spell damage taken trong lúc đầy energy
      shield. [[One Step Ahead]] giờ chốt sàn action speed của bạn ở 105% base chứ
      không phải 90%, tức là ném trap nhanh hơn 5% không điều kiện cộng một cái
      sàn cứng chống mấy thứ làm chậm — mà đó đúng là trục yếu nhất của build.
      [[Heartstopper]] nhận buff lớn nhất trong ba cái và build thì không lấy nó.
  - note: >-
      **Bản thân [[Ice Trap]] không bị đụng tới.** Không active skill hay support
      gem nào bị đổi có ảnh hưởng tới nó.
  - entry: mercenary-nerfs
    note: >-
      **Không có cú nerf trap nào nhắm vào người chơi trong 3.30 — hãy kiểm lại
      nếu bạn đọc thấy điều khác.** Hai dòng về support trap với mine nằm dưới
      Mercenary Changes và nêu tên mercenary ngay trong phần chữ.
      [[Trap and Mine Damage Support]] của chính người chơi thì không đổi, vẫn
      30–49% more damage với penalty 10% throwing speed. Mấy support "Greater" chỉ
      là gem của mercenary.
  - entry: ruthless-changes
    note: >-
      **Mấy thay đổi về Saboteur chỉ thuộc Ruthless, mà danh sách jewel Forbidden
      của build này thì nêu hai node Saboteur.** Born in the Shadows lên 15% và
      Pyromaniac lên 2% mỗi giây đều nằm trong phần Ruthless. Bản export cây của
      chính GGG cho thấy giá trị trong game thường giống nhau từng con số trước và
      sau 3.30. Vài bài viết ngày launch hiểu sai chuyện này cho các class khác.
  - entry: golem-buff-nerfs
    note: >-
      **Vặt vãnh, và chỉ liên quan tới campaign.** [[Summon Stone Golem]] giờ cho
      16% increased defences thay vì 20%. Nó xuất hiện trong setup leveling ở
      level 34 và không ở đâu khác.
  - entry: loot-rarity-rework
    note: >-
      **Có lợi, về mặt cấu trúc.** Currency rare giờ chỉ rơi từ mấy cú roll rare,
      và mấy khoản trừ cũ bị bỏ. Một build mà guide của nó cho 4 trên 5 về
      bossing, với single-target damage cao và khả năng nạp trap sẵn, thì đang được
      chỉ đúng hướng. Đây là cách đọc patch note, không phải một phép đo.
  - entry: league-fates
    note: >-
      **Hợp với build.** Bạn chọn một Fate cho boss khu vực rồi lấy [[Viscera]] từ
      nó. Trap cho bạn nạp damage sẵn lên một con boss trước khi trận đánh bắt
      đầu, và đóng băng là một lớp phòng thủ thật trước thứ gì đánh mạnh.

strengths:
  - "Cần ít unique, và tự thân không món nào đắt."
  - "Đóng băng quái, một kiểu phòng thủ không hiện ra trong Path of Building."
  - "Area of effect cực lớn khi đã đeo Carcass Jack."
  - "Leveling dễ và an toàn: trap cho bạn đánh từ xa suốt campaign."
  - "Single-target damage cao. Bạn nạp trap sẵn lên một con boss trước khi nó hoạt động."
  - "Build duy nhất ở đây mà ascendancy thật sự được 3.30 buff."
weaknesses:
  - "Damage có độ trễ. Ném, chờ, nổ. Nó không phải bấm-là-chết và nó không bao giờ thành vậy."
  - "Giảm damage physical thấp. Không có lớp armour nào cả."
  - "Không có leech kiểu nào, nên hồi phục là năm keystone cùng sập với nhau."
  - "Đòn đánh là một cái vòng, nên tâm cú nổ của bạn là vùng chết."
  - "Charged Traps bị Sunblast vô hiệu một phần, mà Sunblast là cây belt build bắt buộc phải có."
  - "Guide là dữ liệu 3.28 với 3.29 và có ít nhất một con số sai thẳng trong đó."
  - "Không có chứng thực nào từ bên thứ ba: không tier list nào liệt kê build này cả."
avoidIf: >-
  Chọn build khác nếu bạn muốn phản hồi bấm-là-chết tức thì, hoặc nếu bạn muốn
  đứng giữa pack quái mà hứng physical damage. Bỏ qua nếu bạn không chịu giữ cho
  [[Eldritch Battery]], [[Mind Over Matter]], [[Ghost Dance]], [[Wicked Ward]] và
  về sau [[Petrified Blood]] cùng chạy như một hệ thống — chúng không xuống cấp từ
  từ, chúng sập cùng nhau. Và bỏ qua nếu bạn không lấy được transfigured gem hay
  một cây [[Sunblast]] tương đối sớm, vì thiếu món nào thì build cũng yếu đi đáng
  kể. Lối chơi trap thì chia rẽ người chơi và chính guide cũng nói vậy.

