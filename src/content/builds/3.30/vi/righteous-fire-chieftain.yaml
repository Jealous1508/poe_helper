name: Righteous Fire Chieftain
tagline: >-
  Bạn bật một skill rồi đi bộ. Mọi thứ quanh bạn cháy. Cả cái build tồn tại chỉ
  để ngọn lửa đó không giết luôn bạn.
class: Marauder
ascendancy: Chieftain
role: starter
budget: starter
budgetNote: >-
  Khởi đầu gần như không tốn gì: hai cây Iron Ring, khoảng sáu
  [[Orb of Transmutation]] và một lần respec mà Pohx trả tầm 750 gold.
  **Mọi con số khác chúng tôi có đều là từ kinh tế 3.29.** Những số của chính
  Pohx — body armour 6-link "không nên tốn hơn 20 chaos", hai Voidstone đầu dưới
  1 [[Divine Orb]], Uber Elder và Maven dưới 10 Divine, T17 tầm 30 Divine, Uber
  boss 50+ Divine — đều được viết theo giá league trước. 3.30 làm lại kinh tế.
  Hãy coi tất cả như một thứ tự tương đối, không phải giá.
mainSkill: Righteous Fire
image: righteous-fire
hero: art-chieftain
tags: [Fire damage over time, Một nút, Tanky, Khởi đầu rẻ]
ratings: { clear: 4, bossing: 2, survivability: 4, ease: 4 }
verified: "2026-11-13"
confidence: mixed
confidenceNote: >-
  Nguồn thì mới và build không bị 3.30 đụng tới. Ngoài hai điều đó thì chưa có
  gì chắc. Không có dữ liệu ladder 3.30, không có kinh tế 3.30 và không có tỷ lệ
  người chơi, vì league mới khởi động hôm nay. Maxroll **không** có guide
  Righteous Fire Chieftain nào cả — guide RF duy nhất của họ là một trang
  Juggernaut 3.21, cũ hơn chín patch. Nguồn chuẩn là Pohx: file Path of Building
  và FAQ của anh ta đóng dấu 11–12 tháng 11 2026 và đúng là 3.30 thật, nhưng
  guide chữ trên Mobalytics thì vẫn là text 3.29 từ tháng Tám. Bốn điểm số là
  phán đoán ngày đầu của researcher bên chúng tôi, không phải đo đạc, và được
  làm tròn xuống từ số lẻ nửa điểm (clear 4.5, survivability 4.5, ease 4.5).
  Bossing 2 là con số duy nhất có một nguồn độc lập đồng ý.
modes:
  ssf: >-
    Rất khả thi. Phần lõi là hai cây Ruby Ring từ vendor recipe cộng fire
    resistance craft ở bench, cả hai đều tự làm được. Pohx có kill Uber và Maven
    trong SSF.
  hardcore: >-
    Được, và Pohx khuyên chọn Chieftain hơn các ascendancy Righteous Fire khác
    cho hardcore. Lưu ý của anh ta: map đỏ giai đoạn đầu rất dễ chết, nên đi
    chậm thôi. Cửa sổ nguy hiểm là level 68 tới 85, trước khi có block và cái
    shield hồi phục.

idea: |
  [[Righteous Fire]] là một cái công tắc. Khi nó bật, nó đốt mọi con quái gần bạn mất 70% máu tối đa của bạn mỗi giây. Nó cũng đốt luôn *bạn*, mất 90% máu tối đa mỗi giây.

  Con số thứ hai đó chính là cả cái build. Bạn không chống nó chỉ bằng life regeneration. Bạn chống nó bằng **fire resistance**, vì cái lửa tự đốt là fire damage, và có một passive mastery biến đúng cái fire resistance đó thành life regeneration.

  Nên build là một vòng lặp: stack fire resistance, nó vừa hạ sát thương tự đốt vừa nâng lượng hồi máu cùng lúc. [[Chieftain]] rồi khiến một chỉ số làm luôn ba việc — [[Tasalio, Cleansing Water]] cho fire resistance của bạn tính luôn cho cold và lightning.

  Trong map bạn không bấm gì. Bạn đi, và mọi thứ chết. Đánh boss thì bạn đứng yên và chờ, và đó là cái giá thật của build.

chain:
  - label: Bật lên
    text: "[[Righteous Fire]] đốt mọi thứ trong một vòng bán kính nhỏ quanh bạn, mãi mãi, không cần hit, không cần crit, không cần attack speed."
  - label: Sống qua lửa của chính mình
    text: "Fire resistance cao cắt bớt sát thương tự đốt. [[Fire Mastery]] cho 1 life hồi mỗi giây trên mỗi điểm fire resistance chưa bị cap."
  - label: Cap mọi thứ còn lại
    text: "[[Tasalio, Cleansing Water]] áp 50% các mod fire resistance của bạn cho cold và lightning. [[Valako, Storm's Embrace]] làm điều tương tự với maximum resistance."
  - label: Dọn quái
    text: "[[Hinekora, Death's Fury]] cho 10% xác bạn giết nổ với 250% máu của chúng. Làm cho cú nổ đó ignite được thì nó lan khắp pack."
  - label: Giết boss
    text: "Riêng Righteous Fire không làm được. [[Fire Trap]] là single target của bạn cho tới khi dựng được totem Scorching Ray."

chainDetails:
  - title: Vì sao fire resistance vừa là chỉ số damage vừa là chỉ số phòng thủ
    body: |
      Lửa tự đốt là fire damage, nên fire resistance của bạn cắt nó như cắt bất kỳ cú fire hit nào khác. Không có gì khác làm được chuyện đó.

      [[Fire Mastery]] "Regenerate 1 Life per second per uncapped Fire Resistance" là thứ khiến chuyện này chạy được mà không cần gear. Ở 120% fire resistance là 120 life mỗi giây, ở level 20, miễn phí. Pohx nói về lý thuyết thì chạy được skill từ level 17 với 120% fire resistance, dù guide của chính anh ta chuyển quanh level 30.

      "Uncapped" là con số trong ngoặc trên character sheet, không phải cái cap 75%. Cứ đẩy nó lên: tối thiểu 120% trước khi bật Righteous Fire, 130% hoặc hơn khi vào map đỏ.

      Giữa game bạn muốn 800–1,400 life hồi mỗi giây. Endgame là 1,000+ regeneration và 7,000+ life.
  - title: Thứ gì scale damage, và thứ gì vô dụng
    body: |
      Righteous Fire là một degeneration. Nó không hit. Nên critical strike, accuracy, attack speed và cast speed đều vô giá trị.

      Nó scale theo: fire damage, burning damage, damage over time, fire damage-over-time multiplier, increased damage chung, elemental damage, area damage, frenzy charge, và máu tối đa cộng energy shield của bạn.

      **Spell damage không scale nó.** Đúng một chuyện đó quyết định vũ khí của bạn: bạn dùng sceptre, loại roll được tới 40% increased elemental damage, và không bao giờ dùng wand. Trên sceptre, ưu tiên fire damage-over-time multiplier trước, rồi +1 to level of all fire skill gems, rồi increased fire damage.
  - title: Chuỗi nổ biến nó thành build chạy map
    body: |
      [[Hinekora, Death's Fury]] cho quái bạn giết 10% cơ hội nổ với 250% máu tối đa của chúng dưới dạng fire damage. Nguyên văn Pohx: damage cực đoan tới mức one-tap được boss map.

      Để nó nổ thành chuỗi, cú nổ phải **ignite** được, cần 30–50% global ignite chance, và cái ignite phải lan. Ba nguồn lan nó: gloves với implicit Searing Exarch, cụm Fan the Flames, hoặc Berek's Respite. Dùng một thứ, không dùng hai.

      Một cảnh báo: bất cứ nguồn nổ cold nào cũng làm shatter xác, thứ phá vỡ cả chuỗi. Đừng trộn vào.
  - title: "Ramako, và vì sao bạn phải đứng yên"
    body: |
      [[Ramako, Sun's Light]] cho quái gần bạn −20% fire resistance với damage over time **khi bạn đứng yên**.

      Nó *đặt* luôn giá trị đó. Mod map và resistance của quái hết quan trọng, và Pohx gọi đây là node chạy map điên nhất trong game. Cái giá thì có hai mặt. Bạn không chồng thêm resistance reduction lên trên nó được, nên Chieftain bỏ [[Flammability]] (chạy [[Punishment]] thay thế), bỏ mọi nguồn Fire Exposure và bỏ Legacy of Fury. Và bạn phải đứng yên mới ăn đủ damage lên boss.

      Đó là nhược điểm lớn nhất của build. Quyết định ngay bây giờ xem bạn có chịu được hay không.
  - title: Lifetap thật ra để làm gì
    body: |
      [[Lifetap Support]] gắn vào Righteous Fire làm ba việc. Nó thêm khoảng 20% damage. Nó giải phóng gần như toàn bộ mana cho aura.

      Và nó thêm một tag Duration ẩn vào Righteous Fire, đó là lý do duy nhất [[Swift Affliction Support]] chạy được trên nó. Pohx gọi Swift Affliction là một trong những gem mạnh nhất của build. Không có Lifetap trong link, nó chẳng làm gì.

mandatory:
  - term: Righteous Fire
    why: >-
      Bản thân skill. Dùng được từ level 16, nhưng thứ quyết định lúc nào bạn bật
      được nó là fire resistance, không phải gem level.
    detail: >-
      Bạn lấy nó ở Act 2 từ Yeena tại Forest Encampment. Pohx mô tả là mua sau
      quest Intruders in Black; PoEDB ghi nó là reward của The Root of the
      Problem. Kiểu nào cũng là Act 2, Yeena, và bạn nên nhét nó vào weapon swap
      để lên level trong lúc còn đang chơi melee.
  - term: Fire Mastery
    why: >-
      "Regenerate 1 Life per second per uncapped Fire Resistance." Không có node
      này thì Righteous Fire giết bạn, đơn giản vậy. Đây là lý do build không cần
      gear để khởi đầu.
  - term: Tasalio, Cleansing Water
    why: >-
      Mod fire resistance cũng áp cho cold và lightning ở mức 50%. Đây là toàn bộ
      tiền đề về gear: một chỉ số lo ba resistance.
    detail: >-
      Nó còn cho bạn Unaffected by Ignite. Lưu ý là vài bài viết ngày launch nói
      Tasalio bị cắt xuống 25% trong 3.30. Thay đổi đó nằm ở phần **chỉ dành cho
      Ruthless** của patch note. Trong game thường nó vẫn là 50%.
  - term: Ramako, Sun's Light
    why: >-
      Đặt quái gần bạn về −20% fire resistance với damage over time khi bạn đứng
      yên. Mod map hết quan trọng.
  - term: Hinekora, Death's Fury
    why: >-
      Tốc độ dọn quái của bạn. 10% xác bạn giết nổ với 250% máu tối đa của con
      quái.
  - term: Valako, Storm's Embrace
    why: >-
      Mod maximum fire resistance cũng áp cho maximum cold và lightning
      resistance. Con đường duy nhất tới 90% maximum all resistance.
    detail: >-
      Ghi chú của Pohx không hề nêu tên node ascendancy thứ tư. Chúng tôi suy ra
      Valako vì build tiêu hết tám điểm, checklist map đỏ của anh ta hỏi bạn đã
      đạt 90% maximum all resistance chưa, và không node nào khác đưa bạn tới đó.
      Gần như chắc chắn, nhưng là suy luận.
  - term: Lifetap Support
    why: >-
      Nằm trong link Righteous Fire và link Fire Trap. Thêm damage, giải phóng
      mana, và hợp pháp hóa [[Swift Affliction Support]].
  - term: Swift Affliction Support
    why: >-
      Một trong những support mạnh nhất của build, và chỉ dùng được vì Lifetap
      cho Righteous Fire một tag Duration.
  - term: Fire Trap
    why: >-
      Righteous Fire không giết nổi boss. Fire Trap là single target của bạn gần
      như cả league. Mua ở Library Act 3.
    detail: >-
      Fire Trap of Blasting **không** chạy được: nó bỏ phần burning ground, mà
      đó chính là phần bạn cần.
  - term: Rise of the Phoenix
    level: recommended
    why: >-
      Shield level 65. Pohx gọi nó là cách tốt nhất để đạt 90% maximum fire
      resistance sớm. League trước rẻ; league này chưa có giá.
  - term: Immortal Flesh
    level: recommended
    why: >-
      Belt level 50, cho life regeneration phẳng rất lớn. Đừng trả hơn vài chaos
      cho nó.
  - term: Cloak of Flame
    level: recommended
    why: >-
      Body armour level 18 chuyển physical damage nhận vào thành fire, rồi cái
      fire resistance khổng lồ của bạn ăn gọn. Dùng được tới level 100.
  - term: Glancing Blows
    level: recommended
    why: >-
      Khoảng level 85, cùng một cây shield Shaper roll được 3–5% of life gained
      on block, đây là câu trả lời đầu tiên của Pohx cho "sao tôi cứ chết trong
      map đỏ".
    detail: >-
      Glancing Blows nhân đôi block chance của bạn và khiến cú bị block gây nửa
      damage thay vì không gây gì. Đi kèm hồi phục khi block, nó biến mọi cú đánh
      bay tới thành hồi máu. Nhắm 75% block và 75% spell block.
  - term: Punishment
    level: recommended
    why: >-
      Curse của bạn sau khi lấy Ramako. Curse hạ resistance hết tác dụng từ lúc
      đó, nên [[Flammability]] rời khỏi thanh skill.
  - term: Archdemon Crown
    level: recommended
    why: >-
      Helmet endgame, sau một cây Elder helmet craft có Concentrated Effect và
      Burning Damage. Bạn cắm Fire Trap vào đó.
  - term: Purity of Elements
    level: recommended
    why: >-
      Resistance cộng miễn hoàn toàn ailment suốt campaign. Lấy nó sau lần giết
      Piety đầu tiên ở Act 3.
  - term: Summon Skitterbots
    level: recommended
    why: >-
      Sau Uber lab, đây là thứ cho nhiều damage single target nhất trên mỗi điểm
      mana reserve. Link với [[Unbound Ailments Support]].
  - term: Mageblood
    level: recommended
    why: >-
      Belt của endgame sâu. Pohx nói rất rõ là bạn muốn cái này, không phải
      [[Headhunter]].

labs:
  - lab: Normal
    node: Tasalio, Cleansing Water
    why: "Mở khóa sức bền và chuyện gear. Pohx ascend ngay đầu Act 4, lúc anh ta nhặt golem."
  - lab: Cruel
    node: Hinekora, Death's Fury hoặc Ramako, Sun's Light
    why: "Nguyên văn Pohx: anh ta thích Hinekora cho tốc độ dọn quái, nhưng Ramako cho nhiều damage hơn hẳn. Chọn một cái."
  - lab: Merciless
    node: Cái còn lại trong hai cái trên
    why: "Ngay khi Ramako được gán, đổi Combustion ra lấy Swift Affliction, và đổi Flammability lấy Punishment."
  - lab: Uber
    node: Valako, Storm's Embrace
    why: "90% maximum all resistance. Là suy luận chứ không phải trích dẫn, nhưng không gì khác với tới con số đó."

stages:
  - id: acts-1-3
    image: asc-icon-chieftain
    title: Act 1–3
    levels: Level 1–30
    uses: >-
      Bạn là một Marauder melee bình thường. [[Ground Slam]] với một cây axe hai
      tay từ Tarkleigh, rồi [[Sunder]] ở Merveil's Caverns. Righteous Fire nằm
      trong weapon swap, lên level dần.
    changes: >-
      Mua **hai cây Iron Ring** sớm và giữ lại: chúng sẽ thành Ruby Ring. Bán đồ
      rare chưa identify để lấy [[Orb of Transmutation]] — bạn cần ít nhất sáu
      viên cho craft fire resistance ở bench.
    links:
      - name: Attack chính
        gems: [Ground Slam, Ruthless Support, Chance to Bleed Support]
      - name: Từ Merveil
        gems: [Sunder, Ruthless Support, Chance to Bleed Support]
      - name: Utility
        gems: [Leap Slam, Faster Attacks Support, Intimidating Cry]
      - name: Aura từ Act 3
        gems: [Blood and Sand, Purity of Elements, Herald of Ash]
    moveOn: "bạn có Righteous Fire trong weapon swap, hai cây Iron Ring, và đã làm xong Library Act 3."
    details:
      - title: Lộ trình passive
        body: |
          Born to Fight, Versatility, Butchery, Barbarism, [[Resolute Technique]], Hearty. Bạn đang dựng một nhân vật melee và bạn sẽ respec gần hết nó quanh level 31.

          Pohx trả khoảng 750 gold cho lần respec đó ở level 32. Chừa tiền cho nó; đừng né node melee để tiết kiệm.
      - title: Library Act 3 không phải tùy chọn
        body: |
          Trước khi giết Piety lần hai, hãy làm **A Fixture of Fate** và mở Siosa trong The Library.

          Danh sách mua: [[Fire Trap]], [[Efficacy Support]], [[Elemental Focus Support]], Trap and Mine Damage, [[Burning Damage Support]], [[Armageddon Brand]], [[Flammability]], [[Combustion Support]], và hai viên [[Lifetap Support]]. Thêm hai [[Swift Affliction Support]] và [[Malevolence]] nếu còn gold.

          Đây là nơi cả bộ gem của build đến từ. Bỏ qua nó là mất mấy tiếng.
      - title: Nhặt gì trên đường
        body: |
          Sau Hailrake: [[Chance to Bleed Support]] và một [[Quicksilver Flask]]. Sau Brutus: [[Leap Slam]], [[Faster Attacks Support]], [[Intimidating Cry]] và [[Vitality]].

          Sau lần giết Piety đầu tiên, lấy [[Purity of Elements]]. Bộ aura Act 3 thường dùng là [[Blood and Sand]], Purity of Elements và [[Herald of Ash]].
  - id: acts-4-10
    image: righteous-fire
    title: Act 4–10
    levels: Level 30–68
    uses: >-
      Khoảng level 31 bạn thôi làm melee. Bạn bật [[Righteous Fire]], cầm shield
      lên và bắt đầu Shield Charge. [[Fire Trap]] thay [[Armageddon Brand]]
      quanh level 40.
    changes: >-
      Ascend ngay đầu Act 4 để lấy [[Tasalio, Cleansing Water]]. Cruel lab sau
      Maligaro, Merciless quanh level 65. Sau Daresso và Kaom,
      [[Increased Area of Effect Support]] thay [[Efficacy Support]] trong main
      link.
    links:
      - name: Main skill
        gems: [Righteous Fire, Burning Damage Support, Elemental Focus Support, Lifetap Support]
      - name: Single target
        gems: [Fire Trap, Lifetap Support, Swift Affliction Support, Controlled Destruction Support]
      - name: Trước khi có Fire Trap
        gems: [Armageddon Brand, Combustion Support, Efficacy Support]
      - name: Di chuyển
        gems: [Shield Charge, Faster Attacks Support, Lifetap Support]
      - name: Aura
        gems: [Blood and Sand, Purity of Elements, Herald of Ash]
    moveOn: "Righteous Fire bật vĩnh viễn, bạn ở mức 120% uncapped fire resistance trở lên, và đã ascend hai lần."
    details:
      - title: Checklist để bật nó ở level 31
        body: |
          Làm theo thứ tự:

          1. Vendor hai cây Ruby Ring: Iron Ring cộng một skill gem đỏ bất kỳ, làm hai lần.
          2. Craft "+% to Fire Resistance" lên mọi suffix còn trống.
          3. Kiểm con số uncapped trong ngoặc. Bạn muốn **tối thiểu 120%**.
          4. Gamble hoặc mua một cây four-link.
          5. Đổi vũ khí hai tay sang sceptre cộng shield, và bắt đầu dùng [[Shield Charge]].
          6. Ascend lấy [[Tasalio, Cleansing Water]].

          Nếu lửa đang giết bạn, nghĩa là fire resistance của bạn quá thấp. Đó là nguyên nhân duy nhất.
      - title: Chọn bandit nào
        body: |
          Pohx lấy **Kraityn**. Anh ta gợi ý **Oak** cho người chơi mới, vì thêm life và regeneration thì dễ thở hơn.

          Giết cả ba để lấy passive point là lựa chọn cho single target. Cả ba đều biện hộ được; không cái nào quyết định build.
      - title: Những thứ người ta sẽ bảo bạn dùng mà bạn không nên dùng
        body: |
          Pohx nêu đây là các lỗi phổ biến: Legacy of Fury, [[Flammability]] (sau Ramako), bất cứ nguồn Fire Exposure nào, Master of Fire, [[Herald of Ash]] ở endgame, [[Headhunter]] và Brass Dome.

          Phần lớn chúng là hiệu ứng hạ resistance, mà [[Ramako, Sun's Light]] làm chúng vô dụng, vì nó đặt luôn giá trị thay vì cộng vào.
  - id: early-maps
    image: purity-of-elements
    title: Map đầu
    levels: Map trắng và map vàng
    uses: >-
      Setup Righteous Fire six-link, Fire Trap trong một cây Elder helmet craft,
      và sau Uber lab là một khối aura mới dựng quanh
      [[Summon Skitterbots]].
    changes: >-
      **Ngừng stack fire resistance chỉ để stack.** Chuyển cây sang life, chaos
      resistance, dexterity, life regeneration phẳng và
      "% increased Life Regeneration Rate", thứ nhân lên lượng regeneration từ
      Fire Mastery. Dù vậy vẫn giữ fire resistance gốc cao, vì Tasalio vẫn đang
      cap cold và lightning thông qua nó.
    links:
      - name: Main skill (six-link)
        gems: [Righteous Fire, Burning Damage Support, Elemental Focus Support, Increased Area of Effect Support, Lifetap Support, Swift Affliction Support]
      - name: Single target
        gems: [Fire Trap, Lifetap Support, Swift Affliction Support, Controlled Destruction Support]
      - name: Aura sau Uber lab
        gems: [Summon Skitterbots, Unbound Ailments Support, Tempest Shield, Flesh and Stone, Purity of Fire]
      - name: Utility
        gems: [Shield Charge, Faster Attacks Support, Enduring Cry]
    moveOn: "bạn đã xong Uber lab, đang ở 90% maximum all resistance, và ignite spread đã nằm trên gloves."
    details:
      - title: Những thứ mua đầu tiên
        body: |
          Theo thứ tự của Pohx, rẻ nhất trước: [[Rise of the Phoenix]], [[Immortal Flesh]], rồi **ignite spread trên gloves**, cái mà anh ta gọi là ưu tiên số một cho currency bỏ ra. Implicit Searing Exarch làm việc đó roll ra tầm 1 trên 50, nên mua thường tốt hơn tự roll.

          Rồi một cây five- hoặc six-link cho Righteous Fire, rồi cây Elder helmet craft với Concentrated Effect level 16 và Burning Damage level 16, cắm Fire Trap vào trong.

          League trước một cây body armour six-link tầm 20 chaos. **Giá đó là của 3.29 và không còn đúng.** 3.30 bỏ hẳn [[Orb of Binding]] và làm [[Orb of Chance]] hiếm hơn nhiều, nên link rẻ khó hơn chứ không dễ hơn.
      - title: Pantheon và golem
        body: |
          Soul of the Brine King làm major, Ralakesh làm minor. Farm Brine King bằng một [[Divine Vessel]] để lấy miễn freeze.

          Golem của bạn bắt đầu chết từ map vàng. Bỏ hẳn chúng quanh map đỏ; cái buff không đáng để gọi lại liên tục.
      - title: Gõ /passives
        body: |
          Campaign phát passive point cho những quest phụ mà có lẽ bạn đã bỏ qua. Gõ `/passives` trong chat và nó liệt kê hết những cái bạn còn thiếu.

          Với build này thường là bốn hay năm điểm, mà ở giai đoạn này là cả một bánh xe life.
  - id: red-maps
    image: titanium-spirit-shield
    title: Map đỏ
    levels: Map Tier 11–16, level 85+
    uses: >-
      Vẫn bộ gem đó, nhưng bên dưới là một lớp phòng thủ dựa trên block: một cây
      shield Shaper có 3–5% of life gained on block, cộng [[Glancing Blows]].
    changes: >-
      Respec sang block. Mua [[Cloak of Flame]]. Lấy cả setup Life Mastery sáu
      node một lượt, thứ đưa bạn qua mốc 7,000 life với ngân sách nhỏ. Đổi
      [[Enduring Cry]] sang Infernal Cry khi chạy map.
    links:
      - name: Main skill
        gems: [Righteous Fire, Burning Damage Support, Elemental Focus Support, Increased Area of Effect Support, Lifetap Support, Swift Affliction Support]
      - name: Single target
        gems: [Fire Trap, Lifetap Support, Swift Affliction Support, Controlled Destruction Support]
      - name: Aura
        gems: [Summon Skitterbots, Unbound Ailments Support, Tempest Shield, Flesh and Stone, Purity of Fire]
      - name: Chạy map
        gems: [Infernal Cry, Shield Charge, Faster Attacks Support]
      - name: Guard
        gems: [Immortal Call, Steelskin]
    moveOn: "bạn block ba trong bốn cú đánh, hồi máu khi block, và map Tier 16 không còn đe dọa bạn."
    details:
      - title: Vì sao lại là block, chính xác là vậy
        body: |
          Câu trả lời của Pohx cho câu hỏi anh ta nhận nhiều nhất — sao tôi cứ chết trong map đỏ ở level tám mươi mấy — luôn giống nhau: bạn chưa có hồi phục khi block.

          Cây shield là một base Shaper roll được "3–5% of Life gained when you Block", qua Pristine fossil hoặc một lần life reforge của Harvest. Với [[Glancing Blows]] bạn đạt 75% block và 75% spell block, và mỗi cú bị block đều hồi máu cho bạn.

          Đây là bước nhảy sống sót lớn nhất của build, và đó là lý do level 68 tới 85 là cửa sổ nguy hiểm.
      - title: Mod map giết bạn
        body: |
          - **No Regeneration.** Đừng bao giờ chạy. Cả hệ phòng thủ của bạn là regeneration.
          - **Less Recovery.** Chỉ ổn ở map trắng.
          - **Reduced effect of non-curse auras.** Không bao giờ.
          - **Negative maximum resistances.** Lửa tự đốt tăng lên và lượng hồi máu giảm xuống cùng lúc.

          Riêng cho Chieftain: **monsters cannot be affected by elemental ailments** giết chuỗi nổ của bạn, và **monsters steal endurance charges** lấy mất một lớp phòng thủ.
      - title: Tiền tiếp theo đi đâu
        body: |
          Dawnbreaker, một cây ring Pyre, và Nebulis ở giữa và cuối game. Anoint Disciple of the Unyielding.

          Giá của tất cả mấy thứ này là giá 3.29. Chúng tôi không có con số 3.30 cho bất cứ thứ gì, và ngày đầu thì chẳng ai có.
  - id: endgame
    image: archdemon-crown
    title: Endgame
    levels: Pinnacle boss và map juice
    uses: >-
      [[Archdemon Crown]], và từ khoảng level 90 là một setup totem Scorching Ray
      of Immolation cho single target. [[Mageblood]] là khoản đầu tư sâu.
    changes: >-
      Damage của bạn thôi đến từ Righteous Fire và bắt đầu đến từ totem. Thứ tự
      single target của Pohx là Scorching Ray of Immolation trên
      [[Spell Totem Support]] trước, rồi [[Fire Trap]], rồi Searing Bond of
      Detonation.
    links:
      - name: Main skill
        gems: [Righteous Fire, Burning Damage Support, Elemental Focus Support, Increased Area of Effect Support, Lifetap Support, Swift Affliction Support]
      - name: Single target (level 90+)
        gems: [Scorching Ray of Immolation, Spell Totem Support, Swift Affliction Support, Efficacy Support]
      - name: Aura
        gems: [Summon Skitterbots, Unbound Ailments Support, Tempest Shield, Flesh and Stone, Purity of Fire]
    moveOn: "không còn stage nào nữa. Từ đây câu hỏi là cái trần đó đáng bao nhiêu với bạn."
    details:
      - title: Chuyển sang totem, và vì sao nên làm sớm hơn trong 3.30
        body: |
          Scorching Ray of Immolation trên [[Spell Totem Support]] là single target tốt nhất build có. Nó cần một cây shield +1 totem và notable Totemic Zeal. Totem bỏ qua cap chồng stack, nên bạn đạt hơn 70 stack debuff.

          Đây rõ ràng là bước chuyển của level 90 trở lên, không phải setup starter. **Nhưng cơ chế league 3.30 dựng quanh boss, mà bossing lại đúng là điểm yếu duy nhất của build này.** Hãy tính chuyện chuyển sớm hơn so với league trước.
      - title: Fireball of Radiation không phải một kế hoạch
        body: |
          [[Fireball of Radiation]] là thứ mới trong 3.30, và Pohx đã ra một video hỏi liệu nó có phải single target mới của Righteous Fire.

          FAQ của chính anh ta, cùng ngày, đoán là nó tệ hơn [[Fire Trap]], vì nó không hit nên không ignite được. Chưa ai thử nó trong một trận đánh thật. **Đừng lên kế hoạch khởi đầu league quanh nó.**
      - title: Build này không làm được gì
        body: |
          Pohx nói thẳng về cái trần: người chơi trung bình dừng ở 2–4 triệu damage mỗi giây, và giết Uber boss thì không được khuyên.

          Nó dở ở Sanctum, nơi mục tiêu là không bị đánh mà build này thì được thiết kế quanh việc bị đánh. Nó dở ở Delirium 80%+, Legion và Simulacrum wave cao.

          Trang atlas của chính anh ta hiện tại viết, nguyên văn, rằng atlas đã đổi và anh ta cần thời gian để tính lại. **Chưa ai giải lại chiến lược farm cho Righteous Fire trong 3.30.**

patch:
  - note: >-
      **Không có gì trong 3.30 đụng tới build này.** Righteous Fire,
      [[Fire Trap]], Scorching Ray of Immolation, Searing Bond và ascendancy
      Chieftain không xuất hiện ở bất cứ phần game thường nào của patch note.
  - entry: ruthless-changes
    note: >-
      **Bỏ qua mấy bài "Chieftain bị nerf".** Ít nhất một trang ngày launch nói
      [[Tasalio, Cleansing Water]] giờ chỉ chuyển 25% và các passive nhỏ của
      Chieftain cho 10% fire resistance thay vì 15%. Mấy con số đó đến từ phần
      **chỉ dành cho Ruthless** của patch note. Bản export passive tree của chính
      GGG xác nhận giá trị game thường của Tasalio (50%) và Pyromaniac không đổi
      so với 3.29.
  - entry: league-fates
    note: >-
      **Vấn đề thật của build này trong 3.30.** Cơ chế league dựng quanh boss khu
      vực được tăng cường, mà bossing là điểm yếu duy nhất của build. Không có gì
      bị nerf; chỉ là phần thưởng dịch về phía đúng cái nó dở. Hãy tính chuyện
      chuyển sang totem Scorching Ray sớm hơn league trước.
  - entry: vendor-recipe-changes
    note: >-
      **Một cú nerf âm thầm, không nhắm vào build nào.** [[Orb of Binding]] không
      còn rơi và [[Orb of Chance]] hiếm hơn nhiều, nên cây five- hay six-link rẻ
      sớm mà kế hoạch của build này giả định sẽ khó có hơn. Four-link giờ đến từ
      vendor, từ drop và từ [[Orb of Fusing]].
  - entry: loot-rarity-rework
    note: >-
      **Có lợi.** Một tỷ lệ lớn hơn hẳn của currency giá trị giờ đến từ quái rare
      và unique. Map dày đặc quái rare đúng là thứ [[Hinekora, Death's Fury]]
      farm. Để ý cách diễn đạt — "một tỷ lệ lớn hơn hẳn", không phải "phần lớn".
  - entry: golem-buff-nerfs
    note: >-
      **Gần như không liên quan.** Buff golem nhỏ đi, nhưng Pohx dù sao cũng bỏ
      golem từ map vàng vì chúng chết.
  - entry: winter-orb-nerf
    note: >-
      **Bối cảnh cạnh tranh.** Spell được chơi nhiều nhất của 3.29 mất khoảng 40%
      damage, và các build mercenary bị cắt nặng. Righteous Fire không mạnh hơn,
      nhưng kha khá đối thủ của nó thì yếu đi.

strengths:
  - "Khởi đầu rẻ nhất trên trang này: hai cây Iron Ring và sáu viên Transmute."
  - "Rất trâu khi block đã online: 90% maximum all resistance, regeneration lớn, năm endurance charge."
  - "Bạn bỏ qua hoàn toàn cold và lightning resistance trên gear."
  - "Chống mod map tốt nhất nhóm, vì Ramako đặt luôn giá trị."
  - "Gần như không bấm nút. Bạn đi và mọi thứ chết."
  - "Mạnh trong SSF: mọi mảnh lõi đều craft được hoặc là vendor recipe."
weaknesses:
  - "Single target thấp. Người chơi trung bình dừng ở 2–4 triệu damage mỗi giây."
  - "Bạn phải đứng yên khi đánh boss vì Ramako, thói quen tệ nhất có thể có khi còn nghèo."
  - "Bạn tiêu 30 level đầu làm nhân vật melee chơi một build khác."
  - "Bốn mod map là lệnh cấm tuyệt đối, cộng hai cái nữa riêng cho Chieftain."
  - "Dở ở Sanctum, Uber, Delirium cao, Legion và Simulacrum sâu."
  - "Cái trần tốn 50–300 Divine để với tới, tính bằng tiền của league trước."
avoidIf: >-
  Đừng chọn cái này nếu bạn muốn farm Uber pinnacle boss, chạy Sanctum, hay clear
  map Tier 17 với giá rẻ. Đừng chọn nếu việc đứng yên đánh boss làm bạn khó chịu,
  hoặc nếu bạn không chịu chơi 30 level melee trước. Điểm yếu duy nhất của nó là
  bossing, mà 3.30 là một league về boss.

