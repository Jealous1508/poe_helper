name: Forged Frostbearer Spectre Necromancer
tagline: >-
  Mười bốn con spectre nã cối lạnh vào cùng một chỗ. Các loạt đạn bay song song,
  nên chúng rơi chồng lên nhau và boss thì đổ.
class: Witch
ascendancy: Necromancer
role: starter
budget: low
budgetNote: >-
  **Cả hai guide spectre đều không công bố budget khởi đầu. Hãy coi chi phí vào
  cửa là chưa được kiểm chứng.** Mấy khoản craft rời rạc mà guide có cho thì
  không ghi nhãn và là của thời 3.29: 2 [[Divine Orb]] để khóa prefix trên một
  cây wand, 2 Divine cho craft bench "up to three crafted modifiers", 200 Primal
  Crystallised Lifeforce cộng 3 [[Crystallised Rancour]] để chắc chắn ra mod
  Raise Spectre trên boots, và 2 Divine để khóa suffix trước một
  [[Veiled Chaos Orb]]. Lời khuyên của chính tác giả là trong trade league, mua
  wand và shield làm sẵn thường rẻ hơn tự craft. 3.30 làm lại chỗ currency rơi,
  nên mấy khoản tính bằng Divine từ bản sửa 3.29 là không đáng tin.
mainSkill: Raise Spectre
image: raise-spectre
hero: art-necromancer
tags: [Minion, Cold, Boss killer, Ít nút]
ratings: { clear: 3, bossing: 4, survivability: 4, ease: 3 }
verified: "2026-11-13"
confidence: mixed
confidenceNote: >-
  Đây là **guide được bảo trì tốt nhất** đứng sau bất kỳ build nào trên trang
  này: hai mươi mục changelog trở lên từ tháng 10 2025 tới 12 tháng 11 2026, với
  những lần sửa nội dung thật vào ngày 7 và 8 tháng 11 có đổi item thật. Nó đúng
  là 3.30, không phải đóng dấu lại. Thứ chưa chắc: guide **không công bố điểm số
  nào cả** — researcher bên chúng tôi xác nhận trực tiếp trong dữ liệu planner,
  nơi các trường rating không hề tồn tại — nên mọi con số ở trên là ước lượng của
  researcher bên chúng tôi, làm tròn xuống từ số lẻ nửa điểm (clear 3.5, bossing
  4.5, survivability 4.5). Ease là cái khó cho điểm nhất: endgame thì gần như một
  nút và đáng 4, còn campaign thì 2.5. Cũng không có dữ liệu ladder 3.30 cho bất
  kỳ ai, vì league mới khởi động hôm nay.
modes:
  ssf: >-
    Từ kém tới tạm được, và tệ hơn vẻ ngoài. Forged Frostbearer không thể được
    chia sẻ khi chơi một mình, nên bạn phụ thuộc hoàn toàn vào Verisium Ore
    Deposit. [[The Dark Monarch]] và [[Congregation Support]] — hai thứ nhân số
    spectre của bạn lên — **đều rơi từ cùng một con boss endgame**. Mấy con
    spectre từ xác ritual thì thật ra dễ hơn khi chơi một mình, vì dù sao chúng
    cũng không trade được. Một dự án dài, không phải một khởi đầu league.
  hardcore: >-
    Guide có kèm một file Path of Building hardcore riêng, và block cộng giảm trừ
    physical cộng energy shield là một lớp vỏ hợp lý. Rủi ro nằm ở bước chuyển:
    Chaos Inoculation tới muộn, và đoạn hybrid trước đó là cửa sổ nguy hiểm. Một
    nguồn duy nhất.

idea: |
  Bạn raise spectre và chúng lo hết phần damage. Con spectre bạn muốn là **Forged Frostbearer**, con nã một quả cối lạnh.

  Mẹo nằm ở [[Greater Volley Support]]. Nó thêm bốn projectile bắn ra từ các điểm hai bên, và chúng bay **song song** thay vì xòe ra. Vì cối thì được nã lên rồi rơi xuống một vùng, các loạt song song đều rơi xuống cùng một mục tiêu. Mười bốn con spectre cùng nã loạt song song vào một con boss là một lượng damage khổng lồ dồn vào một khoảng không gian rất nhỏ.

  Nên chỉ số damage chính là **bạn có bao nhiêu con spectre**, và đó là lý do danh sách gear trông như vậy. Bạn đi từ ba con giai đoạn đầu, lên chín con ở giữa, rồi mười bốn con về cuối.

  Bạn sống nhờ block, [[Bone Barrier]] và cuối cùng là energy shield thuần. Một cây wand tự cast [[Bone Offering]] cho bạn là thứ khiến endgame gần như thành build một nút.

chain:
  - label: Raise
    text: "[[Raise Spectre]] trong hai link riêng: một six-link toàn Frostbearer, và một link nhỏ hơn cho mấy con spectre hỗ trợ."
  - label: Loạt đạn
    text: "[[Greater Volley Support]] bắn thêm bốn projectile song song, nên mấy quả cối dồn vào nhau thay vì trải ra."
  - label: Nhân lên
    text: "[[The Dark Monarch]] nhân đôi số spectre tối đa. [[Congregation Support]] cộng thêm 30–38% nữa."
  - label: Chill
    text: "[[Bonechill Support]] và Hypothermia biến cold damage thành một multiplier damage thông qua chill."
  - label: Block
    text: "[[Mistress of Sacrifice]] áp [[Bone Offering]] lên cả bạn, và một cây wand trigger thì cast nó thay bạn."

chainDetails:
  - title: Vì sao mấy loạt đạn lại shotgun
    body: |
      [[Greater Volley Support]] bắn thêm bốn projectile từ tối đa bốn điểm mỗi bên, ở mức 21–30% less projectile damage. Phần quan trọng là chúng bay **song song**, không xòe.

      Một quả cối được nã lên rồi rơi xuống một vùng. Năm quả cối song song nhắm vào một con quái thì đều rơi lên hoặc ngay cạnh con đó, nên một loạt của một con spectre hit boss nhiều lần. 30% increased area of effect từ Minion Offence mastery mở rộng từng vùng rơi, thứ làm tăng độ chồng.

      Một cảnh báo thực dụng mà guide không nêu: **Greater Volley là một gem Dexterity.** Nó cần 63 Dexterity ở gem level 1 và 111 ở level 20. Trên một con Witch đó là đầu tư thật, và nó làm người ta hớ.
  - title: Số spectre chính là cả build
    body: |
      Mọi món đắt tiền trong danh sách tồn tại để nâng một con số.

      - **[[The Dark Monarch]]**, bản Raised Spectres, **nhân đôi** số spectre tối đa và cấm mọi loại minion khác.
      - **[[Congregation Support]]** cho 30–38% *more* maximum minion, lên tới 64% ở gem level 15. Level 72, và nó rơi từ Incarnation of Dread.
      - +1 spectre từ một mod amulet, +1 từ [[Bitterbind Point]], +1 hoặc +2 từ boots Elder Warlock elevated.
      - Bản thân gem: một con ở level 1, hai con ở 13, ba con ở 25.

      Ba tới năm con giai đoạn đầu, chín con ở giữa, mười bốn con về cuối. Cây min-max thì chạy mười hai và đánh đổi số lượng lấy chất lượng.
  - title: Spectre nào, và chúng đến từ đâu
    body: |
      - **Forged Frostbearer** — damage của bạn. Từ **Verisium Ore Deposit và Outcrop trong map**, hoặc được chia sẻ ở kênh chat global Minion, channel 666. Nó là quái của league Crucible và không spawn tự nhiên.
      - **[[Carnage Chieftain]]** — frenzy charge. Act 2, The Old Fields, với [[Desecrate]]. Miễn phí.
      - **Perfect Forest Warrior** — Onslaught và culling. Một item xác ritual, không chia sẻ được.
      - **Perfect Guardian Turtle** — Determination và 5% giảm trừ physical phẳng. Cũng là một xác ritual.
      - **Perfect Primal Thunderbird** cho Grace, và **Primal Crushclaw** cho increased cold damage taken. Cả hai đều muộn.

      Nếu bạn không tìm được Frostbearer, hàng thay thế lúc đi level là Slave Driver từ Control Blocks ở Act 5 hoặc Frost Auto-Scout ở Act 9, cùng [[Bitterdream]]. Đó là một build tạm thời yếu hơn thật, và guide nói thẳng vậy.
  - title: Cửa chặn về chuyện tìm spectre, nói thẳng ra
    body: |
      **Đây là rủi ro lớn nhất của build.** Forged Frostbearer không spawn tự nhiên ở bất cứ đâu. Hoặc bạn gặp may với Verisium Ore Deposit trong map, hoặc bạn xin một con ở global 666 và có người gọi nó ra cho bạn desecrate.

      Guide liệt "legion farming" — chuyện grind spectre và item xác — là một trong ba nhược điểm của nó. Nếu bạn không chịu dùng trade chat, chọn build khác.
  - title: Bước chuyển sang energy shield
    body: |
      Bạn khởi đầu là một con hybrid life và energy shield rồi kết thúc là energy shield thuần. Bước đổi là ba keystone lấy **cùng lúc**: [[Chaos Inoculation]], [[Ghost Reaver]] và [[Zealot's Oath]].

      Cùng nhau, chúng biến life leech của [[Bone Barrier]] thành energy shield leech và life regeneration của bạn thành energy shield regeneration. Lấy một hay hai trong ba cái là bạn không còn nguồn hồi phục nào cả.

      Một trong hai món boots hoặc gloves của bạn phải là base hybrid energy shield và evasion, để nó roll được spell suppression.

mandatory:
  - term: Raise Spectre
    why: >-
      Chạy nó trong hai link riêng: một six-link chỉ chứa Frostbearer, và một
      four-link chứa mấy con spectre hỗ trợ.
    detail: >-
      Nó là quest reward Act 3 từ Sever the Right Hand, có cho Witch, và cần nhân
      vật level 28. Guide đặt chuyện bắt Carnage Chieftain ở mục Act 2 của nó,
      đọc lên như thể bạn đã có gem từ sớm. Bạn không có. Hãy tới Act 3, lấy gem,
      rồi **quay lại The Old Fields ở Act 2**.
  - term: Greater Volley Support
    why: >-
      Bốn projectile song song thêm. Đây là thứ làm mấy quả cối chồng lên nhau, và
      là lý do build giết được boss.
    detail: >-
      Một gem Dexterity: 63 Dexterity ở level 1, 111 ở level 20. Hãy tính trước
      khoản đầu tư attribute trên một con Witch.
  - term: The Dark Monarch
    why: >-
      Nhân đôi số spectre tối đa. Món quan trọng nhất.
    detail: >-
      **Bẫy database:** item này có một biến thể cho mỗi loại minion, và trang mặc
      định bạn tìm thấy sẽ hiện bản Animated Weapons. **Hãy mua bản Raised
      Spectres.** Base Lich's Circlet, level 84, 224 Intelligence, rơi từ
      Incarnation of Dread — nên món lõi tới khá muộn.
  - term: Congregation Support
    why: >-
      30–38% more maximum minion, lên tới 64% ở gem level 15. Multiplier số
      spectre thứ hai.
    detail: >-
      Level 72, và nó rơi từ Incarnation of Dread — cùng con boss với
      [[The Dark Monarch]]. Hai multiplier nằm sau một con boss chính là cửa chặn
      chính của build.
  - term: Bitterbind Point
    why: >-
      +1 spectre, được guide gọi là bắt buộc. Shield của bạn cho cả build, và
      cũng là lý do bạn không bao giờ dùng được staff.
  - term: Bone Offering
    why: >-
      Block chance cho minion của bạn, và cho cả bạn qua
      [[Mistress of Sacrifice]]. Do một cây wand trigger cast, không phải bấm
      tay.
    detail: >-
      Mod wand là "Trigger a Socketed Spell on Using a Skill". Nó chứa Bone
      Offering và một [[Desecrate]] level 1. Craft này mở khóa bằng cách tìm cái
      cống ẩn trong The Refinery ở Act 9, chỗ rất dễ bỏ qua và đáng đi vòng.
  - term: Mistress of Sacrifice
    why: >-
      Áp offering lên cả bạn chứ không chỉ minion. Đây là thứ biến cây wand
      trigger thành cả attack block lẫn spell block của bạn.
  - term: Bone Barrier
    why: >-
      Hồi máu khi minion gây damage, giảm trừ physical, và độ sống sót của minion.
      Sau bước đổi keystone thì nó thành toàn bộ nguồn energy shield của bạn.
  - term: Mindless Aggression
    why: >-
      Minion life và damage. Đây là cái lab mà spectre của bạn thôi chết.
  - term: Commander of Darkness
    why: >-
      Aura effect, cách rẻ nhất để cap resistance trong campaign. Sau này được
      thay bằng node bloodline Umbral Army của Catarina.
    detail: >-
      Hai guide spectre bất đồng về Umbral Army — một bên gọi nó là node
      bloodline, bên kia gọi nó là notable ascendancy cho 140% increased global
      defences. Chúng tôi không xác định được bên nào đúng. Chưa xác nhận.
  - term: Chaos Inoculation
    why: >-
      Một trong ba keystone phải lấy cùng nhau cho bản energy shield thuần giai
      đoạn muộn. Lấy một mình thì nó chỉ đặt máu bạn về 1.
  - term: Ghost Reaver
    why: >-
      Chuyển leech sang energy shield. Bắt buộc cho bước đổi.
  - term: Zealot's Oath
    why: >-
      Chuyển life regeneration sang energy shield regeneration. Bắt buộc cho bước
      đổi.
  - term: Death Attunement
    level: recommended
    why: >-
      +1 spectre và thêm minion damage. Mục tiêu anoint thường dùng trước khi bạn
      đổi sang [[Whispers of Doom]].
  - term: Fortress Covenant
    level: recommended
    why: >-
      Một multiplier minion damage lớn, đổi lại bạn ăn thêm damage. Dùng ở giữa
      game, khi phòng thủ của bạn đã trả nổi.
  - term: Bitterdream
    level: recommended
    why: >-
      Chỉ để đi level. Nó cho Spell Echo cho gem cắm trong đó, và đó là thứ khiến
      mấy con spectre tạm thời dùng được trước khi bạn tìm ra Frostbearer.
  - term: Twilight Regalia
    level: recommended
    why: >-
      Body armour endgame. Cần 293 Intelligence và item level 86 cho energy
      shield tier cao nhất.
  - term: Darkness Enthroned
    level: recommended
    why: >-
      Kèm một mod Leech, được guide gọi là bắt buộc cho giai đoạn cuối.
  - term: Animate Guardian
    level: recommended
    why: >-
      Một con minion mang hàng, đeo Leer Cast, Zahndethus' Cassock, Dying Breath,
      Windscream và gloves elemental weakness.
    detail: >-
      Đưa tổng gem level của nó lên 15 trở lên trước khi mang vào map, không thì
      nó chết và bạn mất sạch mọi món trên người nó.
  - term: The Dark Seer
    level: recommended
    why: >-
      Một cây vũ khí +2 minion gem cho weapon swap. Đổi sang nó khi ngoài trận,
      để spectre của bạn không bị tụt level và chết lúc bạn đổi gear.

labs:
  - lab: Normal
    node: Commander of Darkness
    why: "Aura effect, thứ chữa resistance trong campaign rẻ hơn gear làm được."
  - lab: Cruel
    node: Mindless Aggression
    why: "Minion life và damage. Spectre của bạn thôi chết vì boss map."
  - lab: Merciless
    node: Mistress of Sacrifice
    why: "Bone Offering áp lên cả bạn. Block chance của bạn gần như tới cùng một lúc."
  - lab: Uber
    node: Bone Barrier
    why: >-
      Hồi phục, giảm trừ physical và độ sống sót của minion, rồi về sau là toàn bộ
      nguồn energy shield của bạn. Lưu ý là cả hai guide spectre đều cho thứ tự
      mà không nêu tên lab; vì mỗi notable tốn hai điểm và mỗi lab cho hai điểm,
      cách ánh xạ là một-một, nhưng đó vẫn là suy luận của chúng tôi.

stages:
  - id: acts-1-3
    image: desecrate
    title: Act 1–3
    levels: Level 1–31
    uses: >-
      [[Rolling Magma]] hoặc [[Freezing Pulse]] tới level 4, rồi
      [[Summon Raging Spirit]], rồi **[[Absolution]] sau Merveil**.
      Absolution gánh cả campaign; bạn vẫn chưa phải một build spectre.
    changes: >-
      Mua [[Holy Flame Totem]] và [[Flame Wall]] từ Nessa ở Act 1. Dùng
      [[Flesh Offering]] lên xác ở Act 2. Ở Act 3, Lost in Love cho bạn
      [[Conductivity]] để đánh rare và boss.
    links:
      - name: Level 1–4
        gems: [Rolling Magma, Freezing Pulse]
      - name: Act 1
        gems: [Summon Raging Spirit, Holy Flame Totem, Flame Wall]
      - name: Từ Merveil
        gems: [Absolution, Elemental Army Support, Minion Damage Support]
      - name: Utility
        gems: [Flesh Offering, Desecrate, Frostblink, Shield Charge]
      - name: Act 3
        gems: [Conductivity, Convocation]
    moveOn: "bạn đã có Raise Spectre, một con Carnage Chieftain, và đã vét sạch cửa hàng của Siosa."
    details:
      - title: Thời điểm Raise Spectre, đã sửa lại
        body: |
          Guide đặt chuyện bắt Carnage Chieftain ở mục Act 2 của nó, với câu "once you have Raise Spectre, return to The Old Fields."

          Đọc theo trình tự thì rất dễ nhầm, vì bạn không thể có gem ở Act 2. [[Raise Spectre]] là quest reward **Act 3** và cần nhân vật level 28.

          Nên: tới Act 3, lấy gem, đi bộ về The Old Fields ở Act 2, [[Desecrate]], và raise một con [[Carnage Chieftain]] để lấy frenzy charge. Chuyến đi đó đáng.
      - title: Những thứ không cần lo
        body: |
          Minion [[Raise Zombie]] chết liên tục trước level 21. Đừng gọi lại hoài — cứ để gem lên level.

          [[Holy Flame Totem]] rời khỏi build khoảng giữa Act 2. Một cái altar corruption trong The Vaal Ruins có thể roll ra Vaal Absolution, một nâng cấp miễn phí nếu nó trúng.
      - title: Siosa mở khóa gần hết bộ gem của bạn
        body: |
          Làm A Fixture of Fate trong The Library và mua từ Siosa quanh level 31. Ông này bán gem bất kể class, chuyện đó quan trọng với một con Witch.

          [[Convocation]] nằm ở trang mua thứ bảy, chỗ người ta hay bỏ sót vì thôi không kéo xuống nữa.
  - id: acts-4-10
    image: purity-of-elements
    title: Act 4–10
    levels: Level 31–68
    uses: >-
      Vẫn [[Absolution]]. [[Summon Stone Golem]] từ Act 4 để lấy buff life
      regeneration. Quanh level 46 thì khối aura bật lên.
    changes: >-
      Khi Sovereignty và cái mastery 12% reservation đã được gán, chạy
      [[Purity of Elements]], [[Herald of Purity]], [[Vitality]] và
      [[Clarity]]. **Giữ Vitality và Clarity ở gem level thấp** — bạn cần mana
      cho Absolution.
    links:
      - name: Main skill
        gems: [Absolution, Elemental Army Support, Minion Damage Support, Feeding Frenzy Support]
      - name: Aura từ level 46
        gems: [Purity of Elements, Herald of Purity, Vitality, Clarity]
      - name: Minion và utility
        gems: [Summon Stone Golem, Convocation, Desecrate, Flesh Offering]
      - name: Di chuyển và guard
        gems: [Shield Charge, Momentum Support, Steelskin, Arcane Surge Support]
    moveOn: "bạn đã xong Act 10 và có năm viên Raise Spectre dự phòng đang lên level trong weapon swap."
    details:
      - title: Chuẩn bị từ campaign sang map
        body: |
          Mua **năm viên [[Raise Spectre]] dự phòng và một viên [[Animate Guardian]]**, rồi cho chúng lên level trong weapon swap. Dùng một [[Vaal Orb]] lên chúng ở level 20 để thử ăn may level 21.

          Mấy gem cần cố ý giữ thấp: [[Desecrate]] ở 1, [[Stormblast Mine]] ở 1, [[Flame Dash]] ở 10 tới 13.

          Đây là nửa tiếng chuẩn bị giá trị nhất của cả build. Spectre rất đắt để nuôi lại nếu bạn mất chúng.
      - title: Bandit và anoint
        body: |
          **Giết cả ba bandit** để lấy passive point.

          Anoint theo thứ tự: Testudo khi nó còn rẻ, rồi [[Death Attunement]], rồi [[Whispers of Doom]] khi bạn đã lên Chaos Inoculation.
  - id: early-maps
    image: raise-spectre
    title: Map đầu
    levels: Map trắng và map vàng
    uses: >-
      Mấy con Frostbearer đầu tiên, trong một six-link nếu bạn có. Tới khi tìm
      được một con, [[Bitterdream]] với Slave Driver hoặc Frost Auto-Scout là
      build tạm thời thật thà nhất.
    changes: >-
      Spectre hỗ trợ đi vào một four-link riêng với
      [[Elemental Army Support]], [[Feeding Frenzy Support]] và
      [[Bonechill Support]]. Cây wand trigger lên người. Thêm
      [[Stormblast Mine]] ở level 1 với [[Minefield Support]] cho mấy con rare
      trâu.
    links:
      - name: Frostbearer (six-link)
        gems: [Raise Spectre, Greater Volley Support, Spell Echo Support, Hypothermia Support, Cold Penetration Support, Minion Damage Support]
      - name: Spectre hỗ trợ (four-link)
        gems: [Raise Spectre, Elemental Army Support, Feeding Frenzy Support, Bonechill Support]
      - name: Wand trigger
        gems: [Bone Offering, Desecrate]
      - name: Chỉ khi đánh boss
        gems: [Stormblast Mine, Minefield Support]
      - name: Di chuyển và guard
        gems: [Shield Charge, Momentum Support, Steelskin, Arcane Surge Support]
    moveOn: "bạn có Frostbearer trong một six-link và một cây wand tự cast Bone Offering cho bạn."
    details:
      - title: Tìm một con Frostbearer
        body: |
          Hai đường. **Verisium Ore Deposit và Outcrop trong map**, tức là ăn may — 3.30 tăng lượng ore gốc của chúng thêm 50%, giúp được một chút. Hoặc **global chat 666**, nơi người chơi minion gọi spectre ra cho nhau desecrate.

          Tới lúc đó bạn đang chơi build tạm với [[Bitterdream]], thứ cho Spell Echo cho gem cắm trong nó. Nó chạy được. Nó yếu hơn rõ rệt, và guide nói thẳng ra chứ không giả vờ.
      - title: Giữ cho spectre sống
        body: |
          [[Bone Barrier]], [[Mindless Aggression]], Minion Defence mastery, [[Meat Shield Support]] ở giai đoạn đầu, và [[Elemental Army Support]] trên link hỗ trợ.

          Và cái thói quen tiết kiệm cho bạn nhiều nước mắt nhất: **đổi sang một cây vũ khí +2 minion gem khi ngoài trận**, [[The Dark Seer]] hoặc Maata's Teaching, để spectre của bạn không tụt level và chết lúc bạn đổi gear.
      - title: Vì sao hideout trở nên không chịu nổi
        body: |
          Guide liệt đây là một nhược điểm, và một nguồn thứ hai đồng ý: mười bốn con spectre nã cối thì **ồn cực kỳ**.

          Nghe như đùa cho tới khi bạn ngồi một tiếng trong hideout. Nếu bạn nhạy với âm thanh trong game, đây là lý do thật để chọn build khác.
  - id: red-maps
    image: convocation
    title: Map đỏ
    levels: Map Tier 11–16
    uses: >-
      Chín con spectre trở lên, [[Fortress Covenant]] trên cây, và một
      [[Watcher's Eye]] có mod giảm trừ physical của Determination.
    changes: >-
      [[Congregation Support]] thay [[Meat Shield Support]].
      [[Greater Spell Echo Support]] thay [[Spell Echo Support]]. Khi chạy map,
      [[Annihilation Support]] vào chỗ của
      [[Cold Penetration Support]].
    links:
      - name: Frostbearer (six-link)
        gems: [Raise Spectre, Greater Volley Support, Greater Spell Echo Support, Hypothermia Support, Cold Penetration Support, Congregation Support]
      - name: Bản chạy map
        gems: [Raise Spectre, Greater Volley Support, Greater Spell Echo Support, Hypothermia Support, Annihilation Support, Congregation Support]
      - name: Spectre hỗ trợ
        gems: [Raise Spectre, Elemental Army Support, Feeding Frenzy Support, Bonechill Support]
      - name: Wand trigger
        gems: [Bone Offering, Desecrate]
      - name: Aura
        gems: [Summon Skitterbots, Purity of Elements, Clarity]
    moveOn: "bạn đã có Chaos Inoculation, Ghost Reaver và Zealot's Oath, cả ba, cùng một cây Twilight Regalia."
    details:
      - title: Làm bước đổi keystone trong một buổi
        body: |
          [[Chaos Inoculation]], [[Ghost Reaver]] và [[Zealot's Oath]] là một bộ. Respec vào cả ba cùng lúc, với [[Twilight Regalia]] đã nằm sẵn trong túi.

          Làm từng mảnh thì bạn bị bỏ lại không có cơ chế hồi phục nào trong suốt khoảng trống đó, mà trên một nhân vật hybrid trong map đỏ thì đó là cách bạn chết.

          Một trong hai món boots hoặc gloves của bạn cần là base hybrid energy shield và evasion để nó roll được spell suppression. Mua cái đó trước khi respec luôn.
      - title: Yêu cầu attribute sẽ cắn bạn
        body: |
          [[The Dark Monarch]] cần 224 Intelligence. [[Twilight Regalia]] cần 293. [[Greater Volley Support]] cần 111 Dexterity ở gem level 20.

          Đó là ba vấn đề attribute riêng biệt trên một con Witch, và chúng tới gần như cùng lúc. Hãy tính trang sức và node trên cây cho chúng thay vì để bị bất ngờ.
      - title: Phần damage còn lại đến từ đâu
        body: |
          [[Summon Skitterbots]] thay Herald of Purity và Vitality. Cooldown Recovery đi lên [[Steelskin]] và [[Convocation]]. [[Arcane Surge Support]] chuyển sang [[Flame Dash]] cùng [[Frostbite]].

          Rồi tới cluster, tattoo, và chuyện đổi từ [[Commander of Darkness]] sang Umbral Army.
  - id: endgame
    image: watchers-eye
    title: Endgame
    levels: Pinnacle boss và map juice
    uses: >-
      Mười bốn con Frostbearer cộng Perfect Forest Warrior, [[Carnage Chieftain]],
      Perfect Guardian Turtle, Perfect Primal Thunderbird và Primal
      Crushclaw. Một cây large cluster minion damage, [[Watcher's Eye]], và boots
      Elder Warlock elevated.
    changes: >-
      Lối chơi không đổi gì so với map đỏ. Bạn đang mua số lượng và chất lượng
      spectre.
    moveOn: "không còn stage nào nữa. Mageblood là khoản mua min-max duy nhất còn lại."
    details:
      - title: Thứ tự nâng cấp
        body: |
          [[The Dark Monarch]] bản Raised Spectres, rồi [[Congregation Support]], rồi cây amulet +1 spectre với [[Bitterbind Point]], rồi bước đổi keystone cùng [[Twilight Regalia]], rồi boots Elder Warlock elevated, rồi cluster với [[Watcher's Eye]], rồi [[Mageblood]].

          Hai món đầu là hai món lớn, và cả hai đều rơi từ cùng một con boss.
      - title: Build này không phải cái gì
        body: |
          Cả hai guide đều không gọi nó là thân thiện với người mới, và nó cũng chưa bao giờ tự nhận vậy. Campaign thì phải tung hứng Absolution, offering, chuyện ngắm desecrate và một lần đi vòng lại. Mười bốn con minion thì cần aggro lại và cần bấm [[Convocation]].

          Nó không phải build zoom và nó không mạnh trong tuần đầu. Thứ nó là, từ khoảng level 85 trở đi, là một nhân vật cực trâu gần như một nút và giết được boss.
      - title: "\"Spectre Bank\" không tồn tại"
        body: |
          Một guide spectre khác nhắc tới "Spectre Bank" như một tính năng của 3.30. Researcher bên chúng tôi đã rà patch note: **không có Spectre Bank, không có thay đổi nào về việc spectre tồn tại lâu hơn, và không có thay đổi tiện nghi nào cho Raise Spectre** trong 3.30.

          Cơ chế thật gần nhất là từ 3.17: các loại quái spectre gần nhất của bạn được lưu vào nhân vật và có thể desecrate ra. Hãy coi cái tên đó là chưa xác nhận.

powerCurve: |
  Damage ở đây là tích của ba thứ: **bạn có bao nhiêu con Frostbearer**, mỗi con thả được bao nhiêu quả cối trúng mục tiêu, và một mục tiêu đang bị chill thì ăn thêm bao nhiêu. [[Greater Volley Support]] lo xong cái thứ hai ngay từ six-link đầu tiên, còn [[Bonechill Support]] với Hypothermia lo cái thứ ba khá rẻ. Cái thứ nhất mới là cái tốn level và currency, nên build mạnh lên theo từng bậc, và mỗi bậc là một món tăng số spectre.

  Giai đoạn đầu bạn không có gì trong số đó. Campaign là [[Absolution]], và mấy con Frostbearer đầu tiên chỉ tới ở map trắng và map vàng, ba tới năm con. Ở map đỏ thì bài viết có chín con trở lên, với [[Congregation Support]] trong six-link và [[Fortress Covenant]] trên cây. Mười bốn là con số cuối, và nó cần [[The Dark Monarch]], món nhân đôi số tối đa nhưng không đội được trước level 84 — mà cả hai món đó lại rơi từ cùng một con boss endgame. Đó là lý do build không mạnh trong tuần đầu, rồi từ khoảng level 85 trở đi thì cho cảm giác đã hoàn chỉnh.

  Phòng thủ cũng tới theo kiểu đó, từng cục một. Block tới gần như cùng một lúc với [[Mistress of Sacrifice]] ở lab Merciless, hồi phục và giảm trừ physical tới với [[Bone Barrier]] ở lab Uber, và lớp cuối cùng là bước đổi trong một buổi sang [[Chaos Inoculation]], [[Ghost Reaver]] và [[Zealot's Oath]]. Đoạn hybrid ngay trước bước đổi đó là lúc nhân vật yếu nhất so với content nó đang chạy; ghi chú hardcore ở trên gọi nó là cửa sổ nguy hiểm.

upgrades:
  - step: >-
      Frostbearer trong một six-link, và một cây wand trigger [[Bone Offering]]
    why: >-
      Chừng nào chưa có cả hai thì bạn vẫn đang chơi build tạm. Six-link chứa
      [[Greater Volley Support]], thứ làm mấy quả cối chồng lên nhau, còn cây
      wand là block của bạn. Mọi thứ bên dưới đều nhân hai cái này lên. Bước
      này là mục tiêu của stage map đầu trong bài, do chúng tôi đặt vào đây;
      danh sách nâng cấp của chính guide thì bắt đầu từ bước kế tiếp.
    cost: >-
      Tự craft wand: 2 [[Divine Orb]] để khóa prefix và 2 nữa cho craft bench
      ba mod. Số của guide, không ghi nhãn và là của thời 3.29; tác giả nói
      mua wand làm sẵn thường rẻ hơn.
  - step: >-
      [[The Dark Monarch]], bản Raised Spectres
    why: >-
      Nó nhân đôi số tối đa. Không món nào khác trong danh sách là một cú nhân
      đôi, và đó là lý do thứ tự của guide bắt đầu từ đây. Nó cần level 84 và
      224 Intelligence, nên lo xong attribute trước khi mua, và kiểm biến thể
      hai lần.
  - step: >-
      [[Congregation Support]]
    why: >-
      30–38% more maximum minion, lên tới 64% ở gem level 15. Multiplier thứ
      hai, và nhỏ hơn một cú nhân đôi, nên nó đứng thứ hai. Nó lấy cái socket
      mà [[Meat Shield Support]] đang giữ.
  - step: >-
      Mod amulet +1 spectre, và [[Bitterbind Point]]
    why: >-
      Mỗi món một con spectre. Một cái +1 phẳng thì đáng ít hơn cả hai
      multiplier, và đó là cách chúng tôi đọc lý do guide xếp chúng thứ ba.
      Guide cũng gọi cây shield là bắt buộc cho cả build, nên rất có thể bạn đã
      cầm nó từ lâu trước mốc này.
  - step: >-
      Bước đổi keystone, cùng [[Twilight Regalia]]
    why: >-
      Bước đầu tiên không mua thêm damage nào. Cách chúng tôi đọc vị trí của
      nó: tới đây thì spectre đã giết được thứ bạn chỉ vào, và con nhân vật
      hybrid mới là phần yếu. Mua body armour (293 Intelligence) và boots hoặc
      gloves spell suppression trước, rồi lấy [[Chaos Inoculation]],
      [[Ghost Reaver]] và [[Zealot's Oath]] trong một lần respec.
  - step: >-
      Boots Elder Warlock elevated
    why: >-
      +1 hoặc +2 spectre. Cùng kiểu lợi với cây amulet, nhưng trên một món khó
      hơn, nên nó tới sau mấy cái +1 rẻ và sau khi bạn đã sống nổi.
    cost: >-
      Chắc chắn ra mod Raise Spectre trên boots: 200 Primal Crystallised
      Lifeforce cộng 3 [[Crystallised Rancour]]. Số của guide, không ghi nhãn
      và là của thời 3.29.
  - step: >-
      Một cây large cluster minion damage và [[Watcher's Eye]]
    why: >-
      Chất lượng, không phải số lượng. Bài viết nói endgame là đi mua số lượng
      và chất lượng spectre; tới bước này số lượng gần như đã mua hết, nên phần
      còn lại là làm mỗi con spectre đánh đau hơn và bạn ăn ít damage hơn.
  - step: >-
      [[Mageblood]]
    why: >-
      Bài viết gọi nó là khoản mua min-max duy nhất còn lại. Không có gì trong
      build phụ thuộc vào nó.

play:
  mapping: |
    Di chuyển bằng [[Shield Charge]]. Dùng skill nào cũng kích cây wand, và nó cast [[Desecrate]] với [[Bone Offering]] thay bạn, nên di chuyển cũng chính là thứ giữ block cho bạn. Toàn bộ cái "một nút" là vậy đó. Chuyện offering hết hạn khi bạn thôi dùng skill là cách chúng tôi đọc mod trigger, không phải một câu của guide.

    Spectre lo phần giết. Bấm [[Convocation]] khi chúng bị bỏ lại phía sau hoặc đang bắn nhầm pack; bài viết nói thẳng là mười bốn con minion thì cần aggro lại. [[Steelskin]] là guard cho lúc có thứ gì đó lọt qua, còn [[Flame Dash]] để băng qua khe.

    Chạy link bản map: [[Annihilation Support]] nằm ở cái socket vốn chứa [[Cold Penetration Support]] khi đánh boss.
  bossing: |
    Trước trận, cắm [[Cold Penetration Support]] trở lại chỗ của [[Annihilation Support]]. Đổi vũ khí gì thì đổi ngay lúc này, khi ngoài trận, đừng bao giờ đổi giữa trận.

    Mở màn bằng [[Convocation]] để mọi con spectre bắt đầu ngay trên boss, rồi ném [[Stormblast Mine]] với [[Minefield Support]]. Guide giữ gem đó ở level 1 và chỉ ghi link này cho boss và mấy con rare trâu.

    Sau đó việc của bạn là sống và cứ tiếp tục dùng skill, để cây wand giữ Bone Offering trên người bạn. Damage đẹp nhất lúc boss đứng yên, vì đó là lúc các loạt song song đều rơi lên nó. Khi nó di chuyển, kéo spectre trở lại lên nó bằng Convocation thay vì chờ chúng tự tìm — thói quen đó là của chúng tôi; guide chỉ nói là minion cần bấm Convocation.

deaths:
  - situation: >-
      Map đỏ, đang đổi dở sang energy shield
    cause: >-
      [[Chaos Inoculation]], [[Ghost Reaver]] và [[Zealot's Oath]] chỉ chạy
      khi đủ bộ. Có một hay hai trong ba cái thì leech của [[Bone Barrier]] và
      regeneration của bạn đang đổ vào một cái pool bạn không còn dùng, và bạn
      không có nguồn hồi phục nào cả.
    fix: >-
      Làm trong một buổi: [[Twilight Regalia]] và boots hoặc gloves spell
      suppression đã mua sẵn, rồi cả ba keystone trong một lần respec. Đừng
      chạy map ở giữa chừng.
  - situation: >-
      Ngay sau khi lấy [[Fortress Covenant]]
    cause: >-
      Nó là một multiplier minion damage lớn mà bắt bạn ăn thêm damage. Bài
      viết đặt nó ở giữa game, "khi phòng thủ của bạn đã trả nổi".
    fix: >-
      Nếu chuyện chết bắt đầu cùng lúc với cái keystone, gỡ nó ra cho tới khi
      [[Mistress of Sacrifice]] và [[Bone Barrier]] đều đã được gán và
      resistance đã cap. Cái ngưỡng đó nằm chính xác ở đâu là đánh giá của
      chúng tôi; guide không cho mốc nào.
  - situation: >-
      Đứng yên, không bấm gì, và bị đánh
    cause: >-
      Block của bạn là [[Bone Offering]] áp lên chính bạn, và cây wand chỉ cast
      nó khi bạn dùng một skill. Cách chúng tôi đọc, từ mod trigger: thôi dùng
      skill đủ lâu là offering hết hạn.
    fix: >-
      Giữ [[Shield Charge]] hay bất kỳ skill nào khác chạy đều, kể cả khi
      spectre không cần giúp. Kiểm xem cây wand có thật sự chứa Bone Offering
      và một [[Desecrate]] level 1 không.
  - situation: >-
      Sau bước đổi, khi spectre không ở gần mục tiêu nào
    cause: >-
      [[Bone Barrier]] hồi phục khi minion gây damage, và sau bước đổi thì bài
      viết gọi nó là toàn bộ nguồn energy shield của bạn. Từ đó suy ra, dù
      không ai nói thẳng, là spectre bị bỏ lại cách một màn hình thì không có
      leech.
    fix: >-
      [[Convocation]] trước khi vào giao tranh, không phải sau. Đừng chạy
      nhanh hơn mười bốn con minion.

troubleshooting:
  - symptom: >-
      Boss chết lâu hơn hẳn so với cảm giác lúc chạy map
    cause: >-
      Nhiều khả năng bạn vẫn đang ở link bản map, với
      [[Annihilation Support]] nằm ở chỗ của [[Cold Penetration Support]].
      Hoặc spectre đang tản ra và không phải con nào cũng bắn vào boss.
    fix: >-
      Đổi gem lại trước trận, và bấm [[Convocation]] ngay đầu trận.
  - symptom: >-
      Spectre chết khi tôi đổi vũ khí
    cause: >-
      Đổi khỏi một cây vũ khí +2 minion gem thì gem bị tụt level, và spectre
      chết theo.
    fix: >-
      Chỉ đổi khi ngoài trận, sang [[The Dark Seer]] hoặc Maata's Teaching.
      Cứ để năm viên [[Raise Spectre]] dự phòng lên level, để mất một lần chỉ
      tốn vài phút chứ không phải cả buổi tối.
  - symptom: >-
      Helmet, body armour hoặc gem volley không mặc lên được
    cause: >-
      Ba bức tường attribute tới cùng lúc: 224 Intelligence cho
      [[The Dark Monarch]], 293 cho [[Twilight Regalia]], và 111 Dexterity cho
      một viên [[Greater Volley Support]] level 20.
    fix: >-
      Tính trang sức và node trên cây cho cả ba trước khi mua bất kỳ món nào.
      Greater Volley vẫn chạy ở gem level thấp hơn, nơi nó đòi ít Dexterity
      hơn.
  - symptom: >-
      Đã đội helmet mà số spectre không đổi
    cause: >-
      Sai biến thể. [[The Dark Monarch]] có một bản cho mỗi loại minion, và
      trang database mặc định hiện bản Animated Weapons.
    fix: >-
      Mua bản Raised Spectres. Đọc chữ trên chính món đồ trước khi trả tiền.
  - symptom: >-
      Mấy con minion khác biến mất khi đội helmet lên
    cause: >-
      Bản Raised Spectres cấm mọi loại minion khác. Bài viết nói vậy, và nó
      cũng vẫn liệt [[Animate Guardian]] với [[Summon Skitterbots]] cho giai
      đoạn cuối mà không giải thích hai chuyện đó khớp nhau thế nào. Chúng tôi
      cũng không khớp được.
    fix: >-
      Cho tới khi có người chứng minh khác đi, cứ coi như cái helmet thắng. Lời
      khuyên của chúng tôi, không phải của guide: gỡ mọi món có giá khỏi con
      guardian trước khi đội helmet.
  - symptom: >-
      Tôi không tìm được con Forged Frostbearer nào
    cause: >-
      Nó không spawn tự nhiên. Nó tới từ Verisium Ore Deposit và Outcrop trong
      map, tức là ăn may.
    fix: >-
      Xin ở global chat 666, nơi người chơi minion gọi spectre ra cho nhau
      [[Desecrate]]. Tới lúc đó thì chơi bộ tạm với [[Bitterdream]] và chấp
      nhận là nó yếu hơn.

patch:
  - note: >-
      **Ascendancy Necromancer và [[Raise Spectre]] không bị đổi.** Không có gì
      trong phần game thường của patch note đụng tới phần lõi của build này.
  - entry: support-gem-changes
    note: >-
      **Không áp dụng ở đây, dù trông có vẻ vậy.** Transfusion và Vaal Sacrifice
      đều được làm lại, và cả hai đều là nerf thật cho các build minion có dùng
      chúng. Build này không dùng cái nào — researcher bên chúng tôi đã kiểm phần
      chữ của guide và cả danh sách skill đầy đủ trong planner. Nếu bạn đọc thấy
      "build minion bị nerf", đây là thay đổi đang được nói tới, và nó không chạm
      tới con này.
  - entry: golem-buff-nerfs
    note: >-
      **Một cú nerf nhỏ xíu cho giai đoạn đi level, và là thay đổi duy nhất chạm
      tới build.** [[Summon Stone Golem]] giờ cho 16% increased defences thay vì
      20%. Bạn dùng nó từ Act 4 để lấy regeneration.
  - entry: femurs-of-the-saints
    note: >-
      **Thật, nhưng nó không giúp bạn.** Cây staff này được buff minion rất lớn
      thật, kể cả increased minion damage trên mỗi con spectre đã raise. Nhưng
      **Femurs là một cây staff**, còn build này chạy một cây wand trigger với
      [[Bitterbind Point]]. Bạn không dùng được. Buff của Bone Helmet thì chỉ
      giúp như một món tạm thay trước khi có [[The Dark Monarch]]. Khi một tier
      list nói build này được "buff qua item minion" mà không nêu tên món nào,
      đây là lý do để cẩn thận.
  - entry: league-fates
    note: >-
      **Rất khớp.** Cơ chế league lấy boss làm trung tâm, và các loạt đạn song
      song rơi xuống một mục tiêu đứng yên chính là trường hợp tốt nhất của build
      này. Một build minion single target cao thì đứng ở vị trí tốt lạ thường cho
      3.30.
  - entry: loot-rarity-rework
    note: >-
      **Có lợi, và nó đổi chi phí của bạn.** Currency giờ dồn vào quái rare và
      unique, thứ hợp với một build đánh boss. Nó cũng có nghĩa là các khoản craft
      tính bằng Divine từ bản sửa 3.29 của guide là không đáng tin.
  - entry: ritual-changes
    note: >-
      **Hai ảnh hưởng nhỏ.** Blood Shrine of Crows giờ cho nhiều chaos resistance
      hơn hẳn, thứ hữu ích trong đoạn hybrid trước Chaos Inoculation. Và hai con
      spectre hỗ trợ của bạn là item xác ritual, nên quyền vào Ritual có ý nghĩa:
      hãy tính bốn hoặc tám Ritual Thread mỗi map.

strengths:
  - "Rất trâu: block, Bone Barrier, giảm trừ physical, spell suppression và cuối cùng là energy shield thuần."
  - "Đánh được Uber boss, vì các loạt đạn song song chồng lên một mục tiêu đứng yên."
  - "Gần như một nút ở endgame, nhờ cây wand trigger."
  - "Một con toàn diện thật sự khi đã hoàn chỉnh."
  - "Guide được bảo trì tốt nhất trong mọi build trên trang này."
  - "3.30 lấy boss làm trung tâm, trả thưởng đúng cái build này giỏi."
weaknesses:
  - "Forged Frostbearer không phải quái spawn tự nhiên. Tìm được một con mới là cửa chặn thật."
  - "Cả hai multiplier số spectre đều rơi từ cùng một con boss endgame."
  - "Ồn cực kỳ trong hideout. Đây là nhược điểm được liệt ra, không phải câu đùa."
  - "Cây helmet lõi cần level 84 và 224 Intelligence, nên nó tới muộn."
  - "Greater Volley là một gem Dexterity trên một con Witch."
  - "Campaign là một build khác, bận rộn hơn, với vài bước phải làm tay."
avoidIf: >-
  Đừng chọn cái này nếu bạn muốn mạnh trong tuần đầu, hoặc nếu bạn không chịu
  dính tới trade chat — đó là cách phần lớn người ta có con Frostbearer đầu tiên.
  Đừng chọn nếu bạn không thích một cái client ồn ào, hoặc nếu bạn muốn một build
  hoàn thành ở level 70. Nó là một dự án, và nó giỏi ở cuối dự án đó.

