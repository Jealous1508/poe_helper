name: Poison Summon Raging Spirit Necromancer
tagline: >-
  Mấy cái đầu lâu bốc lửa chỉ sống năm giây, được một node ascendancy biến thành
  chaos damage. Hai guide cập nhật cho 3.30, và 3.30 thì buff gear của nó.
class: Witch
ascendancy: Necromancer
role: starter
budget: starter
budgetNote: >-
  **Không guide nào đưa con số currency cho bất cứ thứ gì, trừ đúng một ngoại
  lệ: một viên [[Melee Splash Support]] tốn một [[Orb of Transmutation]].** Đó là
  cái giá duy nhất trong cả hai nguồn, và nó dành cho một viên gem mua ở vendor
  tại level 8. Ngoài ra cả hai guide đều nói chuyện cấu trúc: bản hybrid không
  cần unique nào, còn bản poison thì bị chặn sau [[The Jinxed Juju]] và
  [[Darkness Enthroned]]. Lời cảnh báo của chính PoE Vault là đi poison "dự kiến
  sẽ hơi đắt", và lời khuyên của nó là **mở đầu không poison** rồi chuyển sau.
  Chúng tôi coi chuyện đó đủ nghiêm túc để viết mấy stage theo đúng thứ tự ấy.
mainSkill: Summon Raging Spirit
image: summon-raging-spirit
hero: art-necromancer
tags: [Minions, Chaos, Poison, Hai nút]
ratings: { clear: 4, bossing: 4, survivability: 4, ease: 4 }
verified: "2026-11-13"
confidence: mixed
confidenceNote: >-
  **Hai guide độc lập và cả hai đều thật sự được cập nhật cho 3.30.** Mục
  changelog của guide Maxroll đề ngày 12/11/2026 ghi "Updated for Covens of Umbra
  3.30"; guide PoE Vault thì có tiêu đề Covens of Umbra 3.30 và đề ngày
  12/11/2026. Đó là mức chứng thực nhiều hơn phần lớn build trên site này có.


  Chỗ chưa được chứng minh: **không guide nào công bố con số damage**, và con số
  phòng thủ duy nhất đang tồn tại — "hơn 200,000 eHP khi lo gear đầy đủ" — là một
  lời khẳng định trong văn xuôi, không kèm số đọc từ planner nào và không đóng
  dấu league, nên hãy coi nó là hàng 3.29 là tốt nhất. Không guide nào cho bảng
  điểm, nên bốn điểm ở trên là cách đọc của chúng tôi. Chúng tôi cũng tìm thấy
  một đoạn mô tả cơ chế trong tài liệu của PoE Vault không khớp với PoEDB — xem
  mục ascendancy — và chúng tôi theo PoEDB.
modes:
  ssf: >-
    Tốt cho bản hybrid, bản đó không cần unique nào, và
    [[Summon Raging Spirit]] thì dùng được từ nhân vật level 4. Cú chuyển sang
    poison mới là bức tường: [[The Jinxed Juju]] và
    [[Darkness Enthroned]] đều là unique cụ thể, còn mấy con spectre mà hai guide
    muốn — Perfect Guardian Turtle, Perfect Judgemental Spirit — thì đến từ mấy
    cuộc gặp của league. Đây là nhận định của chúng tôi; không guide nào đưa ra
    kết luận SSF.
  hardcore: >-
    Không guide nào đưa ra kết luận. Cách đọc của chúng tôi: minion ăn đòn và
    [[Bone Barrier]] biến số lượng của chúng thành giảm physical damage và leech,
    đó là một lớp phòng thủ thật. Ngược lại, chính danh sách nhược điểm của
    PoE Vault có "Damage Halts" với "Slight Ramp-Up Time" — damage của bạn là
    thứ tạm thời theo thiết kế, mà một build có thể tụt damage về không trong lúc
    bạn triệu lại thì là một đề nghị hardcore lóng ngóng.

idea: |
  [[Summon Raging Spirit]] triệu ra một cái đầu lâu bốc lửa, nó xông vào con quái gần nhất và đánh. Nó sống **năm giây** rồi biến mất. Bạn giữ được hai mươi con cùng lúc.

  Nên vòng lặp là: cast liên tục, dựng cái stack lên, và giữ cho nó luôn đầy. Không có gì trong build này là thụ động — minion hết hạn dù có con nào chết hay không.

  Thứ làm nó thành một build chaos là đúng một node ascendancy. [[Unnatural Strength]] cho minion của bạn [[Unholy Might]], mà PoEDB ghi là **100% physical damage được chuyển thành chaos damage cộng 25% chance to apply Withered on hit**. Raging Spirit mặc định chuyển physical damage của chúng thành fire, nên việc node đó làm, và cũng là nền của cả bản poison, là đổi hướng loại damage của chúng sang thứ có thể đầu độc — đồng thời tặng bạn mấy stack Wither miễn phí, mấy stack đó làm chaos damage over time đánh nặng hơn.

  Nửa còn lại của build là một cái máy curse-và-xác chạy bằng trigger: [[Arcanist Brand]] bắn [[Desecrate]], rồi [[Flesh Offering]], rồi [[Despair]], đúng thứ tự socket đó, nên một cú ném brand là dựng sẵn cả cú kết liễu.

chain:
  - label: Triệu
    text: "Cast [[Summon Raging Spirit]]. Mỗi cái đầu lâu sống năm giây; hai mươi là trần. Cái stack chính là damage, nên bạn cast liên tục."
  - label: Chuyển hóa
    text: "[[Unnatural Strength]] cho minion [[Unholy Might]] — physical damage thành chaos, cộng 25% chance to apply Withered on hit."
  - label: Độc
    text: "Chaos hit thì đầu độc. [[Chance to Poison Support]] và [[Unbound Ailments Support]] biến mấy cú đánh dồn dập của từng đầu lâu thành chaos damage over time chồng lên nhau."
  - label: Curse và cho ăn
    text: "[[Arcanist Brand]] kích [[Desecrate]], rồi [[Flesh Offering]], rồi [[Despair]]. Thứ tự socket quyết định thứ tự chúng nổ."
  - label: Sống sót phía sau chúng
    text: "[[Bone Barrier]] biến số minion thành giảm physical damage và leech life từ damage của chúng. [[Commander of Darkness]] tặng bạn +30% elemental resistance."

chainDetails:
  - title: Cái node cả build đứng trên, và một cách diễn đạt chúng tôi không khớp được
    body: |
      [[Unnatural Strength]] là bản lề. Không có nó thì mấy cái đầu lâu gây fire damage và không đầu độc được; có nó thì chúng gây chaos và đầu độc được.

      **Phần chữ của PoEDB cho node này chỉ đơn giản là "Minions have Unholy Might"**, và [[Unholy Might]] là 100% physical damage chuyển thành chaos damage cộng 25% chance to apply Withered on hit. Đó là bản chúng tôi viết ở trên, vì đó là nguồn dữ liệu gốc.

      Trang ascendancy của PoE Vault mô tả cùng node đó là chuyển "base fire của Raging Spirit sang 50% base chaos". **Hai mô tả đó không phải cùng một cơ chế** — một cái chuyển physical, cái kia chuyển fire, và phần trăm thì khác nhau. Chúng tôi không dung hòa được chúng và sẽ không lấy trung bình. Nếu bạn đang dựng cây trong Path of Building, hãy kiểm xem node thật sự làm gì trong bản của bạn trước khi cam kết với mấy support poison.
  - title: Vì sao damage của bạn tạm thời là chuyện có chủ ý
    body: |
      Năm giây. Đó là cả tuổi thọ của một Raging Spirit, và nó không reset khi giết được quái.

      Mọi chỗ lóng ngóng của build đều đến từ đúng con số đó. Danh sách nhược điểm của PoE Vault ghi "Slight Ramp-Up Time" và "Damage Halts", cả hai là cùng một sự thật: bạn tới chỗ boss với không con minion nào, mất vài giây triệu, và nếu bạn phải dành một giây để né thay vì cast thì cái stack rụng dần.

      [[Unleash Support]] trong link endgame là câu trả lời về mặt cấu trúc — nó gom mấy lần cast rồi xả ra một lượt, nên một lần bấm nạp lại được nhiều stack hơn. Trước khi có nó, bạn bấm nút khá nhiều.
  - title: Link trigger, và vì sao thứ tự socket là luật chứ không phải sở thích
    body: |
      [[Arcanist Brand]] bắn mấy spell link với nó, và Maxroll nêu luật rõ ràng: "Skill được trigger nổ theo thứ tự socket, bắt đầu từ socket trên cùng bên trái. Desecrate phải đứng trước Flesh Offering."

      Lý do là [[Flesh Offering]] ăn một cái xác, và [[Desecrate]] là thứ đặt cái xác đó ở đó. Sai thứ tự là cái offering đơn giản không nổ.

      Giữ [[Desecrate]] ở **gem level 1**. Maxroll nói vậy, và lý do là Desecrate level cao hơn tạo ra xác level cao hơn, mà đó không phải thứ bạn muốn từ một cái xác bạn định phá ngay lập tức.
  - title: Hybrid trước, poison sau — và cái gì đổi
    body: |
      Cả hai guide đều mô tả hai bản, và thứ tự thì có ý nghĩa.

      Bản **hybrid** là physical với chaos, không cần unique nào, và là setup cho lúc league start. Six-link của nó theo nguyên văn Maxroll: [[Summon Raging Spirit]], [[Unleash Support]], [[Melee Splash Support]], [[Chance to Poison Support]], [[Added Chaos Damage Support]], [[Minion Damage Support]].

      Bản **poison** bỏ [[Added Chaos Damage Support]] lấy [[Unbound Ailments Support]], và đổi [[Chance to Poison Support]] sang [[Void Manipulation Support]] khi bạn đã có đủ poison chance từ chỗ khác. Nó cũng đổi aura [[Malevolence]] sang [[Envy]], và skill di chuyển từ [[Shield Charge]] sang [[Whirling Blades]].

      Ở cả hai bản, **[[Melee Splash Support]] ra để [[Multistrike Support]] vào khi đánh single target**. Đó là một cú đổi bằng tay, không phải một link thứ hai.
  - title: 3.30 làm gì cho build này, nhiều hơn phần lớn build khác
    body: |
      Hai thay đổi về item, cả hai đều có lợi, và không cái nào có trong phần chữ của hai guide.

      **[[Femurs of the Saints]] được làm lại.** Giờ nó cho +2–3 level cho minion gem gắn trong đó, tăng từ mức cố định +2, và minion gây 80–100% increased damage, tăng từ 60–80%. Bốn khoản cố định theo từng minion của nó được thay bằng tối đa bốn mod roll ra từ một bể bảy dòng — và một trong bảy dòng đó là **3–5% increased attack and cast speed mỗi Summoned Raging Spirit**. Với hai mươi con đang chạy thì đó là một dòng viết cho đúng build này. Nó là random, nên hai cây staff có giá trị rất khác nhau.

      **Implicit của [[Bone Helmet]] đi từ 15–20% lên 20–30% increased minion damage.** Đơn giản vậy thôi.

      Có một thay đổi đi ngược lại, và nó đáng biết vì nó vô hiệu hóa một mánh của 3.29 chứ không phải nerf build: xem phần patch note về [[Transfusion Support]] bên dưới.

mandatory:
  - term: Summon Raging Spirit
    why: >-
      Skill chính. Dùng được từ nhân vật level 4, chuyện đó làm nó thành một
      trong những main skill thật sớm nhất trong game.
    detail: >-
      Theo PoEDB: duration gốc năm giây, tối đa hai mươi spirit, cast time 0.5
      giây, và mấy con spirit mặc định chuyển toàn bộ physical damage của chúng
      thành fire. Quality thêm tới 30% chance triệu thêm một minion.
  - term: Unnatural Strength
    why: >-
      Node làm cho bản poison tồn tại được. Nó cho minion
      [[Unholy Might]], và kèm theo đó là mấy stack Wither miễn phí làm chaos
      damage over time đánh nặng hơn.
  - term: Commander of Darkness
    why: >-
      Lấy đầu tiên. +30% elemental resistance cho bạn và minion của bạn, 30%
      increased damage, và tăng attack với cast speed — ở đây cũng có nghĩa là
      triệu nhanh hơn.
  - term: Mindless Aggression
    why: >-
      Minion có 20% more maximum life và gây 10% more damage. PoE Vault lấy nó
      một phần là để đi đường tới điểm ascendancy thứ tư.
  - term: Bone Barrier
    why: >-
      Lấy cuối cùng, vì nó không cần ở giai đoạn đầu. 1% additional physical
      damage reduction mỗi minion tới mức 10%, 1% damage của minion leech về bạn
      thành life, và minion nhận 40% maximum life thành energy shield thêm.
  - term: Melee Splash Support
    why: >-
      Phần clear của bạn, từ level 8. Một [[Orb of Transmutation]] ở vendor, đó
      là cái giá duy nhất mà hai guide có trích cho bất cứ thứ gì.
    detail: >-
      Đổi nó sang [[Multistrike Support]] khi đánh single target. Cả hai guide
      coi đây là một cú đổi bằng tay chứ không phải một bộ gem thứ hai.
  - term: Minion Damage Support
    why: >-
      More minion damage. Có trong mọi link được công bố cho build này, ở mọi mức
      budget.
  - term: Unleash Support
    why: >-
      Câu trả lời cho cái tuổi thọ năm giây. Nó gom mấy lần cast rồi xả ra một
      lượt, nên một lần bấm dựng lại được nhiều stack hơn.
  - term: Chance to Poison Support
    why: >-
      Thứ biến chaos hit thành chaos damage over time chồng lên nhau. Được thay
      bằng [[Void Manipulation Support]] khi bạn đã có đủ poison chance từ gear
      và từ cây.
  - term: Arcanist Brand
    why: >-
      Cái trigger chạy curse và offering thay bạn.
      [[Desecrate]] phải nằm trước [[Flesh Offering]] theo thứ tự socket.
  - term: Despair
    why: >-
      Hạ chaos resistance và tăng chaos damage over time taken, mà đó đúng là
      resistance mà damage của bạn bị đo lại.
  - term: Death Attunement
    why: >-
      Dòng anoint lên amulet mà cả hai guide đều dùng. Nhiều minion hơn, nhiều
      damage hơn.
  - term: Infernal Legion Support
    level: recommended
    why: >-
      Một lựa chọn thay cho [[Melee Splash Support]] trong vài act đầu. Nó đến từ
      quest Tidal Island và muốn ba socket xanh dương, nên nó miễn phí trong khi
      Melee Splash tốn một viên transmute.
  - term: The Jinxed Juju
    level: recommended
    why: >-
      Được liệt kê là bắt buộc cho setup endgame của cả bản poison và bản hybrid.
      Một trong hai món mà cú chuyển sang poison thật sự phải chờ.
  - term: Darkness Enthroned
    level: recommended
    why: >-
      Cây belt cho bản poison, mang hai viên abyss jewel với hiệu ứng tăng mạnh.
  - term: Femurs of the Saints
    level: recommended
    why: >-
      Được làm lại trong 3.30 và giờ đáng một ô trong map chứ không chỉ lúc
      leveling: +2–3 level cho minion gem gắn trong đó, 80–100% increased minion
      damage, và một trong bảy dòng roll khả dĩ của nó là attack với cast speed
      mỗi Summoned Raging Spirit.
    detail: >-
      Bốn mod được roll ra từ một bể, nên hai cây staff có thể khác nhau một
      trời một vực. Đọc mấy dòng chữ trước khi bạn mua.
  - term: Aegis Aurora
    level: recommended
    why: >-
      Được liệt kê là một cây shield tùy chọn. Block cộng hồi energy shield khi
      block, chuyện đó hợp với việc đứng sau một bức tường minion.

labs:
  - lab: Normal
    node: Commander of Darkness
    why: "**Không guide nào gắn notable với lab cụ thể**, trừ một ngoại lệ nêu bên dưới. PoE Vault xếp cái này đầu tiên, vì resistance, minion speed và damage, cùng chuyện triệu nhanh hơn. Chúng tôi đặt bốn lựa chọn theo đúng thứ tự đã công bố vào bốn lab; thứ tự là có nguồn, còn nhãn lab là suy luận của chúng tôi."
  - lab: Cruel
    node: Mindless Aggression
    why: "Được xếp thứ hai. Lý do PoE Vault nêu ra là \"phần increased damage, nhưng cũng là đường đi tới cái uber lab đã chuyển của chúng ta\"."
  - lab: Merciless
    node: Unnatural Strength
    why: "Thứ mở ra bản poison. Nếu bạn vẫn đang chạy bản hybrid thì lấy nó muộn hơn cũng được, nhưng chẳng có lý do gì phải vậy — mấy stack Withered miễn phí giúp cả hai bản."
  - lab: Eternal
    node: Bone Barrier
    why: "Trích: lấy cuối cùng vì nó \"không cần ở giai đoạn đầu\". Đây là lựa chọn duy nhất mà PoE Vault có gắn với một lab — nó nêu cái uber lab đã chuyển khi nói về điểm thứ tư."

stages:
  - id: acts-1-3
    image: stormblast-mine
    title: Act 1–3
    levels: Level 1–21
    uses: >-
      [[Stormblast Mine]] cho single target và [[Freezing Pulse]] cho pack cho
      tới level 8. Từ level 8, [[Summon Raging Spirit]] với
      [[Minion Damage Support]] và một trong hai, [[Melee Splash Support]] hoặc
      [[Infernal Legion Support]].
    changes: >-
      [[Frost Bomb]] thay [[Freezing Pulse]] khi bạn lấy được nó.
      [[Clarity]] ở Act 1, [[Summon Skitterbots]] ở Act 2, [[Anger]] ở
      Act 3. Có một link [[Holy Flame Totem]] tùy chọn lo cho Act 1.
    links:
      - name: Trước level 8
        gems: [Stormblast Mine, Freezing Pulse]
      - name: Từ level 8
        gems: [Summon Raging Spirit, Minion Damage Support, Melee Splash Support]
      - name: Link tùy chọn cho Act 1
        gems: [Holy Flame Totem, Combustion Support, Summon Phantasm Support]
      - name: Aura
        gems: [Clarity, Summon Skitterbots, Anger]
    moveOn: "mấy con minion đã nằm trong four-link và bạn đã xong Act 3."
    details:
      - title: Level 8 mới là điểm bắt đầu thật
        body: |
          Bản thân [[Summon Raging Spirit]] dùng được ở nhân vật level 4, nhưng chỉ dẫn của PoE Vault là bắt đầu dùng minion ở **level 8**, đó là lúc [[Melee Splash Support]] mua được. Không có splash thì mấy cái đầu lâu đánh một mục tiêu một lúc và phần clear thì thảm.

          [[Infernal Legion Support]], từ quest Tidal Island, là phương án miễn phí cho vài act đầu. Nó cần ba socket xanh dương.
      - title: Cái mà không guide nào cho bạn
        body: |
          **Không guide nào có bảng gem theo từng level, danh sách quest reward hay danh sách vendor.** Maxroll nhét chi tiết leveling vào một planner nhúng mà không đọc được dưới dạng chữ; PoE Vault thì cho phần văn xuôi ở trên và không gì chi tiết hơn.

          Chúng tôi viết đúng những gì phần văn xuôi nêu, theo thứ tự nó nêu, và chúng tôi không lấp mấy chỗ trống bằng một lộ trình nghe hợp lý.
      - title: Hai cái cây và một cú respec
        body: |
          Chỉ dẫn của PoE Vault: đổi sang cây "LvLing Tree 90 points" trong lúc chạy campaign, rồi, quanh level 68 sau campaign, đổi sang cây endgame. Nó lưu ý chuyện này "cần một số điểm respec".

          Hãy để dành một ít [[Orb of Regret]] cho việc đó, hoặc dùng mấy điểm hoàn lại từ quest.
      - title: Bandit và Pantheon
        body: |
          **Giết cả ba bandit.** Tác giả PoE Vault nói chúng "không cho khoản lợi nào đáng một điểm skill", đó là phán quyết thường thấy cho một build không có vấn đề gì đặc biệt về resistance hay mana.

          Pantheon: **Soul of the Brine King** đã nâng cấp làm major, để tránh bị đóng băng — tác giả trình bày đây là khẩu vị cá nhân chứ không phải yêu cầu — và **Soul of Shakari** làm minor, để giảm chaos damage.
  - id: acts-4-10
    image: melee-splash-support
    title: Act 4–10
    levels: Level 21–68
    uses: >-
      Link minion lớn dần lên năm socket, [[Arcanist Brand]] chạy curse với
      offering thay bạn, và một con golem cắm [[Feeding Frenzy Support]] để đẩy
      minion xông lên.
    changes: >-
      Bạn ascend ba lần. Link trigger vào ngay khi bạn có bốn socket liền link
      cho nó, và mấy aura ổn định lại thành [[Vitality]],
      [[Determination]] và [[Tempest Shield]].
    links:
      - name: Main skill
        gems: [Summon Raging Spirit, Minion Damage Support, Melee Splash Support, Unleash Support, Chance to Poison Support]
      - name: Curse và offering
        gems: [Arcanist Brand, Desecrate, Flesh Offering, Despair]
      - name: Spectre và guardian
        gems: [Raise Spectre, Meat Shield Support, Minion Life Support, Animate Guardian]
      - name: Golem
        gems: [Summon Stone Golem, Feeding Frenzy Support]
      - name: Aura
        gems: [Vitality, Determination, Tempest Shield]
    moveOn: "resistance đã cap sau Act 10, link trigger chạy đúng, và đã lấy ba notable ascendancy."
    details:
      - title: Mấy mastery mà hai guide nêu tên
        body: |
          Đây là những điểm cụ thể duy nhất trên cây mà hai guide chịu cam kết bằng chữ:

          - **Reservation Mastery:** +30% aura area of effect.
          - **Minion Defence Mastery:** minion hồi 5% life khi có minion chết.
          - **Minion Offence Mastery:** +30% minion area of effect, và tùy chọn thêm +20% offering effect.
          - **Mana Mastery:** +12% mana reservation efficiency.
          - **Anoint lên amulet:** [[Death Attunement]].

          Sau khi xong cây, ưu tiên được nêu là thêm ô jewel, rồi tới cluster jewel.
      - title: Giữ Desecrate ở level 1
        body: |
          Đáng nhắc lại vì lên level một viên gem do vô tình là chuyện dễ xảy ra: [[Desecrate]] giữ ở gem level 1 trong link trigger, và [[Desecrate]] phải nằm trước [[Flesh Offering]] theo thứ tự socket, tính từ socket trên cùng bên trái.
      - title: Con spectre bạn muốn, và con mà Maxroll cảnh báo chuyện mất
        body: |
          Bốn con spectre được nêu tên là Perfect Judgemental Spirit, Perfect Guardian Turtle, Perfect Forest Warrior và Perfect Warlord. **Không guide nào nói dùng con nào** — PoE Vault liệt kê cả bốn mà không khuyến nghị — và một số con đến từ nội dung league Affliction được đưa trở lại qua mấy cuộc gặp Ritual.

          Changelog của Maxroll ghi rằng nó đã thêm "một mục FAQ về chuyện tránh mất Spectre" vào tháng 8/2026, điều đó cho bạn biết mất chúng là chuyện phiền phức thật và lặp lại.

          [[Animate Guardian]] là tùy chọn và không guide nào liệt kê mấy món đồ của nó bằng chữ; cả hai đều chỉ sang một bộ item trong planner.
  - id: early-maps
    image: asc-icon-necromancer
    title: Map đầu, bản hybrid
    levels: Map trắng và map vàng
    uses: >-
      Six-link bản hybrid — không cần unique nào — với
      [[Added Chaos Damage Support]] ở ô thứ sáu. [[Shield Charge]] để di
      chuyển, [[Malevolence]] làm aura damage.
    changes: >-
      Đây là bản mà cả hai guide nói nên mở đầu bằng. Cú chuyển sang poison chờ
      tới khi bạn kham được [[The Jinxed Juju]] và
      [[Darkness Enthroned]].
    links:
      - name: Main skill, hybrid
        gems: [Summon Raging Spirit, Unleash Support, Melee Splash Support, Chance to Poison Support, Added Chaos Damage Support, Minion Damage Support]
      - name: Curse và offering
        gems: [Arcanist Brand, Desecrate, Flesh Offering, Despair]
      - name: Spectre và guardian
        gems: [Raise Spectre, Meat Shield Support, Minion Life Support, Animate Guardian]
      - name: Aura
        gems: [Vitality, Determination, Tempest Shield, Malevolence]
      - name: Golem và di chuyển
        gems: [Summon Stone Golem, Feeding Frenzy Support, Shield Charge, Frostblink]
    moveOn: "bạn thấy thoải mái trong map vàng và bạn đã có, hoặc mua được, hai món unique cho bản poison."
    details:
      - title: Mở đầu không poison. Guide nói vậy, hai lần.
        body: |
          Lời khuyên của PoE Vault là mở đầu không poison "để giữ chi phí thấp, vì đi poison dự kiến sẽ hơi đắt". Chúng tôi dựng mấy stage quanh chuyện đó, và ở thời điểm mở league thì đó là quyết định đúng: chưa có kinh tế nào cả, nên chẳng ai — kể cả chúng tôi — nói được tuần này [[The Jinxed Juju]] sẽ có giá bao nhiêu.

          Bản hybrid không phải một bản yếu hơn mà bạn phải cắn răng chịu. Nó là một build hoàn chỉnh mà tình cờ không cần unique nào.
      - title: Con số phòng thủ duy nhất tồn tại ở bất cứ đâu
        body: |
          "Later, you'll have over 200,000 eHP with proper gearing."

          Đó là lời khẳng định của PoE Vault, nguyên văn, và nó là con số effective hit point duy nhất trong cả hai guide. **Không có số đọc từ planner nào kèm theo, không bộ gear, không level nhân vật và không đóng dấu league.** Hãy đọc nó như một kỳ vọng thời 3.29 về một nhân vật đã lo gear xong, không phải một con số bạn lập kế hoạch được.

          **Không guide nào công bố con số damage nào cả**, ở mức budget nào. Chúng tôi sẽ không cung cấp một con.
      - title: Mod map
        body: |
          **Mục FAQ của Maxroll được nói là có bàn mấy cái này nhưng phần chữ chúng tôi đọc được thì không liệt kê; PoE Vault thì không nêu cái nào.** Nên chúng tôi không có gì có nguồn.

          Ghi chú của riêng chúng tôi, nêu rõ là của chúng tôi: minion chính là build, nên mấy mod giết minion nhanh — elemental damage nặng, aura degeneration — lấy của bạn cả khoảng thời gian dựng stack lẫn damage. Và vì output của bạn là chaos damage over time, quái có chaos resistance cao là dòng roll tệ hiển nhiên.
  - id: red-maps
    image: femurs-of-the-saints
    title: Map đỏ, bản poison
    levels: Map Tier 11–16
    uses: >-
      [[The Jinxed Juju]] và [[Darkness Enthroned]] vào, ô thứ sáu đổi thành
      [[Unbound Ailments Support]], và [[Envy]] thay cho
      [[Malevolence]]. [[Whirling Blades]] thay [[Shield Charge]].
    changes: >-
      Cú chuyển sang poison. [[Chance to Poison Support]] ra để
      [[Void Manipulation Support]] vào khi bạn đã có đủ poison chance từ gear và
      từ cây, và một cây [[Aegis Aurora]] là lựa chọn cho ô shield.
    links:
      - name: Main skill, poison
        gems: [Summon Raging Spirit, Unleash Support, Melee Splash Support, Void Manipulation Support, Unbound Ailments Support, Minion Damage Support]
      - name: Curse và offering
        gems: [Arcanist Brand, Desecrate, Flesh Offering, Despair]
      - name: Spectre và guardian
        gems: [Raise Spectre, Meat Shield Support, Minion Life Support, Animate Guardian]
      - name: Golem và aura
        gems: [Summon Stone Golem, Feeding Frenzy Support, Minion Life Support, Vitality]
      - name: Link trên weapon
        gems: [Generosity Support, Whirling Blades, Frostblink]
    moveOn: "không còn stage nào nữa. Thứ còn lại là cluster jewel, abyss jewel tốt hơn và một cây Femurs of the Saints roll đẹp."
    details:
      - title: Mánh lấy aura Envy
        body: |
          Link trên weapon của Maxroll là [[Generosity Support]] đỡ cho
          [[United in Dream]], đó là chỗ [[Envy]] đến từ — cây sword cấp cái
          aura, và Generosity làm nó mạnh hơn cho minion của bạn với cái giá là
          bạn không nhận được gì từ nó. Vì từng điểm của aura đó vốn dành cho
          minion, cái giá ấy bằng không.

          Đây cũng là lý do skill di chuyển đổi sang [[Whirling Blades]]:
          giờ bạn đang cầm một cây sword.
      - title: Vì sao Femurs of the Saints đáng đọc lại trong 3.30
        body: |
          Nó từng là một cây staff để leveling. 3.30 cho nó +2–3 level cho minion gem gắn trong đó và 80–100% increased minion damage, và thay bốn khoản cố định của nó bằng tối đa bốn mod roll ra từ một bể bảy dòng. Một trong bảy dòng là **3–5% increased attack and cast speed mỗi Summoned Raging Spirit**.

          Với một stack đủ hai mươi con thì dòng đó khổng lồ, và đó là thay đổi item đặc thù nhất cho một build nào đó trong cả patch này, tính trên mọi bài của site này. **Không guide nào nhắc tới nó**, vì cả hai đều được viết dựa trên danh sách item của 3.29 kể cả ở những chỗ phần chữ đã được cập nhật.

          Dù vậy nó là random. Một cây staff không có dòng Raging Spirit là một món khác và tệ hơn nhiều, và bạn phải đọc mấy dòng mod chứ không phải đọc cái tên.
      - title: Nó vẫn chưa làm được gì
        body: |
          - Damage của bạn hết hạn theo đồng hồ, nên không có chuyện tới một trận đánh trong tình trạng sẵn sàng.
          - "Damage Halts" nằm trong chính danh sách nhược điểm của guide. Mỗi giây không cast là một giây bị rụng.
          - Cú chuyển sang poison bị chặn sau hai món unique cụ thể mà chưa biết giá 3.30.
          - Spectre chết và là một việc nhà lặp lại, nhiều tới mức một guide phải thêm mục FAQ cho nó.
          - Không tier list nào chúng tôi đọc xếp build này trên hạng B.

powerCurve: |
  Ở đây có ba thứ nhân với nhau: **bao nhiêu cái đầu lâu đang sống**, mỗi cú đánh của chúng làm được gì, và mục tiêu ăn bao nhiêu chaos damage over time. Cái thứ nhất có trần là hai mươi và rụng theo cái đồng hồ năm giây, nên qua mấy level đầu thì nó là chuyện bạn cast nhanh cỡ nào, không phải chuyện gear. Cái thứ hai là link minion và gem level của nó. Cái thứ ba là mấy stack Withered từ [[Unnatural Strength]] cùng với [[Despair]].

  Chúng tới theo đúng thứ tự đó. Từ level 8, với [[Melee Splash Support]], bạn có một cái stack và có phần clear. [[Commander of Darkness]] ở lab đầu thêm damage với cast speed, mà ở đây nghĩa là cái stack đầy hơn. [[Unnatural Strength]] ở lab thứ ba đổi damage sang chaos và bắt đầu chồng Wither, còn link trigger thì thêm curse với offering. Đó là bản hybrid, hoàn chỉnh mà không cần unique nào, ở map trắng và map vàng. Bản poison ở map đỏ là cùng cái máy đó với mấy support quay sang ailment, và nó phải chờ [[The Jinxed Juju]] với [[Darkness Enthroned]].

  Thứ không bao giờ đổi là cảm giác chơi. Cái stack là tạm thời theo thiết kế, nên con boss nào cũng bắt đầu từ số không, và cả hai nhược điểm guide tự liệt — "Slight Ramp-Up Time" với "Damage Halts" — đều là đúng một sự thật đó. Gear nâng cái trần lên; nó không xóa được đoạn dựng stack.

  Phòng thủ thì phần lớn là minion đứng chắn trước mặt bạn. [[Commander of Darkness]] cho +30% elemental resistance từ lab đầu, còn [[Bone Barrier]] — giảm physical theo số minion và leech từ damage của chúng — được lấy cuối cùng vì guide nói nó không cần ở giai đoạn đầu. Con số duy nhất cho nhân vật đã hoàn chỉnh là "hơn 200,000 eHP" của PoE Vault, và nó không có planner nào đứng sau.

upgrades:
  - step: >-
      Six-link bản hybrid
    why: >-
      [[Summon Raging Spirit]], [[Unleash Support]],
      [[Melee Splash Support]], [[Chance to Poison Support]],
      [[Added Chaos Damage Support]] và [[Minion Damage Support]]. Nó không cần
      unique nào, cả hai guide đều mở đầu ở đây, và mọi bước sau chỉ đổi một
      socket của link này chứ không thay cả link.
  - step: >-
      Một cây [[Bone Helmet]] và dòng anoint [[Death Attunement]]
    why: >-
      Vị trí này là do chúng tôi đặt, không phải của guide nào: cả hai chạy y
      như nhau ở bản hybrid lẫn bản poison, nên không đồng nào bỏ ra ở đây bị
      vứt đi lúc chuyển. Implicit của cây helmet là 20–30% increased minion
      damage kể từ 3.30, và cả hai guide đều anoint Death Attunement.
  - step: >-
      [[The Jinxed Juju]] và [[Darkness Enthroned]], cùng lúc
    why: >-
      Đây là hai món mà cú chuyển sang poison phải chờ, và hai guide coi chúng
      là một cửa chặn. Có chúng rồi thì
      [[Added Chaos Damage Support]] ra để
      [[Unbound Ailments Support]] vào. PoE Vault dự kiến chuyện này "hơi đắt"
      và chưa có giá 3.30 nào, đó là lý do nó không nằm sớm hơn.
  - step: >-
      Poison chance trên gear và trên cây, rồi [[Void Manipulation Support]]
    why: >-
      Hai guide chỉ đổi [[Chance to Poison Support]] ra "khi bạn đã có đủ poison
      chance từ chỗ khác". Cách chúng tôi đọc lý do nó đi sau hai món unique:
      cú đổi này là lời damage thuần, nhưng chỉ trên một nhân vật vốn đã đầu
      độc đều tay mà không cần viên gem đó.
  - step: >-
      Một cây weapon: [[United in Dream]] để lấy [[Envy]], hoặc một cây
      [[Femurs of the Saints]] có dòng Raging Spirit
    why: >-
      Link của Maxroll là cây sword với [[Generosity Support]], thứ cho minion
      Envy thay cho [[Malevolence]]. Cây staff được làm lại là một thay đổi
      3.30 mà chưa guide nào theo kịp. Một bên là sword, bên kia là staff, nên
      đây là một lựa chọn, và không nguồn nào so chúng với nhau. Chúng tôi sẽ
      không xếp hạng. Với cây staff thì đọc mấy dòng mod: không có dòng attack
      với cast speed mỗi Raging Spirit thì nó là một món tệ hơn nhiều.
  - step: >-
      [[Aegis Aurora]], nếu bạn đang cầm cây sword
    why: >-
      Được guide liệt kê là một cây shield tùy chọn. Nó nằm ở đây vì nó là tùy
      chọn và vì nó chỉ vừa bên cạnh một cây weapon một tay — nửa sau của câu
      đó là quan sát của chúng tôi.
  - step: >-
      Thêm ô jewel, rồi cluster jewel và abyss jewel tốt hơn
    why: >-
      Ưu tiên mà hai guide nêu khi đã xong cây, và cũng là danh sách những thứ
      còn lại ở cuối bài. Không có điểm dừng, nên nó đứng cuối.

play:
  mapping: |
    Hai nút. Cast [[Summon Raging Spirit]] lúc bạn đang tiến tới một pack, để mấy cái đầu lâu đã bay sẵn khi bạn tới nơi, và cứ cast tiếp trong lúc đi xuyên qua; [[Unleash Support]] xả ra vài con mỗi lần bấm. Ném [[Arcanist Brand]] vào bất cứ thứ gì sống lâu hơn một chốc — một con rare, một pack dày — và nó chạy [[Desecrate]], [[Flesh Offering]] với [[Despair]] thay bạn.

    Con golem cắm [[Feeding Frenzy Support]] có mặt để đẩy minion xông lên. Bạn đứng sau chúng. Di chuyển bằng [[Shield Charge]] ở bản hybrid hoặc [[Whirling Blades]] khi bạn đã cầm cây sword, cùng [[Frostblink]] để băng qua khe.

    Giữ [[Melee Splash Support]] trong link. Chuyện cast trước khi nhìn thấy pack là thói quen của chúng tôi, không phải chỉ dẫn của guide; nó suy ra từ việc mấy cái đầu lâu cần một giây để có mặt.
  bossing: |
    Trước trận, đổi [[Melee Splash Support]] sang [[Multistrike Support]]. Cả hai guide coi đó là một cú đổi bằng tay, nên nhớ hay không là việc của bạn.

    Bạn tới nơi với không con minion nào. Dành mấy giây đầu để cast, rồi ném [[Arcanist Brand]] lên boss để curse với offering lên mà không cần bấm thêm.

    Từ đó trở đi trận đánh là một cuộc đổi chác giữa né và cast. Mỗi giây bạn di chuyển là cái stack rụng dần; chữ của chính guide cho chuyện đó là "Damage Halts". Né cái gì buộc phải né, rồi cast lại ngay. Cách chúng tôi đọc [[Unleash Support]] — nó gom mấy lần cast rồi xả ra một lượt — là cú bấm đầu tiên sau một lần né nạp lại được nhiều hơn một cái đầu lâu, mà đó đúng là lúc bạn cần. Đừng chờ cái stack cạn rồi mới bắt đầu lại.

deaths:
  - situation: >-
      Bước vào một pack hay một con boss khi cái stack đã hết hạn
    cause: >-
      Suy luận của chúng tôi, từ hai điều bài viết có nêu: minion là thứ ăn
      đòn, và [[Bone Barrier]] đếm số minion để tính giảm physical và cần
      damage của chúng để leech. Năm giây không cast là mấy cái đầu lâu biến
      hết, và mấy lớp đó mỏng đi theo.
    fix: >-
      Cast trước, rồi mới bước vào. Đừng bao giờ dùng skill di chuyển để lao
      vào một pack mới khi chưa triệu con nào.
  - situation: >-
      Bị đóng băng, hay bị giữ chân kiểu khác, giữa trận
    cause: >-
      Bạn không cast được, nên cái stack cạn theo đồng hồ của nó trong lúc bạn
      đứng đó. Cơ chế này là suy luận của chúng tôi; lựa chọn Pantheon bên
      dưới là của tác giả, và ông ấy gọi nó là khẩu vị cá nhân.
    fix: >-
      Soul of the Brine King, đã nâng cấp, làm major. Soul of Shakari làm
      minor thì lo phần chaos damage.
  - situation: >-
      Map có mod giết minion nhanh
    cause: >-
      Elemental damage nặng và aura degeneration lấy của bạn cả khoảng dựng
      stack lẫn damage, vì cái đầu lâu nào chết sớm cũng phải cast lại. Đây là
      ghi chú của chính bài viết, ở đó đã nêu rõ là của chúng tôi: phần chữ đọc
      được của hai guide không liệt kê mod nguy hiểm nào.
    fix: >-
      Đọc map trước khi chạy và reroll mấy cái đó. Quái có chaos resistance cao
      là dòng roll tệ còn lại, tệ cho damage chứ không phải cho chuyện sống
      sót.

troubleshooting:
  - symptom: >-
      [[Flesh Offering]] không bao giờ nổ từ cái brand
    cause: >-
      Thứ tự socket. Skill được trigger nổ từ socket trên cùng bên trái, và cái
      offering cần cái xác mà [[Desecrate]] tạo ra.
    fix: >-
      Đặt [[Desecrate]] trước [[Flesh Offering]] trong món đồ, và giữ Desecrate
      ở gem level 1.
  - symptom: >-
      Mấy cái đầu lâu không đầu độc
    cause: >-
      Không có [[Unnatural Strength]] thì chúng gây fire damage và không đầu
      độc được. Còn nếu node đã lấy rồi, nhớ là PoE Vault và PoEDB mô tả nó
      khác nhau và chúng tôi không dung hòa được.
    fix: >-
      Lấy node đó. Rồi kiểm trong Path of Building của chính bạn xem nó làm gì
      trước khi cam kết với mấy support poison.
  - symptom: >-
      Một con boss chết lâu hơn hẳn so với lúc chạy map
    cause: >-
      [[Melee Splash Support]] vẫn còn trong link, hoặc bạn đang tính đoạn dựng
      stack là damage bị mất. Cái thứ hai chính là build này.
    fix: >-
      Đổi [[Multistrike Support]] vào khi đánh single target rồi đổi lại sau
      đó.
  - symptom: >-
      Damage tụt sau khi cắm [[Void Manipulation Support]]
    cause: >-
      Nó thay [[Chance to Poison Support]], và hai guide chỉ làm cú đổi đó khi
      gear với cây đã cấp đủ poison chance. Câu này là của chúng tôi, nhưng nó
      suy ra được: đổi quá sớm thì ít cú đánh đầu độc hơn.
    fix: >-
      Cắm [[Chance to Poison Support]] lại cho tới khi có đủ poison chance.
  - symptom: >-
      Một cây [[Femurs of the Saints]] mà cảm giác chẳng hơn gì món nó thay
    cause: >-
      Mod của nó được roll ra từ một bể bảy dòng. Một cây staff không có dòng
      attack với cast speed mỗi Summoned Raging Spirit là một món khác và tệ
      hơn nhiều.
    fix: >-
      Đọc mấy dòng mod, không phải cái tên, trước khi bạn mua.
  - symptom: >-
      Damage dừng mỗi lần tôi di chuyển
    cause: >-
      Đó là cái tuổi thọ năm giây, và nó không reset khi giết được quái. Nó nằm
      trong chính danh sách nhược điểm của guide.
    fix: >-
      [[Unleash Support]] là câu trả lời về mặt cấu trúc. Ngoài ra thì nó là
      thói quen: cast giữa các lần né, không phải sau khi né xong.

patch:
  - entry: femurs-of-the-saints
    note: >-
      **Tin 3.30 tốt nhất cho build này, và không guide nào nhắc tới nó.**
      [[Femurs of the Saints]] giờ cho +2–3 level cho minion gem gắn trong đó
      (trước là mức cố định +2) và 80–100% increased minion damage (trước là
      60–80%), và bốn khoản cố định theo từng minion của nó được thay bằng tối đa
      bốn mod roll ra từ một bể bảy dòng. Một trong bảy dòng đó là **3–5%
      increased attack and cast speed mỗi Summoned Raging Spirit** — một dòng
      khó mà nhắm vào build này cụ thể hơn được nữa. Vì mấy mod là random, hai
      cây staff có thể đáng những khoản khác nhau một trời một vực; hãy đọc mấy
      dòng chữ.
  - entry: special-base-implicits
    note: >-
      **Một cú buff item thứ hai.** Implicit của [[Bone Helmet]] đi từ 15–20% lên
      20–30% increased minion damage. Helmet cũ cập nhật được bằng một
      [[Blessed Orb]]. Mấy base đặc biệt giờ chỉ rơi ở Item Tier đủ cao, nên một
      cây Bone Helmet dưới đất là đáng nhặt lên định danh.
  - entry: support-gem-changes
    note: >-
      **Đọc cái này trước khi import một planner 3.29.**
      [[Transfusion Support]] không còn đỡ được instant spell nữa, và giờ đưa cho
      một con minion gần đó một charge cho mỗi 400 life đã tiêu, thay vì một Soul
      cho mỗi 200. Changelog nêu thẳng ai là người thua: "Mấy build minion của
      3.29 giữ Vaal skill chạy vĩnh viễn trên minion thông qua Transfusion."
      Không guide nào chúng tôi đọc dùng vòng lặp đó, nên không bản nào bị ảnh
      hưởng — nhưng nếu bạn tìm thấy một file Summon Raging Spirit của 3.29 giữ
      một Vaal skill chạy trên minion, thì phần đó của nó đã chết.
  - entry: ruthless-changes
    note: >-
      **Necromancer không nằm trong danh sách ascendancy 3.30 nào cả, và đó là
      câu trả lời trung thực.** Phần thay đổi ascendancy cho game thường của
      patch bao Pathfinder, Warden, Trickster, Reliquarian và Luminary; mục riêng
      của Ruthless bao mười class khác. Necromancer không có trong cái nào. Nên
      nếu bạn đọc thấy 3.30 buff hay nerf Necromancer, nó sai theo cả hai chiều
      — ascendancy không bị đụng tới, và thứ được cải thiện cho build này là
      gear của nó.
  - note: >-
      **Bản thân skill không bị đụng tới.** [[Summon Raging Spirit]] không xuất
      hiện trong phần thay đổi skill của 3.30, và PoEDB không ghi thay đổi nào
      cho nó trong patch này. Duration năm giây, cái trần hai mươi minion và
      chuyện chuyển sang fire đều không đổi.
  - entry: golem-buff-nerfs
    note: >-
      **Nhỏ và có thật.** [[Summon Stone Golem]] giờ cho 16% increased defences
      thay vì 20%. Nó nằm trong link golem của build từ campaign trở đi, mang
      theo chủ yếu vì
      [[Feeding Frenzy Support]], nên khoản mất là vài phần trăm của một buff
      phòng thủ phụ, không gì hơn.
  - entry: loot-rarity-rework
    note: >-
      **Có lợi về mặt cấu trúc, và đây là cách đọc patch note chứ không phải một
      phép đo.** Currency rare giờ chỉ rơi từ quái rare và mấy khoản trừ rarity
      cũ đã bị bỏ. Một build minion dọn được pack dày và quái rare mà không cần
      đứng giữa chúng, điều đó chỉ đúng hướng cho luật loot mới.

strengths:
  - "Chơi được từ level 8, và trước đó có một lựa chọn support gem miễn phí."
  - "Bản hybrid không cần một món unique nào cả."
  - "Hai guide thật sự được cập nhật cho 3.30, chuyện đó hiếm trong tuần này."
  - "3.30 buff hai món đồ của nó và không nerf món nào."
  - "Minion ăn đòn; Bone Barrier biến số lượng của chúng thành giảm damage và leech."
  - "Single target mạnh — PoE Vault liệt kê Bosser như một ưu điểm."
  - "Cú chuyển sang poison là lựa chọn về sau, không phải điều kiện tiên quyết."
weaknesses:
  - "Damage của bạn hết hạn mỗi năm giây, dù có con nào chết hay không."
  - "\"Damage Halts\" và \"Slight Ramp-Up Time\" là nhược điểm do chính guide liệt kê."
  - "Không nguồn nào có con số damage, và con số eHP duy nhất thì không có planner đứng sau."
  - "Bản poison phải chờ hai món unique cụ thể mà chưa có giá 3.30."
  - "Spectre chết và phải đi farm lại đủ thường xuyên để có mục FAQ riêng."
  - "Một node ascendancy được guide và PoEDB mô tả khác nhau."
  - "Không tier list nào chúng tôi đọc xếp nó trên hạng B."
avoidIf: >-
  Chọn build khác nếu bạn muốn bước vào đấu trường boss là gây damage ngay — bạn
  không làm được, đó là thiết kế, và bao nhiêu gear cũng không đổi được chuyện
  đó. Bỏ qua nếu một build có nút bảo trì bấm liên tục làm bạn khó chịu, hoặc nếu
  bạn đang mong đi poison ngay từ đầu: cả hai guide đều bảo bạn mở đầu bằng
  hybrid rồi chuyển sau, và lúc mở league thì không ai biết cú chuyển đó tốn bao
  nhiêu. Và bỏ qua nếu bạn muốn một ascendancy được patch cải thiện; league này
  Necromancer không bị đụng tới, chỉ có đồ của nó thôi.

sources:
  - title: "Maxroll: Poison SRS Necromancer League Starter (Helm Breaker)"
    url: https://maxroll.gg/poe/build-guides/poison-srs-necromancer-league-starter
    kind: guide
    note: "Đóng nhãn Covens of Umbra 3.30, changelog ngày 12/11/2026 ghi \"Updated for Covens of Umbra 3.30\". Không bị lưu trữ. Nguồn của luật thứ tự socket cho trigger, ghi chú Desecrate level 1, mấy mastery và dòng anoint. Phần chi tiết leveling và gear của nó nằm trong một planner nhúng mà chúng tôi không đọc được dưới dạng chữ."
  - title: "PoE Vault: Poison Summon Raging Spirits Necromancer của BalorMage"
    url: https://www.poe-vault.com/guides/balormage-summon-raging-spirits-necromancer-build-guide
    kind: guide
    note: "Tiêu đề Covens of Umbra 3.30, đề ngày 12/11/2026. Nguồn của danh sách ưu nhược, chuyện bắt đầu ở level 8, phương án Infernal Legion, cú respec hai cây, mấy món unique bắt buộc và lời khẳng định \"hơn 200,000 eHP\". Lời tự lưu ý của chính nó: \"video có thể lỗi thời về mặt thông tin\"."
  - title: "PoE Vault: gem link và passive tree"
    url: https://www.poe-vault.com/guides/ghazzy-summon-raging-spirits-necromancer-pob-passive-skill-tree-gem-links
    kind: guide
    note: "Nguồn của mọi setup gem trong bài này: six-link bản hybrid và bản poison, link trigger, link spectre, mấy setup golem, danh sách aura và link United in Dream trên weapon."
  - title: "PoE Vault: ascendancy, bandit, pantheon, spectre và Animate Guardian"
    url: https://www.poe-vault.com/guides/balormage-summon-raging-spirits-necromancer-ascendancy-bandits-pantheon-powers-spectres-animate-guardian
    kind: guide
    note: "Nguồn của thứ tự notable, chuyện giết hết bandit, Brine King với Shakari, và bốn lựa chọn spectre. Đây cũng là chỗ chứa phần mô tả Unnatural Strength mà chúng tôi không khớp được với PoEDB."
  - title: "Path of Building: league start, mid budget và min-max trong một file"
    url: https://pobb.in/7_6IS6EVRZfT
    kind: pob
    note: "File của chính guide, mang theo nhiều bộ item và bộ skill. Chúng tôi không thấy dấu league nào và trong cả guide không có chỗ nào trích con số damage từ nó."
  - title: "PoEDB: Summon Raging Spirit"
    url: https://poedb.tw/us/Summon_Raging_Spirit
    kind: data
    note: "Nguồn của yêu cầu level 4, duration năm giây, cái trần hai mươi minion, cast time 0.5 giây, khoản thưởng từ quality, và chuyện spirit chuyển toàn bộ physical damage thành fire. Không ghi thay đổi nào cho 3.30."
  - title: "PoEDB: ascendancy Necromancer"
    url: https://poedb.tw/us/Necromancer
    kind: data
    note: "Nguồn của phần chữ chính xác cho notable Unnatural Strength, Commander of Darkness, Mindless Aggression và Bone Barrier — và của chỗ xung đột với cách PoE Vault mô tả Unnatural Strength."
  - title: "Maxroll: Poison SRS Necromancer (đã lưu trữ)"
    url: https://maxroll.gg/poe/build-guides/poison-srs-necromancer
    kind: guide
    note: "Guide cũ hơn ở cái URL ngắn hơn, của aer0. Đánh dấu Archived, tiêu đề 3.24, cập nhật lần cuối tháng 7/2024. Liệt kê ở đây để bạn không nhầm nó với bản hiện hành — URL của guide hiện hành kết thúc bằng -league-starter."
  - title: "insanebuild: tier list build 3.30"
    url: https://insanebuild.gg/blog/path-of-exile/build-guide-e35d/poe-3-30-build-tier-list
    kind: guide
    note: "Xếp Summon Raging Spirit hạng B, \"steady all league\", với thay đổi 3.30 ghi là \"buffed through minion items\" — và nó nêu đúng hai món chúng tôi bàn ở đây, Femurs of the Saints và implicit của Bone Helmet. Nó không liệt kê thay đổi ascendancy nào cho Necromancer, khớp với patch note."
  - title: "poebuilds.cc: index build cộng đồng 3.30"
    url: https://www.poebuilds.cc/poe1?league=covens
    kind: guide
    note: "Kiểm vào ngày launch. Video cộng đồng 3.30 duy nhất nêu tên skill này là \"Poison Holy Relic And Summon Raging Spirits\" của BalorMage, đăng cùng ngày với mấy guide viết. Ascendancy không được nêu ở đó, nên chúng tôi không dùng nó làm nguồn cho bất cứ điều gì."
  - title: "Patch note chính thức 3.30.0"
    url: https://www.pathofexile.com/forum/view-thread/4013680
    kind: official
    note: "Nguồn của bản làm lại Femurs of the Saints và cái bể bảy mod của nó, implicit của Bone Helmet, bản làm lại Transfusion Support, thay đổi Summon Stone Golem, và phần xác nhận rằng Necromancer không xuất hiện trong danh sách ascendancy của game thường lẫn của Ruthless."
