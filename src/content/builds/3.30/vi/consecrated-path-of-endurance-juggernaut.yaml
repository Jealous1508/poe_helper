name: Consecrated Path of Endurance Juggernaut
tagline: >-
  Một cú slam teleport bạn vào giữa pack, đánh mạnh hơn 10% và rộng hơn 10% cho
  mỗi endurance charge bạn đang giữ. Chưa ai công bố guide 3.30 nào cho nó, nên
  trang này được dựng từ ladder league trước và hai guide cũ hơn.
class: Marauder
ascendancy: Juggernaut
role: endgame
budget: low
budgetNote: >-
  **Không nguồn nào đưa ra con số currency cho bất kỳ phần nào của build này, ở
  bất kỳ league nào.** Guide của Odealo có một điểm budget mà chúng tôi không
  đọc được, và gọi [[Kaom's Sign]] với [[Ryslatha's Coil]] là rẻ, theo lời của
  thời 3.25. Chúng tôi xếp build vào endgame chứ không phải starter vì ba lý
  do: không guide nào dẫn một cú league start trong 3.30, viên gem phải lấy ra
  từ [[Divine Font]], và bản trên ladder league trước đội một cái helmet chỉ
  rơi từ boss cùng mấy viên jewel Forbidden. Nó vẫn level được từ con số không,
  và các stage bên dưới nói cách làm.
