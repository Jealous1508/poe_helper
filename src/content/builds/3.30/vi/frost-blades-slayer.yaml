name: Frost Blades Slayer
tagline: >-
  Đánh một con quái từ tầm với dài và mấy lưỡi băng bay ra khỏi nó, cắm vào
  phần còn lại của pack. Bạn clear Atlas bằng một cây axe hai tay, rồi dựng lại
  thành một nhân vật crit cầm claw và shield.
class: Duelist
ascendancy: Slayer
role: starter
budget: starter
budgetNote: >-
  **Tác giả không đưa giá ở bất cứ đâu**, trong phần mô tả video cũng như trong
  file Path of Building, và chúng tôi sẽ không bịa ra cái nào. Những gì anh ta
  có nói: campaign và map đầu chạy bằng axe hai tay rare tự nhặt. Quanh map
  Tier 10–11 bạn "spend what currency you have" (có bao nhiêu currency thì
  tiêu) vào ba thứ: một cây [[Carnage Heart]] hoặc amulet có attribute,
  [[Devoto's Devotion]], và một cây six-link corrupted. Bản cuối thì là chuyện
  khác. Bộ gear mẫu của nó có sáu món fractured, mà đồ fractured trong 3.30 khó
  kiếm hơn.
mainSkill: Frost Blades
image: asc-icon-slayer
hero: art-slayer
tags: [Melee, Strike, Cold, Crit về sau]
ratings: { clear: 5, bossing: 3, survivability: 3, ease: 3 }
verified: "2026-11-14"
confidence: mixed
confidenceNote: >-
  **Bốn điểm số là của chúng tôi.** Tác giả tự chấm điểm build trong video của
  anh ta, ở mốc 2:21, và chúng tôi không xem được; chúng tôi làm việc từ phần
  mô tả video và từ file Path of Building của anh ta, cái mà chúng tôi giải mã
  và đọc trọn. File đó rất chi tiết (một cây và một bộ gem cho từng act, cùng
  ghi chú do tác giả viết về endgame), nhưng nó dùng passive tree 3.29, nó
  được lưu mà không có tổng damage hay life nào, và nó là công sức của một tác
  giả duy nhất. Chúng tôi không tìm được guide viết thứ hai nào cho một bản
  Slayer trong 3.30. Bản thân skill thì đã được kiểm chứng từ lâu, và tóm tắt
  của chính tác giả là "nothing has really changed for a while with Frost
  Blades". Vậy nên: archetype đã kiểm chứng, một nguồn, không có con số.
modes:
  ssf: >-
    Tác giả không đưa ra kết luận nào. Cách đọc của chúng tôi: nửa đầu rất
    hợp. Bản axe là axe hai tay rare và armour rare, và ghi chú của anh ta nói
    bạn clear được Atlas bằng nó. Nửa sau thì không. [[Carnage Heart]],
    [[Devoto's Devotion]], [[Heatshiver]] và [[The Taming]] đều là đồ drop, và
    cây claw hoàn chỉnh trong file của anh ta là base fractured.
  hardcore: >-
    Tác giả không đưa ra kết luận nào. Cách đọc của chúng tôi: không phải lựa
    chọn tự nhiên. Phòng thủ là leech, evasion, spell suppression và về sau là
    một cây shield, với một guard skill tự động. Tất cả đều là xác suất hoặc
    đòi bạn phải đánh liên tục. Ghi chú của chính anh ta về league start là
    "horrible corrupted maps will feel bad".

idea: |
  [[Frost Blades]] là một melee strike có tầm với dài bất thường. Khi nó hit con quái đầu tiên, các lưỡi băng bay ra khỏi con đó về phía những con khác gần đấy. Bạn đánh một con và cả pack đứng sau nó ăn lưỡi băng.

  Gem đổi 60% physical damage của bạn thành cold damage. Nên bạn scale nó vừa như một weapon attack (vũ khí to, attack speed) vừa như một cold skill ([[Hatred]], cold penetration, đóng băng quái) cùng lúc.

  [[Slayer]] cấp những thứ một nhân vật melee thường thiếu. Life leech vẫn chạy khi máu đã đầy. Quái còn 20% máu trở xuống thì chết luôn. Thêm damage lên boss. Về sau, số endurance charge bằng đúng số frenzy charge bạn có.

  Bản trong guide này có hai kiếp. Đầu tiên là một cây axe hai tay không bao giờ crit, dùng [[Precise Technique]]. Tác giả nói bản đó clear được toàn bộ Atlas. Rồi, khi đã có currency trong tay, bạn đổi sang claw với shield và thành một build crit đóng băng thứ nó đánh trúng.

chain:
  - label: Strike
    text: "[[Frost Blades]] đánh xa hơn một cú strike thường từ 1.8 tới 2.1 mét, và 60% physical damage thành cold."
  - label: Lưỡi băng bay
    text: "Con quái đầu tiên trúng đòn phóng ra 5 tới 8 projectile băng vào những con khác. Chúng gây 30% less damage so với cú strike."
  - label: Thêm mục tiêu
    text: "Mỗi con quái thêm mà cú strike nhắm được sẽ phóng ra một loạt lưỡi băng riêng. Một mastery ở Act 2 và về sau một implicit trên gloves, mỗi cái thêm một mục tiêu."
  - label: Leech và cull
    text: "[[Brutal Fervour]] giữ life leech chạy khi full máu. [[Headsman]] giết mọi thứ còn 20% máu trở xuống."

chainDetails:
  - title: Vì sao vũ khí đầu tiên là axe hai tay
    body: |
      Frost Blades gây một tỷ lệ phần trăm damage vũ khí của bạn: 144% base ở gem level 1 và 410% ở level 20, theo PoEDB. Axe hai tay có base damage lớn nhất trong những thứ bạn nhặt được dưới đất.

      Keystone [[Precise Technique]] sau đó cho "40% more Attack Damage if Accuracy Rating is higher than Maximum Life", với cái giá là không bao giờ gây critical strike. Tác giả lấy nó ở Act 3 và giữ tới cú đổi sang claw.

      Để điều kiện đó đúng trên gear leveling, cây của anh ta lấy Accuracy Mastery "+500 to Accuracy Rating" ở Act 2, rồi tới Act 7 đổi sang cái khiến Dexterity cho +3 accuracy mỗi điểm.

      Kết quả là một nhân vật không cần crit và không cần món đặc biệt nào trong phần lớn Atlas. Đó là lý do nó làm league starter được.
  - title: Strike target chính là tốc độ clear của bạn
    body: |
      Một strike skill bình thường đánh một con quái. Mỗi con quái thêm mà nó nhắm được sẽ phóng ra thêm một loạt lưỡi băng.

      Link đầu tiên của tác giả ở Act 1 dùng [[Ancestral Call Support]], cho cú strike nhắm thêm hai con quái. Chính đoạn hướng dẫn của PoEDB cho cặp này nói rằng khi có ít nhất ba con quái ở gần, nó có thể nhân ba số projectile lưỡi băng.

      Ở Act 2 cây của anh ta lấy Attack Mastery "Non-Vaal Strike Skills target 1 additional nearby Enemy", và Ancestral Call rời link nhường chỗ cho một support damage. Trong các bộ endgame, gloves mang đúng dòng đó dưới dạng Eldritch implicit.
  - title: Toàn cold trong giai đoạn axe, và vì sao chuyện đó phải kết thúc
    body: |
      Ở Act 4 cây lấy Cold Mastery "40% of Physical Damage Converted to Cold Damage". Cộng với 60% của chính gem, giờ mọi điểm damage đều là cold. Lý tưởng khi bạn không bao giờ crit: một loại damage, một aura, một resistance cần xuyên qua.

      Bản claw thì cần điều ngược lại. Cây của nó lấy Bleeding Mastery "80% increased Critical Strike Chance against Bleeding Enemies", mà chỉ physical damage mới gây được bleeding.

      Nên ghi chú của tác giả về cú đổi rất dứt khoát: đổi Cold Mastery từ dòng conversion sang "enemies take more damage when frozen", vì "you need physical damage to bleed to proc a lot of crit chance and crit multi".

      Quên bước này thì nhân vật claw của bạn không có bleed và ít crit hơn hẳn. Xem mục Nếu thấy có gì đó sai sai.
  - title: Slayer cho gì, theo thứ tự bạn lấy
    body: |
      Từ dữ liệu cây của GGG:

      - **[[Bane of Legends]]:** 20% more damage with hits lên quái unique, 10% more damage nếu bạn vừa giết gần đây, và bạn không ăn reflected physical damage.
      - **[[Headsman]]:** giết quái còn 20% máu trở xuống. 10% attack speed trong 20 giây sau khi giết quái rare hoặc unique, và 10% movement speed trong 20 giây sau bất kỳ cú giết nào.
      - **[[Brutal Fervour]]:** life leech không bị gỡ khi máu đầy, 100% increased maximum recovery per leech, và 10% reduced damage taken khi đang leech.
      - **[[Masterful Form]]:** +1 maximum frenzy charge, và maximum endurance charge của bạn bằng maximum frenzy charge.

      Build không lấy notable Impact hay Endless Hunger.
  - title: Đóng băng, ở bản hoàn chỉnh
    body: |
      Bộ gear cuối được dựng quanh quái bị freeze.

      - [[Heatshiver]]: "Gain 30% of Cold Damage as Extra Fire Damage against Frozen Enemies", và 1% cho mỗi 1% chill trên quái chỉ bị chill. Ghi chú của tác giả: kiếm một cái "as soon as possible", nó "gives a lot more damage".
      - Cold Mastery từ cây claw: quái vĩnh viễn ăn thêm 5% increased damage cho mỗi giây chúng từng bị bạn freeze, tối đa 50%.
      - [[Summon Skitterbots]] với [[Bonechill Support]] để chill những thứ bạn không freeze được.
      - [[The Taming]], cây ring cho more elemental damage theo từng loại elemental ailment trên quái.
      - [[Herald of Ice]], làm quái bị freeze vỡ tan.

      Một con boss không freeze được vẫn ăn nửa chill của bộ này.
  - title: Những thứ chúng tôi không lấy được từ nguồn này
    body: |
      - **Điểm số của chính tác giả.** Chúng nằm trong video và không được viết ra.
      - **Bất kỳ cái giá nào.** Không có trong phần mô tả lẫn trong file.
      - **Bất kỳ tổng damage hay life nào.** File được lưu mà không có chúng, và chúng tôi không tự chạy Path of Building.
      - **Mod map cần tránh.** Tác giả công bố một chuỗi search để roll map chứ không phải một danh sách, và chúng tôi sẽ không đoán chuỗi đó bung ra thành gì.
      - **Vì sao anh ta chọn từng bandit, từng Pantheon và thứ tự lab.** File ghi lại lựa chọn, không ghi lý do.

mandatory:
  - term: Frost Blades
    why: >-
      Skill chính, từ level 1 tới cuối. Đây là gem gốc: build không dùng bản
      transfigured.
    detail: >-
      PoEDB chỉ liệt kê nó là quest reward cho Ranger. Duelist mua nó từ Nessa
      sau Enemy at the Gate, quest đầu tiên của game.
  - term: Precise Technique
    why: >-
      40% more attack damage khi accuracy của bạn cao hơn life. Nó là động cơ
      của bản axe.
    detail: >-
      Lấy ở Act 3. Nó rời cây lúc đổi sang claw, khi build bắt đầu crit.
  - term: Bane of Legends
    why: >-
      Notable ascendancy đầu tiên trong các cây của tác giả. Thêm damage lên
      quái unique, và thêm nữa sau một cú giết gần đây.
  - term: Brutal Fervour
    why: >-
      Leech vẫn chạy khi full máu. Nó là nguồn hồi phục của bạn, và nó làm mấy
      mod "damage while leeching" trên gear hoạt động mọi lúc.
  - term: Multistrike Support
    why: >-
      Trong main link từ Act 5 tới bộ gear cuối. Nó lặp lại đòn đánh thêm hai
      lần, nhanh hơn.
  - term: Elemental Damage with Attacks Support
    why: >-
      Trong main link từ Act 3 suốt giai đoạn axe, và quay lại ở bộ hoàn
      chỉnh.
  - term: Hatred
    why: >-
      Aura damage từ Act 3 suốt giai đoạn axe. Nó thêm cold damage dựa trên
      physical damage của bạn và cho more cold damage.
    detail: >-
      Nó vắng mặt trong cả hai bộ gem claw trong file của tác giả, cùng với
      [[Precision]]. File không nói vì sao, và chúng tôi không biết được đó có
      phải cố ý không. Kiểm xem mana của bạn cho phép gì trước khi bỏ nó.
  - term: Ice Bite Support
    level: recommended
    why: >-
      Vào main link ở map đầu và ở lại tới cuối.
  - term: Fortify Support
    level: recommended
    why: >-
      Trong link từ Act 6 để lấy giảm damage. Ở bộ cuối nó được thay bằng một
      implicit trên body armour cho cơ hội fortify khi melee hit.
  - term: Carnage Heart
    level: recommended
    why: >-
      Món mua đầu tiên của tác giả khi build chậm lại: attribute, resistance,
      life leech, và increased damage while leeching.
    detail: >-
      Phương án thay của anh ta là amulet nào có attribute cũng được, thêm
      "damage while leeching" ở crafting bench.
  - term: Devoto's Devotion
    level: recommended
    why: >-
      Món mua thứ hai của anh ta: 16% attack speed, 20% movement speed và một
      cục Dexterity lớn trên một cái helmet.
  - term: Heatshiver
    level: recommended
    why: >-
      Thay [[Devoto's Devotion]] ở bản crit. Extra fire damage lên quái bị
      chill và freeze.
  - term: Assassin's Mark
    level: recommended
    why: >-
      Được [[Mark On Hit Support]] áp thay bạn ở bản claw. Chỉ dẫn của tác
      giả: cắm nó vào một socket xanh dương trên claw và đưa gem lên 10%
      quality, để có "consistent power charges on bosses", tức power charge
      đều đặn khi đánh boss.
  - term: Summon Skitterbots
    level: recommended
    why: >-
      Chill và shock lên mọi thứ gần bạn, từ map đầu. Về sau link với
      [[Bonechill Support]].
  - term: Vaal Haste
    level: recommended
    why: >-
      Một cú bùng tốc độ cho boss. Ghi chú của tác giả nói dùng tincture và
      Vaal Haste cùng lúc khi đánh boss map.

labs:
  - lab: Normal
    node: Bane of Legends
    why: "Nó nằm trong cây Act 3 của tác giả. Anh ta không viết lý do. Lý do của chúng tôi: nó là cái duy nhất trong bốn cái thuần damage, mà damage là thứ campaign đòi."
  - lab: Cruel
    node: Headsman
    why: "Trong cây Act 7–8 của anh ta. Cull ở 20% máu rút ngắn mọi trận đánh, và movement speed sau mỗi cú giết là tốc độ chạy map thật sự đầu tiên bạn có."
  - lab: Merciless
    node: Brutal Fervour
    why: "Trong cây campaign cuối của anh ta. Nguồn hồi phục của bạn từ đây trở đi. Cũng cây đó lấy luôn Leech Mastery."
  - lab: Eternal
    node: Masterful Form
    why: "Trong cây axe cuối của anh ta. Ghi chú của anh ta nói bộ gear đó cho bạn \"breeze through Uber Lab\", lướt qua Uber Lab. Nó còn biến mấy node frenzy charge thành endurance charge luôn."

stages:
  - id: acts-1-3
    phase: early
    image: spectral-throw
    title: Act 1–3
    levels: Level 1–33
    uses: >-
      [[Frost Blades]] từ level 1 để dọn pack, với [[Spectral Throw]] trong
      link thứ hai cho mục tiêu đơn. Axe hai tay rare, thay thường xuyên.
    changes: >-
      Ở Act 2 cây lấy mastery strike target và mastery accuracy. Ở Act 3 bạn
      thêm [[Hatred]], lấy [[Precise Technique]], và chạy Normal Labyrinth lấy
      [[Bane of Legends]].
    links:
      - name: Act 1, dọn pack
        gems: [Frost Blades, Added Fire Damage Support, Ancestral Call Support]
      - name: Act 1, mục tiêu đơn
        gems: [Spectral Throw, Chance to Bleed Support, Added Fire Damage Support]
      - name: Act 2
        gems: [Frost Blades, Added Fire Damage Support, Ruthless Support]
      - name: Four-link Act 3
        gems: [Frost Blades, Added Fire Damage Support, Elemental Damage with Attacks Support, Close Combat Support]
      - name: Di chuyển
        gems: [Leap Slam, Faster Attacks Support, Momentum Support, Dash]
      - name: Buff Act 2
        gems: [Herald of Ash, Blood Rage, Decoy Totem]
      - name: Aura và curse Act 3
        gems: [Hatred, Punishment]
    moveOn: "Frost Blades đã nằm trong four-link, Precise Technique đang hoạt động, và đã lấy Bane of Legends."
    details:
      - title: Tác giả đã đơn giản hóa đường vũ khí cho 3.30
        body: |
          Mô tả của anh ta cho league này: "levelling has been improved and the white wind dagger part removed from the build", vì đi "axes - dagger - claw" thì "a little too complex". Tức là phần leveling đã được cải thiện và đoạn dùng dagger "white wind" bị gỡ khỏi build, vì ba bước vũ khí là hơi quá rối.

          Nên giờ đường đi còn hai bước. Axe hai tay cho tới sâu trong map, rồi một lần đổi sang claw và shield.

          Mấy cây axe mẫu trong file của anh ta, theo từng act: Jade Chopper, Poleaxe, Shadow Axe, Timber Axe, Ezomyte Axe, rồi một cây Despot Axe trong map. Từ Act 5 cây mẫu có increased physical damage thêm ở crafting bench. Nhặt mọi base axe hai tay mà bạn chưa có.
      - title: Giữ cho Precise Technique luôn bật
        body: |
          Keystone chỉ hoạt động khi accuracy rating của bạn cao hơn maximum life. Giai đoạn đầu chuyện đó rất dễ vỡ: một dòng life ngon mà không có accuracy là xong.

          Câu trả lời của cây là Accuracy Mastery "+500 to Accuracy Rating, −2 to Accuracy Rating per Level". Nó mạnh nhất ở level thấp rồi nhạt dần, và đó là lý do tác giả đổi nó ở Act 7 sang mastery cho +3 accuracy mỗi điểm Dexterity.

          Nếu damage của bạn tụt không rõ lý do, so hai con số đó trên bảng nhân vật.
      - title: Một cái fire mastery trên build cold
        body: |
          Cây Act 2 lấy Fire Mastery cho "100% increased Damage with Hits against Ignited Enemies", và các link đầu dùng [[Added Fire Damage Support]] với [[Herald of Ash]].

          Đó là lựa chọn cho leveling: mastery này là một bonus lớn lên bất cứ thứ gì đang cháy. File không giải thích tác giả trông đợi quái bị ignite bằng cách nào, nên chúng tôi không nói được nó áp dụng thường xuyên tới đâu. Nó được hoàn điểm ở Act 6, khi cây lấy Elemental Mastery thay vào.
      - title: Bandit và Pantheon
        body: |
          File ghi "kill all three bandits" (giết cả ba bandit) và **Soul of the Brine King** cùng **Soul of Gruthkul**. Lý do thì nằm trong video, cái mà chúng tôi không xem.
  - id: acts-4-10
    phase: early
    image: precise-technique
    title: Act 4–10
    levels: Level 33–68
    uses: >-
      [[Frost Blades]] với [[Multistrike Support]] từ Act 5 và
      [[Fortify Support]] từ Act 6. [[Hatred]], [[Precision]] và
      [[Flesh and Stone]] làm aura.
    changes: >-
      Act 4 đổi nốt phần physical damage còn lại của bạn thành cold. Bạn
      ascend thêm hai lần: [[Headsman]], rồi [[Brutal Fervour]]. Từ Act 7 cây
      bắt đầu lấy spell suppression.
    links:
      - name: Four-link Act 5
        gems: [Frost Blades, Elemental Damage with Attacks Support, Multistrike Support, Close Combat Support]
      - name: Five-link Act 6
        gems: [Frost Blades, Elemental Damage with Attacks Support, Multistrike Support, Close Combat Support, Fortify Support]
      - name: Di chuyển
        gems: [Leap Slam, Faster Attacks Support, Momentum Support, Flame Dash]
      - name: Aura
        gems: [Hatred, Precision, Flesh and Stone]
      - name: Curse và golem
        gems: [Elemental Weakness, Summon Flame Golem]
    moveOn: "đã lấy ba notable ascendancy, resistance đã vá lại sau Act 10, và bạn đang bước vào map."
    details:
      - title: Cây làm gì ở từng act
        body: |
          Đọc ra từ các cây của tác giả:

          - **Act 4:** Cold Mastery, 40% physical damage đổi thành cold. Notable Fangs of Frost và Hatchet Master.
          - **Act 5:** Axe Mastery, "Gain 2 Rage on Hit with Axes".
          - **Act 6:** Elemental Mastery, hit có 15% cơ hội coi resistance của quái như bị đảo ngược. Fire mastery từ Act 2 được hoàn điểm.
          - **Act 7–8:** notable Inveterate và mastery làm spell suppression thành lucky. Mastery reservation, để vừa ba aura.
          - **Cuối campaign:** Leech Mastery, 5% leech là tức thì.

          Muốn đường đi chính xác giữa chúng thì mở file ở mục Nguồn. Trong đó mỗi act có một cây.
      - title: Một thay đổi trong bộ gem campaign cuối
        body: |
          Bộ gem dán nhãn "Act 8 to Maps" bỏ [[Fortify Support]] để lấy [[Added Cold Damage Support]]. Bộ kế tiếp, cho map đầu, lại có Fortify.

          **File không giải thích chuyện này.** Có thể là do màu socket trên gear campaign. Bạn có link cho cái nào thì dùng cái đó; không cái nào đổi cách build chơi.
      - title: Flame Golem yếu đi chút trong 3.30
        body: |
          [[Summon Flame Golem]] nằm trong các bộ gem từ Act 4 tới map. Buff damage của nó bị cắt trong patch này. Nó là món thêm một socket cho leveling và không đáng để bận tâm.
