      - title: Gear trong bộ map đầu của tác giả
        body: |
          Không có unique nào cả. Base evasion và armour, mỗi món có life và hai resistance. Two-Stone Ring. Amulet và belt từ campaign. Một cây ring có dòng accuracy lớn, để giữ [[Precise Technique]] hoạt động khi life của bạn tăng.

          Cây axe mẫu có 123% increased physical damage, 14–29 added physical damage và 15% attack speed.
      - title: Cây tincture
        body: |
          Các bộ của anh ta mang một Prismatic Tincture từ map đầu tới cuối: increased elemental damage with melee weapons, và trong cây mẫu của anh ta, elemental penetration.

          Tincture là thứ bật lên chứ không uống, và nó đốt mana trong lúc bật. Lời khuyên đánh boss của anh ta là bật nó cùng lúc với [[Vaal Haste]].
      - title: Hoàn thành Atlas theo thứ tự
        body: |
          Ghi chú của tác giả: "You should be mid 80s by early red maps if you complete your atlas in order, ie, do all the T1 maps, then T2". Làm Atlas theo thứ tự, hết T1 rồi tới T2, thì lúc chớm map đỏ bạn sẽ ở khoảng giữa 80.

          Anh ta cần mấy cái level đó. Build "benefits from both our character level and gem levels", và cú đổi sang claw đến muộn hơn phần lớn người chơi tưởng.
  - id: red-maps
