    details:
      - title: Thứ tự tác giả đưa ra sau cây claw
        body: |
          1. [[Heatshiver]] "as soon as possible".
          2. Một cây body armour "with the fortify and endurance charge implicit".
          3. Rồi "drop the endurance charge nodes from the tree and pick up the jewel socket on the right side of the tree and start filling out the life and avoid ailments wheel next to point blank keystone at the bottom of the tree". Tức là bỏ mấy node endurance charge, lấy jewel socket bên phải cây, rồi lấp dần wheel life và avoid ailments cạnh keystone Point Blank ở đáy cây.
      - title: Trong bộ gear mẫu có gì
        body: |
          - **Claw:** một Gemini Claw có 89–156 added cold damage fractured, 30% attack speed và 37% critical strike chance, craft thêm "Hits can't be Evaded" và elemental penetration.
          - **Shield:** một [[Lacquered Buckler]] có increased block chance, spell suppression và life.
          - **Belt:** [[The Arkhon's Tools]], thêm một con Skitterbot thứ ba và làm aura của Skitterbot tác dụng lên cả bạn.
          - **Ring:** [[The Taming]].
          - **Gloves:** Eldritch implicit cho cold exposure on hit và thêm một strike target.
          - **Flask:** [[Diamond Flask]], [[Silver Flask]], [[Jade Flask]] và [[Quicksilver Flask]], mỗi cây đều được craft để tự dùng khi đầy charge.

          Sáu món trong số đó là đồ fractured. Xem mục 3.30 đổi gì cho build này.
      - title: Weapon swap cho Enduring Cry
        body: |
          Bộ vũ khí thứ hai trong file chứa [[Enduring Cry]] với [[Urgent Orders Support]] trong shield unique [[Redblade Banner]], bản hiện tại của nó cho warcry có infinite power.

          Bình thường một warcry đếm số quái quanh bạn. Với infinite power, một tiếng hô cho đủ endurance charge trước một con boss đứng một mình. Bạn đổi vũ khí, hô, rồi đổi lại. Tác giả không mô tả chuyện này trong ghi chú; đó là cách đọc của chúng tôi từ bộ gear.
      - title: Guide này dừng ở đâu
        body: |
          Nguồn này không có cluster jewel, không có bảng giá và không có lời khuyên nào cho pinnacle boss hay uber boss. Tác giả trỏ sang một video riêng cho bản Frost Blades big-budget của anh ta từ một league trước. Chúng tôi không dùng nó, vì nó không phải nguồn 3.30.

powerCurve: |
  Bản axe nhân bốn thứ đơn giản với nhau: base damage của axe, tỷ lệ phần trăm của chính gem (144% weapon damage ở level 1, 410% ở level 20), 40% more của [[Precise Technique]], và attack speed qua [[Multistrike Support]]. Tốc độ clear là thứ thứ năm, và nó đến từ việc cú strike nhắm được bao nhiêu con quái.

  **Ở level 30** bạn đã có phần lớn chỗ đó. Frost Blades nằm trong tay bạn từ zone đầu tiên, mastery strike target tới ở Act 2, còn Precise Technique và [[Bane of Legends]] ở Act 3. Đó là lý do campaign thấy mạnh: không có gì phải chờ một món đồ.

  **Ở level 70** bạn có ba notable ascendancy và một five-link, và đà tăng trưởng vẫn đều. Từ đây thứ duy nhất còn tăng là cây axe bạn nhặt được và level của gem. Đó là một con dốc thoải, và quanh map Tier 10–11 thì máu quái tăng nhanh hơn nó. Tác giả tự gọi tên bức tường đó.

  **Ở level 85–95** bạn mở những hệ số trước đó bị khóa: critical strike, đóng băng, và extra fire damage của [[Heatshiver]] lên quái bị freeze. Đó là cú đổi sang claw. Nó là build thứ hai chồng lên level và gem level của build thứ nhất, và đó là lý do anh ta dặn bạn đừng vội.

  **Cách đọc của chúng tôi, không phải của tác giả:** mạnh lúc đầu, phẳng ở giữa, rồi một cú nhảy có chủ đích mà bạn phải trả tiền. Nếu đoạn phẳng làm bạn chán, thuốc chữa là ba món mua rẻ, không phải một cây claw sớm.

upgrades:
  - step: "[[Carnage Heart]], hoặc một amulet attribute có craft damage while leeching"
    why: >-
      Món mua đầu tiên của tác giả. Với [[Brutal Fervour]] bạn luôn đang
      leech, nên "damage while leeching" đơn giản là damage. Nó còn đem theo
      attribute và resistance, những thứ gear leveling rare hay thiếu.
  - step: "[[Devoto's Devotion]]"
    why: >-
      16% attack speed và 20% movement speed trong một slot. Đứng thứ hai vì
      nó lấy mất phần life và resistance mà helmet rare từng có, nên
      resistance của amulet cần có mặt trước. Lý do đó là của chúng tôi.
  - step: "Một cây body armour six-link corrupted"
    why: >-
      Thêm một support, trong bộ của anh ta là [[Cold Penetration Support]].
      Đứng thứ ba vì link thứ sáu là bậc nhỏ hơn hai món đầu, trên một nhân
      vật mà vấn đề là base damage và tốc độ.
  - step: "Eternal Labyrinth lấy [[Masterful Form]]"
    why: >-
      Miễn phí. Nó nằm ở đây vì ghi chú của anh ta nói chính bộ gear phía trên
      làm lab dễ.
  - step: "Một cây claw nhập môn: cold damage cao, attack speed cao, craft \"Hits can't be Evaded\". Kèm một cây shield và cú đổi mastery."
    why: >-
      Món lớn. Nó mở crit và phần scale theo quái bị freeze. Nó đứng thứ năm
      chứ không phải thứ nhất vì nó thay vũ khí, keystone và một phần tư cây
      của bạn, và chỉ có lời khi level và gem level đã cao.
  - step: "Crit multiplier trên jewel; added cold và elemental damage trên ring"
    why: >-
      Multiplier chẳng đáng gì trước khi bạn crit và đáng rất nhiều sau đó.
      Đây là những món nhỏ bạn mua từng cái một được.
  - step: "[[Heatshiver]]"
    why: >-
      Extra fire damage lên quái bị chill và freeze, thứ chỉ chạy ngon khi bạn
      freeze được ổn định. Chuyện đó cần crit và Skitterbot trước.
  - step: "Body armour có implicit fortify và endurance charge"
    why: >-
      Đứng cuối vì nó là một món tiện lợi rồi hóa thành sức mạnh: nó giải
      phóng một slot support và vài passive point cùng lúc.

play:
  mapping: |
    Di chuyển bằng [[Leap Slam]] ở bản axe và [[Whirling Blades]] ở bản claw. Cả hai đều link với [[Faster Attacks Support]].

    Đánh con quái gần nhất từ xa hết mức cú strike với tới. Bạn không nhắm vào pack: lưỡi băng rời con quái đầu tiên trúng đòn và tự tìm mấy con khác. Với hai ba strike target, một nhát chém phóng lưỡi băng ra khỏi vài con quái cùng lúc.

    Rồi đi tiếp. [[Headsman]] cho movement speed sau mỗi cú giết và attack speed sau mỗi con rare, nên build càng chạy càng nhanh.

    Giữ [[Blood Rage]] chạy. [[Steelskin]] tự kích qua [[Automation]]. Ở bộ gear cuối, bốn cây utility flask cũng tự dùng luôn.
  bossing: |
    Trước trận ở bản claw: đổi vũ khí, bấm [[Enduring Cry]], đổi lại.

    Rồi, theo chỉ dẫn của tác giả, bật tincture và bấm [[Vaal Haste]]. [[Assassin's Mark]] được chính các cú hit của bạn áp lên và nuôi bạn bằng power charge.

    **Chỗ giằng co của build:** mấy lưỡi băng clear map gây 30% less damage so với cú strike và bay vào những con quái *khác*. Trước một con boss, damage của bạn là chính cú strike, nên bạn đứng trong tầm và chém liên tục. Phần hồi phục cũng đòi đúng điều đó, vì leech và life gained per hit đều dừng khi bạn dừng. Đoạn này là cách đọc của chúng tôi từ gem và gear; lời khuyên đánh boss của tác giả thì nằm trong video.

troubleshooting:
  - symptom: "Đang mượt, rồi đuối đi quanh map Tier 10–11."
    cause: >-
      Chẩn đoán của chính tác giả: "junk gear and a 5 link". Cho tới lúc đó
      thứ duy nhất tăng trưởng là cây axe và gem level.
    fix: >-
      Ba món mua của anh ta, theo thứ tự: [[Carnage Heart]] hoặc một amulet có
      damage while leeching, [[Devoto's Devotion]], một cây six-link
      corrupted.
  - symptom: "Tôi đổi sang claw mà crit chance tệ quá."
    cause: >-
      Cold Mastery vẫn đang convert 40% physical damage cuối cùng của bạn.
      Không có physical damage thì bạn không gây bleeding, và 80% increased
      crit chance của Bleeding Mastery không bao giờ áp dụng.
    fix: >-
      Đổi Cold Mastery sang lựa chọn quái bị freeze, đúng như ghi chú của tác
      giả.
  - symptom: "Tôi đổi sang claw và miss rất nhiều."
    cause: >-
      [[Precise Technique]] và mấy accuracy mastery đã đi, mà không có gì thay
      vào. Đây là cách đọc của chúng tôi từ hai cái cây.
    fix: >-
      Craft "Hits can't be Evaded" lên claw. Đó là một trong ba thứ tác giả
      đòi ở một cây claw nhập môn.
  - symptom: "Tôi đổi sang claw mà yếu hơn trước."
    cause: >-
      Quá sớm. "The build benefits from both our character level and gem
      levels."
    fix: >-
      Quay lại axe nếu bạn còn giữ nó, làm xong Atlas, rồi đổi ở khoảng giữa
      tới cuối 80.
  - symptom: "Không có power charge khi đánh boss."
    cause: >-
      [[Assassin's Mark]] bị thiếu, quality thấp, hoặc nằm trong một link
      không kích được nó.
    fix: >-
      Tác giả: một socket xanh dương trên claw, gem ở 10% quality, link với
      [[Mark On Hit Support]].

patch:
  - note: >-
      **Skill không có gì thay đổi.** [[Frost Blades]] không xuất hiện trong
      patch note 3.30, và [[Precise Technique]], [[Multistrike Support]],
      [[Heatshiver]] hay cây tincture build dùng cũng không. Câu của chính tác
      giả: "Nothing has really changed for a while with Frost Blades".
  - entry: ruthless-changes
    note: >-
      **Slayer không bị đổi, bất kể bạn đọc được gì.** Patch note có liệt kê
      thay đổi cho Impact và Endless Hunger của Slayer, nhưng nằm trong phần
      chỉ dành cho Ruthless. Dữ liệu cây của GGG cho game thường giống hệt
      nhau trước và sau patch. Đằng nào build này cũng không lấy notable nào
      trong hai cái đó.
  - entry: fractured-items-rarer
    note: >-
      **Bộ gear hoàn chỉnh khó chép hơn.** Sáu món trong bộ cuối của tác giả
      là đồ fractured, kể cả cây claw. Đồ fractured giờ đến từ ít nguồn hơn
      hẳn. File của anh ta được dựng trước khi chuyện đó thành vấn đề.
  - entry: no-random-league-mechanics
    note: >-
      **Kế hoạch farm của anh ta cần kiểm lại.** Anh ta kiếm cây claw bằng
      Blighted Map. Blight không còn xuất hiện trong map nếu không có Thread,
      và chúng tôi không xác nhận được giờ Blighted Map kiếm bằng cách nào.
  - entry: special-base-implicits
    note: >-
      **Có thể là một buff nhỏ cho một cây belt.** Bộ claw đeo
      [[Perseverance]], một cây Vanguard Belt cho attack damage theo cái thấp
      hơn giữa armour và evasion của bạn. Implicit của Vanguard Belt giờ roll
      tới +480 mỗi loại, trước đây dừng ở 320. Trang PoEDB của món unique vẫn
      hiện dải cũ lúc chúng tôi kiểm, nên chúng tôi không xác nhận được món
      unique có được hưởng không.
  - entry: golem-buff-nerfs
    note: >-
      **Vặt vãnh, và chỉ trong campaign.** [[Summon Flame Golem]] cho 15–24%
      increased damage, giảm từ 20–29%. Ở đây nó là gem leveling.
  - entry: league-fates
    note: >-
      **Một build clear speed trong một league trả tiền cho boss.** Cơ chế
      league làm boss khu vực khó hơn và thưởng cho việc giết chúng. Frost
      Blades mạnh nhất khi đánh pack và trơn nhất khi đánh mục tiêu đơn. Đó là
      cách đọc của chúng tôi, và chưa ai đo cả.

strengths:
  - "Main skill nằm trong tay bạn từ zone đầu tiên và không bao giờ đổi."
  - "Clear cả màn hình chỉ bằng một nhát chém, không bắt buộc món đồ nào."
  - "Càng giết càng nhanh: movement speed sau mỗi cú giết, attack speed sau mỗi con rare."
  - "Bản đầu tiên không cần unique nào cho tới khoảng map Tier 10."
  - "File của một tác giả, có cây và bộ gem cho từng act."
  - "Thứ tự nâng cấp rõ ràng, do chính tác giả viết ra."
weaknesses:
  - "Single target chỉ là mỗi cú strike; lưỡi băng bay đi chỗ khác và gây 30% less."
  - "Bạn phải đứng trong tầm và đánh liên tục, cho cả damage lẫn hồi phục."
  - "Khúc giữa Atlas phẳng lì cho tới khi bạn mua ba món."
  - "Cú đổi sang claw là một lần dựng lại thật sự: vũ khí, keystone, mastery, một phần tư cây."
  - "Bộ gear hoàn chỉnh dựa vào đồ fractured, thứ 3.30 làm hiếm hơn."
  - "Một nguồn, không giá, không số damage và một video chúng tôi không kiểm được."
avoidIf: >-
  Chọn build khác nếu bạn muốn đứng xa boss, hoặc muốn một build xong xuôi ngay
  khi campaign xong. Bỏ qua nếu chuyện dựng lại một nhân vật đang chạy ngon ở
  level 85 nghe như việc vặt chứ không phải phần thưởng. Và nếu bạn cần giá
  với số liệu công bố trước khi cam kết, guide này không cho bạn được: nguồn
  duy nhất của nó không có cái nào.

