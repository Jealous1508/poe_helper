    moveOn: "Atlas đã clear xong, bạn ở khoảng giữa 80 trở lên, và bạn có currency cho một cây claw."
    details:
      - title: Bức tường ở Tier 10–11, theo lời tác giả
        body: |
          "The build will start to fall away on junk gear and a 5 link around T10-T11 maps." Với gear rác và five-link, build bắt đầu hụt hơi quanh map T10–T11.

          Cách vá của anh ta, theo thứ tự của anh ta:

          1. "A carnage heart or amulet with attributes and craft damage while leeching."
          2. [[Devoto's Devotion]].
          3. Một cây body armour six-link corrupted.

          "Aim for gear similar to the POB for end non crit axe and you will breeze through Uber Lab." Nhắm bộ gear giống bản axe non-crit cuối trong POB là bạn lướt qua Uber Lab.

          **Tốn bao nhiêu thì không được nói.** Ba món đó là unique phổ biến và một cái chest corrupted, những thứ rẻ ở các league trước; đó là hiểu biết chung chứ không phải giá 3.30.
      - title: Bộ axe hoàn thiện trông ra sao
        body: |
          Từ file: một cây Despot Axe có 132% increased physical damage, 14–29 added physical damage và 23% attack speed. Carnage Heart, anoint notable Kinetic Impacts. Devoto's Devotion. Mọi thứ còn lại vẫn là gear rare có life và resistance.

          Cây thêm [[Masterful Form]] và Evasion Mastery cho 15% spell suppression khi cả bốn món armour đều có evasion.
      - title: Kế hoạch farm của anh ta, và một lời dè chừng cho 3.30
        body: |
          Kế hoạch của tác giả để kiếm cây claw là "complete scoured T16 Blight Maps" bằng bộ này, tức chạy Blight Map T16 đã scour.

          Trong 3.30 Blight không còn tự xuất hiện trong map thường. Chúng tôi không xác nhận được từ patch note là giờ Blighted Map kiếm bằng cách nào hay giá ra sao. Coi kế hoạch đó như một ví dụ về loại content mà bộ axe làm được, và cứ farm thứ mà Atlas của bạn đang được dựng cho.
  - id: claw-and-shield
    phase: endgame
    image: lacquered-buckler
    title: Cú đổi sang claw và shield
    levels: Map Tier 14–16, level 85 trở lên
    uses: >-
      Một cây claw rare có cold damage cao và attack speed, một cây
      [[Lacquered Buckler]], [[Perseverance]], cùng gloves, helmet và amulet
      bạn đã có sẵn. Giờ build crit.
    changes: >-
      [[Precise Technique]] và mấy node axe rời cây; node claw và crit vào.
      Cold Mastery đổi. [[Assassin's Mark]], [[Herald of Ice]] và
      [[Whirling Blades]] gia nhập bộ gem.
    links:
      - name: Main skill
        gems: [Frost Blades, Multistrike Support, Ice Bite Support, Added Cold Damage Support, Cold Penetration Support, Fortify Support]
      - name: Mark
        gems: [Assassin's Mark, Mark On Hit Support, Lifetap Support]
      - name: Di chuyển và charge
        gems: [Whirling Blades, Faster Attacks Support, Enduring Cry]
      - name: Buff
        gems: [Herald of Ice, Flesh and Stone, Blood Rage]
      - name: Chill
        gems: [Summon Skitterbots, Bonechill Support]
      - name: Guard và burst
        gems: [Steelskin, Automation, Vaal Haste]
    moveOn: "bản claw chạy map Tier 16 kiểu alch-and-go một cách thoải mái. Đó là bài test của chính tác giả."
    details:
      - title: Cây claw nhập môn
        body: |
          Tác giả đổi ý sau khi quay video, và viết chữ in hoa phía trên ghi chú để chắc là người ta đọc. Lời khuyên hiện tại của anh ta:

          "I would recommend just aiming for a claw with big cold, big attack speed and crafted hits cannot be evaded. If you can get crit too then great but it might be too expensive for an entry claw."

          Nói gọn: cold to, attack speed to, và dòng craft hits cannot be evaded; có thêm crit thì tốt, nhưng có thể quá đắt cho một cây claw nhập môn.

          Cây mẫu trong file: một Imperial Claw có 87–153 added cold damage, 24% attack speed, life gained per enemy hit, và "Hits can't be Evaded" craft ở bench.

          Dòng craft đó quan trọng vì mấy accuracy mastery rời cây cùng với [[Precise Technique]]. Câu cuối này là cách đọc của chúng tôi từ các cây của anh ta, không phải lời anh ta.
      - title: Bước mà ai cũng quên
        body: |
          "Make sure you change your cold mastery from 40% physical converted to cold to enemies take more damage when frozen. You need physical damage to bleed to proc a lot of crit chance and crit multi."

          Nói gọn: đổi Cold Mastery từ dòng 40% conversion sang dòng quái ăn thêm damage khi bị freeze, vì phải còn physical damage thì mới gây bleed được, mà bleed là thứ bật rất nhiều crit chance và crit multi.

          Cây claw lấy Bleeding Mastery "80% increased Critical Strike Chance against Bleeding Enemies" và Critical Mastery "+25% to Critical Strike Multiplier against Unique Enemies". Nếu cú hit không còn chút physical damage nào thì không gì bleed cả.
      - title: Mấy chuyện nhỏ anh ta dặn đừng bỏ sót
        body: |
          - Critical strike multiplier trên jewel.
          - Added cold damage và increased elemental damage trên ring.
          - Một socket xanh dương trên claw cho [[Assassin's Mark]], ở 10% quality.
          - Tincture và [[Vaal Haste]] cùng lúc khi đánh boss map.
      - title: Đừng vội
        body: |
          "Do not rush this switch as the build benefits from both our character level and gem levels." Đừng vội đổi, vì build ăn theo cả level nhân vật lẫn gem level.

          Cây claw trong file có cùng số node với cây axe hoàn thiện, tức là một nhân vật ở nửa trên của khoảng level 80. Thấp hơn mức đó thì bạn đang bỏ một build chạy ngon để lấy một build dở dang.
