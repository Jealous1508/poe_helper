name: Fireball of Radiation Reliquarian
tagline: >-
  Skill mới duy nhất của Covens of Umbra, dùng làm cái single target mà một nhân
  vật Righteous Fire luôn thiếu. Nó là một kế hoạch, không phải một build đã được
  kiểm chứng.
class: Scion
ascendancy: Reliquarian
role: starter
budget: starter
budgetNote: >-
  **Không có gì ở đây tốn tiền và không nguồn nào nêu một con số.** Kế hoạch được
  công bố là một nhân vật level 69 mặc base rare cộng hai unique rẻ,
  [[Cloak of Flame]] và [[Immortal Flesh]], mà trang Righteous Fire Chieftain của
  site này mô tả cả hai chỉ tầm vài món chaos. Gem mới ra từ Divine Font trong
  Labyrinth, không phải từ cửa sổ trade. Qua level 69 thì không có danh sách gear
  nào được công bố, nên cũng không có budget nào.
mainSkill: Fireball of Radiation
image: fireball
hero: art-ascendant
tags: [Spell, Fire, Mới trong 3.30, Degeneration]
ratings: { clear: 3, bossing: 3, survivability: 4, ease: 3 }
verified: "2026-11-13"
confidence: predicted
confidenceNote: >-
  **Đây là build ít được kiểm chứng nhất trên site và điểm số này là trung thực
  chứ không phải khiêm tốn.** [[Fireball of Radiation]] được thêm vào trong 3.30.
  Không có trang PoEDB nào cho nó. Path of Building không có dữ liệu cho nó —
  cái planner mà Goratha công bố dùng [[Fireball]] *gốc* làm hàng thay thế, nên
  cả con số của chính anh ta cũng không phải con số của skill này. Thứ duy nhất
  chúng tôi dẫn lại được một cách chắc chắn là một dòng trong patch note chính
  thức. Hai creator có tên tuổi đang thử nó: Goratha công bố một kế hoạch league
  start ngay ngày launch với 30,100 view, và Pohx — tác giả của Righteous Fire —
  công bố "New Single Target for RF?" một ngày trước đó với 47,600 view. Cả hai
  đều là câu hỏi, không phải kết luận. Bốn điểm số là phỏng đoán, và cả trang này
  nên được đọc như "đây là những gì đã biết và chưa biết", không phải như một
  guide.
modes:
  ssf: >-
    Phù hợp với solo self-found hơn phần lớn build dùng skill mới, vì cái gem
    không phải món trade. Gem transfigured ra từ Divine Font ở cuối một lượt
    Labyrinth, và hai cây unique trong kế hoạch đều là drop phổ biến. **Không
    nguồn nào bàn về solo self-found, nên đây là cách chúng tôi đọc danh sách
    item.**
  hardcore: >-
    Không nguồn nào bàn tới, và chúng tôi thì sẽ không. Hành vi của skill là chưa
    biết, notable của ascendancy cho league này chưa được công bố dưới dạng chữ,
    và planner duy nhất là một nhân vật level 69 với 11,061 effective hit point.

idea: |
  Covens of Umbra thêm đúng một skill transfigured mới. Dòng chính thức là toàn bộ những gì được biết về nó:

  > Unleashes a ball of fire ahead that inflicts a short but powerful fire damage over time debuff to each enemy in an area around it.

  Tức là: một projectile bạn ném ra, nó rơi xuống và đốt mọi thứ gần điểm va chạm trong một khoảng ngắn. Không phải một ignite — một debuff ghi thẳng trên skill. Đó mới là phần đáng chú ý, vì một debuff fire damage over time từ một spell thì scale theo mấy multiplier fire damage over time và không ngán armour hay energy shield của quái.

  Hai creator có cùng một ý về chỗ nó thuộc về. Một nhân vật [[Righteous Fire]] có khả năng scale fire damage khổng lồ, life regeneration khổng lồ, và một lỗ hổng tồn tại từ lâu: Righteous Fire đốt mọi thứ quanh bạn và gần như không làm gì được một con boss đang đứng yên trước mặt. [[Fire Trap]] đã lấp cái lỗ đó suốt nhiều năm. [[Fireball of Radiation]] có thể lấp nó tốt hơn, vì nó là một spell áp một cục fire damage over time theo lệnh.

  [[Reliquarian]] là nửa còn lại, và đó là phần chúng tôi không giải thích được cho bạn. Nó là ascendancy của Scion với notable bị xáo lại mỗi league, và trong 3.30 chúng lại bị xáo — patch note chính thức công bố danh sách của league này dưới dạng bốn tấm ảnh, không có chữ nào.

chain:
  - label: Ném nó ra
    text: "[[Fireball of Radiation]] là một spell cast. Nó bay đi, rơi xuống, và áp một debuff fire damage over time trong một vùng quanh điểm va chạm."
  - label: Ngắn mà mạnh
    text: "Patch note gọi cái debuff đó là \"short but powerful\". Không có duration, base damage hay vùng nào được công bố ở đâu cả, kể cả PoEDB."
  - label: Righteous Fire lo phần dọn quái
    text: "[[Righteous Fire]] đốt mọi thứ quanh bạn liên tục. Đó là nửa chạy map của build và nó không khác gì bất kỳ nhân vật RF nào."
  - label: Regeneration trả giá cho nó
    text: "[[Immortal Flesh]] và cây passive cấp life regeneration phẳng. Nhân vật level 69 được công bố hồi 307 life mỗi giây trong lúc đang cháy."
  - label: Block và chuyển đổi hứng đòn
    text: "[[Glancing Blows]] nhân đôi cả hai chỉ số block, đổi lấy việc ăn 65% damage từ các hit đã block. [[Cloak of Flame]] biến physical damage nhận vào thành fire damage, rồi 81% fire resistance của bạn ăn nốt phần đó."

chainDetails:
  - title: Thật ra người ta biết gì về cái gem mới
    body: |
      Một câu từ patch note chính thức 3.30.0, đã dẫn ở trên. Hết.

      Không biết, sau khi đi tìm tất cả: base damage ở bất kỳ gem level nào, duration của debuff, bán kính vùng, cast time, mana cost, damage effectiveness, debuff có chồng hay làm mới, nó có được tính là ignite cho bất cứ thứ gì không, class nào mua được, hay màu và yêu cầu chỉ số của gem là gì. **PoEDB không có trang cho nó.** Nó là một skill transfigured, nên đường thường là một Divine Font ở cuối một lượt Labyrinth, nhưng chúng tôi cũng không tìm được xác nhận điều đó cho đúng cái gem này.

      Chuyện này quan trọng hơn vẻ ngoài của nó. Một debuff fire damage over time ghi trên gem scale khác hẳn một ignite: ignite scale theo độ lớn cú hit của bạn, còn một debuff từ gem scale theo gem level và mấy multiplier damage over time. Skill này thuộc loại nào trong hai loại đó sẽ quyết định toàn bộ cây passive. **Chưa ai biết.**
  - title: Vì sao planner được công bố không phải planner cho skill này
    body: |
      File của Goratha nằm ở maxroll.gg/poe/pob/i124sx00. Danh sách skill của nó đọc ra **Fireball**, không phải Fireball of Radiation, và mục Fireball báo 35,400 damage mỗi giây ở 1.31 cast mỗi giây với 5% critical strike chance và 150% critical multiplier.

      Đó là Fireball gốc, dùng làm hàng thay thế, vì Path of Building không có dữ liệu cho gem mới. Chuyện đó đúng với cả site này trong league này: không planner nào phản ánh bất kỳ thay đổi 3.30 nào, và riêng cái này thì không phản ánh được chính cái skill mà nó mang tên.

      Phần còn lại của file thì vẫn có ích, vì *nhân vật* là thật dù skill chỉ là hàng thay thế:

      **Level 69.** Life 2,575, energy shield 39, mana 685, **11,061 effective hit point**. Resistance 81 fire, 81 cold, 81 lightning, 80 chaos. Armour 2,321, 29% physical damage reduction, 47% block, 4% spell block, có allocate [[Glancing Blows]]. Cú hit lớn nhất chịu được 3,400 physical và 13,500 mỗi element. Life regeneration 307 mỗi giây, movement speed +17%, 3 trên 3 endurance charge, 238 Strength / 83 Dexterity / 193 Intelligence, giết hết bandit.

      Hãy đọc nó đúng như nó là: trạng thái của một nhân vật ở cuối campaign, công bố ngày launch dưới dạng một kế hoạch.
  - title: Vấn đề Reliquarian
    body: |
      [[Reliquarian]] là ascendancy của Scion với notable bị xoay vòng. Patch note 3.30 ghi, trong mục Ascendancy Changes của game thường:

      > The Notables for the Reliquarian Ascendancy have been shuffled, below are the Passives available for Covens of Umbra.

      Và rồi **bốn tấm ảnh**: nhóm passive armour, caster, jewellery và martial. Tên nằm trong ảnh và không nằm ở đâu trong phần chữ. Chúng tôi không đọc được chúng, nên trang này không có bảng Labyrinth và không nói cho bạn lấy notable nào trước.

      Hai hệ quả đáng nói thẳng. Thứ nhất, mọi guide Reliquarian từ 3.29 đều dựng trên một bộ notable khác và vì vậy đã vô giá trị — đây không phải kiểu "con số có thể xê dịch" thường thấy, nó là một ascendancy khác. Thứ hai, tác giả chọn ascendancy này *chính vì* lần xáo đó: video 3.29 của anh ta về chủ đề này lập luận rằng mấy node Reliquarian mới tốt hơn hẳn của league trước, mà đó là một mô thức chứ không phải một dự đoán về 3.30.

      Hãy kiểm danh sách notable trong game, trên màn hình ascendancy, trước khi bạn tiêu điểm.
  - title: Vì sao lại ghép một skill mới với Righteous Fire
    body: |
      Vì [[Righteous Fire]] có một nhược điểm và nó luôn là đúng cái đó.

      Righteous Fire gây fire damage liên tục cho mọi thứ quanh bạn, scale theo maximum life và energy shield của bạn. Nó clear map bằng cách đi bộ. Trước một mục tiêu lớn đơn lẻ thì nó yếu, vì damage không tăng lên theo quái to hơn và bạn không chồng thêm được.

      Câu trả lời tiêu chuẩn vẫn là [[Fire Trap]] cộng [[Combustion Support]] và bạn bè, và planner của Goratha vẫn mang Fire Trap ở gem level 21. Nếu debuff của skill mới mạnh, nó thay chỗ đó — một spell bạn cast lên boss, thay vì ném một trap rồi đợi nó lên nòng.

      Đó là câu hỏi cả hai creator đang hỏi. Bài của Pohx có tiêu đề, đúng từng chữ, "New Single Target for RF?" — kèm dấu hỏi.

      Nếu bạn muốn một build Righteous Fire chạy được ngay hôm nay, trang Righteous Fire Chieftain của site này là trang nên đọc. Trang này nói về một cuộc thử nghiệm.
  - title: Hai cây unique, còn lại toàn base rare
    body: |
      Đáng để ý trong danh sách gear, vì đó là thứ làm cái này thành một build league start thật chứ không phải một danh sách đi chợ:

      [[Cloak of Flame]] ở chest, chuyển 40% physical damage từ hit thành fire damage — fire đúng là element mà nhân vật này dư thừa cực lớn ở mức 81%. [[Immortal Flesh]] ở belt, một unique level 50 có roll life regeneration phẳng lớn.

      Mọi thứ khác trong file được công bố đều là base thường: một Void Sceptre, một Spiny Round Shield, một [[Archdemon Crown]], Leviathan Gauntlets với Greaves, một Rhex Talisman, hai Vermillion Ring và bốn Crimson Jewel. Không unique chase, không cluster jewel, không cặp Forbidden.
  - title: Danh sách gem, và những gì chúng tôi không nói được về nó
    body: |
      Đọc thẳng từ trang, không nhóm lại: [[Righteous Fire]] ở 20/20, [[Fire Trap]] ở 21/20, [[Flame Dash]], [[Flammability]], [[Summon Skitterbots]], [[Flesh and Stone]], [[Tempest Shield]], [[Storm Brand]], [[Shield Charge]] và [[Purity of Fire]].

      Support có mặt đâu đó trong file: [[Elemental Focus Support]], [[Efficacy Support]], [[Lifetap Support]], [[Swift Affliction Support]], [[Increased Area of Effect Support]], [[Unbound Ailments Support]], [[Increased Critical Strikes Support]], [[Faster Attacks Support]], [[Momentum Support]] và [[Combustion Support]].

      **Trang không nói gem nào link với gem nào.** Nên mấy nhóm link ở phía dưới trang này là cách chúng tôi xếp danh sách gem của anh ta theo chức năng hiển nhiên, không phải cách của anh ta. Chỗ nào chúng tôi đoán, chúng tôi nói rõ.

      Có một thứ danh sách đó cho bạn biết miễn phí: [[Unbound Ailments Support]] và [[Combustion Support]] đều nằm trong đó, mà cả hai đều là công cụ cho ignite. Điều đó gợi ý rằng chính tác giả cũng chưa chắc debuff của skill mới có hành xử như một ignite hay không.

mandatory:
  - term: Fireball of Radiation
    why: >-
      Bản thân skill, và là lý do trang này tồn tại. Một [[Fireball]]
      transfigured thêm vào trong 3.30, áp một debuff fire damage over time ngắn
      và mạnh quanh chỗ nó rơi.
    detail: >-
      **Không tồn tại con số nào cho nó.** Không base damage, không duration,
      không bán kính, không trang PoEDB. Là một gem transfigured thì đường thường
      là một Divine Font ở cuối một lượt Labyrinth. Hãy đọc tooltip của chính cái
      gem trong game, hiện tại đó là nguồn tốt hơn mọi thứ được công bố.
  - term: Righteous Fire
    why: >-
      Phần clear. Nó đốt mọi thứ gần bạn liên tục và scale theo maximum life, và
      nó là lý do build có regeneration cao với fire resistance trên cap ngay từ
      đầu.
    detail: >-
      Đây không phải một guide Righteous Fire. Muốn bản đã được kiểm chứng của
      động cơ Righteous Fire — dàn aura, phép tính regeneration, Pantheon, thứ tự
      mua — hãy đọc trang Righteous Fire Chieftain trên site này, trang đó dựng
      trên nhiều năm công sức của cùng một tác giả.
  - term: Reliquarian
    why: >-
      Ascendancy của Scion, được chọn vì notable của nó bị xáo lại cho league
      này và tác giả kỳ vọng bộ mới sẽ mạnh.
    detail: >-
      **Chúng tôi không liệt kê được các notable.** Patch note chính thức công bố
      passive Reliquarian của league này dưới dạng bốn tấm ảnh không kèm chữ, và
      chưa site nào gõ lại chúng. Hãy đọc màn hình ascendancy trong game trước
      khi tiêu điểm, và coi mọi guide Reliquarian 3.29 như viết cho một
      ascendancy khác.
  - term: Immortal Flesh
    why: >-
      Life regeneration phẳng lớn trên một cây belt level 50, và đó là thứ trả
      giá cho việc tự đốt mình. Trong file được công bố, nhân vật hồi 307 life
      mỗi giây ở level 69.
  - term: Cloak of Flame
    why: >-
      Chuyển 40% physical damage từ hit thành fire damage, mà fire là resistance
      build này có nhiều nhất. Dùng được từ level 18 tới hết game.
  - term: Glancing Blows
    why: >-
      Nhân đôi chance to block attack damage và spell damage của bạn, đổi lấy
      việc ăn 65% damage từ các hit đã block. Nó là keystone mà planner được công
      bố allocate, và là chỗ con số 47% block kia đến từ.
  - term: Fire Trap
    level: recommended
    why: >-
      Skill single-target đương nhiệm của Righteous Fire, ở gem level 21 trong
      file được công bố. Giữ nó cho tới khi skill mới chứng minh được là nó hơn.
  - term: Flammability
    level: recommended
    why: >-
      Hạ fire resistance và tăng chance to ignite. Chuẩn mực trên mọi build fire,
      và là curse hiển nhiên bất kể debuff mới có hóa ra là ignite hay không.
  - term: Purity of Fire
    level: recommended
    why: >-
      Nâng maximum fire resistance. Nhân vật được công bố nằm ở 81% fire
      resistance, và đó là cách một build Righteous Fire sống nổi với aura của
      chính nó.
  - term: Combustion Support
    level: recommended
    why: >-
      Có mặt trong file. Nó hạ fire resistance của quái khi ignite, nên nó chỉ
      trả công nếu skill mới ignite — mà đó đúng là thứ chưa ai biết.
  - term: Unbound Ailments Support
    level: recommended
    why: >-
      More ailment damage và duration. Có trong file vì cùng lý do với
      Combustion, và kèm cùng một lưu ý.
  - term: Archdemon Crown
    level: recommended
    why: >-
      Base helmet trong file được công bố, dưới dạng rare chứ không phải unique.
      Yêu cầu level của nó tình cờ trùng khớp với mốc level 69.

stages:
  - id: acts-1-10
    image: righteous-fire
    title: Act 1–10
    levels: Level 1–69
    uses: >-
      Skill fire để lên level, rồi [[Righteous Fire]] khi life và fire resistance
      của bạn gánh được nó. [[Fire Trap]] để đánh boss. [[Storm Brand]] và
      [[Shield Charge]] có xuất hiện trong file, gợi ý một giai đoạn đầu dựa vào
      brand trước khi Righteous Fire chạy được.
    changes: >-
      Đây là stage duy nhất mà có nguồn thật sự nói tới, vì cái planner được công
      bố **chính là** điểm cuối của stage này. Tới level 69, nhân vật có 2,575
      life, 81% cho mọi elemental resistance, 307 life hồi mỗi giây và có
      allocate [[Glancing Blows]].
    links:
      - name: "Clear (cách chúng tôi nhóm danh sách gem của anh ta, không phải của anh ta)"
        gems: [Righteous Fire, Elemental Focus Support, Increased Area of Effect Support, Swift Affliction Support, Efficacy Support]
      - name: "Single target (nhóm của chúng tôi)"
        gems: [Fire Trap, Combustion Support, Unbound Ailments Support, Swift Affliction Support]
      - name: "Aura và curse (nhóm của chúng tôi)"
        gems: [Purity of Fire, Summon Skitterbots, Flesh and Stone, Flammability, Tempest Shield]
      - name: "Di chuyển (nhóm của chúng tôi)"
        gems: [Shield Charge, Faster Attacks Support, Momentum Support, Flame Dash]
    moveOn: >-
      bạn đã xong Act 10, elemental resistance đã trên 75%, [[Immortal Flesh]] và
      [[Cloak of Flame]] đã lên người, và Righteous Fire đã gánh được.
    details:
      - title: Thứ tự thao tác cho Righteous Fire, nói ngắn
        body: |
          File được công bố không nói rõ chuyện này, nên đây là quy tắc chung cho dòng build này chứ không phải lời khuyên của tác giả.

          Righteous Fire gây fire damage lên bạn mỗi giây dựa trên maximum life của bạn. Bạn chỉ bật được nó khi regeneration cộng fire resistance của bạn thắng được con số đó. Trên thực tế nghĩa là: cap fire resistance trước, lấy life regeneration phẳng thứ hai, bật aura thứ ba. [[Immortal Flesh]] ở level 50 thường là lúc chuyện đó bắt đầu thoải mái.

          Trước đó thì bạn lên level bằng spell fire nào bạn thích. [[Storm Brand]] trong file là lightning, không phải fire, và đó là lựa chọn campaign khá phổ biến vì brand tự gây damage trong lúc bạn đi.
      - title: Những gì chúng tôi không nói được về campaign
        body: |
          Giúp bandit nào, chạy Pantheon nào, làm Labyrinth nào khi nào, hay lấy notable Reliquarian nào trước. Planner thì giết hết bandit và không ghi gì khác.

          Chuyện notable Reliquarian không phải do chúng tôi làm lười — tên của chúng không được công bố dưới dạng chữ ở bất cứ đâu, như đã nói ở trên.
      - title: Kiếm currency trong 3.30
        body: |
          Vẫn cảnh báo như trên mọi trang starter league này: Abyss, Bestiary, Betrayal, Blight, Breach, Expedition, Incursion, Legion, Ritual và Ultimatum không còn tự xuất hiện trong map nữa. Chúng chỉ tới ở chỗ nào có Thread đặt vào, nên kế hoạch giai đoạn đầu là Thread từ Shaped Region, và đừng bỏ qua quái rare hay boss map.
  - id: getting-the-gem
    image: fireball
    title: Lấy cái gem mới
    levels: Sau Labyrinth
    uses: >-
      [[Fireball of Radiation]] thay cho, hoặc đứng cạnh, [[Fire Trap]] làm skill
      single-target của bạn.
    changes: >-
      **Đây là stage chưa ai viết.** Gem thì mới, planner thì mô phỏng
      [[Fireball]] gốc thay cho nó, và không tồn tại danh sách support gem nào
      cho nó. Phần dưới đây là suy luận từ một câu chính thức duy nhất, và nó
      được ghi rõ là như vậy.
    moveOn: >-
      bạn đã có cái gem và tự quyết được nó có hơn Fire Trap hay không. Không có
      câu trả lời nào được công bố.
    details:
      - title: Gem transfigured lấy bằng cách nào
        body: |
          Skill transfigured ra từ Divine Font ở cuối một lượt Labyrinth: bạn dâng một gem thường và nhận lại một trong các biến thể transfigured của nó. Chúng cũng trade được một khi đã tồn tại.

          **Chúng tôi không tìm được xác nhận điều này cho đúng cái gem đó**, chỉ có cơ chế chung, nên nếu Font không chào nó, câu trả lời sẽ nằm trên trang trade của gem chứ không nằm ở đây.
      - title: Thử support nào trước, và vì sao chúng tôi đang đoán
        body: |
          Skill áp một debuff fire damage over time. Nếu cái debuff đó là một skill effect chứ không phải một ignite, thì mấy support đáng quan tâm là nhóm damage over time chung — [[Efficacy Support]], [[Swift Affliction Support]], [[Elemental Focus Support]], [[Increased Area of Effect Support]] — cộng gem level, vì một degeneration dựa trên gem thì scale theo gem level.

          Còn nếu nó hành xử như một ignite, thì [[Combustion Support]] với [[Unbound Ailments Support]] mới là câu trả lời đúng và cả cây passive chuyển hướng sang ignite damage.

          **Cả hai bộ đều nằm trong file của chính tác giả**, và đó là dấu hiệu rõ nhất hiện có cho thấy anh ta cũng chưa quyết. Hãy thử nó trên một con boss, không phải trên một pack quái: một debuff ngắn mà mạnh đúng là loại thứ trông ổn khi clear rồi làm bạn thất vọng trên một mục tiêu có máu thật.
      - title: Thứ gì sẽ làm build này thất bại
        body: |
          Nói trước để bạn tự kiểm được, thay vì phát hiện ra ở Tier 14:

          - Nếu duration của debuff rất ngắn mà cooldown hay cast time của nó thì không, nó sẽ dở hơn Fire Trap và build không có single target.
          - Nếu debuff không chồng hoặc không làm mới một cách có ích, thì cast đi cast lại chẳng được gì.
          - Nếu mấy notable Reliquarian mới hóa ra không đỡ một caster fire, thì lựa chọn ascendancy là sai kể cả khi skill tốt.

          **Không cái nào trong số này là một vấn đề đã được báo cáo.** Chúng là ba cách mà kế hoạch này có thể sai, liệt kê ra vì không nguồn nào liệt kê.
  - id: beyond
    image: cloak-of-flame
    title: Map và xa hơn
    levels: Chưa được công bố
    uses: >-
      Không biết. Kế hoạch được công bố dừng ở level 69 và không có file thứ hai,
      không có lộ trình gear và không có danh sách endgame.
    changes: >-
      Nếu skill chạy được, mấy bước hợp lý tiếp theo là những bước mà bất kỳ nhân
      vật Righteous Fire nào cũng đi: thêm maximum life, thêm fire resistance
      trên cap, scale ignite hoặc burning trên helmet, và một six-link. **Đó là
      suy luận của chúng tôi từ dòng build này, không phải từ nguồn nào của build
      này.**
    moveOn: "không có gì để đi tới. Bài này sẽ cần viết lại trong vòng một tuần."
    details:
      - title: Vì sao chúng tôi vẫn đăng bài này
        body: |
          Vì hai creator với lượng người xem lớn chỉ vào cùng một skill mới trong cùng một ngày, và vì lựa chọn còn lại — đợi tới khi có ai công bố một build hoàn thiện — để thứ duy nhất thật sự mới của Covens of Umbra không được ghi lại trong đúng cái tuần người ta đang chọn chơi gì.

          Thứ trang này cho bạn là trọn bộ những gì đã biết: một câu chính thức, một planner level 69 mô phỏng một gem khác, một danh sách gem có cả support ignite lẫn support không ignite, hai cây unique rẻ, và một ascendancy với notable chưa được viết xuống. Nếu như vậy là chưa đủ để đem một nhân vật ra cược, thì đó là kết luận đúng để rút ra từ nó.
      - title: Một tuần nữa thì xem ở đâu
        body: |
          Trang của Goratha và của Pohx, cả hai đều link bên dưới, là hai trang sẽ được cập nhật trước nhất. PoEDB sẽ có trang cho cái gem khi dữ liệu được rút ra, và chuyện đó giải quyết câu hỏi duration với base damage trong một lần. Việc Path of Building thêm cái gem vào là thứ sẽ làm bất kỳ planner nào cho build này có ý nghĩa.

patch:
  - entry: new-skills
    note: >-
      **Build này chính là cái patch note.** [[Fireball of Radiation]] là một
      trong hai skill được thêm vào trong 3.30 và là skill duy nhất một người
      chơi đơn dùng được — cái còn lại, [[Arcane Link]], cần một người chơi đồng
      minh. Mô tả chính thức dài một câu và không nguồn nào thêm được gì vào đó.
      Mục changelog của chính chúng tôi nói thẳng rằng chưa ai thử nó; điều đó
      vẫn đúng.
  - entry: reliquarian-luminary
    note: >-
      **Ascendancy bị dựng lại và các notable mới chỉ được công bố dưới dạng
      ảnh.** Patch note nói notable [[Reliquarian]] "have been shuffled" và hiện
      bốn tấm ảnh, nên tên không nằm trong phần chữ và chúng tôi không gõ lại
      được. Mọi guide Reliquarian 3.29 đều viết cho một ascendancy khác. Thay đổi
      [[Luminary]] trong cùng mục đó — [[Golden Glory]] chỉ truyền một nửa Light
      Radius của nó sang buff Mercenary Link — không đụng tới build này.
  - entry: ruthless-changes
    note: >-
      **Không có gì ở đây là chỉ-Ruthless, nhưng hãy kiểm mọi thứ bạn đọc về
      Scion.** Phần Ruthless chỉnh khoảng hai mươi notable ascendancy, trong đó
      có của Ascendant, và các bài viết ngày launch đang in lại mấy cái đó như
      thay đổi chung. Ngược lại, lần xáo Reliquarian thì nằm ở phần của game
      thường và là thật.
  - note: >-
      **Bản thân [[Righteous Fire]] không bị đổi**, và [[Cloak of Flame]],
      [[Immortal Flesh]] hay [[Fire Trap]] cũng vậy, theo như hai lượt đọc patch
      note chính thức và bản tóm tắt của Maxroll cho thấy. Hãy đọc đó là "không
      được nhắc trong các nguồn chúng tôi đọc" chứ không phải đã chứng minh là
      không đổi.
  - entry: item-tiers
    note: >-
      **Hữu ích với một build mặc toàn base rare.** Kế hoạch được công bố có đúng
      hai cây unique; mọi thứ khác là rare. Việc đọc được tier của một món Rare
      ngay trên mặt đất từ Act 6 làm chuyện gom đủ bộ đó dễ hơn.
  - entry: no-random-league-mechanics
    note: >-
      **Đổi kế hoạch kiếm currency giai đoạn đầu của bạn**, như với mọi build
      starter league này. Giờ mười cơ chế chỉ xuất hiện qua Thread.

strengths:
  - "Nó là build duy nhất trên site này dùng một skill mới trong league này, điều đó cũng nghĩa là không ai đi trước bạn."
  - "Kế hoạch được công bố chỉ cần hai cây unique rẻ và không cần món chase nào."
  - "Cái gem không phải món trade: skill transfigured ra từ Labyrinth."
  - "Nửa Righteous Fire của build là một động cơ clear map đã mười năm tuổi và được hiểu rất rõ."
  - "Cả hai creator đang chỉ vào nó đều đáng tin: Pohx về Righteous Fire nói riêng, Goratha về Reliquarian nói riêng."
  - "Lần xáo ascendancy là một lý do thật để nhìn lại Scion league này, chứ không phải một thói quen."
weaknesses:
  - "Không tồn tại con số nào cho main skill. Không một con. Thậm chí không có trang PoEDB."
  - "Path of Building không mô phỏng được nó, nên planner của chính tác giả dùng Fireball gốc thay vào."
  - "Planner dừng ở level 69. Không có kế hoạch nào cho map hay endgame, không một chút."
  - "Notable Reliquarian cho league này chỉ được công bố dưới dạng ảnh, nên chúng tôi không nói được bạn nên lấy cái nào."
  - "Danh sách gem có cả support ignite lẫn support không ignite, nghĩa là tác giả chưa giải quyết câu hỏi cơ bản về cách skill scale."
  - "Không nguồn nào là một guide. Cả hai đều là kế hoạch ngày launch, và một trong hai có tiêu đề kèm dấu hỏi."
  - "Nếu debuff hóa ra yếu, build không có single target và thành một nhân vật Righteous Fire dở hơn."
avoidIf: >-
  Chọn build khác nếu đây là league đầu tiên của bạn, nếu bạn ít thời gian và cần
  nhân vật chạy được, hoặc nếu bạn muốn theo một guide viết sẵn — ở đây không có
  guide nào, cho bất kỳ ai, chưa có. Chọn trang Righteous Fire Chieftain trên
  site này nếu lối chơi Righteous Fire mới là thứ hấp dẫn bạn; đó là cùng một
  động cơ với nhiều năm tài liệu đằng sau. Chỉ tới đây nếu bạn thật sự muốn làm
  một trong những người tìm ra skill mới làm được gì, và bạn thoải mái với việc
  respec hay reroll nếu câu trả lời là "không nhiều".

