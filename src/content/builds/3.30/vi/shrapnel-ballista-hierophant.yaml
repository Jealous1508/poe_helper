name: Shrapnel Ballista Hierophant
tagline: >-
  Build stack Strength, nơi Strength là damage, là block chance, và là số totem
  bạn đặt được. Sinh ra để giết uber boss, không phải để chạy map.
class: Templar
ascendancy: Hierophant
role: endgame
budget: extreme
budgetNote: >-
  **~150 Divine Orb, và con số đó được nêu cho 3.29, không phải 3.30.** Đây là
  budget duy nhất được công bố cho build này, và guide còn đòi bạn có sẵn một
  nhân vật level 94+ chịu đem ra cải tạo. Không có bảng 50 / 300 / mirror ở bất
  cứ đâu; thứ tồn tại là ba file Path of Building ở ba mức trang bị, và các stage
  dưới đây được xếp theo đó. Riêng giá [[Replica Iron Commander]] thì không dùng
  được — mấy trang mirror cùng trích một nguồn báo 2 chaos, 12, và khoảng 2,126,
  tất cả đều ghi bốn tháng trước và từ league sai. Chúng tôi không trích cái nào.
mainSkill: Shrapnel Ballista
image: shrapnel-ballista
hero: art-hierophant
tags: [Bow, Totem, Chaos damage, Strength stacker, Boss killer]
ratings: { clear: 2, bossing: 5, survivability: 4, ease: 3 }
verified: "2026-11-13"
confidence: predicted
confidenceNote: >-
  **Bốn điểm số là cách đọc của ban biên tập. Guide không công bố bảng điểm
  nào cả** — chúng tôi đã kiểm riêng chuyện này. poe-vault chỉ hiện bốn tag (Boss
  Killer, Ranged, High Budget, Extreme Budget) với một widget vote, ngoài ra
  không gì khác. Clear là 2 vì guide chưa bao giờ khẳng định build chạy map tốt,
  chỉ nói nó sống qua được các mod map, còn mục nhược điểm của chính nó nêu tầm
  đánh ngắn hơn các bản thay thế. Bossing là 5 dựa trên thứ nó được quảng cáo cho
  và damage mà các file của nó báo. Survivability là 4 chứ không phải 5 vì khoảng
  2,000 life regeneration mỗi giây là xương sống, mà không nguồn nào nói về map
  không có regeneration. **Và cả cái guide này là một guide 3.29 khoác nhãn
  3.30** — xem mục patch note.
modes:
  ssf: >-
    Không thực tế. Build phải có đủ năm unique cụ thể mới chạy, một trong số đó
    là [[Replica Iron Commander]], và chính guide của nó giả định có kinh tế
    trade cùng một nhân vật level 94+ để cải tạo.
  hardcore: >-
    Không nguồn nào bàn tới. Trên giấy thì phòng thủ xếp lớp khá phù hợp, nhưng
    hồi phục là regeneration mà bạn có thể mất vì một mod map, totem thì chết và
    phải gọi lại giữa trận, và chưa ai thử bất cứ điều nào trong 3.30.

idea: |
  Build này biến Strength thành mọi thứ. [[Replica Alberon's Warpath]] cho bạn chaos damage theo mỗi 80 Strength, [[The Iron Fortress]] cho block chance theo mỗi 50 Strength, và [[Replica Iron Commander]] cho thêm một totem theo mỗi 200 Strength. Vậy là một chỉ số duy nhất trả công cho bạn ba lần.

  Bạn không tự đánh. Bạn đặt totem [[Shrapnel Ballista]], chúng bắn tên vỡ thành nhiều hit mỗi mũi, rồi bạn lùi ra đứng xem. Vì damage là chaos, nó xuyên thẳng qua energy shield của quái.

  [[Crown of Eyes]] là mảnh ghép buộc tất cả lại: nó khiến mọi mod increased spell damage chuyển sang áp cho attack của bạn. Đó là lý do cây cluster jewel bắt buộc phải mua là loại có small passive cho increased spell damage — mỗi cái trở thành attack damage ở mức 150% giá trị.

chain:
  - label: Stack Strength
    text: "[[Astramentis]], [[Helical Ring]], belt Strength, [[Split Personality]], [[Lethal Pride]] và [[Inertia]]. Các file công bố đạt 2,665–3,351 Strength."
  - label: Strength thành damage
    text: "[[Replica Alberon's Warpath]] cộng 1 tới 80 chaos damage vào attack cho mỗi 80 Strength. Ở 2,700 Strength là khoảng 33 lần roll 1–80 cộng vào mỗi hit."
  - label: Strength thành totem
    text: "[[Replica Iron Commander]] cho [[Shrapnel Ballista]] +1 totem tối đa mỗi 200 Strength. Các mốc đáng quan tâm là 1,800, 2,000 và 2,200."
  - label: Spell damage thành attack damage
    text: "[[Crown of Eyes]] khiến increased spell damage áp cho attack ở mức 150%. Nên một [[Large Cluster Jewel]] spell damage chính là một món damage."
  - label: Sống sót
    text: "Hơn 50% block từ Strength, 90% physical damage reduction, và khoảng 2,000 life hồi mỗi giây từ [[Ritual of Awakening]] và [[Fertile Will]] — thứ scale theo số totem."

chainDetails:
  - title: Shrapnel Ballista thực ra làm gì
    body: |
      Nó là một bow gem Dexterity với tag Attack, Projectile, Totem và Bow. Mỗi totem bắn ba mũi tên vỡ ra, nên một lần attack rơi xuống thành nhiều hit.

      Mấy con số định hình build: attack damage là **46–53%** của gốc, attack speed là **50%** của gốc, totem sống **8 giây**, và bản thân gem cho **+2 tới 3 Summoned Ballista Totem tối đa**, lên +4 ở gem level 22. Nó mất tag physical từ 3.25, và đó là lý do không có gì physical trong các link.

      Thời lượng 8 giây chính là lối chơi. Bạn gọi lại totem liên tục, và guide ghi rõ việc totem chết trong một số trận là nhược điểm thật.
  - title: Cuối cùng là bao nhiêu totem
    body: |
      **Không nguồn nào nêu tổng số.** Guide chưa bao giờ in ra con số đó, điều khá lạ với một build mà damage là "mỗi totem nhân N totem".

      Cộng lại những gì guide có nói: 1 gốc, +4 từ gem ở level 22, +1 từ [[Pursuit of Faith]], +1 từ anoint [[Watchtowers]], và thêm một cái mỗi 200 Strength từ bow. Ở 2,712 Strength thì ra khoảng 20. **Phép tính đó là của chúng tôi, không phải của tác giả**, và bạn nên tự kiểm trong Path of Building thay vì tin nó.

      Hai điều rút ra. Thứ nhất, chest cần một corruption cho +1 socketed gem hoặc +2 socketed projectile gem, vì đó là thứ đẩy gem lên level 22 và mở cái totem thứ tư có sẵn. Thứ hai, số totem cũng là một chỉ số phòng thủ — xem phần regeneration bên dưới.
  - title: Vì sao số totem lại là phòng thủ
    body: |
      [[Ritual of Awakening]] cho 3% more damage, 1% life regeneration và 0.5% mana regeneration **mỗi totem**. [[Fertile Will]] cộng 100% increased damage, 3% maximum life hồi mỗi giây và miễn stun khi bạn có một Beast Spectre — cụ thể là Perfect Guardian Turtle, con này còn tặng kèm một aura Determination miễn phí.

      Cộng lại là khoảng 2,000 life mỗi giây trên một nhân vật chỉ có 6,079–6,645 life. Gần như không có phần nào trong sức sống của build này là một bể máu. Nó là block, evasion, suppression, 90% physical damage reduction và regeneration.

      **Rủi ro chưa được kiểm chứng:** lượng regeneration đó, cộng [[Lifetap Support]] trong tới bốn setup gem khác nhau, đáng lẽ phải khiến map no-regeneration rất đau. Guide khẳng định build xử được mọi mod Tier 16 và không bao giờ nhắc tới câu hỏi này. Không nguồn nào xác nhận hay phủ nhận. Hãy coi đó là một rủi ro mở, không phải một kết luận.
  - title: Ba thứ người ta hay hiểu sai về build này
    body: |
      **Nó không dùng [[Artillery Quiver]].** Nó dùng một [[Penetrating Arrow Quiver]] tự craft. Artillery Quiver thuộc về build Explosive Arrow của cùng tác giả. Điều này quan trọng vì cái buff quiver 3.30 mà ai cũng trích rơi vào build *kia*, không phải build này.

      **Không có cặp Forbidden Flesh và Flame, và không có Militant Faith.** Timeless jewel ở đây là [[Lethal Pride]]. [[Headhunter]], Legacy of Fury, Kaom's Spirit và Enlighten cũng không hề xuất hiện trên trang gear.

      **Anoint là [[Watchtowers]], không phải Surveillance.** Một nguồn đối chiếu mô tả Surveillance cho thêm một totem chung chung; cách diễn đạt hiện tại trên PoEDB cho thấy +1 của nó chỉ riêng cho Ballista. Dù sao đi nữa, amulet của build này lấy Watchtowers.
  - title: Các con số, và chính xác chúng giả định gì
    body: |
      Ba file Path of Building được công bố, tất cả đều **level 100 và đều gắn nhãn 3.29**. Cả phần chữ của guide lẫn trang gem đều không in một con số damage nào — mọi số dưới đây đều được đọc ra từ các file.

      | Mức | Damage mỗi giây | Effective hit point | Life | Strength |
      |---|---|---|---|---|
      | Entry, không Mageblood | 40,059,064 | 90,616 | 6,645 | 2,712 |
      | Trung bình, có Mageblood | 34,397,880 | 114,091 | 6,079 | 2,665 |
      | Min-max | 71,803,952 | 118,421 | 6,191 | 3,351 |

      **Đọc chúng kèm luôn cấu hình: 3 frenzy charge, 15 stack Wither, không chọn mục tiêu boss, engine 3.29.** Không có cờ Sirus, Maven hay Uber Elder, không có level quái, không power charge, không shock, không exposure, không resistance của quái, không trạng thái flask và không số totem. Đây không phải con số damage đánh uber boss, và Path of Building chưa cập nhật cho 3.30, nên ngay cả các số phòng thủ cũng là số trước patch.

      Có một kết luận thật rút ra từ cái bảng: mức entry đổi khoảng 24,000 effective hit point để lấy khoảng 5.6 triệu damage so với mức Mageblood. **[[Mageblood]] trong build này là một món mua để phòng thủ, không phải để tăng damage** — tác giả nói nó khiến bạn mất khoảng 200 Strength, tức một totem nguyên, và vẫn đáng mua.

mandatory:
  - term: Replica Iron Commander
    why: >-
      Cho [[Shrapnel Ballista]] +1 totem tối đa mỗi 200 Strength. Không có nó,
      stack Strength không còn là quyết định về số totem và build mất luôn bản
      sắc.
    detail: >-
      Blessed Orb cái implicit. Trang gear nêu 1,800 / 2,000 / 2,200 Strength là
      các mốc; guide chính đặt sàn cứng ở 2,000. Cái sàn đó mới là nguyên tắc mua
      thật sự: mua bất cứ nguồn Strength rẻ nào giúp bạn vượt mốc 200 kế tiếp.
      **Cách đọc đó là của chúng tôi — không nguồn nào nêu nó như lời khuyên.**
  - term: Replica Alberon's Warpath
    why: >-
      Cộng 1 tới 80 chaos damage vào attack mỗi 80 Strength. Đây là nơi damage
      đến từ. Bỏ nó ra thì bạn còn mấy cái totem chẳng làm gì.
    detail: >-
      Nó cũng là lý do build gây chaos, thứ bỏ qua energy shield, và là lý do các
      link là [[Void Manipulation Support]], [[Withering Touch Support]] và
      [[Volatility Support]] thay vì cái gì physical. Bản corrupt vẫn phải đọc
      được ít nhất 1 tới 80 chaos mỗi 80 Strength.
  - term: Crown of Eyes
    why: >-
      Khiến các mod increased và reduced spell damage áp cho attack của bạn ở mức
      150% giá trị. Đó là thứ biến các node spell trên passive tree thành attack
      damage.
    detail: >-
      Multiplier "more" và "less" không chuyển qua — chỉ increased và reduced.
      Chính sự phân biệt đó là lý do base [[Large Cluster Jewel]] bắt buộc là
      loại có small passive cho 10% increased spell damage: mỗi cái thành 15%
      increased attack damage. Cũng nên có một roll accuracy tử tế trên helmet.
  - term: The Iron Fortress
    why: >-
      +1% chance to block attack damage mỗi 50 Strength, cộng tới +120 Strength
      và 80–100% increased armour. Nó là toàn bộ lớp block.
    detail: >-
      Bản thường, **không phải** bản Foulborn, vì bản đó đổi chỗ attack block với
      spell block. Spell block trên chest này là Unlucky, một mặt trái thật sự mà
      bạn phải chấp nhận. Lý tưởng là corrupt được +1 socketed gem hoặc +2
      socketed projectile gem, để [[Shrapnel Ballista]] lên level 22 và mở cái
      totem thứ tư có sẵn.
  - term: Maligaro's Virtuosity
    why: >-
      Đặt critical strike multiplier thành 300%, nên bạn không phải tiêu gì khác
      trong build cho crit multiplier. Một slot thay cả một trục scale.
  - term: Astramentis
    why: >-
      Nền tảng Strength. Blessed Orb cái implicit, hai mươi Intrinsic Catalyst
      lên nó, và anoint [[Watchtowers]] để lấy thêm totem.
  - term: Penetrating Arrow Quiver
    why: >-
      Tự craft, không phải unique. Nó phải có: bow attack bắn thêm một mũi,
      projectile pierce thêm 2 mục tiêu, và Strength tier 1.
    detail: >-
      Đây là slot người ta hay hiểu sai. Nó **không phải** [[Artillery Quiver]],
      bất chấp những gì bạn đọc về buff quiver 3.30. Buff đó là thật và nó áp cho
      build Explosive Arrow của cùng tác giả. Còn chuyện build này có nên chuyển
      các mod tự craft sang base Artillery để lấy một totem miễn phí hay không
      thì **là câu hỏi 3.30 hiển nhiên nhất, và không nguồn nào trả lời.**
  - term: Helical Ring
    why: >-
      Strength tier 1 cộng all attributes tier 1, cả hai cái ring. Bản tiết kiệm
      là một cây rare có fractured +12 tới 16 all attributes.
  - term: Pursuit of Faith
    why: >-
      Điểm ascendancy đầu tiên. Thêm một totem và đặt totem nhanh hơn, và với một
      build totem sống 8 giây thì đó là tiện nghi bạn cần ngay từ đầu.
  - term: Ritual of Awakening
    why: >-
      3% more damage, 1% life regeneration và 0.5% mana regeneration mỗi totem.
      Nó vừa là node damage lớn nhất vừa là nguồn hồi phục của bạn.
  - term: Fertile Will
    why: >-
      100% increased damage, 3% maximum life hồi mỗi giây và miễn stun khi bạn có
      Beast Spectre. Con spectre không phải tùy chọn.
    detail: >-
      Spectre là một Perfect Guardian Turtle, raise bằng [[Raise Spectre]] ở gem
      level 20 trở lên, và nó còn cho bạn một aura Determination miễn phí. Bản
      tiết kiệm là Guardian Turtle thường. Nếu con spectre chết, bạn mất luôn cả
      regeneration lẫn miễn stun.
  - term: Large Cluster Jewel
    why: >-
      Mười hai passive trên base 10% increased Spell Damage, với Strength cao và
      increased effect. Qua [[Crown of Eyes]], từng small passive đó là attack
      damage.
  - term: Watcher's Eye
    level: recommended
    why: >-
      Guide muốn increased chaos resistance khi đang chịu ảnh hưởng
      [[Purity of Elements]]. Các lựa chọn khác nó nêu là evade chance dưới
      [[Grace]], hoặc all maximum elemental resistance dưới Purity of Elements.
  - term: Mageblood
    level: recommended
    why: >-
      Ở đây là món mua để phòng thủ, không phải để tăng damage. Nó khiến bạn mất
      khoảng 200 Strength — một totem nguyên — và trả lại bằng resistance cap,
      movement speed, phasing vĩnh viễn và suppression tốt hơn.
    detail: >-
      Các file công bố chứng minh điều đó: bản Mageblood có damage thấp hơn và
      nhiều hơn khoảng 24,000 effective hit point so với bản entry. Cả hai con số
      đều là số Path of Building 3.29. Đừng trả giá chênh cho bản Foulborn — mod
      của nó là flask bên phải thay vì bên trái, tương đương chứ không tốt hơn.
      Thứ đáng quan tâm là roll 4 flask.
  - term: Lethal Pride
    level: recommended
    why: >-
      Timeless jewel của build này. Strength từ các notable Karui trong bán kính.
      Nhớ là Lethal Pride, không phải Militant Faith, bất kể bạn đọc được gì ở
      nơi khác.
  - term: Simplex Amulet
    level: recommended
    why: >-
      Amulet stack Strength đắt hơn, dùng trong file min-max thay cho
      [[Astramentis]]. Một phần lý do file đó đạt 3,351 Strength.
  - term: Bound by Destiny
    level: recommended
    why: >-
      +15% Strength nếu bạn đang mang hai món có influence Warlord. Chỉ dành cho
      min-max.
  - term: Bottled Faith
    level: recommended
    why: >-
      Thay cây Sulphur flask trong setup không Mageblood, [[Progenesis]] cũng
      thay được. Hết liên quan khi đã có Mageblood.

labs:
  - lab: Normal
    node: Pursuit of Faith
    why: "Thêm một totem và đặt nhanh hơn. Lấy đầu tiên vì totem sống 8 giây thì phải xuống đất cho lẹ."
  - lab: Cruel
    node: Ritual of Awakening
    why: "Damage, life regeneration và mana regeneration mỗi totem. Node biến số totem thành một chỉ số phòng thủ."
  - lab: Merciless
    node: Conviction of Power
    why: "Power charge và endurance charge cho một Hierophant vốn không tự tạo được cái nào."
  - lab: Eternal
    node: Fertile Will
    why: "100% increased damage, 3% maximum life mỗi giây và miễn stun, miễn là Beast Spectre còn sống."

stages:
  - id: transition-in
    image: artillery-quiver
    title: Bước vào
    levels: Từ starter Explosive Arrow, level 94+
    uses: >-
      Totem ballista [[Explosive Arrow]] trên Hierophant, chính là league starter
      của tác giả và là đường dẫn vào mà các guide của anh ta nêu tên. Build đó
      dùng [[Artillery Quiver]] và thật sự được lợi từ buff 3.30.
    changes: >-
      Guide starter nói thẳng: nếu bạn muốn farm uber pinnacle hay map Tier 17,
      hãy chuyển sang Shrapnel Ballista. Mạnh hơn, lối chơi tương tự, đắt hơn rất
      nhiều. Còn guide Shrapnel thì chỉ nói "chuyển từ một build Templar khác".
    links:
      - name: Main skill (starter)
        gems: [Explosive Arrow, Void Manipulation Support, Lifetap Support, Increased Critical Strikes Support]
      - name: Aura
        gems: [Purity of Elements, Grace, Precision, Arrogance Support]
      - name: Utility
        gems: [Dash, Second Wind Support, Steelskin, Automation]
    moveOn: "bạn đã level 94+, có khoảng 150 Divine để tiêu, và đã quyết là mình muốn một con giết boss chứ không phải một con chạy map."
    details:
      - title: Vì sao build này có điều kiện đầu vào
        body: |
          "Không dành cho người mới" là mục duy nhất trong danh sách nhược điểm chính thức của guide. Phần còn lại của cái giá vào cửa thì rất thực tế: bạn cần một nhân vật level 94+ để cải tạo, và bạn cần currency để mua năm món unique trước khi bất cứ thứ gì hoạt động.

          Không có phiên bản nào của build này chạy được với gear nửa vời. Không [[Replica Alberon's Warpath]] thì không có damage; không [[Replica Iron Commander]] thì không có lý do stack Strength; không [[Crown of Eyes]] thì cái cây chẳng làm gì.
      - title: Câu hỏi về quiver mà chưa ai trả lời
        body: |
          3.30 đổi implicit của [[Artillery Quiver]] thành +1 maximum summoned totem cho attack skill, và những bản đã tồn tại thì không được cập nhật, nên bạn cần mua cây mới.

          Chuyện này quan trọng với cái starter bạn đang rời đi, vì nó coi Artillery Quiver tự craft là best in slot. Nhưng nó **không** vươn tới build bạn đang chuyển sang, vì build đó dùng [[Penetrating Arrow Quiver]] tự craft để lấy thêm mũi tên và pierce.

          Còn chuyện build Shrapnel có nên dời các mod tự craft sang base Artillery để lấy totem miễn phí hay không là suy đoán của chúng tôi. Guide chưa được cập nhật để xét chuyện đó.
  - id: entry
    image: replica-iron-commander
    title: Mức entry
    levels: ~150 Divine, số của 3.29
    uses: >-
      [[Replica Iron Commander]], [[Crown of Eyes]], [[The Iron Fortress]],
      [[Maligaro's Virtuosity]], [[Replica Alberon's Warpath]],
      [[Astramentis]] và một [[Penetrating Arrow Quiver]] tự craft. Bên dưới là
      [[Heavy Belt]] rare với cặp [[Helical Ring]].
    changes: >-
      Tất cả cùng một lúc, vì không món nào chạy một mình. Path of Building cho
      mức này báo **40,059,064 damage mỗi giây và 90,616 effective hit point** ở
      2,712 Strength — engine 3.29, 3 frenzy charge, 15 stack Wither, không chọn
      mục tiêu boss.
    links:
      - name: Main skill (chest)
        gems: [Shrapnel Ballista, Void Manipulation Support, Withering Touch Support, Volatility Support, Increased Critical Strikes Support, Lifetap Support]
      - name: Bow
        gems: [Automation, Lifetap Support, Steelskin, Blood Rage, Convocation, Despair]
      - name: Helm
        gems: [Purity of Elements, Grace, Lifetap Support, Frenzy]
      - name: Gloves
        gems: [Arrogance Support, Precision, Raise Spectre]
      - name: Boots
        gems: [Dash, Second Wind Support, Lifetap Support]
    moveOn: "bạn đã qua 2,000 Strength, Beast Spectre là một con Guardian Turtle, và bạn clear được Simulacrum."
    details:
      - title: Flask khi chưa có Mageblood
        body: |
          [[Life Flask]] — bắt buộc có miễn Corrupted Blood và Instant Recovery. Rồi [[Diamond Flask]], [[Quartz Flask]], [[Quicksilver Flask]] và [[Sulphur Flask]].

          Tất cả 20% quality. Đặt mấy cây utility sang "Used When Charges Reach Full" rồi đừng nghĩ tới chúng nữa. [[Bottled Faith]] hoặc [[Progenesis]] có thể thay cây Sulphur khi bạn mua nổi.
      - title: Mấy viên jewel mà trang gear gọi là lõi
        body: |
          [[Rain of Splinters]] cho +2 projectile, [[The Light of Meaning]] cho chaos resistance, [[Emperor's Mastery]], [[Lethal Pride]], hai viên [[Split Personality]], [[Inertia]] đặt gần Elemental Equilibrium, một medium cluster với [[Sleepless Sentries]] cho Onslaught vĩnh viễn, và cây [[Large Cluster Jewel]] spell damage mười hai passive.

          Các phương án tiết kiệm mà trang gear đưa ra, theo thứ tự: một viên rare có Strength, life và resistance hoặc Emperor's Might trước khi lên [[Emperor's Mastery]]; Guardian Turtle thường trước bản Perfect; Enhance trước cái support cooldown recovery.
      - title: Tránh four-link ở gloves và helm
        body: |
          Guide cảnh báo riêng về chuyện này. Setup aura với spectre cần đủ socket, và một cây four-link buộc bạn bỏ đi một thứ đang gánh reservation hoặc đang gánh Beast Spectre.
  - id: mageblood
    image: mageblood
    title: Budget trung bình
    levels: Bước đổi sang Mageblood
    uses: >-
      [[Mageblood]] với roll 4 flask, [[Kalandra's Touch]], và cả dàn flask dựng
      lại quanh utility flask magic.
    changes: >-
      Bạn mất khoảng 200 Strength — một totem nguyên — và nhận lại resistance
      cap, movement speed, phasing vĩnh viễn với suppression tốt hơn. File công
      bố cho mức này đọc ra **34,397,880 damage mỗi giây và 114,091 effective hit
      point**: damage thấp hơn, nhiều hơn 24,000 effective hit point. Vẫn kèm
      nguyên mấy lưu ý 3.29.
    links:
      - name: Main skill (chest)
        gems: [Shrapnel Ballista, Void Manipulation Support, Withering Touch Support, Volatility Support, Increased Critical Strikes Support, Lifetap Support]
      - name: Bow
        gems: [Automation, Lifetap Support, Steelskin, Blood Rage, Convocation, Despair]
      - name: Helm
        gems: [Purity of Elements, Grace, Lifetap Support, Frenzy]
      - name: Gloves
        gems: [Arrogance Support, Precision, Raise Spectre]
    moveOn: "resistance đã overcap 40–50% và bạn đang farm uber chứ không còn đang học chúng."
    details:
      - title: Mageblood là món mua để phòng thủ
        body: |
          Đây là cái trade-off thật sự thú vị duy nhất trong build, và tác giả nói rất thẳng: đổi sang Mageblood khiến bạn mất một totem, và vẫn là lựa chọn đúng.

          Nên hãy mua nó khi vấn đề của bạn là chết, không phải khi vấn đề của bạn là damage. Nếu bạn đang giết boss và sống tốt, thì [[Simplex Amulet]] cùng thêm Strength là chỗ tiêu 200 Divine tốt hơn.
      - title: Flask cho Mageblood
        body: |
          [[Life Flask]] (Divine), rồi Topaz, Sapphire, Quicksilver và Ruby. Mỗi cây muốn enchantment 70% increased effect, suffix lo armour, crit, evasion hoặc additional elemental resistance during effect, và prefix 25% increased effect.

          **Đừng trả giá chênh cho Mageblood Foulborn.** Mod của nó là flask bên phải thay vì bên trái — cùng một chuyện, diễn đạt khác đi. Roll đáng quan tâm là 4 flask, mà mấy bản Foulborn đội giá khoảng 18 Divine ở giá 3.29 để đổi lấy con số không.
  - id: min-max
    image: simplex-amulet
    title: Min-max
    levels: 3,351 Strength
    uses: >-
      [[Simplex Amulet]] thay cho [[Astramentis]], [[Kalandra's Touch]],
      [[Bound by Destiny]], và corruption trên gloves, helmet, boots cùng chest.
    changes: >-
      Strength đi từ khoảng 2,665 lên 3,351, tức thêm ba totem và rất nhiều chaos
      damage nữa. File công bố báo **71,803,952 damage mỗi giây và 118,421
      effective hit point** — con số cao nhất trong ba file, với đúng những phần
      cấu hình còn thiếu như trên.
    links:
      - name: Main skill (chest)
        gems: [Shrapnel Ballista, Void Manipulation Support, Withering Touch Support, Volatility Support, Increased Critical Strikes Support, Lifetap Support]
      - name: Bow
        gems: [Automation, Lifetap Support, Steelskin, Blood Rage, Convocation, Despair]
    moveOn: "không còn stage nào nữa. Không nguồn nào mô tả bất cứ thứ gì xa hơn file này."
    details:
      - title: File min-max thực sự báo gì
        body: |
          14,437 armour, 11,156 evasion, 64% evade chance, 100% hit chance. Cú hit lớn nhất chịu được: 13,262 physical, 58,451 fire, 58,451 cold, 65,327 lightning, 21,566 chaos. Resistance nhân vật 84/84/86 với 59% chaos.

          Mỗi con số trong đó được tính trên engine 3.29 và **không có mục tiêu boss nào**. Không ai mô tả mức mirror cho build này, nên file này là đỉnh của cái thang đã được công bố.
      - title: Mấy cái corruption đáng đuổi theo
        body: |
          Corruption trên chest là cái đáng tiền: +1 socketed gem hoặc +2 socketed projectile gem đưa [[Shrapnel Ballista]] lên level 22 và cho bạn cái totem thứ tư có sẵn. [[Maligaro's Virtuosity]], [[Crown of Eyes]] và [[Replica Alberon's Warpath]] đều có những kết quả corruption mà trang gear ghi là đáng thử, nhưng một cây Alberon's đã corrupt vẫn phải đọc được ít nhất 1 tới 80 chaos mỗi 80 Strength, không thì là rác.
      - title: Không có awakened gem
        body: |
          Trang gem không liệt kê cái nào cả. Đó là lỗ hổng của guide chứ không phải bằng chứng rằng chúng vô dụng, nhưng nó có nghĩa là chưa ai công bố một bản awakened của link này đáng giá bao nhiêu. Đừng mặc định mấy nâng cấp thường lệ sẽ áp dụng được.

powerCurve: |
  Damage ở đây là damage mỗi totem nhân với số totem, và Strength nằm ở cả hai vế của phép nhân đó. [[Replica Alberon's Warpath]] biến mỗi 80 Strength thành chaos damage cộng vào từng hit; [[Replica Iron Commander]] biến mỗi 200 Strength thành thêm một totem; rồi [[Ritual of Awakening]] trả thêm 3% more damage mỗi totem lên trên nữa. Cũng chính hai con số đó là phòng thủ: [[The Iron Fortress]] biến Strength thành block, và mỗi totem là 1% life regeneration.

  Đường cong này không có khúc đầu. Không món nào chạy một mình — không boots thì không damage; không bow thì không có lý do stack Strength; không [[Crown of Eyes]] thì cái cây chẳng làm gì — nên nhân vật đi từ không hoạt động tới mức entry trong đúng một lần mua. File entry báo khoảng 40 triệu damage mỗi giây ở 2,712 Strength. Đó là số của 3.29 với 3 frenzy charge, 15 stack Wither và không chọn mục tiêu boss.

  Sau đó sức mạnh tới theo từng cục, và đây là cách chúng tôi đọc lý do. Một điểm Strength thêm một chút chaos damage, nhưng một totem thì chỉ tới ở mỗi mốc 200, mà một totem vừa là damage, vừa là một stack Ritual of Awakening, vừa là regeneration. Nên nâng cấp cho cảm giác không có gì, không có gì, rồi nhảy một phát. Đó cũng là lý do [[Mageblood]] là một bước đi ngang: mất khoảng 200 Strength, một totem nguyên, đổi lấy khoảng 24,000 effective hit point nữa trong các file công bố.

  Đỉnh của cái thang đã công bố là file min-max ở 3,351 Strength: thêm ba totem và khoảng 72 triệu, với đúng những phần cấu hình còn thiếu như trên. Thứ không bao giờ khá lên là clear. Totem sống 8 giây, tầm đánh ngắn hơn các build ballista khác, và guide chưa bao giờ nói nó chạy map tốt.

upgrades:
  - step: "Cả bộ entry cùng một lúc: [[Replica Iron Commander]], [[Replica Alberon's Warpath]], [[Crown of Eyes]], [[The Iron Fortress]], [[Maligaro's Virtuosity]], [[Astramentis]] với anoint [[Watchtowers]], một [[Penetrating Arrow Quiver]] tự craft và cây [[Large Cluster Jewel]] spell damage mười hai passive"
    cost: "3.29: khoảng 150 Divine cho mức entry — budget duy nhất được công bố"
    why: >-
      Nó đứng đầu vì bên trong nó không có thứ tự nào: không món nào chạy một
      mình. Đôi boots là damage, cây bow là số totem, cái helmet làm cho cái
      cây có tác dụng, cái chest là block. Mua một nửa là không mua được gì.
      Chừa thêm tiền cho cây quiver: trong 3.30, craft "Prefixes cannot be
      changed" của nó tốn 4 Divine cộng 4 Blessed.
  - step: "Strength lên tới mốc 200 kế tiếp: qua 2,000, rồi 2,200"
    why: >-
      Guide đặt sàn cứng ở 2,000 Strength và nêu 1,800, 2,000 với 2,200 là các
      mốc. Mỗi mốc là một totem, mà một totem là damage, là 3% more damage trên
      mọi totem còn lại, và là 1% life regeneration. Còn nguyên tắc mua — lấy
      bất cứ nguồn Strength rẻ nào giúp bạn vượt mốc 200 kế tiếp — là cách đọc
      của chúng tôi; không nguồn nào nêu nó như lời khuyên.
  - step: "Một cây [[The Iron Fortress]] corrupt có +1 socketed gems hoặc +2 socketed projectile gems"
    why: >-
      Nó đưa [[Shrapnel Ballista]] lên level 22, thứ mở cái totem thứ tư có
      sẵn của gem. Bài viết gọi đây là corruption đáng tiền. Chúng tôi đặt nó
      ngay sau cái sàn Strength vì đó là một totem bạn không lấy được bằng
      Strength với bất cứ giá nào; còn xét theo chi phí thì nó rơi vào đâu,
      chúng tôi không nói được, vì không gì định giá nó.
  - step: "Gỡ các phương án tiết kiệm: [[Emperor's Mastery]], rồi một con Perfect Guardian Turtle, rồi cái support cooldown recovery thay cho Enhance"
    why: >-
      Đó là thứ tự của chính trang gear. Con turtle bản Perfect thêm một aura
      Determination miễn phí vào phần regeneration với miễn stun mà
      [[Fertile Will]] vốn đã cho qua con thường. Mấy món này nằm dưới các
      bước về totem vì không món nào trong đó thêm được một totem.
  - step: "[[Mageblood]] với roll 4 flask — nếu vấn đề của bạn là chết"
    why: >-
      Một món mua để phòng thủ, không phải để tăng damage: resistance cap,
      movement speed, phasing vĩnh viễn và suppression tốt hơn, đổi lấy khoảng
      200 Strength. Các file công bố cho thấy damage thấp hơn và nhiều hơn
      khoảng 24,000 effective hit point. Đừng trả thêm cho một bản Foulborn; ở
      giá 3.29 thì đó là khoảng 18 Divine cho một mod tương đương.
  - step: "[[Simplex Amulet]] và thêm Strength — nếu vấn đề của bạn là damage"
    why: >-
      Bài viết nói thẳng về lựa chọn này: nếu bạn đang giết boss và sống tốt,
      thì đây là chỗ tiêu cùng số tiền đó tốt hơn Mageblood. Nó thay
      Astramentis và là một phần lý do file min-max đạt 3,351 Strength.
  - step: "[[Kalandra's Touch]], [[Bound by Destiny]], và corruption trên gloves, helmet với boots"
    why: >-
      Chặng Strength cuối cùng. Bound by Destiny là +15% Strength khi bạn đang
      mang hai món có influence Warlord. Cùng với cây amulet, chỗ này là thêm
      ba totem trong file công bố. Nó nằm cuối vì đây là chỗ tốn nhiều
      currency nhất cho mỗi totem trong danh sách — nhận định của chúng tôi,
      vì không nguồn nào định giá món nào trong đó. Một cây Alberon's đã
      corrupt vẫn phải đọc được ít nhất 1 tới 80 chaos mỗi 80 Strength.

play:
  mapping: |
    1. Đặt totem [[Shrapnel Ballista]] rồi lùi ra. Chúng lo toàn bộ damage.
    2. Đặt lại. Chúng sống 8 giây, nên bạn gọi lại suốt, và tầm đánh của chúng ngắn hơn các build ballista khác — bạn đặt gần hơn và thường xuyên hơn mức bạn tưởng.
    3. Di chuyển bằng [[Dash]].
    4. Phần còn lại cứ để yên. [[Steelskin]] với [[Blood Rage]] nằm trên [[Automation]] trong cây bow, và mấy cây utility flask tự dùng khi đầy.

    Hai lỗ hổng chúng tôi không che. [[Despair]] và [[Frenzy]] có trong các link, mà bài viết không ghi cái nào được kích bằng cách nào. Và map Tier 17 với Tier 16.5 cần một bộ filter mod mà guide không cung cấp.
  bossing: |
    Nút bấm thì vẫn vậy. Thứ đổi là chuyện giữ totem trên sân trở thành toàn bộ công việc.

    1. Kiểm Beast Spectre còn sống trước khi vào. [[Fertile Will]] không cho gì nếu thiếu nó.
    2. Đặt totem, rồi đặt lại trước khi chúng hết giờ chứ không phải sau. Guide ghi việc totem chết trong một số trận là nhược điểm thật.
    3. Coi số totem là thanh máu của bạn chứ không chỉ là damage. Mỗi totem là 1% life regeneration từ [[Ritual of Awakening]], nên một trận dọn sạch totem của bạn cũng cắt luôn phần hồi phục. Mối liên hệ đó là cách chúng tôi đọc cái node, không phải điều guide nói về chuyện đánh boss.
    4. Tránh những gì bạn thấy trước được. Block, evasion và suppression đều là xác suất.

    Damage được công bố giả định 15 stack Wither. [[Withering Touch Support]] nằm trong main link, nên chúng tôi hiểu là mấy giây mở đầu trận yếu hơn con số đó; không nguồn nào nói các stack mất bao lâu để đầy.

deaths:
  - situation: "Beast Spectre chết giữa trận"
    cause: >-
      Bài viết nêu rõ cơ chế: nếu con spectre chết, bạn mất luôn cả
      regeneration lẫn miễn stun, vì [[Fertile Will]] chỉ chạy khi bạn có một
      Beast Spectre. Còn chuyện đây là một kiểu chết thường gặp là suy luận
      của chúng tôi; không nguồn nào thuật lại build này chết thế nào.
    fix: >-
      [[Raise Spectre]] ở gem level 20 trở lên, và kiểm con turtle trước mỗi
      con boss. [[Convocation]] nằm trong link của cây bow; chúng tôi hiểu là
      nó ở đó để giữ con spectre bên cạnh bạn.
  - situation: "Totem của bạn mất hết và máu thôi hồi lại"
    cause: >-
      Suy luận của chúng tôi từ chữ trên node. Regeneration của
      [[Ritual of Awakening]] tính theo từng totem, totem sống 8 giây và chết
      trong một số trận, mà gần như không phần nào trong sức sống của build
      này là một bể máu: khoảng 2,000 life mỗi giây trên hơn 6,000 life một
      chút.
    fix: >-
      Gọi lại sớm, đừng gọi lại muộn. Placement speed của
      [[Pursuit of Faith]] là thứ làm được chuyện đó; hãy coi một cái sân
      trống là tình huống khẩn cấp, không phải một khoảng trống damage.
  - situation: "Một map không có regeneration"
    cause: >-
      Một rủi ro mở, không phải một kết luận. Regeneration là xương sống và
      [[Lifetap Support]] nằm trong tới bốn setup khác nhau, nên mod này đáng
      lẽ phải rất đau. Guide khẳng định build xử được mọi mod Tier 16 và
      không bao giờ nhắc tới nó. Không nguồn nào xác nhận hay phủ nhận.
    fix: >-
      Cho tới khi có người thử nó trong 3.30, hãy bỏ qua mod này. Chúng tôi
      không có câu trả lời đo đạc nào để đưa bạn.

troubleshooting:
  - symptom: "Bạn có ít totem hơn mức bạn tưởng"
    cause: >-
      Không nguồn nào nêu tổng số, nên hãy kiểm từng nguồn góp: Strength so
      với mốc 200 kế tiếp trên [[Replica Iron Commander]], gem ở level 22 để
      có cái totem thứ tư có sẵn, [[Pursuit of Faith]], và anoint
      [[Watchtowers]] — không phải Surveillance. Phép cộng của chính chúng
      tôi ra khoảng 20 ở 2,712 Strength.
    fix: >-
      Đếm chúng trong Path of Building thay vì tin phép tính của chúng tôi,
      rồi mua nguồn Strength rẻ nhất giúp bạn vượt mốc 200 kế tiếp.
  - symptom: "Totem bắn mà gần như không gì chết"
    cause: >-
      Một trong các mảnh làm nên damage đang thiếu hoặc sai. Một cây
      [[Replica Alberon's Warpath]] đã corrupt mà không còn đọc được ít nhất
      1 tới 80 chaos mỗi 80 Strength thì là rác. Và [[Crown of Eyes]] chỉ
      chuyển qua phần increased, nên cây [[Large Cluster Jewel]] phải là base
      có small passive cho 10% increased spell damage.
    fix: >-
      Đọc dòng chaos trên đôi boots và base của cây cluster trước mọi thứ
      khác. Không có phiên bản nào của build này chạy được với gear nửa vời.
  - symptom: "Attack block thấp hơn hẳn của guide"
    cause: >-
      Bạn đang mặc cây [[The Iron Fortress]] bản Foulborn, bản đó đổi chỗ
      attack block với spell block. Hoặc Strength của bạn thấp hơn của file:
      cái chest cho 1% attack block mỗi 50 Strength.
    fix: >-
      Bản thường của cái chest. Spell block trên nó thì kiểu nào cũng là
      Unlucky; mặt trái đó đi kèm với món đồ.
  - symptom: "Con số Path of Building của bạn thấp hơn hẳn con số được công bố"
    cause: >-
      Các file công bố được cấu hình với 3 frenzy charge và 15 stack Wither,
      ở level 100, trên engine 3.29, không chọn mục tiêu boss. Chúng không
      phải số đánh boss, và cũng chưa phải số của bạn cho tới khi cấu hình
      của bạn khớp.
    fix: >-
      Chỉnh cấu hình cho khớp trước khi so, rồi so Strength: ba file nằm ở
      2,712, 2,665 và 3,351.
  - symptom: "Bạn mua Mageblood và damage tụt xuống"
    cause: >-
      Đó là cái trade-off chạy đúng như mô tả. Nó khiến bạn mất khoảng 200
      Strength, tức một totem nguyên; file Mageblood được công bố có damage
      thấp hơn file entry và nhiều hơn khoảng 24,000 effective hit point.
    fix: >-
      Không có gì hỏng cả. Nếu vấn đề của bạn là damage, thì câu trả lời của
      bài viết là [[Simplex Amulet]] cùng thêm Strength.
  - symptom: "Craft cây quiver tốn hơn hẳn mức guide ngụ ý"
    cause: >-
      3.30 đổi phần crafting mà guide được viết dựa vào. Recipe meta-modifier
      chuyển sang Nightmare Map, và "Prefixes cannot be changed" trên giáp
      với quiver giờ tốn 4 Divine cộng 4 Blessed — đúng cái craft mà
      [[Penetrating Arrow Quiver]] cần.
    fix: >-
      Chừa tiền cho nó, hoặc mua một cây quiver làm sẵn. Nó phải có bắn thêm
      một mũi, pierce thêm 2 mục tiêu và Strength tier 1.

patch:
  - note: >-
      **Lưu ý lớn nhất: đây là một guide 3.29 khoác nhãn 3.30.** Trang được ghi
      ngày trước hôm launch, phần chữ của nó nói là dành cho "patch 3.29 hiện
      tại", mọi Path of Building kèm theo đều ghi 3.29, và video nó hứa là video
      3.29. **Không trang con nào trong bốn trang của nó nhắc tới một thay đổi
      3.30 nào.** Hãy đọc mọi con số ở đây như số của 3.29.
  - note: >-
      **Cái buff quiver ai cũng trích không vươn tới build này.** Implicit của
      [[Artillery Quiver]] giờ là +1 maximum summoned totem cho attack skill —
      nhưng build này đeo [[Penetrating Arrow Quiver]] tự craft. Buff đó rơi vào
      cái starter Explosive Arrow mà bạn *rời đi*.
  - entry: meta-crafting-costs
    note: >-
      **Cái này thì trúng thẳng, và trúng theo hướng xấu.** Recipe meta-modifier
      chuyển sang Nightmare Map, chặn một build mà craft belt, quiver và ring đều
      dùng tới chúng. "Prefixes cannot be changed" trên giáp và quiver giờ tốn 4
      Divine cộng 4 Blessed, mà đó đúng là craft quiver bắt buộc. Recombinator
      lấy item level của input được chọn và không chạm được vào item đã corrupt,
      còn Rog giờ cho 1, 3 hoặc 5 lần reroll thay vì 3, 6 hoặc 10.
  - entry: ruthless-changes
    note: >-
      **Bỏ qua mọi bài nói Hierophant được buff.** Mọi thay đổi Hierophant trong
      3.30 — totem duration của [[Pursuit of Faith]], [[Arcane Blessing]] cho 8%
      more spell damage, bản làm lại của Illuminated Devotion — đều nằm ở phần
      riêng của Ruthless và không áp dụng cho game thường. Không nguồn nào chúng
      tôi đọc mắc lỗi này với build này, nhưng đó là sai sót bạn dễ gặp nhất ở
      nơi khác.
  - note: >-
      **Game thường không có thay đổi nào về ballista và không có thay đổi nào về
      totem.** [[Shrapnel Ballista]] nguyên vẹn.
  - note: >-
      **Tổng kết: trung tính tới hơi xấu.** Không buff nào vươn tới build, mà tự
      craft ở hai slot bắt buộc thì tốn hơn đáng kể.

strengths:
  - "Sinh ra cho một việc và làm tốt việc đó: uber boss, Simulacrum, map Tier 17 và Tier 16.5."
  - "Phòng thủ xếp lớp: hơn 50% block, hơn 60% evade, 90% physical damage reduction, suppression cao, miễn ailment, khoảng 2,000 life mỗi giây."
  - "Lối chơi nhẹ đầu. Totem giết; bạn đặt và dời chúng."
  - "Chaos damage xuyên hoàn toàn qua energy shield của quái."
  - "Theo guide thì xử được mọi mod map Tier 16 và mọi mod altar của Eater of Worlds."
  - "Chỉ cần đi chợ một chỉ số. Mọi nguồn Strength rẻ đều là nâng cấp."
weaknesses:
  - "Tầm đánh ngắn hơn bản Siege Ballista và Explosive Arrow. Đây là cái giá cho việc chạy map, và guide chưa bao giờ nói nó chạy map tốt."
  - "Totem sống 8 giây và chết trong một số trận. Bạn gọi lại liên tục."
  - "Nói thẳng là không dành cho người mới, theo chính danh sách nhược điểm của guide."
  - "Cần có sẵn nhân vật level 94+ và khoảng 150 Divine, con số được nêu cho 3.29."
  - "Tier 17 và Tier 16.5 cần một bộ filter mod map, mà guide không cung cấp."
  - "Sức sống dựa vào regeneration. Map no-regeneration lẽ ra phải rất đau, mà không nguồn nào nói tới."
  - "Mọi con số được công bố đều từ Path of Building 3.29 và không cấu hình mục tiêu boss nào."
avoidIf: >-
  Chọn build khác nếu bạn muốn clear map nhanh — hãy mua bản Siege Ballista hoặc
  Explosive Arrow của cùng bộ khung. Bỏ qua nếu đây là nhân vật thứ nhất hay thứ
  hai của bạn, nếu bạn chưa có sẵn một Templar level 94+ để cải tạo, hoặc nếu
  bạn không dư khoảng 150 Divine. Cũng bỏ qua nếu bạn không thích build mà nhân
  vật bạn điều khiển không gây damage: toàn bộ việc bạn làm là đặt và dời totem.
  Và nếu bạn muốn một build đã được kiểm chứng cho 3.30, thì đây không phải nó —
  guide chưa được sửa lại từ sau patch.

