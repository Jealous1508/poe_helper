        gems: [Rallying Cry, Frostblink, Flesh and Stone, Tempest Shield]
      - name: Di chuyển
        gems: [Shield Charge, Faster Attacks Support, Blood Rage]
      - name: Skill của chính Mercenary
        gems: [Rallying Cry, Pride, Vulnerability]
    moveOn: "bạn giết pinnacle boss và muốn nhiều hơn mức build cần."
    details:
      - title: Từng món của Mercenary làm gì
        body: |
          - **[[Kaom's Binding]].** Guide so nó với việc nhận 25% physical hit damage thành fire, kèm một điểm khác: nó đổi cách quái gần đó convert damage của chúng, nên nó mạnh hơn khi gặp quái vốn đã convert. "Gần đó" là 6 mét. Nó bảo vệ cả hai.
          - **[[Deidbell]] Foulborn.** Warcry buff effect và warcry cooldown recovery, "some of the most important Modifiers for your Mercenary", thuộc hàng mod quan trọng nhất cho Mercenary của bạn. Buff effect nâng thẳng con số 24%. Nếu bản đôi quá đắt, lấy bản có cooldown recovery.
          - **[[Shaper's Seed]].** 4% life regenerate mỗi giây cho cả hai. Với một implicit "additional curse", nó còn áp được [[Vulnerability]] qua một cái ring.

          Mỗi ô unique tốn một điểm ascendancy. Trang endgame của planner tiêu bốn điểm — Amulets, Belts, Gloves và Helmets — và bỏ [[Bestowed Knighthood]] để trả cho chúng. Hai cái ring không còn cần nữa, và [[Breathstealer]] có thể corrupt thành đồ rare, nhờ đó giải phóng lại Legendary Gloves.
      - title: Một khoản lợi tưởng có mà 3.30 đã bỏ
        body: |
          FAQ nói Eldritch implicit "when in Presence of a Pinnacle Atlas Boss" lúc nào cũng bật trên Mercenary, vì người chơi được tính là một con như vậy.

          3.30 sửa chuyện đó như một bug. Changelog ngày 11/11 của chính guide nói phần nhắc tới nó đã bị bỏ; câu trong FAQ thì vẫn còn đó. Roll implicit thường trên gear của nó.
      - title: Jewel của bạn, theo thứ tự của guide
        body: |
          1. [[Runegraft of the Warp]], trước mọi thứ khác.
          2. Một large cluster có Furious và Iron Breaker; cluster rẻ hơn chỉ có một notable Mob Mentality cũng chạy được.
          3. [[The Light of Meaning]], rồi [[Unnatural Instinct]] bên cạnh nó.
          4. [[Stormshroud]], cho bạn đổi Pantheon từ Soul of the Brine King sang Soul of Lunaris.

          Trên jewel rare: attack speed khi cầm shield, rồi life. Bạn cần ba dòng cụ thể nằm đâu đó trên chúng — reduced effect of curses on you, physical attack damage leeched as mana, và 3% mana reservation efficiency.
      - title: Nên chờ đợi con số nào
        body: |
          Một con số, từ FAQ của tác giả: "Even without Echoes of Creation you can easily hit >20m DPS as Pure Physical Non-Crit without Ramp." Tức là không cần Echoes of Creation vẫn dễ dàng vượt 20 triệu DPS, thuần physical, không crit, không cần ramp.

          Đó là một phát biểu 3.29 và chúng tôi không tái lập được: planner khó mà cho thấy damage đến qua buff của một nhân vật khác. Guide không công bố con số effective hit point nào cả.
  - id: echoes
    phase: endgame
    image: resolute-technique
    title: "Echoes of Creation: bản hoàn chỉnh"
    levels: Uber boss trở lên
    uses: >-
      [[Echoes of Creation]], một cây Royal Plate có càng nhiều flat physical
      damage reduction càng tốt, một viên [[Glorious Vanity]] để lấy
      [[Corrupted Soul]], và [[Divine Shield]].
    changes: >-
      Giờ mỗi đòn đánh đều làm đau bạn trước. Đủ armour thì chuyện đó thành
      một nguồn energy shield regeneration, và bonus damage của cái helmet
      stack một lần cho mỗi warcry.
    links:
      - name: Main skill
        gems: [Earthshatter, Overexertion Support, Fortify Support, Brutality Support, Fist of War Support, Pulverise Support]
      - name: Warcry tự động
        gems: [Intimidating Cry, Autoexertion, Infernal Cry, Living Lightning Support]
      - name: Thêm warcry và curse
        gems: [Autoexertion, Battlemage's Cry, Seismic Cry, Punishment]
      - name: Buff
        gems: [Rallying Cry, Frostblink, Flesh and Stone]
      - name: Di chuyển
        gems: [Shield Charge, Faster Attacks Support, Blood Rage]
    moveOn: "không còn stage nào nữa."
    details:
      - title: Cú tự đánh mình, theo con số của tác giả
        body: |
          [[Echoes of Creation]]: "When you Attack, take 15–20% of Life as Physical Damage for each Warcry Exerting the Attack", và "Skills deal 10–15% more Damage for each Warcry Exerting them".

          Tác giả đếm khoảng 4.5 warcry exert mỗi cú slam và tính với 5. Ở roll tốt nhất, đó là 75% life của bạn thành physical damage mỗi đòn đánh — khoảng 4,700 trên nhân vật của anh — đổi lấy 75% more damage. Bạn đánh hơn hai lần mỗi giây.

          Armour, flat physical damage reduction, [[Flesh and Stone]] và Fortification đều áp vào nó. Kết quả của anh: "instead of 4,700 damage you actually end up taking something in the realm of 150–300" — thay vì 4,700 damage, thực tế bạn ăn đâu đó quanh 150–300.

          Flat reduction là phần quan trọng nhất, vì nó được cộng sau armour. Ví dụ của anh: đi từ 80% lên 90% là cắt một nửa phần lọt qua. Vì vậy mới là Royal Plate.
      - title: Damage biến thành hồi phục thế nào
        body: |
          [[Glorious Vanity]] mang tên Doryani cho [[Corrupted Soul]]: khoảng 1,000 energy shield, và damage nhận vào được chia giữa life và energy shield.

          [[Divine Shield]] regenerate energy shield dựa trên physical damage bạn đã chặn được. Giảm một cú 4,700 xuống còn 200 được tính là chặn 4,500. Ước tính của tác giả là 600–1,000 energy shield mỗi giây từ đòn đánh của chính bạn.

          Anh kèm một lời rào trước và chúng tôi cũng vậy: con số chính xác tùy vào gear của bạn.
      - title: Ưu tiên trên helmet và chest
        body: |
          Trên [[Echoes of Creation]], dòng tự gây damage trước — càng gần 15% càng tốt trong tầm bạn tìm được — rồi tới dòng damage.

          Royal Plate cần 297 Strength. Cây được dựng quanh một enchant "40% reduced Attribute Requirements" trên nó, từ Tailoring Orb hoặc Heist Blueprint, để mấy node Strength chuyển được thành tattoo. Không có enchant thì FAQ đưa một bản cây dự phòng bỏ một ô jewel socket và lấy node block.
      - title: Hai điểm vào một bloodline
        body: |
          Trang cuối của planner chỉ lấy hai node ô unique, Amulets và Belts, và bỏ hai điểm ascendancy cuối vào Primal Roar, một notable mà dữ liệu cây xếp dưới "Farrul": 4% increased attack speed mỗi minion. Với đủ tám con minion của [[Living Lightning Support]] thì là 32%.

          FAQ của tác giả cân nó với [[Bestowed Knighthood]], thứ anh nói đáng khoảng 10% more damage, và chọn tốc độ vì "the build struggles with Attack Speed", build chật vật về attack speed.

          Guide không nói bloodline đó mở khóa bằng cách nào, nên chúng tôi cũng không nói cho bạn được. Cho tới khi bạn biết, [[Bestowed Knighthood]] là phương án thay thế được nêu rõ.
      - title: Một viên gem lẽ ra không nên nằm trong planner
        body: |
          Changelog ngày 11/11 ghi: "Removed Aspect of Lunaris from Echoes Variant as it did not go Core." — bỏ Aspect of Lunaris khỏi bản Echoes vì nó không được đưa vào core.

          Trang cuối của planner vẫn liệt một viên gem Aspect of Lunaris trong body armour, và FAQ vẫn giải thích cú tự đánh giữ stack của nó ra sao. Bỏ qua cả hai. Cũng changelog đó nói chest được đổi sang Royal Plate để bù phần giảm damage bị mất.

powerCurve: |
  Đây là cách đọc của chúng tôi; guide mô tả các stage chứ không mô tả đường cong.

  Damage là tích của ba thứ. Một **weapon**: lúc đầu là của bạn, rồi là một phần của Mercenary qua [[Rallying Cry]]. Một **hệ số nhân lên weapon đó**: lúc đầu không có gì, rồi là 600–1000% more của [[Facebreaker]]. Và **chồng warcry**: slam được exert, [[Admonisher]], và gai đánh lần thứ hai.

  Ở level 30 bạn có bản nhỏ nhất của cái thứ ba và chưa có gì của cái thứ hai: [[Sunder]], một cây axe, và [[Intimidating Cry]] trên [[Autoexertion]]. Đó là một nhân vật slam bình thường và chơi đúng như vậy. Ở level 70 thì phần thứ ba đã trọn — [[Earthshatter]], bốn warcry, [[Deep Breaths]] — và đó là thứ gánh mấy map đầu. Lời khen của chính guide cho giai đoạn này là về slam nói chung, không phải về build này.

  Rồi cú đổi thay phần thứ nhất và thêm phần thứ hai chỉ trong một buổi chiều. Theo phép tính của chúng tôi, đôi gloves tệ nhất đã thắng việc cầm axe, và khoảng cách nới rộng với từng điểm warcry buff effect trên Mercenary. Đây là chữ "đột ngột" trên đường cong, và là lý do tier list xếp build cao như vậy.

  Cũng chính cú đổi đó là khoảnh khắc mong manh duy nhất của build. Trước nó, damage của bạn là một cây weapon bạn không thể mất. Sau nó, damage của bạn là một cái buff có duration, và trong một thời gian duration đó ngắn hơn cooldown của nó. Mọi thứ mua giữa cú đổi và Tier 16 — support duration, mấy cái ring, anoint, Runegraft — đều tiêu vào việc bắt một cây weapon đi mượn cư xử như một cây của mình. Khi nó đã vậy thì phần còn lại là scale bình thường: axe tốt hơn cho nó, attack speed cho bạn.

  Phòng thủ thì lớn lên theo kiểu ngược lại: đều đều. Life với armour trong campaign, một cái shield và cap block ở cú đổi, một phần năm mỗi cú hit chuyển sang Mercenary, và chỉ tới tận cuối mới có một cái helmet biến đòn đánh của chính bạn thành hồi phục.

upgrades:
  - step: "[[Earthshatter]] có 20% quality"
    why: >-
      Đứng đầu vì guide không cho bạn chạy map khi thiếu nó, và vì nó tốn lượt
      chạy Labyrinth chứ không tốn currency. Quality là thêm gai, mà gai là
      single-target damage của bạn cho tới cú đổi.
  - step: "Một amulet có physical damage cố định cho attack, tier 2 trở lên"
    why: >-
      Trước cú đổi, không phải sau. Nó là damage duy nhất nắm đấm của bạn có
      khi buff của Mercenary rớt, mà giai đoạn đầu thì buff rớt thường xuyên.
      Nó đứng trên đôi gloves vì gloves vô giá trị khi không có gì để nhân.
  - step: "Bộ đồ cho cú đổi: [[Facebreaker]], hai [[Timeclasp]], [[Breathstealer]] anoint [[Deep Breaths]], và một con Swiftblade có support duration"
    why: >-
      Trên thực tế là một lần mua, vì không phần nào chạy được khi thiếu các
      phần kia. Gloves là hệ số nhân; phần còn lại là uptime của buff. Một đôi
      gloves thường và cây axe cũ của bạn là đủ để bắt đầu.
  - step: "Resistance và freeze avoidance cho Mercenary"
    why: >-
      Mới trong 3.30, và đi trước mọi món damage cho nó: nó có −60% all
      resistances trong map, và khi nó chết bạn mất weapon, một phần năm phòng
      thủ và một aura cùng lúc.
  - step: "[[Runegraft of the Warp]]"
    why: >-
      Theo guide là "absolute highest priority and first big purchase" — ưu
      tiên cao nhất tuyệt đối và món lớn đầu tiên phải mua — khi bạn farm Tier
      16. Nó nhân buff duration, nên nó biến "thường có" thành "luôn có" — và
      nó giải phóng cả hai ô ring trên Mercenary cho mấy món bên dưới. Không
      có giá.
  - step: "[[Kaom's Binding]] và một cái [[Deidbell]] Foulborn trên Mercenary"
    why: >-
      Sau Runegraft vì chúng cần mấy điểm ascendancy mà hai cái ring đang
      dùng. Một cái là phần giảm physical damage lớn nhất trong build, cái kia
      nâng chính con số 24%.
  - step: "Một weapon làm riêng cho Mercenary, rồi cluster jewel và [[The Light of Meaning]]"
    why: >-
      Axe tốt hơn scale mọi cú hit. Chỉ có khoảng damage của nó được tính, tốc
      độ thì không, nên — cách đọc của chúng tôi — cây axe bạn muốn không phải
      cây người chơi khác đang tranh mua. Guide làm nó bằng Recombinator, thứ
      3.30 đã làm cho bớt hào phóng. Jewel đi sau: chúng cộng vào damage bạn
      đã có.
  - step: "[[Echoes of Creation]] với một cây Royal Plate armour cao"
    why: >-
      Sau cùng, và chỉ khi có cái chest. Nó cộng tới 75% more damage cho một
      build mà tác giả nói "really doesn't need more damage", thật sự không
      cần thêm damage, và thiếu physical reduction thì nó giết bạn.

play:
  mapping: |
    1. Xem map. Danh sách cần tránh của guide: less cooldown recovery rate, 60% less recovery of life and energy shield, buffs on players expire faster, reduced chance to block hoặc less armour, và monsters cannot be leeched from. Guide khẳng định ngoài mấy cái đó ra thì build "ignores most map modifiers", bỏ qua phần lớn mod map: nó không đánh trượt được, không crit, và chỉ gây physical damage.
    2. Bật [[Blood Rage]]. Bảo đảm [[Flesh and Stone]] đang ở Sand Stance.
    3. [[Shield Charge]] vào pack và slam bằng [[Earthshatter]].
    4. Bấm [[Rallying Cry]] của chính bạn khi nó sẵn sàng. Các warcry khác tự nổ, và mỗi cái làm gai nổ.
    5. Đi tiếp. Đừng chạy vượt Mercenary.

    Bước 5 là chỗ căng của build này. Bạn thì nhanh mà weapon thì không phải của bạn. Tiếng hét của nó phải tới được bạn, đó là lý do guide muốn area of effect trên [[Rallying Cry]] của nó "when you are moving very quickly ahead of him", cho lúc bạn chạy rất nhanh ở phía trước nó. Nếu đòn đánh của bạn bỗng chẳng làm gì, là bạn đã bỏ nó lại phía sau.
  bossing: |
    1. Curse boss. Lúc đầu là [[Vulnerability]] của chính bạn; ở setup endgame thì Mercenary áp nó và bạn thêm [[Punishment]].
    2. Đứng sát và slam. Mục tiêu to thì nhiều gai trúng hơn, và đấu trường nhỏ thì còn nhiều hơn nữa.
    3. Bấm [[Rallying Cry]] của chính bạn ngay mỗi lần nó hồi xong, và ở các setup đầu thì thêm [[Enduring Cry]] để lấy Endurance Charge.
    4. Với pinnacle boss, guide đổi [[Fist of War Support]] lấy [[Melee Physical Damage Support]].

    Có hai thứ khác với map. Một con boss đứng một mình đáng 25 Power chứ không phải 30, cho tới khi Mercenary có anoint Roaring Challenge, nên buff của nó yếu hơn một phần sáu. Và không có pack để giữ charge với [[Blood Rage]] chạy, đó là việc của cluster Mob Mentality và một cái tattoo leech.

    Tác giả nói build hoàn chỉnh có thể "instantly phase Pinnacle bosses", cho pinnacle boss qua phase tức thì. Đó là lời khẳng định của anh, từ 3.29.

deaths:
  - situation: "Ngay sau cú đổi, đòn đánh của bạn thôi gây damage giữa một pack"
    cause: >-
      Buff [[Rallying Cry]] của Mercenary hết trước khi nó kịp hét lại, hoặc
      bạn chạy ra khỏi tầm của nó. Tay không thì gần như toàn bộ damage của
      bạn là cái buff đó.
    fix: >-
      Physical damage cố định trên amulet để bạn không bao giờ về không. Một
      support duration trên tiếng hét của nó, hai ring [[Timeclasp]] tốt và
      anoint [[Deep Breaths]]. Rồi tới [[Runegraft of the Warp]].
  - situation: "Mercenary chết, rồi tới lượt bạn"
    cause: >-
      Từ 3.30 nó có −60% all resistances trong map và ít damage reduction hơn
      ở level cao. Guide nêu thêm freeze là một vấn đề đã biết. Nó đi rồi thì
      [[Loyal Bodyguard]] và [[Pride]] cũng đi.
    fix: >-
      Resistance trên gear của nó trước damage, 100% freeze avoidance trên
      boots của nó, và maximum life của nó nhiều hơn của bạn. Đừng đưa nó
      Howlcrack ở map đỏ.
  - situation: "Bạn đội Echoes of Creation và chết vì đòn đánh của chính mình"
    cause: >-
      Mỗi cú slam lấy 15–20% life của bạn thành physical damage với mỗi warcry
      đang exert nó, mà thường là bốn hoặc năm cái.
    fix: >-
      Đừng đội nó khi chưa có cái chest. Flat physical damage reduction trên
      một body armour armour cao, [[Flesh and Stone]] và Fortification đang
      bật, và dòng tự gây damage thấp nhất bạn mua nổi.
  - situation: "Một cái map trông ổn lại giết bạn"
    cause: >-
      Số ít mod đáng kể đều đánh vào cỗ máy: warcry cooldown, buff duration,
      recovery, block với armour, hoặc leech.
    fix: >-
      Roll lại mọi map có less cooldown recovery, buff hết nhanh hơn, less
      recovery, reduced block hoặc armour, hoặc không leech.

troubleshooting:
  - symptom: "Damage chập chờn: mạnh vài giây, rồi không còn gì"
    cause: >-
      Uptime của buff. Một cooldown 8 giây đặt cạnh một cái buff chỉ sống vài
      giây nếu bạn không kéo dài nó.
    fix: >-
      Kiểm theo thứ tự: support duration trên [[Rallying Cry]] của nó; dấu và
      độ lớn của dòng duration trên từng cái [[Timeclasp]]; anoint trên
      [[Breathstealer]]; rồi mua [[Runegraft of the Warp]].
  - symptom: "Pack tan chảy, boss thì chậm"
    cause: >-
      Power. Một con boss cộng bạn là 25 trên 30 Power mà tiếng hét đếm được.
      Và gai cần chỗ để chồng lên nhau.
    fix: >-
      Roaring Challenge trên gloves của nó, [[Melee Physical Damage Support]]
      cho trận đánh, và đứng sao cho vòng gai nằm lên boss.
  - symptom: "Tôi hết mana"
    cause: >-
      Slam tốn nhiều và warcry cũng tốn mana.
    fix: >-
      Một jewel mana leech trong campaign; một mana flask Enduring trước level
      65; rồi reduced mana cost cho non-channelling skill trên cả hai ring và
      amulet.
  - symptom: "Earthshatter thấy yếu so với Sunder"
    cause: >-
      Gai không nổ, hoặc có quá ít. Chúng chỉ nổ khi một warcry hay một cú
      slam khác nổ ra gần chúng.
    fix: >-
      20% quality trên gem, đã lấy [[Deep Breaths]], và các warcry có quality
      khác nhau để chúng nổ cái này nối cái kia.
  - symptom: "Mercenary nhảy đi chỗ khác và thôi hét gần tôi"
    cause: >-
      Nó có Leap Slam, hoặc ở mức nhẹ hơn là Flicker Strike, trong danh sách
      skill. Guide nói cả hai làm rối việc chọn mục tiêu của nó.
    fix: >-
      Thuê một con Swiftblade khác. Skill của nó không đổi được.
  - symptom: "Tôi không mặc được body armour sau cú đổi, hoặc thiếu attribute"
    cause: >-
      Cây slam thiếu Dexterity với Intelligence, và cái chest endgame cần 297
      Strength khi không có enchant.
    fix: >-
      Mấy node nhỏ của Ascendant lo chuyện này trong lúc lên level.
      [[Living Lightning Support]] cần 105 Intelligence ở level 18 để ra đủ
      tám con minion; guide nói bảy con là ổn.

patch:
  - note: >-
      **Không gì 3.30 làm đụng tới các skill.** Chúng tôi đã tìm trong patch
      note chính thức các từ Earthshatter, Rallying Cry, warcry, exerted
      attack và Facebreaker. Không có thay đổi nào với bất cứ cái nào trong
      game thường.
  - entry: mercenary-nerfs
    note: >-
      **Mercenary giờ cần resistance, và guide nói hai điều khác nhau về
      chuyện đó.** Bản sửa ngày 11/11 của nó đặt resistance của Mercenary lên
      đầu vì penalty −60%. FAQ của nó vẫn khẳng định Mercenary không có
      penalty. Patch note phân xử: −60% ở khu vực level 68 trở lên. Nó cũng có
      ít damage reduction hơn ở level cao, điều này quan trọng vì
      [[Loyal Bodyguard]] chuyển damage của bạn sang nó.
  - entry: mercenary-nerfs
    note: >-
      **Cú nerf 20% attack damage lẽ ra không ảnh hưởng — cách đọc của chúng
      tôi, chưa xác nhận.** Nó hạ độ mạnh đòn đánh của chính Mercenary. Build
      này không dùng đòn đánh của nó; nó dùng damage của cây weapon trong tay
      Mercenary, qua [[Rallying Cry]]. Changelog 3.30 của tác giả không liệt
      kê khoản mất damage nào. Chưa ai thử.
  - note: >-
      **Implicit pinnacle lúc nào cũng bật đã mất.** "Eldritch modifiers that
      only applied while a Unique Monster or Pinnacle Boss was in your
      Presence were always applying when on a Minion or a Mercenary." Tức là
      mấy dòng Eldritch lẽ ra chỉ áp khi có Unique Monster hay Pinnacle Boss
      trong Presence thì lại luôn áp khi nằm trên Minion hay Mercenary. Đã sửa
      trong 3.30. Changelog của guide nói nó đã bỏ lời khuyên đó; một dòng FAQ
      thì còn sót lại.
  - entry: reliquarian-luminary
    note: >-
      **Cú nerf Luminary không áp vào đây.** Golden Glory bị cắt một nửa,
      nhưng nó chỉ ảnh hưởng tới Link skill, mà build này không có cái nào.
      Build lấy Noble Blood, Loyal Bodyguard, Bestowed Knighthood và các node
      ô unique. Không cái nào xuất hiện trong patch note, và phần chữ của
      chúng trong dữ liệu cây đang chạy của GGG khớp với guide.
  - entry: crafting-service-tweaks
    note: >-
      **Lời khuyên về Recombinator có từ trước thay đổi.** Guide gọi nó là
      cách tốt nhất để làm amulet, body armour và shield endgame của bạn, và
      là cách rẻ nhất để làm weapon của Mercenary. Trong 3.30 nó cho ít mod
      hơn khi đầu vào có ít mod, lấy item level của base được chọn, và từ chối
      đồ corrupt. Changelog 3.30 không nhắc tới nó.
  - entry: item-tiers
    note: >-
      **Lợi nhỏ.** Cord Belt giờ rơi bình thường, và guide thêm nó vào stage
      cuối để có thêm một anoint.
  - entry: map-device-items
    note: >-
      **Warrant chạy kiểu khác.** Một tờ Mercenary Warrant giờ mở một trận tái
      đấu ở Proving Grounds và không dùng chung với map. Các bước thuê của
      guide được viết ngày 13/11 và khớp với chuyện đó.
  - entry: ruthless-changes
    note: >-
      **Bỏ qua mấy dòng về Ascendant nếu bạn thấy ai trích.** 3.30 đổi node
      Gladiator và Pathfinder của Ascendant — chỉ trong mục Ruthless. Build
      này lên level bằng node Slayer và Saboteur của Ascendant, và trong dữ
      liệu cây đang chạy cả hai đọc đúng như guide mô tả.

strengths:
  - "Rất trâu so với một nhân vật gây damage: cap block, armour, Fortification và một con Mercenary gánh một phần năm mỗi cú hit."
  - "Bỏ qua phần lớn mod map. Không accuracy, không crit, không elemental damage, thuần physical bỏ qua phần giảm damage của quái."
  - "Khởi đầu bằng slam thường, thứ đã là một league start an toàn nhiều năm nay, và không cần unique nào để bắt đầu."
  - "Planner chạy trên dữ liệu 3.30 thật, và 3.30 không đổi skill nào của nó."
  - "Damage rất cao khi buff của Mercenary đã thành vĩnh viễn, theo lời tác giả."
  - "Chạy được solo self-found, theo một người đã làm chuyện đó hai lần."
weaknesses:
  - "Melee. Bạn đứng giữa pack."
  - "Weapon của bạn là một cái buff từ nhân vật khác. Ngay sau cú đổi nó hay rớt, và damage của bạn rớt theo."
  - "Bạn đổi ascendancy ở Labyrinth thứ tư, chuyện này tốn respec point và cần một bộ đồ mua sẵn."
  - "Phụ thuộc vào chuyện tìm được một con Swiftblade có đúng support, và giữ nó sống khi giờ nó có −60% resistance."
  - "Một tác giả. Tier list xếp hạng nó do chính site đó đăng."
  - "Không có giá ở đâu trong guide, và con số damage duy nhất của nó là một lời khẳng định từ 3.29."
  - "Stage cuối làm đau bạn với mỗi đòn đánh và phạt nặng sai lầm khi lo gear."
avoidIf: >-
  Chọn build khác nếu bạn không ưa melee, hoặc nếu bạn muốn một nhân vật mà
  damage hoàn toàn là của chính nó. Bỏ qua nếu chuyện đổi ascendancy giữa
  chừng nghe như một việc đáng ngán, hoặc chuyện săn một con Mercenary cụ thể
  cũng vậy. Nếu bạn tới đây vì cái Luminary đứng lùi lại trong lúc Mercenary
  giết quái, thì đó là một build khác — Flame Link Mercenary Luminary trên site
  này — và nó ra khỏi 3.30 tệ hơn build này nhiều.

