      - name: Di chuyển
        gems: [Shield Charge, Faster Attacks Support, Blood Rage]
      - name: Skill của chính Mercenary
        gems: [Rallying Cry, Pride]
    moveOn: "buff của Mercenary giữ được suốt cả một map và bạn farm Tier 16."
    details:
      - title: Bộ đồ, và cái chỉ số duy nhất giữ bạn sống
        body: |
          Trước cú đổi, guide gọi một dòng trên gear của chính bạn là bắt buộc: "Adds Physical Damage to Attacks", tier 2 trở lên, trên amulet. Khi buff của Mercenary rớt, dòng đó là tất cả những gì nắm đấm của bạn có. Có nó thì bạn "can still clear most trash mobs", vẫn clear được phần lớn quái thường.

          Phần còn lại:

          - [[Facebreaker]]. Foulborn nếu rẻ, bản trơn nếu không.
          - Một dòng lightning damage cố định cho attack bất kỳ, cho [[Living Lightning Support]]. Ring là chỗ thường gặp; tier không quan trọng.
          - 100% chance to avoid being shocked, từ belt và một Abyss jewel, thiếu thì bù bằng boots avoid ailments.
          - Cho Mercenary: weapon của nó, hai ring [[Timeclasp]], [[Breathstealer]] anoint [[Deep Breaths]], và boots có 100% chance to avoid being frozen. "Freeze is a big issue on Mercenaries." — freeze là vấn đề lớn với Mercenary.
      - title: Weapon của nó là weapon của bạn
        body: |
          Chỉ có physical damage tối thiểu và tối đa trên weapon của nó là quan trọng. Attack speed trên đó không làm gì cho bạn.

          Nên đừng tìm trên trade theo physical damage per second: bạn sẽ trả tiền cho tốc độ. Tìm theo con số damage. Karui Chopper là base tốt nhất, và cho cú đổi đầu tiên thì cây axe bạn dùng lên level là đủ tốt.
      - title: Resistance của nó — chỗ guide tự mâu thuẫn
        body: |
          Bản sửa 3.30 đổi setup Mercenary giai đoạn đầu "to prioritize his Resistances due to Mercenaries receiving −60% to all Elemental Resistances" — ưu tiên resistance của nó vì Mercenary nhận −60% all elemental resistances.

          Nhưng FAQ ở phía dưới vẫn nói: "Mercenaries do not have a Resistance Penalty like Characters do, meaning he needs a total of 75% in each Resistance." Tức là Mercenary không có penalty resistance như nhân vật, nên nó chỉ cần tổng 75% mỗi resistance. Dòng đó là 3.29 và giờ đã sai. Ở khu vực level 68 trở lên, nó cần tổng 135% thì mới hiện 75%.

          Thứ tự của chính guide vẫn đúng: trước hết không resistance nào dưới không, rồi elemental, rồi chaos. Và nó thừa nhận "you probably won't be able to fully cap his Resistances" ở stage này — nhiều khả năng bạn chưa cap hết được resistance của nó.
      - title: Nếu mấy món unique chưa có trên chợ
        body: |
          FAQ ngày 13/11 liệt kê mấy món thế chỗ cộng duration hoặc cooldown recovery cho [[Rallying Cry]] của nó:

          - Boots Elder mà mod "supported by More Duration" còn mang thêm 10–15% increased skill effect duration.
          - Belt và boots Shaper hoặc Crusader có increased cooldown recovery rate; một bản yếu hơn craft được ở bench.
          - Một cây belt corrupt ra 10–15% increased skill effect duration.
          - Howlcrack, chỉ khi hết cách. Nó làm con Mercenary hét liên tục, và "he often kills himself", nó hay tự giết mình.
      - title: Điểm ascendancy ở cú đổi
        body: |
          [[Noble Blood]]; Legendary Gloves và Legendary Rings, để nó đeo được [[Breathstealer]] và hai ring [[Timeclasp]]; [[Loyal Bodyguard]]; [[Bestowed Knighthood]] cho [[Pride]] của nó.

          Guide lưu ý phần taunt trên Bestowed Knighthood không đáng tin, vì warcry của chính bạn cũng taunt và ghi đè lên của nó.

          Planner có hai trang cho thời điểm này và chúng không khớp nhau: một trang đúng với danh sách trên, trang kia lấy bốn node ô unique và không có Bestowed Knighthood. Guide viết thì mô tả trang đầu. Theo phần chữ.
  - id: endgame
    phase: endgame
    image: stranglegasp
    title: "Endgame: gear thật của Mercenary"
    levels: Map Tier 16 và pinnacle boss
    uses: >-
      Trên Mercenary: [[Kaom's Binding]], một cái [[Deidbell]] Foulborn đôi,
      [[Shaper's Seed]], và một weapon làm riêng cho nó. Trên bạn:
      [[Runegraft of the Warp]], cluster jewel, [[The Light of Meaning]] và
      [[Unnatural Instinct]].
    changes: >-
      Buff của nó thôi rớt, nên hai cái ring đi được. Nó curse bằng
      [[Vulnerability]] thay bạn, còn bạn đổi curse của mình sang
      [[Punishment]]. [[Tempest Shield]] cap spell block.
