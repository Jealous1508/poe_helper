    moveOn: "Kitava đã chết ở Act 10 và viên Earthshatter của bạn có 20% quality."
    details:
      - title: Nếm thử lần đầu cái mẹo endgame
        body: |
          [[Herald of Purity]] gọi ra Sentinel khi bạn hit hoặc giết. Chúng không gây damage đáng kể. Chúng ở đó vì chúng là đồng minh, và [[Rallying Cry]] của chính bạn exert thêm damage theo mỗi đồng minh gần đó. Guide ước là 20% more khi có Sentinel còn sống.

          Đó là cùng cái cơ chế mà về sau bạn sẽ dựng cả nhân vật lên trên, chỉ là chĩa theo hướng ngược lại.
      - title: Cài Molten Shell cho đúng
        body: |
          [[Cast when Damage Taken Support]] ở level 1 và [[Molten Shell]] ở level 7. Đó là level của guide; cặp này làm cái shell bật lên sau khi ăn rất ít damage.
      - title: Một cái Rage Mastery để đổi sau
        body: |
          Trong campaign, cây lấy cái Rage Mastery intimidate quái gần đó khi bạn có Rage. Cuối campaign, đổi nó sang cái cho Rage khi bạn dùng warcry.
      - title: Bandit
        body: |
          Planner giết cả ba, lấy passive point, trên mọi trang từ level 1. Phần chữ của guide không bàn chuyện này.
  - id: early-maps
