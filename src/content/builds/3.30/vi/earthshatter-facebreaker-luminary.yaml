name: Earthshatter Facebreaker Luminary
tagline: >-
  Một build slam đánh tay không. Một con Mercenary thuê về hét lên, tiếng hét
  cho bạn mượn một phần cây axe của nó, và một đôi gloves nhân phần đó lên.
  Build Luminary mà 3.30 gần như để yên.
class: Scion
ascendancy: Luminary
role: starter
budget: low
budgetNote: >-
  **Guide không đưa con số currency cho bất cứ thứ gì, nên chúng tôi cũng
  không.** Những gì nó nói bằng chữ: bạn bắt đầu được mà không cần unique nào;
  gloves [[Facebreaker]] thường thì "very easy to get ahold of", rất dễ kiếm;
  chỉ mua [[Carnage Heart]] "if it's a handful of Chaos Orbs", nếu nó chỉ vài
  Chaos Orb; và [[Runegraft of the Warp]] là "first big purchase", món lớn đầu
  tiên phải mua, khi bạn farm map Tier 16. Cú đổi sang Luminary cần một bộ đồ
  nhỏ mua cùng lúc — đôi gloves, hai ring [[Timeclasp]], [[Breathstealer]] có
  anoint — và FAQ của chính nó thừa nhận rằng ngày đầu, vài món unique của
  Mercenary có thể "really expensive", rất đắt, hoặc chưa tồn tại.
mainSkill: Earthshatter
image: asc-icon-ascendant
hero: art-ascendant
tags: [Slam, Warcry, Mercenary, Physical, Block]
ratings: { clear: 4, bossing: 4, survivability: 4, ease: 3 }
verified: "2026-11-14"
confidence: mixed
confidenceNote: >-
  **Một tác giả, kiểm ở những chỗ chúng tôi kiểm được.** Đây là guide của Shayd
  trên Maxroll, viết cho 3.29 ngày 9/10/2026 và sửa cho 3.30 vào ngày 11 và
  13/11. Khác với vài guide "3.30" khác, planner của nó đúng là chạy trên dữ
  liệu 3.30: mọi trang cây đều đóng dấu 3300. Tier list league starter của
  Maxroll ngày 13/11 xếp nó ở S tier. Ngược lại: đây là build của một người,
  tier list là của cùng site đó, chưa có ladder 3.30 nào, và lần sửa bỏ sót ba
  chỗ — FAQ vẫn nói Mercenary không có penalty resistance, vẫn mô tả implicit
  pinnacle lúc nào cũng bật, và trang planner cuối vẫn giữ một viên gem mà
  changelog nói đã bỏ. Guide không có bảng điểm; bốn điểm số là của chúng tôi.
  Con số damage của nó là số 3.29 của tác giả.
modes:
  ssf: >-
    Tốt, theo lời tác giả: "Definitely!" Anh đã chơi nó solo self-found
    hardcore ở 3.26 và 3.29, khởi đầu bằng slam thường cho tới khi có đôi
    gloves và "an adequate Merc", một con Merc tạm đủ. Phần khó khi chơi solo
    là [[Runegraft of the Warp]] — bạn giữ ring [[Timeclasp]] lâu hơn — và cái
    [[Deidbell]] Foulborn đôi, thứ anh nói không đáng farm trừ khi bạn chơi
    build cả league.
  hardcore: >-
    Sân nhà của chính tác giả, với một setup khác. Cho hardcore anh cap spell
    suppression, và nói chuyện đó tốn "a substantial amount of damage and
    attack speed", một lượng damage và attack speed đáng kể, cùng "very good
    gear", gear rất tốt. Bản softcore bên dưới không suppress spell. Stage
    [[Echoes of Creation]] gây damage lên bạn với mỗi đòn đánh và dành cho
    softcore, trừ khi bạn biết chính xác armour của mình làm gì với nó.

idea: |
  [[Earthshatter]] nện xuống đất và để lại một vòng gai đá. Khi bạn dùng một warcry, gai nổ tung và đánh thêm lần nữa. Nên build là một cú slam theo sau bởi mấy tiếng hét, và mấy tiếng hét thì tự động.

  Phần lạ là weapon. Bạn không cầm cây nào. Gloves [[Facebreaker]] cho 600–1000% more physical damage với unarmed attack, nhưng tay không thì gần như chẳng có damage nào để nhân.

  [[Mercenary]] cấp phần đó. Là một [[Luminary]], bạn thuê hẳn một con — một tay đánh vũ khí hai tay gọi là Swiftblade — và [[Rallying Cry]] của nó cho đồng minh gần đó mượn một phần damage weapon **của nó**. Bạn chính là đồng minh gần đó. Cây axe của nó thành nắm đấm của bạn, và đôi gloves nhân nó lên.

  Bạn không phải Luminary ngay từ đầu. Bạn lên level bằng Ascendant với [[Sunder]] và một cây axe thật, rồi đổi ascendancy ở Labyrinth thứ tư, khi đã có đôi gloves và một con Mercenary phù hợp.

chain:
  - label: Slam
    text: "[[Earthshatter]] đánh trúng và để lại tới 15 cái gai quanh bạn. Không có weapon thì nó đánh tay không."
  - label: Hét
    text: "[[Autoexertion]] dùng warcry thay bạn. Mỗi cái làm gai nổ và khiến mấy cú slam kế tiếp đánh đau hơn."
  - label: Mượn
    text: "[[Rallying Cry]] của Mercenary cộng tới 24% damage weapon của nó vào đòn đánh của bạn. [[Facebreaker]] nhân phần đó lên bảy tới mười một lần."
  - label: Trụ
    text: "Một cái shield, cap block nhờ [[Versatile Combatant]], [[Flesh and Stone]], Fortification, và [[Loyal Bodyguard]] chuyển một phần năm mỗi cú hit sang Mercenary."

chainDetails:
  - title: "Phép tính của chúng tôi: vì sao tay không thắng cây axe"
    body: |
      Phép tính này là của chúng tôi, dựng từ phần chữ gem và item trên PoEDB. Guide thì cho hình ảnh — "imagine you stapled six Two-Handed Axes together", hãy tưởng tượng bạn bấm ghim sáu cây axe hai tay lại với nhau — chứ không cho cách tính.

      [[Rallying Cry]] cho đồng minh added attack damage bằng 4% damage weapon main-hand của người dùng với mỗi 5 Power, tính tối đa 30 Power. Tức là 24% ở mức trần.

      [[Facebreaker]] là 600–1000% more physical damage với unarmed melee attack: bảy lần ở roll tệ nhất, mười một lần ở roll tốt nhất.

      24% × 7 là khoảng 1.7 cây axe. 24% × 11 là khoảng 2.6. Và "increased Warcry Buff Effect" trên Mercenary thì nâng chính con số 24%, đó là cách guide ra tới sáu.

      Nên ngay cả đôi gloves tệ nhất cũng thắng việc tự cầm cây axe, mà còn rảnh một tay cho shield. Cái vướng nằm ở mục kế.
  - title: Buff chính là build, và nó ngắn
    body: |
      [[Rallying Cry]] có cooldown 8 giây. PoEDB ghi buff của nó có base duration 3.4 giây ở gem level 20.

      Không cải thiện gì thì thời gian không có buff nhiều hơn thời gian có. Mà không có buff thì tay không của bạn đánh gần như chẳng ra gì. Guide tự liệt chuyện này là điểm yếu của nó — "Rallying Cry can fall off early on", Rallying Cry có thể rớt ở giai đoạn đầu — và cảnh báo bạn có thể tụt xuống "literally zero damage", đúng nghĩa đen là không damage.

      Gần như mọi món trên Mercenary tồn tại để lấp cái khoảng trống đó:

      - Một support duration trên Rallying Cry của nó: tối thiểu "More Duration II", lý tưởng là "Greater Duration III". Đây là thứ khiến bạn thuê nó.
      - Hai ring [[Timeclasp]], mỗi cái ít nhất 15% **increased** skill effect duration. Cái ring roll từ 20% reduced tới 20% increased, nên hãy đọc dấu.
      - [[Breathstealer]] anoint [[Deep Breaths]], để lấy warcry cooldown recovery và area.
      - Về sau, [[Runegraft of the Warp]], thứ guide mô tả là "42% more Buff Effect Duration".

      Tới setup endgame thì buff của nó kéo dài "over twice as long as his Rallying Cry cooldown", lâu hơn gấp đôi cooldown Rallying Cry của nó, và vấn đề biến mất.
  - title: Power đến từ đâu, và vì sao boss thì khác
    body: |
      Warcry đếm Power của quái và đồng minh gần người dùng. Quái normal là 1, magic 2, rare 10, unique 20, và một người chơi là 5.

      Trong một pack thì con số vượt 30 ngay. Đánh một con boss đứng một mình thì là 20 cho boss và 5 cho bạn: 25, tức 20% weapon chứ không phải 24%.

      Cách sửa của guide là anoint Roaring Challenge trên [[Breathstealer]] của nó — 25% increased total Power counted — đưa 25 lên vừa quá 30.
  - title: Gai đá, và vì sao phòng nhỏ lại có lợi
    body: |
      [[Earthshatter]] gây cú slam của nó, rồi để lại gai: tối đa 15 cái, nhiều hơn khi gem có quality. Một warcry gần một cái gai làm nó nổ, với 30% less damage so với cú slam.

      Cú slam và vài cái gai có thể trúng cùng một con quái. Guide kỳ vọng "at least 2 Spikes per Earthshatter", ít nhất 2 gai mỗi cú Earthshatter, trên một mục tiêu, và nhiều hơn với quái to hay trong chỗ chật.

      Đó là lý do area of effect ở đây là một chỉ số damage, và là lý do guide không cho bạn chạy map trước khi gem có 20% quality. Đó cũng là lý do ba trong số các warcry tự động mang quality khác nhau — 16%, 12% và 8% trong setup công bố — để chúng nổ so le chứ không cùng lúc.
  - title: Bạn bấm gì và cái gì tự bấm
    body: |
      [[Autoexertion]] là một support gem dùng các warcry được link khi cooldown của chúng sẵn sàng. [[Intimidating Cry]], [[Infernal Cry]], [[Battlemage's Cry]] và [[Seismic Cry]] đều nằm trong nó. Nó là một phần của game, không phải công cụ bên ngoài.

      Bạn bấm [[Earthshatter]], [[Rallying Cry]] của chính bạn, [[Shield Charge]] và, khi đánh boss ở các setup đầu, [[Enduring Cry]].

      Rallying Cry của bạn làm việc khác với cái của Mercenary. Buff không bao giờ áp lên người hét, nên cái của bạn không cho bạn damage weapon nào. Thứ nó làm là exert đòn đánh của bạn lấy tới 25% more damage, 5% mỗi đồng minh gần đó — và [[Living Lightning Support]] tồn tại để tạo ra mấy đồng minh đó.
  - title: Vì sao Mercenary phải sống dai hơn bạn
    body: |
      [[Loyal Bodyguard]] ghi: nếu life của Mercenary cao hơn của bạn, 20% damage từ hit được trừ vào life của nó trước life của bạn. Guide coi nó như "Take 20% Less Damage" và thêm một luật: bảo đảm nó lúc nào cũng có maximum life nhiều hơn bạn.

      Aura của nó cũng quan trọng. Nó chạy [[Pride]], và [[Bestowed Knighthood]] cho aura của nó 50% increased effect.

      Nên một con Mercenary chết làm bạn mất ba thứ cùng lúc: weapon, một phần năm phòng thủ và một aura damage.

mandatory:
  - term: Earthshatter
    why: >-
      Skill chính, từ ngày bạn xong Act 10. Scion mua nó từ Nessa sau The
      Siren's Cadence ở level 12; cho tới lúc đó thì để nó lên level trong
      weapon swap.
    detail: >-
      Nó phải có 20% quality trước khi bạn vào map. Hai đường của guide là
      farm Merciless Labyrinth hoặc mua một viên. Quality cộng thêm gai.
  - term: Sunder
    why: >-
      Thứ bạn dùng để lên level, từ level 12 tới hết Act 10. Nó đánh từ xa,
      điều guide đánh giá cao khi gặp boss như Shavronne.
  - term: Facebreaker
    why: >-
      600–1000% more physical damage với unarmed melee attack. Không có nó
      thì build không tồn tại. Bản thường là đủ cho cú đổi.
    detail: >-
      Có ba loại. Bản trơn cộng critical strike multiplier, ở đây vô dụng. Bản
      Foulborn cộng 20–30% area of effect khi tay không và "generally cheap",
      nhìn chung rẻ. Bản Vestigial mang một dòng mượn từ unique khác; lựa chọn
      của guide là dòng cho Adrenaline.
  - term: Noble Blood
    why: >-
      Notable Luminary cho bạn thuê hẳn một Mercenary. Bạn lấy nó ở Labyrinth
      thứ tư, khi đổi ascendancy.
  - term: Mercenary
    why: >-
      Một con Swiftblade. Chúng lúc nào cũng có [[Rallying Cry]]; bạn muốn có
      một support duration trên đó và, lý tưởng, [[Pride]]. Tránh con có Leap
      Slam, skill này làm hỏng việc chọn mục tiêu của nó.
  - term: Rallying Cry
    why: >-
      Trên Mercenary thì nó là weapon của bạn. Trên bạn thì nó exert mấy cú
      slam. Scion mua nó từ Clarissa ở Act 3.
  - term: Autoexertion
    why: >-
      Dùng warcry thay bạn. Không có nó thì đây là một vòng năm nút cứ hai
      giây một lần.
  - term: Intimidating Cry
    why: >-
      Đòn đánh được exert gây double damage. Giữ nó và [[Autoexertion]] ở 20%
      quality.
  - term: Admonisher
    why: >-
      15% increased damage với mỗi warcry dùng gần đây. Guide ước nó vào
      khoảng "roughly a third of your total damage", cỡ một phần ba tổng
      damage của bạn, và warcry tự động cũng được tính.
  - term: Deep Breaths
    why: >-
      Warcry cooldown nhanh hơn 35% và warcry to hơn. Lấy nó ngay lúc bạn đổi
      sang Earthshatter; guide nói "do not forget this", đừng quên cái này.
  - term: Resolute Technique
    why: >-
      Hit của bạn không bị evade và không bao giờ crit. Không phải lo
      accuracy trên gear, và ba mod map thôi còn quan trọng.
  - term: Versatile Combatant
    why: >-
      Cho một nhân vật slam cap block ở 68% attack và 65% spell với một cái
      shield tử tế, thứ bình thường ngoài tầm với.
  - term: Timeclasp
    why: >-
      Hai cái, trên Mercenary, mỗi cái có 15% increased skill effect duration
      trở lên. "Mandatory for the swap", bắt buộc cho cú đổi.
    detail: >-
      Nó cần node Legendary Rings để đeo chúng. [[Runegraft of the Warp]] và
      một support duration tốt hơn cho bạn thay chúng về sau.
  - term: Breathstealer
    why: >-
      Trên Mercenary, anoint [[Deep Breaths]]. Cũng "mandatory for the swap".
      Cần node Legendary Gloves.
  - term: Living Lightning Support
    level: recommended
    why: >-
      Tạo mấy con minion sét nhỏ được tính là đồng minh, nên [[Rallying Cry]]
      của chính bạn exert trọn 25%. Cần một dòng cố định "adds lightning
      damage to attacks" bất kỳ trên gear của bạn.
  - term: Loyal Bodyguard
    level: recommended
    why: >-
      Một phần năm mỗi cú hit chuyển sang Mercenary khi life của nó cao hơn
      của bạn.
  - term: Runegraft of the Warp
    level: recommended
    why: >-
      Món lớn đầu tiên phải mua ở map Tier 16. Có nó thì buff của Mercenary
      "rarely, if ever" rớt — hiếm khi, nếu có.
  - term: Kaom's Binding
    level: recommended
    why: >-
      Một cây belt trên Mercenary biến một phần physical damage của quái gần
      đó thành fire. Guide gọi nó là món "you never replace", không bao giờ
      thay.
  - term: Echoes of Creation
    level: recommended
    why: >-
      Stage cuối: 10–15% more damage với mỗi warcry đang exert một đòn đánh,
      trả bằng 15–20% life của bạn thành physical damage mỗi lần.

labs:
  - lab: Normal
    node: "Ascendant: Strength and Dexterity, then Passive Point"
    why: "Hai node Ascendant nhỏ. Toàn bộ lời bình của guide là \"It's only up from here!\" — từ đây chỉ có đi lên."
  - lab: Cruel
    node: "Ascendant: Slayer"
    why: "Bước lớn của campaign. Life leech không bị xóa khi đầy life, cộng culling strike và area of effect. Một node nhỏ thứ hai bù phần Dexterity với Intelligence mà slam thiếu."
  - lab: Merciless
    node: "Ascendant: Saboteur"
    why: "30% area of effect, 15% cooldown recovery và 20% chance gây 50% more area damage. Guide: \"a lot better than it may look at first glance\", tốt hơn nhiều so với cái nhìn đầu tiên."
  - lab: Eternal
    node: Noble Blood
    why: "Chạy nó khi bạn sẵn sàng đổi, và chuyển sang [[Luminary]] ở altar: [[Noble Blood]], Legendary Gloves, Legendary Rings, [[Loyal Bodyguard]] và [[Bestowed Knighthood]]. Mang theo respec point — mỗi node Ascendant bạn gỡ tốn 5 điểm."

stages:
  - id: acts-1-3
    phase: early
    image: spectral-throw
    title: Act 1–3
    levels: Level 1–37
    uses: >-
      [[Spectral Throw]] tới level 12, rồi [[Sunder]] với bất kỳ weapon hai
      tay nào, và axe hai tay từ Act 2 trở đi.
    changes: >-
      [[Intimidating Cry]] tới cùng Sunder, và [[Autoexertion]] nhận phần bấm
      nó ở level 24. Bạn đi đường qua projectile damage ở Act 1 rồi refund nó
      ở level 12.
    links:
      - name: Level 1–11
        gems: [Spectral Throw, Volley Support, Chance to Bleed Support]
      - name: Level 12–17
        gems: [Sunder, Ruthless Support, Chance to Bleed Support]
      - name: Level 18–23
        gems: [Sunder, Melee Physical Damage Support, Ruthless Support]
      - name: Level 24–37
        gems: [Sunder, Melee Physical Damage Support, Fortify Support, Ruthless Support]
      - name: Warcry
        gems: [Intimidating Cry, Autoexertion, Seismic Cry, Herald of Ash]
      - name: Di chuyển
        gems: [Leap Slam, Faster Attacks Support, Momentum Support, Rage Support]
      - name: Utility
        gems: [Blood Rage, Frostblink, Vulnerability]
    moveOn: "Sunder đã nằm trong four-link, Autoexertion đang hét thay bạn, và Labyrinth đầu tiên đã xong."
    details:
      - title: Gear trong campaign
        body: |
          Physical damage trên weapon trước. Rồi life với resistance trên mọi thứ khác, trên base armour ở chỗ nào được.

          Một ngoại lệ: không có dòng life trên body armour, để bạn lấy được cái Life Mastery cho 15% increased maximum life đúng vì chuyện đó. Life regeneration cũng bị tính là một dòng life.

          Về mana, một jewel có physical attack damage leeched as mana, mua hoặc roll bằng [[Orb of Alteration]]. Tới level 65 guide muốn có một mana flask với prefix Enduring.
      - title: Các mốc trên cây
        body: |
          - Martial Experience ngay từ đầu, cùng cái Two Hand Mastery lấy damage lên quái rare và unique.
          - [[Measured Fury]]: warcry exert thêm một đòn đánh, nên [[Intimidating Cry]] phủ ba cú slam chứ không phải hai.
          - Cái Warcry Mastery chặn warcry exert travel skill. Chưa có nó thì một cú [[Leap Slam]] chen giữa tiếng hét và cú slam làm phí một lần exert.
          - [[Resolute Technique]], và bỏ [[Precision]].

          Muốn có đường đi chính xác thì mở planner ở mục Nguồn. Nó có một bản cây cho từng dải level.
      - title: Level 1 tới 12
        body: |
          Scion khởi đầu với [[Spectral Throw]]. Setup đầu tiên của planner thêm [[Sniper's Mark]] và [[Decoy Totem]] cho boss, và [[Leap Slam]] với [[Frostblink]] để di chuyển. Giữ Frostblink ở level 1.

          Mua luôn [[Earthshatter]] ở level 12 và để nó lên level trong bộ weapon thứ hai. Bạn sẽ không dùng nó trong năm mươi level.
  - id: acts-4-10
    phase: early
    image: sunder
    title: Act 4–10
    levels: Level 38–67
    uses: >-
      [[Sunder]] với [[Fist of War Support]], warcry trên [[Autoexertion]], và
      [[Rallying Cry]] của chính bạn có [[Herald of Purity]] chống lưng.
    changes: >-
      Thêm hai Labyrinth nữa với tư cách Ascendant: Slayer, rồi Saboteur.
      [[Molten Shell]] lên [[Cast when Damage Taken Support]], và
      [[Enduring Cry]] được lôi ra khi đánh boss.
