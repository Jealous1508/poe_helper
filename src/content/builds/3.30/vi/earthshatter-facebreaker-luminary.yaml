    moveOn: "bạn có Facebreaker, hai Timeclasp, một Breathstealer đã anoint, một shield, một amulet có physical damage cố định — và Warrant của một con Swiftblade."
    details:
      - title: Link thứ sáu
        body: |
          Planner liệt hai bản của setup này, một bản có [[Melee Physical Damage Support]] làm viên thứ sáu và một bản không.

          FAQ của tác giả giải thích vì sao về sau anh bỏ nó: trên giấy nó là support damage tốt nhất nhưng mang 10% less attack speed, và "you can't one hit monsters harder than you already do" — đã một đòn chết quái thì không thể một đòn chết mạnh hơn nữa. [[Pulverise Support]] có penalty tương tự mà vẫn ở lại, vì area of effect của nó làm nhiều gai trúng hơn.
      - title: Mana không cần flask
        body: |
          "Non-Channelling Skills have −X to Total Mana Cost" trên cả hai ring và amulet cho bạn bỏ mana flask. Recipe ở bench thường tìm thấy ở map đỏ cao, nên hãy mua đồ có sẵn hoặc đeo Praxis cho tới lúc đó.
      - title: Unique rẻ, và một dòng trên flask
        body: |
          [[Carnage Heart]] sửa resistance với attribute và cộng damage, vì node Slayer làm bạn lúc nào cũng được tính là đang leech. Belt of the Deceiver là "a hard belt to beat early on", cây belt khó có gì hơn ở giai đoạn đầu.

          Đặt "reduced effect of Shock on you" lên một flask. Guide đòi chống shock ở mọi stage và chưa bao giờ nói thẳng ra vì sao.
      - title: Tìm Mercenary khi chưa là Luminary
        body: |
          Bạn không phải chờ. Theo FAQ của guide, thêm vào ngày 13/11:

          1. Khi còn là Ascendant, gặp một con Swiftblade có support duration trên [[Rallying Cry]] và lý tưởng là có [[Pride]], hãy chọn Rematch và đánh thắng nó. Nó rơi ra [[Mercenary Warrant]] của nó.
          2. **Chưa dùng Warrant vội.**
          3. Chạy Labyrinth thứ tư, đổi sang Luminary và lấy [[Noble Blood]].
          4. Dùng Warrant, đánh thắng nó lần nữa, và giờ game mới cho bạn thuê nó.

          Trong 3.30, một tờ Warrant mở một khu vực tái đấu tên Proving Grounds và không còn đặt chung với map. Các bước của guide thì đọc theo kiểu nào cũng như nhau.
  - id: luminary-swap
    phase: endgame
    image: breathstealer
    title: "Cú đổi: bản chạy được đầu tiên"
    levels: Map đỏ
    uses: >-
      [[Facebreaker]], một cái shield, và không weapon. Một con Swiftblade
      thuê về cầm cây axe cũ của bạn, đeo hai ring [[Timeclasp]] và một đôi
      [[Breathstealer]] đã anoint.
    changes: >-
      Bạn đổi ascendancy và thôi sở hữu weapon. Cây đổi các node axe và
      two-hand lấy shield và block, và lấy [[Versatile Combatant]].
      [[Living Lightning Support]] thay [[Herald of Purity]];
      [[Flesh and Stone]] và [[Shield Charge]] vào.
