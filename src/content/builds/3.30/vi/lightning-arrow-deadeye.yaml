        body: |
          Câu trả lời thật lòng là chơi bản [[Kinetic Blast]] luôn. Cùng tác giả, cùng chất lượng nguồn, và mục đầu tư cao của nó nói thẳng là một map blaster truyền thống dựng trên Headhunter, [[Esh's Mirror]], Nimis và chest nổ xác.

          Giá phải trả là single target, và đó là lý do nó không phải lựa chọn ở đây. Bản đó cũng không công bố damage endgame, không có effective hit point và không có cấu hình Path of Building nào cả.

powerCurve: |
  Damage của build này có ba phần, còn phòng thủ là hai cách để không ăn trọn cú hit. Cách chia này là của chúng tôi, nhưng từng phần đều nằm trong guide hoặc dữ liệu gem. Phía damage: [[Elemental Hit of the Spectrum]] gây more damage theo mỗi loại elemental ailment trên quái, hai ring [[The Taming]] cộng increased damage cho chính những ailment đó, và crit nuôi một gói trigger dựng cho single target. Phía phòng thủ: 100% [[Spell Suppression]] và evasion. [[Wind Dancer]] không phải một lớp trong số đó: viên [[Lethal Pride]] trong file mang cái tên ấy trên nhãn, nhưng không cây nào trong file allocate keystone đó. Đằng sau chúng không có bể life lớn nào và không có động cơ hồi phục nào.

  Giai đoạn đầu, bạn chưa có thứ nào trong số đó và cũng chưa cần. Bạn lên level và vào map bằng [[Lightning Arrow]] hoặc [[Storm Rain]] với đồ rare, và lộ trình công bố bị chặn bởi Voidstone chứ không bởi currency: khoảng 9–10 tiếng để có 4 cái trong solo self-found. Mốc của tác giả còn lại cho thời điểm đó là 2–3 triệu damage mỗi giây và 3,600–4,000 life cộng energy shield. Đó là mốc Path of Building 3.29 trên đường đi lên, không phải thành tích của một nhân vật hoàn chỉnh.

  Giai đoạn giữa là lúc build thành chính nó. Quanh map Tier 16 bạn chuyển sang crit, gem thì muộn nhất tới lúc có 4 Voidstone là đã vào, rồi hai cái ring về. Dữ liệu gem cho skill sẵn chance Freeze, Shock và Ignite, nên những ailment nó đếm đến từ chính các cú hit của bạn, và hai ring lại đếm đúng những ailment đó thêm lần nữa. Ghi chú của tác giả bảo ưu tiên hai cái ring, và cũng nói build vẫn chạy được khi không có chúng. Còn bước này lớn cỡ nào thì không ai nói được cho bạn: Path of Building endgame hiện Total DPS bằng 0, nên không tồn tại con số nào có nguồn.

  Về cuối, tiền chuyển từ gear sang cây: viên Lethal Pride đúng seed, thứ mà ghi chú của tác giả muốn có vì chance gây double damage trên notable, rồi tới [[Thread of Hope]] và [[Unnatural Instinct]]. Không nguồn nào mô tả viên nào trong ba viên này là món mua để phòng thủ. Thứ không lớn lên là bể máu. File endgame công bố có 4,562 life, không cao hơn bao nhiêu so với mốc 3,600–4,000 của lúc có 4 Voidstone. Hai con số đó đến từ hai tác giả khác nhau, nên chỉ nên so một cách lỏng lẻo, nhưng cách đọc của chúng tôi là nhân vật không bao giờ trở nên trâu. Vì vậy build cho cảm giác nhanh và trọn vẹn từ sớm, và mỏng manh ở mọi mức budget.

upgrades:
  - step: "100% [[Spell Suppression]], trước mọi unique"
    why: >-
      Đứng đầu vì thiếu nó thì không thứ gì khác chạy được. Ở 100%, một nửa
      spell damage biến mất, và với tầm 4,500 life thì không có kế hoạch B nào
      cho spell damage. Cả hai tác giả đều ghi việc phải tự cap nó vào mục
      nhược điểm của build. Không unique nào bên dưới được nêu là nguồn cho
      suppression, nên không món nào trong danh sách này là lý do để chờ.
  - step: "Hai ring [[The Taming]]"
    why: >-
      Unique đầu tiên mà tác giả bảo bạn ưu tiên.
      [[Elemental Hit of the Spectrum]] gây 10% more damage theo mỗi loại
      elemental ailment trên quái, và mỗi ring cộng (30–40)% increased
      elemental damage cho chính những ailment đó, kèm resistance. Dòng của
      ring là increased chứ không phải more, nên nó cộng vào phần increased
      damage sẵn có của bạn và không phải một multiplier thứ hai. Ghi chú của
      tác giả rõ ràng ở cả hai phía: build vẫn chạy được khi không có cặp này,
      và chúng thuộc loại ring tốt nhất bạn đeo được cho tới khi có những cái
      ring đắt hơn rất nhiều. Không nguồn nào đo xem chúng thêm được bao nhiêu,
      hay định giá chúng cho 3.30.
  - step: "Gói trigger: [[Manaforged Arrows Support]] bắn [[Storm Rain]], và crit của nó cast [[Tornado]]"
    why: >-
      Bạn trả bằng gem và socket, không phải currency.
      [[Cast On Critical Strike Support]] là thứ biến crit của Storm Rain thành
      Tornado, còn [[Power Charge On Critical Support]] biến chúng thành power
      charge. Nó thêm damage single target và giữ power charge đầy, còn trong
      map thì gần như không làm gì. Vì vậy chúng tôi đặt nó dưới hai ring, thứ
      cộng thêm vào mọi phát bạn bắn. Thứ tự này là của chúng tôi. Trong file
      của tác giả, các gem trigger đã được cắm từ loadout trước khi có ring,
      hợp với một thứ tốn socket chứ không tốn currency.
  - step: "Phần còn lại của setup công bố: [[The Fledgling]], [[Hyrri's Truth]], [[Daresso's Defiance]], [[Spine Bow]] và quiver tự craft, một [[Stygian Vise]]"
    why: >-
      Đây là những món mà file endgame giả định bạn có. Không nguồn nào xếp
      hạng chúng với nhau hay định giá chúng, nên chúng tôi cũng không. Có hai
      điều cần dè chừng. Theo chính ghi chú của tác giả, chest là lựa chọn rẻ:
      damage gần ngang [[Hyrri's Ire]] mà không có chút spell suppression nào
      của cây đó. Cách đọc của chúng tôi là helmet cũng chiếm một slot mà đồ
      rare lẽ ra có thể mang suppression, nên hãy đếm lại suppression sau mỗi
      lần đổi. Và trong 3.30, bảo vệ mod ở bench tính giá theo loại item, nên
      bow và quiver tự craft có thể đắt hơn trước.
  - step: "[[Lethal Pride]] có hai hoặc ba notable double damage"
    why: >-
      Từ đây tiền đổ vào cây chứ không vào gear. Bạn mua một cái roll chứ
      không mua món đồ: ghi chú của tác giả đòi chance gây double damage trên
      hai hoặc ba notable, và file công bố dùng seed 13348 ở socket cạnh
      [[Wind Dancer]]. Nó không cho bạn Wind Dancer, và nó không phải viên
      jewel phòng thủ; công dụng còn lại mà tác giả nêu cho nó là Strength.
      File thêm Thread of Hope sớm hơn viên này một loadout. Chúng tôi vẫn đặt
      Lethal Pride trước vì nó là viên duy nhất trong ba viên được ghi chú của
      tác giả giải thích. Đó là quyết định của chúng tôi.
  - step: "[[Thread of Hope]], rồi [[Unnatural Instinct]]"
    why: >-
      Thread of Hope với tới một cụm không nối với đường đi của bạn mà không
      phải trả điểm cho mấy node travel, và không gì thay được nó. Unnatural
      Instinct cho mấy small passive quanh nó: mật độ chỉ số, không hơn, mua
      khi mấy nâng cấp rẻ đã xong. Đây là chỗ build hết rẻ mà chưa mạnh lên rõ
      rệt.
  - step: "[[Nimis]] và [[Headhunter]], phần trên cùng trong file của tác giả"
    why: >-
      Đứng cuối, và chưa ai đo: không nguồn nào đặt con số lên món nào trong
      hai món. Cả hai nằm trong các loadout sau của chính file tác giả. Trên
      Maxroll, chúng tôi tìm thấy chúng ở mục aspirational của guide
      [[Kinetic Blast]] và của guide cho gem này, còn trong guide Storm Rain
      thì không. Nimis là ring. Trong loadout "Uber Endgame" của tác giả, nó
      thế chỗ một trong hai ring The Taming, và
      [[Returning Projectiles Support]] rời main link vì cái ring tự cho
      projectile quay về. Vậy sự đánh đổi là phần increased damage theo
      ailment và resistance của cái ring thứ hai, đổi lấy một socket support
      trống. Headhunter làm map dày nhanh hơn và chẳng làm gì khi đánh boss.
      Chưa ai cân sự đánh đổi này bằng con số.

play:
  mapping: |
    Setup công bố là một attack, một mark và một gói trigger tự nổ, ở +218% movement speed. Không nguồn nào viết ra một rotation cho nó. Các bước dưới đây là các link công bố đọc theo thứ tự, và chỗ nào là cách đọc của chúng tôi thì có ghi rõ.

    1. **Đếm phòng thủ trước khi mở map**, nếu bạn vừa đổi gear: [[Spell Suppression]] 100% trước, rồi evasion, rồi resistance.
    2. **Bắn vào pack một hai phát rồi đi tiếp.** [[Elemental Hit of the Spectrum]] nổ trên mục tiêu, [[Returning Projectiles Support]] khiến mỗi projectile hit lần nữa trên đường quay về, và [[Mirage Archer Support]] bắn tiếp phía sau bạn.
    3. **Di chuyển bằng [[Blink Arrow]] và [[Frostblink]].** Mọi loadout Elemental Hit trong file của tác giả đều có cả hai.
    4. **Để [[Sniper's Mark]] tự dính.** Nó mỗi lúc chỉ đánh dấu một mục tiêu và không làm gì cho clear. Không loadout nào trong file của tác giả cast nó bằng tay: các loadout sớm link nó với [[Mark On Hit Support]], còn link endgame đặt nó ngay trong gói trigger.
    5. **Đừng dừng lại.** Build không có động cơ hồi phục và không có bể máu lớn. Nếu bạn chết trong khi suppression đã cap và resistance đã ở mức 71/75/75 như file công bố, lý do thường là bạn đứng yên quá lâu.

    Gói trigger sẽ trông như đang ngồi không trong map. Chuyện đó là bình thường: nó tồn tại cho single target, còn clear của bạn là main skill.

    Không nguồn nào liệt kê map mod cần tránh cho build này, nên chúng tôi cũng không liệt kê.
  bossing: |
    Hãy đọc phần này như các cơ chế xếp theo thứ tự chúng tác động, không phải một kế hoạch đánh boss đã được thử. Path of Building công bố đặt mục tiêu là một con boss chung chung và không hiện con số damage nào, và không nguồn nào thử build này với uber boss.

    1. **[[Sniper's Mark]] tự lên boss.** Nó là multiplier single-target của bạn. Trong file của tác giả, hoặc Mark On Hit hoặc gói trigger đặt nó giùm bạn; với gói trigger, nó dính ngay khi gói bắt đầu nổ.
    2. **Đánh liên tục.** Số mana bạn tiêu kích [[Storm Rain]], crit của nó cast [[Tornado]] qua gói trigger, và [[Power Charge On Critical Support]] giữ power charge đầy để crit tiếp tục xảy ra. Gói này chạy nhờ chính các đòn đánh của bạn, nên bạn ngừng thì nó ngừng. Vế cuối đó là cách đọc của chúng tôi từ các link.
    3. **Cho ailment một nhịp để dính.** Skill và hai ring đều đếm ailment đang có trên quái, và dữ liệu gem cho skill sẵn chance Freeze, Shock và Ignite. Cách đọc của chúng tôi là mấy phát đầu gây ít damage nhất, rồi damage leo dần từ đó. Không nguồn nào nói bao nhiêu ailment trụ được trên một con boss.
    4. **Né bằng cách di chuyển, rồi bắn lại.** [[Mirage Archer Support]] bắn tiếp trong lúc bạn chạy. Suppression làm spell hit nhỏ lại và evasion làm attack trúng ít hơn, nhưng đằng sau chúng không có bể máu lớn nào cho cú hit lọt qua.

    Thứ không đổi: map Tier 17 cần đầu tư lớn theo lời cả hai tác giả, và uber bossing chưa được kiểm chứng. Nếu mục tiêu của bạn là uber boss thì đây là build sai.

deaths:
  - situation: "Spell damage, ngay sau một lần đổi gear"
    cause: >-
      Suppression đã tụt dưới 100%. Ở mức cap, một nửa spell damage biến mất;
      dưới mức đó, có những spell tới nguyên vẹn trên tầm 4,500 life. Ghi chú
      của tác giả nói [[Daresso's Defiance]] không mang suppression, trong khi
      Hyrri's Ire thì có, và cách đọc của chúng tôi là [[The Fledgling]] cũng
      chiếm một slot helmet mà đồ rare lẽ ra dùng được cho việc đó.
    fix: >-
      Đếm suppression sau mỗi lần đổi gear và vá xong trước map kế tiếp. Cả
      hai tác giả đều nêu đây là việc build để lại cho bạn tự làm.
  - situation: "Chết trong khi suppression đã cap và resistance đã ở mức 71/75/75 như file công bố"
    cause: >-
      Đứng yên. Build không có động cơ hồi phục và không có bể máu lớn. File
      công bố hiện 63% evade chance, nên phần attack còn lại nhắm vào bạn sẽ
      rơi lên 4,562 life.
    fix: >-
      Di chuyển liên tục, và để [[Mirage Archer Support]] bắn trong lúc bạn
      chạy. Thứ tự sửa là suppression, rồi evasion, rồi resistance. Nếu cả ba
      đã xong, thêm một món đồ nữa thường không phải câu trả lời.
  - situation: "Map Tier 17 và uber boss"
    cause: >-
      Cả hai tác giả đều nói map Tier 17 cần đầu tư lớn, và một trong hai
      người chỉ nói build "sẽ không làm cho chúng trở nên dễ dàng". Không
      nguồn nào thử nó với uber boss, và Path of Building công bố không được
      cấu hình cho việc đó.
    fix: >-
      Coi cả hai là nằm ngoài những gì build đã được chứng minh là làm được.
      Không nguồn nào đưa cách chữa bằng gear, nên chúng tôi không tự bịa. Nếu
      nội dung này là mục tiêu của bạn, hãy chọn một build được viết cho nó.

troubleshooting:
  - symptom: "Path of Building hiện Total DPS bằng 0"
    cause: >-
      File endgame công bố cũng y như vậy. Gần như chắc chắn đó là bản fork
      Path of Building 3.29 không tính nổi setup trigger, chứ không phải số 0
      thật.
    fix: >-
      Nhân vật của bạn không hỏng gì cả. Nhưng cũng không có gì để so: không
      tồn tại con số damage có nguồn ở bất kỳ mức budget nào, còn mấy con 1
      triệu và 2–3 triệu là mốc tiến độ của một tác giả khác cho 2 và 4
      Voidstone.
  - symptom: "Đổi gem xong mà chơi vẫn như mọi bow build khác"
    cause: >-
      Thiếu một trong những mảnh dựng trên gem này. Chưa có ring
      [[The Taming]] thì không có phần thưởng thứ hai theo ailment, còn không
      có [[Trinity Support]] thì mất multiplier mà gem được chọn vì nó.
    fix: >-
      Kiểm tra Trinity nằm trong link chính, và xem cả hai ring đã lên người
      chưa. Nếu bạn đổi gem trước khi có hai ring thì đó đúng là thứ tự các
      nguồn dùng, và chuyện này là bình thường cho tới khi bạn có chúng.
  - symptom: "Gói trigger như không làm gì trong map"
    cause: >-
      Chuyện bình thường. Thực tế nó chỉ dành cho single target. Clear của bạn là
      main skill cùng [[Returning Projectiles Support]] và
      [[Mirage Archer Support]].
    fix: >-
      Hãy đánh giá nó trên boss, đừng đánh giá trên pack.
  - symptom: "Power charge tụt và gói trigger chỉ thỉnh thoảng mới nổ"
    cause: >-
      Gói này chạy theo hai bước: số mana bạn tiêu kích Storm Rain qua
      [[Manaforged Arrows Support]], rồi crit của Storm Rain lo phần còn lại,
      với [[Power Charge On Critical Support]] nạp lại số charge giữ cho crit
      tiếp tục xảy ra. Cách đọc của chúng tôi là crit chance quá thấp làm vòng
      lặp đó gãy ở bước thứ hai. Không nguồn nào ghi đây là một lỗi; nó suy ra
      từ chữ trên gem.
    fix: >-
      Kiểm tra crit chance của bạn trong Path of Building. Trong file công
      bố, [[Precision]] do [[Hyrri's Truth]] cấp, và amulet đó còn mang crit
      multiplier. Nếu bạn chưa chuyển sang crit thì gói này chưa đến lúc phải
      chạy.
  - symptom: "Đã cắm [[Lethal Pride]] mà [[Wind Dancer]] không có trên cây của bạn"
    cause: >-
      Vốn dĩ nó không nằm ở đó. File ghi nhãn viên jewel là "13348; 3; Wind
      Dancer", và cách đọc của chúng tôi là phần cuối chỉ cái socket để cắm,
      tức socket cạnh keystone đó. Lethal Pride thêm một mod vào mỗi notable
      trong bán kính của nó. PoEDB ghi ba keystone nó có thể đặt lên cây và
      Wind Dancer không nằm trong số đó, và không cây nào trong file allocate
      keystone này.
    fix: >-
      Không có gì phải sửa. Thứ cần kiểm là cái roll: ghi chú của tác giả đòi
      chance gây double damage trên hai hoặc ba notable của bạn. Tìm trên
      trade theo số seed, đừng tìm theo tên item, và kiểm seed đó trong Path
      of Building, đúng socket đó, trước khi trả tiền.
  - symptom: "Build đắt lên mà không thấy mạnh hơn"
    cause: >-
      Đây là lời phàn nàn thường gặp về mức budget cao. Mấy viên jewel ở đó
      tác động qua cây: chance gây double damage, Strength, small passive.
      Không phần nào trong đó hiện ra thành tốc độ.
    fix: >-
      Đó là build, không phải nhân vật của bạn. Nếu thứ bạn muốn mua bằng số
      tiền đó là tốc độ clear, bản [[Kinetic Blast]] của cùng archetype có
      hướng dẫn đầu tư cao tốt hơn. Các loadout [[Nimis]] và [[Headhunter]]
      trong file của tác giả thì không kèm con số nào.

patch:
  - note: >-
      **3.30 không đụng tới build này, và đó chính là lý do để chọn nó.**
      [[Deadeye]] không được nhắc trong patch note. [[Lightning Arrow]],
      Elemental Hit và [[Storm Rain]] cũng vậy. Bow không nhận một thay đổi
      balance nào — chỉ hai bản sửa ngoại hình. Bạn đang thừa hưởng một bộ khung
      đã được kiểm chứng ở 3.29, nguyên vẹn.
  - entry: bug-fixes
    note: >-
      **Một dòng có thể quan trọng mà chưa ai thử.** Sources of Direct Flight
      giờ áp đúng khoảng bay tối đa cho projectile quay về. Build này chạy
      [[Returning Projectiles Support]]. Không nguồn nào phân tích tương tác đó.
  - entry: ruthless-changes
    note: >-
      **Ở đây không có gì phải học lại, nhưng biết cái bẫy thì tốt.** Một danh
      sách dài thay đổi ascendancy trong patch note 3.30 nằm ở phần riêng của
      Ruthless và không áp dụng cho game thường. Deadeye không nằm trong cả hai
      danh sách, nên chưa bài launch nào đọc sai về build này — nhưng vài bài đã
      đọc sai về class khác.
  - entry: meta-crafting-costs
    note: >-
      **Bow và quiver tự craft có thể đắt hơn.** Bảo vệ mod ở bench giờ tính giá
      theo loại item, và recipe đã chuyển sang Nightmare Map. Chưa có giá 3.30
      cho cả hai craft.
  - entry: new-uniques
    note: >-
      **Chưa rõ.** Chưa ai soi mấy unique mới với build này. Đáng tự kiểm trước
      khi bạn chốt theo danh sách item công bố.

strengths:
  - "Dễ chơi: một attack chính, một mark, và một gói trigger tự nổ."
  - "Cực kỳ linh hoạt. Setup công bố chạy +218% movement speed."
  - "Lên nhanh: khoảng 9–10 tiếng tới 4 Voidstone trong solo self-found."
  - "Vào cửa rẻ. File công bố khởi đầu bằng ring rare, còn hai cái ring định hình nó tới ở mid game."
  - "3.30 không đổi gì ở nó, nên kiến thức 3.29 áp dụng nguyên xi."
  - "Không cần Mageblood, không cần Headhunter, không cần cặp Forbidden để chạy được."
weaknesses:
  - "Build kiểu đừng-để-bị-trúng. 4,562 life, và phòng thủ là các lớp chứ không phải một bể máu."
  - "Bạn phải tự hoàn thiện phòng thủ. Suppression không tự đến kèm gear."
  - "Không tồn tại con số damage có nguồn ở bất kỳ budget nào. Path of Building endgame hiện số 0."
  - "Map Tier 17 cần đầu tư lớn, chính hai tác giả tự thừa nhận."
  - "Uber bossing chưa được kiểm chứng. Chưa ai cấu hình Path of Building để đánh một con nào."
  - "[[Lethal Pride]] phải mua theo seed chứ không theo tên, khiến một món bắt buộc trở nên khó mua."
avoidIf: >-
  Chọn build khác nếu bạn muốn đứng yên mà đánh, nếu bạn muốn một build hứng
  damage thay vì né damage, hoặc nếu bạn ghét phải tự đếm chỉ số phòng thủ sau
  mỗi lần đổi gear. Cũng bỏ qua nếu mục tiêu của bạn là uber boss: không nguồn
  nào thử build này với uber, mà trên site này có những build khác được viết
  đúng cho việc đó. Còn nếu bạn chỉ muốn tốc độ clear thuần, bản
  Kinetic Blast của cùng archetype có hướng dẫn đầu tư cao tốt hơn.

