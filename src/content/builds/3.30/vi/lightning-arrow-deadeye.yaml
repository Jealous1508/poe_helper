          Trên trade, tìm theo seed. Cái nhãn trong file, "13348; 3; Wind Dancer", theo cách đọc của chúng tôi là seed, số notable có double damage, và socket: viên jewel cắm vào socket cạnh [[Wind Dancer]] và không cho bạn keystone đó. Nếu không tìm ra seed này, ghi chú của tác giả chỉ đòi hai hoặc ba notable double damage, nên một seed khác làm được điều đó trên những notable bạn đã allocate là thay thế được. Hãy kiểm trong Path of Building trước khi trả tiền.
