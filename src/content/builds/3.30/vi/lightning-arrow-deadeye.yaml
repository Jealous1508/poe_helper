name: Lightning Arrow / Elemental Hit of the Spectrum Deadeye
tagline: >-
  Deadeye bow crit, clear cả màn hình một nhát và sống bằng cách không để bị
  trúng. Vào cửa rẻ nhất trong bốn build, và khó làm trâu nhất.
class: Ranger
ascendancy: Deadeye
role: endgame
budget: high
budgetNote: >-
  **Không tác giả nào công bố budget cho build này.** Maxroll không đưa con số
  Divine nào trên bất kỳ trang Deadeye nào của họ, còn trang guide thì không có
  mục budget. Thứ bạn phải mua là bộ khung bow crit cộng hai ring
  [[The Taming]]; phần còn lại là đồ rare bạn tự craft hoặc mua. Có một search
  snippet gắn con số budget ~38 chaos vào một Path of Building của Fubgun, nhưng
  nó thuộc file league-start 3.29, không phải file này, nên chúng tôi không trích
  lại.
mainSkill: Elemental Hit of the Spectrum
image: elemental-hit-of-the-spectrum
hero: art-deadeye
tags: [Bow, Elemental, Crit, Mapper]
ratings: { clear: 5, bossing: 3, survivability: 2, ease: 4 }
verified: "2026-11-13"
confidence: predicted
confidenceNote: >-
  **Bốn điểm số trên là cách đọc của chúng tôi, không phải của nguồn nào.** Không
  tác giả nào của build này công bố điểm clear, bossing, survivability hay ease —
  chúng tôi đã kiểm cả ba trang Maxroll và trang guide. Clear và ease suy ra từ
  chính các mục định tính của tác giả. Bossing là 3: gói single-target có tồn
  tại, nhưng không nguồn nào thử build này với uber boss, và Path of Building của
  nó còn không được cấu hình để đánh boss. Survivability là 2 vì chính các tác
  giả mô tả đây là build "đừng để bị trúng", với phần phòng thủ bạn phải tự hoàn
  thiện.
modes:
  ssf: >-
    Mạnh nhất trong bốn build khi chơi solo self-found. Lộ trình được công bố bị
    chặn bởi Voidstone chứ không bởi ví tiền: khoảng 3 tiếng tới boss Act 10,
    5 tiếng cho 2 Voidstone, 9–10 tiếng cho 4 cái. [[Lethal Pride]] với đúng seed
    và [[Thread of Hope]] là hai thứ bạn không mua được ngoài chợ.
  hardcore: >-
    Chưa guide nào hiện tại khuyên. 4,562 life với evasion và suppression xếp
    lớp là dạng hồ sơ trừng phạt một lỗi duy nhất, và chính các tác giả nói thẳng
    rằng bạn né damage chứ không hứng damage.

idea: |
  Đây là một nhân vật bow giết cả pack bằng một phát bắn và di chuyển liên tục. Bạn mở league bằng [[Lightning Arrow]], còn bản endgame đổi sang một transfigured gem tên [[Elemental Hit of the Spectrum]], bắn ra projectile gây fire, cold và lightning damage rồi nổ trên mục tiêu.

  Mẹo nằm ở chỗ skill gây **more** damage theo từng elemental ailment đang có trên con quái. Hai ring [[The Taming]] cộng thêm "more damage mỗi ailment" của riêng chúng lên trên, nên hai hiệu ứng nhân nhau. Đó là lý do hai cái ring đó là thứ đầu tiên bạn mua và thứ cuối cùng bạn bán.

  Phòng thủ ở đây không phải cái bể life to. Nó là 100% spell suppression, evasion cao và vài món unique xếp lớp lên nhau. Bạn sẽ có tầm 4,500 life. Chơi tốt thì chẳng gì chạm được bạn; chơi dở thì bạn chết bởi những thứ mà một build trâu đi xuyên qua.

chain:
  - label: Bắn
    text: "[[Elemental Hit of the Spectrum]] bắn một projectile hit bằng fire, cold và lightning, rồi kích nổ một vùng area of effect trên mục tiêu."
  - label: Ailment
    text: "Skill gây more damage theo mỗi elemental ailment trên quái, và [[The Taming]] lại cộng more damage mỗi ailment nữa. Hai ring, hai multiplier."
  - label: Động cơ crit
    text: "Crit kích [[Cast On Critical Strike Support]] với [[Tornado]] và [[Storm Rain]], đồng thời nạp lại power charge qua [[Power Charge On Critical Support]]."
  - label: Sống sót
    text: "100% [[Spell Suppression]], 14,550 evasion, [[Daresso's Defiance]] và một [[Lethal Pride]] seed đúng để ra [[Wind Dancer]]. Không có bể máu lớn nào."

chainDetails:
  - title: Guide tên là Lightning Arrow. Skill thì không.
    body: |
      Đây là điều đầu tiên cần biết và cũng là chỗ dễ hiểu sai nhất. Guide đặt tên Lightning Arrow, nhưng Path of Building kèm theo nó lấy **[[Elemental Hit of the Spectrum]]** làm active skill.

      [[Lightning Arrow]] là thứ bạn lên level và chạy map giai đoạn đầu. Elemental Hit of the Spectrum là đích đến. Transfigured gem này là thật và hành vi của nó được ghi trên PoEDB với wiki, cả hai đều có link ở mục Nguồn.

      Một tác giả thứ hai trên Maxroll đi tới cùng đích từ một điểm khởi đầu khác: guide [[Storm Rain]] của anh ta bảo bạn đổi sang Lightning Arrow hoặc Elemental Hit of the Spectrum khi có 4 Voidstone. Sự đồng thuận độc lập đó là lý lẽ mạnh nhất để chọn bộ khung này.
  - title: Không có con số damage nào được công bố, và chúng tôi sẽ không tự bịa
    body: |
      Path of Building endgame của build này **hiện Total DPS bằng 0**. Gần như chắc chắn đó là bản fork Path of Building 3.29 không tính nổi setup trigger, chứ không phải số 0 thật — nhưng nó có nghĩa là không tồn tại con số damage có nguồn cho build này ở bất kỳ mức budget nào.

      Mấy con 1 triệu và 2–3 triệu bạn có thể thấy được trích là chuyện khác: đó là *mốc tiến độ* của tác giả còn lại cho 2 và 4 Voidstone. Chúng là trạm dừng trên đường lên, không phải số endgame. Đừng đọc chúng như thành tích của một nhân vật hoàn chỉnh.

      Những gì Path of Building thực sự báo, tính trên **engine 3.29** vì Path of Building chưa cập nhật cho 3.30: 42,903 effective hit point, 4,562 life, 100% spell suppression, 14,550 evasion và 63% evade chance, 2,556 armour và 42% physical damage reduction, resistance 71/75/75. Mục tiêu là một con "Boss" chung chung — không Sirus, không bật uber, không cấu hình Wither.
  - title: Gói trigger thật ra làm gì
    body: |
      [[Cast On Critical Strike Support]] link [[Tornado]] và [[Storm Rain]]. Bow attack của bạn crit, hai skill kia tự nổ, và [[Power Charge On Critical Support]] giữ power charge luôn đầy để crit tiếp tục xảy ra. [[Manaforged Arrows Support]] bắn cả gói đó mà bạn không cần bấm gì.

      Nó tồn tại cho single target. Clear của bạn đến từ main skill cộng [[Returning Projectiles Support]], khiến mỗi projectile hit lần nữa trên đường quay về, và [[Mirage Archer Support]], để lại một bản sao của bạn tiếp tục bắn khi bạn chạy.
  - title: Phòng thủ đến từ đâu, và vì sao bạn phải tự hoàn thiện nó
    body: |
      Theo thứ tự quan trọng: cap spell suppression ở 100%, rồi evasion, rồi mấy món unique.

      [[Daresso's Defiance]] là chest thay cho một cây rare stack life. [[Lethal Pride]] với một seed cụ thể biến một passive notable thành [[Wind Dancer]], tức là giảm damage dựa trên evasion. Pantheon là Lunaris cộng Ralakesh.

      Cả hai tác giả đều nói cùng một điều về chuyện này: phòng thủ **không tự đến kèm gear**. Bạn phải tự đếm suppression và evasion của mình rồi vá chỗ thiếu. Đó là lý do phổ biến nhất khiến người ta bỏ build này giữa đường.
  - title: Những món mà Path of Building endgame không hề có
    body: |
      Đáng biết trước khi đi chợ, vì các bow build khác dùng hết mấy món này: **không Mageblood, không Headhunter, không cặp Forbidden Flesh và Flame, không Watcher's Eye, không awakened gem, không cluster jewel, không Nimis, không Progenesis, không Dying Sun.**

      [[Headhunter]], [[Nimis]], [[Esh's Mirror]], [[Progenesis]] và [[Dying Sun]] chỉ xuất hiện ở mục "aspirational" của một tác giả *khác*, trên bản [[Kinetic Blast]] và [[Storm Rain]] của anh ta. Nếu bạn muốn mấy món đó, build viết quanh chúng mới là build kia.

mandatory:
  - term: The Taming
    why: >-
      Hai cái. Chúng nhân lên đúng cái thứ mà skill vốn đã làm tốt nhất: damage
      theo mỗi elemental ailment trên quái. Không có cặp này thì bạn chỉ còn một
      bow crit build chung chung, chẳng còn lý do gì dùng gem này.
    detail: >-
      Prismatic ring scale damage theo từng elemental ailment quái đang chịu.
      [[Elemental Hit of the Spectrum]] tự mang multiplier *more* của riêng nó
      cho mỗi ailment, nên hai cái nhân nhau thay vì cộng nhau. Đây là món có đòn
      bẩy cao nhất trong build, và là lý do để chọn build.
  - term: Elemental Hit of the Spectrum
    why: >-
      Skill endgame. Nó không thể gây physical hay chaos damage, và chính điều đó
      bắt cả build phải thuần elemental.
  - term: Trinity Support
    why: >-
      Thưởng cho việc hit lần lượt bằng fire, cold và lightning, mà gem này tự
      làm được. Bỏ nó là mất luôn multiplier resonance, thứ mà gem được chọn vì
      nó.
  - term: Returning Projectiles Support
    why: >-
      Mỗi projectile hit lần thứ hai trên đường quay về. Gần như nhân đôi clear
      của bạn, và đó là socket mà [[Nimis]] sẽ giải phóng sau này.
  - term: Spell Suppression
    why: >-
      100%, không phải 90%. Một nửa spell damage đơn giản là không tồn tại. Với
      4,500 life thì không có kế hoạch B nào cho spell damage.
    detail: >-
      Cả hai tác giả đều ghi "bạn phải tự tinh chỉnh phòng thủ, ví dụ cap
      suppression" vào mục nhược điểm. Đây là con số duy nhất cần kiểm lại sau
      mỗi lần đổi gear.
  - term: Lethal Pride
    why: >-
      Seed phải đúng để biến một notable thành [[Wind Dancer]]. Đây là món
      mua-đúng-seed, không phải Lethal Pride nào cũng được.
    detail: >-
      File được công bố dùng seed 13348 với 3 notable. Seed khác cho chuyển đổi
      khác và sẽ không ra Wind Dancer. Tìm trên trade theo số seed, đừng tìm theo
      tên item.
  - term: Sniper's Mark
    why: >-
      Là Mark, nên mỗi lúc chỉ một mục tiêu. Nó là multiplier single-target của
      bạn và không làm gì cho clear.
  - term: Hyrri's Truth
    why: >-
      Bow damage, accuracy và crit trên cùng một amulet. Mặc định của archetype;
      bản rare thay thế thì đắt hơn mà cho ít hơn ở đây.
  - term: The Fledgling
    why: >-
      Helmet mà toàn bộ phần scale crit với projectile được dựng quanh nó. Setup
      công bố giả định bạn có nó.
  - term: Daresso's Defiance
    why: >-
      Thay chỗ cho một cây chest rare stack life. Nó là một lớp phòng thủ chứ
      không phải một bể máu, và đó chính là hình dáng của cả build này.
  - term: Thread of Hope
    why: >-
      Với tới một cụm trên cây không nối với đường đi của bạn, mà không phải trả
      điểm cho mấy node travel. Thuần hiệu quả điểm; không gì thay được.
  - term: Mirage Archer Support
    level: recommended
    why: >-
      Một tay bắn tự động thứ hai. Phần lớn cảm giác mượt khi bạn đang chạy hoặc
      đang né là nhờ nó.
  - term: Unnatural Instinct
    level: recommended
    why: >-
      Cho bạn mấy small passive chưa allocate quanh nó. Thuần mật độ chỉ số,
      không hơn. Mua khi mấy nâng cấp rẻ đã xong.
  - term: Nimis
    level: recommended
    why: >-
      Cho return projectile ngay trên ring, nhờ vậy giải phóng socket
      [[Returning Projectiles Support]] cho một gem damage. Được một tác giả khác
      nêu cho một bản khác, nên coi như chưa được kiểm chứng ở đây.
  - term: Headhunter
    level: recommended
    why: >-
      Cướp mod từ quái rare và biến map dày thành một vệt mờ. Nhắc lại: món này
      nằm trong mục aspirational của tác giả khác, không nằm trong setup công bố
      của build này.

stages:
  - id: transition-in
    image: lightning-arrow
    title: Bước vào
    levels: 4 Voidstone, level 90+
    uses: >-
      [[Lightning Arrow]] hoặc [[Storm Rain]] trong six-link, bow và quiver rare,
      đồ rare có life và resistance. Việc đổi gem sang
      [[Elemental Hit of the Spectrum]] diễn ra ở đây, không sớm hơn.
    changes: >-
      Cap [[Spell Suppression]] ở 100% trước mọi thứ khác. Mốc công bố cho giai
      đoạn này là 3,600–4,000 life cộng energy shield và 2–3 triệu damage mỗi
      giây. Đó là số Path of Building 3.29 và chúng là trạm dừng, không phải con
      số endgame.
    links:
      - name: Main skill
        gems: [Elemental Hit of the Spectrum, Trinity Support, Elemental Damage with Attacks Support, Mirage Archer Support, Returning Projectiles Support, Increased Critical Damage Support]
      - name: Mark và di chuyển
        gems: [Sniper's Mark, Dash, Second Wind Support]
      - name: Aura
        gems: [Precision, Grace]
    moveOn: "spell suppression đã 100% và bạn thấy thoải mái trong map Tier 16."
    details:
      - title: Vì sao phải chờ 4 Voidstone mới đổi gem
        body: |
          Lộ trình công bố được viết theo Voidstone chứ không theo Divine Orb, vì thứ chặn bạn là tiến độ atlas, không phải ví tiền. Đại khái: boss Act 10 trong 3 tiếng, 2 Voidstone trong 5 tiếng, 4 Voidstone trong 9–10 tiếng, tất cả trong solo self-found.

          Khoảng mục Tier 16 thì bạn chuyển sang crit. Đó là lúc [[Elemental Hit of the Spectrum]] bắt đầu hơn những gem đơn giản hơn, vì crit là thứ nuôi gói trigger.
      - title: Chết thì sửa gì trước
        body: |
          Suppression, rồi evasion, rồi resistance. Đúng thứ tự đó.

          Build này không có động cơ hồi phục và không có bể máu lớn. Nếu bạn vẫn chết trong khi suppression đã cap và resistance đã 75%, câu trả lời thường là bạn đứng yên quá lâu, chứ không phải bạn cần thêm một món đồ nữa.
  - id: the-taming-pair
    image: the-taming
    title: Budget trung bình
    levels: Hai cái ring
    uses: >-
      Hai ring [[The Taming]], [[Hyrri's Truth]], [[The Fledgling]] và
      [[Daresso's Defiance]]. Bên dưới là bow và quiver tự craft.
    changes: >-
      Đây là bước biến nó thành chính build này thay vì một bow crit build chung
      chung. Mua hai cái ring trước mọi unique khác. Mọi thứ sau chúng đều cho
      ít hơn.
    links:
      - name: Main skill
        gems: [Elemental Hit of the Spectrum, Trinity Support, Elemental Damage with Attacks Support, Mirage Archer Support, Returning Projectiles Support, Increased Critical Damage Support]
      - name: Gói trigger
        gems: [Cast On Critical Strike Support, Tornado, Storm Rain, Power Charge On Critical Support, Manaforged Arrows Support]
      - name: Mark và di chuyển
        gems: [Sniper's Mark, Dash, Second Wind Support]
    moveOn: "cả hai ring đã lên người, power charge tự giữ đầy, và gói trigger tự nổ mà bạn không cần nghĩ tới."
    details:
      - title: Mua theo thứ tự nào
        body: |
          **Không nguồn nào công bố danh sách mua có thứ tự kèm giá cho build này.** Chúng tôi sẽ không tự dựng ra một cái. Điều các nguồn thực sự khẳng định là món nào quan trọng nhất, và chuyện đó thì rõ như ban ngày: hai cái ring.

          Sau chúng, setup công bố gồm một [[Spine Bow]] tự craft và một quiver tự craft, [[Hyrri's Truth]], [[The Fledgling]], [[Daresso's Defiance]] và một [[Stygian Vise]] với abyss jewel. Chưa món nào có giá 3.30, vì dữ liệu kinh tế của league mới còn chưa tồn tại.
      - title: Gói trigger, từng socket một
        body: |
          [[Cast On Critical Strike Support]] với [[Tornado]] và [[Storm Rain]], cộng [[Power Charge On Critical Support]] và [[Manaforged Arrows Support]].

          Thực tế nó chỉ dành cho single target. Nếu bạn thấy nó như không làm gì trong map, thì đúng là vậy — clear của bạn là main skill.
  - id: high-budget
    image: lethal-pride
    title: Budget cao
    levels: Mấy viên jewel theo seed
    uses: >-
      [[Lethal Pride]] đúng seed cho ra [[Wind Dancer]], [[Thread of Hope]] để
      với tới cụm không nối, và [[Unnatural Instinct]] cho mật độ chỉ số.
    changes: >-
      Phòng thủ hết tăng nhờ gear và bắt đầu tăng nhờ cây. Đây cũng là chỗ build
      hết rẻ mà chưa mạnh lên rõ rệt, và đó là lời phàn nàn thường gặp về nó.
    links:
      - name: Main skill
        gems: [Elemental Hit of the Spectrum, Trinity Support, Elemental Damage with Attacks Support, Mirage Archer Support, Returning Projectiles Support, Increased Critical Damage Support]
      - name: Gói trigger
        gems: [Cast On Critical Strike Support, Tornado, Storm Rain, Power Charge On Critical Support, Manaforged Arrows Support]
      - name: Aura và utility
        gems: [Precision, Grace, Blood Rage]
    moveOn: "bạn đã có Lethal Pride đúng seed và cây đã hoàn thiện."
    details:
      - title: Mua timeless jewel theo seed
        body: |
          [[Lethal Pride]] roll ra một số seed, và seed quyết định notable nào trong bán kính của nó biến thành notable Karui nào. Bạn không mua "một cây Lethal Pride" — bạn mua đúng một seed cụ thể.

          Trên trade, tìm theo seed. Nếu không tìm ra, một seed khác vẫn biến được một notable trong tầm với của cây bạn thành [[Wind Dancer]] cũng là thay thế chấp nhận được, nhưng hãy kiểm trong Path of Building trước khi trả tiền.
      - title: Mức này không mua được cái gì
        body: |
          Chưa nguồn nào thử build này với uber boss trong 3.30. Path of Building công bố không được cấu hình đánh Sirus hay bất kỳ mục tiêu uber nào.

          Điều duy nhất cả hai tác giả có nói về nội dung khó: map Tier 17 cần đầu tư lớn, và một trong hai người chỉ nói build "sẽ không làm cho chúng trở nên dễ dàng". Cùng tác giả, hai mức độ khẳng định khác nhau, nên cứ đọc là "chuẩn bị vất vả với Tier 17".
  - id: map-blaster
    image: nimis
    title: Chuyển sang map-blaster
    levels: Tùy chọn, và không phải của tác giả này
    uses: >-
      [[Headhunter]], [[Nimis]], một chest tự craft làm nổ xác, và
      [[Esh's Mirror]] cho bản dùng wand. [[Progenesis]] và [[Dying Sun]] được
      nêu kèm theo.
    changes: >-
      Đây là mục aspirational của một tác giả khác cho một bản *khác*, được viết
      lại ở đây vì nó là hướng dẫn đầu tư cao duy nhất tồn tại cho archetype này.
      Không thứ gì trong đó được kiểm chứng trên build này.
    links:
      - name: Main skill
        gems: [Elemental Hit of the Spectrum, Trinity Support, Elemental Damage with Attacks Support, Mirage Archer Support, Increased Critical Damage Support, Increased Critical Strikes Support]
      - name: Gói trigger
        gems: [Cast On Critical Strike Support, Tornado, Storm Rain, Power Charge On Critical Support, Manaforged Arrows Support]
    moveOn: "không còn stage nào nữa. Từ đây bạn chọn giữa tốc độ clear và năng lực toàn diện."
    details:
      - title: Đọc cái này trước khi mua bất cứ món nào
        body: |
          Mấy món ở stage này đến từ mục "Aspirational" của tác giả Maxroll, trên guide [[Kinetic Blast]] và [[Storm Rain]] Deadeye của anh ta. Chúng không nằm trong setup công bố của build này.

          [[Nimis]] thì ăn khớp cơ chế rất rõ: nó cho return projectile ngay trên ring, nên socket [[Returning Projectiles Support]] thành một gem damage. [[Headhunter]] là món để clear map và sẽ chẳng làm gì khi đánh boss.

          Chúng tôi đánh dấu cả stage này là chưa kiểm chứng cho build này thay vì bỏ hẳn, vì lựa chọn còn lại là giả vờ như chưa ai viết gì về đầu tư cao cho bow Deadeye.
      - title: Nếu bạn chỉ muốn tốc độ clear
        body: |
          Câu trả lời thật lòng là chơi bản [[Kinetic Blast]] luôn. Cùng tác giả, cùng chất lượng nguồn, và mục đầu tư cao của nó nói thẳng là một map blaster truyền thống dựng trên Headhunter, [[Esh's Mirror]], Nimis và chest nổ xác.

          Giá phải trả là single target, và đó là lý do nó không phải lựa chọn ở đây. Bản đó cũng không công bố damage endgame, không có effective hit point và không có cấu hình Path of Building nào cả.

patch:
  - note: >-
      **3.30 không đụng tới build này, và đó chính là lý do để chọn nó.**
      [[Deadeye]] không được nhắc trong patch note. [[Lightning Arrow]],
      Elemental Hit và [[Storm Rain]] cũng vậy. Bow không nhận một thay đổi
      balance nào — chỉ hai bản sửa ngoại hình. Bạn đang thừa hưởng một bộ khung
      đã được kiểm chứng ở 3.29, nguyên vẹn.
  - entry: bug-fixes
    note: >-
      **Một dòng có thể quan trọng mà chưa ai thử.** Sources of Direct Flight
      giờ áp đúng khoảng bay tối đa cho projectile quay về. Build này chạy
      [[Returning Projectiles Support]]. Không nguồn nào phân tích tương tác đó.
  - entry: ruthless-changes
    note: >-
      **Ở đây không có gì phải học lại, nhưng biết cái bẫy thì tốt.** Một danh
      sách dài thay đổi ascendancy trong patch note 3.30 nằm ở phần riêng của
      Ruthless và không áp dụng cho game thường. Deadeye không nằm trong cả hai
      danh sách, nên chưa bài launch nào đọc sai về build này — nhưng vài bài đã
      đọc sai về class khác.
  - entry: meta-crafting-costs
    note: >-
      **Bow và quiver tự craft có thể đắt hơn.** Bảo vệ mod ở bench giờ tính giá
      theo loại item, và recipe đã chuyển sang Nightmare Map. Chưa có giá 3.30
      cho cả hai craft.
  - entry: new-uniques
    note: >-
      **Chưa rõ.** Chưa ai soi mấy unique mới với build này. Đáng tự kiểm trước
      khi bạn chốt theo danh sách item công bố.

strengths:
  - "Dễ chơi: một attack chính, một mark, và một gói trigger tự nổ."
  - "Cực kỳ linh hoạt. Setup công bố chạy +218% movement speed."
  - "Lên nhanh nhất trong bốn build: khoảng 9–10 tiếng tới 4 Voidstone trong solo self-found."
  - "Vào cửa rẻ nhất trong bốn build. Hai cái ring định hình nó là toàn bộ yêu cầu."
  - "3.30 không đổi gì ở nó, nên kiến thức 3.29 áp dụng nguyên xi."
  - "Không cần Mageblood, không cần Headhunter, không cần cặp Forbidden để chạy được."
weaknesses:
  - "Build kiểu đừng-để-bị-trúng. 4,562 life, và phòng thủ là các lớp chứ không phải một bể máu."
  - "Bạn phải tự hoàn thiện phòng thủ. Suppression không tự đến kèm gear."
  - "Không tồn tại con số damage có nguồn ở bất kỳ budget nào. Path of Building endgame hiện số 0."
  - "Map Tier 17 cần đầu tư lớn, chính hai tác giả tự thừa nhận."
  - "Uber bossing chưa được kiểm chứng. Chưa ai cấu hình Path of Building để đánh một con nào."
  - "[[Lethal Pride]] là một seed cụ thể, khiến một món bắt buộc trở nên khó mua."
avoidIf: >-
  Chọn build khác nếu bạn muốn đứng yên mà đánh, nếu bạn muốn một build hứng
  damage thay vì né damage, hoặc nếu bạn ghét phải tự đếm chỉ số phòng thủ sau
  mỗi lần đổi gear. Cũng bỏ qua nếu mục tiêu của bạn là uber boss: không nguồn
  nào thử build này với uber, mà hai trong ba lựa chọn còn lại trên site này
  được viết đúng cho việc đó. Còn nếu bạn chỉ muốn tốc độ clear thuần, bản
  Kinetic Blast của cùng archetype có hướng dẫn đầu tư cao tốt hơn.

