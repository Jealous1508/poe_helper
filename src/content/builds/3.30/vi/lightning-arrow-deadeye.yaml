name: Lightning Arrow / Elemental Hit of the Spectrum Deadeye
tagline: >-
  Deadeye bow crit, clear cả màn hình một nhát và sống bằng cách không để bị
  trúng. Vào cửa rẻ, và rất khó làm trâu.
class: Ranger
ascendancy: Deadeye
role: endgame
budget: high
budgetNote: >-
  **Không tác giả nào công bố budget cho build này.** Maxroll không đưa con số
  Divine nào trên bất kỳ trang Deadeye nào của họ, còn trang guide thì không có
  mục budget. Thứ bạn phải mua là bộ khung bow crit cộng hai ring
  [[The Taming]]; phần còn lại là đồ rare bạn tự craft hoặc mua. Có một search
  snippet gắn con số budget ~38 chaos vào một Path of Building của Fubgun, nhưng
  nó thuộc file league-start 3.29, không phải file này, nên chúng tôi không trích
  lại.
mainSkill: Elemental Hit of the Spectrum
image: elemental-hit-of-the-spectrum
hero: art-deadeye
tags: [Bow, Elemental, Crit, Mapper]
ratings: { clear: 5, bossing: 3, survivability: 2, ease: 4 }
verified: "2026-11-13"
confidence: predicted
confidenceNote: >-
  **Bốn điểm số trên là cách đọc của chúng tôi, không phải của nguồn nào.** Không
  tác giả nào của build này công bố điểm clear, bossing, survivability hay ease —
  chúng tôi đã kiểm cả ba trang Maxroll và trang guide. Clear và ease suy ra từ
  chính các mục định tính của tác giả. Bossing là 3: gói single-target có tồn
  tại, nhưng không nguồn nào thử build này với uber boss, và Path of Building của
  nó còn không được cấu hình để đánh boss. Survivability là 2 vì chính các tác
  giả mô tả đây là build "đừng để bị trúng", với phần phòng thủ bạn phải tự hoàn
  thiện.
modes:
  ssf: >-
    Một lựa chọn mạnh khi chơi solo self-found. Lộ trình được công bố bị
    chặn bởi Voidstone chứ không bởi ví tiền: khoảng 3 tiếng tới boss Act 10,
    5 tiếng cho 2 Voidstone, 9–10 tiếng cho 4 cái. [[Lethal Pride]] có roll
    tốt và [[Thread of Hope]] là hai thứ bạn không mua được ngoài chợ.
  hardcore: >-
    Chưa guide nào hiện tại khuyên. 4,562 life với evasion và suppression xếp
    lớp là dạng hồ sơ trừng phạt một lỗi duy nhất, và chính các tác giả nói thẳng
    rằng bạn né damage chứ không hứng damage.

idea: |
  Đây là một nhân vật bow giết cả pack bằng một phát bắn và di chuyển liên tục. Bạn mở league bằng [[Lightning Arrow]], còn bản endgame đổi sang một transfigured gem tên [[Elemental Hit of the Spectrum]], bắn ra projectile gây fire, cold và lightning damage rồi nổ trên mục tiêu.

  Mẹo nằm ở chỗ skill gây **more** damage theo từng loại elemental ailment đang có trên con quái: 10% mỗi loại, ghi ngay trên gem. Hai ring [[The Taming]] đếm đúng những ailment đó, nhưng dòng của chúng ghi *increased* chứ không phải more: (30–40)% increased elemental damage mỗi loại, trên mỗi ring. Increased thì cộng dồn với phần increased damage còn lại của bạn, còn more của gem nhân lên tổng đó. Tác giả gọi hai cái ring là thứ nên ưu tiên, và cũng nói build vẫn chạy được khi chưa có chúng.

  Phòng thủ ở đây không phải cái bể life to. Nó là 100% spell suppression và evasion cao, đằng sau gần như không còn gì. Bạn sẽ có tầm 4,500 life. Chơi tốt thì chẳng gì chạm được bạn; chơi dở thì bạn chết bởi những thứ mà một build trâu đi xuyên qua.

chain:
  - label: Bắn
    text: "[[Elemental Hit of the Spectrum]] bắn một projectile hit bằng fire, cold và lightning, rồi kích nổ một vùng area of effect trên mục tiêu."
  - label: Ailment
    text: "Skill gây 10% more damage theo mỗi loại elemental ailment trên quái. Mỗi ring [[The Taming]] cộng (30–40)% increased elemental damage mỗi loại. Dòng của gem là multiplier; dòng của ring thì không."
  - label: Động cơ crit
    text: "[[Manaforged Arrows Support]] tự bắn [[Storm Rain]] khi bạn tiêu mana cho attack chính. Crit của Storm Rain cast [[Tornado]] qua [[Cast On Critical Strike Support]] và nạp power charge qua [[Power Charge On Critical Support]]."
  - label: Sống sót
    text: "100% [[Spell Suppression]] và 14,550 evasion. Không có bể máu lớn nào. Chest [[Daresso's Defiance]] là lựa chọn damage giá rẻ, không phải món phòng thủ."

chainDetails:
  - title: Guide tên là Lightning Arrow. Skill thì không.
    body: |
      Đây là điều đầu tiên cần biết và cũng là chỗ dễ hiểu sai nhất. Guide đặt tên Lightning Arrow, nhưng Path of Building kèm theo nó lấy **[[Elemental Hit of the Spectrum]]** làm active skill.

      [[Lightning Arrow]] là thứ bạn lên level và chạy map giai đoạn đầu. Elemental Hit of the Spectrum là đích đến. Transfigured gem này là thật và hành vi của nó được ghi trên PoEDB với wiki, cả hai đều có link ở mục Nguồn.

      Một tác giả thứ hai trên Maxroll đi tới cùng đích từ một điểm khởi đầu khác: guide [[Storm Rain]] của anh ta bảo bạn đổi sang Lightning Arrow hoặc Elemental Hit of the Spectrum khi có 4 Voidstone. Sự đồng thuận độc lập đó là lý lẽ mạnh nhất để chọn bộ khung này.
  - title: Không có con số damage nào được công bố, và chúng tôi sẽ không tự bịa
    body: |
      Path of Building endgame của build này **hiện Total DPS bằng 0**. Gần như chắc chắn đó là bản fork Path of Building 3.29 không tính nổi setup trigger, chứ không phải số 0 thật — nhưng nó có nghĩa là không tồn tại con số damage có nguồn cho build này ở bất kỳ mức budget nào.

      Mấy con 1 triệu và 2–3 triệu bạn có thể thấy được trích là chuyện khác: đó là *mốc tiến độ* của tác giả còn lại cho 2 và 4 Voidstone. Chúng là trạm dừng trên đường lên, không phải số endgame. Đừng đọc chúng như thành tích của một nhân vật hoàn chỉnh.

      Những gì Path of Building thực sự báo, tính trên **engine 3.29** vì Path of Building chưa cập nhật cho 3.30: 42,903 effective hit point, 4,562 life, 100% spell suppression, 14,550 evasion và 63% evade chance, 2,556 armour và 42% physical damage reduction, resistance 71/75/75 (fire, cold, lightning). Mục tiêu là một con "Boss" chung chung — không Sirus, không bật uber, không cấu hình Wither.
  - title: Gói trigger thật ra làm gì
    body: |
      Trong loadout endgame công bố, đây là một six-link, và là hai trigger nối nhau. [[Manaforged Arrows Support]] tự bắn [[Storm Rain]] khi bạn đã tiêu đủ mana cho attack chính. Storm Rain là attack, nên khi nó crit, [[Cast On Critical Strike Support]] cast các spell trong link: [[Tornado]], và [[Sniper's Mark]], vốn nằm chung six-link đó. [[Power Charge On Critical Support]] biến chính những cú crit ấy thành power charge, để crit tiếp tục xảy ra. Bạn không phải bấm gì. Attack chính của bạn không nằm trong link này và crit của nó không kích gói. Chuyện cái gì kích cái gì là đọc từ chữ trên gem ở PoEDB, không phải từ tác giả: file của anh ta liệt kê link mà không giải thích.

      Nó tồn tại cho single target. Clear của bạn đến từ main skill cộng [[Returning Projectiles Support]], khiến mỗi projectile hit lần nữa trên đường quay về, và [[Mirage Archer Support]], để lại một bản sao của bạn tiếp tục bắn khi bạn chạy.
  - title: Phòng thủ đến từ đâu, và vì sao bạn phải tự hoàn thiện nó
    body: |
      Theo thứ tự quan trọng: cap spell suppression ở 100%, rồi evasion.

      [[Daresso's Defiance]] là chest trong loadout công bố, và ghi chú của tác giả không chọn nó vì phòng thủ: nó là lựa chọn rẻ, damage gần ngang [[Hyrri's Ire]], và khác với Hyrri's Ire, nó không mang spell suppression. Cũng ghi chú đó xếp một cây chest rare roll đẹp trên cả hai, với giá cao hơn nhiều. [[Lethal Pride]] không thuộc phần phòng thủ, dù cái nhãn của nó dễ khiến bạn nghĩ vậy. File đặt tên viên jewel là "Lethal Pride 13348; 3; Wind Dancer", nhưng viên jewel không cho [[Wind Dancer]]: PoEDB ghi ba keystone mà một viên Lethal Pride có thể đặt lên cây và Wind Dancer không nằm trong số đó, và không cây nào trong file allocate nó. Cách đọc của chúng tôi về cái nhãn là seed, số notable có double damage, và socket để cắm. Pantheon là Lunaris cộng Ralakesh.

      Cả hai tác giả đều nói cùng một điều về chuyện này: phòng thủ **không tự đến kèm gear**. Bạn phải tự đếm suppression và evasion của mình rồi vá chỗ thiếu. Đó là lý do phổ biến nhất khiến người ta bỏ build này giữa đường.
  - title: Những món mà loadout endgame công bố không hề có
    body: |
      Các con số trên trang này lấy từ loadout mà file mở ra sẵn, tác giả đặt tên là "Endgame no HH". Đáng biết trước khi đi chợ, vì các bow build khác dùng hết mấy món này: loadout đó **không Mageblood, không Headhunter, không cặp Forbidden Flesh và Flame, không Watcher's Eye, không awakened gem, không Nimis, không Progenesis, không Dying Sun.** Cluster jewel thì nó có cắm.

      Cũng file đó còn đi tiếp sau loadout này. Hai loadout sau thêm [[Headhunter]], và một loadout tên "Uber Endgame" đeo Headhunter, [[Progenesis]] và [[Nimis]], món cuối thế chỗ một trong hai cái ring. [[Dying Sun]] chỉ có trong file ở một loadout Tornado Shot. [[Esh's Mirror]] thì hoàn toàn không có trong file: chúng tôi chỉ tìm thấy nó trong guide của một tác giả *khác*, ở mục "aspirational" của bản [[Kinetic Blast]] Deadeye trên Maxroll.

mandatory:
  - term: The Taming
    level: recommended
    why: >-
      Hai cái. Chúng scale đúng cái thứ mà skill vốn đã làm tốt nhất: damage
      theo mỗi elemental ailment trên quái. Chính ghi chú của tác giả nói build
      vẫn chạy được khi không có chúng, và rằng bạn vẫn nên ưu tiên chúng, nên
      gem đến trước, ring theo sau.
    detail: >-
      Prismatic ring có (30–40)% increased elemental damage với hit và ailment
      cho mỗi loại elemental ailment trên quái, kèm elemental resistance và 10%
      chance Freeze, Shock và Ignite. [[Elemental Hit of the Spectrum]] mang
      riêng 10% *more* cho mỗi loại. Phần increased của ring cộng vào số
      increased damage sẵn có của bạn, còn more của gem nhân lên kết quả; chúng
      không phải hai multiplier. Trong loadout "Uber Endgame" của tác giả, một
      trong hai cái nhường slot cho [[Nimis]].
  - term: Elemental Hit of the Spectrum
    why: >-
      Skill endgame. Nó không thể gây physical hay chaos damage, và chính điều đó
      bắt cả build phải thuần elemental.
  - term: Trinity Support
    why: >-
      Thưởng cho việc hit lần lượt bằng fire, cold và lightning, mà gem này tự
      làm được. Bỏ nó là mất luôn multiplier resonance, thứ mà gem được chọn vì
      nó.
  - term: Returning Projectiles Support
    why: >-
      Mỗi projectile hit lần thứ hai trên đường quay về. Gần như nhân đôi clear
      của bạn, và đó là socket mà [[Nimis]] sẽ giải phóng sau này.
  - term: Spell Suppression
    why: >-
      100%, không phải 90%. Một nửa spell damage đơn giản là không tồn tại. Với
      4,500 life thì không có kế hoạch B nào cho spell damage.
    detail: >-
      Cả hai tác giả đều ghi "bạn phải tự tinh chỉnh phòng thủ, ví dụ cap
      suppression" vào mục nhược điểm. Đây là con số duy nhất cần kiểm lại sau
      mỗi lần đổi gear.
  - term: Lethal Pride
    why: >-
      Ở đây nó là viên jewel damage, không phải viên phòng thủ. Ghi chú của tác
      giả bảo tìm một viên đặt chance gây double damage lên hai hoặc ba notable
      của bạn. Bạn mua cái roll, không mua cái tên.
    detail: >-
      File được công bố dùng seed 13348 và ghi nhãn "13348; 3; Wind Dancer".
      Cách đọc của chúng tôi về cái nhãn là seed, số notable có double damage,
      và socket: cái socket cạnh [[Wind Dancer]], nơi mọi cây trong file đều
      cắm nó. Viên jewel không cho Wind Dancer, và không cây nào trong file
      allocate keystone đó. Seed khác đặt mod khác lên cùng những notable ấy,
      nên hãy tìm trên trade theo số seed, đừng tìm theo tên item. Tác giả cũng
      ghi rằng phần Strength nó cộng thêm là thứ cho phép anh ta dùng
      Steelskin.
  - term: Sniper's Mark
    why: >-
      Là Mark, nên mỗi lúc chỉ một mục tiêu. Nó là multiplier single-target của
      bạn và không làm gì cho clear.
  - term: Hyrri's Truth
    why: >-
      Bow damage, accuracy và crit trên cùng một amulet. Mặc định của archetype;
      bản rare thay thế thì đắt hơn mà cho ít hơn ở đây.
  - term: The Fledgling
    why: >-
      Helmet mà toàn bộ phần scale crit với projectile được dựng quanh nó. Setup
      công bố giả định bạn có nó.
  - term: Daresso's Defiance
    level: recommended
    why: >-
      Cây chest rẻ, không phải cây chest phòng thủ. Ghi chú của tác giả đặt nó
      ở mức damage gần ngang [[Hyrri's Ire]] nhưng không có spell suppression
      của cây đó, và thích movement speed nó cho ở giai đoạn đầu. Anh ta xếp
      một cây chest rare roll đẹp trên cả hai, với giá cao hơn nhiều.
  - term: Thread of Hope
    why: >-
      Với tới một cụm trên cây không nối với đường đi của bạn, mà không phải trả
      điểm cho mấy node travel. Thuần hiệu quả điểm; không gì thay được.
  - term: Mirage Archer Support
    level: recommended
    why: >-
      Một tay bắn tự động thứ hai. Phần lớn cảm giác mượt khi bạn đang chạy hoặc
      đang né là nhờ nó.
  - term: Unnatural Instinct
    level: recommended
    why: >-
      Cho bạn mấy small passive chưa allocate quanh nó. Thuần mật độ chỉ số,
      không hơn. Mua khi mấy nâng cấp rẻ đã xong.
  - term: Nimis
    level: recommended
    why: >-
      Cho return projectile ngay trên ring, nhờ vậy giải phóng socket
      [[Returning Projectiles Support]] cho một gem damage. Nó là ring, nên nó
      thế chỗ một cái [[The Taming]]: chính loadout "Uber Endgame" của tác giả
      đeo nó như vậy. Không nguồn nào đo sự đánh đổi này.
  - term: Headhunter
    level: recommended
    why: >-
      Cướp mod từ quái rare và biến map dày thành một vệt mờ. Nó không nằm
      trong loadout mà các con số của chúng tôi lấy từ đó, loadout tác giả đặt
      tên "Endgame no HH"; các loadout sau nó trong cùng file thì có thêm.

stages:
  - id: transition-in
    image: lightning-arrow
    title: Bước vào
    levels: 4 Voidstone, level 90+
    uses: >-
      [[Lightning Arrow]] hoặc [[Storm Rain]] trong six-link, bow và quiver rare,
      đồ rare có life và resistance. Việc đổi gem sang
      [[Elemental Hit of the Spectrum]] diễn ra muộn nhất là ở đây. Guide Storm
      Rain đổi ở 4 Voidstone; file của tác giả và guide của Maxroll cho gem này
      thì dùng nó ngay khi bạn có. Các link bên dưới là loadout "Starter" trong
      file của tác giả, loadout cuối cùng trước khi có hai ring. Có một thứ
      không nằm trong danh sách: Precision, do [[Hyrri's Truth]] của loadout cấp
      sẵn mà không cần socket.
    changes: >-
      Cap [[Spell Suppression]] ở 100% trước mọi thứ khác. Mốc công bố cho giai
      đoạn này là 3,600–4,000 life cộng energy shield và 2–3 triệu damage mỗi
      giây. Đó là số Path of Building 3.29 và chúng là trạm dừng, không phải con
      số endgame.
    links:
      - name: Main skill (bow)
        gems: [Elemental Hit of the Spectrum, Elemental Damage with Attacks Support, Mirage Archer Support, Trinity Support, Returning Projectiles Support, Increased Critical Damage Support]
      - name: Six-link thứ hai (body armour)
        gems: [Vaal Burning Arrow, Manaforged Arrows Support, Trinity Support, Increased Critical Damage Support, Elemental Damage with Attacks Support, Elemental Focus Support]
      - name: Aura và mark (gloves)
        gems: [Haste, Sniper's Mark, Mark On Hit Support, Grace]
      - name: Charge (helmet)
        gems: [Frostblink, Power Charge On Critical Support, Manaforged Arrows Support, Frenzy]
      - name: Trigger (boots)
        gems: [Manaforged Arrows Support, Storm Rain, Cast On Critical Strike Support, Tornado]
      - name: Di chuyển
        gems: [Blink Arrow]
    moveOn: "spell suppression đã 100% và bạn thấy thoải mái trong map Tier 16."
    details:
      - title: Khi nào thì đổi gem
        body: |
          Lộ trình công bố được viết theo Voidstone chứ không theo Divine Orb, vì thứ chặn bạn là tiến độ atlas, không phải ví tiền. Đại khái: boss Act 10 trong 3 tiếng, 2 Voidstone trong 5 tiếng, 4 Voidstone trong 9–10 tiếng, tất cả trong solo self-found.

          Riêng chuyện đổi gem thì các nguồn không khớp nhau. Guide [[Storm Rain]] đổi sau 4 Voidstone. Guide của Maxroll cho gem này bảo bạn đổi càng sớm càng tốt, còn file của tác giả đã có [[Elemental Hit of the Spectrum]] ngay trong loadout map đầu tiên, chỉ giữ một link [[Lightning Arrow]] cho người chưa có gem. Lý do anh ta nêu là flat damage, chỉ số mà một cây bow đầu league còn thiếu. Điều các nguồn thống nhất là thứ tự: gem trước, chuyển sang crit quanh mục Tier 16, rồi mới tới hai cái ring.
      - title: Chết thì sửa gì trước
        body: |
          Suppression, rồi evasion, rồi resistance. Đúng thứ tự đó.

          Build này không có động cơ hồi phục và không có bể máu lớn. Nếu bạn vẫn chết trong khi suppression đã cap và resistance đã ở mức 71/75/75 như file công bố, câu trả lời thường là bạn đứng yên quá lâu, chứ không phải bạn cần thêm một món đồ nữa.
  - id: the-taming-pair
    image: the-taming
    title: Budget trung bình
    levels: Hai cái ring
    uses: >-
      Hai ring [[The Taming]], [[Hyrri's Truth]] và [[The Fledgling]], bên dưới
      là bow và quiver tự craft. [[Daresso's Defiance]] đến muộn hơn một
      loadout trong file của tác giả; loadout này vẫn mặc chest rare. Các link
      bên dưới là loadout "Mid game" của anh ta, loadout đầu tiên có đủ hai
      ring. Không nằm trong danh sách: Precision, do Hyrri's Truth cấp.
    changes: >-
      Đây là bước biến nó thành chính build này thay vì một bow crit build chung
      chung. Ghi chú của tác giả bảo ưu tiên hai cái ring, và cũng nói build vẫn
      chạy được khi không có chúng. Không nguồn nào đo xem chúng thêm được bao
      nhiêu.
