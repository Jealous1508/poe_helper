    moveOn: "cả hai ring đã lên người, power charge tự giữ đầy, và các link trigger tự nổ mà bạn không cần nghĩ tới."
    details:
      - title: Mua theo thứ tự nào
        body: |
          **Không nguồn nào công bố danh sách mua có thứ tự kèm giá cho build này.** Chúng tôi sẽ không tự dựng ra một cái. Điều các nguồn thực sự khẳng định là món nào nên ưu tiên, và ghi chú của tác giả gọi thẳng tên nó: hai cái ring.

          Sau chúng, setup công bố gồm một [[Spine Bow]] tự craft và một quiver tự craft, [[Hyrri's Truth]], [[The Fledgling]], [[Daresso's Defiance]] và một [[Stygian Vise]] với abyss jewel. Chưa món nào có giá 3.30, vì dữ liệu kinh tế của league mới còn chưa tồn tại.
      - title: Gói trigger, từng socket một
        body: |
          Trong loadout "Mid game" mà các link này lấy từ đó, mọi thứ tự động đều chạy bằng [[Manaforged Arrows Support]]. Ở boots, nó bắn Frenzy và [[Storm Rain]] bằng số mana bạn tiêu cho attack chính, và [[Power Charge On Critical Support]] biến crit của chúng thành power charge. Ở body armour, nó nằm trong six-link thứ hai cùng một gem Vaal Burning Arrow; theo chính chữ trên support thì nó không trigger được Vaal skill, nên cách đọc của chúng tôi là nó bắn Burning Arrow thường của gem đó. Tác giả không giải thích link này. [[Cast On Critical Strike Support]] và [[Tornado]] hoàn toàn không có trong loadout này: chúng nằm ở boots của hai loadout trước đó, và trở lại sau một loadout dưới dạng six-link trên chest, nơi crit của Storm Rain cast Tornado và [[Sniper's Mark]].

          Thực tế nó chỉ dành cho single target. Nếu bạn thấy nó như không làm gì trong map, thì đúng là vậy — clear của bạn là main skill.
