    details:
      - title: Đọc cái này trước khi mua bất cứ món nào
        body: |
          [[Headhunter]] và [[Nimis]] nằm trong các loadout sau của chính file tác giả. Chúng không nằm trong loadout "Endgame no HH" mà các con số của chúng tôi lấy từ đó. Trên Maxroll, chúng tôi tìm thấy cả hai ở mục "Aspirational" của guide [[Kinetic Blast]] và của guide cho gem này. Trong guide [[Storm Rain]] thì chúng tôi không tìm thấy, và planner của nó không đọc được dưới dạng chữ, nên chỗ đó vẫn chưa xác nhận được. Còn [[Esh's Mirror]] và chest nổ xác thì chúng tôi chỉ tìm thấy trong guide Kinetic Blast.

          [[Nimis]] thì ăn khớp cơ chế rất rõ: nó cho return projectile ngay trên ring, nên socket [[Returning Projectiles Support]] thành một gem damage. Cái giá là một slot ring. Loadout "Uber Endgame" của tác giả đeo một [[The Taming]] và một Nimis, nên thứ bạn bỏ đi là phần increased damage theo ailment và resistance của cái ring thứ hai. Ghi chú của anh ta còn nói Nimis cho phép bạn đứng sát boss mà vẫn ăn trọn bonus tầm xa của [[The Fledgling]]. [[Headhunter]] là món để clear map và sẽ chẳng làm gì khi đánh boss.

          Chúng tôi đánh dấu cả stage này là chưa được đo thay vì bỏ hẳn: không nguồn nào đặt một con số lên bất cứ thứ gì trong đó.
