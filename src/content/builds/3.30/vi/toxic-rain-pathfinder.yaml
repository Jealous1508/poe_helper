name: Toxic Rain Pathfinder
tagline: >-
  Build bow phủ quái bằng pod độc, và hồi máu nhanh hơn tốc độ mất máu nhờ một
  life flask không bao giờ tắt. Gần như không cần gear.
class: Ranger
ascendancy: Pathfinder
role: starter
budget: starter
budgetNote: >-
  Đi hết campaign và map trắng bằng đồ tự nhặt. Nâng cấp lớn đầu tiên là cây bow
  tự craft, league trước tốn 5–10 Divine.
mainSkill: Toxic Rain
image: toxic-rain
