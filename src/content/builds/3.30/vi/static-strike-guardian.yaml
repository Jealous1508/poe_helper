    nó trông ra sao ở Act 6.

idea: |
  [[Static Strike]] là một melee attack có phần thưởng tới sau. Bạn đánh một con quái bằng vũ khí, và cú đó cho bạn một buff gọi là static energy. Khi buff còn đó, các tia tự bắn ra từ người bạn vào quái gần đó, mỗi một phần ba giây một lần, chain sang thêm mục tiêu.

  Nên nhịp chơi là: đánh một cái, rồi đi tiếp. Mấy cái tia lo phần dọn quái. Bạn không bao giờ bị buộc phải đứng trong đám quái mà vung liên tục.

  Nửa [[Guardian]] của build thì đang làm một việc hoàn toàn khác và không liên quan: nó làm bạn cực khó chết. Nhân vật được công bố block ba phần tư attack và ba phần tư spell, có mười nghìn armour, và ăn ít hơn 82% physical damage từ hit. [[Divine Shield]] rồi biến phần damage mà armour và block đã chặn thành energy shield regeneration.

  Hai nửa đó là lý do đây là một build league start chứ không phải một con glass cannon. Damage gần như hoàn toàn đến từ một skill gem bạn nhận ở Act 1 và một cây staff; phần sống sót đến từ cây passive và ascendancy, hai thứ không tốn gì ngoài passive point.

chain:
  - label: Đánh một cái
    text: "[[Static Strike]] là một attack. Đánh trúng quái cho bạn static energy trong 4 giây gốc, và nó chồng tới 3 lần."
