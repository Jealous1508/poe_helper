    url: https://pobb.in/767t-xufLl6G
    kind: pob
    note: "Mốc so sánh Slayer 3.29: 11.6M DPS, 5,556 life, 149,638 eHP, 22,589 armour, 90% physical reduction, 65% block và spell block."
  - title: "poebuilds.cc: Blade Flurry Static Strike Slayer | 3.30 League Start Guide (jungroan)"
