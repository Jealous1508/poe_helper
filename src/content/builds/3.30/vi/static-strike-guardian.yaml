    kind: guide
    note: "89.6k view. Danh sách support gem và dàn aura duy nhất được công bố cho Static Strike của tác giả này: Melee Physical Damage, Ruthless, Fortify, Trinity, Elemental Damage with Attacks, cùng Hatred và Herald of Ash. Nó là một Slayer, không phải Guardian. Video của nó quảng cáo một Path of Building leveling đầy đủ mà trang không link tới."
