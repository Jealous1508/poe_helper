  - title: "PoEDB: Static Strike"
    url: https://poedb.tw/us/Static_Strike
    kind: data
    note: "Cơ chế và mọi con số gem ở đây: duration gốc 4 giây chồng 3 lần, tia mỗi 0.32–0.4 giây, +1 chain, 4–6 mục tiêu, tia ít damage hơn 30%, 50% physical chuyển thành lightning, effectiveness 150.6%–346%, 10% chance to shock gốc từ 3.0.0. Lịch sử phiên bản dừng ở 3.28.0. Cũng là nguồn cho cách lấy gem bằng quest Act 1."
  - title: "PoEDB: The Yielding Mortality"
