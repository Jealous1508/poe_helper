confidenceNote: >-
  **Skill thì đã được kiểm chứng; còn build cụ thể này là lời khẳng định của một
  người.** Cơ chế của [[Static Strike]] đọc thẳng từ PoEDB và không có gì phải
  bàn: lần đổi gần nhất là 3.28.0 và 3.30 không nhắc tới nó ở đâu cả. Bản
  Guardian đến từ một tác giả duy nhất, Alohaa, đăng ngày 11 tháng 11 năm 2026
  dưới tiêu đề "The Strongest Leaguestarter I Ever Played" với 154,000 view tới
  ngày launch — build đơn lẻ có nhiều view nhất trong danh sách Covens của
  poebuilds.cc, cách biệt khá xa. **Nhưng planner của anh ta ghi nhãn 3.29**, và
  nó là một nhân vật level 98 đã hoàn thiện với một cặp Forbidden jewel cắm
  trong đó, không phải một lộ trình lên level. Không site guide có tên tuổi nào
  — Maxroll, Mobalytics, PoE Vault — công bố bất cứ thứ gì về Static Strike
  Guardian cho 3.30. Bốn điểm số là của chúng tôi. Thứ *được* kiểm chứng độc lập
  là chuyện Static Strike đáng làm skill league start cho 3.30: jungroan đăng
  một bản Blade Flurry Static Strike Slayer khởi đầu league cùng tuần, và một
  bản Static Strike Assassin khởi đầu khác cũng nằm trên cùng danh sách.
modes:
  ssf: >-
    Cây staff là vấn đề. [[The Yielding Mortality]] là một unique forged: PoEDB
    ghi nó rơi từ Harvest và có cả vendor recipe, [[The Enmity Divine]] cộng một
    [[Haemocombustion Scroll]]. Harvest vẫn là cơ chế "secondary" trong 3.30,
    nên Sacred Flora vẫn tự mọc trong map, nghĩa là con đường đó còn mở — nhưng
    nó là một con đường, không phải một lời bảo đảm. **Không nguồn nào bàn về
    solo self-found cho build này.**
  hardcore: >-
    Cũng không nguồn nào bàn tới. Trên giấy thì nhân vật được công bố là nhân vật
    phòng thủ tốt nhất trên site này: 219,015 effective hit point, 82% physical
    damage reduction, 75% block và 75% spell block. Hãy đọc đó như một điểm đến.
