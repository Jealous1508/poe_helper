    text: "Khi static energy còn, tia đánh quái mỗi 0.32 giây ở gem level 20, tối đa 6 mục tiêu, cộng một lần chain. Chúng gây ít damage hơn cú attack 30%."
  - label: Một nửa thành lightning
    text: "Skill chuyển 50% physical damage của nó thành lightning, nên build lớn lên theo cả physical weapon damage lẫn lightning damage."
  - label: Ailment nhân nó lên
    text: "[[The Taming]] cho 30–40% increased elemental damage với hit và ailment *cho mỗi loại* elemental ailment đang có trên quái. Static Strike tự shock được."
