sources:
  - { title: "Bản xuất dữ liệu game Path of Exile (RePoE)", url: "https://repoe-fork.github.io/", kind: data, note: "Mọi base, implicit, modifier, tier và weight được dẫn ở đây, các lựa chọn bench có liệt kê tincture, cooldown và chu kỳ Mana Burn của từng base, và mô tả của Glassblower's Bauble. Xác suất là phép tính của chúng tôi từ weight trong đó." }
