  - { title: "Maxroll crafting resources", url: "https://maxroll.gg/poe/resources/crafting-resources", kind: guide, note: "Implicit nào là dominant, các modifier bảo vệ trụ được trước những gì, và các mốc của Memory Strands. Do người chơi thử nghiệm và một phần cũ hơn 3.30." }
