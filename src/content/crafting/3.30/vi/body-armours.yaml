  - { title: "Bản xuất dữ liệu game Path of Exile (RePoE)", url: "https://repoe-fork.github.io/", kind: data, note: "Mọi base, modifier, tier, weight, Essence, implicit và giá bench được dẫn ở đây, cùng dòng chữ trong game của Eldritch currency. Xác suất là phép tính của chúng tôi từ weight trong đó." }
