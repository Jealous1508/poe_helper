name: "Wand"
short: "Một weapon một tay thường không được dùng như weapon. Wand spell, attack và minion chung một pool mà hai phần năm là caster và một phần ba là attack, nên lần craft nào cũng bắt đầu bằng việc xóa một nửa pool đó."
icon: "Prophecy Wand"
intro: >-
  Wand là weapon một tay có tối đa ba socket, và với phần lớn build, damage
  của chính nó không bao giờ được dùng tới. Một caster cầm nó vì những gì nó
  làm cho spell: increased Spell Damage, cast speed, gem level. Không gì trên
  wand caster là local, nên damage, attack speed và critical strike chance
  của base chẳng có nghĩa gì với build đó, và chỉ implicit là quan trọng.


  Nhưng wand cũng có thể là weapon attack, bắn bằng các skill wand attack,
  và có ba base được làm ra cho việc đó. Kiểu thứ ba phục vụ build minion và
  có pool riêng. Vậy nên câu hỏi giống như ở bow lại đến trước tiên:
  **đây là cây wand nào?** Ở đây câu trả lời còn quan trọng hơn, vì wand nào
  cũng roll modifier caster lẫn attack từ một pool trộn lẫn, và nửa nào bạn
  không muốn thì nửa đó cản đường bạn ở cả hai phía của item.
basics:
  itemLevel:
    text: >-
      Wand caster có hai điểm dừng. **Item level 76** mở tier cao nhất của
      Spell Critical Strike Chance và của flat damage to spells, Tier 2 của
      cast speed và của Spell Damage, và nó đủ cho gần như mọi lần craft.
      **Item level 84** mở tier cuối của cast speed (từ 83) và của Spell
      Damage. Gem level thì gần như không cần gì: họ "+1 to Level of all
      Fire Spell Skill Gems" mở từ item level 2, còn "+1 to Level of all
      Spell Skill Gems" từ 55.


      Wand attack đi theo các weapon khác: 77 cho phần lớn, 83 cho tier
      physical cuối, và attack speed xong ở 37. Wand minion muốn 60 cho "+1
      to Level of all Minion Skill Gems" và 83–84 cho các tier cao nhất của
      nó.
    breakpoints:
      - ilvl: 2
        unlocks: "\"+1 to Level of all Fire, Cold, Lightning, Chaos or Physical Spell Skill Gems\". Mở trên gần như mọi cây wand rơi ra, và hiếm ở mọi level."
      - ilvl: 55
        unlocks: "\"+1 to Level of all Spell Skill Gems\" (weight 50). Tier 3 của cast speed (21–24%)."
      - ilvl: 60
        unlocks: "Tier 3 của increased Spell Damage (70–84%) và Tier 2 của hybrid kèm Mana (37–43%), cả hai từ 58. \"+1 to Level of all Minion Skill Gems\" trên wand minion. **Mốc đầu tiên đáng craft để chạy map.**"
      - ilvl: 64
        unlocks: "Tier 2 của increased Spell Damage (85–99%) và Tier 2 của increased Fire, Cold và Lightning Damage. Tier 2 của minion damage trên wand minion."
      - ilvl: 76
        unlocks: "Tier 1 của Spell Critical Strike Chance (90–109%). Tier 1 của flat damage to spells (từ 74), Tier 1 của Critical Strike Multiplier (từ 73), Tier 2 của cast speed (25–28%, từ 72). **Đủ cho gần như mọi wand caster.**"
      - ilvl: 80
        unlocks: "Tier 1 của hybrid Spell Damage và Mana, \"Lich's\" (44–49% kèm +42–45 Mana). Tier 1 của các Damage over Time Multiplier theo loại damage (34–38%) đã mở từ 78."
      - ilvl: 84
        unlocks: "Tier 1 của increased Spell Damage, \"Runic\" (100–109%), Tier 1 của increased elemental damage và Tier 1 của minion damage. Tier 1 của cast speed (29–32%) và Tier 1 của minion attack and cast speed (23–25%) đã mở từ 83. **Trần.**"
  bases:
    text: >-
      Có 28 wand trong hai pool. Hai mươi lăm cây chung pool standard, và ba
      wand minion có một pool lớn hơn. Bên trong pool standard, ba base mang
      một implicit làm thay đổi thứ chúng roll được, nên trên thực tế có ba
      kiểu wand để craft, cộng thêm hai họ có implicit khác thường.
    types:
      - title: "Wand thường"
        pools: [standard]
        text: >-
          Mười sáu base từ Driftwood Wand tới Prophecy Wand. Phần lớn có
          implicit là increased Spell Damage, tăng dần theo level tới 36–40%
          trên Prophecy Wand; sáu base level thấp hơn (Goat's Horn, Quartz
          Wand, Spiraled Wand và các bản nâng cấp của chúng) thay vào đó có
          flat elemental damage nhỏ cho spell và attack. Tất cả đều roll
          trọn pool trộn lẫn: ở item level 84, khoảng 40% weight prefix là
          modifier caster và 36% là modifier attack.
      - title: "Wand attack: Somatic, Blasting, Kinetic"
        text: >-
          Ba base có implicit là **"Cannot roll Caster Modifiers"**. Trong
          dữ liệu chúng thuộc pool standard, nhưng implicit loại mọi
          modifier mang tag caster: Spell Damage, flat damage to spells, các
          gem level của spell, cast speed và Spell Critical Strike Chance.
          Thứ còn lại là pool của một weapon attack. Chúng cũng có các con
          số weapon tốt nhất: Kinetic Wand có 29–54 damage, 1.6 attack mỗi
          giây và 8.5% critical strike chance.
      - title: "Wand minion: Calling, Convening, Convoking"
        pools: [minion]
        text: >-
          Implicit của chúng là minion damage: 12–16%, 20–24% và 26–30%. Chỉ
          ba cây này roll các modifier minion: "Minions deal #% increased
          Damage", hybrid của nó với Mana, "+1 to Level of all Minion Skill
          Gems", và các suffix cho minion attack and cast speed và critical
          strike của minion. Chúng vẫn roll mọi thứ một wand thường roll,
          nên pool lớn hơn chứ không sạch hơn. Convoking Wand là một base
          Atlas.
      - title: "Wand Maraketh: Pagan, Heathen, Profane"
        text: >-
          Pool standard, với implicit là increased Cast Speed: 10% trên hai
          cây đầu, 14% trên Profane Wand. Cast speed mà không chiếm ô suffix
          nào.
      - title: "Wand Heist: Assembler, Congregator, Accumulator"
        text: >-
          Pool standard, với implicit là "Gain an Endurance, Frenzy or Power
          Charge every 6 seconds"; Accumulator Wand nhận hai charge. Dành
          cho build đang thiếu cách tạo charge.
    picks:
      - base: "Prophecy Wand"
        for: "Build spell, theo mặc định"
        why: >-
          36–40% increased Spell Damage trên implicit, cao nhất trong mọi
          wand. Nhiều hơn craft Spell Damage rẻ của bench (25–34%) mà không
          tốn ô nào.
      - base: "Profane Wand"
        for: "Build spell muốn cast speed hơn damage"
        why: >-
          14% increased Cast Speed trên implicit. Nó cộng vào cast speed từ
          suffix, nên một Profane Wand có roll cast speed tầm trung cast
          nhanh ngang một wand khác có roll hàng đầu.
      - base: "Convoking Wand"
        for: "Build minion"
        why: >-
          Minions deal 26–30% increased Damage, và là base cấp cao nhất duy
          nhất roll được modifier minion.
      - base: "Kinetic Wand"
        for: "Build wand attack"
        why: >-
          Implicit loại vĩnh viễn mọi modifier caster khỏi pool, và base có
          damage, tốc độ và critical strike chance tốt nhất trong mọi wand:
          66.4 damage mỗi giây trước khi tính modifier.
      - base: "Accumulator Wand"
        for: "Build cần charge"
        why: >-
          Hai charge ngẫu nhiên mỗi 6 giây từ implicit. Pool của nó là pool
          caster thường.
    impact: >-
      Với build **spell**, base quyết định một điều, là implicit. Spell dùng
      damage, cast time và critical strike chance của riêng nó, nên physical
      damage, số attack mỗi giây và 8% critical strike chance của wand không
      bao giờ được dùng tới. Quality cũng không giúp gì cho nó.


      Với build **attack**, base là weapon theo nghĩa thông thường: physical
      damage và elemental damage local cùng attack speed local đều nhân vào
      hoặc dựa trên các con số của nó. Và việc chọn giữa một wand thường và
      một Kinetic Wand quyết định pool: có hay không có hai phần năm
      modifier caster cản đường.


      Với build **minion**, base quyết định các modifier minion có roll được
      hay không.


      Một [[Blessed Orb]] roll lại con số của implicit. Không gì trong craft
      thông thường gỡ được "Cannot roll Caster Modifiers" khỏi Kinetic Wand
      hay thêm nó vào base khác.
tools:
  - method: currency
    note: >-
      Roll thường trên wand là roll xuyên qua cái nửa sai của pool. Ở item
      level 84, theo phép tính của chúng tôi từ weight, increased Spell
      Damage chiếm 10% số lần roll prefix và Tier 3 trở lên là 1 trên 115
      lần roll. Mỗi cái "+1 to Level of all Fire, Cold or Lightning Spell
      Skill Gems" là 1 trên 317 lần roll prefix, còn "+1 to Level of all
      Spell Skill Gems" là 1 trên 1,583. Cast speed chiếm 10% số lần roll
      suffix.


      [[Orb of Alteration]] là cách ổn để có một prefix caster trên wand
      leveling, và là cách chuẩn để có một prefix gem chỉ định trên wand
      Magic, với vài trăm Alteration.
  - method: bench
    note: >-
      Bench mạnh khác thường trên wand, vì vậy rất nhiều wand caster hoàn
      chỉnh phần lớn là đồ craft. Prefix: increased Spell Damage ở 45–54%
      giá 4 Chaos Orb hoặc 55–66% giá 4 Exalted Orb; flat damage to spells
      (adds 34–45 to 67–78 Fire giá 4 Chaos Orb, các bản Cold và Lightning
      cùng giá); 45–54% increased Fire, Cold hoặc Lightning Damage giá 4
      Chaos Orb. Suffix: cast speed 14–17% giá 2 Chaos Orb hoặc 18–21% giá 4
      Exalted Orb; Spell Critical Strike Chance 60–69% giá 3 Chaos Orb;
      Critical Strike Multiplier 25–28% giá 4 Chaos Orb; một Damage over
      Time Multiplier theo loại damage, 18–20%, giá 4 Chaos Orb.


      Các luật về group quyết định cái gì nằm chung được. **Increased Spell
      Damage và increased Fire, Cold hoặc Lightning Damage là một
      group**, dù roll ra hay craft: một cây wand có một trong số đó.
      **Flat Fire, Cold và Lightning Damage to Spells cũng là một
      group.** Hybrid của Spell Damage với Mana là group riêng và nằm cạnh
      cái nào cũng được. Còn "+2 to Level of Socketed Support Gems" của
      bench chung group với họ "+1 to Level of all Fire Spell Skill Gems",
      nên nó không đi cùng một cái trong họ đó được.
  - method: finishing
    note: >-
      Quality chỉ nâng physical damage, nên nó quan trọng trên wand attack
      chứ không trên wand spell hay wand minion. Weapon một tay có nhiều
      nhất ba socket. Một [[Divine Orb]] đáng giá hơn thường lệ trên wand
      caster: các tier Spell Damage rộng mười lăm điểm.
  - method: essence
    note: >-
      Mỗi phía của wand caster đều có Essence. Prefix: **Woe** cho
      increased Spell Damage (50–66% ở bậc Screaming, 83–94% ở Deafening,
      ngay dưới Tier 2 tự nhiên), và **Anguish, Suffering và
      Torment** cho flat Fire, Cold và Lightning Damage to Spells, ở khoảng
      của Tier 1 tự nhiên khi là Deafening. Suffix: **Misery** cho cast
      speed, khớp với Tier 3, 2 và 1 tự nhiên ở Screaming, Shrieking và
      Deafening (29–32%); **Scorn** cho Spell Critical Strike Chance, và
      bản Deafening của nó (110–119%) cao hơn Tier 1 tự nhiên.


      **Fear** cho minion damage trên **bất kỳ** wand nào, 83–94% ở bậc
      Deafening. Trên wand thường, đó là toàn bộ phần hỗ trợ minion mà nó có
      thể có.


      Với wand attack, Anger, Hatred và Wrath cho flat elemental damage,
      Contempt cho flat Physical Damage và Zeal cho attack speed (17–18% ở
      Deafening). Không Essence nào cho gem level hay Critical Strike
      Multiplier trên wand.
  - method: beast
    note: >-
      **Imprint** ([[Craicic Croaker]]) ở đây là đúng chỗ của nó. Cây wand
      caster kinh điển bắt đầu là một wand Magic có một prefix gem đã ngốn
      hàng trăm Alteration, và một Imprint khiến [[Regal Orb]] theo sau lặp
      lại được. **Thêm một prefix, gỡ một suffix ngẫu nhiên**
      ([[Farric Wolf Alpha]]) là ván cược yếu trên wand thường, nơi hơn một
      phần ba prefix là modifier attack.
  - method: fossil
    note: >-
      Một [[Aetheric Fossil]] ("more Caster, fewer Attack") là Fossil của
      wand: modifier caster ở weight gấp mười, modifier attack còn khoảng
      một phần bảy. Các prefix gem mang hai tag hữu ích, caster và gem, nên
      một Aetheric và một [[Faceted Fossil]] đi cùng nhau nhân chúng lên
      một trăm lần, và một Fossil theo element như [[Scorched Fossil]] đưa
      con số đó lên một nghìn cho prefix gem của element đó.


      Với wand minion, một [[Bound Fossil]] nâng các modifier Minion lên
      gấp mười.


      Wand có các modifier chỉ có từ Fossil của riêng nó, trong đó có
      "Socketed Skills deal 40% more Spell Damage" và "+1 to Level of
      Socketed Intelligence Gems", một suffix mà dữ liệu xếp dưới Faceted
      Fossil. Các tỉ lệ của chúng tôi bỏ modifier chỉ có từ Fossil ra ngoài.
  - method: harvest
    note: >-
      **Caster** (75 Primal) là reforge cần biết. Trên wand chưa khóa, bất
      kỳ cái nào trong cả chục modifier caster cũng thỏa được nó. Khi prefix
      đã khóa, chỉ hai suffix của wand thường mang tag đó: cast speed và
      Spell Critical Strike Chance, và build spell muốn cái nào cũng được.
      (Trên wand minion, minion attack and cast speed cũng mang tag đó.)


      **Critical** (150 Primal) chia làm ba ngả trên wand: Critical Strike
      Chance, vốn dành cho attack, Spell Critical Strike Chance và Critical
      Strike Multiplier. **Speed** (150 Vivid) là cast speed, attack speed
      hoặc Projectile Speed. Trên Kinetic Wand các lựa chọn caster rơi ra
      ngoài, khiến Critical và Speed sạch hơn ở đó.
  - method: veiled
    note: >-
      Các prefix unveil ra là bản sao mạnh hơn của các hybrid ở bench:
      70–79% increased Spell Damage kèm 18–20% increased Mana Regeneration
      Rate, hoặc 60–69% increased Spell Damage kèm "Gain 5% of Non-Chaos
      Damage as extra Chaos Damage". Cả hai đều thuộc group Spell Damage.
      Suffix: +24–28% cho một Damage over Time Multiplier theo loại damage,
      18–22% cast speed kèm chance to gain Arcane Surge on kill.
  - method: fracture
    note: >-
      Modifier nên fracture trên wand caster là "+1 to Level of all Spell
      Skill Gems". Nó có weight 50, không Essence nào cho nó, và các Fossil
      nâng nó lên một trăm lần vẫn để nó ở mức 1 trên 89 lần roll prefix.
  - method: meta
    note: >-
      Các khóa tốn 4 Divine Orb và 1 [[Sacred Orb]] trên wand trong 3.30.
      Hai meta-modifier khác sinh ra là để cho item này. **"Can have up to 3
      Crafted Modifiers"** (2 Divine Orb) là cách một cây wand có một prefix
      roll tốt trở thành wand hoàn chỉnh chỉ nhờ bench.
      **"Cannot roll Attack Modifiers"** (1 Divine Orb) loại khoảng một
      phần ba pool, ở cả hai phía, khỏi bất cứ thứ gì được thêm tiếp theo.
      Kể từ 3.30 nó không còn ngăn một Orb of Annulment gỡ modifier attack
      nữa: nó nắn thứ được thêm vào và không bảo vệ gì cả.
  - method: influence
    note: >-
      Bảng đầy đủ nằm trong danh sách modifier. Với build spell: "Socketed
      Skills deal 40% more Spell Damage" (item level 83) và "Gain 7–8% of
      Elemental Damage as Extra Chaos Damage" (85) của Shaper; flat Chaos
      hoặc Physical Damage to Spells của Elder; suffix "Spells have a 6–7%
      chance to deal Double Damage" (80) của Redeemer; và các prefix của
      Crusader, Warlord và Redeemer ghép flat damage to spells với 4%
      resistance penetration. Một cây wand có influence thì không fracture
      được.
  - method: corruption
    note: >-
      Một [[Vaal Orb]] có thể thay implicit bằng "+1 to Level of all Fire,
      Cold, Lightning, Chaos or Physical Spell Skill Gems", 14–18% increased
      Cast Speed hoặc +25–30% to Global Critical Strike Multiplier. Gem
      level đó là cái +1 thứ ba trên một cây wand đã có hai. Nó tốn implicit
      của base, và xác suất không được công bố.
  - method: strands
    note: "Xem phần Memory Strands bên dưới: hữu ích cho Spell Damage và cast speed, vô dụng cho các prefix gem."
memoryStrands: >-
  [[Memory Strands]] nâng tier của bất cứ thứ gì được roll ra và không tác
  động gì tới việc đó là modifier nào. Trên wand, điều đó chia các modifier
  cần có thành hai nhóm rạch ròi.


  **Được giúp:** increased Spell Damage, có năm tier thấp nhất mỗi cái
  weight 1,500 so với 40 của tier cao nhất; cast speed, với tám tier weight
  bằng nhau; Spell Critical Strike Chance. Một base có strand, roll bằng
  [[Orb of Alteration]] để lấy một prefix Spell Damage, rồi một
  [[Regal Orb]], là cách dùng tốt.


  **Không được giúp:** mọi prefix gem. Mỗi cái có đúng một tier, nên strand
  không có gì để nâng, và chúng không làm prefix đó dễ ra hơn. Một cây wand
  có kế hoạch là "tìm +1 to fire spells bằng Alteration" không được gì từ
  strand cho tới Regal Orb.


  Hãy để strand tránh xa Essence (tới 80 mỗi cái, theo bảng data-mine) và
  đừng trông chờ Fossil dùng chúng.
reading:
  intro: >-
    Đọc implicit và prefix cùng nhau rồi gọi tên cây wand. **Spell
    Damage, damage "to Spells" hoặc gem level của spell:** một wand caster,
    và dòng weapon ở đầu item không liên quan gì. **"Cannot roll
    Caster Modifiers", hoặc physical damage và elemental damage trơn:** một
    wand attack, đánh giá như mọi weapon. **Modifier minion:** một wand
    minion. Rồi đếm xem có bao nhiêu ô chứa modifier từ cái nửa sai. Trên
    wand, con số đó là lý do thường gặp khiến một item không đáng gì.
  prefixes:
    text: >-
      Wand caster có năm group ứng viên cho ba ô: increased Spell Damage
      (hoặc increased damage của một element, cùng group), hybrid Spell
      Damage và Mana, flat damage to spells, prefix gem theo element, và
      "+1 to Level of all Spell Skill Gems". Hai prefix gem là hai group
      khác nhau và cộng lại thành +2 cho một spell đúng element. Bạn muốn ba
      cái nào là tùy build: gem level cho các spell scale theo level, trên
      hết là damage over time; phần trăm và flat damage cho phần còn lại.


      Hãy để ý câu chữ. "Adds # to # Fire Damage" mà không có gì theo sau là
      modifier attack: nó cộng vào các hit đánh bằng wand. Chỉ "Adds #
      to # Fire Damage **to Spells**" mới giúp caster. Hai cái trông giống
      nhau trên item và chiếm 5% và 7% số lần roll prefix.


      Wand attack đọc như một cây bow nhỏ: flat elemental damage, hoặc ba
      prefix physical. Wand minion muốn minion damage, hybrid minion và
      Mana, và gem level của minion.
    key:
      - mod: "#% increased Spell Damage"
        why: "Prefix chính của caster. Cùng group với increased Fire, Cold hoặc Lightning Damage, và với các hybrid Spell Damage của bench và veiled."
        aim: "T3, 70–84% (ilvl 58), hoặc 55–66% của bench. T1 là 100–109% (ilvl 84)."
      - mod: "#% increased Spell Damage / +# to maximum Mana"
        why: "Phần Spell Damage thứ hai ở group riêng, nên nó nằm cạnh cái đầu được."
        aim: "T2, 37–43% (ilvl 58). T1 là 44–49% (ilvl 80)."
      - mod: "Adds # to # Fire / Cold / Lightning Damage to Spells"
        why: "Flat damage cho các spell đánh hit. Một group cho cả ba element. Các tier cao nhất có weight 50 tới 250; bench hoặc một Essence là nguồn thường dùng."
        aim: "T2 (ilvl 62). T1 cần ilvl 74, hoặc một Deafening Essence."
      - mod: "+1 to Level of all Fire / Cold / Lightning / Chaos / Physical Spell Skill Gems"
        why: "Một level cho mọi spell thuộc loại đó, gắn ở đâu cũng được. Một group cho cả năm."
        aim: "Bất kỳ (ilvl 2). Khoảng 1 trên 317 lần roll prefix."
      - mod: "+1 to Level of all Spell Skill Gems"
        why: "Khác group với bản theo element, nên hai cái cộng dồn. Weight 50."
        aim: "Cần ilvl 55. Khoảng 1 trên 1,583 lần roll prefix."
      - mod: "Minions deal #% increased Damage"
        why: "Chỉ có trên wand minion, trừ khi dùng Essence of Fear. Cùng group với Spell Damage."
        aim: "T3, 70–84% (ilvl 58). T1 là 100–109% (ilvl 84)."
      - mod: "Adds # to # Fire / Cold / Lightning Damage"
        why: "Cho wand attack. Local, và phí trên caster."
  suffixes:
    text: >-
      Với build spell có ba suffix quan trọng: cast speed, Spell Critical
      Strike Chance và Critical Strike Multiplier. Ở item level 84 chúng
      cộng lại chiếm một phần tư số lần roll suffix, và bench bán cả ba ở
      khoảng hai phần ba mức cao nhất của chúng. Caster damage over time đổi
      hai suffix critical strike lấy một Damage over Time Multiplier: các
      bản theo loại damage lên tới 34–38% và rất hiếm, và 18–20% của bench
      là cách phần lớn wand có được một cái.


      Phần còn lại là thứ cản đường. Gần một phần ba weight suffix là
      modifier attack, và pool còn chứa mana regeneration, chance to Freeze,
      Ignite và Shock, Intelligence và Projectile Speed.


      Lại hãy để ý câu chữ: "increased Critical Strike Chance" mà không có
      chữ "Spell" là modifier attack trên wand.
    key:
      - mod: "#% increased Cast Speed"
        why: "Suffix mà build spell nào cũng muốn. Tám tier với weight bằng nhau; một Essence of Misery đảm bảo nó."
        aim: "T2, 25–28% (ilvl 72). T1 là 29–32% (ilvl 83)."
      - mod: "#% increased Spell Critical Strike Chance"
        why: "Cho các spell crit. Không phải cùng modifier với \"increased Critical Strike Chance\"."
        aim: "T2, 80–89% (ilvl 59). T1 là 90–109% (ilvl 76)."
      - mod: "+#% to Global Critical Strike Multiplier"
        why: "Phục vụ cả spell lẫn attack. Không Essence nào cho nó trên wand."
        aim: "T2, 30–34% (ilvl 59). T1 là 35–38% (ilvl 73)."
      - mod: "+#% to Chaos / Cold / Fire / Physical Damage over Time Multiplier"
        why: "Cho các spell damage over time. Weight 35 tới 100 ở các tier cao nhất, nên gần như luôn là bản của bench hoặc bản veiled."
        aim: "Bench, 18–20%. T2 là 29–33% (ilvl 64)."
      - mod: "Minions have #% increased Attack and Cast Speed"
        why: "Chỉ có trên wand minion. Bench bán một bản sao yếu hơn trên mọi wand."
        aim: "T3, 17–19% (ilvl 55). T1 là 23–25% (ilvl 83)."
      - mod: "#% increased Attack Speed"
        why: "Cho wand attack, nơi nó là local. Tier cao nhất của nó chỉ cần ilvl 37."
        aim: "T1, 17–19% (ilvl 37)."
approach:
  principle: >-
    **Xóa cái nửa pool bạn không dùng, rồi mới craft.** Lần craft wand tốt
    nào cũng làm điều đó bằng cách này hay cách khác: một Aetheric Fossil,
    implicit của Kinetic Wand, một meta-modifier, hoặc bench, thứ ngay từ
    đầu đã không bao giờ đưa ra cái nửa sai. Một cây wand được craft bằng
    cách roll lại cả cái pool trộn lẫn là đang đánh nhau với một phần ba số
    modifier của chính nó.
  order:
    - title: "Gọi tên cây wand và chọn base hợp với nó"
      text: >-
        Spell: implicit bạn muốn, thường là Prophecy Wand hoặc Profane Wand.
        Attack: một Kinetic Wand, có implicit làm việc xóa thay bạn. Minion:
        một Convoking Wand, hoặc sớm hơn thì một Convening Wand.
    - title: "Quyết định build có muốn gem level không"
      text: >-
        Điều này chia wand caster làm hai. **Không gem level:** Spell Damage
        từ một Essence of Woe, phần còn lại từ bench; một lần craft ngắn và
        rẻ. **Có gem level:** prefix gem đến trước tiên và đến một mình, vì
        không gì đảm bảo nó, và phần còn lại của wand được dựng quanh nó.
    - title: "Lấy prefix gem, hoặc prefix damage tốt nhất"
      text: >-
        Một prefix gem theo element: Alteration trên wand Magic, hoặc hai ba
        Fossil trên wand Rare. Cả hai prefix gem: một "+1 to Level of all
        Spell Skill Gems" fractured và Fossil cho cái còn lại.
    - title: "Lưu nó lại"
      text: >-
        Một wand Magic có prefix gem thì lấy một Imprint trước Regal Orb.
        Một wand Rare có prefix đã xong thì lấy một khóa prefix trước khi
        đụng tới suffix, nếu nó đáng một lần khóa.
    - title: "Lấp từ bench trước khi roll thêm"
      text: >-
        Bench có Spell Damage, flat damage to spells, cast speed, cả hai
        suffix critical strike và các Damage over Time Multiplier. Với "Can
        have up to 3 Crafted Modifiers", nó cấp được một nửa cây wand. Chỉ
        roll thứ nó không bán được.
    - title: "Suffix sau cùng, bằng Essence hoặc bằng một reforge Caster"
      text: >-
        Một Essence of Misery hoặc Scorn khi không còn gì khác trên wand cần
        giữ; một reforge Caster dưới khóa prefix khi có thứ cần giữ.
  finishing: >-
    Socket và link (nhiều nhất ba), rồi một [[Divine Orb]] khi Spell Damage
    hoặc cast speed nằm thấp trong một khoảng rộng. Quality chỉ trên wand
    attack. Nếu còn một ô trống và cây wand đáng công, một
    [[Exalted Orb]] sau khi đã craft "Cannot roll Attack Modifiers" có
    khoảng gấp đôi cơ hội thêm ra thứ mà caster dùng.


    Nếu ô dành cho bench chưa dùng thì dùng đi.
  stopping: >-
    **Spell Damage từ một Essence, cast speed từ bench** là một wand caster
    cho cả campaign và map trắng. **Một prefix gem theo element cùng Spell
    Damage và cast speed craft** gánh phần lớn build spell qua map đỏ, và
    là điểm mà phần lớn người chơi nên dừng. Prefix gem thứ hai là chỗ chi
    phí nhân lên: nó nghĩa là một base fractured hoặc một chuỗi roll rất
    dài.


    Hãy cắt lỗ khi một Regal Orb hoặc một Exalted Orb đã đặt một modifier
    attack vào prefix trống cuối cùng. Ô đó chính là giá trị của cây wand.
    Quay về Imprint nếu bạn có, còn không thì bắt đầu một cây wand mới.
special:
  - mod: "+1 to Level of all Spell Skill Gems"
    source: "Prefix hiếm"
    where: "Có trong pool tự nhiên từ item level 55, với weight 50: 1 trên 1,583 lần roll prefix. Không Essence hay craft bench nào cho nó. Fossil nâng nó lên một trăm lần, thành 1 trên 89 lần roll."
  - mod: "#% increased Spell Damage / Gain #% of Non-Chaos Damage as extra Chaos Damage"
    source: "Veiled / Bench"
    where: "Unveil: 60–69% kèm 5%. Bench: 46–50% kèm 4%, giá 4 Exalted Orb. Cùng group với increased Spell Damage."
  - mod: "Minions deal #% increased Damage (on an ordinary wand)"
    source: "Essence / Bench"
    where: "Một Essence of Fear, 50–66% ở bậc Screaming tới 83–94% ở Deafening, hoặc bench ở 45–54% giá 4 Chaos Orb. Modifier tự nhiên chỉ roll trên Calling Wand, Convening Wand và Convoking Wand."
  - mod: "#% increased Spell Critical Strike Chance (110–119%)"
    source: "Essence"
    where: "Một [[Deafening Essence of Scorn]]. Tier 1 tự nhiên dừng ở 109%."
  - mod: "Socketed Skills deal 40% more Spell Damage"
    source: "Influence Shaper / Fossil"
    where: "Một prefix Shaper ở item level 83, hoặc một prefix chỉ có từ Fossil. Chỉ dành cho spell gắn trong wand, vốn có nhiều nhất ba socket."
  - mod: "+1 to Level of Socketed Intelligence Gems"
    source: "Fossil"
    where: "Một suffix chỉ có từ Fossil. Dữ liệu game xếp nó dưới [[Faceted Fossil]]."
  - mod: "Spells have a #% chance to deal Double Damage"
    source: "Influence Redeemer"
    where: "Một suffix Redeemer, 6–7% ở item level 80."
  - mod: "Trigger a Socketed Spell when you Use a Skill"
    source: "Bench"
    where: "Một suffix bench giá 3 Chaos Orb, với cooldown 8 giây. Phổ biến trên wand minion và wand tiện ích, nơi một ô suffix là thứ rẻ."
  - mod: "Cannot roll Caster Modifiers"
    source: "Implicit của base / Bench"
    where: "Implicit của Somatic Wand, Blasting Wand và Kinetic Wand, vĩnh viễn. Bench bán cùng hiệu ứng đó dưới dạng một suffix giá 1 Divine Orb, trên mọi wand, cho tới lần roll lại kế tiếp."
  - mod: "+1 to Level of all Fire Spell Skill Gems (implicit)"
    source: "Corruption"
    where: "Một [[Vaal Orb]] có thể thay implicit bằng một gem level cho một loại spell. Nó cộng dồn với cùng prefix đó."
mistakes:
  - "**Đọc \"Adds Fire Damage\" thành modifier caster.** Không có \"to Spells\" thì nó áp dụng cho attack bằng wand. \"increased Critical Strike Chance\" không có \"Spell\" cũng vậy."
  - "**Bench increased Fire Damage cạnh increased Spell Damage.** Chúng là một group. Hybrid kèm Mana mới là phần trăm thứ hai nằm vừa."
  - "**Bench \"+2 to Level of Socketed Support Gems\" lên cây wand lẽ ra phải có một prefix gem của spell.** Cùng group: nó block prefix đó."
  - "**Craft wand spell trên Kinetic Wand.** Implicit của nó cấm mọi modifier caster, vĩnh viễn."
  - "**Dùng Regal Orb lên wand Magic có prefix gem mà không có Imprint.** Một nửa số lần nó thêm một prefix, và phần lớn prefix không dành cho bạn."
  - "**Đặt một Essence of Fear lên wand thường rồi gọi nó là wand minion.** Nó có minion damage nhưng không bao giờ roll được các suffix minion hay gem level của minion."
  - "**Trông vào \"Cannot roll Attack Modifiers\" để che chắn cho một Annulment.** Kể từ 3.30 thì nó không còn làm vậy."
