name: "Belts"
short: "One pool, thirteen bases and the smallest modifier list of any equipment slot. Life is one prefix roll in five, which makes the belt the easiest item to craft well."
icon: "Stygian Vise"
intro: >-
  A belt rolls from nine prefix families and twelve suffix families. No other
  piece of equipment has so short a list, and that changes how crafting on it
  feels: the things you want are a large share of every roll. One prefix in
  five is maximum Life. More than one suffix in three is an elemental
  resistance.


  The belt also has the largest Life roll in jewellery: 130–144 at the top,
  against 115–129 on an amulet and 100–114 on a ring. For a life build it is
  the first slot to craft and the cheapest to finish.


  What it does not have is variety. The natural pool holds no damage beyond
  one attack prefix, and no attribute except Strength. A belt's extras come
  from its flask modifiers, from the bench, and above all from the base: the
  Stygian Vise's Abyssal socket is the single most valuable implicit in the
  category.
basics:
  itemLevel:
    text: >-
      Life needs very little: the top tier opens at item level 64. A belt of
      item level 72 to 75 rolls resistances of 42–45% and every Life tier,
      and is enough for most characters to the end of the Atlas.


      Above that you are buying named tiers. 84 for the top resistances and
      for the Hunter's best "increased maximum Life". 85 for the top flask
      effect and Strength. 86 only for the top Armour and the top "increased
      Elemental Damage with Attack Skills".
    breakpoints:
      - ilvl: 36
        unlocks: "**Levelling.** Life of 85–99, and resistances of 24–29% between item level 36 and 38."
      - ilvl: 64
        unlocks: "Tier 1 maximum Life, \"Fecund\" (130–144). **Life never needs more item level than this.**"
      - ilvl: 72
        unlocks: "Tier 2 resistances (42–45%). At 74–75: Strength of 43–50 and the top Mana tier."
      - ilvl: 80
        unlocks: "Tier 1 Energy Shield (48–51). At 78: Tier 1 Life regeneration (96–128 per second)."
      - ilvl: 84
        unlocks: "Tier 1 Fire, Cold and Lightning Resistance (46–48%), Tier 1 increased Flask Charges gained (35–40%), and on a Hunter belt 7–10% increased maximum Life."
      - ilvl: 85
        unlocks: "Tier 1 \"Flasks applied to you have 10–12% increased Effect\" and Tier 1 Strength (56–60)."
      - ilvl: 86
        unlocks: "Tier 1 Armour (461–540) and Tier 1 increased Elemental Damage with Attack Skills (43–50%)."
  bases:
    text: >-
      Thirteen bases, one pool. Every belt rolls the same modifiers with the
      same weights, and a belt has no numbers of its own for a modifier to
      multiply. The base is the implicit.


      That makes the choice simple for twelve of them and decisive for one.
      Every other implicit is a modifier; the Stygian Vise's is a socket.
    types:
      - title: "Ordinary belts"
        pools: [all]
        text: >-
          Leather (+25–40 maximum Life), Heavy (+25–35 Strength), Chain
          (+9–20 Energy Shield), Rustic Sash (12–24% increased Global
          Physical Damage), Cloth (15–25% Stun and Block Recovery) and
          Studded (20–30% Stun Duration on Enemies). All drop in the
          campaign.
      - title: "Atlas belts"
        text: >-
          Vanguard (+260–480 to Armour and Evasion Rating) and Crystal
          (+60–100 Energy Shield), from level 73. Both implicits were made
          much larger in 3.30, and both bases now need an Item Tier to drop.
      - title: "Stygian Vise"
        text: >-
          "Has 1 Abyssal Socket." The socket takes an Abyss Jewel, which is
          an item with modifiers of its own, so a Stygian Vise is a belt
          with six slots and a jewel. In 3.30 it is in the normal drop pool
          and needs an item of Tier 5, the highest.
      - title: "Cord Belt"
        text: >-
          "Can be Anointed." The same Oil enchantment an amulet takes, on a
          second slot. New to the normal drop pool in 3.30, with an Item
          Tier requirement the patch notes do not state.
      - title: "Heist belts"
        text: >-
          Micro-Distillery ("Can't use Flask in Fifth Slot" and "Flasks
          applied to you have 30% increased Effect"), Mechalarm (triggers a
          taunting contraption when you use a flask) and Mechanical (one
          ordinary socket). They drop from level 68 to 70.
    picks:
      - base: "Stygian Vise"
        for: "Almost every endgame build"
        why: >-
          The Abyssal socket is worth more than any modifier implicit,
          because the jewel in it can carry several modifiers and can be
          swapped without touching the belt. Craft your best belt on this
          base when you have one.
      - base: "Leather Belt"
        for: "Life, from the campaign onwards"
        why: >-
          +25–40 maximum Life above the line, on a base that drops from level
          10. With a Life prefix under it this is the standard belt until a
          Stygian Vise turns up.
      - base: "Heavy Belt"
        for: "Strength"
        why: >-
          +25–35 Strength. With a rolled Strength suffix, a belt can supply
          close to 100 Strength alone.
      - base: "Vanguard Belt"
        for: "Armour and Evasion builds"
        why: >-
          +260–480 to both, in the range of a high Armour prefix, for no slot
          at all.
      - base: "Crystal Belt"
        for: "Energy Shield builds"
        why: >-
          +60–100 Energy Shield in the implicit, more than the top Energy
          Shield prefix (48–51) under it.
      - base: "Micro-Distillery Belt"
        for: "Builds that live on four flasks"
        why: >-
          30% increased flask effect is two and a half times the best prefix
          for it. The price is the fifth flask slot.
    impact: >-
      **The implicit**, and with it the only real choice. A [[Blessed Orb]]
      rerolls the number where there is one; old Vanguard and Crystal Belts
      take their larger 3.30 values that way.


      **Whether the belt has a socket.** The Stygian Vise's Abyss Jewel is
      crafted separately and can be replaced, so the socket never becomes
      outdated.


      **Whether it can be anointed.** Only the Cord Belt.


      What the base does **not** decide: the pool, the weights, or any
      number below the line. Nothing on a belt is local.
tools:
  - method: currency
    note: >-
      Plain rolling works better here than anywhere. At item level 84 a
      prefix roll is maximum Life 1 time in 5, 100 or more about 1 in 17,
      and the top tier 1 in 50, by our arithmetic from the weights. A suffix
      roll is Fire, Cold or Lightning Resistance 36% of the time.


      That makes [[Orb of Alteration]]s a real way to reach Tier 1 Life, and
      an [[Orb of Alchemy]] or a [[Chaos Orb]] a reasonable way to get a
      usable belt, which is not true of most items.


      The rare prefix is flask effect: its top tier is about 1 prefix roll
      in 206 at item level 85 or more. The stun modifiers are the suffix
      side's filler, nearly a quarter of all suffix rolls.
  - method: bench
    note: >-
      The belt bench is strong exactly where the pool is thin.
      **Suffixes:** one resistance 29–35% for 3 Chaos Orbs (21–28% for 1 Orb
      of Alchemy), a higher top rank than rings and amulets get; a pair of
      resistances 17–20% for 3 Chaos Orbs; one element and Chaos 13–15%; two
      attributes 21–25 for 4 Chaos Orbs, the cheap way to put Dexterity or
      Intelligence on a belt; Cooldown Recovery Rate 6–8% for 2 Chaos Orbs
      or 9–12% for 4 Exalted Orbs; Flask Effect Duration 11–15% for 4
      Glassblower's Baubles.


      **Prefixes:** maximum Life 41–55 for 2 Orbs of Alchemy; 12–14%
      increased Damage for 4 Chaos Orbs, 15–17% for 4 Exalted Orbs; flask
      effect 8–10% with 20% reduced Flask Charges gained for 2 Chaos Orbs;
      Armour, Evasion or Energy Shield hybrids of 214–285 for 4 Chaos Orbs;
      24–32% increased Elemental Damage with Attack Skills for 4 Orbs of
      Alchemy.


      Groups: the bench's flask effect is the same group as the rolled one.
      Its Armour hybrids are the same group as rolled Armour.
  - method: finishing
    note: >-
      Quality comes from **Catalysts**, up to 20%, one kind at a time:
      [[Fertile Catalyst]] for Life and Mana, [[Prismatic Catalyst]] for
      resistances, [[Tempering Catalyst]] for defences,
      [[Intrinsic Catalyst]] for Strength. In 3.30 they come only from
      Ultimatum. Our sources do not say what later crafting does to the
      quality, so add it last.


      On a Stygian Vise the Abyss Jewel is part of finishing: it is its own
      item, covered in its own category. A Cord Belt can be anointed with
      Oils, which adds an enchantment and uses none of the six slots.
  - method: essence
    note: >-
      On a belt, and only on a belt among jewellery, the three elemental
      Essences give **resistances**: Anger fire, Hatred cold, Wrath
      lightning, 36–41% at Screaming, 42–45% at Shrieking and 46–48% at
      Deafening, which is Tier 1. Envy gives Chaos Resistance up to 31–35%.


      Others add what the pool lacks. **Sorrow** and **Spite:** up to 51–58
      Dexterity or Intelligence. **Doubt:** flat Evasion. **Anguish,
      Suffering, Torment:** 43–60% chance to avoid being Ignited, Frozen or
      Shocked. **Fear:** minion Life. **Zeal:** Trap and Mine Throwing
      Speed.


      Three are weaker than rolling: Woe's Energy Shield tops out at 38–43
      against 48–51, Greed gives flask Life recovery and not Life, and
      Contempt gives reflected damage.
  - method: harvest
    note: >-
      The short list makes several reforges certain with no lock at all.
      **Fire, Cold or Lightning** (50 Lifeforce): on a belt only the
      resistance of that element carries the tag, so the reforge always
      gives it. **Chaos** (100 Vivid): always Chaos Resistance, otherwise a
      weight-250 suffix. **Attack** (75 Wild): always "increased Elemental
      Damage with Attack Skills". The tier is random each time.


      **Life** (75 Wild) is the exception. Maximum Life, flask Life recovery
      and Life regeneration all carry the tag. With the suffixes locked it
      is maximum Life about three times in four.
  - method: fossil
    note: >-
      A [[Pristine Fossil]] removes the Armour and Energy Shield prefixes,
      38% of prefix rolls, and multiplies Life by ten. A
      [[Prismatic Fossil]] multiplies Elemental modifiers by six in the 3.30
      data, which on a belt means the resistances. Together they make Life
      about half of prefix rolls and a resistance about half of suffix
      rolls.


      Fossil-only belt modifiers include 20–30% increased Fire, Cold,
      Lightning, Chaos or Global Physical Damage as a prefix, 25–30%
      increased Elemental Damage and "15–20% chance to gain Onslaught when
      you use a Flask" as suffixes.
  - method: beast
    note: >-
      An **Imprint** ([[Craicic Croaker]]) is worth its beasts on a Magic
      belt with the top flask effect prefix, and on a Magic Hunter belt with
      "increased maximum Life". For ordinary Life it is not needed: the roll
      is too easy to repeat.


      **Add a prefix, remove a random suffix** ([[Farric Wolf Alpha]]) suits
      a belt whose suffixes are stun filler, which is a common state.
  - method: veiled
    note: >-
      The unveiled belt modifiers: flask effect 15–18% with 33% reduced
      Flask Charges gained, the largest version there is; Armour, Evasion or
      Energy Shield hybrids of 365–400; Cooldown Recovery Rate 13–16%; one
      element and Chaos Resistance 16–20%; two attributes 31–35.
  - method: influence
    note: >-
      **Hunter** and **Elder:** "increased maximum Life" as a prefix, 7–10%
      at item level 84 for Hunter and 8–10% at 75 for Elder, and 10–12%
      increased Attributes as a suffix. **Shaper** and **Crusader:** 16–20%
      Cooldown Recovery Rate at item level 84. **Elder** and **Warlord:**
      16–18% to all Elemental Resistances. Every list except the Hunter's
      also has a suffix of 31–35% damage during any flask effect.
  - method: meta
    note: >-
      A full lock costs 4 Divine Orbs and 8 Exalted Orbs. On a belt the
      prefixes are rarely worth it, since Life is so easy to roll again; the
      exception is a prefix side with flask effect or an influenced Life
      modifier on it. A full side also works as a block: with three suffixes
      on the belt, anything added must be a prefix.
  - method: fracture
    note: >-
      A fractured Tier 1 Life prefix is the usual start for an expensive
      belt, because every Essence afterwards can be judged on its suffixes
      alone. It rules out influence.
  - method: corruption
    note: >-
      Belt corruption implicits include 6–10% increased maximum Life, 8–10%
      increased maximum Energy Shield and 8–10% increased Area of Effect.
      Whether a corruption implicit on a Stygian Vise costs it the Abyssal
      socket is not something our sources settle; test on a cheap one before
      risking a good belt.
  - method: strands
    note: "See the Memory Strands section below: a belt's Life and resistance rolls are the kind strands improve."
memoryStrands: >-
  A belt's good modifiers are common and many-tiered: ten tiers of Life,
  eight of each resistance, ten of Strength. [[Memory Strands]] do nothing
  for how often a modifier appears and a great deal for which tier it
  arrives at, so the belt is a natural home for them.


  The fitting craft is the cheapest one: an [[Orb of Remembrance]] on a white
  belt, [[Orb of Alteration]]s for Life, a [[Regal Orb]] and
  [[Exalted Orb]]s. Those orbs spend at most 8 and 16 strands each by the
  data-mined table. An [[Orb of Alchemy]] or [[Chaos Orb]] can spend up to
  50, so the "roll the whole belt" approach that otherwise suits this slot
  is the wrong one on a strand base.


  Do not pair strands with Essences, at up to 80 each, or with Fossils and
  Harvest reforges, which do not use them by player testing.
reading:
  intro: >-
    A belt is quick to read. **Is there Life, and how much? How many of the
    suffixes are resistances or Strength?** Then one more look for anything
    with the word "Flask" in it, and a glance at the base for an Abyssal
    socket. A belt with Life over 100 and two good suffixes is already
    better than most.
  prefixes:
    text: >-
      Nine families. Life, Mana, Energy Shield and Armour are 80% of all
      prefix rolls, and for a life build only the first counts. The rest are
      two flask recovery modifiers, reflected damage, an attack damage
      prefix and flask effect.


      Because the side is so small, a second and third prefix you actually
      want are hard to find by rolling and easy to find at the bench:
      increased Damage, flask effect, a defence hybrid. Plan to roll Life
      and craft or slam the others.


      The two flask recovery prefixes, Life and Mana, are one group: a belt
      has one of them or neither.
    key:
      - mod: "+# to maximum Life"
        why: "The largest Life roll on jewellery and one prefix roll in five. The reason a belt is easy."
        aim: "T3, 100–114 (ilvl 44). T1 is 130–144 (ilvl 64)."
      - mod: "Flasks applied to you have #% increased Effect"
        why: "Raises every flask you drink. Weight 250 per tier, the rarest prefix here; the bench and veiled versions are larger but cost flask charges."
        aim: "T2, 7–9% (ilvl 65). T1 is 10–12% (ilvl 85)."
      - mod: "+# to Armour"
        why: "A large flat number for Armour builds, and common."
        aim: "T3, 323–400 (ilvl 71). T1 is 461–540 (ilvl 86)."
      - mod: "+# to maximum Energy Shield"
        why: "The Energy Shield build's Life. Nearly one prefix roll in four."
        aim: "T2, 44–47 (ilvl 74). T1 is 48–51 (ilvl 80)."
      - mod: "#% increased Elemental Damage with Attack Skills"
        why: "The only damage modifier in the natural pool. A Harvest Attack reforge always gives it."
        aim: "T3, 31–36% (ilvl 60). T1 is 43–50% (ilvl 86)."
  suffixes:
    text: >-
      Twelve families. Three resistances at 12% each, Strength and Life
      regeneration at 14% each, and three stun modifiers that together take
      a quarter of the side and help almost nobody.


      So a random suffix is useful about half the time, which is generous.
      The work on this side is tiers, not kinds: the bench reaches 29–35% of
      a resistance, a Tier 1 roll or a Deafening Essence 46–48%.


      Strength is the only attribute the pool has. Dexterity and
      Intelligence on a belt come from an Essence, a bench pair or a veiled
      pair.
    key:
      - mod: "+#% to Fire / Cold / Lightning Resistance"
        why: "A third of the suffix side, and guaranteed by the matching Essence or Harvest reforge."
        aim: "T2, 42–45% (ilvl 72). T1 is 46–48% (ilvl 84)."
      - mod: "+# to Strength"
        why: "Life and requirements for Strength builds; belts roll one tier more of it than rings or amulets."
        aim: "T3, 43–50 (ilvl 74). T1 is 56–60 (ilvl 85)."
      - mod: "+#% to Chaos Resistance"
        why: "Scarce by rolling, certain from a Chaos reforge or an Essence of Envy."
        aim: "T3, 21–25% (ilvl 56). T1 is 31–35% (ilvl 81)."
      - mod: "#% increased Flask Charges gained"
        why: "Keeps flasks running through a map. Shares a group with reduced Flask Charges used."
        aim: "T2, 29–34% (ilvl 70). T1 is 35–40% (ilvl 84)."
      - mod: "#% increased Flask Effect Duration"
        why: "The same purpose from the other end. The bench sells 11–15%."
        aim: "T2, 22–27% (ilvl 66). T1 is 28–33% (ilvl 82)."
      - mod: "Regenerate # Life per second"
        why: "For builds that live on regeneration; filler for the rest. Goes one tier higher on a belt than elsewhere."
        aim: "T2, 64–96 (ilvl 74). T1 is 96–128 (ilvl 78)."
approach:
  principle: >-
    **On a belt the common modifiers are the good ones, so roll boldly and
    spend the planning on the base and on the one rare extra.** Life and
    resistances will come. What will not come by itself is a Stygian Vise, a
    flask effect prefix or an influenced Life modifier, and those are what
    separate a good belt from the best one.
  order:
    - title: "Get the base first"
      text: >-
        A Stygian Vise if you have one, otherwise the implicit your build
        uses: Leather for Life, Heavy for Strength, Vanguard or Crystal for
        defences. Item level 72 to 75 unless the plan names a higher tier.
    - title: "Decide whether the belt has a rare extra"
      text: >-
        Most belts do not, and are Life, resistances and a bench craft. If
        yours does (flask effect, Hunter Life, Cooldown Recovery), that
        modifier sets the order of everything else.
    - title: "Roll the common part with the cheapest tool that works"
      text: >-
        Alterations for a single Tier 1 Life. An Essence for a guaranteed
        top resistance. Pristine and Prismatic Fossils for Life and
        resistances in one roll. Each is cheap enough to repeat until the
        belt is right.
    - title: "Use the certain reforges to finish a side"
      text: >-
        A missing resistance, Chaos Resistance or the attack prefix can each
        be named by a Harvest reforge on a belt. They reroll the whole item
        unless one side is locked, so they are a way to start a belt or to
        finish a locked one, not to patch an unlocked one.
    - title: "Add the rare extra where a full side forces it"
      text: >-
        With three suffixes on the belt, an Exalted Orb or a conqueror's
        Exalted Orb must add a prefix. On a pool this small that turns a
        long shot into a fair one.
    - title: "Bench last"
      text: >-
        The belt bench is good enough that the last slot is never wasted: a
        35% resistance, increased Damage, flask effect, Cooldown Recovery.
  finishing: >-
    The bench slot, then Catalysts: [[Fertile Catalyst]]s on a Life belt add
    up to a fifth to the Life roll's effect. A [[Divine Orb]] when Life is at
    the bottom of its tier; on a belt that one number is most of the item.


    Then the parts that are not on the belt: an Abyss Jewel for a Stygian
    Vise, an anointment for a Cord Belt.
  stopping: >-
    Life of 100 or more, two suffixes at Tier 3 or better (a resistance of
    36%, Strength of 43), and a bench craft: that belt lasts the whole Atlas
    and costs very little.
    Tier 1 Life with three good suffixes is the next step and still cheap by
    the standards of other slots.


    The cost multiplies only when you add the rare extra. Before paying for
    it, compare with the same currency spent on a Stygian Vise and a good
    jewel, which is usually the larger upgrade.
special:
  - mod: "Has 1 Abyssal Socket"
    source: "Base implicit"
    where: "The Stygian Vise. In 3.30 it drops in the normal pool on Tier 5 items only. A Hollow Fossil's text is \"Has an Abyssal socket\"; whether that works on a belt could not be confirmed, so treat the base as the only source."
  - mod: "#% increased maximum Life"
    source: "Hunter / Elder influence"
    where: "A prefix: 7–10% on a Hunter belt at item level 84, 8–10% on an Elder belt at 75. Also a corruption implicit of 6–10%."
  - mod: "#% increased Cooldown Recovery Rate"
    source: "Influence / Veiled / Bench"
    where: "16–20% as a Shaper or Crusader suffix at item level 84; 13–16% unveiled; 9–12% from the [[Crafting Bench]] for 4 Exalted Orbs."
  - mod: "Flasks applied to you have #% increased Effect / #% reduced Flask Charges gained"
    source: "Veiled / Bench"
    where: "15–18% with 33% reduced charges unveiled; 11–14% with 33% for 4 Exalted Orbs or 8–10% with 20% for 2 Chaos Orbs at the bench. Same group as the rolled flask effect."
  - mod: "+# to Dexterity / +# to Intelligence"
    source: "Essence / Bench / Veiled"
    where: "Not in the natural belt pool. Up to 51–58 from an Essence of Sorrow or Spite; 21–25 to two attributes from the bench; 31–35 to two unveiled."
  - mod: "#% chance to Avoid being Ignited / Frozen / Shocked"
    source: "Essence"
    where: "43–46% to 56–60% from an Essence of Anguish, Suffering or Torment. A belt-only use of those Essences."
  - mod: "You are affected by Delirium Fog"
    source: "Corrupted Essence"
    where: "The single modifier of the new [[Essence of Trickery]], a belt prefix with a required level of 85. The data marks it as a corruption-only Essence, like Horror and Insanity; how it is obtained could not be confirmed."
  - mod: "10% increased Movement Speed during any Flask Effect"
    source: "Corrupted Essence"
    where: "An [[Essence of Insanity]] suffix. The other three on a belt: \"Gain Alchemist's Genius when you use a Flask\" (Horror), +50% Chaos Resistance during any Flask Effect (Delirium), 5% elemental penetration during any Flask Effect (Hysteria). All come from corrupting an Essence monster with a [[Remnant of Corruption]]."
  - mod: "Equipped Magic Flasks have 30% increased effect on you if no Flasks are Adjacent to them"
    source: "Essence"
    where: "An [[Essence of Desolation]] prefix. The data shows that Essence working on Normal items only and holding the belt's other modifiers to level 15 and below, so expect little else on the belt. Our sources do not cover how it is found."
  - mod: "#% chance to gain Onslaught when you use a Flask"
    source: "Fossil"
    where: "15–20%, a suffix that only rolls during a Fossil craft."
  - mod: "Can be Anointed"
    source: "Base implicit"
    where: "The Cord Belt. The anointment is an enchantment added with Oils, not one of the six modifiers."
mistakes:
  - "**Crafting the best belt on the wrong base.** Everything on this page costs the same on a Stygian Vise, and only one of them ends with an Abyssal socket."
  - "**Expecting Life from an Essence of Greed.** On a belt it gives flask Life recovery. Life is rolled; it is one prefix in five."
  - "**Locking an ordinary Life prefix.** Tier 1 Life is about 1 prefix roll in 50. A lock costs 4 Divine Orbs and 8 Exalted Orbs."
  - "**Using a Life reforge and expecting maximum Life.** Three belt modifiers share the tag. Fire, Cold, Lightning, Chaos and Attack are the certain ones."
  - "**Benching flask effect on a belt that rolled it.** Same group. Craft something else and keep the rolled one, which costs no flask charges."
  - "**Chaos-rolling a belt that has Memory Strands.** One Chaos Orb can spend up to 50 of them."
verified: "2026-11-19"
sources:
  - { title: "Path of Exile game data export (RePoE)", url: "https://repoe-fork.github.io/", kind: data, note: "Every base, modifier, tier, weight, Essence, Fossil multiplier and bench cost quoted here. The odds are our arithmetic from its weights." }
  - { title: "Content Update 3.30.0: official patch notes", url: "https://www.pathofexile.com/forum/view-thread/4013680", kind: official, note: "Item Tiers, the Stygian Vise and Cord Belt in the normal drop pool, the larger Atlas implicits, and the 3.30 cost of the protection modifiers." }
  - { title: "3.29.0 patch notes", url: "https://www.pathofexile.com/forum/view-thread/3985332", kind: official, note: "Ultimatum as the only source of Catalysts." }
  - { title: "poedb: Bestiary recipes", url: "https://poedb.tw/us/Bestiary_Recipe", kind: data, note: "The Imprint and add-a-prefix recipes and the beasts they need." }
  - { title: "poedb: Horticrafting", url: "https://poedb.tw/us/Horticrafting", kind: data, note: "Lifeforce costs of the elemental, Chaos, Attack and Life reforges." }
