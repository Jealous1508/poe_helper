name: "One-Handed Maces"
short: "The one-handed class with the kindest physical pool: nearly half of all prefix rolls are physical. Strength only, a stun implicit, and an exploding suffix nothing else here can have."
icon: "Behemoth Mace"
intro: >-
  A one-handed mace is the physical weapon of the Strength character, usually
  carried beside a shield. What you craft is the same as on any physical
  weapon, **physical damage per second**: the base's damage, plus flat
  physical damage, multiplied by increased physical damage and by attack
  speed.


  What makes maces worth their own page is the pool. On an axe or a sword
  the three physical prefixes are under 30% of prefix rolls. On a one-handed
  mace they are 46%, the same weights a two-handed mace has. Plain tools
  that are a poor bet on the other one-handed classes work here, and that
  changes which tool you reach for first.


  Sceptres look like maces and are not: they are a separate item class with
  a caster pool, and they have their own category.
basics:
  itemLevel:
    text: >-
      Item level 77 is enough for a normal mace: it opens the best flat
      Physical Damage and the best attack speed, and everything but the last
      tier of the two percentage prefixes. Item level 83 opens that last
      tier.


      Beside a shield the mace is your only weapon, so it is the item where
      a higher item level earns its price soonest. If you craft one weapon
      this league, an item level 83 base is a reasonable place to spend.
    breakpoints:
      - ilvl: 35
        unlocks: "**Levelling.** Tier 5 increased Physical Damage (85–109%) and Tier 5 of the hybrid with Accuracy (35–44%)."
      - ilvl: 46
        unlocks: "Tier 4 increased Physical Damage (110–134%) and Tier 4 flat Physical Damage (adds 13–18 to 27–31)."
      - ilvl: 60
        unlocks: "Tier 3 increased Physical Damage (135–154%), Tier 3 hybrid (55–64%), Tier 2 attack speed (23–25%), and every unveiled modifier. **The first item level worth crafting for maps.**"
      - ilvl: 68
        unlocks: "The lowest item level at which Shaper, Elder and the conqueror influences have modifiers, including Shaper's exploding suffix."
      - ilvl: 73
        unlocks: "Tier 2 increased Physical Damage (155–169%) and Tier 2 hybrid (65–74%). Tier 1 Critical Strike Chance and Tier 1 Critical Strike Multiplier (both 35–38%)."
      - ilvl: 77
        unlocks: "Tier 1 flat Physical Damage (adds 22–29 to 45–52) and Tier 1 attack speed (26–27%). **Enough for everything except the last tier of the two percentage prefixes.**"
      - ilvl: 83
        unlocks: "Tier 1 increased Physical Damage, \"Merciless\" (170–179%), and Tier 1 hybrid, \"Dictator's\" (75–79% with Accuracy). **The ceiling for a physical mace.**"
  bases:
    text: >-
      There are 28 one-handed maces in one pool. Every one needs Strength
      and nothing else, and every one has 5% base critical strike chance.
      They differ in damage per hit, attacks per second and the implicit.
    types:
      - title: "Ordinary maces"
        pools: [all]
        text: >-
          Twenty-two bases from Driftwood Club to Nightmare Mace. The
          implicit is reduced Enemy Stun Threshold: 10% on most, 15% on the
          six slow, heavy ones (Stone Hammer, Ceremonial Mace, Rock Breaker,
          Ornate Mace, Gavel and Auric Mace). The top-tier four are Legion
          Hammer, Pernach, Auric Mace and Nightmare Mace.
      - title: "Maraketh maces"
        text: >-
          Wyrm Mace, Dragon Mace and Behemoth Mace. The implicit is
          increased Attack Speed, 4% on the first two and 6% on the Behemoth
          Mace. It is attack speed on the weapon, so it is local, and it is
          the only implicit in the category that adds damage.
      - title: "Heist maces"
        text: >-
          Flare Mace, Crack Mace and Boom Mace, the "experimented" bases
          from Heist. The implicit is "Trigger Level 10 Fiery Impact on
          Melee Hit with this Weapon" (level 15, then 20 on the Boom Mace).
          Their physical damage is a little below ordinary maces of the same
          level. They are for builds that want that triggered skill.
    picks:
      - base: "Behemoth Mace"
        for: "The best all-round endgame base"
        why: >-
          49–74 at 1.35 attacks per second with 6% increased Attack Speed on
          the implicit. Counting the implicit it attacks about 1.43 times
          per second, which puts its damage level with the heaviest maces
          while hitting about a fifth more often. It needs 220 Strength.
      - base: "Gavel"
        for: "The biggest hit"
        why: >-
          54–101 at 1.15 attacks per second: the highest damage per hit and
          the highest base damage per second (89.1) of the ordinary maces,
          and it drops from level 60. Its implicit is the larger stun one,
          15% reduced Enemy Stun Threshold.
      - base: "Auric Mace"
        for: "A consistent heavy hit"
        why: >-
          65–82 at 1.2 attacks per second (88.2 per second). The range is
          the narrowest of the top maces, so the minimum hit is the highest
          in the category. Also 15% reduced Enemy Stun Threshold.
      - base: "Nightmare Mace"
        for: "Attack speed without a Maraketh base"
        why: >-
          38–80 at 1.4 attacks per second, the fastest of the ordinary
          endgame maces, with 82.6 damage per second. The Legion Hammer has
          the same speed six levels earlier.
      - base: "Boom Mace"
        for: "Builds made for its trigger"
        why: >-
          "Trigger Level 20 Fiery Impact on Melee Hit with this Weapon" on
          39–81 at 1.3 attacks per second. Take it only when the build is
          designed around that implicit; otherwise it is a slightly weaker
          mace.
    impact: >-
      **The damage numbers every local modifier multiplies.** They are
      small on a one-handed base, so flat Physical Damage is a large part of
      the weapon: the best flat prefix adds 22–29 to 45–52, about half of a
      Gavel's own damage.


      **Attacks per second**, 1.15 to 1.4, and on a Maraketh mace a few
      percent more that no craft can add.


      **The implicit.** Stun threshold, attack speed or the Heist trigger.
      A [[Blessed Orb]] rerolls a value that has a range; these are fixed
      numbers.


      **Strength.** 212 on the top ordinary bases, 220 on the Behemoth
      Mace, and no other attribute.


      **Not the pool**: all 28 roll the same modifiers at the same
      weights.


      And **the other hand**. With a shield, the mace makes every hit and
      is the whole of your weapon damage: one weapon, the whole weapon
      budget. With a second weapon, most attacks alternate between the two,
      local modifiers count only for the hand that swings, and global ones
      count on every hit.
tools:
  - method: currency
    note: >-
      At item level 83 the three physical prefixes are 46% of every prefix
      roll, by our arithmetic from the weights: flat Physical Damage 22%,
      each percentage family 12%. One prefix roll is Tier 3 or better of a
      percentage, pure or hybrid, about 1 time in 90, and flat Physical
      Damage of Tier 3 or better about 1 in 26. "Merciless" is about 1 in
      1,270.


      Compare an axe: 29.5% physical, a Tier 3 percentage about 1 in 140,
      "Merciless" 1 in 1,970. On a mace
      [[Orb of Alteration]]s are a sound way to roll one good physical
      prefix, and a Rare mace off the ground is far more likely to be worth
      fixing.
  - method: bench
    note: >-
      Increased Physical Damage: 40–59% for 4 Orbs of Alteration, 60–79%
      for 8, 80–99% for 4 Chaos Orbs, 100–129% for 4 Exalted Orbs. Flat
      Physical Damage: adds 6–8 to 13–15 for 4 Orbs of Transmutation, 7–11
      to 16–19 for 2 Orbs of Alchemy, 13–17 to 26–30 for 4 Chaos Orbs.
      Attack speed: 8–10% for 6 Orbs of Alteration, 11–15% for 2 Chaos
      Orbs, 16–20% for 4 Exalted Orbs. Critical Strike Chance 25–27% or
      Critical Strike Multiplier 25–28% for 4 Chaos Orbs. Chance to deal
      Double Damage: 4–5% for 8 Chaos Orbs, half of what a two-handed mace
      gets.


      The group rule is the same as on every physical weapon. The bench
      percentage shares a group with rolled pure increased Physical Damage
      and not with the Accuracy hybrid; bench flat damage shares a group
      with rolled flat damage. Read the prefixes, then choose the craft.
  - method: finishing
    note: >-
      Quality to 20% with [[Blacksmith's Whetstone]]s first: it is physical
      damage on the base. A one-handed mace has at most three sockets, so
      the prefix that raises the level of socketed melee gems, over 6% of
      prefix rolls here, is only worth a slot if your main skill fits in
      them.
  - method: essence
    note: >-
      **Contempt** guarantees flat Physical Damage: adds 20–26 to 40–47 at
      Deafening, between natural Tier 2 and Tier 1. The weak strengths are
      worth knowing on a levelling mace: Wailing gives adds 8–12 to 17–20
      and works once, on a Normal item. **Zeal** guarantees attack speed,
      28–30% at Deafening against 26–27% for natural Tier 1. **Loathing**
      guarantees Critical Strike Chance. **Dread** gives increased Impale
      Effect, 22–25% at Deafening, which the natural pool lacks.
  - method: beast
    note: >-
      An **Imprint** ([[Craicic Croaker]]) before a [[Regal Orb]] protects a
      Magic mace that was hard to roll, and that includes one with a rare
      influenced suffix. **Add a prefix, remove a random suffix**
      ([[Farric Wolf Alpha]]) is a better bet on a mace than on any other
      one-handed weapon: nearly half of what it can add is physical.
  - method: veiled
    note: >-
      Unveiled prefixes: 120–139% increased Physical Damage with a 21–25%
      chance to Impale, Bleed, Poison or Blind, in the same group as pure
      increased Physical Damage. Unveiled suffixes: 6–7% chance to deal
      Double Damage, and two with groups of their own that stack with the
      ordinary versions, 12–15% attack speed and +36–40% Critical Strike
      Multiplier while a Rare or Unique enemy is within 6 metres.


      A [[Veiled Chaos Orb]] is a full reroll with one of those choices
      attached. On a mace the rest of the reroll is friendly, which makes
      it a reasonable tool even without a lock.
  - method: harvest
    note: >-
      **Speed** (150 Vivid Lifeforce) guarantees attack speed, the only
      natural modifier with that tag. **Critical** (150 Primal) guarantees
      one of the two critical strike suffixes.


      **Physical** (50 Vivid) can be satisfied by three prefixes and two
      leech suffixes, so on an open item it is vague. Under a suffix lock
      it should have to land on a prefix, and that is the cheapest
      guaranteed physical prefix there is.
  - method: fossil
    note: >-
      A [[Jagged Fossil]] multiplies Physical modifiers by ten. On a mace,
      by our calculator, that turns 46% physical prefixes into about 90%:
      flat damage 43%, each percentage family 23%. It also raises the two
      leech suffixes. It does nothing for tiers. The calculator leaves out
      Fossil-only modifiers, so the true shares are a little lower.
  - method: meta
    note: >-
      Either full lock is 4 Divine Orbs and 1 [[Sacred Orb]] on a weapon in
      3.30. A mace beside a shield is the item that most often justifies
      it, because the whole weapon budget is in one place. The usual lock
      is on the prefixes; lock the suffixes when one of them is an
      influenced modifier you cannot roll twice.
  - method: influence
    note: >-
      Maces have an influenced suffix the other one-handed attack weapons
      do not: **"Enemies Killed with Attack or Spell Hits Explode, dealing
      5% of their Life as Fire Damage"**, on a Shaper mace from item level
      68 and a Redeemer mace from 78.


      Others particular to maces: Warlord's prefix with 65–69% increased
      Physical Damage and 10–15% increased Area of Effect, Elder's "3%
      increased Area of Effect per 50 Strength", and Hunter's "22–25%
      increased Area of Effect if you've Killed Recently". Hunter also
      offers a 66–80% chance to ignore enemy Physical Damage Reduction.


      The conquerors drop the Exalted Orbs that add Redeemer, Hunter,
      Warlord and Crusader influence. An influenced mace cannot be
      fractured.
  - method: fracture
    note: >-
      A fractured high percentage prefix is the standard start for a
      top-end mace, exactly as on a two-hander. The two-handed mace page
      works that craft through in full; on a one-handed mace only the
      numbers differ.
  - method: strands
    note: "See the Memory Strands section below: a mace is the one-handed weapon that uses them best."
memoryStrands: >-
  [[Memory Strands]] raise the tier of whatever is rolled and do nothing for
  which modifier it is. That suits a mace better than an axe or a sword,
  because a mace's problem is the right kind: the families it wants are
  common, 46% of prefix rolls, and only their top tiers are rare.
  "Merciless" weighs 25 in a family of 3,775.


  The craft that fits is the plain one. An [[Orb of Remembrance]] on a white
  item level 83 mace, then [[Orb of Alteration]]s (at most 8 strands each by
  the data-mined table), then a [[Regal Orb]] or [[Exalted Orb]] (at most
  16). The game shows the cost before each orb.


  What wastes them on a mace: a [[Veiled Chaos Orb]] or an Essence, up to 80
  strands each, and an [[Awakener's Orb]], up to 100. If the plan involves
  any of those, or a Fossil or a Harvest reforge, which ignore strands, use
  an ordinary base.
reading:
  intro: >-
    Hold Alt over a mace and count the physical prefixes and their tiers.
    That is most of the weapon. Then attack speed. Then look for anything
    unusual among the suffixes, because the one modifier that can be worth
    more than a prefix on a mace is an influenced suffix.
  prefixes:
    text: >-
      Three families add physical damage and all three fit together: pure
      increased Physical Damage, the hybrid with Accuracy Rating, and flat
      added Physical Damage. A finished mace has all three.


      The competition is lighter than on other one-handed weapons. Added
      Fire, Cold and Lightning Damage are 13% of prefix rolls each, 39%
      together, where an axe has 60%. A mace found on the ground has a
      physical prefix more often than not, and a second one often enough
      that reading drops is worth the seconds.
    key:
      - mod: "#% increased Physical Damage"
        why: "The largest multiplier. Local: it multiplies the base's damage and any flat physical damage on the mace."
        aim: "T3, 135–154% (ilvl 60). T1 is 170–179% (ilvl 83)."
      - mod: "#% increased Physical Damage / +# to Accuracy Rating"
        why: "The same multiplier in its own group, so it sits beside the pure one and beside a bench percentage."
        aim: "T3, 55–64% (ilvl 60). T1 is 75–79% (ilvl 83)."
      - mod: "Adds # to # Physical Damage"
        why: "The number the percentages multiply, and a large one next to a one-handed base. The most common prefix on a mace: more than 1 prefix roll in 5."
        aim: "T2, adds 19–25 to 39–45 (ilvl 65). T1 is 22–29 to 45–52 (ilvl 77)."
      - mod: "Adds # to # Fire / Cold / Lightning Damage"
        why: "A wasted slot on a physical mace, but only two prefix rolls in five here."
      - mod: "+# to Level of Socketed Melee Gems"
        why: "Over 6% of prefix rolls. Useful only when the main skill is in the mace's three sockets."
  suffixes:
    text: >-
      Attack speed is the suffix every mace wants, 14% of suffix rolls.
      Strength is just as common here, twice its weight on an axe, and for
      a Strength character it is not filler: it is life and melee damage.
      There is no Dexterity suffix on a mace at all.


      After those two the slot goes to the build: critical strike
      modifiers, the bench's small chance to deal Double Damage, or an
      influenced suffix.
    key:
      - mod: "#% increased Attack Speed"
        why: "Local. It multiplies the mace's attacks per second, on top of a Maraketh implicit if there is one."
        aim: "T2, 23–25% (ilvl 60). T1 is 26–27% (ilvl 77)."
      - mod: "+# to Strength"
        why: "As common as attack speed on a mace, and useful on the character that wields one."
        aim: "T3, 38–42 (ilvl 66). T1 is 51–55 (ilvl 82)."
      - mod: "+#% to Global Critical Strike Multiplier"
        why: "For builds that crit. Every mace has 5% base chance, so a crit mace needs the chance suffix too."
        aim: "T2, 30–34% (ilvl 59)."
      - mod: "Enemies Killed with Attack or Spell Hits Explode, dealing 5% of their Life as Fire Damage"
        why: "Shaper or Redeemer influence only. A clearing modifier that no amount of rolling puts on an ordinary mace."
      - mod: "#% chance to deal Double Damage"
        why: "Not in the natural pool. 4–5% from the bench, 6–7% unveiled."
approach:
  principle: >-
    **The prefixes are the weapon, and on a mace the lottery is willing to
    give them to you.** Use plain tools for longer than you would on any
    other one-handed weapon: read your drops, roll with Alterations, let a
    reroll run without a lock. Save the expensive protection for the two
    things that cannot be rolled twice: a top-tier percentage, and an
    influenced suffix.
  order:
    - title: "Shield or second weapon"
      text: >-
        With a shield this is the only weapon: give it the whole budget and
        the best item level. In a pair, halve both.
    - title: "Base for the swing, item level for the tiers"
      text: >-
        The Behemoth Mace's attack speed implicit is the one thing crafting
        cannot add. Item level 77 opens all but the last tier of the
        percentages; 83 opens that.
    - title: "Look at what you already have"
      text: >-
        Nearly half of prefix rolls are physical, so Rare maces from the
        ground are often one bench craft from usable. Check them before
        making one from white.
    - title: "Roll the hardest prefix first"
      text: >-
        A percentage, pure or hybrid, to the tier you decided on. On a mace
        Alterations reach Tier 3 at a bearable cost; beyond that, use an
        unveiled percentage, a Fossil or a fractured base.
    - title: "Fill the other prefixes from the bench and the pool"
      text: >-
        The hybrid leaves room for a bench percentage, the pure one for
        bench flat damage. A beast or a Harvest Physical reforge under a
        suffix lock adds rolled ones.
    - title: "Attack speed, then one slot for the bench"
      text: >-
        Attack speed by Essence, Harvest or the bench. Keep the last bench
        slot for whichever side came out short.
  finishing: >-
    Quality to 20%, sockets and links, then the values inside the tiers. A
    [[Divine Orb]] rerolls all of them together; use one when the main
    percentage is low in its range.


    If a slot is still empty and the bench is unused, use it. On a weapon
    that carries a whole build, an empty slot is the most expensive kind of
    saving.
  stopping: >-
    One rolled physical prefix of Tier 3 or better, a bench prefix beside it
    and attack speed make a mace for yellow and early red maps. Two rolled
    physical prefixes and a benched third carry most shield builds through
    the rest. The third rolled prefix and Tier 1 are where the cost
    multiplies.


    Stop when the next step costs more than the improvement is worth, and
    decide that number before you start. Beside a shield the number can be
    higher than for either weapon of a pair, because every hit uses this
    mace.
special:
  - mod: "Enemies Killed with Attack or Spell Hits Explode, dealing 5% of their Life as Fire Damage"
    source: "Shaper / Redeemer influence"
    where: "A suffix on a Shaper mace of item level 68 or more, or a Redeemer mace of 78 or more. By our arithmetic about 1 suffix roll in 74 on the Shaper mace and 1 in 129 on the Redeemer one."
  - mod: "#% increased Attack Speed"
    source: "Base implicit"
    where: "The implicit of the three Maraketh maces: 4%, 4% and 6% on the Behemoth Mace. Not craftable; you choose it by choosing the base."
  - mod: "Trigger Level # Fiery Impact on Melee Hit with this Weapon"
    source: "Base implicit"
    where: "The implicit of the three Heist maces, at level 10, 15 and 20."
  - mod: "#% increased Physical Damage / #% increased Area of Effect"
    source: "Warlord influence"
    where: "A Warlord prefix, 65–69% with 10–15% at item level 80. It shares a group with the natural Accuracy hybrid, so it replaces that one."
  - mod: "#% increased Physical Damage / #% chance to Impale Enemies on Hit with Attacks"
    source: "Veiled / Bench"
    where: "Unveiled: 120–139% with 21–25%. Bench: 81–85% with 13–15% for 3 Orbs of Alchemy, up to 95–105% with 18–20% for 8 Chaos Orbs. Versions for Bleeding, Poison and Blind. All share a group with pure increased Physical Damage."
  - mod: "#% chance to deal Double Damage"
    source: "Bench / Veiled"
    where: "4–5% from the [[Crafting Bench]] for 8 Chaos Orbs; 6–7% as an unveiled suffix."
  - mod: "Hits with this Weapon have #% chance to ignore Enemy Physical Damage Reduction"
    source: "Hunter influence"
    where: "A Hunter suffix: 50–65% at item level 68, 66–80% at 71."
  - mod: "#% increased Impale Effect"
    source: "Essence / Crusader influence"
    where: "An Essence of Dread: 12–16% at Screaming, 22–25% at Deafening. Also a Crusader suffix, 22–25% at item level 75."
  - mod: "Hits can't be Evaded"
    source: "Bench"
    where: "A bench prefix for 4 Exalted Orbs. It takes a prefix slot. Beside a shield, where this mace makes every hit, it replaces accuracy entirely."
  - mod: "#% chance to gain an Endurance Charge when you Stun an Enemy"
    source: "Corruption"
    where: "A corruption implicit from a [[Vaal Orb]], 5–7%. Others for maces include 15–20% increased Area of Effect, 16–20% increased Physical Damage and 5–7% attack speed. It replaces the base's implicit, so a Behemoth Mace would lose its attack speed."
mistakes:
  - "**Treating a sceptre as a mace.** Different class, different pool, different page."
  - "**Reaching for a lock when Alterations would do.** With 46% physical prefixes, an average pair of prefixes costs less to roll again than 4 Divine Orbs and a Sacred Orb."
  - "**Benching increased Physical Damage onto a mace that already rolled the pure one.** Same group. The bench's flat damage is the one that fits; the bench percentage fits beside the Accuracy hybrid."
  - "**Keeping a suffix at the cost of a prefix.** Attack speed can be bought three ways. The exception is an influenced suffix, which cannot."
  - "**Corrupting a Behemoth Mace for an implicit.** The corruption implicit replaces the 6% attack speed."
  - "**Vendoring Rare maces unread.** On this class a dropped Rare has a physical prefix more often than not."
verified: "2026-11-19"
