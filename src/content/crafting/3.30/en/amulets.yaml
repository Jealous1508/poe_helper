mistakes:
  - "**Crafting a gem level amulet below item level 75.** The prefix does not exist there. Check before the first orb."
  - "**Rerolling a gem level because the rest was bad.** The rest can be repaired; the gem level is the part you could not afford twice."
  - "**Expecting Life from an Essence of Greed.** On an amulet it gives Life regeneration. Life is rolled, crafted at the bench, or forced with a locked suffix side."
  - "**Planning to bench Critical Strike Multiplier.** The amulet bench does not have it. Roll the multiplier or use Scorn, and bench the Critical Strike Chance."
  - "**Using the Lynx recipe on an amulet with one good prefix.** It removes a random prefix, and with one prefix that is not random."
  - "**Spending a full lock on average suffixes.** Four Divine Orbs and 8 Exalted Orbs buy a lot of Essences."
  - "**Putting Catalysts on before the modifiers are final.** They are scarce in 3.30 and our sources do not say that later crafting leaves the quality alone."
