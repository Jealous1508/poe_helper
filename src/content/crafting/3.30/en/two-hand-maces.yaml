name: "Two-Handed Maces"
short: "The slowest, hardest-hitting physical weapons. One pool, 25 bases, and a craft that is decided by three prefixes."
icon: "Karui Maul"
intro: >-
  A two-handed mace is most of a slam build's damage in one item. What you are
  crafting is **physical damage per second**: the base's own damage, plus flat
  physical damage, multiplied by increased physical damage and by attack speed.
  Almost all of that sits in the three prefix slots, and all three good
  prefixes are rare at their best tiers.


  That makes this the cleanest category to learn on. The goal is always the
  same, every base rolls the same modifiers, and the suffix side can be bought
  outright once the prefixes are done.
basics:
  itemLevel:
    text: >-
      For a physical mace nothing above item level 83 matters, and most of
      what you want is open by 77. The gap between the two is one tier of
      increased Physical Damage, which is about 10% more of that modifier and
      many times the price. Craft your first maces at 77. Go to 83 when you
      are deliberately chasing the top tier.


      Elemental builds are the exception: the best "increased Elemental
      Damage with Attack Skills" needs item level 86.
    breakpoints:
      - ilvl: 35
        unlocks: "**Levelling.** Tier 5 increased Physical Damage (85–109%) and Tier 5 of the hybrid with Accuracy."
      - ilvl: 46
        unlocks: "Tier 4 increased Physical Damage (110–134%). Enough for the end of the campaign."
      - ilvl: 60
        unlocks: "Tier 3 increased Physical Damage (135–154%), Tier 3 hybrid (55–64%), and Tier 2 attack speed (23–25%). **The first item level worth crafting for maps.**"
      - ilvl: 73
        unlocks: "Tier 2 increased Physical Damage (155–169%) and Tier 2 hybrid (65–74%). Tier 1 Critical Strike Chance and Tier 1 Critical Strike Multiplier (both 35–38%)."
      - ilvl: 77
        unlocks: "Tier 1 flat Physical Damage (adds 34–47 to 72–84) and Tier 1 attack speed (26–27%). **Enough for everything except the last tier of the two percentage prefixes.**"
      - ilvl: 83
        unlocks: "Tier 1 increased Physical Damage, \"Merciless\" (170–179%), and Tier 1 hybrid, \"Dictator's\" (75–79% with Accuracy). **The ceiling for a physical mace.**"
  bases:
    text: >-
      There are 25 two-handed maces, and for crafting they are one kind: every
      one of them rolls from the same pool, with the same weights. No base
      unlocks a modifier that another cannot have. What differs is the weapon
      underneath: damage per hit, attacks per second, critical strike chance
      and the implicit.
    types:
      - title: "Ordinary mauls"
        pools: [all]
        text: >-
          Nineteen bases from Driftwood Maul to Terror Maul. Most carry a
          stun implicit (30% or 45% increased Stun Duration). The four
          top-tier ones, which drop from level 61, each have something
          better: Piledriver (20% reduced Enemy Stun Threshold), Meatgrinder
          (5% chance to deal Double Damage), Imperial Maul (10% increased
          Strength) and Terror Maul (25% chance to double Stun Duration, and
          6% base critical strike chance).
      - title: "Maraketh mauls"
        text: >-
          Morning Star, Solar Maul and Coronal Maul. Their implicit is
          increased Area of Effect, 15% on the first two and 20% on the
          Coronal Maul. For a slam build that is the most useful implicit in
          the category.
      - title: "Heist mauls"
        text: >-
          Blunt Force Condenser, Crushing Force Magnifier and Impact Force
          Propagator. Their implicit is "Warcries Exert 1 additional Attack"
          (2 on the Propagator). They have lower damage than ordinary bases of
          the same level, so they are for builds that live on exerted
          attacks and for nobody else.
    picks:
      - base: "Karui Maul"
        for: "The biggest single hit"
        why: >-
          112–168 physical damage at exactly one attack per second: the
          highest damage per hit of any base here, available from level 57.
          The right choice when your skill has its own attack time or you hit
          once and want it to count.
      - base: "Imperial Maul"
        for: "The best all-round endgame base"
        why: >-
          102–153 at 1.1 attacks per second is the highest base damage per
          second in the category (140.3), and the implicit is 10% increased
          Strength, which a Strength build turns into life and damage.
      - base: "Coronal Maul"
        for: "Slams and anything that clears with area"
        why: >-
          20% increased Area of Effect on the implicit, where crafting cannot
          touch it, at 136.3 base damage per second. You give up about 3% of
          the Imperial Maul's damage for it.
      - base: "Piledriver"
        for: "Attack speed"
        why: >-
          1.35 attacks per second is the fastest base. Local attack speed
          multiplies that number, so the same suffix gives more attacks here
          than on any other maul. The hit is the smallest of the top bases.
      - base: "Terror Maul"
        for: "Critical strike builds"
        why: >-
          6% base critical strike chance where almost every other maul has
          5%. That is a fifth more critical strikes before any modifier, and
          increased Critical Strike Chance multiplies it.
    impact: >-
      The base decides four things that no currency will change afterwards.


      **The damage numbers that every local modifier multiplies.** 170%
      increased Physical Damage on a Karui Maul and on a Driftwood Maul is the
      same modifier and a completely different weapon.


      **Attacks per second and critical strike chance.** Attack speed on a
      weapon is local: it multiplies the base's own rate. Critical strike
      chance modifiers multiply the base's 5% or 6%.


      **The implicit.** A [[Blessed Orb]] rerolls its number where it has a
      range; nothing in ordinary crafting changes what it is.


      **The Strength requirement**, 212 to 220 on the top bases.


      What the base does *not* decide here is the pool. So pick the base for
      the weapon you want to swing, and pick the item level for the tiers you
      mean to roll.
tools:
  - method: currency
    note: >-
      At item level 83 the three physical prefixes together are 46% of every
      prefix roll, by our arithmetic from the weights, but their top tiers are
      a sliver of that. One prefix roll is Tier 3 or better of pure increased
      Physical Damage about 1 time in 180, and the same again for the hybrid.
      Tier 1 of either is about 1 in 630. Flat Physical Damage is far kinder:
      Tier 3 or better about 1 in 26.


      So [[Orb of Alteration]]s are a fine way to get **one** decent physical
      prefix and a poor way to get the best one. Three good prefixes from
      plain rolling is not a plan.
  - method: bench
    note: >-
      The bench sells every piece of a mace in a weaker form, and the prices
      in the 3.30 data are steep at the top rank only. Increased Physical
      Damage: 40–59% for 4 Orbs of Alteration, 60–79% for 8, 80–99% for 4
      Chaos Orbs, 100–129% for 4 Exalted Orbs. Flat Physical Damage: adds
      18–24 to 36–42 for 4 Chaos Orbs. Attack speed: 8–10% for 6 Orbs of
      Alteration, 11–15% for 2 Chaos Orbs, 16–20% for 4 Exalted Orbs.
      Critical Strike Chance 25–27% or Critical Strike Multiplier 25–28% for
      4 Chaos Orbs. 8–10% chance to deal Double Damage for 8 Chaos Orbs.


      One rule decides what you may bench. The bench's increased Physical
      Damage is the same group as the rolled one, so the two cannot coexist.
      It is **not** the same group as the hybrid with Accuracy. A mace with a
      rolled hybrid can take the bench's pure percentage on top.
  - method: finishing
    note: >-
      Take the mace to 20% quality with [[Blacksmith's Whetstone]]s before
      you judge its damage: quality is physical damage on the base. Two-handed
      weapons have up to six sockets, and the bench sets sockets and links at
      a fixed price when [[Orb of Fusing]]s do not cooperate.
  - method: essence
    note: >-
      Three Essences matter on a two-handed mace. **Zeal** guarantees attack
      speed, and Deafening gives 28–30%, above the 26–27% of natural Tier 1.
      **Contempt** guarantees flat Physical Damage; Deafening gives adds
      31–42 to 65–75, a little under natural Tier 1. **Loathing** guarantees
      Critical Strike Chance, 35–38% at Deafening.


      [[Deafening Essence of Dread]] gives 35–38% increased Impale Effect, a
      modifier the natural pool does not have.
  - method: beast
    note: >-
      Two recipes. An **Imprint** ([[Craicic Croaker]]) on a Magic mace with
      a strong prefix lets you try a [[Regal Orb]] and go back if the added
      modifier is bad. **Add a prefix, remove a random suffix**
      ([[Farric Wolf Alpha]]) is for a Rare mace with an open prefix and
      suffixes you do not care about, which on this item is a common state.
  - method: fossil
    note: >-
      A [[Jagged Fossil]] multiplies every Physical modifier by ten. On a
      mace that turns 46% physical prefixes into about 90%, by our
      arithmetic: flat Physical 43%, each of the two percentage families 23%.
      It also raises the two leech suffixes, which carry the physical tag.


      Those shares count the natural pool only. Fossil-only modifiers are
      not in them, because the game data does not say which Fossil adds
      which.


      It does nothing for tiers. Tier 1 of pure increased Physical Damage
      goes from about 1 in 1,270 prefix rolls to about 1 in 650. Fossils get
      you three physical prefixes; they do not get you three good ones.
  - method: harvest
    note: >-
      On this item the **Speed** reforge (150 Vivid Lifeforce) is close to a
      guaranteed attack speed suffix: attack speed is the only modifier in
      the natural pool with the speed tag. The **Critical** reforge (150
      Primal) guarantees Critical Strike Chance or Critical Strike
      Multiplier.


      The **Physical** reforge (50 Vivid) is weaker than it sounds. It is
      satisfied by any of the three physical prefixes and also by either
      leech suffix.
  - method: veiled
    note: >-
      The unveiled prefixes pair 120–139% increased Physical Damage with a
      21–25% chance to Impale, Bleed, Poison or Blind. They are in the same
      group as pure increased Physical Damage, so they replace it and do not
      stack with it. On the suffix side: 12–14% chance to deal Double Damage,
      and 27–30% attack speed while a Rare or Unique enemy is nearby.
  - method: fracture
    note: >-
      A mace with a high tier of increased Physical Damage fractured is the
      standard start for a top-end weapon, because that prefix is the one
      you could not afford to roll twice. With it locked, Essences and
      Fossils can be thrown at the item until the other two prefixes land.
  - method: meta
    note: >-
      "Prefixes Cannot Be Changed" on a weapon costs 4 Divine Orbs and 1
      [[Sacred Orb]] in 3.30, per attempt. It is worth it when the three
      prefixes are done and the suffixes are not, and only then.
  - method: influence
    note: >-
      Each influence adds weapon modifiers; the full table is in the modifier
      list. The ones crafters reach for: Shaper's suffix with 20–21% attack
      speed and 4–6% chance to deal Double Damage, Elder's suffix with
      16–20% increased Area of Effect, and Warlord's prefix with 65–69%
      increased Physical Damage and 10–15% increased Area of Effect. An
      influenced mace cannot be fractured.
  - method: strands
    note: "See the Memory Strands section below: this category is one of the better uses for them."
memoryStrands: >-
  A mace has an unusual problem: the modifiers it wants are common, and only
  their top tiers are rare. The three physical prefixes are nearly half of
  all prefix rolls; "Merciless" has a weight of 25 in a family of 3,775. That
  is exactly the problem [[Memory Strands]] address, since strands raise the
  tier of whatever is rolled and do nothing else.


  The use that fits is the cheap one. Put strands on a white item level 83
  base with an [[Orb of Remembrance]], then craft with
  [[Orb of Alteration]]s, which spend at most 8 strands each by the
  data-mined table, and finish with a [[Regal Orb]] or
  [[Exalted Orb]]. The game shows the cost of each orb before you use it.


  Do not combine a strand base with Essence spam: one Essence can spend up to
  80. And if the plan is a [[Jagged Fossil]], an ordinary base does the same
  job, because Fossils do not use strands by player testing.
reading:
  intro: >-
    Hold Alt over any mace and ask one question first: **how many of the
    three prefixes are physical, and at what tier?** That answer is most of
    the weapon's damage. Then look at the suffixes for attack speed. Only
    then at anything else.
  prefixes:
    text: >-
      The prefix side is where a mace is made or lost. Three families add
      physical damage and they stack, because they are three different
      groups: pure increased Physical Damage, the hybrid of increased
      Physical Damage with Accuracy Rating, and flat added Physical Damage.
      A finished weapon has all three.


      Everything else on the prefix side is competition for those slots. The
      three kinds of added elemental damage are 39% of prefix rolls between
      them and are worth nothing to a physical build. "+1 to Level of
      Socketed Gems" and "+2 to Level of Socketed Melee Gems" only matter if
      your main skill is socketed in the weapon.
    key:
      - mod: "#% increased Physical Damage"
        why: "The largest multiplier on the item. It is local, so it multiplies the base's damage and any flat physical damage on the weapon."
        aim: "T3, 135–154% (ilvl 60). T1 is 170–179% (ilvl 83)."
      - mod: "#% increased Physical Damage / +# to Accuracy Rating"
        why: "A second source of the same multiplier in a different group, so it sits beside the first. Smaller numbers, same rarity."
        aim: "T3, 55–64% (ilvl 60). T1 is 75–79% (ilvl 83)."
      - mod: "Adds # to # Physical Damage"
        why: "Raises the number the two percentages multiply. The easiest of the three to roll, and the one the bench replaces worst."
        aim: "T2, adds 30–40 to 63–73 (ilvl 65). T1 needs ilvl 77."
      - mod: "Adds # to # Fire / Cold / Lightning Damage"
        why: "Wanted only by builds that scale that element. On a physical mace each one is a wasted prefix, and together they are the most common thing to roll."
      - mod: "+# to Level of Socketed Melee Gems"
        why: "Strong when the main skill lives in the weapon's sockets, irrelevant otherwise."
  suffixes:
    text: >-
      The suffix side is forgiving. Attack speed is the one suffix every mace
      wants, it is 14% of suffix rolls, and an Essence, a Harvest reforge or
      the bench will each supply it. After that the suffixes depend on the
      build: critical strike chance and multiplier for a crit build, the
      bench's chance to deal Double Damage for everyone else.


      Half the natural suffix pool is filler for a mapping weapon: Strength,
      Accuracy, the two stun modifiers, life and mana on kill. None of it is
      harmful. All of it is a slot that could have been damage.
    key:
      - mod: "#% increased Attack Speed"
        why: "Local, so it multiplies the base's attacks per second. The only suffix that is always right."
        aim: "T2, 23–25% (ilvl 60). T1 is 26–27% (ilvl 77)."
      - mod: "+#% to Global Critical Strike Multiplier"
        why: "For builds that crit. Global: it affects the character, not only this weapon."
        aim: "T2, 30–34% (ilvl 59)."
      - mod: "#% increased Critical Strike Chance"
        why: "Multiplies the base's 5% or 6%. Only for builds that crit."
        aim: "T2, 30–34% (ilvl 59)."
      - mod: "#% chance to deal Double Damage"
        why: "Not in the natural pool. The bench sells 8–10% and the veiled version is 12–14%. The default third suffix for a build that does not crit."
      - mod: "+# to Strength"
        why: "Useful filler on a Strength character and common enough to appear on its own."
approach:
  principle: >-
    **The prefixes are the weapon.** Get the physical prefixes first, with
    the best tool you can afford, while the item is still cheap to abandon.
    Everything on the suffix side can be guaranteed afterwards by an
    Essence, a Harvest reforge or the bench, so never give up a good prefix
    to keep a suffix.
  order:
    - title: "Choose the base for the swing and the item level for the tiers"
      text: >-
        The pool is the same on every maul, so the base is a question about
        your build: one big hit, speed, area or crit. Item level 77 opens
        everything but the last tier of the two percentage prefixes; 83 opens
        those.
    - title: "Decide how many rolled prefixes you can afford"
      text: >-
        Be honest here, because it picks the method. **One** rolled prefix
        and two from elsewhere: Alterations and a Regal Orb. **Two:** an
        Essence of Contempt, or a Jagged Fossil. **Three, at high tiers:**
        start from a fractured base.
    - title: "Roll the hardest prefix first"
      text: >-
        That is always a percentage prefix, pure or hybrid: their good tiers
        weigh 25 to 100 where flat Physical Damage's weigh 200 to 600. Stop
        at the tier you decided on in advance. "One more try for a better
        tier" is how a budget disappears.
    - title: "Fill the other prefixes"
      text: >-
        If you rolled the hybrid, the bench's pure increased Physical Damage
        fits beside it. If you rolled the pure one, the bench's flat Physical
        Damage does. With one prefix still open on a Rare item and suffixes
        you do not need, the "add a prefix" beast recipe is a free roll at a
        third.
    - title: "Protect the prefixes only if they are worth it"
      text: >-
        Three good prefixes are worth more than 4 Divine Orbs and a Sacred
        Orb; two average ones are not. If you lock, do it once the prefix
        side is full, and reroll the suffixes with a tool that respects the
        lock.
    - title: "Attack speed, then one more suffix, then the bench"
      text: >-
        Attack speed first, by whichever guaranteed route you have. Leave one
        slot for the bench and put the build's third damage modifier in it.
  finishing: >-
    Quality to 20% if it is not there already, sockets and links, then look
    at the numbers inside each tier. A [[Divine Orb]] rerolls all of them
    together, so use one when the important modifier is near the bottom of
    its range and the others are not at the top of theirs.


    If you have not used the bench slot, use it now. An empty slot on a
    finished weapon is the most common unforced error in crafting.
  stopping: >-
    A mace with **one** rolled physical prefix of Tier 3 or better, a bench
    prefix beside it and attack speed is a real weapon for yellow and early
    red maps. **Two** rolled physical prefixes and a benched third carry most
    builds through everything else. The third rolled prefix and Tier 1 are
    where the cost multiplies.


    Stop when the next step costs more than the improvement is worth to you,
    and decide that number before you start. If a step fails and the item is
    now worse than one you could buy for what you have left to spend, buy
    that one.
special:
  - mod: "#% increased Impale Effect"
    source: "Essence"
    where: "Guaranteed by an Essence of Dread on a two-handed mace: 35–38% at Deafening. The same modifier exists as a Crusader-influenced suffix."
  - mod: "#% chance to deal Double Damage"
    source: "Bench / Veiled"
    where: "8–10% from the [[Crafting Bench]] for 8 Chaos Orbs. 12–14% as an unveiled suffix, from a veiled drop, a [[Veiled Chaos Orb]] or a [[Veiled Exalted Orb]]."
  - mod: "#% increased Physical Damage / #% chance to Impale Enemies on Hit with Attacks"
    source: "Veiled / Bench"
    where: "Unveiled: 120–139% with 21–25% chance. Bench: 95–105% with 18–20%, for 8 Chaos Orbs. Versions exist for Bleeding, Poison and Blind. All share a group with pure increased Physical Damage."
  - mod: "Hits can't be Evaded"
    source: "Bench"
    where: "A bench prefix for 4 Exalted Orbs. It costs a prefix slot, which on a mace is the expensive side, so it is for builds that have no other answer to accuracy."
  - mod: "#% increased Attack Speed / #% chance to deal Double Damage"
    source: "Shaper influence"
    where: "A Shaper suffix, 20–21% attack speed with 4–6% chance, on a Shaper-influenced mace of item level 75 or higher."
  - mod: "#% increased Physical Damage / #% increased Area of Effect"
    source: "Warlord influence"
    where: "A Warlord prefix, 65–69% with 10–15%, item level 80, with a weight of 50. It shares its group with the Accuracy hybrid, so it takes that prefix's place: you trade the Accuracy for area, not a fourth source of damage."
  - mod: "Socketed Skills deal 20% more Attack Damage"
    source: "Fossil / Shaper influence"
    where: "Rolls with the right Fossil, or as a Shaper prefix at item level 83. Only useful when the main skill is socketed in the weapon."
  - mod: "Warcries Exert # additional Attacks"
    source: "Base implicit"
    where: "The implicit of the three Heist mauls. Not craftable: you choose it by choosing the base."
mistakes:
  - "**Crafting on the wrong item level.** A level 82 base can never roll \"Merciless\". Check the item level before the first orb, not after the hundredth."
  - "**Keeping a suffix at the cost of a prefix.** Attack speed can be bought three different ways. A Tier 2 percentage prefix cannot."
  - "**Benching pure increased Physical Damage onto a mace that already rolled it.** They are one group, so the bench will refuse. The bench's flat Physical Damage is the one that fits."
  - "**Using the bench before a reroll.** An Essence or a Chaos Orb removes the bench modifier with everything else."
  - "**Locking two average prefixes.** At 4 Divine Orbs and a Sacred Orb per attempt, the lock costs more than rolling those prefixes again."
  - "**Judging the weapon before quality.** 20% quality is a large part of the base's damage and costs almost nothing."
verified: "2026-11-19"
