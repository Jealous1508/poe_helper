name: "Wands"
short: "A one-handed weapon that is usually not used as a weapon. Spell, attack and minion wands share a pool that is two-fifths caster and a third attack, so every craft starts by deleting half of it."
icon: "Prophecy Wand"
intro: >-
  A wand is a one-handed weapon with up to three sockets, and for most
  builds its own damage is never used. A caster holds it for what it does to
  spells: increased Spell Damage, cast speed, gem levels. Nothing on a
  caster wand is local, so the base's damage, attack speed and critical
  strike chance mean nothing to that build, and only the implicit matters.


  But a wand can also be an attack weapon, fired with wand attack skills,
  and three bases are built for that. A third kind serves minion builds and
  has a pool of its own. So the same question as for bows comes first:
  **which wand is this?** The answer matters even more here, because every
  wand rolls caster and attack modifiers from one mixed pool, and whichever
  half you do not want is in your way on both sides of the item.
basics:
  itemLevel:
    text: >-
      A caster wand has two stopping points. **Item level 76** opens the best
      tier of Spell Critical Strike Chance and of flat damage to spells,
      Tier 2 of cast speed and of Spell Damage, and it is enough for almost
      any craft. **Item level 84** opens the last tier of cast speed (from
      83) and of Spell Damage. Gem levels need almost nothing: the "+1 to
      Level of all Fire Spell Skill Gems" family is open from item level 2,
      and "+1 to Level of all Spell Skill Gems" from 55.


      An attack wand follows the other weapons: 77 for most of it, 83 for
      the last physical tier, and attack speed is finished at 37. A minion
      wand wants 60 for "+1 to Level of all Minion Skill Gems" and 83–84 for
      its top tiers.
    breakpoints:
      - ilvl: 2
        unlocks: "\"+1 to Level of all Fire, Cold, Lightning, Chaos or Physical Spell Skill Gems\". Open on almost every wand that drops, and rare at every level."
      - ilvl: 55
        unlocks: "\"+1 to Level of all Spell Skill Gems\" (weight 50). Tier 3 cast speed (21–24%)."
      - ilvl: 60
        unlocks: "Tier 3 increased Spell Damage (70–84%) and Tier 2 of the hybrid with Mana (37–43%), both from 58. \"+1 to Level of all Minion Skill Gems\" on minion wands. **The first level worth crafting for maps.**"
      - ilvl: 64
        unlocks: "Tier 2 increased Spell Damage (85–99%) and Tier 2 of increased Fire, Cold and Lightning Damage. Tier 2 minion damage on minion wands."
      - ilvl: 76
        unlocks: "Tier 1 Spell Critical Strike Chance (90–109%). Tier 1 flat damage to spells (from 74), Tier 1 Critical Strike Multiplier (from 73), Tier 2 cast speed (25–28%, from 72). **Enough for nearly every caster wand.**"
      - ilvl: 80
        unlocks: "Tier 1 of the Spell Damage and Mana hybrid, \"Lich's\" (44–49% with +42–45 Mana). Tier 1 of the Damage over Time Multipliers by type (34–38%) opened at 78."
      - ilvl: 84
        unlocks: "Tier 1 increased Spell Damage, \"Runic\" (100–109%), Tier 1 increased elemental damage and Tier 1 minion damage. Tier 1 cast speed (29–32%) and Tier 1 minion attack and cast speed (23–25%) opened at 83. **The ceiling.**"
  bases:
    text: >-
      There are 28 wands in two pools. Twenty-five share the standard pool,
      and three minion wands have a larger one. Inside the standard pool,
      three bases carry an implicit that changes what they can roll, so in
      practice there are three kinds of wand to craft on, plus two families
      with unusual implicits.
    types:
      - title: "Ordinary wands"
        pools: [standard]
        text: >-
          Sixteen bases from Driftwood Wand to Prophecy Wand. Most have
          increased Spell Damage as their implicit, rising with level to
          36–40% on the Prophecy Wand; six lower-level bases (Goat's Horn,
          Quartz Wand, Spiraled Wand and their upgrades) have small flat
          elemental damage to spells and attacks instead. All of them
          roll the full mixed pool: at item level 84 about 40% of prefix
          weight is caster modifiers and 36% attack modifiers.
      - title: "Attack wands: Somatic, Blasting, Kinetic"
        text: >-
          Three bases whose implicit is **"Cannot roll Caster Modifiers"**.
          They are in the standard pool in the data, but the implicit
          removes every modifier with the caster tag: Spell Damage, flat
          damage to spells, the spell gem levels, cast speed and Spell
          Critical Strike Chance. What is left is an attack weapon's pool.
          They also have the best weapon numbers: the Kinetic Wand has
          29–54 damage, 1.6 attacks per second and 8.5% critical strike
          chance.
      - title: "Minion wands: Calling, Convening, Convoking"
        pools: [minion]
        text: >-
          Their implicit is minion damage: 12–16%, 20–24% and 26–30%. Only
          these three roll the minion modifiers: "Minions deal #% increased
          Damage", its hybrid with Mana, "+1 to Level of all Minion Skill
          Gems", and suffixes for minion attack and cast speed and minion
          critical strikes. They still roll everything an ordinary wand
          does, so the pool is bigger, not cleaner. The Convoking Wand is
          an Atlas base.
      - title: "Maraketh wands: Pagan, Heathen, Profane"
        text: >-
          Standard pool, with increased Cast Speed as the implicit: 10% on
          the first two, 14% on the Profane Wand. Cast speed that takes no
          suffix slot.
      - title: "Heist wands: Assembler, Congregator, Accumulator"
        text: >-
          Standard pool, with "Gain an Endurance, Frenzy or Power Charge
          every 6 seconds" as the implicit; the Accumulator Wand gains two.
          For builds that are short of a way to make charges.
    picks:
      - base: "Prophecy Wand"
        for: "Spell builds, by default"
        why: >-
          36–40% increased Spell Damage on the implicit, the highest of any
          wand. That is more than the bench's cheap Spell Damage craft
          (25–34%) for no slot at all.
      - base: "Profane Wand"
        for: "Spell builds that want cast speed more than damage"
        why: >-
          14% increased Cast Speed on the implicit. It adds to cast speed
          from the suffix, so a Profane Wand with a middling cast speed roll
          casts as fast as another wand with a top one.
      - base: "Convoking Wand"
        for: "Minion builds"
        why: >-
          Minions deal 26–30% increased Damage, and the only top-level base
          that can roll minion modifiers at all.
      - base: "Kinetic Wand"
        for: "Wand attack builds"
        why: >-
          The implicit removes every caster modifier from the pool for
          good, and the base has the best damage, speed and critical strike
          chance of any wand: 66.4 damage per second before modifiers.
      - base: "Accumulator Wand"
        for: "Builds that need charges"
        why: >-
          Two random charges every 6 seconds from the implicit. Its pool is
          the ordinary caster one.
    impact: >-
      For a **spell** build the base decides one thing, the implicit. A
      spell uses its own damage, cast time and critical strike chance, so
      the wand's physical damage, attacks per second and 8% critical strike
      chance are never used. Quality does nothing for it either.


      For an **attack** build the base is a weapon in the usual sense:
      local physical and elemental damage and local attack speed all
      multiply or ride on its numbers. And the choice between an ordinary
      wand and a Kinetic Wand decides the pool: with or without two-fifths
      of caster modifiers in the way.


      For a **minion** build the base decides whether the minion modifiers
      can roll at all.


      A [[Blessed Orb]] rerolls an implicit's number. Nothing in ordinary
      crafting removes "Cannot roll Caster Modifiers" from a Kinetic Wand or
      adds it to another base.
tools:
  - method: currency
    note: >-
      Plain rolling on a wand is rolling through the wrong half of the pool.
      At item level 84, by our arithmetic from the weights, increased Spell
      Damage is 10% of prefix rolls and Tier 3 or better is 1 roll in 115.
      Each "+1 to Level of all Fire, Cold or Lightning Spell Skill Gems" is 1
      prefix roll in 317, and "+1 to Level of all Spell Skill Gems" is 1 in
      1,583. Cast speed is 10% of suffix rolls.


      [[Orb of Alteration]]s are a fine way to get one caster prefix on a
      levelling wand, and the standard way to get one named gem prefix on a
      Magic wand, at a few hundred Alterations.
  - method: bench
    note: >-
      The bench is unusually strong on wands, which is why so many finished
      caster wands are mostly crafted. Prefixes: increased Spell Damage at
      45–54% for 4 Chaos Orbs or 55–66% for 4 Exalted Orbs; flat damage to
      spells (adds 34–45 to 67–78 Fire for 4 Chaos Orbs, with Cold and
      Lightning versions at the same price); 45–54% increased Fire, Cold or Lightning Damage for 4 Chaos
      Orbs. Suffixes: cast speed 14–17% for 2 Chaos Orbs or 18–21% for 4
      Exalted Orbs; Spell Critical Strike Chance 60–69% for 3 Chaos Orbs;
      Critical Strike Multiplier 25–28% for 4 Chaos Orbs; a Damage over Time
      Multiplier by type, 18–20%, for 4 Chaos Orbs.


      The group rules decide what fits together. **Increased Spell Damage
      and increased Fire, Cold or Lightning Damage are one group**, rolled
      or crafted: a wand has one of them. **Flat Fire, Cold and Lightning
      Damage to Spells are one group too.** The hybrid of Spell Damage with
      Mana is its own group and sits beside either. And the bench's "+2 to
      Level of Socketed Support Gems" shares a group with the "+1 to Level
      of all Fire Spell Skill Gems" family, so it cannot join one.
  - method: finishing
    note: >-
      Quality only raises physical damage, so it matters on an attack wand
      and not on a spell or minion wand. A one-handed weapon has at most
      three sockets. A [[Divine Orb]] is worth more than usual on a caster
      wand: Spell Damage tiers are fifteen points wide.
  - method: essence
    note: >-
      Each side of a caster wand has Essences. Prefixes: **Woe** gives
      increased Spell Damage (50–66% at Screaming, 83–94% at Deafening,
      which is just under natural Tier 2), and **Anguish, Suffering and
      Torment** give flat Fire, Cold and Lightning Damage to Spells, at the
      natural Tier 1 range when Deafening. Suffixes: **Misery** gives cast
      speed, matching natural Tier 3, 2 and 1 at Screaming, Shrieking and
      Deafening (29–32%); **Scorn** gives Spell Critical Strike Chance, and
      its Deafening version (110–119%) is above natural Tier 1.


      **Fear** gives minion damage on **any** wand, 83–94% at Deafening.
      On an ordinary wand that is all the minion support it can ever have.


      For attack wands, Anger, Hatred and Wrath give flat elemental damage,
      Contempt flat Physical Damage and Zeal attack speed (17–18% at
      Deafening). No Essence gives a gem level or Critical Strike
      Multiplier on a wand.
  - method: beast
    note: >-
      The **Imprint** ([[Craicic Croaker]]) is at home here. The classic
      caster wand starts as a Magic wand with one gem prefix that took
      hundreds of Alterations, and an Imprint makes the [[Regal Orb]] after
      it repeatable. **Add a prefix, remove a random suffix**
      ([[Farric Wolf Alpha]]) is a weak bet on an ordinary wand, where more
      than a third of prefixes are attack modifiers.
  - method: fossil
    note: >-
      An [[Aetheric Fossil]] ("more Caster, fewer Attack") is the wand
      Fossil: caster modifiers at ten times the weight, attack modifiers at
      about a seventh. The gem prefixes carry two useful tags, caster and
      gem, so an Aetheric and a [[Faceted Fossil]] together multiply them
      by a hundred, and an element Fossil such as a [[Scorched Fossil]]
      makes it a thousand for that element's gem prefix.


      For minion wands a [[Bound Fossil]] raises Minion modifiers tenfold.


      Wands have their own Fossil-only modifiers, among them "Socketed
      Skills deal 40% more Spell Damage" and "+1 to Level of Socketed
      Intelligence Gems", a suffix the data lists under the Faceted Fossil.
      Our odds leave Fossil-only modifiers out.
  - method: harvest
    note: >-
      **Caster** (75 Primal) is the reforge to know. On an open wand it is
      satisfied by any of a dozen caster modifiers. With the prefixes
      locked, only two suffixes of an ordinary wand carry the tag: cast
      speed and Spell Critical Strike Chance, and a spell build wants
      either. (On a minion wand, minion attack and cast speed carries it
      too.)


      **Critical** (150 Primal) is split three ways on a wand: Critical
      Strike Chance, which is for attacks, Spell Critical Strike Chance and
      Critical Strike Multiplier. **Speed** (150 Vivid) is cast speed,
      attack speed or Projectile Speed. On a Kinetic Wand the caster options
      drop out, which makes Critical and Speed cleaner there.
  - method: veiled
    note: >-
      The unveiled prefixes are stronger copies of the bench's hybrids:
      70–79% increased Spell Damage with 18–20% increased Mana Regeneration
      Rate, or 60–69% increased Spell Damage with "Gain 5% of Non-Chaos
      Damage as extra Chaos Damage". Both are in the Spell Damage group.
      Suffixes: +24–28% to a Damage over Time Multiplier by type, 18–22%
      cast speed with a chance to gain Arcane Surge on kill.
  - method: fracture
    note: >-
      The modifier to fracture on a caster wand is "+1 to Level of all Spell
      Skill Gems". It has a weight of 50, no Essence gives it, and the
      Fossils that raise it a hundredfold still leave it at 1 prefix roll
      in 89.
  - method: meta
    note: >-
      The locks cost 4 Divine Orbs and 1 [[Sacred Orb]] on a wand in 3.30.
      Two other meta-modifiers are made for this item. **"Can have up to 3
      Crafted Modifiers"** (2 Divine Orbs) is how a wand with one good
      rolled prefix becomes a finished one from the bench alone.
      **"Cannot roll Attack Modifiers"** (1 Divine Orb) removes about a
      third of the pool, on both sides, from whatever is added next. Since
      3.30 it no longer stops an Orb of Annulment from removing an attack
      modifier: it shapes what is added and protects nothing.
  - method: influence
    note: >-
      The full table is in the modifier list. For spell builds: Shaper's
      "Socketed Skills deal 40% more Spell Damage" (item level 83) and "Gain
      7–8% of Elemental Damage as Extra Chaos Damage" (85); Elder's flat
      Chaos or Physical Damage to Spells; Redeemer's suffix "Spells have a
      6–7% chance to deal Double Damage" (80); and the Crusader, Warlord and
      Redeemer prefixes that pair flat damage to spells with 4% resistance
      penetration. An influenced wand cannot be fractured.
  - method: corruption
    note: >-
      A [[Vaal Orb]] can replace the implicit with "+1 to Level of all Fire,
      Cold, Lightning, Chaos or Physical Spell Skill Gems", 14–18% increased
      Cast Speed or +25–30% to Global Critical Strike Multiplier. The gem
      level is a third +1 on a wand that already has two. It costs the base
      implicit, and the odds are not published.
  - method: strands
    note: "See the Memory Strands section below: useful for Spell Damage and cast speed, useless for the gem prefixes."
memoryStrands: >-
  [[Memory Strands]] raise the tier of whatever is rolled and do nothing for
  which modifier it is. On a wand that divides the wanted modifiers cleanly.


  **Helped:** increased Spell Damage, whose five lowest tiers weigh 1,500
  each against 40 for the top one; cast speed, with eight tiers of equal
  weight; Spell Critical Strike Chance. A strand base rolled with
  [[Orb of Alteration]]s for a Spell Damage prefix, then a [[Regal Orb]],
  is a good use.


  **Not helped:** every gem prefix. Each has exactly one tier, so there is
  nothing for strands to raise, and they do not make the prefix more
  likely. A wand whose plan is "find +1 to fire spells with Alterations"
  gains nothing from strands until the Regal Orb.


  Keep strands away from Essences (up to 80 each, by the data-mined table)
  and do not expect Fossils to use them.
reading:
  intro: >-
    Read the implicit and the prefixes together and name the wand. **Spell
    Damage, damage "to Spells" or spell gem levels:** a caster wand, and
    the weapon line at the top of the item is irrelevant. **"Cannot roll
    Caster Modifiers", or physical and plain elemental damage:** an attack
    wand, judged like any weapon. **Minion modifiers:** a minion wand. Then
    count how many slots hold a modifier from the wrong half. On a wand
    that number is the usual reason an item is worth nothing.
  prefixes:
    text: >-
      A caster wand has five candidate groups for three slots: increased
      Spell Damage (or one element's increased damage, same group), the
      Spell Damage and Mana hybrid, flat damage to spells, the element gem
      prefix, and "+1 to Level of all Spell Skill Gems". The two gem
      prefixes are different groups and add up to +2 for a spell of the
      right element. Which three you want depends on the build: gem levels
      for spells that scale with level, damage over time above all;
      percentage and flat damage for the rest.


      Mind the wording. "Adds # to # Fire Damage" with nothing after it is
      an attack modifier: it adds to hits made with the wand. Only "Adds #
      to # Fire Damage **to Spells**" helps a caster. The two look alike on
      the item and are 5% and 7% of prefix rolls.


      An attack wand reads like a small bow: flat elemental damage, or the
      three physical prefixes. A minion wand wants minion damage, the
      minion and Mana hybrid, and the minion gem level.
    key:
      - mod: "#% increased Spell Damage"
        why: "The caster's main prefix. Same group as increased Fire, Cold or Lightning Damage, and as the bench and veiled Spell Damage hybrids."
        aim: "T3, 70–84% (ilvl 58), or the bench's 55–66%. T1 is 100–109% (ilvl 84)."
      - mod: "#% increased Spell Damage / +# to maximum Mana"
        why: "A second helping of Spell Damage in its own group, so it sits beside the first."
        aim: "T2, 37–43% (ilvl 58). T1 is 44–49% (ilvl 80)."
      - mod: "Adds # to # Fire / Cold / Lightning Damage to Spells"
        why: "Flat damage for spells that hit. One group for all three elements. The top tiers weigh 50 to 250; the bench or an Essence is the usual source."
        aim: "T2 (ilvl 62). T1 needs ilvl 74, or a Deafening Essence."
      - mod: "+1 to Level of all Fire / Cold / Lightning / Chaos / Physical Spell Skill Gems"
        why: "One level for every spell of that type, wherever it is socketed. One group for all five."
        aim: "Any (ilvl 2). About 1 prefix roll in 317."
      - mod: "+1 to Level of all Spell Skill Gems"
        why: "A different group from the element version, so the two stack. Weight 50."
        aim: "Needs ilvl 55. About 1 prefix roll in 1,583."
      - mod: "Minions deal #% increased Damage"
        why: "Minion wands only, apart from an Essence of Fear. Same group as Spell Damage."
        aim: "T3, 70–84% (ilvl 58). T1 is 100–109% (ilvl 84)."
      - mod: "Adds # to # Fire / Cold / Lightning Damage"
        why: "For attack wands. Local, and wasted on a caster."
  suffixes:
    text: >-
      For a spell build three suffixes matter: cast speed, Spell Critical
      Strike Chance and Critical Strike Multiplier. They are a quarter of
      suffix rolls between them at item level 84, and the bench sells all
      three at about two thirds of their best. Damage over time casters
      swap the two critical strike suffixes for a Damage over Time
      Multiplier: the typed ones go to 34–38% and are very rare, and the
      bench's 18–20% is how most wands get one.


      The rest is in the way. Nearly a third of suffix weight is attack
      modifiers, and the pool also holds mana regeneration, chance to
      Freeze, Ignite and Shock, Intelligence and Projectile Speed.


      Mind the wording again: "increased Critical Strike Chance" with no
      "Spell" in it is an attack modifier on a wand.
    key:
      - mod: "#% increased Cast Speed"
        why: "The suffix every spell build wants. Eight tiers of equal weight; an Essence of Misery guarantees it."
        aim: "T2, 25–28% (ilvl 72). T1 is 29–32% (ilvl 83)."
      - mod: "#% increased Spell Critical Strike Chance"
        why: "For spells that crit. Not the same modifier as \"increased Critical Strike Chance\"."
        aim: "T2, 80–89% (ilvl 59). T1 is 90–109% (ilvl 76)."
      - mod: "+#% to Global Critical Strike Multiplier"
        why: "Serves spells and attacks alike. No Essence gives it on a wand."
        aim: "T2, 30–34% (ilvl 59). T1 is 35–38% (ilvl 73)."
      - mod: "+#% to Chaos / Cold / Fire / Physical Damage over Time Multiplier"
        why: "For damage over time spells. Weights of 35 to 100 at the top tiers, so nearly always the bench's or the veiled version."
        aim: "Bench, 18–20%. T2 is 29–33% (ilvl 64)."
      - mod: "Minions have #% increased Attack and Cast Speed"
        why: "Minion wands only. The bench sells a weaker copy on any wand."
        aim: "T3, 17–19% (ilvl 55). T1 is 23–25% (ilvl 83)."
      - mod: "#% increased Attack Speed"
        why: "For attack wands, where it is local. Its best tier needs only ilvl 37."
        aim: "T1, 17–19% (ilvl 37)."
approach:
  principle: >-
    **Delete the half of the pool you are not using, then craft.** Every
    good wand craft does it somehow: an Aetheric Fossil, a Kinetic Wand's
    implicit, a meta-modifier, or the bench, which never offers the wrong
    half in the first place. A wand crafted by rerolling the whole mixed
    pool is fighting a third of its own modifiers.
  order:
    - title: "Name the wand and pick the base that fits"
      text: >-
        Spell: the implicit you want, usually a Prophecy or Profane Wand.
        Attack: a Kinetic Wand, whose implicit does the deleting for you.
        Minion: a Convoking Wand, or a Convening Wand earlier.
    - title: "Decide whether the build wants gem levels"
      text: >-
        This splits caster wands in two. **No gem levels:** Spell Damage
        from an Essence of Woe, the rest from the bench; a short, cheap
        craft. **Gem levels:** the gem prefix comes first and by itself,
        because nothing guarantees it, and the rest of the wand is built
        around it.
    - title: "Get the gem prefix, or the best damage prefix"
      text: >-
        One element gem prefix: Alterations on a Magic wand, or two or
        three Fossils on a Rare one. Both gem prefixes: a fractured "+1 to
        Level of all Spell Skill Gems" and Fossils for the other.
    - title: "Save it"
      text: >-
        A Magic wand with a gem prefix gets an Imprint before the Regal
        Orb. A Rare wand with finished prefixes gets a prefix lock before
        the suffixes are touched, if it is worth one.
    - title: "Fill from the bench before you roll for more"
      text: >-
        The bench offers Spell Damage, flat damage to spells, cast speed,
        both critical strike suffixes and the Damage over Time Multipliers.
        With "Can have up to 3 Crafted Modifiers" it can supply half the
        wand. Roll only for what it cannot sell.
    - title: "Suffixes last, by Essence or by a Caster reforge"
      text: >-
        An Essence of Misery or Scorn when nothing else on the wand needs
        keeping; a Caster reforge under a prefix lock when something does.
  finishing: >-
    Sockets and links (three at most), then a [[Divine Orb]] when Spell
    Damage or cast speed sits low in a wide range. Quality only on an
    attack wand. If a slot is still open and the wand is worth it, an
    [[Exalted Orb]] with "Cannot roll Attack Modifiers" crafted first has
    about twice the chance of adding something a caster uses.


    If the bench slot is unused, use it.
  stopping: >-
    **Spell Damage from an Essence, cast speed from the bench** is a caster
    wand for the whole campaign and white maps. **One element gem prefix
    with crafted Spell Damage and cast speed** carries most spell builds
    through red maps, and is the point where most people should stop. The
    second gem prefix is where the cost multiplies: it means a fractured
    base or a very long roll.


    Cut your losses when a Regal Orb or an Exalted Orb has put an attack
    modifier in the last open prefix. That slot was the wand's value. Go
    back to the Imprint if you have one, and start a new wand if you do not.
special:
  - mod: "+1 to Level of all Spell Skill Gems"
    source: "Rare prefix"
    where: "In the natural pool from item level 55, with a weight of 50: 1 prefix roll in 1,583. No Essence or bench craft gives it. Fossils raise it a hundredfold, to 1 roll in 89."
  - mod: "#% increased Spell Damage / Gain #% of Non-Chaos Damage as extra Chaos Damage"
    source: "Veiled / Bench"
    where: "Unveiled: 60–69% with 5%. Bench: 46–50% with 4%, for 4 Exalted Orbs. Same group as increased Spell Damage."
  - mod: "Minions deal #% increased Damage (on an ordinary wand)"
    source: "Essence / Bench"
    where: "An Essence of Fear, 50–66% at Screaming to 83–94% at Deafening, or the bench at 45–54% for 4 Chaos Orbs. The natural modifier rolls only on Calling, Convening and Convoking Wands."
  - mod: "#% increased Spell Critical Strike Chance (110–119%)"
    source: "Essence"
    where: "A [[Deafening Essence of Scorn]]. Natural Tier 1 stops at 109%."
  - mod: "Socketed Skills deal 40% more Spell Damage"
    source: "Shaper influence / Fossil"
    where: "A Shaper prefix at item level 83, or a Fossil-only prefix. Only for a spell socketed in the wand, which has three sockets at most."
  - mod: "+1 to Level of Socketed Intelligence Gems"
    source: "Fossil"
    where: "A Fossil-only suffix. The game data lists it under the [[Faceted Fossil]]."
  - mod: "Spells have a #% chance to deal Double Damage"
    source: "Redeemer influence"
    where: "A Redeemer suffix, 6–7% at item level 80."
  - mod: "Trigger a Socketed Spell when you Use a Skill"
    source: "Bench"
    where: "A bench suffix for 3 Chaos Orbs, with an 8 second cooldown. Common on minion and utility wands, where a suffix slot is cheap."
  - mod: "Cannot roll Caster Modifiers"
    source: "Base implicit / Bench"
    where: "The implicit of the Somatic, Blasting and Kinetic Wands, permanent. The bench sells the same effect as a suffix for 1 Divine Orb, on any wand, until the next reroll."
  - mod: "+1 to Level of all Fire Spell Skill Gems (implicit)"
    source: "Corruption"
    where: "A [[Vaal Orb]] can replace the implicit with a gem level for one spell type. It stacks with the same prefix."
mistakes:
  - "**Reading \"Adds Fire Damage\" as a caster modifier.** Without \"to Spells\" it applies to attacks with the wand. The same goes for \"increased Critical Strike Chance\" without \"Spell\"."
  - "**Benching increased Fire Damage beside increased Spell Damage.** They are one group. The Mana hybrid is the second percentage that fits."
  - "**Benching \"+2 to Level of Socketed Support Gems\" on a wand that should have a spell gem prefix.** Same group: it blocks the prefix."
  - "**Crafting a spell wand on a Kinetic Wand.** Its implicit forbids every caster modifier, for ever."
  - "**Using a Regal Orb on a Magic wand with a gem prefix, with no Imprint.** Half the time it adds a prefix, and most prefixes are not for you."
  - "**Putting an Essence of Fear on an ordinary wand and calling it a minion wand.** It gets minion damage and can never roll the minion suffixes or the minion gem level."
  - "**Relying on \"Cannot roll Attack Modifiers\" to guard an Annulment.** Since 3.30 it does not."
