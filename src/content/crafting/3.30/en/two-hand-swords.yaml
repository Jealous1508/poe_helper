name: "Two-Handed Swords"
short: "Less damage than an axe, paid back in implicits, speed and critical strikes. The same modifier pool as axes, and a different answer to which side is hard."
icon: "Exquisite Blade"
intro: >-
  A two-handed sword never has the biggest number. The best base, the Vaal
  Greatsword, has 136.5 physical damage per second where a Karui Chopper has
  162.8. What a sword has instead is something above the line on every base:
  accuracy on the ordinary ones, and on the special ones Critical Strike
  Multiplier, elemental damage, or critical strikes that ignore elemental
  resistances. Swords also attack faster, 1.3 to 1.5 times a second, and
  four bases start at 6.5% critical strike chance.


  The modifier pool is exactly the axe pool: the data gives both classes the
  same prefixes and suffixes at the same weights, with six prefix rolls in
  ten elemental. What changes is what you do with it. Swords are where
  elemental and critical strike weapons are made, and on those the usual
  rule of weapon crafting turns over: **the prefixes become the easy side and
  the suffixes the hard one.** This guide is mostly about knowing which of
  the two swords you are making.
basics:
  itemLevel:
    text: >-
      Which item level is enough depends on the sword. A critical strike
      sword has its suffixes complete at 77: both critical modifiers reach
      Tier 1 at 73 and attack speed at 77. A physical sword tops out at 83
      like an axe. An elemental sword asks for the most: 82 for the top tier
      of added fire, cold or lightning damage and 86 for the top "increased
      Elemental Damage with Attack Skills".
    breakpoints:
      - ilvl: 44
        unlocks: "**Levelling.** Tier 5 of each added elemental damage (fire: adds 63–85 to 128–148), which on a sword of this level adds more to a hit than any physical prefix can. Tier 3 of both critical suffixes (25–29%)."
      - ilvl: 60
        unlocks: "Tier 2 attack speed (23–25%), Tier 3 increased Elemental Damage with Attack Skills (63–71%), Tier 3 increased Physical Damage (135–154%). Tier 2 of both critical suffixes (30–34%) from 59."
      - ilvl: 63
        unlocks: "Tier 3 added fire, cold and lightning damage (lightning: adds 19–25 to 366–425). **The first item level worth crafting an elemental sword for maps.**"
      - ilvl: 73
        unlocks: "Tier 1 Critical Strike Chance and Critical Strike Multiplier (35–38% each). Tier 2 of both physical percentage prefixes."
      - ilvl: 77
        unlocks: "Tier 1 attack speed (26–27%) and Tier 1 flat Physical Damage. Tier 2 of every added elemental damage is open by 75. **A critical strike sword's suffix side is complete here.**"
      - ilvl: 82
        unlocks: "Tier 1 added fire (adds 165–225 to 335–390), cold and lightning damage. Tier 2 increased Elemental Damage with Attack Skills (73–85%) from 81."
      - ilvl: 83
        unlocks: "\"Merciless\" (170–179%) and \"Dictator's\" (75–79% with Accuracy). **The ceiling for a physical sword.**"
      - ilvl: 86
        unlocks: "Tier 1 increased Elemental Damage with Attack Skills (87–100%). **The ceiling for an elemental sword.**"
  bases:
    text: >-
      The data lists 26 two-handed swords in one pool. Twenty-five are bases
      you can craft on, and every one has an implicit, which is the opposite
      of axes. Since no base changes what can roll, the implicit and the
      weapon numbers are the whole choice.
    types:
      - title: "Ordinary swords"
        pools: [all]
        text: >-
          Nineteen bases from Corroded Blade to Infernal Sword. Sixteen carry
          accuracy: either a flat amount for attacks with the sword, from +60
          up to +470 on the Vaal Greatsword, or 40–60% increased Global
          Accuracy Rating. Three of the four top-tier bases, which drop from
          level 61, have something else: Ezomyte Blade (+25% to Global
          Critical Strike Multiplier, and 6.5% critical strike chance), Lion
          Sword (+50 to Strength and Dexterity) and Infernal Sword (30%
          increased Elemental Damage with Attack Skills).
      - title: "Maraketh blades"
        text: >-
          Curved Blade, Lithe Blade and Exquisite Blade. The implicit is
          Global Critical Strike Multiplier: +40% on the first two and +50%
          on the Exquisite Blade. It is a larger number than the best
          Critical Strike Multiplier suffix, and it does not use a slot.
      - title: "Heist blades"
        text: >-
          Rebuking Blade, Blasting Blade and Banishing Blade, the
          "experimented" bases: "Attack Critical Strikes ignore Enemy Monster
          Elemental Resistances", with 6.5% critical strike chance. The
          Banishing Blade has the lowest physical damage of the level 70
          bases, which an elemental build does not mind.
      - title: "Energy Blade"
        text: >-
          An entry with no damage numbers, no requirements and a not-for-sale
          tag. It is the weapon the Energy Blade skill conjures, not a base
          you find or craft on.
    picks:
      - base: "Vaal Greatsword"
        for: "Physical damage"
        why: >-
          68–142 at 1.3 attacks per second, 136.5 base damage per second, the
          highest of any sword, and +470 to Accuracy Rating for attacks with
          it. The base for a physical build that does not crit.
      - base: "Exquisite Blade"
        for: "Physical critical strikes"
        why: >-
          +50% to Global Critical Strike Multiplier as an implicit, 5.7%
          critical strike chance and 120.8 base damage per second. The
          multiplier is worth more than the 11% of damage you give up to the
          Vaal Greatsword, once the build crits reliably.
      - base: "Ezomyte Blade"
        for: "Critical strike chance, and the budget crit sword"
        why: >-
          6.5% critical strike chance, the highest base number in the
          category, with +25% multiplier, 1.4 attacks per second and 123.9
          base damage per second. It drops from level 61, long before the
          Exquisite Blade.
      - base: "Banishing Blade"
        for: "Elemental critical strikes"
        why: >-
          Attack critical strikes ignore the monster's elemental resistances.
          6.5% critical strike chance and 1.4 attacks per second. Its 109.9
          physical damage per second is irrelevant to a sword whose prefixes
          are all added elemental damage.
      - base: "Infernal Sword"
        for: "Elemental damage without crit"
        why: >-
          30% increased Elemental Damage with Attack Skills on the implicit.
          That modifier is a rare prefix; having it above the line frees all
          three prefix slots for added damage.
      - base: "Reaver Sword"
        for: "Attack speed"
        why: >-
          1.5 attacks per second, the fastest base, from level 59. Attack
          speed is the only thing on a weapon that multiplies added elemental
          damage, so this is the cheap elemental base, and the fast one for
          anything that applies an effect per hit.
    impact: >-
      **The implicit is the sword.** It cannot be crafted, none of them has a
      range for a [[Blessed Orb]] to reroll, and each one answers a different
      build. Read it before the damage numbers.


      **Critical strike chance.** The Critical Strike Chance suffix is local:
      it multiplies the base's 5%, 5.7%, 6% or 6.5%. Tier 1 on an Ezomyte
      Blade is 6.5% × 1.38, about 9%. For comparison, the Maraketh axes reach
      a little higher through a local implicit; the swords' answer is the
      multiplier.


      **Attacks per second**, local as on any weapon, and the base's
      **physical damage**, which only matters if the prefixes are physical.
      135% increased Physical Damage adds about 142 to a Vaal Greatsword's
      average hit and about 210 to a Karui Chopper's. That gap is why a
      purely physical build that does not crit usually wants an axe.


      **Requirements.** Swords need Strength and Dexterity in roughly equal
      amounts: 113 and 113 on an Ezomyte Blade, 119 and 131 on an Exquisite
      Blade.
tools:
  - method: currency
    note: >-
      The lottery is the axe's. At item level 83, by our arithmetic, a prefix
      roll is added fire, cold or lightning damage 60% of the time and
      physical 30%. On the suffix side attack speed is 14% and each critical
      suffix nearly 10%, so a third of all suffix rolls are one of the three
      a crit sword wants.


      That makes [[Orb of Alteration]]s a real tool here. Tier 3 or better of
      some added element: about 1 prefix roll in 11. Tier 1 or 2 of attack
      speed or either critical suffix: about 1 suffix roll in 10. What plain
      rolling will not do is fill a whole side: three suffix rolls are
      exactly attack speed, Critical Strike Chance and Critical Strike
      Multiplier about once in 90.
  - method: bench
    note: >-
      The list and prices are the axe's. What a sword takes from it: Critical
      Strike Chance 25–27% or Global Critical Strike Multiplier 25–28% for 4
      Chaos Orbs each; attack speed 11–15% for 2 Chaos Orbs or 16–20% for 4
      Exalted Orbs; added fire or cold damage of 60–72 to 110–128, or
      lightning of 10–14 to 162–197, for 4 Chaos Orbs; increased Elemental
      Damage with Attack Skills, only 24–32%, for 4 Orbs of Alchemy.


      One bench suffix is easy to miss: +39–45% Critical Strike Multiplier
      while a Rare or Unique Enemy is within 6 metres, 4 Chaos Orbs. It is a
      different group from Global Critical Strike Multiplier, so a sword can
      hold both.
  - method: finishing
    note: >-
      Quality is physical damage on the base. On a physical sword it goes on
      first, as on any weapon. On an elemental sword it does nothing for the
      damage, so there is no need to spend [[Blacksmith's Whetstone]]s
      before you know the item is a keeper.
  - method: essence
    note: >-
      **Loathing** guarantees Critical Strike Chance: 25–29% at Screaming,
      30–34% at Shrieking, 35–38% at Deafening, the last equal to natural
      Tier 1. **Zeal** guarantees attack speed, 28–30% at Deafening.
      **Anger**, **Hatred** and **Wrath** guarantee added fire, cold and
      lightning damage; Deafening Wrath is adds 25–34 to 494–575.


      On an elemental sword an elemental Essence is unusually efficient. It
      fixes one of three interchangeable prefixes, and half of everything
      the other prefix slots can then roll is one of the other two.
  - method: beast
    note: >-
      The **Imprint** ([[Craicic Croaker]]) works as on any weapon. The
      recipe swords use more than other weapons is **add a suffix, remove a
      random prefix** ([[Farric Lynx Alpha]]): on a Rare sword with no
      prefixes it is a suffix for the price of the beasts, and one suffix
      roll in three is attack speed or a critical modifier.
  - method: harvest
    note: >-
      **Critical** (150 Primal Lifeforce) is the sword reforge: exactly two
      natural modifiers carry the tag, Critical Strike Chance and Critical
      Strike Multiplier, and a crit sword wants both. **Fire**, **Cold** and
      **Lightning** (50 each) have one natural member each, the added damage
      prefix. **Speed** (150 Vivid) is attack speed.


      Count again on an influenced sword. Redeemer and Shaper add Movement
      Speed, and a Warlord prefix pairs increased Physical Damage with
      attack speed; all three carry the speed tag, so a Speed reforge is no
      longer a guaranteed attack speed suffix there.
  - method: fossil
    note: >-
      For the suffix side, a [[Deft Fossil]] ("More Critical modifiers, No
      Attribute modifiers") and a [[Shuddering Fossil]] ("More Speed
      modifiers, No Mana modifiers") together. By our arithmetic 88% of
      natural suffix rolls are then attack speed or a critical suffix, and a
      result with three suffixes is exactly those three about half the time,
      against once in 90 without Fossils.


      For the prefix side, a [[Prismatic Fossil]] multiplies elemental
      modifiers by six in the data and brings them to 91% of prefix rolls. A
      [[Metallic Fossil]] ("More Lightning modifiers, No Physical modifiers")
      removes all three physical prefixes and makes added lightning damage
      80% of what is left. For a physical sword, the Corroded Fossil works
      exactly as the axe guide describes.


      The Fossil-only modifiers listed for this class are not in these
      figures.
  - method: veiled
    note: >-
      The unveiled suffixes are where swords gain most: +54–60% Critical
      Strike Multiplier while a Rare or Unique Enemy is within 6 metres, in
      a group of its own, and 12–14% chance to deal Double Damage. The
      unveiled 28–32% Critical Strike Chance with Strength and Intelligence
      is the same group as the natural suffix and weaker than its top tiers.
      Among the prefixes: the 120–139% physical hybrids, and attacks with the
      weapon penetrating 14–16% elemental resistances.
  - method: fracture
    note: >-
      Judge a fractured Tier 5 drop by how hard its modifier is to roll. A
      top added elemental damage (Tier 1 weighs 108) or a high physical
      percentage is worth building on. A Tier 1 critical suffix is welcome
      but weighs 1,000 like every other tier of it; fracturing saves you
      little there. A fractured sword cannot take influence, which closes
      the extra-damage prefixes below.
  - method: meta
    note: >-
      Both locks cost 4 Divine Orbs and 1 [[Sacred Orb]] on a weapon in 3.30.
      Which one you use says which sword you are making. Physical: finish
      the prefixes, craft "Prefix Modifiers cannot be changed", reroll the
      suffixes. Elemental crit: finish the three suffixes, craft "Suffix
      Modifiers cannot be changed", and let a Harvest reforge put an element
      on the prefix side, where the pool is on your side.
  - method: influence
    note: >-
      Swords have one thing under influence that axes and maces lack.
      **Shaper** swords can roll two prefixes that gain 18–20% of Physical
      Damage as Extra Cold and as Extra Fire Damage, at a weight of 1,000 a
      tier. **Warlord** (fire) and **Redeemer** (cold) have the same
      prefixes at 27–30% and a weight of 400. So one influence can hold both
      at the lower value, or two influences joined by an
      [[Awakener's Orb]] can hold both at the higher.


      Also sword-only among the two-handed melee classes: **Hunter**'s
      158–165% increased Chaos Damage over Time and Poisons dealing Damage
      22–25% Faster, and **Crusader**'s 23–25% attack speed while Fortified.
      Shaper and Elder each have a Critical Strike Chance suffix with a
      rider; both are the natural suffix's group and replace it.
  - method: corruption
    note: >-
      Swords can receive **Resolute Technique** as a corruption implicit:
      hits cannot be evaded and never crit. It replaces the base's implicit.
      On a Vaal Greatsword for a build that does not crit, that swaps
      accuracy for something better; on an Exquisite Blade it destroys the
      weapon's purpose twice over. The other outcomes include 25–30%
      increased Area of Effect and 16–20% increased Physical Damage.
  - method: strands
    note: "See the Memory Strands section below: the elemental prefixes and the critical suffixes are both good targets."
memoryStrands: >-
  [[Memory Strands]] help most where a wanted family is common and only its
  good tiers are scarce. A sword has that on both sides. The three added
  elemental damage prefixes are 60% of prefix rolls with top tiers that weigh
  a tenth of the low ones. Attack speed and the two critical suffixes are a
  third of suffix rolls, spread evenly over six to nine tiers. Strands cut
  the low tiers out of both.


  So the strand craft for this category is an elemental or crit sword made
  with cheap orbs: an [[Orb of Remembrance]] on a white base, a short run of
  [[Orb of Alteration]]s, a [[Regal Orb]], perhaps an [[Exalted Orb]]. Keep
  the Alterations few. Each can spend up to 8 strands by the data-mined
  table, and the game shows the cost before you click.


  The [[Orb of Unravelling]] favours suffixes here. By the player model,
  which is not official, the chance to upgrade a modifier is the strands
  left, times the weight of the tiers above it, divided by twice the weight
  of that whole side. With 40 strands left that is about 64% for a Tier 3
  attack speed and about 21% for a Tier 3 added lightning damage. Use it
  last, and treat those figures as a model.
reading:
  intro: >-
    Look above the line first: the implicit tells you what the sword is for.
    Then ask which side carries this build. On a physical sword it is the
    prefixes, as on an axe. On an elemental or crit sword, count the
    suffixes: attack speed, Critical Strike Chance, Critical Strike
    Multiplier. A sword with all three and one good prefix is closer to
    finished than a sword with three good prefixes and none of them.
  prefixes:
    text: >-
      For an **elemental** sword any of four prefixes will do: added fire,
      cold or lightning damage, and increased Elemental Damage with Attack
      Skills. The first three are 20% of prefix rolls each, so two of them
      turn up without effort and tiers are the only question. They are not
      multiplied by anything local except attack speed, which is why the
      suffix side matters more on this sword.


      For a **physical** sword the three physical families stack as on any
      weapon, and they are 30% of the pool. The axe guide's advice applies
      unchanged, on a smaller base.


      The two do not mix well. Added elemental damage on a physical sword is
      a prefix that none of the build's physical multipliers touches.
    key:
      - mod: "Adds # to # Lightning Damage"
        why: "The largest of the three elemental rolls at every tier, with a very wide range. Fire and cold are the same group structure with steadier numbers."
        aim: "T3, adds 19–25 to 366–425 (ilvl 63). T1 is adds 28–38 to 549–638 (ilvl 82)."
      - mod: "Adds # to # Fire / Cold Damage"
        why: "Each is its own group, so a sword can hold all three elements. On a Banishing Blade the element hardly matters; elsewhere pick what the build penetrates."
        aim: "T3 (ilvl 62–63). T1 fire is adds 165–225 to 335–390 (ilvl 82)."
      - mod: "#% increased Elemental Damage with Attack Skills"
        why: "Multiplies all three elements, globally. Only 3% of prefix rolls, and it takes a slot an added-damage prefix could have. The Infernal Sword has 30% of it as an implicit."
        aim: "T3, 63–71% (ilvl 60). T1 is 87–100% (ilvl 86)."
      - mod: "#% increased Physical Damage"
        why: "For physical swords. Local. The bench and veiled hybrids share its group."
        aim: "T3, 135–154% (ilvl 60). T1 is 170–179% (ilvl 83)."
      - mod: "#% increased Physical Damage / +# to Accuracy Rating"
        why: "The second physical percentage, in its own group. Its accuracy is welcome but a sword's implicit usually has that covered."
        aim: "T3, 55–64% (ilvl 60)."
      - mod: "Adds # to # Physical Damage"
        why: "The base the percentages multiply, and the base that \"gain as extra\" prefixes from influence work from."
        aim: "T2, adds 30–40 to 63–73 (ilvl 65). T1 needs ilvl 77."
  suffixes:
    text: >-
      Three suffixes make a crit sword, and each is common: attack speed 14%
      of suffix rolls, the two critical modifiers nearly 10% each. All their
      tiers weigh the same, so a random one is Tier 1 one time in six for
      the critical suffixes and one in nine for attack speed. Getting one is
      easy. Getting all three on one item by plain rolling is about a
      one-in-90 event, and that is before tiers. This is the side that needs
      a tool.


      Accuracy is the suffix swords can ignore. It is 8% of suffix rolls,
      and the implicit already supplies it on most bases.
    key:
      - mod: "+#% to Global Critical Strike Multiplier"
        why: "Global, and it adds to the +25%, +40% or +50% implicit of the crit bases."
        aim: "T2, 30–34% (ilvl 59). T1 is 35–38% (ilvl 73)."
      - mod: "#% increased Critical Strike Chance"
        why: "Local: multiplies the sword's own 5.7–6.5%. Worth the most on the 6.5% bases."
        aim: "T2, 30–34% (ilvl 59). T1 is 35–38% (ilvl 73)."
      - mod: "#% increased Attack Speed"
        why: "Local. On an elemental sword it is the only multiplier on the weapon."
        aim: "T2, 23–25% (ilvl 60). T1 is 26–27% (ilvl 77)."
      - mod: "+#% Critical Strike Multiplier while a Rare or Unique Enemy is within # metres"
        why: "Bench (39–45%) or veiled (54–60%). A different group from the global multiplier, so it is a second multiplier suffix for boss damage."
      - mod: "#% chance to deal Double Damage"
        why: "Bench (8–10%) or veiled (12–14%). The third suffix for a sword that does not crit."
approach:
  principle: >-
    **Find the scarce side and build it first.** On a physical sword that is
    the prefixes: three families at 30% of the pool. On an elemental or crit
    sword it is the suffixes: three particular modifiers that never arrive
    together by luck, beside a prefix side where almost anything that rolls
    is useful. Build the scarce side with a tool that targets it, lock it,
    and let the generous side be rolled.
  order:
    - title: "Read the implicit you want, and pick the base by it"
      text: >-
        Exquisite Blade or Ezomyte Blade for physical crit, Banishing Blade
        for elemental crit, Infernal Sword or Reaver Sword for elemental
        without crit, Vaal Greatsword for plain physical. The pool is the
        same on all of them.
    - title: "Name the scarce side"
      text: >-
        Write the six modifiers down with their sides. If the three you
        cannot do without are suffixes, this is a suffix-first sword. If
        they are physical prefixes, it is a prefix-first sword and the axe
        guide's order applies.
    - title: "Build the scarce side with a tool that aims"
      text: >-
        Suffixes: Deft and Shuddering Fossils together, or a Harvest Critical
        reforge, or Alterations on a strand base for one suffix at a time.
        Prefixes for a physical sword: an Essence, a Corroded Fossil, a
        fractured drop.
    - title: "Lock it, with the side full"
      text: >-
        "Suffix Modifiers cannot be changed" is a prefix, so a prefix slot
        must be open to take it. Have all three suffix slots filled before
        you lock: then whatever the next step adds has to be a prefix.
    - title: "Roll the generous side through the lock"
      text: >-
        A Harvest reforge with Fire, Cold or Lightning guarantees that
        added damage prefix, and half the other prefix rolls bring a second
        element. For a physical prefix side, the Physical reforge under a
        suffix lock can only be satisfied by a prefix.
    - title: "Bench last, and check the implicit before choosing"
      text: >-
        The bench fills the remaining slot. Check it against the base first:
        penetration is wasted on a Banishing Blade that crits, and accuracy
        is wasted on most swords.
  finishing: >-
    Sockets and links, quality if the sword is physical, then the values. A
    [[Divine Orb]] matters more than usual on an elemental sword, because the
    added damage tiers have wide ranges: Tier 1 lightning runs from 549 to
    638 at the top end.


    An empty slot on a finished sword is still the commonest unforced error.
    If the bench is used and a suffix is open, an [[Exalted Orb]] has about
    one chance in three of adding attack speed or a critical modifier on a
    sword that has none of them yet, and less once some are there.
  stopping: >-
    **A crit sword** with two of the three suffixes at Tier 3 or better, the
    third from the bench and two damage prefixes is a strong weapon for red
    maps. All three suffixes rolled at Tier 2 or better is the expensive
    step. **An elemental sword** is good with two added-damage prefixes at
    Tier 3; the third element and Tier 1 are where the cost climbs.


    With a side locked, every further attempt costs 4 Divine Orbs and a
    Sacred Orb. Decide how many you will pay for before the first, and take
    the first result that has two useful modifiers and an open slot for the
    bench.
special:
  - mod: "Gain #% of Physical Damage as Extra Fire Damage"
    source: "Shaper or Warlord influence"
    where: "A prefix. Shaper: 18–20% at item level 80, weight 1,000 a tier. Warlord: 27–30% at item level 78, weight 400. The Cold version is on Shaper and Redeemer swords. Fire and Cold are different groups and fit on one sword."
  - mod: "Attack Critical Strikes ignore Enemy Monster Elemental Resistances"
    source: "Base implicit"
    where: "The implicit of the three Heist blades. Not craftable: you choose it by choosing the base."
  - mod: "+#% Critical Strike Multiplier while a Rare or Unique Enemy is within # metres"
    source: "Veiled / Bench"
    where: "Unveiled suffix: 54–60%. Bench: 39–45% for 4 Chaos Orbs. Not the same group as Global Critical Strike Multiplier."
  - mod: "Resolute Technique"
    source: "Corruption"
    where: "A corruption implicit on two-handed swords, from a [[Vaal Orb]]. It replaces the base's implicit, and the orb may do something else entirely."
  - mod: "Damage Penetrates #% Lightning Resistance"
    source: "Essence"
    where: "A prefix from an Essence of Spite, 15–16% at Deafening; Rage gives Fire and Sorrow gives Cold. Pointless on a Banishing Blade build that always crits."
  - mod: "Attacks with this Weapon Penetrate #% Elemental Resistances"
    source: "Bench / Veiled / Hunter influence"
    where: "Bench: 8–10% for 4 Chaos Orbs, 11–13% for 4 Exalted Orbs. Unveiled: 14–16%. Hunter prefix: 10–12% at item level 78."
  - mod: "#% increased Chaos Damage over Time"
    source: "Hunter influence"
    where: "A Hunter prefix on swords, 158–165% at item level 78, with a Hunter suffix that makes Poisons deal Damage 22–25% Faster. Neither exists on two-handed axes or maces."
  - mod: "#% increased Attack Speed while Fortified"
    source: "Crusader influence"
    where: "A Crusader suffix, 23–25% at item level 73. A different group from attack speed, so both can be on the sword."
  - mod: "#% chance to deal Double Damage"
    source: "Bench / Veiled"
    where: "8–10% from the [[Crafting Bench]] for 8 Chaos Orbs; 12–14% unveiled. Shaper has a suffix with 20–21% attack speed and 4–6% chance, in the attack speed group."
mistakes:
  - "**Judging a sword by its damage per second.** Its damage is always lower than an axe's. The implicit, the speed and the critical strike chance are what you bought."
  - "**Building the prefixes first on a crit sword.** Good elemental prefixes come back in a handful of rerolls. Three right suffixes do not. Protect the side that is hard to get twice."
  - "**Locking the suffixes with one slot empty.** The next step may add a suffix you did not choose. Fill the side, then lock."
  - "**Benching penetration on a Banishing Blade.** Its critical strikes already ignore elemental resistances."
  - "**Trusting a Speed reforge on an influenced sword.** Redeemer and Shaper Movement Speed and the Warlord physical prefix carry the speed tag too."
  - "**Spending Whetstones on an elemental sword before it is finished.** Quality raises physical damage only."
  - "**Corrupting an Exquisite Blade.** A corruption implicit replaces the +50% multiplier that was the reason for the base."
verified: "2026-11-19"
