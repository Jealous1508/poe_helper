# What is new: things that did not exist before this patch.
# "official" lines are shortened from the official patch notes and league page.

- id: league-fates
  category: league
  verdict: new
  title: "Covens and Fates: choose how hard the boss gets"
  image: viscera-voltaic-skull
  figure:
    image: league-fates
    caption: "Choosing a Fate. Each card describes what it adds to the boss fight. Image: Grinding Gear Games."
  summary: >-
    In each area you find covenites performing a rite. Interrupt and defeat
    them, and you get to pick a Fate for that area's boss. Every Fate adds
    effects to the fight and adds rewards. You can stack Fates for a harder
    boss and better loot.
  points:
    - "This works in the campaign and in maps: every boss can be empowered."
    - "Fates are shown as cards, for example Doomsayer (\"creates massive explosive blasts of blackfire\")."
    - "A boss empowered by Fates drops **Viscera** for your Wickerman (next entry)."
    - "The official notes do not give drop numbers. Previews say you can invoke up to three Fates on one boss."
  impact:
    meaning: >-
      The league mechanic is about bosses, not about packs of monsters. That
      matches the loot rework in this patch, where Unique monsters are now
      among the best sources of currency.


      You decide the difficulty each time. A Fate is optional, so a weak
      character can take one mild Fate or none, and a strong one can take
      everything offered.
    winners: >-
      Builds with good single-target damage and enough defence to stand in
      a long boss fight. Bossing-focused league starters gain the most.
    losers: >-
      Pure map-clear builds with weak boss damage. They can still play the
      league, but will take fewer Fates and earn less from the mechanic.
    todo: >-
      Read the Fate cards before you confirm. In the campaign, start with
      one Fate per boss until you know what your character can handle, and
      always kill the covenites before the boss, otherwise you miss that
      boss's Viscera.
    confidence: prediction
  official:
    - "You will encounter wicked covenites performing gruesome rites to summon their Queen."
    - "Upon disrupting the coven's magicks, you will get to select a Fate for the boss of the area you're in. Each Fate has a handful of effects, increasing both the rewards and difficulty of the encounter."
    - "A fully empowered boss can be quite a threatening fight."
    - "League page: every boss in the campaign, as well as every boss on a map in the Atlas, has a unique Viscera to be obtained."

- id: wickerman-viscera
  category: league
  verdict: new
  title: "The Wickerman: permanent bonuses from boss remains"
  image: viscera-ancestors-club
  gallery: [viscera-scholars-leg, viscera-distended-stomach, viscera-voltaic-skull, viscera-sirus-head]
  figure:
    image: wickerman-window
    caption: "The Wickerman window with four slots: head, torso, arm and leg. Image: Grinding Gear Games."
  summary: >-
    Bosses empowered by Fates drop Viscera: a skull, a stomach, a leg, a
    weapon. You place Viscera on your own Wickerman, and each piece gives
    you part of that boss's power.
  points:
    - "The Wickerman has four slots in the official screenshot: head, torso, arm and leg."
    - "Every campaign boss and every map boss has its own Viscera."
    - "Pinnacle bosses give the strongest pieces, through Grim Fates."
  impact:
    meaning: >-
      The Wickerman is this league's character-power system. Think of it as
      extra equipment slots that you fill by killing specific bosses, with
      no trading needed for the basic pieces.


      Because every boss has a different piece, there will be a "best
      Viscera for my build" list within days. Until that settles, any
      Viscera in an empty slot is a free bonus.
    todo: >-
      Fill all Wickerman slots during the campaign with whatever you get.
      When you reach maps, look up which boss Viscera suit your build and
      target those maps.
    confidence: prediction
  official:
    - "The twisted witchcraft of the Coven allows you to put the remains of your fallen enemies to use by placing them on your own Wickerman."
    - "Obtain Viscera from a defeated boss empowered by Fates to claim a scrap of their power for your own."

- id: grim-fates-coven-queen
  category: league
  verdict: new
  title: "Grim Fates and the Coven Queen"
  image: viscera-sirus-head
  figure:
    image: league-grim-fate
    caption: "Grim Fates empower the pinnacle bosses of the Atlas. Image: Grinding Gear Games."
  summary: >-
    Grim Fates are the endgame version of the mechanic. They empower the
    hardest bosses on the Atlas, and the reward is Pinnacle Boss Viscera.
    The league's own final boss is the Coven Queen.
  impact:
    meaning: >-
      This is the long-term goal of the league for strong characters: the
      best Wickerman pieces come from pinnacle bosses made even harder. The
      official page shows a Viscera from Sirus as an example.
    todo: >-
      Not a league-start concern. Come back to it when your character kills
      normal pinnacle bosses comfortably.
    confidence: confirmed
  official:
    - "League page: Grim Fates allow you to empower the most difficult bosses within the Atlas. You'll be rewarded with the greatest of trophies, Pinnacle Boss Viscera."
    - "League page: Perhaps... you'll even be able to hold back the Queen herself."

- id: item-tiers
  category: loot
  verdict: new
  title: "Item Tiers: rares on the ground tell you if they are good"
  image: shagreen-boots
  gallery: [cord-belt, stygian-vise, opal-ring]
  figure:
    image: league-loot
    caption: "Tiered items show their tier in the name, before you identify them. Image: Grinding Gear Games."
  summary: >-
    From Act 6, Magic and Rare items can drop with an Item Tier from 2 to 5,
    shown in the name. A higher tier means better modifiers when you
    identify it, and a better chance of a high-level base, quality, sockets
    and links.
  points:
    - "Monster Rarity and your own Item Rarity raise the chance of tiered items."
    - "Tier 5 items can drop with +1 item level, or as fractured Magic items."
    - "Special bases now need a tier to drop: Steel Ring needs Tier 3 or higher, Stygian Vise needs Tier 5."
    - "New in the normal drop pool, with a tier requirement: Stygian Vise, Cord Belt, Simplex, Astrolabe and Focused Amulets, and the Heist ring bases (Cogwork, Composite, Geodesic, Helical, Manifold, Ratcheting)."
    - "Modifier Tier Rating is reworked: it no longer changes which *types* of modifier you get, only how high they roll."
  impact:
    meaning: >-
      Until now an unidentified Rare was a blind box, and most players
      stopped picking them up. A Tier 4 or 5 item is marked as worth your
      time before you spend a Scroll on it.


      It also makes self-found gear realistic again. Late campaign and early
      maps are where this helps most, when you are still filling slots.
    winners: >-
      New players and SSF players. Anyone gearing a second character.
    todo: >-
      Set your loot filter to show Tier 3 and above for the slots you still
      need, and Tier 5 always. Most public filters will have a setting for
      it.
    confidence: confirmed
  official:
    - "In Act 6 onwards, Rare and Magic Items now have a chance to generate with an Item Tier, ranging from 2 to 5. The tier of the item influences the modifier tier rating on the item when it is identified."
    - "Item Tier will influence the chance for the item to be a higher level base type, chance to have Quality, and chance to have more Sockets and Socket links."
    - "Tier 5 items have a chance to drop with +1 to Item Level. Tier 5 items have a chance to drop as Fractured Magic items."
    - "For example, Stygian Vise requires an Item Tier of 5 to drop, while Steel Ring requires an Item Tier of at least 3."
    - "Items in Ruthless do not have Item Tiers."

- id: new-skills
  category: skills
  verdict: new
  title: "Two new skills: Arcane Link and Fireball of Radiation"
  image: fireball
  gallery: [soul-link]
  summary: >-
    [[Arcane Link]] is a party skill: link to another player and they deal
    extra lightning damage based on your mana. [[Fireball of Radiation]] is
    a transfigured Fireball that applies a short, strong fire
    damage-over-time effect around where it lands.
  points:
    - "Arcane Link: if the linked player dies, you die. It cannot be triggered or used by totems, traps or mines."
    - "Arcane Link is a Scion quest reward (Breaking the Seal) and can be bought by Marauder, Duelist and Templar from Petarus and Vanja."
  impact:
    meaning: >-
      Arcane Link does nothing for a solo player: it needs an allied
      *player*, so it does not work on a Mercenary the way Flame Link did.
      It is a tool for mana-stacking support characters in a party.


      Fireball of Radiation turns Fireball into a burning-damage skill that
      does not rely on Ignite. That could suit fire damage-over-time
      builds, but nobody has numbers for it yet.
    confidence: prediction
  official:
    - "Added a new Intelligence Skill, Arcane Link: Targets an allied player to apply a buff which links you to them for a duration. While linked, they deal additional lightning damage based on your mana. If the target dies while linked, you will also die."
    - "Added a new Intelligence Transfigured Skill, Fireball of Radiation: Unleashes a ball of fire ahead that inflicts a short but powerful fire damage over time debuff to each enemy in an area around it."

- id: new-uniques
  category: items
  verdict: new
  title: "11 new unique items and a new jewel base"
  image: hide-of-the-vendigo
  gallery: [sword-of-ages, putrid-seed]
  summary: >-
    The patch adds 11 unique items and a new jewel base type, the Mycelium
    Core. The league page shows three of them: Hide of the Vendigo, The
    Sword of Ages and Putrid Seed.
  impact:
    meaning: >-
      New uniques rarely matter on day one: they need to drop, be priced,
      and be tested in builds first. The exception is Doedre's Tongue, an
      existing amulet that now only drops from Covens encounters (see Small
      changes).
    todo: >-
      Identify and price-check any unique you do not recognise before
      selling it to a vendor. In the first days, new uniques are often
      worth far more than they will be later.
    confidence: confirmed
  official:
    - "Added 11 new Unique Items."
    - "Added a new Jewel basetype, Mycelium Core."

- id: royal-visage-soul-cores
  category: mechanics
  verdict: new
  title: "Royal Visage and Soul Cores from the Temple"
  image: royal-visage
  gallery: [soul-core-of-might]
  summary: >-
    A [[Royal Visage]] drops from Atziri in level 81+ Temples. Use it on a
    Tier 16 map to make its Incursions "Alluring": harder, more rewarding,
    and always with the architect Xipocado. Soul Cores are the new name for
    last league's Coins, with four new types.
  points:
    - "In Alluring Incursions you are targeted by Flameblasts and Storm Calls."
    - "Soul Cores imbue skill gems with a support effect, and can now also roll one of a set of \"bad\" effects."
    - "New: Soul Core of Finesse, Instability, Intellect and Might."
    - "Atziri can drop Soul Cores in Temples of level 80 or higher."
  impact:
    meaning: >-
      Royal Visage is how you push Incursion further once you already run
      Tier 16 maps. Soul Cores are a gem upgrade with a risk attached: the
      "bad" outcomes mean you should not use one on a gem you cannot afford
      to replace.
    confidence: confirmed
  official:
    - "Added a new Royal Visage Currency item which can drop from Atziri in level 81+ Temples of Atzoatl. It can be used on a Tier 16 Map to add an Enchantment that causes Temporal Incursions in the Area to be Alluring."
    - "Coins of Knowledge, Power and Skill have been rethemed to be Soul Cores. They now also have a chance to imbue Skill Gems with one of a set of 'bad' support effects."
    - "Added Soul Core of Finesse, Soul Core of Instability, Soul Core of Intellect, and Soul Core of Might."

- id: new-currency-items
  category: items
  verdict: new
  title: "Other new items: Frayed Thread, Allflame Embers, Essence of Trickery"
  image: afarud-crystal
  gallery: [allflame-divine, abyss-thread]
  summary: >-
    A handful of smaller additions. [[Frayed Thread]] becomes a random
    Thread. Three new Allflame Embers replace monster packs in a map. The
    Afarud Enshrouding Crystal enshrouds unique quivers.
  points:
    - "Allflame Ember of the Cloister, of the Divine, and of the Multitude."
    - "Essence of Trickery (the notes do not say what it does)."
    - "Cryptic Astrolabe: gives a random other Astrolabe. Feral, Immortal and Royal Astrolabes for the new region types."
    - "Merrick's Ducat can be used directly on Abyssal Jewels."
  impact:
    meaning: >-
      None of these change how you start the league. Frayed Threads are the
      one to notice: they are your wildcard for adding a league mechanic to
      a map when you have no Thread of the type you want.
    confidence: confirmed
  official:
    - "Added a new Currency Item, Frayed Thread which can be used to grant a random Thread, or vendored for a random Thread."
    - "Added three new Allflame Embers: Allflame Ember of the Cloister, of the Divine, and of the Multitude."
    - "Added a new Essence, Essence of Trickery."
    - "Added an Afarud Enshrouding Crystal that can Enshroud Unique Quivers."

- id: new-map-modifiers
  category: endgame
  verdict: new
  title: "Rare maps can roll league content as a modifier"
  image: map-tier-16
  gallery: [icon-mirage, atlas-delirium, atlas-beyond]
  summary: >-
    Nine new suffix modifiers can appear on Rare maps, shown in a different
    colour. Each adds an encounter: a buried Sentinel, a Mirage, the
    Viridian Wildwood, a Beyond Evocator or a Mirror of Delirium.
  points:
    - "Vaal Orb outcome changed: adding 2 modifiers (up to 9 in total) replaces the old \"reroll into 8 modifiers\"."
    - "This also applies to Logbooks, Contracts, Blueprints and Invitations."
    - "The +Item Quantity corruption implicit can no longer roll. The Rarity one is +10–20% (was +8–12%)."
  impact:
    meaning: >-
      A map's own modifiers are now a source of content, not only of
      difficulty. A Rare map that rolls "Area contains a Mirage" is worth
      more than one that does not, so read your maps before running them.
    confidence: confirmed
  official:
    - "Added new Modifiers that can roll as suffixes on Maps: Area contains a buried Pandemonium, Apex or Stalker Sentinel; a Mirage; the Viridian Wildwood; an Evocator of Beidat, K'Tash or Ghorr; a Mirror of Delirium."
    - "The above Modifiers can only be rolled on Rare Maps, and display in a different colour."
    - "Removed the Corruption outcome that rerolls the Map into a Rare Map with 8 Modifiers. It has been replaced with an outcome that will add 2 Explicit Modifiers to a Map (up to a maximum of 9)."

- id: league-versions-challenges
  category: league
  verdict: new
  title: "League versions and 40 challenges"
  image: viscera-scholars-leg
  summary: >-
    Covens of Umbra runs in Standard, Hardcore and Solo Self-Found
    versions, plus Ruthless. There are 40 challenges (8 in Ruthless). From
    the 19th challenge, and every third after it, you earn a piece of a
    Totem Pole hideout decoration.
  impact:
    meaning: >-
      If you die in Hardcore Covens you move to the softcore Covens league,
      not to permanent Standard, so you keep playing the league. Challenge
      rewards are cosmetic and exist only this league.
    confidence: confirmed
  official:
    - "There are Standard, Hardcore and Solo Self-Found variations of the Covens of Umbra challenge league."
    - "The Hardcore variations are parented to their Standard Covens of Umbra equivalent."
    - "The league includes a set of 40 new challenges, and 8 new challenges in Ruthless."
    - "From the 19th challenge onwards and for every third challenge after that, you will receive pieces of the Totem Pole decoration."
