updated: "2026-11-13"
intro: >-
  Patch 3.30 changes the endgame more than any patch in years. Scarabs are
  replaced by Threads, the Atlas tree is rebuilt, and loot follows new rules.
  Character balance barely moves. This page rewrites the official notes in
  plain language and explains what each change means in play.
note: >-
  Written on launch day from the official patch notes, GGG's FAQ and Q&A, and
  community discussion from before the servers opened. Anything marked as a
  prediction still needs to be confirmed in game.
