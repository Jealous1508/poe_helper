  official:
    - "Map areas now have a chance to spawn a Demonic Evocator at the start of the area. Interacting with a Demonic Evocator causes monsters in the area to be able to spawn Beyond portals on death."
    - "Slaying Beyond Bosses in Maps now has a chance to reveal an entrance to a Demonic realm associated with that slain Beyond Boss."
    - "Beyond Portals no longer stop spawning when slaying enemies after a Beyond Boss has been defeated in an area."

- id: betrayal-rewards
  category: mechanics
  verdict: rework
  title: "Phần thưởng safehouse của Betrayal bị thay hết"
  image: icon-betrayal
  gallery: [allflame-kulemak, veiled-chaos-orb, ancient-orb]
  summary: >-
    Các thành viên Syndicate từng cho rương Scarab giờ cho Allflame Ember,
    Threads hoặc Unique item. Catarina thì luôn rơi một trong ba Allflame
    Ember.
  points:
    - "Intervention: rương bẫy chứa một dòng Unique item (ví dụ Unique Axe)."
    - "Các safehouse khác từng cho Scarab: rương chứa một Allflame Ember cụ thể."
    - "Rin: Threads ở cả Research và Fortification."
    - "Riker ở Fortification: Ancient Orb."
    - "Vorici ở Research: skill gem có quality kèm một Soul Core đã gắn sẵn."
    - "Veiled item không còn ra từ content ngoài Betrayal."
  impact:
    meaning: >-
      "Scarab Intervention" từng là một trong những cách farm currency đáng tin
      nhất game. Nó đi rồi, và thứ thay thế là Unique item ngẫu nhiên, tính
      trung bình thì giá trị thấp hơn nhiều. Rin trở thành người bạn muốn đặt
      vào nếu cần Threads.
    losers: >-
      Dân farm Betrayal chuyên dựng board Intervention để lấy Scarab.
    todo: >-
      Nếu bạn chơi Betrayal, hãy dựng lại kế hoạch board: Rin cho Threads,
      Riker ở Fortification cho Ancient Orb, và những thành viên cho Allflame
      Ember mà bạn bán được.
    confidence: confirmed
  official:
    - "All Immortal Syndicate members within an Intervention Safehouse will now reward a trapped stash containing a specific class of Unique items, instead of chests containing Scarabs."
    - "Syndicate Rewards in non-Intervention Safehouses that previously gave chests containing Scarabs, instead now grant chests containing a specific Allflame Ember."
    - "Rin's Research reward is now a trapped stash containing different Threads."
    - "Catarina now always drops either an Allflame Ember of Propagation, of Kulemak or of the Ethereal."
    - "Veiled Items have been removed as reward outcomes from non-Betrayal content."

- id: bestiary-yellow-beasts
  category: mechanics
  verdict: rework
  title: "Bestiary: beast vàng không còn bị bắt nữa"
  image: atlas-bestiary
  summary: >-
    Einhar giờ chỉ bắt beast đỏ và boss. Beast vàng vẫn spawn và vẫn phải
    giết, nhưng không được lưu lại và không công thức nào cần tới chúng. Craft
    flask giờ tốn một beast đỏ bất kỳ.
  impact:
    meaning: >-
      Menagerie của bạn không còn đầy những con beast bạn chẳng bao giờ dùng,
      đó là một cải tiến tiện lợi rõ ràng. Cái đánh đổi nằm ở craft flask:
      thêm một mod lên flask trước dùng beast vàng rẻ tiền, giờ dùng beast đỏ,
      mà beast đỏ thì hiếm hơn.
    todo: >-
      Đầu league, hãy craft mod flask bằng crafting bench hoặc Orb of
      Alteration, và để beast đỏ dành cho những công thức đáng giá.
    confidence: confirmed
  official:
    - "Yellow beasts in your Maps are no longer captured by Einhar."
    - "As Yellow Beasts are no longer captured, they are no longer a requirement for any Beastcrafting Recipes."
    - "Beastcrafting options to add Modifiers to Flasks now require any Red Beast to use."
    - "Existing Yellow Beasts in your Menagerie will be deleted upon logging in."

- id: gwennen-take-a-chance
  category: mechanics
  verdict: rework
  title: "Gwennen không còn bán cược item"
  image: astragali
  gallery: [atlas-expedition]
  summary: >-
    Bạn không còn cược item với Gwennen được nữa. Với một [[Astragali]], bà ấy
    giờ mời bạn "thử vận" với một item Rare của bạn: ba cặp lựa chọn craft,
    bạn chọn một cặp, rồi một lần tung xu quyết định cái nào trong hai được áp
    lên item.
  impact:
    meaning: >-
      Cược base type cụ thể ở Gwennen là cách người chơi đuổi theo các Unique
      đỉnh như Mageblood và Headhunter mà không cần tự tìm được. Con đường đó
      đóng rồi.


      Dịch vụ mới là một ván cược craft trên gear bạn đã có. Mỗi cặp còn tốn
      thêm Broken Circle Artifact.
    affected: >-
      Gwennen đi rồi thì Orb of Chance bản cải tiến (bên dưới) trở thành cách
      để nhắm một Unique cụ thể.
    confidence: confirmed
  official:
    - "You can no longer Gamble for items with Gwennen. She instead now offers a new service inviting you to 'take a chance' on one of your Rare equipment items, at the cost of one Astragali."
    - "You'll be presented with three sets of two crafting options. Selecting a set causes Gwennen to flip her coin, randomly applying one of the crafting options to your item."

- id: orb-of-chance-rework
  category: crafting
  verdict: rework
  title: "Orb of Chance hiếm hơn, và thật sự có tác dụng"
  image: orb-of-chance
  summary: >-
    [[Orb of Chance]] giờ có tỉ lệ ra Unique item "significantly increased". Để bù lại,
    orb hiếm hơn nhiều, vendor không bán nữa, và chúng cũng không còn rơi theo
    stack lớn.
  points:
    - "Các craft ở bench từng tốn Orb of Chance giờ tốn Orb of Alteration."
    - "Công thức vendor bốn rarity cho 1 Orb of Chance (trước là 5)."
    - "Phí Gold trên Currency Exchange cao hơn."
  impact:
    meaning: >-
      Nhiều năm nay Orb of Chance là tờ vé số bạn tiêu mà không cần suy nghĩ.
      Giờ nó là một currency craft thật: dùng nó lên đúng một base type khi bạn
      muốn Unique của base đó.
    todo: >-
      Đừng dùng Orb of Chance lên item ngẫu nhiên, và đừng bán rẻ chúng trong
      mấy ngày đầu. Hãy để dành cho cái base có Unique mà build bạn cần.
    confidence: confirmed
  official:
    - "Significantly increased the chances to get a Unique Item from an Orb of Chance."
    - "Orbs of Chance are now much rarer, and are no longer offered by Vendors."
