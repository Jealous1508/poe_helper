# Big changes: things that alter how you play, farm or gear.
# "official" lines are shortened from the official patch notes.

- id: scarabs-to-threads
  category: endgame
  verdict: rework
  title: "Scarab biến mất. Threads lên thay."
  image: abyss-thread
  gallery: [legion-thread, blight-thread, abyss-scarab, legion-scarab, titanic-scarab]
  summary: >-
    Toàn bộ Scarab bị xoá khỏi game. Thay vào đó là mười [[Threads]], mỗi
    loại ứng với một league mechanic. Bạn nhét Thread vào Map Device để thêm
    mechanic đó vào map. Mỗi Thread thêm vào, tối đa tám cái, sẽ tăng tỉ lệ
    nổ ra các hiệu ứng ngẫu nhiên mạnh cho mechanic đó.
  points:
    - "Mười loại: Abyss, Bestiary, Betrayal, Blight, Breach, Expedition, Incursion, Legion, Ritual, Ultimatum."
    - "[[Frayed Thread]] đổi thành một Thread ngẫu nhiên."
    - "Thread cũng tăng rarity và độ khó của monster trong map."
    - "Scarab cũ trong Standard sẽ chuyển thành Thread tương ứng, hoặc thành Frayed Thread."
    - "Phần lớn nguồn từng rơi Scarab giờ rơi Threads: Eldritch Altar, strongbox (2–5 Threads), Tormented Heretic, Betrayal, Heist."
    - "Theo Q&A của GGG: mỗi mechanic có khoảng 5 đến 8 hiệu ứng Thread. Một Thread bảo đảm ít nhất một hiệu ứng."
    - "Theo Q&A của GGG: vài Thread đầu đóng góp phần lớn tỉ lệ. Thread thứ 7 và 8 chủ yếu tăng độ khó và phần thưởng."
  impact:
    meaning: >-
      Scarab từng là hơn một trăm item khác nhau, mỗi cái một hiệu ứng cố
      định, và một chiến thuật farm là công thức gồm bốn năm cái. Threads chỉ
      có mười item. Thread đầu tiên của một loại bật mechanic đó lên. Thêm
      Thread cùng loại không mua được một hiệu ứng cụ thể: nó chỉ đẩy xác
      suất ra hiệu ứng mạnh ngẫu nhiên lên cao.


      Nhiều hiệu ứng từng nằm trên Scarab giờ thành node trên Atlas tree mới,
      nơi bạn chốt được chắc chắn. Nói gọn: chọn map *có gì* là việc của
      Threads, còn chọn map *chạy ra sao* là việc của tree.
    winners: >-
      Người mới và người chơi nhẹ nhàng: chỉ phải học mười item thay vì một
      trăm, và một Thread là đủ để chơi một mechanic. Cùng với những ai ngán
      việc phải mua đủ bộ Scarab cho từng map.
    losers: >-
      Các chiến thuật dựng trên đúng một hiệu ứng Scarab cụ thể, và những
      Scarab không có Thread tương ứng như Divination, Cartography, Harbinger,
      Titanic và Ambush Scarab. Hiệu ứng của chúng còn sống hay không thì tuỳ
      vào Atlas tree.
    todo: >-
      Đầu league, tìm được Thread nào thì nhét Thread đó: chỉ một cái cũng đã
      thêm trọn một league mechanic vào map trống trơn. Về sau hãy chọn một
      hai mechanic rồi ăn cluster của chúng trên Atlas. Ba bốn Thread cùng
      loại là đã gom gần hết hiệu ứng bonus. GGG mô tả map tám Thread là
      "should be very difficult", nên hãy tăng dần.
    affected: >-
      Những cách farm mà người chơi dự đoán sẽ chết hẳn hoặc bị thương nặng:
      farm Stacked Deck qua Divination Scarab cũ, farm số lượng lớn map tám
      mod, và farm cluster jewel. Đây là cách cộng đồng đọc patch notes trước
      giờ mở server.
    confidence: confirmed
  official:
    - "Scarabs have been removed from the game. A new item type, Threads, have been added in their place."
    - "Threads can be used when entering an Atlas area through the Map Device to apply the associated League mechanic to the area. For each Thread expended, up to a maximum of eight, there are increasingly higher chances to apply powerful randomised transformative effects related to that League mechanic."
    - "Added a new Currency Item, Frayed Thread, which can be used to grant a random Thread, or vendored for a random Thread."
    - "Existing Scarabs will be converted to either a Thread related to that specific Scarab content, or a Frayed Thread."
    - "The majority of Scarab sources throughout the game instead now grant a number of Threads."

- id: no-random-league-mechanics
  category: endgame
  verdict: removed
  title: "Mười league mechanic không còn tự xuất hiện trong map"
  image: atlas-breach
  gallery: [atlas-legion, atlas-ritual, atlas-expedition, atlas-abyss, atlas-blight, atlas-bestiary, atlas-ultimatum, icon-betrayal, icon-incursion]
  summary: >-
    Abyss, Bestiary, Betrayal, Blight, Breach, Expedition, Incursion, Legion,
    Ritual và Ultimatum không còn tỉ lệ spawn ngẫu nhiên trong map. Chúng chỉ
    xuất hiện khi có Thread đưa chúng vào.
  points:
    - "Mechanic **primary** (mười cái kể trên): chỉ qua Thread."
    - "Mechanic **secondary** vẫn spawn ngẫu nhiên và vẫn có cluster trên Atlas: Essence, Harvest, Mercenaries, Ore Deposits, Rogue Exiles, Shrines, Strongboxes, Torment."
    - "Mechanic **tertiary** vẫn spawn ngẫu nhiên, tree chỉ tăng tỉ lệ: Beyond, Buried Sentinels, Delirium Mirrors, Mirage, Viridian Wildwood."
    - "Các mod Memory Altar từng bật mechanic primary đã bị tắt."
  impact:
    meaning: >-
      Đây là thay đổi lớn nhất về cảm giác chạy map. Trước đây một map không
      đầu tư gì vẫn ra một Breach chỗ này, một Expedition chỗ kia. Giờ map
      không Thread chỉ còn content secondary và tertiary. Bạn đánh cái gì là
      cái bạn đã chọn.


      Nó cũng có nghĩa điểm Atlas đổ vào một mechanic primary tự nó không làm
      gì cả. Một cluster Legion mà không có Legion Thread, hay một Legion
      Shaped Region, là điểm bỏ đi.


      Một điểm cộng GGG có nhắc: bạn không cần "block" mechanic mình không
      thích nữa. Không bao giờ nhét Betrayal Thread thì Betrayal không bao giờ
      xuất hiện.
    winners: >-
      Người muốn chạy một mechanic mỗi map: giờ chỉ một Thread là chắc chắn
      có, không phải cầu tỉ lệ spawn.
    losers: >-
      Người thích sự ngẫu nhiên đa dạng của map, và những nhân vật đầu league
      còn chưa tìm được Thread nào.
    todo: >-
      Trong những map đầu, hãy dựa vào Shaped Region (chúng cho Thread miễn
      phí, xem bên dưới) và đổ điểm Atlas sớm vào mechanic secondary cùng các
      node chung, vì chúng chạy trong mọi map mà không cần Thread nào.
    confidence: confirmed
  official:
    - "The following league mechanics no longer have a random chance to spawn in Map areas: Abyss, Bestiary, Betrayal, Breach, Blight, Expedition, Incursion, Legion, Ritual, and Ultimatum."
    - "Memory Altar modifiers that enabled Primary League Mechanics such as Abyss, Breach or Legion have been disabled."
    - "Tertiary League mechanics, such as Beyond, Buried Sentinels, Delirium Mirrors, Mirage, and the Viridian Wildwood now only have Atlas Passive clusters that increase the chance for that mechanic to randomly appear in Maps."

- id: atlas-tree-rework
  category: atlas
  verdict: rework
  title: "Atlas passive tree được dựng lại hoàn toàn"
  image: voidstone
  figure:
    image: league-atlas
    caption: "Atlas tree mới. Bạn bắt đầu từ giữa rồi đi dần ra ngoài. Ảnh: Grinding Gear Games."
  summary: >-
    Atlas tree có layout mới, khởi điểm nằm ở trung tâm. Cluster của từng
    mechanic đều được thiết kế lại, cluster Scarab giờ thành cluster Thread,
    còn cluster Delve và Heist bị xoá. Tổng điểm là 150, tăng từ 138.
  points:
    - "Maven, Searing Exarch, Eater of Worlds và mỗi Invitation trong sáu Invitation của Maven cho **2 điểm** (trước là 1). Uber Elder cho **4** (trước là 1)."
    - "Cluster chung mới: Magic, Rare và Unique monster, Divination Card, Gold, Map."
    - "Keystone mới **Phantom Anomalies**: Atlas Anomaly xuất hiện khi bạn hoàn thành Shaped Region, ở bất kỳ góc nào của Atlas."
    - "**Unwavering Vision** làm lại: map của bạn chỉ còn một loại Thread, 75% Thread tìm được biến thành Gold, và map có Thread được thêm 2 Thread, số này vượt được mức tối đa 8."
    - "Keystone bị xoá: Crop Rotation, Endless Tide, Lucid Dreams, Meticulous Appraiser, Refiner's Bargain, Synthesised Stability."
    - "Speaker of the Dead: chạm tối đa 50 monster khi đang Possessed (trước là 40), trong 30 giây (trước là 20)."
  impact:
    meaning: >-
      Mọi Atlas tree bạn từng lưu hay bookmark đều hết dùng được. Không có gì
      mang sang, nên hãy chuẩn bị học lại cây từ đầu.


      12 điểm thêm đều đến từ boss. Mười quest boss đó trước cho tổng 10 điểm,
      giờ cho 22. Không đánh boss thì bạn vẫn chỉ có 128 điểm như cũ, nên giết
      Maven, hai boss Eldritch và Uber Elder quan trọng hơn trước nhiều.


      Unwavering Vision là keystone dành cho người farm một mechanic duy nhất:
      mười Thread cùng loại mỗi map, trả giá bằng gần hết số Thread rơi ra.
    winners: >-
      Người đánh boss, vì được nhiều điểm nhất. Người farm một mechanic. Và
      bất kỳ ai có hiệu ứng Scarab yêu thích giờ đã thành node chốt chắc trên
      tree.
    losers: >-
      Dân Delve và Heist thuần, mất sạch cluster. Nhân vật không giết được
      pinnacle boss thì thua 22 điểm.
    todo: >-
      Giai đoạn đầu hãy lấy node chung (Map, Rare monster) và một mechanic
      secondary chạy được mà không cần Thread. Thêm mechanic primary khi bạn
      đã có nguồn Thread ổn định.


      Các bản tree sớm mà người chơi đăng trước giờ mở server đều mở đầu giống
      nhau: node rơi map, rồi cluster Shrine để mỗi map có vài Shrine. Lúc
      chúng tôi viết bài này thì chưa ai kịp thử. Các guide không khuyên lấy
      Unwavering Vision cho league start, vì nó phá luôn phần lớn Thread bạn
      tự farm được.
    confidence: confirmed
  official:
    - "The Atlas Passive Tree has been completely reworked. You now begin at the centre of the tree, and head outwards."
    - "The total number of Atlas Passive Skill Points you can earn has been increased to 150 (previously 138)."
    - "The quest reward for defeating the Maven, Searing Exarch, Eater of Worlds and for each of Maven's six special Invitations is now 2 Atlas Skill points. The quest reward for defeating the Uber Elder is now 4."
    - "Atlas Passive clusters related to Delve and Heist have been removed."
    - "All Scarab related Atlas Passive clusters have been replaced with Thread related clusters."
    - "The Unwavering Vision Keystone has been reworked."

- id: shaped-regions-rework
  category: atlas
  verdict: rework
  title: "Shaped Region giờ phát Thread miễn phí"
  image: chaotic-astrolabe
  figure:
    image: league-threads
    caption: "Một map nằm trong Abyss Shaped Region được tặng một Abyss Thread miễn phí. Ảnh: Grinding Gear Games."
  summary: >-
    Atlas của bạn khởi đầu với mười Shaped Region, mỗi loại Thread một cái.
    Map nằm trong region được Thread miễn phí của loại đó. Mỗi lần bạn hoàn
    thành mục tiêu của region trong một map, tất cả map còn lại trong region
    đó được thêm một Thread miễn phí nữa.
  points:
    - "Hoàn thành mục tiêu không còn cộng mod bonus cho các map khác."
    - "Theo FAQ của GGG: map trong region luôn chạy kèm Thread miễn phí của nó, và sau khi bạn chạy xong thì map rời khỏi region."
    - "Nếu bạn còn ít hơn mười region, một nút ở giữa Atlas sẽ tạo lại toàn bộ."
    - "Astrolabe giờ đặt một region đúng loại của nó lên map bạn chọn, với số Thread miễn phí khởi điểm cao hơn. Region cũ cùng loại bị xoá."
    - "Templar, Fruiting và Deceptive Astrolabe bị xoá, gộp thành Cryptic Astrolabe."
    - "Templar Vault giờ là Atlas Anomaly, có tỉ lệ xuất hiện sau khi bạn giết một pinnacle Eldritch boss."
  impact:
    meaning: >-
      Đây là động cơ cho giai đoạn endgame đầu tiên. Bạn không cần tìm hay mua
      Thread để chơi league mechanic: chạy các map trong một Shaped Region,
      hoàn thành mục tiêu của nó, rồi những map lân cận sẽ đầy Thread miễn phí.


      Astrolabe trở thành công cụ nhắm mục tiêu. Hãy đặt region bạn quan tâm
      lên đúng những map bạn thích chạy.
    todo: >-
      Khi lên map, nhìn xem mỗi map nằm trong Shaped Region nào trước khi
      quyết định chạy cái nào. Dọn sạch cả một region từng map một sẽ làm mọi
      map sau trong đó giàu hơn.
    confidence: confirmed
  official:
    - "The Shaped Region system has been completely reworked. There are 10 types of Shaped Region, each associated with a specific type of Thread."
    - "Shaped Regions grant affected Maps free Threads of that type. Successfully completing the Shaped Region objective in each Map increases the free Thread count by 1 in all other Maps affected by that Shaped Region."
    - "Astrolabes have been changed to add a Shaped Region of the specified type to a specific Map on the Atlas, removing existing Shaped Regions of that type."
    - "Templar Vaults are now Atlas Anomalies which have a chance to spawn on killing Pinnacle Eldritch Bosses."

- id: loot-rarity-rework
  category: loot
  verdict: rework
  title: "Loot làm lại: Rarity quyết định currency tốt tới đâu"
  image: divine-orb
  gallery: [scroll-of-wisdom, orb-of-alteration, chaos-orb, exalted-orb, mirror-of-kalandra]
  summary: >-
    Item Rarity của monster giờ quyết định nó rơi được những loại item nào.
    Rarity cao gạt Scroll và currency rẻ ra khỏi pool, chỉ để lại currency có
    giá. Đổi lại, Rare và Unique monster không còn bị phạt tỉ lệ rơi currency
    như trước.
  points:
    - "Scroll of Wisdom và Portal Scroll chỉ rơi khi roll ra \"Normal\"."
    - "**Magic currency** (Transmutation, Alteration, Jeweller's) chỉ rơi khi roll ra \"Magic\"."
    - "**Rare currency** (Alchemy, Chaos, Divine, Mirror) chỉ rơi khi roll ra \"Rare\"."
    - "Đã bỏ: Magic monster giảm 50% và Rare, Unique monster giảm 80% tỉ lệ rơi currency cùng gem."
    - "Rarity cao cũng cho Divination Card hiếm hơn và, ở level cao, Unique hiếm hơn."
    - "Item Rarity trên trang bị của bạn kém hiệu quả hơn khi tìm item Magic, Rare và Unique. Giờ nó giúp tìm item có Item Tier."
    - "Theo FAQ của GGG: Item Rarity trên gear **không** ảnh hưởng tới currency rơi ra. Chỉ Rarity của map và monster mới ảnh hưởng."
  impact:
    meaning: >-
      Trước patch này, Rarity chỉ đổi màu trang bị, còn monster bự thì thực ra
      rơi currency rất tệ. Phần lớn currency đến từ việc giết thật nhiều
      monster thường.


      Giờ thì ngược lại. Một Rare hay Unique monster, với Rarity cao có sẵn,
      bỏ qua đồ rác và roll thẳng vào pool Chaos với Divine. Phần lớn currency
      có giá sẽ đến từ Rare, Unique và boss.


      GGG nói boss sẽ rơi Divine Orb "far more often" nhưng không đưa
      con số nào. Nhiều người dự đoán bản đầu sẽ bị tune thấp quá rồi chỉnh
      lại trong vài tuần đầu, nên đừng đánh giá hệ thống qua ngày đầu tiên.
    winners: >-
      Build có damage đơn mục tiêu mạnh, dân farm boss, và những content spawn
      nhiều Rare monster. Map mod và node Atlas cho thêm Rarity hoặc thêm Rare
      monster đều lên giá.
    losers: >-
      Các chiến thuật "pack size" thuần, kiểu farm hàng nghìn monster thường,
      và những nhân vật mặc gear Item Rarity, vì nó giờ làm được ít hơn trước.
    todo: >-
      Đừng bỏ qua Rare monster và map boss nữa. Trong loot filter, Scroll và
      currency rẻ sẽ tự thưa dần ở content khó, nên bạn có thể ẩn chúng muộn
      hơn bình thường.
    confidence: confirmed
  official:
    - "Fundamentally changed how Items are generated in Path of Exile."
    - "Item Rarity on monsters and chests has changed to now affect which Drop Pools can be selected."
    - "Currency item Drop Pools have been split into a Magic Currency and Rare Currency. Magic Currency can only generate if the selected Rarity was Magic, and Rare Currency can only generate if the selected Rarity was Rare."
    - "We have removed 50% less chance to drop items that can't have rarity from Magic Monsters, and 80% less from Rare and Unique monsters."
    - "Decreased the efficacy of player Item Rarity on finding Magic, Rare and Unique Rarity items."

- id: quantity-to-atlas-drops
  category: loot
  verdict: rework
  title: "Item Quantity bị xoá. Map có Atlas Drops thay thế."
  image: cartographers-chisel
  gallery: [map-tier-16, fragment-of-knowledge, mavens-chisel]
  summary: >-
    Gần như mọi nguồn tăng Item Quantity trên monster đều bị xoá và thay bằng
    Rarity. Trên item map, Item Quantity trở thành **Atlas Drops** với đúng
    con số cũ, và nó tăng map, Threads cùng phần thưởng riêng của mechanic,
    chứ không tăng loot chung.
  points:
    - "1% Atlas Drops = tìm được thêm 1% Map và Thread trong khu vực."
    - "Nó cũng tăng các đồ rơi đặc biệt (Legion Splinter, Conqueror's Exalted Orb) và tài nguyên league (Lifeforce, Hiveblood)."
    - "Quantity bị bỏ khỏi: mod của Rare và Magic monster, sương Delirium, Sentinel, Opulent Ritual, Tempest, Covetous Shrine, trinket Heist."
    - "Shaper, Elder và Conqueror Fragment không còn cộng Quantity cho map, và cũng không còn bị tiêu thụ."
    - "Các lựa chọn Quantity ở Eldritch Altar và Memory Altar bị xoá; lựa chọn Rarity của chúng cũng thấp hơn."
    - "Map chưa identify cho +30% Atlas Drops."
  impact:
    meaning: >-
      "Quantity" từng là chỉ số vua: nhiều hơn ở mọi thứ. Nó không còn tồn tại
      ở dạng đó nữa. Roll map khó vẫn có lời, nhưng cái bạn lời là map để duy
      trì, Threads, và phần thưởng của mechanic bạn nhét vào. Currency thì đến
      từ Rarity và từ Rare monster, như entry loot phía trên đã nói.


      Thói quen cũ là nhồi Fragment vào mấy slot Map Device còn trống để lấy
      thêm Quantity. Thói quen đó chết rồi.
    affected: >-
      Mọi guide farm từ 3.29 mà bảo "stack quantity" đều cần đọc lại. Patch
      notes không nhắc gì tới Item Quantity trên gear của bạn, nên hãy coi các
      setup magic-find cũ là chưa kiểm chứng.
    todo: >-
      Nếu bạn farm một league mechanic thì vẫn cứ roll map cho nhiều mod, vì
      phần thưởng của mechanic scale theo Atlas Drops. Chạy map chưa identify
      là 30% miễn phí.
    confidence: confirmed
  official:
    - "Rare and Magic Monster modifiers no longer add Quantity of Items Dropped to Monsters. The amount of Rarity granted has been increased."
    - "Replaced Item Quantity on Map Modifiers with Atlas Drops at the same values."
    - "Each percentage of increased Atlas Drops increases the quantity of Maps and Threads found in the area by 1%."
    - "Shaper, Elder and Conqueror Fragments no longer grant increased Item Quantity to Maps, and will no longer be consumed when used along with a Map."
    - "The Eldritch and Memory Trace Altars that granted increased Quantity of Items found have been removed."

- id: fractured-items-rarer
  category: crafting
  verdict: nerf
  title: "Fractured item giờ ra từ rất ít nguồn"
  image: fracturing-orb
  summary: >-
    Legion, Ritual, Heist, Blight, Delirium, Delve và Incursion không còn rơi
    fractured item, cùng với vài nguồn khác cũng bị xoá. Nguồn chính mới là
    item Tier 5, chúng có tỉ lệ rơi ra dưới dạng fractured Magic item.
  impact:
    meaning: >-
      Fractured item có một mod bị khoá cố định, nên nó là điểm khởi đầu của
      rất nhiều craft. Trước đây chúng tuôn ra từ league mechanic. Giờ chúng
      gắn vào hệ thống Item Tier mới, mà hệ thống đó lại phụ thuộc vào Rarity
      của monster.
    losers: >-
      Người chơi SSF và dân craft ít tiền, những người vẫn lượm base fractured
      dưới đất để craft Essence hay Harvest. Và dân farm Ritual, với họ
      fractured item là nguồn thu đầu league khá đều.
    affected: >-
      Dự kiến base fractured có mod đáng dùng, và cả [[Fracturing Orb]], sẽ
      đắt hơn league trước. Đây là dự đoán: giá những ngày đầu chưa ổn định.
    todo: >-
      Bật hiện item Magic và Rare Tier 5 trong loot filter, rồi xem chúng có
      mod fractured nào dùng được không.
    confidence: prediction
  official:
    - "Tier 5 items have a chance to drop as Fractured Magic items."
    - "Removed many sources of Fractured Items dropping, primarily from League Mechanics such as Legion, Ritual, Heist, Blight, Delirium, Delve and Incursion."
    - "Removed the random Rare monster modifier conversion for all Items dropping as Fractured."
    - "The Forgotten and The Feared Maven Invitations no longer drop bonus Fractured rare items."

- id: incursion-atziri-rework
  category: mechanics
  verdict: rework
  title: "Incursion: Atziri dọn vào Temple"
  image: icon-incursion
  gallery: [royal-visage, soul-core-of-might, vial-of-fate, mortal-hope, sacrifice-at-midnight]
  summary: >-
    Atziri thay Vaal Omnitect làm boss của Temple of Atzoatl. Sacrifice và
    Mortal Fragment, Alluring Abyss cùng toàn bộ Vial đều bị xoá. Double
    corruption trong Temple giờ hoạt động như một lần corrupt thứ hai lên item
    đã corrupt rồi.
  points:
    - "Temple có phòng **Cradle of Creation** (Throne of Atziri cũ) sẽ là khu vực level 84 và chứa Uber Atziri."
    - "Các Unique từng cần Vial giờ rơi trong Temple có Cradle of Creation."
    - "**Altar of Corruption và Lapidary Lens** corrupt item hoặc gem lần thứ hai (\"Twice Corrupted\"). Cả hai giờ đều có thể phá item."
    - "Trận Atziri: không còn pause, không còn giai đoạn miễn sát thương, và có adds hồi máu sau mỗi lần phân thân. Clone trong gương phản 15% damage (trước là 100%)."
    - "Mortal Fragment chuyển thành [[Royal Visage]]. Sacrifice Fragment vẫn còn nhưng không còn tác dụng gì."
    - "Vaal side area không còn xuất hiện trong map. Công thức Vaal Orb giờ là 5 Vaal skill gem."
  impact:
    meaning: >-
      Clone phản damage chính là cú one-shot nổi tiếng của trận Atziri. Ở mức
      15% thì nó chỉ còn là một lỗi bạn sống sót được, nên trận này thân thiện
      hơn nhiều với người mới và với build damage cao.


      Double corruption có thêm một bước để bạn kiểm soát. Bạn có thể corrupt
      item bằng Vaal Orb trước, xem kết quả, rồi chỉ mang vào Temple corrupt
      lần hai nếu lần đầu ra đẹp. Giá phải trả là bước thứ hai có thể phá item.


      Farm Sacrifice Fragment rồi chạy Atziri từ Map Device, một nguồn thu đầu
      league kinh điển, không còn nữa.
    winners: >-
      Người chủ động xây Temple: Cradle of Creation kéo cả Temple lên level 84
      với phần thưởng mạnh hơn. Người bán Temple: lần corrupt thứ hai cho gem,
      gear và map giờ đều đi qua đây.
    losers: >-
      Những ai từng bán bộ Sacrifice Fragment hoặc Vial để lấy currency sớm.
    confidence: confirmed
  official:
    - "Atziri has taken up residence in the Temple of Atzoatl, evicting the Vaal Omnitect."
    - "While the Temple of Atzoatl contains the Cradle of Creation room, it will be area level 84 and contain Uber Atziri."
    - "The Altar of Corruption and Lapidary Lens have been changed to instead Corrupt an Equipment Item or Gem a second time."
    - "The mirror clone now passively reflects 15% of Physical and Elemental Damage taken to the attacker (previously 100%)."
    - "Sacrifice and Mortal Fragments have been removed. The Alluring Abyss is no longer on the Atlas."
    - "Vaal Side Areas can no longer be found in Maps."

- id: harvest-rework
  category: mechanics
  verdict: rework
  title: "Harvest diễn ra ngay trong map, không còn Sacred Grove"
  image: atlas-harvest
  gallery: [wild-lifeforce, vivid-lifeforce, primal-lifeforce]
  summary: >-
    Cổng vào Sacred Grove không còn nữa. Sacred Flora giờ mọc thẳng trong map.
    Bấm vào một cây, giết đám monster trồi lên từ rễ để lấy Lifeforce, rồi cây
    sẽ thả Wildwood Wisp cùng màu ra khắp phần còn lại của map.
  points:
    - "Mỗi Flora thuộc một trong ba loại: Wild, Primal hoặc Vivid."
    - "Ở map tier cao, một Flora có thể là Sacred Specimen, thứ spawn ra boss Harvest."
    - "Lifeforce rơi theo stack lớn hơn. Tổng Lifeforce dự kiến vẫn tương đương như trước."
    - "Harvest không cần Thread. Nó có thể xuất hiện vài lần trong một map, và GGG nói Atlas tree có thể bảo đảm khoảng năm cái."
    - "Đổi một mod resistance tốn 300 Lifeforce của **hai** loại (trước là 500 của một loại)."
    - "Cửa cược Divination Card tốn 1,000 của cả ba loại (trước là 1,500 Vivid)."
  impact:
    meaning: >-
      Harvest nhanh hơn: không màn loading, không phải chọn giữa hai luống.
      Wisp là phần bonus mới. Chúng buff monster ở phần còn lại của map, nên
      thứ tự bạn dọn map giờ có ý nghĩa.


      Craft thì tốn hai màu Lifeforce, nên bạn không thể chỉ farm một màu rồi
      quy đổi ra mọi craft như trước.
    todo: >-
      Hãy mở Sacred Flora sớm trong map, trước khi dọn phần còn lại, để wisp
      thả ra còn kịp rơi vào monster đang sống.
    confidence: confirmed
  official:
    - "Harvest encounters have been reworked to no longer be within a specific subarea. Instead, a number of Sacred Flora can spawn within a Map."
    - "Once the majority of the Sacred Fauna have been slain, the Sacred Flora will discharge Wildwood Wisps matching the colour of the Flora into the rest of the area."
    - "Harvest Monsters now drop Lifeforce in higher stack sizes. The intention is that the amount of Lifeforce you gain is similar to before."
    - "Horticrafting crafts that change one type of Resistance into another now cost 300 Lifeforce of two different types (previously 500 of one type)."

- id: mirage-goes-core
  category: mechanics
  verdict: mixed
  title: "Mirage trở thành phần cố định của game"
  image: icon-mirage
  gallery: [black-barya, refracting-fog, afarud-crystal, heroic-tragedy]
  summary: >-
    Mechanic của league trước được giữ lại. Mirage có thể xuất hiện trong mọi
    map, hoặc đến từ một map mod mới. Một Mirage giờ phủ kín cả map. Saresh
    thì "khó hơn đáng kể", và Djinn Coin bị xoá.
  points:
    - "[[The Black Barya]] xuất hiện trên Atlas ở mọi league, khu vực level 84."
    - "[[Refracting Fog]] có thể rơi từ boss Delirium trong map Tier 14 trở lên."
    - "Sigil trên điều ước của Djinn có hiệu ứng mới, ví dụ 100% more Astral Anomalies."
    - "Jewel [[Heroic Tragedy]] giờ rơi từ Olroth, và ba passive của nó bị giảm."
    - "Djinn-Touched Vaal Orb làm item thành Twice Corrupted."
    - "Có thêm Afarud Enshrouding Crystal cho unique quiver."
  impact:
    meaning: >-
      Mirage phủ kín cả map nghĩa là bạn gần như dọn map lần thứ hai, nên nó
      thưởng cho build clear nhanh.


      Phần nerf Heroic Tragedy giáng vào build Ward: hồi ít Ward hơn khi dùng
      flask, và Celestial Mathematics cho 15% Ward thành added cold damage,
      giảm từ 25%.
    losers: >-
      Các build Ward-stacking từng dùng Heroic Tragedy league trước.
    confidence: confirmed
  official:
    - "Mirages can now be found in Map Areas. The Black Barya can now appear on the Atlas in all Leagues."
    - "The Saresh, of the Weeping Black fight has been made significantly more difficult."
    - "Coins of Restoration and Desecration are no longer obtainable, and existing items will be deleted upon logging in."
    - "The Celestial Mathematics Keystone Passive now gains Added Cold Damage equal to 15% of Ward (previously 25%)."
    - "The Forgotten Afarud Commander no longer drops the Heroic Tragedy. It instead has a chance to drop from Olroth, Origin of the Fall."

- id: delirium-orb-rework
  category: mechanics
  verdict: rework
  title: "Delirium Orb giờ roll ra độ mạnh ngẫu nhiên"
  image: delirium-orb
  gallery: [atlas-delirium, simulacrum-splinter]
  summary: >-
    [[Delirium Orb]] không còn thêm một lớp 20% cố định dạng enchantment. Giờ
    nó reforge map Rare kèm một mod Delirious từ 5% đến 50%. Nhiều orb cùng
    loại sẽ cộng dồn, tối đa 100%.
  points:
    - "Một phần thưởng theo loại orb, cộng thêm một phần thưởng nữa cho mỗi 20% Delirious."
    - "Dùng loại phần thưởng khác sẽ reset phần trăm về đầu."
    - "Delirium Mirror trong map: sương lan nhanh hơn và kéo dài hơn, nhiều Orb, Cluster Jewel và Splinter hơn, kèm tỉ lệ ra 1–3 phần thưởng bonus."
    - "Skittering Delirium Orb đổi tên thành Threaded Delirium Orb và cho Threads."
  impact:
    meaning: >-
      Một map delirious đầy trước đây tốn đúng năm orb. Giờ nó có thể chỉ cần
      hai orb may mắn, hoặc rất nhiều orb xui.


      Patch notes nói orb "reforge" map. Cách đọc phổ biến là nó hoạt động như
      một Chaos Orb có kèm thêm mod Delirious: nó roll lại các mod khác của map
      và chiếm một slot mod. Vậy là bạn không thể roll map hoàn hảo trước rồi
      thêm Delirium sau. Hãy thử trên một map rẻ trước khi xuống tay thật.
    todo: >-
      Dùng Delirium Orb trước, rồi mới xét mấy cái mod map mà bạn nhận được.
    confidence: prediction
  official:
    - "Delirium Orbs no longer apply enchantments to Maps. Instead they reforge rare Map items with an explicit modifier making players in the area Delirious."
    - "Each Delirium Orb applies between 5 to 50% Delirious percentage. Applying multiple Delirium Orbs of the same type will add to the current Delirious percentage, up to 100%."
    - "Delirium Orbed Maps have one reward of the specified type and an additional reward of that type for every 20% Delirious Percentage."

- id: beyond-rework
  category: mechanics
  verdict: buff
  title: "Beyond: Demonic Evocator và cõi của quỷ"
  image: atlas-beyond
  gallery: [tainted-chaos-orb]
  summary: >-
