    - "Crafting Bench Options that cost Orbs of Chance now cost an equivalent amount of Orbs of Alteration."

- id: meta-crafting-costs
  category: crafting
  verdict: mixed
  title: "Meta-craft: khoá một mod thì rẻ hơn, khoá cả bên thì đắt hơn"
  image: sacred-orb
  gallery: [divine-orb, blessed-orb, exalted-orb]
  summary: >-
    Có bốn craft bench mới chỉ bảo vệ một hoặc hai prefix hay suffix, giá 1
    hoặc 2 Divine Orb. FAQ của GGG kèm theo một cái bẫy: game tự chọn ngẫu
    nhiên mod nào được bảo vệ và không cho bạn biết. Hai craft đầy đủ
    "Prefixes cannot be changed" và "Suffixes cannot be changed" giờ tốn 4
    Divine Orb cộng thêm một currency thứ hai tuỳ loại item.
  points:
    - "Weapon: 4 Divine + 1 [[Sacred Orb]]."
    - "Armour và quiver: 4 Divine + 4 Blessed Orb."
    - "Jewellery: 4 Divine + 8 Exalted Orb."
    - "Công thức meta-modifier giờ tìm thấy trong Nightmare Map. Unique Map không còn chứa công thức craft."
    - "Sacred Orb rơi nhiều hơn."
  impact:
    meaning: >-
      Bảo vệ trọn một bên của item giờ đắt gần gấp đôi. Mấy craft mới là một
      ván cược rẻ hơn, chứ không phải công cụ chính xác: một trong các prefix
      (hoặc suffix) của bạn sẽ sống, và bạn không được chọn cái nào. Chúng chỉ
      an toàn khi mọi mod ở bên đó đều là mod bạn muốn giữ.


      Một giả thuyết phổ biến trong cộng đồng là chi phí cao hơn chính là chỗ
      để hút bớt lượng currency giá trị mà bản loot rework dự kiến sẽ rơi
      nhiều hơn.
    affected: >-
      Mọi guide craft tính một bước là "2 Divine cho prefixes cannot be
      changed" đều đã lạc hậu.
    confidence: confirmed
  official:
    - "Added four new Meta-Crafting Bench options: 1 or 2 Prefix or Suffix Modifiers cannot be changed, for a cost of 1 or 2 Divine Orbs."
    - "Prefixes/Suffixes cannot be changed on Weapons now has a cost of 4 Divine Orbs and 1 Sacred Orb; on Armour and Quivers 4 Divine Orbs and 4 Blessed Orbs; on Jewellery 4 Divine Orbs and 8 Exalted Orbs."
    - "Crafting Recipes are no longer found in Unique Maps. Crafting Recipes for all Meta-Modifiers have been moved to Nightmare Maps."

- id: mercenary-nerfs
