    - "Ba map mod có thể thêm Evocator của Beidat, K'Tash hoặc Ghorr."
  impact:
    meaning: >-
      Beyond trước đây hết trả thưởng ngay khi boss của nó xuất hiện. Giờ nó
      chạy suốt cả map, và bạn tự chọn: muốn thì chạm vào Evocator. Nó thêm
      rất nhiều monster, nên chỉ làm khi nhân vật của bạn gánh map đó thoải
      mái.
