- id: heist-delve-access
  category: mechanics
  verdict: rework
  title: "Heist và Delve: hết spawn ngẫu nhiên, có đường vào mới"
  image: atlas-heist
  gallery: [rogues-marker, atlas-delve]
  summary: >-
    Smuggler's Cache và Sulphite Vein không còn xuất hiện ngẫu nhiên. Một số
    map sẽ luôn có chúng. Rogue's Marker, Contract và Blueprint ngừng rơi từ
    monster thường, và Whakano bán Contract lấy Gold từ level 68.
  points:
    - "Sulphite Vein cho thêm tới 50% Sulphite và luôn có lính canh."
    - "Cache cho nhiều Blueprint và Marker hơn. Blueprint từ những map này có thể có implicit đặc biệt."
    - "Bán target Heist cho Faustus được tới gấp đôi số Marker."
    - "Contract từ level 68 trở lên có thể tặng một lượt reveal Blueprint miễn phí."
    - "Cluster Delve và Heist trên Atlas bị xoá."
  impact:
    meaning: >-
      Bạn không còn vô tình gom được đống Sulphite và Contract nữa. Muốn Delve
      hay Heist thì chạy đúng những map nuôi chúng, hoặc mua Contract từ
      Whakano bằng Gold. Không muốn thì chúng cũng không chen vào đường bạn.
    todo: >-
      Muốn bắt đầu Heist, hãy ghé shop Gold của Whakano khi bạn đạt level 68.
    losers: >-
      Khá nhiều người đọc patch này như một bước lùi cho Heist nói chung. Các
      base item đặc biệt của nó giờ cũng rơi ở nơi khác khi Item Tier cao, còn
      Contract thì không rơi từ monster nữa. GGG nói Heist vẫn là nguồn Simplex
      Amulet tốt nhất.
    confidence: confirmed
  official:
    - "Smuggler's Caches and Sulphite Deposits no longer have a random chance to spawn in Map areas."
    - "Several specific Maps on the Atlas now always spawn Sulphite Veins, or Smuggler's Caches."
    - "Whakano now sells Contracts and rarely Blueprints for Gold once you are level 68 or higher."
    - "Rogue Markers, Contracts and Blueprints are no longer part of the core drop pool."

