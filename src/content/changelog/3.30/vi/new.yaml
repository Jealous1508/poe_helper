# What is new: things that did not exist before this patch.
# "official" lines are shortened from the official patch notes and league page.

- id: league-fates
  category: league
  verdict: new
  title: "Coven và Fates: bạn tự chọn boss khó tới đâu"
  image: viscera-voltaic-skull
  figure:
    image: league-fates
    caption: "Chọn một Fate. Mỗi lá mô tả nó thêm gì vào trận boss. Ảnh: Grinding Gear Games."
  summary: >-
    Mỗi khu vực đều có những cái vạc của coven. Bấm vào một cái, dẹp đám
    covenite tràn ra, rồi bạn chọn một lá Fate. Khi tới chỗ boss của khu vực,
    bạn gọi tối đa ba Fate lên nó. Mỗi Fate làm trận đánh khó hơn và thêm
    phần thưởng.
  points:
    - "Nó chạy cả trong campaign lẫn trong map. Số vạc mỗi khu vực tăng dần theo tiến độ game, lên tới bốn hoặc năm cái."
    - "Các bài tổng hợp từ buổi reveal nói GGG đã sắp xếp lại campaign để mọi khu vực đều kết thúc bằng một con boss, và thêm hơn hai chục boss. Điều này không có trong patch notes."
    - "Bộ lá tiếp theo được giấu cho tới khi bạn chọn xong bộ hiện tại, nên không cần đi dò hết các vạc trước."
    - "**Lá trùng thì gộp.** Hai lá Fate giống nhau chỉ chiếm một slot và nhân ba phần thưởng của lá đầu."
    - "**Bộ sưu tập.** Vài lá hiện một hàng ô và trả thưởng khi bạn gom đủ số biểu tượng trùng khớp. Một bộ hai lá thưởng unique flask mới Dreadmaidens' Sacrament."
    - "Boss được Fate buff có thể rơi **Viscera** cho Wickerman của bạn (entry kế tiếp). Mỗi Fate làm tỉ lệ đó cao thêm."
  impact:
    meaning: >-
      League mechanic lần này xoay quanh boss, không phải quanh mấy pack
      monster. Điều đó khớp với bản loot rework trong cùng patch, nơi Unique
      monster giờ nằm trong nhóm nguồn currency tốt nhất. Trước ngày ra mắt,
      người chơi đã gọi đây là một "bossing league".


      Bạn quyết định độ khó ở từng lần. Fate là tuỳ chọn, nên nhân vật yếu có
      thể gọi một Fate nhẹ hoặc không gọi cái nào, còn nhân vật mạnh thì gọi
      đủ ba.
    winners: >-
      Build có damage đơn mục tiêu tốt và đủ thủ để đứng được trong một trận
      boss dài.
    losers: >-
      Build thuần clear map với damage boss yếu. Người chơi đã đặt dấu hỏi cho
      các starter chỉ biết clear vì lý do này. Họ vẫn chơi league được, nhưng
      sẽ gọi ít Fate hơn và kiếm được ít hơn từ nó. Map có boss khó chịu cũng
      tệ đi, vì boss giờ mới là content chính.
    todo: >-
      Đọc kỹ lá bài trước khi xác nhận. Gọi một Fate mỗi boss khi nhân vật còn
      yếu, và ba khi nó gánh nổi. Giữ lại các lá Fate trùng để ăn phần thưởng
      nhân ba. Mọi thứ ở đây được viết từ buổi reveal và FAQ của GGG, trước
      khi server mở.
    confidence: prediction
  official:
    - "You will encounter wicked covenites performing gruesome rites to summon their Queen."
    - "Upon disrupting the coven's magicks, you will get to select a Fate for the boss of the area you're in. Each Fate has a handful of effects, increasing both the rewards and difficulty of the encounter."
    - "A fully empowered boss can be quite a threatening fight."
    - "League page: every boss in the campaign, as well as every boss on a map in the Atlas, has a unique Viscera to be obtained."
    - "Details on cauldrons, card counts, duplicates and sets come from GGG's reveal, Q&A and FAQ thread, not from the patch notes."

- id: wickerman-viscera
  category: league
  verdict: new
  title: "Wickerman: nhận sức mạnh từ xác boss"
  image: viscera-ancestors-club
  gallery: [viscera-scholars-leg, viscera-distended-stomach, viscera-voltaic-skull, viscera-sirus-head]
  figure:
    image: wickerman-window
    caption: "Cửa sổ Wickerman với bốn slot của nó. Ảnh: Grinding Gear Games."
  summary: >-
    Boss được Fate buff có thể rơi Viscera: một cái sọ, một cái dạ dày, một
    khúc chi. Bạn gắn Viscera lên Wickerman của riêng mình, và mỗi mảnh cho
    nhân vật bạn một phần sức mạnh của chính con boss đó.
  points:
    - "Bốn slot: đầu, thân, chi trên, chi dưới."
    - "Hơn 120 loại Viscera khác nhau. Mọi boss campaign và boss map đều có loại riêng, với tối đa ba mức mạnh yếu."
    - "Boss thường thì không chắc chắn rơi. Tỉ lệ tăng theo mỗi Fate bạn gọi, và tăng thêm nếu có lá trùng."
    - "Viscera trade được. Còn Wickerman thì thuộc về một nhân vật."
    - "Ví dụ từ buổi reveal: một con Brutus được buff rơi ra Warden's Arm, cho maximum life."
  impact:
    meaning: >-
      Wickerman là hệ thống sức mạnh nhân vật của league này. Cứ hình dung nó
      như bốn slot trang bị thêm mà bạn lấp đầy bằng cách giết đúng boss.


      Vì boss campaign đánh đi đánh lại được, người chơi dự đoán sẽ nhặt được
      mảnh hữu ích khá sớm. Một danh sách "Viscera tốt nhất cho build của tôi"
      sẽ hình thành trong vài ngày. Trước lúc đó, bất kỳ Viscera nào nhét vào
      slot trống cũng là bonus miễn phí.
    todo: >-
      Lấp đủ bốn slot trong lúc chạy campaign bằng bất cứ thứ gì rơi ra. Khi
      lên map, tra xem Viscera nào hợp build của bạn rồi farm con boss đó hoặc
      mua lại mảnh đó.
    confidence: prediction
  official:
    - "The twisted witchcraft of the Coven allows you to put the remains of your fallen enemies to use by placing them on your own Wickerman."
    - "Obtain Viscera from a defeated boss empowered by Fates to claim a scrap of their power for your own."
    - "Slot count, drop chance and trading rules come from GGG's reveal and FAQ thread."

- id: grim-fates-coven-queen
  category: league
  verdict: new
  title: "Grim Fates và Coven Queen"
  image: viscera-sirus-head
  figure:
    image: league-grim-fate
    caption: "Grim Fates buff cho các pinnacle boss của Atlas. Ảnh: Grinding Gear Games."
  summary: >-
    Grim Fates là phiên bản endgame của mechanic này. Boss được Fate buff
    trong map tier cao có thể rơi một lá. Mỗi Grim Fate gắn với một pinnacle
    boss và làm trận đó khó hơn. Hạ được chúng là con đường dẫn tới boss cuối
    của league, Coven Queen.
  points:
    - "Pinnacle boss dưới một Grim Fate thì luôn rơi Viscera của nó."
    - "Mỗi pinnacle boss có một Viscera thường và một Greater Viscera. Bản Greater đến từ phiên bản Uber của con boss."
    - "Ví dụ GGG đã cho xem: một cái đầu Sirus mà bản Greater cho 10% tỉ lệ nổ xác khi giết, và một cái đầu Eater of Worlds có thể cho Frenzy Charge khi crit."
  impact:
    meaning: >-
      Đây là mục tiêu dài hơi của league dành cho nhân vật mạnh: những mảnh
      Wickerman tốt nhất đến từ pinnacle boss đã được làm khó thêm. Grim Fates
      hiếm tới mức nào thì chưa ai biết.
    todo: >-
      Không phải chuyện để lo lúc league start. Hãy quay lại đây khi nhân vật
      của bạn giết pinnacle boss thường một cách thoải mái.
    confidence: confirmed
  official:
    - "League page: Grim Fates allow you to empower the most difficult bosses within the Atlas. You'll be rewarded with the greatest of trophies, Pinnacle Boss Viscera."
    - "League page: Perhaps... you'll even be able to hold back the Queen herself."
    - "Drop source and Viscera examples come from GGG's reveal and teaser posts."

- id: item-tiers
  category: loot
  verdict: new
  title: "Item Tier: đồ rare dưới đất tự nói cho bạn biết nó có ngon không"
  image: shagreen-boots
  gallery: [cord-belt, stygian-vise, opal-ring]
  figure:
    image: league-loot
    caption: "Item có tier sẽ hiện tier ngay trong tên, trước cả khi bạn identify. Ảnh: Grinding Gear Games."
  summary: >-
    Từ Act 6, item Magic và Rare có thể rơi kèm Item Tier từ 2 đến 5, hiện
    ngay trong tên. Tier cao nghĩa là mod tốt hơn khi identify, cùng với tỉ lệ
    cao hơn để ra base level cao, có quality, nhiều socket và nhiều link.
  points:
    - "Rarity của monster và Item Rarity của chính bạn đều tăng tỉ lệ ra item có tier."
    - "Item Tier 5 có thể rơi kèm +1 item level, hoặc rơi ra dạng fractured Magic item."
    - "Các base đặc biệt giờ cần tier mới rơi: Steel Ring cần Tier 3 trở lên, Stygian Vise cần Tier 5."
    - "Mới vào pool rơi thường, kèm yêu cầu tier: Stygian Vise, Cord Belt, Simplex, Astrolabe và Focused Amulet, cùng các base ring của Heist (Cogwork, Composite, Geodesic, Helical, Manifold, Ratcheting)."
    - "Modifier Tier Rating được làm lại: nó không còn đổi *loại* mod bạn nhận, chỉ đổi mức roll cao hay thấp."
    - "Loot filter có hai điều kiện mới, UnidentifiedItemTier và Fated. Một filter strict kiểu cũ có thể ẩn mất đồ có tier, nên hãy cập nhật filter của bạn."
  impact:
    meaning: >-
      Trước đây một item Rare chưa identify là một hộp mù, và phần lớn người
      chơi đã bỏ không nhặt. Một item Tier 4 hay 5 giờ tự đánh dấu là đáng bỏ
      công, trước cả khi bạn tốn một cái Scroll lên nó.


      Nó cũng làm việc tự kiếm đồ mà chơi trở nên khả thi trở lại. Cuối
      campaign và đầu map là lúc điều này giúp nhiều nhất, khi bạn còn đang
      lấp từng slot.
    winners: >-
      Người mới và người chơi SSF. Cùng với bất kỳ ai đang lên đồ cho nhân vật
      thứ hai.
    losers: >-
      Không ai thiệt, nhưng kỳ vọng thì mỗi người một kiểu. Nhóm hoài nghi cho
      rằng phần lớn rare Tier 5 vẫn sẽ là đồ bán vendor, và thấy giá trị thật
      nằm ở item Magic có tier dùng làm base craft.
    todo: >-
      Chỉnh loot filter hiện Tier 3 trở lên cho những slot bạn còn thiếu, và
      Tier 5 thì luôn hiện. Phần lớn filter công khai sẽ có sẵn tuỳ chọn này.
    confidence: confirmed
  official:
    - "In Act 6 onwards, Rare and Magic Items now have a chance to generate with an Item Tier, ranging from 2 to 5. The tier of the item influences the modifier tier rating on the item when it is identified."
    - "Item Tier will influence the chance for the item to be a higher level base type, chance to have Quality, and chance to have more Sockets and Socket links."
    - "Tier 5 items have a chance to drop with +1 to Item Level. Tier 5 items have a chance to drop as Fractured Magic items."
    - "For example, Stygian Vise requires an Item Tier of 5 to drop, while Steel Ring requires an Item Tier of at least 3."
    - "Items in Ruthless do not have Item Tiers."

- id: new-skills
  category: skills
  verdict: new
  title: "Hai skill mới: Arcane Link và Fireball of Radiation"
  image: fireball
  gallery: [soul-link]
  summary: >-
    [[Arcane Link]] là skill chơi party: link sang một người chơi khác và họ
    gây thêm lightning damage dựa trên mana của bạn. [[Fireball of Radiation]]
    là bản transfigured của Fireball, dán một hiệu ứng fire damage-over-time
    ngắn nhưng mạnh lên vùng quanh chỗ quả cầu rơi xuống.
  points:
    - "Arcane Link: người chơi được link mà chết thì bạn cũng chết. Nó không trigger được và không dùng được bởi totem, trap hay mine."
    - "Arcane Link là quest reward của Scion (Breaking the Seal), còn Marauder, Duelist và Templar mua được từ Petarus và Vanja."
  impact:
    meaning: >-
      Arcane Link chẳng làm được gì cho người chơi solo: nó cần một *người
      chơi* đồng minh, nên nó không chạy trên Mercenary như Flame Link từng
      làm. Đây là công cụ cho nhân vật support stack mana trong party. Ý kiến
      ban đầu là nó trông yếu hơn Flame Link, vì thanh mana nhỏ hơn thanh máu
      rất nhiều.


      Fireball of Radiation biến Fireball thành một skill damage cháy mà không
      phải dựa vào Ignite. Phản ứng đầu tiên khá hào hứng: người chơi dự đoán
      vùng nhỏ và một nhịp cháy ngắn. Lúc chúng tôi viết bài này thì chưa ai
      thử.
    confidence: prediction
  official:
    - "Added a new Intelligence Skill, Arcane Link: Targets an allied player to apply a buff which links you to them for a duration. While linked, they deal additional lightning damage based on your mana. If the target dies while linked, you will also die."
    - "Added a new Intelligence Transfigured Skill, Fireball of Radiation: Unleashes a ball of fire ahead that inflicts a short but powerful fire damage over time debuff to each enemy in an area around it."

- id: new-uniques
  category: items
  verdict: new
  title: "11 unique mới và một base jewel mới"
  image: hide-of-the-vendigo
  gallery: [sword-of-ages, putrid-seed]
  summary: >-
    Patch thêm 11 unique item và một base jewel mới, Mycelium Core. Tới giờ
    mới có năm cái được công bố.
  points:
    - "**Hide of the Vendigo** (body armour): bạn đánh như đang cầm Claw khi tay chính để trống, kèm lượng cold damage lớn cộng vào đòn tay không."
    - "**The Covetous Dark** (claw): Blind của nó là vĩnh viễn, và làm mù một pinnacle boss sẽ cướp vĩnh viễn một mod của nó vào cây claw, tối đa hai mod."
    - "**The Sword of Ages** (two-handed sword): trigger Temporal Mirage khi bạn dùng một đòn attack di chuyển. Người chơi đọc nó như vũ khí cho Flicker Strike."
    - "**Dreadmaidens' Sacrament** (Basalt Flask): nhận charge khi bạn bị đánh trúng. Nó là phần thưởng của một bộ Fate hai lá."
    - "**Putrid Seed** (jewel Mycelium Core): sau khi Cassia anoint, nó mọc ra những nhánh passive nhỏ xuyên qua tree tới bốn notable. Nó rơi từ một miniboss Blight mới, Effulgent Blightworm, trong map có Blight Thread."
  impact:
    meaning: >-
      Unique mới hiếm khi tạo khác biệt ngay ngày đầu: chúng phải rơi ra, được
      định giá, rồi mới được thử trong build. Putrid Seed là cái lạ nhất, vì
      nó với tới được những notable nằm ở phía bên kia của passive tree. Ý
      kiến ban đầu là nó yếu so với cái socket nó chiếm, chỉ hữu dụng trong
      vài trường hợp hẹp cần một hai notable then chốt.


      Doedre's Tongue, một amulet đã có sẵn, giờ chỉ rơi từ các encounter
      Covens (xem mục Thay đổi nhỏ).
    todo: >-
      Hãy identify và kiểm giá bất kỳ unique nào bạn không nhận ra, trước khi
      bán cho vendor. Trong mấy ngày đầu, unique mới thường đáng giá hơn nhiều
      so với về sau.
    confidence: confirmed
  official:
    - "Added 11 new Unique Items."
    - "Added a new Jewel basetype, Mycelium Core."
    - "Item details come from GGG's reveal and news posts. The remaining six uniques had not been shown when this was written."

- id: royal-visage-soul-cores
  category: mechanics
  verdict: new
  title: "Royal Visage và Soul Core từ Temple"
  image: royal-visage
  gallery: [soul-core-of-might]
  summary: >-
    [[Royal Visage]] rơi từ Atziri trong Temple level 81 trở lên. Dùng nó lên
    một map Tier 16 để các Incursion trong đó thành "Alluring": khó hơn,
    thưởng nhiều hơn, và luôn có kiến trúc sư Xipocado. Soul Core là tên mới
    của Coin ở league trước, kèm bốn loại mới.
  points:
    - "Trong Incursion Alluring, bạn sẽ bị Flameblast và Storm Call nhắm vào."
    - "Soul Core gắn một hiệu ứng support lên skill gem, và giờ cũng có thể roll ra một trong các hiệu ứng \"xấu\"."
    - "Mới: Soul Core of Finesse, Instability, Intellect và Might."
    - "Atziri có thể rơi Soul Core trong Temple từ level 80 trở lên."
  impact:
    meaning: >-
      Royal Visage là cách bạn đẩy Incursion đi xa hơn khi đã chạy được map
      Tier 16. Soul Core là bản nâng cấp gem có rủi ro kèm theo: những kết quả
      "xấu" nghĩa là đừng dùng nó lên một cây gem mà bạn không đủ sức thay
      cái khác.
    confidence: confirmed
  official:
    - "Added a new Royal Visage Currency item which can drop from Atziri in level 81+ Temples of Atzoatl. It can be used on a Tier 16 Map to add an Enchantment that causes Temporal Incursions in the Area to be Alluring."
    - "Coins of Knowledge, Power and Skill have been rethemed to be Soul Cores. They now also have a chance to imbue Skill Gems with one of a set of 'bad' support effects."
    - "Added Soul Core of Finesse, Soul Core of Instability, Soul Core of Intellect, and Soul Core of Might."

- id: new-currency-items
  category: items
  verdict: new
  title: "Các item mới khác: Frayed Thread, Allflame Ember, Essence of Trickery"
  image: afarud-crystal
  gallery: [allflame-divine, abyss-thread]
  summary: >-
    Một nhúm bổ sung nhỏ. [[Frayed Thread]] đổi thành một Thread ngẫu nhiên.
    Ba Allflame Ember mới thay pack monster trong map. Afarud Enshrouding
    Crystal thì enshroud unique quiver.
  points:
    - "Allflame Ember of the Cloister, of the Divine, và of the Multitude."
    - "Essence of Trickery (patch notes không nói nó làm gì)."
    - "Cryptic Astrolabe: cho một Astrolabe ngẫu nhiên khác. Có thêm Feral, Immortal và Royal Astrolabe cho các loại region mới."
    - "Merrick's Ducat dùng thẳng được lên Abyssal Jewel."
  impact:
    meaning: >-
      Không cái nào trong số này đổi cách bạn khởi đầu league. Frayed Thread
      là thứ đáng để ý: nó là lá bài dự phòng để thêm một league mechanic vào
      map khi bạn không có sẵn Thread đúng loại mình muốn.
    confidence: confirmed
  official:
    - "Added a new Currency Item, Frayed Thread which can be used to grant a random Thread, or vendored for a random Thread."
    - "Added three new Allflame Embers: Allflame Ember of the Cloister, of the Divine, and of the Multitude."
    - "Added a new Essence, Essence of Trickery."
    - "Added an Afarud Enshrouding Crystal that can Enshroud Unique Quivers."

- id: new-map-modifiers
  category: endgame
  verdict: new
  title: "Map rare có thể roll ra league content dưới dạng mod"
  image: map-tier-16
  gallery: [icon-mirage, atlas-delirium, atlas-beyond]
  summary: >-
    Chín suffix mới có thể xuất hiện trên map Rare, hiện bằng một màu khác.
    Mỗi cái thêm một encounter: một Sentinel chôn dưới đất, một Mirage,
    Viridian Wildwood, một Evocator của Beyond, hoặc một Mirror of Delirium.
  points:
    - "Kết quả Vaal Orb đổi: thêm 2 mod (tối đa 9 mod) thay cho kiểu \"roll lại thành 8 mod\" cũ."
    - "Điều này áp dụng cả cho Logbook, Contract, Blueprint và Invitation."
    - "Implicit corruption +Item Quantity không còn roll ra được nữa. Bản Rarity giờ là +10–20% (trước +8–12%)."
  impact:
    meaning: >-
      Mod của chính cái map giờ là một nguồn content, không chỉ là nguồn độ
      khó. Một map Rare roll trúng "Area contains a Mirage" đáng giá hơn map
      không có, nên hãy đọc map trước khi chạy.


      Lời than to nhất sau khi patch notes ra cũng chính là chuyện này: roll
      map giờ mất công hơn. Không còn cách đơn giản nào để ép ra tám mod, và
      Mirage hay Wildwood thì phải ngồi roll bằng Chaos Orb. Phía bên kia đáp
      lại rằng cứ chạy nhiều map hơn, map ra sao thì chơi vậy.
    confidence: confirmed
  official:
    - "Added new Modifiers that can roll as suffixes on Maps: Area contains a buried Pandemonium, Apex or Stalker Sentinel; a Mirage; the Viridian Wildwood; an Evocator of Beidat, K'Tash or Ghorr; a Mirror of Delirium."
    - "The above Modifiers can only be rolled on Rare Maps, and display in a different colour."
    - "Removed the Corruption outcome that rerolls the Map into a Rare Map with 8 Modifiers. It has been replaced with an outcome that will add 2 Explicit Modifiers to a Map (up to a maximum of 9)."

