# Small changes: number tweaks and adjustments.
# "official" lines are shortened from the official patch notes.

- id: pathfinder-flask-changes
  category: ascendancy
  verdict: mixed
  title: "Pathfinder: ba notable về flask bị đổi"
  image: asc-pathfinder
  gallery: [bismuth-flask, diamond-flask, amethyst-flask, divine-life-flask]
  summary: >-
    [[Pathfinder]] vẫn giữ bản sắc, nhưng ba notable hoạt động khác đi. Life
    flask giờ hồi đủ lượng máu nhưng chậm hơn, flask xoá mọi ailment, còn
    Master Distiller đổi critical strike chance lấy critical strike
    multiplier.
  points:
    - "**Master Surgeon:** giảm 50% *tốc độ* hồi máu từ Life Flask (trước là giảm 50% *lượng* máu hồi từ Flask)."
    - "**Master Alchemist:** xoá mọi Ailment khi bạn dùng flask (trước chỉ Elemental Ailment)."
    - "**Master Distiller:** Bismuth 30% penetration (trước 25%), Amethyst 47% Physical thành Extra Chaos (trước 37%), Diamond +100% Critical Strike Multiplier (trước là 250% increased Critical Strike Chance)."
  impact:
    meaning: >-
      **Master Surgeon mạnh lên.** Trước đây một bình life flask chỉ hồi cho
      bạn một nửa lượng máu. Giờ nó hồi đủ, nhưng rải ra gấp đôi thời gian.
      Lượng hồi mỗi giây vẫn vậy, nhưng một lần bấm flask kéo dài gấp đôi, nên
      giữ hồi máu liên tục dễ hơn.


      **Master Alchemist giờ xoá cả Bleeding và Poison**, không chỉ Ignite,
      Freeze, Chill và Shock. Corrupted Blood là debuff chứ không phải ailment,
      nên bạn vẫn cần cách chống riêng cho nó.


      **Master Distiller đổi hình với build crit.** Bạn mất một mảng lớn *tỉ
      lệ* crit và đổi lấy một mảng lớn *sát thương* crit. Những build từng dựa
      vào bonus của Diamond Flask để đẩy crit chance lên cao giờ phải tìm crit
      chance ở gear hoặc trên tree.
    winners: >-
      Pathfinder đánh damage-over-time như [[Toxic Rain]] và
      [[Caustic Arrow]], vốn lấy Master Surgeon và chẳng quan tâm crit.
      Pathfinder đi poison cũng lời từ phần Amethyst.
    losers: >-
      Pathfinder bow và wand đi crit elemental, vốn được xây quanh base crit
      thấp cộng với bonus Diamond cũ.
    todo: >-
      Chơi Pathfinder damage-over-time: tree của bạn không đổi gì, chỉ an toàn
      hơn một chút. Chơi Pathfinder crit: kiểm lại crit chance trong Path of
      Building trước khi copy nguyên setup 3.29.
    confidence: confirmed
  official:
    - "Master Surgeon now has 50% less Life Flask Recovery Rate (previously 50% less Life Recovery from Flasks)."
    - "Master Alchemist now removes Ailments when you use a Flask (previously Elemental Ailments)."
    - "Master Distiller: Bismuth charges give 30% Elemental Penetration (was 25%); Diamond charges give +100% Critical Strike Multiplier (was 250% increased Critical Strike Chance); Amethyst charges give 47% of Physical Damage as Extra Chaos (was 37%)."

- id: warden-buffs
  category: ascendancy
  verdict: buff
  title: "Warden: buff cho Barkskin, Tincture và Unbound Avatar"
  image: asc-warden
  gallery: [tincture, living-blade]
  summary: >-
    [[Warden]] nhận năm cú buff nhỏ cùng lúc. Barkskin cộng stack nhanh hơn và
    chặn được nhiều hơn, Tincture đốt mana chậm hơn, còn Unbound Avatar kéo
    dài 15 giây thay vì 10.
  points:
    - "Enduring Suffusion: giảm 50% tốc độ Mana Burn (trước 30%)."
    - "Barkskin: nhận 2 Bark mỗi giây (trước 1), 6% more chance né Attack cho mỗi Bark còn thiếu (trước 4%), -75 Physical Damage nhận từ Attack Hit cho mỗi Bark (trước -60)."
    - "Lesson of the Seasons: -40 damage mỗi loại từ Spell Hit cho mỗi Bark (trước -25)."
    - "Seasoned Hunter: thêm 50% increased Projectile Speed khi bạn đang bật Tincture."
    - "Unbound Avatar: thời gian cơ bản 15 giây (trước 10)."
    - "Unique sword [[The Living Blade]]: bật thêm 2 Tincture cùng lúc (trước 1)."
  impact:
    meaning: >-
      Warden vốn đã là ascendancy elemental attack mạnh. Mấy thay đổi này chủ
      yếu thêm phòng thủ và sự dễ chịu: Bark hồi lại nhanh gấp đôi sau khi bạn
      ăn đòn, và bạn giữ Tincture chạy lâu hơn trước khi Mana Burn bắt bạn tắt
      đi.
    winners: >-
      Warden bow và melee đi elemental có dùng Tincture. Giảm damage dạng số
      cố định theo Bark mạnh nhất khi bạn ăn nhiều đòn nhỏ, nên nó giúp nhiều
      nhất lúc dọn map.
    todo: >-
      Nếu bạn định chơi một build attack Deadeye chỉ để clear nhanh, Warden
      giờ là lựa chọn gần hơn so với 3.29, mà lại thủ tốt hơn.
    confidence: confirmed
  official:
    - "Enduring Suffusion now has 50% less Mana Burn Rate (previously 30%)."
    - "Lesson of the Seasons now has -40 Damage taken of each Damage Type from Spell Hits per Bark (previously 25)."
    - "Seasoned Hunter now has 50% increased Projectile Speed while you have an Active Tincture."
    - "Unbound Avatar now has a base duration of 15 seconds (previously 10)."
    - "Barkskin now grants 2 Bark each second if you haven't been Hit by an Enemy Attack Recently (previously 1), 6% more chance to Evade Attacks per Bark below maximum (previously 4), and -75 Physical Damage taken from Attack Hits per Bark (previously -60)."
    - "The Living Blade now has 'you can have 2 additional Tinctures active' (previously 1)."

- id: trickster-buffs
  category: ascendancy
  verdict: buff
  title: "Trickster: lì hơn trước damage over time và hiệu ứng làm chậm"
  image: asc-trickster
  summary: >-
    Ba notable của [[Trickster]] mạnh lên. Lớn nhất là One Step Ahead, giờ giữ
    action speed của bạn ở mức 105% trở lên, trong khi trước nó chỉ chặn không
    cho tụt dưới 90%.
  points:
    - "One Step Ahead: Action Speed của bạn tối thiểu bằng 105% mức cơ bản (trước là 90%)."
    - "Heartstopper: nửa damage-over-time giờ cho 75% less Damage over Time nhận vào (trước 50%). Nửa chặn hit vẫn giữ nguyên 50%."
    - "Spellbreaker: +20% lượng Suppressed Spell Damage được chặn khi đang full Energy Shield (trước +15%)."
  impact:
    meaning: >-
      One Step Ahead giờ chạy như một khoản tăng tốc 5% vĩnh viễn mà không gì
      kéo xuống được. Chill, Temporal Chains, mấy kiểu làm chậm dạng Petrified
      Blood và map mod giảm action speed đều hết ý nghĩa với Trickster.


      Heartstopper đổi qua lại giữa hai chế độ vài giây một lần. Trong chế độ
      damage-over-time, giờ bạn bỏ qua ba phần tư sát thương từ đất cháy,
      poison, bleeding và những thứ tương tự.
    winners: >-
      Trickster Energy Shield mọi kiểu, nhất là build damage-over-time và
      build Ephemeral Edge vốn đã lấy sẵn mấy notable này.
    todo: >-
      Chơi Trickster thì bạn khỏi cần đi tìm "cannot be Chilled" hay miễn
      nhiễm Temporal Chains nữa. One Step Ahead lo hết.
    confidence: confirmed
  official:
    - "Heartstopper: every 10 seconds, take 50% less Damage from Hits for 5 seconds (unchanged) and take 75% less Damage over Time for 5 seconds (previously 50%)."
    - "One Step Ahead: your Action Speed is at least 105% of base value (previously 90%)."
    - "Spellbreaker: +20% to amount of Suppressed Spell Damage Prevented while on Full Energy Shield (previously +15%)."

- id: reliquarian-luminary
  category: ascendancy
  verdict: mixed
  title: "Notable Reliquarian bị xáo lại, liên kết mercenary của Luminary giảm nửa"
  image: icon-mercenary
  summary: >-
    Ascendancy Reliquarian có một bộ notable khác trong league này. Golden
    Glory của Luminary giờ chỉ truyền một nửa phần scale Light Radius sang
    buff Link đặt trên Mercenary của bạn.
  impact:
    meaning: >-
      Reliquarian là ascendancy của Scion với bộ notable xoay vòng mỗi league,
      nên mọi build Reliquarian từ 3.29 đều phải dựng lại theo danh sách của
      league này. Hãy xem danh sách trong patch notes chính thức trước khi
      quyết.


      Build Golden Glory trước đây stack Light Radius để bơm một skill Link
      lên Mercenary. Phần scale đó bị cắt một nửa, và Light Radius trên vài
      unique cũng bị hạ trong cùng patch.
    losers: >-
      Build Luminary stack Light Radius dắt theo một Mercenary mang skill
      Link. Cộng với đợt nerf Mercenary chung, lối chơi này yếu đi rất nhiều.
    confidence: confirmed
  official:
    - "The Notables for the Reliquarian Ascendancy have been shuffled."
    - "Luminary's Golden Glory: Increases and Reductions to Light Radius also apply to Effect of your Link Skill Buffs on your Mercenary at 50% of their value (previously 100%)."
    - "The Hallowed Monarch now has 25-35% increased Light Radius (previously 50%). Rotmother's Mutiny now has 20-40% (previously 25-75%)."

- id: winter-orb-nerf
  category: skills
  verdict: nerf
  title: "Winter Orb mất một projectile và một phần damage"
  image: winter-orb
  summary: >-
    [[Winter Orb]] giờ bắn 2 projectile ở mọi level gem, trong khi trước nó
    lên được 3. Base cold damage ở level 20 giảm khoảng 15%, và added damage
    chỉ còn hiệu quả 70% thay vì 80%.
  impact:
    meaning: >-
      Mất projectile thứ ba là phần nặng nhất của đợt nerf. Cộng lại, các thay
      đổi này lấy đi khoảng 40% damage của skill ở level 20, chưa tính gear.
    losers: >-
      Build Winter Orb ở mọi ascendancy, vốn nằm trong nhóm build spell được
      chơi nhiều nhất 3.29. Chúng vẫn chạy được, nhưng phải đầu tư nhiều hơn
      rõ rệt để đạt cùng mức damage bossing.
    todo: >-
      Đừng league-start Winter Orb theo guide 3.29. Nếu bạn muốn một starter
      spell hệ cold, hãy nhìn sang cold damage-over-time hoặc chờ guide cập
      nhật.
    confidence: confirmed
  official:
    - "Winter Orb now fires 2 Projectiles at all gem levels (previously 2-3 at gem levels 1-20)."
    - "Has 70% Effectiveness of Added Damage (previously 80%)."
    - "Deals 307 to 460 Cold Damage at gem level 20 (previously 360 to 539)."

- id: golem-buff-nerfs
  category: skills
  verdict: nerf
  title: "Buff từ golem nhỏ lại"
  image: flame-golem
  gallery: [lightning-golem]
  summary: >-
    Buff bạn nhận từ việc có golem ngoài sân đều bị hạ. Flame Golem cho 15–24%
    increased damage (trước 20–29%), Lightning Golem 8% attack và cast speed
    (trước 10%), còn Stone Golem 16% increased defences (trước 20%).
  impact:
    meaning: >-
      Với một build chỉ nuôi một con golem thì đây là sai số làm tròn. Nó chỉ
      đáng kể với những build nhân buff golem lên nhiều lần, chủ yếu là
      Golemancer Elementalist dùng jewel Primordial và notable Liege of the
      Primordial.
    losers: >-
      Elementalist stack buff golem mất khoảng một phần năm những gì đám golem
      từng cho họ.
    confidence: confirmed
  official:
    - "Summon Flame Golem: Golems grant 15% increased Area of Effect (previously 20%) and 15-24% increased Damage at gem levels 1-20 (previously 20-29%)."
    - "Summon Lightning Golem: Golems grant 8% increased Attack and Cast Speed (previously 10%)."
    - "Summon Stone Golem: Golems grant 16% increased Defences (previously 20%)."

- id: link-and-pact-changes
  category: skills
  verdict: mixed
  title: "Flame Link và Pact of Beidat được chỉnh"
  image: flame-link
  gallery: [pact-of-beidat]
  summary: >-
    [[Flame Link]] cho nhiều flat fire damage hơn từ chính gem và ít hơn từ
    maximum life của bạn (3%, trước là 5%). [[Pact of Beidat]] giờ luôn cộng 4
    chain và 4 projectile, trong khi trước nó lên tới 6.
  impact:
    meaning: >-
      Flame Link tốt hơn trên một support có thanh máu nhỏ, và tệ hơn với mẫu
      "aura bot stack life" chuyên bơm fire damage khổng lồ cho carry hoặc cho
      Mercenary. Pact of Beidat thì y hệt ở level 1 và mất hai chain cùng hai
      projectile ở level 20.
    losers: >-
      Nhân vật support đi party và các build Mercenary-link từng stack life
      cho Flame Link.
    confidence: confirmed
  official:
    - "Flame Link: linked target gains 219 to 329 Added Fire Damage at gem level 20 (previously 169 to 254), and Added Fire Damage equal to 3% of your Maximum Life (previously 5%)."
    - "Pact of Beidat: Beams from Empowered Skills Chain 4 additional times and Empowered Skills fire 4 additional Projectiles at all gem levels (previously 4-6)."

- id: support-gem-changes
  category: skills
  verdict: rework
  title: "Transfusion và Vaal Sacrifice Support được làm lại"
  image: transfusion-support
  gallery: [vaal-sacrifice-support]
  summary: >-
    [[Transfusion Support]] không còn chạy với instant spell, và cho minion
    gần đó charge thay vì Soul. [[Vaal Sacrifice Support]] giờ để bạn lại ở
    20% life và energy shield, thay vì để lại đúng 1 như trước.
  impact:
    meaning: >-
      Transfusion từng được dùng để bơm Soul của Vaal skill cho minion bằng
      cách spam một instant spell rẻ tiền. Vòng lặp đó hết rồi. Giờ nó trao
      cho minion một Power, Frenzy hoặc Endurance Charge cho mỗi 400 life bạn
      bỏ ra.


      Vaal Sacrifice thì an toàn hơn: bạn giữ lại một phần năm thanh máu thay
      vì tụt về 1, nhưng phần hi sinh cũng nhỏ đi theo.
    losers: >-
      Các build minion từ 3.29 giữ Vaal skill bật liên tục trên minion nhờ
      Transfusion.
    confidence: confirmed
  official:
    - "Transfusion Support no longer supports instant Spells. A Minion within 6 metres gains a Power, Frenzy or Endurance Charge for every 400 Life you spend on Upfront Costs with Supported Spells (previously a Soul for every 200 Life)."
    - "Vaal Sacrifice Support: Supported Skills Sacrifice all but 20% of your maximum Life and Energy Shield on Use (previously all but 1)."

- id: atziris-acuity
  category: items
  verdict: rework
  title: "Atziri's Acuity: instant leech trở lại"
  image: atziris-acuity
  summary: >-
    [[Atziri's Acuity]] giờ làm life leech từ critical strike thành instant.
    Đổi lại bạn hoàn toàn không hồi máu và không recoup được. Nó cũng không
    còn cho Vaal Pact. Găng cũ giữ nguyên dòng chữ cũ.
  impact:
    meaning: >-
      Instant leech nghĩa là một cú crit hồi cho bạn trọn lượng leech ngay lập
      tức, trong khi leech thường trả dần theo thời gian. Đây là dạng leech
      mạnh nhất game, và cũng đúng là cách đôi găng này hoạt động nhiều năm
      trước. Người chơi đọc thay đổi này như bản cũ quay lại.


      Cái giá khá nặng: không hồi máu, không recoup, suốt thời gian bạn còn
      đeo nó. Leech và flask thành nguồn hồi duy nhất.
    winners: >-
      Build attack đi crit với cú đánh lớn, loại làm đầy thanh máu chỉ bằng
      một cú crit.
    losers: >-
      Build từng đeo Acuity chung với life recoup hoặc hồi máu. Găng ở league
      Standard thì không bị ảnh hưởng.
    confidence: confirmed
  official:
    - "Atziri's Acuity no longer grants Vaal Pact if you've dealt a Critical Strike Recently. It now has 'Life Leech from Critical Strikes is instant' and 'Cannot Regenerate or Recoup Life'. Existing versions are not affected."

- id: ralakeshs-impatience
  category: items
  verdict: nerf
  title: "Ralakesh's Impatience lấy đi một charge tối đa"
  image: ralakeshs-impatience
  summary: >-
    [[Ralakesh's Impatience]] mới sẽ roll -1 maximum Power, Endurance hoặc
    Frenzy Charge. Giày cũ giữ nguyên.
  impact:
    meaning: >-
      Ralakesh's cho bạn lợi ích của charge tối đa mà không cần tạo charge,
      nên nó từng là một trong những đôi unique boots giá trị nhất. Giờ mỗi
      đôi lấy đi một charge của một loại. Bạn chọn được loại ít đau nhất cho
      build của mình, nên với build chỉ dùng một hai loại charge thì nerf này
      khá nhẹ.
    affected: >-
      Build stack charge dùng cả ba loại thì mất đúng một charge. Những đôi có
      dòng phạt "đúng ý" cho các build phổ biến sẽ đắt hơn phần còn lại.
    confidence: confirmed
  official:
    - "Ralakesh's Impatience now has either -1 to maximum Power, Endurance or Frenzy Charges. Existing versions are unaffected."

- id: shavronnes-wrappings
  category: items
  verdict: buff
  title: "Shavronne's Wrappings có thêm recoup Energy Shield"
  image: shavronnes-wrappings
  summary: >-
    [[Shavronne's Wrappings]] giờ có 150–200% increased Energy Shield (trước
    100–150%) và recoup 20–30% damage nhận vào thành Energy Shield. Đổi lại nó
    mất dòng 10% faster start of Energy Shield recharge.
  impact:
    meaning: >-
      Shavronne's cho phép build low-life phớt lờ Chaos damage. Nó từng là một
      cái chest khá yếu so với nhiệm vụ của mình; giờ nó có số Energy Shield
      coi được và một lớp hồi phục sẵn trong người.
    winners: >-
      Dân low-life stack aura và caster ít tiền, họ dùng Shavronne's được lâu
      hơn trước khi phải mua chest rare.
    confidence: confirmed
  official:
    - "Shavronne's Wrappings no longer has 10% faster start of Energy Shield Recharge. It now has 20-30% of Damage Taken Recouped as Energy Shield and 150-200% increased Energy Shield (previously 100-150%)."

- id: malachais-loop
  category: items
  verdict: mixed
  title: "Malachai's Loop: nhiều Energy Shield hơn, bớt một charge"
  image: malachais-loop
  summary: >-
    [[Malachai's Loop]] giờ có 240–300% increased Energy Shield và 20–40% tỉ
