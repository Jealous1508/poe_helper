- id: femurs-of-the-saints
  category: items
  verdict: rework
  title: "Femurs of the Saints được dựng lại cho build minion"
  image: femurs-of-the-saints
  summary: >-
    [[Femurs of the Saints]] giờ có +2–3 level cho minion gem gắn trong và
    80–100% increased minion damage. Bốn bonus cố định của nó được thay bằng
    tối đa bốn mod roll ra từ một bộ bảy dòng.
  points:
    - "10–15% increased Minion Damage cho mỗi Raised Spectre."
    - "12–18% increased Spell Damage cho mỗi Summoned Skeleton."
    - "16–24% increased Attack Damage cho mỗi Raised Zombie."
    - "+1–2% tỉ lệ Block Attack Damage cho mỗi Summoned Skeleton."
    - "Hồi 0,8–1% Life mỗi giây cho mỗi Raised Zombie."
    - "40–60% increased Mana Regeneration Rate cho mỗi Raised Spectre."
    - "3–5% increased Attack và Cast Speed cho mỗi Summoned Raging Spirit."
  impact:
    meaning: >-
      Cây gậy này trước chỉ là đồ leveling. Với +3 minion gem và một bộ mod
      roll đẹp, giờ nó gánh được build minion vào tận map, và vài dòng roll
      còn thưởng cho những kiểu lai lạ, ví dụ một caster giữ skeleton ngoài
      sân để ăn spell damage.
    affected: >-
      Vì mod là ngẫu nhiên nên hai cây gậy có thể chênh nhau rất xa về giá
      trị. Hãy xem kỹ nó có những dòng nào trước khi mua.
    confidence: confirmed
  official:
    - "Femurs of the Saints now has +2-3 to level of Socketed Minion Gems (previously +2) and Minions deal 80-100% increased Damage (previously 60-80%)."
    - "It no longer has its four fixed per-minion bonuses. Instead it can roll up to 4 Modifiers from a new set of seven."

- id: doryani-and-doedre
  category: items
  verdict: rework
  title: "Doryani's Invitation và Doedre's Tongue giờ roll mod ngẫu nhiên"
  image: doryanis-invitation
  gallery: [doedres-tongue]
  summary: >-
    [[Doryani's Invitation]] giờ gom lại thành một cái belt duy nhất, luôn rơi
    ra ở trạng thái corrupted với bốn mod, mỗi mod chọn từ một bộ.
    [[Doedre's Tongue]] có số lớn hơn và một dòng mới, và chỉ rơi từ các
    encounter Covens of Umbra.
  points:
    - "Doryani's Invitation: một dòng damage (15–60% Physical, Cold, Lightning hoặc Fire), một dòng thủ (+25–100% một Resistance hoặc +250–1000 Armour), một dòng leech, một dòng flask effect."
    - "Doedre's Tongue: 30–35% tất cả Elemental Resistance (trước 20–25%), 25–50% tỉ lệ Freeze, Shock và Ignite (trước 20–25%)."
    - "Doedre's Tongue còn roll một trong các dòng: All Damage can Ignite, Shock hoặc Freeze khi đánh kẻ địch đang dính Curse."
  impact:
    meaning: >-
      Một cái Doryani's Invitation roll đẹp có thể rất mạnh: tới 100% một
      resistance gói gọn trong một slot là giải xong hẳn một bài toán gear. Nó
      corrupted sẵn, nên rơi ra sao thì bạn nhận vậy.


      Doedre's Tongue trở thành amulet mở build cho các setup "all damage can
      shock" hay "all damage can freeze", miễn là bạn curse được mục tiêu.
    confidence: confirmed
  official:
    - "Doryani's Invitation now always drops Corrupted with an Implicit. It has 4 Modifiers, each randomly picked from a set."
    - "Doedre's Tongue can no longer drop outside of Covens of Umbra encounters. It now has 30-35% to all Elemental Resistances and 25-50% chance to Freeze, Shock and Ignite, and rolls a modifier from a new set."

- id: other-unique-changes
  category: items
  verdict: mixed
  title: "Shadowstitch, Steelworm và mấy unique light radius"
  image: shadowstitch
  gallery: [steelworm]
  summary: >-
    [[Shadowstitch]] nhận bonus lớn hơn kèm mức phạt nặng hơn cho mỗi item
    corrupted. [[Steelworm]] thêm 20–30% increased Impale effect. Hai unique
    light radius thì bị hạ light radius.
  points:
    - "Shadowstitch: +1–50 tất cả Attribute (trước 20–30), -8 đến -6% tất cả Resistance cho mỗi item Corrupted (trước -6 đến -4%), 10–12% increased maximum Energy Shield và 8–10% increased maximum Life cho mỗi item Corrupted (trước 8% và 6%)."
    - "The Hallowed Monarch: 25–35% increased Light Radius (trước 50%). Rotmother's Mutiny: 20–40% (trước 25–75%)."
  impact:
    meaning: >-
      Shadowstitch thưởng cho một bộ gear corrupted toàn tập nhiều hơn trước,
      và cũng khó cap resistance hơn. Mấy đợt nerf light radius thì nhắm thẳng
      vào build Luminary chuyên đổi Light Radius thành hiệu lực Link.
    confidence: confirmed
  official:
    - "Shadowstitch now has +1-50 to all Attributes, -8 to -6% to all Resistances, 10-12% increased Maximum Energy Shield and 8-10% increased Maximum Life for each Corrupted Item Equipped."
    - "Steelworm now has 20-30% increased Impale Effect."
    - "The Hallowed Monarch now has 25-35% increased Light Radius. Rotmother's Mutiny now has 20-40% increased Light Radius."

- id: special-base-implicits
  category: items
  verdict: buff
  title: "Các base đặc biệt có implicit mạnh hơn"
  image: spiked-gloves
  gallery: [opal-ring, stygian-vise, artillery-quiver, simplex-amulet]
  summary: >-
    Các base "Atlas" như Spiked Gloves, Two-Toned Boots và Vanguard Belt có
    implicit lớn hơn hẳn. Artillery Quiver giờ cho +1 totem tối đa cho skill
    attack.
  points:
    - "Spiked Gloves 24–30% Melee Damage (trước 16–20%). Gripped Gloves 22–28% Projectile Attack Damage (trước 14–18%). Fingerless Silk Gloves 20–26% Spell Damage (trước 12–16%)."
    - "Apothecary's Gloves: +14–18% Damage over Time *Multiplier* (trước là 14–18% *increased* Damage over Time)."
    - "Two-Toned Boots +16–20% cho hai Resistance (trước +8–12%). Fugitive Boots +17–23% Chaos Resistance (trước +13–17%)."
    - "Vanguard Belt +260–480 Armour và Evasion. Crystal Belt +60–100 Energy Shield. Bone Helmet 20–30% Minion Damage."
    - "Amethyst Ring là dòng duy nhất bị nerf: +13–19% Chaos Resistance (trước +17–23%)."
    - "Item cũ cập nhật lại bằng [[Blessed Orb]]."
  impact:
    meaning: >-
      Mấy base này vốn đã là loại đáng nhặt. Giờ chúng ngon hơn base thường rõ
      rệt, và chúng chỉ rơi khi item roll ra Item Tier đủ cao (xem entry Item
      Tiers ở mục Những thứ mới). Thấy một cái nằm dưới đất là đáng bỏ công
      identify.


      Apothecary's Gloves đổi sang Damage over Time *Multiplier* là một cú
      buff lớn: multiplier là kiểu scale riêng và mạnh hơn "increased".
    winners: >-
      Build damage-over-time (Apothecary's Gloves), build ballista và totem đi
      attack (Artillery Quiver +1 totem), và bất kỳ ai đang chật vật cap
      resistance (Two-Toned Boots).
    todo: >-
      Thêm các base đặc biệt vào loot filter kèm highlight. Phần lớn filter
      công khai đã làm sẵn việc này.
    confidence: confirmed
  official:
    - "The Implicit Modifiers on many Atlas Item Types have been adjusted; all can be updated with Blessed Orbs."
    - "Artillery Quiver's Implicit is now 'Attack Skills have +1 to maximum number of Summoned Totems' (previously 20-30% increased Totem Placement speed). Existing items are not affected."
    - "Light Radius modifiers on Weapons, Helmets and Rings now scale up to 30% at the highest tier (previously 15%)."
    - "These base types can now only drop on Magic and Rare items with a certain Item Tier or higher."

- id: vendor-recipe-changes
  category: crafting
  verdict: mixed
  title: "Vendor recipe và giá gem thay đổi, Orb of Binding biến mất"
  image: orb-of-binding
  gallery: [chaos-orb, exalted-orb, orb-of-alchemy]
  summary: >-
    [[Orb of Binding]] không còn rơi nữa. Bán hai item rare trùng tên được một
    [[Chaos Orb]], bán ba được một [[Exalted Orb]]. Nhiều công thức từng trả
    hoặc tốn Orb of Chance giờ dùng currency khác.
  points:
    - "Orb of Alchemy rơi nhiều hơn, để bù cho Binding."
    - "Một bộ rare đầy đủ có kèm item dưới level 60 sẽ bán ra Orb of Alchemy."
    - "Gem cần level 28–33 bán được một Orb of Alteration; level 34–37 được một Orb of Alchemy."
    - "Orb of Transmutation mua bằng Orb of Augmentation (trước là Portal Scroll). Orb of Scouring tốn 4 Orb of Fusing."
    - "Công thức Bestiary cho Orb of Binding giờ ra 2 Orb of Regret."
    - "Patch notes còn ghi: \"Added a new Vendor Recipe\", mà không nói là công thức gì. Phỏng đoán phổ biến là bán một item chưa identify của mỗi Item Tier."
  impact:
    meaning: >-
      Trong campaign, trước đây bạn dùng Orb of Binding để tạo một item rare
      có link. Lối tắt đó mất rồi, nên four-link giờ đến từ vendor, từ đồ rơi
      và từ Orb of Fusing.


      Công thức trùng tên mới là cái đáng chú ý. Hai item rare trùng tên ngẫu
      nhiên không phải chuyện thường gặp, nhưng tiền thưởng nhảy từ Orb of
      Chance lên Chaos Orb, và từ Regal Orb lên Exalted Orb nếu bán ba cái.
    todo: >-
      Trong lúc leveling, mỗi lần lên level hãy ghé vendor xem có item có link
      không. Giữ lại Orb of Augmentation thay vì bán đi: giờ chúng mua được
      Transmutation.
    confidence: confirmed
  official:
    - "Orbs of Binding can no longer be obtained, though existing ones will still function. Orbs of Alchemy are now relatively more common."
    - "Vendoring 2 Rare items with the same name now grants a Chaos Orb; 3 grants an Exalted Orb. These recipes no longer take Quality into account."
    - "Orbs of Transmutation are now purchasable for an Orb of Augmentation (previously Portal Scrolls). Orbs of Scouring now cost 4 Orbs of Fusing."
    - "Added a new Vendor Recipe."

- id: crafting-service-tweaks
  category: crafting
  verdict: nerf
  title: "Rog, Recombinator và Gambler bớt hào phóng"
  image: recombinator
  gallery: [scrap-metal]
  summary: >-
    Các deal reroll của Rog giữ kết quả tốt nhất trong 1, 3 hoặc 5 lần (trước
    là 3, 6 hoặc 10). Recombinator cho ít mod hơn khi đồ đầu vào có ít mod, và
    không nhận item corrupted. Cược ở level cao thì đắt hơn mà đồ lại tệ hơn.
  points:
    - "Rog: những deal nâng tier mod xuất hiện thưa hơn."
    - "Recombinator: kết quả lấy item level của base bạn chọn, không phải mức trung bình."
    - "Recombinator: nếu tổng prefix hoặc suffix của hai món đầu vào chỉ có 1–3 thì kết quả ra ít hơn. Từ 4 trở lên thì không đổi."
    - "Gambler: rẻ hơn cho đồ không phải jewellery ở giữa campaign, đắt hơn ở level cao."
    - "Genesis Tree: notable trang bị cho 200% increased tỉ lệ ra một loại mod (trước 300%); node nhỏ +10 Modifier Tier Rating (trước +20)."
  impact:
    meaning: >-
      Mỗi thứ trong này từng là một cách rẻ để làm ra item rare mạnh ở đầu
      league. Giờ cả ba đều lùi một bậc. Recombine hai món mà mỗi món có một
      mod ngon là chiêu đầu league kinh điển, và giờ nó hỏng thường xuyên hơn.
    losers: >-
      Người chơi SSF và dân craft đầu league sống nhờ Rog với Recombinator.
    todo: >-
      Với Recombinator, hãy đưa vào những món đã có sẵn nhiều mod bạn muốn.
      Với Rog, thấy deal ngon thì chốt luôn thay vì ngồi chờ deal nâng tier.
    confidence: confirmed
  official:
    - "Rog now offers deals to Reroll Prefixes and Suffixes 1, 3, or 5 times, keeping the best outcome (previously 3, 6, or 10)."
    - "When using the Recombinator, the resultant item always has the item level of the selected input base type."
    - "Having 1-3 total Prefixes or Suffixes now results in on average fewer Prefixes or Suffixes on the resultant item."
    - "The Recombinator cannot be used on Corrupted items."
    - "Increased the Gold cost of Gambling for all items at high levels; such equipment has less Modifier Tier Rating and fewer Sockets and Links."

- id: item-rule-changes
  category: crafting
  verdict: mixed
  title: "Imprint và mirror không còn bị tính là chỉnh sửa item"
  image: eternal-orb
  gallery: [hinekoras-lock, mirror-of-kalandra, orb-of-annulment]
  summary: >-
    Dùng [[Eternal Orb]] hay [[Mirror of Kalandra]] không còn xoá khả năng
    nhìn trước của [[Hinekora's Lock]]. Orb of Annulment giờ xoá được caster
    modifier ngay cả khi item có dòng "Cannot roll Caster Modifiers".
  impact:
    meaning: >-
      Đây là luật chơi của mảng craft đỉnh. Thay đổi về Annulment là cái đáng
      kể nhất: meta-modifier này từng bảo vệ caster modifier khỏi bị xoá, và
      dân craft lợi dụng nó để lái Orb of Annulment vào đúng mod họ muốn bỏ.
      Lớp bảo vệ đó hết rồi, ở cả bản Caster lẫn bản Attack. Trong giới craft,
      đây là dòng được bàn nhiều nhất cả patch.
    affected: >-
      Những phương pháp craft hạng mirror dựa vào mod "cannot roll" để chặn
      kết quả Annulment giờ phải tìm cách khác.
    confidence: confirmed
  official:
    - "Creating an Imprint of an item or Mirroring an item is no longer considered as Modifying the item. Using these no longer removes the Foreseeing effect from Hinekora's Locks."
    - "The 'Cannot roll Caster Modifiers' meta-crafted Modifier no longer prevents Currencies that remove Modifiers, such as Orbs of Annulment, from removing Caster Modifiers (likewise for Attack Modifiers)."
    - "Assembled Eye Jewels can now roll the Modifiers that every Abyssal Jewel can roll."

- id: map-device-items
  category: endgame
  verdict: rework
  title: "Divine Vessel, Allflame Ember và Mercenary Warrant rời khỏi Map Device"
  image: divine-vessel
  gallery: [allflame-divine, allflame-kulemak]
  summary: >-
    Ba loại item này không còn được đặt vào Map Device cạnh map nữa.
    [[Divine Vessel]] và Allflame Ember giờ dùng thẳng lên item map như một
    enchantment. Mercenary Warrant thì mở ra một khu vực tái đấu riêng.
  points:
    - "Divine Vessel làm khu vực thành **Deified**: boss gây thêm 25% damage, ra đòn nhanh hơn 25%, trâu gấp đôi, và rơi đồ với thêm 50% Rarity."
    - "Divine Vessel stack tới 20."
    - "Allflame Ember giờ ghi rõ nó thay bao nhiêu pack monster. Có ba Ember mới: of the Cloister, of the Divine, of the Multitude."
    - "Mercenary Warrant mở cổng vào Proving Grounds, nơi bạn tái đấu với Mercenary đó."
  impact:
    meaning: >-
      Mấy slot Map Device từng chứa Scarab giờ chứa Threads, nên mọi thứ khác
      phải dời lên chính item map. Nâng Pantheon vẫn là ý tưởng cũ, chỉ có
      điều con boss bạn bắt thì khó hơn hẳn.
    todo: >-
      Khi nâng một quyền năng Pantheon, hãy dùng Divine Vessel lên map trước
      khi mở, và chuẩn bị tinh thần gặp một con boss trâu gấp đôi.
    confidence: confirmed
  official:
    - "Divine Vessels are now Currency items that can be used on Maps to apply the Deified Enchantment Modifier. They now have a stack size of 20."
    - "Deified Areas empower all Map Bosses with 25% increased Damage, 25% increased Attack and Cast Speed, 100% increased Toughness, 25% increased Area of Effect, and 50% increased Rarity of items dropped."
    - "Allflame Embers are now Currency items which can be used on a Map to apply an Enchantment. Added three new Allflame Embers."
    - "Mercenary Warrants can be used to open portals to the Proving Grounds."

- id: ritual-changes
  category: mechanics
  verdict: mixed
  title: "Ritual: vessel cần Thread, reroll cho Omen"
  image: atlas-ritual
  gallery: [ritual-vessel, ritual-splinter]
  summary: >-
    Blood-Filled Vessel chỉ dùng được trên map có Ritual Thread. Reroll cửa
    phần thưởng từ lần thứ hai trở đi giờ bảo đảm ra một Omen, trong khi trước
    nó bảo đảm một Audience with the King hoặc một Waxen Soul.
  points:
    - "2 slot vessel khi có từ 4 Ritual Thread, 3 slot khi có 8."
    - "The King in the Mists luôn rơi một base Ritual item level 85 hoặc 86."
    - "Wisp's Blessing cho 50% increased Tribute (trước 30%), và con wisp bớt dịch chuyển lung tung."
    - "Buff từ Blood Shrine có thể bỏ bằng chuột phải, và Blood Shrine of Crows cho nhiều Chaos Resistance hơn hẳn."
  impact:
    meaning: >-
      Ritual trở thành chỗ farm Omen là chính. Đường tới The King in the Mists
      khó đoán hơn, vì reroll không còn ép ra lời mời nữa.
    todo: >-
      Nếu bạn farm Ritual, hãy tính sẵn 4 hoặc 8 Ritual Thread mỗi map để nhét
      được Blood-Filled Vessel.
    confidence: confirmed
  official:
    - "Blood-Filled Vessels can only be added to Maps that have Ritual Threads applied."
    - "Rerolls of offered rewards beyond the initial window will no longer always guarantee an Audience with the King or Waxen Soul. They will instead always generate at least one Omen."
    - "The King in the Mists now always drops an item level 85 or 86 Ritual base type."
    - "The Wisp's Blessing Buff now grants 50% increased Tribute gained (previously 30%)."

- id: legion-ultimatum-blight-scaling
  category: mechanics
  verdict: buff
  title: "Phần thưởng Legion, Ultimatum và Blight scale theo Atlas Drops"
  image: atlas-legion
  gallery: [atlas-ultimatum, atlas-blight, timeless-splinter]
  summary: >-
    Phần thưởng ở ba mechanic này giờ lớn lên theo giá trị Atlas Drops của
    map. Phần thưởng Ultimatum còn tiếp tục tốt dần lên sau vòng 10.
  points:
    - "Legion: monster và rương có biểu tượng phần thưởng cho nhiều đồ hơn khi Atlas Drops cao. Đục quân ra khỏi khối làm Schism chạy chậm hơn khoảng 33%."
    - "Ultimatum: phần thưởng dạng stack như currency giờ scale theo Atlas Drops (trước chỉ có Catalyst)."
    - "Blight: số rương mỗi lane scale theo Atlas Drops."
  impact:
    meaning: >-
      Atlas Drops là chỉ số đã thay Item Quantity trên map (xem mục Thay đổi
      lớn). Với ba mechanic này, roll một map khó với Atlas Drops cao giờ đồng
      nghĩa trực tiếp với nhiều splinter hơn, nhiều stack currency hơn và
      nhiều rương Blight hơn.
    winners: >-
      Người chạy map roll nặng mod. Riêng Legion còn cho bạn thêm thời gian
      đục quân ra trước khi cả đạo quân tỉnh dậy.
    confidence: confirmed
  official:
    - "Legion Monsters and Chests with Reward Icons now scale the number of Rewards by a percentage of Atlas Drops in the area."
    - "Reduced the amount that breaking out Legion monsters and chests causes a Schism by approximately 33%."
    - "Ultimatum round rewards that can appear in stacks such as Currency are now scaled by a percentage of the Atlas Drops on the area."
    - "Ultimatum rewards now get incrementally better after round 10."
    - "The number of Blight chests in each Lane is now scaled by a percentage of Atlas Drops."

- id: essence-changes
  category: mechanics
  verdict: mixed
  title: "Essence: tier thấp rời khỏi map cao"
  image: atlas-essence
  gallery: [screaming-essence]
  summary: >-
    Weeping Essence không còn xuất hiện trong map vàng hay map đỏ, và Wailing
    Essence không còn xuất hiện trong map đỏ. Số Essence trên một con monster
    bị giam thì scale theo Atlas Drops.
  impact:
    meaning: >-
      Trong map đỏ, mọi Essence bạn giải phóng giờ đều từ tier Screaming trở
      lên, đúng thứ bạn cần để craft. Cái bất lợi cho đầu league là mấy Essence
      tier thấp rẻ tiền, thứ dùng để craft đồ leveling và đồ map sớm, giờ chỉ
      còn ra từ map trắng và campaign.
    todo: >-
      Hãy xài luôn Essence nhặt được trong campaign và map trắng lên gear đầu
      game, đừng để dành.
    confidence: confirmed
  official:
    - "In Yellow and Red Maps Weeping Essences no longer generate on Monsters, and in Red Maps Wailing Essences no longer generate on Monsters."
    - "The average number of Essences on Imprisoned Monsters in Maps now scales with Atlas Drop scaling on your Map."
    - "Added a new Essence, Essence of Trickery."

- id: map-encounter-tweaks
  category: endgame
  verdict: mixed
  title: "Strongbox, Shrine, Rogue Exile và các encounter khác trong map"
  image: atlas-strongbox
  gallery: [icon-shrine, atlas-torment]
  summary: >-
    Một loạt chỉnh sửa cho những thứ nho nhỏ bạn gặp trong map. Pack monster
    từ strongbox có thể là Magic hoặc Rare, Rogue Exile rơi đồ hiếm hơn nhiều,
    và vài encounter giờ xuất hiện ở mọi tier map.
  points:
    - "Strongbox: không còn roll ra item đã Identified hay Mirrored. Operative's Strongbox bị xoá. Dòng \"additional items\" có thể ra mọi rarity."
    - "Rogue Exile: Rarity và kinh nghiệm cao hơn hẳn. Exile loại Gigantic truyền toàn bộ mod của nó sang các bản clone tách ra."
    - "Shrine: Covetous Shrine có tỉ lệ spawn mặc định; Gloom và Resonating Shrine xuất hiện nhiều hơn."
    - "Buried Sentinel và Viridian Wildwood có thể xuất hiện ở mọi tier map (trước chỉ tier 16)."
    - "Ore Deposit cho thêm 50% Ore. Verisium Outcrop và Petrified Amber cho một buff tạm thời khi đào xong."
    - "Starfall Crater xuất hiện nhiều hơn. Lavish Wombgift chỉ cho currency có giá."
    - "Miniboss Abyss Consort of the Depths có ít máu hơn."
  impact:
    meaning: >-
      Theo luật loot mới, currency có giá đến từ Rare và Unique monster có
      Rarity cao. Rogue Exile và pack từ strongbox đúng là như vậy, nên chúng
      đáng để bạn dừng lại đánh.
    confidence: confirmed
  official:
    - "Monster Packs spawned by Strongboxes now inherently have a chance to be Magic or Rare."
    - "Rogue Exiles have much higher inherent Rarity of items dropped and also grant a higher amount of experience when killed."
    - "Buried Sentinels and the Viridian Wildwood can now spawn randomly in any tier of Map (previously only tier 16)."
    - "Increased the base amount of Ore granted by Ore Deposits in Maps by 50%."
    - "Covetous Shrines now have a base chance to spawn. Gloom and Resonating Shrines now spawn more commonly."

- id: kirac-valdo-voidborn
  category: endgame
  verdict: mixed
  title: "Kirac, map Valdo và Voidborn Reliquary"
  image: valdos-puzzle-box
  gallery: [voidborn-key, atlas-kirac]
  summary: >-
    Kirac bán unique map thường xuyên hơn. Valdo's Puzzle Box có thêm 69 map
    Tier 17 bản foil và Voidborn Reliquary có thêm 96 unique bản foil, nhưng
    những unique hiếm nằm ngoài pool chính thì giờ ra hiếm hơn nhiều từ cả hai
    nguồn.
  impact:
    meaning: >-
      Map Valdo và chìa Voidborn từng là cách nhắm tới mấy unique chase vốn
      không rơi bình thường. Pool rộng hơn cộng với tỉ lệ thấp hơn cho đồ hiếm
      nghĩa là mỗi cái chìa giờ nặng tính may rủi hơn. Phần thưởng cũng rơi ra
      ở dạng chưa identify.
    confidence: confirmed
  official:
    - "Added 69 more foiled Tier 17 Valdo's Map options and 96 more foiled Unique Item options for the Voidborn Reliquary."
    - "Unique items granted by Voidborn Reliquary Keys and as Valdo's Map rewards that are not part of the core drop pool are now much rarer from these sources."
    - "Increased the chance for Kirac to sell Unique Maps when refreshing his shop."
    - "Item rewards from the Voidborn Reliquary and Valdo Maps now always drop Unidentified."

- id: divination-card-changes
  category: loot
  verdict: mixed
  title: "Divination card: loại bỏ đồ league, mười một lá bị tắt"
  image: divination-card
  gallery: [stacked-deck]
  summary: >-
    Những lá cho một item ngẫu nhiên từ một pool giờ không thể cho item riêng
    của league hiện tại. Mười một lá bị tắt tạm thời.
  points:
    - "Bị tắt: Buried Treasure, Cameria's Cut, Man With Bear, More is Never Enough, The Card Sharp, The Deal, The Rabbit's Foot, The Silly Boy."
    - "Bị tắt thêm (do Incursion làm lại): Her Mask, Last Hope, Sambodhi's Vow."
    - "Rebirth and Renewal giờ cho một Simplex Amulet item level 86."
    - "The Peaceful Moments và The Eternal War giờ có thể cho jewel Heroic Tragedy."
  impact:
    meaning: >-
      Phần lớn những lá bị tắt đều thưởng Scarab hoặc Sacrifice Fragment, hai
      thứ giờ không còn tồn tại. Nếu bạn đang giữ mấy lá này ở Standard thì
      tạm thời chưa đổi được.


      Theo luật loot mới, monster có Rarity cao sẽ rơi card hiếm hơn và thôi
      rơi một số lá phổ thông.
    confidence: confirmed
  official:
    - "Divination Cards can no longer reward current league-specific items in their potential pool of rewards."
    - "Eight Divination Cards have been temporarily disabled, plus three more as part of the Incursion changes."
    - "Monsters with high Item Rarity will now have a higher chance to drop rarer Divination Cards."

- id: campaign-changes
  category: campaign
  verdict: buff
  title: "Campaign: mua Scroll bằng Gold và vài cảnh mới"
  image: scroll-of-wisdom
  gallery: [orb-of-transmutation, orb-of-augmentation]
  summary: >-
    Mọi vendor trong thị trấn đều bán [[Scroll of Wisdom]] giá 15 Gold.
    Viridian Wildwood có thể xuất hiện ở Act 7 và một Mirage ở Act 9. Quest
    hướng dẫn Harvest và mấy rương đồ đã identify ở cuối Labyrinth thì bị bỏ.
  points:
    - "Orb of Transmutation mua bằng Orb of Augmentation."
    - "Vendor không bán Orb of Chance nữa, và rare chưa identify mua từ vendor cũng không còn tốn một cái."
    - "Từ Act 6, item Magic và Rare có thể rơi kèm Item Tier."
    - "Cược đồ không phải jewellery bằng Gold rẻ hơn ở giữa campaign."
    - "Mọi boss trong campaign đều có một Viscera cho Wickerman của league."
  impact:
    meaning: >-
      Bạn sẽ không còn cạn Scroll of Wisdom nữa: lúc leveling thì Gold dư dả.
      Rarity cao giờ làm monster rơi ít scroll hơn, nên mua mới là cách GGG
      muốn bạn làm.


      Cược giữa campaign rẻ hơn là chỗ tiêu Gold thừa rất hợp lý khi một slot
      gear của bạn bị tụt lại.
    todo: >-
      Có một stack Scroll of Wisdom rồi thì thôi nhặt nữa. Hãy tiêu Gold vào
      scroll, và vào việc cược một cây vũ khí hay đôi giày khi đồ của bạn đã
      lỗi thời.
    confidence: confirmed
  official:
    - "Scrolls of Wisdom are now purchasable from vendors in all towns for 15 Gold."
    - "The Northern Forest and the Dread Thicket in Act 7 have a chance to spawn the Viridian Wildwood. The Vastiri Desert and the Oasis in Act 9 have a chance to spawn a Mirage."
    - "The tutorial Harvest Quest has been removed."
    - "Removed the chests at the end of the Labyrinth that drop entirely identified items."
    - "Reduced the Gold cost of Gambling during the mid-Campaign levels for non-Jewellery."

- id: quality-of-life
  category: qol
  verdict: buff
  title: "Tiện ích: ghi rõ tầm, có keyword và craft socket trắng"
  image: reflecting-mist
  gallery: [orb-of-scouring]
  summary: >-
    "Nearby" được thay bằng khoảng cách chính xác tính theo mét ở gần như mọi
    chỗ. Skill và notable do item cấp sẽ hiện mô tả khi bạn rê chuột lên.
    Crafting bench có thể biến mọi socket thành trắng với giá một
    [[Orb of Scouring]].
  points:
    - "Buff từ Blood Shrine và các buff Beyond Magnificence được giữ khi bạn đổi khu vực."
    - "Slot stash mới: mục League cho Soul Core, Allflame Ember, Royal Visage và nhiều thứ khác; mục Threads trong tab Fragment."
    - "Shard (Binding, Annulment, Chaos, Exalted, Regal) không còn để được trong tab Currency."
    - "Giữ Alt để ghim thông tin keyword trong danh sách mod của khu vực."
    - "Gilded Font trong vault Sanctum được dời xa cầu thang lối ra."
  impact:
    meaning: >-
      Craft socket trắng là thứ đáng chú ý nhất. Từ 3.29, gem nào cũng cắm
      được vào socket nào, và một gem nằm trong socket đúng màu của nó được
      +10% quality. Socket trắng xưa nay vẫn tính là mọi màu, nên làm trắng
      hết socket lẽ ra sẽ cho bonus đó cho mọi gem trong item. Chúng tôi chưa
      thử điều này trong 3.30.
    todo: >-
      Khi cây six-link chính của bạn đã chốt, hãy thử craft socket trắng lên
      nó và kiểm xem từng gem có hiện bonus quality không.
    confidence: prediction
  official:
    - "Added a new Crafting Bench option to set all Sockets on an item to be White for a cost of an Orb of Scouring (or an Orb of Scouring and a Vaal Orb for Corrupted items)."
    - "Almost all effects that were described as 'nearby' now instead describe the exact range of the effect in metres."
    - "Granted effects from Passive Skills and item modifiers are now keyworded in a number of cases."
    - "K'Tash's, Ghorr's and Beidat's Magnificence and Blood Shrine buffs are now retained when transitioning between areas."

- id: ruthless-changes
  category: other
  verdict: mixed
  title: "Ruthless có danh sách thay đổi riêng"
  image: map-tier-16
  summary: >-
