      toàn. Nó được liệt ở đây vì vài guide ra sớm đã chép nhầm các thay đổi
      ascendancy chỉ có trong Ruthless, như đợt nerf resistance của Chieftain,
      vào lời khuyên cho game thường.
    todo: >-
      Khi một guide nhắc tới thay đổi của Chieftain, Slayer, Hierophant,
      Saboteur, Elementalist hay Occultist trong 3.30, hãy đối chiếu với patch
      notes chính thức. Mấy class đó không hề bị đổi ở ngoài Ruthless.
    confidence: confirmed
  official:
    - "Ruthless-specific Changes: league mechanics spawn independently; Kirac offers at most Tier 14 Maps; the 3-map vendor recipe is removed; Voidstones set minimum Map Tier to 12."
    - "About twenty Ascendancy notables are adjusted in Ruthless only, for Chieftain, Slayer, Champion, Hierophant, Guardian, Pathfinder, Saboteur, Elementalist, Occultist and Ascendant."

- id: bug-fixes
  category: other
  verdict: mixed
  title: "Những bản vá lỗi có thể đổi cả build"
  image: orb-of-regret
  summary: >-
    Phần lớn bản vá chỉ là hình ảnh hoặc rất hiếm gặp. Vài cái đổi hẳn cách
    skill hoạt động: hiệu ứng nổ xác không còn nổ trùng một cái xác nhiều lần,
    và double damage "while on full life" không còn roll hai lần.
  points:
    - "Assassin's Mark từ Deathmarked chỉ kích hoạt khi crit bằng attack."
    - "Búa từ Holy Sweep of Hammerfalls giờ có thể bị né."
    - "Pact of Beidat giờ cộng chain cho Dark Bargain."
    - "Hexpass Support giờ chặn critical strike khi curse đến từ Blasphemy."
    - "Ghorr's Magnificence trước làm bạn ăn thêm damage thay vì bớt đi. Đã sửa."
    - "Rogue Exile loại Gigantic tách đôi hai lần trở lại, đúng như thiết kế."
    - "Kinh nghiệm của gem Kinetic Fusillade được sửa; gem có thể lên hoặc xuống một level."
  impact:
    meaning: >-
      Hai bản vá là nerf ngầm. Những build xâu chuỗi nổ xác qua cùng một cái
      xác từng gây damage cao hơn dự định, và những build stack "chance to
      deal double damage while on full life" cũng vậy. Giờ cả hai chạy đúng
      như dòng chữ ghi.
    confidence: confirmed
  official:
    - "Fixed a bug where some explosion effects could explode the same corpse multiple times."
    - "Fixed a bug where chance to deal double damage while on full life would roll an additional time if the enemy was on full life."
    - "Fixed a bug where Assassin's Mark from Assassin's Deathmarked Notable Passive could trigger from any Critical Strike, instead of only from Attack Critical Strikes."
    - "About sixty further fixes cover display issues, audio, hideouts and microtransactions."
