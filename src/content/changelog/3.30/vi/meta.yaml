updated: "2026-11-13"
intro: >-
  Patch 3.30 thay đổi endgame mạnh hơn bất kỳ patch nào nhiều năm nay. Scarab
  bị xoá hoàn toàn, thay bằng Threads; Atlas tree được dựng lại từ đầu; loot
  chạy theo luật mới. Phần balance nhân vật thì gần như không nhúc nhích.
  Trang này viết lại patch notes chính thức bằng lời dễ hiểu, và giải thích
  từng thay đổi có nghĩa gì khi bạn thực sự chơi.
note: >-
  Viết trong ngày league ra mắt, dựa trên patch notes chính thức, FAQ và Q&A
  của GGG, cùng thảo luận của cộng đồng trước giờ mở server. Những phần được
  đánh dấu là dự đoán thì vẫn cần kiểm chứng trong game.
