intro: >-
  Path of Exile 3.30 launched on 13 November 2026. The league adds witch
  covens, Fates that empower map bosses, and a Wickerman you feed with boss
  remains. Underneath that, it is the largest endgame rewrite in years.
highlights:
  - title: Scarabs are gone
    text: >-
      [[Threads]] replace them. You now choose which league mechanic a map
      gets, and mechanics no longer appear at random.
    section: changelog
  - title: Loot follows Rarity
    text: >-
      Item Quantity is removed from monsters and maps. Rare and Unique
      monsters now drop most of the valuable currency.
    section: changelog
  - title: Your old starter still works
    text: >-
      Only six skill gems and four ascendancies changed. Most 3.29 league
      starters carry over almost untouched.
    section: builds
