intro: >-
  Path of Exile 3.30 ra mắt ngày 13 tháng 11 năm 2026. League này mang vào
  witch coven, Fates để buff boss của từng khu vực, và một Wickerman mà bạn
  "nuôi" bằng xác boss. Bên dưới lớp đó là bản viết lại endgame lớn nhất
  trong nhiều năm.
highlights:
  - title: Scarab biến mất
    text: >-
      [[Threads]] lên thay. Giờ bạn tự chọn map của mình có league mechanic
      nào, mechanic không còn tự xuất hiện ngẫu nhiên nữa.
    section: changelog
  - title: Loot chạy theo Rarity
    text: >-
      Item Quantity bị bỏ khỏi monster và map. Rare với Unique monster giờ là
      nguồn rơi phần lớn currency có giá.
    section: changelog
  - title: Starter cũ của bạn vẫn chạy
    text: >-
      Chỉ sáu skill gem và bốn ascendancy bị sửa. Phần lớn league starter của
      3.29 mang sang gần như nguyên vẹn.
    section: builds
