kind: announcement
status: announced
title: "Improvements to Core Item Drops"
headline: "The hardest monsters will stop dropping Orbs of Alchemy"
summary: >-
  GGG explains a flaw in how 3.30 hands out currency and how it will be fixed,
  then lists more drops on the way: two new kinds of [[Exalted Orb]], far more
  Cluster Jewels, more Simulacrum Splinters. **None of it is in the game
  yet**, and only the currency fix has a timeframe.
eta: "The currency fix: \"in a patch coming very soon\". No date is given for anything else in the post."
points:
  - kind: info
    text: "**The flaw.** In 3.30, Rarity on a monster raises the chance that a currency drop comes from the top category, and the item is then picked from inside that category. The category runs from [[Orb of Alchemy]] all the way up to Hinekora's Lock and the Mirror of Kalandra."
  - kind: info
    text: "Once a monster has enough Rarity it can only drop from the top category, and about 33% of those drops were an [[Orb of Alchemy]], even from a very hard boss. For map bosses, extra Rarity no longer improved currency at all."
  - kind: info
    text: "Divination Cards, Unique items and higher-tier Rare and Magic items work as intended, GGG says. Currency is the part that does not."
  - kind: buff
    text: "**The fix.** Past a high amount of Rarity, more Rarity removes the low-value currency from the top category: fewer [[Orb of Alchemy]] drops, more valuable currency such as [[Divine Orb]]."
  - kind: new
    text: "New mid-to-high-tier currencies join the core drop pool."
  - kind: new
    text: "Foulborn Currency joins the core drop pool. To balance that, the Currency subtree of the Genesis Tree now greatly raises the chance of birthing Foulborn Currency from Wombgifts. Breach stays the best source overall."
sections:
  - title: "Two new Exalted Orbs"
    points:
      - kind: new
        text: "**Originator's Exalted Orb** adds one of the new rare-only map modifiers, for example \"Area contains a Mirage\". It can be used to put several rare-only modifiers on one map."
      - kind: new
        text: "**Primordial Exalted Orb** turns at random into one of eleven: Hunter's, Warlord's, Veiled, Crusader's, Redeemer's, Shaper's, Elder's, Tainted, Eldritch, Foulborn or Originator's Exalted Orb."
  - title: "More from league content"
    points:
      - kind: buff
        text: "**Cluster Jewels** drop significantly more often, and the rate now scales with difficulty: more modifiers on the map, more jewels."
      - kind: buff
        text: "**Simulacrum Splinters** drop more often."
      - kind: buff
        text: "**Sacred Flora**: the monsters it spawns drop all their loot at the tree, so you no longer walk the map to collect it."
      - kind: info
        text: "The Archon of Corruption supporter pack feature is planned to be switched on: place the Corrupted Precursor Beacon in your hideout and submit it to appear as an Atlas Anomaly for other players."
meaning: >-
  **Not live.** If your map boss keeps dropping an [[Orb of Alchemy]] today,
  the game is still doing exactly what this post describes as the flaw.


  **Stacking Rarity past the point of diminishing returns was wasted until
  now**, at least for currency. After the fix it should pay again at the very
  top. How much is unknown until the patch is out and people have counted
  drops.


  **Hold off on expensive Cluster Jewels if you can wait.** A drop rate that
  goes up "significantly" usually takes prices down with it. That is how the
  market tends to behave and not a promise; nobody knows the new rate. The
  same reasoning applies to Simulacrum Splinters.
