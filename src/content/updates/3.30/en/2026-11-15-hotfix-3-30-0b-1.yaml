title: "3.30.0b Hotfix"
headline: "Recoup works again, and double-corrupting no longer wipes an imbued gem"
summary: >-
  Two bugs that quietly cost a character something it had paid for. Both are
  fixed.
points:
  - kind: fix
    text: "Modifiers that give **Damage taken Recouped as Life** were not recovering any life. Fixed."
  - kind: fix
    text: "**Double Corrupting an Imbued Gem** removed its Imbued Support effect. Fixed."
meaning: >-
  **If your build leans on Recoup and felt far squishier than its Path of
  Building said during the first two days, test it again.** The stat was doing
  nothing.


  **If you held off double-corrupting an imbued gem, the bug that ate the
  support is gone.** The corruption itself is as much of a gamble as it always
  was. The post does not say whether a gem that already lost its effect gets
  it back, so do not count on that.
