kind: hotfix
status: live
title: "3.30.0b Hotfix 4"
headline: "Veiled Chaos works on an item that already has a veiled modifier"
summary: >-
  The latest version of the game you are playing. A crafting rule is relaxed,
  and two fixes concern [[Viscera]] and captured beasts.
points:
  - kind: buff
    text: "**Veiled Chaos** can be used on an item that has a veiled modifier, as long as that modifier is not protected by being fractured or by a metamod. The post says \"Veiled Chaos\"; we take it to mean the [[Veiled Chaos Orb]]."
  - kind: fix
    text: "[[Viscera]] items no longer count as being equipped for effects such as Malachai's Vision."
  - kind: fix
    text: "Captured beasts with \"Creates Frost Walls and Flees\" no longer have that modifier when you fight them in the Menagerie."
  - kind: fix
    text: "An instance crash."
meaning: >-
  **For crafters:** an item carrying a veiled modifier is no longer a dead end
  for a [[Veiled Chaos Orb]]. The exception is the one you would expect: a
  veiled modifier you have locked in place, by fracture or with a metamod,
  stays locked.


  **For everyone who fights beasts in the Menagerie:** the beast that walls
  itself off and runs away was the one that made a capture fight drag. It
  stands and fights now.
