date: "2026-11-17"
order: 2
kind: announcement
status: announced
title: "Thread Difficulty and League Mechanic Changes"
headline: "Threads get easier, and every mechanic pays more for them"
summary: >-
  The details GGG promised the day before. Monsters get much less tanky as you
  add [[Threads]], they hit less hard, and every league mechanic gains more
  monsters or more rewards per Thread. Seven mechanics get changes of their
  own. **None of this is in the game yet.** GGG calls it a first step and not
  the end of the work.
eta: "Planned for a patch \"later this week, as soon as they're ready\"."
points:
  - kind: buff
    text: "**Monster toughness from Threads is significantly reduced for every mechanic**, most of all on the step from 6 to 8 Threads."
  - kind: buff
    text: "Monsters gain less damage from Threads, and Fate empowerments deal less damage at higher levels."
  - kind: rework
    text: "High Thread counts guarantee a minimum number of modifiers. At 8 Threads you always get at least 3 Thread modifiers, with a chance of many more."
  - kind: buff
    text: "Every mechanic now gains monsters or rewards for each Thread you add. The examples are in the groups below."
sections:
  - title: "Breach"
    points:
      - kind: buff
        text: "More Magic Monsters come out of each Breach as Threads go up, and Breach Hives and stabilised Unstable Breaches summon more Rare Monsters."
      - kind: new
        text: "New Thread modifier: twice the Rare Monsters at the end of Unstable Breaches and from the final defence wave of Hive encounters."
      - kind: new
        text: "New Thread modifier: every Magic Monster in your Breaches gets an extra Monster Modifier, which also adds Rarity."
  - title: "Bestiary"
    points:
      - kind: buff
        text: "Bestiary monsters are less tough, and Bestiary Modifiers add less toughness."
      - kind: buff
        text: "Every Bestiary Modifier now adds Rarity, so the harder fight pays better."
      - kind: new
        text: "New Thread modifier: every Red Beast gets one more Bestiary Modifier."
  - title: "Ritual"
    points:
      - kind: buff
        text: "The Favours window offers more items as Threads go up."
      - kind: buff
        text: "Revived Ritual monsters lose less of their item drops and experience as Threads go up."
      - kind: buff
        text: "The Thread modifier with the Bodach now gives two free Favour rerolls when you complete it."
      - kind: new
        text: "New Thread modifier: 150% increased number of items in Ritual reward windows. It can roll twice, for 300%."
  - title: "Betrayal"
    points:
      - kind: buff
        text: "Targets at Rank 2 or Rank 3 have more Rarity, and Syndicate Equipment on a target adds more."
      - kind: fix
        text: "The Thread modifier that spawns extra clusters of Parasite-Filled Chests dropped no items. Fixed."
      - kind: new
        text: "New Thread modifier: every main target comes with Rare Bodyguard monsters."
  - title: "Ultimatum"
    points:
      - kind: buff
        text: "Choosing a Downside now gives you an Upside by default. The Thread modifier that used to do this at random is removed."
      - kind: buff
        text: "Ultimatum monsters gain Rarity every round."
  - title: "Incursion"
    points:
      - kind: buff
        text: "Larger packs with more Rare Monsters as Threads go up."
      - kind: new
        text: "New Thread modifier: Incursions have active Tempests."
      - kind: new
        text: "New Thread modifier: each later Incursion in the same area has more Rare Monsters guarding the Architects. With four Incursions, the second gets +2, the third +4 and the fourth +6."
      - kind: new
        text: "New Thread modifier: a Meeting of the Architects, which replaces every monster pack with Architects."
  - title: "Expedition"
    points:
      - kind: buff
        text: "Runic Monsters drop 20–30% more items and give 20–30% more experience, with no Threads needed."
      - kind: buff
        text: "Remnants gain a rising chance of additional Reward Modifiers (suffixes) as Threads go up."
      - kind: new
        text: "New Thread modifier: buried Sentinels appear in Expeditions."
      - kind: new
        text: "New multiple-choice Atlas notable: block the Remnant upsides that affect monsters, or the ones that affect chests."
  - title: "Elsewhere"
    points:
      - kind: buff
        text: "Tormented Spirits give more Rarity to the monsters they possess."
      - kind: new
        text: "New multiple-choice Atlas notable: one category of Eldritch Altar modifier is guaranteed to appear, where possible. You pick Players, Influenced Monsters or the Map Boss."
meaning: >-
  **Not live.** Do not plan a map around these numbers until the patch notes
  exist; this page will mark it when they do.


  The direction matters today, though. **If you stopped at 6 Threads because 8
  made monsters unkillable, that step is the one being cut hardest.** And the
  two mechanics GGG named as underpaid the day before, Breach and Expedition,
  both get more monsters and more reward here.


  On paper the largest single additions are Ritual's new modifier (up to 300%
  more items in the reward window) and Expedition's flat 20–30% on Runic
  Monsters. That ranking is our reading of the post, and nobody has measured
  it in the game, because it is not in the game.
