date: "2026-11-15"
order: 1
kind: patch
status: live
title: "3.30.0b Patch Notes (restartless)"
headline: "The first patch: Covetous Shrines lose their penalty, Gwennen gets safer"
summary: >-
  The first named patch of the league. It went out without a server restart,
  so restart your game client once to pick up the client-side parts. One real
  balance change, two safety rails on Gwennen, and a list of fixes.
points:
  - kind: buff
    text: "**Covetous Shrines** no longer make you take 20% increased damage."
  - kind: fix
    text: "**Gwennen** now shows warning text about taking your items back: as we read it, you cannot reclaim them until a \"Take a Chance\" outcome has been selected."
  - kind: fix
    text: "Gwennen no longer lets you \"Take a Chance\" when you do not have enough currency to pay for it."
  - kind: fix
    text: "Strongboxes \"Guarded by a Rogue Exile\" were not spawning the exile. They do now."
  - kind: fix
    text: "Items could not be linked in chat. Fixed."
  - kind: fix
    text: "The return portals from Beyond bosses can no longer be targeted."
  - kind: fix
    text: "A bug with the [[Wickerman]] voice lines, and a visual clean-up of Abyssal monster modifiers."
  - kind: fix
    text: "The \"Foretold Foes\" challenge text now says Unique Bosses, and the Broken Bridge boss has a proper name."
meaning: >-
  **Take Covetous Shrines when you see them.** Since 3.30 they have a base
  chance to spawn in maps, and the damage penalty was the reason to walk past
  one.


  With Gwennen, the two changes point the same way: the gamble is less likely
  to cost you something by accident. Read the new warning before you hand over
  an item you care about.
entries: [map-encounter-tweaks, gwennen-take-a-chance, wickerman-viscera, beyond-rework, league-versions-challenges]
official:
  - "Covetous Shrines no longer grant the player 20% increased Damage taken."
