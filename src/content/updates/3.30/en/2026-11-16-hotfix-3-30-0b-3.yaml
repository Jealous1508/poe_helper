date: "2026-11-16"
order: 3
kind: hotfix
status: live
title: "3.30.0b Hotfix 3"
headline: "The deadliest Thread modifiers are kept out of low maps"
summary: >-
  The most important hotfix so far for a new character. Seven of the most
  dangerous modifiers that [[Threads]] can add now need a minimum area level,
  and none of them can appear at all when you spend a single Thread. It also
  lets you invoke the same Fate three times. Deployed without a restart, so
  restart your client once.
points:
  - kind: buff
    text: "**With a single Thread spent, none of the seven modifiers below can appear**, at any area level."
  - kind: new
    text: "You can now invoke **three copies of the same Fate**. The first and the third copy have their rewards tripled; the second copy is ignored."
  - kind: buff
    text: "**Bestiary Monster Modifiers** now add monster toughness instead of maximum life. Toughness adds up with other sources such as Wisps and Thread stats rather than multiplying, so stacking them no longer makes a beast nearly as tanky."
  - kind: buff
    text: "The **Effulgent Blightworm** miniboss takes reduced damage during its protective phase instead of being immune."
  - kind: fix
    text: "The Delve Subterranean Chart could fail to draw its paths, and on rare occasions went completely black. Both fixed."
  - kind: fix
    text: "One client crash and two instance crashes."
sections:
  - title: "Only in areas of level 73 or higher"
    points:
      - kind: buff
        text: "Blight: the pump is replaced by a sleeping Pantheon god."
      - kind: buff
        text: "Ultimatum: the option to Double Down on the encounter."
      - kind: buff
        text: "Breach: an extra Breach modifier on Rare Breach monsters."
  - title: "Only in areas of level 80 or higher"
    points:
      - kind: buff
        text: "Abyss: an extra Abyssal Monster Modifier on Rare Abyssal monsters."
      - kind: buff
        text: "Bestiary: beasts empowered with Wisps."
      - kind: buff
        text: "Betrayal: Catarina accompanies the encounters."
      - kind: buff
        text: "Betrayal: Rare Monster modifiers on Syndicate members."
meaning: >-
  **One Thread is now the safe way to learn a mechanic.** None of the seven
  can roll on it. From two Threads up they can, but only once the map is high
  enough: area level 73 is a tier 6 map, and level 80 is a tier 13.


  **Three of the same Fate** is a real choice now, for a Fate whose reward you
  want and whose danger you already know. The post says what happens to the
  rewards and nothing about how the difficulty adds up, so try it on a map you
  can afford to lose.
