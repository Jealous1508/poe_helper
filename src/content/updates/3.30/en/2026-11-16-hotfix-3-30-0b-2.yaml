date: "2026-11-16"
order: 2
kind: hotfix
status: live
title: "3.30.0b Hotfix 2"
headline: "Crowkeeper and Wildfire hit less hard, and Gwennen wants empty sockets"
summary: >-
  The first hotfix that goes after Fates for being too deadly, plus one new
  rule for Gwennen and a handful of fixes.
points:
  - kind: buff
    text: "The **Tier 3 Crowkeeper Fate** no longer gives the empowered monster Culling Strike."
  - kind: buff
    text: "Crowkeeper explosions deal less damage."
  - kind: buff
    text: "The Blackfire Wall from **Wildfire** deals less damage."
  - kind: rework
    text: "**Gwennen** only accepts an item for \"Take a Chance\" if its sockets are empty."
  - kind: fix
    text: "Some bosses spawned by Fates could not drop [[Viscera]]. They can now."
  - kind: fix
    text: "The Swarmforge boss could start the fight early and lock players out of it."
  - kind: fix
    text: "Goreblossoms from the new Corpse Rose unique wand could damage allied players."
  - kind: fix
    text: "Rare-only map modifiers no longer roll on Blighted Maps."
  - kind: fix
    text: "A problem turning in the Something Dark divination card."
meaning: >-
  **Culling Strike on an empowered monster was a death you could not recover
  from**: a hit that leaves you at a tenth of your life or less kills you
  outright, whatever leech or regeneration you had coming. With it gone, Tier
  3 Crowkeeper is a fight you can out-heal again.


  **Take your gems out before you give an item to Gwennen.** That is our
  reading of the new rule, and it is the safe one either way.
entries: [league-fates, gwennen-take-a-chance, wickerman-viscera, new-map-modifiers, new-uniques, divination-card-changes]
official:
  - "Tier 3 Crowkeeper Fate no longer grants the Empowered monster Culling Strike."
