title: "3.30.0 Hotfix 2"
headline: "Abyss monsters stop melting you, and Einhar's aura hits the right side"
summary: >-
  Two launch-night bugs that killed characters for no fault of their own, both
  fixed within hours.
points:
  - kind: fix
    text: "**Abyssal monster modifiers** were dealing far too much physical damage over time. Fixed."
  - kind: fix
    text: "One random Bestiary modifier from [[Threads]] gives Einhar an aura that makes nearby enemies explode when they die. It was damaging you and your allies instead of the enemies. Fixed."
  - kind: fix
    text: "Two instance crashes."
meaning: >-
  If you died in an Abyss on the first night to damage over time that looked
  far too strong, it was this bug and not your build. The same goes for an
  unexplained death next to Einhar. Both are safe to try again.
