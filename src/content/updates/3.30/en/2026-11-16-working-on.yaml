date: "2026-11-16"
order: 1
kind: announcement
status: announced
title: "Path of Exile: Covens of Umbra - What We're Working On"
headline: "GGG's to-do list for Threads and Shaped Regions"
summary: >-
  Three days in, GGG wrote down what it intends to fix about [[Threads]] and
  Shaped Regions, the two systems the whole endgame now rests on. This is a
  list of intentions. Each item is meant to arrive as its own hotfix when it
  is ready, and the post gives no dates. Where a later update has acted on a
  line, the line says so.
eta: "No dates. Each item ships as its own hotfix when it is ready."
points:
  - kind: rework
    text: "Tone down the individual Thread modifiers and Fate empowerments that are too dangerous on their own. The post said changes for some outliers were already on the way."
    followUp: 2026-11-16-hotfix-3-30-0b-2
  - kind: rework
    text: "Make the first hours with Threads and Shaped Regions less spiky, so that entering maps is not where a character dies."
    followUp: 2026-11-16-hotfix-3-30-0b-3
  - kind: rework
    text: "Revise existing Thread modifiers so the difficulty is worth taking: less punishing, better rewarded, or both."
    followUp: 2026-11-17-thread-difficulty-changes
  - kind: buff
    text: "Lower the monster toughness that the basic Thread stats add at low Thread counts."
    followUp: 2026-11-17-thread-difficulty-changes
  - kind: rework
    text: "Limit how many Threads you can spend early on, and open up high counts as characters get stronger."
  - kind: rework
    text: "Harvest: Wisps would stop spreading to Unique and Rare monsters by default. You could opt back in through an Atlas passive."
  - kind: fix
    text: "A bug where the Thread count on the map device is sometimes lost when you change instance. A full fix is being looked into."
  - kind: fix
    text: "The Delve map not showing its paths, and the size of Fate icons. Both \"addressed soon\"."
    followUp: 2026-11-16-hotfix-3-30-0b-3
sections:
  - title: "Added to the post a few hours later: Fate rewards"
    points:
      - kind: new
        text: "New \"jackpot\" reward outcomes for Fates are being assessed. The example given: a rare reward that puts a gem-related modifier on every Amulet the empowered monster drops."
      - kind: new
        text: "Invoking three of the same Fate, with the first and the third Fate's rewards tripled."
        followUp: 2026-11-16-hotfix-3-30-0b-3
meaning: >-
  **One thing here helps you today.** Until the map-device bug is fixed, GGG's
  own workaround is to place your Threads in the map device's inventory. Do
  that and the count is not lost between instances.


  For the rest, treat it as direction and not as fact. The direction is
  friendly: nothing on the list makes Threads harder, and several lines make
  them gentler at the low end, which is where a new character meets them. If
  Threads felt unfair in white and yellow maps, that is the part GGG says it
  is working on first.
