kind: announcement
status: announced
title: "What We're Working On: Endgame"
headline: "GGG says it out loud: some mechanics pay far less than others"
summary: >-
  A short statement, and no changes in it. GGG agrees with what players have
  been reporting: the gap in item drops between the best and the worst league
  mechanics is too wide. It names its two priorities and promises details.
eta: "No changes in this post. The details came the next day."
points:
  - kind: info
    text: "GGG's own example: juiced **Legion** and **Abyss** give noticeably more raw currency per hour than **Breach** or **Expedition**."
  - kind: info
    text: "Priority one: raise the mechanics that fall behind. They will not all end up equal; the stated aim is to \"meaningfully close the gap\"."
    followUp: 2026-11-17-thread-difficulty-changes
  - kind: info
    text: "Priority two: make a high Thread count worth it. For some mechanics, going from few [[Threads]] to many adds more danger than reward."
    followUp: 2026-11-17-thread-difficulty-changes
meaning: >-
  **If you are farming Breach or Expedition and feel poor, it is not you.**
  The developers see the same numbers.


  Two things are worth noticing in how this is worded. The plan is to lift the
  weak mechanics, and the post says nothing about cutting the strong ones, so
  Legion and Abyss are the safe raw-currency choice for now. And an Atlas
  tree built around a mechanic that is behind today may be worth much more
  within the week, so do not respec out of it in a hurry.
entries: [scarabs-to-threads, no-random-league-mechanics, loot-rarity-rework]
