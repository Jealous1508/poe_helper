title: "3.30.0b Hotfix"
headline: "Recoup chạy lại, và double corrupt không còn xoá trắng imbued gem"
summary: >-
  Hai bug âm thầm lấy mất của nhân vật thứ nó đã trả giá để có. Cả hai đã
  được sửa.
points:
  - kind: fix
    text: "Các modifier cho **Damage taken Recouped as Life** không hồi lại chút life nào. Đã sửa."
  - kind: fix
    text: "**Double Corrupt một Imbued Gem** làm mất hiệu ứng Imbued Support của nó. Đã sửa."
meaning: >-
  **Nếu build của bạn dựa vào Recoup và hai ngày đầu thấy mỏng hơn hẳn so với
  con số trong Path of Building, hãy thử lại.** Lúc đó chỉ số này không làm
  gì cả.


  **Nếu bạn từng nán lại chưa double corrupt một imbued gem, thì bug nuốt mất
  support đã hết.** Còn bản thân việc corrupt vẫn may rủi y như xưa nay. Bài
  đăng không nói một viên gem đã mất hiệu ứng có được trả lại hay không, nên
  đừng trông vào chuyện đó.
