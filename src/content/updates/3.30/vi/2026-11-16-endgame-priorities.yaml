title: "What We're Working On: Endgame"
headline: "GGG nói thẳng ra: có mechanic trả ít hơn hẳn mechanic khác"
summary: >-
  Một tuyên bố ngắn, và trong đó không có thay đổi nào. GGG đồng ý với điều
  người chơi vẫn phản ánh: khoảng cách về item rơi ra giữa league mechanic tốt
  nhất và tệ nhất quá rộng. Họ nêu tên hai ưu tiên và hứa sẽ có chi tiết.
eta: "Bài đăng này không có thay đổi nào. Chi tiết tới vào ngày hôm sau."
points:
  - kind: info
    text: "Ví dụ của chính GGG: **Legion** và **Abyss** được juice cho raw currency mỗi giờ nhiều hơn thấy rõ so với **Breach** hay **Expedition**."
  - kind: info
    text: "Ưu tiên một: nâng các mechanic đang tụt lại. Chúng sẽ không ngang nhau hết; mục tiêu được nêu là \"meaningfully close the gap\"."
    followUp: 2026-11-17-thread-difficulty-changes
  - kind: info
    text: "Ưu tiên hai: làm cho số Thread cao đáng công. Với vài mechanic, đi từ ít [[Threads]] lên nhiều thêm nguy hiểm nhiều hơn là thêm phần thưởng."
    followUp: 2026-11-17-thread-difficulty-changes
meaning: >-
  **Nếu bạn đang farm Breach hay Expedition mà thấy nghèo, thì không phải tại
  bạn.** Dev cũng thấy cùng những con số đó.


  Có hai điều đáng để ý trong cách bài này được viết. Kế hoạch là nâng các
  mechanic yếu lên, và bài đăng không nói gì về chuyện cắt các mechanic mạnh,
  nên lúc này Legion và Abyss là lựa chọn raw currency an toàn. Và một Atlas
  tree dựng quanh một mechanic đang tụt lại hôm nay có thể đáng giá hơn nhiều
  ngay trong tuần, nên đừng vội respec bỏ nó.
