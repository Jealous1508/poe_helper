date: "2026-11-16"
order: 3
kind: hotfix
status: live
title: "3.30.0b Hotfix 3"
headline: "Những Thread modifier chết người nhất bị giữ khỏi map thấp"
summary: >-
  Hotfix quan trọng nhất tính tới giờ với một nhân vật mới. Bảy trong số
  những modifier nguy hiểm nhất mà [[Threads]] có thể thêm vào giờ cần một
  area level tối thiểu, và khi bạn chỉ tiêu một Thread thì không cái nào xuất
  hiện được cả. Nó cũng cho bạn gọi cùng một Fate ba lần. Được triển khai
  không cần restart, nên hãy khởi động lại client một lần.
points:
  - kind: buff
    text: "**Khi chỉ tiêu một Thread, không modifier nào trong bảy cái dưới đây xuất hiện được**, ở bất kỳ area level nào."
  - kind: new
    text: "Giờ bạn có thể gọi **ba lá của cùng một Fate**. Lá thứ nhất và lá thứ ba được nhân ba phần thưởng; lá thứ hai bị bỏ qua."
  - kind: buff
    text: "**Bestiary Monster Modifier** giờ cộng monster toughness thay vì maximum life. Toughness cộng dồn với các nguồn khác như Wisps và chỉ số Thread chứ không nhân lên, nên chồng chúng lại không còn làm một con beast trâu tới gần mức trước đây nữa."
  - kind: buff
    text: "Miniboss **Effulgent Blightworm** giờ nhận ít damage hơn trong pha tự vệ thay vì miễn nhiễm."
  - kind: fix
    text: "Delve Subterranean Chart có lúc không vẽ ra đường đi, và hiếm hoi thì đen kịt hoàn toàn. Cả hai đã sửa."
  - kind: fix
    text: "Một lỗi crash client và hai lỗi crash instance."
sections:
  - title: "Chỉ ở khu vực level 73 trở lên"
    points:
      - kind: buff
        text: "Blight: pump bị thay bằng một vị thần Pantheon đang ngủ."
      - kind: buff
        text: "Ultimatum: lựa chọn Double Down cho encounter."
      - kind: buff
        text: "Breach: thêm một Breach modifier trên Rare Breach monster."
  - title: "Chỉ ở khu vực level 80 trở lên"
    points:
      - kind: buff
        text: "Abyss: thêm một Abyssal Monster Modifier trên Rare Abyssal monster."
      - kind: buff
        text: "Bestiary: beast được buff bằng Wisps."
      - kind: buff
        text: "Betrayal: Catarina đi kèm các encounter."
      - kind: buff
        text: "Betrayal: Rare Monster modifier trên thành viên Syndicate."
meaning: >-
  **Một Thread giờ là cách an toàn để học một mechanic.** Không cái nào trong
  bảy modifier đó roll ra được trên nó. Từ hai Thread trở lên thì được, nhưng
  chỉ khi map đủ cao: area level 73 là map tier 6, còn level 80 là tier 13.


  **Ba lá Fate giống nhau** giờ là một lựa chọn thật sự, dành cho Fate mà bạn
  muốn phần thưởng và đã biết rõ mức nguy hiểm. Bài đăng nói chuyện gì xảy ra
  với phần thưởng và không nói gì về việc độ khó cộng lại ra sao, nên hãy thử
  trên một map bạn chịu mất được.
