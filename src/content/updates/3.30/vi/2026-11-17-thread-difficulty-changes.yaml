date: "2026-11-17"
order: 2
kind: announcement
status: announced
title: "Thread Difficulty and League Mechanic Changes"
headline: "Threads dễ thở hơn, và mechanic nào cũng trả nhiều hơn cho chúng"
summary: >-
  Phần chi tiết GGG hứa hôm trước. Monster bớt trâu đi nhiều khi bạn thêm
  [[Threads]], chúng đánh nhẹ hơn, và mọi league mechanic đều được thêm
  monster hoặc thêm phần thưởng theo từng Thread. Bảy mechanic có thay đổi
  riêng. **Chưa thứ nào trong số này có trong game.** GGG gọi đây là bước đầu
  chứ chưa phải kết thúc công việc.
eta: "Dự kiến nằm trong một patch \"later this week, as soon as they're ready\"."
points:
  - kind: buff
    text: "**Monster toughness từ Threads giảm đáng kể ở mọi mechanic**, nhiều nhất là ở bước từ 6 lên 8 Thread."
  - kind: buff
    text: "Monster được cộng ít damage hơn từ Threads, và phần buff của Fate gây ít damage hơn ở level cao."
  - kind: rework
    text: "Số Thread cao bảo đảm một số modifier tối thiểu. Ở 8 Thread bạn luôn có ít nhất 3 Thread modifier, kèm cơ hội ra nhiều hơn thế nữa."
  - kind: buff
    text: "Mọi mechanic giờ đều được thêm monster hoặc phần thưởng theo mỗi Thread bạn thêm vào. Ví dụ nằm ở các nhóm bên dưới."
sections:
  - title: "Breach"
    points:
      - kind: buff
        text: "Mỗi Breach ra nhiều Magic Monster hơn khi số Thread tăng, còn Breach Hive và Unstable Breach đã được ổn định thì gọi ra nhiều Rare Monster hơn."
      - kind: new
        text: "Thread modifier mới: gấp đôi số Rare Monster ở cuối Unstable Breach và từ đợt phòng thủ cuối của encounter Hive."
      - kind: new
        text: "Thread modifier mới: mọi Magic Monster trong Breach của bạn có thêm một Monster Modifier, thứ này cũng cộng thêm Rarity."
  - title: "Bestiary"
    points:
      - kind: buff
        text: "Monster Bestiary bớt toughness, và Bestiary Modifier cộng ít toughness hơn."
      - kind: buff
        text: "Mọi Bestiary Modifier giờ đều cộng Rarity, nên trận khó hơn thì trả khá hơn."
      - kind: new
        text: "Thread modifier mới: mọi Red Beast có thêm một Bestiary Modifier."
  - title: "Ritual"
    points:
      - kind: buff
        text: "Cửa sổ Favours bày ra nhiều item hơn khi số Thread tăng."
      - kind: buff
        text: "Monster Ritual được hồi sinh mất ít item drop và experience hơn khi số Thread tăng."
      - kind: buff
        text: "Thread modifier có Bodach giờ cho hai lượt reroll Favour miễn phí khi bạn hoàn thành nó."
      - kind: new
        text: "Thread modifier mới: số item trong cửa sổ thưởng Ritual được 150% increased. Nó roll được hai lần, thành 300%."
  - title: "Betrayal"
    points:
      - kind: buff
        text: "Mục tiêu ở Rank 2 hoặc Rank 3 có nhiều Rarity hơn, và Syndicate Equipment trên mục tiêu cộng thêm nữa."
      - kind: fix
        text: "Thread modifier spawn thêm các cụm Parasite-Filled Chest trước đó không rơi item nào. Đã sửa."
      - kind: new
        text: "Thread modifier mới: mọi mục tiêu chính đi kèm Rare Bodyguard monster."
  - title: "Ultimatum"
    points:
      - kind: buff
        text: "Chọn một Downside giờ mặc định cho bạn một Upside. Thread modifier trước đây làm việc này một cách ngẫu nhiên bị bỏ."
      - kind: buff
        text: "Monster Ultimatum được thêm Rarity sau mỗi round."
  - title: "Incursion"
    points:
      - kind: buff
        text: "Pack lớn hơn với nhiều Rare Monster hơn khi số Thread tăng."
      - kind: new
        text: "Thread modifier mới: Incursion có Tempest đang hoạt động."
      - kind: new
        text: "Thread modifier mới: mỗi Incursion về sau trong cùng một khu vực có thêm Rare Monster canh giữ các Architect. Với bốn Incursion, cái thứ hai được +2, cái thứ ba +4 và cái thứ tư +6."
      - kind: new
        text: "Thread modifier mới: một Meeting of the Architects, thay mọi pack monster bằng Architect."
  - title: "Expedition"
    points:
      - kind: buff
        text: "Runic Monster rơi nhiều hơn 20–30% item và cho nhiều hơn 20–30% experience, không cần Thread nào."
      - kind: buff
        text: "Remnant có tỉ lệ tăng dần ra thêm Reward Modifier (suffix) khi số Thread tăng."
      - kind: new
        text: "Thread modifier mới: buried Sentinel xuất hiện trong Expedition."
      - kind: new
        text: "Atlas notable nhiều lựa chọn mới: chặn các upside của Remnant ảnh hưởng tới monster, hoặc các upside ảnh hưởng tới chest."
  - title: "Những chỗ khác"
    points:
      - kind: buff
        text: "Tormented Spirit cho monster bị chúng nhập nhiều Rarity hơn."
      - kind: new
        text: "Atlas notable nhiều lựa chọn mới: một loại modifier của Eldritch Altar được bảo đảm xuất hiện, khi có thể. Bạn chọn Players, Influenced Monsters hoặc Map Boss."
meaning: >-
  **Chưa live.** Đừng lên kế hoạch map quanh mấy con số này cho tới khi có
  patch notes; trang này sẽ đánh dấu khi có.


  Tuy vậy, hướng đi thì hôm nay đã đáng để tâm. **Nếu bạn dừng ở 6 Thread vì
  8 Thread làm monster không giết nổi, thì bước đó chính là bước bị cắt mạnh
  nhất.** Và hai mechanic GGG nêu tên hôm trước là trả thiếu, Breach và
  Expedition, đều được thêm monster và thêm phần thưởng ở đây.


  Trên giấy, hai khoản cộng đơn lẻ lớn nhất là modifier mới của Ritual (thêm
  tối đa 300% item trong cửa sổ thưởng) và mức 20–30% cố định của Expedition
  trên Runic Monster. Thứ hạng đó là cách chúng tôi đọc bài đăng, và chưa ai
  đo nó trong game, vì nó chưa có trong game.
