title: "3.30.0b Hotfix 4"
headline: "Veiled Chaos dùng được trên item đã có sẵn veiled modifier"
summary: >-
  Đây là phiên bản game mới nhất mà bạn đang chơi. Một luật craft được nới
  ra, và hai bản fix liên quan tới [[Viscera]] và beast đã bắt.
points:
  - kind: buff
    text: "**Veiled Chaos** dùng được trên item có veiled modifier, miễn là modifier đó không được bảo vệ nhờ fractured hoặc nhờ một metamod. Bài đăng ghi \"Veiled Chaos\"; chúng tôi hiểu đó là [[Veiled Chaos Orb]]."
  - kind: fix
    text: "Item [[Viscera]] không còn bị tính là đang được trang bị đối với các hiệu ứng như Malachai's Vision."
  - kind: fix
    text: "Beast đã bắt có \"Creates Frost Walls and Flees\" không còn mang modifier đó khi bạn đánh chúng trong Menagerie."
  - kind: fix
    text: "Một lỗi crash instance."
meaning: >-
  **Với người craft:** một item mang veiled modifier không còn là ngõ cụt với
  [[Veiled Chaos Orb]]. Ngoại lệ đúng là cái bạn đoán được: một veiled
  modifier bạn đã khoá tại chỗ, bằng fracture hay bằng metamod, thì vẫn khoá.


  **Với mọi người đánh beast trong Menagerie:** con beast tự dựng tường chắn
  rồi bỏ chạy chính là con khiến một trận đánh beast đã bắt kéo dài lê thê.
  Giờ nó đứng lại mà đánh.
