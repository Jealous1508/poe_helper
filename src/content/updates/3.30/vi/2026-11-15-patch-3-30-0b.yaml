date: "2026-11-15"
order: 1
kind: patch
status: live
title: "3.30.0b Patch Notes (restartless)"
headline: "Patch đầu tiên: Covetous Shrine hết bị phạt, Gwennen an toàn hơn"
summary: >-
  Patch có tên đầu tiên của league. Nó được đẩy lên mà không restart server,
  nên hãy khởi động lại client game một lần để nhận phần thay đổi phía client.
  Một thay đổi balance thật sự, hai lớp bảo hiểm cho Gwennen, và một danh sách
  fix.
points:
  - kind: buff
    text: "**Covetous Shrine** không còn bắt bạn chịu 20% increased damage taken."
  - kind: fix
    text: "**Gwennen** giờ hiện dòng cảnh báo về việc lấy lại item: theo cách chúng tôi đọc, bạn không lấy lại được chúng cho tới khi một kết quả \"Take a Chance\" đã được chọn."
  - kind: fix
    text: "Gwennen không còn cho bạn \"Take a Chance\" khi bạn không đủ currency để trả."
  - kind: fix
    text: "Strongbox \"Guarded by a Rogue Exile\" trước đó không spawn ra exile. Giờ thì có."
  - kind: fix
    text: "Không link được item vào chat. Đã sửa."
  - kind: fix
    text: "Không còn target được vào các portal quay về từ boss Beyond."
  - kind: fix
    text: "Một bug với lời thoại của [[Wickerman]], và một lần dọn lại phần hình ảnh của Abyssal monster modifier."
  - kind: fix
    text: "Dòng mô tả challenge \"Foretold Foes\" giờ ghi là Unique Bosses, và boss Broken Bridge đã có tên đàng hoàng."
meaning: >-
  **Thấy Covetous Shrine thì cứ lấy.** Từ 3.30 chúng có tỉ lệ cơ bản để spawn
  trong map, và án phạt damage chính là lý do người ta đi ngang qua mà bỏ.


  Với Gwennen, hai thay đổi cùng chỉ về một hướng: ván cược ít có khả năng
  lấy mất của bạn thứ gì đó vì sơ suất. Hãy đọc dòng cảnh báo mới trước khi
  đưa ra một item bạn quý.
entries: [map-encounter-tweaks, gwennen-take-a-chance, wickerman-viscera, beyond-rework, league-versions-challenges]
official:
  - "Covetous Shrines no longer grant the player 20% increased Damage taken."
