status: live
title: "3.30.0b Hotfix 2"
headline: "Crowkeeper và Wildfire đánh nhẹ tay hơn, còn Gwennen đòi socket trống"
summary: >-
  Hotfix đầu tiên nhắm vào Fate vì chúng quá chết người, kèm một luật mới cho
  Gwennen và một nắm fix.
points:
  - kind: buff
    text: "**Crowkeeper Fate Tier 3** không còn cho con monster được buff Culling Strike."
  - kind: buff
    text: "Các vụ nổ của Crowkeeper gây ít damage hơn."
  - kind: buff
    text: "Blackfire Wall từ **Wildfire** gây ít damage hơn."
  - kind: rework
    text: "**Gwennen** chỉ nhận một item cho \"Take a Chance\" nếu socket của nó trống."
  - kind: fix
    text: "Một số boss do Fate spawn ra không rơi được [[Viscera]]. Giờ đã rơi được."
  - kind: fix
    text: "Boss Swarmforge có thể bắt đầu trận sớm và khoá người chơi ở ngoài."
  - kind: fix
    text: "Goreblossom từ cây unique wand mới Corpse Rose có thể gây damage lên người chơi đồng đội."
  - kind: fix
    text: "Các map modifier chỉ có trên map Rare không còn roll trên Blighted Map."
  - kind: fix
    text: "Một trục trặc khi đổi divination card Something Dark."
meaning: >-
  **Culling Strike trên một monster được buff là kiểu chết không gỡ lại
  được**: một cú đánh để bạn còn từ một phần mười life trở xuống là giết bạn
  luôn, bất kể leech hay regeneration nào đang chờ hồi về. Bỏ nó đi rồi,
  Crowkeeper Tier 3 lại là một trận bạn hồi máu vượt qua được.


  **Tháo gem ra trước khi đưa item cho Gwennen.** Đó là cách chúng tôi đọc
  luật mới, và đằng nào thì đó cũng là cách an toàn.
entries: [league-fates, gwennen-take-a-chance, wickerman-viscera, new-map-modifiers, new-uniques, divination-card-changes]
official:
  - "Tier 3 Crowkeeper Fate no longer grants the Empowered monster Culling Strike."
