title: "3.30.0 Hotfix 2"
headline: "Monster Abyss thôi nung chảy bạn, và aura của Einhar đánh đúng phe"
summary: >-
  Hai bug đêm mở league từng giết nhân vật dù người chơi chẳng làm gì sai, cả
  hai được sửa chỉ sau vài giờ.
points:
  - kind: fix
    text: "**Abyssal monster modifier** gây physical damage over time cao quá mức. Đã sửa."
  - kind: fix
    text: "Một modifier Bestiary ngẫu nhiên từ [[Threads]] cho Einhar một aura khiến kẻ địch đứng gần phát nổ khi chết. Nó lại gây damage lên bạn và đồng đội thay vì lên kẻ địch. Đã sửa."
  - kind: fix
    text: "Hai lỗi crash instance."
meaning: >-
  Nếu đêm đầu bạn chết trong Abyss vì damage over time trông mạnh đến vô lý,
  thì đó là do bug này chứ không phải do build của bạn. Một cái chết không rõ
  lý do khi đứng cạnh Einhar cũng vậy. Cả hai giờ đã an toàn để thử lại.
entries: [scarabs-to-threads, bestiary-yellow-beasts]
