title: "Improvements to Core Item Drops"
headline: "Những monster khó nhất sẽ thôi rơi Orb of Alchemy"
summary: >-
  GGG giải thích một lỗ hổng trong cách 3.30 phát currency và cách nó sẽ được
  sửa, rồi liệt kê thêm các drop sắp tới: hai loại [[Exalted Orb]] mới,
  Cluster Jewel nhiều hơn hẳn, thêm Simulacrum Splinter. **Chưa thứ nào trong
  số đó có trong game**, và chỉ riêng bản sửa currency là có mốc thời gian.
eta: "Bản sửa currency: \"in a patch coming very soon\". Mọi thứ khác trong bài đăng không được cho ngày nào."
points:
  - kind: info
    text: "**Lỗ hổng.** Trong 3.30, Rarity trên một monster tăng tỉ lệ để một lần rơi currency thuộc nhóm cao nhất, rồi item được chọn từ bên trong nhóm đó. Nhóm này trải từ [[Orb of Alchemy]] lên tận Hinekora's Lock và Mirror of Kalandra."
  - kind: info
    text: "Một khi monster có đủ Rarity, nó chỉ còn rơi từ nhóm cao nhất, và khoảng 33% số lần rơi đó là một [[Orb of Alchemy]], kể cả từ một con boss rất khó. Với map boss, thêm Rarity không còn cải thiện currency chút nào nữa."
  - kind: info
    text: "Theo lời GGG, Divination Card, Unique item cùng Rare và Magic item tier cao hơn hoạt động đúng ý đồ. Currency là phần không đúng."
  - kind: buff
    text: "**Cách sửa.** Qua một mức Rarity cao, thêm Rarity sẽ loại currency giá trị thấp ra khỏi nhóm cao nhất: ít [[Orb of Alchemy]] rơi hơn, nhiều currency có giá hơn như [[Divine Orb]]."
  - kind: new
    text: "Các currency mới tầm trung đến cao được thêm vào core drop pool."
  - kind: new
    text: "Foulborn Currency được thêm vào core drop pool. Để cân lại chuyện đó, nhánh Currency của Genesis Tree giờ tăng mạnh tỉ lệ sinh ra Foulborn Currency từ Wombgift. Breach vẫn là nguồn tốt nhất xét tổng thể."
sections:
  - title: "Hai loại Exalted Orb mới"
    points:
      - kind: new
        text: "**Originator's Exalted Orb** thêm một trong các map modifier mới chỉ có trên map Rare, ví dụ \"Area contains a Mirage\". Có thể dùng nó để đặt nhiều modifier loại này lên cùng một map."
      - kind: new
        text: "**Primordial Exalted Orb** biến ngẫu nhiên thành một trong mười một loại: Hunter's, Warlord's, Veiled, Crusader's, Redeemer's, Shaper's, Elder's, Tainted, Eldritch, Foulborn hoặc Originator's Exalted Orb."
  - title: "Nhiều hơn từ league content"
    points:
      - kind: buff
        text: "**Cluster Jewel** rơi thường xuyên hơn đáng kể, và tỉ lệ giờ tăng theo độ khó: map càng nhiều modifier, càng nhiều jewel."
      - kind: buff
        text: "**Simulacrum Splinter** rơi thường xuyên hơn."
      - kind: buff
        text: "**Sacred Flora**: monster nó spawn ra rơi toàn bộ loot ngay tại cây, nên bạn không còn phải đi khắp map để nhặt."
      - kind: info
        text: "Tính năng của supporter pack Archon of Corruption dự kiến sẽ được bật: đặt Corrupted Precursor Beacon trong hideout rồi gửi nó lên để xuất hiện như một Atlas Anomaly cho người chơi khác."
meaning: >-
  **Chưa live.** Nếu hôm nay map boss của bạn vẫn cứ rơi [[Orb of Alchemy]],
  thì game vẫn đang làm đúng cái mà bài đăng này mô tả là lỗ hổng.


  **Chồng Rarity quá điểm diminishing returns cho tới giờ là phí công**, ít
  nhất là với currency. Sau bản sửa, theo lý thì nó sẽ lại có lời ở tận đỉnh.
  Lời bao nhiêu thì chưa biết, cho tới khi patch ra và người ta đếm drop.


  **Nán lại chưa mua Cluster Jewel đắt tiền nếu bạn chờ được.** Một tỉ lệ rơi
  tăng "significantly" thường kéo giá xuống theo. Đó là cách thị trường hay
  vận hành chứ không phải một lời hứa; không ai biết tỉ lệ mới. Lập luận
  tương tự áp dụng cho Simulacrum Splinter.
