date: "2026-11-16"
order: 1
kind: announcement
status: announced
title: "Path of Exile: Covens of Umbra - What We're Working On"
headline: "Danh sách việc cần làm của GGG cho Threads và Shaped Regions"
summary: >-
  Sau ba ngày, GGG viết ra những gì họ định sửa ở [[Threads]] và Shaped
  Regions, hai hệ thống mà cả endgame giờ dựa lên. Đây là một danh sách ý
  định. Mỗi mục dự kiến về dưới dạng một hotfix riêng khi nó xong, và bài
  đăng không đưa ngày nào. Dòng nào đã được một bản cập nhật sau đó xử lý thì
  chính dòng đó có ghi.
eta: "Không có ngày. Mỗi mục ra thành một hotfix riêng khi nó sẵn sàng."
points:
  - kind: rework
    text: "Giảm bớt những Thread modifier và phần buff của Fate mà tự thân đã quá nguy hiểm. Bài đăng nói thay đổi cho vài trường hợp quá đà đã đang trên đường tới."
    followUp: 2026-11-16-hotfix-3-30-0b-2
  - kind: rework
    text: "Làm những giờ đầu với Threads và Shaped Regions bớt những cú vọt độ khó, để bước vào map không phải là chỗ nhân vật chết."
    followUp: 2026-11-16-hotfix-3-30-0b-3
  - kind: rework
    text: "Chỉnh lại các Thread modifier hiện có để độ khó đáng để nhận: bớt trừng phạt, thưởng khá hơn, hoặc cả hai."
    followUp: 2026-11-17-thread-difficulty-changes
  - kind: buff
    text: "Hạ mức monster toughness mà các chỉ số Thread cơ bản cộng thêm khi số Thread còn thấp."
    followUp: 2026-11-17-thread-difficulty-changes
  - kind: rework
    text: "Giới hạn số Thread bạn tiêu được ở giai đoạn đầu, và mở dần các mức cao khi nhân vật mạnh lên."
  - kind: rework
    text: "Harvest: theo dự định, mặc định Wisps sẽ thôi lan sang Unique và Rare monster. Muốn bật lại thì bạn có thể chọn qua một Atlas passive."
  - kind: fix
    text: "Một bug khiến số Thread trên map device đôi khi bị mất khi bạn đổi instance. Cách sửa triệt để đang được xem xét."
  - kind: fix
    text: "Bản đồ Delve không hiện đường đi, và kích thước icon Fate. Cả hai được ghi là \"addressed soon\"."
    followUp: 2026-11-16-hotfix-3-30-0b-3
sections:
  - title: "Bổ sung vào bài đăng vài giờ sau: phần thưởng Fate"
    points:
      - kind: new
        text: "Các kết quả thưởng kiểu \"jackpot\" mới cho Fate đang được cân nhắc. Ví dụ được đưa ra: một phần thưởng hiếm gắn một modifier liên quan tới gem lên mọi Amulet mà con monster được buff rơi ra."
      - kind: new
        text: "Gọi ba lá Fate giống nhau, với phần thưởng của lá thứ nhất và lá thứ ba được nhân ba."
        followUp: 2026-11-16-hotfix-3-30-0b-3
meaning: >-
  **Có một thứ ở đây giúp được bạn ngay hôm nay.** Trong lúc bug map device
  chưa được sửa, cách chữa cháy do chính GGG đưa ra là đặt Threads vào
  inventory của map device. Làm vậy thì số Thread không bị mất giữa các
  instance.


  Phần còn lại, hãy coi là định hướng chứ chưa phải sự thật. Định hướng thì
  dễ chịu: không mục nào trong danh sách làm Threads khó hơn, và vài dòng làm
  chúng nhẹ tay hơn ở mức thấp, đúng chỗ một nhân vật mới chạm mặt chúng. Nếu
  Threads từng có vẻ bất công ở map trắng và map vàng, thì đó là phần GGG nói
  họ đang làm trước tiên.
