number: 8
title: "Sarn lần nữa: Doedre, hai chị em và The Bath House"
town: The Sarn Encampment
levelIn: 55
levelOut: 60
skillPoints: 3
skillPointsNote: "Cộng thêm 2 respec point từ Love is Dead."
boss: "Solaris and Lunaris, together"
keyRewards:
  - "3 passive point: Love is Dead, Reflection of Terror, The Gemling Legion"
  - "Trial Merciless đầu tiên trong ba, ở The Bath House"
  - "Một chiếc nhẫn hoặc đôi găng từ Essence of the Hag, và một jewel hoặc nhẫn từ The Wings of Vastiri"
  - "Soul of Yugul, Soul of Solaris và Soul of Lunaris"
intro: >-
  Act 8 đưa bạn về Sarn và bắt bạn leo cả hai ngôi đền. Ba passive point,
  trial Merciless đầu tiên, và một con boss của act đánh bạn kiểu hai chọi
  một, càng đánh tốt thì càng rối.

nodes:
  - id: sarn-ramparts
    name: The Sarn Ramparts
    kind: zone
    tag: travel
    level: 55
    waypoint: true
    summary: >-
      Đi dọc thành lũy, rồi theo cầu thang xuống Sarn.
    tips: "Thời điểm hợp lý để trả nốt cuốn sách nào của Act 7 bạn còn quên."

  - id: sarn-encampment-8
    name: The Sarn Encampment
    kind: town
    tag: travel
    waypoint: true
    summary: >-
      Town của bạn trong act này. Tấm bia Aspirants' Plaza ở đây, nên
      Labyrinth chỉ cách một cú click. Băng qua cầu phía sau Clarissa để sang
      The Toxic Conduits.

  - id: toxic-conduits
    name: The Toxic Conduits
    kind: zone
    tag: travel
    level: 56
    summary: >-
      Ở đầu zone chọn một trong hai đường ống rồi đi qua cửa hông.
    tips: >-
      Chaos damage nặng nhất của act: lũ zombie để lại mây chaos sau lưng
      chúng. Không có chaos resistance là bạn thấm ngay. Cứ di chuyển và đừng
      đứng trong mấy đám mây đó.

  - id: doedres-cesspool
    name: Doedre's Cesspool
    kind: boss
    tag: must
    level: 56
    waypoint: true
    summary: >-
      Mấy vệt sơn đen bắn trên sàn chỉ đường cho bạn. Tìm cái Loose Grate để
      xuống The Cauldron, rồi kéo van để đánh thức Doedre the Vile.
    quest: Essence of the Hag
    reward: "Từ Hargan: một chiếc nhẫn two-stone hay unset, hoặc một đôi găng."
    tips: |
      Mấy dòng Effluent của ả chồng debuff lên bạn: đỏ làm bạn ăn thêm damage, lục cắt damage của bạn, tím làm bạn chậm. Kéo van thì đổi xem dòng nào đang chạy.

      Lời khuyên thực dụng: kệ cái trò van, chỉ cần đứng ngoài đám dịch màu và dồn damage hạ ả thật nhanh.
    newbie: >-
      Bạn sẽ gặp lại Doedre ở Act 9 cùng ba cái totem. Trận này là bản tập
      dượt cho trận đó. Zone này có một crafting recipe về elemental
      resistance.

  - id: the-quay
    name: The Quay
    kind: zone
    tag: must
    level: 57
    image: quest-ankh
    badge: "+1 passive point"
    summary: >-
      Cứ men theo nước. Một cây cầu gỗ dẫn ra hòn đảo nhỏ có Sealed Casket và
      Ankh of Eternity. Rồi theo nhánh rẽ đi xuống Resurrection Site, nói
      chuyện với Clarissa, và dọn sạch mọi thứ ở đó, kể cả Tolman.
    quest: Love is Dead
    reward: "Book of Skill từ Clarissa: +1 passive point và 2 respec point."
    tips: >-
      Cái casket thường nằm gần cửa vào zone, cạnh một cây cầu dài. Xử Tolman
      xong thì quay lại nhánh rẽ và đi lên The Grain Gate.

  - id: grain-gate
    name: The Grain Gate
    kind: zone
    tag: must
    level: 57
    waypoint: true
    image: quest-book-of-skill
    badge: "+1 passive point"
    summary: >-
      Luồn qua mấy nhà kho tới khoảng trống ở giữa, nơi đám Gemling
      Legionnaire đang đợi.
    quest: The Gemling Legion
    reward: "Book of Skill từ Maramoa: +1 passive point."
    tips: >-
      Mấy cái cửa đúng đường đều có xác lính nằm đánh dấu. Để ý icon cuốn
      sách trên minimap.

  - id: imperial-fields
    name: The Imperial Fields
    kind: zone
    tag: travel
    level: 58
    waypoint: true
    summary: >-
      Theo đường chính đi lên rồi rẽ trái tới waypoint, sau đó đi tiếp sang
      Solaris Temple.
    tips: "Effigy of Fear không bắt buộc. Bỏ qua."

  - id: solaris-temple-1
    name: The Solaris Temple Level 1
    kind: zone
    tag: travel
    level: 59
    waypoint: true
    summary: >-
      Đi lối trên để tới cầu thang xuống. Lối bên trái chỉ dẫn ra
      The Solaris Concourse, chỗ đó lát nữa bạn quay lại.

  - id: solaris-temple-2
    name: "The Solaris Temple Level 2: Dawn"
    kind: boss
    tag: must
    level: 59
    image: quest-sun-orb
    summary: >-
      Một cái portal dẫn tới Dawn, Harbinger of Solaris, con này rơi Sun Orb.
    quest: Solar Eclipse
    reward: "Sun Orb, và Soul of Solaris."
    tips: >-
      Phía sau đấu trường có một crafting recipe về trap và mine. Từ đây hãy
      trả Essence of the Hag, The Gemling Legion và Love is Dead gọn trong
      một chuyến về town.

  - id: solaris-concourse
    name: The Solaris Concourse
    kind: zone
    tag: travel
    level: 58
    waypoint: true
    summary: "Quay lại bằng waypoint Solaris Temple. Nó nối sang The Harbour Bridge."

  - id: harbour-bridge
    name: The Harbour Bridge
    kind: zone
    tag: travel
    level: 60
    summary: >-
      Zone level cao nhất và dày quái nhất của act, bạn đi qua hai lần.
      The Sky Shrine nằm ở giữa; cuối act bạn sẽ quay lại đó.
    tips: "Khác với phần lớn zone trong campaign, chỗ này đáng clear để lấy kinh nghiệm và đồ rơi."

  - id: lunaris-concourse
    name: The Lunaris Concourse
    kind: zone
    tag: travel
    level: 58
    waypoint: true
    summary: >-
      Một cái trục: một lối sang Lunaris Temple, lối kia sang The Bath House.
    tips: "Nightbringer Lucius không bắt buộc. Bỏ."

  - id: bath-house
    name: The Bath House
    kind: side
    tag: worth
    branchFrom: lunaris-concourse
    level: 57
    waypoint: true
    image: quest-labyrinth
    badge: Trial 1 trong 3 của Merciless
    summary: >-
      Trial Merciless đầu tiên, với trap lò lửa. Hector Titucius cũng chờ ở
      căn phòng chính, và lăng mộ của hắn có thưởng.
    quest: The Wings of Vastiri
    reward: "Một jewel hoặc một chiếc nhẫn từ Hargan, cộng với cái trial."
    why: >-
      Bạn cần đủ cả ba trial Merciless, nên hãy coi đây là bắt buộc dù game
      không ép.
    tips: >-
      Cái trial, công thức flask duration và lối ra sang The High Gardens đều
      nằm phía các cửa trên. Cửa dưới bên phải dẫn ngược về The Lunaris
      Concourse.

  - id: high-gardens
    name: The High Gardens
    kind: side
    tag: worth
    branchFrom: bath-house
    level: 58
    image: quest-book-of-skill
    badge: "+1 passive point"
    summary: >-
      Lùng phía bên kia zone để tìm Pools of Terror, nơi Yugul, Reflection of
      Terror đang chờ.
    quest: Reflection of Terror
    reward: "Book of Skill từ Hargan: +1 passive point, và Soul of Yugul."
    why: "Một passive point vĩnh viễn, đổi lấy một đoạn rẽ ngắn từ The Bath House."
    tips: "Lũ nhím chết là bắn gai ra tung tóe. Chạy ngang qua chúng, đừng đứng trên xác."

  - id: lunaris-temple-1
    name: The Lunaris Temple Level 1
    kind: zone
    tag: travel
    level: 59
    waypoint: true
    summary: >-
      Theo tấm thảm tới căn phòng lớn, rồi đi lên tới waypoint cạnh cầu
      thang.

  - id: lunaris-temple-2
    name: "The Lunaris Temple Level 2: Dusk"
    kind: boss
    tag: must
    level: 59
    image: quest-moon-orb
    summary: >-
      Mấy cái nền, rồi một đoạn thẳng tới Dusk, Harbinger of Lunaris, con này
      rơi Moon Orb.
    quest: Lunar Eclipse
    reward: "Moon Orb, và Soul of Lunaris."
    tips: "Phía sau đấu trường có một crafting recipe về minion."

  - id: sky-shrine
    name: "The Sky Shrine: Solaris and Lunaris"
    kind: boss
    tag: must
    level: 60
    summary: >-
      Kích hoạt Statue of the Sisters trên The Harbour Bridge bằng cả hai
      viên orb. Hai chị em đánh bạn cùng lúc.
    reward: "Mở đường sang Act 9."
    tips: |
      **Cứ mỗi lần một trong hai mất một phần ba life là ả biến thành một quả cầu không nhắm vào được**, vẫn đánh bạn trong lúc tiếp sức cho người kia. Bạn không thể dồn hạ một ả để đánh tay đôi với ả còn lại: bạn càng làm tốt, trận càng đông.

      **Solaris:** đứng sau lưng ả, chỗ an toàn nhất trận. Đòn tệ nhất của ả là một ngọn giáo năng lượng tách ra thành nhiều ngọn rộng bản. Dạng quả cầu của ả đốt cháy một phần sàn.

      **Lunaris:** ả ném vũ khí rồi xoay tròn. Đòn tệ nhất của ả là cú nhảy giáng xuống, nên hãy giữ khoảng cách. Dạng quả cầu của ả bắn projectile theo hình xoắn ốc và dán một debuff cold.
    newbie: >-
      Hãy chuẩn bị tinh thần là càng thắng thì đấu trường càng đông, chứ
      không vắng đi. Giữ một trong hai chị em ở trước mặt bạn và đừng ngừng
      bước.

sections:
  - title: Đi act này theo hướng nào
    body: >-
      Các guide xếp Act 8 theo ba kiểu hơi khác nhau. Kiểu trong bài này là
      làm The Bath House và The High Gardens từ The Lunaris Concourse, trước
      khi vào Lunaris Temple, để tiện đường gom luôn cái trial và cái passive
      point. Một lộ trình phổ biến khác để chúng lại sau khi hạ boss của act,
      lúc đó waypoint của Act 9 đã mở sẵn. Kiểu nào cũng chạy được.
  - title: Những gì nên bỏ qua
    body: >-
      The Grand Promenade chỉ là đường thay thế để tới The Bath House, mà đi
      từ The Lunaris Concourse thì bạn không cần tới nó. The Hidden Underbelly
      không có phần thưởng gì. Lingering Aberration, Effigy of Fear,
      Nightbringer Lucius và Carrion Queen đều không bắt buộc.
  - title: Chaos damage khi bạn chưa có chaos resistance
    body: >-
      The Toxic Conduits và Doedre là đợt chaos damage thật sự đầu tiên của
      campaign, mà tới lúc này thì gần như chẳng ai có chaos resistance. Bạn
      không làm gì sai cả; chỉ cần đừng đứng trong nó.

patchNotes:
  - "Cauldron của Coven xuất hiện trong các khu campaign. Hạ đám covenite, chọn một Fate, rồi invoke nó lên boss của khu để có cơ hội ra Viscera của con đó."

