intro: >-
  Campaign gồm mười act, đưa nhân vật từ level 1 lên khoảng 68. Guide này vẽ
  từng act thành một lộ trình: bạn đi qua những zone nào, nhánh phụ nào đáng
  làm, và nhánh nào bỏ được. Một lộ trình dùng chung cho mọi class.

