number: 8
title: "Sarn again: Doedre, the Twins and the Bath House"
town: The Sarn Encampment
levelIn: 55
levelOut: 60
skillPoints: 3
skillPointsNote: "Plus 2 respec points from Love is Dead."
boss: "Solaris and Lunaris, together"
keyRewards:
  - "3 passive points: Love is Dead, Reflection of Terror, The Gemling Legion"
  - "The first of the three Merciless trials, in The Bath House"
  - "A ring or gloves from Essence of the Hag, and a jewel or ring from The Wings of Vastiri"
  - "Soul of Yugul, Soul of Solaris and Soul of Lunaris"
intro: >-
  Act 8 returns to Sarn and sends you up both temples. Three passive points,
  the first Merciless trial, and an act boss that fights you two-on-one and
  gets messier the better you do.

nodes:
  - id: sarn-ramparts
    name: The Sarn Ramparts
    kind: zone
    tag: travel
    level: 55
    waypoint: true
    summary: >-
      Follow the ramparts, then the stairs down into Sarn.
    tips: "A good moment to hand in any Act 7 book you forgot."

  - id: sarn-encampment-8
    name: The Sarn Encampment
    kind: town
    tag: travel
    waypoint: true
    summary: >-
      Your town for the act. The Aspirants' Plaza plaque is here, so the
      Labyrinth is one click away. Cross the bridge past Clarissa for the
      Toxic Conduits.

  - id: toxic-conduits
    name: The Toxic Conduits
    kind: zone
    tag: travel
    level: 56
    summary: >-
      Pick either pipe at the start and take the side door.
    tips: >-
      The heaviest chaos damage in the act: the zombies leave chaos clouds
      behind them. With no chaos resistance you will feel it. Keep moving
      and do not stand in the clouds.

  - id: doedres-cesspool
    name: Doedre's Cesspool
    kind: boss
    tag: must
    level: 56
    waypoint: true
    summary: >-
      Black paint splashes on the floor point the way. Find the Loose Grate
      down into The Cauldron and pull the valve to wake Doedre the Vile.
    quest: Essence of the Hag
    reward: "From Hargan: a two-stone or unset ring, or gloves."
    tips: |
      Her Effluents stack debuffs: red makes you take more damage, green cuts your damage, purple slows you. Pulling the valve swaps which ones are active.

      The practical advice: ignore the valve puzzle, stay out of the coloured fluid and burst her down.
    newbie: >-
      You meet Doedre again in Act 9 with three totems. This is the
      teaching version of that fight. There is an elemental resistance
      crafting recipe in this zone.

  - id: the-quay
    name: The Quay
    kind: zone
    tag: must
    level: 57
    image: quest-ankh
    badge: "+1 passive point"
    summary: >-
      Follow the water. A wooden bridge leads to a small island with the
      Sealed Casket and the Ankh of Eternity. Then take the split down to
      the Resurrection Site, talk to Clarissa, and kill everything there
      including Tolman.
    quest: Love is Dead
    reward: "Book of Skill from Clarissa: +1 passive point and 2 respec points."
    tips: >-
      The casket is often near the zone entrance by a long bridge. After
      Tolman, go back to the split and up to the Grain Gate.

  - id: grain-gate
    name: The Grain Gate
    kind: zone
    tag: must
    level: 57
    waypoint: true
    image: quest-book-of-skill
    badge: "+1 passive point"
    summary: >-
      Thread the warehouses to the open area in the middle, where the
      Gemling Legionnaires are waiting.
    quest: The Gemling Legion
    reward: "Book of Skill from Maramoa: +1 passive point."
    tips: >-
      The correct doorways are marked by dead guards. Look for the book
      icon on the minimap.

  - id: imperial-fields
    name: The Imperial Fields
    kind: zone
    tag: travel
    level: 58
    waypoint: true
    summary: >-
      Follow the main road up and left to the waypoint, then on to the
      Solaris Temple.
    tips: "Effigy of Fear is optional. Skip it."

  - id: solaris-temple-1
    name: The Solaris Temple Level 1
    kind: zone
    tag: travel
    level: 59
    waypoint: true
    summary: >-
      Take the upper path to the stairs down. The left path only leads to
      the Solaris Concourse, which you come back for.

  - id: solaris-temple-2
    name: "The Solaris Temple Level 2: Dawn"
    kind: boss
    tag: must
    level: 59
    image: quest-sun-orb
    summary: >-
      A portal leads to Dawn, Harbinger of Solaris, who drops the Sun Orb.
    quest: Solar Eclipse
    reward: "The Sun Orb, and Soul of Solaris."
    tips: >-
      A traps and mines crafting recipe sits behind the arena. Hand in
      Essence of the Hag, The Gemling Legion and Love is Dead on one town
      trip from here.

  - id: solaris-concourse
    name: The Solaris Concourse
    kind: zone
    tag: travel
    level: 58
    waypoint: true
    summary: "Back via the Solaris Temple waypoint. It links to the Harbour Bridge."

  - id: harbour-bridge
    name: The Harbour Bridge
    kind: zone
    tag: travel
    level: 60
    summary: >-
      The highest-level and densest zone in the act, crossed twice. The Sky
      Shrine sits in the middle; you come back to it at the end.
    tips: "Worth clearing for the experience and the drops, unlike most campaign zones."

  - id: lunaris-concourse
    name: The Lunaris Concourse
    kind: zone
    tag: travel
    level: 58
    waypoint: true
    summary: >-
      A hub: one exit to the Lunaris Temple, the other to the Bath House.
    tips: "Nightbringer Lucius is optional. Skip."

  - id: bath-house
    name: The Bath House
    kind: side
    tag: worth
    branchFrom: lunaris-concourse
    level: 57
    waypoint: true
    image: quest-labyrinth
    badge: Trial 1 of 3 for Merciless
    summary: >-
      The first Merciless trial, with furnace traps. Hector Titucius also
      waits in the main room, and his tomb pays out.
    quest: The Wings of Vastiri
    reward: "A jewel or a ring from Hargan, plus the trial."
    why: >-
      You need all three Merciless trials, so treat this as required even
      though the game does not force it.
    tips: >-
      The trial, the flask duration recipe and the High Gardens exit are
      all through the upper exits. The lower-right exit goes back to the
      Lunaris Concourse.

  - id: high-gardens
    name: The High Gardens
    kind: side
    tag: worth
    branchFrom: bath-house
    level: 58
    image: quest-book-of-skill
    badge: "+1 passive point"
    summary: >-
      Search the far side for the Pools of Terror, where Yugul, Reflection
      of Terror waits.
    quest: Reflection of Terror
    reward: "Book of Skill from Hargan: +1 passive point, and Soul of Yugul."
    why: "A permanent passive point for a short detour off the Bath House."
    tips: "Porcupines burst spikes when they die. Run past them; do not stand on the corpse."

  - id: lunaris-temple-1
    name: The Lunaris Temple Level 1
    kind: zone
    tag: travel
    level: 59
    waypoint: true
    summary: >-
      Follow the carpet to the big room, then up to the waypoint by the
      stairs.

  - id: lunaris-temple-2
    name: "The Lunaris Temple Level 2: Dusk"
    kind: boss
    tag: must
    level: 59
    image: quest-moon-orb
    summary: >-
      Platforms, then a linear stretch to Dusk, Harbinger of Lunaris, who
      drops the Moon Orb.
    quest: Lunar Eclipse
    reward: "The Moon Orb, and Soul of Lunaris."
    tips: "A minion crafting recipe sits behind the arena."

  - id: sky-shrine
    name: "The Sky Shrine: Solaris and Lunaris"
    kind: boss
    tag: must
    level: 60
    summary: >-
      Activate the Statue of the Sisters on the Harbour Bridge with both
      orbs. The two sisters fight you together.
    reward: "Opens the way to Act 9."
    tips: |
      **Each time one sister loses a third of her life she turns into an untargetable orb** that keeps attacking while supporting the other. You cannot focus one down and get a clean one-on-one: the fight gets busier the better you are doing.

      **Solaris:** stand behind her, the safest place in the fight. Her worst move is an energy lance that splits into several wide lances. Her orb form sets part of the floor on fire.

      **Lunaris:** she throws her weapon and spins. Her worst move is a jumping slam, so keep your distance. Her orb form fires projectiles in a helix and applies a cold debuff.
    newbie: >-
      Expect the arena to get more crowded as you win, not less. Keep one
      sister in front of you and keep walking.

sections:
  - title: Which way round the act goes
    body: >-
      Guides route Act 8 three slightly different ways. The one here does
      the Bath House and High Gardens from the Lunaris Concourse, before
      the Lunaris Temple, so the trial and the passive point are collected
      on the way past. Another common route leaves them until after the act
      boss, so that the Act 9 waypoints are already open. Either works.
  - title: What to skip
    body: >-
      The Grand Promenade is only an alternative route to the Bath House,
      and coming from the Lunaris Concourse you never need it. The Hidden
      Underbelly has no reward. Lingering Aberration, Effigy of Fear,
      Nightbringer Lucius and the Carrion Queen are all optional.
  - title: Chaos damage without chaos resistance
    body: >-
      The Toxic Conduits and Doedre are the first real chaos damage in the
      campaign, and almost nobody has chaos resistance at this point. You
      are not doing anything wrong; just do not stand in it.

patchNotes:
  - "Coven cauldrons appear in campaign areas. Defeat the covenites, pick a Fate, and invoke it on the area boss for a chance at its Viscera."

