labs:
  - name: Normal
    areaLevel: 33
    trials: "6 trials: one in Act 1, two in Act 2, three in Act 3"
    when: "Act 4. Guides differ: on reaching the town, or in the middle of the act. The later slot is safer on a first character."
    ready: "About level 33–38 with 800 or more life and good life flasks. Izaro deals physical and fire damage."
  - name: Cruel
    areaLevel: 55
    trials: "3 trials: one in Act 6, two in Act 7. Needs character level 40."
    when: "Late Act 7, or on reaching the Act 8 town."
    ready: "About level 50–55 with roughly 1,800 life or more."
  - name: Merciless
    areaLevel: 68
    trials: "3 trials: Acts 8, 9 and 10. Needs character level 50."
    when: "Act 10, before the final boss, so the second resistance penalty has not hit yet."
    ready: "About level 65–70 with 2,500 life or more and 75% elemental resistances."

legend:
  - tag: must
    text: "The game does not let you continue without it."
  - tag: worth
    text: "Optional, and you should do it. The reward is permanent or strong."
  - tag: skip
    text: "Optional, and not worth the time on a first run."
  - tag: travel
    text: "Pass through. Find the exit and take the waypoint if there is one."

principles:
  - title: Speed comes first
    body: >-
      Take the [[Quicksilver Flask]] from the first side quest, pick a
      movement skill as soon as one is offered, and look for boots with
      movement speed. Faster movement helps more than any early damage
      upgrade.
  - title: Do not clear everything
    body: >-
      Kill the packs on your path and walk past the rest. Optional unique
      monsters in the campaign are not worth stopping for. If you are a
      level or two under the area level, that is fine.
  - title: Links matter, colours do not
    body: >-
      Since 3.29 any gem fits any socket. A matching colour only adds a
      small quality bonus. What you need is your main skill in three linked
      sockets, then four.
  - title: Check vendors when you level up
    body: >-
      Vendor stock changes each time you gain a level. Look for linked
      sockets, movement-speed boots and a better weapon. In 3.30 every town
      sells [[Scroll of Wisdom]] for 15 Gold.
  - title: The free trip to town
    body: >-
      "Exit to character selection" and logging back in puts you in the last
      town at no cost. Every fast route uses this in place of a
      [[Portal Scroll]] after a dead-end zone.
  - title: Take every waypoint
    body: >-
      A waypoint you skipped costs you a long walk later. The route charts
      mark each zone that has one.
  - title: Resistances can wait, mostly
    body: >-
      In Act 1 only cold resistance matters, for the final boss. Lightning
      helps in Act 2. From Act 3 aim for the 75% cap, and after Act 5 it is
      no longer optional.
  - title: Do the Trials as you pass them
    body: >-
      Six Trials of Ascendancy in Acts 1–3 unlock the Labyrinth, where you
      choose your ascendancy class. They are done once per league for your
      whole account.
  - title: Covens in the campaign
    body: >-
      This league's cauldrons also appear during the campaign. Click one,
      defeat the covenites and pick a Fate. At the area boss you invoke up to
      three, and each one raises the chance of a Viscera for your Wickerman.
      Invoke one at a time on a new character. GGG also said every campaign
      area now ends in a boss, with over two dozen bosses added. Zone
      layouts in this guide come from sources written before 3.30 and have
      not been re-checked in game.
