category: cluster-jewels
title: "Three notables on a Large cluster jewel"
level: 4
summary: "Two notables on the Magic jewel, an Imprint, and a Regal Orb for the third, with the arithmetic that tells you whether to insist on an exact notable or accept a good one."
goal: >-
  A Large Minion Damage cluster jewel with two prefix notables and one
  suffix notable, all on eight passives. Every tool in it has appeared
  before. What makes it the hardest cluster craft is that **the third
  notable is where the price is decided**, by a choice you make before you
  start: an exact notable, or any of a few.
base: "Large Cluster Jewel"
itemLevel: 60
baseWhy: >-
  **Enchantment:** "Added Small Passive Skills grant: Minions deal 10%
  increased Damage". **Passives:** "Adds 8 Passive Skills". **Item level:**
  50 to 67, because the three notables in the plan (Renewal and Rotten
  Claws at 50, Call to the Slaughter at 1) all fit under it. In this bracket
  the jewel can roll three prefix notables and one suffix notable in all.
  At 84 it can roll five and three, with three tiers of every small-passive
  bonus on top.
methods: [currency, beast, finishing]
result:
  implicits:
    - "Adds 8 Passive Skills"
    - "2 Added Passive Skills are Jewel Sockets"
    - "Added Small Passive Skills grant: Minions deal 10% increased Damage"
  prefixes:
    - { text: "1 Added Passive Skill is Renewal" }
    - { text: "1 Added Passive Skill is Rotten Claws" }
  suffixes:
    - { text: "1 Added Passive Skill is Call to the Slaughter" }
    - { text: "Added Small Passive Skills also grant: +2% to all Elemental Resistances" }
needs:
  - { item: "A Large Cluster Jewel with the Minion Damage enchantment", amount: "1", note: "8 passives, item level 50–67" }
  - { item: "[[Orb of Alteration]]", amount: "50–100" }
  - { item: "[[Orb of Augmentation]]", amount: "10–20" }
  - { item: "[[Craicic Croaker]]", amount: "7 to 22", note: "plus three Rare beasts each; see step 4" }
  - { item: "[[Regal Orb]]", amount: "one per Croaker" }
  - { item: "[[Exalted Orb]]", amount: "1", note: "for the fourth slot" }
cost: >-
  The Magic jewel is cheap in this bracket. The third notable is not:
  about seven Imprints if you will accept either of two notables there, and
  about twenty-two if only one will do. Each is a [[Craicic Croaker]], three
  more Rare beasts and a [[Regal Orb]].


  We give no total. If the count of Croakers looks unaffordable, that is
  the true answer for you, and a jewel with two of the three is what the
  craft should stop at.
odds: >-
  **The Magic pair.** At item level 50 to 67, Renewal and Rotten Claws are
  9.1% of prefix rolls each, and Call to the Slaughter is 14.6% of suffix
  rolls, by our arithmetic. Either prefix notable with that suffix notable:
  about 2.7%, 1 two-modifier jewel in 38. At item level 84 the same pair is
  about 1 in 160.


  **The Regal Orb.** It adds a prefix about 46% of the time, taking the two
  sides by their remaining weights. The one missing notable is 10% of the
  remaining prefix weight; with Feasting Fiends also accepted, 30%. So one
  Regal Orb in 22 gives the exact third notable, and one in 7 gives an
  accepted one.


  **The fourth slot** cannot be a notable. Nothing to compute.
steps:
  - title: "Fit the plan to the shape, and to the bracket"
    do: >-
      Confirm in the modifier list that your notables are, at most, two
      prefixes and one suffix of the same enchantment, and take the highest
      item level among them. Here: Renewal and Rotten Claws (prefixes,
      level 50) and Call to the Slaughter (suffix, level 1).
    why: >-
      The bracket is worth more than any orb in this craft. Under item
      level 68 this jewel's suffix pool contains exactly one notable, and
      it is the one in the plan. Buy a jewel at 84 and the same notable is
      6.5% of suffix rolls in place of 14.6%, with two other suffix
      notables competing for the single slot their group allows.
    state:
      rarity: normal
      implicits:
        - "Adds 8 Passive Skills"
        - "2 Added Passive Skills are Jewel Sockets"
        - "Added Small Passive Skills grant: Minions deal 10% increased Damage"
  - title: "Two notables on the Magic jewel"
    do: >-
      Use [[Orb of Alteration]]s and [[Orb of Augmentation]]s until the
      prefix is Renewal or Rotten Claws **and** the suffix is Call to the
      Slaughter.
    why: >-
      This is the cheap stage, so it should carry as much of the plan as it
      can: one prefix notable and the suffix notable. Either prefix notable
      will do, because the other one is what the next stage is for.
    check: >-
      Feasting Fiends, the common prefix notable of this enchantment (18%
      of prefix rolls), will show up often. Decide now whether you would
      accept it as the third notable. Do not accept it here in place of
      Renewal or Rotten Claws unless you are lowering the whole plan.
    state:
      rarity: magic
      implicits:
        - "Adds 8 Passive Skills"
        - "2 Added Passive Skills are Jewel Sockets"
        - "Added Small Passive Skills grant: Minions deal 10% increased Damage"
      prefixes:
        - { text: "1 Added Passive Skill is Renewal" }
      suffixes:
        - { text: "1 Added Passive Skill is Call to the Slaughter" }
  - title: "Imprint"
    do: >-
      Make an Imprint of the Magic jewel: [[Craicic Croaker]] and three
      other Rare beasts.
    why: >-
      Everything from here adds to the jewel and nothing can remove the two
      notables you have. The risk is different: a wrong modifier in the
      second prefix slot ends the craft, because no jewel can be given a
      free prefix slot again. The Imprint turns that dead end into a retry.
    state:
      rarity: magic
      implicits:
        - "Adds 8 Passive Skills"
        - "2 Added Passive Skills are Jewel Sockets"
        - "Added Small Passive Skills grant: Minions deal 10% increased Damage"
      prefixes:
        - { text: "1 Added Passive Skill is Renewal" }
      suffixes:
        - { text: "1 Added Passive Skill is Call to the Slaughter" }
  - title: "Regal Orb: choose your bar, then hold to it"
    do: >-
      Use a [[Regal Orb]]. **Strict bar:** keep only if it added the missing
      notable, here Rotten Claws. **Loose bar:** keep Feasting Fiends as
      well. If the orb added a **suffix**, or any other prefix, use the
      Imprint, make a new one and try again.
    why: >-
      The strict bar passes about 1 time in 22 and the loose bar 1 time in
      7. That factor of three is the entire difference in cost between the
      jewel a build guide names and one that does nearly the same job. Make
      the choice with your [[Menagerie]] open in front of you.
    check: >-
      A suffix from the Regal Orb is not a disaster: both notables are
      intact and the second prefix slot is still open. If you are out of
      Croakers, stop restoring and use an [[Exalted Orb]] instead. When
      both suffix slots are full it can only add a prefix: the missing
      notable 1 time in 10, an accepted one 3 times in 10.
    fail: >-
      Do not reach for the beast that adds a prefix and removes a random
      suffix. On a Large jewel one of the suffixes it can remove is your
      suffix notable.
    state:
      implicits:
        - "Adds 8 Passive Skills"
        - "2 Added Passive Skills are Jewel Sockets"
        - "Added Small Passive Skills grant: Minions deal 10% increased Damage"
      prefixes:
        - { text: "1 Added Passive Skill is Renewal" }
        - { text: "1 Added Passive Skill is Rotten Claws" }
      suffixes:
        - { text: "1 Added Passive Skill is Call to the Slaughter" }
  - title: "The fourth slot: an orb with no bad outcome"
    do: >-
      Use one [[Exalted Orb]].
    why: >-
      Both prefixes are filled, so it adds a suffix. Every Large suffix
      notable is in the group your suffix notable already occupies, so it
      cannot add a fourth notable. What is left is a small-passive bonus:
      a resistance, an attribute, regeneration, or minion attack and cast
      speed. On a three-notable jewel you allocate few small passives, so
      the bonus is small, but it is free.
    state:
      implicits:
        - "Adds 8 Passive Skills"
        - "2 Added Passive Skills are Jewel Sockets"
        - "Added Small Passive Skills grant: Minions deal 10% increased Damage"
      prefixes:
        - { text: "1 Added Passive Skill is Renewal" }
        - { text: "1 Added Passive Skill is Rotten Claws" }
      suffixes:
        - { text: "1 Added Passive Skill is Call to the Slaughter" }
        - { text: "Added Small Passive Skills also grant: +2% to all Elemental Resistances" }
  - title: "Socket it and count the points"
    do: >-
      Put the jewel into a Large cluster socket. Find the three notables
      and the two jewel sockets, and count the points needed to take the
      ones you want.
    why: >-
      Reference pages describe each notable as placed in a fixed position
      by its order in the modifier list, and players use that to judge
      three-notable jewels. We have not verified the rules. The tree shows
      the result directly, which is all you need before deciding whether
      this jewel or a different pair of notables suits your points.
variations: >-
  **A level-75 suffix notable.** Vicious Bite needs item level 75 and weighs
  63. In the 75 to 83 bracket it is about 1 suffix roll in 190, and the
  Magic pair with it about 1 in 1,600. That single change of plan multiplies
  the first stage by forty, which is why jewels with the scarce notables
  are bought far more often than made.


  **Two prefixes first?** It cannot be done on a Magic jewel, which has one
  prefix. The order in this example, one prefix and the suffix first, is
  the only one that settles two notables before the jewel is Rare.


  **Stopping at two.** The Magic pair with one Regal Orb and no Imprint is
  a two-notable jewel with whatever the orb added. For many builds that is
  the right place to stop.
mistakes:
  - "Buying an item level 84 jewel for notables that need 50. The Magic pair goes from 1 in 38 to about 1 in 160."
  - "Using the Regal Orb before the Imprint."
  - "Using the add-a-prefix beast on a Large jewel that has its suffix notable."
  - "Changing the bar halfway. A loose bar after fifteen strict failures means the first fifteen Croakers bought nothing."
  - "Skipping the look at the tree before paying for the third notable."
verified: "2026-11-19"
