category: abyss-jewels
title: "Four lines, then a fifth: finishing with Merrick's Ducat"
level: 4
summary: "A planned caster jewel from Magic pair to Exalted Orb, finished with a Divine Orb and the one currency that adds a modifier to a full Abyss jewel."
goal: >-
  A Hypnotic Eye with Life and flat fire damage at high tiers, a third line
  the build uses, and every remaining gamble taken in the right order. No
  step is new. The difficulty is in **sequence and price**: which stage
  should carry the hard roll, what must be done before the jewel is
  corrupted, and what [[Merrick's Ducat]] does and does not put at risk.
base: "Hypnotic Eye Jewel"
itemLevel: 84
baseWhy: >-
  The caster's eye, for a fire spell cast with a shield. Item level 84 opens
  Tier 1 Life (82) and Tier 1 of every flat spell damage prefix and suffix
  (77 to 84). Nothing this build wants needs more: 86 only adds the top tier
  of three scarce prefixes.
methods: [currency, beast, finishing, corruption]
result:
  note: "Corrupted, with a fifth modifier from Merrick's Ducat"
  prefixes:
    - { text: "+33 to maximum Life" }
    - { text: "+27 to maximum Mana" }
  suffixes:
    - { text: "Adds 21 to 28 Fire Damage to Spells" }
    - { text: "+11% to Global Critical Strike Multiplier" }
needs:
  - { item: "A Hypnotic Eye Jewel", amount: "1", note: "item level 82 or higher" }
  - { item: "[[Orb of Alteration]]", amount: "800–1,500" }
  - { item: "[[Orb of Augmentation]]", amount: "50–100" }
  - { item: "[[Craicic Croaker]]", amount: "about 15", note: "plus three Rare beasts each; see step 2 for the cheaper split" }
  - { item: "[[Regal Orb]]", amount: "about 15" }
  - { item: "[[Exalted Orb]]", amount: "1" }
  - { item: "[[Divine Orb]]", amount: "1–3" }
  - { item: "[[Merrick's Ducat]]", amount: "1" }
cost: >-
  Alterations in the high hundreds, a dozen or more Imprints, one
  [[Exalted Orb]], a few [[Divine Orb]]s and one Ducat. The beasts and the
  Ducat are what you may not have: only red beasts are captured in 3.30, and
  the patch notes say the Ducat has a new source without naming it.


  We give no total. The stage that dominates depends on which of
  Alterations and Croakers is cheaper for you, and step 2 is about exactly
  that choice.
odds: >-
  **The Magic pair.** At item level 84, Life at +31 or more is 3.6% of
  prefix rolls and Fire Damage to Spells at Tier 3 or better 3.7% of suffix
  rolls. Both: about 0.13%, 1 two-modifier jewel in 750, by our arithmetic.


  **The Regal Orb.** Five listed suffixes are 11.7% of the remaining suffix
  weight; the one listed prefix is 2.0% of the remaining prefix weight.
  With the two sides equally likely, which is our assumption, about 1
  attempt in 15 passes.


  **The Exalted Orb** into the last slot, a prefix: the fire prefix for a
  shield at any tier is 3.5% of what it can add.


  **The Ducat:** see the last step. Its odds cannot be computed from its
  text.
steps:
  - title: "Write the plan backwards"
    do: >-
      Finished jewel: **prefixes** Life at +31 or more, and if luck allows
      "Added Spell Fire Damage while holding a Shield"; **suffixes** "Adds
      Fire Damage to Spells" at Tier 3 or better, and one of Cast Speed,
      Global Critical Strike Multiplier, Global Critical Strike Chance, or
      the two "Recently" critical strike suffixes.
    why: >-
      The fire prefix is the scarce line: fifteen spell prefixes share the
      pool and only one of them matches fire and a shield, 2.9% of prefix
      rolls at any tier and 1% at Tier 3 or better. Life is six times as
      common. So Life goes on the Magic jewel and the fire prefix is left
      as a bonus.
  - title: "Choose which stage carries the hard roll"
    do: >-
      Decide between two versions of the same plan. **As written:** Life
      and the fire suffix on the Magic jewel (1 in 750), then a Regal Orb
      that passes 1 time in 15. **The other way round:** the fire prefix at
      Tier 3 or better and the fire suffix on the Magic jewel (about 1 in
      2,600), then a Regal Orb that passes about 1 time in 8, because Life
      at +26 or more is now on its list.
    why: >-
      The two plans make the same jewel from different currency. The first
      spends fewer Alterations and more Croakers; the second the reverse,
      and ends with the scarce prefix guaranteed. Count what you own before
      choosing. Planning a jewel is mostly this: moving the difficulty to
      the stage you can best afford to repeat.
  - title: "Magic pair, Imprint, Regal Orb"
    do: >-
      Roll the Magic jewel with [[Orb of Alteration]]s and
      [[Orb of Augmentation]]s. Make an Imprint with a
      [[Craicic Croaker]]. Use a [[Regal Orb]]; if the third line is not on
      the list, restore the Imprint, make a new one, and repeat.
    why: >-
      This is the Imprint routine from the Ghastly Eye example, with a
      stricter bar. The stricter the bar, the more the Imprint is worth,
      because each failure would otherwise cost the whole Magic pair.
    check: >-
      Read tiers at every stage. A fire suffix below Tier 3 on the Magic
      jewel is not the jewel you set out to save.
    state:
      prefixes:
        - { text: "+33 to maximum Life" }
      suffixes:
        - { text: "Adds 21 to 28 Fire Damage to Spells" }
        - { text: "+11% to Global Critical Strike Multiplier" }
  - title: "One Exalted Orb"
    do: >-
      Use one [[Exalted Orb]]. With both suffixes filled it can only add a
      prefix.
    why: >-
      A free roll, as on every jewel: no line here is harmful. It will
      usually be idle, as the Mana it added in this example is. Do not try
      to remove it. An [[Orb of Annulment]] takes one of four at random,
      and three of the four are the jewel.
    state:
      prefixes:
        - { text: "+33 to maximum Life" }
        - { text: "+27 to maximum Mana" }
      suffixes:
        - { text: "Adds 21 to 28 Fire Damage to Spells" }
        - { text: "+11% to Global Critical Strike Multiplier" }
  - title: "Divine Orb, while you still can"
    do: >-
      Look at the three lines that matter: Life (31–35), the fire suffix
      (20–22 to 26–30) and the multiplier (9–12%). Use [[Divine Orb]]s
      until none of them is at the bottom of its range, and stop there.
    why: >-
      The next step corrupts the jewel, and a corrupted item cannot be
      changed again. Every improvement that needs ordinary currency has to
      come before it. This is the single ordering rule of the craft that
      cannot be repaired afterwards.
  - title: "Merrick's Ducat"
    do: >-
      Use one [[Merrick's Ducat]] on the finished jewel.
    why: >-
      Its text: "Augment a Rare Abyssal Jewel with a random additional
      Modifier and corrupt it, even if it is already at maximum Modifier
      count." It adds a fifth line to a full jewel, which nothing else in
      the game does, and going by that wording it removes and rerolls
      nothing. What you give up is the freedom to change the jewel later.
    check: >-
      What the text does not say: which side the fifth modifier is on,
      whether it avoids groups already on the jewel, or which pool it draws
      from. If it draws from the eye's ordinary pool, about one result in
      sixteen would be a line from this build's list, by the same
      arithmetic as above. We have not been able to test it; treat the
      fifth line as a bonus, not as part of the plan.
    fail: >-
      An idle fifth line costs nothing. The only real failure here is
      having used the Ducat before the Divine Orb.
    state:
      note: "Corrupted, with a fifth modifier from Merrick's Ducat"
      prefixes:
        - { text: "+33 to maximum Life" }
        - { text: "+27 to maximum Mana" }
      suffixes:
        - { text: "Adds 21 to 28 Fire Damage to Spells" }
        - { text: "+11% to Global Critical Strike Multiplier" }
variations: >-
  **A Vaal Orb instead.** A [[Vaal Orb]] can add a corruption implicit, one
  of 21 at equal weight, but by an older reference page it can also do
  nothing or reroll the whole jewel into a random Rare. On a jewel that took
  this much work the Ducat is the safer of the two ways to corrupt it,
  because its text promises an addition and nothing else. You cannot use
  both: either one closes the jewel.


  **Stopping before the Ducat.** A jewel you might still improve, for
  example one waiting for a better third line, should not be corrupted at
  all. The Ducat is for a jewel you have finished with.


  **Other eyes.** The same sequence works on any Abyss jewel. On a Ghastly
  Eye the Regal Orb passes far more often; on a Murderous Eye the Magic
  pair is the expensive stage.
mistakes:
  - "Using the Ducat or a Vaal Orb before the Divine Orb. The numbers are then fixed."
  - "Putting the scarce prefix on the wish list for the Magic jewel without doing the arithmetic. One in 2,600 is a different craft from one in 750."
  - "Annulling the idle fourth line. Three of the four modifiers it can remove are the ones you paid for."
  - "Counting on the fifth modifier. It is random."
verified: "2026-11-19"
