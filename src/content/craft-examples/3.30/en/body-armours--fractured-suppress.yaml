category: body-armours
title: "A fractured Suppression chest, and what each kind of protection covers"
level: 4
summary: "Top-tier Suppression fractured on an evasion chest, life and Evasion from Deafening Essences, the other suffixes from Eldritch Chaos Orbs. Three stages, three different protections."
goal: >-
  An evasion chest with 20% or more Spell Suppression that can never be
  lost, 160 or more life, a high Evasion prefix and filled resistances. Every
  tool in it has appeared in an easier example. What is new is the question
  you ask before each step: **what is protecting my finished work from this
  orb?** There are three answers on a body armour, they cover different
  things, and using the wrong one for a step loses the item.
base: "Syndicate's Garb"
itemLevel: 86
baseWhy: >-
  Suppression only exists on bases that ask for Dexterity, and the
  Syndicate's Garb has the most Evasion of them: 1,205–1,386. It needs level
  84 and 293 Dexterity. Item level 86 is the lowest at which the top tier of
  Suppression, 20–22%, can exist. The base must have **no influence**: a
  [[Fracturing Orb]] refuses influenced items, and the last stage needs
  Eldritch implicits.
methods: [fracture, essence, eldritch, bench, finishing]
result:
  note: "Fractured. Searing Exarch and Eater of Worlds"
  implicits:
    - "8% of Damage taken Recouped as Life"
    - "19% increased Evasion Rating"
  prefixes:
    - { text: "+168 to maximum Life", how: essence }
    - { text: "+437 to Evasion Rating" }
    - { text: "24% increased Evasion Rating / 11% increased Stun and Block Recovery" }
  suffixes:
    - { text: "+21% chance to Suppress Spell Damage", how: fractured }
    - { text: "+44% to Cold Resistance", how: eldritch }
    - { text: "+19% to Fire and Lightning Resistances", how: crafted }
needs:
  - { item: "A Syndicate's Garb with top-tier Suppression fractured, item level 86", amount: "1", note: "bought, found, or made in stage 1" }
  - { item: "[[Deafening Essence of Greed]]", amount: "10–30" }
  - { item: "[[Lesser Eldritch Ember]]", amount: "1" }
  - { item: "[[Greater Eldritch Ichor]]", amount: "a few" }
  - { item: "[[Eldritch Chaos Orb]]", amount: "10–30" }
  - { item: "[[Chaos Orb]]", amount: "3", note: "for the bench" }
cost: >-
  The fractured base is the largest single cost, whether you buy it or risk
  a [[Fracturing Orb]] yourself, and fractured items are rarer in 3.30 than
  they were. After that the craft is counted in Deafening Essences and
  Eldritch Chaos Orbs. Nothing in it costs a Divine Orb, and that is the
  point of the route: the fracture and the Eldritch orbs do what protection
  modifiers would otherwise be paid to do.
odds: >-
  **Stage 1, if you make the base.** At item level 86 one suffix roll is
  Suppression of 17% or more about 1 time in 29, and the top tier 1 in 58,
  by our arithmetic. The Fracturing Orb then picks one modifier at random:
  1 in 4 on an item with exactly four.


  **Stage 2.** The life is certain. Each further prefix an Essence rolls is
  flat or percentage Evasion at its third tier or better about 18% of the
  time. When a result has two further prefixes, at least one is flat or
  percentage Evasion of some tier 87% of the time, so the wait is for the
  tier.


  **Stage 3.** With Suppression fractured, each other suffix roll is an
  elemental resistance 45% of the time and one of 36% or more 17% of the
  time.
steps:
  - title: "Stage 1: the fractured suffix"
    do: >-
      Buy or find an item level 86 Syndicate's Garb with **20–22%
      Suppression fractured** ("of Nullification"). To make one: roll that
      suffix on a Magic garb with [[Orb of Alteration]]s, bring the item to
      a Rare with **exactly four** modifiers, and use a [[Fracturing Orb]].
    why: >-
      Nothing on a body armour is rare by weight, so fracture the modifier
      that costs the most to roll again. Top-tier Suppression is 1 suffix
      roll in 58, the bench only sells 8–10%, and no Essence gives it. Life,
      by contrast, comes back with every Essence of Greed.
    check: >-
      The Fracturing Orb needs at least four modifiers and chooses at
      random. Four modifiers is a 1-in-4 chance; five is 1 in 5. Do not add
      modifiers "to improve the item" first.
    fail: >-
      It fractured something else. The item now carries the wrong modifier
      for ever and cannot be fractured again. This is why most players buy
      the base.
    state:
      note: "Fractured"
      prefixes:
        - { text: "Reflects 44 Physical Damage to Melee Attackers" }
        - { text: "+118 to maximum Life" }
      suffixes:
        - { text: "+21% chance to Suppress Spell Damage", how: fractured }
        - { text: "+19 to Dexterity" }
  - title: "Know the three protections before stage 2"
    do: >-
      Read this list once, and come back to it before every orb in the rest
      of the craft.


      **A fractured modifier** survives everything: Essences, Fossils, Chaos
      Orbs, Annulments.


      **Eldritch dominance** means the three Eldritch orbs touch one side
      only. It protects nothing from any other currency.


      **A bench lock** ("Prefix Modifiers cannot be changed") is reported to
      hold against Harvest reforges, Veiled orbs and an Orb of Scouring, and
      reported **not** to hold against Essences. It costs 4 Divine Orbs and
      4 Blessed Orbs each time.
    why: >-
      The order of the stages follows from that list. Essences reroll both
      sides and ignore locks, so they must come while the fracture is the
      only thing worth keeping. Once the prefixes are right, only tools that
      leave the prefix side alone are allowed.
  - title: "Stage 2: life and Evasion from Essences"
    do: >-
      Use [[Deafening Essence of Greed]] on the garb, one after another.
      After each, read the prefixes only. Stop when the item has the life
      and **flat Evasion of 201 or more, or increased Evasion of 80% or
      more**, beside it.
    why: >-
      Each Essence fixes +160–174 life and rerolls everything else that is
      not fractured. The Suppression is untouched every time. The suffixes
      beside it are irrelevant at this stage: stage 3 replaces them.
    check: >-
      Hold Alt and read tiers. Flat Evasion: "Adroit" is 201–300, "Lissome"
      301–400, "Fugitive" 401–500. Increased Evasion: "Nightmare's" is
      80–91%, "Mirage's" 92–100%, "Illusion's" 101–110%.
    fail: >-
      No Evasion prefix, or only a low one: use the next Essence. A good
      second prefix with a poor third, as here, is a result to keep.
      The third can be improved later, with the Searing Exarch dominant, or
      left alone.
    state:
      note: "Fractured"
      prefixes:
        - { text: "+168 to maximum Life", how: essence }
        - { text: "+437 to Evasion Rating" }
        - { text: "24% increased Evasion Rating / 11% increased Stun and Block Recovery" }
      suffixes:
        - { text: "+21% chance to Suppress Spell Damage", how: fractured }
        - { text: "+31 to Dexterity" }
        - { text: "Regenerate 55 Life per second" }
  - title: "Put the Essences away, and add the implicits"
    do: >-
      Use one [[Lesser Eldritch Ember]], then [[Greater Eldritch Ichor]]s
      until the Eater of Worlds implicit is one you can use. The Ichor must
      be the higher strength, so that the Eater is dominant.
    why: >-
      From here the prefixes are finished work, and the only protection they
      will have is that Eldritch orbs do not touch their side.
    check: >-
      That a fractured item accepts Eldritch implicits is long-standing
      practice; the Ember's text only refuses influenced items. We could not
      re-confirm it for 3.30, so let the single Lesser Ember be the test
      before you buy the rest.
    state:
      note: "Fractured. Searing Exarch and Eater of Worlds"
      implicits:
        - "8% of Damage taken Recouped as Life"
        - "19% increased Evasion Rating"
      prefixes:
        - { text: "+168 to maximum Life", how: essence }
        - { text: "+437 to Evasion Rating" }
        - { text: "24% increased Evasion Rating / 11% increased Stun and Block Recovery" }
      suffixes:
        - { text: "+21% chance to Suppress Spell Damage", how: fractured }
        - { text: "+31 to Dexterity" }
        - { text: "Regenerate 55 Life per second" }
  - title: "Stage 3: the other two suffixes"
    do: >-
      Use [[Eldritch Chaos Orb]]s until the suffix side holds the
      Suppression, **one resistance of 36% or more, and an open slot**, or
      two resistances you would keep.
    why: >-
      With the Eater dominant the orb rerolls suffixes only, and the
      fractured one is exempt even from that. Two protections are working at
      once: dominance keeps the orb off the prefixes, the fracture keeps it
      off the Suppression.
    check: >-
      After the first orb, confirm all three prefixes and the Suppression
      are unchanged. Then judge only the two suffixes that moved.
    fail: >-
      If you ever reach for an ordinary Chaos Orb or an Essence here, stop.
      Either one rerolls the prefixes.
    state:
      note: "Fractured. Searing Exarch and Eater of Worlds"
      implicits:
        - "8% of Damage taken Recouped as Life"
        - "19% increased Evasion Rating"
      prefixes:
        - { text: "+168 to maximum Life", how: essence }
        - { text: "+437 to Evasion Rating" }
        - { text: "24% increased Evasion Rating / 11% increased Stun and Block Recovery" }
      suffixes:
        - { text: "+21% chance to Suppress Spell Damage", how: fractured }
        - { text: "+44% to Cold Resistance", how: eldritch }
  - title: "Bench the last suffix"
    do: >-
      At the [[Crafting Bench]], craft the two resistances the chest lacks
      as one modifier: 17–20% to Fire and Lightning Resistances for 3
      [[Chaos Orb]]s.
    why: >-
      A paired resistance is a different group from either single one, and
      it covers two gaps with the one bench modifier an item is allowed.
    state:
      note: "Fractured. Searing Exarch and Eater of Worlds"
      implicits:
        - "8% of Damage taken Recouped as Life"
        - "19% increased Evasion Rating"
      prefixes:
        - { text: "+168 to maximum Life", how: essence }
        - { text: "+437 to Evasion Rating" }
        - { text: "24% increased Evasion Rating / 11% increased Stun and Block Recovery" }
      suffixes:
        - { text: "+21% chance to Suppress Spell Damage", how: fractured }
        - { text: "+44% to Cold Resistance", how: eldritch }
        - { text: "+19% to Fire and Lightning Resistances", how: crafted }
  - title: "Finish: quality, links, values"
    do: >-
      20% quality and the sockets and links if not done. A [[Sacred Orb]] if
      the base Evasion sits low in 1,205–1,386. A [[Divine Orb]] only if the
      numbers that matter are low in their tiers.
    why: >-
      A Divine Orb rerolls every value at once, the fractured Suppression
      included, inside its tier. It can lower as well as raise.
variations: >-
  **Without implicits: the lock.** If the chest cannot or should not take
  Eldritch implicits, stage 3 becomes: craft "Prefix Modifiers cannot be
  changed" (4 Divine Orbs and 4 Blessed Orbs), then a Harvest reforge for
  Fire, Cold or Lightning (50 Lifeforce), which on this item can only land
  on that resistance. Every attempt pays for the lock again. Put the two
  routes side by side and the reason to prefer Eldritch orbs on a chest is
  plain.


  **Improving the third prefix.** Swap dominance by using an Ember of a
  higher strength than the Ichor, and an [[Eldritch Orb of Annulment]]
  removes one prefix at random: a 1-in-3 chance that it is the weak one, and
  2 in 3 that it is the life or the Evasion. An [[Eldritch Exalted Orb]]
  then adds one. Most chests are better left as they are.


  **Fracturing the life instead.** For a build that does not need
  Suppression, "Prime" life (175–189) is the modifier to fracture, and
  Essences of Doubt then supply the Evasion.
mistakes:
  - "Using a Fracturing Orb on an item with five or six modifiers. One in four becomes one in five or six."
  - "Crafting a prefix lock before using Essences. Essences are reported to ignore it; the Divine Orbs are wasted and the prefixes reroll anyway."
  - "Doing the suffixes first. Every Essence in stage 2 would reroll them."
  - "Giving the base influence. It can then be neither fractured nor given Eldritch implicits."
  - "Chasing a perfect third prefix on a chest whose other five modifiers are finished."
verified: "2026-11-19"
