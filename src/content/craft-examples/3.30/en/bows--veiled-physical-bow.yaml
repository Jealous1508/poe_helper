  - { title: "Path of Exile game data export (RePoE)", url: "https://repoe-fork.github.io/", kind: data, note: "The unveiled and bench modifiers on bows and their groups, the Essence of Zeal tiers, weights, bench costs and the in-game text of the Veiled Chaos Orb. The odds are our arithmetic." }
