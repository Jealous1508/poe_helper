category: sceptres
title: "Một gem level, một khóa 1 Divine và một Imprint"
level: 4
summary: "Khóa một prefix mới chỉ chắc chắn trên item có đúng một prefix. Một Imprint của cây sceptre Magic là thứ đưa bạn về trạng thái đó sau mỗi lần reforge hỏng."
goal: >-
  Một cây sceptre caster dựng quanh một prefix gem level đã tốn hàng trăm
  Alteration, phần còn lại được roll lại bao nhiêu lần tùy ý mà gem level
  không bao giờ bị đem ra đánh cược. Nó dùng một thứ mới của 3.30, **"1
  Prefix Modifier cannot be changed"** giá 1 Divine Orb, trong tình huống duy
  nhất mà nó an toàn, và chỉ cách quay lại tình huống đó hết lần này tới lần
  khác.
base: "Void Sceptre"
itemLevel: 84
baseWhy: >-
  40% increased Elemental Damage, và item level 84 để các lần reforge với tới
  được mọi tier của Spell Damage và cast speed. Bản thân prefix gem level chỉ
  cần item level 2; nếu tất cả những gì bạn muốn là gem level thì một base
  thấp sẽ roll ra nó dễ hơn nhiều. Cây sceptre này nhắm làm weapon endgame,
  nên chuỗi roll Alteration dài là cái giá phải trả.
methods: [currency, beast, meta, harvest, bench]
result:
  implicits: ["40% increased Elemental Damage"]
  prefixes:
    - { text: "+1 to Level of all Fire Spell Skill Gems" }
    - { text: "76% increased Spell Damage", how: harvest }
    - { text: "Adds 38 to 71 Fire Damage to Spells", how: crafted }
  suffixes:
    - { text: "26% increased Cast Speed", how: harvest }
    - { text: "+31% to Global Critical Strike Multiplier", how: harvest }
needs:
  - { item: "[[Orb of Alteration]]", amount: "vài trăm" }
  - { item: "[[Craicic Croaker]]", amount: "1 mỗi lần thử", note: "cộng ba beast Rare mỗi lần" }
  - { item: "[[Regal Orb]]", amount: "1 mỗi lần thử" }
  - { item: "[[Divine Orb]]", amount: "1 mỗi lần thử" }
  - { item: "[[Primal Crystallised Lifeforce]]", amount: "75 mỗi lần thử" }
  - { item: "[[Chaos Orb]]", amount: "4", note: "craft bench cuối cùng" }
cost: >-
  Mỗi lần thử: một bộ beast cho [[Imprint]], một [[Regal Orb]], một
  [[Divine Orb]] và 75 Lifeforce. Cũng lần thử đó với khóa đầy đủ sẽ là 4
  Divine Orb và một [[Sacred Orb]], không cần beast. Trong 3.30 chỉ beast đỏ
  mới bắt được, nên cái nào rẻ hơn tùy vào Menagerie của bạn.
odds: >-
  **Gem level.** Ở item level 84, gem level của một element đã chọn là 1 trên
  350 lần roll prefix, theo phép tính của chúng tôi từ weight. Vài trăm
  Alteration là chuyện bình thường.


  **Mỗi lần reforge.** Reforge Caster đảm bảo một modifier mang tag caster.
  Khi group của gem level đã bị chiếm, tính theo weight thì modifier đó là
  cast speed hoặc Spell Critical Strike Chance khoảng 1 trên 3 lần, added
  damage cho spell 4 trên 10 lần, và Spell Damage 1 trên 5 lần. Các ô còn lại
  là một lần roll bình thường từ một pool có 44% là modifier attack ở phía
  prefix. Hãy tính là sẽ cần vài lần thử, và chốt con số trước khi bắt đầu.
steps:
  - title: "Roll gem level trên cây sceptre Magic"
    do: >-
      Transmutation, rồi [[Orb of Alteration]] tới khi prefix là **"+1 to
      Level of all Fire Spell Skill Gems"** (hoặc Cold, Lightning hay
      Physical). Có một suffix bên cạnh cũng không sao. Đừng dùng
      Augmentation.
    why: >-
      Item Magic có nhiều nhất một prefix. Toàn bộ ý đồ nằm ở đó: prefix này
      sẽ là cái duy nhất trên item khi đặt khóa lên, và một cái khóa bảo vệ
      "1 prefix" lúc đó không có lựa chọn nào để đưa ra.
    state:
      rarity: magic
      implicits: ["40% increased Elemental Damage"]
      prefixes: [{ text: "+1 to Level of all Fire Spell Skill Gems" }]
      suffixes: [{ text: "+33 to Strength" }]
  - title: "Imprint"
    do: >-
      Ở [[Menagerie]], dùng **Create an Imprint of a Magic Item**
      ([[Craicic Croaker]] và ba beast Rare).
    why: >-
      Imprint lưu đúng cây sceptre Magic này. Dù các bước kế làm gì, dùng nó
      sẽ đưa sceptre về lại đây: một prefix, đúng cái cần. Nó vừa là cách
      hoàn tác một lần reforge tệ, vừa là cú đặt lại khiến cái khóa rẻ dùng
      lại được.
    check: >-
      Imprint là một item riêng trong inventory của bạn. Giữ nó tới khi bạn
      nhận một kết quả.
  - title: "Regal Orb, và đếm prefix"
    do: >-
      Dùng một [[Regal Orb]]. Rồi đếm prefix.
    why: >-
      Craft Harvest reforge item Rare, nên sceptre phải là Rare. Regal Orb
      thêm một modifier, và đó có thể là một prefix. Một prefix: làm tiếp.
      **Hai prefix:** lúc này khóa 1 Divine Orb sẽ bảo vệ ngẫu nhiên một
      trong hai, không có gì báo cho bạn biết, như nhà phát triển đã nói rõ.
    fail: >-
      Hai prefix. Hoặc dùng Imprint, làm một cái mới, rồi thử lại Regal Orb;
      hoặc craft "2 Prefix Modifiers cannot be changed" (2 Divine Orb), thứ
      chắc chắn khi có đúng hai prefix.
    state:
      implicits: ["40% increased Elemental Damage"]
      prefixes: [{ text: "+1 to Level of all Fire Spell Skill Gems" }]
      suffixes:
        - { text: "+33 to Strength" }
        - { text: "18% increased Cast Speed" }
  - title: "Khóa một prefix"
    do: >-
      Ở [[Crafting Bench]], craft **1 Prefix Modifier cannot be changed** giá
      1 [[Divine Orb]]. Nó là một suffix và cần một ô suffix trống.
    why: >-
      "In the case where there is exactly one prefix modifier on the item,
      then you will know for certain which modifier will be protected" là lời
      mô tả của chính nhà phát triển. Đó chính là cây sceptre này.
    state:
      implicits: ["40% increased Elemental Damage"]
      prefixes: [{ text: "+1 to Level of all Fire Spell Skill Gems" }]
      suffixes:
        - { text: "+33 to Strength" }
        - { text: "18% increased Cast Speed" }
        - { text: "1 Prefix Modifier cannot be changed", how: crafted }
  - title: "Reforge Caster"
    do: >-
      Ở [[Horticrafting Station]], **Reforge a Rare item with random
      modifiers, including a Caster modifier** (75
      [[Primal Crystallised Lifeforce]]).
    why: >-
      Mọi thứ trừ prefix được bảo vệ đều bị thay, kể cả cái khóa, và ít nhất
      một trong các modifier mới mang tag caster. Câu chữ của khóa bảo vệ một
      prefix và không hơn, nên hãy chờ đợi reforge lấp luôn các ô prefix còn
      lại, mà ở đây đó chính là điều bạn muốn.
    check: >-
      **Trước tiên, gem level còn đó không?** Việc reforge Harvest tôn trọng
      một phía đã khóa là do người chơi thử nghiệm với khóa đầy đủ; với các
      khóa một phần mới thì không có gì được ghi lại. Imprint khiến phép thử
      này miễn phí: nếu gem level đã mất, hãy khôi phục sceptre và từ đó trở
      đi dùng khóa đầy đủ.
    state:
      implicits: ["40% increased Elemental Damage"]
      prefixes:
        - { text: "+1 to Level of all Fire Spell Skill Gems" }
        - { text: "Adds 71 to 143 Cold Damage", how: harvest }
        - { text: "+152 to maximum Mana", how: harvest }
      suffixes:
        - { text: "88% increased Spell Critical Strike Chance", how: harvest }
        - { text: "24% increased Attack Speed", how: harvest }
  - title: "Đánh giá, và đặt lại nếu hỏng"
    do: >-
      Giữ kết quả khi nó có một prefix Spell Damage từ 70% trở lên, hoặc một
      prefix trống cho bench, **và** cast speed hoặc Spell Critical Strike
      Chance ở tier bạn chấp nhận. Nếu không, dùng Imprint, làm một Imprint
      mới, rồi lặp lại từ bước 3.
    why: >-
      Kết quả ở trên là hỏng: hai prefix không caster nào dùng được, và phía
      prefix đã đầy. Craft khóa 1 Divine Orb lên nó lúc này sẽ bảo vệ ngẫu
      nhiên một trong ba prefix. Imprint là thứ biến một cái khóa dùng một
      lần thành một vòng lặp.
    state:
      implicits: ["40% increased Elemental Damage"]
      prefixes:
        - { text: "+1 to Level of all Fire Spell Skill Gems" }
        - { text: "76% increased Spell Damage", how: harvest }
      suffixes:
        - { text: "26% increased Cast Speed", how: harvest }
        - { text: "+31% to Global Critical Strike Multiplier", how: harvest }
  - title: "Bench prefix thứ ba"
    do: >-
      Craft **adds 34–45 to 67–78 Fire Damage to Spells** (4
      [[Chaos Orb]]) vào prefix trống.
    why: >-
      Spell Damage đã roll ra, nên các phần trăm damage của bench bị đóng:
      cùng group. Added damage cho spell là group thứ ba mà prefix của caster
      chứa được. Nếu reforge không cho Spell Damage, thì 55–66% của bench (4
      Exalted Orb) đã vào chỗ này thay nó.
    state:
      implicits: ["40% increased Elemental Damage"]
      prefixes:
        - { text: "+1 to Level of all Fire Spell Skill Gems" }
        - { text: "76% increased Spell Damage", how: harvest }
        - { text: "Adds 38 to 71 Fire Damage to Spells", how: crafted }
      suffixes:
        - { text: "26% increased Cast Speed", how: harvest }
        - { text: "+31% to Global Critical Strike Multiplier", how: harvest }
variations: >-
  **Không có beast.** Dùng khóa đầy đủ, 4 Divine Orb và một Sacred Orb, cho
  mọi lần thử. Nó chắc chắn với bất kỳ số prefix nào, nên không cần đặt lại.
  Dưới khóa này, reforge được hiểu là để phía prefix y nguyên, kể cả các ô
  trống, nên sau đó bạn lấp hai ô còn lại bằng bench và Exalted Orb.


  **Giữ modifier attack khỏi reforge** thì cần "Cannot roll Attack Modifiers"
  làm modifier bench thứ hai, và việc đó cần "Can have up to 3 Crafted
  Modifiers" làm cái thứ ba: tổng cộng 4 Divine Orb mỗi lần thử. Ở giá đó,
  vòng lặp đã mất lợi thế của nó.


  **Hai gem level.** Faceted và Aetheric Fossil cùng Fossil của chính element
  khiến một gem level theo loại damage thành thứ dễ roll ra, nhưng Fossil và
  các khóa một phần là một cặp chưa được thử nghiệm. Bản đáng tin của kế
  hoạch đó bắt đầu từ một prefix fractured.
mistakes:
  - "Craft khóa 1 Divine Orb lên cây sceptre có hai hoặc ba prefix."
  - "Dùng Augmentation hoặc Regal trước Imprint. Imprint chỉ lưu item Magic."
  - "Quên làm một Imprint mới sau khi dùng một cái."
  - "Cố cứu một kết quả hỏng bằng Orb of Annulment. Trong 3.30 không gì lái được nó, và gem level là một trong các mục tiêu của nó."
