category: quivers
title: "Khóa suffix, rồi để Harvest trao Life cho bạn"
level: 4
summary: "Một quiver có suffix đúng và prefix sai. Bảo vệ phía suffix, rồi dùng một reforge Life mà cái khóa biến thành một prefix Life được đảm bảo."
goal: >-
  Hoàn thiện một quiver có suffix đáng giữ còn prefix thì không, mà không đem
  suffix ra đánh cược. Trên weapon bạn khóa prefix; trên quiver phía khó là
  phía kia, nên khóa đi theo chiều ngược lại. Bài học là điều đó làm thay
  đổi những gì: **bản thân cái khóa nằm ở đâu, nó tốn bao nhiêu trên item
  này, và vì sao một tag Harvest vô dụng trên quiver chưa khóa lại thành
  chính xác trên quiver đã khóa.**
base: "Spike-Point Arrow Quiver"
itemLevel: 75
baseWhy: >-
  Lần craft này bắt đầu từ một item, không phải từ một base: kết quả của ví
  dụ Fossil khi suffix ra còn prefix thì không, hoặc bất kỳ quiver Rare nào
  có những suffix bạn không muốn phải roll tới hai lần. Item level từ 64 trở
  lên quan trọng vì một lý do: đó là mốc mà tier Life cao nhất (+130–144)
  roll được, và Life chính là mục đích của lần reforge.
methods: [meta, harvest, bench]
result:
  implicits: ["27% increased Critical Strike Chance with Bows"]
  prefixes:
    - { text: "+127 to maximum Life", how: harvest }
    - { text: "36% increased Damage with Bow Skills", how: harvest }
    - { text: "28% increased Elemental Damage with Attack Skills", how: crafted }
  suffixes:
    - { text: "+36% to Critical Strike Multiplier with Bows" }
    - { text: "32% increased Critical Strike Chance with Bows" }
    - { text: "+41% to Fire Resistance" }
needs:
  - { item: "[[Divine Orb]]", amount: "4 mỗi lần thử" }
  - { item: "[[Blessed Orb]]", amount: "4 mỗi lần thử" }
  - { item: "[[Wild Crystallised Lifeforce]]", amount: "75 mỗi lần thử" }
  - { item: "[[Orb of Scouring]]", amount: "1", note: "chỉ khi phải gỡ một modifier bench trước" }
  - { item: "[[Orb of Alchemy]]", amount: "4", note: "cho craft bench cuối cùng" }
cost: >-
  Khóa: 4 [[Divine Orb]] và 4 [[Blessed Orb]] trên quiver trong 3.30, và mỗi
  lần reforge đều tiêu mất nó. Lifeforce chỉ là tiền lẻ khi đặt cạnh. Hãy
  tính là sẽ cần hai ba lần thử, và chốt giới hạn của bạn trước lần đầu
  tiên.


  Cái giá đó cũng chính là phép thử. Nếu suffix trên quiver này có thể roll
  lại với giá thấp hơn một lần khóa thì đừng khóa chúng: hãy roll một quiver
  mới.
odds: >-
  Khi suffix đã khóa, reforge Life chỉ có thể được thỏa ở phía prefix, và
  maximum Life là prefix duy nhất mang tag life, nên lần thử nào cũng cho
  một prefix Life. **Tier** của nó thì ngẫu nhiên. Life có mười tier với
  weight bằng nhau, nên nếu modifier được đảm bảo được bốc theo weight trong
  số đó, đúng như cách người ta vẫn hiểu về reforge, thì 3 trên 10 lần thử
  cho +100 trở lên và 1 trên 10 cho tier cao nhất. Đó là phép tính của
  chúng tôi, và chưa được đo trong 3.30.


  Một hai prefix còn lại thuần là may rủi từ một pool sáu họ: khoảng 3 trên
  10 lần roll đó là bow damage, phần còn lại là flat damage loại này hay
  loại khác.
steps:
  - title: "Kiểm xem còn ô prefix trống không"
    do: >-
      Đếm prefix. "Suffix Modifiers cannot be changed" tự nó là một
      **prefix**, nên quiver cần một ô prefix trống để nhận nó. Nếu một
      trong các prefix là modifier bench, hãy gỡ nó ở bench với giá 1
      [[Orb of Scouring]].
    why: >-
      Meta-modifier chiếm một ô thật, ở phía đối diện với phía nó bảo vệ.
      Một quiver có ba prefix roll ra thì hoàn toàn không khóa suffix được.
    fail: >-
      Ba prefix roll ra: cách duy nhất để mở một ô là
      [[Orb of Annulment]], thứ gỡ ngẫu nhiên một trong sáu modifier và một
      nửa số lần sẽ trúng suffix. Đừng dùng nó. Một quiver có suffix tuyệt
      vời và ba prefix kém vẫn là một quiver có người chịu đeo.
    state:
      implicits: ["27% increased Critical Strike Chance with Bows"]
      prefixes:
        - { text: "+31 to maximum Life" }
        - { text: "Adds 7 to 14 Physical Damage to Attacks" }
      suffixes:
        - { text: "+36% to Critical Strike Multiplier with Bows" }
        - { text: "32% increased Critical Strike Chance with Bows" }
        - { text: "+41% to Fire Resistance" }
  - title: "Craft khóa suffix"
    do: >-
      Ở [[Crafting Bench]], craft **Suffix Modifiers cannot be
      changed**: 4 [[Divine Orb]] và 4 [[Blessed Orb]].
    why: >-
      Chừng nào nó còn trên item, một lần roll lại tôn trọng nó sẽ để cả ba
      suffix y nguyên. Quiver trả giá khóa của armour chứ không phải giá của
      weapon, vì vậy currency thứ hai là Blessed Orb. Hãy dùng bản đầy đủ:
      các khóa 1 và 2 suffix tốn ít hơn, nhưng nhà phát triển đã nói game
      chọn ngẫu nhiên modifier nào được chúng bảo vệ và không cho bạn thấy.
    check: >-
      Modifier hiện trong các prefix dưới dạng crafted. Đừng dùng currency
      nào khác lên quiver giữa bước này và bước kế.
    state:
      implicits: ["27% increased Critical Strike Chance with Bows"]
      prefixes:
        - { text: "+31 to maximum Life" }
        - { text: "Adds 7 to 14 Physical Damage to Attacks" }
        - { text: "Suffix Modifiers cannot be changed", how: crafted }
      suffixes:
        - { text: "+36% to Critical Strike Multiplier with Bows" }
        - { text: "32% increased Critical Strike Chance with Bows" }
        - { text: "+41% to Fire Resistance" }
  - title: "Reforge kèm một modifier Life"
    do: >-
      Ở [[Horticrafting Station]], dùng **Reforge a Rare item with
      random modifiers, including a Life modifier** (75
      [[Wild Crystallised Lifeforce]]).
    why: >-
      Trên quiver chưa khóa, reforge này là công cụ tồi: life leech và life
      on kill là các suffix mang tag life, và cái nào trong hai cũng thỏa
      được nó. Cái khóa loại chúng khỏi bài toán. Reforge chỉ được đụng tới
      prefix, kể cả cái khóa, và prefix duy nhất mang tag life là maximum
      Life. Tag không hề đổi. Chính cái khóa làm nó thành chính xác.
    check: >-
      Ba suffix không đổi, khóa đã biến mất, Life nằm trong các prefix. Giữ
      Alt và đọc tier của nó.
    fail: >-
      Việc reforge Harvest tôn trọng khóa là do người chơi xác lập, không
      phải do nhà phát triển tuyên bố. Nếu sau một bản patch bạn có chút nghi
      ngờ nào, hãy thử trên một item Rare rẻ trước.
    state:
      implicits: ["27% increased Critical Strike Chance with Bows"]
      prefixes:
        - { text: "+127 to maximum Life", how: harvest }
        - { text: "36% increased Damage with Bow Skills", how: harvest }
      suffixes:
        - { text: "+36% to Critical Strike Multiplier with Bows" }
        - { text: "32% increased Critical Strike Chance with Bows" }
        - { text: "+41% to Fire Resistance" }
  - title: "Đánh giá prefix theo giới hạn của bạn"
    do: >-
      Nhận kết quả nếu Life ở tier bạn đã đặt từ trước (+100 trở lên là Tier
      3) **và** phía prefix có một ô trống hoặc một prefix thứ hai mà build
      của bạn dùng. Nếu không, quay lại bước 2 và trả tiền lần nữa.
    why: >-
      Mỗi lần thử thêm tốn trọn một lần khóa. Life là thứ bạn đang mua. Một
      prefix thứ hai hữu ích là phần thưởng thêm, và một ô trống cũng tốt
      gần bằng, vì bước kế tiếp lấp nó một cách chắc chắn.
    check: >-
      Đừng trả thêm một lần khóa để đưa Life từ Tier 3 lên Tier 1. Đó là ba
      mươi Life với giá 4 Divine Orb.
  - title: "Bench prefix cuối cùng"
    do: >-
      Ở prefix trống, craft thứ build còn thiếu. Với build elemental: 24–32%
      increased Elemental Damage with Attack Skills, 4
      [[Orb of Alchemy]]. Với build physical: adds 5–7 to 8–10 Physical
      Damage to Attacks, 2 Chaos Orb.
    why: >-
      Bench là thứ chắc chắn, nên nó đi sau cùng, khi bạn đã biết còn lại
      khoảng trống nào. Elemental Damage with Attack Skills là prefix bench
      mà quiver không tự roll ra được.
    state:
      implicits: ["27% increased Critical Strike Chance with Bows"]
      prefixes:
        - { text: "+127 to maximum Life", how: harvest }
        - { text: "36% increased Damage with Bow Skills", how: harvest }
        - { text: "28% increased Elemental Damage with Attack Skills", how: crafted }
      suffixes:
        - { text: "+36% to Critical Strike Multiplier with Bows" }
        - { text: "32% increased Critical Strike Chance with Bows" }
        - { text: "+41% to Fire Resistance" }
variations: >-
  **Scour thay vì reforge.** Khi suffix đã khóa, một
  [[Orb of Scouring]] được ghi nhận là chỉ gỡ prefix và cái khóa, để lại ba
  suffix và ba ô prefix trống. Phía prefix của quiver có bảy họ, nên
  [[Exalted Orb]] vào đó là ván cược được: khoảng 4 trên 10 lần roll prefix
  là Life. Cách này không cho Life được đảm bảo, và nó hợp với base có
  [[Memory Strands]], thứ nâng tier của cái mà Exalted Orb thêm vào.


  **Các khóa rẻ, ở chỗ chúng chắc chắn.** "1 Suffix Modifier cannot be
  changed" tốn 1 Divine Orb và "2 Suffix Modifiers" tốn 2. Nhà phát triển
  đã nói lựa chọn chỉ được biết chắc khi phía đó có đúng chừng ấy modifier.
  Vậy nên một quiver có đúng hai suffix, cả hai đều muốn giữ, là ứng viên
  cho bản 2 suffix. Chúng tôi chưa xác nhận được reforge xử lý phần còn lại
  của phía đó thế nào dưới các khóa một phần, nên hãy thử trên một quiver vô
  giá trị trước.


  **Một prefix veiled thì không đáng ở đây.** Prefix Life unveil ra trên
  quiver là +55–60, chưa bằng một nửa thứ reforge cho.
mistakes:
  - "Khóa những suffix không đáng 4 Divine Orb và 4 Blessed Orb. Hai resistance và Dexterity có thể roll lại bằng vài Alteration."
  - "Dùng Essence lên quiver đã khóa. Essence được ghi nhận là phớt lờ các modifier bảo vệ và sẽ roll lại cả suffix."
  - "Dùng reforge Life mà không có khóa rồi trông chờ một prefix Life. Life leech và life on kill thỏa được nó y như vậy."
  - "Trả tiền khóa trên quiver có ba prefix roll ra. Khóa cần một ô prefix và sẽ không vừa."
