category: abyss-jewels
title: "Bốn dòng, rồi dòng thứ năm: hoàn thiện bằng Merrick's Ducat"
level: 4
summary: "Một jewel caster có kế hoạch từ cặp Magic tới Exalted Orb, hoàn thiện bằng Divine Orb và thứ currency duy nhất thêm được modifier vào một Abyss Jewel đã đầy."
goal: >-
  Một Hypnotic Eye có Life và flat fire damage ở tier cao, một dòng thứ ba
  build dùng được, và mọi ván cược còn lại được chơi theo đúng thứ tự. Không
  bước nào mới. Cái khó nằm ở **trình tự và giá**: giai đoạn nào nên gánh lần
  roll khó, việc gì phải làm trước khi jewel bị corrupt, và
  [[Merrick's Ducat]] đặt cái gì vào rủi ro, cái gì không.
base: "Hypnotic Eye Jewel"
itemLevel: 84
baseWhy: >-
  Eye của caster, cho một spell fire cast với shield. Item level 84 mở Tier 1
  của Life (82) và Tier 1 của mọi prefix lẫn suffix flat spell damage (77 tới
  84). Không thứ gì build này muốn cần hơn thế: 86 chỉ thêm tier cao nhất của
  ba prefix hiếm.
methods: [currency, beast, finishing, corruption]
result:
  note: "Corrupted, kèm modifier thứ năm từ Merrick's Ducat"
  prefixes:
    - { text: "+33 to maximum Life" }
    - { text: "+27 to maximum Mana" }
  suffixes:
    - { text: "Adds 21 to 28 Fire Damage to Spells" }
    - { text: "+11% to Global Critical Strike Multiplier" }
needs:
  - { item: "Một Hypnotic Eye Jewel", amount: "1", note: "item level 82 trở lên" }
  - { item: "[[Orb of Alteration]]", amount: "800–1,500" }
  - { item: "[[Orb of Augmentation]]", amount: "50–100" }
  - { item: "[[Craicic Croaker]]", amount: "khoảng 15", note: "cộng thêm ba beast Rare mỗi lần; xem bước 2 để biết cách chia rẻ hơn" }
  - { item: "[[Regal Orb]]", amount: "khoảng 15" }
  - { item: "[[Exalted Orb]]", amount: "1" }
  - { item: "[[Divine Orb]]", amount: "1–3" }
  - { item: "[[Merrick's Ducat]]", amount: "1" }
cost: >-
  Alteration cỡ gần một nghìn cái, một chục Imprint trở lên, một
  [[Exalted Orb]], vài [[Divine Orb]] và một Ducat. Beast và Ducat là thứ bạn
  có thể không có: trong 3.30 chỉ beast đỏ mới bắt được, và patch notes nói
  Ducat có một nguồn mới mà không nêu tên nguồn đó.


  Chúng tôi không đưa ra tổng số. Giai đoạn nào chiếm phần lớn chi phí tùy
  vào Alteration hay Croaker rẻ hơn với bạn, và bước 2 nói đúng về lựa chọn
  đó.
odds: >-
  **Cặp Magic.** Ở item level 84, Life từ +31 trở lên chiếm 3.6% số lần roll
  prefix và Fire Damage to Spells từ Tier 3 trở lên chiếm 3.7% số lần roll
  suffix. Cả hai: khoảng 0.13%, 1 trên 750 jewel hai modifier, theo phép tính
  của chúng tôi.


  **Regal Orb.** Năm suffix trong danh sách chiếm 11.7% weight suffix còn
  lại; prefix duy nhất trong danh sách chiếm 2.0% weight prefix còn lại. Coi
  hai phía có khả năng ngang nhau, và đó là giả định của chúng tôi, thì
  khoảng 1 trên 15 lần thử đạt.


  **Exalted Orb** vào ô cuối, một prefix: prefix fire cho shield ở bất kỳ
  tier nào chiếm 3.5% những gì nó có thể thêm.


  **Ducat:** xem bước cuối. Xác suất của nó không tính được từ lời văn của
  nó.
steps:
  - title: "Viết kế hoạch ngược từ cuối"
    do: >-
      Jewel hoàn chỉnh: **prefix** là Life từ +31 trở lên, và nếu may mắn cho
      phép thì "Added Spell Fire Damage while holding a Shield"; **suffix**
      là "Adds Fire Damage to Spells" từ Tier 3 trở lên, và một trong số Cast
      Speed, Global Critical Strike Multiplier, Global Critical Strike
      Chance, hoặc hai suffix critical strike "Recently".
    why: >-
      Prefix fire là dòng hiếm: mười lăm prefix spell chia nhau pool và chỉ
      một cái trong đó khớp với fire và shield, 2.9% số lần roll prefix ở bất
      kỳ tier nào và 1% từ Tier 3 trở lên. Life hay gặp gấp sáu lần. Vậy nên
      Life nằm trên jewel Magic còn prefix fire được để lại như phần thưởng
      thêm.
  - title: "Chọn giai đoạn nào gánh lần roll khó"
    do: >-
      Quyết định giữa hai phiên bản của cùng một kế hoạch. **Như đã viết:**
      Life và suffix fire trên jewel Magic (1 trên 750), rồi một Regal Orb
      đạt 1 trên 15 lần. **Làm ngược lại:** prefix fire từ Tier 3 trở lên và
      suffix fire trên jewel Magic (khoảng 1 trên 2,600), rồi một Regal Orb
      đạt khoảng 1 trên 8 lần, vì Life từ +26 trở lên giờ nằm trong danh sách
      của nó.
    why: >-
      Hai kế hoạch làm ra cùng một jewel từ currency khác nhau. Cái đầu tiêu
      ít Alteration hơn và nhiều Croaker hơn; cái sau thì ngược lại, và kết
      thúc với prefix hiếm được đảm bảo. Hãy đếm thứ bạn có trước khi chọn.
      Lên kế hoạch cho một jewel phần lớn là việc này: dời cái khó sang giai
      đoạn mà bạn đủ sức lặp lại nhất.
  - title: "Cặp Magic, Imprint, Regal Orb"
    do: >-
      Roll jewel Magic bằng [[Orb of Alteration]] và
      [[Orb of Augmentation]]. Làm một Imprint bằng một
      [[Craicic Croaker]]. Dùng một [[Regal Orb]]; nếu dòng thứ ba không nằm
      trong danh sách, khôi phục bằng Imprint, làm một cái mới, rồi lặp lại.
    why: >-
      Đây là quy trình Imprint từ ví dụ Ghastly Eye, với mức khắt khe hơn.
      Mức càng khắt khe, Imprint càng đáng giá, vì nếu không có nó thì mỗi
      lần hỏng sẽ tốn cả cặp Magic.
    check: >-
      Đọc tier ở mọi giai đoạn. Một suffix fire dưới Tier 3 trên jewel Magic
      không phải là jewel bạn định lưu.
    state:
      prefixes:
        - { text: "+33 to maximum Life" }
      suffixes:
        - { text: "Adds 21 to 28 Fire Damage to Spells" }
        - { text: "+11% to Global Critical Strike Multiplier" }
  - title: "Một Exalted Orb"
    do: >-
      Dùng một [[Exalted Orb]]. Khi cả hai suffix đã đầy, nó chỉ thêm được
      prefix.
    why: >-
      Một lần roll miễn phí, như trên mọi jewel: không dòng nào ở đây có hại.
      Nó thường sẽ nằm không, như dòng Mana nó thêm trong ví dụ này. Đừng cố
      gỡ nó. Một [[Orb of Annulment]] lấy ngẫu nhiên một trong bốn, và ba
      trong bốn cái đó chính là jewel.
    state:
      prefixes:
        - { text: "+33 to maximum Life" }
        - { text: "+27 to maximum Mana" }
      suffixes:
        - { text: "Adds 21 to 28 Fire Damage to Spells" }
        - { text: "+11% to Global Critical Strike Multiplier" }
  - title: "Divine Orb, khi bạn còn dùng được"
    do: >-
      Nhìn ba dòng quan trọng: Life (31–35), suffix fire (20–22 to 26–30) và
      multiplier (9–12%). Dùng [[Divine Orb]] tới khi không dòng nào nằm ở
      đáy khoảng của nó, rồi dừng ở đó.
    why: >-
      Bước kế tiếp corrupt jewel, và một item corrupted thì không đổi được
      nữa. Mọi cải thiện cần currency thông thường phải đi trước nó. Đây là
      luật thứ tự duy nhất của lần craft mà về sau không sửa lại được.
  - title: "Merrick's Ducat"
    do: >-
      Dùng một [[Merrick's Ducat]] lên jewel đã hoàn thiện.
    why: >-
      Lời văn của nó: "Augment a Rare Abyssal Jewel with a random additional
      Modifier and corrupt it, even if it is already at maximum Modifier
      count." Nó thêm dòng thứ năm vào một jewel đã đầy, điều không thứ gì
      khác trong game làm được, và xét theo lời văn đó thì nó không gỡ và
      không roll lại gì. Thứ bạn từ bỏ là quyền tự do thay đổi jewel về sau.
    check: >-
      Điều lời văn không nói: modifier thứ năm nằm ở phía nào, nó có tránh
      các group đang có trên jewel không, hay nó rút từ pool nào. Nếu nó rút
      từ pool thông thường của eye, thì cứ khoảng mười sáu kết quả sẽ có một
      cái là dòng trong danh sách của build này, theo cùng phép tính như
      trên. Chúng tôi chưa thử nghiệm được điều đó; hãy coi dòng thứ năm là
      phần thưởng thêm, không phải một phần của kế hoạch.
    fail: >-
      Một dòng thứ năm nằm không chẳng tốn gì. Thất bại thật sự duy nhất ở
      đây là đã dùng Ducat trước Divine Orb.
    state:
      note: "Corrupted, kèm modifier thứ năm từ Merrick's Ducat"
      prefixes:
        - { text: "+33 to maximum Life" }
        - { text: "+27 to maximum Mana" }
      suffixes:
        - { text: "Adds 21 to 28 Fire Damage to Spells" }
        - { text: "+11% to Global Critical Strike Multiplier" }
variations: >-
  **Thay bằng một Vaal Orb.** Một [[Vaal Orb]] có thể thêm một implicit
  corruption, một trong 21 cái cùng weight, nhưng theo một trang tra cứu cũ
  hơn, nó cũng có thể không làm gì hoặc roll lại cả jewel thành một cái Rare
  ngẫu nhiên. Trên một jewel tốn công cỡ này, Ducat là cách an toàn hơn trong
  hai cách corrupt nó, vì lời văn của nó hứa một lần thêm và không gì khác.
  Bạn không dùng được cả hai: cái nào cũng đóng jewel lại.


  **Dừng trước Ducat.** Một jewel bạn có thể còn cải thiện, ví dụ cái đang
  chờ một dòng thứ ba tốt hơn, thì đừng corrupt gì cả. Ducat dành cho jewel
  bạn đã làm xong.


  **Các eye khác.** Trình tự này dùng được trên mọi Abyss Jewel. Trên Ghastly
  Eye, Regal Orb đạt thường xuyên hơn nhiều; trên Murderous Eye, cặp Magic là
  giai đoạn đắt.
mistakes:
  - "Dùng Ducat hay Vaal Orb trước Divine Orb. Khi đó các con số bị chốt."
  - "Đưa prefix hiếm vào danh sách mong muốn cho jewel Magic mà không làm phép tính. Một trên 2,600 là một lần craft khác hẳn một trên 750."
  - "Annul dòng thứ tư nằm không. Ba trong bốn modifier nó có thể gỡ là những cái bạn đã trả tiền."
  - "Trông vào modifier thứ năm. Nó là ngẫu nhiên."
