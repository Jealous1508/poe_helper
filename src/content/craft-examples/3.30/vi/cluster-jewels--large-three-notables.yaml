category: cluster-jewels
title: "Ba notable trên một Large Cluster Jewel"
level: 4
summary: "Hai notable trên jewel Magic, một Imprint, và một Regal Orb cho cái thứ ba, kèm phép tính cho bạn biết nên nhất định đòi đúng một notable hay chấp nhận một cái tốt."
goal: >-
  Một Large Cluster Jewel Minion Damage với hai notable prefix và một notable
  suffix, tất cả trên tám passive. Mọi công cụ trong đây đều đã xuất hiện
  trước đó. Thứ làm nó thành lần craft cluster khó nhất là **notable thứ ba
  mới là chỗ quyết định giá**, bằng một lựa chọn bạn đưa ra trước khi bắt
  đầu: đúng một notable, hay bất kỳ cái nào trong vài cái.
base: "Large Cluster Jewel"
itemLevel: 60
baseWhy: >-
  **Enchantment:** "Added Small Passive Skills grant: Minions deal 10%
  increased Damage". **Passive:** "Adds 8 Passive Skills". **Item level:** 50
  tới 67, vì ba notable trong kế hoạch (Renewal và Rotten Claws ở 50, Call to
  the Slaughter ở 1) đều nằm gọn dưới mức đó. Trong dải này, jewel roll được
  tổng cộng ba notable prefix và một notable suffix. Ở 84 nó roll được năm và
  ba, cộng thêm ba tier của mọi bonus cho small passive.
methods: [currency, beast, finishing]
result:
  implicits:
    - "Adds 8 Passive Skills"
    - "2 Added Passive Skills are Jewel Sockets"
    - "Added Small Passive Skills grant: Minions deal 10% increased Damage"
  prefixes:
    - { text: "1 Added Passive Skill is Renewal" }
    - { text: "1 Added Passive Skill is Rotten Claws" }
  suffixes:
    - { text: "1 Added Passive Skill is Call to the Slaughter" }
    - { text: "Added Small Passive Skills also grant: +2% to all Elemental Resistances" }
needs:
  - { item: "Một Large Cluster Jewel có enchantment Minion Damage", amount: "1", note: "8 passive, item level 50–67" }
  - { item: "[[Orb of Alteration]]", amount: "50–100" }
  - { item: "[[Orb of Augmentation]]", amount: "10–20" }
  - { item: "[[Craicic Croaker]]", amount: "7 tới 22", note: "cộng thêm ba beast Rare mỗi lần; xem bước 4" }
  - { item: "[[Regal Orb]]", amount: "mỗi Croaker một cái" }
  - { item: "[[Exalted Orb]]", amount: "1", note: "cho ô thứ tư" }
cost: >-
  Jewel Magic thì rẻ trong dải này. Notable thứ ba thì không: khoảng bảy
  Imprint nếu bạn chấp nhận một trong hai notable ở đó, và khoảng hai mươi hai
  nếu chỉ một cái mới được. Mỗi Imprint là một [[Craicic Croaker]], ba beast
  Rare nữa và một [[Regal Orb]].


  Chúng tôi không đưa ra tổng số. Nếu số Croaker trông quá sức, thì đó là câu
  trả lời thật cho bạn, và một jewel có hai trong ba cái là chỗ lần craft nên
  dừng.
odds: >-
  **Cặp Magic.** Ở item level 50 tới 67, Renewal và Rotten Claws mỗi cái
  chiếm 9.1% số lần roll prefix, và Call to the Slaughter chiếm 14.6% số lần
  roll suffix, theo phép tính của chúng tôi. Một trong hai notable prefix
  cùng với notable suffix đó: khoảng 2.7%, 1 trên 38 jewel hai modifier. Ở
  item level 84, cũng cặp đó là khoảng 1 trên 160.


  **Regal Orb.** Nó thêm prefix khoảng 46% số lần, nếu tính hai phía theo
  weight còn lại của chúng. Notable duy nhất còn thiếu chiếm 10% weight
  prefix còn lại; nếu chấp nhận cả Feasting Fiends thì 30%. Vậy nên cứ 22
  Regal Orb thì một cái cho đúng notable thứ ba, và cứ 7 cái thì một cái cho
  một notable được chấp nhận.


  **Ô thứ tư** không thể là notable. Không có gì để tính.
steps:
  - title: "Khớp kế hoạch với hình dáng, và với dải item level"
    do: >-
      Xác nhận trong danh sách modifier rằng các notable của bạn nhiều nhất
      là hai prefix và một suffix của cùng một enchantment, và lấy item level
      cao nhất trong số chúng. Ở đây: Renewal và Rotten Claws (prefix, level
      50) và Call to the Slaughter (suffix, level 1).
    why: >-
      Dải item level đáng giá hơn bất kỳ orb nào trong lần craft này. Dưới
      item level 68, pool suffix của jewel này chứa đúng một notable, và đó
      là cái trong kế hoạch. Mua jewel ở 84 thì cũng notable đó chiếm 6.5% số
      lần roll suffix thay vì 14.6%, với hai notable suffix khác tranh ô duy
      nhất mà group của chúng cho phép.
    state:
      rarity: normal
      implicits:
        - "Adds 8 Passive Skills"
        - "2 Added Passive Skills are Jewel Sockets"
        - "Added Small Passive Skills grant: Minions deal 10% increased Damage"
  - title: "Hai notable trên jewel Magic"
    do: >-
      Dùng [[Orb of Alteration]] và [[Orb of Augmentation]] tới khi prefix là
      Renewal hoặc Rotten Claws **và** suffix là Call to the Slaughter.
    why: >-
      Đây là giai đoạn rẻ, nên nó phải gánh được càng nhiều phần của kế hoạch
      càng tốt: một notable prefix và notable suffix. Notable prefix nào
      trong hai cũng được, vì cái còn lại là việc của giai đoạn sau.
    check: >-
      Feasting Fiends, notable prefix hay gặp của enchantment này (18% số lần
      roll prefix), sẽ xuất hiện thường xuyên. Hãy quyết định ngay bây giờ
      bạn có chấp nhận nó làm notable thứ ba không. Đừng chấp nhận nó ở đây
      thay cho Renewal hay Rotten Claws, trừ khi bạn hạ cả kế hoạch xuống.
    state:
      rarity: magic
      implicits:
        - "Adds 8 Passive Skills"
        - "2 Added Passive Skills are Jewel Sockets"
        - "Added Small Passive Skills grant: Minions deal 10% increased Damage"
      prefixes:
        - { text: "1 Added Passive Skill is Renewal" }
      suffixes:
        - { text: "1 Added Passive Skill is Call to the Slaughter" }
  - title: "Imprint"
    do: >-
      Làm một Imprint của jewel Magic: [[Craicic Croaker]] và ba beast Rare
      khác.
    why: >-
      Mọi thứ từ đây trở đi đều thêm vào jewel và không gì gỡ được hai
      notable bạn đang có. Rủi ro là kiểu khác: một modifier sai ở ô prefix
      thứ hai sẽ kết thúc lần craft, vì không jewel nào có lại được một ô
      prefix trống. Imprint biến ngõ cụt đó thành một lần thử lại.
    state:
      rarity: magic
      implicits:
        - "Adds 8 Passive Skills"
        - "2 Added Passive Skills are Jewel Sockets"
        - "Added Small Passive Skills grant: Minions deal 10% increased Damage"
      prefixes:
        - { text: "1 Added Passive Skill is Renewal" }
      suffixes:
        - { text: "1 Added Passive Skill is Call to the Slaughter" }
  - title: "Regal Orb: chọn mức của bạn, rồi giữ đúng nó"
    do: >-
      Dùng một [[Regal Orb]]. **Mức chặt:** chỉ giữ nếu nó thêm notable còn
      thiếu, ở đây là Rotten Claws. **Mức lỏng:** giữ cả Feasting Fiends. Nếu
      orb thêm một **suffix**, hoặc bất kỳ prefix nào khác, dùng Imprint, làm
      một cái mới và thử lại.
    why: >-
      Mức chặt đạt khoảng 1 trên 22 lần và mức lỏng 1 trên 7 lần. Hệ số ba
      đó là toàn bộ chênh lệch chi phí giữa cái jewel một build guide nêu tên
      và cái làm gần như cùng việc đó. Hãy đưa ra lựa chọn khi [[Menagerie]]
      đang mở trước mặt bạn.
    check: >-
      Một suffix từ Regal Orb không phải thảm họa: cả hai notable còn nguyên
      và ô prefix thứ hai vẫn trống. Nếu bạn hết Croaker, hãy thôi khôi phục
      và dùng một [[Exalted Orb]] thay vào. Khi cả hai ô suffix đã đầy, nó
      chỉ thêm được prefix: notable còn thiếu 1 trên 10 lần, một cái được
      chấp nhận 3 trên 10 lần.
    fail: >-
      Đừng với tới con beast thêm một prefix và gỡ một suffix ngẫu nhiên.
      Trên jewel Large, một trong các suffix nó có thể gỡ là notable suffix
      của bạn.
    state:
      implicits:
        - "Adds 8 Passive Skills"
        - "2 Added Passive Skills are Jewel Sockets"
        - "Added Small Passive Skills grant: Minions deal 10% increased Damage"
      prefixes:
        - { text: "1 Added Passive Skill is Renewal" }
        - { text: "1 Added Passive Skill is Rotten Claws" }
      suffixes:
        - { text: "1 Added Passive Skill is Call to the Slaughter" }
  - title: "Ô thứ tư: một orb không có kết cục xấu"
    do: >-
      Dùng một [[Exalted Orb]].
    why: >-
      Cả hai prefix đã đầy, nên nó thêm một suffix. Mọi notable suffix của
      Large nằm trong cái group mà notable suffix của bạn đã chiếm, nên nó
      không thêm được notable thứ tư. Thứ còn lại là một bonus cho small
      passive: một resistance, một attribute, regeneration, hoặc attack speed
      và cast speed của minion. Trên jewel ba notable bạn lấy ít small
      passive, nên bonus thì nhỏ, nhưng nó miễn phí.
    state:
      implicits:
        - "Adds 8 Passive Skills"
        - "2 Added Passive Skills are Jewel Sockets"
        - "Added Small Passive Skills grant: Minions deal 10% increased Damage"
      prefixes:
        - { text: "1 Added Passive Skill is Renewal" }
        - { text: "1 Added Passive Skill is Rotten Claws" }
      suffixes:
        - { text: "1 Added Passive Skill is Call to the Slaughter" }
        - { text: "Added Small Passive Skills also grant: +2% to all Elemental Resistances" }
  - title: "Gắn vào socket và đếm điểm"
    do: >-
      Đặt jewel vào một cluster socket cỡ Large. Tìm ba notable và hai jewel
      socket, rồi đếm số điểm cần để lấy những cái bạn muốn.
    why: >-
      Các trang tra cứu mô tả mỗi notable được đặt ở một vị trí cố định theo
      thứ tự của nó trong danh sách modifier, và người chơi dùng điều đó để
      đánh giá jewel ba notable. Chúng tôi chưa kiểm chứng các luật đó. Tree
      cho thấy kết quả trực tiếp, và bạn chỉ cần có vậy trước khi quyết định
      jewel này hay một cặp notable khác hợp với số điểm của bạn.
variations: >-
  **Một notable suffix level 75.** Vicious Bite cần item level 75 và có weight
  63. Trong dải 75 tới 83, nó là khoảng 1 trên 190 lần roll suffix, và cặp
  Magic có nó là khoảng 1 trên 1,600. Chỉ một thay đổi đó trong kế hoạch đã
  nhân giai đoạn đầu lên bốn mươi lần, đó là lý do jewel có các notable hiếm
  được mua nhiều hơn hẳn so với được làm.


  **Hai prefix trước?** Không làm được trên jewel Magic, vốn chỉ có một
  prefix. Thứ tự trong ví dụ này, một prefix và suffix trước, là thứ tự duy
  nhất chốt được hai notable trước khi jewel thành Rare.


  **Dừng ở hai.** Cặp Magic với một Regal Orb và không Imprint là một jewel
  hai notable kèm bất cứ thứ gì orb thêm vào. Với nhiều build, đó là chỗ dừng
  đúng.
mistakes:
  - "Mua một jewel item level 84 để tìm notable cần 50. Cặp Magic đi từ 1 trên 38 thành khoảng 1 trên 160."
  - "Dùng Regal Orb trước Imprint."
  - "Dùng beast thêm-một-prefix trên jewel Large đã có notable suffix."
  - "Đổi mức giữa chừng. Mức lỏng sau mười lăm lần hỏng ở mức chặt nghĩa là mười lăm Croaker đầu không mua được gì."
  - "Bỏ qua việc nhìn tree trước khi trả tiền cho notable thứ ba."
