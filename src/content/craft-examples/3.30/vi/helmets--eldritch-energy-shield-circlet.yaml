category: helmets
title: "Một cái circlet Energy Shield hoàn thiện bằng Eldritch currency"
level: 5
summary: "Hai Fossil cho phía suffix, rồi làm prefix từng modifier một dưới một implicit Searing Exarch: một Exalted Orb có block, một Annulment được xem trước, và không có khóa bench ở đâu cả."
goal: >-
  Một cái helmet cho caster với suffix fire chỉ Fossil mới có, ba prefix
  Energy Shield và hai Eldritch implicit. Mọi công cụ trong đây đều đã xuất
  hiện ở một ví dụ dễ hơn. Thứ khiến nó thành cái helmet khó nhất ở đây là
  **mỗi giai đoạn được bảo vệ bởi một thứ khác nhau**, và các quyết định ở
  giữa được đưa ra bằng cách đếm weight, không phải theo thói quen.
base: "Lich's Circlet"
itemLevel: 85
baseWhy: >-
  117–134 Energy Shield là base cao nhất trong loại item này, và ba prefix
  local nhân nó lên. Item level 84 mở "Unassailable", 92–100% increased
  Energy Shield, và resistance Tier 1; 85 thêm Energy Shield Recharge Rate
  cao nhất. Đỉnh cao của loại trang bị này không cần gì cao hơn.


  Base phải **không có influence và không có Memory Strands nào bạn tiếc**:
  kế hoạch dựa vào Eldritch implicit, item có influence không nhận được
  chúng, và chúng tôi chưa xác nhận được rằng item có strand thì nhận được.
methods: [fossil, eldritch, lock, bench, finishing]
result:
  implicits: ["11% increased Cast Speed", "24% increased Spell Damage"]
  prefixes:
    - { text: "96% increased Energy Shield", how: fossil }
    - { text: "+57 to maximum Energy Shield", how: eldritch }
    - { text: "20% increased Energy Shield / +15 to maximum Life", how: crafted }
  suffixes:
    - { text: "Enemies within 6 metres have -9% to Fire Resistance", how: fossil }
    - { text: "+47% to Fire Resistance", how: fossil }
    - { text: "37% increased Energy Shield Recharge Rate", how: fossil }
needs:
  - { item: "[[Scorched Fossil]] và [[Dense Fossil]]", amount: "mỗi loại hàng chục" }
  - { item: "[[Potent Chaotic Resonator]]", amount: "một cái mỗi lần thử", note: "cỡ có hai socket" }
  - { item: "[[Greater Eldritch Ember]]", amount: "1", note: "để định phía mà các Eldritch orb tác động" }
  - { item: "[[Hinekora's Lock]]", amount: "1–3", note: "tùy chọn; xem giai đoạn 3" }
  - { item: "[[Eldritch Orb of Annulment]]", amount: "1–2" }
  - { item: "[[Eldritch Exalted Orb]]", amount: "1–3" }
  - { item: "[[Exceptional Eldritch Ember]] và [[Exceptional Eldritch Ichor]]", amount: "mỗi loại khoảng 30" }
  - { item: "[[Chaos Orb]] và [[Orb of Scouring]]", amount: "một nhúm", note: "các craft bench và gỡ một cái" }
cost: >-
  Giai đoạn 1 tính bằng cặp Fossil. Giai đoạn 3 tính bằng
  [[Hinekora's Lock]] nếu bạn dùng, và mỗi cái đáng giá hơn phần lớn helmet.
  Các implicit cuối cùng tính bằng Exceptional Ember và Ichor, mỗi loại
  khoảng ba mươi theo phép tính của chúng tôi.


  Chúng tôi không đưa ra tổng. Hai trong số các giai đoạn có đuôi dài, và giá
  trong tuần đầu của một league biến động quá nhanh để in ra.
odds: >-
  **Giai đoạn 1.** Với cả hai Fossil, một lần roll prefix là "Unassailable"
  khoảng 1 trên 26 lần và là một trong hai tier cao nhất của Energy Shield
  phần trăm 1 trên 13, so với 1 trên 54 và 1 trên 27 khi không có Fossil. Ở
  phía suffix, Fire Resistance và Energy Shield Recharge Rate cộng lại chiếm
  khoảng 77% weight tự nhiên. Với chính cái suffix chỉ Fossil mới có, dữ liệu
  cho một weight nhưng không cho biết hệ số nhân của Fossil áp lên ra sao,
  nên chúng tôi không đưa ra con số.


  **Giai đoạn 3.** Annulment là một cơ hội ngang nhau giữa prefix tốt nhất và
  prefix tệ nhất của bạn, trừ khi bạn xem trước. Exalted Orb có block thêm
  flat Energy Shield hoặc hybrid Stun Recovery khoảng 40% số lần, so với 30%
  khi không block.


  **Giai đoạn 5.** Một Exceptional Ember cho implicit cast speed luôn có tác
  dụng khoảng 1 trên 29 lần, và Ichor cũng cỡ đó cho spell damage. Tất cả
  những con số này là phép tính của chúng tôi từ weight.
steps:
  - title: "Giai đoạn 1: cả hai Fossil, và chỉ đánh giá suffix"
    do: >-
      Biến một Lich's Circlet trắng item level 85 thành Rare. Đặt một
      [[Scorched Fossil]] và một [[Dense Fossil]] vào một
      [[Potent Chaotic Resonator]] rồi dùng nó. Lặp lại tới khi cái helmet có
      **suffix fire và không có suffix nào bạn muốn bỏ**.
    why: >-
      Một Fossil là một lần roll lại toàn bộ, và theo những gì chúng tôi
      biết thì không gì bảo vệ được một phía trước nó, nên suffix chỉ Fossil
      mới có phải đến trước, khi cái helmet chưa đáng gì. Fossil thứ hai có
      mặt để phần còn lại của mỗi kết quả dùng được. "More Defence, no Life"
      biến chín trên mười lần roll prefix thành prefix Energy Shield và loại
      Life Regeneration khỏi suffix. Hai Fossil gộp lại để Fire Resistance
      và Recharge Rate chiếm phần lớn những gì một suffix có thể là.
    check: >-
      Chỉ đọc suffix. Một prefix tốt là phần thưởng thêm bạn giữ lại; một
      prefix tệ là việc của các giai đoạn 2 tới 4.
    fail: >-
      Không có suffix fire: cặp Fossil kế tiếp. Có suffix fire kèm một
      suffix thứ ba bạn không ưa: roll tiếp. Gỡ một suffix về sau sẽ đặt
      suffix Fossil vào thế rủi ro, và đó là thứ duy nhất trên cái helmet
      này bạn không mua lại được với giá rẻ.
    state:
      prefixes:
        - { text: "96% increased Energy Shield", how: fossil }
        - { text: "+18 to maximum Energy Shield / +21 to maximum Mana", how: fossil }
      suffixes:
        - { text: "Enemies within 6 metres have -9% to Fire Resistance", how: fossil }
        - { text: "+47% to Fire Resistance", how: fossil }
        - { text: "37% increased Energy Shield Recharge Rate", how: fossil }
  - title: "Giai đoạn 2: để Searing Exarch là implicit mạnh hơn"
    do: >-
      Dùng một [[Greater Eldritch Ember]] lên cái helmet. Chưa thêm Ichor
      nào, hoặc không thêm cái nào trên bậc Lesser.
    why: >-
      Chừng nào implicit Exarch còn ở bậc cao hơn, một Eldritch Chaos Orb
      roll lại prefix, một Eldritch Exalted Orb thêm một prefix và một
      Eldritch Orb of Annulment gỡ một prefix. Không cái nào đụng được tới
      suffix. Đó là lớp bảo vệ cho trọn hai giai đoạn kế tiếp, và nó tốn một
      Ember thay vì 4 Divine Orb và 4 Blessed Orb mỗi lần.
    check: >-
      Ember roll ra implicit nào không quan trọng; nó sẽ bị thay ở giai đoạn
      5. Bậc của nó mới là thứ đáng kể. Hãy kiểm lại trước mỗi Eldritch orb
      bạn dùng: ngày nào Eater mạnh hơn, cũng những orb đó sẽ tác động lên
      suffix.
    state:
      implicits: ["9% increased Cast Speed"]
      prefixes:
        - { text: "96% increased Energy Shield", how: fossil }
        - { text: "+18 to maximum Energy Shield / +21 to maximum Mana", how: fossil }
      suffixes:
        - { text: "Enemies within 6 metres have -9% to Fire Resistance", how: fossil }
        - { text: "+47% to Fire Resistance", how: fossil }
        - { text: "37% increased Energy Shield Recharge Rate", how: fossil }
  - title: "Giai đoạn 3: quyết định prefix yếu đáng bao nhiêu, rồi gỡ nó hoặc không"
    do: >-
      Prefix thứ hai thêm 16–25 Energy Shield trong khi Tier 1 của prefix
      flat thêm 50–61, và nó chiếm cái group mà hybrid của bench cần. Để gỡ
      nó, dùng một [[Eldritch Orb of Annulment]]. Nó lấy ngẫu nhiên một
      prefix: với hai prefix, đó là một cơ hội ngang nhau trúng nhầm cái.
      Hãy dùng một [[Hinekora's Lock]] lên cái helmet trước, rê Annulment
      lên, và chỉ bấm nếu nó hiện ra prefix yếu là cái bị gỡ.
    why: >-
      Đây là cú bấm duy nhất trong lần craft có thể xóa mất vận may của giai
      đoạn 1, và Lock tồn tại đúng cho việc đó: nó cho thấy kết quả của
      currency kế tiếp trước khi bạn quyết. Nếu bản xem trước là nhầm prefix
      thì đừng dùng orb. Bất kỳ thay đổi nào khác trên cái helmet, chẳng hạn
      thêm rồi gỡ một modifier bench, sẽ kết thúc khả năng thấy trước đó, và
      bạn cần một Lock mới cho lần xem kế tiếp.
    check: >-
      Còn lại một prefix, "Unassailable", và hai ô trống.
    fail: >-
      Không có Lock, hoặc không muốn trả tiền cho một cái: giữ prefix yếu và
      đi thẳng tới Exalted Orb ở giai đoạn 4 mà không block. Bạn kết thúc
      với một cái helmet kém hơn một chút và không có cơ hội nào làm hỏng nó.
      Đó là một quyết định đáng trọng, và phần lớn mọi người nên chọn vậy.
    state:
      implicits: ["9% increased Cast Speed"]
      prefixes:
        - { text: "96% increased Energy Shield", how: fossil }
      suffixes:
        - { text: "Enemies within 6 metres have -9% to Fire Resistance", how: fossil }
        - { text: "+47% to Fire Resistance", how: fossil }
        - { text: "37% increased Energy Shield Recharge Rate", how: fossil }
  - title: "Giai đoạn 4: block mana, rồi thêm một prefix"
    do: >-
      Ở [[Crafting Bench]], craft **+45–54 to maximum Mana** (2
      [[Chaos Orb]]) vào một trong hai prefix trống. Rồi dùng một
      [[Eldritch Exalted Orb]].
    why: >-
      Trên helmet Energy Shield, mana là prefix hay gặp nhất, 22% pool. Một
      modifier bench loại cả group của nó khỏi cuộc xổ số chừng nào nó còn
      nằm đó, nên Exalted Orb không roll ra mana được. Hãy đếm những gì còn
      lại khi group phần trăm và mana đã ra ngoài: flat Energy Shield và
      hybrid Stun Recovery là 14,000 trên 35,275, khoảng 40%. Không block
      thì chúng là 14,000 trên 47,275, khoảng 30%. Hai Chaos Orb đã mua thêm
      một phần ba cơ hội cho một orb đắt hơn hai Chaos rất nhiều.
    check: >-
      Block chỉ có tác dụng vì **hai** ô prefix đang trống: một cho block,
      một để orb lấp. Chỉ có một ô trống thì không còn gì để block.
    fail: >-
      Orb thêm maximum Life hoặc một trong các hybrid nhỏ. Với build thuần
      Energy Shield, đó là trượt. Hãy gỡ mana bench trước, để Annulment kế
      tiếp chọn giữa hai prefix chứ không phải ba, rồi lặp lại giai đoạn 3
      trên prefix mới và giai đoạn 4 lần nữa.
    state:
      implicits: ["9% increased Cast Speed"]
      prefixes:
        - { text: "96% increased Energy Shield", how: fossil }
        - { text: "+49 to maximum Mana", how: crafted }
        - { text: "+57 to maximum Energy Shield", how: eldritch }
      suffixes:
        - { text: "Enemies within 6 metres have -9% to Fire Resistance", how: fossil }
        - { text: "+47% to Fire Resistance", how: fossil }
        - { text: "37% increased Energy Shield Recharge Rate", how: fossil }
  - title: "Đổi block lấy modifier bạn muốn"
    do: >-
      Gỡ mana crafted ở bench (1 [[Orb of Scouring]]). Craft **18–21%
      increased Energy Shield, +14 to 16 maximum Life** giá 2 Chaos Orb vào
      chỗ của nó.
    why: >-
      Block đã xong việc và giờ là một ô phí. Energy Shield phần trăm thuần
      của bench sẽ bị từ chối, vì "Unassailable" cùng group. Hybrid kèm life
      là một group khác, chính cái mà prefix yếu đã ngồi trong đó trước giai
      đoạn 3.
    state:
      implicits: ["9% increased Cast Speed"]
      prefixes:
        - { text: "96% increased Energy Shield", how: fossil }
        - { text: "+57 to maximum Energy Shield", how: eldritch }
        - { text: "20% increased Energy Shield / +15 to maximum Life", how: crafted }
      suffixes:
        - { text: "Enemies within 6 metres have -9% to Fire Resistance", how: fossil }
        - { text: "+47% to Fire Resistance", how: fossil }
        - { text: "37% increased Energy Shield Recharge Rate", how: fossil }
  - title: "Giai đoạn 5: các implicit bạn giữ"
    do: >-
      Dùng [[Exceptional Eldritch Ember]] tới khi implicit Exarch là
      increased Cast Speed, 11% ở bậc đó. Rồi
      [[Exceptional Eldritch Ichor]] tới khi implicit Eater là increased
      Spell Damage, 23–25%.
    why: >-
      Một Ember chỉ thay implicit Exarch và một Ichor chỉ thay implicit
      Eater, nên mỗi cái thử lại được không giới hạn và không chạm vào sáu ô.
      Chúng đi sau cùng vì sẽ không còn Eldritch orb nào được dùng nữa, và
      chuyện implicit nào mạnh hơn đã hết quan trọng.
    check: >-
      Mỗi implicit còn roll ra ở một dạng mạnh hơn chỉ có tác dụng khi một
      enemy Unique ở gần bạn, và một dạng mạnh hơn nữa cho các pinnacle boss
      của Atlas. Cast speed là 15% và 19% ở các dạng đó tại bậc Exceptional.
      Hãy lấy một trong số đó nếu boss là thứ cái helmet này sinh ra để đánh.
    state:
      implicits: ["11% increased Cast Speed", "24% increased Spell Damage"]
      prefixes:
        - { text: "96% increased Energy Shield", how: fossil }
        - { text: "+57 to maximum Energy Shield", how: eldritch }
        - { text: "20% increased Energy Shield / +15 to maximum Life", how: crafted }
      suffixes:
        - { text: "Enemies within 6 metres have -9% to Fire Resistance", how: fossil }
        - { text: "+47% to Fire Resistance", how: fossil }
        - { text: "37% increased Energy Shield Recharge Rate", how: fossil }
  - title: "Hoàn thiện: quality, con số roll của base, các chỉ số"
    do: >-
      20% quality và socket nếu chưa làm. Một [[Sacred Orb]] nếu base roll
      thấp trong khoảng 117–134 của nó. Một [[Divine Orb]] chỉ khi
      "Unassailable" nằm gần 92.
    why: >-
      Ba modifier local và quality nhân con số của base lên, nên con số roll
      của nó ở đây đáng giá hơn trên gần như mọi item khác. Một Divine Orb
      roll lại mọi chỉ số explicit cùng lúc và có thể hạ xuống cũng như nâng
      lên.
variations: >-
  **Roll lại cả phía prefix thay vào đó.** Nếu giai đoạn 1 không để lại
  prefix nào đáng giữ, hãy dùng [[Eldritch Chaos Orb]] dưới cùng cái Greater
  Ember đó. Mỗi cái roll lại mọi prefix theo weight tự nhiên, nơi
  "Unassailable" là 1 trên 54 lần roll prefix. Nó là công cụ đúng cho "thứ gì
  tử tế cũng được" và là công cụ sai cho một tier cao nhất cụ thể.


  **Một Orb of Conflict ở cuối.** Nó nâng một Eldritch implicit lên một bậc
  và hạ cái kia xuống, không đoán trước được. Dữ liệu chứa hai bậc trên
  Exceptional, những bậc mà không Ember hay Ichor nào cho trực tiếp. Đó là
  một ván cược trên item đã hoàn thiện; chúng tôi không có xác suất cho nó.


  **Đường influence.** Một cái circlet Warlord roll ra cùng suffix fire đó mà
  không cần Fossil. Nó không thể có implicit nào trong hai cái, nên nó bỏ
  mất cast speed và spell damage mà kế hoạch này kết thúc bằng chúng.
mistakes:
  - "Dùng một Fossil sau giai đoạn 1. Chúng tôi chưa xác nhận được rằng có thứ gì bảo vệ một phía trước một lần roll lại bằng Fossil trong 3.30; hãy coi như không có gì."
  - "Thêm một Ichor mạnh quá sớm. Nó khiến Eater thành implicit mạnh hơn, và Eldritch orb kế tiếp tác động lên suffix."
  - "Dùng Eldritch Annulment khi có ba prefix để xem chuyện gì xảy ra. Gỡ modifier bench trước, và xem trước khi bấm."
  - "Để block mana lại trên cái helmet đã hoàn thiện."
  - "Bench Energy Shield phần trăm thuần cạnh \"Unassailable\". Cùng group; bench từ chối."
