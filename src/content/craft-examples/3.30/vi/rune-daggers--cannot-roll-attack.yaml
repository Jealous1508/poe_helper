category: rune-daggers
title: "Một Exalted Orb không thể roll ra modifier attack"
level: 4
summary: "Một cây dagger tốt còn prefix trống. Một modifier bench lấp phía suffix và loại mọi modifier attack khỏi lượt rút, nên Exalted Orb buộc phải thêm một prefix, và hai trên ba lần đó là prefix caster."
goal: >-
  Thêm một prefix vào cây dagger caster đã có Spell Damage, cast speed và
  Spell Critical Strike Chance, mà không roll lại cái nào trong số đó. Công
  cụ là meta-modifier **"Cannot roll Attack Modifiers"**, và lần craft này
  xoay quanh việc dùng nó đúng như 3.30 định nghĩa: nó ngăn modifier attack
  được **thêm** vào. Nó không còn bảo vệ thứ gì khỏi bị gỡ.
base: "Platinum Kris"
itemLevel: 84
baseWhy: >-
  Lần craft này bắt đầu từ một item: một cây rune dagger Rare đáng giữ, chẳng
  hạn một kết quả của ví dụ Aetheric Fossil ra với một prefix. Item level
  quyết định Exalted Orb roll được tier nào; ở 84 mọi tier đều mở. Yêu cầu
  quan trọng là số ô ở bước 1.
methods: [meta, currency, bench]
result:
  implicits: ["63% increased Global Critical Strike Chance"]
  prefixes:
    - { text: "78% increased Spell Damage" }
    - { text: "Adds 52 to 99 Fire Damage to Spells" }
  suffixes:
    - { text: "27% increased Cast Speed" }
    - { text: "86% increased Spell Critical Strike Chance" }
    - { text: "+26% to Global Critical Strike Multiplier", how: crafted }
needs:
  - { item: "[[Divine Orb]]", amount: "1", note: "meta-modifier" }
  - { item: "[[Exalted Orb]]", amount: "1–2" }
  - { item: "[[Orb of Scouring]]", amount: "1", note: "để gỡ meta-modifier" }
  - { item: "[[Chaos Orb]]", amount: "4", note: "craft bench cuối cùng" }
cost: >-
  Một [[Divine Orb]] cho meta-modifier và một [[Exalted Orb]] cho mỗi prefix
  được thêm. Không gì đang có trên dagger bị đem ra đánh cược: mọi bước ở đây
  đều thêm, không bước nào roll lại. Vì thế có thể làm việc này với một item
  bạn không dám reforge.
odds: >-
  Khi dagger đã có Spell Damage và phía suffix đã đầy, theo phép tính của
  chúng tôi từ weight ở item level 84:


  **Không có meta-modifier**, prefix của một Exalted Orb là modifier attack
  59% số lần, maximum Mana 13%, và modifier caster 27%.


  **Có nó**, modifier attack không thể được thêm: added damage cho spell 54%,
  maximum Mana 33%, hybrid Spell Damage với Mana 10%, một gem level 4%. Hai
  trên ba lần là modifier caster.


  Orb **thứ hai** là một lượt rút khác; bước 4 có các con số.
steps:
  - title: "Đếm ô; kế hoạch phụ thuộc vào chúng"
    do: >-
      Dagger cần **đúng một suffix trống** và **ít nhất một prefix trống**.
      Ghi lại những group prefix nào đã bị chiếm.
    why: >-
      "Cannot roll Attack Modifiers" là một suffix. Craft vào ô suffix trống
      cuối cùng, nó làm hai việc: nó lọc lượt rút, và nó lấp đầy phía đó, để
      Exalted Orb không còn chỗ nào thêm ngoài prefix. Với hai suffix trống,
      orb vẫn có thể thêm một suffix.
    fail: >-
      Hai suffix trống: sau lần craft vẫn còn một ô trống, và orb có thể thêm
      một suffix. Khi attack speed, Accuracy và crit của attack đã bị loại
      thì đó không phải thảm họa, nhưng nó không phải cái prefix bị ép buộc
      mà kế hoạch này muốn. Không có suffix trống: không có chỗ cho
      meta-modifier. Đừng mở một ô bằng Annulment; xem bước cuối.
    state:
      implicits: ["63% increased Global Critical Strike Chance"]
      prefixes:
        - { text: "78% increased Spell Damage" }
      suffixes:
        - { text: "27% increased Cast Speed" }
        - { text: "86% increased Spell Critical Strike Chance" }
  - title: "Craft meta-modifier"
    do: >-
      Ở [[Crafting Bench]], craft **Cannot roll Attack Modifiers** giá 1
      [[Divine Orb]].
    why: >-
      Trên rune dagger, 54% weight prefix mang tag attack: added Fire, Cold
      và Lightning Damage cho attack, cả hai prefix phần trăm physical, flat
      Physical Damage và vài cái nữa. Chừng nào modifier này còn trên item,
      không cái nào trong số đó có thể được thêm.
    state:
      implicits: ["63% increased Global Critical Strike Chance"]
      prefixes:
        - { text: "78% increased Spell Damage" }
      suffixes:
        - { text: "27% increased Cast Speed" }
        - { text: "86% increased Spell Critical Strike Chance" }
        - { text: "Cannot roll Attack Modifiers", how: crafted }
  - title: "Exalted Orb"
    do: >-
      Dùng một [[Exalted Orb]].
    why: >-
      Nó "augments a rare item with a new random modifier". Phía suffix đã
      đầy, nên modifier đó là một prefix. Group Spell Damage đã bị chiếm,
      modifier attack đã bị loại, và thứ còn lại là added damage cho spell,
      maximum Mana, hybrid Mana và các gem level.
    check: >-
      Đọc prefix mới và group của nó trước khi quyết định bất cứ điều gì
      khác.
    state:
      implicits: ["63% increased Global Critical Strike Chance"]
      prefixes:
        - { text: "78% increased Spell Damage" }
        - { text: "Adds 52 to 99 Fire Damage to Spells" }
      suffixes:
        - { text: "27% increased Cast Speed" }
        - { text: "86% increased Spell Critical Strike Chance" }
        - { text: "Cannot roll Attack Modifiers", how: crafted }
  - title: "Đếm lại trước orb thứ hai"
    do: >-
      Vẫn còn một prefix trống. Hãy tính xem **lúc này**, khi thêm một group
      nữa đã bị chiếm, Exalted Orb thứ hai thêm được gì, rồi mới dùng nó.
    why: >-
      Orb đầu tiên rơi vào added damage cho spell, kết quả dễ xảy ra nhất, và
      điều đó loại cả ba element của nó khỏi lượt rút: chúng là một group.
      Thứ còn lại là maximum Mana ở mức 70%, hybrid ở mức 22%, và một gem
      level ở mức 8%. Cũng cái orb vừa là một ván cược tốt lúc nãy giờ chủ
      yếu là một prefix Mana. Nếu Mana có ích cho build thì làm tiếp. Nếu
      không, dừng ở đây.
    check: >-
      Luật cần nhớ: mỗi modifier bạn thêm đều thay đổi pool cho cái kế tiếp.
      Lần nào cũng phải tính lại.
  - title: "Đổi meta-modifier lấy một suffix thật"
    do: >-
      Ở bench, gỡ modifier crafted (1 [[Orb of Scouring]]) rồi craft
      **+25–28% to Global Critical Strike Multiplier** (4
      [[Chaos Orb]]).
    why: >-
      Meta-modifier không cho nhân vật thứ gì. Ô của nó trả lại cho bench, để
      lấy cái suffix duy nhất mà caster crit không kiếm được từ các công cụ
      nhắm vào caster.
    fail: >-
      Nếu Exalted Orb cho thứ bạn muốn gỡ đi thì không có cách nào an toàn.
      Một [[Orb of Annulment]] gỡ ngẫu nhiên một modifier, và từ 3.30 cả
      "Cannot roll Attack Modifiers" lẫn "Cannot roll Caster Modifiers" đều
      không thu hẹp lựa chọn của nó: trên cây dagger này, nó dễ trúng một
      trong những modifier bạn đang giữ hơn là cái bạn muốn bỏ. Cứ để prefix
      đó ở yên chỗ của nó.
    state:
      implicits: ["63% increased Global Critical Strike Chance"]
      prefixes:
        - { text: "78% increased Spell Damage" }
        - { text: "Adds 52 to 99 Fire Damage to Spells" }
      suffixes:
        - { text: "27% increased Cast Speed" }
        - { text: "86% increased Spell Critical Strike Chance" }
        - { text: "+26% to Global Critical Strike Multiplier", how: crafted }
variations: >-
  **Vì sao không reforge.** Một reforge Caster hay một Fossil cũng giữ
  modifier attack ở ngoài, nhưng sẽ roll lại ba modifier mà vì chúng cây
  dagger này được giữ. Meta-modifier là công cụ để thêm vào một item, không
  phải để làm lại item.


  **Rốt cuộc vẫn dùng reforge.** Trên cây dagger bạn thật sự muốn làm lại,
  cùng meta-modifier đó với một reforge Caster của Harvest (75 Primal
  Lifeforce) roll ra cả một item không có modifier attack; từ 3.27 reforge
  đó tôn trọng nó. Meta-modifier bị reforge tiêu mất, nên đó là một Divine
  Orb mỗi lần thử.


  **Bản dùng beast.** "Thêm một prefix, gỡ một suffix ngẫu nhiên"
  ([[Farric Wolf Alpha]]) cũng thêm một prefix, và gỡ một suffix làm cái giá
  phải trả. Trên cây dagger này, suffix nào cũng là thứ bạn muốn.
mistakes:
  - "Craft meta-modifier khi còn hai ô suffix trống rồi nhận về một suffix từ orb."
  - "Dùng Exalted Orb thứ hai mà không đếm lại pool."
  - "Để \"Cannot roll Attack Modifiers\" lại trên item đã hoàn thiện. Nó chiếm ô của bench và một suffix."
  - "Làm theo một hướng dẫn cũ, craft \"Cannot roll Caster Modifiers\" để Annulment được an toàn. Cách đó đã hết tác dụng từ 3.30."
verified: "2026-11-19"
