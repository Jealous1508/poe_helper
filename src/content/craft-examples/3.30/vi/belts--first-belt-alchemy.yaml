category: belts
title: "Belt đầu tiên bằng một Orb of Alchemy"
level: 1
summary: "Trên phần lớn item, roll mọi thứ cùng lúc là phí. Danh sách modifier của belt đủ ngắn để cách đó được việc: Alchemy, đọc, lặp lại một hai lần, rồi bench khoảng trống."
goal: >-
  Một chiếc belt có Life và hai resistance cho nửa sau campaign, làm xong
  trong vài cú click. Bài học là **khi nào roll cả một item là một ván cược
  sòng phẳng**. Nó sòng phẳng khi pool nhỏ và phần lớn pool đều hữu ích, và
  belt là loại trang bị duy nhất mà điều đó đúng.
base: "Leather Belt"
itemLevel: 40
baseWhy: >-
  Leather Belt có implicit là +25–40 maximum Life và rơi từ level 10, nên một
  Life roll ra bên dưới cho belt hai lần Life. Item level 36 trở lên mở Life
  85–99. Dùng bất kỳ Leather Belt trắng nào ngang tầm level của bạn; Heavy
  Belt là lựa chọn thay thế cho nhân vật thiếu Strength.
methods: [currency, bench]
result:
  implicits: ["+32 to maximum Life"]
  prefixes:
    - { text: "+62 to maximum Life" }
    - { text: "+38 to maximum Mana" }
  suffixes:
    - { text: "+27% to Cold Resistance" }
    - { text: "+25 to Strength" }
    - { text: "+25% to Fire Resistance", how: crafted }
needs:
  - { item: "[[Orb of Alchemy]]", amount: "2–4", note: "một cái trong đó cho bench" }
  - { item: "[[Orb of Scouring]]", amount: "1–3", note: "hoặc một Chaos Orb thay cho một Scouring và một Alchemy" }
cost: >-
  Vài [[Orb of Alchemy]] và [[Orb of Scouring]]. Từ 3.30, Orb of Alchemy phổ
  biến hơn trước, và chính điều đó khiến đây là lần craft của ngày thứ hai
  chứ không phải một thứ xa xỉ.
odds: >-
  Ở item level 40, một trên bốn lần roll prefix là maximum Life, theo phép
  tính của chúng tôi từ weight của modifier, và hơn một trên ba lần roll
  suffix là một elemental resistance. Một chiếc belt Rare có một tới ba
  prefix, nên đâu đó từ một phần tư tới sáu trên mười chiếc có Life, tùy số
  prefix roll ra. Tính trung bình thì chiếc belt thứ hai hoặc thứ ba là chiếc
  đáng giữ.


  So với một chiếc amulet cùng level: ở đó Life là khoảng một trên sáu lần
  roll prefix, còn một suffix mong muốn thì hiếm hơn nhiều. Chênh lệch đó là
  toàn bộ lý lẽ để làm theo cách này trên belt mà không phải ở chỗ khác.
steps:
  - title: "Orb of Alchemy"
    do: >-
      Dùng một [[Orb of Alchemy]] lên chiếc belt trắng.
    why: >-
      Nó biến belt thành Rare với bốn tới sáu modifier ngẫu nhiên chỉ trong
      một cú click. Trên belt chỉ có chín kiểu prefix và mười hai kiểu suffix
      để rút. Life là cái được muốn nhất trong chín cái và là một trên bốn
      lần roll; ba resistance và Strength là bốn trong mười hai cái.
    state:
      implicits: ["+32 to maximum Life"]
      prefixes:
        - { text: "+41 to maximum Mana" }
        - { text: "+17 to maximum Energy Shield" }
      suffixes:
        - { text: "18% increased Stun and Block Recovery" }
        - { text: "23% increased Stun Duration on Enemies" }
  - title: "Đọc nó bằng ba câu hỏi"
    do: >-
      Giữ Alt. **Có prefix Life không? Có ít nhất một resistance không?
      Có ô suffix nào còn trống cho bench không?**
    why: >-
      Life là modifier bench thay thế kém nhất, nên nó phải được roll ra. Một
      resistance có thể roll ra và cái thứ hai thì mua. Chiếc belt ở trên trả
      lời không, không và có: prefix là Mana và Energy Shield, suffix là hai
      modifier stun. Đó là một lần trượt.
    check: >-
      Hai câu trả lời có, trong đó có câu đầu, là đủ để giữ belt. Ở level này
      đừng chờ một chiếc hoàn hảo.
    fail: >-
      Không có Life: sang bước kế. Có Life nhưng ba suffix là đồ lấp chỗ:
      cũng là trượt, vì bench không còn chỗ.
  - title: "Xóa sạch rồi roll lại"
    do: >-
      Dùng một [[Orb of Scouring]] để đưa belt về Normal, rồi thêm một
      [[Orb of Alchemy]]. Một [[Chaos Orb]] duy nhất làm cả hai việc cùng lúc
      nếu bạn thà tiêu thứ đó hơn.
    why: >-
      Mỗi lần thử là độc lập. Trên một chiếc belt trượt không có gì đáng bảo
      vệ, nên chẳng có lý do gì để làm điều gì khôn khéo hơn là làm lại từ
      đầu.
    state:
      implicits: ["+32 to maximum Life"]
      prefixes:
        - { text: "+62 to maximum Life" }
        - { text: "+38 to maximum Mana" }
      suffixes:
        - { text: "+27% to Cold Resistance" }
        - { text: "+25 to Strength" }
  - title: "Bench resistance thứ hai"
    do: >-
      Ở [[Crafting Bench]], craft elemental resistance mà bạn đang thấp nhất:
      21–28% giá 1 [[Orb of Alchemy]], hoặc 16–20% giá 1 Orb of
      Transmutation.
    why: >-
      Belt có Life, một resistance và một suffix trống. Bench lấp suffix
      trống đó một cách chắc chắn. Nó không lặp lại được element mà belt đã
      roll ra, vì đó là một group, nên hãy chọn element khác.
    state:
      implicits: ["+32 to maximum Life"]
      prefixes:
        - { text: "+62 to maximum Life" }
        - { text: "+38 to maximum Mana" }
      suffixes:
        - { text: "+27% to Cold Resistance" }
        - { text: "+25 to Strength" }
        - { text: "+25% to Fire Resistance", how: crafted }
  - title: "Biết khi nào thôi dùng phương pháp này"
    do: >-
      Dùng nó suốt campaign và sang những map đầu tiên. Dừng khi bạn bắt đầu
      quan tâm tới **tier** của Life roll ra.
    why: >-
      Một lần roll Alchemy cho Life ở một tier ngẫu nhiên trong số mọi tier
      item level cho phép. Một khi bạn muốn tier cao nhất, roll sáu modifier
      mỗi lần là cách chậm để tìm nó, còn roll hai modifier như ví dụ kế tiếp
      là cách nhanh.
variations: >-
  **Không có Orb of Scouring.** Giữ chiếc belt trượt và dùng Alchemy lên
  chiếc belt trắng kế tiếp bạn nhặt được. Ở level này base không tốn gì.


  **Đã là Rare sẵn.** Một chiếc belt Rare nhặt dưới đất cũng là thứ đó, chỉ
  là bước đầu đã được làm giúp bạn. Hãy đọc nó bằng cùng ba câu hỏi.


  **Với một Essence bậc thấp.** Một Weeping hoặc Wailing Essence of Anger,
  Hatred hay Wrath dùng lên chiếc belt trắng biến nó thành Rare với
  resistance đó được đảm bảo. Belt là món trang sức duy nhất mà các Essence
  đó cho resistance. Các bậc yếu chỉ dùng được trên item Normal và ghìm các
  modifier khác ở level 60 hoặc 75 trở xuống.
mistakes:
  - "Dùng phương pháp này trên amulet hay weapon vì nó đã được việc trên belt. Danh sách của chúng dài gấp hai và gấp ba."
  - "Giữ một chiếc belt không có Life vì suffix tốt. Resistance mua được ở bench; một Life roll ra thì không."
  - "Craft trước khi đọc. Một chiếc belt có ba suffix không nhận được resistance của bench."
