category: one-hand-axes
title: "Suffix trước, rồi một prefix physical do bạn chọn"
level: 4
summary: "Cố định attack speed bằng một Essence, khóa suffix, rồi để một Veiled Chaos Orb đặt một veiled modifier lên phía prefix. Một lần block ở bench khiến unveil đưa ra một prefix phần trăm physical."
goal: >-
  Một cây axe có các suffix đáng giữ và một prefix 120–139% increased
  Physical Damage được đảm bảo, cái phần trăm mà axe gần như không bao giờ tự
  roll ra. Ba ý gặp nhau ở đây: một modifier **được Essence cố định**, một
  **modifier bảo vệ** cùng những gì nó bảo vệ và không bảo vệ, và một **lần
  unveil bị block**. Thứ tự chính là toàn bộ lần craft. Làm theo bất kỳ thứ
  tự nào khác, bước này sẽ phá bước kia.
base: "Infernal Axe"
itemLevel: 78
baseWhy: >-
  51–85 với 1.3 attack mỗi giây: cây đánh đau nhất trong các axe ở tốc độ đó,
  88 damage mỗi giây. Item level 78 cho phép Tier 1 của attack speed và Tier
  1 của Critical Strike Multiplier; các modifier unveil ra chỉ cần item level
  60. Không gì trong lần craft này với tới một tier cần 83.
methods: [essence, meta, veiled, bench]
result:
  prefixes:
    - { text: "131% increased Physical Damage / 23% chance to cause Bleeding on Hit", how: veiled }
    - { text: "Adds 51 to 90 Cold Damage" }
    - { text: "Adds 15 to 28 Physical Damage", how: crafted }
  suffixes:
    - { text: "27% increased Attack Speed", how: essence }
    - { text: "+32% to Global Critical Strike Multiplier" }
needs:
  - { item: "[[Shrieking Essence of Zeal]]", amount: "20–40", note: "Deafening cho 28–30%" }
  - { item: "[[Divine Orb]]", amount: "4 mỗi lần thử" }
  - { item: "[[Sacred Orb]]", amount: "1 mỗi lần thử" }
  - { item: "[[Veiled Chaos Orb]]", amount: "1 mỗi lần thử" }
  - { item: "[[Orb of Alteration]]", amount: "4", note: "cho block" }
  - { item: "[[Orb of Scouring]]", amount: "1", note: "để gỡ block" }
  - { item: "[[Chaos Orb]]", amount: "4", note: "cho craft bench cuối cùng" }
cost: >-
  Hai khoản, trong hai giai đoạn. Trước hết là Essence, cần bao nhiêu thì
  dùng bấy nhiêu để có một suffix tốt thứ hai. Rồi tới khóa, 4 [[Divine Orb]]
  và 1 [[Sacred Orb]] trên weapon trong 3.30, cộng một [[Veiled Chaos Orb]],
  cho mỗi lần thử ở phía prefix.


  Khóa đặt ra phép thử. Nếu các suffix này có thể roll lại với giá thấp hơn
  một lần khóa thì chúng không đáng khóa: hãy dùng Veiled Chaos Orb lên cây
  axe trần và ra gì nhận nấy.
odds: >-
  **Giai đoạn 1.** Attack speed của Essence là chắc chắn. Một suffix thứ hai
  đáng khóa thì không: khi attack speed đã có trên item, Critical Strike
  Multiplier từ 30% trở lên là khoảng 1 trên 27 lần roll suffix theo phép
  tính của chúng tôi. Một kết quả có tối đa hai suffix khác, nên hãy tính vài
  chục Essence, hoặc hạ mức xuống.


  **Giai đoạn 2.** Trên axe, một veiled modifier có thể hóa thành mười ba
  prefix khác nhau, và bốn trong số đó là prefix phần trăm physical kèm
  chance to Bleed, Impale, Poison hoặc Blind. Bảy cái khác chung một group.
  Khi group đó bị block, còn lại sáu và bốn trong đó là những cái bạn muốn,
  nên ba lựa chọn khác nhau buộc phải có ít nhất một cái. Điều đó dựa trên
  hai thứ người chơi đã thử nghiệm còn nhà phát triển thì chưa tuyên bố: rằng
  một group đã có trên item thì không bao giờ được đưa ra, và rằng ba lựa
  chọn là khác nhau. Không có block, và nếu các lựa chọn được bốc đều nhau,
  điều mà dữ liệu không cho chúng tôi biết, thì một prefix phần trăm physical
  xuất hiện khoảng 7 trên 10 lần.
steps:
  - title: "Giai đoạn 1: Essence of Zeal tới khi phía suffix đáng một lần khóa"
    do: >-
      Trên một cây Infernal Axe trắng có 20% quality, dùng
      [[Shrieking Essence of Zeal]] liên tục. Dừng khi suffix là attack speed
      **cộng thêm một suffix bạn sẵn lòng trả tiền để giữ**, và cây axe có
      **nhiều nhất hai prefix**. Với build crit, suffix thứ hai đó là
      Critical Strike Multiplier hoặc Critical Strike Chance từ 30% trở lên.
    why: >-
      Shrieking Zeal cho 26–27% attack speed, bằng Tier 1 tự nhiên, ở mọi lần
      dùng. Mọi việc liên quan tới Essence phải xảy ra ngay bây giờ, vì theo
      thử nghiệm của cộng đồng, Essence phớt lờ các modifier bảo vệ: dùng về
      sau, nó sẽ roll lại một phía đã khóa như thể khóa không có ở đó. Kệ các
      prefix; chúng sắp bị thay. Chỉ cần đếm chúng.
    check: >-
      Hai prefix trở xuống. Khóa ở bước kế tự nó là một prefix và cần một ô
      trống.
    fail: >-
      Ba prefix và suffix tốt: thêm một Essence nữa là đường đi tiếp sạch sẽ
      duy nhất, và nó roll lại cả suffix. Đừng dùng [[Orb of Annulment]] để
      mở một ô; khả năng nó gỡ mất suffix bạn đang giữ cũng cao ngang với gỡ
      một prefix.
    state:
      prefixes:
        - { text: "Adds 9 to 158 Lightning Damage" }
        - { text: "Adds 38 to 72 Fire Damage" }
      suffixes:
        - { text: "27% increased Attack Speed", how: essence }
        - { text: "+32% to Global Critical Strike Multiplier" }
  - title: "Craft khóa suffix"
    do: >-
      Ở [[Crafting Bench]], craft **Suffix Modifiers cannot be changed**: 4
      [[Divine Orb]] và 1 [[Sacred Orb]].
    why: >-
      Chừng nào nó còn trên item, một lần roll lại tôn trọng nó sẽ để yên cả
      hai suffix. Hãy dùng khóa đầy đủ, không phải bản rẻ hơn "1 Suffix
      Modifier cannot be changed": với hai suffix trên cây axe, game sẽ chọn
      ngẫu nhiên cái nào được bảo vệ và không cho bạn biết.
    check: >-
      Khóa hiện dưới dạng một prefix crafted. Đừng dùng thứ gì khác lên cây
      axe giữa bước này và bước kế.
    state:
      prefixes:
        - { text: "Adds 9 to 158 Lightning Damage" }
        - { text: "Adds 38 to 72 Fire Damage" }
        - { text: "Suffix Modifiers cannot be changed", how: crafted }
      suffixes:
        - { text: "27% increased Attack Speed", how: essence }
        - { text: "+32% to Global Critical Strike Multiplier" }
  - title: "Veiled Chaos Orb"
    do: >-
      Dùng một [[Veiled Chaos Orb]] lên cây axe.
    why: >-
      Nó reforge một item Rare với các modifier mới, một trong số đó là
      veiled. Khi suffix đã khóa, chỉ phía prefix thay đổi được, nên veiled
      modifier buộc phải là một prefix. Khóa bị tiêu cùng các prefix cũ. Việc
      Veiled Chaos Orb tôn trọng khóa đến từ thử nghiệm của người chơi, không
      phải từ nhà phát triển.
    check: >-
      Cả hai suffix không đổi; một "Veiled Prefix" trên item. Đếm lại prefix
      và đọc những cái roll ra cạnh veil.
    fail: >-
      Nếu increased Physical Damage thuần roll ra cạnh veil, các lựa chọn
      physical sẽ không được đưa ra, vì chúng chung group với nó. Đó không
      phải là mất mát nếu tier của nó tốt: bạn đã có phần trăm theo đường
      khác. Nếu tier kém, hãy khóa rồi dùng thêm một Veiled Chaos Orb; từ
      hotfix ngày 17 tháng 11, nó dùng được trên item đã có sẵn veiled
      modifier.
    state:
      prefixes:
        - { text: "Veiled Prefix" }
        - { text: "Adds 51 to 90 Cold Damage" }
      suffixes:
        - { text: "27% increased Attack Speed", how: essence }
        - { text: "+32% to Global Critical Strike Multiplier" }
  - title: "Block trước khi unveil"
    do: >-
      Nếu còn một ô prefix trống, craft **25–34% increased Fire Damage** ở
      bench giá 4 [[Orb of Alteration]]. Khoan unveil.
    why: >-
      Craft đó vô dụng với build và thuộc về group mà bảy trong mười ba kết
      quả unveil có thể có dùng chung: các modifier phần trăm cho spell,
      minion, chaos và damage của từng element riêng. Theo luật mà người chơi
      đã thử nghiệm, một group đã có trên item thì không được đưa ra. Một
      craft rẻ gỡ bảy đáp án sai và để lại sáu, bốn trong đó là prefix phần
      trăm physical.
    fail: >-
      Ba prefix roll ra, nên không còn ô cho block: unveil không có nó và
      chấp nhận tỉ lệ kém hơn.
    state:
      prefixes:
        - { text: "Veiled Prefix" }
        - { text: "Adds 51 to 90 Cold Damage" }
        - { text: "29% increased Fire Damage", how: crafted }
      suffixes:
        - { text: "27% increased Attack Speed", how: essence }
        - { text: "+32% to Global Critical Strike Multiplier" }
  - title: "Unveil"
    do: >-
      Bấm chuột phải vào cây axe và chọn trong ba lựa chọn. Lấy increased
      Physical Damage kèm chance to cause **Bleeding**, **Impale**,
      **Poison** hoặc **Blind**, tùy build của bạn dùng cái nào. Cả bốn đều
      cho 120–139%.
    why: >-
      Từ đó trở đi modifier unveil ra là một modifier thường, mạnh hơn bản
      của bench (95–105%) và không phải modifier crafted, nên ô bench vẫn là
      của bạn.
    state:
      prefixes:
        - { text: "131% increased Physical Damage / 23% chance to cause Bleeding on Hit", how: veiled }
        - { text: "Adds 51 to 90 Cold Damage" }
        - { text: "29% increased Fire Damage", how: crafted }
      suffixes:
        - { text: "27% increased Attack Speed", how: essence }
        - { text: "+32% to Global Critical Strike Multiplier" }
  - title: "Đổi block lấy flat damage"
    do: >-
      Ở bench, gỡ modifier crafted với giá 1 [[Orb of Scouring]], rồi craft
      **adds 13–17 to 26–30 Physical Damage** giá 4
      [[Chaos Orb]] vào cùng ô đó.
    why: >-
      Block đã xong việc. Flat Physical Damage thuộc group khác với prefix
      phần trăm unveil ra và được nó nhân lên. Prefix cold đi kèm lần roll
      lại thì ở lại: gỡ nó nghĩa là thêm một lần khóa nữa, và trên một cây
      axe của một cặp thì điều đó hiếm khi đáng.
    check: >-
      Dùng mục "Remove Crafted Mods" của chính bench, không phải một Orb of
      Scouring lên item, thứ sẽ lột sạch mọi thứ.
    state:
      prefixes:
        - { text: "131% increased Physical Damage / 23% chance to cause Bleeding on Hit", how: veiled }
        - { text: "Adds 51 to 90 Cold Damage" }
        - { text: "Adds 15 to 28 Physical Damage", how: crafted }
      suffixes:
        - { text: "27% increased Attack Speed", how: essence }
        - { text: "+32% to Global Critical Strike Multiplier" }
variations: >-
  **Không khóa.** Nếu suffix chỉ là attack speed và đồ lấp chỗ, hãy bỏ qua
  giai đoạn 1 và 2: dùng Veiled Chaos Orb lên một cây axe Rare trần, và
  unveil mỗi khi veil rơi vào phía prefix. Bạn mất sự chắc chắn về chỗ veil
  rơi và giữ lại 4 Divine Orb mỗi lần thử.


  **Suffix thứ ba.** Cây axe này kết thúc với một ô suffix trống và ô bench
  đã dùng. Một [[Exalted Orb]] lấp nó ngẫu nhiên. Nếu bạn muốn tự chọn hơn,
  hãy craft flat damage sau cùng và khi đó mới quyết định ô suffix trống hay
  ô prefix trống cần bench hơn.


  **Veiled Chaos Orb từ đâu ra.** Các leader Safehouse có cơ hội rơi chúng,
  và các trang tra cứu liệt kê bench Research của Aisling là nguồn thứ hai.
mistakes:
  - "Dùng Essence sau khi khóa. Theo thử nghiệm của cộng đồng, nó phớt lờ khóa và roll lại các suffix bạn đã trả tiền để bảo vệ."
  - "Unveil trước khi block. Block tốn 4 Alteration và gỡ bảy trong chín kết quả sai."
  - "Gỡ block bằng một Orb of Scouring lên item thay vì ở bench."
  - "Khóa attack speed và hai suffix lấp chỗ. Một Essence of Zeal trả lại attack speed với giá thấp hơn nhiều so với một lần khóa."
  - "Craft bản khóa một suffix rẻ hơn lên cây axe có hai suffix. Nó bảo vệ cái nào là ngẫu nhiên và bị giấu."
